apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rust-service
  labels:
    app: rust-service
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: rust-service
  template:
    metadata:
      labels:
        app: rust-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
