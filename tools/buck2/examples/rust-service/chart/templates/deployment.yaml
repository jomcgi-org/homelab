apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rust-service
  labels:
    app: rust-service
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: rust-service
  template:
    metadata:
      labels:
        app: rust-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: server
          # Digest-pinned when helm_chart(images=...) injects .image.digest;
          # falls back to the tag otherwise (lint/template with default values).
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
