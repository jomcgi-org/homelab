# Tests for no-httproute-rule-without-timeout rule.
# HTTPRoute rules with backendRefs must declare a timeouts section so that
# Envoy's default 15-second timeout does not silently drop long-running
# requests (streaming, uploads, LLM inference, etc.).
#
# The rule uses languages: [generic] (spacegrep) rather than languages: [yaml]
# because real chart templates contain {{ }} Helm directives that break the YAML
# parser. In generic mode the finding is anchored at the `rules:` token, so
# # ruleid: annotations must appear on the line immediately before `rules:`.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-service
spec:
# ruleid: no-httproute-rule-without-timeout
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-service
          port: 8080

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
spec:
# ruleid: no-httproute-rule-without-timeout
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-service
          port: 80
          weight: 100

---
# Helm template syntax test: the rule must fire even when {{ }} directives are
# present (YAML parser would reject this file; generic mode handles it fine).
{{- if .Values.cfIngress.public.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" . }}-public
spec:
# ruleid: no-httproute-rule-without-timeout
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "service.fullname" . }}
          port: {{ .Values.service.port | int }}
{{- end }}

---
# ok: no-httproute-rule-without-timeout — timeouts section present after backendRefs
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-service-with-timeout
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-service
          port: 8080
      timeouts:
        request: 30s

---
# ok: no-httproute-rule-without-timeout — timeout disabled explicitly (0s) for long-running streams
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: streaming-route
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /stream
      backendRefs:
        - name: streaming-service
          port: 8080
      timeouts:
        request: 0s

---
# ok: no-httproute-rule-without-timeout — timeouts section present before backendRefs
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reverse-order-route
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /reverse
      timeouts:
        request: 60s
        backendRequest: 55s
      backendRefs:
        - name: reverse-service
          port: 9090

---
# ok: no-httproute-rule-without-timeout — Helm template with explicit timeouts
{{- if .Values.cfIngress.public.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" . }}-public
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "service.fullname" . }}
          port: {{ .Values.service.port | int }}
      timeouts:
        request: 60s
{{- end }}
