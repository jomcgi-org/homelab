# Tests for require-readiness-probe rule.
# The rule uses languages: [generic] (spacegrep). In generic mode the finding
# is anchored at the `containers:` token, so # ruleid: annotations must appear
# on the line immediately before `containers:`.
---
# ok: container has readinessProbe
apiVersion: v1
kind: Pod
metadata:
  name: ok-pod
spec:
  containers:
    - name: app
      image: myapp:latest
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10

---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod
spec:
# ruleid: require-readiness-probe
  containers:
    - name: app
      image: myapp:latest
      ports:
        - containerPort: 8080
      # no readinessProbe!
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080

---
# Helm template syntax test: the rule must fire even when {{ }} directives are
# present (YAML parser would reject this file; generic mode handles it fine).
{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
spec:
  template:
    spec:
# ruleid: require-readiness-probe
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
{{- end }}

---
# ok: Helm template with readinessProbe present
{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
spec:
  template:
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
{{- end }}
