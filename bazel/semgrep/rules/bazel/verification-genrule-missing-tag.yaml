rules:
  - id: verification-genrule-missing-tag
    languages: [python]
    severity: ERROR
    message: >-
      Suite-shaped genrules must include the verification tag so
      affected-targets.sh can select them even though tests() cannot.
    metadata:
      category: correctness
      confidence: MEDIUM
    paths:
      include:
        - "**/BUILD"
        - "**/BUILD.bazel"
    patterns:
      - pattern-either:
          - pattern: genrule(..., name=$NAME, ...)
          - pattern: native.genrule(..., name=$NAME, ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: '^["'']?(?:tlc_.*|.*_(?:smoke|test))["'']?$'
      - pattern-not: genrule(..., tags=[..., "verification", ...], ...)
      - pattern-not: native.genrule(..., tags=[..., "verification", ...], ...)
