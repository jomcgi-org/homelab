apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trips
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/jomcgi/homelab/charts
    chart: trips
    targetRevision: 0.1.24
    helm:
      releaseName: trips
  destination:
    server: https://kubernetes.default.svc
    namespace: trips
  # garage-init owns credential bytes in the kept claim Secrets.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: trips-trips-public-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: trips-trips-public-mirror-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: trips-postgres
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
