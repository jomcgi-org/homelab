apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.originalsClaim }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.originalsSize }}
