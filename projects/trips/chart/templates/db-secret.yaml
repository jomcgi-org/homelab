apiVersion: v1
kind: Secret
metadata:
  name: trips-postgres
  namespace: trips
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
# factory-db/factory-db-setup writes the connection string (factory-db's
# secret_init.py, LOGINS).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-db-setup
  namespace: trips
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [trips-postgres]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-db-setup
  namespace: trips
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-db-setup
subjects:
  - kind: ServiceAccount
    name: factory-db-setup
    namespace: factory-db
