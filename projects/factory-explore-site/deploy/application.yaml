apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-explore-site
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: ghcr.io/jomcgi/homelab/charts
    chart: factory-explore-site
    targetRevision: 0.38.14
    helm:
      releaseName: factory-explore-site
      valuesObject:
        manageHostname: true
        publishEnabled: true
        workloads:
          factory-explore-deploy:
            image:
              repository: ghcr.io/jomcgi/homelab/projects/factory-explore-site
              digest: sha256:49de52e20b2301f733d7a11c3ebb6d6097eb216b3576e4a15a6dc0ca9201fe11
            command: ["/app/projects/factory-explore-site/withdraw"]
  destination:
    server: https://kubernetes.default.svc
    namespace: factory-explore-site
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
