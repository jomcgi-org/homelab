# frontier: order-of-events authorization (#6760), shape 4. Planted into real
# chat_public code at 130910e75: fork_chat resolves the snapshot on the
# public_reader replica BEFORE awaiting Turnstile (a plausible optimisation, so an
# unknown id never spends a verification) and then forks from that stale object.
# A takedown that commits while siteverify is in flight is undone by the fork.
#
# Sites (each also requires a live fork to work and an unknown id to be rejected
# before verification, the behaviour the planted docstring documents, so an
# over-correction that drops it scores nothing):
#   takedown-during-admission  re-check after the await (any connection)
#   replica-lag                re-check on the primary: the replica can lag the
#                              takedown ("more easily while under load")
# Variants: untouched 0, main's original order (load after the await, on the
# replica, no early reject) 0, re-check on the replica 0.5, gold (re-check on the
# primary) 1.0. Gold 20/20 clean; untouched fails 5/5.
