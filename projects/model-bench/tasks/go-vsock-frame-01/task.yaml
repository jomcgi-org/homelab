id: go-vsock-frame-01
version: v1
class: code-fix
tier: standard
mode: agentic
prompt: |
  frame.go implements the length-prefixed wire framing used over the firecracker vsock
  transport: a 4-byte big-endian payload length, then that many payload bytes. ReadFrame
  reads one frame from an io.Reader.

  It has two problems:
    1. Short reads. The payload is read with a single r.Read(buf), but an io.Reader (and a
       streamed vsock connection in particular) may return fewer than len(buf) bytes per
       call, so a payload delivered in chunks is left partly unfilled and the frame is
       silently truncated. Read the payload in full.
    2. No size guard. n is taken straight off the wire and used to allocate the buffer with
       no bound, so a malformed or hostile peer can drive an unbounded allocation. When the
       declared length exceeds MaxFrame, return an error before allocating or reading the
       payload.

  This package has no go.mod, so `go test` will not run yet. Set up a Go module for it
  (go mod init), fix both problems in frame.go, and make `go test ./...` pass. You have a
  `run` tool for shell commands (go mod init, go test, etc.).
agent:
  max_turns: 30
  exec: true
verifier:
  kind: command
  args:
    write_files:
      frame_test.go: |
        package frame

        import (
        	"bytes"
        	"encoding/binary"
        	"io"
        	"testing"
        )

        // chunkReader returns at most `chunk` bytes per Read, the way a streamed vsock
        // connection delivers a payload in several pieces.
        type chunkReader struct {
        	data  []byte
        	chunk int
        }

        func (c *chunkReader) Read(p []byte) (int, error) {
        	if len(c.data) == 0 {
        		return 0, io.EOF
        	}
        	n := c.chunk
        	if n > len(p) {
        		n = len(p)
        	}
        	if n > len(c.data) {
        		n = len(c.data)
        	}
        	copy(p, c.data[:n])
        	c.data = c.data[n:]
        	return n, nil
        }

        func encodeFrame(payload []byte) []byte {
        	hdr := make([]byte, 4)
        	binary.BigEndian.PutUint32(hdr, uint32(len(payload)))
        	return append(hdr, payload...)
        }

        func TestReadFrameSmall(t *testing.T) {
        	payload := []byte("hello vsock")
        	got, err := ReadFrame(bytes.NewReader(encodeFrame(payload)))
        	if err != nil {
        		t.Fatalf("unexpected error: %v", err)
        	}
        	if !bytes.Equal(got, payload) {
        		t.Fatalf("got %q, want %q", got, payload)
        	}
        }

        func TestReadFrameChunked(t *testing.T) {
        	// A 4000-byte payload delivered 7 bytes at a time forces the payload read to
        	// span many Reads; a single Read would return a truncated frame.
        	payload := bytes.Repeat([]byte("abcd"), 1000)
        	r := &chunkReader{data: encodeFrame(payload), chunk: 7}
        	got, err := ReadFrame(r)
        	if err != nil {
        		t.Fatalf("unexpected error: %v", err)
        	}
        	if !bytes.Equal(got, payload) {
        		t.Fatalf("payload mismatch: a short read left the frame partly unfilled "+
        			"(returned %d bytes, not all equal to the %d sent)", len(got), len(payload))
        	}
        }

        func TestReadFrameRejectsOversized(t *testing.T) {
        	// A length header above MaxFrame must be rejected with an error before the
        	// (bogus) payload is consumed, so a malformed peer cannot drive a huge read.
        	hdr := make([]byte, 4)
        	binary.BigEndian.PutUint32(hdr, uint32(MaxFrame+1))
        	r := bytes.NewReader(append(hdr, 1, 2, 3))
        	if _, err := ReadFrame(r); err == nil {
        		t.Fatal("expected an error for a frame larger than MaxFrame, got nil")
        	}
        }

    cmd: ["go", "test", "./..."]
    timeout_s: 240
