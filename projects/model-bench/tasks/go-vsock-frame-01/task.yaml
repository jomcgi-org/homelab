id: go-vsock-frame-01
version: v1
class: code-fix
# hard: real Go on the firecracker vsock protocol trips ~1 in 5 candidates; a
# differentiator, not a basic-viability floor task.
tier: hard
mode: agentic
source_commit: 019b3ffb829700df0a0cf950e502d3d828147985
snapshot:
  commit: 019b3ffb829700df0a0cf950e502d3d828147985
  paths:
    - projects/firecracker/substrate/vsockproto
  strip_components: 4
  exclude:
    - "*_test.go"
    - "*_test.py"
    - "*.md"
    - "*.yaml"
    - "*.yml"
    - "*.png"
    - "*.jpg"
    - "*.svg"
    - "BUILD"
    - "BUILD.bazel"
    - "*.bzl"
prompt: |
  proto.go is the real vsockproto package from the firecracker substrate: the wire
  contract the in-microVM wrapper (fc-agent-init) speaks to the host controller
  (fc-agentd) over the Firecracker vsock control channel. Messages are
  newline-delimited JSON over any io.ReadWriteCloser, so the same code runs over a
  real vsock connection in the guest and over a pipe in tests.

  Conn is that framed channel. Read how it works:
    - NewConn(rw) wraps an io.ReadWriteCloser with a bufio.Reader and a json.Encoder.
    - Send(m) writes one Message followed by a newline (json.Encoder appends it).
    - Recv() reads the next newline-delimited Message with c.r.ReadBytes('\n').

  Recv has an unbounded-read weakness that is fine on a trusted pipe but risky on a
  hostile channel: bufio.Reader.ReadBytes('\n') grows its buffer without limit, so a
  peer that sends a very long line (or never sends a newline at all) can drive an
  unbounded allocation on the control channel.

  Add a new method to *Conn, alongside Recv:

      func (c *Conn) RecvLimited(max int) (Message, error)

  It reads the next newline-delimited Message exactly like Recv, but caps how many
  bytes it will buffer for one frame at max. Requirements:
    - A normal, in-bounds message decodes and returns just as Recv would.
    - If the line grows past max bytes before its terminating newline, return a
      non-nil error and do NOT attempt to decode the oversized bytes into a Message.
    - A non-positive max (<= 0) means "no limit": RecvLimited(0) is a drop-in Recv,
      returning the full message even when it is large.

  Match the existing style in the file (the vsockproto: error prefix, the same
  Message/decode shape as Recv). Do not change Send, Recv, NewConn, the Message type,
  or any other existing behavior. Only add the new method (plus any small helper it
  needs).

  This package has no go.mod, so `go test` will not run yet. Set up a Go module for it
  (go mod init), add RecvLimited to proto.go, and make `go test ./...` pass. You have a
  `run` tool for shell commands (go mod init, go test, etc.).
agent:
  max_turns: 30
  exec: true
verifier:
  kind: command
  args:
    write_files:
      proto_gold_test.go: |
        package vsockproto

        import (
        	"bytes"
        	"encoding/json"
        	"io"
        	"net"
        	"strings"
        	"testing"
        	"time"
        )

        // TestRecvLimitedAcceptsSmall confirms a normal in-bounds message
        // round-trips through RecvLimited exactly as Recv would.
        func TestRecvLimitedAcceptsSmall(t *testing.T) {
        	guest, host := net.Pipe()
        	gc := NewConn(guest)
        	hc := NewConn(host)

        	go func() {
        		_ = gc.Send(Message{Kind: KindHello, ThreadID: "t1"})
        	}()

        	done := make(chan Message, 1)
        	errc := make(chan error, 1)
        	go func() {
        		m, err := hc.RecvLimited(4096)
        		if err != nil {
        			errc <- err
        			return
        		}
        		done <- m
        	}()

        	select {
        	case m := <-done:
        		if m.Kind != KindHello || m.ThreadID != "t1" {
        			t.Fatalf("unexpected message: %+v", m)
        		}
        	case err := <-errc:
        		t.Fatalf("RecvLimited returned error for in-bounds message: %v", err)
        	case <-time.After(2 * time.Second):
        		t.Fatal("timed out waiting for message")
        	}
        }

        // TestRecvLimitedRejectsOversized confirms that a line whose length
        // exceeds the limit is rejected with an error, and that the rejected
        // bytes are not decoded into a Message. A hostile peer must not be able
        // to drive an unbounded ReadBytes allocation on the control channel.
        func TestRecvLimitedRejectsOversized(t *testing.T) {
        	big := Message{Kind: KindHello, Reason: strings.Repeat("x", 8192)}
        	raw, err := json.Marshal(big)
        	if err != nil {
        		t.Fatalf("marshal: %v", err)
        	}
        	line := append(raw, '\n')
        	hc := NewConn(readNopCloser{bytes.NewReader(line)})

        	if _, err := hc.RecvLimited(1024); err == nil {
        		t.Fatal("expected an error for a message longer than the limit, got nil")
        	}
        }

        // TestRecvLimitedZeroMeansUnbounded documents that a non-positive limit
        // falls back to the unbounded Recv behaviour, so RecvLimited(0) is a
        // drop-in Recv.
        func TestRecvLimitedZeroMeansUnbounded(t *testing.T) {
        	big := Message{Kind: KindHello, Reason: strings.Repeat("y", 8192)}
        	raw, _ := json.Marshal(big)
        	line := append(raw, '\n')
        	hc := NewConn(readNopCloser{bytes.NewReader(line)})

        	m, err := hc.RecvLimited(0)
        	if err != nil {
        		t.Fatalf("RecvLimited(0) should be unbounded, got error: %v", err)
        	}
        	if m.Kind != KindHello {
        		t.Fatalf("unexpected message: %+v", m)
        	}
        }

        // readNopCloser adapts an io.Reader to the io.ReadWriteCloser NewConn
        // wants. Only Read is exercised by these tests.
        type readNopCloser struct{ io.Reader }

        func (readNopCloser) Write(p []byte) (int, error) { return len(p), nil }
        func (readNopCloser) Close() error                { return nil }
    cmd: ["go", "test", "./..."]
    timeout_s: 240
