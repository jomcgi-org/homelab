      """Seeded benchmark fixture derived from GET /api/stars/history semantics.

      This deliberately naive algorithm is not current production code.
      Provenance: main 5086f428e23b64d40a9abc6eb450f0f62c9e3f83,
      projects/monolith/stars/router.py:get_history and stars/models.py.
      Fixture/dataset version: stars-climatology-seeded-v1.

      Inputs are lists of plain dictionaries. Sites have unique string ids,
      name (string or None), and finite float lat/lon. Rows have string site_id,
      integer month and nonnegative integer dark_hours/clear_dark_hours.
      Missing months contribute zero; invalid months and unknown sites are ignored.
      Duplicate rows add their hours. Integer counts are exact, with no tolerance;
      identity floats are copied unchanged. Neither input may be mutated.
      Ties retain first valid-row encounter order, matching the endpoint's
      insertion-ordered aggregation followed by a stable descending sort.
      Extra site fields are not returned. Empty inputs return sites=[] and count=0.
      """


      def summarize(sites, rows):
          first_seen = {}
          for index, row in enumerate(rows):
              if 1 <= row["month"] <= 12:
                  first_seen.setdefault(row["site_id"], index)
          output = []
          for site in sites:
              site_id = site["id"]
              clear, dark = [], []
              for month in range(1, 13):
                  clear_hours = dark_hours = 0
                  for row in rows:
                      if row["site_id"] == site_id and row["month"] == month:
                          clear_hours += row["clear_dark_hours"]
                          dark_hours += row["dark_hours"]
                  clear.append(clear_hours)
                  dark.append(dark_hours)
              if sum(dark) <= 0:
                  continue
              output.append({"id": site_id, "name": site["name"],
                             "lat": site["lat"], "lon": site["lon"],
                             "clear": clear, "dark": dark})
          output.sort(key=lambda site: (-sum(site["clear"]), first_seen[site["id"]]))
          return {"sites": output, "count": len(output)}
