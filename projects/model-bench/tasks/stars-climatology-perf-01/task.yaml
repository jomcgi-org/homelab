  It is derived from endpoint semantics; it is not current production code.

  Inputs are lists of dictionaries. Sites have unique string id, name (string or
  None), finite float lat/lon, and possibly extra fields. Rows have string site_id,
  integer month, and nonnegative integer dark_hours/clear_dark_hours. Return
  {"sites": [...], "count": N}. Each returned site contains exactly id, name, lat,
  lon, clear and dark. The two arrays have 12 elements indexed by month - 1.
  Sum duplicate rows; fill missing months with zero. Ignore months outside 1..12
  and rows for unknown sites. Omit sites whose dark array is all zero. Sort by
  all-year clear hours descending, retaining first valid-row encounter order on
  ties, even when site metadata order differs. Copy identity fields unchanged.
  Integer hours must compare exactly; coordinates are carried through unchanged.
  There is no numeric tolerance. Do not mutate either input.

  Output must stay identical for every supported input. Hidden deterministic
  oracle cases and protected copies of the visible tests check correctness.
  Any wrong output scores zero. Run the existing tests with
  python -m unittest -v test_climatology, and time your code before finishing.

  Only climatology.py is editable. Keep test_climatology.py unchanged. Allowed
  imports: __future__, collections, itertools, functools, operator, math, bisect,
