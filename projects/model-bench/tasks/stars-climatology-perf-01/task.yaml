    harness: |
      import random
      import sys


      def site(site_id, name=None):
          return {"id": site_id, "name": name, "lat": 55.083, "lon": -4.5,
                  "altitude_m": 110, "lp_zone": "1a", "source": "grid"}


      def row(site_id, month, dark, clear):
          return {"site_id": site_id, "month": month, "dark_hours": dark,
                  "clear_dark_hours": clear}


      def expected(meta, months):
          clear, dark = [0] * 12, [0] * 12
          for month, hours in months.items():
              dark[month - 1], clear[month - 1] = hours
          return {"id": meta["id"], "name": meta["name"], "lat": meta["lat"],
                  "lon": meta["lon"], "clear": clear, "dark": dark}


      def visible_cases():
          a, b = site("a", "Galloway"), site("b", "Tomintoul")
          big = site("site-" + "9" * 200)
          return [
              (([], []), {"sites": [], "count": 0}),
              (([a], []), {"sites": [], "count": 0}),
              (([], [row("ghost", 1, 7, 5)]), {"sites": [], "count": 0}),
              (([a], [row("a", 12, 50, 25)]),
               {"sites": [expected(a, {12: (50, 25)})], "count": 1}),
              (([a], [row("a", m, 900, 800) for m in (0, 13, -1)]),
               {"sites": [], "count": 0}),
              (([a], [row("a", 1, 3, 1), row("a", 1, 5, 2), row("a", 0, 9, 9)]),
               {"sites": [expected(a, {1: (8, 3)})], "count": 1}),
              (([a, b], [row("a", m, 0, 0) for m in range(1, 13)] +
                [row("b", 6, 10, 9), row("ghost", 1, 9999, 9999)]),
               {"sites": [expected(b, {6: (10, 9)})], "count": 1}),
              (([a, b], [row("a", 0, 1, 1), row("b", 6, 10, 9), row("a", 1, 30, 9)]),
               {"sites": [expected(b, {6: (10, 9)}), expected(a, {1: (30, 9)})], "count": 2}),
              (([b, a], [row("a", 1, 0, 0), row("b", 6, 10, 9), row("a", 1, 30, 9)]),
               {"sites": [expected(a, {1: (30, 9)}), expected(b, {6: (10, 9)})], "count": 2}),
              (([a], [row("a", month, 0, 1) for month in range(1, 13)]),
               {"sites": [], "count": 0}),
              (([b, a], [row("b", 6, 10, 9), row("a", 1, 30, 8), row("a", 12, 50, 25)]),
               {"sites": [expected(a, {1: (30, 8), 12: (50, 25)}),
                          expected(b, {6: (10, 9)})], "count": 2}),
              (([big], [row(big["id"], 2, 2 ** 80, 2 ** 79), row(big["id"], 2, 3, 2)]),
               {"sites": [expected(big, {2: (2 ** 80 + 3, 2 ** 79 + 2)})], "count": 1}),
          ]


      def make_input(seed, size=None):
          size = size if size is not None else int(sys.argv[1])
          rng = random.Random(seed)
          sites = [site("scotland-" + str(i), "Site " + str(i)) for i in range(size)]
          rows = []
          for index, meta in enumerate(sites):
              meta["lat"] = rng.uniform(-89, 89)
              meta["lon"] = rng.uniform(-179, 179)
              if index % 17 == 0:
                  continue
              for month in range(1, 13):
                  if rng.randrange(7) == 0:
                      continue
                  for _ in range(3):
                      dark = 0 if index % 19 == 0 else rng.randrange(1, 600)
                      rows.append(row(meta["id"], month, dark, rng.randrange(dark + 1)))
              rows.extend(row(meta["id"], month, 800, 700) for month in (0, 13, -1))
          rows.extend(row("unknown-" + str(i), rng.randrange(1, 13), 900, 800)
                      for i in range(size))
          rng.shuffle(rows)
          rng.shuffle(sites)
          return sites, rows


      def oracle(sites, rows):
          # Independent cell-wise specification, used only outside timing.
          records = []
          for meta in sites:
              cells = {month: [r for r in rows if r["site_id"] == meta["id"]
                                and r["month"] == month] for month in range(1, 13)}
              months = {month: (sum(r["dark_hours"] for r in group),
                                sum(r["clear_dark_hours"] for r in group))
                        for month, group in cells.items()}
              if not any(dark for dark, clear in months.values()):
                  continue
              first = min(i for i, r in enumerate(rows)
                          if r["site_id"] == meta["id"] and 1 <= r["month"] <= 12)
              records.append((sum(clear for dark, clear in months.values()), first,
                              expected(meta, months)))
          records.sort(key=lambda item: (-item[0], item[1]))
          return {"sites": [item[2] for item in records], "count": len(records)}


      cases = visible_cases()
      for seed in range(50):
          args = make_input(10000 + seed, size=1 + seed % 19)
          cases.append((args, oracle(*args)))
      benchmark(candidate_path="climatology.py", baseline_path="_baseline_climatology.py",
                function="summarize", make_input=make_input, oracle_cases=cases,
                require_pure_inputs=True)
