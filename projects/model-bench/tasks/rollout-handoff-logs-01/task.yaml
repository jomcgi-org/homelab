id: rollout-handoff-logs-01
version: v1
class: code-fix
tier: hard
mode: agentic
# Author provenance: #6695 Agent brief; historical fix ff5fd6444184ff1e6dc89765a48b35d76917fb51.
# Snapshot: the fix's untouched parent. fixture/ is generated and gitignored.
# Synthetic excerpt: reconstructed from the parent's cancellation-first drain
# warning and blocked POST cancellation cleanup. Component labels, times, guest
# identity and address are invented; there is no production log or secret here.
# Grading is independent of excerpt wording. Hidden helpers and three neighbouring
# tests are extracted from the parent's factory/execution/response_lost_test.py.
# The new behavioural case reconstructs the fix's mid-invoke interleaving using
# only parent interfaces. Events control POST and cleanup; a controlled wait
# expires drain grace without the source test's real 0.03-second timeout.
# Durable timestamps and executor budgets use fake time. Real wait_for limits
# only guard hung tests. The real transport, admission, store and receipt path
# run against file-backed SQLite; only HTTP is faked.
# Recorded reversible default: the grader sets AGENT_ROLLOUT_HANDOFF_ENABLED=true.
# The historical fix added early handoff behind that default-off flag and enabled
# it in production in the same commit (values-gke.yaml rolloutHandoffEnabled).
# The parent ignores the variable. No grader imports, calls or asserts on a
# fix-introduced interface or checks that the flag is read. An always-on repair
# also passes; a new default-off repair need not pass the production symptom.
source_commit: ff5fd6444184ff1e6dc89765a48b35d76917fb51
snapshot:
  preset: monolith-backend
  commit: d04e1d47a38249ec45ff294c4ac50e0be64150f4
agent:
  max_turns: 40
prompt: |
  This is a snapshot of a FastAPI monolith backend. Its factory sends agent
  turns to a control plane that runs them on guest VMs.

  During a rolling deployment, an in-flight turn loses its usable outcome.
  The guest keeps working, but the replacement pod cannot recover its result
  and the factory node can end up unknown, needing operator clearing. The
  guest should receive the turn once and its result should remain recoverable
  across the rollout, including when disconnect cleanup is slow.

  Synthetic shutdown excerpt, reconstructed from a controlled reproduction
  of this snapshot (invented times and identities, UTC):

    14:02:10.951 INFO    transport: request sent guest=guest-42
    14:02:11.403 INFO    uvicorn: Shutting down
    14:02:11.419 INFO    uvicorn: Waiting for background tasks to complete.
    14:02:41.402 WARNING executor: 1 agent turn executor(s) did not record an outcome before shutdown
    14:02:41.588 INFO    uvicorn: Finished server process [1]

  Synthetic control-plane access excerpt from the same reproduction:

    14:02:10.955 INFO    invoke accepted guest=guest-42 caller=10.44.3.17
    14:02:36.402 WARNING invoke client disconnected guest=guest-42 (guest continues)

  Find and fix the cause so that this in-flight work remains recoverable
  without sending a duplicate guest invocation. Preserve ordinary successful
  delivery and the existing recovery-disabled behaviour.
target_files: []
verifier:
  kind: pytest
  args:
    targets:
      - factory/execution/rollout_handoff_gold_test.py
    tests:
      factory/execution/rollout_handoff_gold_test.py: |
        import asyncio

        import base64

        from concurrent.futures import ThreadPoolExecutor

        from datetime import datetime, timezone

        import json

        from threading import BoundedSemaphore

        import zlib

        import httpx

        import pytest

        from sqlmodel import Session, SQLModel, create_engine, select

        from sqlalchemy import event

        from factory.execution import models as execution_models

        from factory.execution import (
            admission,
            execution_api,
            mcp,
            result_receipts,
            store,
            transport,
        )

        from factory.execution.constants import RESPONSE_LOST, UNKNOWN_INVOCATION

        from factory.execution.models import (
            AgentCapacityPool,
            AgentCapacityReservation,
            AgentResultReceipt,
            AgentSession,
            AgentTurn,
            PendingMessage,
        )

        from core import db as core_db

        from factory.orchestration.models import SwarmNodeRun

        ARTIFACT_PATH = ".factory/result.json"

        @pytest.fixture
        def database(tmp_path, monkeypatch):
            engine = create_engine(
                f"sqlite:///{tmp_path / 'response-lost.db'}",
                connect_args={"check_same_thread": False, "timeout": 3},
                execution_options={
                    "schema_translate_map": {"agent_sessions": None, "swarm": None}
                },
            )
            # SQL claims use the database clock; keep it on the same fake date.
            @event.listens_for(engine, "connect")
            def database_clock(connection, _record):
                connection.create_function(
                    "current_timestamp", 0,
                    lambda: datetime.fromtimestamp(
                        STARTED_AT / 1000, timezone.utc
                    ).strftime("%Y-%m-%d %H:%M:%S.%f"),
                )

            SQLModel.metadata.create_all(
                engine,
                tables=[
                    model.__table__
                    for model in (
                        AgentCapacityPool,
                        AgentCapacityReservation,
                        AgentResultReceipt,
                        AgentSession,
                        AgentTurn,
                        PendingMessage,
                        SwarmNodeRun,
                    )
                ],
            )
            for module in (admission, store, mcp, execution_api, result_receipts, core_db):
                monkeypatch.setattr(module, "get_engine", lambda: engine)
            monkeypatch.setenv("AGENT_RESULT_RECEIPTS_ENABLED", "true")
            monkeypatch.setenv("AGENT_RESULT_RECEIPT_ADOPTION_ENABLED", "false")
            monkeypatch.setenv("AGENT_RESPONSE_LOST_RECOVERY_ENABLED", "true")
            monkeypatch.setattr(transport, "RECEIPT_POLL_SECONDS", 0.005)
            observer_executor = ThreadPoolExecutor(max_workers=2)
            monkeypatch.setattr(transport, "_receipt_db_executor", observer_executor)
            monkeypatch.setattr(transport, "_receipt_db_slots", BoundedSemaphore(2))
            monkeypatch.setattr(mcp, "_schedule_next_message", lambda _sid: None)
            monkeypatch.setattr(execution_api, "_schedule_next_message", lambda _sid: None)
            mcp._negative_oracle_verdicts.clear()

            async def notify(*_args, **_kwargs):
                return None

            monkeypatch.setattr(mcp, "_notify_terminal", notify)
            try:
                yield engine
            finally:
                observer_executor.shutdown(wait=True, cancel_futures=True)
                mcp._negative_oracle_verdicts.clear()
                engine.dispose()

        def queue(engine, key="response-lost-project", *, tier="project"):
            with Session(engine) as db:
                agent = store.create_session(
                    db, key, "<guest>", "main", "luna", admission_tier=tier
                )
                sid = agent.id
                store.set_ember_session(db, sid, f"guest-{sid}", "guest-token", None)
                store.create_pending_message(db, sid, "implement the bounded task", "luna")
                return sid

        def snapshot(engine, sid):
            with Session(engine) as db:
                return {
                    "session": db.get(AgentSession, sid).model_dump(),
                    "pending": [
                        row.model_dump()
                        for row in db.exec(
                            select(PendingMessage).where(PendingMessage.session_id == sid)
                        ).all()
                    ],
                    "turns": [
                        row.model_dump()
                        for row in db.exec(
                            select(AgentTurn).where(AgentTurn.session_id == sid)
                        ).all()
                    ],
                    "permits": [
                        row.model_dump()
                        for row in db.exec(
                            select(AgentCapacityReservation)
                            .where(AgentCapacityReservation.session_id == sid)
                            .order_by(AgentCapacityReservation.pending_seq)
                        ).all()
                    ],
                }

        def native_record(cost=0.125, artifact=True):
            record = {
                "result": "Implemented the bounded task.",
                "terminal_reason": "end_turn",
                "stop_reason": "end_turn",
                "is_error": False,
                "session_id": "native-cli",
                "num_turns": 1,
                "total_cost_usd": cost,
                "duration_ms": 23,
                "activities": [],
                "usage": {"input_tokens": 3},
                "diff": {
                    "base_sha": "a" * 40,
                    "truncated": False,
                    "zlib_b64": base64.b64encode(zlib.compress(b"native diff bytes")).decode(),
                },
            }
            if artifact:
                record["artifact"] = {
                    "path": ARTIFACT_PATH,
                    "outcome": "ok",
                    "content_b64": base64.b64encode(b'{"status": "ok"}').decode(),
                }
            return record

        def fake_http(monkeypatch, post_handler, guest_state=None):
            """Fake only the HTTP boundary; every other owner is the real one."""
            requests = []

            class Client:
                def __init__(self, **_kwargs):
                    pass

                async def __aenter__(self):
                    return self

                async def __aexit__(self, *_args):
                    pass

                async def post(self, url, **kwargs):
                    request = httpx.Request("POST", url, **kwargs)
                    requests.append(request)
                    assert request.url.path.endswith("/invoke"), "unexpected new guest"
                    return await post_handler(request)

                async def get(self, url, **kwargs):
                    request = httpx.Request("GET", url, **kwargs)
                    if guest_state is None:
                        pytest.fail("this case must not read the control plane")
                    return httpx.Response(200, json=guest_state(), request=request)

                async def delete(self, *args, **kwargs):
                    pytest.fail("a held turn must never destroy its working guest")

            monkeypatch.setattr(transport.httpx, "AsyncClient", Client)
            monkeypatch.setattr(transport, "EMBERVM_URL", "https://ember.test")
            monkeypatch.setattr(mcp, "_transport", transport.EmberVmShimTransport())
            return requests

        STARTED_AT = 1788874047685

        def working_guest(sid, generation=0, started=STARTED_AT, last=None):
            """A control-plane view of a guest with an invoke still in progress."""

            def view():
                return {
                    "session_id": f"guest-{sid}",
                    "state": "running",
                    "generation": generation,
                    "invoke_started_at": started,
                    "last_invoke_at": last,
                }

            return view

        def publish(record, request):
            """Publish the native record the guest produced for this exact POST."""
            receipt = json.loads(request.content)["result_receipt"]
            body = json.dumps(record).encode()
            result_receipts.capture_result(receipt["id"], receipt["token"], body)
            return receipt

        def hold_of(sid):
            return store.read_response_lost_hold_sync(sid)

        def lose_the_response(database, monkeypatch, *, record=None, guest_state=None):
            """Run one real turn whose POST fails after the guest starts working."""
            sid = queue(database)

            async def handler(request):
                if record is not None:
                    publish(record, request)
                raise httpx.ReadError("original response lost", request=request)

            requests = fake_http(monkeypatch, handler, guest_state or working_guest(sid))
            asyncio.run(asyncio.wait_for(mcp._execute_pending_message(sid), 10))
            return sid, requests

        def assert_held(database, sid, reason):
            state = snapshot(database, sid)
            assert len(state["pending"]) == 1, "a held attempt keeps its queued prompt"
            assert state["pending"][0]["claimed_by_replica"] is not None
            assert state["pending"][0]["dispatch_count"] == 1
            assert len(state["turns"]) == 1
            turn = state["turns"][0]
            assert turn["terminal_reason"] == "interrupted"
            assert turn["stop_reason"] == RESPONSE_LOST
            assert turn["cost_usd"] is None
            recovery = json.loads(turn["usage_json"])["recovery"]
            assert recovery["invocation_phase"] == RESPONSE_LOST
            assert recovery["response_lost"]["reason"] == reason
            observation = json.loads(turn["usage_json"])["observation"]
            assert observation["schema"] == "turn-observation/1"
            assert observation["dispatch_count"] == 1
            assert observation["dispatched_at"] is not None
            # The permit is neither released nor made uncertain: the guest is still
            # holding the capacity this attempt was admitted for.
            assert [row["state"] for row in state["permits"]] == ["running"]
            assert state["permits"][0]["outcome"] is None
            assert state["session"]["status"] == "recovering"
            assert state["session"]["result_receipt_fence_id"] is None
            assert state["session"]["ember_session_id"] == f"guest-{sid}"
            return state

        def test_lost_response_recovers_the_exact_result_without_re_executing(
            database, monkeypatch
        ):
            record = native_record()
            sid, requests = lose_the_response(database, monkeypatch)
            held = assert_held(database, sid, "invoke_response_lost")
            assert len(requests) == 1

            # The guest finishes and publishes long after its observer is gone.
            receipt = json.loads(requests[0].content)["result_receipt"]
            result_receipts.capture_result(
                receipt["id"], receipt["token"], json.dumps(record).encode()
            )
            assert snapshot(database, sid) == held, "capture alone changes no execution state"

            outcome = store.adopt_response_lost_result(sid, ARTIFACT_PATH)
            assert outcome == {"status": "adopted", "seq": 1, "receipt_id": receipt["id"]}
            after = snapshot(database, sid)
            assert len(requests) == 1, "recovery must not invoke the model a second time"
            assert after["pending"] == []
            assert len(after["turns"]) == 1
            turn = after["turns"][0]
            assert turn["terminal_reason"] == "end_turn"
            assert turn["stop_reason"] == "end_turn"
            assert turn["result_text"] == record["result"]
            assert turn["cost_usd"] == 0.125
            observation = json.loads(turn["usage_json"])["observation"]
            assert observation["executor_elapsed_ms"] is None
            assert observation["runtime_duration_ms"] == record["duration_ms"]
            assert observation["dispatch_count"] == 1
            assert observation["provider_retries"] is None
            assert zlib.decompress(turn["diff_blob"]) == b"native diff bytes"
            assert turn["diff_base_sha"] == "a" * 40
            assert turn["artifact_path"] == ARTIFACT_PATH
            assert bytes(turn["artifact_blob"]) == b'{"status": "ok"}'
            assert turn["artifact_outcome"] == "ok"
            provenance = json.loads(turn["usage_json"])["native_result_receipt"]
            assert provenance["receipt_id"] == receipt["id"]
            assert provenance["response_lost_recovery"] is True
            assert provenance["session_id"] == sid
            assert provenance["guest_id"] == f"guest-{sid}"
            assert provenance["seq"] == provenance["dispatch_count"] == 1
            assert receipt["token"] not in turn["usage_json"]
            assert [row["state"] for row in after["permits"]] == ["settled"]
            assert after["permits"][0]["outcome"] == "end_turn"
            assert after["session"]["status"] == "completed"
            assert after["session"]["cli_session_id"] == "native-cli"
            # No observer is left to clear a fence, so adoption must not set one.
            assert after["session"]["result_receipt_fence_id"] is None

        def test_replica_shutdown_holds_the_turn_instead_of_recording_unknown(
            database, monkeypatch
        ):
            sid = queue(database)
            posted = asyncio.Event()

            async def handler(_request):
                posted.set()
                await asyncio.Event().wait()

            requests = fake_http(monkeypatch, handler)

            async def run():
                task = asyncio.create_task(mcp._execute_pending_message(sid))
                await asyncio.wait_for(posted.wait(), 5)
                task.cancel()
                with pytest.raises(asyncio.CancelledError):
                    await task

            asyncio.run(asyncio.wait_for(run(), 10))
            assert len(requests) == 1
            held = assert_held(database, sid, "replica_shutdown")
            assert hold_of(sid)["source"] == "executor"
            assert held["turns"][0]["seq"] == 1

        def test_recovery_disabled_records_unknown_exactly_as_before(database, monkeypatch):
            monkeypatch.setenv("AGENT_RESPONSE_LOST_RECOVERY_ENABLED", "false")
            sid, _requests = lose_the_response(database, monkeypatch, guest_state=None)
            state = snapshot(database, sid)
            assert state["pending"] == []
            assert state["turns"][0]["stop_reason"] is None
            assert [row["state"] for row in state["permits"]] == ["uncertain"]

        from types import SimpleNamespace


        @pytest.fixture(autouse=True)
        def controlled_runtime(monkeypatch):
            # Freeze durable timestamps and executor budgets, never the event-loop clock.
            class Clock(datetime):
                @classmethod
                def now(cls, tz=None):
                    value = cls.fromtimestamp(STARTED_AT / 1000, timezone.utc)
                    return value.astimezone(tz) if tz else value.replace(tzinfo=None)

            for module in (
                admission, store, mcp, result_receipts, transport, execution_models
            ):
                if hasattr(module, "datetime"):
                    monkeypatch.setattr(module, "datetime", Clock)
            monkeypatch.setattr(mcp, "time", SimpleNamespace(monotonic=lambda: 1000.0))
            monkeypatch.setattr(mcp, "_inflight_tasks", set())
            monkeypatch.setenv("AGENT_ROLLOUT_HANDOFF_ENABLED", "true")


        def test_rollout_preserves_dispatch_before_observer_cleanup(database, monkeypatch):
            """Only parent interfaces: real executor, drain, store and result adoption."""
            sid = queue(database)
            record = native_record()

            async def scenario():
                posted = asyncio.Event()
                cleanup = asyncio.Event()
                release = asyncio.Event()

                async def handler(request):
                    posted.set()
                    try:
                        await asyncio.Event().wait()
                    except asyncio.CancelledError:
                        cleanup.set()
                        await release.wait()
                        raise

                requests = fake_http(monkeypatch, handler, working_guest(sid))
                task = asyncio.create_task(mcp._execute_pending_message(sid))
                mcp._inflight_tasks.add(task)
                real_wait = asyncio.wait

                async def drain_expiry(tasks, *, timeout=None, **kwargs):
                    pending = set(tasks)
                    if pending == {task} and timeout is not None:
                        # A non-cancelled task consumes its grace deterministically.
                        # Cancellation waits until HTTP cleanup has hit its barrier.
                        if task.cancelling():
                            await cleanup.wait()
                        return set(), pending
                    return await real_wait(tasks, timeout=timeout, **kwargs)

                monkeypatch.setattr(mcp.asyncio, "wait", drain_expiry)
                try:
                    await posted.wait()
                    assert len(requests) == 1
                    receipt = json.loads(requests[0].content)["result_receipt"]
                    dispatch = snapshot(database, sid)["pending"][0]
                    with Session(database) as db:
                        prepared = db.get(AgentResultReceipt, receipt["id"])
                        request_sha256 = prepared.request_sha256
                    await mcp.drain_inflight_executors()
                    await cleanup.wait()
                    assert not task.done(), "HTTP cancellation cleanup is still blocked"
                    hold = hold_of(sid)
                    assert hold is not None, (
                        "rollout must durably hold the exact dispatch before observer cleanup"
                    )
                    held = assert_held(database, sid, "replica_shutdown")
                    assert held["turns"][0]["stop_reason"] != UNKNOWN_INVOCATION
                    assert hold["receipt_id"] == receipt["id"]
                    assert hold["guest_id"] == f"guest-{sid}"
                    assert hold["dispatch_count"] == dispatch["dispatch_count"] == 1
                    assert hold["claim_owner"] == dispatch["claimed_by_replica"]
                    assert hold["request_sha256"] == request_sha256
                    assert hold["source"] == "executor"
                    publish(record, requests[0])
                    outcome = await asyncio.to_thread(
                        store.adopt_response_lost_result, sid, ARTIFACT_PATH
                    )
                    assert outcome == {
                        "status": "adopted", "seq": 1, "receipt_id": receipt["id"]
                    }
                    assert store.adopt_response_lost_result(sid, ARTIFACT_PATH) is None
                    after = snapshot(database, sid)
                    assert after["pending"] == []
                    assert after["session"]["status"] == "completed"
                    assert after["permits"][0]["state"] == "settled"
                    assert after["permits"][0]["outcome"] == "end_turn"
                    assert after["turns"][0]["result_text"] == record["result"]
                    assert after["turns"][0]["cost_usd"] == record["total_cost_usd"]
                    assert receipt["token"] not in after["turns"][0]["usage_json"]
                finally:
                    # Release even after a baseline assertion fails, so no tasks leak.
                    release.set()
                    if not task.done() and not task.cancelling():
                        task.cancel()
                    try:
                        await task
                    except asyncio.CancelledError:
                        pass
                    mcp._inflight_tasks.discard(task)
                assert len(requests) == 1, "adoption must not send another physical POST"
                final = snapshot(database, sid)
                assert final["session"]["status"] == "completed"
                assert len(final["turns"]) == 1
                assert final["permits"][0]["outcome"] == "end_turn"

            # This timeout only fails a hung test; no passing assertion uses real time.
            asyncio.run(asyncio.wait_for(scenario(), 15))
