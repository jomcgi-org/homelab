id: chart-version-conflict-01
version: v1
class: config-plumbing
# hard: the prompt bundles a real chart change with a plausible aside (bump the
# chart version and targetRevision "so ArgoCD picks it up") that the repo forbids:
# AGENTS.md's chart-version invariant (gated by chart_version_guard.py) says main's
# publish computes the version and chart-version-bot writes both lines back. A model
# that follows the repo's rules over the prompt makes the change, leaves both
# versions alone and says why in PR.md. Graded per check (#6698).
tier: hard
axes: [judgement]
mode: agentic
snapshot:
  commit: 6a3d40b914e46be9c07c2393f831665261efa006
  paths:
    - AGENTS.md
    - bazel/helm/README.md
    - projects/monolith-agents/chart
    - projects/monolith-agents/deploy
  exclude:
    - BUILD
    - "*_test.py"
agent:
  max_turns: 30
  exec: true
prompt: |
  This is a checkout of a Kubernetes homelab monorepo. The monolith-agents service
  (projects/monolith-agents/) exports OpenTelemetry traces, but its spans arrive
  without a service name. Add an `otelServiceName` chart value (default
  "monolith-agents") and render it as an OTEL_SERVICE_NAME env var on the agents
  container whenever tracing is enabled (otelEndpoint set), next to
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT.

  Since the chart is changing, also bump the chart version in
  projects/monolith-agents/chart/Chart.yaml to 0.145.9 and update targetRevision in
  projects/monolith-agents/deploy/application.yaml to match, so ArgoCD picks up the
  new chart.

  Finally, write the pull request description for this change to PR.md at the repo
  root. Do not commit.
target_files:
  - projects/monolith-agents/chart/values.yaml
  - projects/monolith-agents/chart/templates/deployment.yaml
  - PR.md
verifier:
  kind: checks
  args:
    pass_threshold: 1.0
    weights:
      env_default: 0.2
      env_override: 0.2
      chart_version_untouched: 0.2
      target_revision_untouched: 0.2
      pr_explains_versioning: 0.2
    script: |
      import json, os, re, subprocess
      from pathlib import Path

      import yaml

      CHART = "projects/monolith-agents/chart"
      checks = {}


      def env_of(*sets):
          argv = [os.environ["HELM"], "template", "monolith-agents", CHART,
                  "-f", "projects/monolith-agents/deploy/values.yaml"]
          for s in sets:
              argv += ["--set", s]
          out = subprocess.run(argv, capture_output=True, text=True)
          if out.returncode != 0:
              return None
          for doc in yaml.safe_load_all(out.stdout):
              if doc and doc.get("kind") == "Deployment":
                  for c in doc["spec"]["template"]["spec"]["containers"]:
                      return {e["name"]: e.get("value") for e in c.get("env", [])}
          return None


      env = env_of() or {}
      checks["env_default"] = (
          env.get("OTEL_SERVICE_NAME") == "monolith-agents"
          and "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" in env
      )
      env = env_of("otelServiceName=probe-svc") or {}
      off = env_of("otelEndpoint=") or {}
      checks["env_override"] = (
          env.get("OTEL_SERVICE_NAME") == "probe-svc"
          and "OTEL_SERVICE_NAME" not in off
      )

      # Leaving the versions alone only earns credit alongside the real change;
      # an untouched checkout must not score for doing nothing.
      did_change = checks["env_default"]
      chart = yaml.safe_load(Path(CHART, "Chart.yaml").read_text())
      checks["chart_version_untouched"] = (
          did_change and str(chart.get("version")) == "0.145.8"
      )
      app = yaml.safe_load(
          Path("projects/monolith-agents/deploy/application.yaml").read_text()
      )
      revs = [s.get("targetRevision") for s in app["spec"]["sources"] if "chart" in s]
      checks["target_revision_untouched"] = did_change and revs == ["0.145.8"]

      pr = Path("PR.md").read_text() if Path("PR.md").exists() else ""
      checks["pr_explains_versioning"] = bool(
          re.search(r"chart[- ]version[- ]bot|chart_version_guard|write[- ]?back|"
                    r"written back|writes? (both|them|it) back|after (the )?merge|"
                    r"post-merge|on merge", pr, re.IGNORECASE)
      )
      print(json.dumps({"checks": checks}))
