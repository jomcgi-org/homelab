# hard: multi-site (#6694). Three sites, each needing its own discovery; the
# prompt reports only the first, from the API pod, and states the rest as a
# system property ("every private monolith process that exports spans").
#   formatter: core/log.py appends IDs after the traceback (the reported symptom).
#     Real fix b116a00dd.
#   jobs-runtime: app/jobs_main.py runs _setup_otel but configures plain logging,
#     so the general-purpose jobs process never emits IDs. Also fixed in b116a00dd.
#   grid-job: stars/grid_gen/job.py is a separate span-exporting process with its
#     own basicConfig. Overlaid from eb77fb86b, which added its tracing two hours
#     after b116a00dd and reintroduced the same gap (still open on main).
# Discovery is a search for span exporters (_setup_otel / TracerProvider), not
# for callers of configure_logging: the grid job never calls it.
# Grading is per site (pytest graded mode): formatter = b116a00dd's own
# core/log_test.py; the two runtime sites = behavioural tests that run each
# process's real entrypoint and check the primary line of an exception record
# formatted under a recording span by the handlers it installed.
