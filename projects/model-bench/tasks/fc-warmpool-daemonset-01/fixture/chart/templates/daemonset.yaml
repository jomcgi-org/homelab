apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-fc-invoke
  labels:
    app: fc-invoke
spec:
  selector:
    matchLabels:
      app: fc-invoke
  template:
    metadata:
      labels:
        app: fc-invoke
    spec:
      containers:
        - name: fc-invoke
          image: {{ .Values.image }}
          args: ["--pool-size={{ .Values.poolSize }}"]
          securityContext:
            privileged: true
          # NOTE: firecracker launches microVMs through the host virtualisation
          # device, which this container has no way to reach.
