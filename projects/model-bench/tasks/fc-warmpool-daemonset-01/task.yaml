id: fc-warmpool-daemonset-01
version: v2
class: code-fix
tier: hard
mode: agentic
prompt: |
  This is a real snapshot of the firecracker invoke daemon ("fc-invoke") from this
  repo. The daemon keeps a warm base snapshot per workload and restores fresh
  single-use microVMs from it (the fast path), falling back to a cold boot when no
  base is available. The warm-pool orchestration lives in package `invoker` at
  node/invoker/invoker.go; its supporting types (Workload, ClaimSpec, Handle,
  SnapshotRef) live in package `substrate` under substrate/.

  The code is a Go module with no go.mod yet. Its import prefix is
  `github.com/jomcgi/homelab/projects/firecracker/substrate` (see node/invoker
  importing .../substrate and .../node/egress). Initialise the module with that
  exact path (`go mod init github.com/jomcgi/homelab/projects/firecracker/substrate`)
  and pull dependencies (`go mod tidy`) so it builds; it depends on
  go.opentelemetry.io/otel and golang.org/x/sync.

  Your task: add a NEW observability accessor to the warm-pool daemon. The Invoker
  tracks its warm base internally (whether one is loaded, how many times it has been
  built, whether a build is in flight) but exposes none of it, so a status endpoint
  or readiness probe cannot tell "serving warm restores" apart from "cold-booting
  until the base builds". Add:

    1. An exported `PoolStatus` struct with these fields:
         - `WarmBaseEnabled bool`   : whether this workload opts into the warm base
                                       at all (its Workload.WarmBase).
         - `WarmBaseReady bool`     : whether a usable warm base is currently loaded,
                                       i.e. the next Invoke can take the fast restore
                                       path rather than a cold boot.
         - `Building bool`          : whether a base build is in flight right now.
         - `BaseGeneration uint64`  : the number of successful base builds so far
                                       (advances by one per captured base).

    2. An exported method `func (inv *Invoker) PoolStatus() PoolStatus` that returns
       a consistent snapshot of that state. It must read the base fields under the
       same lock the build/invalidate paths mutate them, so the returned fields never
       tear against a concurrent build. Study how BuildBase, invalidateBase, and
       currentBase already read and mutate that state, and mirror their locking.

  Do NOT change existing behaviour; this is purely additive. Leave the rest of the
  daemon untouched.

  You have a `run` tool: use it to `go mod init` / `go mod tidy`, and to
  `go test ./node/invoker/` to check your work. When it builds and the daemon
  behaves as described, call done.
snapshot:
  commit: 019b3ffb829700df0a0cf950e502d3d828147985
  paths:
    - projects/firecracker/substrate/node/invoker
    - projects/firecracker/substrate/node/egress
    - projects/firecracker/substrate/substrate
    - projects/firecracker/substrate/vsockproto
  strip_components: 3
  exclude:
    - "*_test.go"
    - "BUILD"
    - "BUILD.bazel"
    - "*.bzl"
agent:
  max_turns: 45
  exec: true
verifier:
  kind: command
  args:
    write_files:
      node/invoker/poolstatus_test.go: |
        package invoker

        import (
        	"context"
        	"net/http"
        	"testing"
        	"time"

        	"github.com/jomcgi/homelab/projects/firecracker/substrate/substrate"
        )

        // stubDriver is a minimal vmDriver good enough for the warm-base build path:
        // Claim/SnapshotBase succeed, everything else no-ops. Self-contained so the
        // gold test does not depend on the fixture's own (hidden) test helpers.
        type stubDriver struct{ seq int }

        func (d *stubDriver) Claim(_ context.Context, spec substrate.ClaimSpec) (substrate.Handle, error) {
        	tid := spec.ThreadID
        	if tid == "" {
        		d.seq++
        		tid = "stub-thread"
        	}
        	return substrate.Handle{ThreadID: tid, ID: "vm-" + tid}, nil
        }

        func (d *stubDriver) SnapshotBase(_ context.Context, _ substrate.Handle, baseKey string) (substrate.SnapshotRef, error) {
        	return substrate.SnapshotRef{ID: baseKey, Base: true}, nil
        }

        func (d *stubDriver) Release(_ context.Context, _ substrate.Handle) error { return nil }
        func (d *stubDriver) RemoveBundle(_ string) error                         { return nil }
        func (d *stubDriver) VsockUDSPath(threadID string) string {
        	return "/stub/" + threadID + "/vsock.sock"
        }

        // stubTransport reports the guest ready immediately; RoundTrip is unused by
        // these tests but present to satisfy the transport interface.
        type stubTransport struct{}

        func (stubTransport) WaitReady(_ context.Context, _, _ string) error { return nil }
        func (stubTransport) RoundTrip(_ context.Context, _ string, _ *http.Request) (*http.Response, error) {
        	return &http.Response{StatusCode: http.StatusOK}, nil
        }

        func warmConfig() Config {
        	return Config{
        		Workload: substrate.Workload{
        			WarmBase:       true,
        			Concurrency:    4,
        			ReadyPath:      "/shim/ready",
        			RequestTimeout: 5 * time.Second,
        		},
        		BaseKey:          "test-base",
        		Arch:             "amd64",
        		BootReadyTimeout: 5 * time.Second,
        	}
        }

        // TestPoolStatusReflectsWarmBaseLifecycle drives an Invoker through the
        // warm-base lifecycle and asserts PoolStatus reports each stage. A workload
        // with WarmBase enabled starts with no base loaded (cold path only); after a
        // successful BuildBase a usable base is loaded (fast restore path) and the
        // build generation has advanced exactly once.
        func TestPoolStatusReflectsWarmBaseLifecycle(t *testing.T) {
        	inv := New(&stubDriver{}, stubTransport{}, warmConfig(), nil)

        	before := inv.PoolStatus()
        	if !before.WarmBaseEnabled {
        		t.Fatalf("WarmBaseEnabled: want true (warmConfig enables WarmBase), got false")
        	}
        	if before.WarmBaseReady {
        		t.Errorf("WarmBaseReady before BuildBase: want false, got true")
        	}
        	if before.Building {
        		t.Errorf("Building before BuildBase: want false, got true")
        	}
        	if before.BaseGeneration != 0 {
        		t.Errorf("BaseGeneration before BuildBase: want 0, got %d", before.BaseGeneration)
        	}

        	if err := inv.BuildBase(context.Background()); err != nil {
        		t.Fatalf("BuildBase: %v", err)
        	}

        	after := inv.PoolStatus()
        	if !after.WarmBaseReady {
        		t.Errorf("WarmBaseReady after BuildBase: want true, got false")
        	}
        	if after.Building {
        		t.Errorf("Building after BuildBase returns: want false, got true")
        	}
        	if after.BaseGeneration != 1 {
        		t.Errorf("BaseGeneration after one BuildBase: want 1, got %d", after.BaseGeneration)
        	}
        }

        // TestPoolStatusWarmBaseDisabled checks that a workload that opts out of the
        // warm base reports it: WarmBaseEnabled is false and, because BuildBase
        // no-ops, no base is ever loaded and the generation stays zero.
        func TestPoolStatusWarmBaseDisabled(t *testing.T) {
        	cfg := warmConfig()
        	cfg.Workload.WarmBase = false
        	inv := New(&stubDriver{}, stubTransport{}, cfg, nil)

        	if err := inv.BuildBase(context.Background()); err != nil {
        		t.Fatalf("BuildBase (disabled): %v", err)
        	}
        	st := inv.PoolStatus()
        	if st.WarmBaseEnabled {
        		t.Errorf("WarmBaseEnabled: want false, got true")
        	}
        	if st.WarmBaseReady {
        		t.Errorf("WarmBaseReady with warm base disabled: want false, got true")
        	}
        	if st.BaseGeneration != 0 {
        		t.Errorf("BaseGeneration with warm base disabled: want 0, got %d", st.BaseGeneration)
        	}
        }

      _check.sh: |
        #!/bin/sh
        # Set up the Go module if the model did not already (idempotent), pull deps,
        # then run the injected gold test for the warm-pool accessor. The test FAILS
        # on the unmodified fixture (PoolStatus absent) and PASSES once the additive
        # accessor is implemented.
        set -e
        if [ ! -f go.mod ]; then
          go mod init github.com/jomcgi/homelab/projects/firecracker/substrate 1>&2
        fi
        GOFLAGS=-mod=mod go mod tidy 1>&2
        if ! GOFLAGS=-mod=mod go test ./node/invoker/ 1>&2; then
          echo "go test ./node/invoker/ failed: the PoolStatus warm-pool accessor is not implemented correctly" 1>&2
          exit 1
        fi
        echo ok
    cmd: ["sh", "_check.sh"]
    timeout_s: 300
