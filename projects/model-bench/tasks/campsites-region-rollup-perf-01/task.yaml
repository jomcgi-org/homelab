    harness: |
      from datetime import date, timedelta
      import random
      import sys


      TODAY = "2026-01-01"


      def park(rid, region="Coast"):
          return {"resource_location_id": rid, "region": region, "name": "Park " + str(rid)}


      def av(rid, offset=0, available=True):
          return {"resource_location_id": rid,
                  "date": (date.fromisoformat(TODAY) + timedelta(days=offset)).isoformat(),
                  "has_availability": available}


      def wx(rid, offset=0, score=70, good=True):
          return {"resource_location_id": rid,
                  "date": (date.fromisoformat(TODAY) + timedelta(days=offset)).isoformat(),
                  "sunny_score": score, "is_good": good}


      def result(region="Coast", parks=1, score=0, good=0, opened=0):
          return {"region": region, "parks": parks, "best_score": score,
                  "good_days": good, "open_parks": opened}


      def expected(*regions):
          return {"count": len(regions), "regions": list(regions)}


      def visible_cases():
          empty = {"status": 503, "detail": "campsites data unavailable"}
          return [
              (([], [], [], TODAY), empty),
              (([], [av(999)], [wx(999)], TODAY), empty),
              (([park(1), park(2)], [], [], TODAY), expected(result(parks=2))),
              (([park(1)], [av(1, d) for d in (-2, -1, 13, 14)],
                [wx(1, d, s) for d, s in ((-2, 999), (-1, 40), (13, 90), (14, 998))], TODAY),
               expected(result(score=90, good=2, opened=1))),
              (([park(1)], [av(999)], [wx(999, score=999)], TODAY), expected(result())),
              (([park(1)], [av(1, available=False)], [wx(1)], TODAY), expected(result())),
              (([park(1)], [av(1)], [], TODAY), expected(result())),
              (([park(1)], [], [wx(1)], TODAY), expected(result())),
              (([park(1, "z"), park(2, "A"), park(3, "")],
                [av(1), av(2)], [wx(1), wx(2)], TODAY),
               expected(result("A", score=70, good=1, opened=1),
                        result("z", score=70, good=1, opened=1), result(""))),
              (([park(i, r) for i, r in enumerate(("z", "é", "A", "", "a"))], [], [], TODAY),
               expected(*(result(r) for r in ("", "A", "a", "z", "é")))),
              (([park(1)], [av(1), av(1, available=False)], [wx(1)], TODAY),
               expected(result())),
              (([park(1)], [av(1, available=False), av(1)], [wx(1)], TODAY),
               expected(result(score=70, good=1, opened=1))),
              (([park(1)], [av(1)], [wx(1, score=90), wx(1, score=20, good=False)], TODAY),
               expected(result(score=20))),
              (([park(1), park(2)], [av(1), av(1, 1), av(2)],
                [wx(1), wx(1, 1, 95, False), wx(2, score=60)], TODAY),
               expected(result(parks=2, score=95, good=2, opened=2))),
              (([park(1)], [av(1), av(1, 1)], [wx(1), wx(1, 1)], TODAY),
               expected(result(score=70, good=2, opened=1))),
              (([park(2 ** 80)], [av(2 ** 80)], [wx(2 ** 80, score=2 ** 90 + 3)], TODAY),
               expected(result(score=2 ** 90 + 3, good=1, opened=1))),
          ]


      def make_input(seed, size=None):
          size = size if size is not None else int(sys.argv[1])
          rng = random.Random(seed)
          today = (date(2024, 2, 27) + timedelta(days=seed % 1100)).isoformat()
          campgrounds = [park(i, ("", "Coast", "Interior", "a", "é")[i % 5])
                         for i in range(size)]
          availability, weather = [], []
          start = date.fromisoformat(today)
          for index, meta in enumerate(campgrounds):
              if index % 17 == 0:
                  continue
              for offset in range(-2, 15):
                  day = (start + timedelta(days=offset)).isoformat()
                  for _ in range(3):
                      if rng.randrange(7):
                          availability.append({"resource_location_id": index, "date": day,
                                               "has_availability": bool(rng.randrange(3))})
                      if rng.randrange(6):
                          weather.append({"resource_location_id": index, "date": day,
                                          "sunny_score": rng.randrange(101),
                                          "is_good": bool(rng.randrange(2))})
          for index in range(size):
              day = (start + timedelta(days=rng.randrange(-2, 15))).isoformat()
              availability.append({"resource_location_id": size + index, "date": day,
                                   "has_availability": True})
              weather.append({"resource_location_id": size + index, "date": day,
                              "sunny_score": 999, "is_good": True})
          rng.shuffle(campgrounds)
          rng.shuffle(availability)
          rng.shuffle(weather)
          return campgrounds, availability, weather, today


      def oracle(campgrounds, availability, weather, today):
          # Independent day-wise specification, outside the timed function calls.
          if not campgrounds:
              return {"status": 503, "detail": "campsites data unavailable"}
          low = (date.fromisoformat(today) - timedelta(days=1)).isoformat()
          high = (date.fromisoformat(today) + timedelta(days=13)).isoformat()
          regions = []
          for region in sorted({p["region"] for p in campgrounds}):
              members = [p for p in campgrounds if p["region"] == region]
              scores, good_days, opened = [], 0, 0
              for member in members:
                  rid = member["resource_location_id"]
                  dates = {r["date"] for r in availability + weather
                           if r["resource_location_id"] == rid and low <= r["date"] <= high}
                  park_good = 0
                  for day in dates:
                      avs = [r for r in availability if r["resource_location_id"] == rid
                             and r["date"] == day]
                      wxs = [r for r in weather if r["resource_location_id"] == rid
                             and r["date"] == day]
                      if not avs or not avs[-1]["has_availability"]:
                          continue
                      scores.append(wxs[-1]["sunny_score"] if wxs else 0)
                      park_good += int(bool(wxs) and wxs[-1]["is_good"])
                  good_days += park_good
                  opened += int(park_good > 0)
              regions.append(result(region, len(members), max(scores, default=0),
                                    good_days, opened))
          regions.sort(key=lambda item: (-item["best_score"], item["region"]))
          return expected(*regions)


      cases = visible_cases()
      for seed in range(50):
          args = make_input(10000 + seed, size=seed % 19)
          cases.append((args, oracle(*args)))
      # Move full windows across leap-day boundaries without changing timing data.
      for index, new_today in enumerate(("2024-02-28", "2024-03-01")):
          parks, avs, wxs, old_today = make_input(12000 + index, size=7)
          shift = date.fromisoformat(new_today) - date.fromisoformat(old_today)
          for row in avs + wxs:
              row["date"] = (date.fromisoformat(row["date"]) + shift).isoformat()
          args = (parks, avs, wxs, new_today)
          cases.append((args, oracle(*args)))
      benchmark(candidate_path="rollup.py", baseline_path="_baseline_rollup.py",
                function="summarize", make_input=make_input, oracle_cases=cases,
                require_pure_inputs=True)
