prompt: |
  This is a snapshot of a real FastAPI monolith backend. It runs agent "turns"
  for a factory: each turn is eventually sent to the EmberVM control plane,
  which runs it on a guest VM.

  The monolith supports rolling deploys with in-flight handoff
  (AGENT_ROLLOUT_HANDOFF_ENABLED=true, AGENT_EXECUTOR_NOT_INVOKED_RECORD_ENABLED=true).
  The intended contract: once a pod receives SIGTERM it must not start any new
  guest invocation. A turn that had not yet been sent to the guest when SIGTERM
  arrived is recorded as "not_invoked" so the replacement pod can safely
  re-dispatch it.

  During a rollout today, one factory node stalled. Its turn was invoked by the
  terminating pod after SIGTERM, so it was not recorded as not_invoked, the new
  pod would not re-dispatch it, and the node sat on an uncertain hold until an
  operator cleared it. It is intermittent: we have seen it twice in about forty
  rollouts, and the other turns in flight on the same pod were recorded
  not_invoked as intended.

  Old pod (monolith-6c9f8d7b5-q2xkp) log around shutdown, times UTC:

    14:02:09.877 INFO    factory.execution.mcp: Reclaimed 2 stale claims from crashed replicas
    14:02:10.954 WARNING factory.execution.transport: embervm session listing timed out: ReadTimeout('')
    14:02:11.403 INFO    uvicorn.error: Shutting down
    14:02:11.419 INFO    uvicorn.error: Waiting for background tasks to complete. (CTRL+C to force quit)
    14:02:12.006 WARNING chat.bot: discord gateway closed (code 1000), not reconnecting during shutdown
    14:02:41.402 WARNING factory.execution.mcp: 1 agent turn executor(s) did not record an outcome before shutdown
    14:02:41.588 INFO    uvicorn.error: Finished server process [1]

  The kubelet sent SIGTERM at 14:02:11.40.

  EmberVM control-plane access log, same window:

    14:02:10.951 WARN  list sessions slow: 1.92s (store compaction)
    14:02:11.465 INFO  invoke accepted session=ev-9f31c2 caller=10.44.3.17 (monolith-6c9f8d7b5-q2xkp)
    14:02:41.870 WARN  invoke client disconnected session=ev-9f31c2 (guest continues)

  Find and fix the root cause so that a SIGTERM arriving at any point before a
  turn is actually sent to the guest stops it from being sent. Keep the change
  minimal: do not change behaviour when rollout handoff is disabled, and do
  not change the drain, hold or sweep logic.
