# hard: symptom-only debugging (#6695). The prompt carries the rollout contract,
# the pod's shutdown log (with unrelated noise and a red-herring transport
# timeout) and the control-plane access log, no file, function or span names.
# Author provenance: #6695 Agent brief; fix 76244f3cd87198013ef7b50b1a24d2f2a502514c.
# Synthetic excerpts reconstruct the parent's final admission read interleaving:
# SIGTERM arrives off-thread after the last fence check, before the POST.
# Times, identities and unrelated noise are invented; no production log or
# credentials are included. Logger labels are neutral and grading ignores logs.
# Hidden helpers and rollout neighbours are extracted from response_lost_test.py
# at the fix. Events and controlled wait callbacks expire drain grace without
# elapsed-time verdicts; real wait_for limits only guard hangs. Both the final
# admission read and receipt preparation must fence the physical POST.
