    tests:
      factory/execution/response_lost_test.py: |
        """Recovering a turn whose invoke response was lost, through the real executor.

        Every case drives ``mcp._execute_pending_message`` with the actual transport,
        store, admission and receipt modules against a file-backed database. Only the
        HTTP boundary is faked, so a recovered result has travelled the same parser,
        diff, artifact and permit path a synchronous response would have.
        """


        import asyncio


        import ast


        import base64


        from concurrent.futures import ThreadPoolExecutor


        from datetime import datetime, timedelta, timezone


        import json


        from pathlib import Path


        import signal


        from threading import BoundedSemaphore


        from types import SimpleNamespace


        import zlib


        import httpx


        import pytest


        from sqlmodel import Session, SQLModel, create_engine, select
        from sqlalchemy import event
        from factory.execution import models as execution_models


        from factory.execution import (
            admission,
            execution_api,
            mcp,
            result_receipts,
            store,
            transport,
        )


        from factory.execution.constants import RESPONSE_LOST, UNKNOWN_INVOCATION


        from factory.execution.models import (
            AgentCapacityPool,
            AgentCapacityReservation,
            AgentResultReceipt,
            AgentSession,
            AgentTurn,
            PendingMessage,
        )


        from core import db as core_db


        from factory.orchestration.models import SwarmNodeRun


        ARTIFACT_PATH = ".factory/result.json"


        _REAL_SCHEDULE_NEXT_MESSAGE = mcp._schedule_next_message


        _REAL_CLAIM_PENDING_MESSAGE = mcp._claim_pending_message_sync


        @pytest.fixture
        def database(tmp_path, monkeypatch):
            monkeypatch.setattr(mcp, "_rollout_shutdown_started", False)
            monkeypatch.setattr(mcp, "_rollout_drain_started", False)
            monkeypatch.setattr(mcp, "_rollout_handoffs", {})
            monkeypatch.setattr(mcp, "_inflight_tasks", set())
            monkeypatch.setenv("AGENT_ROLLOUT_HANDOFF_ENABLED", "false")
            engine = create_engine(
                f"sqlite:///{tmp_path / 'response-lost.db'}",
                connect_args={"check_same_thread": False, "timeout": 3},
                execution_options={
                    "schema_translate_map": {"agent_sessions": None, "swarm": None}
                },
            )
            @event.listens_for(engine, "connect")
            def database_clock(connection, _record):
                connection.create_function(
                    "current_timestamp", 0,
                    lambda: datetime.fromtimestamp(STARTED_AT / 1000, timezone.utc).strftime(
                        "%Y-%m-%d %H:%M:%S.%f"
                    ),
                )

            SQLModel.metadata.create_all(
                engine,
                tables=[
                    model.__table__
                    for model in (
                        AgentCapacityPool,
                        AgentCapacityReservation,
                        AgentResultReceipt,
                        AgentSession,
                        AgentTurn,
                        PendingMessage,
                        SwarmNodeRun,
                    )
                ],
            )
            for module in (admission, store, mcp, execution_api, result_receipts, core_db):
                monkeypatch.setattr(module, "get_engine", lambda: engine)
            monkeypatch.setenv("AGENT_RESULT_RECEIPTS_ENABLED", "true")
            monkeypatch.setenv("AGENT_RESULT_RECEIPT_ADOPTION_ENABLED", "false")
            monkeypatch.setenv("AGENT_RESPONSE_LOST_RECOVERY_ENABLED", "true")
            monkeypatch.setattr(transport, "RECEIPT_POLL_SECONDS", 0.005)
            observer_executor = ThreadPoolExecutor(max_workers=2)
            monkeypatch.setattr(transport, "_receipt_db_executor", observer_executor)
            monkeypatch.setattr(transport, "_receipt_db_slots", BoundedSemaphore(2))
            monkeypatch.setattr(mcp, "_schedule_next_message", lambda _sid: None)
            monkeypatch.setattr(execution_api, "_schedule_next_message", lambda _sid: None)
            mcp._negative_oracle_verdicts.clear()

            async def notify(*_args, **_kwargs):
                return None

            monkeypatch.setattr(mcp, "_notify_terminal", notify)
            try:
                yield engine
            finally:
                observer_executor.shutdown(wait=True, cancel_futures=True)
                mcp._negative_oracle_verdicts.clear()
                engine.dispose()


        def queue(engine, key="response-lost-project", *, tier="project"):
            with Session(engine) as db:
                agent = store.create_session(
                    db, key, "<guest>", "main", "luna", admission_tier=tier
                )
                sid = agent.id
                store.set_ember_session(db, sid, f"guest-{sid}", "guest-token", None)
                store.create_pending_message(db, sid, "implement the bounded task", "luna")
                return sid


        def snapshot(engine, sid):
            with Session(engine) as db:
                return {
                    "session": db.get(AgentSession, sid).model_dump(),
                    "pending": [
                        row.model_dump()
                        for row in db.exec(
                            select(PendingMessage).where(PendingMessage.session_id == sid)
                        ).all()
                    ],
                    "turns": [
                        row.model_dump()
                        for row in db.exec(
                            select(AgentTurn).where(AgentTurn.session_id == sid)
                        ).all()
                    ],
                    "permits": [
                        row.model_dump()
                        for row in db.exec(
                            select(AgentCapacityReservation)
                            .where(AgentCapacityReservation.session_id == sid)
                            .order_by(AgentCapacityReservation.pending_seq)
                        ).all()
                    ],
                }


        def native_record(cost=0.125, artifact=True):
            record = {
                "result": "Implemented the bounded task.",
                "terminal_reason": "end_turn",
                "stop_reason": "end_turn",
                "is_error": False,
                "session_id": "native-cli",
                "num_turns": 1,
                "total_cost_usd": cost,
                "duration_ms": 23,
                "activities": [],
                "usage": {"input_tokens": 3},
                "diff": {
                    "base_sha": "a" * 40,
                    "truncated": False,
                    "zlib_b64": base64.b64encode(zlib.compress(b"native diff bytes")).decode(),
                },
            }
            if artifact:
                record["artifact"] = {
                    "path": ARTIFACT_PATH,
                    "outcome": "ok",
                    "content_b64": base64.b64encode(b'{"status": "ok"}').decode(),
                }
            return record


        def fake_http(monkeypatch, post_handler, guest_state=None):
            """Fake only the HTTP boundary; every other owner is the real one."""
            requests = []

            class Client:
                def __init__(self, **_kwargs):
                    pass

                async def __aenter__(self):
                    return self

                async def __aexit__(self, *_args):
                    pass

                async def post(self, url, **kwargs):
                    request = httpx.Request("POST", url, **kwargs)
                    requests.append(request)
                    assert request.url.path.endswith("/invoke"), "unexpected new guest"
                    return await post_handler(request)

                async def get(self, url, **kwargs):
                    request = httpx.Request("GET", url, **kwargs)
                    if guest_state is None:
                        pytest.fail("this case must not read the control plane")
                    return httpx.Response(200, json=guest_state(), request=request)

                async def delete(self, *args, **kwargs):
                    pytest.fail("a held turn must never destroy its working guest")

            monkeypatch.setattr(transport.httpx, "AsyncClient", Client)
            monkeypatch.setattr(transport, "EMBERVM_URL", "https://ember.test")
            monkeypatch.setattr(mcp, "_transport", transport.EmberVmShimTransport())
            return requests


        STARTED_AT = 1788874047685


        def working_guest(sid, generation=0, started=STARTED_AT, last=None):
            """A control-plane view of a guest with an invoke still in progress."""

            def view():
                return {
                    "session_id": f"guest-{sid}",
                    "state": "running",
                    "generation": generation,
                    "invoke_started_at": started,
                    "last_invoke_at": last,
                }

            return view


        def publish(record, request):
            """Publish the native record the guest produced for this exact POST."""
            receipt = json.loads(request.content)["result_receipt"]
            body = json.dumps(record).encode()
            result_receipts.capture_result(receipt["id"], receipt["token"], body)
            return receipt


        def hold_of(sid):
            return store.read_response_lost_hold_sync(sid)


        def lose_the_response(database, monkeypatch, *, record=None, guest_state=None):
            """Run one real turn whose POST fails after the guest starts working."""
            sid = queue(database)

            async def handler(request):
                if record is not None:
                    publish(record, request)
                raise httpx.ReadError("original response lost", request=request)

            requests = fake_http(monkeypatch, handler, guest_state or working_guest(sid))
            asyncio.run(asyncio.wait_for(mcp._execute_pending_message(sid), 10))
            return sid, requests


        def assert_held(database, sid, reason):
            state = snapshot(database, sid)
            assert len(state["pending"]) == 1, "a held attempt keeps its queued prompt"
            assert state["pending"][0]["claimed_by_replica"] is not None
            assert state["pending"][0]["dispatch_count"] == 1
            assert len(state["turns"]) == 1
            turn = state["turns"][0]
            assert turn["terminal_reason"] == "interrupted"
            assert turn["stop_reason"] == RESPONSE_LOST
            assert turn["cost_usd"] is None
            recovery = json.loads(turn["usage_json"])["recovery"]
            assert recovery["invocation_phase"] == RESPONSE_LOST
            assert recovery["response_lost"]["reason"] == reason
            observation = json.loads(turn["usage_json"])["observation"]
            assert observation["schema"] == "turn-observation/1"
            assert observation["dispatch_count"] == 1
            assert observation["dispatched_at"] is not None
            # The permit is neither released nor made uncertain: the guest is still
            # holding the capacity this attempt was admitted for.
            assert [row["state"] for row in state["permits"]] == ["running"]
            assert state["permits"][0]["outcome"] is None
            assert state["session"]["status"] == "recovering"
            assert state["session"]["result_receipt_fence_id"] is None
            assert state["session"]["ember_session_id"] == f"guest-{sid}"
            return state


        def assert_unknown(database, sid):
            state = snapshot(database, sid)
            assert state["pending"] == []
            assert len(state["turns"]) == 1
            assert state["turns"][0]["terminal_reason"] == "error"
            assert state["turns"][0]["stop_reason"] == UNKNOWN_INVOCATION
            assert [row["state"] for row in state["permits"]] == ["uncertain"]
            assert state["session"]["status"] == "failed"
            return state


        def test_replica_shutdown_holds_the_turn_instead_of_recording_unknown(
            database, monkeypatch
        ):
            sid = queue(database)
            posted = asyncio.Event()

            async def handler(_request):
                posted.set()
                await asyncio.Event().wait()

            requests = fake_http(monkeypatch, handler)

            async def run():
                task = asyncio.create_task(mcp._execute_pending_message(sid))
                await asyncio.wait_for(posted.wait(), 5)
                task.cancel()
                with pytest.raises(asyncio.CancelledError):
                    await task

            asyncio.run(asyncio.wait_for(run(), 10))
            assert len(requests) == 1
            held = assert_held(database, sid, "replica_shutdown")
            assert hold_of(sid)["source"] == "executor"
            assert held["turns"][0]["seq"] == 1


        def test_sweep_recovers_shutdown_hold_without_invoke_stamps(database, monkeypatch):
            sid, requests = lose_the_response(database, monkeypatch)
            with Session(database) as db:
                turn = db.exec(select(AgentTurn).where(AgentTurn.session_id == sid)).one()
                usage = json.loads(turn.usage_json)
                usage["recovery"]["response_lost"]["generation"] = None
                usage["recovery"]["response_lost"]["invoke_started_at"] = None
                turn.usage_json = json.dumps(usage)
                db.add(turn)
                db.commit()
            view = {**working_guest(sid)(), "state": "evicted"}
            monkeypatch.setattr(mcp, "_observe_response_lost_guest", lambda _guest: view)
            assert mcp._adopt_response_lost_results() == []
            assert_unknown(database, sid)
            assert len(requests) == 1


        def test_rollout_drain_bounds_are_literal():
            assert mcp.INFLIGHT_DRAIN_SECONDS == 5.0
            assert mcp.SHUTDOWN_HOLD_LOCK_SECONDS == 2.0


        @pytest.mark.parametrize("enabled", [True, False])
        def test_sigterm_fences_scheduler_executor_and_claim_only_when_enabled(
            database, monkeypatch, enabled
        ):
            from factory.module import RolloutHandoffServer
            from uvicorn import Config

            monkeypatch.setenv("AGENT_ROLLOUT_HANDOFF_ENABLED", str(enabled).lower())
            server = RolloutHandoffServer(Config("unused:app"))
            server.handle_exit(signal.SIGTERM, None)
            assert server.should_exit is True
            assert mcp.rollout_shutdown_in_progress() is enabled
            started = []

            async def execute(sid):
                started.append(sid)

            async def schedule():
                with monkeypatch.context() as patch:
                    patch.setattr(mcp, "_execute_pending_message", execute)
                    _REAL_SCHEDULE_NEXT_MESSAGE(17)
                    await asyncio.sleep(0)

            asyncio.run(schedule())
            assert started == ([] if enabled else [17])
            claimed = []
            loaded = []
            monkeypatch.setattr(mcp, "_load_session", lambda sid: (loaded.append(sid), []))
            monkeypatch.setattr(
                store,
                "claim_pending_message_for_session_sync",
                lambda sid, owner: claimed.append((sid, owner)),
            )
            asyncio.run(mcp._execute_pending_message(18))
            assert loaded == ([] if enabled else [18])
            assert len(claimed) == (0 if enabled else 1)
            if not enabled:
                assert claimed[0][0] == 18
                assert claimed[0][1].startswith(f"{mcp._REPLICA_ID}:")
            claimed.clear()
            _REAL_CLAIM_PENDING_MESSAGE(19, "claim-owner")
            assert claimed == ([] if enabled else [(19, "claim-owner")])


        @pytest.mark.parametrize("enabled", [True, False])
        def test_shutdown_during_receipt_preparation_fences_the_physical_post(
            database, monkeypatch, enabled
        ):
            monkeypatch.setenv("AGENT_ROLLOUT_HANDOFF_ENABLED", str(enabled).lower())
            monkeypatch.setenv("AGENT_EXECUTOR_NOT_INVOKED_RECORD_ENABLED", "true")
            sid = queue(database)
            prepare = result_receipts.prepare_receipt
            recheck = admission.recheck
            admission_calls = []

            def checking(*args, **kwargs):
                admission_calls.append(args)
                return recheck(*args, **kwargs)

            monkeypatch.setattr(admission, "recheck", checking)

            def preparing(*args, **kwargs):
                receipt = prepare(*args, **kwargs)
                mcp.begin_rollout_shutdown()
                return receipt

            monkeypatch.setattr(result_receipts, "prepare_receipt", preparing)

            async def handler(request):
                return httpx.Response(200, json=native_record(artifact=False), request=request)

            requests = fake_http(monkeypatch, handler)

            async def run():
                if enabled:
                    with pytest.raises(asyncio.CancelledError):
                        await mcp._execute_pending_message(sid)
                else:
                    await mcp._execute_pending_message(sid)

            asyncio.run(run())
            assert len(admission_calls) == 1
            assert len(requests) == (0 if enabled else 1)
            state = snapshot(database, sid)
            assert state["permits"][0]["outcome"] == ("not_invoked" if enabled else "end_turn")


        @pytest.mark.parametrize("enabled", [True, False])
        def test_shutdown_during_final_admission_recheck_fences_the_physical_post(
            database, monkeypatch, enabled
        ):
            monkeypatch.setenv("AGENT_ROLLOUT_HANDOFF_ENABLED", str(enabled).lower())
            monkeypatch.setenv("AGENT_EXECUTOR_NOT_INVOKED_RECORD_ENABLED", "true")
            sid = queue(database)
            recheck = admission.recheck
            admission_calls = []

            def checking(*args, **kwargs):
                allowed = recheck(*args, **kwargs)
                admission_calls.append(args)
                # Enabled delivery checks twice, the final check follows receipt
                # preparation. SIGTERM arrives while that DB call is off-thread.
                if len(admission_calls) == (2 if enabled else 1):
                    mcp.begin_rollout_shutdown()
                return allowed

            monkeypatch.setattr(admission, "recheck", checking)

            async def handler(request):
                return httpx.Response(200, json=native_record(artifact=False), request=request)

            requests = fake_http(monkeypatch, handler)

            async def run():
                try:
                    await mcp._execute_pending_message(sid)
                except asyncio.CancelledError:
                    return True
                return False

            cancelled = asyncio.run(run())
            assert len(admission_calls) == (2 if enabled else 1)
            assert len(requests) == (0 if enabled else 1), (
                "shutdown during the final admission read must produce zero physical POSTs"
            )
            assert cancelled is enabled
            state = snapshot(database, sid)
            assert state["permits"][0]["outcome"] == ("not_invoked" if enabled else "end_turn")


        @pytest.mark.parametrize("enabled", [True, False])
        def test_roll_mid_invoke_hands_off_before_observer_cleanup_and_node_succeeds(
            database, monkeypatch, enabled
        ):
            """Two replica identities, one physical POST and the ordinary result writer."""
            from factory.module import RolloutHandoffServer
            from factory.orchestration import node_workflows as nodes, steps
            from uvicorn import Config

            monkeypatch.setenv("AGENT_ROLLOUT_HANDOFF_ENABLED", str(enabled).lower())
            monkeypatch.setenv("AGENT_RESULT_RECEIPT_ADOPTION_ENABLED", "true")
            monkeypatch.setattr(mcp, "_REPLICA_ID", "replica-A")
            sid = queue(database, key="factory:roll-mid-invoke")
            record = native_record()
            hold_writes = []
            mark_hold = store.mark_turn_response_lost_sync

            def recording_hold(*args, **kwargs):
                hold_writes.append((args, kwargs))
                return mark_hold(*args, **kwargs)

            monkeypatch.setattr(store, "mark_turn_response_lost_sync", recording_hold)

            async def scenario():
                posted = asyncio.Event()
                cleanup = asyncio.Event()
                release = asyncio.Event()
                drain_waits = []

                real_wait = mcp.asyncio.wait

                async def bounded_wait(tasks, *args, **kwargs):
                    # Only the executor drain carries an explicit timeout. The
                    # live receipt-observer wait uses FIRST_COMPLETED without
                    # one and must keep its original semantics.
                    timeout = kwargs.get("timeout", args[0] if args else None)
                    if timeout is None:
                        return await real_wait(tasks, *args, **kwargs)
                    # POST is held until cancellation, so drain cannot complete.
                    # The event proves the physical invocation precedes expiry.
                    await posted.wait()
                    drain_waits.append(timeout)
                    return set(), set(tasks)

                monkeypatch.setattr(mcp.asyncio, "wait", bounded_wait)

                # Focused regression: FIRST_COMPLETED waits carry no timeout
                # and must delegate to the real wait, not raise KeyError.
                probe_done = asyncio.Event()
                probe_done.set()
                probe_waiter = asyncio.create_task(probe_done.wait())
                probe_blocker = asyncio.create_task(asyncio.Event().wait())
                try:
                    probe_finished, probe_pending = await mcp.asyncio.wait(
                        {probe_waiter, probe_blocker},
                        return_when=asyncio.FIRST_COMPLETED,
                    )
                    assert probe_waiter in probe_finished
                    assert probe_blocker in probe_pending
                finally:
                    probe_blocker.cancel()
                    await asyncio.gather(probe_blocker, return_exceptions=True)
                    await asyncio.gather(probe_waiter, return_exceptions=True)

                async def handler(request):
                    posted.set()
                    try:
                        await asyncio.Event().wait()
                    except asyncio.CancelledError:
                        cleanup.set()
                        await release.wait()
                        raise

                requests = fake_http(monkeypatch, handler, working_guest(sid))
                live_records = []
                deliver = mcp._transport.deliver

                async def recording_delivery(*args, **kwargs):
                    live_records.append(kwargs["invocation_record"])
                    return await deliver(*args, **kwargs)

                monkeypatch.setattr(mcp._transport, "deliver", recording_delivery)
                # This fixture fences only the unrelated factory admission API.
                import factory.orchestration.api as api

                monkeypatch.setattr(api, "factory_session_allowed", lambda _key: True)
                _REAL_SCHEDULE_NEXT_MESSAGE(sid)
                task = next(iter(mcp._inflight_tasks))
                try:
                    await asyncio.wait_for(posted.wait(), 5)
                    assert len(requests) == 1
                    receipt = json.loads(requests[0].content)["result_receipt"]
                    dispatched = snapshot(database, sid)["pending"][0]
                    with Session(database) as db:
                        prepared = db.get(AgentResultReceipt, receipt["id"])
                        request_sha256 = prepared.request_sha256
                    assert live_records == (
                        [
                            {
                                "attempted": True,
                                "receipt_id": receipt["id"],
                                "guest_id": f"guest-{sid}",
                                "request_sha256": request_sha256,
                                "cli_session_id": None,
                                "artifact_path": None,
                            }
                        ]
                        if enabled
                        else [{}]
                    )
                    server = RolloutHandoffServer(Config("unused:app"))
                    server.handle_exit(signal.SIGTERM, None)
                    assert await mcp.drain_inflight_executors() == 0
                    assert drain_waits == [5.0]
                    await asyncio.wait_for(cleanup.wait(), 5)
                    if enabled:
                        assert len(hold_writes) == 1
                        assert hold_writes[0][0] == (sid, 1, dispatched["claimed_by_replica"], 1)
                        assert hold_writes[0][1]["lock_timeout_seconds"] == 2.0
                        state = assert_held(database, sid, "replica_shutdown")
                        hold = hold_of(sid)
                        assert hold["receipt_id"] == receipt["id"]
                        assert hold["guest_id"] == f"guest-{sid}"
                        assert hold["dispatch_count"] == 1
                        assert hold["dispatch_count"] == dispatched["dispatch_count"]
                        assert hold["claim_owner"] == dispatched["claimed_by_replica"]
                        assert hold["claim_owner"].startswith("replica-A:")
                        assert hold["source"] == "executor"
                        assert hold["request_sha256"] == request_sha256
                        assert state["turns"][0]["stop_reason"] != UNKNOWN_INVOCATION
                        before = set(mcp._inflight_tasks)
                        _REAL_SCHEDULE_NEXT_MESSAGE(sid)
                        assert mcp._inflight_tasks == before
                        # The second lifecycle hook must not cancel cleanup again.
                        assert await mcp.drain_inflight_executors() == 0
                        assert not task.done()
                        monkeypatch.setattr(mcp, "_REPLICA_ID", "replica-B")
                        monkeypatch.setattr(mcp, "_rollout_shutdown_started", False)
                        publish(record, requests[0])
                        outcome = await asyncio.to_thread(
                            nodes._recover_response_lost, {"artifact_path": ARTIFACT_PATH}, sid
                        )
                        assert outcome == {
                            "status": "adopted",
                            "seq": 1,
                            "receipt_id": receipt["id"],
                        }
                        state = snapshot(database, sid)
                        assert state["pending"] == []
                        assert state["session"]["status"] == "completed"
                        assert state["permits"][0]["state"] == "settled"
                        assert state["permits"][0]["outcome"] == "end_turn"
                        assert state["turns"][0]["terminal_reason"] == "end_turn"
                        assert state["turns"][0]["cost_usd"] == 0.125
                    else:
                        # Today's cancellation waits for observer cleanup before a hold.
                        assert hold_writes == []
                        assert hold_of(sid) is None
                        assert snapshot(database, sid)["turns"] == []
                    release.set()
                    with pytest.raises(asyncio.CancelledError):
                        await asyncio.wait_for(task, 5)
                    if not enabled:
                        assert_held(database, sid, "replica_shutdown")
                    else:
                        state = snapshot(database, sid)
                        assert state["session"]["status"] == "completed"
                        assert state["permits"][0]["outcome"] == "end_turn"
                    assert len(requests) == 1
                finally:
                    # A failing assertion must not strand the blocked observer.
                    release.set()
                    if not task.done():
                        task.cancel()
                    try:
                        await asyncio.wait_for(task, 5)
                    except (asyncio.CancelledError, TimeoutError):
                        pass

            asyncio.run(scenario())
            if enabled:
                monkeypatch.setattr(nodes, "poll_turn", steps.poll_turn.__wrapped__)
                monkeypatch.setattr(nodes, "observe_clock", steps.observe_clock.__wrapped__)
                monkeypatch.setattr(
                    nodes, "_read_turn_artifact", nodes._read_turn_artifact.__wrapped__
                )
                monkeypatch.setattr(
                    nodes,
                    "_start_node_session",
                    lambda *_args: {"started": True, "session_id": sid},
                )
                monkeypatch.setattr(nodes, "read_branch_head", lambda *_args: "a" * 40)
                monkeypatch.setattr(
                    nodes, "_cleanup_node", lambda *_args: {"status": "completed"}
                )
                result = nodes.execute_node.__wrapped__(
                    {
                        "task_id": "roll-mid-invoke",
                        "node_key": "implement",
                        "attempt": 1,
                        "repo": "org/repo",
                        "branch": "factory/roll-mid-invoke",
                        "prompt": "Implement.",
                        "model": "luna",
                        "max_cost_usd": 2.0,
                        "max_attempts": 1,
                        "turn_timeout_seconds": 600,
                        "workflow_id": "roll-mid-invoke-parent",
                        "artifact_path": ARTIFACT_PATH,
                        "artifact_schema": {
                            "type": "object",
                            "properties": {"status": {"const": "ok"}},
                            "required": ["status"],
                            "additionalProperties": False,
                        },
                    }
                )
                assert result["status"] == "succeeded"
                assert result["value"] == {"status": "ok"}
                assert result["reason"] is None


        @pytest.mark.parametrize("enabled", [True, False])
        def test_rollout_gives_non_adoptable_turns_a_bounded_grace_only_when_enabled(
            database, monkeypatch, enabled
        ):
            monkeypatch.setenv("AGENT_ROLLOUT_HANDOFF_ENABLED", str(enabled).lower())
            waits = []

            async def scenario():
                finish = asyncio.Event()
                task = asyncio.create_task(finish.wait())
                mcp._inflight_tasks.add(task)

                async def wait(tasks, *, timeout):
                    waits.append(timeout)
                    assert task.cancelling() == (0 if enabled else 1)
                    finish.set()
                    await asyncio.gather(*tasks, return_exceptions=True)
                    return set(tasks), set()

                monkeypatch.setattr(mcp.asyncio, "wait", wait)
                assert await mcp.drain_inflight_executors() == 1
                assert task.cancelled() is not enabled

            asyncio.run(scenario())
            assert waits == ([5.0, 5.0] if enabled else [5.0])


