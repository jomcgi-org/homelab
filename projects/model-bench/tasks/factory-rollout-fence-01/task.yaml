id: factory-rollout-fence-01
version: v2
class: code-fix
# hard: symptom-only debugging (#6695). The prompt carries the rollout contract,
# the pod's shutdown log (with unrelated noise and a red-herring transport
# timeout) and the control-plane access log, no file, function or span names.
# The model has to find the turn executor in a ~500-file backend, see that the
# SIGTERM fence is checked before the off-thread admission reads but not after
# them, and close that window without breaking the 19 neighbouring
# shutdown/handoff tests (pass-to-pass guards against an over-broad fence).
# Real fix 76244f3cd ("fence rollout shutdown after admission reads"); the
# snapshot pins its parent. The gold test file is the fix commit's
# response_lost_test.py; only the rollout/shutdown subset runs because the rest
# of that file needs dbos, which the verifier venv does not carry.
tier: hard
