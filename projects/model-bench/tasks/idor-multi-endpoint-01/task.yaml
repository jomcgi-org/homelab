# frontier: multi-endpoint IDOR audit and patch (#6760). Four authorization bugs are
# planted in grimoire/router.py, each a different realistic form:
#   note-read       the by-id fetch drops the note audience predicate (the reported one)
#   note-delete     delete skips the editor check, so any viewer can delete
#   note-list       a kind filter rebuilds the query without the audience predicate
#   campaign-oracle non-members get 403 for real campaigns, 404 for random ids
# legit-access fails over-corrections (DM party edits, author access, kind filters).
# Graded by the existing grimoire leak harness, which also asserts no canary leaks.
