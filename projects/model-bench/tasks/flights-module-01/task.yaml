id: flights-module-01
version: v1
class: code-fix
tier: standard
mode: agentic
# Full monolith backend snapshot: the model adds a brand-new feature domain to the real
# tree, mirroring how real domains (campsites, ships, ...) expose register(app). The gold
# test mounts only the new router on a minimal app (never app.main, which pulls OTEL/MCP/
# Discord and is not import-safe), exactly like campsites-region-rollup-01.
snapshot:
  preset: monolith-backend
  commit: 40e36a2c2c142aade3a4f95e8e85e85ac6ade943
agent:
  max_turns: 40
prompt: |
  You are working in a snapshot of a real FastAPI monolith backend. Every feature is a
  top-level Python package that exposes a register(app) function mounting its APIRouter,
  and app/main.py's create_app() wires the domains together. Study a worked example, e.g.
  the campsites domain (campsites/__init__.py exposes register(app); campsites/router.py
  defines an APIRouter), and how create_app() in app/main.py registers domains.

  Build a NEW `flights` domain the same way and wire it in. Create:
    - flights/mock_data.py exposing FLIGHTS, the exact list below (a mock flight feed).
    - flights/router.py with an APIRouter at prefix /api/flights.
    - flights/__init__.py exposing register(app) that mounts the router, following the
      campsites example.
  Then register the flights domain in app/main.py's create_app(). Do not change or break
  any existing domain.

  FLIGHTS (put this verbatim in flights/mock_data.py):

      FLIGHTS = [
          {"flight_no": "BA100", "origin": "LHR", "dest": "JFK", "scheduled_dep": "2026-07-01T09:00:00", "actual_dep": "2026-07-01T09:05:00", "status": "scheduled"},
          {"flight_no": "BA101", "origin": "LHR", "dest": "CDG", "scheduled_dep": "2026-07-01T10:00:00", "actual_dep": "2026-07-01T10:30:00", "status": "scheduled"},
          {"flight_no": "BA102", "origin": "LHR", "dest": "AMS", "scheduled_dep": "2026-07-01T11:00:00", "actual_dep": None, "status": "cancelled"},
          {"flight_no": "U201", "origin": "EDI", "dest": "LHR", "scheduled_dep": "2026-07-01T08:00:00", "actual_dep": "2026-07-01T08:00:00", "status": "scheduled"},
          {"flight_no": "U202", "origin": "EDI", "dest": "DUB", "scheduled_dep": "2026-07-01T09:00:00", "actual_dep": "2026-07-01T09:20:00", "status": "scheduled"},
          {"flight_no": "FR301", "origin": "GLA", "dest": "STN", "scheduled_dep": "2026-07-01T07:00:00", "actual_dep": "2026-07-01T07:10:00", "status": "scheduled"},
      ]

  Each record has flight_no, origin and dest (IATA codes), scheduled_dep and actual_dep
  (ISO 8601 datetime strings; actual_dep is None for a cancelled flight), and status.

  Add GET /api/flights/delays returning per-ORIGIN-airport delay statistics as a JSON
  list. Define a flight's delay in minutes as (actual_dep - scheduled_dep) rounded to
  whole minutes. For each origin airport compute:
    - airport: the IATA code.
    - flights: total number of flights from that origin.
    - cancelled: number with no actual departure (actual_dep is None).
    - delayed: number of non-cancelled flights whose delay is MORE THAN 15 minutes.
    - on_time_pct: of the non-cancelled flights, the percentage that are NOT delayed
      (delay <= 15 minutes), as a float rounded to 1 decimal place; 0.0 if there are no
      non-cancelled flights.
    - avg_delay_min: the mean delay in minutes over the non-cancelled flights, rounded to
      1 decimal place; 0.0 if there are none.
  Return the airports sorted by flights descending, then airport code ascending.
verifier:
  kind: pytest
  args:
    tests:
      flights_test.py: |
        # Mount ONLY the new flights router on a minimal app. Never import app.main: in
        # the real monolith it pulls OTEL / the /mcp app / Discord and is not import-safe.
        from fastapi import FastAPI
        from fastapi.testclient import TestClient

        from flights.router import router

        app = FastAPI()
        app.include_router(router)
        client = TestClient(app)

        EXPECTED = [
            {"airport": "LHR", "flights": 3, "delayed": 1, "cancelled": 1, "on_time_pct": 50.0, "avg_delay_min": 17.5},
            {"airport": "EDI", "flights": 2, "delayed": 1, "cancelled": 0, "on_time_pct": 50.0, "avg_delay_min": 10.0},
            {"airport": "GLA", "flights": 1, "delayed": 0, "cancelled": 0, "on_time_pct": 100.0, "avg_delay_min": 10.0},
        ]


        def test_delays_route_is_wired():
            assert client.get("/api/flights/delays").status_code == 200


        def test_delays_aggregate_matches_mock():
            assert client.get("/api/flights/delays").json() == EXPECTED

    targets: ["flights_test.py"]
    timeout_s: 180
