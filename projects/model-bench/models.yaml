models:
  # Frontier ceiling. Run via the local `claude` CLI under the Max subscription
  # (provider: claude-code), not OpenRouter: renting Claude per-token to produce a
  # "cloud cost" row is spend that would never actually happen, so anchors are a free
  # capability ceiling (pass + wall-time), not a ranked, cost-bearing competitor.
  - id: anthropic/claude-opus-4.8
    role: anchor
    provider: claude-code
    status: active
  - id: anthropic/claude-sonnet-4.6
    role: anchor
    provider: claude-code
    status: active
  - id: qwen/qwen3.6-27b
    status: active
  # In-cluster llama.cpp Qwen3.8-27B (Unsloth Q4_K_M on node-4). Reach it with
  # `kubectl -n inference port-forward svc/inference 18080:8080` and
  # `--base-url http://127.0.0.1:18080/v1`. The served alias is still
  # qwen3.6-27b so existing callers do not have to change. xhigh is the
  # highest reasoning_effort Qwen 3.8's template accepts. experimental so a
  # bare `bench run` does not send this slug to OpenRouter. Cost is $0.
  - id: qwen/qwen3.8-27b
    display_name: qwen3.8-27b
    status: experimental
    api_model: qwen3.6-27b
    extra_body:
      chat_template_kwargs:
        reasoning_effort: xhigh
    params:
      max_tokens: 16384
  - id: qwen/qwen3.6-35b-a3b
    status: active
  - id: qwen/qwen3-coder-30b-a3b-instruct
    display_name: qwen3-coder-30b
    status: active
  - id: mistralai/devstral-2512
    status: active
  - id: qwen/qwen-2.5-coder-32b-instruct
    display_name: qwen-2.5-coder-32b
    status: retired
    retired_reason:
      "0/15 agentic: OpenRouter provider 4xxes on tool-calling requests,
      cannot participate"
    retired_date: "2026-07-01"
  - id: google/gemma-4-31b-it
    display_name: gemma-4-31b
    status: active
  - id: google/gemma-4-26b-a4b-it
    display_name: gemma-4-26b
    status: active
  - id: deepseek/deepseek-v4-flash
    status: active
  - id: deepseek/deepseek-v4-pro
    status: active
  - id: qwen/qwen3-coder-next
    status: active
  - id: z-ai/glm-4.7
    status: active
  - id: z-ai/glm-5.2
    status: active
  # Cloud-API reference (not self-hostable). Demoted pending a cost re-check: it billed
  # ~$3.14 in a single agentic run, i.e. Opus-tier spend despite the "flash" tier, which
  # smells like a token blow-up in the 50-turn loop. Re-promote once that is understood.
  - id: google/gemini-3.5-flash
    status: experimental
  - id: qwen/qwen3-coder:free
    status: experimental
  # Free code/general models (zero OpenRouter cost, so pure capability signal). Both
  # advertise tool-calling, so they should drive the agentic loop; watch for the free-tier
  # provider tool-call 4xx failure mode that retired qwen-2.5-coder.
  - id: cohere/north-mini-code:free
    display_name: north-mini-code
    status: active
  - id: tencent/hy3:free
    display_name: hy3
    status: active
  # Cheap cloud reference: $0.32/$1.28 per 1M, 1M context, tool-calling.
  - id: qwen/qwen3.7-plus
    status: active
