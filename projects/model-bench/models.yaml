models:
  # Frontier ceiling. Run via the local `claude` CLI under the Max subscription
  # (provider: claude-code), not OpenRouter: renting Claude per-token to produce a
  # "cloud cost" row is spend that would never actually happen, so anchors are a free
  # capability ceiling (pass + wall-time), not a ranked, cost-bearing competitor.
  # The Haiku/Sonnet/Opus ladder is also what `bench calibrate` runs to admit a task
  # to the frontier tier. api_model is the CLI `--model` value.
  - id: anthropic/claude-haiku-4.5
    display_name: claude-haiku-4.5
    api_model: claude-haiku-4-5-20251001
    role: anchor
    provider: claude-code
    status: active
  # Anchor twin of the OpenRouter anthropic/claude-sonnet-5.5 row below: same model,
  # run through Claude Code instead of the bench tool loop, so it needs its own id.
  - id: anthropic/claude-sonnet-5.5-cc
    display_name: claude-sonnet-5.5 (cc)
    api_model: claude-sonnet-5-5
    role: anchor
    provider: claude-code
    status: active
  - id: anthropic/claude-opus-5.5
    display_name: claude-opus-5.5
    api_model: claude-opus-5-5
    role: anchor
    provider: claude-code
    status: active
  - id: anthropic/claude-opus-4.8
    role: anchor
    provider: claude-code
    status: retired
    retired_reason: "ran the claude CLI default model, not opus-4.8: anchors were not pinned with --model before #6704"
    retired_date: "2026-10-02"
  - id: anthropic/claude-sonnet-4.6
    role: anchor
    provider: claude-code
    status: retired
    retired_reason: "ran the claude CLI default model, not sonnet-4.6: anchors were not pinned with --model before #6704"
    retired_date: "2026-10-02"
  - id: qwen/qwen3.6-27b
    status: active
  # In-cluster llama.cpp Qwen3.8-27B (Unsloth Q4_K_M on node-4). Reach it with
  # `kubectl -n inference port-forward svc/inference 18080:8080` and
  # `--base-url http://127.0.0.1:18080/v1`. The served alias is still
  # qwen3.6-27b so existing callers do not have to change. xhigh is the
  # highest reasoning_effort Qwen 3.8's template accepts. experimental so a
  # bare `bench run` does not send this slug to OpenRouter.
  - id: qwen/qwen3.8-27b
    display_name: qwen3.8-27b
    status: experimental
    self_hosted: true
    # Factory rate for the local qwen lane (shared/pricing.py, qwen alias).
    price:
      input_per_million: 0.10
      output_per_million: 0.20
    api_model: qwen3.6-27b
    extra_body:
      chat_template_kwargs:
        reasoning_effort: xhigh
    params:
      max_tokens: 16384
  # Bare-metal FreeToken Qwen3.8-Flash-Next (125B-A6B, expert-granular tier) on
  # node-4, reached over the tailnet on the private port. Served alias remains
  # qwen3.6-27b. experimental so bare `bench run` never sends this slug to
  # OpenRouter.
  - id: qwen/qwen3.8-flash-next
    display_name: qwen3.8-flash-next-local
    status: experimental
    self_hosted: true
    # Factory rate for the local qwen lane (shared/pricing.py, qwen alias).
    price:
      input_per_million: 0.10
      output_per_million: 0.20
    api_model: qwen3.6-27b
    extra_body:
      chat_template_kwargs:
        reasoning_effort: low
    params:
      max_tokens: 16384
  - id: qwen/qwen3.6-35b-a3b
    status: active
  - id: qwen/qwen3-coder-30b-a3b-instruct
    display_name: qwen3-coder-30b
    status: active
  - id: mistralai/devstral-2512
    status: active
  - id: qwen/qwen-2.5-coder-32b-instruct
    display_name: qwen-2.5-coder-32b
    status: retired
    retired_reason:
      "0/15 agentic: OpenRouter provider 4xxes on tool-calling requests,
      cannot participate"
    retired_date: "2026-07-01"
  - id: google/gemma-4-31b-it
    display_name: gemma-4-31b
    status: active
  - id: google/gemma-4-26b-a4b-it
    display_name: gemma-4-26b
    status: active
  - id: deepseek/deepseek-v4-flash
    status: active
  - id: deepseek/deepseek-v4-pro
    status: active
  - id: qwen/qwen3-coder-next
    status: active
  - id: z-ai/glm-4.7
    status: active
  - id: z-ai/glm-5.2
    status: active
  # Cloud-API reference (not self-hostable). Demoted pending a cost re-check: it billed
  # ~$3.14 in a single agentic run, i.e. Opus-tier spend despite the "flash" tier, which
  # smells like a token blow-up in the 50-turn loop. Re-promote once that is understood.
  - id: google/gemini-3.5-flash
    status: experimental
  - id: qwen/qwen3-coder:free
    status: experimental
  # Free code/general models (zero OpenRouter cost, so pure capability signal). Both
  # advertise tool-calling, so they should drive the agentic loop; watch for the free-tier
  # provider tool-call 4xx failure mode that retired qwen-2.5-coder.
  - id: cohere/north-mini-code:free
    display_name: north-mini-code
    status: active
  - id: tencent/hy3:free
    display_name: hy3
    status: active
  # Cheap cloud reference: $0.32/$1.28 per 1M, 1M context, tool-calling.
  - id: qwen/qwen3.7-plus
    status: active
  # Cheap and mid-range models picked from Artificial Analysis's intelligence
  # index vs cost per task (2026-10-02). Experimental so a bare `bench run` does
  # not bill them; run one with `--model <id>`. Effort is OpenRouter's unified
  # `reasoning.effort`, one setting per model, chosen from the AA rows that sit on
  # or near its cost frontier.
  #
  # Cheap tier.
  # GPT-6 Luna: the factory's `luna`. AA 32.9 at $0.029/task (high).
  - id: openai/gpt-6-luna
    display_name: gpt-6-luna
    status: experimental
    extra_body:
      reasoning:
        effort: high
  # MiMo-V2.6-Flash: open weights, 309B/15B active. AA 37.9 at $0.062/task.
  # OpenRouter exposes no effort levels for MiMo, so it runs at the default.
  - id: xiaomi/mimo-v2.6-flash
    display_name: mimo-v2.6-flash
    status: experimental
  # Muse Spark 1.3 contributor tier: the factory's rate for the local qwen lane
  # ($0.10/$0.20). Full-price Muse Spark 1.3 is AA 45.1 at $1.37/task (xhigh).
  # OpenRouter gates it behind an account attestation, so it runs against Meta's
  # own OpenAI-compatible API, which takes a top-level `reasoning_effort`:
  #   --base-url https://api.meta.ai/v1 --header "Authorization: Bearer $META_SPARK_API_KEY"
  - id: meta/muse-spark-1.3-contributor
    display_name: muse-spark-1.3
    status: experimental
    price:
      input_per_million: 0.10
      output_per_million: 0.20
    api_model: muse-spark-1.3-contributor
    extra_body:
      reasoning_effort: xhigh
  # DeepSeek V4.1 Flash: open weights, successor to v4-flash. AA 39.5 at
  # $0.265/task (max), 209 tok/s.
  - id: deepseek/deepseek-v4.1-flash
    display_name: deepseek-v4.1-flash
    status: experimental
    extra_body:
      reasoning:
        effort: max
  # GLM 5.3 Flash: open weights, successor to the GLM rows. AA 41.8 at
  # $0.253/task; max is its default effort.
  - id: z-ai/glm-5.3-flash
    display_name: glm-5.3-flash
    status: experimental
    extra_body:
      reasoning:
        effort: max
  # Ternary Bonsai 2 27B: a ternary Qwen3.8-27B, small enough for the 4090, so
  # it sits beside the qwen3.8-27b row. Not on AA yet.
  - id: prism-ml/ternary-bonsai-2-27b
    display_name: bonsai-2-27b
    status: experimental
    extra_body:
      reasoning:
        effort: xhigh
  #
  # Mid-range tier: dearer per token, but faster and often fewer turns, which is
  # what wall-time and cost per task measure.
  # GPT-6.1 Sol: AA 47.8 at $0.214/task (medium), the best mid-range value.
  - id: openai/gpt-6.1-sol
    display_name: gpt-6.1-sol
    status: experimental
    extra_body:
      reasoning:
        effort: medium
  # Claude Sonnet 5.5 through OpenRouter in the bench's own tool loop, so its
  # turns and tokens compare with the candidates (the Claude Code anchors run in
  # their own harness). AA 46.7 at $1.08/task (high), 101 tok/s.
  - id: anthropic/claude-sonnet-5.5
    display_name: claude-sonnet-5.5
    status: experimental
    extra_body:
      reasoning:
        effort: high
  # MiMo-V2.6-Pro: open weights, 1T+. AA 46.3 at $0.133/task, slow (44 tok/s).
  - id: xiaomi/mimo-v2.6-pro
    display_name: mimo-v2.6-pro
    status: experimental
