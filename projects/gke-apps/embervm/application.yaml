apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embervm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Kargo will not update an Application that has not named the Stage allowed
    # to touch it. Without this the promotion errors with "is not authorized"
    # and the pin never moves, which is exactly how this cluster's first three
    # promotions failed. Mirrors projects/embervm/deploy/application.yaml.
    kargo.akuity.io/authorized-stage: kargo-embervm:prod
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: embervm
      # This pin is a deliberate bootstrap floor. Write-back does NOT maintain gke-apps pins.
      # Verify a fresh pin by pulling the tag and grepping the change: the registry
      # has served STALE pre-gate content under a fresh-looking tag before (#5507).
      # 0.55.4 verified by pulling the chart (digest 10a7ca50, matching the deploy
      # log's push): carries the meta-spark egress credential template, closing the
      # values-ahead-of-chart gap opened when the muse spark values landed at HEAD.
      targetRevision: 0.55.4
      helm:
        releaseName: embervm
        valueFiles:
          - $values/projects/embervm/deploy/values.yaml
          - $values/projects/embervm/deploy/values-gke.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: embervm
  ignoreDifferences:
    # The BrickController owns each brick Deployment's replica count; the chart
    # value is only the count at FIRST create. Without this entry selfHeal
    # reverted every demand-driven scale-up back to the git floor (216 auto-heal
    # syncs on 2026-08-31), killing the scaled-up bricks and every guest in them
    # each cycle. Mirrors the home app (projects/embervm/deploy/application.yaml),
    # which carries the full history of this rule.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The token broker owns the OAuth grant Secret's DATA (rotating refresh
    # token bundle); without this entry selfHeal reverts it to the empty chart
    # declaration, silently revoking the grant. One entry PER GRANT; mirrors
    # the home app and the loud contract in chart/values.yaml.
    - kind: Secret
      name: embervm-oauth-grant-codex-cluster
      jsonPointers:
        - /data
    # agent-mcp renders only on the hub (grants are overridden in
    # deploy/values-gke.yaml), so the home application.yaml carries no twin.
    - kind: Secret
      name: embervm-oauth-grant-agent-mcp
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
