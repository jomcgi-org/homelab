apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embervm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: embervm
      # This pin is a deliberate bootstrap floor. Write-back does NOT maintain gke-apps pins.
      # 0.49.30 carries the tokenBroker.networkPolicy gate (#5506); the
      # registry's 0.49.29 tag is STALE pre-gate content (see #5507), do not
      # pin it. Verify a fresh pin by pulling the tag and grepping the change.
      targetRevision: 0.49.30
      helm:
        releaseName: embervm
        valueFiles:
          - $values/projects/embervm/deploy/values.yaml
          - $values/projects/embervm/deploy/values-gke.yaml
        ignoreMissingValueFiles: false
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: embervm
  ignoreDifferences:
    # The BrickController owns each brick Deployment's replica count; the chart
    # value is only the count at FIRST create. Without this entry selfHeal
    # reverted every demand-driven scale-up back to the git floor (216 auto-heal
    # syncs on 2026-08-31), killing the scaled-up bricks and every guest in them
    # each cycle. Mirrors the home app (projects/embervm/deploy/application.yaml),
    # which carries the full history of this rule.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The token broker owns the OAuth grant Secret's DATA (rotating refresh
    # token bundle); without this entry selfHeal reverts it to the empty chart
    # declaration, silently revoking the grant. One entry PER GRANT; mirrors
    # the home app and the loud contract in chart/values.yaml.
    - kind: Secret
      name: embervm-oauth-grant-codex-cluster
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
