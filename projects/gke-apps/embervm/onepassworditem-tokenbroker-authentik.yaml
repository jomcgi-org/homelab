# The standing credential (the authentik app password for the
# `kg-agent-sa` service account) that the token broker exchanges for short-lived
# agent tokens (#5633 step 1f); it lives in the gke-apps hand list rather than
# the embervm chart so it deploys at HEAD, decoupled from the Kargo chart
# promotion; the 1Password operator syncs it into a Secret of the same name
# whose key is the item's field label `app-password`.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: embervm-authentik-agent
  namespace: embervm
spec:
  itemPath: "vaults/k8s-homelab/items/embervm-authentik-agent"
