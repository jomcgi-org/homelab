apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scotland-connector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Kargo will not update an Application that has not named the Stage allowed
    # to touch it. Without this the promotion errors with "is not authorized"
    # and the pin never moves.
    kargo.akuity.io/authorized-stage: kargo-scotland-connector:prod
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: scotland-connector
      # Kargo owns the live hub revision. This git pin is a manually maintained
      # bootstrap/revert floor; chart-version write-back does not advance it.
      targetRevision: 0.1.3
      helm:
        releaseName: scotland-connector
        valueFiles:
          - $values/projects/scotland-connector/deploy/values.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  # HOME-475 retired this copy: the values render `replicas: 0` and no HPA.
  # So this Application has no ignoreDifferences on /spec/replicas and no
  # RespectIgnoreDifferences. With them, Argo CD would keep the live pod count
  # after it prunes the HPA. These fields sit outside spec.sources, so the hub
  # root applies this change, unlike a change to a values path.
  destination:
    server: https://kubernetes.default.svc
    namespace: scotland-connector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
