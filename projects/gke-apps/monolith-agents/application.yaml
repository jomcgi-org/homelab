apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith-agents
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Kargo owns the chart revision, as for monolith and monolith-public.
    # The root Application preserves that field across its own syncs.
    kargo.akuity.io/authorized-stage: kargo-monolith-agents:prod
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith-agents
      # Bootstrap floor only. Kargo discovers and promotes published versions;
      # write-back does not maintain gke-apps pins.
      targetRevision: 0.7.36
      helm:
        releaseName: monolith-agents
        valueFiles:
          - $values/projects/monolith-agents/deploy/values.yaml
          - $values/projects/monolith-agents/deploy/values-gke.yaml
        ignoreMissingValueFiles: false
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
