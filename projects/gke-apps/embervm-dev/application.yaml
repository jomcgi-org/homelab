apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embervm-dev
  namespace: argocd
  # NO resources-finalizer, unlike production's Application. Both releases
  # render the cluster-scoped workloads.embervm.dev CRD and ArgoCD tracks it to
  # whichever synced last, so a cascading delete of this Application could
  # delete the CRD and with it every production Workload CR.
  annotations:
    # Kargo will not update an Application that has not named the Stage allowed
    # to touch it; without this the dev Promotion errors "is not authorized".
    # Mirrors projects/embervm/dev/deploy/application.yaml (the home app).
    kargo.akuity.io/authorized-stage: kargo-embervm:dev
    # Same wave as production's embervm Application.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: embervm
      # Bootstrap floor only: Kargo's dev stage owns this field on the live
      # object (projects/platform/kargo/values.yaml), and the hub root carries
      # the matching ignoreDifferences entry. 0.94.1 is the first chart with
      # noded.firecracker.sharedScratch, which dev-gke relies on: on 0.93.13 the
      # brick fails its mount by design and the first auto-sync waits on it
      # indefinitely. Verified by pulling the chart (digest 5d7db488) and
      # rendering both dev value files against it.
      # Raised to 0.99.2 (digest 4a278219, both dev value files render) while
      # the live hub root lacks its embervm-dev ignoreDifferences entry: until
      # that manual apply lands, every root sync stamps this floor back over
      # Kargo's promotion, so the floor must be a chart carrying the #6422
      # checker fix for dev to verify anything and pass Freight to prod.
      targetRevision: 0.99.2
      helm:
        releaseName: embervm-dev
        # dev values first, then the hub overlay for dev. NOT production's
        # deploy/values-gke.yaml: that file carries production identities (see
        # the header of dev/deploy/values-gke.yaml).
        valueFiles:
          - $values/projects/embervm/dev/deploy/values.yaml
          - $values/projects/embervm/dev/deploy/values-gke.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: embervm-dev
  ignoreDifferences:
    # The BrickController owns each brick Deployment's replica count; see the
    # production twin in projects/gke-apps/embervm/application.yaml.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The token broker owns the OAuth grant Secret's DATA. One entry per grant
    # dev renders (codex-cluster only, the chart default).
    - kind: Secret
      name: embervm-oauth-grant-codex-cluster
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
