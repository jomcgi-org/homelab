apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith-public
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Kargo will not update an Application that has not named the Stage allowed
    # to touch it. Without this the promotion errors with "is not authorized"
    # and the pin never moves, which is exactly how this cluster's first three
    # promotions failed. Mirrors projects/monolith-public/deploy/application.yaml.
    kargo.akuity.io/authorized-stage: kargo-monolith-public:prod
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith-public
      # This pin is a deliberate bootstrap floor. Write-back does NOT maintain gke-apps pins.
      # The cutover window (issue #5458) advances it manually from this frozen baseline.
      targetRevision: 0.401.29
      helm:
        releaseName: monolith-public
        valueFiles:
          - $values/projects/monolith-public/deploy/values.yaml
          - $values/projects/monolith-public/deploy/values-gke.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  # The web HPA owns the live replica count, and the shared deployment template
  # renders `replicas:` unconditionally, so without this ArgoCD reads every
  # scale-out as drift and selfHeal scales it straight back. Scoped to the one
  # Deployment that has a controller: projects/platform/argocd/values.yaml
  # records why a fleet-wide replica ignore was removed, namely that a chart
  # which DOES render replicas had its value silently dropped while the
  # Application still reported Synced.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: monolith-public-web
      namespace: monolith-public
      jsonPointers:
        - /spec/replicas
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-public
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Suppressing the diff is not the same as not applying the value: without
      # this ArgoCD keeps stamping the rendered replicas back on every sync and
      # the HPA's scale-out is undone within a sync interval.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
