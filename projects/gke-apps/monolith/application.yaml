apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith
      # This pin is a deliberate bootstrap floor. Write-back does NOT maintain gke-apps pins.
      # The cutover window (issue #5458) advances it manually from this frozen baseline.
      targetRevision: 0.400.0
      helm:
        releaseName: monolith
        valueFiles:
          - $values/projects/monolith/deploy/values.yaml
          - $values/projects/monolith/deploy/values-gke.yaml
        ignoreMissingValueFiles: false
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
