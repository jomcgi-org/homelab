apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Kargo will not update an Application that has not named the Stage allowed
    # to touch it. Without this the promotion errors with "is not authorized"
    # and the pin never moves.
    kargo.akuity.io/authorized-stage: kargo-monolith:prod
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith
      # Kargo owns the live hub revision. This git pin is a manually maintained
      # bootstrap/revert floor; chart-version write-back does not advance it.
      targetRevision: 0.407.29
      helm:
        releaseName: monolith
        valueFiles:
          - $values/projects/monolith/deploy/values.yaml
          - $values/projects/monolith/deploy/values-gke.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
