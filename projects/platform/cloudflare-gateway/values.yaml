# --- Envoy Gateway control plane (subchart) ---
envoyGateway:
  enabled: true

gateway-helm:
  deployment:
    envoyGateway:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  config:
    envoyGateway:
      provider:
        type: Kubernetes

# --- Gateway API resources (GatewayClass, Gateway, EnvoyProxy) ---
gateway:
  enabled: true
  name: cloudflare-ingress
  className: cloudflare-ingress
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  listener:
    port: 80
  envoyProxy:
    name: cloudflare-ingress-proxy
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  service:
    name: cloudflare-ingress
    port: 80

# --- Cloudflare Tunnel ---
tunnel:
  replicaCount: 2
  fullnameOverride: "cloudflared"

  image:
    repository: cloudflare/cloudflared
    # Pinned deliberately (noAutoupdate: true). 2026.7.x adds startup
    # DNS/UDP/TCP connectivity prechecks and clearer connection failures.
    tag: "2026.7.2"
    pullPolicy: IfNotPresent

  # Tunnel identity (set from secret when using OnePassword)
  id: ""
  name: ""
  protocol: ""
  noAutoupdate: true

  secret:
    type: onepassword
    onepassword:
      itemPath: ""
    manual:
      credentialsJson: ""

  ingress:
    routes: []
    catchAll:
      service: http_status:404

  service:
    type: ClusterIP
    port: 2000

  resources: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # Liveness only checks the local metrics/process is alive (TCP connect to the
  # metrics listener), NOT edge readiness. An upstream Cloudflare transport
  # outage must not restart an otherwise-healthy, reconnecting cloudflared:
  # that just adds synchronized restart churn and extends the outage. Edge
  # health is a readiness concern (below). Requires metrics bound to 0.0.0.0
  # so the kubelet can reach it on the pod IP (see metrics.address).
  livenessProbe:
    tcpSocket:
      port: 2000
    failureThreshold: 6
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

  # Readiness DOES gate on edge readiness (runs in-container against loopback).
  readinessProbe:
    exec:
      command:
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5

  metrics:
    enabled: true
    # Bound to 0.0.0.0 (was 127.0.0.1) so the kubelet tcpSocket liveness probe
    # can reach it on the pod IP. Exposure is in-cluster only (ClusterIP service,
    # never internet-facing); tighten with a CiliumNetworkPolicy if needed.
    address: "0.0.0.0:2000"

  envoy:
    enabled: false
    image:
      repository: envoyproxy/envoy
      tag: "v1.31-latest"
      pullPolicy: IfNotPresent
    admin:
      port: 9901
    proxy:
      port: 8000
    transparentProxy:
      enabled: false
      port: 15001
      iptablesImage: "docker.io/istio/proxyv2:1.20.0"
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    tracing:
      enabled: true
      otlpEndpoint: "signoz-otel-collector.signoz.svc.cluster.local:4317"
      serviceName: "cloudflare-tunnel"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
