# --- Envoy Gateway control plane (subchart) ---
envoyGateway:
  enabled: true

gateway-helm:
  deployment:
    envoyGateway:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  config:
    envoyGateway:
      provider:
        type: Kubernetes

# --- Gateway API resources (GatewayClass, Gateway, EnvoyProxy) ---
gateway:
  enabled: true
  name: cloudflare-ingress
  className: cloudflare-ingress
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  listener:
    port: 80
  envoyProxy:
    name: cloudflare-ingress-proxy
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  service:
    name: cloudflare-ingress
    port: 80

# --- Cloudflare Tunnel ---
tunnel:
  # One replica per node (4), up from 2. The tunnel only serves a 530 when
  # EVERY connection across EVERY replica is gone, so replica count is the
  # redundancy budget for that. At 2 it was routinely spent: measured over a
  # 78h window, the node-1 replica alone was blacked out for 96.5 min across 87
  # episodes (159 `dial tcp :7844 i/o timeout`, against 1 on node-4), so the
  # tunnel spent most of that time one blip away from having no origin at all.
  # All 5 full outages in the window were exactly that overlap.
  #
  # The asymmetry is not node-1 being broken: an EmberVM rollout applies all its
  # brick Deployments in the same sync wave, and the resulting rootfs-build plus
  # image-pull stampede saturates the shared uplink (observed 2026-07-30 06:06,
  # whole wired LAN at 100% loss while the gateway answered in 3ms). node-4
  # survives it because it has the node-local CAKE shaper and node-1/2/3 do not.
  #
  # So this is defence in depth, not the fix: node-2 and node-3 are unshaped too,
  # and their replicas can die in the same stampede. It buys 4 chances instead of
  # 2. The root fix is sequencing the rollout; the durable one is shaping every
  # node. Each replica costs 25m CPU / 64Mi, so the headroom is free.
  replicaCount: 4
  fullnameOverride: "cloudflared"

  image:
    repository: cloudflare/cloudflared
    # Pinned deliberately (noAutoupdate: true). 2026.7.x adds startup
    # DNS/UDP/TCP connectivity prechecks and clearer connection failures.
    tag: "2026.7.2"
    pullPolicy: IfNotPresent

  # Tunnel identity (set from secret when using OnePassword)
  id: ""
  name: ""
  protocol: ""
  noAutoupdate: true

  secret:
    type: onepassword
    onepassword:
      itemPath: ""
    manual:
      credentialsJson: ""

  ingress:
    routes: []
    catchAll:
      service: http_status:404

  service:
    type: ClusterIP
    port: 2000

  resources: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # Liveness only checks the local metrics/process is alive (TCP connect to the
  # metrics listener), NOT edge readiness. An upstream Cloudflare transport
  # outage must not restart an otherwise-healthy, reconnecting cloudflared:
  # that just adds synchronized restart churn and extends the outage. Edge
  # health is a readiness concern (below). Requires metrics bound to 0.0.0.0
  # so the kubelet can reach it on the pod IP (see metrics.address).
  livenessProbe:
    tcpSocket:
      port: 2000
    failureThreshold: 6
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

  # Readiness DOES gate on edge readiness (runs in-container against loopback).
  readinessProbe:
    exec:
      command:
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5

  metrics:
    enabled: true
    # Bound to 0.0.0.0 (was 127.0.0.1) so the kubelet tcpSocket liveness probe
    # can reach it on the pod IP. Exposure is in-cluster only (ClusterIP service,
    # never internet-facing); tighten with a CiliumNetworkPolicy if needed.
    address: "0.0.0.0:2000"

  envoy:
    enabled: false
    image:
      repository: envoyproxy/envoy
      tag: "v1.31-latest"
      pullPolicy: IfNotPresent
    admin:
      port: 9901
    proxy:
      port: 8000
    transparentProxy:
      enabled: false
      port: 15001
      iptablesImage: "docker.io/istio/proxyv2:1.20.0"
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    tracing:
      enabled: true
      otlpEndpoint: "signoz-otel-collector.signoz.svc.cluster.local:4317"
      serviceName: "cloudflare-tunnel"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
