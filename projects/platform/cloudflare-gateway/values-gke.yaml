# Two data-plane replicas so a single proxy crash (SIGSEGV exit 139 on
# 2026-09-13) or node kill cannot take every jomcgi.dev hostname down at once.
# The EnvoyProxy template renders envoyDeployment.replicas from here.
gateway:
  envoyProxy:
    replicas: 2

gateway-helm:
  # The chart owns ALL Gateway API CRDs on the hub, exactly like home. The GKE
  # Gateway API addon is disabled on the cluster (2026-08-30): its
  # standard-channel bundle lacks ListenerSet, which Envoy Gateway 1.8.3
  # requires at startup, and two writers reconciling the same CRDs would
  # fight. The safe-upgrade admission policy stays off: its Helm lookup guard
  # never fires under ArgoCD, and with the addon gone there is no second
  # writer for it to protect against.
  crds:
    enabled: false
    gatewayAPI:
      safeUpgradePolicy:
        enabled: false

# Note: the experimental bundle embeds upstream's safe-upgrades
# ValidatingAdmissionPolicy. It is acceptable here: with the addon disabled
# there is no second CRD writer, and re-applying the same experimental bundle
# passes its rules. It denies only experimental-over-standard and pre-v1.5.0
# installs, so the standard-channel CRDs must be deleted once (bootstrap step)
# before the first sync of this bundle.
gateway-crds-helm:
  crds:
    gatewayAPI:
      enabled: true
    envoyGateway:
      enabled: true

tunnel:
  # WINDOW: hub connectors live; they share the cluster-cloudflare-tunnel
  # credential, so these registered the moment home drained.
  replicaCount: 2
  secret:
    onepassword:
      itemPath: "vaults/k8s-homelab/items/cluster-cloudflare-tunnel"
  protocol: http2
  ingress:
    catchAll:
      service: http://cloudflare-ingress.envoy-gateway-system.svc.cluster.local:80

  # The hub is now the only ingress path for every jomcgi.dev hostname and both
  # connectors land on the one schedulable node (core-e2), so a node
  # memory-pressure eviction takes the whole zone down with them (cloudflared
  # has been evicted alongside other platform pods in a single such event).
  # These carry the values-prod.yaml tunnel settings into the hub overlay, which
  # previously dropped them: with no priority class and no resource requests the
  # connector runs BestEffort at default priority and is among the first pods
  # the kubelet evicts. A priority class plus a request ranks it last.
  #
  # homelab-critical, not system-cluster-critical: GKE reserves
  # system-cluster-critical and system-node-critical for its own system
  # namespaces, so a pod that requests them in envoy-gateway-system is rejected
  # at admission ("insufficient quota to match these scopes: [{PriorityClass In
  # [system-node-critical system-cluster-critical]}]"). That denial froze the
  # cloudflared rollout from 2026-09-18: with maxUnavailable 0 the 1-pod surge
  # could never be created, so the hardened revision never ran and the
  # September 13 BestEffort pods stayed serving. homelab-critical (value
  # 100000) is a user class, admissible in any namespace, and still ranks the
  # connector above default-priority tenants, which is the eviction ordering
  # this comment is about.
  # The spread rule is best effort; it cannot separate the replicas while only
  # one node is schedulable, but it will once a second on-demand node exists.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cloudflare-tunnel
