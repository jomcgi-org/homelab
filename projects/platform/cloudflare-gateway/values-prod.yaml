# Production overrides for cloudflare-gateway

# --- Envoy Gateway control plane ---
gateway-helm:
  deployment:
    envoyGateway:
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        readOnlyRootFilesystem: true
  config:
    envoyGateway:
      provider:
        type: Kubernetes

# --- Cloudflare Tunnel ---
tunnel:
  secret:
    onepassword:
      itemPath: "vaults/k8s-homelab/items/cluster-cloudflare-tunnel"

  ingress:
    routes:
      # argocd, longhorn, and signoz retired: they now serve under
      # private.jomcgi.dev/app/<app> via the cloudflare-ingress gateway
      # (HTTPRoutes in each chart). Their old subdomains fall through to
      # catchAll, which has no matching gateway route, so they stop resolving.
      # Trip images: imgproxy resizes/optimizes photos from the monolith-trips
      # SeaweedFS bucket on the fly. Lives in the monolith-public chart (meshed
      # public tier); the tunnel reaches it directly, not via the envoy gateway.
      - hostname: img.jomcgi.dev
        service: http://monolith-public-imgproxy.monolith-public.svc.cluster.local:8080
      - hostname: grimoire.jomcgi.dev
        service: http://grimoire-frontend.grimoire.svc.cluster.local:8080
      - hostname: api.jomcgi.dev
        service: http://api-gateway.api-gateway.svc.cluster.local:80
        originRequest:
          keepAliveConnections: 100
          keepAliveTimeout: 90s
          tcpKeepAlive: 30s
    catchAll:
      service: http://cloudflare-ingress.envoy-gateway-system.svc.cluster.local:80

  priorityClassName: system-cluster-critical

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cloudflare-tunnel

  # CPU limit raised 250m -> 1000m: this tunnel is the ingress path for all
  # external traffic and was CPU-throttled ~16-19% of periods, pinned exactly at
  # its 250m ceiling. The node is CPU-idle, so the limit was the only constraint.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi

  envoy:
    enabled: false
