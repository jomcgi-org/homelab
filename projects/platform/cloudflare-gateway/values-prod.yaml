# Production overrides for cloudflare-gateway

# --- Envoy Gateway control plane ---
gateway-helm:
  deployment:
    envoyGateway:
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        readOnlyRootFilesystem: true
  config:
    envoyGateway:
      provider:
        type: Kubernetes

# --- Cloudflare Tunnel ---
tunnel:
  secret:
    onepassword:
      itemPath: "vaults/k8s-homelab/items/cluster-cloudflare-tunnel"

  # Pinned to http2 (TCP) instead of the cloudflared default of quic (UDP).
  # The shared WAN egress path drops UDP flows periodically, which stranded the
  # tunnel and made Cloudflare serve 530 on the public tier while the cluster
  # itself was healthy. Over one 96h sample: 241 QUIC teardowns across 69
  # episodes, 70% of them simultaneous (within 5s) on both replicas despite
  # running on different nodes and different edge PoPs, so the fault is on the
  # shared path rather than in the cluster. TCP egress over the same window and
  # the same path had zero failures.
  #
  # Revert to "" (quic) only once the egress path is confirmed to hold UDP.
  protocol: http2

  ingress:
    # The operator UIs retired their direct hostnames and now serve under
    # private.jomcgi.dev/app/<app> via the cloudflare-ingress gateway
    # (HTTPRoutes in each chart). Their old subdomains fall through to
    # catchAll, which has no matching gateway route, so they stop resolving.
    catchAll:
      service: http://cloudflare-ingress.envoy-gateway-system.svc.cluster.local:80

  priorityClassName: system-cluster-critical

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cloudflare-tunnel

  # CPU limit raised 250m -> 1000m: this tunnel is the ingress path for all
  # external traffic and was CPU-throttled ~16-19% of periods, pinned exactly at
  # its 250m ceiling. The node is CPU-idle, so the limit was the only constraint.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 256Mi

  envoy:
    enabled: false
