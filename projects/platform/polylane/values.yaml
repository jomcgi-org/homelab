# Wrapper values. Everything under polylane-k8s: is the upstream chart's;
# this chart's own templates add only the OnePasswordItem.
polylane-k8s:
  apiKey:
    # The Secret the 1Password operator materialises from templates/onepassworditem.yaml.
    existingSecret: polylane-api-key
    # The item's field label, verbatim: the operator does not case-fold it.
    secretKey: POLYLANE_API_KEY

  # The agent's config.yaml, rendered verbatim into its ConfigMap.
  config:
    cluster_name: homelab-hub

  # Memory request equals limit in both blocks, per the cluster convention: a
  # request below the limit lets the kernel overcommit and OOM-kill the pod
  # under node pressure, below its own ceiling. The agent keeps upstream's
  # 256Mi ceiling. cloudflared's working set is tens of MiB, so reserving
  # upstream's 256Mi would waste node memory; 128Mi is twice what upstream
  # itself requests. CPU requests are upstream's, and neither block sets a CPU
  # limit: throttling the tunnel is worse than letting it burst.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

  tunnel:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi

  # Plain NetworkPolicy is the hub's only enforcement (no Cilium CRD), and this
  # is a plain one. It buys ingress lockdown: the shim listens on loopback and
  # is reachable only through the tunnel, so nothing but the ops ports should
  # ever be dialled, and kubelet probes bypass policy. Egress stays open by
  # upstream's own rule (`- {}`), which the agent needs for the kube API and
  # the platform and cloudflared needs for Cloudflare's edge.
  networkPolicy:
    enabled: true

  # Left at upstream's defaults, restated here because the ops ports exist and
  # the absence of a scrape is a decision: nothing scrapes this cluster for
  # Prometheus, and the otel-collector does not discover ServiceMonitors.
  metrics:
    service:
      enabled: false
    serviceMonitor:
      enabled: false
