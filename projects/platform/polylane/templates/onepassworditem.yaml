# The Polylane API key (scope cloud_accounts:write), synced by the 1Password
# operator into a Secret of the same name whose key is the item's field label,
# POLYLANE_API_KEY. The subchart reads it through apiKey.existingSecret rather
# than polylane.apiKey so the key never lands in Helm release storage.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: polylane-api-key
  namespace: {{ .Release.Namespace }}
spec:
  itemPath: "vaults/k8s-homelab/items/polylane"
