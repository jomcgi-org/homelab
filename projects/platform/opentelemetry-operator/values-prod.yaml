# Cluster-specific overrides for OpenTelemetry Operator

# No destination is configured. Enabling a language requires pointing it at
# the collector and adding that service to the collector's allowedServices.
instrumentation:
  python:
    enabled: false
  nodejs:
    enabled: false
  go:
    enabled: false
    endpoint: ""
  # Namespaces to deploy Instrumentation CRs into.
  # Only live namespaces belong here: an entry for a deleted namespace leaves
  # the app permanently OutOfSync (the CR can never be created).
  namespaces:
    # Production
    - monolith
