# Upstream opentelemetry-operator subchart values
opentelemetry-operator:
  manager:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Enable Go eBPF auto-instrumentation support
    autoInstrumentation:
      go:
        enabled: true

# Instrumentation CRD configuration
instrumentation:
  # No destination is configured. Enabling a language requires pointing it at
  # the collector and adding that service to the collector's allowedServices.
  endpoint: ""
  propagators:
    - tracecontext
    - baggage
  # Target namespaces to deploy Instrumentation CRs into
  namespaces: []
  python:
    enabled: false
  nodejs:
    enabled: false
  go:
    enabled: false
    # Go eBPF agent uses HTTP OTLP (not gRPC), so it needs port 4318
    endpoint: ""
