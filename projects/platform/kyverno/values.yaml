# Default values for Kyverno
# These are sensible defaults that can be overridden per environment

# OpenTelemetry injection configuration
otelInjection:
  enabled: true
  background: true # Apply to existing AND new resources
  endpoint: "signoz-otel-collector.signoz.svc.cluster.local:4317"
  protocol: "grpc"
  targetKinds:
    - Deployment
    - StatefulSet
    - DaemonSet
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease

# Force dnsPolicy: ClusterFirstWithHostNet onto the SigNoz otel-agent DaemonSet,
# which runs with hostNetwork so the k3s control plane can export OTLP traces to
# localhost:4317. The k8s-infra chart templates hostNetwork but has no dnsPolicy
# field and no pod-spec passthrough, and the SigNoz Application is a plain Helm
# source, so there is no kustomize patch hook either. Without this the pod keeps
# dnsPolicy: ClusterFirst, which Kubernetes silently downgrades to Default for
# hostNetwork pods: the agent would inherit the node resolv.conf, fail to resolve
# its own exporter target (signoz-otel-collector.signoz.svc.cluster.local) and
# drop all cluster telemetry. See projects/platform/signoz/bootstrap/README.md.
#
# This mutates at admission only. It is not a mutate-existing rule, so the live
# DaemonSet is patched when ArgoCD re-applies it (which the hostNetwork change
# itself does). Sync the kyverno app before the signoz app, or the DaemonSet can
# be admitted in the gap before the policy exists and come up without dnsPolicy.
otelAgentHostNetwork:
  enabled: true
  background: true # match the sibling otel policy; rules opt out individually
  namespace: signoz
  daemonSetName: signoz-k8s-infra-otel-agent

# Require resource requests + a memory limit (AUDIT-only) in first-party app
# namespaces, so regressions in our own charts surface as PolicyReports. A CPU
# limit is intentionally NOT required: CPU limits cause CFS throttling even on an
# idle node. Scoped to namespaces where we author Helm charts; vendor/operator
# namespaces are deliberately left out (they ship without resources and we don't
# want to flag what we can't change).
requireResources:
  enabled: true
  background: true # scan existing workloads too, not just new admissions
  targetKinds:
    - Deployment
    - StatefulSet
    - DaemonSet
  includeNamespaces:
    - monolith
    - monolith-public

kyverno:
  # Admission controller configuration
  admissionController:
    replicas: 1
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  # Background controller for existing resources
  backgroundController:
    enabled: true
    replicas: 1
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  # Cleanup controller for policy reports
  cleanupController:
    enabled: true
    replicas: 1
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 64Mi

  # Reports controller for policy results
  reportsController:
    enabled: true
    replicas: 1
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  # Features
  features:
    autoUpdateWebhooks:
      enabled: true
    policyExceptions:
      enabled: true
      namespace: kyverno

  # Metrics and monitoring
  metricsService:
    enabled: true

  # CRD installation
  crds:
    install: true

  # Namespace exclusions
  config:
    excludeKyvernoNamespace: true
    resourceFilters:
      - "[*,kube-system,*]"
      - "[*,kube-public,*]"
      - "[*,kube-node-lease,*]"
      - "[Event,*,*]"
      - "[Node,*,*]"
      - "[APIService,*,*]"
      - "[TokenReview,*,*]"
      - "[SubjectAccessReview,*,*]"
      - "[SelfSubjectAccessReview,*,*]"
      - "[Binding,*,*]"
      - "[ReplicaSet,*,*]"
      - "[AdmissionReport,*,*]"
      - "[ClusterAdmissionReport,*,*]"
      - "[BackgroundScanReport,*,*]"
      - "[ClusterBackgroundScanReport,*,*]"
