# Default values for Kyverno
# These are sensible defaults that can be overridden per environment

# OpenTelemetry injection configuration
otelInjection:
  # This policy injects OTEL_EXPORTER_OTLP_ENDPOINT into every Deployment,
  # StatefulSet, and DaemonSet. The replacement collector is deny-by-default
  # and does not listen on 4317 or 4318 while its allowlist is empty. Enabling
  # this globally would make every workload retry against a closed port.
  # Services opt in explicitly by name after joining the collector allowlist.
  enabled: false
  background: true # Apply to existing AND new resources
  endpoint: ""
  protocol: "grpc"
  targetKinds:
    - Deployment
    - StatefulSet
    - DaemonSet
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease

# Require resource requests + a memory limit (AUDIT-only) in first-party app
# namespaces, so regressions in our own charts surface as PolicyReports. A CPU
# limit is intentionally NOT required: CPU limits cause CFS throttling even on an
# idle node. Scoped to namespaces where we author Helm charts; vendor/operator
# namespaces are deliberately left out (they ship without resources and we don't
# want to flag what we can't change).
requireResources:
  enabled: true
  background: true # scan existing workloads too, not just new admissions
  targetKinds:
    - Deployment
    - StatefulSet
    - DaemonSet
  includeNamespaces:
    - monolith
    - monolith-public

kyverno:
  # Admission controller configuration
  admissionController:
    replicas: 1
    # Prometheus annotations expose metrics to pod-discovery collectors.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  # Background controller for existing resources
  backgroundController:
    enabled: true
    replicas: 1
    # Prometheus annotations expose metrics to pod-discovery collectors.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  # Cleanup controller for policy reports
  cleanupController:
    enabled: true
    replicas: 1
    # Prometheus annotations expose metrics to pod-discovery collectors.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 64Mi

  # Reports controller for policy results
  reportsController:
    enabled: true
    replicas: 1
    # Prometheus annotations expose metrics to pod-discovery collectors.
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  # Features
  features:
    autoUpdateWebhooks:
      enabled: true
    policyExceptions:
      enabled: true
      namespace: kyverno

  # Metrics and monitoring
  metricsService:
    enabled: true

  # CRD installation
  crds:
    install: true

  # Namespace exclusions
  config:
    excludeKyvernoNamespace: true
    resourceFilters:
      - "[*,kube-system,*]"
      - "[*,kube-public,*]"
      - "[*,kube-node-lease,*]"
      - "[Event,*,*]"
      - "[Node,*,*]"
      - "[APIService,*,*]"
      - "[TokenReview,*,*]"
      - "[SubjectAccessReview,*,*]"
      - "[SelfSubjectAccessReview,*,*]"
      - "[Binding,*,*]"
      - "[ReplicaSet,*,*]"
      - "[AdmissionReport,*,*]"
      - "[ClusterAdmissionReport,*,*]"
      - "[BackgroundScanReport,*,*]"
      - "[ClusterBackgroundScanReport,*,*]"
