# Cross-namespace replication of the CNPG-generated Postgres `app` credential.
#
# CNPG writes the `app` password into Secret `monolith-pg-app` in the `monolith`
# namespace. The Argo CronWorkflow job pods (ns `monolith-workflows`) need it for
# DATABASE_URL, but K8s Secrets are namespace-scoped. Rather than launder a
# cluster-generated secret through 1Password by hand, Kyverno clones it into the
# target namespace and keeps it in sync (synchronize: true) if CNPG rotates it.
# Triggered on namespace creation; generateExisting also backfills if the
# namespace already exists.
#
# (The former temporal/lakehouse clone rules were dropped: those namespaces were
# decommissioned with the lakehouse/Temporal stack.)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: clone-monolith-pg-app
  annotations:
    policies.kyverno.io/title: Clone monolith-pg-app into monolith-workflows
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: |
      Replicates the CNPG-generated monolith-pg `app` credential Secret into the
      monolith-workflows namespace (synchronized) so Argo CronWorkflow job pods
      get DATABASE_URL without a manual 1Password round-trip for a
      cluster-generated credential.
spec:
  background: true
  rules:
    - name: clone-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - monolith-workflows
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-pg-app
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-pg-app
    # The observability.topology_rollup CronWorkflow queries ClickHouse; clone
    # the 1Password-backed monolith-clickhouse Secret (USER/PASSWORD) into
    # monolith-workflows the same way so the job pod can authenticate.
    - name: clone-clickhouse-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - monolith-workflows
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-clickhouse
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-clickhouse
    # The home.calendar_poll CronWorkflow fetches the iCal feed; clone the
    # 1Password-backed monolith-secrets Secret (single key ICAL_FEED_URL) into
    # monolith-workflows so the job pod can read the feed URL.
    - name: clone-secrets-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - monolith-workflows
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-secrets
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-secrets
    # The chat.changelog CronWorkflows need GITHUB_TOKEN. It lives in
    # monolith-chat-secrets, which ALSO holds the Discord bot token. The
    # changelog jobs only wire GITHUB_TOKEN (they enqueue, never post), but
    # cloning the whole secret puts the bot token in monolith-workflows too -
    # an acceptable widening within the monolith trust domain (the namespace
    # already holds the monolith-pg password), but tighten it later to a
    # single-key generate (data-from-apiCall) if least-privilege on the bot
    # token is wanted.
    - name: clone-chat-secrets-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - monolith-workflows
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-chat-secrets
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-chat-secrets
    # The grimoire.extract_entities CronWorkflow needs OPENROUTER_API_KEY. The
    # real key lives in the 1Password-backed "goosecracker" Secret in the
    # monolith namespace (the dedicated monolith-openrouter Secret was never
    # materialized). Clone the goosecracker Secret into monolith-workflows the
    # same way so the (manual-only) extraction job pod can authenticate to
    # OpenRouter via its OPENROUTER_API_KEY field. The Secret holds other
    # provider keys too; cloning the whole object is an acceptable widening
    # within the monolith trust domain (matching the chat-secrets clone above).
    - name: clone-openrouter-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - monolith-workflows
      generate:
        apiVersion: v1
        kind: Secret
        name: goosecracker
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: goosecracker
    - name: clone-pg-dump-reader-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - monolith-workflows
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-pg-dump-reader
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-pg-dump-reader
    - name: clone-dev-pg-app-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - monolith-workflows
      generate:
        apiVersion: v1
        kind: Secret
        # RENAMED on clone. The dev Application runs the monolith chart with
        # releaseName `monolith`, so CNPG names its credential `monolith-pg-app`
        # in monolith-dev, exactly as production names its own in monolith.
        # Cloning both into monolith-workflows under their source names would
        # collide, so dev's lands under a distinct target name and the refresh
        # workflow reads that.
        name: monolith-dev-pg-app
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith-dev
          name: monolith-pg-app
---
# Kyverno 3.x restricts both controllers' Secret access by default. The
# BACKGROUND controller does the actual clone (needs get/list/watch on the
# source + create/update/delete on the clones). The ADMISSION controller
# validates the generate rule at policy-admission time and rejects the policy
# unless it ALSO has get/list on Secrets ("kyverno-admission-controller requires
# permissions list,get for resource v1/Secret"). Grant each via its matching
# aggregation label (least privilege: admission is read-only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:clone-monolith-pg-secret-background
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:clone-monolith-pg-secret-admission
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
