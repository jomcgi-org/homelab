# Cross-namespace replication of the Secrets the monolith-workflows job pods
# need, led by the CNPG-generated Postgres `app` credential.
#
# CNPG writes the `app` password into Secret `monolith-pg-app` in the `monolith`
# namespace. The Argo CronWorkflow job pods (ns `monolith-workflows`) need it for
# DATABASE_URL, but K8s Secrets are namespace-scoped. Rather than launder a
# cluster-generated secret through 1Password by hand, Kyverno clones it into the
# target namespace and keeps it in sync (synchronize: true) if CNPG rotates it.
#
# Every rule triggers on its SOURCE Secret, not on the target namespace. Kyverno
# pins a clone to its source by UID (generate.kyverno.io/source-uid). A rule
# that matches the target Namespace fires once, when that namespace appears, and
# synchronize then follows content changes for that one UID only: if the source
# is deleted and recreated (a CNPG cluster rebuild, a rename, a restore into a
# new cluster) the namespace produces no new event, so the clone stays pinned to
# a UID that no longer exists while the policy reports Ready (#4715). Matching
# the source Secret makes its creation the trigger, so a recreated source is
# re-cloned without help. generateExisting backfills sources that already exist.
#
# MIGRATION NOTE: a generate rule's match block, name, and membership are
# immutable once a synchronizing policy exists (Kyverno checks that the new
# rule-hash set is a superset of the old one, so edits, renames AND removals are
# refused by validate-policy.kyverno.svc; #4713 and #4721 hit this). The only
# accepted change is a NEW rule or a NEW policy. This policy was therefore
# renamed from `clone-monolith-pg-app` so ArgoCD creates it and prunes the old
# one. Deleting a policy leaves CLONE downstreams in place (only data-rule
# downstreams are cleaned up), and a clone rule whose target already exists
# updates it in place, so the existing Secrets are adopted, not recreated. Any
# future change to a match block needs the same treatment: rename the policy.
#
# (The former temporal/lakehouse clone rules were dropped: those namespaces were
# decommissioned with the lakehouse/Temporal stack.)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: clone-monolith-workflows-secrets
  annotations:
    policies.kyverno.io/title: Clone monolith Secrets into monolith-workflows
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: |
      Replicates the CNPG-generated monolith-pg `app` credential Secret (and the
      other Secrets the job pods read) into the monolith-workflows namespace,
      synchronized and triggered on the source Secret so a recreated source is
      re-cloned, so Argo CronWorkflow job pods get DATABASE_URL without a manual
      1Password round-trip for a cluster-generated credential.
spec:
  background: true
  rules:
    - name: clone-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith
              names:
                - monolith-pg-app
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-pg-app
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-pg-app
    # The observability.topology_rollup CronWorkflow queries ClickHouse; clone
    # the 1Password-backed monolith-clickhouse Secret (USER/PASSWORD) into
    # monolith-workflows the same way so the job pod can authenticate.
    - name: clone-clickhouse-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith
              names:
                - monolith-clickhouse
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-clickhouse
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-clickhouse
    # The home.calendar_poll CronWorkflow fetches the iCal feed; clone the
    # 1Password-backed monolith-secrets Secret (single key ICAL_FEED_URL) into
    # monolith-workflows so the job pod can read the feed URL.
    - name: clone-secrets-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith
              names:
                - monolith-secrets
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-secrets
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-secrets
    # The chat.changelog CronWorkflows need GITHUB_TOKEN. It lives in
    # monolith-chat-secrets, which ALSO holds the Discord bot token. The
    # changelog jobs only wire GITHUB_TOKEN (they enqueue, never post), but
    # cloning the whole secret puts the bot token in monolith-workflows too -
    # an acceptable widening within the monolith trust domain (the namespace
    # already holds the monolith-pg password), but tighten it later to a
    # single-key generate (data-from-apiCall) if least-privilege on the bot
    # token is wanted.
    - name: clone-chat-secrets-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith
              names:
                - monolith-chat-secrets
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-chat-secrets
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-chat-secrets
    # The grimoire.extract_entities CronWorkflow needs OPENROUTER_API_KEY. The
    # real key lives in the 1Password-backed "goosecracker" Secret in the
    # monolith namespace (the dedicated monolith-openrouter Secret was never
    # materialized). Clone the goosecracker Secret into monolith-workflows the
    # same way so the (manual-only) extraction job pod can authenticate to
    # OpenRouter via its OPENROUTER_API_KEY field. The Secret holds other
    # provider keys too; cloning the whole object is an acceptable widening
    # within the monolith trust domain (matching the chat-secrets clone above).
    - name: clone-openrouter-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith
              names:
                - goosecracker
      generate:
        apiVersion: v1
        kind: Secret
        name: goosecracker
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: goosecracker
    - name: clone-pg-dump-reader-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith
              names:
                - monolith-pg-dump-reader
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-pg-dump-reader
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-pg-dump-reader
    - name: clone-dev-pg-app-to-monolith-workflows
      # Kyverno 1.13 defaults this server-side; declare it so ArgoCD desired
      # state matches live and the app does not sit permanently OutOfSync.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith-dev
              names:
                - monolith-dev-pg-app
      generate:
        apiVersion: v1
        kind: Secret
        # Source and target names match here, unlike the rule above, because the
        # dev Application runs under releaseName `monolith-dev`, so CNPG already
        # names its credential `monolith-dev-pg-app`. No collision to design
        # around.
        name: monolith-dev-pg-app
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith-dev
          name: monolith-dev-pg-app
    # The S3 cronworkflows (stars-load-grid, stars-refresh, stars-load-climatology,
    # knowledge-ingest, grimoire-extract-entities, grimoire-backfill-hierarchy) need
    # R2 credentials. The monolith-r2-s3 Secret is
    # synced by OnePasswordItem in the monolith namespace; clone it into
    # monolith-workflows so job pods can read it via secretKeyRef.
    - name: clone-r2-s3-to-monolith-workflows
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - monolith
              names:
                - monolith-r2-s3
      generate:
        apiVersion: v1
        kind: Secret
        name: monolith-r2-s3
        namespace: monolith-workflows
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-r2-s3
---
# Kyverno 3.x restricts both controllers' Secret access by default. The
# BACKGROUND controller does the actual clone (needs get/list/watch on the
# source + create/update/delete on the clones). The ADMISSION controller
# validates the generate rule at policy-admission time and rejects the policy
# unless it ALSO has get/list on Secrets ("kyverno-admission-controller requires
# permissions list,get for resource v1/Secret"). Grant each via its matching
# aggregation label (least privilege: admission is read-only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:clone-monolith-pg-secret-background
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:clone-monolith-pg-secret-admission
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
