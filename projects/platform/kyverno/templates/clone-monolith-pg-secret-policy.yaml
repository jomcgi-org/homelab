# Cross-namespace replication of the CNPG-generated Postgres `app` credential.
#
# CNPG writes the `app` password into Secret `monolith-pg-app` in the `monolith`
# namespace. The Temporal cluster (ns `temporal`) and the lakehouse backfill
# worker (ns `lakehouse`) need it, but K8s Secrets are namespace-scoped. Rather
# than launder a cluster-generated secret through 1Password by hand, Kyverno
# clones it into the target namespaces and keeps it in sync (synchronize: true)
# if CNPG ever rotates it. Triggered on namespace creation; generateExisting
# also backfills the namespace if it already exists.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: clone-monolith-pg-app
  annotations:
    policies.kyverno.io/title: Clone monolith-pg-app into temporal + lakehouse
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: |
      Replicates the CNPG-generated monolith-pg `app` credential Secret into the
      temporal and lakehouse namespaces (synchronized), so no manual 1Password
      round-trip is needed for cluster-generated Postgres credentials.
spec:
  background: true
  rules:
    - name: clone-to-temporal
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - temporal
      generate:
        apiVersion: v1
        kind: Secret
        name: temporal-pg
        namespace: temporal
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-pg-app
    - name: clone-to-lakehouse
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - lakehouse
      generate:
        apiVersion: v1
        kind: Secret
        name: lakehouse-pg
        namespace: lakehouse
        synchronize: true
        generateExisting: true
        clone:
          namespace: monolith
          name: monolith-pg-app
---
# Kyverno 3.x restricts both controllers' Secret access by default. The
# BACKGROUND controller does the actual clone (needs get/list/watch on the
# source + create/update/delete on the clones). The ADMISSION controller
# validates the generate rule at policy-admission time and rejects the policy
# unless it ALSO has get/list on Secrets ("kyverno-admission-controller requires
# permissions list,get for resource v1/Secret"). Grant each via its matching
# aggregation label (least privilege: admission is read-only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:clone-monolith-pg-secret-background
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:clone-monolith-pg-secret-admission
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
