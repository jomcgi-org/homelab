version: 1
metadata:
  name: factory - explorer sign-in
entries:
  - model: authentik_core.group
    id: explorer-users
    identifiers:
      name: factory-explorer-users
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: explore-provider
    identifiers:
      name: factory-explore
    attrs:
      client_type: public
      client_id: factory-explore
      access_token_validity: minutes=10
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris:
        - matching_mode: strict
          url: https://factory-explore.jomcgi.dev/oidc/callback
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  # The issuer is https://factory-auth.jomcgi.dev/application/o/factory-explore/.
  - model: authentik_core.application
    id: explore-app
    identifiers:
      slug: factory-explore
    attrs:
      name: Factory explorer
      provider: !KeyOf explore-provider
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf explore-app
      group: !KeyOf explorer-users
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
