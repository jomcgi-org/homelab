version: 1
metadata:
  name: Factory social sign-in
entries:
  - model: authentik_policies_expression.expressionpolicy
    id: social-enrollment-gate
    identifiers:
      name: factory-social-enrollment-gate
    attrs:
      expression: |
        from authentik.core.models import User
        info = request.context.get("oauth_userinfo") or {}
        source = request.context["source"].slug
        # Mapped profile includes GitHub's private primary email.
        email = (request.context["prompt_data"].get("email") or "").strip()
        if not email or (source == "discord" and info.get("verified") is not True) or (source == "google" and info.get("verified_email") is not True):
            ak_message("A verified email address is required.")
            return False
        if User.objects.filter(email__iexact=email).exists():
            ak_message("An account already uses this email. Sign in with that account instead.")
            return False
        return True
  - model: authentik_flows.flow
    id: social-enrollment
    identifiers:
      slug: factory-social-enrollment
    attrs:
      name: Factory social enrollment
      title: Create a factory account
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf social-enrollment
      policy: !KeyOf social-enrollment-gate
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_stages_user_write.userwritestage
    id: social-write
    identifiers:
      name: factory-social-create-user
    attrs:
      user_creation_mode: always_create
      user_type: external
      create_users_group: null
      user_path_template: factory/social
  - model: authentik_stages_user_login.userloginstage
    id: social-login
    identifiers:
      name: factory-social-login
  - model: authentik_policies_expression.expressionpolicy
    id: enrollment-return
    identifiers:
      name: factory-social-enrollment-return
    attrs:
      expression: |
        # A direct signup would end at the user interface, which the factory
        # edge blocks. Continue through the same provider after the native
        # PostSourceStage has saved its connection. Preserve application next URLs.
        plan = request.context["flow_plan"]
        if plan.context.get("redirect") == "authentik_core:if-user":
            slug = plan.context["source"].slug
            plan.context["redirect"] = f"/source/oauth/login/{slug}/"
        return True
  - model: authentik_flows.flowstagebinding
    id: enrollment-write-binding
    identifiers:
      target: !KeyOf social-enrollment
      stage: !KeyOf social-write
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf enrollment-write-binding
      policy: !KeyOf enrollment-return
      order: 0
  - model: authentik_stages_deny.denystage
    id: duplicate-email-deny
    identifiers:
      name: factory-social-deny-duplicate-email
    attrs:
      deny_message: An account already uses this email. Sign in with that account instead.
  - model: authentik_flows.flowstagebinding
    id: duplicate-email-binding
    identifiers:
      target: !KeyOf social-enrollment
      stage: !KeyOf duplicate-email-deny
      order: 15
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  # invariant: AUTHENTIK-1
  - model: authentik_policies_expression.expressionpolicy
    id: duplicate-email-check
    identifiers:
      name: factory-social-remove-duplicate-email
    attrs:
      expression: |
        from authentik.core.models import User
        user = request.context["pending_user"]
        if User.objects.filter(email__iexact=user.email, pk__lt=user.pk).exists():
            user.delete()
            return True
        # Skip the deny stage and continue enrollment.
        return False
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf duplicate-email-binding
      policy: !KeyOf duplicate-email-check
      order: 0
    attrs:
      failure_result: true
  - model: authentik_flows.flow
    id: social-authentication
    identifiers:
      slug: factory-social-authentication
    attrs:
      name: Factory social sign-in
      title: Sign in to the factory
      designation: authentication
      authentication: require_unauthenticated
      policy_engine_mode: all
  - model: authentik_policies_expression.expressionpolicy
    id: social-session-ready
    identifiers:
      name: factory-social-session-ready
    attrs:
      expression: |
        from authentik.stages.authenticator import devices_for_user
        from time import time
        user = request.context["pending_user"]
        # A source callback with an application next URL belongs to that application.
        direct = request.context.get("redirect") == "authentik_core:if-user"
        if request.context["source"].slug == "discord" and direct and request.http_request.session.get("bosun_apply_until", 0) > time():
            return True
        if user.groups.exists() or any(devices_for_user(user)):
            return True
        ak_message("Your account is registered. Factory access is pending a group grant.")
        return False
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf social-authentication
      policy: !KeyOf social-session-ready
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf social-authentication
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-source-authentication-if-sso]]
      order: 0
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: validate
    identifiers:
      name: factory-social-mfa
    attrs:
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf social-authentication
      stage: !KeyOf validate
      order: 10
  - model: authentik_flows.flowstagebinding
    id: social-login-binding
    identifiers:
      target: !KeyOf social-authentication
      stage: !KeyOf social-login
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies_expression.expressionpolicy
    id: record-application
    identifiers:
      name: bosun-record-application
    attrs:
      expression: |
        from time import time
        from authentik.core.models import Group
        plan = request.context["flow_plan"]
        direct = plan.context.get("redirect") == "authentik_core:if-user"
        if request.context["source"].slug == "discord" and request.http_request.session.pop("bosun_apply_until", 0) > time() and direct:
            user = request.context["pending_user"]
            if not user.all_groups().filter(name="bosun-member").exists():
                user.groups.add(Group.objects.get(name="bosun-applicants"))
            plan.context["redirect"] = "/bosun/application-complete"
        return True
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf social-login-binding
      policy: !KeyOf record-application
      order: 0
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: github-properties
    identifiers:
      name: factory-github-properties
    attrs:
      expression: |
        emails = client.get_github_emails(token)
        verified = [entry for entry in emails if entry.get("verified") is True and entry.get("email")]
        primary = next((entry for entry in verified if entry.get("primary")), None)
        chosen = primary or (verified[0] if verified else {})
        return {"username": "github-" + str(info["id"]), "email": chosen.get("email", "")}
  - model: authentik_sources_oauth.oauthsource
    id: github
    identifiers:
      slug: github
    attrs:
      name: GitHub
      provider_type: github
      authorization_url: https://github.com/login/oauth/authorize
      access_token_url: https://github.com/login/oauth/access_token
      profile_url: https://api.github.com/user
      consumer_key: !File /run/factory-social/github/client-id
      consumer_secret: !File /run/factory-social/github/client-secret
      user_matching_mode: identifier
      user_path_template: factory/social
      authentication_flow: !KeyOf social-authentication
      enrollment_flow: !KeyOf social-enrollment
      user_property_mappings:
        - !KeyOf github-properties
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: google-properties
    identifiers:
      name: factory-google-properties
    attrs:
      expression: |
        return {"username": "google-" + str(info["id"])}
  - model: authentik_sources_oauth.oauthsource
    id: google
    identifiers:
      slug: google
    attrs:
      name: Google
      provider_type: google
      consumer_key: !File /run/factory-social/google/client-id
      consumer_secret: !File /run/factory-social/google/client-secret
      user_matching_mode: identifier
      user_path_template: factory/social
      authentication_flow: !KeyOf social-authentication
      enrollment_flow: !KeyOf social-enrollment
      user_property_mappings:
        - !KeyOf google-properties
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: discord-properties
    identifiers:
      name: factory-discord-properties
    attrs:
      expression: |
        return {"username": "discord-" + str(info["id"])}
  - model: authentik_sources_oauth.oauthsource
    id: discord
    identifiers:
      slug: discord
    attrs:
      name: Discord
      provider_type: discord
      consumer_key: !File /run/factory-social/discord/client-id
      consumer_secret: !File /run/factory-social/discord/client-secret
      user_matching_mode: identifier
      user_path_template: factory/social
      authentication_flow: !KeyOf social-authentication
      enrollment_flow: !KeyOf social-enrollment
      user_property_mappings:
        - !KeyOf discord-properties
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !KeyOf github
        - !KeyOf google
        - !KeyOf discord
      show_source_labels: true
