version: 1
metadata:
  name: factory - edge and ArgoCD sign-in
  labels:
    blueprints.goauthentik.io/description: |
      The factory home cluster's OIDC clients: Envoy Gateway's gateway-wide
      policy in front of every factory.jomcgi.dev route, and ArgoCD's own login
      behind it. Both admit factory-operators and authentik Admins, and every sign-in
      needs a second factor. The edge also admits household, which the edge
      authorizes on home.jomcgi.dev only, and the discord-<server-id> groups,
      which it authorizes on artifact.jomcgi.dev/<server-id>/ and
      notes.jomcgi.dev/<server-id>/ only.
entries:
  - model: authentik_core.group
    identifiers:
      name: factory-operators
    attrs:
      is_superuser: false

  # Family members who use Home Assistant. Membership is added by hand in the
  # authentik UI. The edge-app binding lets them sign in; the edge allows the
  # group on home.jomcgi.dev only, and every other route denies it.
  - model: authentik_core.group
    identifiers:
      name: household
    attrs:
      is_superuser: false

  # One group per Discord server in the bridge allowlist
  # (projects/factory/deploy/values.yaml discord.bridge.policy.guilds).
  # Discord sign-in (factory-social.yaml) sets a member's groups to match
  # the servers they are in, at enrollment and at every sign-in. The
  # discord_server_id attribute marks a group for that sync. The edge-app
  # binding lets members sign in; the edge allows each group on
  # artifact.jomcgi.dev/<server-id>/ and notes.jomcgi.dev/<server-id>/ only,
  # and every other route denies it.
  - model: authentik_core.group
    identifiers:
      name: discord-185442367703220224
    attrs:
      is_superuser: false
      attributes:
        discord_server_id: "185442367703220224" # NOT DEM BOYZ
  - model: authentik_core.group
    identifiers:
      name: discord-1290668195249917964
    attrs:
      is_superuser: false
      attributes:
        discord_server_id: "1290668195249917964" # The gang...
  - model: authentik_core.group
    identifiers:
      name: discord-1501965852042330302
    attrs:
      is_superuser: false
      attributes:
        discord_server_id: "1501965852042330302" # homelab
  - model: authentik_core.group
    identifiers:
      name: discord-1512814732392927463
    attrs:
      is_superuser: false
      attributes:
        discord_server_id: "1512814732392927463" # Loom

  # The edge provider's profile scope (below): the default profile claims, with groups limited to the ones the edge
  # authorizes on (projects/platform-factory/edge/chart). A member's other
  # groups stay out of the edge cookie.
  - model: authentik_providers_oauth2.scopemapping
    id: edge-profile
    identifiers:
      name: factory-edge-profile
    attrs:
      scope_name: profile
      description: General Profile Information
      expression: |
        edge = {"authentik Admins", "factory-operators", "household"}
        return {
            "name": request.user.name,
            "given_name": request.user.name,
            "preferred_username": request.user.username,
            "nickname": request.user.username,
            "groups": [
                group.name
                for group in request.user.groups.all()
                if group.name in edge or "discord_server_id" in group.attributes
            ],
        }

  # ── 1. Envoy Gateway's client ────────────────────────────────────────────
  # Envoy runs the authorization-code flow as a confidential client
  # (projects/platform-factory/edge/chart/templates/security-policy.yaml).
  #
  # The client secret is generated in the cluster by the authentik-secret-init
  # Job (projects/platform-factory/authentik/resources/), which writes the same
  # value to authentik-secrets here (envFrom on both pods) and to
  # edge-oidc-client in the edge namespace. Scalar `!Env`, never `!Env [KEY]`:
  # the one-element sequence aborts discovery of every blueprint
  # (projects/platform/authentik/blueprint_tags_test.py).
  - model: authentik_providers_oauth2.oauth2provider
    id: edge-provider
    identifiers:
      name: factory-edge
    attrs:
      client_type: confidential
      client_id: factory-edge
      client_secret: !Env EDGE_OIDC_CLIENT_SECRET
      # Envoy does not refresh tokens; when this expires it sends the browser
      # back here and the policy binding below is checked again, so removal
      # from both operator groups ends edge access within ten minutes.
      access_token_validity: minutes=10
      grant_types:
        - authorization_code
        - refresh_token
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      # Register the exact callback for each edge OIDC policy.
      redirect_uris:
        - matching_mode: strict
          url: https://factory.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory.jomcgi.dev/admin/codex/oauth2/callback
        - matching_mode: strict
          url: https://factory-argocd.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-trips.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-plan.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-grafana.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-runbooks.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-agents.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://t3.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://home.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://artifact.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://notes.jomcgi.dev/oauth2/callback
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !KeyOf edge-profile

  # The issuer is https://factory-auth.jomcgi.dev/application/o/<slug>/.
  - model: authentik_core.application
    id: edge-app
    identifiers:
      slug: factory-edge
    attrs:
      name: Factory edge
      policy_engine_mode: any
      provider: !KeyOf edge-provider
      meta_description: Sign-in for everything published at factory.jomcgi.dev.

  # ── 2. ArgoCD's client ───────────────────────────────────────────────────
  # ArgoCD runs its own OIDC flow (projects/platform/argocd/values-factory.yaml)
  # and maps the groups claim (scope-profile) to its RBAC.
  - model: authentik_providers_oauth2.oauth2provider
    id: argocd-provider
    identifiers:
      name: factory-argocd
    attrs:
      client_type: confidential
      client_id: factory-argocd
      client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris:
        - matching_mode: strict
          url: https://factory-argocd.jomcgi.dev/auth/callback
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  - model: authentik_core.application
    id: argocd-app
    identifiers:
      slug: factory-argocd
    attrs:
      name: Factory ArgoCD
      policy_engine_mode: any
      provider: !KeyOf argocd-provider
      meta_launch_url: https://factory-argocd.jomcgi.dev/
      meta_description: ArgoCD on the factory home cluster.

  # ── 3. Who may sign in ───────────────────────────────────────────────────
  # Without a binding every authenticated account may authorize. The initial
  # setup flow puts akadmin in authentik Admins, so the operator needs no
  # further step.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, factory-operators]]
      order: 5
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, household]]
      order: 10
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, discord-185442367703220224]]
      order: 20
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, discord-1290668195249917964]]
      order: 21
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, discord-1501965852042330302]]
      order: 22
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, discord-1512814732392927463]]
      order: 23
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argocd-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argocd-app
      group: !Find [authentik_core.group, [name, factory-operators]]
      order: 5
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # ── 4. MFA on every sign-in ──────────────────────────────────────────────
  # authentik's default authentication flow already binds this stage, at the
  # model default `not_configured_action: skip`, which lets an account with no
  # device straight through. `configure` enrols one inline on first sign-in.
  #
  # TOTP is offered as well as WebAuthn: a WebAuthn key enrolled over the
  # port-forward is bound to localhost and fails at factory-auth.jomcgi.dev,
  # while a TOTP device works on both.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      configuration_stages:
        - !Find [
            authentik_stages_authenticator_totp.authenticatortotpstage,
            [name, default-authenticator-totp-setup],
          ]
        - !Find [
            authentik_stages_authenticator_webauthn.authenticatorwebauthnstage,
            [name, default-authenticator-webauthn-setup],
          ]
