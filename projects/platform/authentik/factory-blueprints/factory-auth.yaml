version: 1
metadata:
  name: factory - edge and ArgoCD sign-in
  labels:
    blueprints.goauthentik.io/description: |
      The factory home cluster's OIDC clients: Envoy Gateway's gateway-wide
      policy in front of every factory.jomcgi.dev route, and ArgoCD's own login
      behind it. Both admit only the authentik Admins group, and every sign-in
      needs a second factor.
entries:
  # ── 1. Envoy Gateway's client ────────────────────────────────────────────
  # Envoy runs the authorization-code flow as a confidential client
  # (projects/platform-factory/edge/chart/templates/security-policy.yaml).
  #
  # The client secret is generated in the cluster by the authentik-secret-init
  # Job (projects/platform-factory/authentik/resources/), which writes the same
  # value to authentik-secrets here (envFrom on both pods) and to
  # edge-oidc-client in the edge namespace. Scalar `!Env`, never `!Env [KEY]`:
  # the one-element sequence aborts discovery of every blueprint
  # (projects/platform/authentik/blueprint_tags_test.py).
  - model: authentik_providers_oauth2.oauth2provider
    id: edge-provider
    identifiers:
      name: factory-edge
    attrs:
      client_type: confidential
      client_id: factory-edge
      client_secret: !Env EDGE_OIDC_CLIENT_SECRET
      # Envoy does not refresh tokens; when this expires it sends the browser
      # back here and the policy binding below is checked again, so removal
      # from authentik Admins ends edge access within ten minutes.
      access_token_validity: minutes=10
      grant_types:
        - authorization_code
        - refresh_token
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      # One entry per hostname published through the edge Gateway.
      redirect_uris:
        - matching_mode: strict
          url: https://factory.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-argocd.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-plan.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-grafana.jomcgi.dev/oauth2/callback
        - matching_mode: strict
          url: https://factory-agents.jomcgi.dev/oauth2/callback
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  # The issuer is https://factory-auth.jomcgi.dev/application/o/<slug>/.
  - model: authentik_core.application
    id: edge-app
    identifiers:
      slug: factory-edge
    attrs:
      name: Factory edge
      provider: !KeyOf edge-provider
      meta_description: Sign-in for everything published at factory.jomcgi.dev.

  # ── 2. ArgoCD's client ───────────────────────────────────────────────────
  # ArgoCD runs its own OIDC flow (projects/platform/argocd/values-factory.yaml)
  # and maps the groups claim (scope-profile) to its RBAC.
  - model: authentik_providers_oauth2.oauth2provider
    id: argocd-provider
    identifiers:
      name: factory-argocd
    attrs:
      client_type: confidential
      client_id: factory-argocd
      client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris:
        - matching_mode: strict
          url: https://factory-argocd.jomcgi.dev/auth/callback
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  - model: authentik_core.application
    id: argocd-app
    identifiers:
      slug: factory-argocd
    attrs:
      name: Factory ArgoCD
      provider: !KeyOf argocd-provider
      meta_launch_url: https://factory-argocd.jomcgi.dev/
      meta_description: ArgoCD on the factory home cluster.

  # ── 3. Who may sign in ───────────────────────────────────────────────────
  # Without a binding every authenticated account may authorize. The initial
  # setup flow puts akadmin in authentik Admins, so the operator needs no
  # further step.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf edge-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argocd-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # ── 4. MFA on every sign-in ──────────────────────────────────────────────
  # authentik's default authentication flow already binds this stage, at the
  # model default `not_configured_action: skip`, which lets an account with no
  # device straight through. `configure` enrols one inline on first sign-in.
  #
  # TOTP is offered as well as WebAuthn: a WebAuthn key enrolled over the
  # port-forward is bound to localhost and fails at factory-auth.jomcgi.dev,
  # while a TOTP device works on both.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      configuration_stages:
        - !Find [
            authentik_stages_authenticator_totp.authenticatortotpstage,
            [name, default-authenticator-totp-setup],
          ]
        - !Find [
            authentik_stages_authenticator_webauthn.authenticatorwebauthnstage,
            [name, default-authenticator-webauthn-setup],
          ]
