version: 1
metadata:
  name: factory - grafana sign-in
  labels:
    blueprints.goauthentik.io/description: |
      Grafana's own OIDC client at factory-grafana.jomcgi.dev, behind the edge
      Gateway's sign-in. Like the edge and ArgoCD clients it admits only the
      authentik Admins group, and every sign-in needs a second factor.
entries:
  # Grafana runs the authorization-code flow with PKCE as a confidential
  # client (projects/platform-factory/grafana/resources/grafana.ini).
  #
  # The client secret is generated in the cluster by authentik-secret-init
  # (projects/platform-factory/authentik/resources/), which writes it to
  # authentik-secrets here (envFrom on both pods) and to grafana-oidc in the
  # grafana namespace. Scalar `!Env`, never `!Env [KEY]`
  # (blueprint_tags_test.py).
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: factory-grafana
    attrs:
      client_type: confidential
      client_id: factory-grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris:
        - matching_mode: strict
          url: https://factory-grafana.jomcgi.dev/login/generic_oauth
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Grafana maps the profile scope's groups claim to its Admin role and
      # refuses anyone outside authentik Admins (role_attribute_strict).
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  - model: authentik_core.application
    id: grafana-app
    identifiers:
      slug: factory-grafana
    attrs:
      name: Factory metrics
      provider: !KeyOf grafana-provider
      meta_launch_url: https://factory-grafana.jomcgi.dev/
      meta_description: Grafana, the factory cluster's metrics view.

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
