version: 1
metadata:
  name: factory - home assistant sign-in
  labels:
    blueprints.goauthentik.io/description: |
      Home Assistant's own OIDC client at home.jomcgi.dev, behind the edge
      Gateway's sign-in. It admits authentik Admins and household, and every
      sign-in needs a second factor.
entries:
  # The hass-oidc-auth integration runs the authorization-code flow with PKCE
  # as a public client (projects/platform-factory/home-assistant/resources/
  # configuration.yaml), so no client secret exists. The strict redirect URI
  # and PKCE protect the code.
  - model: authentik_providers_oauth2.oauth2provider
    id: home-assistant-provider
    identifiers:
      name: factory-home-assistant
    attrs:
      client_type: public
      client_id: factory-home-assistant
      grant_types:
        - authorization_code
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris:
        - matching_mode: strict
          url: https://home.jomcgi.dev/auth/oidc/callback
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # The profile scope carries the groups claim. Home Assistant makes
      # authentik Admins its admins and household its users.
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  - model: authentik_core.application
    id: home-assistant-app
    identifiers:
      slug: factory-home-assistant
    attrs:
      name: Home Assistant
      policy_engine_mode: any
      provider: !KeyOf home-assistant-provider
      meta_launch_url: https://home.jomcgi.dev/
      meta_description: Home Assistant, the house heating controls.

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf home-assistant-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf home-assistant-app
      group: !Find [authentik_core.group, [name, household]]
      order: 5
    attrs:
      enabled: true
      negate: false
      timeout: 30
