version: 1
metadata:
  name: factory - itsaplan sign-in
  labels:
    blueprints.goauthentik.io/description: |
      itsaplan's own OIDC client at factory-plan.jomcgi.dev, behind the edge
      Gateway's sign-in. Like the edge and ArgoCD clients it admits only the
      authentik Admins group, and every sign-in needs a second factor.
entries:
  # itsaplan runs the authorization-code flow as a confidential client. Its
  # bootstrap Job (projects/factory/chart/templates/itsaplan-jobs.yaml) sets
  # the discovery URL, this client ID and the secret in itsaplan's god mode.
  #
  # The client secret is generated in the cluster by authentik-secret-init
  # (projects/platform-factory/authentik/resources/), which writes it to
  # authentik-secrets here (envFrom on both pods) and to
  # factory-itsaplan-oidc in the factory namespace. Scalar `!Env`, never
  # `!Env [KEY]` (blueprint_tags_test.py).
  - model: authentik_providers_oauth2.oauth2provider
    id: itsaplan-provider
    identifiers:
      name: factory-itsaplan
    attrs:
      client_type: confidential
      client_id: factory-itsaplan
      client_secret: !Env ITSAPLAN_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      # itsaplan's api lives under /backend on the web's host; better-auth's
      # generic OIDC callback is /api/auth/oauth2/callback/oidc below it.
      redirect_uris:
        - matching_mode: strict
          url: https://factory-plan.jomcgi.dev/backend/api/auth/oauth2/callback/oidc
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # itsaplan joins an existing account only for a verified address, which
      # the email scope's email_verified claim reports.
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]

  # The discovery document is
  # https://factory-auth.jomcgi.dev/application/o/factory-itsaplan/.well-known/openid-configuration.
  - model: authentik_core.application
    id: itsaplan-app
    identifiers:
      slug: factory-itsaplan
    attrs:
      name: Factory plan
      provider: !KeyOf itsaplan-provider
      meta_launch_url: https://factory-plan.jomcgi.dev/
      meta_description: itsaplan, the factory's work requests and run queue.

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf itsaplan-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
