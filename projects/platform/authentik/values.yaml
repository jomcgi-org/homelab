# The Ember OIDC provider remains intentionally unconfigured here. ADR 032
# requires Ember's object-authorization matrix to land before SSO is admitted.

authentik:
  # Custom blueprints from ../blueprints/, rendered into a ConfigMap by
  # templates/blueprints-configmap.yaml. The chart discovers every key ending
  # in `.yaml` and authentik's worker applies them, so groups, policy bindings
  # and stage configuration are reviewable in Git rather than clicked.
  blueprints:
    configMaps:
      - authentik-mcp-blueprints
  authentik:
    existingSecret:
      secretName: authentik-secrets
    postgresql:
      host: authentik-pg-rw
      name: authentik
      user: authentik
      port: 5432
  global:
    # Pinned to the 2026.8.0 release candidate to try RFC 8693 token exchange,
    # which lands in 2026.8 and does not exist in 2026.5.6 (verified: that
    # tag's providers/oauth2/views/token.py has no GRANT_TYPE_TOKEN_EXCHANGE).
    # It is set here rather than as a Chart.yaml dependency bump because
    # charts.goauthentik.io publishes no 2026.8.0 chart at all, RC or
    # otherwise: the newest chart is 2026.5.6. So this runs the new image on
    # the old chart, which the release notes permit ("This release does not
    # introduce any new requirements"). The chart dependency and Chart.lock
    # deliberately stay at 2026.5.6.
    #
    # Once enabled, token exchange is off by default per provider and has to
    # be turned on under the provider's Grant Types setting.
    image:
      # Private overlay of the official server image with a lab-local license
      # CA. Built from github.com/jomcgi/authentik-fork. Tag tracks the
      # upstream authentik release the overlay is FROM.
      repository: ghcr.io/jomcgi/authentik-fork
      tag: "2026.8.0-rc7"
    imagePullSecrets:
      - name: ghcr-imagepull-secret
    # authentik.existingSecret replaces the chart-generated configuration
    # secret, so the PostgreSQL connection settings must be supplied here too.
    # Without these values authentik falls back to localhost:5432.
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-pg-rw
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PORT
        value: "5432"
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-pg-app
            key: password
  server:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    metrics:
      enabled: true
    route:
      main:
        # Public login and OIDC discovery endpoint. Admin access remains an
        # authentik policy concern and friend applications are separate routes.
        enabled: true
        # Cloudflare terminates TLS and the tunnel forwards plain HTTP to the
        # gateway, whose listener is HTTP:80. Without this header authentik
        # believes it is serving over HTTP and generates http:// URLs, so the
        # browser blocks its own API calls from the https:// page as mixed
        # content. The login page renders and then fails with "The request
        # failed and the interceptors did not return an alternative response",
        # and nothing reaches the pod, because the request is never sent.
        # cf-ingress-library routes carry the same header for the same reason.
        filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Forwarded-Proto
                  value: https
        hostnames:
          - auth.jomcgi.dev
        # group/kind are the Gateway API schema defaults. The upstream chart
        # renders this list verbatim, so leaving them implicit left ArgoCD's
        # ServerSideApply diff without ownership of two fields the apiserver
        # then defaulted into live: permanent OutOfSync that no sync clears.
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: cloudflare-ingress
            namespace: envoy-gateway-system
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  postgresql:
    enabled: false

  additionalObjects:
    - apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      type: kubernetes.io/dockerconfigjson
      metadata:
        name: ghcr-imagepull-secret
        namespace: authentik
        labels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/part-of: authentik
      spec:
        itemPath: vaults/k8s-homelab/items/ghcr-read-permissions

    - apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: authentik-secrets
        namespace: authentik
        annotations:
          # The operator runs AUTO_RESTART=false, and both pods read this
          # secret through envFrom, which is evaluated only at container
          # start. Without this, rotating a field updates the Secret and
          # changes nothing in the running process, with no error anywhere.
          operator.1password.io/auto-restart: "true"
        labels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/part-of: authentik
      spec:
        itemPath: vaults/k8s-homelab/items/authentik

    # The service-account JSON must use the exact 1Password field name
    # service-account-key.json. The operator mirrors that field into the
    # generated Opaque Secret without supporting key renames.
    - apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: authentik-pg-backup-gcs
        namespace: authentik
        labels:
          app.kubernetes.io/name: authentik-postgresql
          app.kubernetes.io/part-of: authentik
      spec:
        itemPath: vaults/k8s-homelab/items/cnpg-gcs-backups-authentik

# CloudNativePG is rendered by this wrapper rather than additionalObjects so a
# GKE values overlay can replace initdb with recovery without replacing the
# upstream chart's entire additionalObjects list.
cnpg:
  enabled: true
  name: authentik-pg
  instances: 1
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  database: authentik
  owner: authentik
  monitoring:
    enablePodMonitor: true
  bootstrap:
    recovery: null
  externalClusters: []
  backup:
    enabled: true
    retentionPolicy: "14d"
    destinationPath: "gs://cnpg-backups/authentik-pg/"
    credentialsSecret: authentik-pg-backup-gcs
    scheduledBackup:
      cron: "0 0 2 * * *"
