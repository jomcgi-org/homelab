{{- /*
Custom authentik blueprints, mounted from a ConfigMap.

The upstream chart discovers and applies every key ending in `.yaml` from each
ConfigMap listed under `authentik.blueprints.configMaps`, so the files in
../blueprints/ are the reviewable source of truth and authentik's worker
reconciles them. That is the declarative alternative to clicking through the
admin UI, and it survives a database rebuild the way clicked config does not.

Blueprint entries match on `identifiers`, so re-application is idempotent and a
re-applied entry updates in place rather than creating duplicates.
*/}}
{{- $files := .Files.Glob "blueprints/*.yaml" }}
{{- if $files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-mcp-blueprints
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- range $path, $_ := $files }}
  {{ base $path }}: |
{{- $content := $.Files.Get $path }}
{{- if and $.Values.platformManagement.enabled (eq $path "blueprints/grimoire-auth.yaml") }}
{{- $content = replace "        # PLATFORM_PROFILE_MAPPING" "        - !KeyOf platform-profile" $content }}
{{- $content = replace "entries:\n" (printf "entries:\n%s\n" ($.Files.Get "optional/grimoire-management-profile.yaml")) $content }}
{{- end }}
{{- if and $.Values.platformManagement.enabled (eq $path "blueprints/mcp-auth.yaml") }}
{{- $content = replace "        # PLATFORM_MANAGEMENT_PROFILE" "        - !KeyOf platform-management-profile" $content }}
{{- $content = replace "entries:\n" (printf "entries:\n%s\n" ($.Files.Get "optional/platform-management-profile.yaml")) $content }}
{{- end }}
{{ $content | indent 4 }}
{{- end }}
{{- if .Values.grimoireLinkEnrollment.enabled }}
  grimoire-link-enrollment.yaml: |
{{ .Files.Get "optional/grimoire-link-enrollment.yaml" | indent 4 }}
{{- end }}
{{- end }}
