{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-postgresql
    app.kubernetes.io/part-of: authentik
spec:
  instances: {{ .Values.cnpg.instances }}
  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- with .Values.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
  bootstrap:
    {{- with .Values.cnpg.bootstrap.recovery }}
    recovery:
      {{- toYaml . | nindent 6 }}
    {{- else }}
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
    {{- end }}
  {{- with .Values.cnpg.externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  monitoring:
    enablePodMonitor: {{ .Values.cnpg.monitoring.enablePodMonitor }}
  {{- if .Values.cnpg.backup.enabled }}
  # Native GCS provides off-cluster base backups and continuous WAL archiving.
  backup:
    retentionPolicy: {{ .Values.cnpg.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ .Values.cnpg.backup.destinationPath | quote }}
      {{- with .Values.cnpg.backup.serverName }}
      serverName: {{ . | quote }}
      {{- end }}
      googleCredentials:
        applicationCredentials:
          name: {{ .Values.cnpg.backup.credentialsSecret }}
          key: service-account-key.json
      wal:
        compression: gzip
      data:
        compression: gzip
  {{- end }}
{{- end }}
