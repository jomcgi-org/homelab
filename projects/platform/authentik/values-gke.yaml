# GKE cutover destination. Application workloads stay dormant; CNPG stays up
# for data staging and bootstraps by recovery from the off-cluster GCS Barman
# object store. Consumed by the gke-apps Applications.
authentik:
  server:
    replicas: 0
  worker:
    replicas: 0

cnpg:
  storage:
    storageClass: standard-rwo
  bootstrap:
    recovery:
      # CNPG 1.30 behavior: The recovery-minted app Secret password overwrites
      # the restored owner role after recovery completes. No manual ALTER ROLE
      # step is required.
      source: authentik-pg
      database: authentik
      owner: authentik
  # backup stays ENABLED: the distinct serverName gives the GKE cluster its
  # own archive prefix, so it never trips CNPG's empty-archive check against
  # the prefix the home cluster is live-archiving into.
  backup:
    serverName: authentik-pg-gke
  externalClusters:
    - name: authentik-pg
      barmanObjectStore:
        destinationPath: "gs://h0melab-cnpg-backups/authentik-pg/"
        googleCredentials:
          applicationCredentials:
            name: authentik-pg-backup-gcs
            key: service-account-key.json
        wal:
          compression: gzip
