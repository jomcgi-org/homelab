# GKE authentik-pg recovery from the off-cluster GCS Barman object store.
# Consumed by PR #5464's gke-apps Applications (not referenced by this branch).
cnpg:
  bootstrap:
    recovery:
      # CNPG 1.30 behavior: The recovery-minted app Secret password overwrites
      # the restored owner role after recovery completes. No manual ALTER ROLE
      # step is required.
      source: authentik-pg
      database: authentik
      owner: authentik
  backup:
    serverName: authentik-pg-gke
  externalClusters:
    - name: authentik-pg
      barmanObjectStore:
        destinationPath: "gs://h0melab-cnpg-backups/authentik-pg/"
        googleCredentials:
          applicationCredentials:
            name: authentik-pg-backup-gcs
            key: service-account-key.json
        wal:
          compression: gzip
