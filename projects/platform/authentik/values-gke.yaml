# Hub overlay: one authentik server and worker replica. CNPG bootstraps by
# recovery from the retired home cluster's GCS Barman archive prefix.
# Consumed by the platform-gke authentik Application.
# Discord sign-in for Grimoire is on (#7461, enabled by Joe on 2026-11-12).
# Any Discord account with a verified email can enrol; campaign admission
# still needs an invitation or campaign link.
grimoireDiscordSource:
  enabled: true

authentik:
  server:
    replicas: 1
  worker:
    replicas: 1

cnpg:
  storage:
    storageClass: standard-rwo
  bootstrap:
    recovery:
      # CNPG 1.30 behavior: The recovery-minted app Secret password overwrites
      # the restored owner role after recovery completes. No manual ALTER ROLE
      # step is required.
      source: authentik-pg
      database: authentik
      owner: authentik
  # Backup stays enabled: the distinct serverName gives the hub its own
  # archive prefix, separate from the old home archive used for recovery.
  backup:
    serverName: authentik-pg-gke
  externalClusters:
    - name: authentik-pg
      barmanObjectStore:
        destinationPath: "gs://h0melab-cnpg-backups/authentik-pg/"
        googleCredentials:
          applicationCredentials:
            name: authentik-pg-backup-gcs
            key: service-account-key.json
        wal:
          compression: gzip
