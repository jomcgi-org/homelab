version: 1
metadata:
  name: homelab - grimoire onboarding
entries:
  - model: authentik_flows.flow
    id: enrollment
    identifiers:
      slug: grimoire-enrollment
    attrs:
      name: Grimoire enrollment
      title: Join Grimoire
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_stages_invitation.invitationstage
    id: invitation
    identifiers:
      name: grimoire-invitation
    attrs:
      continue_flow_without_invitation: false
  - model: authentik_stages_prompt.prompt
    id: username
    identifiers:
      name: grimoire-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      order: 0
  - model: authentik_stages_prompt.prompt
    id: name
    identifiers:
      name: grimoire-name
    attrs:
      field_key: name
      label: Display name
      type: text
      required: true
      order: 1
  - model: authentik_stages_prompt.prompt
    id: password
    identifiers:
      name: grimoire-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      order: 2
  - model: authentik_stages_prompt.prompt
    id: password-repeat
    identifiers:
      name: grimoire-password-repeat
    attrs:
      field_key: password_repeat
      label: Repeat password
      type: password
      required: true
      order: 3
  - model: authentik_policies_expression.expressionpolicy
    id: validate-invitation
    identifiers:
      name: grimoire-validate-invitation
    attrs:
      expression: |
        from authentik.core.models import User
        from django.core.validators import validate_email
        from django.core.exceptions import ValidationError
        plan = request.context.get("flow_plan")
        invitation = plan.context.get("invitation") if plan else None
        if invitation is None or not invitation.single_use:
            ak_message("Ask the administrator for a single-use Grimoire invitation.")
            return False
        if not invitation.flow or invitation.flow.slug != "grimoire-enrollment":
            return False
        email = str(invitation.fixed_data.get("email", "")).strip().lower()
        try:
            validate_email(email)
        except ValidationError:
            ak_message("The invitation must include your email in Fixed data.")
            return False
        if User.objects.filter(email__iexact=email).exists():
            ak_message("An account already uses this email. Sign in with that account.")
            return False
        data = request.context.get("prompt_data", {})
        if len(data.get("password", "")) < 12:
            ak_message("Use a password with at least 12 characters.")
            return False
        # The recipient cannot replace the address selected by the administrator.
        data["email"] = email
        plan.context["redirect"] = "https://friends.jomcgi.dev/grimoire"
        return True
  - model: authentik_stages_prompt.promptstage
    id: prompt
    identifiers:
      name: grimoire-details
    attrs:
      fields: [!KeyOf username, !KeyOf name, !KeyOf password, !KeyOf password-repeat]
      validation_policies: [!KeyOf validate-invitation]
  - model: authentik_stages_user_write.userwritestage
    id: write
    identifiers:
      name: grimoire-create-user
    attrs:
      user_creation_mode: always_create
      user_type: external
      user_path_template: grimoire
  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: grimoire-login
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf invitation
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf prompt
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf write
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf login
      order: 30
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: grimoire
    attrs:
      client_type: confidential
      client_id: grimoire-friends
      client_secret: !Env GRIMOIRE_OIDC_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://friends.jomcgi.dev/grimoire/oauth2/callback
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: application
    identifiers:
      slug: grimoire
    attrs:
      name: Grimoire
      provider: !KeyOf provider
      meta_launch_url: https://friends.jomcgi.dev/grimoire
      meta_description: Your campaigns and character sheets.
  - model: authentik_policies_expression.expressionpolicy
    id: human-access
    identifiers:
      name: grimoire-human-access
    attrs:
      expression: |
        return request.user.is_active and request.user.type != "service_account" and bool(request.user.email)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      policy: !KeyOf human-access
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
