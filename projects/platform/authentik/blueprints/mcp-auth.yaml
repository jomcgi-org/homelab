version: 1
metadata:
  name: homelab - MCP auth
  labels:
    blueprints.goauthentik.io/description: |
      Group, application gate and MFA enforcement for the central MCP endpoint.
      Context Forge maps the group name below onto one of its teams via the
      sso_providers team_mapping, and filters the tool catalogue from team
      membership, so this group is the thing that decides who sees which tools.
entries:
  # ── 1. The group entitlements hang off ──────────────────────────────────
  # The name is load-bearing: it must match the key in Context Forge's
  # sso_providers.team_mapping, because authentik emits group NAMES (not ids)
  # in the `groups` claim of the default profile scope.
  - model: authentik_core.group
    id: homelab-admin
    identifiers:
      name: homelab-admin
    attrs:
      is_superuser: false

  # ── 2. Membership ───────────────────────────────────────────────────────
  # `attrs` REPLACES a many-to-many rather than merging into it, so the
  # existing "authentik Admins" membership has to be restated here or applying
  # this blueprint would silently strip it and lock the only human account out
  # of the authentik admin interface.
  - model: authentik_core.user
    identifiers:
      username: akadmin
    attrs:
      groups:
        - !Find [authentik_core.group, [name, authentik Admins]]
        - !KeyOf homelab-admin
        # `family` is declared and owned by moving-auth.yaml, not here, and
        # referencing it across files is deliberate rather than sloppy.
        #
        # user.groups and group.users are the SAME many-to-many relation, and
        # a blueprint sets the whole list rather than appending to it. If
        # moving-auth.yaml also declared membership (from the group's side, as
        # `users:`), the two files would each replace what the other wrote and
        # the membership would flap on every reconcile: present after one pass,
        # gone after the next. That presents as intermittent 403s on
        # friends.jomcgi.dev/moving, which is a miserable thing to debug.
        #
        # So akadmin's group list has exactly ONE writer, and it is this entry.
        # Anyone adding akadmin to a future group adds it here too.
        #
        # Other `family` members (Anna) are added in the UI on purpose. No
        # blueprint declares their user, so nothing in Git can fight the UI
        # over their membership.
        - !Find [authentik_core.group, [name, family]]

  # ── 3. Gate the MCP application ─────────────────────────────────────────
  # Until this exists the application has ZERO policy bindings, which in
  # authentik means every authenticated account may authorize it. That was
  # tolerable while akadmin was the only human account and the virtual servers
  # were empty; it is not once the catalogue is attached.
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, mcp-friends]]
      group: !KeyOf homelab-admin
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # ── 4. Make the existing MFA stage actually enforce ─────────────────────
  # authentik's own default-authentication-flow blueprint already creates and
  # binds `default-authentication-mfa-validation`, but with no attrs at all, so
  # it sits at the model default `not_configured_action: skip`. A user with no
  # registered device passes straight through: the stage is present and
  # enforces nothing.
  #
  # `configure` is deliberate over `deny`: it enrols a device inline on first
  # login instead of locking out an account that has none yet. Recovery if
  # WebAuthn enrolment misbehaves is `kubectl exec ... -- ak shell`, which is
  # how the akadmin password was fixed earlier.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      configuration_stages:
        - !Find [
            authentik_stages_authenticator_webauthn.authenticatorwebauthnstage,
            [name, default-authenticator-webauthn-setup],
          ]

  # ── 5. Name the monolith as a token audience ────────────────────────────
  # Context Forge's ACL is tool-granular: it decides whether you may CALL a
  # tool, never what the tool returns. For the monolith to scope its own
  # results it must know the caller, and the only verifiable way to tell it is
  # to forward the caller's token (see mcp PR #4565; a header would just ask
  # the monolith to believe us).
  #
  # But that token's `aud` names only the OAuth client, so the monolith would
  # be accepting a credential minted for somebody else. RFC 8693 token exchange
  # is the correct fix and Context Forge implements it (keyed by
  # gateway+user+audience), but authentik does not advertise the token-exchange
  # grant, so it is unavailable.
  #
  # `aud` is permitted to be an array (RFC 7519 4.1.3), and authentik merges
  # scope-mapping claims OVER the standard fields, for access tokens too:
  #
  #     id_dict.pop("claims"); id_dict.update(self.claims)     # to_dict()
  #     final = self.to_dict(); final["azp"] = provider.client_id  # to_access_token()
  #
  # So one mapping makes the monolith a named audience. `azp` is set after the
  # merge and still identifies the client, so "who requested this" survives.
  #
  # The client id MUST stay first in the list: Context Forge validates with
  # PyJWT, which matches on any element, so this stays backwards compatible and
  # api_audience needs no change. If this expression ever fails, authentik
  # falls back to aud = client_id, which is exactly today's behaviour.
  #
  # Scope is `openid` deliberately. A dedicated scope would never be evaluated,
  # because the client only requests `openid profile email`.
  #
  # This is weaker than real token exchange and the difference is worth stating:
  # exchange mints a SEPARATE token per audience, so a backend cannot replay it
  # elsewhere. One multi-audience token is a single bearer credential valid at
  # both. That replay path is closed at the network layer instead, by the
  # CiliumNetworkPolicy in the monolith chart.
  - model: authentik_providers_oauth2.scopemapping
    id: mcp-audience
    identifiers:
      name: "MCP: multi-audience"
    attrs:
      name: "MCP: multi-audience"
      scope_name: openid
      description: "Adds the monolith as a second token audience so it can validate calls it receives."
      expression: |
        return {"aud": [provider.client_id, "https://private.jomcgi.dev"]}

  # Binding REPLACES the provider's mapping list rather than appending, so the
  # three managed defaults are restated. Omitting them would strip email,
  # profile and the groups claim that team_mapping depends on.
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: mcp-friends
    attrs:
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !KeyOf mcp-audience
