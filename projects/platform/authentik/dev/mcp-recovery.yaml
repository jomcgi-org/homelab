# Inactive preparation for the isolated factory recovery proof (#4322).
# The chart only loads blueprints/*.yaml, so this dev/ file is not applied.
# Activation must verify unused identities, the exact server version and the
# dev token accept/reject matrix under the delegated operational review.
#
# The broker authenticates kg-agent-recovery-sa with its own app password.
# Mint that password for this user and store it in the dedicated 1Password item
# embervm-authentik-recovery-agent, field app-password. This blueprint contains
# no password and does not create one. Do not copy a production broker grant.
version: 1
metadata:
  name: homelab - isolated factory recovery MCP auth
  labels:
    blueprints.goauthentik.io/description: |
      Dedicated service account, application gate and audience for the
      inactive Monolith/Ember GKE recovery profile.
entries:
  - model: authentik_core.group
    id: recovery-agents
    identifiers:
      name: kg-agent-recovery
    attrs:
      is_superuser: false

  - model: authentik_core.user
    id: recovery-agent
    identifiers:
      username: kg-agent-recovery-sa
    attrs:
      name: Factory recovery MCP service account
      type: service_account
      is_active: true
      # This entry owns only the new user's complete group membership.
      groups:
        - !KeyOf recovery-agents

  - model: authentik_providers_oauth2.scopemapping
    id: recovery-audience
    identifiers:
      name: Factory recovery MCP audience
    attrs:
      scope_name: openid
      description: Names only the recovery client and dev Monolith audience.
      expression: |
        return {"aud": [provider.client_id, "https://factory-recovery.jomcgi.dev"]}

  - model: authentik_providers_oauth2.oauth2provider
    id: recovery-provider
    identifiers:
      name: mcp-recovery
    attrs:
      client_type: confidential
      client_id: mcp-recovery
      # Authentik's M2M path uses username plus app password, not the
      # provider's client secret. Keep the server-generated default secret.
      grant_types:
        - client_credentials
      issuer_mode: per_provider
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      redirect_uris: []
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !KeyOf recovery-audience

  # The slug determines the per-provider issuer and JWKS path used by the
  # recovery Monolith preset. The shared signing key alone is not isolation:
  # the verifier must require this issuer and the distinct recovery audience.
  - model: authentik_core.application
    id: recovery-app
    identifiers:
      slug: mcp-recovery
    attrs:
      name: Factory recovery agents
      provider: !KeyOf recovery-provider
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-app
      group: !KeyOf recovery-agents
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
