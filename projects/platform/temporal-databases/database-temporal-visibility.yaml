# Declarative CNPG Database for Temporal's visibility (advanced visibility /
# list-workflow) store. Created on the existing monolith-pg cluster via the
# CloudNativePG Database controller. Additive — no edit to the Cluster resource.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-visibility
  namespace: monolith
spec:
  cluster:
    name: monolith-pg
  name: temporal_visibility
  owner: app
  # Decommissioning: absent tells CNPG to DROP the database. See database-temporal.yaml.
  ensure: absent
