# Declarative CNPG Database for Temporal's core (history/persistence) store.
# Managed by the CloudNativePG operator's Database controller (CRD), which
# issues CREATE DATABASE against the existing monolith-pg cluster. Additive:
# does not touch the Cluster resource or its bootstrap initdb block.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal
  namespace: monolith
spec:
  cluster:
    name: monolith-pg
  name: temporal
  owner: app
  # Decommissioning the lakehouse/Temporal stack: absent tells CNPG to DROP the
  # database (reclaims disk on monolith-pg). Removed entirely in a follow-up once
  # the drop is confirmed.
  ensure: absent
