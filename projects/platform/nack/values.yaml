# NATS JetStream Controller (nack) configuration for homelab.
#
# nack provides the jetstream.nats.io Stream/Consumer/Account CRDs and reconciles
# them against the shared NATS JetStream server in the `nats` namespace. Stream CRs
# live in projects/platform/nats-streams (sync-wave 2, after this controller).
#
# Connection model: each Stream CR carries its own spec.servers list, so a
# global controller-level NATS URL is not strictly required. We still set
# jetstream.nats.url here as the default connection for any resource that omits
# spec.servers, keeping the controller pointed at the in-cluster server.
#
# Values are nested under `nack:` because the upstream chart is consumed as a
# dependency named `nack`.
nack:
  jetstream:
    enabled: true

    # Default NATS server the controller connects to. Streams may override via
    # spec.servers, but pointing the controller here keeps reconciliation working
    # for resources that don't.
    nats:
      url: nats://nats.nats.svc.cluster.local:4222

  # Use modern app.kubernetes.io/* labels and chart-name-based resource names,
  # which is the recommended setting when nack runs as a subchart.
  useLegacyNames: false

  # Watch Stream/Consumer/Account CRs across all namespaces (the CRs live in the
  # `nats` namespace today, but cluster-wide keeps future producers flexible).
  namespaced: false

  # NATS uses a binary protocol on 4222; mark opaque so Linkerd does not try to
  # protocol-detect outbound connections to the NATS server.
  podAnnotations:
    config.linkerd.io/opaque-ports: "4222"

  # Run the controller as non-root (uid 65532 homelab convention).
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
