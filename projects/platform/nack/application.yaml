apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    # Wave 1: deploy the controller (and its CRDs) before the Stream CRs in nats-streams (wave 2).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi/homelab.git
    path: projects/platform/nack
    targetRevision: HEAD
    helm:
      releaseName: nack
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # nack ships its CRDs as regular templates (crds/ dir applied as resources);
      # ServerSideApply avoids the "metadata.annotations too long" error on large CRDs.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
