{{- if .Values.smokeTest.enabled }}
# Smoke test: boots a microVM via the kata-fc RuntimeClass and prints the guest
# kernel. If the kernel differs from node-4's host kernel, a Firecracker microVM
# booted. Disable via smokeTest.enabled=false once validated.
apiVersion: batch/v1
kind: Job
metadata:
  name: kata-fc-smoke
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kata-fc-smoke
    spec:
      runtimeClassName: kata-fc
      restartPolicy: Never
      containers:
        - name: uname
          image: {{ .Values.smokeTest.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "=== inside kata-fc microVM ==="
              echo "guest_kernel=$(uname -r)"
              uname -a
              echo "vcpus=$(nproc)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
{{- end }}
