{{- /*
Path-based private ingress: https://private.jomcgi.dev/app/argocd

The gateway forwards the full /app/argocd prefix intact (no URLRewrite):
argocd-server runs with server.rootpath=/app/argocd (values-cluster.yaml),
so it serves the UI, API, and websockets under the prefix and rewrites the
index.html base href to /app/argocd/. basehref alone with a stripped prefix
did not rewrite the base href in v3.x, leaving the UI blank.

Trade-off: rootpath moves the API off / as well, so in-cluster clients must
use the prefix (e.g. http://argocd-server.argocd.svc/app/argocd/api/...).
The monolith reads ArgoCD via the Kubernetes API (Application CRs) and
Image Updater runs in kubernetes application-API mode, so neither is
affected; the runtime-registered argocd-mcp server needs its base URL
updated to include /app/argocd.
*/}}
{{- if .Values.cfIngress.enabled }}
{{- $routeParams := dict
  "name" "argocd-private"
  "tier" .Values.cfIngress.tier
  "hostname" .Values.cfIngress.hostname
  "pathPrefix" .Values.cfIngress.pathPrefix
  "serviceName" .Values.cfIngress.serviceName
  "servicePort" .Values.cfIngress.servicePort
  "gateway" .Values.cfIngress.gateway
}}
# nosemgrep: cfingress-rewrite-needs-slash-redirect
{{ $_ := set $routeParams "rewritePrefix" "/" }}
{{- include "cf-ingress.httproute" $routeParams }}
---
{{- include "cf-ingress.security-policy" (dict "name" "argocd-private") }}
{{- end }}
{{- if .Values.cfIngress.githubWebhook.enabled }}
---
{{- /*
GitHub push webhook ingress, gated independently of the UI route above so the
hub (which deliberately serves no /app/argocd UI) can still take push events.

GitHub POSTs to private.jomcgi.dev/webhooks/github/argocd (a clean,
service-agnostic webhook namespace); the gateway rewrites that to
argocd-server's real webhook endpoint. The target is cluster-specific because
argocd-server serves the API under server.rootpath
(cfIngress.githubWebhook.rewritePrefix): the hub leaves rootpath at the
default, so /api/webhook; the home cluster sets rootpath=/app/argocd, so
/app/argocd/api/webhook. Rewriting to the wrong one answers 404.

Deliberately NO cf-ingress.security-policy on this route: GitHub bypasses
Cloudflare Access at the edge via an IP-allowlist Bypass policy, so its request
carries no Cf-Access-Jwt-Assertion. A cf-access SecurityPolicy would make the
Envoy gateway reject the (JWT-less) webhook even though Cloudflare admitted it.
Access control for this path is the edge IP allowlist; argocd treats the hook as
a refresh trigger (no webhook secret configured, unsigned hooks are harmless).
*/}}
{{- $webhookParams := dict
  "name" "argocd-github-webhook"
  "tier" .Values.cfIngress.tier
  "hostname" .Values.cfIngress.hostname
  "pathPrefix" "/webhooks/github/argocd"
  "rewritePrefix" .Values.cfIngress.githubWebhook.rewritePrefix
  "serviceName" .Values.cfIngress.serviceName
  "servicePort" .Values.cfIngress.servicePort
  "gateway" .Values.cfIngress.gateway
}}
{{- include "cf-ingress.httproute" $webhookParams }}
{{- end }}
