apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi/homelab.git
    targetRevision: HEAD
    path: projects/platform/argocd
    helm:
      releaseName: argocd
      valueFiles:
        - values.yaml
        - values-cluster.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The ignoreDifferences block that used to sit here suppressed the
  # Gateway-API defaults (parentRefs.group/kind, backendRefs.group/kind/weight)
  # that ServerSideApply surfaces as permanent drift. cf-ingress-library now
  # DECLARES those fields instead, so the diff converges on its own and there
  # is nothing left to suppress.
  #
  # Declaring beats ignoring here for the same reason /spec/replicas stopped
  # being ignored fleet-wide (see argocd values.yaml): the old list included
  # `.spec.rules[].backendRefs[].weight`, a live traffic-shaping field. Any
  # deliberate weight change in a chart would have been silently dropped, with
  # the Application still reporting Synced. Suppression is quiet, not safe.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
