# Factory home cluster overlay (projects/platform-factory/argocd).
#
# The UI is published at factory-argocd.jomcgi.dev through the edge Gateway
# (projects/platform-factory/edge/), which signs every request in through
# Authentik before it reaches ArgoCD; ArgoCD then runs its own Authentik OIDC
# login. The tunnel terminates TLS at Cloudflare and forwards plain HTTP, so
# argocd-server serves HTTP.
argo-cd:
  global:
    priorityClassName: system-cluster-critical
  server:
    replicas: 1
    # Behind the edge Gateway's Authentik sign-in.
    httproute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: edge
          namespace: edge
      hostnames:
        - factory-argocd.jomcgi.dev
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
  controller:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1536Mi
  redis:
    resources:
      requests:
        cpu: 15m
        memory: 32Mi
      limits:
        memory: 128Mi
  configs:
    cm:
      url: https://factory-argocd.jomcgi.dev
      # Sign-in is Authentik only. Break-glass is kubectl, or the argocd CLI
      # in --core mode, with the cluster kubeconfig
      # (projects/factory-cluster/README.md).
      admin.enabled: "false"
      timeout.reconciliation: "180s"
      # The client secret is generated in the cluster and copied here by the
      # authentik-secret-init Job (projects/platform-factory/authentik/).
      oidc.config: |
        name: Authentik
        issuer: https://factory-auth.jomcgi.dev/application/o/factory-argocd/
        clientID: factory-argocd
        clientSecret: $argocd-authentik-oidc:client-secret
        requestedScopes:
          - openid
          - profile
          - email
    rbac:
      # Authentik's groups claim; the provider admits only authentik Admins
      # (projects/platform/authentik/factory-blueprints/).
      scopes: "[groups]"
      policy.default: ""
      policy.csv: |
        g, authentik Admins, role:admin
    params:
      server.insecure: "true"
