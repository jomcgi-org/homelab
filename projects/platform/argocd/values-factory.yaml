# Factory home cluster overlay (projects/platform-factory/argocd).
#
# The UI is published at factory-argocd.jomcgi.dev through the edge Gateway
# (projects/platform-factory/edge/), which signs every request in through
# Authentik before it reaches ArgoCD; ArgoCD then runs its own Authentik OIDC
# login. The tunnel terminates TLS at Cloudflare and forwards plain HTTP, so
# argocd-server serves HTTP.
argo-cd:
  global:
    # The v3.3.18 image index, pinned by digest (HOME-287).
    image:
      repository: quay.io/argoproj/argocd
      tag: "v3.3.18@sha256:97c99bcbae3bcdd38d47d41e468a95a7735b23bdd2508c24f7bbf6e9a6ca8bee"
    priorityClassName: system-cluster-critical
  server:
    replicas: 1
    # Behind the edge Gateway's Authentik sign-in.
    httproute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: edge
          namespace: edge
      hostnames:
        - factory-argocd.jomcgi.dev
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Controller and redis from the 2-day peaks (2026-11-16: 577Mi, 84Mi)
  # plus about 15%. The last three had no requests (BestEffort).
  controller:
    resources:
      requests:
        cpu: 250m
        memory: 640Mi
      limits:
        memory: 1536Mi
  redis:
    image:
      repository: docker.io/library/redis
      tag: "7.2.11-alpine@sha256:1a34bdba051ecd8a58ec8a3cc460acef697a1605e918149cc53d920673c1a0a7"
    resources:
      requests:
        cpu: 15m
        memory: 96Mi
      limits:
        memory: 192Mi
  # The applicationset controller peaked at 131Mi (14-16 Nov).
  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 144Mi
  dex:
    image:
      repository: ghcr.io/dexidp/dex
      tag: "v2.44.0@sha256:5d0656fce7d453c0e3b2706abf40c0d0ce5b371fb0b73b3cf714d05f35fa5f86"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
  notifications:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
  configs:
    cm:
      url: https://factory-argocd.jomcgi.dev
      # Sign-in is Authentik only. Break-glass is kubectl, or the argocd CLI
      # in --core mode, with the cluster kubeconfig
      # (projects/factory-cluster/README.md).
      admin.enabled: "false"
      timeout.reconciliation: "180s"
      # Job health, as ArgoCD's built-in check (Failed is Degraded, Complete
      # is Healthy, Suspended is Suspended, else Progressing), with one
      # exception: a running Discord history import Job is Healthy. A sync
      # waits for every synced resource to be healthy, and an import may run
      # for up to 24 h, so it held every factory change behind it
      # (2026-11-26, discord-import-5). The import skips stored channel-days,
      # so a rerun after a failure loses nothing. A failed import is still
      # Degraded.
      resource.customizations.health.batch_Job: |
        hs = {}
        local function condition(kind)
          if obj.status ~= nil and obj.status.conditions ~= nil then
            for _, c in ipairs(obj.status.conditions) do
              if c.type == kind and c.status == "True" then
                return c
              end
            end
          end
          return nil
        end
        local failed = condition("Failed")
        if failed ~= nil then
          hs.status = "Degraded"
          hs.message = failed.message or "Job failed"
          return hs
        end
        if condition("Complete") ~= nil then
          hs.status = "Healthy"
          hs.message = "Job completed"
          return hs
        end
        if condition("Suspended") ~= nil or (obj.spec ~= nil and obj.spec.suspend == true) then
          hs.status = "Suspended"
          hs.message = "Job is suspended"
          return hs
        end
        local name = obj.metadata.name or ""
        if obj.metadata.namespace == "factory-discord" and string.find(name, "^discord%-import%-") ~= nil then
          hs.status = "Healthy"
          hs.message = "Discord history import runs in the background"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Job is running"
        return hs
      # The client secret is generated in the cluster and copied here by the
      # authentik-secret-init Job (projects/platform-factory/authentik/).
      oidc.config: |
        name: Authentik
        issuer: https://factory-auth.jomcgi.dev/application/o/factory-argocd/
        clientID: factory-argocd
        clientSecret: $argocd-authentik-oidc:client-secret
        requestedScopes:
          - openid
          - profile
          - email
    rbac:
      # Authentik's groups claim; the provider admits both factory operator groups
      # (projects/platform/authentik/factory-blueprints/).
      scopes: "[groups]"
      policy.default: ""
      policy.csv: |
        g, authentik Admins, role:admin
        g, factory-operators, role:admin
    params:
      server.insecure: "true"
