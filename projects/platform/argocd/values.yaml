globals:
  logging:
    format: json

# Path-based private ingress. The connection details below are the same on both
# clusters; each cluster's values file only toggles the two routes on or off.
#
# `enabled` gates the ArgoCD UI route (https://private.jomcgi.dev/app/argocd,
# which replaced the former argocd.jomcgi.dev tunnel route retired in PR #2534).
# The hub leaves it off deliberately (docs/security.md) and reaches ArgoCD
# through the Kubernetes API over the tailnet.
cfIngress:
  enabled: false
  tier: trusted
  hostname: private.jomcgi.dev
  pathPrefix: /app/argocd
  serviceName: argocd-server
  servicePort: 80
  gateway:
    name: cloudflare-ingress
    namespace: envoy-gateway-system
  # GitHub push webhook ingress, gated separately from the UI route because the
  # hub serves no UI but still needs GitHub POSTs to reach argocd-server. With
  # no route here they fall through to the monolith's private route, whose
  # cf-access SecurityPolicy answers 401.
  #
  # Deliberately NO SecurityPolicy on this route: GitHub bypasses Cloudflare
  # Access at the edge via the "Github Webhooks" Access app's IP-allowlist
  # Bypass policy and sends no Access JWT, so a cf-access SecurityPolicy would
  # reject every real delivery. The edge IP allowlist is the access control,
  # and ArgoCD treats the hook as an unsigned refresh trigger.
  githubWebhook:
    enabled: false
    # The gateway rewrites the external /webhooks/github/argocd path to
    # argocd-server's real webhook endpoint. That endpoint sits under
    # server.rootpath, which is per cluster: the hub leaves rootpath at the
    # default, the home cluster sets it to /app/argocd. Cluster values files
    # point this at the matching path.
    rewritePrefix: /api/webhook

argo-cd:
  configs:
    cm:
      accounts.mcp-agent: apiKey
      # The OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_EXPORTER_OTLP_PROTOCOL ignores
      # were REMOVED with SigNoz (#5362), and removing them is the point rather
      # than cleanup.
      #
      # Kyverno's inject-otel-env-vars ClusterPolicy used to add those two env
      # vars to every Deployment at admission, and this ignore existed so the
      # resulting drift did not park every workload OutOfSync. The policy is now
      # disabled, but disabling it does not undo what it already wrote: the
      # mutation landed in the Deployment SPECS, so the values survive a rollout,
      # and while these ignores stood ArgoCD treated them as someone else's field
      # and left them alone. 83 workloads were left pointing at a SigNoz endpoint
      # that no longer resolves.
      #
      # Dropping the ignores hands the cleanup back to the normal sync loop:
      # ArgoCD sees the live env that no chart declares, prunes it, and the
      # workload rolls once. Expect a one-time fleet-wide roll on the first sync
      # after this lands, ArgoCD's own components included.
      #
      # Do NOT reintroduce these as a startswith("OTEL_") match if injection ever
      # returns: charts define their own OTEL vars (monolith sets
      # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT and OTEL_COLLECTOR_HTTP_URL), and a
      # prefix match would strip those from the live side and manufacture a fresh
      # diff.
      #
      # Ignore kubectl.kubernetes.io/restartedAt: it is written by
      # `kubectl rollout restart`, never appears in a chart, and otherwise leaves
      # any manually-restarted Deployment permanently OutOfSync (e.g. monolith
      # carried one from an April restart). The "/" in the annotation key is
      # JSON-Pointer-escaped as "~1".
      resource.customizations.ignoreDifferences.apps_Deployment: |
        jqPathExpressions:
          # kubectl writes restartedAt into live; after it is ignored, live can
          # be left with an EMPTY annotations map while the predicted state
          # drops the key, and gitops-engine treats {} != absent (permanent
          # OutOfSync; the 2026-07-04 monolith saga). Delete the WHOLE map iff
          # every key in it is that one (vacuously true for {}), which is
          # order-independent w.r.t. the jsonPointers below and can never mask
          # real annotation drift (e.g. config checksums): any other key keeps
          # the map, and the pointer then strips just that entry.
          #
          # otel.injected-by was dropped from this list deliberately. It is no
          # longer ignored, so ArgoCD prunes it along with the env vars, and the
          # empty-map case it leaves behind is still handled here because the
          # select is vacuously true for {}.
          - '.spec.template.metadata.annotations | select(all(keys[]; . == "kubectl.kubernetes.io/restartedAt"))'
        jsonPointers:
          - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
          # /spec/replicas used to be ignored HERE, fleet-wide. It is now scoped
          # to the three Applications that actually have a controller owning
          # replicas (monolith, monolith-public, embervm), via ignoreDifferences
          # on each Application.
          #
          # The old rationale was "the chart omits replicas so the HPA owns it",
          # which is true for the HPA charts and false for every other chart in
          # the cluster. A chart that DOES render `replicas:` had its value
          # silently ignored: no drift, no warning, and the Application still
          # reported Synced and Healthy while the live count never moved.
          # cloudflare-gateway hit exactly that (PR #4168 merged green and did
          # nothing; the tunnel stayed at 2 replicas), which is a bad failure
          # mode because every signal says success.
          #
          # Fleet-wide was never safe, only quiet. Keep replica ignores scoped
          # to the specific Application whose controller owns the field.
      # The same {} != absent asymmetry as the Deployment annotations above, but
      # arriving from the opposite direction. The upstream Kyverno chart renders
      # `annotations: {}` and `labels: {}` on its CRDs; the apiserver drops an
      # empty map on write, so live has no key at all while the predicted state
      # keeps {}. Eleven policies.kyverno.io CRDs sat OutOfSync on nothing else.
      #
      # Unlike a field-level ignore this cannot mask real drift: the map is
      # deleted only when it is already empty, so any actual label or annotation
      # keeps it and the normal diff applies. Nothing upstream to fix here, which
      # is why this is a normalizer rather than a chart change like the rest of
      # this PR. Kyverno already syncs with RespectIgnoreDifferences=true.
      #
      # Indentation is load-bearing: this key must sit under `cm:`, alongside
      # the apps_Deployment entry above. Landed one level out (a sibling of
      # `cm:`) it becomes configs.resource.customizations..., which the
      # argo-cd chart reads nothing from. That renders no ConfigMap entry at
      # all, and it is silent the whole way: valid YAML, green lint, green
      # tests, green PR checks, and the Application still reports Synced
      # because the manifest it applied genuinely matches git. Verify a change
      # here by rendering the ConfigMap, not by the app going Synced.
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        jqPathExpressions:
          - '.metadata.annotations | select(. != null and length == 0)'
          - '.metadata.labels | select(. != null and length == 0)'
    rbac:
      policy.csv: |
        p, mcp-agent, applications, *, */*, allow
        p, mcp-agent, projects, get, *, allow
        p, mcp-agent, clusters, get, *, allow
