globals:
  logging:
    format: json

# Path-based private ingress, disabled by default.
# Cluster-specific config lives in values-cluster.yaml.
cfIngress:
  enabled: false

argo-cd:
  configs:
    cm:
      accounts.mcp-agent: apiKey
      # Kyverno's inject-otel-env-vars ClusterPolicy mutates every Deployment at
      # admission to add the otel.injected-by annotation and exactly two env
      # vars: OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_EXPORTER_OTLP_PROTOCOL. ArgoCD
      # renders charts without those, so affected Deployments sit permanently
      # OutOfSync (Healthy, but the noise hides genuine drift). Ignore EXACTLY the
      # two injected names, not all OTEL_* : charts define their own OTEL vars
      # (e.g. monolith sets OTEL_EXPORTER_OTLP_TRACES_ENDPOINT and
      # OTEL_COLLECTOR_HTTP_URL), and a startswith("OTEL_") match would strip
      # those from the live side too and manufacture a fresh diff.
      # Policy: projects/platform/kyverno/templates/otel-injection-policy.yaml.
      #
      # Also ignore kubectl.kubernetes.io/restartedAt: it is written by
      # `kubectl rollout restart`, never appears in a chart, and otherwise leaves
      # any manually-restarted Deployment permanently OutOfSync (e.g. monolith
      # carried one from an April restart). The "/" in the annotation key is
      # JSON-Pointer-escaped as "~1".
      resource.customizations.ignoreDifferences.apps_Deployment: |
        jqPathExpressions:
          - '.spec.template.spec.containers[].env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
          - '.spec.template.spec.initContainers[]?.env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
          # Kyverno/kubectl inject otel.injected-by + restartedAt into live;
          # after they are ignored, live is left with an EMPTY annotations map
          # while the predicted state drops the key, and gitops-engine treats
          # {} != absent (permanent OutOfSync; the 2026-07-04 monolith saga).
          # Delete the WHOLE map iff every key in it is one of the injected
          # ones (vacuously true for {}), which is order-independent w.r.t.
          # the jsonPointers below and can never mask real annotation drift
          # (e.g. config checksums): any other key keeps the map, and the
          # pointers then strip just the injected entries.
          - '.spec.template.metadata.annotations | select(all(keys[]; . == "otel.injected-by" or . == "kubectl.kubernetes.io/restartedAt"))'
        jsonPointers:
          - /spec/template/metadata/annotations/otel.injected-by
          - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
          # /spec/replicas used to be ignored HERE, fleet-wide. It is now scoped
          # to the three Applications that actually have a controller owning
          # replicas (monolith, monolith-public, embervm), via ignoreDifferences
          # on each Application.
          #
          # The old rationale was "the chart omits replicas so the HPA owns it",
          # which is true for the HPA charts and false for every other chart in
          # the cluster. A chart that DOES render `replicas:` had its value
          # silently ignored: no drift, no warning, and the Application still
          # reported Synced and Healthy while the live count never moved.
          # cloudflare-gateway hit exactly that (PR #4168 merged green and did
          # nothing; the tunnel stayed at 2 replicas), which is a bad failure
          # mode because every signal says success.
          #
          # Fleet-wide was never safe, only quiet. Keep replica ignores scoped
          # to the specific Application whose controller owns the field.
    # The same {} != absent asymmetry as the Deployment annotations above, but
    # arriving from the opposite direction. The upstream Kyverno chart renders
    # `annotations: {}` and `labels: {}` on its CRDs; the apiserver drops an
    # empty map on write, so live has no key at all while the predicted state
    # keeps {}. Eleven policies.kyverno.io CRDs sat OutOfSync on nothing else.
    #
    # Unlike a field-level ignore this cannot mask real drift: the map is
    # deleted only when it is already empty, so any actual label or annotation
    # keeps it and the normal diff applies. Nothing upstream to fix here, which
    # is why this is a normalizer rather than a chart change like the rest of
    # this PR. Kyverno already syncs with RespectIgnoreDifferences=true.
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - '.metadata.annotations | select(. != null and length == 0)'
        - '.metadata.labels | select(. != null and length == 0)'
    rbac:
      policy.csv: |
        p, mcp-agent, applications, *, */*, allow
        p, mcp-agent, projects, get, *, allow
        p, mcp-agent, clusters, get, *, allow
