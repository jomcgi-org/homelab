argo-cd:
  server:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 125m
        memory: 256Mi
    # Same 1s/3 -> 5s/5 relaxation as repo-server below: argocd-server was one
    # of the four pods that tripped Unhealthy in the 01:00:26-32Z Sep 16 window.
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 5
  repoServer:
    replicas: 1
    # Manifest generation is CPU-bound and its memory peaks during render
    # storms; without bounds the repo-server competes with every other pod
    # on the shared node and its 1s/3 liveness probe kill-cycles during
    # contention (liveness kills at 01:00Z Sep 16, restarts on Sep 13-14).
    #
    # The 10000m CPU limit is burst headroom, not expected consumption: CPU is
    # compressible, the request stays 25m, and the 10m cache expiration below
    # makes every app re-render on that period. See values-cluster.yaml for the
    # measurements behind these numbers.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 10000m
        memory: 1Gi
    # 1s/3 kill-cycles the pod whenever the shared core node stalls for a few
    # seconds. 5s/5 still kills a genuinely dead pod inside the same 30s window.
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 5
  controller:
    # Memory limit 2Gi against a 1Gi request: sync storms spike well above the
    # request and the controller has an OOMKilled history on the home cluster.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
  redis:
    resources:
      requests:
        cpu: 15m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  configs:
    # Chart 9 removes prior defaults. Preserve hub behavior explicitly.
    cm:
      server.rbac.log.enforce.enable: "false"
      timeout.reconciliation: "180s"
      timeout.reconciliation.jitter: "0s"
    params:
      application.namespaces: ""
      applicationsetcontroller.enable.progressive.syncs: "false"
      applicationsetcontroller.namespaces: ""
      applicationsetcontroller.policy: "sync"
      controller.ignore.normalizer.jq.timeout: "1s"
      controller.operation.processors: "10"
      controller.repo.server.timeout.seconds: "60"
      controller.self.heal.timeout.seconds: "5"
      controller.status.processors: "20"
      controller.sync.timeout.seconds: "0"
      hydrator.enabled: "false"
      otlp.address: ""
      reposerver.parallelism.limit: "0"
      server.basehref: "/"
      server.disable.auth: "false"
      server.enable.gzip: "true"
      server.enable.proxy.extension: "false"
      server.insecure: "false"
      server.rootpath: ""
      server.staticassets: "/shared/app"
      server.x.frame.options: "sameorigin"
      reposerver.repo.cache.expiration: "10m"

cfIngress:
  # No UI route on the hub: ArgoCD is reached through the Kubernetes API over
  # the tailnet (docs/security.md). The push webhook route below is independent
  # and stays on so GitHub push events reach argocd-server instead of falling
  # through to the monolith's private route and its 401.
  enabled: false
  githubWebhook:
    enabled: true
