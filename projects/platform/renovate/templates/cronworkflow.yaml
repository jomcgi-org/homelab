apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: renovate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedules:
    - {{ .Values.schedule | quote }}
  timezone: {{ .Values.timezone | quote }}
  concurrencyPolicy: Forbid
  suspend: {{ .Values.suspend }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowSpec:
    entrypoint: renovate
    serviceAccountName: argo-workflow
    activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
    retryStrategy:
      limit: "2"
      retryPolicy: OnFailure
      backoff:
        duration: 1m
        factor: "2"
        maxDuration: 10m
    ttlStrategy:
      secondsAfterCompletion: 3600
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    podGC:
      strategy: OnWorkflowSuccess
    podMetadata:
      annotations:
        otel.injected-by: kyverno/inject-otel-env-vars
    securityContext:
      runAsNonRoot: true
      runAsUser: 12021
      runAsGroup: 12021
      fsGroup: 12021
      seccompProfile:
        type: RuntimeDefault
    templates:
      - name: renovate
        container:
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RENOVATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.onepassword.secretName }}
                  key: {{ .Values.onepassword.tokenKey }}
            - name: RENOVATE_PLATFORM
              value: github
            - name: RENOVATE_REPOSITORIES
              value: jomcgi/homelab
            - name: RENOVATE_AUTODISCOVER
              value: "false"
            - name: RENOVATE_ONBOARDING
              value: "false"
            - name: RENOVATE_REQUIRE_CONFIG
              value: required
            - name: RENOVATE_ALLOW_SCRIPTS
              value: "false"
            - name: RENOVATE_ALLOW_PLUGINS
              value: "false"
            - name: RENOVATE_ALLOWED_COMMANDS
              value: '["^bash projects/platform/renovate/scripts/bump-renovated-chart\\.sh projects/.+$", "^bazel/tools/format/update-python-requirements\\.sh$"]'
            - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
              value: '["bazelModDeps"]'
            - name: RENOVATE_BASE_DIR
              value: /tmp/renovate
            - name: RENOVATE_CONTAINERBASE_DIR
              value: /tmp/containerbase
            - name: HOME
              value: /tmp/renovate/home
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: info
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: workspace
              mountPath: /tmp
    volumes:
      - name: workspace
        emptyDir:
          sizeLimit: {{ .Values.workspace.sizeLimit }}
