{{- if eq .Values.workloadKind "CronWorkflow" }}
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: renovate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedules:
    - {{ .Values.schedule | quote }}
  timezone: {{ .Values.timezone | quote }}
  concurrencyPolicy: Forbid
  suspend: {{ .Values.suspend }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowSpec:
    entrypoint: renovate
    serviceAccountName: argo-workflow
    activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
    retryStrategy:
      limit: "2"
      retryPolicy: OnFailure
      backoff:
        duration: 1m
        factor: "2"
        maxDuration: 10m
    ttlStrategy:
      secondsAfterCompletion: 3600
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    podGC:
      strategy: OnWorkflowSuccess
    podMetadata:
      annotations:
        otel.injected-by: kyverno/inject-otel-env-vars
    securityContext:
      runAsNonRoot: true
      runAsUser: 12021
      runAsGroup: 12021
      fsGroup: 12021
      seccompProfile:
        type: RuntimeDefault
    templates:
      - name: renovate
        container:
          {{- include "renovate.container" . | nindent 10 }}
    volumes:
      - name: workspace
        emptyDir:
          sizeLimit: {{ .Values.workspace.sizeLimit }}
{{- end }}
