{{- if eq .Values.workloadKind "CronJob" }}
{{- $jobs := dict "renovate" .Values }}
{{- if (.Values.githubApp | default dict).enabled }}
{{- $_ := set $jobs "renovate-apko-lock-maintenance" .Values.apkoLockMaintenance }}
{{- end }}
{{- range $name, $job := $jobs }}
{{- with $ }}
{{- $githubApp := .Values.githubApp | default dict }}
{{- if and $githubApp.enabled (or (le (int $job.activeDeadlineSeconds) 0) (ge (int $job.activeDeadlineSeconds) 3600)) }}
{{- fail "GitHub App Jobs require activeDeadlineSeconds between 1 and 3599" }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: {{ $job.timezone | quote }}
  concurrencyPolicy: Forbid
  suspend: {{ $job.suspend }}
  startingDeadlineSeconds: {{ $job.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
      backoffLimit: 2
      # Keep failed Jobs and their logs for a day, bounded by the history limit.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          {{- if $githubApp.enabled }}
          initContainers:
            - name: github-app-token
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "--input-type=module", "--eval"]
              args:
                - |
                  {{- .Files.Get "files/github-app-token.mjs" | nindent 18 }}
              env:
                - name: GITHUB_APP_CREDENTIALS_DIR
                  value: /var/run/renovate-github-app
                - name: RENOVATE_TOKEN_DIR
                  value: /var/run/renovate-token
                - name: RENOVATE_USERNAME
                  value: {{ $githubApp.username | quote }}
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              volumeMounts:
                - name: github-app
                  mountPath: /var/run/renovate-github-app
                  readOnly: true
                - name: github-token
                  mountPath: /var/run/renovate-token
          {{- end }}
          containers:
            - name: renovate
              {{- if eq $name "renovate" }}
              {{- include "renovate.container" . | nindent 14 }}
              {{- else }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["/bin/bash", "/opt/renovate-apko/maintain.sh"]
              env:
                - name: HOME
                  value: /tmp/home
                - name: XDG_CACHE_HOME
                  value: /tmp/cache
              resources:
                {{- toYaml $job.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: github-token
                  mountPath: /var/run/renovate-token
                  readOnly: true
                - name: script
                  mountPath: /opt/renovate-apko
                  readOnly: true
                - name: workspace
                  mountPath: /tmp
              {{- end }}
          volumes:
            {{- if $githubApp.enabled }}
            - name: github-app
              secret:
                secretName: {{ .Values.onepassword.secretName }}
                defaultMode: 0440
                items:
                  - key: private-key
                    path: private-key
                  - key: app-id
                    path: app-id
                  - key: installation-id
                    path: installation-id
            - name: github-token
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            {{- end }}
            {{- if ne $name "renovate" }}
            - name: script
              configMap:
                name: renovate-apko-lock-maintenance
            {{- end }}
            - name: workspace
              emptyDir:
                sizeLimit: {{ $job.workspaceSizeLimit | default .Values.workspace.sizeLimit }}
{{- end }}
{{- end }}
{{- end }}
