apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-apko-lock-maintenance
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  custom-pins.py: |
{{ .Files.Get "files/custom-pins.py" | indent 4 }}
  pull-request.mjs: |
{{ .Files.Get "files/pull-request.mjs" | indent 4 }}
  maintain.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    repo="https://github.com/jomcgi-org/homelab.git"
    workspace="/tmp/dependency-maintenance"
    askpass="/tmp/renovate-git-askpass"
    cat >"$askpass" <<'ASKPASS'
    #!/bin/sh
    case "$1" in
      *Username*) printf '%s\n' 'x-access-token' ;;
      *) printf '%s\n' "$RENOVATE_TOKEN" ;;
    esac
    ASKPASS
    chmod 0700 "$askpass"
    trap 'rm -f "$askpass"' EXIT
    export GIT_ASKPASS="$askpass"
    export GIT_TERMINAL_PROMPT=0

    git clone --depth=1 --branch main "$repo" "$workspace"
    cd "$workspace"
    git config user.name "renovate[bot]"
    git config user.email "renovate[bot]@users.noreply.github.com"

    maintain() (
      set -euo pipefail
      export MAINTENANCE_MODE="$1"
      branch="renovate/${MAINTENANCE_MODE}-lock-maintenance"
      # Inspect existing ownership/holds before rewriting any remote branch.
      if node /opt/renovate-apko/pull-request.mjs preflight; then
        :
      else
        status=$?
        [[ "$status" -eq 3 ]] && return 0
        return "$status"
      fi
      git reset --hard origin/main
      git checkout -B "$branch" origin/main
      git clean -fd
      case "$MAINTENANCE_MODE" in
        apko)
          while IFS= read -r -d '' config; do
            lock="${config%.yaml}.lock.json"
            [[ -f "$lock" ]] || continue
            bazel run --extra_execution_platforms=//bazel/tools/platforms:linux_x86_64 \
              @rules_apko//apko -- lock "$config"
          done < <(find projects -type f \( -name apko.yaml -o -name 'apko-*.yaml' \) -print0)
          ./bazel/tools/format/run-generators.sh
          ;;
        python)
          # The root uses compiled requirements, not uv.lock. Both targets must
          # upgrade transitives while retaining pyproject and override bounds.
          bazel run //bazel/requirements:runtime -- --upgrade --no-build
          bazel run //bazel/requirements:requirements.all -- --upgrade --no-build
          ;;
        atlas|helm|op|claude)
          python3 /opt/renovate-apko/custom-pins.py "$MAINTENANCE_MODE"
          ;;
        *) return 1 ;;
      esac
      if git diff --quiet; then
        echo "$MAINTENANCE_MODE pins are current"
        return 0
      fi
      git add -A
      git commit -m "chore(deps): refresh $MAINTENANCE_MODE locks"
      # Recheck holds after generation, before pushing. A later changed head
      # still requires fresh evidence and review at the trusted queue check.
      if node /opt/renovate-apko/pull-request.mjs preflight; then
        :
      else
        status=$?
        [[ "$status" -eq 3 ]] && return 0
        return "$status"
      fi
      if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
        git fetch origin "$branch"
        lease="$(git rev-parse FETCH_HEAD)"
        git push --force-with-lease="refs/heads/${branch}:${lease}" origin "HEAD:refs/heads/${branch}"
      else
        git push origin "HEAD:refs/heads/${branch}"
      fi
      node /opt/renovate-apko/pull-request.mjs publish
    )

    result=0
    for mode in apko python atlas helm op claude; do
      # Run each mode in its own shell: Bash suppresses errexit in an if-test
      # function, so invoke the child without a conditional around the function.
      set +e
      (set -e; maintain "$mode")
      status=$?
      set -e
      if [[ "$status" -ne 0 ]]; then
        echo "$mode maintenance failed (status $status)" >&2
        result=1
      fi
    done
    exit "$result"
