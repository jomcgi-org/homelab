# Manual App runs on 2026-11-15 verified authentication, bot authorship and
# signed commits (#8041). Set `suspend: true` to stop the scheduled writer.
workloadKind: CronJob
suspend: false
# Installation tokens last one hour, including init time and Job retries.
activeDeadlineSeconds: 2700

onepassword:
  itemPath: vaults/k8s-homelab/items/factory-renovate-gh-app
  secretName: factory-renovate-gh-app

githubApp:
  enabled: true
  username: jomcgi-factory-renovate[bot]

image:
  repository: ghcr.io/renovatebot/renovate
  tag: "44.14.10-full"
