# Disabled until pod-log shipping (projects/platform/otel-collector) lands.
# The dataset slug and the k8s.* / body column names are the collector's
# expected output and are unverified: check them against the first real log
# events before enabling.
name: EmberVM egress-proxy request denied
dataset: k8s-logs
description: >-
  The egress-proxy sidecar in each EmberVM brick pod logs "request denied" when
  it refuses a guest request at the credential swap (authority mismatch or
  claim injection failure). Either means a session is running without the
  credential it was promised, so its turn fails in a way the turn span reports
  only as a generic tool error. Fires on any such line in 15 minutes. There is
  no baseline yet (pod logs were not shipped before 2026-09-30); if this proves
  noisy, raise the threshold from the first week of real counts rather than
  disabling it.
enabled: false
frequency: 900
alert_type: on_change
threshold:
  op: ">"
  value: 0
recipients: [kjEJr2qxxxe]
tags:
  service: embervm
  signal: logs
query:
  time_range: 900
  calculations:
    - op: COUNT
  filters:
    - column: k8s.container.name
      op: "="
      value: egress-proxy
    - column: body
      op: contains
      value: request denied
