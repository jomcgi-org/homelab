name: loom-pg backup age metric absent
dataset: metrics
description: >-
  No loom-pg backup age datapoint for two hours (four scheduled job periods).
  The age trigger cannot fire without data. This companion covers API or
  export failures and a dead CronJob. Disabled until #6605, metrics arrival
  and operator test-firing, following the hub probe absence precedent.
enabled: false
frequency: 1800
alert_type: on_change
threshold:
  op: "<"
  value: 1
  exceeded_limit: 1
recipients: [kjEJr2qxxxe]
tags:
  service: loom
  signal: backup-check
query:
  time_range: 7200
  calculations:
    - op: COUNT
  filters:
    - column: deployment.environment
      op: "="
      value: homelab-hub
    - column: cnpg.cluster.name
      op: "="
      value: loom-pg
    - column: k8s.namespace.name
      op: "="
      value: loom
    - column: cnpg.backup.last_success_age_seconds
      op: exists
