name: loom-pg backup older than 36h
dataset: metrics
description: >-
  MAX backup age for loom-pg exceeds 129600 seconds (36 hours). The collector
  CronJob reads CNPG lastSuccessfulBackup every 30 minutes, falling back to
  cluster creation time when no successful backup exists. Disabled until
  #6605, metrics arrival and operator test-firing. The absence companion
  covers a dead checker or broken export path.
enabled: false
frequency: 1800
alert_type: on_change
threshold:
  op: ">"
  value: 129600
  exceeded_limit: 1
recipients: [kjEJr2qxxxe]
tags:
  service: loom
  signal: backup-age
query:
  time_range: 3600
  calculations:
    - op: MAX
      column: cnpg.backup.last_success_age_seconds
  filters:
    - column: deployment.environment
      op: "="
      value: homelab-hub
    - column: cnpg.cluster.name
      op: "="
      value: loom-pg
    - column: k8s.namespace.name
      op: "="
      value: loom
