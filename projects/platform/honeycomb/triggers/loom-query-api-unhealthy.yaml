# Collector v0.159.0 receiver/httpcheckreceiver/scraper.go records all status
# classes as zero on connection errors. Count only successful 2xx datapoints.
name: loom query-api successful probe absent
dataset: metrics
description: >-
  No successful hub Loom query-api probe for 10 minutes. Counts only
  httpcheck.status = 1 in the 2xx class, so transport errors, non-2xx responses
  and missing probes all alert. Disabled until #6605, metrics arrival and
  operator test-firing. Update http.url alongside loom.probeEndpoint when
  weave-hand/loom#694 provides /healthz.
enabled: false
frequency: 300
alert_type: on_change
threshold:
  op: "<"
  value: 1
  exceeded_limit: 1
recipients: [kjEJr2qxxxe]
tags:
  service: loom
  signal: query-api-probe
query:
  time_range: 600
  calculations:
    - op: COUNT
  filters:
    - column: deployment.environment
      op: "="
      value: homelab-hub
    - column: http.url
      op: "="
      value: http://loom-query-api.loom.svc:8080/docs
    - column: http.status_class
      op: "="
      value: 2xx
    - column: httpcheck.status
      op: "="
      value: 1
