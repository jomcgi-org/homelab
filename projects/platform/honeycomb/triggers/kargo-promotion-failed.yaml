# Disabled until pod-log shipping lands; column names and the exact Kargo
# controller wording are unverified. Check the regex against a real failed
# Promotion's log line before enabling.
name: Kargo Promotion failed
dataset: k8s-logs
description: >-
  A Kargo controller log line in the kargo namespace reporting a Promotion that
  failed or errored. Kargo owns targetRevision for monolith, monolith-public
  and embervm on the hub, and a failed Promotion never verifies its Freight, so
  the stage silently stays on the old version until someone looks. Fires on
  any matching line in 15 minutes. No baseline yet: logs were not shipped
  before 2026-09-30.
enabled: false
frequency: 900
alert_type: on_change
threshold:
  op: ">"
  value: 0
recipients: [kjEJr2qxxxe]
tags:
  service: kargo
  signal: logs
query:
  time_range: 900
  calculated_fields:
    - name: kargo_promotion_failed
      expression: REG_MATCH($body, `(?i)promotion.*\b(failed|errored)\b`)
  calculations:
    - op: COUNT
  filters:
    - column: k8s.namespace.name
      op: "="
      value: kargo
    - column: kargo_promotion_failed
      op: "="
      value: true
