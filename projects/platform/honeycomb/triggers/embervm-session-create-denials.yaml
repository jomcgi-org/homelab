name: EmberVM session-create denials sustained
dataset: embervm-control
description: >-
  Counts embervm.session.create spans that carry ember.reason, i.e. the control
  plane refused to create a session (no_capacity, workload_cap), grouped by
  ember.placement.outcome so the alert names which placement miss denied it.
  Fires when a group sees more than 10 denials in the trailing 15 minutes on
  two consecutive 5-minute evaluations. On 2026-09-30 00:47-02:46 UTC, 125
  denials and 0 successes stopped every agent session; peak 35 per 15 minutes.
  Outside that incident the worst 15 minutes of the prior 7 days was 3
  (workload_cap, 2026-09-23), so >10 is over 3x normal. The second evaluation
  keeps a single retry burst from paging. A denial is an expected-class
  failure per span, which is why no error alert saw it: only the volume is
  abnormal.
enabled: true
frequency: 300
alert_type: on_change
threshold:
  op: ">"
  value: 10
  exceeded_limit: 2
recipients: [kjEJr2qxxxe]
tags:
  service: embervm
  signal: capacity
query:
  time_range: 900
  calculations:
    - op: COUNT
  filters:
    - column: name
      op: "="
      value: embervm.session.create
    - column: ember.reason
      op: exists
  breakdowns:
    - ember.placement.outcome
