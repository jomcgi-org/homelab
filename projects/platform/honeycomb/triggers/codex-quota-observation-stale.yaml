# drain.quota.codex.age_seconds is written on every drain.cycle span (about
# every 16 minutes), including disabled and empty cycles, as well as on
# drain.job spans. A drainer that stops cycling entirely writes nothing, so
# this does not catch that failure; it catches cycles that decide on a stale
# quota reading.
name: Codex quota observation stale
dataset: monolith-backend
description: >-
  drain.quota.codex.age_seconds is how old the drainer's last Codex quota
  reading was when it made a scheduling decision. Fires when the MAX over the
  last hour exceeds 3600 s, i.e. the drainer is deciding on a quota reading
  more than an hour old. In the 7 days to 2026-09-30 the largest value seen was
  138 s. The attribute is emitted on every drain.cycle, so an idle drainer
  that still cycles but claims no jobs reports too. A drainer that stops
  cycling entirely writes nothing, and this trigger does not catch that.
enabled: true
frequency: 900
alert_type: on_change
threshold:
  op: ">"
  value: 3600
recipients: [kjEJr2qxxxe]
tags:
  service: monolith
  signal: quota
query:
  time_range: 3600
  calculations:
    - op: MAX
      column: drain.quota.codex.age_seconds
