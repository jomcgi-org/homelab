# Imported unchanged from the hand-made trigger aJgkA4vC2m8 (2026-08-29).
# time_range and exceeded_limit are not shown by the Honeycomb MCP; they are
# taken from the description ("two consecutive 5-minute evaluations"). The
# first dry run shows any difference: correct this file, not the live trigger.
name: jomcgi.dev /health composite unhealthy
dataset: metrics
description: >-
  The OTel collector's httpcheck receiver probes https://jomcgi.dev/health
  every 60s. That route is the composite: it rolls the component SLIs
  (monolith, EmberVM, database, drainer) into one status code, so a single
  non-2xx here is the one alert that covers them all. Fires when
  MAX(httpcheck.status) over the non-2xx status classes is 1, sustained across
  two consecutive 5-minute evaluations. The two-cycle requirement is
  deliberate: a cloudflared QUIC/UDP flap causes brief total ingress loss and
  would otherwise page on a WAN blip. Which component actually failed is in
  the /health response body, not in this metric.
enabled: true
frequency: 300
alert_type: on_change
threshold:
  op: ">"
  value: 0
  exceeded_limit: 2
recipients: [kjEJr2qxxxe]
tags:
  service: monolith
  tier: public
query:
  time_range: 300
  calculations:
    - op: MAX
      column: httpcheck.status
  filters:
    - column: http.url
      op: "="
      value: https://jomcgi.dev/health
    - column: http.status_class
      op: "!="
      value: 2xx
