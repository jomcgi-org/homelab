name: Agent turns attempted but none delivered (60m) [codex]
dataset: monolith-backend
description: >-
  agent_sessions.deliver wraps every agent turn the monolith sends to EmberVM
  (factory work and the Codex/Spark synthetic probes). status_code 0 is a
  delivered turn, 2 a failed one. turn_score is -1000 per success and +1 per
  failure, so SUM > 1 over 60 minutes means at least 2 failed turns and no
  successful one. Fires on two consecutive 15-minute evaluations. On the
  healthy stretch 2026-09-28 10:00 to 09-29 23:00 UTC the worst hour had 1
  unanswered failure, so this stays quiet; it fires on the 09-30 00:47
  denial incident and on the 09-23 to 09-28 outages (hourly 422s from the
  guest, then prime_failed 500s). Covers the codex family only
  (agent.model_family set by agent_sessions.deliver, #6509); sister triggers
  cover claude and muse.
enabled: true
frequency: 900
alert_type: on_change
threshold:
  op: ">"
  value: 1
  exceeded_limit: 2
recipients: [kjEJr2qxxxe]
tags:
  service: monolith
  signal: factory
query:
  time_range: 3600
  calculated_fields:
    - name: turn_score
      expression: IF(EQUALS($status_code, 0), -1000, 1)
  calculations:
    - op: SUM
      column: turn_score
  filters:
    - column: name
      op: "="
      value: agent_sessions.deliver
    - column: agent.model_family
      op: "="
      value: codex
