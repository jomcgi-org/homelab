apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats-streams
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    # Wave 2: applied after nack (wave 1) so the jetstream.nats.io Stream CRD exists.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi/homelab.git
    path: projects/platform/nats-streams/streams
    targetRevision: HEAD
    # Plain kustomize (no Helm); the Stream CRs are reconciled by the nack controller.
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
