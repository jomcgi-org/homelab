apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: events-ops
  namespace: nats
  labels:
    app.kubernetes.io/part-of: lakehouse-event-bus
spec:
  name: events-ops
  description: "Ops-domain events (alert-fired, build-completed) per ADR agents/016."
  # Covers events.ops.alert-fired, events.ops.build-completed.
  subjects:
    - "events.ops.>"

  servers:
    - nats://nats.nats.svc.cluster.local:4222

  storage: file
  replicas: 1

  retention: limits
  # maxAge omitted => unlimited age (infinite retention, file backend).
  discard: old
  maxBytes: 5368709120

  duplicateWindow: 2m
