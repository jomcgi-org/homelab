apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: events-ingest
  namespace: nats
  labels:
    app.kubernetes.io/part-of: lakehouse-event-bus
spec:
  name: events-ingest
  description: "Ingest-domain events (email-arrived, calendar-event) per ADR agents/016."
  # Covers events.ingest.email-arrived, events.ingest.calendar-event.
  subjects:
    - "events.ingest.>"

  servers:
    - nats://nats.nats.svc.cluster.local:4222

  storage: file
  replicas: 1

  retention: limits
  # maxAge omitted => unlimited age (infinite retention, file backend).
  discard: old
  maxBytes: 5368709120

  duplicateWindow: 2m
