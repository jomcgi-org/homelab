apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: events-serving
  namespace: nats
  labels:
    app.kubernetes.io/part-of: lakehouse-event-bus
spec:
  name: events-serving
  description: "Serving-domain events (artifact-ready) per ADR agents/016."
  # Covers events.serving.artifact-ready (and any future serving event types).
  subjects:
    - "events.serving.>"

  servers:
    - nats://nats.nats.svc.cluster.local:4222

  storage: file
  replicas: 1

  retention: limits
  # maxAge omitted => unlimited age (infinite retention, file backend).
  discard: old
  maxBytes: 5368709120

  duplicateWindow: 2m
