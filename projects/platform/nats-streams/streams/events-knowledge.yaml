apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: events-knowledge
  namespace: nats
  labels:
    app.kubernetes.io/part-of: lakehouse-event-bus
spec:
  # JetStream stream name (distinct from the k8s object name only by convention here).
  name: events-knowledge
  description: "Knowledge-domain events (gap, note, edge) per ADR agents/016."
  # Covers events.knowledge.gap, events.knowledge.note, events.knowledge.edge.
  subjects:
    - "events.knowledge.>"

  # Connect directly to the in-cluster NATS server (no Account abstraction).
  servers:
    - nats://nats.nats.svc.cluster.local:4222

  storage: file
  # Single-node NATS (cluster disabled) -> one replica.
  replicas: 1

  # Infinite retention: keep all events so any consumer can replay from history
  # (ADR 016 Open Question 1 — "infinite with file backend"). retention=limits
  # with maxAge omitted (empty) means age is unbounded; maxBytes is the only cap.
  retention: limits
  # maxAge omitted => unlimited age.
  discard: old
  # Per-stream storage isolation cap (~5 GiB). NATS PVC is 50Gi; 4 event streams
  # x 5 GiB = 20 GiB, leaving headroom for the existing `ais` stream + overhead.
  maxBytes: 5368709120

  # Deduplication window supporting ADR 017's Nats-Msg-Id = "{entity_id}-v{version}".
  duplicateWindow: 2m
