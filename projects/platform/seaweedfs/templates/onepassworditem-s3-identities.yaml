{{- if .Values.s3Identities.onepassword.itemPath }}
# The referenced item must contain one field labelled seaweedfs_s3_config. Its
# value is s3-identities.json with the EmberVM credential placeholders replaced.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: seaweedfs-s3-identities
  namespace: {{ .Release.Namespace }}
spec:
  itemPath: {{ .Values.s3Identities.onepassword.itemPath | quote }}
{{- end }}
