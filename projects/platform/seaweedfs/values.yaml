# SeaweedFS shared infrastructure configuration
# Used by multiple projects for S3-compatible object storage

# The 1Password item has one seaweedfs_s3_config field containing the policy in
# s3-identities.json with its EmberVM credential placeholders substituted.
s3Identities:
  onepassword:
    itemPath: ""

seaweedfs:
  global:
    enableSecurity: false
    # Cluster-wide default replication for NEW volumes/buckets that do not set
    # their own. Single copy ("000"). The vendored chart defaults this to "001"
    # (2 copies on different servers), which is unsatisfiable here: adding the
    # node-4 volume server made the master enforce 001 strictly, but the node-2
    # server is slot-saturated (130/130, 0 free) so it can never host the second
    # replica. The master then fails EVERY new write it must grow a volume for
    # ("failed to find writable volumes ... replication:001: No writable
    # volumes"), which wedged all embervm base exports (large memfiles that force
    # a volume grow) and is the same class as the CNPG WAL 500-on-PutObject.
    # Small writes fit existing volumes; only grows failed, so the break was
    # silent until a GB-sized write appeared.
    #
    # Per Joe's 2026-07-21 decision (base store n=1-on-S3 is fine; normal
    # Longhorn + offsite backups is the durability path, not app-layer 001),
    # single-copy is the accepted floor: block-layer durability comes from the
    # volume servers' Longhorn PVCs (node-2's is 2-replica; node-4's node4-ssd
    # class is 1-replica by design). Revisit "001" only once BOTH servers have
    # free writable slots (raise node-2 maxVolumes with disk headroom, or add a
    # third writable server) and the existing 000 volumes have been re-replicated.
    # CAUTION: seaweedfs-node4b does NOT satisfy that trigger. It shares
    # node-4's machine and ssd-01 disk with seaweedfs-node4, and no release
    # sets volume.rack or dataCenter, so "001" would happily place both copies
    # on the same physical disk: redundant-looking, not redundant.
    replicationPlacment: "000"
    monitoring:
      enabled: false

  master:
    enabled: true
    replicas: 1
    # Disable anti-affinity for single-node homelab
    affinity: ""
    # Pre-populate OTEL annotation to match Kyverno injection (prevents ArgoCD drift)
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      otel.injected-by: kyverno/inject-otel-env-vars
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
      storageClass: "longhorn"
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  volume:
    enabled: true
    replicas: 1
    # Disable anti-affinity for single-node homelab
    affinity: ""
    # Pre-populate OTEL annotation to match Kyverno injection (prevents ArgoCD drift)
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      otel.injected-by: kyverno/inject-otel-env-vars
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "100Gi"
        storageClass: "longhorn"
        # Explicit slot count. Auto (0) derives max from disk capacity divided by
        # the master's volumeSizeLimitMB (1000), which saturated at 106 slots with
        # the disk only a third full; the embervm collection (newest) then had no
        # writable volumes and every export failed. 130 leaves ~24 free slots.
        maxVolumes: 130
    idx:
      type: "emptyDir"
    # Regenerate missing .idx files from .dat files on startup.
    # The built-in move-idx init container moves .idx from /data to /idx (emptyDir),
    # but if the pod is rescheduled the emptyDir is lost and the .idx files are gone.
    # This init container runs weed fix to rebuild them.
    initContainers: |
      - name: seaweedfs-vol-fix-idx
        image: '{{ include "volume.image" . }}'
        imagePullPolicy: IfNotPresent
        command: ['/bin/sh', '-c']
        args:
          - |
            echo "Checking for missing idx files..."
            for dat in /data/*.dat; do
              [ -f "$dat" ] || continue
              base=$(basename "$dat" .dat)
              if [ ! -f "/idx/${base}.idx" ]; then
                if echo "$base" | grep -q '_'; then
                  collection=$(echo "$base" | sed 's/_[0-9]*$//')
                  volid=$(echo "$base" | grep -o '[0-9]*$')
                  echo "Regenerating idx: collection=$collection volumeId=$volid"
                  /usr/bin/weed fix -collection="$collection" -volumeId="$volid" /data
                else
                  echo "Regenerating idx: volumeId=$base"
                  /usr/bin/weed fix -volumeId="$base" /data
                fi
                if [ -f "/data/${base}.idx" ]; then
                  mv "/data/${base}.idx" /idx/
                  echo "Moved ${base}.idx to /idx/"
                fi
              fi
            done
            echo "idx check complete"
        volumeMounts:
          - name: data
            mountPath: /data
          - name: idx
            mountPath: /idx
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  filer:
    enabled: true
    replicas: 1
    # Disable anti-affinity for single-node homelab
    affinity: ""
    # Pre-populate OTEL annotation to match Kyverno injection (prevents ArgoCD drift)
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      otel.injected-by: kyverno/inject-otel-env-vars
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
    data:
      type: "persistentVolumeClaim"
      size: "5Gi"
      storageClass: "longhorn"
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 100m
        # The filer loads the whole metadata tree into memory on cold start. At
        # 512Mi it OOM-crash-looped (exit 137) after a restart, taking down all
        # cluster S3 (chat blobs, stars grid, knowledge raws, imgproxy). Give it
        # burst headroom for the cold-load spike. (Incident 2026-06-19.)
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 2Gi
    # NOTE: do NOT add `s3: { createBuckets: ... }` under filer here. The chart's
    # bucket-hook runs `s3.configure --user anonymous`, which writes an identity
    # into the shared filer metadata and flips the whole cluster S3 from
    # auth-disabled (the open mode every service relies on with duckdb/anonymous
    # keys) to auth-enforced, breaking chat blobs, stars grid, knowledge raws,
    # and imgproxy with InvalidAccessKeyId. Provision buckets out-of-band via
    # `weed shell s3.bucket.create` instead. (Incident 2026-06-19.)

  s3:
    enabled: true
    replicas: 1
    port: 8333
    enableAuth: false
    # A separate flip PR sets enableAuth: true and existingConfigSecret:
    # seaweedfs-s3-identities. Before that flip, inspect weed shell s3.configure
    # for stale filer-stored identities from incident 2026-06-19.
    # Pre-populate OTEL annotation to match Kyverno injection (prevents ArgoCD drift)
    # Prometheus annotations enable SigNoz autodiscovery
    podAnnotations:
      otel.injected-by: kyverno/inject-otel-env-vars
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        # The S3 gateway streams object PUTs through to the filer. At 256Mi it
        # OOM-crash-looped (exit 137) once large embervm base memfiles (up to a
        # few GB) started flowing after the replication-000 fix let their volume
        # assigns succeed: every large upload killed the gateway, so exports (and
        # any other large S3 write) failed with connection-refused. 2Gi gives the
        # streaming/multipart buffers headroom, mirroring the filer's 2Gi bump
        # after its own cold-load OOM. (2026-07-21.)
        memory: 2Gi
