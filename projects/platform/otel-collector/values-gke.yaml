onepassword:
  enabled: true
  itemPath: "vaults/k8s-homelab/items/honeycomb-ingest"

environment: homelab-hub

# Same opt-in as home production: without entries the otlp receiver is not
# rendered at all, and every configured sender times out its span exports.
allowedServices:
  - embervm-control
  - embervm-noded
  - monolith-backend
  - monolith-jobs
  - monolith-public

httpcheck:
  # Live public probes plus one staged in-cluster target. The two string
  # targets render into the http_check receiver and ship probe metrics to
  # Honeycomb, the same public URLs the residual home overlay probes. The
  # Argo CD structured target stays staged with enabled: false: the template
  # skips it while httpcheck.caMount.enabled is false and renders it once the
  # CA mount is on, so a ca_file target can never render without its CA volume
  # mount (which would fail every probe and risks the collector failing to
  # start, taking traces and metrics export with it). Set the target to
  # enabled: true and the CA mount to enabled: true only in a separately
  # authorized rollout after argocd-server-ca contains the verified CA.
  enabled: true
  targets:
    - "https://jomcgi.dev/health"
    - "https://jomcgi.dev/"
    - endpoint: "https://argocd-server.argocd.svc:443/healthz"
      enabled: false
      method: GET
      tls:
        ca_file: /etc/otel/argocd-ca/ca.crt

# OTLP over HTTP, not gRPC: the hub's otelcol gRPC dials to api.honeycomb.io
# were canceled before completing while HTTPS from the same pod network
# namespace worked (verified 2026-08-30). otlphttp uses the proven path.
honeycomb:
  protocol: "http"

# WINDOW: the ingress flip moved jomcgi.dev to the hub, which never enabled
# the metamonitoring route; UptimeRobot 404s without it.
cfIngress:
  enabled: true
  hostname: jomcgi.dev
