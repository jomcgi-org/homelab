onepassword:
  enabled: true
  itemPath: "vaults/k8s-homelab/items/honeycomb-ingest"

environment: homelab-hub

# Same opt-in as home production: without entries the otlp receiver is not
# rendered at all, and every configured sender times out its span exports.
allowedServices:
  - embervm-control
  - embervm-noded
  - monolith-backend
  - monolith-jobs
  - monolith-public

httpcheck:
  # Live public probes plus the live in-cluster Argo CD target. The two string
  # targets render into the http_check receiver and ship probe metrics to
  # Honeycomb. The Argo CD structured target probes
  # https://argocd-server.argocd.svc:443/healthz with tls.ca_file pointing at
  # the pinned CA below. The CA is Argo CD's self-generated serving leaf
  # (O = Argo CD, self-signed, CA:FALSE), pinned per #6542. It expires
  # 2027-08-30 and must be re-pinned from argocd-secret tls.crt before then.
  # The mount and the argocd-server-ca ConfigMap must stay on while the target
  # carries tls.ca_file: the template fails the render when the mount is on
  # and caCert is empty or null, so a PEM-less CA cannot ship (a missing CA
  # fails every probe and risks the collector failing to start, taking traces
  # and metrics export with it). Turning caMount.enabled off is not guarded.
  enabled: true
  targets:
    - "https://jomcgi.dev/health"
    - "https://jomcgi.dev/"
    - endpoint: "https://argocd-server.argocd.svc:443/healthz"
      enabled: true
      method: GET
      tls:
        ca_file: /etc/otel/argocd-ca/ca.crt
  caMount:
    enabled: true
    caCert: |
      -----BEGIN CERTIFICATE-----
      MIIDYzCCAkugAwIBAgIRAK7dcSkKawersVyXbig7+lowDQYJKoZIhvcNAQELBQAw
