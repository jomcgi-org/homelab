image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.159.0"
  pullPolicy: IfNotPresent

replicas: 1

onepassword:
  # Disabled by default so the chart renders inert outside prod.
  enabled: false
  itemPath: ""
  secretName: honeycomb-ingest
  # Field within the 1Password item holding the Honeycomb ingest key SECRET.
  # Honeycomb ingest keys have two parts: a key id, which is a public
  # identifier used to find and revoke the key, and a key secret, which is the
  # value the x-honeycomb-team header carries. Only the secret authenticates.
  apiKeySecretKey: honeycomb-key-secret
  # The key id is not a credential. It is surfaced as an env var purely so the
  # running pod can say which key it is using when a 401 needs diagnosing.
  apiKeyIdKey: honeycomb-key-id

honeycomb:
  endpoint: "api.honeycomb.io:443"

# Stamped onto every span and metric as the deployment.environment resource
# attribute. Set per environment so prod and dev stay separable in Honeycomb
# once both opt in; without it a dev trace and a prod trace are
# indistinguishable after export, and there is no way to filter one out later.
environment: ""

# Public health route for external metamonitoring. Disabled by default so the
# chart renders inert; see templates/httproute.yaml for why this is a direct
# route rather than a proxy through the public frontend.
cfIngress:
  enabled: false
  tier: public
  hostname: ""
  pathPrefix: /health/otel-collector
  # The health_check extension serves at the root, so the prefix is stripped.
  rewritePrefix: /
  serviceName: otel-collector
  servicePort: 13133
  gateway:
    name: cloudflare-ingress
    namespace: envoy-gateway-system

# Services permitted to send traces, matched on resource attribute
# service.name.
#
# This is the opt-in list, and it is enforced rather than advertised. While it
# is empty the chart renders NO otlp receiver and NO traces pipeline at all, so
# the collector does not listen on 4317 or 4318 and no service can send traces
# even if it is pointed here. That is deliberate: quota is the binding
# constraint, so the default has to be that nothing gets through.
#
# Adding a service is a one-line edit that shows up in a PR diff.
allowedServices: []

# Tail sampling. Only rendered when allowedServices is non-empty.
sampling:
  decisionWaitSeconds: 10
  # Traces held pending a sampling decision. In-flight volume is roughly
  # trace_rate x decisionWaitSeconds, but the buffer has to absorb bursts well
  # above the average or the sampler starts deciding on evicted, incomplete
  # traces, which is the failure tail sampling exists to avoid: an error
  # arriving in a late span is missed because the trace was already judged.
  #
  # At ~1KB per span this does not fit in the container's memory limit, which
  # is why tailStorage below moves it to disk.
  numTraces: 50000
  # Buffer pending traces on disk rather than in RAM.
  #
  # This is what lets numTraces be sized for correct decisions instead of for
  # whatever fits in 512Mi. It is behind an upstream feature gate that is off
  # by default and documented as under active development, so it is kept
  # toggleable: turning it off falls back to the in-memory buffer, at which
  # point numTraces must come down to something that actually fits.
  #
  # The backing volume is an emptyDir, deliberately not a PVC. The buffer holds
  # only traces awaiting a decision, so losing it on restart costs one
  # decisionWait of pending decisions and nothing durable. That keeps the pod
  # disposable and avoids a one-way Longhorn claim.
  #
  # num_shards must stay at its default of 1: values above 1 are not supported
  # together with tail_storage.
  tailStorage:
    enabled: true
    directory: /var/lib/otelcol/tail
    sizeLimit: 2Gi
  # 10s, not 2s. At a 2s threshold a latency incident makes EVERY trace
  # qualify, which is a worse volume risk than an error storm because latency
  # incidents last longer. 10s keeps the pathological outliers, which are the
  # ones worth opening, without the policy firing on ordinary slowness.
  latencyThresholdMs: 10000
  # 0.1%, not 5%. This is the steady-state cost driver: errors and slow traces
  # are rare, so the baseline is what actually bills. On a 20M events/month
  # budget, and with a densely instrumented service like embervm-control
  # producing deep traces, 5% of everything would dominate the entire budget.
  probabilisticPercentage: 0.1
  # Hard ceiling on what leaves the cluster, enforced by a composite policy.
  #
  # A rate_limiting policy listed alongside the others would NOT cap anything:
  # tail_sampling ORs its policies, so a trace is kept when ANY policy says
  # keep, and a peer rate_limiting policy only ever ADMITS more traces. The
  # composite policy is the primitive that actually bounds total volume, by
  # allocating a spans-per-second budget across its sub-policies and dropping
  # what does not fit.
  #
  # This value is squeezed between two opposing constraints, so it is not free
  # to tune in one direction only.
  #
  # From above: it is the incident ceiling. Sustained, N spans/sec exhausts a
  # 20M events/month budget in 20,000,000/N seconds. At 1000 that is 5.5 hours,
  # which is not a ceiling so much as a way to lose the month. At 200 it is
  # roughly 27 hours, long enough that a burst is survivable and only a
  # multi-day sustained incident is dangerous.
  #
  # From below: the budget is checked PER TRACE against the matching
  # sub-policy's own allocation, and a trace bigger than that allocation is
  # dropped outright rather than falling through. At 200 with errors at 70%,
  # the errors slice is 140 spans/sec, so an error trace up to 140 spans still
  # fits. Lowering this further starts silently dropping deep error traces,
  # which are exactly the ones worth having.
  #
  # embervm-control has ~107 span callsites, so its traces are deep. Recheck
  # this against measured span-per-trace depth once real data lands, rather
  # than assuming 140 is enough.
  maxTotalSpansPerSecond: 200
  # Budget split across the sub-policies. Errors get the largest slice both
  # because they are the most valuable per span and because the per-trace rule
  # above means a bigger slice admits deeper traces.
  #
  # These do NOT have to sum to 100 and nothing validates them, so a sum over
  # 100 quietly raises the real ceiling above maxTotalSpansPerSecond. A
  # sub-policy missing or misspelled here silently falls back to an equal
  # share rather than erroring, so keep the names in step with the
  # composite_sub_policy entries in the ConfigMap template.
  rateAllocation:
    errorsPercent: 70
    slowPercent: 10
    baselinePercent: 20

# URLs the http_check receiver probes. Empty by default.
#
# These probes are the only signal that leaves the cluster while
# allowedServices is empty, and they are what replaces the SigNoz synthetic
# monitors.
httpcheck:
  enabled: false
  intervalSeconds: 60
  targets: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
