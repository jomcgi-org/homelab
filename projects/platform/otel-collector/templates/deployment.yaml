apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otel-collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "otel-collector.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "otel-collector.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/conf/collector.yaml
            {{- if and .Values.allowedServices .Values.sampling.tailStorage.enabled }}
            # tail_storage is gated upstream and the gate is off by default.
            # Without this flag the collector fails config validation and will
            # not start, so this arg and the tail_storage key move together.
            - --feature-gates=processor.tailsamplingprocessor.tailstorageextension
            {{- end }}
          {{- if .Values.onepassword.enabled }}
          env:
            # Only the key secret authenticates. The key id is a public
            # identifier, carried here so a 401 can be traced to a specific
            # key without opening 1Password.
            - name: HONEYCOMB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.onepassword.secretName }}
                  key: {{ .Values.onepassword.apiKeySecretKey }}
            - name: HONEYCOMB_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.onepassword.secretName }}
                  key: {{ .Values.onepassword.apiKeyIdKey }}
          {{- end }}
          ports:
            {{- if .Values.allowedServices }}
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 13133
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.allowedServices .Values.sampling.tailStorage.enabled }}
            # readOnlyRootFilesystem is kept: the tail buffer gets its own
            # writable mount rather than the root being opened up.
            - name: tail-storage
              mountPath: {{ .Values.sampling.tailStorage.directory | quote }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-collector.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.allowedServices .Values.sampling.tailStorage.enabled }}
        # emptyDir, not a PVC. The buffer holds only traces awaiting a decision,
        # so losing it on restart costs one decision window and nothing durable.
        # sizeLimit caps node ephemeral storage: without it a runaway buffer
        # could fill the node's disk and evict unrelated pods.
        - name: tail-storage
          emptyDir:
            sizeLimit: {{ .Values.sampling.tailStorage.sizeLimit | quote }}
        {{- end }}
