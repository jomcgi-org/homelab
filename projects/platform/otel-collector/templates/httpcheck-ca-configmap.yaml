{{- if and .Values.httpcheck.enabled .Values.httpcheck.caMount.enabled }}
{{- $caCert := .Values.httpcheck.caMount.caCert | default "" | toString | trim }}
{{- if not $caCert }}
{{- fail "httpcheck.caMount.caCert is required when httpcheck.enabled and httpcheck.caMount.enabled are both true: set the pinned serving CA PEM" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.httpcheck.caMount.configMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  {{ .Values.httpcheck.caMount.key }}: |
    {{- $caCert | nindent 4 }}
{{- end }}
