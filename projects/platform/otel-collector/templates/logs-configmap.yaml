{{- if .Values.logs.enabled }}
{{- if not .Values.logs.namespaces }}
{{- fail "logs.enabled requires at least one entry in logs.namespaces" }}
{{- end }}
{{- $cm := .Values.logs.containerMetrics }}
{{- if and .Values.logs.nodeMetrics.enabled (not .Values.logs.nodeMetrics.dataset) }}
{{- fail "logs.nodeMetrics.enabled requires logs.nodeMetrics.dataset" }}
{{- end }}
{{- if and $cm.enabled (not $cm.namespaces) }}
{{- fail "logs.containerMetrics.enabled requires at least one entry in logs.containerMetrics.namespaces" }}
{{- end }}
{{- $nm := .Values.logs.nodeMetrics }}
{{- $hcExporter := "otlp/honeycomb-logs" }}
{{- $hcMetricsExporter := "otlp/honeycomb-metrics" }}
{{- $hcNodeExporter := "otlp/honeycomb-node-metrics" }}
{{- if eq (.Values.honeycomb.protocol | default "grpc") "http" }}
{{- $hcExporter = "otlphttp/honeycomb-logs" }}
{{- $hcMetricsExporter = "otlphttp/honeycomb-metrics" }}
{{- $hcNodeExporter = "otlphttp/honeycomb-node-metrics" }}
{{- end }}
{{- $nodeReceivers := list "kubelet_stats/node" }}
{{- if $nm.hostMetrics.enabled }}{{ $nodeReceivers = append $nodeReceivers "host_metrics" }}{{ end -}}
{{- if $nm.scrapeConfigs }}{{ $nodeReceivers = append $nodeReceivers "prometheus/node" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.logs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.logs.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Read offsets and the export queue, on a node hostPath so a restart of
      # this agent neither re-ships the files from the start nor drops what
      # was read but not yet exported.
      file_storage/logs:
        directory: /var/lib/otelcol/logs
        create_directory: true

    receivers:
      file_log:
        # /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log. The
        # underscore after the namespace glob is what stops "embervm" from also
        # matching embervm-dev.
        include:
          {{- range .Values.logs.namespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
        {{- with .Values.logs.excludeNamespaces }}
        exclude:
          {{- range . }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
        {{- end }}
        # end, not beginning: the first start must not replay every retained
        # log on the node. After that the stored offsets take over.
        start_at: end
        include_file_path: true
        storage: file_storage/logs
        operators:
          # Parses the CRI line format, reassembles partial (P) lines, and sets
          # k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.container.name
          # and k8s.container.restart_count from the file path.
          - type: container
            id: container-parser
      {{- if $cm.enabled }}

      # This node's kubelet only. The kubelet serves a self-signed certificate
      # on GKE, so verification is skipped; the request still authenticates
      # with the agent's token and only reads stats.
      kubelet_stats:
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        collection_interval: {{ $cm.interval }}
        metric_groups: [container]
      {{- end }}
      {{- if $nm.enabled }}

      # Node and pod totals from this node's kubelet. Containers and volumes
      # are left out: per-pod totals answer "which pod is using the node" at a
      # fraction of the events. The k3s kubelet serves a certificate signed by
      # its own CA, which the service account bundle does not carry, so
      # verification is skipped as for container metrics above.
      kubelet_stats/node:
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        collection_interval: {{ $nm.interval }}
        metric_groups: [node, pod]
      {{- if $nm.hostMetrics.enabled }}

      # Load, memory and disk read from the container's own /proc. Those three
      # files (loadavg, meminfo, diskstats) are not namespaced, so they show
      # the host without mounting the host's /proc or root filesystem. CPU,
      # filesystem and network come from the kubelet above instead.
      host_metrics:
        collection_interval: {{ $nm.interval }}
        scrapers:
          load: {}
          memory: {}
          disk:
            include:
              devices: [{{ $nm.hostMetrics.diskDevices | quote }}]
              match_type: regexp
      {{- end }}
      {{- if $nm.scrapeConfigs }}

      prometheus/node:
        config:
          scrape_configs:
            {{- toYaml $nm.scrapeConfigs | nindent 12 }}
      {{- end }}
      {{- end }}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      # Level extraction. Order matters: each step only fills in a level the
      # previous steps did not find.
      #
      #  1. JSON bodies ({"level":"warning"} from the Elixir control plane,
      #     "level":"WARN" from Go slog in noded and the egress proxy, zap JSON
      #     from CNPG) are parsed into attributes; the level comes from level,
      #     severity or levelname. CNPG wraps Postgres records at level "info",
      #     so record.error_severity overrides it.
      #  2. Plain-text lines with a recognised level token: a LEADING level,
      #     optionally after an ISO timestamp (Python "WARNING logger: ...",
      #     zap console "2026-..Z<TAB>ERROR<TAB>..."), Envoy's
      #     "[ts][pid][warning]" and logfmt "level=warn".
      #  3. Anything still without a level is kept ONLY if the body looks like
      #     an error or a stack trace (see the regex below), and is marked
      #     log.level_source=heuristic with severity ERROR so it can be
      #     told apart and tuned. Everything else without a level is dropped.
      #
      # Tracebacks are not stitched back together; each frame line is its own
      # record. Frame lines match the heuristic, so they survive, and they sort
      # together by time and k8s.pod.name.
      transform/parse:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # 1. JSON.
              - merge_maps(log.attributes, ParseJSON(log.body), "upsert") where IsString(log.body) and IsMatch(log.body, "^\\s*\\{.*\\}\\s*$")
              - set(log.severity_text, log.attributes["level"]) where IsString(log.attributes["level"])
              - set(log.severity_text, log.attributes["severity"]) where log.severity_text == "" and IsString(log.attributes["severity"])
              - set(log.severity_text, log.attributes["levelname"]) where log.severity_text == "" and IsString(log.attributes["levelname"])
              - set(log.severity_text, log.attributes["record"]["error_severity"]) where log.attributes["logger"] == "postgres" and IsString(log.attributes["record"]["error_severity"])
              # 2. Text formats.
              - merge_maps(log.cache, ExtractPatterns(log.body, "^\\[[^\\]]+\\]\\[\\d+\\]\\[(?P<level>[A-Za-z]+)\\]"), "upsert") where log.severity_text == "" and IsString(log.body)
              - merge_maps(log.cache, ExtractPatterns(log.body, "^(?:\\d{4}-\\d{2}-\\d{2}[T ]\\S+\\s+)?\\[?(?P<level>(?i:trace|debug|info|notice|warning|warn|error|err|critical|crit|fatal|panic|dpanic))\\]?(?:[\\s:]|$)"), "upsert") where log.severity_text == "" and log.cache["level"] == nil and IsString(log.body)
              - merge_maps(log.cache, ExtractPatterns(log.body, "\\blevel=\"?(?P<level>[A-Za-z]+)"), "upsert") where log.severity_text == "" and log.cache["level"] == nil and IsString(log.body)
              - set(log.severity_text, log.cache["level"]) where log.severity_text == "" and IsString(log.cache["level"])
              # Map the level text to a severity number, case-insensitively.
              - set(log.severity_number, SEVERITY_NUMBER_TRACE) where IsMatch(log.severity_text, "(?i)^trace$")
              - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where IsMatch(log.severity_text, "(?i)^debug\\d?$")
              - set(log.severity_number, SEVERITY_NUMBER_INFO) where IsMatch(log.severity_text, "(?i)^(info|information|notice|log)$")
              - set(log.severity_number, SEVERITY_NUMBER_WARN) where IsMatch(log.severity_text, "(?i)^(warn|warning)$")
              - set(log.severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(log.severity_text, "(?i)^(error|err)$")
              - set(log.severity_number, SEVERITY_NUMBER_FATAL) where IsMatch(log.severity_text, "(?i)^(fatal|critical|crit|panic|dpanic|alert|emerg|emergency)$")
              # 3. The non-JSON, no-level heuristic. Matches: Python
              # "Traceback (most recent call last)" and '  File "..."' frames,
              # JVM/Node "  at ..." frames, Go "goroutine N [" dumps, an
              # "...Error"/"...Exception" type name (ValueError, ** (RuntimeError)),
              # and the words error, exception, panic or fatal.
              - set(log.attributes["log.level_source"], "heuristic") where log.severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsString(log.body) and IsMatch(log.body, "(?i)(traceback \\(most recent call last\\)|^\\s+file \"|^\\s+at \\S|^goroutine \\d+ \\[|\\w(error|exception)\\b|\\b(error|exception|panic|fatal)\\b)")
              - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.attributes["log.level_source"] == "heuristic"
              - set(log.severity_text, "ERROR") where log.attributes["log.level_source"] == "heuristic"
              # Readable body for structured lines: the message, not the JSON.
              - set(log.body, log.attributes["message"]) where IsString(log.attributes["message"])
              - set(log.body, log.attributes["msg"]) where IsString(log.attributes["msg"]) and not IsString(log.attributes["message"])
              - set(log.body, log.attributes["record"]["message"]) where log.attributes["logger"] == "postgres" and IsString(log.attributes["record"]["message"])

      {{- if .Values.logs.sanitize }}

      # Before level parsing, so coloured console output parses like plain
      # text: strip ANSI escapes and a leading timestamp (the record already
      # carries the CRI time), then spell out zerolog's console levels.
      transform/sanitize:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'replace_pattern(log.body, "\\x1b\\[[0-9;]*m", "") where IsString(log.body)'
              - 'replace_pattern(log.body, "^(?:time=\"?[^\"\\s]+\"?|\\d{4}-\\d{2}-\\d{2}[T ][^\\s]+)\\s+", "") where IsString(log.body)'
              - 'replace_pattern(log.body, "^TRC\\b", "TRACE") where IsString(log.body)'
              - 'replace_pattern(log.body, "^DBG\\b", "DEBUG") where IsString(log.body)'
              - 'replace_pattern(log.body, "^INF\\b", "INFO") where IsString(log.body)'
              - 'replace_pattern(log.body, "^WRN\\b", "WARN") where IsString(log.body)'
              - 'replace_pattern(log.body, "^ERR\\b", "ERROR") where IsString(log.body)'
              - 'replace_pattern(log.body, "^FTL\\b", "FATAL") where IsString(log.body)'
              - 'replace_pattern(log.body, "^PNC\\b", "PANIC") where IsString(log.body)'
      {{- end }}
      {{- if .Values.logs.redact }}
      {{- /*
      Each rule is a raw RE2 pattern and its replacement; the template escapes
      them for OTTL, YAML and the collector's ${...} expansion. Order matters
      only where a later rule would see an earlier rule's [REDACTED]; every
      rule leaves that marker alone. collector_optin_test.py runs these rules
      against the cases they exist for, and against the lines they must not
      change.

      Colon-separated values are masked for password-like keys only. For
      "secret" and "token" a colon is usually prose ("Secret: ns/name not
      found", "failed to refresh token: context canceled"), so those keys are
      masked only when written key=value or as a quoted JSON key.
      */}}
      {{- $keys := `(?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|credentials?)` }}
      {{- $rules := list
        (list `([a-zA-Z][a-zA-Z0-9+.-]*://[^:/\s@"']*:)[^@/\s"']+@` `${1}[REDACTED]@`)
        (list `(?i)(\bpassword\s+)'(?:[^']|'')*'` `${1}'[REDACTED]'`)
        (list `(?i)(\b(?:set-)?cookie["']?\s*[:=]\s*["']?)[^"'\r\n]+` `${1}[REDACTED]`)
        (list `(?i)(\bauthorization["']?\s*[:=]\s*["']?(?:(?:basic|bearer|token|digest)\s+)?)[^"'\s,;}]+` `${1}[REDACTED]`)
        (list `(?i)(\bbearer\s+)[A-Za-z0-9._~+/=-]+` `${1}[REDACTED]`)
        (list `\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})` `[REDACTED]`)
        (list `\bAKIA[0-9A-Z]{16}\b` `[REDACTED]`)
        (list `\bsk-(?:ant-)?[A-Za-z0-9_-]{16,}` `[REDACTED]`)
        (list `\bhc[ax]ik_[A-Za-z0-9]{20,}` `[REDACTED]`)
        (list `\beyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+` `[REDACTED]`)
        (list (printf `(?i)(\\"[A-Za-z0-9_.-]*?%s\\"\s*:\s*\\")(?:[^"\\]|\\[^"])*` $keys) `${1}[REDACTED]`)
        (list (printf `(?i)("[A-Za-z0-9_.-]*?%s"\s*:\s*")[^"]*` $keys) `${1}[REDACTED]`)
        (list (printf `(?i)(\b[A-Za-z0-9_.-]*?%s["']?\s*=\s*["']?)[^"'\s&,;}]+` $keys) `${1}[REDACTED]`)
        (list `(?i)(\b(?:password|passwd|pwd)["']?\s*:\s*["']?)[^"'\s,;}]+` `${1}[REDACTED]`)
      }}

      # After parsing, before anything leaves the node. Masks credentials in
      # the body and in every attribute value: connection-string passwords,
      # SQL PASSWORD literals, Cookie and Set-Cookie values, Authorization and
      # bearer values, tokens recognisable by prefix (GitHub, AWS access key
      # ids, sk- API keys, Honeycomb keys, JWTs), and values of
      # credential-named keys in key=value, JSON and escaped-JSON form.
      # Attributes are flattened first (record.message rather than a nested
      # record map; Honeycomb shows the same column names either way) so
      # nested values are covered, then attributes whose key names a
      # credential are dropped.
      transform/redact:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              {{- range $rules }}
              - 'replace_pattern(log.body, "{{ include "otel-collector.ottlString" (index . 0) }}", "{{ include "otel-collector.ottlString" (index . 1) }}") where IsString(log.body)'
              {{- end }}
              - 'flatten(log.attributes)'
              {{- range $rules }}
              - 'replace_all_patterns(log.attributes, "value", "{{ include "otel-collector.ottlString" (index . 0) }}", "{{ include "otel-collector.ottlString" (index . 1) }}")'
              {{- end }}
              - 'delete_matching_keys(log.attributes, "{{ include "otel-collector.ottlString" (printf `(?i)^(?:.*[._-])?(?:%s|authorization|cookie)$` $keys) }}")'
      {{- end }}
      {{- if .Values.logs.dedup.enabled }}

      # Identical records within the interval become one, with log_count.
      # Timestamps parsed out of JSON lines are ignored when comparing.
      log_dedup:
        interval: {{ .Values.logs.dedup.interval }}
        log_count_attribute: log_count
        exclude_fields:
          - attributes.time
          - attributes.ts
          - attributes.timestamp
      {{- end }}

      # Keep warning and above. Everything the parser could not classify has
      # severity 0 (unspecified) and is dropped here too.
      filter/severity:
        error_mode: ignore
        logs:
          log_record:
            - 'log.severity_number < {{ .Values.logs.minSeverityNumber | int }}'

      # Scoped to this node's pods: the agent watches only what it can tail.
      k8s_attributes:
        auth_type: serviceAccount
        # Block startup until the pod cache has synced, so lines read in the
        # first seconds after an agent restart are not shipped unlabelled.
        wait_for_metadata: true
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
          labels:
            - key: app.kubernetes.io/name
              from: pod
            - key: app.kubernetes.io/component
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid

      # service.name from the app label, else the owning workload, else the
      # container. Only set when absent. Everything lands in one dataset, so
      # this is a grouping column, not a routing key.
      transform/service:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(resource.attributes["service.name"], resource.attributes["k8s.pod.labels.app.kubernetes.io/name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.labels.app.kubernetes.io/name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.statefulset.name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.daemonset.name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.container.name"] != nil
      {{- if .Values.environment }}
      resource/environment:
        attributes:
          - key: deployment.environment
            value: {{ .Values.environment | quote }}
            action: upsert
      {{- end }}
      {{- if .Values.clusterName }}
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName | quote }}
            action: upsert
      {{- end }}
      {{- if $cm.enabled }}

      # Keep the listed namespaces and the three metrics that explain an
      # OOMKill; drop the rest before enrichment and export.
      filter/container-metrics:
        error_mode: ignore
        metrics:
          metric:
            - 'not IsMatch(resource.attributes["k8s.namespace.name"], "^({{ join "|" $cm.namespaces }})$")'
            - 'not IsMatch(metric.name, "^container\\.(memory\\.(working_set|rss)|cpu\\.usage)$")'
      {{- end }}
      {{- if $nm.enabled }}

      # The kubelet's node and pod totals, cut to usage and headroom. Only
      # kubelet_stats metrics are matched; scraped and host metrics pass.
      filter/node-metrics:
        error_mode: ignore
        metrics:
          metric:
            - 'IsMatch(metric.name, "^k8s\\.(node|pod)\\.") and not IsMatch(metric.name, "^k8s\\.(node\\.(cpu\\.usage|memory\\.(working_set|available)|filesystem\\.(available|capacity))|pod\\.(cpu\\.usage|memory\\.working_set))$")'

      # Names the node on host and scraped metrics, which carry no Kubernetes
      # resource attributes of their own. insert leaves kubelet values alone.
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: insert
      {{- if $nm.transforms }}

      metrics_transform/node:
        transforms:
          {{- toYaml $nm.transforms | nindent 10 }}
      {{- end }}
      {{- end }}
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      # Same key and wiring as the gateway's exporters (see configmap.yaml for
      # the otlp versus otlphttp endpoint syntax); only the dataset differs.
      {{- if eq $hcExporter "otlphttp/honeycomb-logs" }}
      otlphttp/honeycomb-logs:
        endpoint: {{ .Values.honeycomb.httpEndpoint | default "https://api.honeycomb.io" | quote }}
      {{- else }}
      otlp/honeycomb-logs:
        endpoint: {{ .Values.honeycomb.endpoint | quote }}
      {{- end }}
        headers:
          x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
          x-honeycomb-dataset: {{ .Values.logs.dataset | quote }}
        sending_queue:
          enabled: true
          storage: file_storage/logs
      {{- if $cm.enabled }}
      {{- if eq $hcMetricsExporter "otlphttp/honeycomb-metrics" }}
      otlphttp/honeycomb-metrics:
        endpoint: {{ .Values.honeycomb.httpEndpoint | default "https://api.honeycomb.io" | quote }}
      {{- else }}
      otlp/honeycomb-metrics:
        endpoint: {{ .Values.honeycomb.endpoint | quote }}
      {{- end }}
        headers:
          x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
          x-honeycomb-dataset: {{ $cm.dataset | quote }}
      {{- end }}
      {{- if $nm.enabled }}
      {{- if eq $hcNodeExporter "otlphttp/honeycomb-node-metrics" }}
      otlphttp/honeycomb-node-metrics:
        endpoint: {{ .Values.honeycomb.httpEndpoint | default "https://api.honeycomb.io" | quote }}
      {{- else }}
      otlp/honeycomb-node-metrics:
        endpoint: {{ .Values.honeycomb.endpoint | quote }}
      {{- end }}
        headers:
          x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
          x-honeycomb-dataset: {{ $nm.dataset | quote }}
      {{- end }}

    service:
      extensions: [health_check, file_storage/logs]
      pipelines:
        logs:
          receivers: [file_log]
          processors: [memory_limiter{{ if .Values.logs.sanitize }}, transform/sanitize{{ end }}, transform/parse, filter/severity{{ if .Values.logs.redact }}, transform/redact{{ end }}{{ if .Values.logs.dedup.enabled }}, log_dedup{{ end }}, k8s_attributes, transform/service{{ if .Values.environment }}, resource/environment{{ end }}{{ if .Values.clusterName }}, resource/cluster{{ end }}, batch]
          exporters: [{{ $hcExporter }}]
        {{- if $cm.enabled }}
        metrics:
          receivers: [kubelet_stats]
          processors: [memory_limiter, filter/container-metrics, k8s_attributes{{ if .Values.environment }}, resource/environment{{ end }}{{ if .Values.clusterName }}, resource/cluster{{ end }}, batch]
          exporters: [{{ $hcMetricsExporter }}]
        {{- end }}
        {{- if $nm.enabled }}
        metrics/node:
          receivers: [{{ join ", " $nodeReceivers }}]
          processors: [memory_limiter, filter/node-metrics{{ if $nm.transforms }}, metrics_transform/node{{ end }}, k8s_attributes, resource/node{{ if .Values.environment }}, resource/environment{{ end }}{{ if .Values.clusterName }}, resource/cluster{{ end }}, batch]
          exporters: [{{ $hcNodeExporter }}]
        {{- end }}
{{- end }}
