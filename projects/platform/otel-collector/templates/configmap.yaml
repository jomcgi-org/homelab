apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{- if and .Values.allowedServices .Values.sampling.tailStorage.enabled }}
      # Backs tail_sampling's pending-trace buffer with disk instead of RAM.
      #
      # It MUST be pebble_tail_storage, not file_storage. tail_storage takes a
      # component.ID, so any extension id parses and `validate` exits 0, but the
      # processor then type-asserts the resolved extension to the TailStorage
      # interface (Append/Take/Delete). file_storage implements the byte-KV
      # storage.Extension instead and fails that assertion at Start with
      # "non-tail-storage extension", after health_check is already up. The only
      # thing that catches this is starting a collector against the render.
      #
      # max_storage_size_mib defaults to unlimited and must stay under the
      # volume's sizeLimit: if Pebble outgrows the emptyDir the kubelet evicts
      # the pod for exceeding ephemeral storage, which is a worse failure than
      # the OOM this was meant to avoid.
      #
      # The extension drops everything in the directory on startup and does not
      # persist across restarts. That suits a buffer of pending decisions.
      pebble_tail_storage:
        directory: {{ .Values.sampling.tailStorage.directory | quote }}
        max_storage_size_mib: {{ .Values.sampling.tailStorage.maxStorageSizeMib }}
      {{- end }}

    receivers:
      {{- if .Values.allowedServices }}
      # Rendered only when at least one service is allowed to send traces.
      # With an empty allowlist the collector does not listen on 4317 or 4318
      # at all, so an unlisted service cannot send even by accident.
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- end }}
      {{- if .Values.httpcheck.enabled }}
      # Component type is http_check, not httpcheck. The receiver was renamed to
      # match snake_case; httpcheck still resolves but only as a deprecated
      # alias that logs a warning, so it is not safe to depend on.
      http_check:
        collection_interval: {{ .Values.httpcheck.intervalSeconds }}s
        targets:
          {{- range .Values.httpcheck.targets }}
          - endpoint: {{ . | quote }}
            method: GET
          {{- end }}
      {{- end }}

    processors:
      # memory_limiter runs FIRST in every pipeline. Without one, a collector
      # OOMs on a recovery drain rather than at steady peak, and presents as
      # repeated restarts with no export errors to explain them.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        timeout: 1s
        send_batch_size: 1024
      {{- if .Values.environment }}
      # Stamped on everything leaving here, traces and probe metrics alike, so
      # prod and dev remain separable in Honeycomb.
      #
      # upsert overwrites a value the service set for itself; insert would keep
      # the service's. Overwriting is deliberate: the collector knows which
      # cluster it is running in and a service does not. Resource attributes are
      # a map, so neither action can produce two conflicting values.
      resource/environment:
        attributes:
          - key: deployment.environment
            value: {{ .Values.environment | quote }}
            action: upsert
      {{- end }}
      {{- if .Values.allowedServices }}
      # Enforces the opt-in list. The filter processor DROPS spans matching a
      # condition, so these conditions describe what is not allowed: a span
      # with no service.name, or one whose service.name is not in the list.
      filter/allowlist:
        error_mode: ignore
        traces:
          span:
            - 'resource.attributes["service.name"] == nil'
            - '{{ range $i, $s := .Values.allowedServices }}{{ if $i }} and {{ end }}resource.attributes["service.name"] != {{ $s | quote }}{{ end }}'
      tail_sampling:
        decision_wait: {{ .Values.sampling.decisionWaitSeconds }}s
        num_traces: {{ .Values.sampling.numTraces }}
        {{- if .Values.sampling.tailStorage.enabled }}
        # Requires the processor.tailsamplingprocessor.tailstorageextension
        # feature gate, passed as a container arg. With the gate off, setting
        # this fails config validation and the collector refuses to start, so
        # the two must move together.
        tail_storage: pebble_tail_storage
        {{- end }}
        policies:
          # One composite policy, not three peer policies. tail_sampling ORs
          # its policies, so peers can only ever admit more traces; composite
          # is what imposes a ceiling, by giving each sub-policy a slice of a
          # spans-per-second budget and dropping what does not fit.
          #
          # Priority comes from the ORDER OF composite_sub_policy below, not
          # from policy_order. policy_order parses and is then ignored by the
          # processor, so reordering it changes nothing: reorder the
          # composite_sub_policy list instead. It is kept only because the
          # config shape includes it.
          #
          # Sharp edge worth knowing before opting a service in: the budget is
          # checked per trace against the MATCHING sub-policy alone. A trace
          # whose span count exceeds that sub-policy's allocation is dropped
          # outright and does NOT fall through to a later sub-policy, even on
          # an idle collector. So maxTotalSpansPerSecond has to comfortably
          # exceed the largest single trace you expect, or large error traces
          # go missing precisely because they are large.
          - name: capped
            type: composite
            composite:
              max_total_spans_per_second: {{ .Values.sampling.maxTotalSpansPerSecond }}
              policy_order: [errors, slow-traces, baseline]
              composite_sub_policy:
                - name: errors
                  type: status_code
                  status_code:
                    status_codes: [ERROR]
                - name: slow-traces
                  type: latency
                  latency:
                    threshold_ms: {{ .Values.sampling.latencyThresholdMs }}
                - name: baseline
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: {{ .Values.sampling.probabilisticPercentage }}
              rate_allocation:
                - policy: errors
                  percent: {{ .Values.sampling.rateAllocation.errorsPercent }}
                - policy: slow-traces
                  percent: {{ .Values.sampling.rateAllocation.slowPercent }}
                - policy: baseline
                  percent: {{ .Values.sampling.rateAllocation.baselinePercent }}
      {{- end }}

    exporters:
      # The otlp exporter requires a bare host:port endpoint. A URL scheme
      # breaks it, and otlphttp takes the opposite syntax, so the two are not
      # interchangeable. Getting this wrong drops telemetry silently.
      otlp/honeycomb:
        endpoint: {{ .Values.honeycomb.endpoint | quote }}
        headers:
          x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

    service:
      extensions: [health_check{{ if and .Values.allowedServices .Values.sampling.tailStorage.enabled }}, pebble_tail_storage{{ end }}]
      pipelines:
        {{- if .Values.allowedServices }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/allowlist{{ if .Values.environment }}, resource/environment{{ end }}, tail_sampling, batch]
          exporters: [otlp/honeycomb]
        {{- end }}
        {{- if .Values.httpcheck.enabled }}
        # http_check only. The otlp receiver is deliberately absent here: an
        # opted-in service sends traces, not arbitrary metrics, and unbounded
        # metric events are the easiest way to burn the quota by accident.
        metrics:
          receivers: [http_check]
          processors: [memory_limiter{{ if .Values.environment }}, resource/environment{{ end }}, batch]
          exporters: [otlp/honeycomb]
        {{- end }}
