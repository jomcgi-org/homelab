onepassword:
  enabled: true
  itemPath: "vaults/k8s-homelab/items/honeycomb-ingest"

cfIngress:
  enabled: true
  hostname: jomcgi.dev

environment: production

# Services allowed to send traces. This list IS the opt-in: a service not named
# here cannot reach the receiver at all, because with an empty list the otlp
# receiver is not rendered.
#
# embervm-control must match OTEL_SERVICE_NAME in
# projects/embervm/deploy/values.yaml (tracing.serviceName). If the two drift
# apart the filter drops every span and nothing says so.
#
# monolith-backend must match PRIVATE_PROFILE.service_name in
# projects/monolith/framework/core.py, which is what _setup_otel puts in the
# resource. Its endpoint is set in projects/monolith/deploy/values.yaml and
# points at 4318 rather than 4317: that service exports over HTTP, not gRPC.
# monolith-public is deliberately absent, since PUBLIC_PROFILE sets
# otel_enabled=False and the public tier never builds an exporter.
allowedServices:
  - embervm-control
  - monolith-backend

httpcheck:
  enabled: true
  # Deliberately short to start, new targets are a one-line addition.
  #
  # PUBLIC URLs ONLY, for now. An in-cluster target needs a matching Cilium
  # ingress rule on the destination or the probe reports a permanent outage
  # that is not happening, which is worse than having no probe. monolith's
  # CiliumNetworkPolicy monolith-api-ingress allowlists port 8000 from
  # envoy-gateway-system, mcp, and monolith-workflows only, so a probe of
  # monolith.monolith.svc:8000/healthz from this namespace is dropped after
  # DNAT as a silent timeout. Adding one means adding the collector's
  # namespace to that policy in the same change.
  #
  # jomcgi.dev/health already reaches the monolith backend through the public
  # path, so nothing is unmonitored meanwhile.
  targets:
    - "https://jomcgi.dev/health"
    - "https://jomcgi.dev/"
