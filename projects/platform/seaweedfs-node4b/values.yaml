# Third SeaweedFS VOLUME SERVER, second one pinned to node-4's large SSD.
#
# Added for incident #4317 (2026-08-03): the embervm collection ran out of
# writable volumes and the master could not grow new ones ("Not enough data
# nodes found"), because both existing volume servers were at their slot
# ceilings. Every S3 PUT to the collection returned 500, which broke all
# embervm artifact durability (bases, volumes, stateful snapshots, session
# workspaces). A NEW release adds slots without touching the running servers:
# the PVC size lives in an immutable StatefulSet volumeClaimTemplate, so the
# existing releases cannot be grown via GitOps, and restarting them re-runs
# the slow idx-rebuild init container against hundreds of volumes.
#
# Same pattern as ../seaweedfs-node4: joins the existing cluster's master as a
# volume server only, in a separate Helm release because the upstream chart
# models exactly one volume StatefulSet per release.

seaweedfs:
  # The chart names the volume Service/StatefulSet from the CHART name, not
  # the release name, so without this override this release would render the
  # same names as the other two and fight them.
  nameOverride: "seaweedfs-node4b"

  global:
    enableSecurity: false
    monitoring:
      enabled: false
    # Join the existing cluster's master instead of expecting one in this
    # release (master/filer/s3 are all disabled below).
    masterServer: "seaweedfs-master.seaweedfs:9333"
    # Distinct ServiceAccount/ClusterRole names: the base release owns
    # "seaweedfs" and the first node-4 release owns "seaweedfs-node4"; the
    # chart creates the ServiceAccount unconditionally, so a duplicate name
    # would fight ArgoCD ownership over the same objects.
    serviceAccountName: "seaweedfs-node4b"

  master:
    enabled: false

  filer:
    enabled: false

  s3:
    enabled: false

  volume:
    enabled: true
    replicas: 1
    affinity: ""
    # Pin to node-4: the backing StorageClass (longhorn-node4-ssd) is a
    # strict-local single-replica class on node-4's ssd-01 disk, so the pod
    # must run where its data lives.
    nodeSelector: "kubernetes.io/hostname: node-4"
    # Pre-populate OTEL annotation to match Kyverno injection (prevents ArgoCD drift)
    # Prometheus annotations expose metrics to pod-discovery collectors.
    podAnnotations:
      otel.injected-by: kyverno/inject-otel-env-vars
      prometheus.io/scrape: "true"
      prometheus.io/port: "9327"
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "1Ti"
        storageClass: "longhorn-node4-ssd"
        # Explicit slot count (1GB volumes): 900 slots nominal ~879Gi inside
        # a 1Ti PVC keeps the slot ceiling below the disk floor. The 7%
        # min-free flip is computed against statfs blocks, which excludes
        # ext4 metadata (~17Gi at this size), so the real read-only floor is
        # ~935Gi used: ~52Gi slack over the ceiling for compaction churn.
        # Never let the ceiling exceed the disk: that is how the base release
        # wedged (see the maxVolumes note in ../seaweedfs/values.yaml).
        maxVolumes: 900
    idx:
      type: "emptyDir"
    # Regenerate missing .idx files from .dat files on startup (same rationale
    # as the base release: idx lives on an emptyDir and is lost on reschedule).
    initContainers: |
      - name: seaweedfs-vol-fix-idx
        image: '{{ include "volume.image" . }}'
        imagePullPolicy: IfNotPresent
        command: ['/bin/sh', '-c']
        args:
          - |
            echo "Checking for missing idx files..."
            for dat in /data/*.dat; do
              [ -f "$dat" ] || continue
              base=$(basename "$dat" .dat)
              if [ ! -f "/idx/${base}.idx" ]; then
                if echo "$base" | grep -q '_'; then
                  collection=$(echo "$base" | sed 's/_[0-9]*$//')
                  volid=$(echo "$base" | grep -o '[0-9]*$')
                  echo "Regenerating idx: collection=$collection volumeId=$volid"
                  /usr/bin/weed fix -collection="$collection" -volumeId="$volid" /data
                else
                  echo "Regenerating idx: volumeId=$base"
                  /usr/bin/weed fix -volumeId="$base" /data
                fi
                if [ -f "/data/${base}.idx" ]; then
                  mv "/data/${base}.idx" /idx/
                  echo "Moved ${base}.idx to /idx/"
                fi
              fi
            done
            echo "idx check complete"
        volumeMounts:
          - name: data
            mountPath: /data
          - name: idx
            mountPath: /idx
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      # 2Gi, not the 512Mi of the smaller servers: the needle map is held in
      # RAM (no -index override anywhere) and scales with needle COUNT, not
      # volume count. 900 slots handed to a small-object collection (chat
      # blobs at ~10KB are ~100k needles per volume) would blow a tighter
      # limit and OOM-loop the only server with writable slots.
      limits:
        cpu: 500m
        memory: 2Gi
