# projects/platform/cilium/bootstrap/cilium-helmchart.yaml
#
# Out-of-band bootstrap install; copied by hand to node-1 during the cutover
# window at /var/lib/rancher/k3s/server/manifests/cilium.yaml. k3s applies files
# in that directory automatically during bootstrap, installing Cilium BEFORE
# ArgoCD is reachable (it provides the CNI the cluster needs to come up). ArgoCD
# adopts the release afterward via the manual-sync Application (see ADR
# platform/012 and bootstrap/README.md).
#
# valuesContent below mirrors ../values.yaml, but at the upstream chart's top
# level (not nested under `cilium:`) because k3s installs the upstream chart
# directly here, not through our local wrapper chart.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  chart: cilium
  repo: https://helm.cilium.io
  version: 1.19.5
  targetNamespace: kube-system
  # bootstrap: true is REQUIRED for a CNI installed through the k3s
  # helm-controller. It runs the Helm install Job on the HOST network with
  # control-plane node selection and tolerations (NodeNotReady,
  # NetworkUnavailable, uninitialized, Etcd, control-plane), so the install can
  # run BEFORE any CNI exists. Without it the install Job is unschedulable (no
  # pod networking is available yet) and the cluster comes up with no CNI at all.
  # failurePolicy: abort fails loudly instead of retry-looping a broken install.
  bootstrap: true
  failurePolicy: abort
  valuesContent: |-
    kubeProxyReplacement: true
    # 127.0.0.1:6444 is valid on every node (see ../values.yaml for the full
    # reasoning and the evidence): on servers it is the apiserver's own
    # --secure-port, and on the node-4 agent it is the k3s-agent client-side
    # load balancer that proxies to all three servers with failover.
    k8sServiceHost: "127.0.0.1"
    k8sServicePort: 6444
    # cni.exclusive: false lets Cilium coexist with k3s CNI config management.
    # confPath/binPath point at k3s's real CNI dirs (from `k3s crictl info`):
    # Cilium's defaults (/etc/cni/net.d, /opt/cni/bin) are dirs k3s never reads,
    # so without these the node comes up with no usable CNI after the flip.
    cni:
      exclusive: false
      confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d
      binPath: /var/lib/rancher/k3s/data/cni

    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]

    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true

    policyEnforcementMode: default

    operator:
      replicas: 2

    hubble:
      enabled: true
      relay:
        enabled: true
      # NO tls.auto override here on purpose: this seed keeps the upstream
      # default (method=helm), while ../values.yaml uses method=certmanager.
      # This is a DELIBERATE divergence (unlike the metrics list, which must
      # match): cert-manager and its CRDs are not installed yet at a cold
      # cluster bootstrap, so a cert-manager Certificate CR here would fail to
      # apply and, with failurePolicy=abort, leave the cluster with no CNI. The
      # helm-generated certs are fine for the bootstrap seed; ArgoCD reissues
      # them via cert-manager when it adopts the release.
      # httpV2 emits nothing until an L7 CiliumNetworkPolicy redirects a surface
      # through Envoy (ADR networking/003 #2); inert until the /invoke L7 rule
      # lands. This list MUST match ../values.yaml or a node reboot reverts it.
      # drop carries context labels (#4659) so policy-denied drops can be
      # attributed to a destination namespace and direction; bare drop is
      # node-wide only. Same rationale as ../values.yaml, keep both in step.
      metrics:
        enabled:
          - dns
          - "drop:labelsContext=source_namespace,destination_namespace,destination_workload,traffic_direction"
          - tcp
          - flow
          - "httpV2:sourceContext=workload;destinationContext=workload;labelsContext=source_namespace,destination_namespace"
