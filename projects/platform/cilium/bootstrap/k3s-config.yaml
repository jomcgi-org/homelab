# projects/platform/cilium/bootstrap/k3s-config.yaml
#
# Reference-only fragment. Applied BY HAND in Track 2, NOT via ArgoCD.
# Append these keys to /etc/rancher/k3s/config.yaml on node-1/2/3, then reboot
