apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    path: projects/platform/cilium
    helm:
      releaseName: cilium
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Cilium is now GitOps-reconciled (ADR platform/012, migration plan Step 5).
  # The bootstrap HelmChart CR in bootstrap/ stays the INSTALL seam (it provides
  # the CNI before ArgoCD is reachable); ArgoCD adopts the release and reconciles
  # ongoing config from here. Verified before enabling: the rendered chart values
  # (version 1.19.5, image, and every datapath cilium-config key: WireGuard,
  # node encryption, tunnel/vxlan, pod CIDR, kube-proxy-replacement=false,
  # policy=default, cni-exclusive=false) match the live install, and the rendered
  # resource set equals the tracked set, so adoption is metadata-only (no agent
  # roll, nothing pruned).
  # No ignoreDifferences for the Hubble certs any more. They used to be needed
  # because tls.auto.method=helm generated random CA + leaf certs at template
  # time (a fresh diff every render, masked here so live certs were not rotated).
  # With method=certmanager (../values.yaml) the chart renders deterministic
  # Certificate CRs and cert-manager owns the Secrets, so cilium-ca /
  # hubble-server-certs / hubble-relay-client-certs are no longer part of the
  # rendered desired state and ArgoCD never diffs them. The one-time switch
  # reissues the Hubble certs via cert-manager (a brief Hubble reconnect; the
  # eBPF datapath and WireGuard keys are unaffected).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Cilium's bundled CRDs render large; server-side apply skips the 256 KiB
      # last-applied-configuration annotation cap that client-side apply hits.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
