# projects/platform/cilium/values.yaml
#
# Cilium is installed via the local wrapper chart (Chart.yaml depends on the
# upstream oci://quay.io/cilium/charts cilium chart), so these values are nested
# under the `cilium:` subchart key to reach the upstream chart's values.
cilium:
  kubeProxyReplacement: true # ADR networking/003 capability #3

  # cilium-agent can no longer reach the apiserver through the kube-proxy-routed
  # in-cluster kubernetes Service once kube-proxy is gone, so it must be given
  # the address directly. 127.0.0.1:6444 is correct on EVERY node, because the
  # address resolves to a different (but equally valid) thing per role:
  #
  #   node-1/2/3 (servers): the apiserver's own secure port. It binds
  #     --bind-address=127.0.0.1 --secure-port=6444 (see the kube-apiserver argv
  #     in `journalctl -u k3s`); :6443 is the public listener in front of it.
  #   node-4 (agent): the k3s-agent client-side load balancer, which listens on
  #     127.0.0.1:6444 and proxies to ALL three servers with failover. Its server
  #     list lives in <data-dir>/agent/etc/k3s-agent-load-balancer.json and holds
  #     all of 192.168.1.119/.161/.123, not just the node's join address.
  #
  # This supersedes an earlier comment here which said 127.0.0.1 "would be WRONG
  # on the node-4 agent, which has no local apiserver". node-4 indeed runs no
  # apiserver process, but it does expose a local loopback API endpoint, which is
  # what k8sServiceHost actually needs. Verified on all four nodes: a listener on
  # 127.0.0.1:6444 answering /healthz with 401 (TLS up, anonymous auth refused,
  # which is the expected response given --anonymous-auth=false).
  #
  # Using the loopback endpoint rather than a server IP also avoids making one
  # node a single point of failure for service routing, and needs no VIP (this
  # cluster runs no kube-vip/keepalived/metallb).
  #
  # cilium-agent runs hostNetwork, so 127.0.0.1 in its namespace is the host's
  # loopback and reaches the local endpoint directly.
  k8sServiceHost: "127.0.0.1"
  k8sServicePort: 6444

  # Coexist with k3s's own CNI config management rather than taking the CNI conf
  # directory exclusively (k3s writes and owns it). Recommended for k3s+Cilium.
  # confPath/binPath point at k3s's real CNI dirs (from `k3s crictl info`):
  # Cilium's defaults (/etc/cni/net.d, /opt/cni/bin) are dirs k3s never reads, so
  # without these overrides a node comes up with no usable CNI after the flip.
  cni:
    exclusive: false
    confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d
    binPath: /var/lib/rancher/k3s/data/cni

  ipam:
    mode: cluster-pool
    operator:
      clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"] # match k3s flannel CIDR

  encryption:
    enabled: true
    type: wireguard
    nodeEncryption: true # encrypt node-to-node too

  policyEnforcementMode: default # allow-until-selected; no deny-gap at cutover

  operator:
    replicas: 2

  hubble:
    enabled: true
    relay:
      enabled: true
    # Generate Hubble's mTLS certs with cert-manager instead of Helm. With the
    # default method=helm the chart calls genCA/genSignedCert at template time,
    # so every `helm template` / `helm diff` produced a fresh random CA and leaf
    # certs (noise in every diff, previously masked at sync time by
    # ignoreDifferences on the secret /data in ../application.yaml). cert-manager
    # renders only deterministic Certificate CRs and owns the Secrets at runtime,
    # so the diff is stable and cert-manager also auto-rotates the leaf certs
    # (helm mode never rotated them). The CA chain the ref points at is defined
    # in templates/hubble-ca-issuer.yaml. NOTE: bootstrap/cilium-helmchart.yaml
    # deliberately stays on method=helm; cert-manager is not installed yet at a
    # cold cluster bootstrap, so a Certificate CR there would fail to apply and,
    # with failurePolicy=abort, leave the cluster with no CNI. ArgoCD converges
    # the adopted release to cert-manager after bootstrap.
    tls:
      auto:
        enabled: true
        method: certmanager
        certManagerIssuerRef:
          group: cert-manager.io
          kind: Issuer
          name: cilium-hubble-ca-issuer
    # UI off. Keep the flow buffer modest.
    # httpV2 emits nothing until an L7 CiliumNetworkPolicy redirects a surface
    # through Envoy (ADR networking/003 #2); it is inert until Task A1 lands the
    # /invoke L7 rule. httpV2 (not v1 http) folds status onto
    # hubble_httpv2_requests_total, which the error-rate alert reads. Context is
    # workload+namespace only: no path/URL label (PII + cardinality). This list
    # MUST match bootstrap/cilium-helmchart.yaml or a node reboot reverts it.
    #
    # drop carries context labels (#4659) because bare hubble_drop_total is
    # node-wide and cumulative, so policy-denied drops cannot be attributed to
    # a destination. The hubble ring buffer is only minutes deep, so drops are
    # also unanswerable retroactively. The labeled counter series preserves the
    # context needed by any collector that explicitly opts in.
    # labelsContext keys are exact per metric (no combined "ns/workload"
    # source/destination label), keeping cardinality to one series per
    # (reason, protocol, namespace-pair, direction) tuple on this small cluster.
    metrics:
      enabled:
        - dns
        - "drop:labelsContext=source_namespace,destination_namespace,destination_workload,traffic_direction"
        - tcp
        - flow
        - "httpV2:sourceContext=workload;destinationContext=workload;labelsContext=source_namespace,destination_namespace"
