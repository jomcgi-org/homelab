apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-monolith-policy-drops-alert
  namespace: signoz
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "Monolith Policy-Denied Ingress Drops"
    signoz.io/severity: "critical"
    signoz.io/notification-channels: "incidentio"
# Watches the failure mode of the armed monolith-api-ingress CiliumNetworkPolicy
# (issue #4659): an ingress allowlist CNP denies by silent dial timeout, not by a
# readable error, and the hubble ring buffer is only minutes deep, so "were there
# drops?" is unanswerable after the fact. The durable record is the labeled
# hubble_drop_total counter series scraped into SigNoz by the prometheus/hubble
# receiver in values-prod.yaml; the drop metric carries destination context only
# because projects/platform/cilium/values.yaml requests it via labelsContext.
#
# Scoping follows issue #4659's guidance: cilium_drop_count_total is node-wide
# and cumulative and unusable as-is. This rule keys on reason='POLICY_DENIED'
# with destination_namespace='monolith' and traffic_direction='ingress', which
# selects drops toward the monolith app pod: it is the only endpoint an ingress
# CNP selects in that namespace today. destination_workload is available on the
# series for tightening later, deliberately not filtered on until confirmed
# against a live scrape of :9965/metrics (same posture as the fc-invoke L7
# alert, which deferred to the certain namespace label).
#
# Sustained, not a blip: timeAggregation=increase makes each evaluation measure
# the windowed rate (not the cumulative counter), and matchType=5 requires 10
# consecutive evaluations (evalWindow 10m / frequency 1m) each showing at least
# one policy-denied drop in their 60s step. A single dropped packet never pages;
# a persistent allowlist gap or active forgery attempt does.
#
# Critical rather than warning: every matching drop is either a caller the
# allowlist should have admitted (an outage already happening, invisible to the
# caller beyond a hang) or an in-cluster workload probing the API (the header
# forgery this policy exists to catch).
data:
  alert.json: |
    {
      "alert": "Monolith Policy-Denied Ingress Drops",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": false,
      "evalWindow": "10m0s",
      "frequency": "1m0s",
      "severity": "critical",
      "labels": {
        "service": "monolith",
        "category": "network",
        "environment": "production"
      },
      "annotations": {
        "summary": "Cilium is persistently dropping ingress packets to the monolith app pod",
        "description": "hubble_drop_total{reason=POLICY_DENIED, destination_namespace=monolith, traffic_direction=ingress} increased in every one of the last 10 consecutive evaluations (10 minutes). The monolith-api-ingress CiliumNetworkPolicy is default-deny on ingress, so these drops are either a legitimate caller missing from the allowlist (it experiences a silent dial timeout, no readable error; see issue #4659) or an in-cluster workload attempting access it must not have. Check who was denied with: hubble observe --to-namespace monolith --verdict DROPPED --last 200. Review the allowlist in projects/monolith/chart/templates/cilium-ingress-policy.yaml before adding entries: every grant widens what can forge X-Auth-Email."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "hubble_drop_total"
                  }
                ],
                "filter": {
                  "expression": "reason = 'POLICY_DENIED' AND destination_namespace = 'monolith' AND traffic_direction = 'ingress'"
                },
                "groupBy": [
                  {
                    "name": "destination_namespace",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  },
                  {
                    "name": "traffic_direction",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  },
                  {
                    "name": "source_namespace",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  },
                  {
                    "name": "protocol",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "5",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "critical",
              "target": 0,
              "targetUnit": "",
              "matchType": "5",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
