# Path-based private ingress: https://private.jomcgi.dev/app/signoz
# SigNoz serves all routes under the base path below, so it cannot also serve
# at a bare hostname; the former signoz.jomcgi.dev route was retired in PR #2534.
cfIngress:
  enabled: true
  tier: trusted
  hostname: private.jomcgi.dev
  pathPrefix: /app/signoz
  serviceName: signoz
  servicePort: 8080
  gateway:
    name: cloudflare-ingress
    namespace: envoy-gateway-system

# k8s-infra subchart configuration
k8s-infra:
  presets:
    # Enable Prometheus annotation-based scraping for metrics from annotated pods/services
    # This allows scraping metrics from services with prometheus.io/scrape: "true" annotations
    # Used by ArgoCD metrics services and other standard Prometheus-compatible exporters
    prometheus:
      enabled: true
      # Use standard prometheus.io annotation prefix (ArgoCD, kube-state-metrics, etc.)
      annotationsPrefix: prometheus.io
      scrapeInterval: 30s
  otelAgent:
    # Run the agent in the host network namespace so kube-apiserver and kubelet
    # can export OTLP traces to localhost:4317 (see bootstrap/README.md).
    #
    # The chart's hostPort declarations were decorative: the active CNI config
    # is Cilium's own conflist, which chains no portmap plugin, and Cilium only
    # implements hostPort via eBPF when kubeProxyReplacement is enabled (it is
    # not). So nothing ever bound 4317 on the host. The chart drops the hostPort
    # fields automatically when hostNetwork is true, which is the correct
    # outcome: one mechanism, and one that actually works.
    #
    # dnsPolicy must be ClusterFirstWithHostNet or the agent cannot resolve its
    # own exporter target. The chart has no dnsPolicy field, so it is applied by
    # the otel-agent-hostnet-dns Kyverno policy; the two must move together.
    hostNetwork: true
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi
  otelDeployment:
    # Memory limit raised 400Mi -> 768Mi: this collector was OOMKilled repeatedly
    # (cluster-telemetry bursts exceed 400Mi); 768Mi gives headroom over steady ~320Mi.
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 768Mi
    # Inject Cloudflare Access service token for Zero Trust bypass
    # Create a service token in Cloudflare Zero Trust dashboard:
    # Zero Trust > Access > Service Auth > Create Service Token
    additionalEnvs:
      CF_ACCESS_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: synthetic-tests
            key: cloudflare-client-id
      CF_ACCESS_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: synthetic-tests
            key: cloudflare-client-secret
    config:
      receivers:
        # Prometheus scraper for NVIDIA GPU metrics (DCGM exporter)
        prometheus/dcgm:
          config:
            scrape_configs:
              - job_name: "nvidia-dcgm"
                scrape_interval: 30s
                static_configs:
                  - targets:
                      - "nvidia-dcgm-exporter.gpu-operator.svc.cluster.local:9400"
                    labels:
                      service: nvidia-gpu

        # Prometheus scraper for CloudNative PG (monolith database)
        # CNPG exposes pg_stat metrics on port 9187 via built-in exporter
        prometheus/cnpg:
          config:
            scrape_configs:
              - job_name: "cnpg-monolith"
                scrape_interval: 30s
                static_configs:
                  - targets:
                      - "monolith-pg-metrics.monolith.svc.cluster.local:9187"
                    labels:
                      service: monolith-postgres

        # Prometheus scraper for Cilium Hubble metrics (node-local flow metrics)
        # Cilium agent pods expose Hubble metrics on port 9965; scrape them
        # directly via pod service discovery rather than the headless Service.
        prometheus/hubble:
          config:
            scrape_configs:
              - job_name: "hubble"
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: ["kube-system"]
                relabel_configs:
                  # Keep only Cilium agent pods
                  - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                    action: keep
                    regex: cilium
                  # Skip pods that are not yet Running
                  - source_labels: [__meta_kubernetes_pod_phase]
                    action: keep
                    regex: Running
                  # Scrape the Hubble metrics port on each pod IP
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: "$1:9965"
                  # Propagate k8s context labels for filtering in SigNoz
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: k8s_namespace_name
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: k8s_pod_name

        # =============================================================================
        # Synthetic HTTP Health Checks
        # Monitors all public domains for availability and response time
        # Uses OpenTelemetry httpcheck receiver
        # =============================================================================

        # Kubernetes-hosted services (via Cloudflare Tunnel)
        # These require Cloudflare Zero Trust authentication bypass via service token headers
        httpcheck/k8s-services:
          collection_interval: 120s
          targets:
            # GitOps - ArgoCD (path-based; gateway strips the prefix)
            - endpoint: https://private.jomcgi.dev/app/argocd/healthz
              method: GET
              headers:
                CF-Access-Client-Id: "${env:CF_ACCESS_CLIENT_ID}"
                CF-Access-Client-Secret: "${env:CF_ACCESS_CLIENT_SECRET}"
            # Storage management - Longhorn (path-based; trailing slash avoids
            # the bare-prefix 301 to /app/longhorn/)
            - endpoint: https://private.jomcgi.dev/app/longhorn/
              method: GET
              headers:
                CF-Access-Client-Id: "${env:CF_ACCESS_CLIENT_ID}"
                CF-Access-Client-Secret: "${env:CF_ACCESS_CLIENT_SECRET}"
            # Observability - SigNoz (path-based; SigNoz serves under the prefix)
            - endpoint: https://private.jomcgi.dev/app/signoz
              method: GET
              headers:
                CF-Access-Client-Id: "${env:CF_ACCESS_CLIENT_ID}"
                CF-Access-Client-Secret: "${env:CF_ACCESS_CLIENT_SECRET}"
            # Image hosting (monolith-public imgproxy serves /health)
            - endpoint: https://img.jomcgi.dev/health
              method: GET
              headers:
                CF-Access-Client-Id: "${env:CF_ACCESS_CLIENT_ID}"
                CF-Access-Client-Secret: "${env:CF_ACCESS_CLIENT_SECRET}"
            # API gateway
            - endpoint: https://api.jomcgi.dev/status.json
              method: GET
              headers:
                CF-Access-Client-Id: "${env:CF_ACCESS_CLIENT_ID}"
                CF-Access-Client-Secret: "${env:CF_ACCESS_CLIENT_SECRET}"
            # Todo app (public - no auth needed but include for consistency)
            - endpoint: https://todo.jomcgi.dev
              method: GET
            # Todo admin (requires auth)
            - endpoint: https://todo-admin.jomcgi.dev
              method: GET
              headers:
                CF-Access-Client-Id: "${env:CF_ACCESS_CLIENT_ID}"
                CF-Access-Client-Secret: "${env:CF_ACCESS_CLIENT_SECRET}"
        # Cloudflare Pages (static sites) - no auth required
        httpcheck/cloudflare-pages:
          targets:
            # Personal website
            - endpoint: https://jomcgi.dev
              method: GET
            # Hiking routes
            - endpoint: https://hikes.jomcgi.dev
              method: GET
          collection_interval: 120s

      service:
        pipelines:
          # Add NATS metrics to the scraper pipeline
          metrics/scraper:
            receivers:
              - prometheus/dcgm
              - prometheus/cnpg
              - prometheus/hubble
              - httpcheck/k8s-services
              - httpcheck/cloudflare-pages
            processors:
              - k8sattributes
              - resourcedetection
              - batch
            # No exporters key on purpose. The chart appends the exporter its
            # presets render, so naming a transport here pins something upstream
            # owns. k8s-infra 0.16.0 flipped presets.otlpExporter to false and
            # otlphttpExporter to true, which left this list referencing an
            # "otlp" exporter that no longer existed and crash-looped the
            # collector. Omitting it follows whichever transport the chart
            # enables.

# signoz subchart configuration
# NOTE: k8s-infra is a sibling subchart (not nested inside signoz). Configure
# the OTel agent/deployment resources and receivers under the top-level k8s-infra key above.
signoz:
  signoz:
    env:
      # Serve UI and API under /app/signoz (requires SigNoz >= v0.121).
      # The gateway forwards the full path; the prefix must not be stripped.
      # Health probes are exempt and stay on /api/v1/health at the root.
      signoz_global_external__url: https://private.jomcgi.dev/app/signoz
  clickhouse:
    # 7-day SigNoz working_set ~6.4Gi, growing, against the old 8Gi limit (~80%).
    # Raised request 5 -> 6.5 to reserve real usage and limit 8 -> 10 for headroom
    # (node-4 has ample room). The telemetry store is the binding signoz tenant.
    resources:
      requests:
        cpu: 2
        memory: 6.5Gi
      limits:
        cpu: 4
        memory: 10Gi
    persistence:
      # LEFT AT 150Gi DELIBERATELY. Kubernetes PVCs cannot shrink in place
      # (Longhorn allowVolumeExpansion only grows a volume); lowering this value
      # would be ignored by the running PVC or force a destructive recreate. The
      # storage audit's suggested 150Gi -> 100Gi ceiling reduction therefore
      # requires a separate, planned PVC migration and is OUT OF SCOPE here. This
      # PR frees space WITHIN the existing 150Gi by tightening system-log TTLs
      # below; the filesystem holds only ~48G of 147G, so headroom is ample.
      size: 150Gi
    # System table TTL settings (days) - prevents unbounded growth.
    #
    # These are ClickHouse's own SYSTEM-table logs, not SigNoz app telemetry.
    # App-data retention (logs_v2, traces, samples_v4 metrics) is NOT a chart
    # value: it is set via the SigNoz retention API and stored in the SigNoz DB,
    # so it is out of GitOps scope and untouched here. Durable observability data
    # (the ~30G of logs/traces/metrics the owner wants) is unaffected by these
    # system-log TTLs.
    #
    # Reduced per the storage audit (2026-07-20): zookeeper_log alone held ~11.5G
    # at a 7d TTL, so the high-volume system logs are cut 7d -> 3d. traceLog and
    # processorsProfileLog were already at 3d. sessionLog kept at 7d (tiny, and
    # useful for auth debugging).
    clickhouseOperator:
      queryLog:
        ttl: 3
      partLog:
        ttl: 3
      traceLog:
        ttl: 3
      metricLog:
        ttl: 3
      asynchronousMetricLog:
        ttl: 3
      sessionLog:
        ttl: 7
      zookeeperLog:
        ttl: 3
      processorsProfileLog:
        ttl: 3
      queryViewsLog:
        ttl: 3
    # Zookeeper is a subchart of clickhouse
    zookeeper:
      # 7-day working_set ~1.13Gi against a 1Gi request: raised 1 -> 1.25 to
      # reserve real usage. Lives on a small (12.3Gi) control-plane node.
      resources:
        requests:
          cpu: 100m
          memory: 1.25Gi
        limits:
          cpu: 1
          memory: 1.5Gi
  otelCollector:
    # 7-day SigNoz peak RSS 667Mi / working_set 680Mi: the old 2Gi request / 4Gi
    # limit reserved ~3x the real peak. Trimmed to 768Mi / 1.5Gi (above the 680Mi
    # peak with ~2x burst headroom for incident-time telemetry spikes).
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 2
        memory: 1.5Gi
