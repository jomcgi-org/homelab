# projects/platform/signoz/bootstrap/10-tracing.conf
#
# Reference-only fragment. Installed BY HAND into the kubelet's config drop-in
# directory on every node, NOT via ArgoCD. See bootstrap/README.md.
#
# DERIVE the directory per node; do not hardcode it. It is
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d on node-1/2/3 but
# /disks/nvme-01/k3s-data/... on node-4, which runs a custom k3s --data-dir. A
# STALE copy of the default tree still exists on node-4 and will accept the
# install silently while the kubelet reads the other one:
#
#   journalctl -u k3s-agent -u k3s --no-pager \
#     | grep -oE '[-]-config-dir=[^ ]+' | tail -1 | cut -d= -f2
#
# Verify with the kubelet's own configz afterwards, never with file presence.
#
# The kubelet has no tracing-config-file flag: TracingConfiguration is an
# embedded field of KubeletConfiguration, so it must arrive through the config
# drop-in directory that k3s already maintains (00-k3s-defaults.conf lives
# beside this file). Passing tracing-config-file via kubelet-arg would be an
# unknown flag and would crash-loop the kubelet, taking the node with it.
#
# The 10- prefix sorts after 00-k3s-defaults.conf so these keys win, and k3s
# regenerates only its own 00- file on restart, leaving this one intact.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
tracing:
  endpoint: localhost:4317
  samplingRatePerMillion: 1000
