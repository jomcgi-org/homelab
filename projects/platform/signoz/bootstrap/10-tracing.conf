# projects/platform/signoz/bootstrap/10-tracing.conf
#
# Reference-only fragment. Installed BY HAND to
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/10-tracing.conf on every node,
# NOT via ArgoCD. See bootstrap/README.md.
#
# The kubelet has no tracing-config-file flag: TracingConfiguration is an
# embedded field of KubeletConfiguration, so it must arrive through the config
# drop-in directory that k3s already maintains (00-k3s-defaults.conf lives
# beside this file). Passing tracing-config-file via kubelet-arg would be an
# unknown flag and would crash-loop the kubelet, taking the node with it.
#
# The 10- prefix sorts after 00-k3s-defaults.conf so these keys win, and k3s
# regenerates only its own 00- file on restart, leaving this one intact.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
tracing:
  endpoint: localhost:4317
  samplingRatePerMillion: 1000
