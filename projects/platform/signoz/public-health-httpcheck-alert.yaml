apiVersion: v1
kind: ConfigMap
metadata:
  name: public-health-httpcheck-alert
  namespace: signoz
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "Public /health Unavailable"
    signoz.io/severity: "critical"
    signoz.io/notification-channels: "incidentio"
data:
  alert.json: |
    {
      "alert": "Public /health Unavailable",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": false,
      "evalWindow": "10m0s",
      "frequency": "2m0s",
      "severity": "critical",
      "labels": {
        "service": "monolith-public",
        "environment": "production",
        "type": "public-health"
      },
      "annotations": {
        "summary": "jomcgi.dev/health is failing",
        "description": "The public composite health endpoint (https://jomcgi.dev/health) has returned a non-2xx status for 5 consecutive checks over 10 minutes (issue #4867). The frontend proxies this route to the backend deep check, so a fatal component failure (database, ember_postgres synthetic probes, and similar) makes it return 503. Advisory-only degradation (cd health chart lag, red CI) keeps the response at 200 with degraded[] entries and does NOT trip this alert."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "aggregations": [
                  {
                    "timeAggregation": "avg",
                    "spaceAggregation": "max",
                    "metricName": "httpcheck.status"
                  }
                ],
                "filter": {
                  "expression": "http.url = 'https://jomcgi.dev/health'"
                },
                "groupBy": [],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "2",
        "target": 1,
        "matchType": "5",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "critical",
              "target": 1,
              "targetUnit": "",
              "matchType": "5",
              "op": "2",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
