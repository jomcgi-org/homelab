# Temporal workflow orchestration engine -- shared infrastructure.
#
# Deployed via the upstream temporalio/temporal chart (1.2.0, appVersion 1.31.0).
# Backed by the EXISTING CNPG Postgres cluster `monolith-pg` in the `monolith`
# namespace (NO bundled database -- the 1.x chart line ships no DB subcharts).
# Standard SQL visibility on the `temporal_visibility` DB (NO Elasticsearch).
#
# Per ADR agents/015: internal-only (no Cloudflare exposure), Linkerd-meshed
# (opaque ports for gRPC/membership), SigNoz observability via Prometheus scrape.
temporal:
  # ---------------------------------------------------------------------------
  # Image-shim compatibility: appVersion is 1.31.0 (>= 1.30), so the 1.29
  # dockerize / elasticsearch-tool shims are unnecessary.
  # ---------------------------------------------------------------------------
  shims:
    dockerize: false
    elasticsearchTool: false

  # ---------------------------------------------------------------------------
  # Schema setup/upgrade Job.
  # createDatabase=false: the `temporal` + `temporal_visibility` databases are
  #   created out-of-band by the sibling INFRA-CNPG-DBS unit (CNPG `Database`
  #   CRD, owner `app`). Temporal must NOT attempt to CREATE them.
  # manageSchema=true: Temporal's `temporal-sql-tool setup-schema/update-schema`
  #   manages the table schema inside those (pre-existing) databases.
  # useHelmHooks=true: renders the schema Job as `helm.sh/hook: pre-install,
  #   pre-upgrade`, which ArgoCD maps to a PreSync hook -- schema is applied
  #   before the server pods roll. Works cleanly with ArgoCD.
  # ---------------------------------------------------------------------------
  schema:
    useHelmHooks: true
    podAnnotations:
      linkerd.io/inject: disabled
    containerSecurityContext:
      # The upstream temporal-admin-tools image declares its user as the NAME
      # `temporal` (uid 1000), not a number. With runAsNonRoot:true and no
      # numeric runAsUser, the kubelet cannot verify the user is non-root and
      # refuses to start the container ("image has non-numeric user (temporal),
      # cannot verify user is non-root"). Unlike the server pods, the schema Job
      # has no pod-level securityContext to inherit a uid from, so set it here.
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  server:
    # Non-root. The upstream temporal-server image is built for uid 1000; forcing
    # 65532 breaks its writable paths, so we keep 1000 but enforce runAsNonRoot.
    securityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true

    config:
      logLevel: "info"
      persistence:
        defaultStore: default
        visibilityStore: visibility
        # numHistoryShards cannot be changed after the initial deployment.
        numHistoryShards: 512
        datastores:
          # Main persistence store -> `temporal` DB on the existing CNPG cluster.
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: "monolith-pg-rw.monolith.svc.cluster.local:5432"
              connectProtocol: "tcp"
              user: app
              # Password sourced from the `temporal-pg` Secret synced by the
              # OnePasswordItem below (key `password`).
              existingSecret: temporal-pg
              secretKey: password
              createDatabase: false
              manageSchema: true
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: "1h"
          # Standard SQL visibility store -> `temporal_visibility` DB (NO Elasticsearch).
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: "monolith-pg-rw.monolith.svc.cluster.local:5432"
              connectProtocol: "tcp"
              user: app
              existingSecret: temporal-pg
              secretKey: password
              createDatabase: false
              manageSchema: true
              maxConns: 10
              maxIdleConns: 10
              maxConnLifetime: "1h"
      metrics:
        prometheus:
          timerType: histogram
          listenAddress: "0.0.0.0:9090"
      namespaces:
        # Create the `default` namespace on first boot so workflows can register.
        create: true
        namespace:
          - name: default
            # 14d history retention (ADR 015 Open Question 3: "7-14 days").
            retention: 14d

    # -- frontend (gRPC API on 7233) --------------------------------------------
    frontend:
      replicaCount: 2
      podAnnotations:
        # Linkerd: frontend gRPC (7233), internal HTTP-API gRPC, and the cluster
        # membership ports carry binary/long-lived traffic Linkerd's protocol
        # detection mishandles -> mark them opaque.
        config.linkerd.io/opaque-ports: "7233,7234,7235,7236,7239,6933,6934,6935,6936,6939"
        # Pre-populate OTEL annotation to match Kyverno injection (prevents ArgoCD drift).
        otel.injected-by: kyverno/inject-otel-env-vars
        # SigNoz autodiscovery scrapes Temporal's native Prometheus endpoint.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      metrics:
        serviceMonitor:
          enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # -- history -----------------------------------------------------------------
    history:
      replicaCount: 2
      podAnnotations:
        config.linkerd.io/opaque-ports: "7233,7234,7235,7236,7239,6933,6934,6935,6936,6939"
        otel.injected-by: kyverno/inject-otel-env-vars
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      metrics:
        serviceMonitor:
          enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    # -- matching ----------------------------------------------------------------
    matching:
      replicaCount: 2
      podAnnotations:
        config.linkerd.io/opaque-ports: "7233,7234,7235,7236,7239,6933,6934,6935,6936,6939"
        otel.injected-by: kyverno/inject-otel-env-vars
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      metrics:
        serviceMonitor:
          enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # -- worker (Temporal system worker, NOT our task-queue workers) -------------
    worker:
      replicaCount: 2
      podAnnotations:
        config.linkerd.io/opaque-ports: "7233,7234,7235,7236,7239,6933,6934,6935,6936,6939"
        otel.injected-by: kyverno/inject-otel-env-vars
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
      containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      metrics:
        serviceMonitor:
          enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi

  # admintools: temporal-sql-tool / tctl image. Used by the schema Job and for
  # ad-hoc admin. Keep enabled but small; no SSH service exposure needed.
  admintools:
    enabled: true
    podAnnotations:
      linkerd.io/inject: disabled
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # -- Web UI (internal-only; ClusterIP, NO ingress) -----------------------------
  # Per ADR 015 the Temporal API/UI must NOT be exposed externally. The UI is a
  # ClusterIP Service only; a cluster-internal ingress (envoy-gateway internal
  # listener) is a deferred follow-up -- see INFRA-TEMPORAL status note.
  web:
    enabled: true
    replicaCount: 1
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    podAnnotations:
      # UI talks to the frontend over gRPC (7233) -> keep that opaque too.
      config.linkerd.io/opaque-ports: "7233"
      otel.injected-by: kyverno/inject-otel-env-vars
    containerSecurityContext:
      # Same as the schema Job: the temporal-ui image's user is the NAME
      # `temporal` (uid 1000); set a numeric runAsUser so runAsNonRoot can be
      # verified (no pod-level securityContext here to inherit one).
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # -- Disable the in-chart connection test pod ---------------------------------
  # (`helm test`-only; not needed for GitOps.)

  # ---------------------------------------------------------------------------
  # Cross-namespace Postgres credential: the CNPG `app` password lives in Secret
  # `monolith-pg-app` (ns `monolith`). It is cloned into THIS namespace as the
  # `temporal-pg` Secret by the Kyverno ClusterPolicy `clone-monolith-pg-app`
  # (projects/platform/kyverno/templates/clone-monolith-pg-secret-policy.yaml)
  # with synchronize:true -- no manual 1Password step, auto-resyncs on rotation.
  # `existingSecret: temporal-pg` above consumes it (key `password`).
  # ---------------------------------------------------------------------------
  extraObjects: []
