apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-serving-activator-errors-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Serving Activator Error Rate"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Activator error-rate alert for R3 serving (Task 10, D-R3.10.1). R3 keeps the
# control plane OFF the serving hit path, so serving-health observability comes from
# the node Envoy tier, not from ember spans (the control plane is spans-only: no OTel
# metric series to alert on). A serving MISS that the activator cannot satisfy (wake-
# rate 429, parked-cap 503, wake_failed 503, unknown-workload 404) is returned to the
# caller THROUGH the node Envoy, so it lands in the node Envoy's per-cluster
# upstream_rq_xx counters for the serve| clusters exactly like the fc-invoke 5xx
# story (hubble-invoke-http). This is an ABSOLUTE sustained 5xx count over a window,
# not a fraction: a low-QPS activator would spike a ratio to 100% on a single failed
# wake. Mirrors hubble-invoke-http's metric-series shape.
#
# STAT NAME: written against the standard Envoy Prometheus exposition
# (envoy_cluster_upstream_rq_xx, label envoy_response_code_class="5", per
# envoy_cluster_name). The node Envoy stats are scraped via the serving-envoy
# DaemonSet's prometheus.io annotations (embervm chart, Task 10). CONFIRM the exact
# scraped metric + label names via a live /stats/prometheus scrape in the post-merge
# verification before trusting this fires (same discipline hubble-invoke-http carries);
# the OTel Prometheus receiver may normalize the name/labels.
data:
  alert.json: |
    {
      "alert": "EmberVM Serving Activator Error Rate",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": false,
      "evalWindow": "10m0s",
      "frequency": "1m0s",
      "severity": "warning",
      "labels": {
        "category": "serving",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM serving activator is returning sustained 5xx on cluster {{ "{{" }} $labels.envoy_cluster_name {{ "}}" }}",
        "description": "The node Envoy shows more than 5 serving-cluster 5xx responses (envoy_cluster_upstream_rq_xx, response class 5) in the last 10 minutes. A serving miss the activator cannot satisfy (wake-rate 429, parked-cap 503, wake_failed 503) returns through the node Envoy and lands here, so this is the activator failing to wake a workload: no serving capacity, a stuck/slow StartServing, a lost snapshot, or a wake-rate storm. Levers, values-configurable per serving workload in the embervm chart: raise serving.maxInstances (more concurrent capacity), raise the per-workload wake-rate/parked caps, or check node serving capacity. Investigate with the embervm.serving.activate spans in SigNoz (ember.workload, ember.cold) and `kubectl logs -n embervm deploy/embervm`. See D-R3.10.1."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "envoy_cluster_upstream_rq_xx"
                  }
                ],
                "filter": {
                  "expression": "envoy_response_code_class = '5' AND envoy_cluster_name =~ '^serve\\|'"
                },
                "groupBy": [
                  {
                    "name": "envoy_cluster_name",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 5,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 5,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
