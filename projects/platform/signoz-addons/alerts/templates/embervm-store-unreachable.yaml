apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-store-unreachable-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Object Store Unreachable"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Store-unreachable alert (R6, Task 11). noded runs a reachability probe on a timer
# and surfaces the verdict as NodeStatus.store_reachable (server/store.go), which the
# control plane ingests into its node projection. A missing or unreachable store is
# fail-open for warmth (decision 7): local-state wakes are unaffected, banks still
# commit locally, and exports resume on recovery. So `store_reachable == false` is
# NOT an availability outage, but SUSTAINED false is worth paging on: while the store
# is down no new durable copies are made, so the durability window widens and a node
# loss in that window loses whatever banked only locally. The alert exists to catch a
# store outage that persists past a short blip (a SeaweedFS restart is expected to
# clear in seconds).
#
# THIS IS A PLACEHOLDER (disabled, threshold-0 dry-run), NOT a live alert, per the
# D-R3.10.1 + D-R4.PR-10.1 discipline: there is NO exported store-reachability metric
# series in this cluster today. store_reachable rides NodeStatus (the WatchNode
# stream) and the CP node projection, not Prometheus; it is investigable in the CP
# logs and node facts but is not an alertable metric series. Turning it into a firing
# alert needs a control-plane exporter (a per-node `embervm_store_reachable` gauge) or
# a noded-side probe metric, neither of which exists yet. FLAGGED FOR JOE (R6
# closure): promote off dry-run once that gauge lands. The query is keyed on that
# not-yet-exported gauge so it cannot fire silently against a fake-but-passing series.
#
# Until the metrics pipeline lands, investigate via the CP node projection
# (store_reachable) and the noded store-probe logs in the SigNoz logs view.
data:
  alert.json: |
    {
      "alert": "EmberVM Object Store Unreachable",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "15m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "continuity",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM node {{ "{{" }} $labels.node_id {{ "}}" }} object store unreachable (durability window widening)",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for store reachability; this alert cannot fire as written (store_reachable rides NodeStatus and the CP node projection, not Prometheus, D-R4.PR-10.1). A sustained store_reachable=false is fail-open for warmth (local wakes and banks are unaffected, exports resume on recovery), so it is NOT an outage, but while the store is down no new durable off-node copies are made and a node loss in that window loses locally-only banked state. Turning it into a firing alert needs a per-node embervm_store_reachable gauge this cluster does not export. Investigate via the CP node projection and the noded store-probe logs in SigNoz."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "min",
                    "spaceAggregation": "min",
                    "metricName": "embervm_store_reachable"
                  }
                ],
                "filter": {
                  "expression": ""
                },
                "groupBy": [
                  {
                    "name": "node_id",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "2",
        "target": 1,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 1,
              "targetUnit": "",
              "matchType": "1",
              "op": "2",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
