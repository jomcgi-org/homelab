apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-group-fresh-boot-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Group Fresh-Boot Fallbacks"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Composite-group fresh-boot fallback alert (R5, Task 9, D-R5.PR-6.1). A composite
# wake RELIGHTS the whole banked set; ANY member failure aborts the relight, evicts
# the set, and falls back to a full FRESH boot in the same call, recorded as
# group_fresh_booted{reason}. The two reasons this alert exists to page on:
#
#   * clock_resync_failed: a member's RELIGHT came up but the daemon could not verify
#     the clock resync within its one-second bound (decision 7, was_relight=false on a
#     relight member). A REPEATED clock_resync_failed for a workload means the set
#     keeps failing to relight cleanly (a slow/drifting host clock, a snapshot too
#     stale to resume), discarding warmth on every wake.
#   * partial_set: a banked member was missing its bundle at wake time (a set that
#     never banked whole, or an eviction race), so the set can never relight and the
#     group fresh-boots. A repeated partial_set means the bank half is producing
#     incomplete sets.
#
# Both discard the group's warmth and pay a full cold create on the next wake, so a
# repeated occurrence for one workload is a real relight-health regression worth
# paging on (the expected occurrence is rare/one-off).
#
# THIS IS A PLACEHOLDER (threshold-0 dry-run), NOT a live alert: there is NO
# op-log-to-metrics bridge in this cluster (the
# same honest posture as embervm-stateful-generation-mismatch), so
# "count of group_fresh_booted{reason=clock_resync_failed|partial_set} in the last N
# minutes" is not an alertable metric series today. Turning it into one needs either a
# control-plane metrics exporter (the group_fresh_booted op count as a counter) or an
# op-log-to-metrics bridge, neither of which exists yet.
#
# DELIBERATELY NOT span-derived: the reasons ARE carried on the
# `embervm.group.fresh_boot` span (ember.reason) and derivable per-member from the
# `embervm.group.member_relight` span's ember.was_relight=false, so the failures are
# fully INVESTIGABLE in the SigNoz trace view today. But turning a trace attribute
# into a firing alert needs a spanmetrics-processor bridge (a metric series derived
# from spans) that this cluster does not run, and this task ships alerts on the
# METRIC_BASED_ALERT seam, not a trace-based alert type. Inventing a fake-but-passing
# metric query would silently never fire (indistinguishable from a healthy system),
# exactly the failure mode the dry-run discipline exists to prevent. So this stays a
# placeholder keyed on a not-yet-exported metric, with the span attributes as the
# real investigation surface until the bridge lands.
#
# Until the metrics pipeline lands, investigate via the embervm.group.fresh_boot spans
# (ember.reason) + embervm.group.member_relight spans (ember.was_relight) in SigNoz,
# and the group_fresh_booted op-log rows.
data:
  alert.json: |
    {
      "alert": "EmberVM Group Fresh-Boot Fallbacks",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "30m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "composite",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM composite group {{ "{{" }} $labels.workload {{ "}}" }} keeps discarding warmth (fresh-boot fallback, reason {{ "{{" }} $labels.reason {{ "}}" }})",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for group_fresh_booted{reason=clock_resync_failed|partial_set} op counts; this alert cannot fire as written (no op-log-to-metrics bridge, D-R4.PR-10.1). The reasons are on the embervm.group.fresh_boot span (ember.reason) and derivable per-member from embervm.group.member_relight (ember.was_relight=false), so the failures are investigable in the SigNoz trace view; turning them into a firing alert needs a spanmetrics bridge this cluster does not run. See D-R5.PR-6.1. A repeated fresh-boot fallback for one workload means the set keeps failing to relight (clock_resync_failed) or the bank keeps producing incomplete sets (partial_set), discarding warmth and paying a full cold create every wake."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "embervm_group_fresh_booted_total"
                  }
                ],
                "filter": {
                  "expression": "reason IN ('clock_resync_failed', 'partial_set')"
                },
                "groupBy": [
                  {
                    "name": "workload",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  },
                  {
                    "name": "reason",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
