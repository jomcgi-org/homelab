apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-snapshot-disk-usage-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Session Snapshot Disk Usage"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Watermark alert for the EmberVM snapshot disk (R2 Task 9; ADR embervm/002 rule 4:
# disk cost is watched by a watermark, never discovered). Session banks write a full
# ~memMib snapshot per session to the noded NVMe scratch under
# <nvmeRoot>/embervm-noded/snapshots; the whole scratch is bounded by
# maxSessions x memMib. R3 SERVING banks write their per-instance serving snapshots
# to the SAME noded NVMe scratch (same mountpoint), so this one watermark now bounds
# BOTH session and serving banks (shared scratch): the serving side does not get a
# second disk alert, it shares this one (R3 Task 10 Fork 3). noded exports no Prometheus/OTel metric, and the scratch is a
# hostPath (not a PVC, so the op-log PVC alert's kubeletstats k8s.volume metric does
# not see it). Instead this reuses the k8s-infra hostmetrics receiver's already-scraped
# system.filesystem.usage gauge (state=used/free/reserved, per node + mountpoint),
# filtered to node-4's /disks/nvme-02 scratch, and computes percent-used via a v5
# formula: percent_used = used / total * 100 (A = usage{state=used}, B = usage over all
# states = total capacity, C = A/B*100). Mirrors the op-log PVC alert's shape; fires at
# 80% weeks before the scratch exhausts and wedges banking.
data:
  alert.json: |
    {
      "alert": "EmberVM Session Snapshot Disk Usage",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": false,
      "evalWindow": "15m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "storage",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM session snapshot disk usage exceeded 80% on node {{ "{{" }} $labels.k8s_node_name {{ "}}" }}",
        "description": "The EmberVM noded NVMe scratch (/disks/nvme-02, holding session AND serving snapshot bundles under embervm-noded/snapshots) has exceeded 80% usage. Both session banks and R3 serving-instance banks write a full ~memMib snapshot each to this shared scratch, so the footprint is bounded by (maxSessions + serving live+banked instances) x memMib. Levers, all values-configurable in the embervm chart: lower session.maxSessions / serving.maxInstances (fewer concurrent live+banked snapshots), lower session.bankedTtlSeconds / serving.bankedTtlSeconds (GC idle banked snapshots sooner), or set the snapshot-disk low watermark (EMBERVM_SESSION_DISK_LOW_WATERMARK_BYTES) to arm LRU disk-pressure eviction. See ADR embervm/002."
      },
      "condition": {
        "compositeQuery": {
          "queryType": "builder",
          "panelType": "graph",
          "unit": "percent",
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "disabled": true,
                "aggregations": [
                  {
                    "timeAggregation": "avg",
                    "spaceAggregation": "sum",
                    "metricName": "system.filesystem.usage"
                  }
                ],
                "filter": {
                  "expression": "k8s.node.name = 'node-4' AND mountpoint = '/disks/nvme-02' AND state = 'used'"
                },
                "groupBy": [
                  {
                    "name": "k8s.node.name",
                    "fieldDataType": "string",
                    "fieldContext": "resource"
                  }
                ],
                "order": [],
                "disabled": true
              }
            },
            {
              "type": "builder_query",
              "spec": {
                "name": "B",
                "signal": "metrics",
                "stepInterval": 60,
                "disabled": true,
                "aggregations": [
                  {
                    "timeAggregation": "avg",
                    "spaceAggregation": "sum",
                    "metricName": "system.filesystem.usage"
                  }
                ],
                "filter": {
                  "expression": "k8s.node.name = 'node-4' AND mountpoint = '/disks/nvme-02'"
                },
                "groupBy": [
                  {
                    "name": "k8s.node.name",
                    "fieldDataType": "string",
                    "fieldContext": "resource"
                  }
                ],
                "order": [],
                "disabled": true
              }
            },
            {
              "type": "builder_formula",
              "spec": {
                "name": "C",
                "expression": "A / B * 100",
                "legend": "percent used"
              }
            }
          ]
        },
        "selectedQueryName": "C",
        "op": "1",
        "target": 80,
        "matchType": "3",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 80,
              "targetUnit": "",
              "matchType": "3",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
