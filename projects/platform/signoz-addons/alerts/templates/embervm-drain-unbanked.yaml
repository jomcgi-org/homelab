apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-drain-unbanked-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Drain Left Workloads Unbanked"
    signoz.io/severity: "critical"
    signoz.io/notification-channels: "incidentio"
# Drain-unbanked alert (R6, Task 11). The DrainCoordinator force-banks every live
# class on a draining node inside the bounded-preemption window (decision 4) and
# records a `node_drain_finished` op carrying per-class banked counts
# (stateful/group/session/serving). The R6 data-loss invariant is that a routine
# roll banks everything bankable before the deadline; a drain that finishes with a
# per-class banked count LOWER than the count live at `node_drain_started` means a
# workload was NOT evacuated and will cold-boot (or, for a class with no prior
# durable copy, lose state). That is the one page-worthy drain outcome, and it maps
# to the `embervm.node_drain` span's per-class attributes (ember.stateful_banked,
# ember.group_banked, ember.session_banked, ember.serving_banked).
#
# THIS IS A PLACEHOLDER (disabled, threshold-0 dry-run), NOT a live alert, per the
# D-R3.10.1 + D-R4.PR-10.1 discipline: there is NO op-log-to-metrics and NO
# spanmetrics-processor bridge in this cluster, so "node_drain_finished banked count
# short of the started count" is not an alertable metric series today. The started
# vs finished counts ARE on the op-log (node_drain_started / node_drain_finished)
# and on the embervm.node_drain span attributes, so an under-banked drain is fully
# investigable in the SigNoz trace view; turning it into a firing alert needs a
# control-plane metrics exporter (a `embervm_drain_unbanked_total` counter emitted
# when finished < started for any class) or an op-log-to-metrics bridge, neither of
# which exists yet. FLAGGED FOR JOE (R6 closure): promote off dry-run once the
# exporter lands. The query below is keyed on that not-yet-exported counter so it
# cannot fire silently against a fake-but-passing series.
#
# Until the metrics pipeline lands, investigate via the embervm.node_drain spans
# (ember.*_banked) and the node_drain_started / node_drain_finished op-log rows.
data:
  alert.json: |
    {
      "alert": "EmberVM Drain Left Workloads Unbanked",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "30m0s",
      "frequency": "5m0s",
      "severity": "critical",
      "labels": {
        "category": "continuity",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM node {{ "{{" }} $labels.node_id {{ "}}" }} drained with workloads left unbanked (possible data loss on roll)",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for embervm_drain_unbanked_total (a node_drain_finished banked count short of node_drain_started); this alert cannot fire as written (no op-log-to-metrics or spanmetrics bridge, D-R4.PR-10.1). The per-class banked counts are on the embervm.node_drain span (ember.stateful_banked / ember.group_banked / ember.session_banked / ember.serving_banked) and on the node_drain_started / node_drain_finished op-log rows, so an under-banked drain is investigable in the SigNoz trace view. Turning it into a firing alert needs a control-plane exporter this cluster does not run. An occurrence means a routine roll did NOT evacuate every live workload within the preemption window: the R6 continuity data-loss invariant was violated for that class."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "embervm_drain_unbanked_total"
                  }
                ],
                "filter": {
                  "expression": ""
                },
                "groupBy": [
                  {
                    "name": "node_id",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  },
                  {
                    "name": "class",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "critical",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
