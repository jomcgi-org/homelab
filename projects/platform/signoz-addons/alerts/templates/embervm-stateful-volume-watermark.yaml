apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-stateful-volume-watermark-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Stateful Volume Watermark"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Stateful volume-watermark alert (R4, Task 10, D-R4.PR-10.1). Each stateful
# workload's volume file is capped at its declared `volumeSizeGiB`; a volume
# approaching that cap from inside the guest (e.g. Postgres filling its own disk)
# is a disk-full-inside-the-guest failure mode this alert is meant to catch EARLY,
# before the guest itself starts failing writes. This PR's status.stateful write
# (Embervm.StatefulSweeper.write_stateful_status/1) puts `volumeBytes` (the
# node-reported allocated bytes) on every stateful workload's CR status every
# sweep tick.
#
# THIS IS A PLACEHOLDER (threshold-0 dry-run), NOT a live alert, per the D-R3.10.1
# discipline: `status.stateful.volumeBytes` is a Kubernetes CRD status field, not a
# Prometheus metric series. SigNoz METRIC_BASED_ALERT queries read metrics (or
# logs/traces), not arbitrary CR status; there is no kube-state-metrics-style CRD
# status exporter in this cluster today, and the control plane itself does not
# export a volume-bytes metric (Embervm's control plane is spans-only, per D-R3.10.1's
# standing decision). Wiring this for real needs EITHER a control-plane metrics
# exporter for the volume ledger (Embervm.StatefulStore.get_volume/2's
# allocated_bytes + the workload's declared cap, turned into a gauge) OR a generic
# CRD-status-to-metrics bridge. Neither exists yet.
#
# Until the metrics pipeline lands, check watermark manually via `kubectl get
# workload <name> -o jsonpath='{.status.stateful.volumeBytes}'` against the
# workload's spec.stateful.volumeSizeGiB, or via the STATEFUL printer column.
data:
  alert.json: |
    {
      "alert": "EmberVM Stateful Volume Watermark",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "15m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "stateful",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM stateful workload {{ "{{" }} $labels.workload {{ "}}" }} volume is approaching its declared size cap",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for the stateful volume's allocated bytes vs its declared cap; this alert cannot fire as written. status.stateful.volumeBytes (this PR) carries the fact on the workload's CR status today, but SigNoz metric alerts do not read CRD status directly. See D-R4.PR-10.1. Check manually via `kubectl get workload <name> -o jsonpath={.status.stateful.volumeBytes}` against spec.stateful.volumeSizeGiB in the meantime."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "avg",
                    "spaceAggregation": "avg",
                    "metricName": "embervm_stateful_volume_bytes_ratio"
                  }
                ],
                "filter": {
                  "expression": ""
                },
                "groupBy": [
                  {
                    "name": "workload",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
