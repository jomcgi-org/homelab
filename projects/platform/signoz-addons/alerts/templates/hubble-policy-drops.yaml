apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-policy-drops-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "Hubble CiliumNetworkPolicy Drops"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
data:
  alert.json: |
    {
      "alert": "Hubble CiliumNetworkPolicy Drops",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": false,
      "evalWindow": "5m0s",
      "frequency": "1m0s",
      "severity": "warning",
      "labels": {
        "category": "network",
        "environment": "production"
      },
      "annotations": {
        "summary": "Cilium is dropping traffic due to a NetworkPolicy denial",
        "description": "hubble_drop_total{reason=\"POLICY_DENIED\"} increased in the last 5 minutes, meaning a CiliumNetworkPolicy is denying traffic somewhere in the cluster (protocol {{ "{{" }} $labels.protocol {{ "}}" }}). Node-wide catch-all: it cannot tell you WHAT was denied, so treat it as a pointer. For the monolith specifically the scoped critical alert (hubble-monolith-policy-drops-alert) watches policy-denied ingress drops to that namespace; investigate either with `hubble observe --verdict DROPPED` while the window is still live (the ring buffer is only minutes deep)."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "hubble_drop_total"
                  }
                ],
                "filter": {
                  "expression": "reason = 'POLICY_DENIED'"
                },
                "groupBy": [
                  {
                    "name": "protocol",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  },
                  {
                    "name": "reason",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
