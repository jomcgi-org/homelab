apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-stateful-wake-failures-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Stateful Wake Failures"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Stateful wake-failure alert (R4, Task 10, D-R4.PR-10.1). Stateful is opaque L4
# TCP (decision 4): unlike serving's HTTP activator, a failed TcpActivator wake has
# no response status to return through the node Envoy. A wake failure (wake-rate,
# park-full, wake_failed, unknown-workload) simply closes the accepted client
# socket with a normal FIN, indistinguishable at the Envoy layer from a client that
# finished cleanly and disconnected. So, unlike serving's activator-errors alert
# (which counts a real 5xx signal, envoy_cluster_upstream_rq_xx), there is no Envoy
# counter that reliably proxies for "a stateful wake failed."
#
# THIS IS A PLACEHOLDER (threshold-0 dry-run), NOT a live alert, per the D-R3.10.1
# discipline: the query below is written against the closest structurally-related
# signal available today (a `state-<port>` tcp_proxy listener's cumulative
# connection count staying flat, envoy_tcp_downstream_cx_total delta == 0, while the
# workload is presumably being retried), but that signal is an APPROXIMATION, not a
# direct wake-failure count, and a healthy idle workload looks IDENTICAL to a
# workload whose wakes keep failing (both show zero new connections). Firing this
# for real needs either a control-plane metrics exporter (turning the
# embervm.stateful.wake span's failure outcome into a counter) or a
# spanmetrics-processor bridge from the SigNoz trace pipeline, neither of which
# exists yet.
#
# The wake failure IS observable TODAY via the embervm.stateful.wake span
# (ember.wake_ms, ember.workload) and the "embervm stateful wake failed" /
# "embervm stateful relight failed" Logger.warning lines; use those for
# investigation until a real metric series lands.
#
# STAT NAME: written against the standard Envoy Prometheus tcp_proxy exposition
# (envoy_tcp_downstream_cx_total, per envoy_tcp_prefix = the listener's stat_prefix,
# state-<listenPort>). CONFIRM the exact scraped metric + label names via a live
# /stats/prometheus scrape in post-merge verification before trusting any part of
# this query (the OTel Prometheus receiver may normalize the name; tcp_proxy stats
# use a different metric family than the HTTP connection-manager stats the serving
# alerts read). disabled: true until promoted off dry-run.
data:
  alert.json: |
    {
      "alert": "EmberVM Stateful Wake Failures",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "10m0s",
      "frequency": "1m0s",
      "severity": "warning",
      "labels": {
        "category": "stateful",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM stateful listener {{ "{{" }} $labels.envoy_tcp_prefix {{ "}}" }} shows no new connections (possible wake-failure loop)",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): a `state-` tcp_proxy listener has recorded zero new connections (envoy_tcp_downstream_cx_total delta) over 10 minutes. This is an APPROXIMATION for a stateful wake-failure loop, not a direct count: a genuinely idle-but-healthy workload looks identical. Do not enable without either a control-plane wake-failure metric exporter or a better-scoped Envoy signal. See D-R4.PR-10.1. Investigate via the embervm.stateful.wake spans in SigNoz and `kubectl logs -n embervm deploy/embervm`."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "envoy_tcp_downstream_cx_total"
                  }
                ],
                "filter": {
                  "expression": "envoy_tcp_prefix =~ '^state-'"
                },
                "groupBy": [
                  {
                    "name": "envoy_tcp_prefix",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
