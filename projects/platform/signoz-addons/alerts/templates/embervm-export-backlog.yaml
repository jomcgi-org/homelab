apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-export-backlog-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Export Backlog"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Export-backlog alert (R6, Task 11). Off-node durability is async write-back
# (decision 7): after a bank commit, noded enqueues an export to the object store on
# a bounded queue and never blocks the bank path or the drain deadline on it. The
# failure mode this alert exists to page on is the queue falling behind so far that
# durable copies lag the local bank indefinitely: on a full queue, server/store.go
# logs `noded: export queue full; dropping enqueue (will retry on reconcile)` and
# drops the enqueue. A sustained stream of that log line means exports are not
# keeping up (a slow store, a 1GbE-bound large volume export), so a node loss before
# reconnect re-exports would cold-boot workloads whose local disk went with the pod.
#
# THIS IS A PLACEHOLDER (disabled, threshold-0 dry-run), NOT a live alert, per the
# D-R3.10.1 + D-R4.PR-10.1 discipline: there is NO log-to-metrics or exported queue-
# depth/backlog-age metric series in this cluster today, so "export queue full log
# rate" and "oldest un-exported artifact age" are not alertable metric series. The
# signal that actually exists in the code is the `export queue full` structured
# Warn log (and the `noded: async export failed (will retry on reconcile)` Warn),
# fully searchable in the SigNoz logs view. Turning it into a firing alert needs
# either a log-to-metrics pipeline or a noded-exported queue-depth gauge, neither of
# which exists yet. FLAGGED FOR JOE (R6 closure): promote off dry-run once a queue-
# depth or backlog-age metric lands. The query is keyed on that not-yet-exported
# gauge so it cannot fire silently against a fake-but-passing series.
#
# Until the metrics pipeline lands, investigate via the `noded: export queue full`
# and `noded: async export failed` Warn logs in the SigNoz logs view.
data:
  alert.json: |
    {
      "alert": "EmberVM Export Backlog",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "30m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "continuity",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM node {{ "{{" }} $labels.node_id {{ "}}" }} export queue is falling behind (durable copies lagging local bank)",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for export-queue depth or backlog age; this alert cannot fire as written (no log-to-metrics pipeline and no noded-exported queue gauge, D-R4.PR-10.1). The signal in code is the `noded: export queue full; dropping enqueue (will retry on reconcile)` Warn log (server/store.go) plus `noded: async export failed`, both searchable in the SigNoz logs view. A sustained stream means async write-back is not keeping up (slow store, large 1GbE-bound volume export), so a node loss before reconcile re-exports would cold-boot workloads whose local disk left with the pod. Turning it into a firing alert needs a log-to-metrics pipeline or a queue-depth gauge this cluster does not run."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "max",
                    "spaceAggregation": "max",
                    "metricName": "embervm_noded_export_backlog_age_seconds"
                  }
                ],
                "filter": {
                  "expression": ""
                },
                "groupBy": [
                  {
                    "name": "node_id",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
