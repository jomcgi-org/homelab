apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-stateful-generation-mismatch-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Stateful Generation Mismatch"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Stateful pairing-regression alert (R4, Task 10, D-R4.PR-10.1). A banked bundle's
# `snapshot_generation` should equal its volume's `generation` (the pair-validity
# check StatefulStore.pair_valid?/1 makes on every wake); a mismatch means the wake
# discarded warmth and cold-booted instead of relighting, recorded as
# `stateful_cold_booted{reason: "generation_mismatch"}` (gate 2: the op-log alone
# reconstructs the discarded-warmth event). A mismatch should be RARE: it means
# either the daemon bumped the volume's generation without going through a wake
# this control plane observed (an operator-triggered out-of-band write, a daemon
# restart that lost the ledger, or a bug), so a REPEATED mismatch for the same
# workload is an operator-caused pairing regression worth paging on.
#
# THIS IS A PLACEHOLDER (threshold-0 dry-run), NOT a live alert, per the D-R3.10.1
# discipline: there is no Prometheus metric series for stateful_cold_booted op
# counts today. The op-log is durable and fully queryable (SQLite, or via the
# management API), but turning "count of stateful_cold_booted ops with
# reason=generation_mismatch in the last N minutes" into an alertable metric needs
# either a control-plane metrics exporter or an op-log-to-metrics bridge, neither of
# which exists yet.
#
# Until the metrics pipeline lands, investigate a suspected pairing regression by
# querying the op-log directly (stateful_cold_booted rows with a generation_mismatch
# reason) or via status.stateful (this PR: generation vs bundleGeneration divergence
# on a workload's CR is visible with `kubectl get workload <name> -o
# jsonpath='{.status.stateful}'`, a mismatch there means the NEXT wake will discard
# the current bundle).
data:
  alert.json: |
    {
      "alert": "EmberVM Stateful Generation Mismatch",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "30m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "stateful",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM stateful workload {{ "{{" }} $labels.workload {{ "}}" }} has repeated generation-mismatch cold boots",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for stateful_cold_booted{reason=generation_mismatch} op counts; this alert cannot fire as written. The op-log is the authoritative source today. See D-R4.PR-10.1. A generation mismatch means a banked bundle's pair broke (snapshot_generation != volume.generation) and the next wake discarded warmth and cold-booted instead of relighting; repeated mismatches for one workload suggest an operator-caused or daemon-side pairing regression, not the expected occasional occurrence."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "embervm_stateful_cold_booted_total"
                  }
                ],
                "filter": {
                  "expression": "reason = 'generation_mismatch'"
                },
                "groupBy": [
                  {
                    "name": "workload",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
