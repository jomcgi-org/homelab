apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-park-full-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Park Full"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Park-full alert (R6, Task 11; signal added in Task 10 / PR-6). A parked-connection
# cap keeps a wedged wake from unbounded queue growth: when the park fills, the wake
# managers shed the newest waiter and emit a `Logger.warning(event: :park_full, ...)`
# carrying `workload`, `park_depth`, and `oldest_waiter_age_ms` (group_wake_manager
# and stateful_manager both log it, "embervm group park_full" / "embervm stateful
# park_full"). A park filling up means the in-flight wake for that workload is not
# resolving fast enough to drain waiters, so a firing park_full is the leading
# indicator of a wedged-wake / stuck-boot regression (the R5 amplifier Task 10
# bounded). One-off park_full under a burst is expected; a REPEATED one for a
# workload is worth paging on.
#
# THIS IS A PLACEHOLDER (disabled, threshold-0 dry-run), NOT a live alert, per the
# D-R3.10.1 + D-R4.PR-10.1 discipline: there is NO log-to-metrics bridge in this
# cluster, so "count of park_full log events" is not an alertable metric series
# today. The event IS fully searchable in the SigNoz logs view (event=park_full,
# with workload / park_depth / oldest_waiter_age_ms). Turning it into a firing alert
# needs either a control-plane exporter (a `embervm_park_full_total` counter) or a
# log-to-metrics pipeline, neither of which exists yet. FLAGGED FOR JOE (R6 closure):
# promote off dry-run once the exporter lands. The query is keyed on that not-yet-
# exported counter so it cannot fire silently against a fake-but-passing series.
#
# Until the metrics pipeline lands, investigate via the park_full Warn logs
# (event=park_full, oldest_waiter_age_ms) in the SigNoz logs view.
data:
  alert.json: |
    {
      "alert": "EmberVM Park Full",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "30m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "continuity",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM workload {{ "{{" }} $labels.workload {{ "}}" }} park is full (wedged-wake indicator)",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for park_full event counts; this alert cannot fire as written (no log-to-metrics bridge, D-R4.PR-10.1). The event is the Logger.warning(event: :park_full) emitted by group_wake_manager and stateful_manager, carrying workload / park_depth / oldest_waiter_age_ms, fully searchable in the SigNoz logs view. A repeated park_full for one workload means its in-flight wake is not draining waiters (a wedged or stuck boot), the R5 amplifier Task 10 bounded. Turning it into a firing alert needs a control-plane exporter (embervm_park_full_total) or a log-to-metrics pipeline this cluster does not run."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "embervm_park_full_total"
                  }
                ],
                "filter": {
                  "expression": ""
                },
                "groupBy": [
                  {
                    "name": "workload",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
