apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-group-wake-failures-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Group Wake Failures"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Sustained composite-group wake-failure alert (R5, Task 9, D-R5.PR-6.1). A composite
# group is opaque L4 TCP (decision 5), exactly like stateful: unlike serving's HTTP
# activator, a failed GroupWakeManager wake has no response status to return through
# the node Envoy. A wake failure (wake-rate, park-full, wake_failed, unknown-workload)
# simply closes the accepted client socket with a normal FIN, indistinguishable at the
# Envoy layer from a client that finished cleanly. So, unlike serving's
# activator-errors alert (which counts a real 5xx signal), there is no Envoy counter
# that reliably proxies for "a composite group wake failed." This is the group
# generalization of embervm-stateful-wake-failures.
#
# THIS IS A PLACEHOLDER (threshold-0 dry-run), NOT a live alert. The query below
# is written against the closest structurally-related
# signal that DOES flow to SigNoz today (the `group-<listenPort>` tcp_proxy listener's
# cumulative connection count staying flat, envoy_tcp_downstream_cx_total delta == 0,
# while the workload is presumably being retried), but that signal is an
# APPROXIMATION, not a direct wake-failure count, and a healthy idle group looks
# IDENTICAL to a group whose wakes keep failing (both show zero new connections).
# Firing this for real needs either a control-plane metrics exporter (turning the
# GroupWakeManager wake failure outcome into a counter) or a spanmetrics-processor
# bridge from the SigNoz trace pipeline, neither of which exists yet.
#
# The wake failure IS observable TODAY via the embervm.group.{create,relight,
# fresh_boot} spans (ember.workload, ember.reason, per-member ember.was_relight) and
# the "embervm group wake failed" Logger.warning lines; use those for investigation
# until a real metric series lands.
#
# STAT NAME: written against the standard Envoy Prometheus tcp_proxy exposition
# (envoy_tcp_downstream_cx_total, per envoy_tcp_prefix = the listener's stat_prefix,
# group-<listenPort>). The composite entry listener stats reach SigNoz on the SAME
# serving-envoy DaemonSet /stats/prometheus scrape as the R4 state-<port> stats (they
# share the tcp.* namespace and the DaemonSet's prometheus.io annotation globs all of
# it), so this needs NO scrape addition. CONFIRM the exact scraped metric + label
# names via a live /stats/prometheus scrape in post-merge verification before
# trusting any part of this query (the OTel Prometheus receiver may normalize the
# name). disabled: true until promoted off dry-run.
data:
  alert.json: |
    {
      "alert": "EmberVM Group Wake Failures",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "10m0s",
      "frequency": "1m0s",
      "severity": "warning",
      "labels": {
        "category": "composite",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM composite entry listener {{ "{{" }} $labels.envoy_tcp_prefix {{ "}}" }} shows no new connections (possible wake-failure loop)",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): a `group-` tcp_proxy listener has recorded zero new connections (envoy_tcp_downstream_cx_total delta) over 10 minutes. This is an APPROXIMATION for a composite wake-failure loop, not a direct count: a genuinely idle-but-healthy group looks identical. Do not enable without either a control-plane wake-failure metric exporter or a better-scoped Envoy signal. See D-R5.PR-6.1. Investigate via the embervm.group.{create,relight,fresh_boot} spans in SigNoz and `kubectl logs -n embervm deploy/embervm`."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "envoy_tcp_downstream_cx_total"
                  }
                ],
                "filter": {
                  "expression": "envoy_tcp_prefix =~ '^group-'"
                },
                "groupBy": [
                  {
                    "name": "envoy_tcp_prefix",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
