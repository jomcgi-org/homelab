apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-group-bank-watermark-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Group Bank Snapshot-Disk Watermark"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Composite-group bank snapshot-disk watermark alert (R5, Task 9, D-R5.PR-6.1). A
# composite group banks the WHOLE set as one warmth unit: a 3-member group's banked
# set is roughly the SUM of its member memory sizes (each StopGroupMember(BANK)
# snapshots that member's full memory), so the on-disk bank cost is a set-size
# MULTIPLE of the single-VM stateful bundle the R4 watermark tracks. The R2/R4
# snapshot-disk threshold was calibrated for a single stateful bundle; a composite
# group multiplies that by the member count, so a node hosting several composite
# groups can approach its snapshot-disk floor far faster than the single-VM math
# implied. This alert generalizes embervm-stateful-volume-watermark with that
# set-size multiplier: the watermark is the group's banked-set bytes (~sum of member
# mem sizes) against the node snapshot-disk budget.
#
# THIS IS A PLACEHOLDER (threshold-0 dry-run), NOT a live alert, per the D-R3.10.1
# discipline: the composite bank-set size lives on the workload's CR status
# (status.group, this PR) and in the op-log's group_banked op, NOT in a Prometheus
# metric series. SigNoz METRIC_BASED_ALERT queries read metrics (or logs/traces),
# not arbitrary CR status; there is no kube-state-metrics-style CRD status exporter
# in this cluster today, and EmberVM's control plane is spans-only (D-R3.10.1). The
# NODE snapshot-disk floor IS already watched by the existing R2 snapshot-disk
# hostmetrics alert (embervm-snapshot-disk-usage), which is filesystem-level and
# therefore ALREADY accounts for composite bank sets landing on the same disk (a
# group's member bundles are ordinary snapshot files under the same snapshot root);
# that alert is the live safety net today. This per-workload set-size watermark
# needs EITHER a control-plane metrics exporter for the banked-set bytes (the
# group_banked op's summed member snapshot bytes, turned into a gauge) OR a generic
# CRD-status-to-metrics bridge. Neither exists yet.
#
# Until the metrics pipeline lands, the live node-level floor is
# embervm-snapshot-disk-usage (filesystem watermark, composite-aware by
# construction); check a specific group's set size via `kubectl get workload <name>
# -o jsonpath='{.status.group}'` (state + member counts) and the group_banked op-log
# row for the summed snapshot bytes.
data:
  alert.json: |
    {
      "alert": "EmberVM Group Bank Snapshot-Disk Watermark",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": true,
      "evalWindow": "15m0s",
      "frequency": "5m0s",
      "severity": "warning",
      "labels": {
        "category": "composite",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM composite group {{ "{{" }} $labels.workload {{ "}}" }} banked-set disk footprint is approaching the node snapshot-disk budget",
        "description": "PLACEHOLDER ALERT (disabled, threshold-0 dry-run): no metric series exists yet for a composite group's banked-set bytes (~sum of member memory sizes) vs the node snapshot-disk budget; this alert cannot fire as written. status.group (this PR) and the group_banked op-log row carry the fact today, but SigNoz metric alerts do not read CRD status or the op-log directly. The LIVE node-level safety net is embervm-snapshot-disk-usage (a filesystem watermark that already sees composite bank sets on the same disk). See D-R5.PR-6.1. A composite bank is a set-size MULTIPLE of a single stateful bundle (a 3-member group banks ~3x one VM's memory), so revisit the snapshot-disk headroom with that multiplier when sizing composite nodes."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 300,
                "aggregations": [
                  {
                    "timeAggregation": "avg",
                    "spaceAggregation": "avg",
                    "metricName": "embervm_group_bank_set_bytes_ratio"
                  }
                ],
                "filter": {
                  "expression": ""
                },
                "groupBy": [
                  {
                    "name": "workload",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 0,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 0,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
