apiVersion: v1
kind: ConfigMap
metadata:
  name: embervm-serving-publication-failure-alert
  labels:
    signoz.io/alert: "true"
  annotations:
    signoz.io/alert-name: "EmberVM Serving Publication Failure"
    signoz.io/severity: "warning"
    signoz.io/notification-channels: "incidentio"
# Publication-failure alert for R3 serving (Task 10, D-R3.10.1). The EndpointPublisher
# PUTs each xDS snapshot to the per-node sidecar, which serves it as CDS/RDS/EDS to
# the node Envoy. When the pushed config is MALFORMED, the node Envoy REJECTS the
# xDS update and stays on its last-ACKed config, incrementing its control-plane
# update-rejected counter. A sustained nonzero rejection count means fresh serving
# endpoints are not reaching Envoy (a bad snapshot the sidecar keeps re-serving), so
# wakes never become routable. Mirrors the metric-series shape of hubble-invoke-http.
#
# COVERAGE (IMPORTANT, D-R3.10.1): this alert catches ONLY the "sidecar pushed a
# config Envoy rejected" mode (malformed snapshot). It does NOT catch the
# "publisher cannot REACH the sidecar" mode: there the sidecar just serves its stale
# config, Envoy accepts it (no rejection), so nothing shows in Envoy stats. That
# second mode is observable via the EndpointPublisher's loud PUT-failure log
# ("embervm endpoint publisher: PUT to node ... failed") and the
# embervm.serving.publish_flush span (ember.ack_ok = false) in SigNoz traces. A
# UNIFIED metric-based publication-failure alert covering both modes is a recorded
# follow-on (it needs a control-plane metrics pipeline or a spanmetrics processor so
# ember.ack_ok becomes a metric series).
#
# STAT NAME: written against the standard Envoy Prometheus exposition
# (envoy_cluster_update_rejected, per envoy_cluster_name). CONFIRM the exact scraped
# metric + label names via a live /stats/prometheus scrape in the post-merge
# verification before trusting this fires (the OTel Prometheus receiver may normalize
# the name; some Envoy builds also expose envoy_control_plane_* update-failure
# counters). Same discipline hubble-invoke-http carries.
data:
  alert.json: |
    {
      "alert": "EmberVM Serving Publication Failure",
      "alertType": "METRIC_BASED_ALERT",
      "ruleType": "threshold_rule",
      "version": "v5",
      "broadcastToAll": false,
      "disabled": false,
      "evalWindow": "10m0s",
      "frequency": "1m0s",
      "severity": "warning",
      "labels": {
        "category": "serving",
        "environment": "production",
        "service": "embervm"
      },
      "annotations": {
        "summary": "EmberVM node Envoy is rejecting serving xDS updates on cluster {{ "{{" }} $labels.envoy_cluster_name {{ "}}" }}",
        "description": "The node Envoy has rejected more than one serving xDS update (envoy_cluster_update_rejected) in the last 10 minutes: the EndpointPublisher pushed a config the sidecar served but Envoy would not accept, so fresh serving endpoints are NOT reaching the data plane and Envoy stays on its last-ACKed config. This is a malformed-snapshot fault in the publisher/sidecar render. NOTE: this alert catches only Envoy-rejected pushes; a publisher-CANNOT-REACH-sidecar fault is invisible here (Envoy accepts the stale config) and instead surfaces as the EndpointPublisher PUT-failure log and the embervm.serving.publish_flush span (ember.ack_ok=false) in SigNoz. Investigate with `kubectl logs -n embervm` (control plane + sidecar) and the publish_flush spans. See D-R3.10.1."
      },
      "condition": {
        "compositeQuery": {
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "metrics",
                "stepInterval": 60,
                "aggregations": [
                  {
                    "timeAggregation": "increase",
                    "spaceAggregation": "sum",
                    "metricName": "envoy_cluster_update_rejected"
                  }
                ],
                "filter": {
                  "expression": "envoy_cluster_name =~ '^serve\\|'"
                },
                "groupBy": [
                  {
                    "name": "envoy_cluster_name",
                    "fieldDataType": "string",
                    "fieldContext": "tag"
                  }
                ],
                "order": [],
                "disabled": false
              }
            }
          ],
          "panelType": "graph",
          "queryType": "builder"
        },
        "selectedQueryName": "A",
        "op": "1",
        "target": 1,
        "matchType": "1",
        "targetUnit": "",
        "thresholds": {
          "kind": "basic",
          "spec": [
            {
              "name": "warning",
              "target": 1,
              "targetUnit": "",
              "matchType": "1",
              "op": "1",
              "channels": ["incidentio"]
            }
          ]
        }
      },
      "preferredChannels": ["incidentio"]
    }
