apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    path: projects/platform/keda
    targetRevision: HEAD
    helm:
      releaseName: keda
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ScaledJob CRD renders to ~647 KiB; client-side apply blows the 256 KiB
      # last-applied-configuration annotation cap and that one CRD silently fails
      # to install, crash-looping keda-operator. Server-side apply skips the annotation.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
