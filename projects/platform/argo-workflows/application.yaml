apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi/homelab.git
    path: projects/platform/argo-workflows
    targetRevision: HEAD
    helm:
      releaseName: argo-workflows
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-workflows
  syncPolicy:
    # Stamp the mesh opt-out onto the namespace at creation. This cluster meshes
    # every namespace by default (Kyverno inject-linkerd-namespace-annotation),
    # but that policy excludes namespaces carrying a linkerd.io/inject label. A
    # meshed Workflow pod would never terminate (its linkerd-proxy never exits),
    # so the whole namespace (controller, server, and Workflow pods) runs
    # unmeshed via this opt-out.
    managedNamespaceMetadata:
      labels:
        linkerd.io/inject: disabled
      annotations:
        linkerd.io/inject: disabled
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The workflows CRD renders well past the 256 KiB last-applied-configuration
      # annotation cap; client-side apply would silently fail to install it (same
      # failure mode as keda's ScaledJob CRD). Server-side apply skips the annotation.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
