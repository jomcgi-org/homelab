apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    path: projects/platform/argo-workflows
    targetRevision: HEAD
    helm:
      releaseName: argo-workflows
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The workflows CRD renders well past the 256 KiB last-applied-configuration
      # annotation cap; client-side apply would silently fail to install it (same
      # failure mode as keda's ScaledJob CRD). Server-side apply skips the annotation.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
