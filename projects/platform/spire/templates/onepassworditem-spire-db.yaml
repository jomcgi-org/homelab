# The item must expose a field that lands as Secret key `password`. The same
# item seeds the out-of-band kubernetes.io/basic-auth Secret CNPG needs; see
# projects/monolith/deploy/spire-db-secret.md. The password must contain only
# URL-safe alphanumeric characters.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: spire-db
  namespace: {{ .Release.Namespace }}
spec:
  itemPath: {{ .Values.onepassword.spireDb.itemPath | quote }}
