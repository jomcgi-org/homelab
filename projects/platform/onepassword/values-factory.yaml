# The factory cluster's Connect sizes, from its 14-16 Nov working-set peaks:
# connect-api 33Mi, connect-sync 23Mi and the operator 24Mi, against the
# hub-sized 256Mi, 128Mi and 128Mi in values.yaml. Request still equals
# limit, at about three times each peak.
connect:
  connect:
    # Each container's tag, pinned by digest (HOME-287). The vendored chart
    # patch (connect.patch) gives api and sync their own version.
    api:
      version: "1.8.1@sha256:8fe7bcd50c9e73899e0a1aa5aa43421ca75fbceacb33dd07f6418c4116e637a1"
      resources:
        requests:
          memory: 96Mi
        limits:
          memory: 96Mi
    sync:
      version: "1.8.1@sha256:d5e937b2b7e314dbbaffacf469dc8f30376b5954a3ad836c8d96e6cb579d7fab"
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 64Mi
  operator:
    # The operator's chart tag, pinned by digest (HOME-287). The chart
    # renders imageRepository:version, so the digest rides on the version.
    version: "1.9.1@sha256:d644aa2bcb9a6b12e986d377f5780f7b9d6519486aa7e38e79d12c30c219d1d4"
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 64Mi
