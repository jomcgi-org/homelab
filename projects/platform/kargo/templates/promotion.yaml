{{- if .Values.promotion.enabled }}
{{- /*
Kargo owns a chart's version across its environments, and NOTHING else.

ONE TEMPLATE, N PIPELINES. This was `monolith-promotion.yaml` and rendered one
hardcoded pipeline. embervm needed the same shape (#4856), and the alternative
was a second near-identical 260-line file: two lists that must agree, kept in
sync by hand, where disagreement is silent. That is the defect class #4802
records, and these comments are incident history that would drift the moment
they were duplicated. So the pipeline is data and this is the only copy.

WHY THIS EXISTS. projects/monolith/dev/deploy/application.yaml pinned an OCI
chart version that nothing moved. bazel/helm/write-back-versions.sh resolves
exactly one deploy/application.yaml per chart, and that is production's, so dev
was invisible to it. That stale pin failed twice in one night (#4728): once
leaving a safety gate inert because the pinned chart had no `if` to read the
value the overlay set, and once withholding a feature because the template
lived in a newer chart. embervm-dev reached six chart versions behind
production the same way.

THE PROJECT NAME IS NEVER THE WORKLOAD'S NAME. A Kargo Project owns a NAMESPACE
of the same name, and `monolith`, `monolith-dev`, `embervm` and `embervm-dev`
all already exist holding live workloads. Adopting one would be the same class
of collision that cost this repo three incidents in one evening: a name that
looks descriptive and is already someone's identity. Hence `kargo-<workload>`.
*/}}
{{- range $pipelineIndex, $pipeline := .Values.promotion.pipelines }}
{{- if $pipelineIndex }}
---
{{- end }}
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: {{ $pipeline.project }}
  annotations:
    # Wave 0: this Project CREATES the namespace the Warehouse and Stages live
    # in, so it must be admitted before they are applied. Without waves ArgoCD
    # applies them all in one pass and the rest fail with
    # `namespaces "kargo-monolith" not found`, which is what happened on the
    # first install.
    argocd.argoproj.io/sync-wave: "0"

---
{{- /*
AUTO-PROMOTION. Without this the Warehouse discovers Freight, each Stage
reports "Stage has no current Freight", and NOTHING promotes:
autoPromotionEnabled defaults to false, so a fresh install looks fully wired
and silently does nothing. That is exactly what the first install did.

It lives on ProjectConfig, not Project: in Kargo 1.9 the Project spec is empty
and promotionPolicies moved here.

stageSelector rather than the `stage` field, which the CRD marks deprecated.
The selector takes a name directly, so this needs no labels on the Stages.

The schema notes auto-promotion is "commonly set to true for Stages that
subscribe to Warehouses instead of other, upstream Stages", which is an
argument for gating prod rather than a prohibition.

WHETHER PROD AUTO-PROMOTES IS PER-STAGE DATA, not a property of this template.
Both pipelines are `true` today, and embervm's was briefly `false` on a scratch
argument that turned out to be wrong (a base rebuilds on a SIGNATURE change, not
on every chart version, and batching only defers a digest change rather than
avoiding it). The rationale lives beside each `autoPromotion` in values.yaml.
Read the value, not this comment, to know what a given environment does.

Flipping the value is both the hold lever and the manual promotion path.
*/}}
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: {{ $pipeline.project }}
  namespace: {{ $pipeline.project }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    {{- range $stage := $pipeline.stages }}
    - stageSelector:
        name: {{ $stage.name }}
      autoPromotionEnabled: {{ $stage.autoPromotion }}
    {{- end }}
---
{{- /*
Subscribes to the chart repository, not to images. Images are already pinned by
DIGEST into the chart at build time by helm_images_values, so the chart version
is the only thing that moves and the only thing worth watching.

ONE Warehouse for both Stages. Both environments run the same chart, so a
second subscription would only create a second opinion about what "latest"
means.

An OCI chart repository holds versions of ONE chart, so Kargo identifies it by
repoURL alone (no chart name field), unlike Helm which wants both.
*/}}
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    # Wave 1: after the Project's namespace exists. Namespace creation is
    # asynchronous (Kargo's management controller does it once the Project is
    # admitted), so ArgoCD may still need one retry here. The wave removes the
    # guaranteed failure; the retry covers the remaining race.
    argocd.argoproj.io/sync-wave: "1"
  name: {{ $pipeline.warehouse }}
  namespace: {{ $pipeline.project }}
spec:
  # These three are CRD server-side defaults, written out because a field the
  # chart omits and the API server sets is a diff ArgoCD can NEVER close. Omit
  # them and this Warehouse is permanently OutOfSync, which is not cosmetic:
  # selfHeal syncs only the DRIFTED resources, so an unconvergeable resource
  # emits a continuous stream of targeted single-resource syncs that preempt the
  # full sync. Stage/prod was planned (`nil->obj`) and never applied because a
  # Warehouse-only sync replaced the operation seven seconds later, and the
  # Application reported Succeeded the whole time because that sync did succeed.
  interval: {{ $.Values.promotion.warehouseInterval | quote }}
  freightCreationPolicy: {{ $.Values.promotion.freightCreationPolicy | quote }}
  subscriptions:
    - chart:
        repoURL: {{ $pipeline.chartRepo | quote }}
        semverConstraint: {{ $pipeline.semverConstraint | quote }}
        discoveryLimit: {{ $pipeline.discoveryLimit }}
{{- range $stage := $pipeline.stages }}
---
{{- /*
PROMOTION PATCHES THE LIVE APPLICATION rather than committing to git, which is
a deliberate deviation from ADR platform/009 decision 3 and the reason is a
hard blocker, not a preference.

Ruleset 9180009 on the default branch carries required_status_checks, and its
only bypass actor is RepositoryRole 5 (admin). A push to main from a non-admin
identity is refused, so the git path would need an ADMIN-scoped token living in
the cluster. The repo's own guidance is never to make CI a ruleset bypass
actor, and an admin PAT is a far larger surface than the problem.

argocd-update needs no credential at all: it is a Kubernetes RBAC permission
the controller already holds, and the charts are public so the Warehouse needs
no registry credential either. ADR 009 called the git write credential "the
main new surface"; this design removes it.

THE COST, stated plainly: targetRevision stops being git truth. It lives in the
live Application, and the `canada` root app must be told to ignore that one
field per Application or it will revert every promotion. Those patches are
manual and documented in this chart's README, because `canada` is a bootstrap
resource and is not in this repo.

That is also the REVERT LEVER, and the reason the CI write-back is being left
in place for now rather than deleted alongside this. It keeps writing a correct
value into production's application.yaml, so removing canada's
ignoreDifferences entry hands production straight back to git with no
scramble.
*/}}
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    # Wave 1: after the Project's namespace exists. Namespace creation is
    # asynchronous (Kargo's management controller does it once the Project is
    # admitted), so ArgoCD may still need one retry here. The wave removes the
    # guaranteed failure; the retry covers the remaining race.
    argocd.argoproj.io/sync-wave: "1"
  name: {{ $stage.name }}
  namespace: {{ $pipeline.project }}
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: {{ $pipeline.warehouse }}
      sources:
        {{- if $stage.upstream }}
        # Receives only Freight an upstream Stage has already taken, so a chart
        # cannot reach this environment without having deployed somewhere else
        # first. `direct` is deliberately absent: setting both would let the
        # Warehouse feed this Stage straight past its upstream, which silently
        # removes the ordering this line exists to create.
        stages:
          {{- range $stage.upstream }}
          - {{ . }}
          {{- end }}
        {{- if $stage.requiredSoakTime }}
        # The Freight must occupy the upstream Stage for this long before it is
        # available here. argocd-wait (below) proves the upstream went healthy
        # at one instant; this is what turns that instant into "and it stayed
        # up", which is the half of the gate a point-in-time check cannot give.
        #
        # NOT a hotfix trap: the CRD is explicit that "a manual approval for
        # promotion to this Stage will supersede any soak time requirement", so
        # the Freight-approval lever in the UI bypasses it. That lever is also
        # the escape hatch for a Stage wedged by a failed argocd-wait, since a
        # Promotion that fails never marks its Freight verified and would
        # otherwise strand the chart upstream forever.
        requiredSoakTime: {{ $stage.requiredSoakTime | quote }}
        {{- end }}
        {{- else }}
        # Nothing upstream: subscribes to the Warehouse itself.
        direct: true
        {{- end }}
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          {{- /*
          THIS TIMEOUT IS THE ONE THAT ACTUALLY BINDS, and it was missing.

          argocd-update does not merely apply and return. It waits for its own
          ArgoCD SYNC OPERATION to complete, and for a fleet that rolls through
          sync waves one Deployment at a time that operation IS the rollout. Its
          unconfigured default is 5m0s.

          So the first embervm production promotion failed on a completely
          healthy deploy (#4894): the pin was applied, the fleet rolled normally
          and went Synced/Healthy in about thirteen minutes, and the Promotion
          errored at 15:13 with `step "step-1" timed out after 5m0s` while the
          carefully measured 30m0s sat on argocd-wait below, never reached.

          It never surfaced on monolith because its rollout is about ten
          seconds, so 5m0s is generous there. A default is still a bound, and it
          is the SHORTEST bound on the path that decides the outcome, not the
          one that was tuned.
          */}}
          retry:
            timeout: {{ $pipeline.waitTimeout | quote }}
          config:
            apps:
              - name: {{ $stage.application }}
                namespace: argocd
                sources:
                  # Must match the Application's source EXACTLY or the step
                  # matches nothing and reports success having changed nothing.
                  - repoURL: {{ $pipeline.appSourceRepo | quote }}
                    chart: {{ $pipeline.appSourceChart | quote }}
                    # Kargo's expression syntax uses dollar-brace-brace, which COLLIDES
                    # with Helm's own delimiters: rendering it inline
                    # makes Helm try to evaluate chartFrom as a Helm function
                    # and fail with `function "chartFrom" not defined`. Held in
                    # values.yaml instead, where Helm treats it as data and
                    # passes it through untouched for Kargo to evaluate.
                    desiredRevision: {{ $pipeline.desiredRevisionExpr | quote }}
                    updateTargetRevision: true
        {{- /*
        WITHOUT THIS STEP THE PIPELINE VERIFIES FREIGHT BEFORE THE WORKLOAD CAN
        SERVE. argocd-update applies and returns; it registers an ongoing health
        check on the Stage but never blocks on the rollout. Measured on the
        2026-08-12 20:28 promotion of chart 0.296.2:

          20:28:37  dev Promotion starts
          20:28:43  new dev pod created
          20:28:44  dev Promotion SUCCEEDS, Freight marked verified
          20:28:53  new dev pod becomes Ready
          20:30:15  prod Promotion starts

        Freight was verified nine seconds before anything could answer a
        request, and prod followed 91 seconds later on nothing but luck. A dev
        pod that crashlooped after the sync would not have held prod back.

        WHAT THIS ASSERTS. waitFor is the default set, written out because it is
        load-bearing rather than incidental: `sync` (Synced), `operation` (no
        sync in flight) and `health` (Healthy) are ANDed, and for a Deployment
        ArgoCD only reports Healthy once observedGeneration has caught up and
        the new pods pass their probes. The monolith's readiness probe is
        /healthz, so waiting for Healthy IS the assertion that the promoted
        chart's health check went green, reached over the Kubernetes API the
        controller already has RBAC for. No HTTP path to the workload, which
        matters: monolith-dev sits behind the `monolith-dev-api-ingress` Cilium
        allowlist and the kargo namespace is not on it, so an http step would
        silently dial-timeout rather than fail honestly.

        THE RESIDUAL RACE, stated plainly because it is the same class of bug
        this step fixes. argocd-wait has NO desiredRevision field; it asserts
        against whatever target is current. argocd-update runs first and waits
        for its sync operation, so the applied manifests are the promoted
        chart's by the time this starts, but ArgoCD's status refresh can still
        briefly report the pre-apply Healthy. The window is bounded by that
        refresh, not by the rollout. Closing it entirely needs revision-aware
        verification (Argo Rollouts AnalysisTemplates, ADR platform/009's
        option A) or the trace validation in #4745.

        Degraded is fail-fast, not a wait: if the Application transitions to
        Degraded from a state that was neither Degraded nor Unknown, the step
        fails immediately instead of burning the timeout.
        */}}
        - uses: argocd-wait
          retry:
            # Bounded so a wedged environment fails the Promotion rather than
            # hanging it, and mostly redundant with the Degraded fail-fast
            # above, which trips first for the common failure.
            #
            # PER PIPELINE, because rollout durations here differ by two orders
            # of magnitude (monolith dev ~10s, embervm ~13m). Each pipeline's
            # value and the measurement behind it are in values.yaml. A new
            # pipeline needs its own measurement: a timeout sized for another
            # workload reds a healthy rollout, which teaches the operator that
            # red means nothing.
            timeout: {{ $pipeline.waitTimeout | quote }}
          config:
            apps:
              - name: {{ $stage.application }}
                namespace: argocd
                waitFor:
                  - health
                  - sync
                  - operation
        {{- if $stage.verdictURL }}
        {{- /*
        FUNCTIONAL GATE (#5224). argocd-wait proves the chart synced and the
        pods passed their readiness probes; this proves a guest boots, a task
        completes, a session banks and relights, and the control plane's own
        invariants held, by polling the conformance runner that the embervm
        chart ships into dev. The runner rolls with every chart version
        (CHART_VERSION in its pod env), so a verdict is keyed to the Freight by
        construction: a stale chart_version means the runner has not rolled
        yet and the step keeps polling; `running` keeps polling; a `fail`
        whose PREVIOUS cycle also failed fails the Promotion; the retry
        timeout fails it too. Neither is a skip.

        Two consecutive reds, not one (2026-08-29): every promotion rolls the
        dev control plane and the suite's first cycle runs in the settling
        window right after that roll, where three distinct transients were
        observed red-ing the gate on three different runs (dead-brick redial
        health churn per #4402, a fast-baseline S3 ratio trip, and
        inventory_reconciled during instance adoption) while the NEXT quiet
        cycle passed each time. A lone red therefore keeps polling until the
        following cycle settles the question; only a repeat fails. A chart
        roll restarts the runner with previous unset, so cycle one of a new
        chart can never fast-fail on residue by construction.

        Two bounded degrades, both failing safe by retry timeout rather than
        by verdict: the ONE promotion that ships the new conformance binary
        still polls an old runner whose finished report carries no previous,
        so a genuinely red suite there times out instead of fast-failing; and
        a runner pod restart mid-promotion clears previous the same way.

        The version comparison is pre-evaluated by Kargo from the same
        expression argocd-update used, so the step cannot accept a verdict for
        a different chart than the one it just promoted.

        Network: the embervm control plane carries no CiliumNetworkPolicy and
        embervm-dev has no default deny, so kargo reaches the runner Service
        today. If a policy ever lands on that namespace this dials out
        silently and the timeout is what reports it; add a fromEndpoints entry
        for the kargo namespace at the same time.
        */}}
        - uses: http
          as: conformance
          retry:
            # Kargo default 1 fails the Promotion on transient dial errors; 3 allows retries for network hiccups. 404/stale chart_version keep polling regardless.
            errorThreshold: 3
            timeout: {{ $stage.verdictTimeout | default "10m0s" | quote }}
          config:
            method: GET
            url: {{ $stage.verdictURL | quote }}
            timeout: 10s
            successExpression: "response.status == 200 && response.body.chart_version == '{{ $pipeline.desiredRevisionExpr }}' && response.body.verdict == 'pass'"
            failureExpression: "response.status == 200 && response.body.chart_version == '{{ $pipeline.desiredRevisionExpr }}' && response.body.verdict == 'fail' && response.body.previous != nil && response.body.previous.verdict == 'fail'"
            errorExpression: "'conformance suite failed on chart ' + response.body.chart_version + ': ' + toJSON(response.body.scenarios)"
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
