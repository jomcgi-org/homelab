# Kargo, owning the monolith's chart version in dev and production.
#
# Everything not needed for that is off, because each enabled integration
# widens the controller's RBAC and the chart's own docs say explicitly
# disabling is preferable to leaving an integration on and unused.
kargo:
  api:
    # The UI at private.jomcgi.dev/app/kargo. Off until now because it needed
    # TLS, an ingress and an auth decision; all three are answered below and
    # none of them cost a new credential.
    enabled: true
    host: private.jomcgi.dev
    # Requires >= v1.11.0. The API server ALWAYS serves at the root, so the
    # gateway strips this prefix before forwarding; basePath only tells the
    # server what to put in issued URLs and what to inject as
    # window.__KARGO_BASE_PATH__ for the UI to compose absolute links with.
    basePath: /app/kargo
    tls:
      # Plain HTTP in-cluster: Cloudflare terminates TLS at the edge and the
      # gateway talks to a Service, so a self-signed cert here would only give
      # the gateway something it has to be told to distrust.
      enabled: false
      # LOAD-BEARING, and the one setting in this block still honoured when
      # tls.enabled is false. Without it every URL the server issues is
      # http://, including ADMIN_ACCOUNT_TOKEN_ISSUER and the OIDC redirect,
      # while the browser arrives over https://. That mismatch presents as a
      # login redirect loop or a rejected token, with nothing anywhere
      # mentioning a protocol.
      terminatedUpstream: true
    adminAccount:
      # No local password. authentik is the identity provider, so a second
      # credential here would be one more thing to hold, rotate and leak.
      enabled: false
    oidc:
      enabled: true
      # authentik derives the issuer from the APPLICATION slug, not the
      # provider name. Must match blueprints/kargo-auth.yaml's `slug: kargo`.
      issuerURL: https://auth.jomcgi.dev/application/o/kargo/
      clientID: kargo
      admins:
        # authentik emits `groups` in the default profile scope, which the
        # blueprint's property_mappings include. This is Kargo's OWN authz,
        # separate from authentik's policy binding: authentik decides who may
        # obtain a token, this decides what a token holder may do. Both name
        # homelab-admin so neither alone grants production promotion rights.
        claims:
          groups:
            - homelab-admin
      dex:
        # Kargo bundles Dex to adapt IDPs that cannot do PKCE. authentik can,
        # so Kargo talks to it directly and this stays off: Dex would be a
        # second identity hop and a second thing to upgrade.
        enabled: false
    rollouts:
      integrationEnabled: false

  controller:
    argocd:
      # REQUIRED, and the one integration that must stay on. The promotion step
      # is argocd-update, which patches the Application; without this the
      # controller does not watch Applications and "Argo CD-based promotion
      # mechanisms will also fail" (chart docs).
      integrationEnabled: true
      namespace: argocd
      # Applications live in argocd's own namespace here, but the chart's
      # default (false) is the safe one and the docs advise leaving it.
      watchArgocdNamespaceOnly: false
    rollouts:
      # Promotion needs NO Argo Rollouts. Rollouts is only for Kargo's
      # verification features (AnalysisTemplates), which this stage does not
      # use. Disabling explicitly grants the controller fewer permissions than
      # leaving it on to be auto-detected as absent.
      integrationEnabled: false

# The promotion pipeline. Gated so the controller can land and be observed
# before it is given anything to promote.
#
# Named `promotion` rather than `devPromotion` since it acquired a production
# stage. A key called devPromotion that owns the production Application is the
# same class of trap this chart's templates already warn about twice: a name
# that reads narrower than what it controls.
promotion:
  enabled: true
  # Written out because the CRD server-side defaults all three, and a field the
  # chart omits but the API server sets is a diff ArgoCD can never close. The
  # Warehouse sat permanently OutOfSync from the first install because of it.
  #
  # That is not cosmetic, and the failure it caused is worth the comment.
  # selfHeal responds to drift by syncing ONLY the drifted resources, so a
  # resource that can never converge emits a continuous stream of targeted
  # single-resource syncs. Each one preempts the full sync, which then dies
  # before reaching wave 1. Stage/prod was planned (`nil->obj`) and never
  # applied, seven seconds before a Warehouse-only sync replaced the operation,
  # and the Application reported Succeeded throughout because that targeted
  # sync did succeed.
  #
  # So one unconvergeable resource starves every other resource in the same
  # Application, with a green status the whole time. Values match what the API
  # server sets; changing them here is fine, omitting them is not.
  warehouseInterval: 5m0s
  freightCreationPolicy: Automatic
  # One entry per workload whose chart version Kargo owns. Adding a workload
  # here is the whole change: the template is generic and this is the only
  # copy of it, so a second pipeline cannot drift from the first.
  #
  # waitTimeout is PER PIPELINE, not shared, and that is measured rather than
  # tidy. It was shared at 10m0s when monolith was the only pipeline, whose dev
  # rollout takes about 10 seconds. embervm's does not: its bricks rebuild a
  # guest rootfs on every chart bump, one node at a time, and its 0.12.9 roll
  # took 12m50s to reach Synced/Healthy with nothing wrong with it. A shared
  # 10m0s would have failed that promotion on a healthy rollout, which is the
  # worst failure a gate can have: it teaches the operator that red means
  # nothing. Any new pipeline needs its own measurement, not this default.
  pipelines:
    - name: monolith
      # The Warehouse's own name, referenced by every Stage's requestedFreight.
      warehouse: monolith-chart
      # How long a Promotion may wait for its Application to go Synced +
      # Healthy before the Promotion fails. A failed Promotion never marks its
      # Freight verified, which is exactly what stops a bad chart at dev.
      #
      # 10m is deliberately longer than any healthy rollout here (dev's
      # measured at 10s) because this bound is not the detector. ArgoCD's own
      # progressDeadlineSeconds trips the Application to Degraded first, and
      # argocd-wait fails fast on that transition, so this only catches a
      # workload that never reaches a terminal state at all.
      # WRITTEN AS 10m0s, NOT 10m, and that is not a style choice. The API
      # server normalizes these duration strings to the Go `0s`-suffixed form,
      # so a chart rendering `10m` against a stored `10m0s` is a diff ArgoCD can
      # never close. Same reasoning as warehouseInterval above, and the same
      # failure it caused: selfHeal syncs only the DRIFTED resources, so one
      # unconvergeable resource emits a continuous stream of targeted
      # single-resource syncs that preempt the full sync and starve every other
      # resource in the Application, green the whole time.
      waitTimeout: 10m0s
      # NOT "monolith" or "monolith-dev": a Kargo Project owns a namespace of that
      # name and both already exist with live workloads in them.
      project: kargo-monolith
      chartRepo: oci://ghcr.io/jomcgi/homelab/charts/monolith
      # Floor at the version dev was pinned to when this was built, so the first
      # promotion is forward-only and cannot walk an environment backwards onto an
      # older chart.
      semverConstraint: ">=0.293.0"
      discoveryLimit: 20
      # How the Applications spell their source. Helm wants registry + chart name
      # separately here, unlike the Warehouse above. Both environments run the SAME
      # chart, which is the whole point of the dev environment, so one pair covers
      # them.
      appSourceRepo: ghcr.io/jomcgi/homelab/charts
      appSourceChart: monolith
      # KARGO expression, not Helm. Kept here because ${{ }} collides with Helm's
      # delimiters and would be evaluated by the wrong engine if written inline.
      # SINGLE quotes inside the expression, not double. Helm's `quote` wraps the
      # value in double quotes and ESCAPES any inner ones, so a double-quoted
      # argument renders as chartFrom(\"oci://...\") and Kargo's expression parser
      # receives literal backslashes. expr accepts either quote style, so using
      # single quotes here means nothing needs escaping.
      desiredRevisionExpr: "${{ chartFrom('oci://ghcr.io/jomcgi/homelab/charts/monolith').Version }}"
      # Order is the pipeline. `upstream` is what makes it one rather than two
      # independent subscribers: prod can only receive Freight that dev has already
      # taken, so a chart reaches production having run somewhere first.
      #
      # THE GATE IS argocd-wait PLUS SOAK, not Kargo `verification`. Kargo's
      # verification block needs Argo Rollouts AnalysisTemplates and Rollouts stays
      # off (see controller.rollouts above), so the assertions live in the
      # promotion steps instead. A Stage with no `verification` reports "Freight has
      # been verified" the moment its Promotion succeeds, so that status is not the
      # signal; the Promotion succeeding is.
      #
      # What that buys, honestly: the promoted chart reached the environment, the
      # sync finished, the workload came Healthy (readiness probe /healthz), and for
      # prod it stayed that way for the soak. What it still does not buy: any
      # functional assertion beyond the readiness probe, and no revision-aware
      # health sample (see the residual race in monolith-promotion.yaml). #4745
      # tracks the rest.
      stages:
        - name: dev
          application: monolith-dev
          # Subscribes to the Warehouse directly: nothing is upstream of dev.
          upstream: []
          autoPromotion: true
        - name: prod
          application: monolith
          upstream:
            - dev
          # Dev must hold this Freight healthily for 2 minutes before prod may take
          # it. Deliberately short, and a SETTLING window rather than a soak in the
          # load-testing sense: it catches the pod that comes up Healthy and then
          # crashloops, which argocd-wait's point-in-time check cannot see, and it
          # costs every production deploy two minutes.
          #
          # Stated honestly so nobody reads more into it: it will NOT catch a
          # slower-onset regression, and lengthening it trades release latency for
          # exposure linearly. If a failure class shows up that this misses, raise
          # it against a measured onset time rather than by feel.
          #
          # Dev has no soak: nothing is upstream of it, and a delay there would only
          # postpone the environment that exists to find problems first.
          # 2m0s, not 2m: the API server stores the normalized form. See waitTimeout.
          requiredSoakTime: 2m0s
          autoPromotion: true
    - name: embervm
      warehouse: embervm-chart
      project: kargo-embervm
      chartRepo: oci://ghcr.io/jomcgi/homelab/charts/embervm
      # Floor at the version embervm-dev was pinned to when this was built, so
      # the first promotion is forward-only. Dev had frozen at 0.12.2 while
      # production reached 0.12.9, which is the drift this pipeline replaces:
      # the write-back only ever resolved production's application.yaml, so dev
      # was invisible to it (#4832 item 2, #4856).
      semverConstraint: ">=0.12.2"
      discoveryLimit: 20
      appSourceRepo: ghcr.io/jomcgi/homelab/charts
      appSourceChart: embervm
      # Kargo expression, not Helm. Single quotes inside: Helm's `quote` escapes
      # inner double quotes and Kargo's parser would receive backslashes.
      desiredRevisionExpr: "${{ chartFrom('oci://ghcr.io/jomcgi/homelab/charts/embervm').Version }}"
      # 30m0s, NOT monolith's 10m0s, and this is measured rather than padded.
      # An embervm chart bump rebuilds each brick's guest rootfs, one node at a
      # time. The chart 0.12.9 roll on 2026-08-14 took 12m50s to reach
      # Synced/Healthy (07:38:26 to 07:51:16) with nothing wrong with it.
      #
      # So a shared 10m0s would have failed that promotion on a perfectly
      # healthy rollout, and a gate that reds on healthy rollouts is worse than
      # no gate: it trains the operator to ignore it. 30m0s is that measurement
      # with room for a slower node, not a round number.
      #
      # This bound is still not the detector: progressDeadlineSeconds trips the
      # Application to Degraded first and argocd-wait fails fast on that. It
      # only catches a workload that never reaches a terminal state at all.
      #
      # RAISED to 90 minutes for the 0.41.7 to 0.47.x jump (#5224). The 30m0s above
      # was measured on a roll where the guest base refs did NOT move, which is
      # the common case and the one the paragraph above describes. That jump
      # moves 13 of 14 base digests (a renovate apko lock refresh rewrote every
      # runtime lock), so a node bakes ~7.5 GB of rootfs before its brick pods
      # report Ready.
      #
      # The cost is PER NODE, not per pod: the builder is content addressed by
      # guest digest into the shared node hostPath, so a second pod landing on
      # a node that already baked is a hardlink cache hit. Four nodes need a
      # cold bake, three of them serialized inside the 2gi class wave by
      # maxUnavailable 1. At the measured rate that is roughly 40m.
      #
      # 90 minutes rather than 60 because this MUST stay above
      # bricks.progressDeadlineSeconds (3600s) by a real margin, or the ordering
      # the paragraph above depends on inverts. The two clocks do not start
      # together: this budget starts when the argocd-update step starts, while a
      # brick's Progressing clock starts only once its sync wave is reached,
      # which is minutes to tens of minutes later. At 60m0s the detector could
      # never win the race, and a wedged brick would surface as an
      # uninformative "step timed out" at the full budget instead of a
      # ProgressDeadlineExceeded naming the Deployment.
      #
      # Left at 90 minutes afterwards rather than reverted: undershooting fails
      # a HEALTHY roll, which the comment above calls the worst thing a gate can
      # do, while overshooting only delays the report of a roll that was never
      # going to finish. progressDeadlineSeconds stays the real detector.
      #
      # Written 1h30m0s, not 90m0s, for the same reason requiredSoakTime is
      # written 2m0s: the API server stores the normalized form, and it carries
      # any duration of an hour or more in hours. Written as 90m0s the value
      # round-tripped as 1h30m0s, so ArgoCD saw both embervm Stages drift the
      # instant it synced them and the kargo Application sat permanently
      # OutOfSync, re-syncing on every reconcile.
      waitTimeout: 1h30m0s
      stages:
        - name: dev
          application: embervm-dev
          upstream: []
          autoPromotion: true
          # Functional gate (#5224): after argocd-wait, poll the conformance
          # runner the embervm chart ships into dev until it reports a verdict
          # for THIS chart version. The runner rolls with the chart, waits up
          # to 15m for a ready brick, then runs a suite budgeted at about 4m
          # (task cold boot, session create / bank / relight / destroy,
          # create-after-destroy, control-plane invariants). 20m0s covered the
          # runner's own wait plus that suite; a wedged brick rebuild already
          # failed argocd-wait before this step runs.
          #
          # RAISED to 40m0s alongside the dev readyWait going to 30m for the
          # 0.41.7 to 0.47.x jump (#5224). Both old numbers assumed a roll that
          # does not rebuild guest bases. On that jump the dev brick bakes the
          # same 13 changed digests the prod fleet does, so the runner's own
          # wait has to outlast the bake or it writes an S0 FAIL for the new
          # chart version, this poll reads that verdict through its failure
          # expression, and the dev promotion fails. Prod autoPromotion fires on
          # NEW Freight rather than on failure, so that Freight would then sit
          # unverified with no poller on the next healthy cycle.
          #
          # This must stay strictly greater than conformance.readyWait plus the
          # suite budget PLUS one full runInterval and a second suite, because
          # since 2026-08-29 the failure expression needs TWO consecutive red
          # cycles (post-roll settling transients red-ed the first cycle on
          # three different runs while the next quiet cycle passed; see the
          # promotion template). A lone red keeps the poll waiting for the
          # next cycle instead of failing. The suite budget is 5m10s (s1 60s +
          # s2 180s + s3 60s + s4 10s, summed as totalBudget in
          # conformance/main.go) and runInterval is 30m, so the worst case is
          # 30m readyWait + 5m10s + 30m + 5m10s, about 70m30s against this
          # 75m0s: real margin, not slack.
          verdictURL: http://embervm-dev-embervm-conformance.embervm-dev.svc.cluster.local:8080/verdict
          verdictTimeout: 75m0s
        - name: prod
          application: embervm
          upstream:
            - dev
          # Longer than monolith's 2m0s for the same reason the wait is longer:
          # the settling window has to outlast the rollout it is settling after,
          # or it expires while bricks are still coming up and proves nothing.
          requiredSoakTime: 5m0s
          # TRUE, matching monolith. This was false for one day and the
          # reasoning behind that was wrong, so it is written down rather than
          # quietly flipped.
          #
          # The argument was: an embervm prod roll rebuilds each brick's guest
          # rootfs and spends ~2.8 GiB of each master's 35 GiB cap, reclaimed by
          # nothing, so batching N merges into one manual promotion conserves a
          # scarce resource.
          #
          # Both halves are wrong. A base is rebuilt when its SIGNATURE changes,
          # not on every chart version: production went 0.12.9 -> 0.13.7, eight
          # versions, and the base refs on every node were unchanged apart from
          # the demo-postgres rebuild that the #4865 incident forced. node-2's
          # scratch went DOWN across that roll. A publish that does not move a
          # guest image digest costs approximately nothing.
          #
          # And batching does not avoid the cost of a digest change, it only
          # defers it: that change deploys eventually and costs the same then.
          # Batching only wins when several digest-changing rolls collapse into
          # one, which the history says is rare.
          #
          # What is actually accumulating is orphaned bases the retention sweep
          # cannot see (#4364): node-3 held demo-postgres__8dde24352f92 and
          # demo-postgres__ba4ef0bad08b at once, the stale one belonging to
          # neither vendor list, while the sweep reported `0 candidates`. Rate
          # limiting deploys to compensate for a collector that does not collect
          # costs release velocity and leaves the leak growing at the same rate.
          #
          # So: fix the collector, do not throttle the pipeline. If scratch ever
          # becomes the binding constraint again, the lever is #4364, not this
          # flag.
          autoPromotion: true

# Private-tier ingress: https://private.jomcgi.dev/app/kargo
#
# The prefix is forwarded INTACT. No rewritePrefix, deliberately, and this is
# the opposite of what the upstream chart's own values comment instructs
# ("the user is responsible for configuring their Ingress controller to strip
# the prefix"). That comment is wrong for 1.11.1. Asked the running binary
# rather than the docs:
#
#   /            -> HTTP 404
#   /app/kargo/  -> HTTP 200, serves the UI
#   /app/kargo   -> HTTP 301 to /app/kargo/
#
# So the server strips basePath itself (pkg/server wrapWithBasePath) and
# expects to RECEIVE the prefix. Stripping at the gateway too would 404 every
# request, presenting as a broken ingress rather than a doubled strip.
#
# That 301 also means no companion RequestRedirect route is needed for the bare
# path, unlike longhorn: Kargo issues the trailing-slash redirect itself. With
# no rewritePrefix the cfingress-rewrite-needs-slash-redirect rule does not
# apply either, so this route is simpler than either precedent in the repo.
cfIngress:
  enabled: true
  tier: trusted
  hostname: private.jomcgi.dev
  pathPrefix: /app/kargo
  serviceName: kargo-api
  # Plain HTTP: api.tls.enabled is false because Cloudflare terminates at the
  # edge. See the terminatedUpstream note above.
  servicePort: 80
  gateway:
    name: cloudflare-ingress
    namespace: envoy-gateway-system
