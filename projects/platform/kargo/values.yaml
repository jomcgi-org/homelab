# Kargo, owning the monolith's chart version in dev and production.
#
# Everything not needed for that is off, because each enabled integration
# widens the controller's RBAC and the chart's own docs say explicitly
# disabling is preferable to leaving an integration on and unused.
kargo:
  api:
    # The UI at private.jomcgi.dev/app/kargo. Off until now because it needed
    # TLS, an ingress and an auth decision; all three are answered below and
    # none of them cost a new credential.
    enabled: true
    host: private.jomcgi.dev
    # Requires >= v1.11.0. The API server ALWAYS serves at the root, so the
    # gateway strips this prefix before forwarding; basePath only tells the
    # server what to put in issued URLs and what to inject as
    # window.__KARGO_BASE_PATH__ for the UI to compose absolute links with.
    basePath: /app/kargo
    tls:
      # Plain HTTP in-cluster: Cloudflare terminates TLS at the edge and the
      # gateway talks to a Service, so a self-signed cert here would only give
      # the gateway something it has to be told to distrust.
      enabled: false
      # LOAD-BEARING, and the one setting in this block still honoured when
      # tls.enabled is false. Without it every URL the server issues is
      # http://, including ADMIN_ACCOUNT_TOKEN_ISSUER and the OIDC redirect,
      # while the browser arrives over https://. That mismatch presents as a
      # login redirect loop or a rejected token, with nothing anywhere
      # mentioning a protocol.
      terminatedUpstream: true
    adminAccount:
      # No local password. authentik is the identity provider, so a second
      # credential here would be one more thing to hold, rotate and leak.
      enabled: false
    oidc:
      enabled: true
      # authentik derives the issuer from the APPLICATION slug, not the
      # provider name. Must match blueprints/kargo-auth.yaml's `slug: kargo`.
      issuerURL: https://auth.jomcgi.dev/application/o/kargo/
      clientID: kargo
      admins:
        # authentik emits `groups` in the default profile scope, which the
        # blueprint's property_mappings include. This is Kargo's OWN authz,
        # separate from authentik's policy binding: authentik decides who may
        # obtain a token, this decides what a token holder may do. Both name
        # homelab-admin so neither alone grants production promotion rights.
        claims:
          groups:
            - homelab-admin
      dex:
        # Kargo bundles Dex to adapt IDPs that cannot do PKCE. authentik can,
        # so Kargo talks to it directly and this stays off: Dex would be a
        # second identity hop and a second thing to upgrade.
        enabled: false
    rollouts:
      integrationEnabled: false

  controller:
    argocd:
      # REQUIRED, and the one integration that must stay on. The promotion step
      # is argocd-update, which patches the Application; without this the
      # controller does not watch Applications and "Argo CD-based promotion
      # mechanisms will also fail" (chart docs).
      integrationEnabled: true
      namespace: argocd
      # Applications live in argocd's own namespace here, but the chart's
      # default (false) is the safe one and the docs advise leaving it.
      watchArgocdNamespaceOnly: false
    rollouts:
      # Promotion needs NO Argo Rollouts. Rollouts is only for Kargo's
      # verification features (AnalysisTemplates), which this stage does not
      # use. Disabling explicitly grants the controller fewer permissions than
      # leaving it on to be auto-detected as absent.
      integrationEnabled: false

# The promotion pipeline. Gated so the controller can land and be observed
# before it is given anything to promote.
#
# Named `promotion` rather than `devPromotion` since it acquired a production
# stage. A key called devPromotion that owns the production Application is the
# same class of trap this chart's templates already warn about twice: a name
# that reads narrower than what it controls.
promotion:
  enabled: true
  # NOT "monolith" or "monolith-dev": a Kargo Project owns a namespace of that
  # name and both already exist with live workloads in them.
  project: kargo-monolith
  chartRepo: oci://ghcr.io/jomcgi/homelab/charts/monolith
  # Floor at the version dev was pinned to when this was built, so the first
  # promotion is forward-only and cannot walk an environment backwards onto an
  # older chart.
  semverConstraint: ">=0.293.0"
  # Written out because the CRD server-side defaults all three, and a field the
  # chart omits but the API server sets is a diff ArgoCD can never close. The
  # Warehouse sat permanently OutOfSync from the first install because of it.
  #
  # That is not cosmetic, and the failure it caused is worth the comment.
  # selfHeal responds to drift by syncing ONLY the drifted resources, so a
  # resource that can never converge emits a continuous stream of targeted
  # single-resource syncs. Each one preempts the full sync, which then dies
  # before reaching wave 1. Stage/prod was planned (`nil->obj`) and never
  # applied, seven seconds before a Warehouse-only sync replaced the operation,
  # and the Application reported Succeeded throughout because that targeted
  # sync did succeed.
  #
  # So one unconvergeable resource starves every other resource in the same
  # Application, with a green status the whole time. Values match what the API
  # server sets; changing them here is fine, omitting them is not.
  warehouseInterval: 5m0s
  freightCreationPolicy: Automatic
  discoveryLimit: 20
  # How the Applications spell their source. Helm wants registry + chart name
  # separately here, unlike the Warehouse above. Both environments run the SAME
  # chart, which is the whole point of the dev environment, so one pair covers
  # them.
  appSourceRepo: ghcr.io/jomcgi/homelab/charts
  appSourceChart: monolith
  # KARGO expression, not Helm. Kept here because ${{ }} collides with Helm's
  # delimiters and would be evaluated by the wrong engine if written inline.
  # SINGLE quotes inside the expression, not double. Helm's `quote` wraps the
  # value in double quotes and ESCAPES any inner ones, so a double-quoted
  # argument renders as chartFrom(\"oci://...\") and Kargo's expression parser
  # receives literal backslashes. expr accepts either quote style, so using
  # single quotes here means nothing needs escaping.
  desiredRevisionExpr: "${{ chartFrom('oci://ghcr.io/jomcgi/homelab/charts/monolith').Version }}"
  # Order is the pipeline. `upstream` is what makes it one rather than two
  # independent subscribers: prod can only receive Freight that dev has already
  # taken, so a chart reaches production having run somewhere first.
  #
  # NO verification gate yet, deliberately. Kargo's verification needs Argo
  # Rollouts AnalysisTemplates and Rollouts is not installed, so "dev took it"
  # is the only gate today. That is honest rather than sufficient: it proves a
  # chart deployed, not that it works. Synthetic checks are the follow-up, and
  # until they exist this is risk-equivalent to the CI write-back it replaces,
  # since both act on a chart that only exists because a PR passed CI.
  stages:
    - name: dev
      application: monolith-dev
      # Subscribes to the Warehouse directly: nothing is upstream of dev.
      upstream: []
      autoPromotion: true
    - name: prod
      application: monolith
      upstream:
        - dev
      autoPromotion: true
