apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./argocd
  - ./argocd-image-updater
  - ./atlas-operator/deploy
  - ./cert-manager # Must be before linkerd
  - ./cloudnative-pg/deploy
  - ./cloudflare-gateway # Envoy Gateway + Gateway API + Cloudflare Tunnel; CRDs must be before linkerd
  - ./coredns
  - ./keda
  - ./kyverno
  - ./linkerd
  - ./longhorn
  - ./nack # NATS JetStream controller; must reconcile before nats-streams (Stream CRDs)
  - ./nats
  - ./nats-streams
  - ./nvidia-gpu-operator
  - ./opentelemetry-operator
  - ./seaweedfs
  - ./signoz
  - ./signoz-addons # Must be after signoz
  # ./temporal and ./warehouse-bucket removed: lakehouse/Temporal stack
  # decommissioned (superseded by ../loom). temporal-databases is retained
  # transiently with its Database CRs flipped to ensure:absent so CNPG drops the
  # temporal/temporal_visibility/lakehouse databases; removed in a follow-up.
  - ./temporal-databases
