apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./argocd
  - ./argocd-image-updater
  - ./argo-workflows # Namespace-scoped (argo ns) batch-job executor for the monolith
  - ./atlas-operator/deploy
  - ./cert-manager # Must be before linkerd
  - ./cloudnative-pg/deploy
  - ./cloudflare-gateway # Envoy Gateway + Gateway API + Cloudflare Tunnel; CRDs must be before linkerd
  - ./coredns
  - ./keda
  - ./kyverno
  - ./linkerd
  - ./longhorn
  - ./nack # NATS JetStream controller; must reconcile before nats-streams (Stream CRDs)
  - ./nats
  - ./nats-streams
  - ./nvidia-gpu-operator
  - ./opentelemetry-operator
  - ./seaweedfs
  - ./signoz
  - ./signoz-addons # Must be after signoz
  # temporal, warehouse-bucket and temporal-databases removed: lakehouse/Temporal
  # stack decommissioned (superseded by ../loom). The CNPG temporal/
  # temporal_visibility/lakehouse databases were dropped via ensure:absent before
  # this removal.
