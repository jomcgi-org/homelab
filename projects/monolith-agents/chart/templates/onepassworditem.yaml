{{- if .Values.onepassword.itemPath }}
# Syncs the agent tier's database credential into THIS namespace. Secrets are
# namespaced, so the monolith's own monolith-pg-app secret is unreachable from
# here: a tier in its own namespace needs its own synced copy, exactly as
# monolith-public does for public_reader.
#
# The synced Secret name equals metadata.name, which must match
# .Values.databaseSecretName so the Deployment's secretKeyRef resolves. The
# 1Password item carries a "uri" field with the full postgresql:// string.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.databaseSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-agents.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.onepassword.itemPath | quote }}
{{- end }}
