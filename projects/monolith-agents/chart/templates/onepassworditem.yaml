{{- if .Values.onepassword.itemPath }}
# Syncs the agent tier's database credential into THIS namespace. Secrets are
# namespaced, so the monolith's own monolith-pg-app secret is unreachable from
# here: a tier in its own namespace needs its own synced copy, exactly as
# monolith-public does for public_reader.
#
# The synced Secret name equals metadata.name, and it is taken from the SAME
# value the Deployment's secretKeyRef reads (.Values.database.secretName), so
# the two cannot drift apart. The 1Password item carries a "uri" field with
# the full postgresql:// string.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-agents.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.onepassword.itemPath | quote }}
{{- end }}
{{- if .Values.objectStorage.onepassword.itemPath }}
---
# The object-storage credential, same rule: the monolith namespace's
# monolith-r2-s3 is unreachable from here, so sync the same 1Password item
# under the name the Deployment's S3_* secretKeyRefs read. Without it
# raw_store.upload_raw no-ops silently and every report_knowledge loses its
# raw text.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.objectStorage.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-agents.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.objectStorage.onepassword.itemPath | quote }}
{{- end }}
