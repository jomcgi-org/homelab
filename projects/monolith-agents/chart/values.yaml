# Authenticated agents service. Isolation is enforced by
# templates/cilium-policy.yaml under ADR platform/012.
#
# Identity-only token for authentication; the SA has no K8s RBAC. The token is
# mounted so the workload can prove its service identity, not call the K8s API.

nameOverride: ""
fullnameOverride: ""

# OTLP/HTTP traces endpoint. Empty disables the exporter.
otelEndpoint: ""

imagePullSecret:
  enabled: false
imagePullSecrets: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  # Identity-only token for authentication; the SA has no K8s RBAC.
  automount: true
  annotations: {}
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}

database:
  # Secrets are namespaced, so this tier cannot read the monolith's own
  # monolith-pg-app: it needs its own copy in monolith-agents, synced by the
  # 1Password operator from onepassword.itemPath below. monolith-public does
  # the same for public_reader. The item carries a "uri" field holding the full
  # postgresql:// string.
  secretName: monolith-agents-db
  secretKey: uri

embeddingUrl: "http://inference-embeddings.inference.svc.cluster.local:8080"

knowledge:
  defaultRepoScope: "repo:jomcgi-org/homelab"

auth:
  authentik:
    jwksUrl: "http://authentik-server.authentik.svc.cluster.local/application/o/mcp-friends/jwks/"
    issuer: "https://auth.jomcgi.dev/application/o/mcp-friends/"
    audience: "https://private.jomcgi.dev"
    agentJwksUrl: "http://authentik-server.authentik.svc.cluster.local/application/o/mcp-agents/jwks/"
    agentIssuer: "https://auth.jomcgi.dev/application/o/mcp-agents/"
    agentAudience: "https://private.jomcgi.dev"
  jwksCacheTtlSeconds: 300

# Object-storage and agent-auth sets fail SILENTLY when missing. Keep every
# value and secret reference explicit, even when a library default seems safe.
objectStorage:
  endpoint: "https://7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com"
  region: auto
  secretName: monolith-r2-s3
  accessKeyKey: access-key-id
  secretAccessKeyKey: secret-access-key
  # Synced into this namespace by the 1Password operator under secretName
  # above. Unset by default; deploy values point it at the same item the
  # monolith's own monolith-r2-s3 comes from.
  onepassword:
    itemPath: ""

discord:
  defaultChannelId: ""

# ADR platform/012 isolation. Once selected, the agents pod has closed ingress
# except node health probes and destination-scoped egress for its dependencies.
ciliumPolicy:
  enabled: true
  objectStorageFqdn: "7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com"

# The tier's own database credential, synced into this namespace by the
# 1Password operator under database.secretName. Unset by default: the scoped
# Postgres role it points at is a later slice, and the workload stays disabled
# until it exists.
onepassword:
  itemPath: ""

agents:
  enabled: true
  replicas: 1
  image:
    # No digest here on purpose. helm_images_values pins it at build time from
    # //projects/monolith:main_agents_image.info (see chart/BUILD). A digest
    # written by hand goes stale on the next CI rebuild and turns into
    # ImagePullBackOff, and a placeholder digest deploys an image that does not
    # exist at all.
    repository: ghcr.io/jomcgi/homelab/projects/monolith/agents
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8092
  portName: http
  # The container env is composed in templates/deployment.yaml from the
  # database, objectStorage, auth and discord values above; there is no
  # env list to override here.
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    # A single pod has no alternate replica to receive traffic. The same cheap,
    # auth-free /healthz check prevents routing to a process that cannot answer
    # while avoiding dependency-driven readiness flaps that remove all capacity.
    readiness:
      path: /healthz
      initialDelaySeconds: 2
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8092
