# Environment-specific overrides for the lakehouse chart, layered on top of the
# OCI chart's packaged values.yaml. The 1Password itemPaths below are MANUAL
# PREREQUISITES -- the items must exist and be populated before the housekeeping
# worker can read PG and before the Quack /search token is enforced.

# Image tags are deliberately NOT set here. The OCI chart is digest-pinned at
# build time (helm_images_values bakes the CI-stamped tag into the packaged
# values.yaml), and this overlay is applied AFTER that base (Helm valueFiles are
# last-wins), so a `tag:` here would silently un-pin the images. Only pullPolicy
# is overridden — Always re-pulls defensively on restart, harmless now that the
# pinned tag is immutable.
worker:
  image:
    pullPolicy: Always
quack:
  image:
    pullPolicy: Always
  # No public ingress: the read path is accessed IN-CLUSTER ONLY — SSR callers
  # (e.g. the monolith) hit the quack Service directly over cluster DNS
  # (lakehouse-quack.lakehouse.svc.cluster.local:8080). We deliberately do NOT
  # expose quack via the public quack.jomcgi.dev domain, so cfIngress stays at the
  # chart default (disabled) and no Gateway HTTPRoute is rendered. The in-cluster
  # Service is independent of cfIngress, so this does not affect SSR access.
  cfIngress:
    enabled: false
  queryToken:
    # MANUAL PREREQUISITE: 1Password item with a QUACK_QUERY_TOKEN field.
    onepasswordItemPath: vaults/k8s-homelab/items/lakehouse-quack-query-token
dispatchers:
  image:
    pullPolicy: Always

# PG backfill credential is cloned by Kyverno (clone-monolith-pg-app) from
# monolith/monolith-pg-app into the lakehouse ns as `<fullname>-pg` (key `uri`)
# — no 1Password round-trip for the cluster-generated credential. Just enable
# the housekeeping worker's DATABASE_URL wiring.
pg:
  enabled: true

# No `onepassword:` overrides here: the PG credential is Kyverno-cloned (not a
# 1Password item) and S3 falls back to DuckDB dummies (SeaweedFS auth off). The
# chart defaults leave both itemPaths unset so their OnePasswordItems don't
# render. (Omitted rather than set to "" — empty deploy itemPaths are a flagged
# correctness smell, no-empty-1password-itempath.)
