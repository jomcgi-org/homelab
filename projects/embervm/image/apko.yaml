# Runtime image for the EmberVM control plane. Wolfi base providing erlang-27
# (the ERTS + OTP apps the include_erts:false release boots against), busybox
# (the release start script is /bin/sh), and ca-certificates. The control-plane
# OTP release is layered at /opt/embervm (see BUILD).
#
# AMD64-ONLY: the release carries exqlite's compiled sqlite3_nif.so (the op-log
# SQLite driver), which is architecture-specific, so the earlier "one release
# serves both arches" property no longer holds. The RBE build executor and every
# cluster node are amd64, so building x86_64 only is correct and honest: a dual
# arch image would layer the amd64 NIF into an aarch64 manifest that no node can
# run. If an arm64 node ever joins, this must become a per-arch release build (a
# per-arch NIF), the bazel/ocaml pattern; until then, one arch is simpler.
#
# erlang-27 is pinned to 27.3.4.16-r0 to EXACTLY match the build OTP
# (bazel/erlang/repositories.bzl): an include_erts:false release pins exact OTP
# app versions in its .boot script, so a build/runtime patch mismatch crash-loops
# the pod at boot. Re-pin both together when Wolfi bumps erlang-27.
#
# Do not let this drift far. Wolfi drops old versions from its APKINDEX while
# leaving the apk itself resolvable on the CDN, so a stale exact pin keeps
# BUILDING long after `apko lock` stops being able to satisfy it. That is how
# 27.3.4.2 got here: every lock refresh in the repo failed against this one
# constraint while nothing visibly broke. Pick a version present in BOTH the
# Wolfi index and builds.hex.pm/builds/otp/ubuntu-22.04.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - busybox
    - erlang-27=27.3.4.16-r0

archs:
  - x86_64

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  # A UTF-8 locale keeps Elixir from warning and mangling non-ASCII.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # No Erlang distribution (single-node control plane); avoids epmd and a
  # resolvable-hostname requirement.
  RELEASE_DISTRIBUTION: none
  # The release writes its runtime scratch (extracted vm.args, pids) here. The
  # pod runs read-only-rootfs as uid 65532, so RELEASE_TMP MUST point at a
  # writable emptyDir the chart mounts (/tmp); the default (the root-owned
  # release dir) is not writable.
  RELEASE_TMP: /tmp

entrypoint:
  command: /opt/embervm/bin/embervm start
