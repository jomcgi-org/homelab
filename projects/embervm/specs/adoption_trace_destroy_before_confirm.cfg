\* Negative fixture window for adoption_trace.tla: the destroy-ordering
\* deviation from the #6415 acceptance (destroyed before node confirmation).
\* The gated confirm_destroy for live VM s1/v1 carries node_confirmed FALSE
\* with no teardown or absence proof, and it is ordered BEFORE any intent
\* record. TLC must reject this window naming NoDestroyBeforeConfirm.
\* NoDoubleAssign stays satisfied (v1 is dispatched once), so the failure
\* names exactly one invariant.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    MinTraceEvents = 4
    Trace = <<
        [action |-> "prime", vm |-> "v1", node |-> "n1", session |-> "", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "dispatch_warm", vm |-> "v1", node |-> "n1", session |-> "s1", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "confirm_destroy", vm |-> "v1", node |-> "n1", session |-> "s1", had_vm |-> TRUE, gate |-> TRUE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "succeed", vm |-> "v1", node |-> "n1", session |-> "s1", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "begin_destroy", vm |-> "v1", node |-> "n1", session |-> "s1", had_vm |-> FALSE, gate |-> TRUE, node_confirmed |-> FALSE, confirmed_by |-> ""]
    >>

INVARIANT TraceWellFormed
INVARIANT NoDestroyBeforeConfirm
INVARIANT NoDoubleAssign
