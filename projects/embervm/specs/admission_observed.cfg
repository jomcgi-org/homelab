\* NEGATIVE mode (2026-10-10 OOMKills): AdmitReserved = FALSE is the observed
\* model the bricks ran, admitting on cgroup headroom less in-flight boots
\* less the floor. A restored guest lands with none of its RAM faulted in,
\* so after one boot lands the next one sees nearly the whole brick free.
\* Reachable violating trace: the unclaimed lane boots the small r1 on an
\* empty brick and it lands with only its overhead resident (1 of 6). The
\* CP places the large r3 on the same brick (r1 left no claim to debit),
\* and noded admits it against the 3 units observed headroom leaves after
\* the floor. Both guests fault their RAM in and the brick holds
\* 3 + 4 = 7 > 6. The production version was 5-7 guests of 3072 MiB on a
\* 7936 MiB budget.
\*
\* Only TypeOK and ResidentWithinBudget are checked. NoOvercommit is the
\* reserved model's own contract, which the observed model never claimed and
\* breaks at the earlier admission step, so listing it would name the
\* declared-memory symptom instead of the resident memory that killed the
\* bricks. Every other constant matches admission.cfg.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Bricks = {b1, b2, b3}
    Requests = {r1, r2, r3}
    UnclaimedRequests = {r1}
    LargeRequests = {r3}
    SmallSize = 2
    LargeSize = 3
    Budget = 6
    Overhead = 1
    Floor = 2
    MaxBootFails = 1
    NULL = NULL
    AdmitReserved = FALSE
    AtomicAdmit = TRUE
    LazyGrowth = TRUE
    WalkFrontier = TRUE
    RetryableDenial = TRUE

SYMMETRY BrickSymmetry

INVARIANT TypeOK
INVARIANT ResidentWithinBudget
