\* NEGATIVE mode: the pre-ADR-embervm/017 fail-closed-both-ways posture.
\* AutoHealEnabled = FALSE removes the auto-heal branch but keeps the durable
\* checkpoint-dispatch record and its fail-closed arm, modeling exactly the
\* situation ADR 017's Context names: "a control plane that cannot remember its
\* own outstanding checkpoint cannot tell its own auto-aborted +1 from a rogue
\* second writer's +1, so it must fail closed on both." Reachable trace
\* (MaxGen = 3): RequestWake; PauseForCheckpoint at gen 1; RecordCheckpointDispatch
\* {vm1, 1}; CrashCP; AutoAbortCheckpoint bumps the ledger to 2 on the SAME vm_id
\* (blessed marker left behind); RestartCP; ReportVolume(2, FALSE, n1);
\* FoldReport: forward-unblessed, record present, signature MATCHES (2 = 1 + 1,
\* same live vm_id), but with the heal off the report falls into the
\* fail-closed-under-checkpoint-context arm and QUARANTINES. The provable own-
\* checkpoint was quarantined on sight, NoFalseQuarantine's heal half trips
\* (falseQuarantineHeal), and every later wake is refused forever: the
\* demo-postgres outage that made ADR 017 exist. tlc.sh runs this in
\* expectation "fail": a passing run would mean the model went blind to the bug
\* the heal fixed.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Nodes = {n1}
    AnchorNode = n1
    MaxGen = 3
    LeaseSize = 1
    GrantExpires = TRUE
    AutoHealEnabled = FALSE
    AdoptFencedWriter = TRUE
    MaxCPCrashes = 1
    MaxAutoAborts = 1
    MaxRogueReports = 0
    MaxWakes = 1
    AdversarialReports = TRUE
    NULL = NULL

INVARIANT TypeOK
INVARIANT WatermarkNeverRegresses
INVARIANT NoServeQuarantined
INVARIANT NoFalseQuarantine
INVARIANT LeaseWellFormed
