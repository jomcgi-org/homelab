\* Fixture window for adoption_trace.tla: the happy path a deliberate CP
\* restart plus destroy produces against embervm-dev (issue #6415). Prime,
\* adopt, dispatch, CP restart, re-adopt, checkpoint, succeed (destroy intent),
\* begin_destroy, node-confirmed confirm_destroy, checkpoint. TLC must accept
\* it: no invariant violated, exhaustive (0 states left on queue).
\* The window itself lives in the spec (PassWindow): TLC configuration files
\* accept only scalars, sets, and model values, never tuples or records, so
\* the .cfg selects the fixture by name.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Fixture = "pass"
    LiveTrace = {}
    MinTraceEvents = 4

INVARIANT TraceWellFormed
INVARIANT NoDestroyBeforeConfirm
INVARIANT NoDoubleAssign
