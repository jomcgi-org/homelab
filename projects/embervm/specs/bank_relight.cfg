\* SAFETY mode (positive): the post-ADR-embervm/014 bank/relight generation-pairing
\* protocol with the PR #3770 monotonic floor ON. Over the shared (non-isolated)
\* lane, every safety invariant holds: the stored generation never regresses, a
\* warm relight never resumes a stale snapshot, and the CP records an instance
\* destroyed only after node-confirmed teardown. Isolated = FALSE here so the reuse
\* (bank/relight) lifecycle is exercised; the isolated single-use guarantee is
\* checked separately in bank_relight_isolated.cfg. No temporal property (this is a
\* safety spec, like adoption.cfg). See README.md for the cfg matrix.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    MaxGen = 3
    MonotonicFloor = TRUE
    Isolated = FALSE
    NULL = NULL

INVARIANT TypeOK
INVARIANT GenerationNeverRegresses
INVARIANT NoStaleRelight
INVARIANT SingleUseNeverReused
INVARIANT NoDestroyBeforeConfirm
