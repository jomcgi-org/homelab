\* NEGATIVE: drop the fail-closed aborts (uptime, fleet freshness, partial
\* listing, empty-CP-state). A sweep firing mid-rebuild reads an empty desired
\* set as "everything is orphaned" and deletes on an inconsistent inventory.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Refs = {ref1, ref2}
    NewestRef = ref2
    ReferenceGuard = TRUE
    ExpiryGuard = TRUE
    AgeFloorGuard = TRUE
    AbortGuard = FALSE
    RestorePresenceGuard = TRUE
    NewestRefGuard = TRUE
    FleetRevalidationGuard = TRUE

INVARIANT TypeOK
INVARIANT NoDeleteOnInconsistentInventory
