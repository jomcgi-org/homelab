\* Expected-fail composite negative; exact invariant required.
\* It removes both redundant orphan guards (origin skip and adopt-before-orphans
\* ordering), so this is not an exhaustive pass.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    MaxRequests = 1
    MaxLeaves = 1
    MaxFailures = 1
    Witness = "none"
    WrongWinner = FALSE
    UnownedPublish = FALSE
    ReapActivator = FALSE
    EarlyRegister = FALSE
    SilentFailure = FALSE
    Leak = FALSE
    SkipOriginGuard = TRUE
    OrphansFirst = TRUE

INVARIANT NoLegitActivatorWakeReaped
