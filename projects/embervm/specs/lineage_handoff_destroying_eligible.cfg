\* Source-conformance negative for predecessor eligibility. The current restore
\* validator admits :destroying although SessionStore classifies it as live.
\* The intended counterexample violates TerminalPredecessorOnly only.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {h0, h1, h2}
    NULL = NULL
    MaxGeneration = 3
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    RequireExportCompletion = TRUE
    RequireDurableRelinquish = TRUE
    DurableHeirClaim = TRUE
    RequireTerminalPredecessor = FALSE
    CompareGenerationOnReconnect = TRUE

INVARIANT TerminalPredecessorOnly
