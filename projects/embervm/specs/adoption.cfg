\* SAFETY mode: the full protocol (adoption + forget-before-kill + aging on),
\* exploring the rich interleaving space the safety invariants must survive:
\* 1 node, 2 VMs, 2 tasks, 2 principals, with BOTH a control-plane crash and a node
\* crash (VM-id recycling is unconditional). No temporal property here (liveness is
\* checked separately, on lean bounds, in adoption_liveness.cfg): exhaustive
\* liveness over this rich a graph is too slow for CI, whereas safety checking over
\* it is fast. See README.md for the bounds rationale.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Nodes = {n1}
    VMs = {v1, v2}
    Tasks = {t1, t2}
    Principals = {p1, p2}
    NULL = NULL
    AdoptionEnabled = TRUE
    ForgetBeforeKill = TRUE
    AgingEnabled = TRUE
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    MaxGen = 2

INVARIANT TypeOK
INVARIANT NoDoubleAssign
INVARIANT AdoptIdempotent
INVARIANT NoResurrection
INVARIANT NoReapLive
INVARIANT PrincipalIsolation
INVARIANT NoDestroyBeforeConfirm
INVARIANT DestroyIntentPrecedesRecord
