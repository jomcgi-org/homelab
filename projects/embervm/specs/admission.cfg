\* POSITIVE safety model: the shipped protocol. noded admits on the reserved
\* model (declared claims, in-flight tickets and per-VM overhead, with the
\* observed headroom as a second guard) atomically under one mutex; guests
\* fault their RAM in lazily; the CP places on arbitrarily stale reports net
\* of its pending claims, walks the frontier on a refusal, and retries an
\* exhausted frontier. One boot may fail.
\*
\* r1 is placed by a lane that writes no Inflight row (session create,
\* serving cold create), so the CP can still send two boots that do not both
\* fit to one brick and noded's gate is what refuses the second. r3 is large:
\* a brick holds two small guests or one large one. Floor > Overhead, as
\* 512 > 64 MiB in production, so the observed guard binds once a guest has
\* grown. Three bricks so a refusal can walk two hops; bricks are
\* interchangeable, so BrickSymmetry is sound for these brick-quantified
\* invariants. TLC must still drain the full queue.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Bricks = {b1, b2, b3}
    Requests = {r1, r2, r3}
    UnclaimedRequests = {r1}
    LargeRequests = {r3}
    SmallSize = 2
    LargeSize = 3
    Budget = 6
    Overhead = 1
    Floor = 2
    MaxBootFails = 1
    NULL = NULL
    AdmitReserved = TRUE
    AtomicAdmit = TRUE
    LazyGrowth = TRUE
    WalkFrontier = TRUE
    RetryableDenial = TRUE

SYMMETRY BrickSymmetry

INVARIANT TypeOK
INVARIANT NoOvercommit
INVARIANT ResidentWithinBudget
INVARIANT NoLeakedClaim
INVARIANT TicketsBalanced
INVARIANT NoStrandedRequest
