\* Positive safety model: one predecessor, two candidate heirs, two bricks,
\* generations 0..2, and one crash of each process class. All guards are on.
\* TLC must drain the full queue. Physical media loss is not a modeled crash.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {heir1, heir2}
    Nodes = {node1, node2}
    Predecessor = predecessor
    SourceNode = node1
    TargetNode = node2
    MaxGeneration = 2
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    SafeRelease = TRUE
    ExclusiveHeirGuard = TRUE
    TerminalPredecessorGuard = TRUE
    ReconnectComparison = TRUE

INVARIANT TypeOK
INVARIANT NoWorkspaceLoss
INVARIANT NeverTwoLiveHeirs
INVARIANT InheritanceOnlyFromTerminal
INVARIANT ReconnectDetectsDivergence
