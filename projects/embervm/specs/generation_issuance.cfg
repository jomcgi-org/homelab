\* SAFETY mode (positive): the shipped issuance protocol, all guards on
\* (auto-heal per ADR embervm/017, fenced-writer anchor adoption per ADR
\* embervm/014), over the rich adversarial space: two nodes (so non-anchor
\* split-brain evidence is reachable), a budgeted second-writer advance, grant
\* expiry during control-plane absence, one CP crash, one resolve-timeout
\* auto-abort, two parked wakes. Every invariant holds: the watermark never
\* regresses, a quarantined volume never serves, and the fence never
\* quarantines an advancement the CP can account for while still quarantining
\* every genuinely unprovable jump (the rogue arms are reachable, so the fence
\* is exercised non-vacuously). No temporal property here: exhaustive liveness
\* over this rich a graph is too slow for CI and runs in
\* generation_issuance_liveness.cfg on lean bounds. LeaseSize = 1 shrinks the
\* built lease width (50) so exhaustion boundaries stay inside MaxGen.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Nodes = {n1, n2}
    AnchorNode = n1
    MaxGen = 4
    LeaseSize = 1
    GrantExpires = TRUE
    AutoHealEnabled = TRUE
    AdoptFencedWriter = TRUE
    MaxCPCrashes = 1
    MaxAutoAborts = 1
    MaxRogueReports = 1
    MaxWakes = 2
    AdversarialReports = TRUE
    NULL = NULL

INVARIANT TypeOK
INVARIANT WatermarkNeverRegresses
INVARIANT NoServeQuarantined
INVARIANT NoFalseQuarantine
INVARIANT LeaseWellFormed
