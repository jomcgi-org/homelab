\* SAFETY mode (positive), isolated lane: Isolated = TRUE models the ADR
\* embervm/015 single-use lane. The Bank and RelightWarm guards structurally
\* forbid the reuse lifecycle for an isolated instance, so it never reaches a
\* banking / banked / relighting state and never holds a banked bundle:
\* SingleUseNeverReused holds NON-vacuously here (its premise Isolated is true).
\* This is the config that actually exercises the single-use guarantee; the shared
\* lane (bank_relight.cfg) exercises the bank/relight pairing. All other safety
\* invariants also hold. A model that dropped a ~Isolated guard would let an
\* isolated instance reach "banked" and this config would catch it.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    MaxGen = 3
    MonotonicFloor = TRUE
    Isolated = TRUE
    NULL = NULL

INVARIANT TypeOK
INVARIANT GenerationNeverRegresses
INVARIANT NoStaleRelight
INVARIANT SingleUseNeverReused
INVARIANT NoDestroyBeforeConfirm
