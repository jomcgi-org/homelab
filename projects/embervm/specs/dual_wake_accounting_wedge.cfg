\* Liveness negative wedge: Leak = TRUE skips activator adoption while the
\* orphan exemption remains, so an allocated handle never gains a row and
\* EventualAccounting FAILS. Same one-request/one-outage/one-crash bound as
\* dual_wake_liveness.cfg, so the only difference is the switch. tlc.sh runs
\* this in expectation "fail" with no named invariant (temporal violations
\* name no invariant): a passing run would mean the model went blind to the
\* accounting wedge. Result row pending Linux CI (no local toolchain here).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    MaxRequests = 1
    MaxLeaves = 1
    MaxFailures = 1
    Witness = "none"
    WrongWinner = FALSE
    UnownedPublish = FALSE
    ReapActivator = FALSE
    EarlyRegister = FALSE
    SilentFailure = FALSE
    Leak = TRUE
    SkipOriginGuard = FALSE
    OrphansFirst = FALSE

PROPERTY EventualAccounting
