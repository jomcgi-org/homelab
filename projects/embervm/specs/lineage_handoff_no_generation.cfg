\* Source-conformance negative for reconnect divergence. Session workspaces have
\* no generation ledger and restore passes generation 0, so the old branch is
\* silently accepted instead of compared. The intended counterexample violates
\* CommonAncestorDivergenceDetected only.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {h0, h1, h2}
    NULL = NULL
    MaxGeneration = 3
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    RequireExportCompletion = TRUE
    RequireDurableRelinquish = TRUE
    DurableHeirClaim = TRUE
    RequireTerminalPredecessor = TRUE
    CompareGenerationOnReconnect = FALSE

INVARIANT CommonAncestorDivergenceDetected
