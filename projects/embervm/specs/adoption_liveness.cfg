\* LIVENESS mode (positive): proves the shipped protocol (adoption on) makes
\* progress. FairSpec's per-action strong fairness plus AdoptionEnabled = TRUE mean
\* every queued task eventually dispatches, ACROSS a control-plane crash-restart.
\* Lean bounds (2 VMs, 1 task, 1 CP crash, no node crash, one recycle, gen cap 3):
\* the temporal check is expensive, and this property is about the CP crash-restart
\* stranding, which needs neither node death nor a second task. The rich crash
\* interleavings are covered by adoption.cfg (safety) and the negative modes.
\* Expectation: pass. Paired with adoption_wedge.cfg (same bounds, adoption OFF),
\* which must FAIL: together they show adoption is exactly what closes the wedge.
SPECIFICATION FairSpec

CHECK_DEADLOCK FALSE

CONSTANTS
    Nodes = {n1}
    VMs = {v1, v2}
    Tasks = {t1}
    Principals = {p1}
    NULL = NULL
    AdoptionEnabled = TRUE
    ForgetBeforeKill = TRUE
    AgingEnabled = FALSE
    MaxCPCrashes = 1
    MaxNodeCrashes = 0
    MaxGen = 2

PROPERTY EventuallyDispatched
