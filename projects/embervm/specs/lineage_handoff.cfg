\* Positive bounded protocol: every required guard is enabled. Three heirs
\* allow two concurrent contenders; generations 1..3 cover predecessor and
\* two successors; one crash of each process exercises both recovery paths.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {h0, h1, h2}
    NULL = NULL
    MaxGeneration = 3
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    RequireExportCompletion = TRUE
    RequireDurableRelinquish = TRUE
    DurableHeirClaim = TRUE
    RequireTerminalPredecessor = TRUE
    CompareGenerationOnReconnect = TRUE

INVARIANT TypeOK
INVARIANT WorkspaceAvailable
INVARIANT NeverTwoLiveHeirs
INVARIANT TerminalPredecessorOnly
INVARIANT CommonAncestorDivergenceDetected
INVARIANT DurableRelinquishBeforeHandoff
