\* Negative fixture window for adoption_trace.tla: the double-dispatch
\* deviation from the #6415 acceptance (the same vm_id dispatched twice with
\* no intervening consumption). TLC must reject this window naming
\* NoDoubleAssign. NoDestroyBeforeConfirm stays satisfied (no confirms at
\* all), so the failure names exactly one invariant.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    MinTraceEvents = 4
    Trace = <<
        [action |-> "prime", vm |-> "v1", node |-> "n1", session |-> "", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "dispatch_warm", vm |-> "v1", node |-> "n1", session |-> "s1", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "checkpoint", vm |-> "", node |-> "n1", session |-> "", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "dispatch_miss", vm |-> "v1", node |-> "n1", session |-> "s2", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""],
        [action |-> "checkpoint", vm |-> "", node |-> "n1", session |-> "", had_vm |-> FALSE, gate |-> FALSE, node_confirmed |-> FALSE, confirmed_by |-> ""]
    >>

INVARIANT TraceWellFormed
INVARIANT NoDestroyBeforeConfirm
INVARIANT NoDoubleAssign
