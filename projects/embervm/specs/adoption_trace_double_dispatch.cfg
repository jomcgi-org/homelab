\* Negative fixture window for adoption_trace.tla: the double-dispatch
\* deviation from the #6415 acceptance (the same vm_id dispatched twice with
\* no intervening consumption). TLC must reject this window naming
\* NoDoubleAssign. NoDestroyBeforeConfirm stays satisfied (no confirms at
\* all), so the failure names exactly one invariant. The window lives in the
\* spec (DoubleDispatchWindow); the .cfg selects it by name.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Fixture = "double_dispatch"
    LiveTrace = {}
    MinTraceEvents = 4

INVARIANT TraceWellFormed
INVARIANT NoDestroyBeforeConfirm
INVARIANT NoDoubleAssign
