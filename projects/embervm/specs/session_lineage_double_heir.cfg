\* NEGATIVE: the heir claim is only volatile. Reserve heir1, crash the CP (the
\* worker survives but the claim vanishes), restart, reserve heir2, then finish
\* both from the completed export. NeverTwoLiveHeirs must fail.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {heir1, heir2}
    Nodes = {node1, node2}
    Predecessor = predecessor
    SourceNode = node1
    TargetNode = node2
    MaxGeneration = 1
    MaxCPCrashes = 1
    MaxNodeCrashes = 0
    SafeRelease = TRUE
    ExclusiveHeirGuard = FALSE
    TerminalPredecessorGuard = TRUE
    ReconnectComparison = TRUE

INVARIANT TypeOK
INVARIANT NeverTwoLiveHeirs
