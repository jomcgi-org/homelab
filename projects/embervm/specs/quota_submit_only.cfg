\* NEGATIVE mode (D12.3): DispatchGate = FALSE models the rejected
\* submit-only protocol. Reachable violating trace: p1 has budget 1 and zero
\* usage; three Submit(p1) actions pass because usage moves only on completion
\* and all three tasks queue. Three DispatchTick(p1) actions dispatch them
\* without a dispatch gate, and three Complete(p1) actions make durable[p1] = 3.
\* The bound is Budget(p1) + InflightShare * TaskCost = 1 + 1 * 1 = 2, so
\* OvershootBounded is violated. With the gate enabled, the first completion
\* makes charged[p1] = 1 and the remaining queued tasks park.
\*
\* MaxCrashes = 0 here, unlike the two positive cfgs. Removing the dispatch gate
\* also removes the dispatch-side fail-closed check, so with a reachable cache
\* outage this cfg would trip BOTH OvershootBounded and FailClosedDeny, and which
\* one TLC names first would be an artifact of invariant order. Disabling the
\* crash makes cacheUp permanently TRUE, so FailClosedDeny holds trivially and
\* can stay in the checked set below: the cfg then isolates exactly one guard and
\* trips exactly one invariant, the same surgical shape as adoption_wedge.cfg and
\* bank_relight_regress.cfg. The overshoot trace above needs no crash to reach.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Principals = {p1, p2}
    Budgets = 1
    QuotaPrincipal = p1
    NULL = NULL
    TaskCost = 1
    QueueDepthCap = 3
    InflightShare = 1
    MaxSubmits = 3
    MaxCrashes = 0
    MaxDays = 1
    DispatchGate = FALSE

INVARIANT TypeOK
INVARIANT FailClosedDeny
INVARIANT OptInNeverDenies
INVARIANT ZeroBudgetNeverDispatches
INVARIANT CacheNeverExceedsDurable
INVARIANT OvershootBounded
INVARIANT DenialAudited
