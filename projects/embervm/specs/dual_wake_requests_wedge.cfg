\* Liveness negative wedge: SilentFailure = TRUE swallows transport failures
\* into "silent", so a parked request never reaches delivered or failed and
\* RequestsResolve FAILS. Same one-request/one-outage/one-crash bound as
\* dual_wake_liveness.cfg, so the only difference is the switch. tlc.sh runs
\* this in expectation "fail" with no named invariant (temporal violations
\* name no invariant): a passing run would mean the model went blind to the
\* silent-failure wedge. Observed Linux 2-worker result with the pinned toolchain:
\* temporal RequestsResolve violated, 87,487 generated / 20,832 distinct /
\* 2,740 left on queue, 16-state counterexample.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    MaxRequests = 1
    MaxLeaves = 1
    MaxFailures = 1
    Witness = "none"
    WrongWinner = FALSE
    UnownedPublish = FALSE
    ReapActivator = FALSE
    EarlyRegister = FALSE
    SilentFailure = TRUE
    Leak = FALSE
    SkipOriginGuard = FALSE
    OrphansFirst = FALSE

PROPERTY RequestsResolve
