\* NEGATIVE: BeginInheritance may claim a live predecessor. The history ghost
\* records the forbidden inheritance immediately, so the intended
\* InheritanceOnlyFromTerminal invariant must fail without relying on another
\* guard or error.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {heir1, heir2}
    Nodes = {node1, node2}
    Predecessor = predecessor
    SourceNode = node1
    TargetNode = node2
    MaxGeneration = 1
    MaxCPCrashes = 0
    MaxNodeCrashes = 0
    SafeRelease = TRUE
    ExclusiveHeirGuard = TRUE
    TerminalPredecessorGuard = FALSE
    ReconnectComparison = TRUE

INVARIANT TypeOK
INVARIANT InheritanceOnlyFromTerminal
