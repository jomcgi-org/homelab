\* NEGATIVE mode (2026-10-10 failed creates): WalkFrontier = FALSE and
\* RetryableDenial = FALSE are placement making one attempt and surfacing a
\* noded refusal as a terminal failure. noded's gate stays atomic and
\* reserved, so nothing overcommits; the loss is liveness. Reachable
\* violating trace: the unclaimed lane boots r1 on an empty brick, and the CP
\* places r2 on the same brick from the same report (r1 left no claim to
\* debit). r2's boot reaches noded in the instant after r1's driver call
\* returned and before its ticket was released, when r1 counts in both the
\* live map and the ledger, so noded refuses it, and r2 fails although two
\* other bricks are empty. Any refusal of a satisfiable request does the
\* same: a claim hold that expires before the report counting its VM
\* arrives, or two placers racing one report.
\*
\* NoStrandedRequest is the safety reformulation of EventuallyPlaced, so the
\* driver can name the violated invariant. Only TypeOK and it are checked.
\* Every other constant matches admission.cfg.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Bricks = {b1, b2, b3}
    Requests = {r1, r2, r3}
    UnclaimedRequests = {r1}
    LargeRequests = {r3}
    SmallSize = 2
    LargeSize = 3
    Budget = 6
    Overhead = 1
    Floor = 2
    MaxBootFails = 1
    NULL = NULL
    AdmitReserved = TRUE
    AtomicAdmit = TRUE
    LazyGrowth = TRUE
    WalkFrontier = FALSE
    RetryableDenial = FALSE

SYMMETRY BrickSymmetry

INVARIANT TypeOK
INVARIANT NoStrandedRequest
