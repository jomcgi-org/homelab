\* POSITIVE liveness mode: under FairSpec the shipped protocol places every
\* request an empty brick admits, drains every claim row, and releases every
\* ticket. Each brick holds one guest and there are three requests, so one
\* must wait for a destroy; r1's lane writes no claim, so placements herd
\* and noded refuses some of them; reports lag arbitrarily. Every refusal is
\* walked past or retried, and EventuallyPlaced holds.
\*
\* Lean bounds, because the liveness tableau is the expensive part: two
\* bricks, equal sizes, no lazy growth and no boot failure (admission.cfg
\* checks the failure path's ticket and claim release). Floor = Overhead,
\* so the observed guard never binds tighter than the reserved term and
\* growth could not change an admission. No symmetry: TLC's symmetry
\* reduction is unsound for liveness.
SPECIFICATION FairSpec

CHECK_DEADLOCK FALSE

CONSTANTS
    Bricks = {b1, b2}
    Requests = {r1, r2, r3}
    UnclaimedRequests = {r1}
    LargeRequests = {}
    SmallSize = 2
    LargeSize = 3
    Budget = 3
    Overhead = 1
    Floor = 1
    MaxBootFails = 0
    NULL = NULL
    AdmitReserved = TRUE
    AtomicAdmit = TRUE
    LazyGrowth = FALSE
    WalkFrontier = TRUE
    RetryableDenial = TRUE

PROPERTY EventuallyPlaced
PROPERTY ClaimsDrain
PROPERTY TicketsEventuallyReleased
