\* NEGATIVE mode: the pre-PR-#3770 generation regression. MonotonicFloor = FALSE
\* removes the stored-generation floor, so a LAGGING node volume report (a node
\* still reporting the pre-bank generation, or a co-located sibling brick's stale
\* view) rewinds the stored pair-key generation below a value it already reached.
\* GenerationNeverRegresses (storedGen >= its high-water mark) then FAILS: this is
\* the recurring demo-postgres pair_broken flap root cause, which the monotonic
\* floor fixed. tlc.sh runs this in expectation "fail": a passing run would mean
\* the model went blind to the regression the floor guards against.
\*
\* Reachable trace (MaxGen = 3): StartFresh -> running (volGen=storedGen=1); Write
\* -> volGen=2; NodeReportLagging g=2, UpsertVolume -> storedGen=2 (HW=2);
\* NodeReportLagging g=1 (a lagging pre-bank report), UpsertVolume with no floor ->
\* storedGen=1 < HW=2: GenerationNeverRegresses violated.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    MaxGen = 3
    MonotonicFloor = FALSE
    Isolated = FALSE
    NULL = NULL

INVARIANT TypeOK
INVARIANT GenerationNeverRegresses
INVARIANT NoStaleRelight
INVARIANT SingleUseNeverReused
INVARIANT NoDestroyBeforeConfirm
