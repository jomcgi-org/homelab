\* Negative mode: the dispatch restart wedge. AdoptionEnabled = FALSE removes the
\* adopt_inventory reconcile, so a control-plane crash strands the node's primed
\* pool (the CP loses inventory on crash and never relearns the running VMs), and a
\* queued task never reaches assigned across the restart: EventuallyDispatched
\* FAILS. Same lean bounds as adoption_liveness.cfg (its adoption-on twin), so the
\* only difference is the switch: adoption on dispatches, adoption off wedges.
\* tlc.sh runs this in expectation "fail": a passing run would mean the model went
\* blind to the historical wedge.
SPECIFICATION FairSpec

CHECK_DEADLOCK FALSE

CONSTANTS
    Nodes = {n1}
    VMs = {v1, v2}
    Tasks = {t1}
    Principals = {p1}
    NULL = NULL
    AdoptionEnabled = FALSE
    ForgetBeforeKill = TRUE
    AgingEnabled = FALSE
    MaxCPCrashes = 1
    MaxNodeCrashes = 0
    MaxGen = 2

PROPERTY EventuallyDispatched
