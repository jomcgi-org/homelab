\* NEGATIVE: reconnect omits the common-ancestor generation comparison. Export
\* gen 0, disconnect source, restore heir, mutate both branches to gen 1, then
\* reconnect. The model records a silent merge and the intended
\* ReconnectDetectsDivergence invariant must fail.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {heir1, heir2}
    Nodes = {node1, node2}
    Predecessor = predecessor
    SourceNode = node1
    TargetNode = node2
    MaxGeneration = 1
    MaxCPCrashes = 0
    MaxNodeCrashes = 1
    SafeRelease = TRUE
    ExclusiveHeirGuard = TRUE
    TerminalPredecessorGuard = TRUE
    ReconnectComparison = FALSE

INVARIANT TypeOK
INVARIANT ReconnectDetectsDivergence
