\* Source-conformance negative for heir exclusivity. SessionManager's claim is
\* process memory. A CP crash clears it while an admitted worker may still
\* finish; recovery admits a second contender. The intended counterexample is
\* NeverTwoLiveHeirs, and it is the only configured invariant.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {h0, h1, h2}
    NULL = NULL
    MaxGeneration = 3
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    RequireExportCompletion = TRUE
    RequireDurableRelinquish = TRUE
    DurableHeirClaim = FALSE
    RequireTerminalPredecessor = TRUE
    CompareGenerationOnReconnect = TRUE

INVARIANT NeverTwoLiveHeirs
