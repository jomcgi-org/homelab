\* SAFETY mode (positive): the shipped quota protocol enforces the same
\* fail-closed, opt-in gate at submit and dispatch. p1 has a daily budget;
\* p2 has no budget and must remain allowed even while the Metering cache is
\* absent. The seven invariants include the bounded in-flight overshoot rule.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Principals = {p1, p2}
    Budgets = 1
    QuotaPrincipal = p1
    NULL = NULL
    TaskCost = 1
    QueueDepthCap = 3
    InflightShare = 1
    MaxSubmits = 3
    MaxCrashes = 1
    MaxDays = 1
    DispatchGate = TRUE

INVARIANT TypeOK
INVARIANT FailClosedDeny
INVARIANT OptInNeverDenies
INVARIANT ZeroBudgetNeverDispatches
INVARIANT CacheNeverExceedsDurable
INVARIANT OvershootBounded
INVARIANT DenialAudited
