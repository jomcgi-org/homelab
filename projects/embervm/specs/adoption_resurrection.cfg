\* Negative mode: the forget-before-kill straggler resurrection. ForgetBeforeKill
\* = FALSE models the buggy ordering, where a node killed on the down-edge did NOT
\* have its streamer pid forgotten first, so a straggler NodeStatus already on the
\* wire (tagged with the last-known generation) is still ACCEPTED by RecvStatus and
\* drives the just-declared-down node back to "healthy". Only NoResurrection is
\* checked (a safety invariant, so the plain Spec, no liveness fairness, keeps the
\* search fast); it MUST fail. tlc.sh runs this in expectation "fail": a passing run
\* would mean the model no longer detects the D-R2.7.2 straggler bug.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Nodes = {n1}
    VMs = {v1, v2}
    Tasks = {t1, t2}
    Principals = {p1, p2}
    NULL = NULL
    AdoptionEnabled = TRUE
    ForgetBeforeKill = FALSE
    AgingEnabled = TRUE
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    MaxGen = 2

INVARIANT NoResurrection
