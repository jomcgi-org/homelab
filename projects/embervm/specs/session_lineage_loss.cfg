\* NEGATIVE: release may precede both the durable relinquish marker and export.
\* BeginInheritance; ReleaseSource reaches no local volume and no completed S3
\* export, so the intended NoWorkspaceLoss invariant must fail.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {heir1, heir2}
    Nodes = {node1, node2}
    Predecessor = predecessor
    SourceNode = node1
    TargetNode = node2
    MaxGeneration = 1
    MaxCPCrashes = 0
    MaxNodeCrashes = 0
    SafeRelease = FALSE
    ExclusiveHeirGuard = TRUE
    TerminalPredecessorGuard = TRUE
    ReconnectComparison = TRUE

INVARIANT TypeOK
INVARIANT NoWorkspaceLoss
