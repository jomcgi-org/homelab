\* NEGATIVE mode: AtomicAdmit = FALSE drops noded's mutex between reading
\* the admission facts and taking the ticket, so two concurrent boots can
\* both pass against one reading. The reserved model and every other guard
\* stay on. Reachable violating trace: the unclaimed lane places r1 on an
\* empty brick and writes no claim, so the CP still sees the whole brick and
\* places the large r3 there too. Both checks read the empty brick (4 units
\* admittable after the floor) and pass, both reserve, and the brick has
\* committed 2 + 1 + 3 + 1 = 7 > 6. With the atomic gate the second check
\* sees the first ticket and refuses.
\*
\* Only TypeOK and NoOvercommit are checked, so ResidentWithinBudget (which
\* the same overcommit breaks later, once the guests grow) cannot answer for
\* it. Every other constant matches admission.cfg.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Bricks = {b1, b2, b3}
    Requests = {r1, r2, r3}
    UnclaimedRequests = {r1}
    LargeRequests = {r3}
    SmallSize = 2
    LargeSize = 3
    Budget = 6
    Overhead = 1
    Floor = 2
    MaxBootFails = 1
    NULL = NULL
    AdmitReserved = TRUE
    AtomicAdmit = FALSE
    LazyGrowth = TRUE
    WalkFrontier = TRUE
    RetryableDenial = TRUE

SYMMETRY BrickSymmetry

INVARIANT TypeOK
INVARIANT NoOvercommit
