\* POSITIVE safety model (issue #4705): one durable session-workspace lineage
\* and one two-ref disposable stateful namespace, racing an unbounded number of
\* warmth-GC sweeps that may abort or be interrupted at any point. Every guard
\* is on. TLC must drain the full queue; a truncated search is not a pass.
\* Assumptions A1-A8 are stated in warmth_gc.tla's header.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Refs = {ref1, ref2}
    NewestRef = ref2
    ReferenceGuard = TRUE
    ExpiryGuard = TRUE
    AgeFloorGuard = TRUE
    AbortGuard = TRUE
    RestorePresenceGuard = TRUE
    NewestRefGuard = TRUE
    FleetRevalidationGuard = TRUE

INVARIANT TypeOK
INVARIANT NoProtectedDeletion
INVARIANT NoSilentEmptyResume
INVARIANT NoDeleteOnInconsistentInventory
INVARIANT EligibilityRequiresExpiryAndAge
INVARIANT NewestStatefulRetainedWhileLive
