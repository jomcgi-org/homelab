\* Source-conformance negative for the handoff ordering itself. The control
\* plane may terminalize independently of the asynchronously spawned
\* RetireVolume RPC, so a successor can begin before the durable marker exists.
\* The intended counterexample violates DurableRelinquishBeforeHandoff only.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Heirs = {h0, h1, h2}
    NULL = NULL
    MaxGeneration = 3
    MaxCPCrashes = 1
    MaxNodeCrashes = 1
    RequireExportCompletion = TRUE
    RequireDurableRelinquish = FALSE
    DurableHeirClaim = TRUE
    RequireTerminalPredecessor = TRUE
    CompareGenerationOnReconnect = TRUE

INVARIANT DurableRelinquishBeforeHandoff
