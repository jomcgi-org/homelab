\* SAFETY mode (positive), zero-budget lane: p1 is explicitly configured
\* with a hard-stop budget of zero, while p2 remains unconfigured and allowed.
\* No p1 task can dispatch or complete, so ZeroBudgetNeverDispatches is
\* exercised non-vacuously. The cache crash and restart still exercise the
\* scoped fail-closed and opt-in behavior.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Principals = {p1, p2}
    Budgets = 0
    QuotaPrincipal = p1
    NULL = NULL
    TaskCost = 1
    QueueDepthCap = 3
    InflightShare = 1
    MaxSubmits = 3
    MaxCrashes = 1
    MaxDays = 1
    DispatchGate = TRUE

INVARIANT TypeOK
INVARIANT FailClosedDeny
INVARIANT OptInNeverDenies
INVARIANT ZeroBudgetNeverDispatches
INVARIANT CacheNeverExceedsDurable
INVARIANT OvershootBounded
INVARIANT DenialAudited
