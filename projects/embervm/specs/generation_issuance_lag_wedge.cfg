\* NEGATIVE mode: the pre-ADR-embervm/014 fenced-writer deadlock. AdoptFencedWriter
\* = FALSE removes the anchor-adoption branch, modeling the naive R7 fence that
\* quarantined ANY forward-unblessed report. Reachable trace (MaxGen = 3):
\* RequestWake; CrashCP before any bless; ActivatorWake finds no grant and takes
\* the unblessable self-bump fallback (ledger 1 -> 2, blessed marker left
\* behind, exactly +1 on the same vm_id); RestartCP; ReportVolume(2, FALSE, n1);
\* FoldReport: forward-unblessed, NO checkpoint context, reporter IS the anchor:
\* with adoption off, the volume QUARANTINES. The brick ledger legitimately ran
\* ahead of the CP watermark (the CP-roll lag shape), the fence read it as
\* split-brain, NoFalseQuarantine's lag half trips (falseQuarantineLag), and a
\* quarantined volume can never wake so it can never re-bless to catch up: the
\* recurring demo-postgres quarantine after a CP roll that commit 1fb15264f
\* fixed by adopting instead of deadlocking. tlc.sh runs this in expectation
\* "fail": a passing run would mean the model went blind to that bug.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Nodes = {n1}
    AnchorNode = n1
    MaxGen = 3
    LeaseSize = 1
    GrantExpires = TRUE
    AutoHealEnabled = TRUE
    AdoptFencedWriter = FALSE
    MaxCPCrashes = 1
    MaxAutoAborts = 0
    MaxRogueReports = 0
    MaxWakes = 1
    AdversarialReports = TRUE
    NULL = NULL

INVARIANT TypeOK
INVARIANT WatermarkNeverRegresses
INVARIANT NoServeQuarantined
INVARIANT NoFalseQuarantine
INVARIANT LeaseWellFormed
