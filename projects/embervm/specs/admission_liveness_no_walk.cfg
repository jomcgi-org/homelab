\* POSITIVE liveness mode, frontier walk OFF: WalkFrontier = FALSE is
\* EMBERVM_PLACEMENT_RETRY unset, the chart default the deploy values keep,
\* so a refusal ends the attempt. It stays a retryable :capacity denial
\* (Embervm.Retry.classify/3), and the request is placed later. This pins
\* which guard liveness rests on: the retryable denial, not the walk, which
\* only saves a round trip. admission_single_attempt.cfg turns the denial
\* terminal too and strands a request. Every other constant matches
\* admission_liveness.cfg.
SPECIFICATION FairSpec

CHECK_DEADLOCK FALSE

CONSTANTS
    Bricks = {b1, b2}
    Requests = {r1, r2, r3}
    UnclaimedRequests = {r1}
    LargeRequests = {}
    SmallSize = 2
    LargeSize = 3
    Budget = 3
    Overhead = 1
    Floor = 1
    MaxBootFails = 0
    NULL = NULL
    AdmitReserved = TRUE
    AtomicAdmit = TRUE
    LazyGrowth = FALSE
    WalkFrontier = FALSE
    RetryableDenial = TRUE

PROPERTY EventuallyPlaced
PROPERTY ClaimsDrain
PROPERTY TicketsEventuallyReleased
