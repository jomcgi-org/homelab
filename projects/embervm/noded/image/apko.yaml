# Runtime image for the embervm-noded daemon. Wolfi base with ca-certificates
# (TLS to the in-cluster apiserver / OTLP) and busybox (a shell for in-pod
# debugging). The Go daemon binary is layered at /usr/local/bin/embervm-noded and
# firecracker, jailer, snapshot-editor and guest kernel are baked at /opt/fc
# from the amd64 @kata_firecracker bundle. The host supplies /dev/kvm and scratch.
#
# LEAN by design: the daemon's driver boots one shared rootfs READ-ONLY per
# microVM (the fc-invoke warm-base pattern, provisioner disabled), so it never
# execs dmsetup. The devmapper CoW provisioner (ADR 026) is dead code at runtime
# here; if it is ever enabled for noded, add lvm2 + util-linux back (fc-invoke's
# base carries them for that mode).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - busybox
    # iproute2 (ip) and nftables (nft) drive serving-class VM networking (R3): the
    # daemon execs them to create the per-node bridge, one tap per serving VM, IP
    # assignment, and the ingress-only nftables posture on the bridge. Task/session
    # VMs are vsock-only and never touch these; they are dormant until the first
    # StartServing. The daemon already runs privileged (uid 0) for Firecracker's
    # /dev/kvm and mount-namespace re-exec, so the CAP_NET_ADMIN these need is
    # already granted, no new capability. See projects/embervm/noded/serving.
    - iproute2
    - nftables

archs:
  - x86_64

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

entrypoint:
  command: /usr/local/bin/embervm-noded
