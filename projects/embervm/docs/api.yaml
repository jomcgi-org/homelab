# EmberVM submit API (Task 8, invocation front-end). Hand-written contract; this
# is what the monolith scan client (Task 15) programs against. Served by the
# control plane on :8080 behind the cluster Service. Management /v1 paths require
# a bearer token authenticated by Kubernetes TokenReview against the allow-list.
# Two exception classes authenticate in-handler instead: the node routes
# (/v1/nodes/register, /v1/artifacts/wrap) verify the noded ServiceAccount (NOT
# the task-submit allow-list), and session invoke verifies a per-session
# capability. See router.ex authenticate/2 for the closed route list.
openapi: 3.1.0
info:
  title: EmberVM Submit API
  version: v1
  description: >-
    Durable, fair, retried task execution over the Firecracker fleet. A task is
    one HTTP request to a guest: the submit body is forwarded verbatim as the
    guest request body. R0 has no dispatcher yet, so submitted tasks sit queued;
    the async submit + task/result/DLQ surface is the stable contract.
servers:
  - url: http://embervm.embervm.svc.cluster.local:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness/readiness probe (unauthenticated).
      security: []
      responses:
        "200":
          description: OK.
          content:
            text/plain:
              schema: { type: string, example: ok }
  /v1/workloads/{name}/tasks:
    post:
      summary: Submit a task to a workload.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - name: wait
          in: query
          required: false
          schema: { type: boolean }
          description: >-
            When true, park the request until the task reaches a terminal state
            or the sync timeout elapses, then return the guest response directly.
            When false/absent, return 202 immediately with the task id.
      requestBody:
        description: >-
          Forwarded verbatim as the guest request body (max 8 MiB). Content-Type
          is forwarded. Headers prefixed X-Ember-Guest- are stripped of the
          prefix and forwarded to the guest; no other caller header reaches it.
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      parameters_headers_note: >-
        X-Ember-Guest-Path overrides the guest path (default spec.source.invokePath).
        Idempotency-Key dedupes a resubmit to the existing task for its result TTL.
      responses:
        "202":
          description: Accepted (async), or sync wait timed out with work still in flight.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRef" }
        "200":
          description: Sync wait completed; body is the guest response (untruncated).
        "413": { description: Body exceeds 8 MiB. }
        "429":
          description: Per-principal sync-wait park cap exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Missing or invalid bearer token. }
        "403": { description: Authenticated ServiceAccount not in the allow-list. }
        "502": { description: Sync wait settled non-successfully (dead-lettered). }
  /v1/tasks/{id}:
    get:
      summary: Task state and metadata.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Task view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "404": { description: No such task. }
  /v1/tasks/{id}/result:
    get:
      summary: Stored task result (until its TTL).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: >-
            The stored guest response body, at the guest status code. The
            X-Ember-Truncated header is true when the stored copy was capped at
            the workload resultMaxBytes.
        "404": { description: No result (task never ran or the TTL expired). }
  /v1/workloads/{name}/dead-letters:
    get:
      summary: Paged dead-letter queue listing for a workload.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: DLQ page (newest first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadLetterPage" }
  /v1/tasks/{id}/redrive:
    post:
      summary: Re-queue a dead-lettered task (attempt counter reset, audited).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Redriven; task is queued again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "404": { description: No such task. }
        "409": { description: Task is not dead-lettered. }
  /v1/workloads/{name}/sessions:
    post:
      summary: Create a stateful session on a session-class workload (management auth).
      description: >-
        Assigns a primed pristine VM from the pool (principal-bound at claim) and
        returns a per-session capability token EXACTLY ONCE. The invocation
        front-end never computes placement; the control plane owns node choice.
        An optional Idempotency-Key makes the create an upsert (#4919): the
        first create binds the key to the new session per principal; a retry
        with the same key answers 200 with the SAME live session's current state
        and NO token (the capability was returned once, at the original create);
        a key whose session went terminal answers 409 rather than silently
        minting a fresh session. Keys are 1..200 bytes of printable ASCII,
        scoped per principal, and their binding lives as long as the session's
        durable row (retention of a terminal session eventually frees its key).
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: >-
            Client-supplied dedupe key, unique per principal (two principals may
            reuse one key independently). Deterministic workflow keys such as
            swarm/{run_id}/{node_id} make a retried step's create an upsert and
            let a crash between spawn and record recover the existing session;
            GET ?idempotency_key= queries the binding directly.
      responses:
        "201":
          description: Session created. The session_token is returned only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "200":
          description: >-
            Same-key retry against an existing LIVE session (idempotent replay).
            Carries the session's current identity and replayed: true, never a
            session_token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReplayed" }
        "400":
          description: Malformed or oversized Idempotency-Key (>200 bytes or non-printable ASCII).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { description: Workload is not class session, or the caller is not allow-listed. }
        "404": { description: Unknown workload. }
        "409":
          description: >-
            The Idempotency-Key is bound to a TERMINAL session (destroyed,
            expired, evicted, failed). Mint a new key to create again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            Create denied: session cap (live+banked+parked >= maxSessions), workload
            cap (live, VM-holding, >= concurrency.cap), daily quota exhausted, or no
            ready capacity. The reason field distinguishes them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: Paged listing of a workload's sessions, newest first (management auth).
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - name: idempotency_key
          in: query
          required: false
          schema: { type: string }
          description: >-
            Query by create key instead of paging: resolves the single session
            bound to (your principal, this key), empty page when unbound. Scoped
            to the caller's principal; another principal's bindings are invisible.
      responses:
        "200":
          description: Session page (a single-item page when idempotency_key is present).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
  /v1/sessions/{id}/invoke:
    post:
      summary: Invoke a session (SESSION TOKEN auth only; a management token is rejected).
      description: >-
        The bearer token MUST be this session's own capability token. The request
        body is forwarded verbatim to the guest (max 8 MiB); X-Ember-Guest-Path
        overrides the guest path and X-Ember-Guest-* headers are forwarded (prefix
        stripped). The guest response is returned VERBATIM including its headers.
        Sync-only, at-most-once, never retried by the platform.
      security:
        - sessionToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: The guest response, returned verbatim (any status the guest returns). }
        "401": { description: Missing session token. }
        "403": { description: Invalid session token (including a management token). }
        "409": { description: Session not ready (creating/banking/relighting). }
        "410":
          description: Session is terminal (expired/evicted/destroyed/failed); create a fresh one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { description: Body exceeds 8 MiB. }
        "429": { description: Per-session invoke queue is full. }
        "502": { description: The invoke failed at the daemon; the session is now failed. }
  /v1/sessions/{id}:
    get:
      summary: Session state and metadata (management OR the session's own token).
      security:
        - bearerAuth: []
        - sessionToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Session view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "401": { description: Missing bearer token. }
        "403": { description: Not authorized to read this session. }
        "404": { description: No such session. }
    delete:
      summary: Destroy a session (management auth); its VM and/or snapshot are reclaimed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Destroyed (idempotent for an already-terminal session). }
        "404": { description: No such session. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionToken:
      type: http
      scheme: bearer
      description: >-
        A per-session capability token, minted at create and returned once. It
        authenticates exactly one session id (verified by hash, constant-time) and
        never enters the guest. Distinct from the management ServiceAccount bearer.
  schemas:
    TaskRef:
      type: object
      properties:
        task_id: { type: string }
        state: { type: string }
    TaskView:
      type: object
      properties:
        task_id: { type: string }
        workload: { type: string }
        principal: { type: string }
        state:
          type: string
          enum: [queued, assigned, running, succeeded, failed_retryable, failed_permanent, dead_lettered]
        attempt: { type: integer }
        submitted_at: { type: integer, description: epoch ms }
        updated_at: { type: integer, description: epoch ms }
    DeadLetterPage:
      type: object
      properties:
        workload: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/TaskView" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
        task_id: { type: string }
        session_id: { type: string }
        reason: { type: string, description: Machine-readable denial/error reason. }
        retryable: { type: boolean }
    SessionCreated:
      type: object
      properties:
        session_id: { type: string, description: "s-<26-char ULID>." }
        session_token:
          type: string
          description: The per-session capability token. Returned ONCE; store it as a secret.
        expires_at: { type: integer, description: "Max-lifetime deadline, epoch ms." }
        base_digest: { type: string, description: The birth base the session is pinned to. }
        state: { type: string, enum: [running] }
    SessionReplayed:
      type: object
      description: >-
        The response body of a same-key idempotent retry (#4919): the existing
        session's current state. No session_token field exists here by design;
        the capability was returned once, on the original 201.
      properties:
        session_id: { type: string }
        lineage_id: { type: string }
        expires_at: { type: integer, description: epoch ms }
        base_digest: { type: string }
        state: { type: string, description: The session's current FSM state (e.g. running). }
        restored: { type: boolean, enum: [false] }
        replayed: { type: boolean, enum: [true] }
    SessionView:
      type: object
      properties:
        session_id: { type: string }
        workload: { type: string }
        principal: { type: string }
        state:
          type: string
          enum: [creating, running, banking, banked, relighting, expired, evicted, destroyed, failed]
        generation: { type: integer, description: Increments on every bank (lineage). }
        base_digest: { type: string }
        created_at: { type: integer, description: epoch ms }
        last_invoke_at: { type: integer, description: epoch ms }
        expires_at: { type: integer, description: epoch ms }
        updated_at: { type: integer, description: epoch ms }
        terminal_reason: { type: string, description: Set once the session is terminal. }
    SessionPage:
      type: object
      properties:
        workload: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionView" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
