apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: embervm-standalone
value: -1000
globalDefault: false
description: Disposable priority for standalone EmberVM node workloads.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embervm-minio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: embervm-minio
spec:
  selector:
    app.kubernetes.io/name: embervm-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embervm-minio
  labels:
    app.kubernetes.io/name: embervm-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: embervm-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embervm-minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: embervm-store
                  key: access_key_id
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: embervm-store
                  key: secret_access_key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: embervm-minio
        - name: tmp
          emptyDir: {}
