contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    # JavaScript compute runtime (issue #4981). Node rather than deno or bun:
    # the repo already builds on nodejs (projects/monolith/frontend pins
    # nodejs-22), so the runtime is one the rest of the tree already tracks.
    # There is no npm install path here, and there could not be: the guest has
    # no network, so a snippet gets the Node standard library and nothing else.
    - nodejs-24

archs:
  - x86_64

accounts:
  groups:
    - groupname: sandbox
      gid: 65532
  users:
    - username: sandbox
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /home/sandbox

paths:
  - path: /home/sandbox
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/local/bin/sandbox-guest-init
