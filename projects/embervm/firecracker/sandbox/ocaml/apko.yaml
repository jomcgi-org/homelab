contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    # OCaml compute runtime (issue #4981). Snippets run through the bytecode
    # script path (`ocaml main.ml`), which needs no assembler, no linker, and no
    # build system, so this image stays small and starts fast.
    - ocaml
    # findlib supplies topfind, so a script can `#require` a bundled library
    # from the toplevel. ocaml-dune is deliberately NOT installed: a build
    # system earns nothing for a single-file snippet with no dependencies to
    # resolve (and nothing to resolve them from, since the guest has no
    # network).
    - ocamlfind

archs:
  - x86_64

accounts:
  groups:
    - groupname: sandbox
      gid: 65532
  users:
    - username: sandbox
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /home/sandbox

paths:
  - path: /home/sandbox
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/local/bin/sandbox-guest-init
