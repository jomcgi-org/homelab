# Cluster-specific overrides for the EmberVM control plane. The image tag is
# pinned into the chart at build time (helm_chart images=), so it is not set
# here. Defaults in the chart are sized small to start (historical 7-day peak
# resizing later).
# ENOSPC orphan reclaim (#4458). DISARMED deliberately: land it, wait for a
# brick to hit ENOSPC, read the dry-run manifest it logs ("WOULD DELETE ...
# would_free_bytes=N"), and arm only once that manifest names what you expect.
# Same sequence baseRetention was armed by.
#
# Arming deletes abandoned build intermediates only (rootfs-*.ext4.tmp.* from a
# dead bake, bases/*.building from a dead SnapshotBase), never a published rootfs
# or base, and never anything younger than the min age. Rollback is setting this
# back to "" and bumping the chart.
rootfsReclaim:
  # ARMED (#4981). Checked before arming that no brick held a reclaimable
  # orphan (no *.tmp.* and no *.building under the noded scratch on either a
  # master brick or node-4), so this arms an EMPTY path: it deletes nothing
  # today and only acts the first time a bake dies mid-write. Arming a
  # deletion path while it has nothing to delete is the safe moment.
  #
  # It matters more now: six sandbox rootfs bakes per brick (ADR agents/057)
  # is six more chances to die mid-write and strand an intermediate, and the
  # deadlock it breaks is self-sustaining (a full scratch stops noded, which
  # stops the retention sweep from reaching the node at all).
  enabled: "1"

# Node-confirmed destroy ordering (ADR embervm/014 decision 5, #4758). ARMED
# 2026-08-22. With the gate on, a destroy records a durable destroying intent,
# runs the node-confirmed teardown RPC, and records destroyed ONLY when the
# node confirms; an unconfirmed attempt leaves the session in :destroying for
# the reconcile loop to re-drive (fail closed), instead of the legacy
# tear-down-locally-then-record ordering.
#
# The chart's arming contract asked for dev to exercise the ordering first.
# Met by the embervm-dev drill of 2026-08-22 (chart 0.27.4): create -> destroy
# ran the full gate-on lifecycle live, including the fail-closed unconfirmed
# -> left-:destroying -> reconcile-confirm path; evidence is on issue #4758.
# ADR 034's harness lane remains future work and is not a dependency of this
# flip. Costs one control-plane roll (Recreate); prod destroys are unaffected
# while no session is being destroyed.
#
# Rollback: set back to false and bump the chart.
nodeConfirmedDestroy: true

opLog:
  # Postgres op-log tier (ADR embervm/007), hosted as its own database on the
  # existing monolith-pg CNPG cluster. This retires the node-pinned RWO SQLite
  # PVC: the durable store becomes network-reachable, so the control plane is no
  # longer tied to whichever node holds the Longhorn volume.
  #
  # The op-log starts EMPTY. Embervm.OpLog.Postgres runs its own DDL on first
  # boot and nothing migrates the SQLite file, which is the accepted trade
  # (execution history is not worth a migration; the durable book-of-record
  # rebuilds from node adoption on the next dial-home, and long-horizon audit
  # is available in the configured telemetry backend per ADR embervm/002).
  #
  # Still one replica with strategy: Recreate. Multi-replica needs ADR 007's
  # single-writer-per-cell op-log appender, which this does not deliver.
  postgres:
    enabled: true
    secretName: embervm-oplog-password
    onepassword:
      itemPath: vaults/k8s-homelab/items/embervm-oplog-db
  storageClass: longhorn
  # Ignored while postgres.enabled is true (no PVC is rendered). Kept so a
  # rollback is a single values flip, at the cost of coming back up with an
  # empty SQLite op-log.
  size: 2Gi
  # Op-log retention (ADR embervm/002): hourly bounded-batch sweep; ops-journal
  # prefix compaction past a 30-day horizon.
  sweepIntervalSeconds: 3600
  journalHorizonDays: 30

# TokenReview allow-list: ServiceAccount usernames permitted to submit tasks
# (Task 8). Empty means deny-all (fail-closed). In R0 the only entry is the
# control plane's own ServiceAccount, which lets an operator round-trip a live
# TokenReview-authed submit with `kubectl create token embervm -n embervm`; the
# real consumer SAs (the monolith semgrep scanner) are added at the Task 14/15
# side-by-side/shadow cutover, not here.
auth:
  # The control plane's own ServiceAccount is Helm-fullname-prefixed
  # (<release>-<chart> = embervm-embervm), so the principal TokenReview returns
  # is system:serviceaccount:embervm:embervm-embervm, not :embervm. This lets an
  # operator round-trip a live submit with `kubectl create token embervm-embervm
  # -n embervm`. Real consumer SAs (the monolith semgrep scanner) are added at
  # the Task 14/15 cutover.
  allowedServiceAccounts:
    - system:serviceaccount:embervm:embervm-embervm
    # The monolith ServiceAccount (Task 15): admits the monolith's semgrep_scan
    # client when SEMGREP_DISPATCH is flipped to embervm/shadow. Same SA the
    # monolith already uses to call fc-invoke. Added now so the dual-path code is
    # ready to authenticate the moment the flag flips; no traffic until then.
    - system:serviceaccount:monolith:monolith
    # The PUBLIC tier (Task 13): monolith-public runs in its own namespace as its
    # own fullname-prefixed SA, so jomcgi.dev/functions/<name> submits as this
    # principal. All public FaaS traffic shares this one SA, so the daily quota
    # below caps the entire public surface as the in-repo backpressure backstop.
    - system:serviceaccount:monolith-public:monolith-public

# Metering, audit, and quotas (Task 12). Quota is left OFF in R0 (opt-in, empty =
# no enforcement): per-principal daily vCPU-second budgets are set alongside the
# real consumer SAs at the Task 14/15 cutover, once real tasks actually run (no
# guest image exists to consume vCPU-seconds until Task 14). The usage-read admin
# is the control plane's own ServiceAccount, so an operator can read fleet-wide
# usage at GET /v1/usage?principal=; everyone else is self-scoped.
usageAdmins:
  - system:serviceaccount:embervm:embervm-embervm

# DISABLED (2026-08-09). This used to carry a 3600 daily vCPU-second budget on
# the monolith-public SA as the public FaaS backstop. It is removed because it
# protected nothing here and could only ever deny.
#
# What actually bounds the fleet is the per-workload `cap`, enforced in
# Dispatcher.drain_loop independently of the caller: no set of callers can put
# more concurrent VMs on a workload than its cap, so demo traffic cannot starve
# the cluster no matter who sends it. A daily vCPU-second budget adds nothing on
# top of that, because vCPU-seconds are not a cost this cluster pays; the
# machines are bought and running either way.
#
# What it DID add was a failure mode: all public traffic submits as this single
# SA, so the budget was one shared FCFS bucket. One visitor draining it denies
# every other visitor until the day rolls over.
#
# Measured before removing (control plane, 23h uptime, zero restarts, a full
# daily quota window): denials were
# %{quota: 0, principal_share: 0, cap: 0, no_capacity: 7, stale_capacity: 0}
# with queue_depth 0 on both bazel-query and semgrep, 562 warm hits / 3 misses.
# The quota had never fired, and `cap: 0` says the workload cap had never even
# been reached, so two callers have never contended for the same workload.
#
# An empty map is quota OFF, not deny-all: the gate is opt-in, and the chart
# template omits EMBERVM_QUOTA_VCPU_SECONDS entirely when the map is empty.
# Re-arm this only if `cap` or `principal_share` denials go nonzero, which is the
# point at which contention actually exists; note that a per-principal budget
# still cannot be fair between anonymous visitors, since they all share this SA.
quota:
  dailyVcpuSecondsPerPrincipal: {}

# OpenTelemetry tracing is disabled until this service explicitly opts in.
tracing:
  endpoint: ""
  serviceName: embervm-control

# Platform KEK root (ADR embervm/036, #4976), rollout step 1 for #4691.
# This only gives the control plane access to the existing 1Password item;
# artifact encryption and noded's writer remain disabled until the root is
# observed live. The secretKeyRef is optional, so a missing item leaves the
# custodian inert instead of blocking the control-plane rollout.
kekRoot:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/embervm-kek-root"

# Principal-artifact envelope encryption (ADR embervm/033, #4691), rollout
# step 2. The reader and capability validator already ran fleet-wide, and the
# production KEK root is Ready. The writer is armed, and an encrypted stateful
# bundle plus volume restored from S3 through a replacement brick before
# capability enforcement was enabled.
artifactEncryption:
  enabled: true

# Node capacity override (cluster-specific; the chart default of 8 is a
# conservative backstop). node-4 is a ~62Gi box (27% used), and the two platform
# pools alone (semgrep floor 4 + sandbox floor 4) consume all 8 default slots,
# leaving zero room for a zip-lane function workload (R1) to prime/miss. Lift the
# backstop to 16 so functions (og-image and peers, cap 4 each) have headroom; at
# ~1.5Gi/VM that is ~24Gi worst case, well within budget. This only raises the
# runaway backstop, not any pool floor.
noded:
  # RAISED from the chart's 60s. This bounds the readiness poll after a COLD
  # boot, which is the base build, and it has to be strictly greater than the
  # slowest thing the guest does before it reports ready.
  #
  # The claude-runtime guest prewarms its CLIs during a base build, and since
  # #5367 that prewarm actually completes an authenticated TLS init through the
  # egress proxy rather than failing fast on an untrusted certificate. Claude's
  # own init budget inside the shim is 60s. With this bound also at 60s the
  # build gave up at the same instant the init was allowed to finish, so
  # WaitReady could never observe a success: the guest was still working, and
  # /shim/ready was still honestly answering 503.
  #
  # 180s leaves real margin over that 60s init plus the CA fetch, the cold boot
  # and a node that may be baking other guests at the same time. It is a
  # DETECTOR for a guest that will never come up, not a budget to spend, so
  # overshooting costs nothing on a healthy build: readiness is polled, not
  # slept, and a good guest still reports in seconds.
  #
  # Keep this strictly above the shim's prewarm init_timeout. If that number
  # moves, this one moves first.
  firecracker:
    bootReadyTimeout: 180s
  # Ingress allow-list on every noded pod shape (#4693): gRPC from the control
  # plane, health from kubelet, activator from
  # serving-envoy and the CP, the serving DNAT range from serving-envoy. Dev has
  # run it since 0.25.1. Flipped in production on its own, ahead of the bearer
  # token, so a missed port shows up as a readiness or serving failure with one
  # cause to revert.
  # Ingress allow-list on every noded pod shape (#4693): gRPC from the control
  # plane, health from kubelet, activator 8081 and the
  # stateful/composite activator ranges (5400-5419, which noded binds by
  # default) from serving-envoy and the CP, the serving DNAT range from
  # serving-envoy. First enable on 2026-08-22 omitted the 5400-5419 ranges and
  # dropped the cold wake to noded:5401 (demo-postgres down 14 min); chart
  # 0.27.3 carries them. Re-enabled the same day after a cold relight through
  # the policy was verified.
  networkPolicy:
    enabled: true
  # Static bearer token on noded's gRPC surface (#4693). One chart value renders
  # the same Secret into the control plane and every brick, so enforcement and
  # client attachment flip in this one chart version. The operator renders the
  # 1Password item (one field, "token") into the Secret named by the chart.
  bearerTokenSecret:
    enabled: true
    onepassword:
      itemPath: "vaults/k8s-homelab/items/embervm-noded-token"
  # Step 3 of the #4691 production rollout: refuse an enveloped artifact unless
  # the control plane supplies a short-lived capability scoped to the principal,
  # artifact lineage, target brick, workload, generation, and lease.
  requireRestoreCapability: true
  # SigV4 credentials for the artifact store (#4708). The embervm identity in
  # the SeaweedFS identities policy; clients sign every request once these are
  # present, and the gateway starts checking them when s3.enableAuth flips in
  # projects/platform/seaweedfs.
  store:
    # The reader is already unconditional on every brick. New session,
    # session-workspace, stateful, volume, and group-set exports are encrypted;
    # shared immutable bases remain plaintext and deduplicable.
    encrypt: true
    credentials:
      enabled: true
      onepassword:
        itemPath: "vaults/k8s-homelab/items/embervm-store"
  # Warmth ownership transition guard (#4962). Every brick on the fleet writes
  # its .alive claim as of chart 0.26.0 (verified on the 2026-08-22 06:44 roll),
  # so unclaimed pre-heartbeat directories are dead and may be reaped. After
  # this, startup GC only ever removes a claim older than staleAfterSeconds.
  warmthHeartbeat:
    reapUnclaimed: true
  # ARMED: brick silence timeout, ~6h (ADR embervm/037, #5073). A brick with no
  # dial-home or WatchNode contact past this bound refuses new node-local work;
  # live VMs keep running. Rollback: set back to "".
  silenceTimeoutSeconds: "21600"
  # WILDCARD DAEMONSET DEPRECATED (bricks-only migration). The per-node wildcard
  # noded DaemonSet is retired: node capacity is now provided entirely by the
  # size-class brick Deployments the BrickController autoscales (bricks.autoscale
  # = up below), so the CP picks the optimal brick mix from placement demand
  # rather than one fixed daemon per node. Discovery is dial-home (not the noded
  # Service), and the shared noded ServiceAccount + the CP dial-home auth env are
  # decoupled from this flag (rendered for noded OR bricks), so bricks keep their
  # identity with the DS off. Rollback: set back to true (the DS re-renders and
  # backstops beside the bricks). node scratch is provisioned out of band now
  # (docs/runbooks/embervm-node-scratch-setup.md).
  enabled: false
  maxLiveVMs: 16
  # ARM warm restore with volume FLEET-WIDE (all brick classes). The #4371
  # one-brick experiment on the 16gi class validated the whole chain live on
  # 2026-08-05: 2.5ms load-to-resume, billed turns from a repointed volume, and
  # park/relight conversation continuity (#4386). Uniform arming is the point,
  # not just breadth: base refs exclude noded config, so a mixed fleet builds
  # SAME-REF bases with DIFFERENT device sets (flag-off bricks omit the
  # placeholder drive) and the bundle records nothing that tells them apart.
  # S3 export is first-writer-wins, so a placeholder-less twin exported by a
  # flag-off brick would break session creates on any brick that later
  # hydrates it, with nothing on disk to explain why. All classes armed means
  # every base built anywhere carries the placeholder. Task bases keep their
  # old refs until their guest images next move; volume-less restores of
  # placeholder-bearing bases reopen the node-stable placeholder file that
  # every brick ensures at startup.
  # Rollback: set back to [] (uniformly, never partially); no chart bump
  # needed, the values git ref alone rolls the brick Deployment envs off.
  #
  # RE-ARMED 2026-08-06 (#4418) after a diagnostic disarm. The disarm was an A/B
  # discriminator for #4389, and it EXONERATED restore: cold-booted sessions
  # stalled byte-identically, so "the stall follows restored VMs" was a
  # coincidence of timing, not a cause. The real chain was four stacked defects
  # on the egress lane, all fixed and validated live: SHUT_WR propagated onto a
  # vsock leg that has no half-close (#4412), the resulting suppression severing
  # the git proxy helper's exit chain (#4415), blob:none forcing a second lane
  # connection at checkout (#4414, the wedge itself now tracked as #4417), and a
  # clone budget too short for the full-clone shape (#4413). A repo-attached
  # session then hydrated and ran billed turns end to end.
  #
  # Restoring the full list is the whole point of the feature: sessions start
  # from a disk snapshot at 2.5ms load-to-resume instead of paying a cold boot
  # every time. Uniform, per the rollback contract above, never partial.
  warmRestoreWithVolumeClasses: ["2gi", "4gi", "8gi", "16gi"]

# Node-provisioning contract (ADR embervm/012 storage-tiers amendment; warmth
# cache-cap retention decisions 2026-07-22): DISABLED. The privileged runtime
# DaemonSet that provisioned the capped loop scratch proved fragile in the
# homelab (the masters' minimal host image lacks losetup/mkfs.ext4/mount on the
# nsenter PATH, and the container-vs-host path split kept surfacing a new failure
# per layer). Node scratch is instead provisioned ONCE per node out of band: a
# manual host setup over SSH today (see docs/runbooks/embervm-node-scratch-setup.md),
# and cloud-init / a machine template when the fleet moves to the cloud. noded only
# needs /var/lib/embervm/scratch to be a correctly-sized ext4 mount; how it gets
# there does not need to be a runtime pod. node-4 keeps its dedicated NVMe mount.
scratchPrep:
  enabled: false

# Size-class BRICK cutover REVERTED to the known-good single-instance DS fleet
# (foundation plan Step 0, docs/plans/2026-07-20-embervm-brick-colocation-foundation.md).
# The PR-3b canary (2gi+16gi co-located on node-4) exposed foundation bugs that
# make co-location non-functional today: SUN_LEN socket-path overflow on the
# PR-2.5 per-instance warmth root (firecracker cannot bind its API socket, so
# EVERY VM op on EVERY brick fails), node-keyed wake addressing collapsing
# co-located instances, BaseBuilder capturing the whole fleet's base provisioning
# on one undersized brick, and absent memory facts. bricks.enabled=false removes
# the brick Deployments so the registry expires the brick instances, BaseBuilder
# un-pins and re-places every workload on the DS (flat warmth root, no SUN_LEN),
# and bases rebuild. Re-canary at plan Step 6 once Steps 1-5 land. No chart bump
# ($values git ref).
# Size-class BRICK re-canary, step 1 (foundation plan Step 6, small-first). The
# co-location foundation is now in place: SUN_LEN-safe short warmth root, real
# cgroup memory facts, dual-key instance addressing, instance-aware wakes, and
# size-aware placement + class-eligible base builds. This flip re-enables the
# FIRST co-located brick (2gi beside the DS) on node-4, exercising all of the
# above together. Deep-merged over the chart classes ladder. desiredReplicas
# lists ONLY 2gi (others render at 0). The 16gi large brick follows in a second
# flip after this small brick verifies against the decision-log checklist.
bricks:
  enabled: true
  # The first grouped production roll's measured result is recorded on #4897.
  syncWaveGroupSize: 3
  desiredReplicas:
    2gi: 1
    # Re-canary step 2 (large): the 16gi brick, added after the 2gi brick verified
    # clean on the co-located fleet (real mem facts, SUN_LEN-safe short warmth,
    # instance-aware demo-postgres wake, no fleet_full). node-4's serving/session
    # workloads with a large composite group need the 16gi class.
    # Values-only flip: foundation images already deployed at 0.1.169.
    16gi: 1
  # Demand-driven brick autoscale (fleet plan Axis C), pinned explicitly so the
  # cluster's rollout rung is visible here, not implied by a chart default. The
  # ladder is observe -> up -> full, each a values-only flip:
  #   observe: acts statically (identical to before), logs every would-be
  #            decision ("brick autoscale: would scale class ...") for a soak.
  #   up:      denial-driven scale-up acts (clamped to chart maxReplicas);
  #            scale-down stays observe-only.
  #   full:    drain-aware scale-down acts too (idle 15m + fully-exported
  #            victim rail, never below chart minReplicas; 16gi keeps min 1
  #            for a large composite workload).
  # min/max clamps live in the chart values (recorded policy 2026-07-20:
  # min {16gi: 1}, max {2gi: 4, 4gi: 3, 8gi: 2, 16gi: 2}).
  autoscale:
    # up: with the wildcard DaemonSet retired (noded.enabled=false above), bricks
    # are the ONLY capacity, so the BrickController must act on placement-denial
    # pressure and scale classes up (clamped to chart maxReplicas: 2gi 4, 16gi 2)
    # to absorb the migrated workloads. Scale-down stays observe-only until we
    # promote to full. This is what lets the CP choose the optimal brick mix.
    mode: up
  # Per-node brick floor guarantees (PR-3, #35): pins one small brick onto a
  # specific node so it joins active duty instead of the fleet bin-packing
  # everything onto node-4 and spilling under load. All three master nodes
  # (node-1/2/3) carry a live 2gi floor; each had its scratch pre-flight
  # (mountpoint + ~35Gi ext4 loop file) verified on the host before being
  # added. Adding a new floor node is a values-only change once that host's
  # scratch is confirmed and a canary invoke lands a VM with no fleet_full flag.
  nodeFloors:
    - node: node-1
      class: 2gi
    - node: node-2
      class: 2gi
    - node: node-3
      class: 2gi
    # Second 16gi brick, PINNED to node-4 (2026-08-05, after #4371 closed). A
    # floor rather than desiredReplicas 2 because the class Deployment
    # bin-packs by the fleet-wide FC label and could land the second replica
    # on a master's 35Gi loop scratch; session volumes and 4Gi VMs belong on
    # node-4's NVMe. Every node-4 lineage is servable by EITHER brick (the
    # VolumeRoot is node-shared and rejoin dials the scheduler's brick since
    # #4380), so this doubles session admission headroom AND keeps one 16gi
    # brick up through every merge's roll (floors and the class Deployment
    # are separate Deployments on separate sync waves). First same-class
    # co-located pair in the fleet: instance addressing is dual-key
    # (node, pod uid) by design, but watch the first roll. Rollback: delete
    # this entry; volumes strand nothing (node-shared).
    - node: node-4
      class: 16gi

# EmberVM R4 scale-to-zero scratch-postgres (ADR embervm/001, D-R4.PR-11.1).
# DISABLED 2026-08: its only real consumer was the loom deployment (now
# decommissioned), whose connection pool re-dialed after every idle bank and
# kept the workload in a perpetual ~2.6-minute wake/bank cycle; the monolith
# run_python DSN wiring is off in the same change. The block stays because
# demo-postgres shares the guest image pin (Bazel-injected guestImage), the
# workloads rootfs entry, and the 1Password Secret below; only the Workload CR
# itself is gone. Flip enabled back on to restore the tenant datastore (the
# volume outlives the CR; see bankedTtlSeconds vs volume GC in the chart).
scratchPostgres:
  enabled: false
  onepassword:
    itemPath: "vaults/k8s-homelab/items/scratch-postgres"

# Demo-postgres (private demos page sleep/wake exhibit): a second stateful
# Postgres on 5401 with a 1s idle window, so the demo can show the VM banking
# itself moments after a query and relighting on the next connection. Reuses the
# scratch-postgres guest image pin + Secret; its own volume keeps demo rows out
# of real tenants' data.
#
# COUPLING (#4198): the monolith side gates DEMO_POSTGRES_DSN on its own
# scratchPostgres.demoListenPort (projects/monolith/deploy/values.yaml) and
# nothing cross-checks the two. If you disable this demo, clear demoListenPort
# there in the same change, or the monolith renders a DSN to a nonexistent
# workload and the synthetic probe latches red (503 /api/health).
demoPostgres:
  enabled: true

# ~1s sweeper tick makes the idle bank visibly prompt (default is 30s, which
# would leave the demo VM "awake" for up to half a minute after its 1s idle
# window elapses). Wake cap raised 10 -> 30/min: with a 1s idle bank every demo
# query is a wake, and the default cap would turn quick successive clicks into
# refusals. Both are control-plane-wide; scratch-postgres banking is still
# gated by its own 120s idleBankSeconds.
statefulSweeper:
  sweepIntervalMs: "1000"
  wakeMax: "30"

# Arm orphaned gRPC connection cleanup in the deployed control plane. The
# interval remains unset so the application default of 60s applies.
grpcConnectionSweeper:
  enabled: "1"
  sweepIntervalMs: ""

# Arm the base-retention sweep (base-durability PR-3): one-shot supervised
# reclaim of ~290G of superseded base versions on node-4, then the ongoing
# retention backstop. Every current base is confirmed durable in S3 before any
# local eviction, and hydrate-on-miss restores from S3 on a cold start.
# Rollback: set back to "" and bump the chart; that stops further eviction.
baseRetention:
  # RE-ARMED 2026-08-05 after reading the manifest live (#4290). The sweep named
  # exactly two candidates, both on node-3, both claude-runtime/intel superseded
  # bases aged 25h and 48h, 8.59 GB total, and left tonight's fresh base alone
  # under the 3600s min-age rail. Arming was checked against session state at the
  # same moment: all 70 claude-runtime sessions were terminal (evicted, destroyed,
  # failed), with zero live, parked, or banked, so nothing could be pinned to the
  # candidates.
  #
  # The standing risk from #4364 is NOT closed by that: the keep-set lives in
  # control-plane memory and is never rehydrated on boot, so once real sessions
  # exist again, a CP restart can make a base pinned by a parked session look
  # unreferenced. "A base is reconstructible" is the usual defence, and it is why
  # the remote gate was armed directly, but this cluster has already evicted four
  # sessions with terminal_reason "snapshot_vanished", so a vanished artifact
  # kills the session rather than being silently rebuilt. Land #4364's durable
  # keep-set before session traffic resumes.
  #
  # Rollback: set back to "" and bump the chart; that stops further eviction.
  sweepEnabled: "1"
  # Arm the DISK-DRIVEN eviction path. This is a second gate, added alongside the
  # disk-driven candidate logic so that fixing the enumeration could not silently
  # inherit the legacy gate above, which had been armed since 2026-07-27. Setting
  # sweepEnabled alone leaves the sweep logging "DRY RUN, deletion disabled",
  # because candidates now come from the disk-driven plan and are gated here.
  #
  # Armed after two consecutive live sweeps named the same two candidates and
  # nothing else: node-3 claude-runtime/intel superseded bases aged 25h and 48h,
  # 8.59 GB, with tonight's fresh base correctly spared by the 3600s min-age rail.
  # Rollback is setting this back to "" and bumping the chart; eviction is also
  # capped at 20 per sweep, so a logic error cannot clear the fleet in one pass.
  diskDrivenEnabled: "1"
  # Arm REMOTE base retention (#3947 PR-4, Joe 2026-07-27). Local retention has
  # been reclaiming node disk for a while, but nothing reclaimed the store, so
  # superseded S3 bases accumulated without bound. Armed directly rather than
  # after a dry-run soak because a base is a RECONSTRUCTIBLE artifact: a wrong
  # delete costs a rebuild, not data, and the keep-set already spares a pinned
  # session's base via the primed/session refcount. Rollback is setting this
  # back to "".
  remoteSweepEnabled: "1"

# Arm the warmth-retention sweep (task #36, Joe 2026-07-22): flips the merged-inert
# WarmthReaper from dry-run to acting. With #38 fix C the reaper SKIPS empty-binding
# orphans (all pre-sidecar backlog), so this reclaims steady-state forward (new
# orphans) safely; the existing ~120G backlog is reclaimed separately by the S3-direct
# GC (task #39). Rollback: set back to "" and bump the chart; that stops eviction.
warmthRetention:
  sweepEnabled: "1"

# S3-direct warmth GC (task #39): ARMED 2026-08-04 (the enabled flag below)
# as the supervised second step, after the dry-run manifest
# (gc-manifests/<ts>.json in the embervm bucket) was read and verified.
# Rollback: set enabled back to "" and bump the chart.
# Until 2026-08-04 no manifest had ever been written: the sweep aborted
# empty_cp_state on every run because group_set/ holds leftovers of the
# retired scratch-k8s demo while GroupStore legitimately tracks zero
# instances. allowEmptyKinds is the operator statement that group is retired,
# which lets the sweep finally COMPLETE in dry-run and produce manifests.
# The caps are pre-staged for the drain the census predicts (~2.29 TiB /
# 4611 stateful refs past the 8h TTL): at the 10-prefix/20GiB defaults that
# backlog would take ~19 days of hourly sweeps, at 200/100GiB about a day.
# expectedNodes names the real fleet for the fleet-freshness abort: every
# listed node must be present and fresh in the CP's capacity facts or the
# sweep (dry-run included) aborts.
warmthS3Gc:
  allowEmptyKinds: "group"
  # ARMED (Joe 2026-08-04) after reading dry-run manifest
  # gc-manifests/1785867400387.json: plan 200 prefixes / ~98 GiB (198
  # stateful, 1 session orphan, 1 group_set), 4410 stateful refs / ~2.19 TiB
  # eligible beyond caps, holds proving the guards (3 tier2_protected_newest,
  # 1 desired_ref, 69 younger_than_age_floor). Rollback: set enabled back to
  # "" and bump the chart.
  enabled: "1"
  maxPrefixes: "200"
  maxBytes: "107374182400"
  expectedNodes:
    - node-1
    - node-2
    - node-3
    - node-4
  statefulTtlMs: ""
  sessionTtlMs: ""
  servingTtlMs: ""
  sessionWorkspaceTtlMs: ""
  groupSetTtlMs: ""

# Guest egress lane (ADR 023 phase 6a, issue #4071). Turns on the egress-proxy
# sidecar and tells noded to serve the vsock egress port for each guest. The
# claude runtime is the only guest that dials it; every other guest ignores the
# listener, so this is a lane opening rather than a posture change for the fleet.
#
# Phase 6b: allowlist-forward with the split-horizon guardrail and a
# credential catalog. No CA is minted and the sidecar never terminates TLS. The
# public internet is reachable (external: allow) and the cluster is not
# (internal.default: deny), which is what stops an agent in a guest from reaching
# in-cluster services.
egress:
  enabled: true
  internal:
    # Deliberate holes in the split-horizon guardrail. Matching is an exact
    # case-insensitive host compare against BOTH the requested host:port and the
    # resolved ip:port, so a name and its address are both accepted and pinning
    # the resolved IP is what defeats SSRF-by-name and DNS rebinding. No
    # wildcards. internal.default stays deny: this permits these endpoints and
    # nothing else, so a prompt-injected guest still cannot pivot into the
    # cluster. Adding an entry here is a security decision, not tuning.
    #
    # inference: the pi adapter drives the in-cluster Qwen model on this exact
    # host:port.
    # monolith-searxng: Pi's image-owned web_search extension queries its JSON
    # endpoint. web_fetch uses the external lane and adds no internal reach.
    # monolith.monolith.svc.cluster.local:8091
    # Monolith progress-ingest (8091): mid-turn visibility, write-only single route
    # (ADR 051). Port 8091 only; the main API on 8000 stays deny. Token-bearer auth
    # bounds what a prompt-injected guest can write to (its own session's
    # partial_text), not network access.
    # monolith-public-frontend...:3000 and monolith...:3000
    # The two frontend origins the shotter workload renders (ADR embervm/035).
    # Note monolith.monolith.svc.cluster.local appears twice on purpose: matching
    # includes the port, so the :8091 entry above does NOT admit :3000. The
    # main API on :8000 stays denied.
    #
    # Accepted cost, recorded in ADR embervm/035 section 4 and carried there as an
    # open question: this list is global to the sidecar, not per workload, so
    # these two entries widen reachable destinations for every other
    # egress-enabled workload (today the claude runtime) too.
    #
    # Do NOT justify that by saying these endpoints are already reachable
    # in-cluster. They are not. Both frontends are Cilium ingress default-deny,
    # and reaching them at all required adding explicit
    # namespace-embervm-to-3000 rules to monolith-public's cilium-policy and
    # monolith's cilium-ingress-policy in the same change. ADR 035 section 4
    # makes that claim and it is wrong; the conclusion survives because the
    # widening is SMALLER than stated, not because it is nil.
    #
    # What actually bounds the widening is that this entry only makes a
    # destination permissible, and permission is not reach: no other egress
    # enabled guest runs a browser, and the shotter guest's own baked allowlist
    # is the control that decides where it may dial. Still a precedent for
    # whatever needs an entry next, which is why it is written down rather than
    # treated as settled.
    allowlist:
      - inference.inference.svc.cluster.local:8080
      - monolith-searxng.monolith.svc.cluster.local:8080
      - monolith.monolith.svc.cluster.local:8091
      - monolith-public-frontend.monolith-public.svc.cluster.local:3000
      - monolith.monolith.svc.cluster.local:3000
  # The claude runtime's subscription OAuth token. The sidecar SETS the
  # Authorization header on requests to api.anthropic.com and originates the
  # verified TLS to :443 itself, so the credential never exists inside a guest
  # that runs model-driven, prompt-injectable code.
  #
  # There is nothing to keep in sync with the guest. The guest sends whatever it
  # likes in this header (the claude CLI refuses to make any request until it
  # believes it is logged in, so it must send something) and the sidecar discards
  # it. That also means a prompt-injected guest cannot authenticate as a different
  # account by supplying a token of its own.
  #
  # egressTo bounds where the credential can go: api.anthropic.com only, exact
  # host match, no wildcards. If this entry's secret ever fails to resolve, those
  # hosts are DENIED rather than tunnelled, because the guest addresses them in
  # cleartext and a fall-through would put the prompt on the public internet.
  secrets:
    - header: Authorization
      valuePrefix: "Bearer "
      env: EMBER_ANTHROPIC_OAUTH_TOKEN
      egressTo:
        - api.anthropic.com
      secretRef:
        name: embervm-embervm-egress
        key: CLAUDE_AUTH_TOKEN
    # Note: credential field absent (deferred); fails closed until 1Password
    # operator fills vaults/k8s-homelab/items/litellm-claude-auth. Co-location
    # caveat: this item is also read by monolith gardener; adding a field is
    # values-only; separate item would require onepassworditem-egress.yaml
    # loop (deferred).
    - header: "Authorization"
      valuePrefix: "Bearer "
      egressTo:
        # The subscription backend, not api.openai.com: codex in ChatGPT mode
        # talks to chatgpt.com/backend-api (verified against rust-v0.146.0).
        - "chatgpt.com"
      # The subscription grant supplies short-lived tokens. If the broker is
      # absent or unavailable, the sidecar fails closed and denies this host.
      brokerGrant: "codex-cluster"
      claimHeader: "chatgpt-account-id"
      claimPath: "https://api.openai.com/auth.chatgpt_account_id"
      # The CLI's rmcp connector client sends no Authorization header at all
      # (verified against rust-v0.146.0 and the 0.147.0-alpha line), so
      # presence-keying can never admit it: this exact path is the explicit
      # opt-in, and claim-resolution failure still denies (issue #4298).
      injectAlwaysPaths:
        - /backend-api/ps/mcp
    # GitHub, in TWO shapes of the SAME token, because git and the API disagree
    # about how to carry it. Verified against github.com with a real PAT:
    # git-receive-pack 401s on Bearer and 200s on Basic, while api.github.com
    # 200s on Bearer. basicUser makes the sidecar do the RFC 7617 encoding, so
    # the vault holds one credential rather than a derived base64 copy that
    # would silently outlive a rotation of the value it came from.
    #
    # Reached over ordinary https://. With ca.enabled below, the sidecar
    # terminates the guest's TLS using a leaf minted from the egress CA, injects
    # the header, and originates a FRESH verified TLS connection to the real
    # destination. Without that CA it could only blind-tunnel TLS, and
    # blind-tunnelled bytes cannot be credentialed, which is why gh (https-only,
    # no way to address a host in cleartext) could not authenticate at all.
    - header: Authorization
      basicUser: "x-access-token"
      env: EMBER_GITHUB_GIT_TOKEN
      egressTo:
        - github.com
      secretRef:
        name: embervm-embervm-egress
        key: GH_AUTH_TOKEN
    - header: Authorization
      valuePrefix: "Bearer "
      env: EMBER_GITHUB_API_TOKEN
      egressTo:
        - api.github.com
      secretRef:
        name: embervm-embervm-egress
        key: GH_AUTH_TOKEN
  # embervm-agent-secrets carries CLAUDE_AUTH_TOKEN and GH_AUTH_TOKEN together,
  # so every guest credential comes from one item. Field labels become the keys.
  # A key missing here DENIES its egressTo hosts rather than tunnelling them
  # (see the fail-closed arm in the sidecar's handle), so this repoint and the
  # entries above have to land together.
  # TLS-MITM lane (ADR 023 phase 6b). ON, because a credential can only be
  # injected into bytes the sidecar can read: a guest speaking https:// to a
  # credentialed host is blind-tunnelled otherwise, so gh and every ordinary
  # HTTP client go out unauthenticated. cert-manager mints the CA
  # (templates/egress-ca.yaml); the sidecar signs per-destination leaves at
  # request time; the guest fetches the PUBLIC cert over its host-local vsock at
  # spawn, so rotating the CA does not require a fleet base rebuild.
  #
  # The private key is mounted into the sidecar alone and never reaches a guest.
  ca:
    enabled: true

  onepassword:
    name: embervm-embervm-egress
    itemPath: "vaults/k8s-homelab/items/embervm-agent-secrets"

# Node-local git mirror (#4473): serve the mirrored repos over git smart http
# from a loopback sidecar in every noded pod, and point session hydration at it
# so the clone leaves the GitHub rate limit and the slow credentialed lane.
# Guests reach it as http://git-mirror.egress.internal:<port> through the
# ordinary egress lane; the reserved host is answered by the co-located
# egress-proxy before any routing, so no allowlist entry is spent. The shim
# falls back to its credentialed GitHub clone for repos this list does not
# carry, so catalog drift degrades to today's path instead of failed sessions.
gitMirror:
  # FALSE for the 0.41.7 to 0.47.x jump (#5224), to be re-enabled as its own
  # single-change roll once prod has settled.
  #
  # This flag arrived true on 2026-08-24 (e01071c77, the same commit that added
  # the template, chart 0.45.3) and has never rendered anything, because prod
  # has been pinned at 0.41.7 which carries no template for it. The moment the
  # chart moves, every noded pod gains a THIRD container that has run nowhere.
  # Dev cannot have exercised it either, since dev runs no egress-proxy and the
  # sidecar is gated on `and egress.enabled gitMirror.enabled`, so dev's noded
  # pod has a single container.
  #
  # This stops the SIDECAR, not the guest half. The shim defaults to
  # http://git-mirror.egress.internal:9419 and EMBER_GIT_MIRROR_URL is set by
  # nothing, so on 0.47.x every session hydration tries the mirror first, is
  # denied by the egress proxy (the reserved host resolves nowhere with the
  # seam off), and falls back to its GitHub clone. Fast and safe, but expect
  # mirror-named lines in hydration logs during the jump.
  #
  # That would ride in on the largest rollout this pipeline has attempted (13
  # of 14 guest base digests rebuilding on every node). Landing an unexercised
  # sidecar and a full-fleet guest rebuild together means a failure in either
  # one is diagnosed against both. Flipping it here is values-only and deploys
  # on HEAD, so it takes effect BEFORE the chart moves, which is the whole
  # point of the flag existing.
  enabled: false
  port: 9419
  refreshIntervalSeconds: 60
  # The MCP agent tool defaults every session to jomcgi/homelab (#4473), which
  # is why the mirror exists; extend only as other catalogs earn their disk on
  # every FC node (one clone per repo per node, refreshed every interval).
  repos:
    - jomcgi/homelab


# Voice-drivable Claude Code agent sessions (issue #4055). The monolith addresses
# this workload by name, so it must exist before agent_sessions can create a
# session at all. Sizing and the node disk arithmetic are in chart/values.yaml.
claudeRuntimeWorkload:
  enabled: true
  # Epoch entry to force a base rebuild (issue #4371): init_env is in the
  # workload signature, so this re-keys and rebuilds ONLY the claude-runtime
  # base. Needed alongside noded.warmRestoreWithVolumeClasses above because the
  # base key deliberately excludes noded config; without this the armed 16gi
  # brick would keep serving its placeholder-less base and every session create
  # would fail at the drive PATCH. The value is inert guest env; bump it any
  # time capture behaviour changes node-side.
  #
  # warm-restore-2: the CP restarted during the pre-#4381 window when the brick
  # coin-flipped its advertised ref, adopted the STALE placeholder-less ref as
  # recorded, and reconcile's signature-match no-op froze it there, so creates
  # and rejoins kept restoring the old base after every fact-side fix. Moving
  # the epoch re-keys the base, which forces a re-record and a fresh build that
  # every consumer (recorded ref, node facts, retention desired set) converges
  # on.
  #
  # warm-restore-3: the #4418 re-arm restored warmRestoreWithVolumeClasses
  # without moving this epoch, and the two MUST move together. Every base on
  # disk was rebuilt at 09:43Z under hypervisorEpoch fc-v1.16.1-r2 by bricks
  # that were still DISARMED, so it carries no placeholder volume drive
  # (verified: the claude-runtime snapfile holds the rootfs drive id and no
  # volume one). An armed brick restoring a session PATCHes a "volume" drive
  # that the base does not have, and every session create fails there. The base
  # signature deliberately excludes noded config, so arming alone can never
  # trigger the rebuild that arming requires. Scoped to claude-runtime because
  # only a restore that carries a volume needs the placeholder: task bases
  # restore volume-less and are unaffected either way.
  # WARNING: every entry below is a base-SIGNATURE input and NOTHING here reaches
  # the guest's environment. The control plane sends the map as
  # BuildBaseRequest.init_env, noded never reads that field (the base-build claim
  # is ClaimSpec{Arch, ThreadID} and ClaimSpec has no env member), and the guest's
  # whole environment comes from guest-init setDefaultEnv plus the ember.env.*
  # boot args that only ClaimStateful populates. So an entry here re-keys the base
  # and rebuilds it, which looks exactly like a successful deploy, while changing
  # nothing the guest can read. Use it as a rebuild epoch, never as a knob.
  # Making it mean what it says is tracked in #4429.
  initEnv:
    # diff-capture-1: PR #4936 put turn diff capture in shim.py, and the image
    # built with it (verified: the pinned runtime digest contains
    # _capture_turn_diff). The base rebuild that would carry it into guests
    # failed at 17:29Z with {:connect, :timeout}, two minutes after the 16gi
    # bricks started rolling for chart 0.14.1. Ready stayed True on the older
    # restorable base, so nothing alerted and every session kept running the
    # previous shim, capturing nothing.
    #
    # A failed build is not retried, and creating a session does not trigger
    # one: a qwen probe (session 193) created and served a guest with the
    # condition unchanged across six minutes. Re-keying is the only route, and
    # this epoch is the documented mechanism for it. That the fix for a
    # transient timeout is a hand-edited string is the problem tracked in #4937.
    #
    # diff-capture-2: diff-capture-1 DID deploy and DID re-key. The values source
    # is the git ref at HEAD, not the OCI chart, so ArgoCD applied it 37 seconds
    # after the merge with no chart bump, and a base rebuilt at 18:38:33Z. But it
    # rebuilt for ONE vendor. The fleet is vendor-split, and after that rebuild:
    #
    #   snapshotRefs.amd   claude-runtime__7adf2327a376  built, punched, in S3
    #   snapshotRefs.intel claude-runtime__a1cc8b4bb845  in NO store, on NO brick
    #
    # The intel bricks still hold claude-runtime__1bd56a68d7af from Aug 8 and
    # Aug 10, so three of the four firecracker nodes boot a week-old guest image.
    # No intel brick logged a BuildBase at any point. BaseBuilt and Ready are
    # computed from the headline snapshotRef, which is amd's, so the workload
    # reported healthy while the intel half was never built. Sessions 194, 195
    # and 196 recorded the NEW image digest and still captured nothing, because
    # the session record carries the desired digest rather than the base the
    # guest actually restored (#4893).
    #
    # This re-key is paired with destroying the parked sessions that were
    # refcount-pinning the stale intel base against retention. Vendor-blind
    # conditions and the dangling intel ref are tracked in #4937.
    EMBER_BASE_EPOCH: "diff-capture-2"
    # Prewarm config deliberately does NOT live here anymore. EMBER_PREWARM_CLIS
    # used to sit in this map as documented intent, but nothing here reaches the
    # guest (see above), so prewarm silently no-oped for every family, which is
    # why first turns logged path=lazy_spawn (#4423). The list now ships IN the
    # image as /usr/share/ember-shim/prewarm-clis, baked per runtime: claude
    # carries "claude,codex,pi" (runtimes/claude/prewarm-clis), pi-runtime
    # carries only "pi" (runtimes/pi/prewarm-clis), because that image omits
    # the other two CLIs. EMBER_PREWARM_CLIS remains a live env override in the
    # shim for tests and one-off boots; it just cannot be set from here until
    # #4429 makes initEnv mean what it says.
    # The git proxy idle deadline that dominates hydration (#4429) is deliberately
    # NOT here: it was set here first, rebuilt the base, and left the guest on its
    # 10s default anyway. It now lives in the guest at shim.py, which is the only
    # place a guest-read value can live today.
  # ON. The ADR 027 memory:false/filesystem:true quadrant: sessions ride
  # per-lineage workspace volumes with park/rejoin instead of memory-snapshot
  # banking, and raw files in S3 replace multi-GiB snapshots.
  #
  # Every earlier failure traced to one bug: a session cold boot dropped into
  # /bin/sh because init= was never put on its kernel cmdline (#4271). It was
  # long blamed on noded's lineage-volume Prime path, which was wrong.
  #
  # The disarm that followed was also diagnosed wrong, twice over. It blamed
  # "seven arms of 10 GiB workspace images", but the volumes are sparse
  # (noded/volume/volume.go:142 Truncates rather than zero-fills), and it named
  # node-4, whose NVMe scratch was 26% used the whole time. What actually filled
  # was the masters' 35 GiB capped loop scratch, holding FOUR retired 4 GiB
  # claude-runtime bases each, one per chart publish. The base retention sweep
  # logs "0 candidates" against them because it only sweeps live registry
  # entries (#4286). That is the real cost of arming this: every publish leaks
  # another 4 GiB per brick until the GC is fixed, so watch headroom under
  # /var/lib/embervm/scratch on node-1/2/3 rather than on node-4.
  persistenceEnabled: true

# The pi-runtime workload: the small session lane (256 MiB), carrying only the
# pi CLI. Sizing and the "why 256 holds" arithmetic are in chart/values.yaml.
#
# ON, but NOTHING ROUTES TO IT YET. The monolith still sends every model family,
# qwen included, to claude-runtime (agent_sessions/transport.py defaults its
# workload to "claude-runtime"), so enabling this here builds the base and
# stands the CR up without changing a single live turn. That ordering is
# deliberate: embervm and monolith are separate ArgoCD apps with independent
# rollouts, so shipping the routing flip in the same change would mean whichever
# app synced first decided whether qwen sessions 404 on an unknown workload for
# a few minutes. It also means the 256 MiB sizing is proven by a real session
# create here BEFORE the */5 synthetic probe depends on it.
#
# The follow-up that routes model=qwen here is a monolith-side change.
piRuntimeWorkload:
  enabled: true
  # Volume quadrant, same as claude-runtime: a repo-attached qwen session has
  # to clone somewhere that is not the 256 MiB tmpfs. Every repo session on
  # this lane failed at hydration with "Out of diskspace" from 2026-08-16 until
  # this flip (#5051). 4 GiB lineage from the chart default.
  persistenceEnabled: true
  # 1536 MiB, up from 512, to stop the long-task OOM (a multi-turn go/python
  # build with thinking on exit -9'd pi at 512, #5051 cycle 4). This value is
  # chosen to land pi on the 16gi brick, not the 2gi one: placement is purely
  # memMib-driven and a 2gi brick's usable envelope is 1792 (nameplate 2048
  # minus the 256 daemon reserve), so the eligibility gate needs
  # memMib + 512 reject-floor <= usable. 1024 (#5068) satisfied 1024+512=1536
  # <= 1792 and so still placed on 2gi with zero margin, which is what wedged
  # creates. 1536+512=2048 > 1792 makes every 2gi brick ineligible, so pi lands
  # on the 16gi class (usable 16128), which is already running and kept warm on
  # node-4 (desiredReplicas + a nodeFloor). This mirrors claude-runtime, which
  # runs at memMib 4096 on the same 16gi class. The base re-keys and rebuilds on
  # the 16gi brick on rollout; watch the first creates land there.
  memMib: 1536

# SpecTrace gate for spec validation (GitHub issue #4770). Debug-gated, spec-shaped
# trace that validates TLA+ specs against real behaviour. Deliberately OFF in production.
# Chart defaults are all OFF; flip specTrace.enabled=true locally or in a dev values
# override to enable spec validation.
# specTrace:
#   enabled: false
