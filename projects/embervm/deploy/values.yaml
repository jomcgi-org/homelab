# Cluster-specific overrides for the EmberVM control plane. The image tag is
# pinned into the chart at build time (helm_chart images=), so it is not set
# here. Defaults in the chart are sized small to start (SigNoz 7-day-peak
# resizing later).
opLog:
  # Postgres op-log tier (ADR embervm/007), hosted as its own database on the
  # existing monolith-pg CNPG cluster. This retires the node-pinned RWO SQLite
  # PVC: the durable store becomes network-reachable, so the control plane is no
  # longer tied to whichever node holds the Longhorn volume.
  #
  # The op-log starts EMPTY. Embervm.OpLog.Postgres runs its own DDL on first
  # boot and nothing migrates the SQLite file, which is the accepted trade
  # (execution history is not worth a migration; the durable book-of-record
  # rebuilds from node adoption on the next dial-home, and long-horizon audit
  # lives in SigNoz per ADR embervm/002).
  #
  # Still one replica with strategy: Recreate. Multi-replica needs ADR 007's
  # single-writer-per-cell op-log appender, which this does not deliver.
  postgres:
    enabled: true
    secretName: embervm-oplog-password
    onepassword:
      itemPath: vaults/k8s-homelab/items/embervm-oplog-db
  storageClass: longhorn
  # Ignored while postgres.enabled is true (no PVC is rendered). Kept so a
  # rollback is a single values flip, at the cost of coming back up with an
  # empty SQLite op-log.
  size: 2Gi
  # Op-log retention (ADR embervm/002): hourly bounded-batch sweep; ops-journal
  # prefix compaction past a 30-day horizon (older audit is in SigNoz).
  sweepIntervalSeconds: 3600
  journalHorizonDays: 30

# TokenReview allow-list: ServiceAccount usernames permitted to submit tasks
# (Task 8). Empty means deny-all (fail-closed). In R0 the only entry is the
# control plane's own ServiceAccount, which lets an operator round-trip a live
# TokenReview-authed submit with `kubectl create token embervm -n embervm`; the
# real consumer SAs (the monolith semgrep scanner) are added at the Task 14/15
# side-by-side/shadow cutover, not here.
auth:
  # The control plane's own ServiceAccount is Helm-fullname-prefixed
  # (<release>-<chart> = embervm-embervm), so the principal TokenReview returns
  # is system:serviceaccount:embervm:embervm-embervm, not :embervm. This lets an
  # operator round-trip a live submit with `kubectl create token embervm-embervm
  # -n embervm`. Real consumer SAs (the monolith semgrep scanner) are added at
  # the Task 14/15 cutover.
  allowedServiceAccounts:
    - system:serviceaccount:embervm:embervm-embervm
    # The monolith ServiceAccount (Task 15): admits the monolith's semgrep_scan
    # client when SEMGREP_DISPATCH is flipped to embervm/shadow. Same SA the
    # monolith already uses to call fc-invoke. Added now so the dual-path code is
    # ready to authenticate the moment the flag flips; no traffic until then.
    - system:serviceaccount:monolith:monolith
    # The PUBLIC tier (Task 13): monolith-public runs in its own namespace as its
    # own fullname-prefixed SA, so jomcgi.dev/functions/<name> submits as this
    # principal. All public FaaS traffic shares this one SA, so the daily quota
    # below caps the entire public surface (the in-repo backpressure backstop in
    # lieu of a Cloudflare-edge rate limit; see monolith DECISIONS.md D-R1.3.1).
    - system:serviceaccount:monolith-public:monolith-public

# Metering, audit, and quotas (Task 12). Quota is left OFF in R0 (opt-in, empty =
# no enforcement): per-principal daily vCPU-second budgets are set alongside the
# real consumer SAs at the Task 14/15 cutover, once real tasks actually run (no
# guest image exists to consume vCPU-seconds until Task 14). The usage-read admin
# is the control plane's own ServiceAccount, so an operator can read fleet-wide
# usage at GET /v1/usage?principal=; everyone else is self-scoped.
usageAdmins:
  - system:serviceaccount:embervm:embervm-embervm

# Public FaaS rate-limit backstop (Task 13, DECISIONS.md D-R1.3.1). All public
# jomcgi.dev/functions/<name> traffic submits as the single monolith-public SA,
# so a daily vCPU-second budget on that one principal caps the whole public
# surface. og-image bills ~0.05 vCPU-s/invoke, so 3600/day is ~72k invokes/day;
# the function pool cap (4 concurrent VMs) bounds burst. The private monolith SA
# stays unlimited (omitted from the map). Raise/lower this as real public traffic
# warrants; a burst-per-second edge rule is the follow-up if abuse appears.
quota:
  dailyVcpuSecondsPerPrincipal:
    "system:serviceaccount:monolith-public:monolith-public": 3600

# OpenTelemetry tracing to SigNoz (Task 13), OTLP/gRPC on 4317 (the same
# collector fc-invoke exports to). Turns on the exporter via config/runtime.exs.
tracing:
  endpoint: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4317"
  serviceName: embervm-control

# Node capacity override (cluster-specific; the chart default of 8 is a
# conservative backstop). node-4 is a ~62Gi box (27% used), and the two platform
# pools alone (semgrep floor 4 + sandbox floor 4) consume all 8 default slots,
# leaving zero room for a zip-lane function workload (R1) to prime/miss. Lift the
# backstop to 16 so functions (og-image and peers, cap 4 each) have headroom; at
# ~1.5Gi/VM that is ~24Gi worst case, well within budget. This only raises the
# runaway backstop, not any pool floor.
noded:
  # WILDCARD DAEMONSET DEPRECATED (bricks-only migration). The per-node wildcard
  # noded DaemonSet is retired: node capacity is now provided entirely by the
  # size-class brick Deployments the BrickController autoscales (bricks.autoscale
  # = up below), so the CP picks the optimal brick mix from placement demand
  # rather than one fixed daemon per node. Discovery is dial-home (not the noded
  # Service), and the shared noded ServiceAccount + the CP dial-home auth env are
  # decoupled from this flag (rendered for noded OR bricks), so bricks keep their
  # identity with the DS off. Rollback: set back to true (the DS re-renders and
  # backstops beside the bricks). node scratch is provisioned out of band now
  # (docs/runbooks/embervm-node-scratch-setup.md).
  enabled: false
  maxLiveVMs: 16
  # ARM warm restore with volume FLEET-WIDE (all brick classes). The #4371
  # one-brick experiment on the 16gi class validated the whole chain live on
  # 2026-08-05: 2.5ms load-to-resume, billed turns from a repointed volume, and
  # park/relight conversation continuity (#4386). Uniform arming is the point,
  # not just breadth: base refs exclude noded config, so a mixed fleet builds
  # SAME-REF bases with DIFFERENT device sets (flag-off bricks omit the
  # placeholder drive) and the bundle records nothing that tells them apart.
  # S3 export is first-writer-wins, so a placeholder-less twin exported by a
  # flag-off brick would break session creates on any brick that later
  # hydrates it, with nothing on disk to explain why. All classes armed means
  # every base built anywhere carries the placeholder. Task bases keep their
  # old refs until their guest images next move; volume-less restores of
  # placeholder-bearing bases reopen the node-stable placeholder file that
  # every brick ensures at startup.
  # Rollback: set back to [] (uniformly, never partially); no chart bump
  # needed, the values git ref alone rolls the brick Deployment envs off.
  #
  # DISARMED 2026-08-06 (#4389, reopened): the hydration-clone stall follows
  # RESTORED session VMs and survives the Firecracker v1.16.1 upgrade, while
  # cold-booted sessions cloned cleanly for weeks before the fleet-wide arming.
  # Cold boot is both the A/B discriminator and the mitigation that unblocks
  # repo-attached turns while the restore-path vsock fault (guest kernel
  # 6.18.35 driver state across snapshot restore is the leading suspect) is
  # run down. Re-arm with the full class list once #4389 closes for real.
  warmRestoreWithVolumeClasses: []

# Node-provisioning contract (ADR embervm/012 storage-tiers amendment; warmth
# cache-cap retention decisions 2026-07-22): DISABLED. The privileged runtime
# DaemonSet that provisioned the capped loop scratch proved fragile in the
# homelab (the masters' minimal host image lacks losetup/mkfs.ext4/mount on the
# nsenter PATH, and the container-vs-host path split kept surfacing a new failure
# per layer). Node scratch is instead provisioned ONCE per node out of band: a
# manual host setup over SSH today (see docs/runbooks/embervm-node-scratch-setup.md),
# and cloud-init / a machine template when the fleet moves to the cloud. noded only
# needs /var/lib/embervm/scratch to be a correctly-sized ext4 mount; how it gets
# there does not need to be a runtime pod. node-4 keeps its dedicated NVMe mount.
scratchPrep:
  enabled: false

# Size-class BRICK cutover REVERTED to the known-good single-instance DS fleet
# (foundation plan Step 0, docs/plans/2026-07-20-embervm-brick-colocation-foundation.md).
# The PR-3b canary (2gi+16gi co-located on node-4) exposed foundation bugs that
# make co-location non-functional today: SUN_LEN socket-path overflow on the
# PR-2.5 per-instance warmth root (firecracker cannot bind its API socket, so
# EVERY VM op on EVERY brick fails), node-keyed wake addressing collapsing
# co-located instances, BaseBuilder capturing the whole fleet's base provisioning
# on one undersized brick, and absent memory facts. bricks.enabled=false removes
# the brick Deployments so the registry expires the brick instances, BaseBuilder
# un-pins and re-places every workload on the DS (flat warmth root, no SUN_LEN),
# and bases rebuild. Re-canary at plan Step 6 once Steps 1-5 land. No chart bump
# ($values git ref).
# Size-class BRICK re-canary, step 1 (foundation plan Step 6, small-first). The
# co-location foundation is now in place: SUN_LEN-safe short warmth root, real
# cgroup memory facts, dual-key instance addressing, instance-aware wakes, and
# size-aware placement + class-eligible base builds. This flip re-enables the
# FIRST co-located brick (2gi beside the DS) on node-4, exercising all of the
# above together. Deep-merged over the chart classes ladder. desiredReplicas
# lists ONLY 2gi (others render at 0). The 16gi large brick follows in a second
# flip after this small brick verifies against the decision-log checklist.
bricks:
  enabled: true
  desiredReplicas:
    2gi: 1
    # Re-canary step 2 (large): the 16gi brick, added after the 2gi brick verified
    # clean on the co-located fleet (real mem facts, SUN_LEN-safe short warmth,
    # instance-aware demo-postgres wake, no fleet_full). node-4's serving/session
    # workloads with a large composite group need the 16gi class.
    # Values-only flip: foundation images already deployed at 0.1.169.
    16gi: 1
  # Demand-driven brick autoscale (fleet plan Axis C), pinned explicitly so the
  # cluster's rollout rung is visible here, not implied by a chart default. The
  # ladder is observe -> up -> full, each a values-only flip:
  #   observe: acts statically (identical to before), logs every would-be
  #            decision ("brick autoscale: would scale class ...") for a soak.
  #   up:      denial-driven scale-up acts (clamped to chart maxReplicas);
  #            scale-down stays observe-only.
  #   full:    drain-aware scale-down acts too (idle 15m + fully-exported
  #            victim rail, never below chart minReplicas; 16gi keeps min 1
  #            for a large composite workload).
  # min/max clamps live in the chart values (recorded policy 2026-07-20:
  # min {16gi: 1}, max {2gi: 4, 4gi: 3, 8gi: 2, 16gi: 2}).
  autoscale:
    # up: with the wildcard DaemonSet retired (noded.enabled=false above), bricks
    # are the ONLY capacity, so the BrickController must act on placement-denial
    # pressure and scale classes up (clamped to chart maxReplicas: 2gi 4, 16gi 2)
    # to absorb the migrated workloads. Scale-down stays observe-only until we
    # promote to full. This is what lets the CP choose the optimal brick mix.
    mode: up
  # Per-node brick floor guarantees (PR-3, #35): pins one small brick onto a
  # specific node so it joins active duty instead of the fleet bin-packing
  # everything onto node-4 and spilling under load. CANARY: node-1 only for
  # now, to validate one floor brick before fanning out. node-2/node-3 are
  # commented and ready; each needs its own scratch pre-flight (mountpoint +
  # ~35Gi ext4 loop file) verified on the host BEFORE uncommenting - this is a
  # values-only follow-up PR once the node-1 canary is confirmed healthy
  # (registered in the CP, canary invoke lands a VM, no fleet_full flag).
  nodeFloors:
    - node: node-1
      class: 2gi
    - node: node-2
      class: 2gi
    - node: node-3
      class: 2gi
    # Second 16gi brick, PINNED to node-4 (2026-08-05, after #4371 closed). A
    # floor rather than desiredReplicas 2 because the class Deployment
    # bin-packs by the fleet-wide FC label and could land the second replica
    # on a master's 35Gi loop scratch; session volumes and 4Gi VMs belong on
    # node-4's NVMe. Every node-4 lineage is servable by EITHER brick (the
    # VolumeRoot is node-shared and rejoin dials the scheduler's brick since
    # #4380), so this doubles session admission headroom AND keeps one 16gi
    # brick up through every merge's roll (floors and the class Deployment
    # are separate Deployments on separate sync waves). First same-class
    # co-located pair in the fleet: instance addressing is dual-key
    # (node, pod uid) by design, but watch the first roll. Rollback: delete
    # this entry; volumes strand nothing (node-shared).
    - node: node-4
      class: 16gi

# EmberVM R4 scale-to-zero scratch-postgres (ADR embervm/001, D-R4.PR-11.1).
# DISABLED 2026-08: its only real consumer was the loom deployment (now
# decommissioned), whose connection pool re-dialed after every idle bank and
# kept the workload in a perpetual ~2.6-minute wake/bank cycle; the monolith
# run_python DSN wiring is off in the same change. The block stays because
# demo-postgres shares the guest image pin (Bazel-injected guestImage), the
# workloads rootfs entry, and the 1Password Secret below; only the Workload CR
# itself is gone. Flip enabled back on to restore the tenant datastore (the
# volume outlives the CR; see bankedTtlSeconds vs volume GC in the chart).
scratchPostgres:
  enabled: false
  onepassword:
    itemPath: "vaults/k8s-homelab/items/scratch-postgres"

# Demo-postgres (private demos page sleep/wake exhibit): a second stateful
# Postgres on 5401 with a 1s idle window, so the demo can show the VM banking
# itself moments after a query and relighting on the next connection. Reuses the
# scratch-postgres guest image pin + Secret; its own volume keeps demo rows out
# of real tenants' data.
demoPostgres:
  enabled: true

# ~1s sweeper tick makes the idle bank visibly prompt (default is 30s, which
# would leave the demo VM "awake" for up to half a minute after its 1s idle
# window elapses). Wake cap raised 10 -> 30/min: with a 1s idle bank every demo
# query is a wake, and the default cap would turn quick successive clicks into
# refusals. Both are control-plane-wide; scratch-postgres banking is still
# gated by its own 120s idleBankSeconds.
statefulSweeper:
  sweepIntervalMs: "1000"
  wakeMax: "30"

# Arm the base-retention sweep (base-durability PR-3): one-shot supervised
# reclaim of ~290G of superseded base versions on node-4, then the ongoing
# retention backstop. Every current base is confirmed durable in S3 before any
# local eviction, and hydrate-on-miss restores from S3 on a cold start.
# Rollback: set back to "" and bump the chart; that stops further eviction.
baseRetention:
  # RE-ARMED 2026-08-05 after reading the manifest live (#4290). The sweep named
  # exactly two candidates, both on node-3, both claude-runtime/intel superseded
  # bases aged 25h and 48h, 8.59 GB total, and left tonight's fresh base alone
  # under the 3600s min-age rail. Arming was checked against session state at the
  # same moment: all 70 claude-runtime sessions were terminal (evicted, destroyed,
  # failed), with zero live, parked, or banked, so nothing could be pinned to the
  # candidates.
  #
  # The standing risk from #4364 is NOT closed by that: the keep-set lives in
  # control-plane memory and is never rehydrated on boot, so once real sessions
  # exist again, a CP restart can make a base pinned by a parked session look
  # unreferenced. "A base is reconstructible" is the usual defence, and it is why
  # the remote gate was armed directly, but this cluster has already evicted four
  # sessions with terminal_reason "snapshot_vanished", so a vanished artifact
  # kills the session rather than being silently rebuilt. Land #4364's durable
  # keep-set before session traffic resumes.
  #
  # Rollback: set back to "" and bump the chart; that stops further eviction.
  sweepEnabled: "1"
  # Arm the DISK-DRIVEN eviction path. This is a second gate, added alongside the
  # disk-driven candidate logic so that fixing the enumeration could not silently
  # inherit the legacy gate above, which had been armed since 2026-07-27. Setting
  # sweepEnabled alone leaves the sweep logging "DRY RUN, deletion disabled",
  # because candidates now come from the disk-driven plan and are gated here.
  #
  # Armed after two consecutive live sweeps named the same two candidates and
  # nothing else: node-3 claude-runtime/intel superseded bases aged 25h and 48h,
  # 8.59 GB, with tonight's fresh base correctly spared by the 3600s min-age rail.
  # Rollback is setting this back to "" and bumping the chart; eviction is also
  # capped at 20 per sweep, so a logic error cannot clear the fleet in one pass.
  diskDrivenEnabled: "1"
  # Arm REMOTE base retention (#3947 PR-4, Joe 2026-07-27). Local retention has
  # been reclaiming node disk for a while, but nothing reclaimed the store, so
  # superseded S3 bases accumulated without bound. Armed directly rather than
  # after a dry-run soak because a base is a RECONSTRUCTIBLE artifact: a wrong
  # delete costs a rebuild, not data, and the keep-set already spares a pinned
  # session's base via the primed/session refcount. Rollback is setting this
  # back to "".
  remoteSweepEnabled: "1"

# Arm the warmth-retention sweep (task #36, Joe 2026-07-22): flips the merged-inert
# WarmthReaper from dry-run to acting. With #38 fix C the reaper SKIPS empty-binding
# orphans (all pre-sidecar backlog), so this reclaims steady-state forward (new
# orphans) safely; the existing ~120G backlog is reclaimed separately by the S3-direct
# GC (task #39). Rollback: set back to "" and bump the chart; that stops eviction.
warmthRetention:
  sweepEnabled: "1"

# S3-direct warmth GC (task #39): ARMED 2026-08-04 (the enabled flag below)
# as the supervised second step, after the dry-run manifest
# (gc-manifests/<ts>.json in the embervm bucket) was read and verified.
# Rollback: set enabled back to "" and bump the chart.
# Until 2026-08-04 no manifest had ever been written: the sweep aborted
# empty_cp_state on every run because group_set/ holds leftovers of the
# retired scratch-k8s demo while GroupStore legitimately tracks zero
# instances. allowEmptyKinds is the operator statement that group is retired,
# which lets the sweep finally COMPLETE in dry-run and produce manifests.
# The caps are pre-staged for the drain the census predicts (~2.29 TiB /
# 4611 stateful refs past the 8h TTL): at the 10-prefix/20GiB defaults that
# backlog would take ~19 days of hourly sweeps, at 200/100GiB about a day.
# expectedNodes names the real fleet for the fleet-freshness abort: every
# listed node must be present and fresh in the CP's capacity facts or the
# sweep (dry-run included) aborts.
warmthS3Gc:
  allowEmptyKinds: "group"
  # ARMED (Joe 2026-08-04) after reading dry-run manifest
  # gc-manifests/1785867400387.json: plan 200 prefixes / ~98 GiB (198
  # stateful, 1 session orphan, 1 group_set), 4410 stateful refs / ~2.19 TiB
  # eligible beyond caps, holds proving the guards (3 tier2_protected_newest,
  # 1 desired_ref, 69 younger_than_age_floor). Rollback: set enabled back to
  # "" and bump the chart.
  enabled: "1"
  maxPrefixes: "200"
  maxBytes: "107374182400"
  expectedNodes:
    - node-1
    - node-2
    - node-3
    - node-4
  statefulTtlMs: ""
  sessionTtlMs: ""
  servingTtlMs: ""
  sessionWorkspaceTtlMs: ""
  groupSetTtlMs: ""

# Guest egress lane (ADR 023 phase 6a, issue #4071). Turns on the egress-proxy
# sidecar and tells noded to serve the vsock egress port for each guest. The
# claude runtime is the only guest that dials it; every other guest ignores the
# listener, so this is a lane opening rather than a posture change for the fleet.
#
# Phase 6b: allowlist-forward with the split-horizon guardrail and a
# credential catalog. No CA is minted and the sidecar never terminates TLS. The
# public internet is reachable (external: allow) and the cluster is not
# (internal.default: deny), which is what stops an agent in a guest from reaching
# in-cluster services.
egress:
  enabled: true
  internal:
    # THREE deliberate holes in the split-horizon guardrail. Matching is an exact
    # case-insensitive host compare against BOTH the requested host:port and the
    # resolved ip:port, so a name and its address are both accepted and pinning
    # the resolved IP is what defeats SSRF-by-name and DNS rebinding. No
    # wildcards. internal.default stays deny: this permits these endpoints and
    # nothing else, so a prompt-injected guest still cannot pivot into the
    # cluster. Adding an entry here is a security decision, not tuning.
    #
    # inference: the pi adapter drives the in-cluster Qwen model on this exact
    # host:port.
    # git-mirror: workspace hydration (ADR agents/050). Anonymous read-only
    # upload-pack plus receive-pack restricted to refs/agents/** by the mirror's
    # pre-receive hook; no credential exists on this path.
    # monolith.monolith.svc.cluster.local:8091
    # Monolith progress-ingest (8091): mid-turn visibility, write-only single route
    # (ADR 051). Port 8091 only; the main API on 8000 stays deny. Token-bearer auth
    # bounds what a prompt-injected guest can write to (its own session's
    # partial_text), not network access.
    allowlist:
      - inference.inference.svc.cluster.local:8080
      - git-mirror.monolith.svc.cluster.local:9418
      - monolith.monolith.svc.cluster.local:8091
  # The claude runtime's subscription OAuth token. The sidecar SETS the
  # Authorization header on requests to api.anthropic.com and originates the
  # verified TLS to :443 itself, so the credential never exists inside a guest
  # that runs model-driven, prompt-injectable code.
  #
  # There is nothing to keep in sync with the guest. The guest sends whatever it
  # likes in this header (the claude CLI refuses to make any request until it
  # believes it is logged in, so it must send something) and the sidecar discards
  # it. That also means a prompt-injected guest cannot authenticate as a different
  # account by supplying a token of its own.
  #
  # egressTo bounds where the credential can go: api.anthropic.com only, exact
  # host match, no wildcards. If this entry's secret ever fails to resolve, those
  # hosts are DENIED rather than tunnelled, because the guest addresses them in
  # cleartext and a fall-through would put the prompt on the public internet.
  secrets:
    - header: Authorization
      valuePrefix: "Bearer "
      env: EMBER_ANTHROPIC_OAUTH_TOKEN
      egressTo:
        - api.anthropic.com
      secretRef:
        name: embervm-embervm-egress
        key: CLAUDE_AUTH_TOKEN
    # Note: credential field absent (deferred); fails closed until 1Password
    # operator fills vaults/k8s-homelab/items/litellm-claude-auth. Co-location
    # caveat: this item is also read by monolith gardener; adding a field is
    # values-only; separate item would require onepassworditem-egress.yaml
    # loop (deferred).
    - header: "Authorization"
      valuePrefix: "Bearer "
      egressTo:
        # The subscription backend, not api.openai.com: codex in ChatGPT mode
        # talks to chatgpt.com/backend-api (verified against rust-v0.146.0).
        - "chatgpt.com"
      # The subscription grant supplies short-lived tokens. If the broker is
      # absent or unavailable, the sidecar fails closed and denies this host.
      brokerGrant: "codex-cluster"
      claimHeader: "chatgpt-account-id"
      claimPath: "https://api.openai.com/auth.chatgpt_account_id"
      # The CLI's rmcp connector client sends no Authorization header at all
      # (verified against rust-v0.146.0 and the 0.147.0-alpha line), so
      # presence-keying can never admit it: this exact path is the explicit
      # opt-in, and claim-resolution failure still denies (issue #4298).
      injectAlwaysPaths:
        - /backend-api/ps/mcp
  # Shared with the monolith gardener, which reads the same item. Read-only sync,
  # so two consumers is fine; the field label CLAUDE_AUTH_TOKEN becomes the key.
  onepassword:
    name: embervm-embervm-egress
    itemPath: "vaults/k8s-homelab/items/litellm-claude-auth"

# Voice-drivable Claude Code agent sessions (issue #4055). The monolith addresses
# this workload by name, so it must exist before agent_sessions can create a
# session at all. Sizing and the node disk arithmetic are in chart/values.yaml.
claudeRuntimeWorkload:
  enabled: true
  # Epoch entry to force a base rebuild (issue #4371): init_env is in the
  # workload signature, so this re-keys and rebuilds ONLY the claude-runtime
  # base. Needed alongside noded.warmRestoreWithVolumeClasses above because the
  # base key deliberately excludes noded config; without this the armed 16gi
  # brick would keep serving its placeholder-less base and every session create
  # would fail at the drive PATCH. The value is inert guest env; bump it any
  # time capture behaviour changes node-side.
  #
  # warm-restore-2: the CP restarted during the pre-#4381 window when the brick
  # coin-flipped its advertised ref, adopted the STALE placeholder-less ref as
  # recorded, and reconcile's signature-match no-op froze it there, so creates
  # and rejoins kept restoring the old base after every fact-side fix. Moving
  # the epoch re-keys the base, which forces a re-record and a fresh build that
  # every consumer (recorded ref, node facts, retention desired set) converges
  # on.
  initEnv:
    EMBER_BASE_EPOCH: "warm-restore-2"
    # initEnv participates in the base signature, so this re-keys and rebuilds
    # only the claude-runtime base at the next chart bump. Prewarm failure fails
    # the base build by design.
    EMBER_PREWARM_CLIS: "claude"
  # ON. The ADR 027 memory:false/filesystem:true quadrant: sessions ride
  # per-lineage workspace volumes with park/rejoin instead of memory-snapshot
  # banking, and raw files in S3 replace multi-GiB snapshots.
  #
  # Every earlier failure traced to one bug: a session cold boot dropped into
  # /bin/sh because init= was never put on its kernel cmdline (#4271). It was
  # long blamed on noded's lineage-volume Prime path, which was wrong.
  #
  # The disarm that followed was also diagnosed wrong, twice over. It blamed
  # "seven arms of 10 GiB workspace images", but the volumes are sparse
  # (noded/volume/volume.go:142 Truncates rather than zero-fills), and it named
  # node-4, whose NVMe scratch was 26% used the whole time. What actually filled
  # was the masters' 35 GiB capped loop scratch, holding FOUR retired 4 GiB
  # claude-runtime bases each, one per chart publish. The base retention sweep
  # logs "0 candidates" against them because it only sweeps live registry
  # entries (#4286). That is the real cost of arming this: every publish leaks
  # another 4 GiB per brick until the GC is fixed, so watch headroom under
  # /var/lib/embervm/scratch on node-1/2/3 rather than on node-4.
  persistenceEnabled: true
