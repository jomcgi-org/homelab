apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embervm
  namespace: argocd
  annotations:
    # Opts production in to Kargo promotion. See the equivalent comment in
    # dev/deploy/application.yaml for why this guard exists and what its
    # absence looks like (an Errored Promotion and nothing else complaining).
    #
    # Carrying this is NOT what makes production promote automatically. The
    # embervm prod Stage sets autoPromotion: false, so promotion here is a
    # deliberate click: every prod roll rebuilds each brick's guest rootfs and
    # spends unreclaimed master scratch (#4364). This annotation only says the
    # click is allowed to take effect.
    kargo.akuity.io/authorized-stage: kargo-embervm:prod
spec:
  project: default
  sources:
    # Chart from OCI (pushed by CI via Bazel helm_push); image tag pinned at build.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: embervm
      targetRevision: 0.54.4
      helm:
        valueFiles:
          - $values/projects/embervm/deploy/values.yaml
    # Git repo for environment-specific values.
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Own namespace; nothing monolith-coupled.
    namespace: embervm
  ignoreDifferences:
    # The BrickController owns each brick Deployment's replica count: the chart
    # value is only the count at FIRST create, and the controller PATCHes /scale
    # thereafter from demand-driven autoscale. With selfHeal on, ArgoCD would
    # revert every scale decision back to the chart value, so /spec/replicas has
    # to stay out of the diff for this app.
    #
    # This used to be inherited from a fleet-wide argocd-cm rule. That rule was
    # removed because it applied to EVERY Deployment in the cluster, silently
    # making any git-declared replica count unchangeable while the Application
    # still reported Synced and Healthy (cloudflare-gateway PR #4168 merged
    # green and moved nothing). monolith and monolith-public already carried
    # their own copies of this; embervm was relying on the fleet-wide one, so it
    # is made explicit here. Mirrors those two apps.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The token broker owns the OAuth grant Secrets' DATA: the chart declares
    # each embervm-oauth-grant-* Secret empty (so RBAC resourceNames can scope
    # to it) and the broker writes the rotating bundle at login and on every
    # refresh. With selfHeal on, diffing /data would revert the bundle to the
    # empty chart declaration, silently revoking the grant (the exact
    # reseed-from-static-copy failure ADR 048 forbids). One entry PER GRANT;
    # the loud contract next to tokenBroker.grants in chart/values.yaml points
    # here.
    - kind: Secret
      name: embervm-oauth-grant-codex-cluster
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
