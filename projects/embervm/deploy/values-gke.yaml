# GKE hub overrides. This file is applied after deploy/values.yaml.

# The hub starts with node-local state only. An empty endpoint is the chart's
# safe store-disabled mode, and no object-store credentials are rendered.
noded:
  # Base store on same-region GCS via the S3 interop endpoint (free bandwidth
  # both directions inside europe-west2; R2 would pay GCP egress on every
  # export). HMAC credentials for ember-base-store@h0melab minted through the
  # temporary org-policy window, stored in 1Password. With constantly shifting
  # snapshots this is what makes a fresh Spot node restore bases on miss
  # instead of the ~11 minute cold rebuild.
  store:
    endpoint: "https://storage.googleapis.com"
    bucket: "h0melab-ember-bases"
    credentials:
      enabled: true
      onepassword:
        itemPath: "vaults/k8s-homelab/items/embervm-base-store-gcs"
  # CiliumNetworkPolicy-shaped; no Cilium CRDs on the hub (same trade as the
  # monolith overlays). Plain NetworkPolicy replacements come with activation
  # hardening.
  networkPolicy:
    enabled: false
  # Bricks stay evict-first but must be able to summon a node: at the chart
  # default homelab-disposable (-1000) they sit below the cluster autoscaler's
  # expendable cutoff (-10), so a Pending brick NEVER triggers scale-up (the
  # 2026-09-01 silent 34-minute Pending 8gi). See the class definition in
  # projects/platform/priority-classes.
  priorityClassName: homelab-preemptible

# Broker on, its CiliumNetworkPolicy off (no Cilium CRDs on the hub; same
# trade as noded.networkPolicy above). Without the broker the codex-cluster
# grant never populates and every codex-lane session turn fails with
# "-32600: failed to load configuration". The grant Secret's /data is
# ignoreDifferences'd in projects/gke-apps/embervm/application.yaml per the
# loud contract in chart/values.yaml. Fresh state: the bundle needs one
# codex-broker-login round to seed the refresh token.
tokenBroker:
  enabled: true
  networkPolicy:
    enabled: false

# 2gi bricks scale horizontally for the small guests; the 4gi class exists
# because the fleet has consumers that cannot fit a 2gi brick at all: the
# semgrep task guest is 1536 MiB (its primed floor sat unsatisfied and every
# scan hung at wait=true until 2026-09-01), and pi-runtime sessions were
# taking steady no_capacity denials with the 2gi class at its ceiling. The
# ember-bricks node pool autoscales (max 3 nodes), so a 4gi brick that does
# not fit the current node adds one. 8gi/16gi stay off; explicit zeros
# prevent deep-merge leakage. #5459 tracks the fuller session-class design.
bricks:
  desiredReplicas:
    2gi: 1
    4gi: 1
    # claude-runtime sessions (luna/terra/sol codex lane) are memMib 4096 and
    # fit NOTHING smaller: 4gi usable is 3840, so with 8gi off every session
    # create was denied :no_capacity (2026-09-01). One 8gi brick (usable 7936)
    # hosts one live session; autoscale headroom adds a second for concurrency.
    8gi: 1
    16gi: 0
  nodeFloors: []
  autoscale:
    minReplicas:
      16gi: 0
    maxReplicas:
      4gi: 2
      8gi: 2
      16gi: 0
# GKE node names are not known before provisioning. An empty list keeps the
# fleet-freshness guard closed.
warmthS3Gc:
  expectedNodes: []

# Only services reachable from the hub belong on the internal lane. searxng
# runs on the hub; inference is reached through the node-4 tailnet bridge
# (same ports the bare-metal servers keep after the wipe).
egress:
  internal:
    allowlist:
      - monolith.monolith.svc.cluster.local:8091
      - monolith-public-frontend.monolith-public.svc.cluster.local:3000
      - monolith.monolith.svc.cluster.local:3000
      - monolith-searxng.monolith.svc.cluster.local:8080
      - inference-bridge.tailscale.svc.cluster.local:8080
      - inference-embeddings.inference.svc.cluster.local:8080

# Home provisions node scratch out of band (dedicated NVMe); the hub has no
# such bootstrap, so the chart actuator provisions the capped ext4 loop file
# at /var/lib/embervm/scratch on the FC-labeled Spot node. The brick pod was
# stuck FailedMount without it.
scratchPrep:
  enabled: true

# Single-Spot-node fleet: 2gi bricks scale horizontally (chart ceiling 4);
# the big classes are capped off, including the chart default 16gi warm floor
# (a home policy for the scratch-k8s composite). Revisit the session-class
# ceiling and group-spread when the qwen lane revives (#5459, #5461).

# Stateful relight is broken on the hub: a bundle banked on one brick can be
# relit on a sibling brick (four bricks share the node and its scratch tree, a
# layout home never had), and the resumed guest never answers on its pinned tap
# IP ("stateful guest not ready over tap"). With the chart's 1-second idle bank
# the demo parked after every probe and re-rolled that broken relight
# constantly, so the public exhibit cycled failed -> cold boot all night
# (2026-09-01). Ten minutes keeps the instance hot between probes so relight
# is a rare path until the defect is fixed; revert to the chart default when
# it is.
demoPostgres:
  idleBankSeconds: 600
