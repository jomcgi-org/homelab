# GKE hub overrides. This file is applied after deploy/values.yaml.

claudeRuntimeWorkload:
  # cap must sit at or above the monolith's agentSessions.admission.total (24):
  # every family but pi lands here, and a permit the guest cap refuses fails
  # its turn with workload_cap instead of waiting. At 8 against 23 permits,
  # everything past the eighth live session failed (2026-10-01). Placement
  # still gates each create on real node memory, and three 8gi bricks at
  # noded.maxLiveVMs 16 give 48 live slots, so 24 is the binding bound.
  cap: 24
  session:
    # Live plus banked; stays above cap so a burst of creates can still bank.
    maxSessions: 32
  # 3 GiB, down from the base 4096. Measured 2026-10-01 on the one live 8gi
  # brick: five claude-runtime guests at 274 MiB to 1.0 GiB Firecracker RSS,
  # which is each guest's touched-page high-water mark (there is no balloon),
  # so none had ever used more than a quarter of 4 GiB. Bazel no longer runs in
  # session guests (CI on BuildBuddy builds), which was the case 4 GiB was
  # sized for. Not 2 GiB: Opus planner turns hold up to 1M tokens of context
  # in the CLI's V8 heap. 3072 + the 512 MiB reject floor fits a 4gi brick
  # (usable 3840), so the 4gi class can now host sessions too. memMib is a
  # base-signature input, so this rebuilds the claude-runtime base once.
  # Rollback: delete this line. Watch for guest OOM until #5805 reports
  # guest memory pressure.
  memMib: 3072

# The hub starts with node-local state only. An empty endpoint is the chart's
# safe store-disabled mode, and no object-store credentials are rendered.
noded:
  enforceBundleRootfsIdentity: false
  jailer:
    # Disarmed again on 2026-09-06 after the arming (#5843) broke every VM
    # restore on the rolled bricks: the jailed Firecracker cannot open the
    # node-shared base rootfs under /var/lib/embervm/scratch ("Permission
    # denied (os error 13)" from the virtio block backend), so the 2gi and
    # 4gi bricks came up with no bootable VM. The scratch tree is owned by
    # noded's uid and the jailer drops to its own; that ownership contract
    # has to land before the flag can go back on. Tracked on #5255.
    enabled: false
  drain:
    # Since #6256 (PR 6268) a brick publication interrupts the running guest
    # turn, gives it a bounded flush window (EMBERVM_SESSION_DRAIN_FLUSH_MS,
    # 60s), banks at the between-turns safe point, and the next brick relights
    # the session as its next turn. So the drain only has to cover flush plus
    # bank, not a whole factory turn: 150s here, and Kubernetes adds the
    # chart's 30s shutdown margin for a 180s termination grace. The two hour
    # interim from #6216 is gone with the image that carries the relay.
    timeoutSeconds: 150
    # GCE preemption notice watcher (ADR embervm/040 decision 5). Armed on the
    # hub only: the watcher hangs GETs on the instance/preempted metadata value,
    # which exists nowhere but GCE. Until it is armed every Spot preemption
    # force-banks against the ordinary rollout budget, far past what GCE
    # actually gives, so the separate short budget remains load-bearing.
    # preemptionTimeoutSeconds stays at the chart default (20s).
    preemptionNoticeEnabled: true
  firecracker:
    # Whole-string override: repeat the production progress token from the
    # home values alongside the GKE agent MCP token. guest-init decodes
    # ember.env.<KEY>=<base64url> into the guest environment, which is the only
    # values-driven way a guest-read setting reaches the shim (initEnv is a
    # base-signature input only, #4429). The MCP value is
    # http://monolith-agents-agents.monolith-agents.svc.cluster.local:8092/mcp
    # base64url-encoded without padding; the shim reads it as
    # EMBER_AGENT_MCP_URL and writes the CLIs' MCP config from it (#5569).
    # Bricks roll on this change. Verify build-node boot arguments before a
    # new base captures the environment; an early-built base needs a rekey.
    kernelBootArgs: "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda ro ember.env.EMBER_AGENT_MCP_URL=aHR0cDovL21vbm9saXRoLWFnZW50cy1hZ2VudHMubW9ub2xpdGgtYWdlbnRzLnN2Yy5jbHVzdGVyLmxvY2FsOjgwOTIvbWNw ember.env.EMBER_PROGRESS_URL=aHR0cDovL21vbm9saXRoLm1vbm9saXRoLnN2Yy5jbHVzdGVyLmxvY2FsOjgwOTEvaW5nZXN0L3Byb2dyZXNz"
  # Base store on same-region GCS via the S3 interop endpoint (free bandwidth
  # both directions inside europe-west2; R2 would pay GCP egress on every
  # export). HMAC credentials for ember-base-store@h0melab minted through the
  # temporary org-policy window, stored in 1Password. With constantly shifting
  # snapshots this is what makes a fresh Spot node restore bases on miss
  # instead of the ~11 minute cold rebuild.
  store:
    endpoint: "https://storage.googleapis.com"
    bucket: "h0melab-ember-bases"
    credentials:
      enabled: true
      onepassword:
        itemPath: "vaults/k8s-homelab/items/embervm-base-store-gcs"
  # Bricks stay evict-first but must be able to summon a node: at the chart
  # default homelab-disposable (-1000) they sit below the cluster autoscaler's
  # expendable cutoff (-10), so a Pending brick NEVER triggers scale-up (the
  # 2026-09-01 silent 34-minute Pending 8gi). See the class definition in
  # projects/platform/priority-classes.
  priorityClassName: homelab-preemptible

# Broker on. Network isolation remains successor work; the inert Cilium
# templates were removed in #5816. Without the broker the codex-cluster
# grant never populates and every codex-lane session turn fails with
# "-32600: failed to load configuration". The grant Secret's /data is
# ignoreDifferences'd in projects/gke-apps/embervm/application.yaml per the
# loud contract in chart/values.yaml. Fresh state: the bundle needs one
# codex-broker-login round to seed the refresh token.
tokenBroker:
  enabled: true
  # Chart/values skew guard: Kargo pins the live embervm chart (0.93.13 at the
  # time of writing), and that chart still ships the tokenbroker
  # CiliumNetworkPolicy template defaulting to enabled. The hub has no Cilium
  # CRDs, so without this key the pinned chart renders the policy and every
  # sync fails. Charts after #5816 ignore the key. Remove it once Kargo has
  # promoted embervm past the template removal.
  networkPolicy:
    enabled: false
  plaintext:
    # Stage 2 of #5791, a separate decision. Port 8080 keeps serving refresh,
    # login/* and quota until this is armed.
    retireProtectedRoutes: false
  spiffe:
    # Stage 1 of #5791: serve the SPIFFE mTLS listener on 8443. With it on,
    # GET /grants/<g>/token is mTLS-only, so egress.tokenBroker.spiffe below
    # flips in the same commit. Rollback is both back to false; no credential
    # or data change is involved.
    enabled: true
    # The noded ServiceAccount (egress-proxy sidecar) and the production
    # monolith ServiceAccount (login proxy and quota reader).
    clientSpiffeIds:
      - spiffe://embervm.jomcgi.dev/ns/embervm/sa/embervm-embervm-noded
      - spiffe://embervm.jomcgi.dev/ns/monolith/sa/monolith
  # authentik client_credentials minter (#5633 1f). The agent tier and authentik
  # both run on the hub; the broker still reaches authentik over its public
  # hostname, the same route every other client uses.
  authentik:
    enabled: true
    tokenEndpoint: "https://auth.jomcgi.dev/application/o/token/"
    clientID: "mcp-agents"
    scope: "openid profile email"
    username: "kg-agent-sa"
    appPasswordRef:
      name: embervm-authentik-agent
      key: app-password
  # Helm replaces lists rather than merging them, so codex-cluster is repeated
  # here; dropping it would delete the codex lane's grant.
  grants:
    - name: codex-cluster
      provider: codex-chatgpt
      fqdn: auth.openai.com
    # Second Codex account (#5974). Registered here so the broker holds its
    # Secret and accepts its device-flow login. It is device-logged and
    # pooled: the chatgpt.com catalog entry in deploy/values.yaml names both
    # grants in brokerGrants, so the sidecar routes to it by remaining quota.
    # Log a grant in BEFORE pooling it: an unlogged pool member is skipped
    # with a cooldown, not fatal, but it costs a broker round trip a minute.
    - name: codex-b
      provider: codex-chatgpt
      fqdn: auth.openai.com
    - name: agent-mcp
      provider: authentik
      fqdn: auth.jomcgi.dev

# Task demos use spare GKE capacity without a warm minimum.
bazelQueryWorkload:
  floor: 0

# 2gi bricks scale horizontally for the small guests; the 4gi class exists
# because the fleet has consumers that cannot fit a 2gi brick at all: the
# since-removed semgrep task guest was 3072 MiB (its primed floor sat
# unsatisfied and scans hung at wait=true), and pi-runtime sessions were
# taking steady no_capacity denials with the 2gi class at its ceiling. The
# ember-bricks node pool autoscales (max 3 nodes), so a 4gi brick that does
# not fit the current node adds one. 8gi/16gi stay off; explicit zeros
# prevent deep-merge leakage. #5459 tracks the fuller session-class design.
bricks:
  # CPU requests sized to measured noded use on the hub (2026-10-01, under
  # factory and KG load): 2gi 1.1-1.5 cores, 4gi 1.7-1.9, 8gi 1.7-2.4. The
  # home ladder requests 0.5/1/1, so the scheduler saw room for every brick on
  # one n2-standard-8 while it ran at 92-101% CPU and the pool autoscaler never
  # added a node. With requests near real use, a third brick no longer fits
  # one node and lands on a second Spot node, which the pool drains away when
  # idle. Memory requests and limits are unchanged. Helm replaces lists, so
  # this repeats the whole ladder from deploy/values.yaml; keep maxLiveVMs and
  # memory in sync with it.
  classes:
    - name: 1gi
      maxLiveVMs: 6
      resources:
        requests:
          cpu: 500m
          memory: 768Mi
        limits:
          memory: 1Gi
    - name: 2gi
      maxLiveVMs: 14
      resources:
        requests:
          cpu: "1"
          memory: 1536Mi
        limits:
          memory: 2Gi
    - name: 4gi
      resources:
        requests:
          cpu: "2"
          memory: 3Gi
        limits:
          memory: 4Gi
    - name: 8gi
      resources:
        requests:
          cpu: "3"
          memory: 6Gi
        limits:
          memory: 8Gi
    - name: 16gi
      resources:
        requests:
          cpu: "4"
          memory: 12Gi
        limits:
          memory: 16Gi
  # progressDeadlineSeconds is the chart default (3600s): a healthy cold brick
  # rebuild still needs it, and the drain no longer waits on a factory turn.
  desiredReplicas:
    2gi: 1
    4gi: 1
    # claude-runtime sessions (luna/terra/sol codex lane) need memMib 3072 plus
    # the 512 reject floor, so a 4gi (usable 3840) or 8gi brick. Placement
    # admits on observed memory, not nominal memMib, so one 8gi brick (usable
    # 7936) hosts several live sessions: five on 2026-10-01 at ~3.5 GiB
    # resident in total.
    8gi: 1
    16gi: 0
  nodeFloors: []
  autoscale:
    ceilingBound: {}
    minReplicas:
      # Never drain the last 8gi brick. claude-runtime (4096 MiB) fits only an
      # 8gi brick, and a class at zero cannot come back: with no bricks
      # registered, Scheduler.place_with_demand returns :no_bricks WITHOUT
      # recording demand, so the BrickController never sees a denial to scale
      # up on. On 2026-09-30 full-mode idle_drain took 8gi 1 -> 0 at 03:53 and
      # every session create failed until a manual scale. Keep this floor until
      # scale-from-zero records demand.
      8gi: 1
      16gi: 0
    # 8gi up to 3: an ember-bricks node is an n2-standard-8 with ~27.5 GiB
    # allocatable and an 8gi brick requests 6Gi (8Gi limit), so three bricks
    # (18Gi requested, 24Gi limits) pack onto the one node already running,
    # which was carrying a single brick and leaving ~20 GiB idle. The pool's
    # autoscaler adds a node only when requests stop fitting. CPU, not memory,
    # is the next ceiling: 2 vCPU guests share the node's 8.
    maxReplicas:
      4gi: 2
      8gi: 3
      16gi: 0

# THIS DISARM is the load-bearing GKE safety piece. Base values arm destructive
# deletion, while in-memory node tombstones do not survive a CP restart and are
# defense in depth rather than the guarantee.
warmthS3Gc:
  enabled: ""

# Only services reachable from the hub belong on the internal lane. Meta Spark
# uses the external credentialed egress catalog instead.
egress:
  # Stage 1 of #5791: the egress-proxy sidecar fetches tokens and reports quota
  # over the broker's SPIFFE mTLS port. Paired with tokenBroker.spiffe.enabled;
  # SPIRE agent and CSI driver run on every hub node pool.
  tokenBroker:
    spiffe:
      enabled: true
  internal:
    allowlist:
      - monolith.monolith.svc.cluster.local:8091
      - monolith-public-frontend.monolith-public.svc.cluster.local:3000
      - monolith.monolith.svc.cluster.local:3000
      - monolith-searxng.monolith.svc.cluster.local:8080
      - inference-embeddings.inference.svc.cluster.local:8080
      # The agent MCP surface (#5633 1g). Port 8092 only: the tier has no other listener.
      - monolith-agents-agents.monolith-agents.svc.cluster.local:8092

# Home provisions node scratch out of band (dedicated NVMe); the hub has no
# such bootstrap, so the chart actuator provisions the capped ext4 loop file
# at /var/lib/embervm/scratch on the FC-labeled Spot node. The brick pod was
# stuck FailedMount without it.
scratchPrep:
  enabled: true

# 70 GiB, up from the chart's 35. On 2026-10-01 the one ember-bricks node
# (94 GiB boot disk, 44 GiB free on the host) ran its 34 GiB loop to 93% and
# then out of space: three brick classes, embervm-dev's nested scratch
# (~11 GiB), the warm bases and one workspace volume per live session all
# share it, and session volumes provisioning failed with ENOSPC. The loop is
# sparse, so the cap costs only what is written. scratch-prep never grows an
# existing image: this applies when a node is created (Spot replacement or a
# pool roll), not to the node already running.
scratchSizeGi: 70

# Single-Spot-node fleet: 2gi bricks scale horizontally (chart ceiling 4);
# the big classes are capped off, including the chart default 16gi warm floor
# (a home policy for the scratch-k8s composite). Revisit the session-class
# ceiling and group-spread when the Spark lane revives (#5459, #5461).

statefulSweeper:
  pressureBanking:
    # Armed on the hub (#4667 decision D15). The lane landed off because
    # cross-brick stateful relight was broken (#5502); #5502 and #5521 are
    # closed, so the stated reason to stay off is gone. Thresholds stay at the
    # chart defaults. Revert is this one line.
    enabled: true

# Drain only the sessions on the draining brick instance. Every size class
# shares the ember-bricks node, so a node-scoped drain made each autoscaler
# idle drain of an EMPTY brick interrupt every live turn on the node's 8gi
# brick (2026-10-01 00:44:42 and 02:04:42). A session with unknown placement
# is still drained. Revert is this one line.
drainInstanceScopedSessions: true
