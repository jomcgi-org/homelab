# GKE hub overrides. This file is applied after deploy/values.yaml.

# The hub starts with node-local state only. An empty endpoint is the chart's
# safe store-disabled mode, and no object-store credentials are rendered.
noded:
  # Base store on same-region GCS via the S3 interop endpoint (free bandwidth
  # both directions inside europe-west2; R2 would pay GCP egress on every
  # export). HMAC credentials for ember-base-store@h0melab minted through the
  # temporary org-policy window, stored in 1Password. With constantly shifting
  # snapshots this is what makes a fresh Spot node restore bases on miss
  # instead of the ~11 minute cold rebuild.
  store:
    endpoint: "https://storage.googleapis.com"
    bucket: "h0melab-ember-bases"
    credentials:
      enabled: true
      onepassword:
        itemPath: "vaults/k8s-homelab/items/embervm-base-store-gcs"
  # CiliumNetworkPolicy-shaped; no Cilium CRDs on the hub (same trade as the
  # monolith overlays). Plain NetworkPolicy replacements come with activation
  # hardening.
  networkPolicy:
    enabled: false

# The tokenBroker's network policy has no separate gate, so the whole broker
# waits for either a plain NetworkPolicy port or Cilium on GKE; agent OAuth
# grants are down until then.
tokenBroker:
  enabled: false

# One 2 GiB brick fits the single n2-standard-8 spot node while leaving room
# for serving and node overhead. Explicit zeros prevent deep-merge leakage.
bricks:
  desiredReplicas:
    2gi: 1
    4gi: 0
    8gi: 0
    16gi: 0
  nodeFloors: []

# GKE node names are not known before provisioning. An empty list keeps the
# fleet-freshness guard closed.
warmthS3Gc:
  expectedNodes: []

# Only services reachable from the hub belong on the internal lane. searxng
# runs on the hub; inference is reached through the node-4 tailnet bridge
# (same ports the bare-metal servers keep after the wipe).
egress:
  internal:
    allowlist:
      - monolith.monolith.svc.cluster.local:8091
      - monolith-public-frontend.monolith-public.svc.cluster.local:3000
      - monolith.monolith.svc.cluster.local:3000
      - monolith-searxng.monolith.svc.cluster.local:8080
      - inference-bridge.tailscale.svc.cluster.local:8080
      - inference-embeddings.inference.svc.cluster.local:8080

# Home provisions node scratch out of band (dedicated NVMe); the hub has no
# such bootstrap, so the chart actuator provisions the capped ext4 loop file
# at /var/lib/embervm/scratch on the FC-labeled Spot node. The brick pod was
# stuck FailedMount without it.
scratchPrep:
  enabled: true

# Single-Spot-node fleet: 2gi bricks scale horizontally (chart ceiling 4);
# the big classes are capped off, including the chart default 16gi warm floor
# (a home policy for the scratch-k8s composite). Revisit the session-class
# ceiling and group-spread when the qwen lane revives (#5459, #5461).
bricks:
  autoscale:
    minReplicas:
      16gi: 0
    maxReplicas:
      4gi: 0
      8gi: 0
      16gi: 0
