# EmberVM Workload CRD (v1alpha1) — the entire v1 management surface.
#
# A Workload is low-churn declarative intent: an OCI image the platform turns
# into a pristine base snapshot, plus the resource shape, concurrency floor/cap,
# invocation policy (timeout/retry/DLQ/result TTL), and optional cron triggers
# for task execution. kubectl + Helm + ArgoCD are the whole surface; there is no
# bespoke API.
#
# v1 invariants held for later rungs (cheap now, expensive to retrofit):
#   - spec.class is an enum reserving session|serving|stateful (R2/R3/R4); task,
#     session, and serving are valid as of R3, stateful remains reserved.
#   - spec.source is a oneOf so the R1 zip/runtime-shim lane is a schema
#     addition, not a reshape; only `image` is implemented.
#   - spec.group (R5 composite groups) is deliberately RESERVED, not defined:
#     when it lands it is a new optional block, so v1alpha1 CRs stay valid.
#   - status.snapshotRef carries no volumeGeneration in the task class (task VMs
#     are single-use, no volumes); the R4 stateful class will pair a
#     volumeGeneration with the snapshot. Recorded here so the field is expected.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloads.embervm.dev
spec:
  group: embervm.dev
  scope: Namespaced
  names:
    kind: Workload
    listKind: WorkloadList
    plural: workloads
    singular: workload
    shortNames:
      - wl
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.class
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Snapshot
          type: string
          jsonPath: .status.snapshotRef
        - name: Sessions
          type: string
          description: Live/banked session counts (session class only).
          jsonPath: .status.sessionsSummary
        - name: Serving
          type: string
          description: Live/banked/published instance counts (serving class only).
          jsonPath: .status.servingSummary
        - name: Stateful
          type: string
          description: Instance state and generation/bundle pairing (stateful class only).
          jsonPath: .status.statefulSummary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - class
                - source
                - resources
              properties:
                class:
                  type: string
                  description: >-
                    Isolation/lifecycle class. task, session, serving, and
                    stateful are valid as of R4. The stateful class is a
                    scale-to-zero singleton datastore (one long-lived microVM
                    owning one writable volume, reachable over opaque L4 TCP).
                    concurrency is required by the watcher for task/session/serving
                    but forbidden for stateful (singleton by construction), which
                    is why it is no longer a schema-level required field; the
                    watcher enforces the per-class requiredness via a status
                    condition (the same pattern as the session/serving blocks).
                  enum:
                    - task
                    - session
                    - serving
                    - stateful
                source:
                  type: object
                  description: >-
                    Where the guest comes from. A oneOf: exactly one member is
                    set. `image` bakes an OCI image directly; `zip` (R1 zip lane,
                    ADR embervm/002) layers an adopter's zip archive onto a
                    pinned runtime base image (no toolchain for the adopter).
                  properties:
                    zip:
                      type: object
                      description: >-
                        The R1 zip lane: bring only a zip archive with a
                        `handler` callable. The control plane resolves `runtime`
                        to the pinned runtime base image, hands noded the archive
                        URL + sha256, and the runtime shim unpacks and imports
                        the handler guest-side before the base is snapshotted.
                      required:
                        - runtime
                        - codeUri
                        - sha256
                      properties:
                        runtime:
                          type: string
                          description: >-
                            The runtime base the archive layers onto. Exactly one
                            value in v1alpha1: python312 (Python 3.12 + the baked
                            dependency subset).
                          enum:
                            - python312
                        codeUri:
                          type: string
                          description: >-
                            Object-store URL of the zip archive. noded HTTP GETs
                            it over the pod network (the in-cluster read path);
                            the control plane owns upload and URL minting.
                        sha256:
                          type: string
                          description: >-
                            Hex-encoded SHA-256 of the archive bytes. REQUIRED:
                            noded verifies the fetched bytes against it and fails
                            the build on a mismatch, and it feeds the base-build
                            change-detect signature so a re-registered function
                            (new zip, same name) rebuilds.
                        handler:
                          type: string
                          description: >-
                            `module.attr` of the python handler callable, passed
                            to the guest as EMBER_HANDLER.
                          default: app.handle
                        invokePath:
                          type: string
                          description: >-
                            Path tasks are POSTed to (matches the runtime image
                            default). Overridable per submit with the
                            X-Ember-Guest-Path header.
                          default: /invoke
                        readyPath:
                          type: string
                          description: Guest readiness path (200 = ready).
                          default: /shim/ready
                    image:
                      type: object
                      required:
                        - ref
                        - port
                      properties:
                        ref:
                          type: string
                          description: >-
                            OCI reference, digest-pinned or tag. A tag is
                            resolved to a digest at base-build time and the
                            digest recorded in status (deploys are explicit CR
                            updates, never tag drift).
                        port:
                          type: integer
                          description: Guest HTTP server port (over vsock).
                          minimum: 1
                          maximum: 65535
                        readyPath:
                          type: string
                          description: Guest readiness path (200 = ready).
                          default: /shim/ready
                        invokePath:
                          type: string
                          description: >-
                            Path tasks are POSTed to. Overridable per submit
                            with the X-Ember-Guest-Path header.
                          default: /
                        initEnv:
                          type: object
                          description: >-
                            Environment baked into the guest at base-build time.
                          additionalProperties:
                            type: string
                  oneOf:
                    - required:
                        - image
                    - required:
                        - zip
                resources:
                  type: object
                  required:
                    - vcpus
                    - memMib
                  properties:
                    vcpus:
                      type: integer
                      minimum: 1
                      maximum: 8
                    memMib:
                      type: integer
                      minimum: 128
                      maximum: 16384
                concurrency:
                  type: object
                  required:
                    - cap
                  properties:
                    floor:
                      type: integer
                      description: >-
                        Primed-pool floor (pristine VMs kept warm per workload).
                        For the session class, the floor is the pristine pool
                        kept warm for fast session CREATE (create is assignment
                        from a primed VM); for the task class it is warm task
                        capacity.
                      minimum: 0
                      default: 0
                    cap:
                      type: integer
                      description: >-
                        Hard max in-flight. Must be >= floor. For the task class,
                        max in-flight tasks; for the session class, max LIVE
                        session VMs (banked sessions hold only disk, not a live
                        VM, and do not count against the cap). For the serving
                        class, cap is an alias for spec.serving.maxInstances and
                        MUST agree with it when both are set (the watcher rejects
                        a mismatch with a status condition); floor is unused for
                        serving, minInstances is the floor concept there.
                      minimum: 1
                session:
                  type: object
                  description: >-
                    Session-class lifecycle policy (R2). REQUIRED when
                    spec.class is `session` and forbidden otherwise; the watcher
                    enforces that cross-field rule with a status condition (the
                    OpenAPI schema cannot express class-conditional requiredness).
                    A session is a long-lived logical sandbox banked to a node
                    snapshot when idle and relit on the next invoke.
                  properties:
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (no in-flight, no queued invoke) after which a
                        live session is banked to a snapshot and its VM released.
                      minimum: 10
                      default: 300
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. A session rides its birth base version
                        until this expires (the version-convergence bound); after
                        it, the next invoke 410s and a fresh session lands on the
                        current base.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        GC a banked snapshot untouched this long. Defaults to
                        maxLifetimeSeconds when unset (the watcher applies that
                        default; the schema leaves it absent so the watcher can
                        see it was omitted).
                      minimum: 60
                    maxSessions:
                      type: integer
                      description: Max sessions (live + banked) for this workload.
                      minimum: 1
                      default: 16
                    invokeQueueCap:
                      type: integer
                      description: >-
                        Max invokes queued behind the one in-flight invoke per
                        session before new invokes are rejected with 429.
                      minimum: 1
                      default: 4
                serving:
                  type: object
                  description: >-
                    Serving-class endpoint and elasticity policy (R3). REQUIRED
                    when spec.class is `serving` and forbidden otherwise; the
                    watcher enforces that cross-field rule with a status
                    condition (the OpenAPI schema cannot express class-
                    conditional requiredness). A serving instance is a long-
                    lived microVM that answers many HTTP requests directly over
                    a tap NIC (ADR embervm/001), published at spec.serving.host.
                  required:
                    - port
                    - host
                  properties:
                    port:
                      type: integer
                      description: Guest HTTP server port (over the tap NIC).
                      minimum: 1
                      maximum: 65535
                    healthPath:
                      type: string
                      description: >-
                        Path the daemon probes for liveness (200 = healthy).
                        Distinct from a base build's readyPath: this is polled
                        continuously over the tap for the life of the instance,
                        not just once at boot.
                      default: /healthz
                    host:
                      type: string
                      description: >-
                        The serving hostname this workload owns. One hostname,
                        one workload in v1: a second serving Workload declaring
                        an already-owned host is condition-rejected
                        (Ready=False) rather than admitted, so there is never an
                        ambiguous routing target.
                    minInstances:
                      type: integer
                      description: >-
                        Floor of published instances. 0 means scale-to-zero (the
                        activator cold-starts on the first miss); the floor
                        concept for serving, distinct from concurrency.floor
                        which serving does not use.
                      minimum: 0
                      default: 0
                    maxInstances:
                      type: integer
                      description: >-
                        Hard max published instances. Must equal
                        concurrency.cap when both are set (the watcher rejects a
                        mismatch with a status condition); concurrency.cap alone
                        is sufficient, maxInstances is the serving-native name.
                      minimum: 1
                      default: 2
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (no in-flight, no queued request, per the
                        Task 9 idle-signal scrape) after which a live instance
                        above minInstances is banked to a snapshot and its VM
                        released. Only meaningful when minInstances is 0 or the
                        live count exceeds minInstances (an instance needed to
                        satisfy the floor is never idle-banked).
                      minimum: 30
                      default: 300
                    drainSeconds:
                      type: integer
                      description: >-
                        Propagation-plus-drain interval between unpublishing an
                        instance's endpoint and banking or destroying it, so a
                        request already routed there completes before the VM is
                        torn down (standing decision 5: drain strictly precedes
                        bank).
                      minimum: 0
                      default: 5
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. A serving instance rides its birth
                        base version until this expires (the version-convergence
                        bound, exactly the session rule); after it, the instance
                        is destroyed and recreated on the current base at the
                        next natural turnover.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        How long a banked serving snapshot may sit idle (untouched
                        by a relight) before it is garbage-collected off node disk
                        (Task 9 banked-TTL sweep), the serving analogue of the
                        session bankedTtlSeconds. Defaults to maxLifetimeSeconds
                        when unset (the watcher applies that), so a banked snapshot
                        never outlives what a live instance would.
                      minimum: 0
                stateful:
                  type: object
                  description: >-
                    Stateful-class volume and L4 policy (R4). REQUIRED when
                    spec.class is `stateful` and forbidden otherwise; the watcher
                    enforces that cross-field rule with a status condition. A
                    stateful workload is a scale-to-zero SINGLETON: one long-lived
                    microVM owning one writable volume (a raw file on node NVMe),
                    reachable over opaque L4 TCP, that banks to disk when idle and
                    wakes on the next inbound connection (ADR embervm/001: data on
                    the volume, warmth in the snapshot). There is no maxInstances
                    knob (singleton by construction) and spec.concurrency is
                    forbidden on this class.
                  required:
                    - port
                    - listenPort
                    - volumeSizeGiB
                  properties:
                    port:
                      type: integer
                      description: >-
                        The port the guest TCP server listens on inside the VM
                        (e.g. 5432 for Postgres). Health is a TCP connect to this
                        port (opaque L4, no health path).
                      minimum: 1
                      maximum: 65535
                    listenPort:
                      type: integer
                      description: >-
                        The node Envoy TCP listener port this workload is exposed
                        on cluster-internally. Must fall inside the chart's
                        values-declared stateful range (default 5400-5409) and be
                        unique across stateful workloads; the watcher rejects an
                        out-of-range or duplicate port with a status condition. The
                        listener port is the workload identity on the wire
                        (decision 5): TCP has no header to route on.
                      minimum: 1
                      maximum: 65535
                    volumeSizeGiB:
                      type: integer
                      description: >-
                        Sparse size cap of the workload's raw volume file, in GiB.
                        IMMUTABLE in v1: the watcher rejects an edit with a status
                        condition (volume resize is a recorded follow-on; the file
                        is not resized).
                      minimum: 1
                    volumeMountPath:
                      type: string
                      description: >-
                        Guest path the volume is mounted at (guest-init runs mkfs
                        on a blank device then mounts here before the image init).
                        The host never mounts the volume (decision 9).
                      default: /data
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (zero active connections and zero new-connection
                        delta across the window, per the Task 9 TCP idle scrape)
                        after which the instance is banked and its VM released. A
                        live connection is never severed regardless of this timer
                        (decision 7).
                      minimum: 30
                      default: 300
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. A stateful instance rides its birth
                        image until this expires; after it, convergence is destroy-
                        and-cold-boot against the volume (a roll costs a WAL
                        recovery, not data). The Task 9 forced roll is the operator
                        lever.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        How long a banked stateful bundle may sit idle before it is
                        garbage-collected off node disk (Task 9 banked-TTL sweep).
                        The VOLUME is never GC'd (data outlives the bundle); only
                        the memory-snapshot warmth is reclaimed.
                      minimum: 0
                      default: 604800
                    wakeTimeoutSeconds:
                      type: integer
                      description: >-
                        Deadline for a wake (relight or cold boot) to reach TCP
                        readiness. Cold boots include WAL recovery and mkfs+initdb
                        on first boot, so this is generous by design; a wake that
                        exceeds it marks the instance failed and the next
                        connection retries (subject to the wake-rate limit).
                      minimum: 1
                      default: 60
                    secretRef:
                      type: string
                      description: >-
                        Optional name of a K8s Secret in this workload's OWN
                        namespace whose data keys/values become the guest's
                        first-boot process environment (e.g. POSTGRES_PASSWORD
                        for a scratch Postgres). Delivered via the MMDS-lite
                        boot-args seam (R4, D-R4.PR-7.1): the control plane
                        reads the secret and passes it as StartStateful's
                        mmds_env ONLY on a FRESH/COLD wake, never on RELIGHT (a
                        relight resumes the running VM; the secret was already
                        consumed at first boot). Cluster-internal, low-stakes
                        scratch tier only: the decoded value rides the guest
                        kernel command line for that one boot. Omit for a
                        workload with no first-boot secrets to deliver.
                invocation:
                  type: object
                  description: Task execution policy. All fields defaulted.
                  properties:
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                      maximum: 900
                      default: 90
                    retry:
                      type: object
                      properties:
                        maxAttempts:
                          type: integer
                          minimum: 1
                          maximum: 10
                          default: 3
                        backoffSeconds:
                          type: integer
                          minimum: 0
                          default: 1
                        backoffCapSeconds:
                          type: integer
                          minimum: 0
                          default: 60
                        retryOn:
                          type: array
                          description: >-
                            Error classes that are retryable. Guest 4xx is never
                            retryable (the task itself is wrong).
                          items:
                            type: string
                            enum:
                              - transport
                              - timeout
                              - guest5xx
                          default:
                            - transport
                            - timeout
                            - guest5xx
                      default: {}
                    resultTtlSeconds:
                      type: integer
                      minimum: 0
                      default: 86400
                    resultMaxBytes:
                      type: integer
                      description: >-
                        Cap on the STORED result copy (sync callers still get
                        the full untruncated response). Max 8 MiB (the daemon
                        Assign body cap).
                      minimum: 0
                      maximum: 8388608
                      default: 1048576
                    deadLetter:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                      default: {}
                  default: {}
                triggers:
                  type: array
                  description: >-
                    v1 supports cron only. Each trigger fires spec.source
                    invokePath as a submit with the inline payload. May be empty.
                  items:
                    type: object
                    required:
                      - cron
                    properties:
                      cron:
                        type: string
                        description: 5-field cron expression.
                      payload:
                        description: >-
                          Inline JSON POSTed as the task body (<= 8 KiB).
                          x-kubernetes-preserve-unknown-fields keeps arbitrary
                          JSON shape without a fixed schema.
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              description: >-
                Written only by the control plane (never by users). The watcher
                writes status exclusively and never mutates spec.
              properties:
                observedGeneration:
                  type: integer
                snapshotRef:
                  type: string
                  description: Opaque base snapshot handle from the daemon.
                snapshotDigest:
                  type: string
                  description: Resolved OCI image digest the base was built from.
                primedFloorSatisfied:
                  type: boolean
                sessions:
                  type: object
                  description: >-
                    Session-class counts written by the control plane (session
                    workloads only). Absent for the task class.
                  properties:
                    live:
                      type: integer
                      description: Sessions currently holding a live VM.
                    banked:
                      type: integer
                      description: Sessions suspended to a node snapshot.
                sessionsSummary:
                  type: string
                  description: >-
                    Human-readable "live/banked" rendering of `sessions`, for the
                    SESSIONS printer column (a printer column cannot format an
                    object). Written by the control plane alongside `sessions`.
                serving:
                  type: object
                  description: >-
                    Serving-class counts written by the control plane (serving
                    workloads only). Absent for other classes.
                  properties:
                    live:
                      type: integer
                      description: Instances currently holding a live VM.
                    banked:
                      type: integer
                      description: Instances suspended to a node snapshot.
                    published:
                      type: integer
                      description: >-
                        Instances currently reachable at spec.serving.host (a
                        live instance not yet health-gated, or draining, is
                        counted live but not published).
                servingSummary:
                  type: string
                  description: >-
                    Human-readable "live/banked/published" rendering of
                    `serving`, for the SERVING printer column (a printer column
                    cannot format an object). Written by the control plane
                    alongside `serving`.
                stateful:
                  type: object
                  description: >-
                    Stateful-class status written by the control plane (stateful
                    workloads only). Absent for other classes. Reports the
                    singleton instance's lifecycle state, the volume and banked-
                    bundle generations (whose equality is the pair-validity test),
                    and the volume's allocated bytes for the watermark.
                  properties:
                    state:
                      type: string
                      description: >-
                        Instance lifecycle state (starting | serving | banking |
                        banked | relighting | cold_booting | evicted | destroyed |
                        failed), or absent when no instance exists yet.
                    generation:
                      type: integer
                      description: The live/last volume generation the instance holds.
                    bundleGeneration:
                      type: integer
                      description: >-
                        The generation stamped into the banked bundle. When it
                        equals `generation` the banked warmth is valid; a mismatch
                        means the next wake cold-boots from the volume.
                    volumeBytes:
                      type: integer
                      description: >-
                        The volume file's allocated (on-disk) bytes, the watermark
                        source against the declared volumeSizeGiB cap.
                statefulSummary:
                  type: string
                  description: >-
                    Human-readable "state gen=<n>/bundle=<n>" rendering of
                    `stateful`, for the STATEFUL printer column (a printer column
                    cannot format an object). Written by the control plane
                    alongside `stateful`.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Ready | BaseBuilt.
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
