# EmberVM Workload CRD (v1alpha1) — the entire v1 management surface.
#
# A Workload is low-churn declarative intent: an OCI image the platform turns
# into a pristine base snapshot, plus the resource shape, concurrency floor/cap,
# invocation policy (timeout/retry/DLQ/result TTL), and optional cron triggers
# for task execution. kubectl + Helm + ArgoCD are the whole surface; there is no
# bespoke API.
#
# v1 invariants held for later rungs (cheap now, expensive to retrofit):
#   - spec.class is an enum: task|session|serving are valid as of R3, stateful as
#     of R4, and composite as of R5 (the group class).
#   - spec.source is a oneOf so the R1 zip/runtime-shim lane is a schema
#     addition, not a reshape; only `image` is implemented.
#   - spec.group (R5 composite groups) is now DEFINED (it was reserved through
#     R4): a new optional block required only for the composite class, so every
#     pre-R5 v1alpha1 CR stays valid (the block is absent and forbidden for them).
#   - status.snapshotRef carries no volumeGeneration in the task class (task VMs
#     are single-use, no volumes); the R4 stateful class will pair a
#     volumeGeneration with the snapshot. Recorded here so the field is expected.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloads.embervm.dev
spec:
  group: embervm.dev
  scope: Namespaced
  names:
    kind: Workload
    listKind: WorkloadList
    plural: workloads
    singular: workload
    shortNames:
      - wl
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.class
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Snapshot
          type: string
          jsonPath: .status.snapshotRef
        - name: Sessions
          type: string
          description: Live/banked session counts (session class only).
          jsonPath: .status.sessionsSummary
        - name: Serving
          type: string
          description: Live/banked/published instance counts (serving class only).
          jsonPath: .status.servingSummary
        - name: Stateful
          type: string
          description: Instance state and generation/bundle pairing (stateful class only).
          jsonPath: .status.statefulSummary
        - name: Composite
          type: string
          description: Group state and live/degraded member counts (composite class only).
          jsonPath: .status.groupSummary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - class
                - source
                - resources
              properties:
                class:
                  type: string
                  description: >-
                    Isolation/lifecycle class. task, session, serving, stateful,
                    and composite are valid as of R5. The stateful class is a
                    scale-to-zero singleton datastore (one long-lived microVM
                    owning one writable volume, reachable over opaque L4 TCP). The
                    composite class is the group class: a SET of member microVMs
                    (each a role with one or more replicas) that live, bank,
                    relight, and die as ONE unit, sharing a private subnet and
                    reached through one declared entry member. concurrency is
                    required by the watcher for task/session/serving but forbidden
                    for stateful and composite (a composite's size is fixed by its
                    member set, not a concurrency knob), which is why it is no
                    longer a schema-level required field; the watcher enforces the
                    per-class requiredness via a status condition (the same pattern
                    as the session/serving/stateful blocks).
                  enum:
                    - task
                    - session
                    - serving
                    - stateful
                    - composite
                source:
                  type: object
                  description: >-
                    Where the guest comes from. A oneOf: exactly one member is
                    set. `image` bakes an OCI image directly; `zip` (R1 zip lane,
                    ADR embervm/002) layers an adopter's zip archive onto a
                    pinned runtime base image (no toolchain for the adopter).
                  properties:
                    zip:
                      type: object
                      description: >-
                        The R1 zip lane: bring only a zip archive with a
                        `handler` callable. The control plane resolves `runtime`
                        to the pinned runtime base image, hands noded the archive
                        URL + sha256, and the runtime shim unpacks and imports
                        the handler guest-side before the base is snapshotted.
                      required:
                        - runtime
                        - codeUri
                        - sha256
                      properties:
                        runtime:
                          type: string
                          description: >-
                            The runtime base the archive layers onto. Exactly one
                            value in v1alpha1: python312 (Python 3.12 + the baked
                            dependency subset).
                          enum:
                            - python312
                        codeUri:
                          type: string
                          description: >-
                            Object-store URL of the zip archive. noded HTTP GETs
                            it over the pod network (the in-cluster read path);
                            the control plane owns upload and URL minting.
                        sha256:
                          type: string
                          description: >-
                            Hex-encoded SHA-256 of the archive bytes. REQUIRED:
                            noded verifies the fetched bytes against it and fails
                            the build on a mismatch, and it feeds the base-build
                            change-detect signature so a re-registered function
                            (new zip, same name) rebuilds.
                        handler:
                          type: string
                          description: >-
                            `module.attr` of the python handler callable, passed
                            to the guest as EMBER_HANDLER.
                          default: app.handle
                        invokePath:
                          type: string
                          description: >-
                            Path tasks are POSTed to (matches the runtime image
                            default). Overridable per submit with the
                            X-Ember-Guest-Path header.
                          default: /invoke
                        readyPath:
                          type: string
                          description: Guest readiness path (200 = ready).
                          default: /shim/ready
                    image:
                      type: object
                      required:
                        - ref
                        - port
                      properties:
                        ref:
                          type: string
                          description: >-
                            OCI reference, digest-pinned or tag. A tag is
                            resolved to a digest at base-build time and the
                            digest recorded in status (deploys are explicit CR
                            updates, never tag drift).
                        port:
                          type: integer
                          description: Guest HTTP server port (over vsock).
                          minimum: 1
                          maximum: 65535
                        readyPath:
                          type: string
                          description: Guest readiness path (200 = ready).
                          default: /shim/ready
                        invokePath:
                          type: string
                          description: >-
                            Path tasks are POSTed to. Overridable per submit
                            with the X-Ember-Guest-Path header.
                          default: /
                        initEnv:
                          type: object
                          description: >-
                            Environment baked into the guest at base-build time.
                          additionalProperties:
                            type: string
                  oneOf:
                    - required:
                        - image
                    - required:
                        - zip
                resources:
                  type: object
                  required:
                    - vcpus
                    - memMib
                  properties:
                    vcpus:
                      type: integer
                      minimum: 1
                      maximum: 8
                    memMib:
                      type: integer
                      minimum: 128
                      maximum: 16384
                concurrency:
                  type: object
                  required:
                    - cap
                  properties:
                    floor:
                      type: integer
                      description: >-
                        Primed-pool floor (pristine VMs kept warm per workload).
                        For the session class, the floor is the pristine pool
                        kept warm for fast session CREATE (create is assignment
                        from a primed VM); for the task class it is warm task
                        capacity.
                      minimum: 0
                      default: 0
                    cap:
                      type: integer
                      description: >-
                        Hard max in-flight. Must be >= floor. For the task class,
                        max in-flight tasks; for the session class, max LIVE
                        session VMs (banked and parked sessions hold only disk,
                        not a live VM, and do not count against the cap). For
                        the serving class, cap is an alias for
                        spec.serving.maxInstances and
                        MUST agree with it when both are set (the watcher rejects
                        a mismatch with a status condition); floor is unused for
                        serving, minInstances is the floor concept there.
                      minimum: 1
                persistence:
                  type: object
                  description: >-
                    What survives a workload instance, declared INDEPENDENTLY of
                    class (ADR embervm/027). Class bundled a persistence decision
                    into itself (task never persists, session persists RAM,
                    stateful owns a volume), which stranded the shape this block
                    exists to express: disk-backed resume with NO memory
                    snapshot.

                    The space is the cross product of two orthogonal booleans,
                    which is why these are flags rather than an enum:
                    off/off is task today, on/on is session today, on/off is
                    memory-only, and off/on is the mode that had no class to land
                    in.

                    ABSENT means "the class default", exactly as today. It is
                    deliberately not defaulted in the schema: the default depends
                    on spec.class, which OpenAPI cannot express, so the watcher
                    applies it and needs to see that the block was omitted (the
                    same reason session.bankedTtlSeconds carries no default).
                  properties:
                    memory:
                      type: boolean
                      description: >-
                        Capture the guest's RAM, so an instance resumes mid-
                        process. false means cold boot every time, which is the
                        ONLY way an instance can carry its own per-instance disk:
                        a restore never re-runs guest-init and never re-reads
                        boot args, so a restored instance cannot be handed a
                        device. false also decouples cost from conversation
                        length, because a memory snapshot pays for every dirty
                        page on every bank, relight and archive.
                    filesystem:
                      type: object
                      description: >-
                        The durable filesystem tier. Unlike the memory tier this
                        pins nothing against GC (ADR embervm/016), which is what
                        makes it portable across nodes: a memory snapshot is tied
                        to CPU vendor and base generation and cannot be handed to
                        an arbitrary node, a filesystem artifact can.
                      properties:
                        enabled:
                          type: boolean
                          description: Keep a durable filesystem artifact for this lineage.
                        retention:
                          type: integer
                          description: >-
                            Keep the latest artifact plus N previous ones. Above
                            1 costs N times the steady-state storage and N times
                            the GC bookkeeping (each generation needs its own
                            liveness check rather than one is-this-latest test),
                            so it is a declared bounded scalar and never
                            "keep everything".
                          minimum: 0
                          default: 0
                        sizeGi:
                          type: integer
                          description: >-
                            Size of the sparse volume backing this tier. Sparse,
                            so an unfilled volume costs only what is written.
                            Size it for the artifact, not for RAM: this exists
                            precisely so state does NOT have to fit in memMib.
                          minimum: 1
                          default: 8
                        sizeBytes:
                          type: integer
                          format: int64
                          description: >-
                            Sparse per-lineage size cap in bytes. When both
                            sizeBytes and sizeGi are set, sizeBytes takes
                            precedence; they must not describe different caps.
                          minimum: 1
                        mountPath:
                          type: string
                          default: /session
                          description: Guest mount path for the durable workspace.
                session:
                  type: object
                  description: >-
                    Session-class lifecycle policy (R2). REQUIRED when
                    spec.class is `session` and forbidden otherwise; the watcher
                    enforces that cross-field rule with a status condition (the
                    OpenAPI schema cannot express class-conditional requiredness).
                    A session is a long-lived logical sandbox banked to a node
                    snapshot when idle and relit on the next invoke.

                    NOTE: idleBankSeconds describes the `persistence.memory: true`
                    path. Under `memory: false` there is no bank; the same idle
                    threshold triggers a close (capture the filesystem artifact,
                    destroy the VM) and the next invoke cold boots.
                  properties:
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (no in-flight, no queued invoke) after which a
                        live session is banked to a snapshot and its VM released.
                      minimum: 10
                      default: 300
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. A session rides its birth base version
                        until this expires (the version-convergence bound); after
                        it, the next invoke 410s and a fresh session lands on the
                        current base.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        GC a banked snapshot untouched this long. Defaults to
                        maxLifetimeSeconds when unset (the watcher applies that
                        default; the schema leaves it absent so the watcher can
                        see it was omitted).
                      minimum: 60
                    maxSessions:
                      type: integer
                      description: Max sessions (live + banked + parked) for this workload.
                      minimum: 1
                      default: 16
                    invokeQueueCap:
                      type: integer
                      description: >-
                        Max invokes queued behind the one in-flight invoke per
                        session before new invokes are rejected with 429.
                      minimum: 1
                      default: 4
                serving:
                  type: object
                  description: >-
                    Serving-class endpoint and elasticity policy (R3). REQUIRED
                    when spec.class is `serving` and forbidden otherwise; the
                    watcher enforces that cross-field rule with a status
                    condition (the OpenAPI schema cannot express class-
                    conditional requiredness). A serving instance is a long-
                    lived microVM that answers many HTTP requests directly over
                    a tap NIC (ADR embervm/001), published at spec.serving.host.
                  required:
                    - port
                    - host
                  properties:
                    port:
                      type: integer
                      description: Guest HTTP server port (over the tap NIC).
                      minimum: 1
                      maximum: 65535
                    healthPath:
                      type: string
                      description: >-
                        Path the daemon probes for liveness (200 = healthy).
                        Distinct from a base build's readyPath: this is polled
                        continuously over the tap for the life of the instance,
                        not just once at boot.
                      default: /healthz
                    host:
                      type: string
                      description: >-
                        The serving hostname this workload owns. One hostname,
                        one workload in v1: a second serving Workload declaring
                        an already-owned host is condition-rejected
                        (Ready=False) rather than admitted, so there is never an
                        ambiguous routing target.
                    minInstances:
                      type: integer
                      description: >-
                        Floor of published instances. 0 means scale-to-zero (the
                        activator cold-starts on the first miss); the floor
                        concept for serving, distinct from concurrency.floor
                        which serving does not use.
                      minimum: 0
                      default: 0
                    maxInstances:
                      type: integer
                      description: >-
                        Hard max published instances. Must equal
                        concurrency.cap when both are set (the watcher rejects a
                        mismatch with a status condition); concurrency.cap alone
                        is sufficient, maxInstances is the serving-native name.
                      minimum: 1
                      default: 2
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (no in-flight, no queued request, per the
                        Task 9 idle-signal scrape) after which a live instance
                        above minInstances is banked to a snapshot and its VM
                        released. Only meaningful when minInstances is 0 or the
                        live count exceeds minInstances (an instance needed to
                        satisfy the floor is never idle-banked).
                      minimum: 30
                      default: 300
                    drainSeconds:
                      type: integer
                      description: >-
                        Propagation-plus-drain interval between unpublishing an
                        instance's endpoint and banking or destroying it, so a
                        request already routed there completes before the VM is
                        torn down (standing decision 5: drain strictly precedes
                        bank).
                      minimum: 0
                      default: 5
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. A serving instance rides its birth
                        base version until this expires (the version-convergence
                        bound, exactly the session rule); after it, the instance
                        is destroyed and recreated on the current base at the
                        next natural turnover.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        How long a banked serving snapshot may sit idle (untouched
                        by a relight) before it is garbage-collected off node disk
                        (Task 9 banked-TTL sweep), the serving analogue of the
                        session bankedTtlSeconds. Defaults to maxLifetimeSeconds
                        when unset (the watcher applies that), so a banked snapshot
                        never outlives what a live instance would.
                      minimum: 0
                    nodeLocalWake:
                      type: boolean
                      description: >-
                        Node-local activator (ADR embervm/018 Fork A). When true,
                        the brick's node-local activator is eligible to cold-boot a
                        scaled-to-zero instance of this workload on the first request,
                        so the wake survives a control-plane Recreate instead of
                        black-holing on the dead CP-pod activator. Pushed to the node
                        daemon in the workload registry and drives the control plane's
                        origin=ACTIVATOR adoption. Defaults false (CP-only wake).
                      default: false
                    meteringFailOpen:
                      type: boolean
                      description: >-
                        Companion, EXPLICIT policy for nodeLocalWake (ADR embervm/018
                        Fork A): a true workload wakes UNMETERED during a control-plane
                        gap and reconciles accounting best-effort when the control
                        plane adopts the instance and backfills its lifecycle ops. The
                        policy is named here rather than implied; allowlisted to
                        blessed homelab demos. Defaults false.
                      default: false
                stateful:
                  type: object
                  description: >-
                    Stateful-class volume and L4 policy (R4). REQUIRED when
                    spec.class is `stateful` and forbidden otherwise; the watcher
                    enforces that cross-field rule with a status condition. A
                    stateful workload is a scale-to-zero SINGLETON: one long-lived
                    microVM owning one writable volume (a raw file on node NVMe),
                    reachable over opaque L4 TCP, that banks to disk when idle and
                    wakes on the next inbound connection (ADR embervm/001: data on
                    the volume, warmth in the snapshot). There is no maxInstances
                    knob (singleton by construction) and spec.concurrency is
                    forbidden on this class.
                  required:
                    - port
                    - listenPort
                    - volumeSizeGiB
                  properties:
                    port:
                      type: integer
                      description: >-
                        The port the guest TCP server listens on inside the VM
                        (e.g. 5432 for Postgres). Health is a TCP connect to this
                        port (opaque L4, no health path).
                      minimum: 1
                      maximum: 65535
                    listenPort:
                      type: integer
                      description: >-
                        The node Envoy TCP listener port this workload is exposed
                        on cluster-internally. Must fall inside the chart's
                        values-declared stateful range (default 5400-5409) and be
                        unique across stateful workloads; the watcher rejects an
                        out-of-range or duplicate port with a status condition. The
                        listener port is the workload identity on the wire
                        (decision 5): TCP has no header to route on.
                      minimum: 1
                      maximum: 65535
                    volumeSizeGiB:
                      type: integer
                      description: >-
                        Sparse size cap of the workload's raw volume file, in GiB.
                        IMMUTABLE in v1: the watcher rejects an edit with a status
                        condition (volume resize is a recorded follow-on; the file
                        is not resized).
                      minimum: 1
                    volumeMountPath:
                      type: string
                      description: >-
                        Guest path the volume is mounted at (guest-init runs mkfs
                        on a blank device then mounts here before the image init).
                        The host never mounts the volume (decision 9).
                      default: /data
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (zero active connections and zero new-connection
                        delta across the window, per the Task 9 TCP idle scrape)
                        after which the instance is banked and its VM released. A
                        live connection is never severed regardless of this timer
                        (decision 7). Sub-30 values are an informed opt-in for
                        exhibits like demo-postgres (each bank writes a snapshot
                        bundle, so a short window under active traffic is
                        deliberate wake/bank churn).
                      minimum: 1
                      default: 300
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. A stateful instance rides its birth
                        image until this expires; after it, convergence is destroy-
                        and-cold-boot against the volume (a roll costs a WAL
                        recovery, not data). The Task 9 forced roll is the operator
                        lever.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        How long a banked stateful bundle may sit idle before it is
                        garbage-collected off node disk (Task 9 banked-TTL sweep).
                        The VOLUME is never GC'd (data outlives the bundle); only
                        the memory-snapshot warmth is reclaimed.
                      minimum: 0
                      default: 604800
                    wakeTimeoutSeconds:
                      type: integer
                      description: >-
                        Deadline for a wake (relight or cold boot) to reach TCP
                        readiness. Cold boots include WAL recovery and mkfs+initdb
                        on first boot, so this is generous by design; a wake that
                        exceeds it marks the instance failed and the next
                        connection retries (subject to the wake-rate limit).
                      minimum: 1
                      default: 60
                    interruptibleBank:
                      type: boolean
                      default: false
                      description: >-
                        Opt in to the two-phase interruptible bank (ADR embervm/008):
                        a wake arriving during a bank resumes the paused VM (hot)
                        instead of cold booting, and a clean bank commits for a warm
                        relight. Off (the default) is the atomic pause-snapshot-destroy
                        bank, unchanged. Only honored for class stateful. NOTE: a
                        boolean for a single alternative behavior; a future third bank
                        strategy is expected to supersede this with a `bankMode` enum.
                    autoWake:
                      type: boolean
                      default: false
                      description: >-
                        Opt in to post-base-READY auto-wake (instance-key unification
                        PR-B0a, A2): when the control plane observes this workload's
                        base transition to READY and it has no live or banked instance,
                        the StatefulManager reconcile triggers a wake instead of waiting
                        for the first connection. Set for demo-postgres so a chart bump's
                        noded roll (which rebuilds the base) does not leave the public
                        /health demo wedged until a manual forced wake. Off (the default)
                        is lazy first-connection wake, unchanged.
                    secretRef:
                      type: string
                      description: >-
                        Optional name of a K8s Secret in this workload's OWN
                        namespace whose data keys/values become the guest's
                        first-boot process environment (e.g. POSTGRES_PASSWORD
                        for a scratch Postgres). Delivered via the MMDS-lite
                        boot-args seam (R4, D-R4.PR-7.1): the control plane
                        reads the secret and passes it as StartStateful's
                        mmds_env ONLY on a FRESH/COLD wake, never on RELIGHT (a
                        relight resumes the running VM; the secret was already
                        consumed at first boot). Cluster-internal, low-stakes
                        scratch tier only: the decoded value rides the guest
                        kernel command line for that one boot. Omit for a
                        workload with no first-boot secrets to deliver.
                    nodeLocalWake:
                      type: boolean
                      default: false
                      description: >-
                        Node-local activator (ADR embervm/018 Phase 2). When true,
                        the brick's node-local L4 activator is eligible to relight a
                        scaled-to-zero instance of this stateful workload on the first
                        inbound TCP connection, so the wake survives a control-plane
                        Recreate instead of black-holing on the dead CP-pod activator.
                        The activator self-bumps the volume generation; the returning
                        control plane trusts it via the fenced-writer anchor-adoption
                        rule (ADR embervm/014), so no delegated grant is issued.
                        Pushed to the node daemon in the workload registry. Defaults
                        false (CP-only wake via the CP tcp_activator).
                    meteringFailOpen:
                      type: boolean
                      default: false
                      description: >-
                        Companion, EXPLICIT policy for nodeLocalWake (ADR embervm/018):
                        a true workload wakes UNMETERED during a control-plane gap and
                        reconciles accounting best-effort on adoption. Named here rather
                        than implied; allowlisted to blessed homelab demos. Defaults
                        false.
                group:
                  type: object
                  description: >-
                    Composite-group definition (R5). REQUIRED when spec.class is
                    `composite` and forbidden otherwise; the watcher enforces that
                    cross-field rule with a status condition (the OpenAPI schema
                    cannot express class-conditional requiredness). A composite is
                    a SET of member microVMs (each member a role with one or more
                    replicas) that live, bank, relight, and die as ONE unit,
                    sharing a private per-group subnet and reached through one
                    declared entry member (ADR embervm/001). Warmth is banked/relit
                    as a whole set atomically; a partial or unreadable set discards
                    warmth and the whole group cold-boots (fresh boot). There is no
                    maxInstances knob (the group size is fixed by the member set)
                    and spec.concurrency is forbidden on this class.
                  required:
                    - members
                    - entry
                  properties:
                    members:
                      type: array
                      description: >-
                        The group's member roles. Each member expands to `replicas`
                        VMs (an expanded member name is `<name>-<index>`, 0-based).
                        Member names are DNS labels and unique across the block. The
                        sum of replicas (the expanded member count) is capped by the
                        chart's values-declared maxGroupSize (default 4); the watcher
                        rejects an over-cap group with a status condition.
                      minItems: 1
                      items:
                        type: object
                        required:
                          - name
                          - source
                          - healthPort
                        properties:
                          name:
                            type: string
                            description: >-
                              DNS-label member name, unique within the group. The
                              member's expanded replicas are named `<name>-<index>`.
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                            maxLength: 63
                          role:
                            type: string
                            description: >-
                              Free-form role label for the member (e.g. leader,
                              worker), recorded for operator legibility; the control
                              plane does not interpret it.
                          startOrder:
                            type: integer
                            description: >-
                              Relative boot order within the group (lower starts
                              first). Members sharing a startOrder boot together.
                            minimum: 0
                            default: 0
                          replicas:
                            type: integer
                            description: >-
                              Number of VMs this member expands to (each named
                              `<name>-<index>`). Counts against maxGroupSize.
                            minimum: 1
                            default: 1
                          source:
                            type: object
                            description: >-
                              Where this member's guest comes from. v1 supports the
                              image lane only (a per-member OCI image), mirroring the
                              top-level source.image contract.
                            required:
                              - image
                            properties:
                              image:
                                type: object
                                required:
                                  - ref
                                properties:
                                  ref:
                                    type: string
                                    description: >-
                                      OCI reference, digest-pinned or tag. A tag is
                                      resolved to a digest at base-build time.
                          resources:
                            type: object
                            description: >-
                              Per-member VM sizing. Defaults to the top-level
                              spec.resources when omitted (the watcher applies that).
                            properties:
                              vcpus:
                                type: integer
                                minimum: 1
                                maximum: 8
                              memMib:
                                type: integer
                                minimum: 128
                                maximum: 16384
                          healthPort:
                            type: integer
                            description: >-
                              TCP port the daemon probes for this member's liveness
                              (a TCP connect gates the member healthy). REQUIRED: the
                              whole-group readiness edge (every member health-gated)
                              cannot fire without it.
                            minimum: 1
                            maximum: 65535
                          env:
                            type: object
                            description: >-
                              Optional first-boot environment for this member's
                              guest, a plain string map.
                            additionalProperties:
                              type: string
                    entry:
                      type: object
                      description: >-
                        The group's single ingress. `member` names the member (or an
                        expanded replica name) whose `port` traffic reaches; the
                        group is exposed cluster-internally on `listenPort`.
                      required:
                        - member
                        - port
                        - listenPort
                      properties:
                        member:
                          type: string
                          description: >-
                            The entry member. Must name a declared member OR an
                            expanded replica name (a member `agent` with replicas 2
                            makes `agent`, `agent-0`, and `agent-1` all valid entry
                            targets); the watcher rejects an entry naming no such
                            member with a status condition.
                        port:
                          type: integer
                          description: The port on the entry member traffic reaches.
                          minimum: 1
                          maximum: 65535
                        listenPort:
                          type: integer
                          description: >-
                            The node Envoy TCP listener port this group is exposed on
                            cluster-internally. Must fall inside the chart's values-
                            declared composite range (default 5410-5419) and be unique
                            across composite workloads; the watcher rejects an out-of-
                            range or duplicate port with a status condition.
                          minimum: 1
                          maximum: 65535
                    secretRef:
                      type: object
                      description: >-
                        Optional reference to a K8s Secret in this workload's OWN
                        namespace supplying EMBER_GROUP_SECRET to every member. When
                        set, the secret is STABLE across group instances (read from
                        the Secret each boot); when omitted, EMBER_GROUP_SECRET is
                        minted fresh per group instance. Cluster-internal scratch
                        tier only.
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                          description: The Secret's name (same namespace as the workload).
                        key:
                          type: string
                          description: The data key within the Secret to read.
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (no in-flight/queued work across the whole group,
                        per the idle-signal scrape) after which the WHOLE set is
                        banked and its VMs released. A live connection is never
                        severed regardless of this timer.
                      minimum: 30
                      default: 600
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. The group rides its birth images until
                        this expires; after it, convergence is destroy-and-fresh-boot
                        of the whole set.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        How long a banked bundle SET may sit idle before it is
                        garbage-collected off node disk. The set is GC'd as a unit
                        (partial warmth is never retained).
                      minimum: 0
                      default: 604800
                    wakeTimeoutSeconds:
                      type: integer
                      description: >-
                        Deadline for a whole-group wake (relight or fresh boot) to
                        reach readiness (every member health-gated). A wake that
                        exceeds it marks the group failed and the next request
                        retries.
                      minimum: 1
                      default: 120
                    nodeLocalWake:
                      type: boolean
                      default: false
                      description: >-
                        Node-local activator (ADR embervm/018 Phase 3). When true,
                        the brick's composite L4 activator is eligible to relight a
                        complete banked group on the first inbound TCP connection, so
                        the wake survives a control-plane Recreate instead of
                        black-holing on the dead CP-pod activator. Pushed to the node
                        daemon in the workload registry. Defaults false (CP-only wake).
                    meteringFailOpen:
                      type: boolean
                      default: false
                      description: >-
                        Companion, EXPLICIT policy for nodeLocalWake (ADR embervm/018
                        Fork A): a true workload wakes UNMETERED during a control-plane
                        gap and reconciles accounting best-effort on adoption. Named here
                        rather than implied; allowlisted to blessed homelab demos.
                        Defaults false.
                invocation:
                  type: object
                  description: Task execution policy. All fields defaulted.
                  properties:
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                      maximum: 900
                      default: 90
                    retry:
                      type: object
                      properties:
                        maxAttempts:
                          type: integer
                          minimum: 1
                          maximum: 10
                          default: 3
                        backoffSeconds:
                          type: integer
                          minimum: 0
                          default: 1
                        backoffCapSeconds:
                          type: integer
                          minimum: 0
                          default: 60
                        retryOn:
                          type: array
                          description: >-
                            Error classes that are retryable. Guest 4xx is never
                            retryable (the task itself is wrong).
                          items:
                            type: string
                            enum:
                              - transport
                              - timeout
                              - guest5xx
                          default:
                            - transport
                            - timeout
                            - guest5xx
                      default: {}
                    resultTtlSeconds:
                      type: integer
                      minimum: 0
                      default: 86400
                    resultMaxBytes:
                      type: integer
                      description: >-
                        Cap on the STORED result copy (sync callers still get
                        the full untruncated response). Max 8 MiB (the daemon
                        Assign body cap).
                      minimum: 0
                      maximum: 8388608
                      default: 1048576
                    deadLetter:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                      default: {}
                  default: {}
                triggers:
                  type: array
                  description: >-
                    v1 supports cron only. Each trigger fires spec.source
                    invokePath as a submit with the inline payload. May be empty.
                  items:
                    type: object
                    required:
                      - cron
                    properties:
                      cron:
                        type: string
                        description: 5-field cron expression.
                      payload:
                        description: >-
                          Inline JSON POSTed as the task body (<= 8 KiB).
                          x-kubernetes-preserve-unknown-fields keeps arbitrary
                          JSON shape without a fixed schema.
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              description: >-
                Written only by the control plane (never by users). The watcher
                writes status exclusively and never mutates spec.
              properties:
                observedGeneration:
                  type: integer
                snapshotRef:
                  type: string
                  description: Opaque base snapshot handle from the daemon.
                snapshotDigest:
                  type: string
                  description: Resolved OCI image digest the base was built from.
                snapshotRefs:
                  type: object
                  description: >-
                    Base refs the fleet currently reports for this workload,
                    grouped by CPU vendor. Observability only: additive to
                    snapshotRef, which stays the single builder-advanced handle.
                    A base ref is vendor-specific by construction (Firecracker
                    snapshots cannot cross CPU vendors), so a mixed fleet holds
                    one ref per vendor. Each value is a LIST because a vendor
                    legitimately holds two refs mid-rollout, while some nodes
                    still run the previous runtime image. Absent until at least
                    one node reports a base.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                primedFloorSatisfied:
                  type: boolean
                sessions:
                  type: object
                  description: >-
                    Session-class counts written by the control plane (session
                    workloads only). Absent for the task class.
                  properties:
                    live:
                      type: integer
                      description: Sessions currently holding a live VM.
                    banked:
                      type: integer
                      description: >-
                        Sessions holding disk instead of a VM: a memory snapshot
                        (banked) or a parked workspace volume.
                sessionsSummary:
                  type: string
                  description: >-
                    Human-readable "live/banked" rendering of `sessions` (banked
                    includes parked), for the SESSIONS printer column (a printer
                    column cannot format an object). Written by the control plane
                    alongside `sessions`.
                serving:
                  type: object
                  description: >-
                    Serving-class counts written by the control plane (serving
                    workloads only). Absent for other classes.
                  properties:
                    live:
                      type: integer
                      description: Instances currently holding a live VM.
                    banked:
                      type: integer
                      description: Instances suspended to a node snapshot.
                    published:
                      type: integer
                      description: >-
                        Instances currently reachable at spec.serving.host (a
                        live instance not yet health-gated, or draining, is
                        counted live but not published).
                servingSummary:
                  type: string
                  description: >-
                    Human-readable "live/banked/published" rendering of
                    `serving`, for the SERVING printer column (a printer column
                    cannot format an object). Written by the control plane
                    alongside `serving`.
                stateful:
                  type: object
                  description: >-
                    Stateful-class status written by the control plane (stateful
                    workloads only). Absent for other classes. Reports the
                    singleton instance's lifecycle state, the volume and banked-
                    bundle generations (whose equality is the pair-validity test),
                    and the volume's allocated bytes for the watermark.
                  properties:
                    state:
                      type: string
                      description: >-
                        Instance lifecycle state (starting | serving | banking |
                        banked | relighting | cold_booting | evicted | destroyed |
                        failed), or absent when no instance exists yet.
                    generation:
                      type: integer
                      description: The live/last volume generation the instance holds.
                    bundleGeneration:
                      type: integer
                      description: >-
                        The generation stamped into the banked bundle. When it
                        equals `generation` the banked warmth is valid; a mismatch
                        means the next wake cold-boots from the volume.
                    volumeBytes:
                      type: integer
                      description: >-
                        The volume file's allocated (on-disk) bytes, the watermark
                        source against the declared volumeSizeGiB cap.
                statefulSummary:
                  type: string
                  description: >-
                    Human-readable "state gen=<n>/bundle=<n>" rendering of
                    `stateful`, for the STATEFUL printer column (a printer column
                    cannot format an object). Written by the control plane
                    alongside `stateful`.
                group:
                  type: object
                  description: >-
                    Composite-group status written by the control plane (composite
                    workloads only). Absent for other classes. Reports the whole-
                    group lifecycle state, the live/degraded member counts, the
                    banked bundle-set handle, and the group's private subnet. This
                    status is WARMTH-ONLY: it reflects live execution state and
                    EVAPORATES when the group is destroyed, expires (TTL), or fresh-
                    boots (a discarded-warmth cold boot resets it); it is never a
                    durable record (the op-log is the book of record). The member
                    health it summarizes is CRASH-CONSISTENT PER VM only: each
                    member's state is consistent within itself, never transactionally
                    consistent across members (a bank snapshots each member VM
                    independently, standing decisions 2 and 10).
                  properties:
                    state:
                      type: string
                      description: >-
                        Whole-group lifecycle state (starting | running | degraded |
                        banking | banked | relighting | fresh_booting | evicted |
                        destroyed | failed), or absent when no instance exists yet.
                        `degraded` means a member is unhealthy while the group stays
                        up; the terminal `expired` state is reported as `destroyed`
                        (expiry is a destroy with reason=expired).
                    members:
                      type: object
                      description: >-
                        Member health counts across the expanded set. Crash-
                        consistent per VM only (never a cross-member transaction).
                      properties:
                        live:
                          type: integer
                          description: Members currently healthy.
                        degraded:
                          type: integer
                          description: Members currently unhealthy while the group stays up.
                    setId:
                      type: string
                      description: >-
                        The banked bundle-SET handle (present only while banked). The
                        whole set is one warmth unit: a partial or unreadable set is
                        discarded and the group fresh-boots, so this is never a
                        per-member handle.
                    subnetCidr:
                      type: string
                      description: The group's private per-group subnet (the /29 its members share).
                groupSummary:
                  type: string
                  description: >-
                    Human-readable "state live/degraded" rendering of `group`, for
                    the COMPOSITE printer column (a printer column cannot format an
                    object). Written by the control plane alongside `group`. Warmth-
                    only, exactly like `group` (it evaporates on destroy/TTL/fresh-
                    boot).
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Ready | BaseBuilt.
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
