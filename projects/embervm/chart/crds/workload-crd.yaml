# EmberVM Workload CRD (v1alpha1) — the entire v1 management surface.
#
# A Workload is low-churn declarative intent: an OCI image the platform turns
# into a pristine base snapshot, plus the resource shape, concurrency floor/cap,
# invocation policy (timeout/retry/DLQ/result TTL), and optional cron triggers
# for task execution. kubectl + Helm + ArgoCD are the whole surface; there is no
# bespoke API.
#
# v1 invariants held for later rungs (cheap now, expensive to retrofit):
#   - spec.class is an enum reserving session|serving|stateful (R2/R3/R4); only
#     `task` is valid in v1alpha1.
#   - spec.source is a oneOf so the R1 zip/runtime-shim lane is a schema
#     addition, not a reshape; only `image` is implemented.
#   - spec.group (R5 composite groups) is deliberately RESERVED, not defined:
#     when it lands it is a new optional block, so v1alpha1 CRs stay valid.
#   - status.snapshotRef carries no volumeGeneration in the task class (task VMs
#     are single-use, no volumes); the R4 stateful class will pair a
#     volumeGeneration with the snapshot. Recorded here so the field is expected.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloads.embervm.dev
spec:
  group: embervm.dev
  scope: Namespaced
  names:
    kind: Workload
    listKind: WorkloadList
    plural: workloads
    singular: workload
    shortNames:
      - wl
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.class
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Snapshot
          type: string
          jsonPath: .status.snapshotRef
        - name: Sessions
          type: string
          description: Live/banked session counts (session class only).
          jsonPath: .status.sessionsSummary
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - class
                - source
                - resources
                - concurrency
              properties:
                class:
                  type: string
                  description: >-
                    Isolation/lifecycle class. Only `task` is valid in
                    v1alpha1; the other values are reserved for later rungs and
                    rejected by the watcher via a status condition, not by the
                    API server, so a forward CR does not hard-fail admission.
                  enum:
                    - task
                    - session
                    - serving
                    - stateful
                source:
                  type: object
                  description: >-
                    Where the guest comes from. A oneOf: exactly one member is
                    set. `image` bakes an OCI image directly; `zip` (R1 zip lane,
                    ADR embervm/002) layers an adopter's zip archive onto a
                    pinned runtime base image (no toolchain for the adopter).
                  properties:
                    zip:
                      type: object
                      description: >-
                        The R1 zip lane: bring only a zip archive with a
                        `handler` callable. The control plane resolves `runtime`
                        to the pinned runtime base image, hands noded the archive
                        URL + sha256, and the runtime shim unpacks and imports
                        the handler guest-side before the base is snapshotted.
                      required:
                        - runtime
                        - codeUri
                        - sha256
                      properties:
                        runtime:
                          type: string
                          description: >-
                            The runtime base the archive layers onto. Exactly one
                            value in v1alpha1: python312 (Python 3.12 + the baked
                            dependency subset).
                          enum:
                            - python312
                        codeUri:
                          type: string
                          description: >-
                            Object-store URL of the zip archive. noded HTTP GETs
                            it over the pod network (the in-cluster read path);
                            the control plane owns upload and URL minting.
                        sha256:
                          type: string
                          description: >-
                            Hex-encoded SHA-256 of the archive bytes. REQUIRED:
                            noded verifies the fetched bytes against it and fails
                            the build on a mismatch, and it feeds the base-build
                            change-detect signature so a re-registered function
                            (new zip, same name) rebuilds.
                        handler:
                          type: string
                          description: >-
                            `module.attr` of the python handler callable, passed
                            to the guest as EMBER_HANDLER.
                          default: app.handle
                        invokePath:
                          type: string
                          description: >-
                            Path tasks are POSTed to (matches the runtime image
                            default). Overridable per submit with the
                            X-Ember-Guest-Path header.
                          default: /invoke
                        readyPath:
                          type: string
                          description: Guest readiness path (200 = ready).
                          default: /shim/ready
                    image:
                      type: object
                      required:
                        - ref
                        - port
                      properties:
                        ref:
                          type: string
                          description: >-
                            OCI reference, digest-pinned or tag. A tag is
                            resolved to a digest at base-build time and the
                            digest recorded in status (deploys are explicit CR
                            updates, never tag drift).
                        port:
                          type: integer
                          description: Guest HTTP server port (over vsock).
                          minimum: 1
                          maximum: 65535
                        readyPath:
                          type: string
                          description: Guest readiness path (200 = ready).
                          default: /shim/ready
                        invokePath:
                          type: string
                          description: >-
                            Path tasks are POSTed to. Overridable per submit
                            with the X-Ember-Guest-Path header.
                          default: /
                        initEnv:
                          type: object
                          description: >-
                            Environment baked into the guest at base-build time.
                          additionalProperties:
                            type: string
                  oneOf:
                    - required:
                        - image
                    - required:
                        - zip
                resources:
                  type: object
                  required:
                    - vcpus
                    - memMib
                  properties:
                    vcpus:
                      type: integer
                      minimum: 1
                      maximum: 8
                    memMib:
                      type: integer
                      minimum: 128
                      maximum: 16384
                concurrency:
                  type: object
                  required:
                    - cap
                  properties:
                    floor:
                      type: integer
                      description: >-
                        Primed-pool floor (pristine VMs kept warm per workload).
                        For the session class, the floor is the pristine pool
                        kept warm for fast session CREATE (create is assignment
                        from a primed VM); for the task class it is warm task
                        capacity.
                      minimum: 0
                      default: 0
                    cap:
                      type: integer
                      description: >-
                        Hard max in-flight. Must be >= floor. For the task class,
                        max in-flight tasks; for the session class, max LIVE
                        session VMs (banked sessions hold only disk, not a live
                        VM, and do not count against the cap).
                      minimum: 1
                session:
                  type: object
                  description: >-
                    Session-class lifecycle policy (R2). REQUIRED when
                    spec.class is `session` and forbidden otherwise; the watcher
                    enforces that cross-field rule with a status condition (the
                    OpenAPI schema cannot express class-conditional requiredness).
                    A session is a long-lived logical sandbox banked to a node
                    snapshot when idle and relit on the next invoke.
                  properties:
                    idleBankSeconds:
                      type: integer
                      description: >-
                        Idle time (no in-flight, no queued invoke) after which a
                        live session is banked to a snapshot and its VM released.
                      minimum: 10
                      default: 300
                    maxLifetimeSeconds:
                      type: integer
                      description: >-
                        Hard lifetime cap. A session rides its birth base version
                        until this expires (the version-convergence bound); after
                        it, the next invoke 410s and a fresh session lands on the
                        current base.
                      minimum: 60
                      default: 86400
                    bankedTtlSeconds:
                      type: integer
                      description: >-
                        GC a banked snapshot untouched this long. Defaults to
                        maxLifetimeSeconds when unset (the watcher applies that
                        default; the schema leaves it absent so the watcher can
                        see it was omitted).
                      minimum: 60
                    maxSessions:
                      type: integer
                      description: Max sessions (live + banked) for this workload.
                      minimum: 1
                      default: 16
                    invokeQueueCap:
                      type: integer
                      description: >-
                        Max invokes queued behind the one in-flight invoke per
                        session before new invokes are rejected with 429.
                      minimum: 1
                      default: 4
                invocation:
                  type: object
                  description: Task execution policy. All fields defaulted.
                  properties:
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                      maximum: 900
                      default: 90
                    retry:
                      type: object
                      properties:
                        maxAttempts:
                          type: integer
                          minimum: 1
                          maximum: 10
                          default: 3
                        backoffSeconds:
                          type: integer
                          minimum: 0
                          default: 1
                        backoffCapSeconds:
                          type: integer
                          minimum: 0
                          default: 60
                        retryOn:
                          type: array
                          description: >-
                            Error classes that are retryable. Guest 4xx is never
                            retryable (the task itself is wrong).
                          items:
                            type: string
                            enum:
                              - transport
                              - timeout
                              - guest5xx
                          default:
                            - transport
                            - timeout
                            - guest5xx
                      default: {}
                    resultTtlSeconds:
                      type: integer
                      minimum: 0
                      default: 86400
                    resultMaxBytes:
                      type: integer
                      description: >-
                        Cap on the STORED result copy (sync callers still get
                        the full untruncated response). Max 8 MiB (the daemon
                        Assign body cap).
                      minimum: 0
                      maximum: 8388608
                      default: 1048576
                    deadLetter:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                      default: {}
                  default: {}
                triggers:
                  type: array
                  description: >-
                    v1 supports cron only. Each trigger fires spec.source
                    invokePath as a submit with the inline payload. May be empty.
                  items:
                    type: object
                    required:
                      - cron
                    properties:
                      cron:
                        type: string
                        description: 5-field cron expression.
                      payload:
                        description: >-
                          Inline JSON POSTed as the task body (<= 8 KiB).
                          x-kubernetes-preserve-unknown-fields keeps arbitrary
                          JSON shape without a fixed schema.
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              description: >-
                Written only by the control plane (never by users). The watcher
                writes status exclusively and never mutates spec.
              properties:
                observedGeneration:
                  type: integer
                snapshotRef:
                  type: string
                  description: Opaque base snapshot handle from the daemon.
                snapshotDigest:
                  type: string
                  description: Resolved OCI image digest the base was built from.
                primedFloorSatisfied:
                  type: boolean
                sessions:
                  type: object
                  description: >-
                    Session-class counts written by the control plane (session
                    workloads only). Absent for the task class.
                  properties:
                    live:
                      type: integer
                      description: Sessions currently holding a live VM.
                    banked:
                      type: integer
                      description: Sessions suspended to a node snapshot.
                sessionsSummary:
                  type: string
                  description: >-
                    Human-readable "live/banked" rendering of `sessions`, for the
                    SESSIONS printer column (a printer column cannot format an
                    object). Written by the control plane alongside `sessions`.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Ready | BaseBuilt.
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
