# EmberVM control-plane chart values.
#
# NOTE: image.repository/tag are placeholders until Task 1 lands the control-plane
# OTP/Go image; the Bazel helm_chart(images = {...}) pin and the deploy/ ArgoCD
# Application are wired in that PR (a chart with no published image must not be
# handed to ArgoCD). This file is the decision-independent chart CONTENT.

image:
  # Pinned at build time by helm_chart(images={"image": ".../image:image.info"}).
  repository: ghcr.io/jomcgi/homelab/projects/embervm/image
  tag: latest
  pullPolicy: IfNotPresent

# GHCR pull credentials. The control-plane image is private, and embervm runs in
# its own namespace (unlike fc-invoke, which reuses the monolith namespace's
# secret), so it creates its own OnePasswordItem-synced dockerconfigjson.
imagePullSecret:
  enabled: true
  create: true
  name: ghcr-imagepull-secret
  onepassword:
    itemPath: "vaults/k8s-homelab/items/ghcr-read-permissions"

# Control-plane resources sized small to start (SigNoz 7-day-peak resizing later).
# CPU is a request only (no limit) per the repo convention; memory request == limit.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# The op-log volume. persistentVolume is TRUE now that the SQLite-WAL op-log ships
# (Task 6/7): the control plane's durable book-of-record (ops, tasks, results) lives
# at EMBERVM_OPLOG_PATH on this RWO Longhorn PVC, which provides DURABILITY, not
# availability. SQLite is single-writer and the Deployment is Recreate + 1 replica,
# so a rolling update never runs two writers against one RWO volume, and a pod
# restart replays the op-log into the ETS hot set on boot (recovery path).
opLog:
  persistentVolume: true
  storageClass: longhorn
  size: 2Gi

# The single node daemon the control plane talks to (v1: exactly one). Address is
# resolved in-cluster; the registry takes a list so multi-node needs no reshape.
#
# SINGLE-NODE ONLY while noded is a Deployment (replicas: 1) behind a ClusterIP
# Service: the derived address resolves to the one pod. A DaemonSet across
# multiple firecracker nodes cannot be served this way (a ClusterIP fans a single
# stream out to a random pod); that requires a HEADLESS noded Service +
# EndpointSlice discovery in the control plane, feeding the same list seam. See
# Embervm.Application.configured_nodes/0.
node:
  # Correlation id the control plane configures for this daemon (echoed in
  # WatchNodeRequest.node_id and used as the NodeRegistry's capacity-table key).
  # The daemon reports its own node id in NodeStatus regardless; this is a label.
  # noded is node-pinned to node-4 (homelab.io/firecracker=true).
  id: node-4
  # gRPC address the NodeRegistry dials. Empty means "derive the in-cluster
  # embervm-noded Service DNS from the release" (see deployment.yaml); set this
  # only to point the control plane at a daemon outside this release.
  address: ""
  # Static bearer token secret (1Password-provisioned) gating the daemon gRPC.
  # Deferred to Task 11: noded currently runs open (noded.bearerTokenSecret.enabled
  # false, mesh policy is the layer), so the registry dials plaintext with no
  # metadata in v1.
  bearerTokenSecret: ""

# TokenReview auth allow-list: ServiceAccount usernames permitted to submit tasks.
auth:
  allowedServiceAccounts: []

# Fair dispatcher tuning (Task 11). The pool floor/cap and invocation policy are
# per-Workload in the CR; these are the cross-workload enforcement knobs.
dispatcher:
  # Per-principal queue-depth cap: submits beyond this many queued tasks for one
  # principal are rejected 429 (a coarse abuse guard).
  queueDepthCap: 10000
  # Per-principal in-flight SHARE of a workload's cap. Empty means dynamic:
  # cap / active-principals (min 1), so under contention no principal starves
  # the others. Set a fraction in (0, 1] to fix each principal's share instead.
  principalShareFraction: ""

# Metering, audit, and quotas (Task 12). Quota is OPT-IN and asymmetric to the
# auth allow-list: an empty budget map means quota is OFF (principals with no
# configured budget are allowed), NOT deny-all. Budgets are per-principal DAILY
# vCPU-second limits, reset at 00:00 UTC (~16:00-17:00 US Pacific), the day
# boundary of the usage projection; document any timezone-sensitive expectation
# here rather than "fixing" it live.
quota:
  # Map of ServiceAccount username -> daily vCPU-second budget. Rendered to
  # EMBERVM_QUOTA_VCPU_SECONDS as `principal=budget` pairs.
  # e.g. { "system:serviceaccount:embervm:foo": 3600 }
  dailyVcpuSecondsPerPrincipal: {}
  # Optional blanket daily budget for principals not named in the map above.
  # Empty means no blanket budget (unlisted principals are unlimited).
  defaultDailyVcpuSeconds: ""

# ServiceAccount usernames allowed to read OTHER principals' usage at
# GET /v1/usage (?principal=). Everyone else is self-scoped. Empty = self only.
usageAdmins: []

service:
  port: 8080

# uid 65532 non-root convention. The control plane needs no privilege (only the
# node daemon is privileged for KVM).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# R0 self-test artifact: one valid task-class Workload CR, deployed with the
# chart so Embervm.WorkloadWatcher has something real to reconcile and report
# status on in-cluster (see chart/templates/sample-workload.yaml). This is a
# self-test, not a production workload: turn it off once Task 14 lands the
# real semgrep/sandbox workload CRs.
sampleWorkload:
  enabled: true
  name: echo

# embervm-noded: the node daemon (gRPC NodeService) that owns Firecracker microVM
# lifecycle on node-4. A SECOND Deployment in this chart, privileged and node-
# pinned, forked from the fc-invoke node layer (ADR embervm/001). It coexists with
# fc-invoke on node-4; this release primes ZERO VMs (the control-plane dispatcher
# is Task 11), so its steady footprint is just the daemon.
noded:
  enabled: true
  image:
    # Pinned at build time by helm_chart(images={"noded.image": ".../noded/image:image.info"}).
    repository: ghcr.io/jomcgi/homelab/projects/embervm/noded/image
    tag: latest
    pullPolicy: IfNotPresent

  # gRPC port the control plane dials; health port for kubelet probes.
  grpcPort: 9090
  healthPort: 8080

  # node-4 pinning: the lone Firecracker node (homelab.io/firecracker=true).
  nodeSelector:
    homelab.io/firecracker: "true"
  tolerations: []
  # Disposable tier (ADR platform/010): microVM workloads must die before
  # inference or the database under memory pressure, so lowest priority.
  priorityClassName: homelab-disposable

  # Node-level backstop cap on concurrently live microVMs. The control plane owns
  # real concurrency; this only stops a runaway from exhausting the node.
  maxLiveVMs: 8

  # Static bearer token gating the gRPC surface. Disabled here (daemon runs open +
  # warns; Cilium/Linkerd policy is the layer). A 1Password-provisioned secret is
  # wired in a later PR when the control plane dials the daemon (Task 11).
  bearerTokenSecret:
    enabled: false
    name: ""
    key: token

  # Firecracker substrate on node-4. The firecracker binary + guest kernel are
  # baked into the image at /opt/fc, so the node only provides /dev/kvm and the
  # nvme scratch dir (see projects/platform/firecracker-node).
  firecracker:
    nvmeRoot: /disks/nvme-02
    guestOomScoreAdj: 1000
    bootReadyTimeout: 60s
    # Shared base rootfs is booted READ-ONLY (root=/dev/vda ro): every mutable
    # guest path is a tmpfs, so one read-only rootfs file backs every microVM.
    kernelBootArgs: "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda ro"

  # Node-side image identity table (image_ref -> {rootfsPath[, harnessInit]}),
  # rendered to EMBERVM_NODED_IMAGES. Empty until the control plane provisions
  # guest images (Task 11+); BuildBase for an unknown image fails FAILED_PRECONDITION.
  images: {}

  # Graceful-drain budget: on SIGTERM the daemon waits up to this long for in-
  # flight Assigns before exiting. terminationGracePeriodSeconds is set above it
  # (grace = drain + 30s), so a rollout never drops a running task.
  drain:
    timeoutSeconds: 60

  # 256Mi req / 2Gi limit: fits the node-4 coexistence budget alongside fc-invoke
  # (2Gi req / 50Gi limit). This release primes ZERO VMs (the dispatcher is Task
  # 11), so the daemon idles well under 256Mi; the 2Gi ceiling covers the daemon
  # plus ~1 future primed 1Gi VM. Grow the limit when the real pool lands.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
