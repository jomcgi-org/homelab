# EmberVM control-plane chart values.
#
# NOTE: image.repository/tag are placeholders until Task 1 lands the control-plane
# OTP/Go image; the Bazel helm_chart(images = {...}) pin and the deploy/ ArgoCD
# Application are wired in that PR (a chart with no published image must not be
# handed to ArgoCD). This file is the decision-independent chart CONTENT.

image:
  # Pinned at build time by helm_chart(images={"image": ".../image:image.info"}).
  repository: ghcr.io/jomcgi/homelab/projects/embervm/image
  tag: latest
  pullPolicy: IfNotPresent

# GHCR pull credentials. The control-plane image is private, and embervm runs in
# its own namespace (unlike fc-invoke, which reuses the monolith namespace's
# secret), so it creates its own OnePasswordItem-synced dockerconfigjson.
imagePullSecret:
  enabled: true
  create: true
  name: ghcr-imagepull-secret
  onepassword:
    itemPath: "vaults/k8s-homelab/items/ghcr-read-permissions"

# Control-plane resources sized small to start (SigNoz 7-day-peak resizing later).
# CPU is a request only (no limit) per the repo convention; memory request == limit.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# The op-log volume. persistentVolume is TRUE now that the SQLite-WAL op-log ships
# (Task 6/7): the control plane's durable book-of-record (ops, tasks, results) lives
# at EMBERVM_OPLOG_PATH on this RWO Longhorn PVC, which provides DURABILITY, not
# availability. SQLite is single-writer and the Deployment is Recreate + 1 replica,
# so a rolling update never runs two writers against one RWO volume, and a pod
# restart replays the op-log into the ETS hot set on boot (recovery path).
opLog:
  persistentVolume: true
  storageClass: longhorn
  size: 2Gi
  # How often the supervised sweeper runs bounded-batch compaction (ADR
  # embervm/002). Correctness (result TTLs) is enforced at read time, so this only
  # governs how promptly reclaimed space is freed; hourly is ample for a 2Gi PVC.
  sweepIntervalSeconds: 3600
  # Age past which an append-only op is eligible for ops-journal prefix compaction,
  # provided its task is not still live. Distinct from the 7-day terminal-task
  # retention: this bounds the journal (which carries request payloads); older
  # audit lives in SigNoz.
  journalHorizonDays: 30

# The single node daemon the control plane talks to (v1: exactly one). Address is
# resolved in-cluster; the registry takes a list so multi-node needs no reshape.
#
# SINGLE-NODE ONLY while noded is a Deployment (replicas: 1) behind a ClusterIP
# Service: the derived address resolves to the one pod. A DaemonSet across
# multiple firecracker nodes cannot be served this way (a ClusterIP fans a single
# stream out to a random pod); that requires a HEADLESS noded Service +
# EndpointSlice discovery in the control plane, feeding the same list seam. See
# Embervm.Application.configured_nodes/0.
node:
  # Correlation id the control plane configures for this daemon (echoed in
  # WatchNodeRequest.node_id and used as the NodeRegistry's capacity-table key).
  # The daemon reports its own node id in NodeStatus regardless; this is a label.
  # noded is node-pinned to node-4 (homelab.io/firecracker=true).
  id: node-4
  # gRPC address the NodeRegistry dials. Empty means "derive the in-cluster
  # embervm-noded Service DNS from the release" (see deployment.yaml); set this
  # only to point the control plane at a daemon outside this release.
  address: ""
  # Static bearer token secret (1Password-provisioned) gating the daemon gRPC.
  # Deferred to Task 11: noded currently runs open (noded.bearerTokenSecret.enabled
  # false, mesh policy is the layer), so the registry dials plaintext with no
  # metadata in v1.
  bearerTokenSecret: ""

# TokenReview auth allow-list: ServiceAccount usernames permitted to submit tasks.
auth:
  allowedServiceAccounts: []

# Fair dispatcher tuning (Task 11). The pool floor/cap and invocation policy are
# per-Workload in the CR; these are the cross-workload enforcement knobs.
dispatcher:
  # Per-principal queue-depth cap: submits beyond this many queued tasks for one
  # principal are rejected 429 (a coarse abuse guard).
  queueDepthCap: 10000
  # Per-principal in-flight SHARE of a workload's cap. Empty means dynamic:
  # cap / active-principals (min 1), so under contention no principal starves
  # the others. Set a fraction in (0, 1] to fix each principal's share instead.
  principalShareFraction: ""

# Metering, audit, and quotas (Task 12). Quota is OPT-IN and asymmetric to the
# auth allow-list: an empty budget map means quota is OFF (principals with no
# configured budget are allowed), NOT deny-all. Budgets are per-principal DAILY
# vCPU-second limits, reset at 00:00 UTC (~16:00-17:00 US Pacific), the day
# boundary of the usage projection; document any timezone-sensitive expectation
# here rather than "fixing" it live.
quota:
  # Map of ServiceAccount username -> daily vCPU-second budget. Rendered to
  # EMBERVM_QUOTA_VCPU_SECONDS as `principal=budget` pairs.
  # e.g. { "system:serviceaccount:embervm:foo": 3600 }
  # A budget of 0 is a HARD STOP (denies that principal entirely); omit a
  # principal to leave it unlimited.
  dailyVcpuSecondsPerPrincipal: {}
  # Optional blanket daily budget for principals not named in the map above.
  # Empty ("") means no blanket budget (unlisted principals are unlimited); 0
  # means deny every unlisted principal by default.
  defaultDailyVcpuSeconds: ""

# ServiceAccount usernames allowed to read OTHER principals' usage at
# GET /v1/usage (?principal=). Everyone else is self-scoped. Empty = self only.
usageAdmins: []

# OpenTelemetry OTLP/gRPC tracing (Task 13). Empty endpoint = tracing OFF (the
# release boots with a no-op exporter); set it (deploy values) to the SigNoz
# collector to export. serviceName defaults to embervm-control.
tracing:
  endpoint: ""
  serviceName: embervm-control

service:
  port: 8080

# uid 65532 non-root convention. The control plane needs no privilege (only the
# node daemon is privileged for KVM).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# R0 self-test artifact: one valid task-class Workload CR, deployed with the
# chart so Embervm.WorkloadWatcher has something real to reconcile and report
# status on in-cluster (see chart/templates/sample-workload.yaml). This is a
# self-test, not a production workload: turn it off once Task 14 lands the
# real semgrep/sandbox workload CRs.
# The gated `echo` self-test workload is now DISABLED: the real `sandbox`
# workload (Task 14) is a live task-class Workload the watcher catalogs and the
# BaseBuilder actually builds, so it serves the watcher/RBAC round-trip that echo
# was a placeholder for. Left enabled, echo's image is not provisioned, so
# BaseBuilder retries its BuildBase in a tight loop and floods the logs with
# FAILED_PRECONDITION. Re-enable only for isolated watcher testing.
sampleWorkload:
  enabled: false
  name: echo

# The first REAL EmberVM workload (Task 14): the python sandbox. A task-class
# Workload whose guest image is baked into a base rootfs by the noded
# rootfs-builder and cold-booted into a base snapshot on admission. See
# templates/workload-sandbox.yaml. The image ref is sourced from
# noded.sandbox.guestImage so it matches the rootfs-builder + node image table.
sandboxWorkload:
  enabled: true
  name: sandbox
  # The sandbox guest shim contract (projects/firecracker/sandbox): HTTP over
  # vsock port 1027, ready at /shim/ready, one python snippet per /invoke.
  port: 1027
  readyPath: /shim/ready
  invokePath: /invoke
  vcpus: 1
  memMib: 512
  # Task 14b full side-by-side: floor 4 / cap 16 matches the plan's sizing (and
  # fc-invoke's pre-halving sandbox cap). See the node-4 memory arithmetic on
  # noded.resources below.
  floor: 4
  cap: 16
  timeoutSeconds: 30

# The sandbox-session workload (EmberVM R2, ADR embervm/001): the sessioned
# variant of the sandbox, R2's named first consumer (sessioned run_python). Same
# guest image + Bazel-pinned digest as `sandbox` above (both derive from
# .Values.sandbox.guestImage), so one baked rootfs serves both; the kernel mode
# is opt-in per request. class=session with a spec.session block.
#
# Node-4 disk arithmetic (bounded, not discovered; ADR 002 rule 4): memMib 2048
# means a full bank snapshot is ~2 GiB; maxSessions 8 (live + banked) caps the
# snapshot dir at 8 x 2 GiB = 16 GiB worst case, plus up to cap (4) live VMs at
# 2 GiB RAM each. The Task 9 watermark alert + LRU eviction are the backstop.
sandboxSessionWorkload:
  enabled: true
  name: sandbox-session
  # Same frozen guest shim contract as the one-shot sandbox: vsock 1027,
  # /shim/ready, /invoke. The session mode is selected by the request body
  # ({"mode":"session"}), not a different path.
  port: 1027
  readyPath: /shim/ready
  invokePath: /invoke
  vcpus: 1
  memMib: 2048
  # floor: pristine VMs kept warm for fast session create. cap: max live
  # session VMs. Small on purpose (see the disk arithmetic above).
  floor: 1
  cap: 4
  session:
    # Bank an idle session (no in-flight, no queued invoke) after 2 minutes.
    idleBankSeconds: 120
    # Version-convergence bound: a session rides its birth base until this
    # expires (6h), then the next invoke 410s onto the current base.
    maxLifetimeSeconds: 21600
    # GC a banked snapshot untouched this long (here, the full 6h lifetime).
    bankedTtlSeconds: 21600
    # Max sessions (live + banked) for this workload.
    maxSessions: 8
    # Max invokes queued behind the one in-flight invoke per session.
    invokeQueueCap: 4

# The semgrep workload (Task 14b): EmberVM's named first consumer, side-by-side
# with fc-invoke's semgrep path (which is halved 16->8 in the substrate chart to
# make room). Same frozen guest contract as fc-invoke (vsock 1027, /shim/ready,
# /invoke), 1 vcpu / 1536Mi / 90s, floor 4 / cap 16.
semgrepWorkload:
  enabled: true
  name: semgrep
  port: 1027
  readyPath: /shim/ready
  invokePath: /invoke
  vcpus: 1
  memMib: 1536
  floor: 4
  cap: 16
  timeoutSeconds: 90

# Guest-image rootfs provisioning (Task 14), laid out FLAT at top level (NOT
# under `noded`) because helm_images_values (Bazel image pinning) emits one YAML
# block per dotted key, so keys sharing a top-level prefix collide on parse. Each
# Bazel-pinned image is therefore its own top-level key, mirroring fc-invoke.

# Per-workload base-rootfs targets on the nvme scratch. The rootfs-builder writes
# each guest's ext4 here and the noded EMBERVM_NODED_IMAGES table maps the guest
# ref to it. Adding a workload here (with a matching top-level <name>.guestImage)
# provisions its base and enables an initContainer that bakes it.
workloads:
  sandbox:
    rootfsPath: /disks/nvme-02/embervm-noded/sandbox/rootfs.ext4
    harnessInit: /usr/local/bin/sandbox-guest-init
  semgrep:
    rootfsPath: /disks/nvme-02/embervm-noded/semgrep/rootfs.ext4
    harnessInit: /usr/local/bin/semgrep-guest-init
  # R1 zip lane (ADR embervm/002): the runtime-python base image the zip lane
  # layers an adopter's archive onto. Its PID-1 guest-init mounts a tmpfs over
  # /tmp then execs the python bootstrap shim (see runtimes/python/guest-init).
  # The key must match the top-level `runtimePython` block below (the deployment
  # ranges over `workloads` and looks the guest image up by the same key).
  runtimePython:
    rootfsPath: /disks/nvme-02/embervm-noded/runtime-python/rootfs.ext4
    harnessInit: /usr/local/bin/ember-runtime-guest-init

# The python sandbox guest image, Bazel-pinned (helm_chart images="sandbox.guestImage")
# from the frozen fc-invoke sandbox guest's .info provider, so the guest contract
# is unchanged (zero image changes, per the R0 plan). Consumed by the sandbox
# rootfs-builder init container, the derived EMBERVM_NODED_IMAGES, and the sandbox
# Workload CR (all three refs derive from here, so they always match).
sandbox:
  guestImage:
    repository: ghcr.io/jomcgi/homelab/projects/firecracker/sandbox/guest
    tag: latest

# The semgrep guest image, Bazel-pinned (helm_chart images="semgrep.guestImage")
# from the frozen fc-invoke semgrep guest's .info provider. Distinct top-level key
# (never noded.*) so the image pin does not collide, per D14a.6.
semgrep:
  guestImage:
    repository: ghcr.io/jomcgi/homelab/projects/firecracker/semgrep/guest
    tag: latest

# The runtime-python base image (R1 zip lane, ADR embervm/002), Bazel-pinned
# (helm_chart images="runtimePython.guestImage") from its .info provider. Distinct
# top-level key (never noded.*) so the image pin does not collide, per D14a.6.
# Three refs derive from here and always match: the rootfs-builder GUEST_IMAGE,
# the derived EMBERVM_NODED_IMAGES entry, and the control plane's
# EMBERVM_RUNTIME_IMAGES (python312 -> this ref), which BaseBuilder resolves
# source.zip.runtime through.
runtimePython:
  # The zip-lane runtime name the CRD enum exposes (source.zip.runtime), mapped to
  # this image for the control plane's EMBERVM_RUNTIME_IMAGES.
  runtime: python312
  guestImage:
    repository: ghcr.io/jomcgi/homelab/projects/embervm/runtimes/python
    tag: latest

# The rootfs-builder tool image (crane + e2fsprogs + bash) that bakes each
# workload's guest OCI image into an ext4 base rootfs at pod init. Reuses the
# fc-invoke rootfs-builder image; Bazel pins repository:tag from its .info.
rootfsBuilder:
  image:
    repository: ghcr.io/jomcgi/homelab/projects/firecracker/substrate/rootfs-builder
    tag: latest
  # 4G covers the largest guest (semgrep: engine + rules + python); the sandbox
  # base is smaller but a uniform size keeps the builder simple (matches
  # fc-invoke's 4G). The ext4 is sparse, so an oversized fs costs little.
  rootfsSize: 4G

# embervm-noded: the node daemon (gRPC NodeService) that owns Firecracker microVM
# lifecycle on node-4. A SECOND Deployment in this chart, privileged and node-
# pinned, forked from the fc-invoke node layer (ADR embervm/001). It coexists with
# fc-invoke on node-4; this release primes ZERO VMs (the control-plane dispatcher
# is Task 11), so its steady footprint is just the daemon.
noded:
  enabled: true
  image:
    # Pinned at build time by helm_chart(images={"noded.image": ".../noded/image:image.info"}).
    repository: ghcr.io/jomcgi/homelab/projects/embervm/noded/image
    tag: latest
    pullPolicy: IfNotPresent

  # gRPC port the control plane dials; health port for kubelet probes.
  grpcPort: 9090
  healthPort: 8080

  # node-4 pinning: the lone Firecracker node (homelab.io/firecracker=true).
  nodeSelector:
    homelab.io/firecracker: "true"
  tolerations: []
  # Disposable tier (ADR platform/010): microVM workloads must die before
  # inference or the database under memory pressure, so lowest priority.
  priorityClassName: homelab-disposable

  # Node-level backstop cap on concurrently live microVMs. The control plane owns
  # real concurrency; this only stops a runaway from exhausting the node.
  maxLiveVMs: 8

  # Static bearer token gating the gRPC surface. Disabled here (daemon runs open +
  # warns; Cilium/Linkerd policy is the layer). A 1Password-provisioned secret is
  # wired in a later PR when the control plane dials the daemon (Task 11).
  bearerTokenSecret:
    enabled: false
    name: ""
    key: token

  # Firecracker substrate on node-4. The firecracker binary + guest kernel are
  # baked into the image at /opt/fc, so the node only provides /dev/kvm and the
  # nvme scratch dir (see projects/platform/firecracker-node).
  firecracker:
    nvmeRoot: /disks/nvme-02
    guestOomScoreAdj: 1000
    bootReadyTimeout: 60s
    # Shared base rootfs is booted READ-ONLY (root=/dev/vda ro): every mutable
    # guest path is a tmpfs, so one read-only rootfs file backs every microVM.
    kernelBootArgs: "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda ro"

  # Explicit node-side image identity overrides (image_ref -> {rootfsPath,
  # harnessInit}). Normally empty: the table is DERIVED from the top-level
  # `workloads` map + each workload's `<name>.guestImage` (see
  # noded-deployment.yaml), so the ref matches the rootfs-builder and the Workload
  # CR automatically. Entries here merge on top.
  images: {}

  # Graceful-drain budget: on SIGTERM the daemon waits up to this long for in-
  # flight Assigns before exiting. terminationGracePeriodSeconds is set above it
  # (grace = drain + 30s), so a rollout never drops a running task.
  drain:
    timeoutSeconds: 60

  # R1 zip lane: a BuildBase zip source is a runtime image plus a zip archive noded
  # fetches, sha256-verifies into memory, and hydrates into the build VM over vsock
  # (POST /shim/hydrate) after boot; the runtime shim unpacks it guest-side, and
  # noded never inspects the bytes. The archive is never a block device: the base
  # snapshot is memory + rootfs only, so it is self-contained and portable.
  #
  # Read-path decision: noded fetches the archive over the POD network from the
  # in-cluster SeaweedFS S3 endpoint (the same one the monolith chat-blobs pattern
  # uses, http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333). The control plane
  # mints a fully-qualified archive_url against that endpoint and passes it in the
  # BuildBaseRequest, so noded needs no endpoint or bucket in its own config, only
  # the fetch timeout and size cap below. The zero-egress policy applies to task
  # microVMs, not the host daemon: this GET is the daemon's own pod-network call,
  # not guest egress. R1 starts on the UNAUTHENTICATED in-cluster read path (the
  # bucket is cluster-internal and mesh-gated); if a private bucket is needed
  # later, credentials arrive here as a 1Password-provisioned secret, additive.
  zipLane:
    # Bounds a single archive HTTP GET so a hung filer cannot stall a BuildBase.
    fetchTimeout: 60s
    # Caps the fetched archive bytes (disk/memory backstop; bytes are opaque).
    # Quoted so Helm keeps the exact integer string (an unquoted large number
    # renders in scientific notation, which strconv.ParseInt would reject).
    maxBytes: "536870912" # 512 MiB

  # 256Mi req / 36Gi limit (Task 14b full side-by-side). The limit is a cgroup
  # OOM CEILING, not a scheduling reservation (the request stays 256Mi), so it
  # does not overcommit node scheduling, exactly like fc-invoke's 50Gi cap.
  #
  # embervm worst case (both workloads at cap, no serialization):
  #   semgrep 16 x 1536Mi = 24Gi + sandbox 16 x 512Mi = 8Gi + ~2Gi transient
  #   base-build cold-boot + ~0.3Gi daemon ~= 34Gi -> 36Gi ceiling.
  #
  # node-4 has 63.4GiB allocatable. The two daemons' CEILINGS oversubscribe
  # (fc-invoke halved ~40Gi + embervm 36Gi = 76Gi), which is SAFE because these
  # are cgroup caps, not reservations: real simultaneous cap-16 peak never occurs
  # during side-by-side (production PR scans stay on fc-invoke, so embervm idles at
  # its floor: semgrep 4x1536 + sandbox 4x512 = 8Gi steady), and post-drain only
  # embervm peaks (fc-invoke drained). oom_score_adj kills guests before the
  # daemon/DB. The absolute cap-16 throughput run is a post-drain Task 16 gate.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 36Gi
