apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "embervm.fullname" . }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  # Exactly one replica. The op-log PVC is RWO and SQLite is single-writer, so a
  # second replica would either deadlock on the volume or run two writers.
  replicas: 1
  # Recreate, never RollingUpdate: a rolling update would briefly run the old and
  # new pods together, contending for the RWO op-log volume (deadlock) or double-
  # writing SQLite. Recreate tears the old pod down before starting the new one.
  strategy:
    type: Recreate
  selector:
    # The control-plane selector is immutable (this is a live Deployment; adding a
    # component label to the selector is a forbidden update), and the second
    # Deployment in this chart (noded) is already selector-disjoint via a distinct
    # app.kubernetes.io/name, so the shared-selector cross-routing this rule guards
    # against cannot occur here.
    # nosemgrep: require-component-label-in-selector
    matchLabels:
      {{- include "embervm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "embervm.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "embervm.serviceAccountName" . }}
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.servingEnvoy.enabled }}
            # The stateful (R4) TCP activator binds this range on the pod so the
            # node Envoy can reach the wake-on-connect fallback at podIP:<listenPort>
            # Same range the node Envoy exposes.
            {{- $r := .Values.servingEnvoy.statefulTcpPortRange }}
            {{- range $p := untilStep (int $r.start) (int (add (int $r.end) 1)) 1 }}
            - name: state-{{ $p }}
              containerPort: {{ $p }}
            {{- end }}
            # The R5 composite (group) TCP activator binds this range on the pod so the
            # node Envoy can reach the wake-on-connect fallback at podIP:<listenPort>
            # (Task 7). Same range the node Envoy exposes as group-<port>.
            {{- $gr := .Values.servingEnvoy.compositeTcpPortRange }}
            {{- range $p := untilStep (int $gr.start) (int (add (int $gr.end) 1)) 1 }}
            - name: group-{{ $p }}
              containerPort: {{ $p }}
            {{- end }}
            {{- end }}
          env:
            # BEAM distribution: name the node after the pod IP so `bin/embervm
            # rpc`/`remote` work (operational access, generation blessing) and so
            # a future multi-replica CP (PR-J) can cluster. RELEASE_NODE must be
            # set AFTER the IP var it interpolates. Cookie is auto-generated per
            # pod for now (single replica); PR-J adds a shared-secret cookie for
            # clustering.
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: EMBERVM_RELEASE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_NODE
              value: "embervm@$(EMBERVM_RELEASE_POD_IP)"
            - name: EMBERVM_HTTP_PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.opLog.postgres.enabled }}
            # Postgres op-log (ADR embervm/007). A set, non-empty
            # EMBERVM_OPLOG_DSN is what makes op_log_mod/0 select
            # Embervm.OpLog.Postgres, so EMBERVM_OPLOG_PATH is deliberately NOT
            # rendered here: leaving both set would make the selected backend
            # look ambiguous to anyone reading the pod spec, even though the DSN
            # wins in code.
# Only the PASSWORD comes from the secret; the DSN is assembled here with
            # the same $(VAR) interpolation RELEASE_NODE above uses, so the
            # connection target stays reviewable in git and 1Password holds one
            # credential rather than a credential plus an assembled copy of it
            # that could drift. Kubernetes substitutes $(VAR) only from vars
            # declared EARLIER in this list, so the password must stay above.
            - name: EMBERVM_OPLOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "opLog.postgres.secretName is required when opLog.postgres.enabled" .Values.opLog.postgres.secretName | quote }}
                  key: {{ .Values.opLog.postgres.secretKey | quote }}
            - name: EMBERVM_OPLOG_DSN
              value: postgres://{{ .Values.opLog.postgres.user }}:$(EMBERVM_OPLOG_PASSWORD)@{{ .Values.opLog.postgres.host }}:{{ .Values.opLog.postgres.port }}/{{ .Values.opLog.postgres.database }}
            {{- else }}
            - name: EMBERVM_OPLOG_PATH
              value: /var/lib/embervm/oplog.db
            {{- end }}
            # Op-log retention (ADR embervm/002): the scheduled sweeper's cadence
            # and the ops-journal prefix-compaction horizon. Seconds/days in values
            # are converted to the ms the runtime parses.
            - name: EMBERVM_OPLOG_SWEEP_INTERVAL_MS
              value: {{ mul .Values.opLog.sweepIntervalSeconds 1000 | quote }}
            - name: EMBERVM_OPLOG_JOURNAL_HORIZON_MS
              value: {{ mul .Values.opLog.journalHorizonDays 86400 1000 | quote }}
            # Node-confirmed destroy ordering (ADR embervm/014 decision 5).
            #
            # #4758: application.ex has read this gate since the ADR landed, and
            # NO template rendered it, so the ordering it selects has never run
            # in any environment. The code was reachable only by an env var
            # nothing could set. Rendering it here is what makes arming it a
            # values decision rather than an impossibility.
            #
            # Production stays false. Dev arms it, which is the first time the
            # node-confirmed path executes anywhere.
            - name: EMBERVM_NODE_CONFIRMED_DESTROY
              value: {{ if .Values.nodeConfirmedDestroy }}"true"{{ else }}"false"{{ end }}
            # SpecTrace gate for spec validation (GitHub issue #4770):
            # the debug-gated, spec-shaped trace reads once at boot.
            # OFF means no process, no connection, no sweep.
            - name: EMBERVM_SPEC_TRACE
              value: {{ if .Values.specTrace.enabled }}"on"{{ else }}"off"{{ end }}
            {{- if .Values.specTrace.path }}
            - name: EMBERVM_SPEC_TRACE_PATH
              value: {{ .Values.specTrace.path | quote }}
            {{- end }}
            # SpecTrace retention and sweep interval (seconds converted to ms).
            - name: EMBERVM_SPEC_TRACE_TTL_MS
              value: {{ mul .Values.specTrace.ttlSeconds 1000 | quote }}
            - name: EMBERVM_SPEC_TRACE_SWEEP_INTERVAL_MS
              value: {{ mul .Values.specTrace.sweepIntervalSeconds 1000 | quote }}
            # Node membership for Embervm.NodeRegistry. Dial-home registration
            # (R0 PR-2, ADR embervm/005): each noded instance POSTs its identity to
            # /v1/nodes/register and the control plane adopts it keyed by
            # (node, pod_uid). The control plane never lists-and-watches daemon pods
            # (the retired EndpointSlice discovery), so there is no service/port
            # discovery env here anymore.
            {{- if .Values.node.address }}
            # Explicit single-node override (tests / out-of-cluster daemon): a
            # pinned address seeds the registry statically instead of dial-home.
            # Retained as an escape hatch.
            - name: EMBERVM_NODE_ID
              value: {{ .Values.node.id | quote }}
            - name: EMBERVM_NODE_ADDRESS
              value: {{ .Values.node.address | quote }}
            {{- end }}
            {{- if or .Values.noded.enabled .Values.bricks.enabled }}
            # The noded ServiceAccount username the control plane authenticates the
            # dial-home POST against (a valid TokenReview whose username equals this,
            # NOT the task-submit allow-list). Rendered from the release namespace +
            # noded SA name so it survives a rename.
            #
            # SHARED (not DS-specific): brick pods dial home as this same SA, so the
            # CP must accept it whenever the DS OR any brick exists. Gated on
            # (noded OR bricks) so retiring the DS (bricks-only) does not strip the
            # CP's dial-home auth allow-list out from under the bricks.
            - name: EMBERVM_NODED_SERVICE_ACCOUNT
              value: {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "embervm.noded.serviceAccountName" .) | quote }}
            {{- end }}
            {{- if and .Values.noded.bearerTokenSecret.enabled (or .Values.noded.enabled .Values.bricks.enabled) }}
            # The control plane and every noded pod read the same Secret under
            # the same enabled flag. Both sides therefore flip together in this
            # one chart version, avoiding a fleet-wide auth mismatch.
            - name: EMBERVM_NODED_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "embervm.noded.bearerTokenSecretName" . }}
                  key: {{ .Values.noded.bearerTokenSecret.key }}
            {{- end }}
            {{- if .Values.kekRoot.enabled }}
            # Platform KEK root (ADR embervm/036): base64, held only in the
            # KeyService process, never logged. Empty leaves the custodian inert.
            - name: EMBERVM_KEK_ROOT
              valueFrom:
                secretKeyRef:
                  name: {{ include "embervm.kekRootSecretName" . }}
                  key: {{ .Values.kekRoot.key }}
                  # Optional on purpose: a root that has not been provisioned
                  # yet leaves the custodian inert (every derive returns
                  # {:error, :no_root}) rather than blocking the control plane
                  # from starting. Encryption is its own flag.
                  optional: true
            - name: EMBERVM_KEK_ROOT_GENERATION
              value: {{ .Values.kekRoot.generation | quote }}
            {{- if .Values.kekRoot.previous.enabled }}
            - name: EMBERVM_KEK_ROOT_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "embervm.kekRootPreviousSecretName" . }}
                  key: {{ .Values.kekRoot.previous.key }}
            - name: EMBERVM_KEK_ROOT_PREVIOUS_GENERATION
              value: {{ .Values.kekRoot.previous.generation | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.customerKms.secretName }}
            # Customer-managed KEK custody (ADR embervm/033): the Secret holds
            # only a KMS endpoint, opaque key reference, and wrap/unwrap grant.
            # The customer KEK never enters this pod.
            - name: EMBERVM_CUSTOMER_KMS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerKms.secretName | quote }}
                  key: {{ .Values.customerKms.secretKey | quote }}
            {{- end }}
            {{- if and .Values.runtimePython .Values.runtimePython.guestImage .Values.runtimePython.guestImage.repository }}
            # R1 zip lane (ADR embervm/002): the zip-lane runtime name -> pinned
            # runtime base image ref, as `runtime=ref` pairs. BaseBuilder resolves
            # source.zip.runtime through this map to a ZipSource.runtime_image_ref.
            # The ref MUST match the runtime-python entry the noded rootfs-builder
            # bakes and EMBERVM_NODED_IMAGES keys on (both derive from
            # runtimePython.guestImage), so BuildBase resolves it on the node.
            - name: EMBERVM_RUNTIME_IMAGES
              value: {{ printf "%s=%s@%s" .Values.runtimePython.runtime .Values.runtimePython.guestImage.repository .Values.runtimePython.guestImage.digest | quote }}
            {{- end }}
            {{- if .Values.workloads }}
            # Artifact-decoupling Phase 2: node-side image identity (rootfs ref +
            # harness init) keyed by IMAGE REF, rendered from the SAME workloads +
            # guestImage values that once fed the daemon's retired
            # EMBERVM_NODED_IMAGES table (which keyed on the same ref). The control
            # plane now owns this table and PUSHES it to each daemon over
            # SyncRegistry (Embervm.NodeRegistry reads this env, joins it to the
            # WorkloadCatalog by the CR's source.image.ref, and stamps rootfs +
            # harness + sizing into each RegistryEntry). Keying by image_ref (not the
            # workloads values key) is deliberate: the values key is the
            # rootfs-builder key, while image_ref is the CR's stable join key
            # (source.image.ref == guestImage.repository@digest). Content-addressed
            # so a chart republish with an unchanged guest rootfs renders the SAME
            # ref, leaving the base-build signature stable (no rebuild churn). This
            # ref MUST render byte-identical to the Workload CR source.image.ref and
            # the noded rootfs-builder GUEST_IMAGE, since all three join on it.
            # Format: comma-separated `imageRef=rootfsRef|harnessInit`.
            - name: EMBERVM_NODE_IMAGE_IDENTITY
              {{- $ids := list }}
              {{- range $name, $wl := .Values.workloads }}
              {{- $top := index $.Values $name }}
              {{- if and $top $top.guestImage $top.guestImage.repository }}
              {{- $ref := printf "%s@%s" $top.guestImage.repository $top.guestImage.digest }}
              {{- $rootfs := include "embervm.noded.rootfsPath" (dict "wl" $wl "top" $top) }}
              {{- $ids = append $ids (printf "%s=%s|%s" $ref $rootfs ($wl.harnessInit | default "")) }}
              {{- end }}
              {{- end }}
              value: {{ join "," $ids | quote }}
            {{- end }}
            {{- if .Values.auth.allowedServiceAccounts }}
            # TokenReview allow-list: ServiceAccount usernames permitted to
            # submit tasks. Empty means deny-all (fail-closed) in the control
            # plane, so the env is only set when the list is non-empty.
            - name: EMBERVM_ALLOWED_SERVICE_ACCOUNTS
              value: {{ join "," .Values.auth.allowedServiceAccounts | quote }}
            {{- end }}
            # Fair dispatcher tuning (Task 11): per-principal queue-depth 429 cap
            # and the optional fixed per-principal in-flight share fraction.
            - name: EMBERVM_QUEUE_DEPTH_CAP
              value: {{ .Values.dispatcher.queueDepthCap | quote }}
            {{- if .Values.dispatcher.principalShareFraction }}
            - name: EMBERVM_PRINCIPAL_SHARE_FRACTION
              value: {{ .Values.dispatcher.principalShareFraction | quote }}
            {{- end }}
            # Session invoke wall-clock watchdog margin (#4434): last-resort kill
            # of a SessionAssign worker that outlived the server-enforced deadline.
            - name: EMBERVM_SESSION_INVOKE_WATCHDOG_MARGIN_MS
              value: {{ .Values.session.invokeWatchdogMarginMs | quote }}
            # Metering + quotas (Task 12). Per-principal daily vCPU-second budgets
            # rendered as `principal=budget` pairs (quota OFF when the map is
            # empty), an optional blanket default, and the usage-read admin list.
            {{- if .Values.quota.dailyVcpuSecondsPerPrincipal }}
            - name: EMBERVM_QUOTA_VCPU_SECONDS
              value: {{ $pairs := list }}{{- range $p, $b := .Values.quota.dailyVcpuSecondsPerPrincipal }}{{ $pairs = append $pairs (printf "%s=%v" $p $b) }}{{- end }}{{ join "," $pairs | quote }}
            {{- end }}
            {{- if ne (toString .Values.quota.defaultDailyVcpuSeconds) "" }}
            - name: EMBERVM_QUOTA_DEFAULT_VCPU_SECONDS
              value: {{ .Values.quota.defaultDailyVcpuSeconds | quote }}
            {{- end }}
            {{- if .Values.usageAdmins }}
            - name: EMBERVM_USAGE_ADMINS
              value: {{ join "," .Values.usageAdmins | quote }}
            {{- end }}
            {{- if .Values.tracing.endpoint }}
            # OpenTelemetry OTLP/gRPC tracing to SigNoz (Task 13). Set enables the
            # exporter (config/runtime.exs); unset leaves tracing off. Standard
            # OTEL_* env: the SDK reads OTEL_SERVICE_NAME for the resource and the
            # exporter reads the endpoint.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | default "embervm-control" | quote }}
            {{- end }}
            {{- if .Values.xds.enabled }}
            # xDS sidecar snapshot API port (R3): the control plane (Embervm.
            # EndpointPublisher) PUTs the serving fan-out to the sidecar over
            # 127.0.0.1:this port (the sidecar binds loopback only, sharing this
            # pod's netns). Same value the sidecar container reads as its listen
            # port, so both derive from values.xds.httpPort.
            - name: EMBERVM_XDS_HTTP_PORT
              value: {{ .Values.xds.httpPort | quote }}
            # Activator endpoint (R3, Task 8): the publisher renders THIS pod's
            # ip:port as the fallback endpoint of an empty serve|<workload> cluster,
            # so the node Envoy routes a miss to the activator route on this
            # control-plane pod over pod networking. podIP (downward API) + the HTTP
            # port is exactly where Embervm.ServingManager's route lives; it is
            # routable from the serving node's Envoy on the pod network.
            - name: EMBERVM_SERVING_ACTIVATOR_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: EMBERVM_SERVING_ACTIVATOR_PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.servingEnvoy.enabled }}
            # Stateful activator: THIS pod binds the
            # stateful TCP port range and resolves a wake-on-connect miss to the
            # workload by the LOCAL accept port. The publisher renders {this podIP,
            # workload.listenPort} as the empty-cluster fallback, so the node Envoy's
            # tcp_proxy dials the activator here on exactly the port it resolves the
            # workload from. Unset (servingEnvoy disabled) -> the activator binds
            # nothing and cold stateful workloads simply cannot wake (a safe no-op).
            - name: EMBERVM_STATEFUL_ACTIVATOR_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: EMBERVM_STATEFUL_ACTIVATOR_PORT_RANGE
              value: "{{ .Values.servingEnvoy.statefulTcpPortRange.start }}-{{ .Values.servingEnvoy.statefulTcpPortRange.end }}"
            # Composite (R5) group entry range + size cap: the values-declared
            # capacity the CRD watcher validates each composite workload's
            # spec.group.entry.listenPort and expanded member count against.
            # Embervm.Application.start/2 parses these env vars into the
            # :composite_listen_range / :max_group_size app-env keys the watcher
            # reads, falling back to the compile-time defaults 5410-5419 / 4 (which
            # match the chart defaults) when absent or malformed, so a no-chart
            # `mix test` run still validates against the same range.
            - name: EMBERVM_COMPOSITE_LISTEN_PORT_RANGE
              value: "{{ .Values.servingEnvoy.compositeTcpPortRange.start }}-{{ .Values.servingEnvoy.compositeTcpPortRange.end }}"
            - name: EMBERVM_MAX_GROUP_SIZE
              value: {{ .Values.servingEnvoy.maxGroupSize | quote }}
            {{- end }}
            {{- end }}
            {{- /* #4948: Brick controller config is independent of servingEnvoy and xDS. */}}
            {{- if .Values.bricks.enabled }}
            # Brick capacity (PR-3): the per-size-class DESIRED replica counts the
            # Embervm.BrickController reconciles the brick Deployments to, as a JSON
            # array of {name,desired,min,max,usable_mib}; usable_mib is declared here
            # rather than observed because classes must work before any brick exists.
            # desired from the bricks.desiredReplicas
            # map, default 0 for an unlisted class; min/max are the Axis C autoscale
            # clamp from bricks.autoscale.minReplicas/maxReplicas, unlisted min reads
            # 0 and unlisted max falls back to the class's desired: no headroom), plus
            # the brick Deployment name prefix the controller appends the class to and
            # the autoscale mode gate. Rendered ONLY when bricks are enabled, so a
            # disabled fleet leaves the class list empty and the controller inert (it
            # scales nothing, flags nothing).
            {{- $desired := .Values.bricks.desiredReplicas }}
            {{- $auto := .Values.bricks.autoscale | default dict }}
            {{- $mins := $auto.minReplicas | default dict }}
            {{- $maxs := $auto.maxReplicas | default dict }}
            {{- $daemonReserve := .Values.bricks.daemonReserveMib | default 512 | int }}
            {{- $classes := list }}
            {{- range .Values.bricks.classes }}
            {{- $nameplateMib := trimSuffix "Gi" .resources.limits.memory | int | mul 1024 }}
            {{- $usableMib := max 0 (sub $nameplateMib $daemonReserve) }}
            {{- $classes = append $classes (dict "name" .name "desired" (index $desired .name | default 0) "min" (index $mins .name | default 0) "max" (index $maxs .name | default (index $desired .name | default 0)) "usable_mib" $usableMib) }}
            {{- end }}
            - name: EMBERVM_BRICK_CLASSES
              value: {{ $classes | toJson | quote }}
            - name: EMBERVM_BRICK_DEPLOYMENT_PREFIX
              value: {{ printf "%s-brick-" (include "embervm.noded.fullname" .) | quote }}
            - name: EMBERVM_BRICK_AUTOSCALE_MODE
              value: {{ $auto.mode | default "off" | quote }}
            {{- end }}
            {{- if .Values.xds.enabled }}
            {{- if .Values.servingEnvoy.enabled }}
            # The R5 composite (group) TCP activator port range: the values-declared
            # range the activator physically binds on the pod (Task 7), so the node
            # Envoy's group tcp_proxy fallback dials podIP:<listenPort>. Same range as
            # the container ports above, mirroring EMBERVM_STATEFUL_ACTIVATOR_PORT_RANGE.
            - name: EMBERVM_COMPOSITE_ACTIVATOR_PORT_RANGE
              value: "{{ .Values.servingEnvoy.compositeTcpPortRange.start }}-{{ .Values.servingEnvoy.compositeTcpPortRange.end }}"
            # The composite supernet the CONTROL PLANE allocates per-group /24s from
            # (lowest-free) and the DNAT port base it re-derives each group's entry
            # vmPort from. BOTH are the SAME chart values that feed noded's
            # CompositeSupernet + ServingPortBase (noded.compositeSupernet /
            # noded.servingPortBase, rendered into the noded env too), so the CP's
            # subnet allocation and entry-endpoint port derivation stay in lockstep with
            # the daemon. Rendering from the noded.* keys (not a second independently
            # defaulted value) is the one-source-of-truth guard.
            - name: EMBERVM_COMPOSITE_SUPERNET
              value: {{ .Values.noded.compositeSupernet | quote }}
            - name: EMBERVM_COMPOSITE_PORT_BASE
              value: {{ .Values.noded.servingPortBase | quote }}
            # The control-plane pod IP: the composite entry endpoint is published as
            # {pod IP, vmPort} (the D-R3.11.4 DNAT lane), so the publisher needs the pod's
            # own routable address.
            - name: EMBERVM_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- if .Values.servingEnvoy.enabled }}
            # The node Envoy stats base URL (R3, Task 9): the ServingSweeper GETs
            # {this}/stats?format=json to read per-cluster upstream_rq_total (the idle
            # signal). The serving Service exposes the path-restricted stats port
            # (only /stats and /ready reach the loopback admin). Unset -> the sweeper
            # fails open and banks nothing, so this is gated on servingEnvoy being up.
            - name: EMBERVM_SERVING_STATS_BASE
              value: "http://{{ include "embervm.serving.fullname" . }}:{{ .Values.servingEnvoy.statsPort }}"
            {{- end }}
            {{- end }}
            {{- if .Values.statefulSweeper.sweepIntervalMs }}
            # StatefulSweeper tick override (default 30000ms). The demo-postgres
            # exhibit needs a ~1s tick so idle banking is visibly prompt; banking
            # per workload stays gated by each CR's own idleBankSeconds.
            - name: EMBERVM_STATEFUL_SWEEP_INTERVAL_MS
              value: {{ .Values.statefulSweeper.sweepIntervalMs | quote }}
            {{- end }}
            {{- if .Values.grpcConnectionSweeper.enabled }}
            # gRPC connection sweep gate (default off, dry-run logging only). "1" or "true"
            # arms destructive orphaned connection termination.
            - name: EMBERVM_GRPC_CONNECTION_SWEEP_ENABLED
              value: {{ .Values.grpcConnectionSweeper.enabled | quote }}
            {{- end }}
            {{- if .Values.grpcConnectionSweeper.sweepIntervalMs }}
            # gRPC connection sweep tick override (default 60000ms).
            - name: EMBERVM_GRPC_CONNECTION_SWEEP_INTERVAL_MS
              value: {{ .Values.grpcConnectionSweeper.sweepIntervalMs | quote }}
            {{- end }}
            {{- if .Values.statefulSweeper.wakeMax }}
            # Per-workload wake-rate cap override (default 10/min): with a ~1s
            # idle bank every demo query is a wake, so the default cap would turn
            # an eager visitor's clicks into refusals inside a minute.
            - name: EMBERVM_STATEFUL_WAKE_MAX
              value: {{ .Values.statefulSweeper.wakeMax | quote }}
            {{- end }}
            {{- if .Values.baseRetention.sweepEnabled }}
            # Base-retention sweep gate (base-durability PR-3): "1" arms the
            # reconciled eviction of superseded local bases; unset keeps the
            # dry-run that only logs. See baseRetention.sweepEnabled in values.
            - name: EMBERVM_BASE_RETENTION_SWEEP
              value: {{ .Values.baseRetention.sweepEnabled | quote }}
            {{- end }}
            {{- if .Values.baseRetention.diskDrivenEnabled }}
            # Separate gate for disk-driven base eviction. When unset ("") the
            # sweep emits a manifest only (dry-run). "1" arms eviction of
            # disk-found bases. Flip this gate in a follow-up PR after reviewing
            # the manifest on the live fleet.
            - name: EMBERVM_BASE_RETENTION_DISK_DRIVEN
              value: {{ .Values.baseRetention.diskDrivenEnabled | quote }}
            {{- end }}
            {{- if .Values.baseRetention.remoteSweepEnabled }}
            # Remote base-retention gate (#3947 PR-4): "1" arms eviction of
            # superseded STORE bases per (workload, vendor); unset keeps the
            # dry-run that only logs. Separate from the local gate above because
            # the blast radius is the shared bucket, not one node's disk, so the
            # two arm and roll back independently. See baseRetention in values.
            - name: EMBERVM_BASE_REMOTE_RETENTION_SWEEP
              value: {{ .Values.baseRetention.remoteSweepEnabled | quote }}
            {{- end }}
            {{- if .Values.warmthRetention.sweepEnabled }}
            # Warmth-retention sweep gate (base-durability PR-3, extended to
            # stateful and group orphans): "1" arms the reconciled eviction of
            # orphaned stateful/group warmth; empty-binding orphans are skipped.
            # Unset keeps the dry-run that only logs. See warmthRetention in values.
            - name: EMBERVM_WARMTH_RETENTION_SWEEP
              value: {{ .Values.warmthRetention.sweepEnabled | quote }}
            {{- end }}
            # S3-direct warmth GC (task #39): the control plane's OWN object
            # store client (List/Get/Delete for the orphan sweep + manifest
            # persist). Rendered from the SAME noded.store values as the
            # daemons' EMBERVM_NODED_STORE_*, one source of truth; an empty
            # endpoint leaves the GC inert.
            - name: EMBERVM_STORE_ENDPOINT
              value: {{ .Values.noded.store.endpoint | quote }}
            - name: EMBERVM_STORE_BUCKET
              value: {{ .Values.noded.store.bucket | quote }}
            # Principal-artifact wrap and restore capability gate (#4691).
            # False by default; see artifactEncryption in values for rollout order.
            - name: EMBERVM_ARTIFACT_ENCRYPTION
              value: {{ ternary "1" "0" .Values.artifactEncryption.enabled | quote }}
            # Background envelope-only rotation (#4976). Disabled is a true
            # no-I/O state. When armed, every meta.json write is guarded by the
            # exact ETag read before rewrap, and the worker never reads payloads.
            - name: EMBERVM_ENVELOPE_REWRAP_ENABLED
              value: {{ ternary "1" "0" .Values.envelopeRewrap.enabled | quote }}
            - name: EMBERVM_ENVELOPE_REWRAP_MAX_ARTIFACTS
              value: {{ .Values.envelopeRewrap.maxArtifacts | int64 | quote }}
            - name: EMBERVM_ENVELOPE_REWRAP_CONCURRENCY
              value: {{ .Values.envelopeRewrap.concurrency | int64 | quote }}
            - name: EMBERVM_ENVELOPE_REWRAP_INTERVAL_MS
              value: {{ .Values.envelopeRewrap.intervalMs | int64 | quote }}
            {{- if .Values.noded.store.credentials.enabled }}
            - name: EMBERVM_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "embervm.store.credentialsSecretName" . }}
                  key: {{ .Values.noded.store.credentials.accessKeyIdKey }}
            - name: EMBERVM_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "embervm.store.credentialsSecretName" . }}
                  key: {{ .Values.noded.store.credentials.secretAccessKeyKey }}
            {{- end }}
            {{- if .Values.warmthS3Gc.enabled }}
            # The DESTRUCTIVE gate: "1" arms irreversible S3 deletion of proven
            # orphan prefixes (supervised, capped). Unset keeps every sweep a
            # dry-run plan + manifest. See warmthS3Gc in values.
            - name: EMBERVM_WARMTH_S3_GC
              value: {{ .Values.warmthS3Gc.enabled | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.expectedNodes }}
            # The fleet contract for the fleet-freshness abort: EVERY listed
            # node must be present + fresh in NodeCapacity or the sweep aborts
            # (a down node's unreported disk bundles must never look orphaned).
            # Unset = the sweep always aborts, so this must name the real fleet
            # before even the dry-run plan is produced.
            - name: EMBERVM_WARMTH_S3_GC_EXPECTED_NODES
              value: {{ join "," .Values.warmthS3Gc.expectedNodes | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.maxPrefixes }}
            - name: EMBERVM_WARMTH_S3_GC_MAX_PREFIXES
              value: {{ .Values.warmthS3Gc.maxPrefixes | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.allowEmptyKinds }}
            {{- /* Validate at render time so a typo is an ArgoCD render error,
                   never a control-plane crash loop. The app also drops unknown
                   tokens defensively. */}}
            {{- range splitList "," .Values.warmthS3Gc.allowEmptyKinds }}
            {{- $token := trim . }}
            {{- if and $token (not (has $token (list "stateful" "group" "session" "serving"))) }}
            {{- fail (printf "warmthS3Gc.allowEmptyKinds: invalid kind %q (valid: stateful, group, session, serving)" $token) }}
            {{- end }}
            {{- end }}
            - name: EMBERVM_WARMTH_S3_GC_ALLOW_EMPTY_KINDS
              value: {{ .Values.warmthS3Gc.allowEmptyKinds | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.maxBytes }}
            - name: EMBERVM_WARMTH_S3_GC_MAX_BYTES
              value: {{ .Values.warmthS3Gc.maxBytes | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.statefulTtlMs }}
            - name: EMBERVM_WARMTH_S3_GC_STATEFUL_TTL_MS
              value: {{ .Values.warmthS3Gc.statefulTtlMs | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.sessionTtlMs }}
            - name: EMBERVM_WARMTH_S3_GC_SESSION_TTL_MS
              value: {{ .Values.warmthS3Gc.sessionTtlMs | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.servingTtlMs }}
            - name: EMBERVM_WARMTH_S3_GC_SERVING_TTL_MS
              value: {{ .Values.warmthS3Gc.servingTtlMs | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.sessionWorkspaceTtlMs }}
            - name: EMBERVM_WARMTH_S3_GC_SESSION_WORKSPACE_TTL_MS
              value: {{ .Values.warmthS3Gc.sessionWorkspaceTtlMs | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.groupSetTtlMs }}
            - name: EMBERVM_WARMTH_S3_GC_GROUP_SET_TTL_MS
              value: {{ .Values.warmthS3Gc.groupSetTtlMs | quote }}
            {{- end }}
            {{- if .Values.warmthS3Gc.intervalMs }}
            - name: EMBERVM_WARMTH_S3_GC_INTERVAL_MS
              value: {{ .Values.warmthS3Gc.intervalMs | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: oplog
              mountPath: /var/lib/embervm
            # The OTP release writes runtime scratch (extracted vm.args, boot
            # files) to RELEASE_TMP=/tmp; the rootfs is read-only, so /tmp is a
            # writable emptyDir. RELEASE_TMP is set in the image env (apko.yaml).
            - name: tmp
              mountPath: /tmp
        {{- if .Values.xds.enabled }}
        # xDS sidecar (R3, PR-3): the go-control-plane ADS server. It shares this
        # pod's network namespace with the control-plane container, so the control
        # plane reaches the snapshot API over 127.0.0.1:xds.httpPort (the API binds
        # loopback only). The ADS gRPC port is exposed on the embervm Service so the
        # per-node serving Envoys can dial it. The sidecar holds no durable state
        # and makes no decisions: an empty cache at boot serves nothing until the
        # first PUT, and if it restarts the node Envoys keep their last-ACKed config.
        - name: xds
          image: "{{ .Values.xds.image.repository }}@{{ .Values.xds.image.digest }}"
          imagePullPolicy: {{ .Values.xds.image.pullPolicy }}
          ports:
            - name: xds-grpc
              containerPort: {{ .Values.xds.grpcPort }}
          env:
            - name: EMBERVM_XDS_GRPC_PORT
              value: {{ .Values.xds.grpcPort | quote }}
            - name: EMBERVM_XDS_HTTP_PORT
              value: {{ .Values.xds.httpPort | quote }}
          readinessProbe:
            # The snapshot API's /healthz is loopback-only; the ADS gRPC port is
            # the pod-network surface. A TCP check on the gRPC port confirms the
            # sidecar is accepting node-Envoy connections without needing a gRPC
            # health probe in the image.
            tcpSocket:
              port: xds-grpc
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: xds-grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.xds.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- end }}
      volumes:
        - name: oplog
          {{- if and .Values.opLog.persistentVolume (not .Values.opLog.postgres.enabled) }}
          persistentVolumeClaim:
            claimName: {{ include "embervm.fullname" . }}-oplog
          {{- else }}
          # With the Postgres tier on there is no PVC to claim (pvc.yaml is
          # suppressed by the same condition), and nothing writes here: the
          # mount stays only so the volumeMounts block above needs no
          # conditional.
          # No durable op-log yet (Task 6); the health-only skeleton writes
          # nothing here, so an emptyDir avoids a storage dependency.
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
