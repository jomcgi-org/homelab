{{- if and .Values.servingEnvoy.enabled .Values.servingEnvoy.edge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "embervm.servingEdge.fullname" . }}
  labels:
    {{- include "embervm.servingEdge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.servingEnvoy.edge.replicas }}
  selector:
    matchLabels:
      {{- include "embervm.servingEdge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "embervm.servingEdge.labels" . | nindent 8 }}
      annotations:
        checksum/bootstrap: {{ include (print $.Template.BasePath "/serving-edge-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.servingEnvoy.edge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.servingEnvoy.edge.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.servingEnvoy.edge.priorityClassName }}
      priorityClassName: {{ .Values.servingEnvoy.edge.priorityClassName }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "embervm.servingEdge.selectorLabels" . | nindent 14 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: envoy
          image: "{{ .Values.servingEnvoy.image.repository }}:{{ .Values.servingEnvoy.image.tag }}"
          imagePullPolicy: {{ .Values.servingEnvoy.image.pullPolicy }}
          command:
            - /usr/local/bin/envoy
          args:
            - --config-path
            - /etc/envoy/envoy-bootstrap.yaml
            - --service-node
            - {{ .Values.servingEnvoy.edge.nodeId | quote }}
            - --service-cluster
            - {{ include "embervm.servingEdge.fullname" . }}
          ports:
            - name: http
              containerPort: {{ .Values.servingEnvoy.listenerPort }}
            - name: health
              containerPort: {{ .Values.servingEnvoy.edge.healthPort }}
          readinessProbe:
            # Envoy admin stays unready while the main listener waits for its
            # first RDS response. After configuration is applied, ADS loss keeps
            # the last ACKed routes and therefore preserves readiness.
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
          startupProbe:
            # Process startup is independent of dynamic route availability.
            httpGet:
              path: /live
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.servingEnvoy.edge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: {{ include "embervm.servingEdge.fullname" . }}-bootstrap
        - name: tmp
          emptyDir: {}
{{- end }}
