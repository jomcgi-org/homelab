{{- if .Values.noded.scratchPrep.enabled }}
# Node-provisioning contract (ADR embervm/012 storage-tiers amendment): the
# node-name -> real-scratch-device map the scratch-prep DaemonSet reads to know
# what to bind-mount onto the uniform logical path on each node. One key per FC
# node; a node with no key here is unmapped and the DaemonSet fails closed on it
# (see templates/scratch-prep-daemonset.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scratch-prep-nodemap
  labels:
    {{- include "embervm.scratchPrep.labels" . | nindent 4 }}
data:
  {{- range $node, $device := .Values.noded.scratchPrep.nodeMap }}
  {{ $node | quote }}: {{ $device | quote }}
  {{- end }}
{{- end }}
