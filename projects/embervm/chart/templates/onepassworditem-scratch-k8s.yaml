{{- if and .Values.scratchK8s.enabled .Values.scratchK8s.onepassword.itemPath }}
# Syncs the scratch-k8s group secret from 1Password into a STABLE K8s Secret in
# THIS (embervm) namespace. The Secret name + key match the composite Workload
# CR's spec.group.secretRef, so the control plane reads EMBER_GROUP_SECRET into
# every member's first-boot env on each boot (standing decision 13). Because the
# Secret is stable across group instances, the k3s server's derived static token-
# auth entry (serverTokenAuthCSV: the secret as a system:masters bearer token) is
# identical across rolls, TTL expiries, and fresh boots, so the consumer's kubectl
# token never changes. The 1Password item MUST expose a field that lands as a
# Secret key named exactly EMBER_GROUP_SECRET (name the item's field
# `EMBER_GROUP_SECRET`), which is the env var the k3s guest-init decodes into
# K3S_TOKEN and the token-auth CSV.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "embervm.fullname" . }}-scratch-k8s
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.scratchK8s.onepassword.itemPath | quote }}
{{- end }}
