{{- if and .Values.controlPlane.restoreCapabilityKeySecret.enabled .Values.controlPlane.restoreCapabilityKeySecret.onepassword.itemPath }}
# The operator renders this item into the Secret consumed by both the control
# plane and noded. The item must contain one field labelled by
# controlPlane.restoreCapabilityKeySecret.key (default "restore-capability-key").
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "embervm.restoreCapabilityKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.controlPlane.restoreCapabilityKeySecret.onepassword.itemPath | quote }}
{{- end }}
