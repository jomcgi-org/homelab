{{- if .Values.scratchK8s.enabled }}
# The R5 named composite consumer (ADR embervm/001, plan Task 10 / Fork 4): a
# scale-to-zero Kubernetes environment for agent workflows. One composite GROUP
# of member microVMs, sharing a private per-group subnet, that live, bank,
# relight, and die as ONE unit (whole-set warmth: the bundle set banks and
# relights atomically; a partial or unreadable set discards warmth and the whole
# group fresh-boots). The members are a k3s server (startOrder 0, entry) and two
# k3s agents (startOrder 1), each cold-booted from its Bazel-pinned guest image
# the same way scratch-postgres references its image (scratchK8sServer.guestImage
# / scratchK8sAgent.guestImage), so BaseBuilder's BuildBase(ref) resolves on the
# node and the derived EMBERVM_NODED_IMAGES entries + rootfs-builder GUEST_IMAGE
# use the same values.
#
# WARMTH-ONLY CONTRACT (state evaporates by design). This cluster is scratch tier.
# Its Kubernetes state (nodes, deployed pods, etcd/sqlite contents) is banked in
# the group snapshot only, never on a durable volume, and is DISCARDED on:
#   - a roll (maxLifetimeSeconds convergence: destroy-and-fresh-boot of the set),
#   - a banked-bundle TTL expiry (bankedTtlSeconds GC off node disk), and
#   - any fresh boot (a partial or unreadable warm set fresh-boots).
# A consumer must treat every wake as possibly-fresh: deploys are ephemeral and
# must be re-applied if the cluster fresh-boots. See the sandbox wiring doc and
# projects/embervm/runtimes/k3s/README.md.
#
# STABLE kubectl token across rolls/TTL/fresh-boot: spec.group.secretRef points at
# a stable K8s Secret (standing decision 13). EMBER_GROUP_SECRET is read from that
# Secret on every boot (never minted fresh), so the derived static token-auth
# entry the k3s server writes (serverTokenAuthCSV: the secret as a system:masters
# bearer token) is identical across instances. The monolith reads the SAME secret
# to build a matching kubeconfig token.
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: scratch-k8s
  namespace: {{ .Release.Namespace }}
  annotations:
    # Apply after the CRD (wave 0) establishes, like the other workloads.
    argocd.argoproj.io/sync-wave: "1"
spec:
  class: composite
  # The top-level source is the group's base-build seed (the CRD requires it for
  # every class); each member declares its own source below. The image lane, as
  # every other class. Seed with the server image so a factless top-level base
  # build is a valid k3s image.
  source:
    image:
      ref: "{{ .Values.scratchK8sServer.guestImage.repository }}@{{ .Values.scratchK8sServer.guestImage.digest }}"
      # The vsock health/ready contract used at BASE BUILD time (the warm-base
      # cold boot health-gates over vsock at readyPath; the k3s guest-init answers
      # /shim/ready there, mirroring scratch-postgres). The RUNTIME health is a TCP
      # connect to each member's healthPort over the tap, a separate probe.
      port: 1027
      readyPath: /shim/ready
  resources:
    # Group default sizing; each member overrides below. The server sets the warm
    # peak (airgap import + apiserver + sqlite), sized from the Task 3 spike.
    vcpus: 2
    memMib: 2048
  # No concurrency block: a composite's size is fixed by its member set (sum of
  # replicas), so spec.concurrency is forbidden by the watcher.
  group:
    members:
      # The server member: one VM, boots first (startOrder 0). k3s server with the
      # sqlite datastore, flannel host-gw, EMBER_GROUP_SECRET as the cluster token
      # AND the static token-auth API entry. Health gates on a TCP connect to 6443.
      # 2 vCPU / 4096 MiB: warmth-only members have NO volume, so k3s's data dir is
      # a tmpfs (guest-init mountCompositeDataDir), meaning the unpacked airgap +
      # containerd content + sqlite live in RAM alongside the apiserver/etcd. The
      # old 2048 floor was sized for the base build (k3s NOT running); a running
      # server needs ~2x. node-4 has ample RAM (ADR 002 rule 4 arithmetic holds).
      - name: server
        role: server
        startOrder: 0
        replicas: 1
        source:
          image:
            ref: "{{ .Values.scratchK8sServer.guestImage.repository }}@{{ .Values.scratchK8sServer.guestImage.digest }}"
            # (server member, same digest as the group source ref above)
        resources:
          vcpus: 2
          memMib: 4096
        healthPort: 6443
      # The agent members: two VMs (agent-0, agent-1), boot after the server
      # (startOrder 1). k3s agent joining https://$EMBER_PEER_SERVER:6443 with the
      # shared token. Health gates on a TCP connect to the kubelet on 10250. 1 vCPU
      # / 3072 MiB each: like the server, an agent is warmth-only (no volume), so
      # its containerd unpacks the airgap images into a tmpfs data dir (RAM). Its
      # steady footprint is under the server's (no apiserver/etcd), but the airgap
      # unpack is the same, so the old 1024 base-build floor is far too small.
      - name: agent
        role: agent
        startOrder: 1
        replicas: 2
        source:
          image:
            ref: "{{ .Values.scratchK8sAgent.guestImage.repository }}@{{ .Values.scratchK8sAgent.guestImage.digest }}"
        resources:
          vcpus: 1
          memMib: 3072
        healthPort: 10250
    # The group's single ingress: traffic reaches the server member's API on 6443,
    # exposed cluster-internally on the node Envoy at listenPort 5410 (the first
    # port of the values-declared composite range 5410-5419, unique across
    # composite workloads). A consumer connects to embervm-serving:<listenPort>.
    entry:
      member: server
      port: 6443
      listenPort: {{ .Values.scratchK8s.listenPort }}
    # The STABLE K8s Secret (this namespace) supplying EMBER_GROUP_SECRET to every
    # member. Read from the Secret each boot (never minted fresh), so the derived
    # kubectl token survives rolls, TTL expiries, and fresh boots (decision 13).
    # Created by the OnePasswordItem alongside this CR.
    secretRef:
      name: {{ include "embervm.fullname" . }}-scratch-k8s
      key: EMBER_GROUP_SECRET
    # Bank the WHOLE set after 10 minutes idle; a live connection is never severed.
    idleBankSeconds: 600
    # Version-convergence bound (1 week): the group rides its birth images until
    # this expires; convergence is destroy-and-fresh-boot of the whole set. State
    # evaporates on this roll (warmth-only contract above).
    maxLifetimeSeconds: 604800
    # A banked bundle SET untouched 1 week is GC'd off node disk as a unit (partial
    # warmth is never retained). State evaporates on this GC (warmth-only contract).
    bankedTtlSeconds: 604800
    # Whole-group wake deadline (generous: a fresh boot cold-starts every member,
    # including the server's airgap import + the agents joining).
    wakeTimeoutSeconds: 180
{{- end }}
