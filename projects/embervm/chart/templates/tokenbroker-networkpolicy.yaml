{{- /* networkPolicy.enabled gates ONLY this CiliumNetworkPolicy so clusters
without Cilium CRDs (the GKE hub) can run the broker at all; disabling it
drops the broker's ingress/egress scoping, the same trade the noded policy
gate makes in values-gke.yaml. Default stays true (home unchanged). */}}
{{- if and .Values.tokenBroker.enabled .Values.tokenBroker.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "embervm.tokenBroker.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "embervm.tokenBroker.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            app.kubernetes.io/component: noded
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            app.kubernetes.io/component: noded-brick
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    # Kubelet liveness/readiness probes originate from the node host. Once
    # ingress is default-deny they must be allowed or the pod never goes Ready.
    - fromEntities:
        - host
        - health
    # The monolith's agent surface proxies the device-code login flow
    # (/grants/<name>/login/*) so a login can be kicked off from a chat and
    # the code surfaced in the tool response (ADR 048, #4250 PR 2).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monolith
            app.kubernetes.io/name: monolith
            app.kubernetes.io/component: app
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
  egress:
    # Cilium's toFQDNs proxy only learns rotating provider IPs when DNS is
    # allowed with the L7 dns rule. Keep this rule ahead of the FQDN rule.
    - toEndpoints:
        # Namespaced policies scope endpoint selectors to their OWN namespace
        # unless the namespace key is explicit; CoreDNS lives in kube-system,
        # so without it this matches nothing and DNS stays default-denied.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    {{- range .Values.tokenBroker.grants }}
    - toFQDNs: [{ matchName: {{ .fqdn | quote }} }]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    {{- end }}
    # Persisting an approved grant writes a Secret through the apiserver, so this
    # rule is what makes a login durable rather than merely successful.
    #
    # 6443 is the load-bearing port here, NOT 443. The broker dials the
    # kubernetes ClusterIP 10.43.0.1:443, but Cilium enforces egress policy
    # AFTER service translation, so what the datapath actually evaluates is the
    # master's real endpoint, 192.168.1.x:6443 on k3s. A rule allowing only 443
    # therefore denies every apiserver call while looking correct. Confirmed
    # from the datapath rather than inferred:
    #
    #   xx drop (Policy denied) ... identity 49286->kube-apiserver:
    #       10.42.3.116:38576 -> 192.168.1.119:6443 tcp SYN
    #
    # That trace also shows the peer identity resolving as `kube-apiserver`,
    # so the entity was never the problem. `host` and `remote-node` are kept
    # only because a master can serve its own node's traffic under that
    # identity; they are not what fixed this.
    #
    # The symptom is a silent dial timeout, not a 403, so it reads as an
    # apiserver outage. It costs a single-use device code per reproduction:
    # the whole OAuth flow succeeds and only the final Secret write fails
    # (#4250).
    - toEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "6443", protocol: TCP }
{{- end }}
