{{- if .Values.tokenBroker.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "embervm.tokenBroker.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "embervm.tokenBroker.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            app.kubernetes.io/component: noded
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            app.kubernetes.io/component: noded-brick
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    # Kubelet liveness/readiness probes (and the host-network SigNoz scrape
    # agent) originate from the node host; once ingress is default-deny they
    # must be allowed explicitly or the pod never goes Ready. Mirrors
    # monolith-public's cilium policy.
    - fromEntities:
        - host
        - health
    # The monolith's agent surface proxies the device-code login flow
    # (/grants/<name>/login/*) so a login can be kicked off from a chat and
    # the code surfaced in the tool response (ADR 048, #4250 PR 2).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monolith
            app.kubernetes.io/name: monolith
            app.kubernetes.io/component: app
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
  egress:
    # Cilium's toFQDNs proxy only learns rotating provider IPs when DNS is
    # allowed with the L7 dns rule. Keep this rule ahead of the FQDN rule.
    - toEndpoints:
        # Namespaced policies scope endpoint selectors to their OWN namespace
        # unless the namespace key is explicit; CoreDNS lives in kube-system,
        # so without it this matches nothing and DNS stays default-denied.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    {{- range .Values.tokenBroker.grants }}
    - toFQDNs: [{ matchName: {{ .fqdn | quote }} }]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    {{- end }}
    # Persisting an approved grant writes a Secret through the apiserver, so this
    # rule is what makes a login durable rather than merely successful.
    #
    # `kube-apiserver` alone is NOT enough here. The broker dials the kubernetes
    # ClusterIP (10.43.0.1), which Cilium load-balances to one of the three
    # masters' host IPs. When it picks the master the broker itself is scheduled
    # on, the traffic is classified as `host`, and when it picks either other
    # master it is `remote-node`; neither is the `kube-apiserver` identity. So
    # the rule matched only sometimes, and the symptom was a silent dial timeout
    # (packets dropped, not refused) rather than a 403. It cost a consumed
    # single-use device code to find, because the flow completes and only the
    # final Secret write fails (#4250).
    - toEntities: [kube-apiserver, host, remote-node]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
{{- end }}
