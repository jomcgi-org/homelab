{{- if .Values.noded.enabled }}
# noded is a DaemonSet over the FC node pool (artifact-decoupling PR-C, C4): one
# node-affine daemon per node labelled homelab.io/firecracker=true, each owning
# that node's KVM device + nvme scratch. This is the interim bridge to the
# CP-managed per-node Deployments (PR-H); it replaces the single node-pinned
# Deployment so the fleet grows by LABELLING a node rather than editing values.
# The pod template is UNCHANGED from the Deployment (same securityContext,
# tolerations, terminationGracePeriodSeconds, volumes, probes); only the workload
# kind, the selector strategy, and the update strategy differ.
#
# A DaemonSet runs at most ONE pod per node by construction, so the "never run two
# against one node" invariant the old Recreate Deployment enforced holds
# inherently. The rolling update replaces node-by-node; each replacement drains
# within noded's own 110s budget (terminationGracePeriodSeconds = drain + 30s).
# maxSurge/zero-downtime handover across the roll is PR-F's concern; here the
# DaemonSet default RollingUpdate (maxUnavailable 1) is the interim behavior.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "embervm.noded.fullname" . }}
  labels:
    {{- include "embervm.noded.labels" . | nindent 4 }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    # embervm.noded.selectorLabels renders app.kubernetes.io/component: noded
    # inside the include (the rule's regex cannot see through it); the DaemonSet's
    # selector is disjoint from the control plane's and every brick class's.
    # nosemgrep: require-component-label-in-selector
    matchLabels:
      {{- include "embervm.noded.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "embervm.noded.labels" . | nindent 8 }}
    spec:
      # The pod itself (securityContext, host mounts, rootfs-builder init
      # containers, the full daemon env, probes, volumes) is shared with the
      # size-class brick Deployments via the embervm.noded.podSpec helper
      # (_noded-pod.tpl). The DaemonSet passes sizeClass "" (the wildcard class,
      # so no EMBERVM_NODED_SIZE_CLASS env is rendered and the pod is identical
      # to its pre-brick form) and the default noded resources.
      {{- include "embervm.noded.podSpec" (dict "ctx" . "sizeClass" "" "resources" .Values.noded.resources) | nindent 6 }}
{{- end }}
