{{- if and .Values.egress.enabled .Values.egress.onepassword.itemPath }}
# The real credentials the egress-proxy sidecar injects (ADR 023 6b). These
# never reach a guest: the sidecar reads the mounted value and attaches it only
# to requests for that secret's configured egressTo hosts.
#
# The operator renders this CR into a Secret of the SAME NAME, whose keys are the
# item's field labels, which is what egress.secrets[].secretRef points at.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.egress.onepassword.name | default (printf "%s-egress" (include "embervm.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.egress.onepassword.itemPath | quote }}
{{- end }}
