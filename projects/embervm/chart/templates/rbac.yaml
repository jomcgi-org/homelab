# Control-plane RBAC. Every verb here maps to a specific API call the control
# plane makes; a missing verb fails silently in prod as a Forbidden that looks
# like a generic 5xx, so the set is kept exact.
#
#   workloads (get/list/watch)          WorkloadWatcher relist + watch (Task 5)
#   workloads/status (update/patch)     status writer; the watcher writes ONLY
#                                       status, never spec (Task 5)
#   tokenreviews (create)               submit-API TokenReview auth (Task 8)
#   secrets (get)                       R4, D-R4.PR-7.1: Embervm.K8s.get_secret,
#                                       read by StatefulManager on a FRESH/COLD
#                                       wake when the workload's catalog entry
#                                       carries spec.stateful.secretRef, to
#                                       build StartStateful.mmds_env (the
#                                       MMDS-lite boot-args seam). NEW runtime
#                                       RBAC introduced by the mmds_env wiring;
#                                       every prior R0-R4 PR needed zero.
#   endpointslices (list)               artifact-decoupling PR-C, C4:
#                                       Embervm.K8s.list_noded_endpoints discovers
#                                       every noded DaemonSet pod behind the
#                                       headless Service so the control plane dials
#                                       each daemon individually (per-pod WatchNode
#                                       + SyncRegistry). Missing this list verb
#                                       makes discovery return [] and the control
#                                       plane finds NO nodes (silent no-dispatch).
#
# ClusterRole (not Role) because tokenreviews.authentication.k8s.io is cluster-
# scoped, and the watcher may observe Workloads (and now their Secrets) across
# namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "embervm.fullname" . }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - embervm.dev
    resources:
      - workloads
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - embervm.dev
    resources:
      - workloads/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "embervm.fullname" . }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "embervm.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "embervm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Namespaced pod RBAC for the CP dynamic sizer (artifact-decoupling PR-I,
# ADR embervm/012). A Role (not ClusterRole) because it grants access only to the
# embervm namespace's own noded pods:
#
#   pods (get/list/watch)   Embervm.NodeSizer.list_pods maps a node's capacity
#                           facts (keyed by spec.nodeName) to the noded pod NAME it
#                           must resize (a DaemonSet pod name is not derivable from
#                           the node name); NodeRegistry age-out/health also reads
#                           pod state. Missing this makes the sizer find no pods and
#                           silently never resize (guests stay scheduler-invisible).
#   pods/resize (patch)     Embervm.K8s.resize_pod PATCHes the pods/resize
#                           subresource (k8s 1.35 InPlacePodVerticalScaling) to grow
#                           /shrink each noded pod's memory + CPU request AND limit
#                           to the committed guest capacity on that node. Missing the
#                           patch verb makes every resize a Forbidden the sizer treats
#                           as a placement refusal, so nothing is ever placed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "embervm.fullname" . }}-node-sizer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/resize
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "embervm.fullname" . }}-node-sizer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "embervm.fullname" . }}-node-sizer
subjects:
  - kind: ServiceAccount
    name: {{ include "embervm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
