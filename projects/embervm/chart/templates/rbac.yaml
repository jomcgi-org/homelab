{{- $scope := .Values.rbac.scope }}
{{- if not (kindIs "string" $scope) }}
{{- fail "rbac.scope must be cluster or namespace" }}
{{- end }}
{{- if not (has $scope (list "cluster" "namespace")) }}
{{- fail "rbac.scope must be cluster or namespace" }}
{{- end }}
{{- if eq $scope "namespace" }}
{{- if not (kindIs "slice" .Values.rbac.secretNames) }}
{{- fail "rbac.secretNames must be a list of Secret names" }}
{{- end }}
{{- range .Values.rbac.secretNames }}
{{- if not (kindIs "string" .) }}
{{- fail "rbac.secretNames entries must be valid Secret names" }}
{{- end }}
{{- if or (gt (len .) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" .)) }}
{{- fail "rbac.secretNames entries must be valid Secret names" }}
{{- end }}
{{- end }}
{{- end }}
# Control-plane RBAC. Every verb here maps to a specific API call the control
# plane makes; a missing verb fails silently in prod as a Forbidden that looks
# like a generic 5xx, so the set is kept exact.
#
#   workloads (get/list/watch)          WorkloadWatcher relist + watch (Task 5)
#   workloads/status (update/patch)     status writer; the watcher writes ONLY
#                                       status, never spec (Task 5)
#   tokenreviews (create)               submit-API TokenReview auth (Task 8)
#   secrets (get)                       R4, D-R4.PR-7.1: Embervm.K8s.get_secret,
#                                       read by StatefulManager on a FRESH/COLD
#                                       wake when the workload's catalog entry
#                                       carries spec.stateful.secretRef, to
#                                       build StartStateful.mmds_env (the
#                                       MMDS-lite boot-args seam). NEW runtime
#                                       RBAC introduced by the mmds_env wiring;
#                                       every prior R0-R4 PR needed zero.
#
# The EndpointSlice list verb was RETIRED in R0 PR-2 (dial-home registration):
# the control plane no longer discovers daemons by listing pods; each noded
# instance POSTs its identity to /v1/nodes/register, so no discovery.k8s.io RBAC
# is needed.
#
# TokenReview requires a ClusterRole. Namespace mode moves runtime access to
# a Role matching the already namespace-scoped Workload watcher.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "embervm.fullname" . }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
rules:
{{- if eq $scope "cluster" }}
  - apiGroups:
      - embervm.dev
    resources:
      - workloads
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - embervm.dev
    resources:
      - workloads/status
    verbs:
      - get
      - update
      - patch
{{- end }}
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
{{- if eq $scope "cluster" }}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  # BrickController (brick-capacity PR-3): reconcile per-size-class brick
  # Deployment replica counts. It reads each brick Deployment's /scale
  # subresource and PATCHes spec.replicas on it; `deployments get` lets it
  # confirm a brick Deployment exists before scaling (a not-yet-rendered class
  # 404s harmlessly otherwise). Scale-only: it never updates the full Deployment
  # object, so no `update` on `deployments` itself. ArgoCD's fleet-wide
  # ignoreDifferences on /spec/replicas keeps these writes from showing as drift.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - get
      - patch
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "embervm.fullname" . }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "embervm.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "embervm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if eq $scope "namespace" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "embervm.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
rules:
  - apiGroups: ["embervm.dev"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["embervm.dev"]
    resources: ["workloads/status"]
    verbs: ["get", "update", "patch"]
{{- if .Values.rbac.secretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml .Values.rbac.secretNames | nindent 6 }}
    verbs: ["get"]
{{- end }}
{{- if and .Values.bricks.enabled .Values.bricks.classes }}
{{- $deployments := list }}
{{- range .Values.bricks.classes }}
{{- $deployments = append $deployments (printf "%s-brick-%s" (include "embervm.noded.fullname" $) .name) }}
{{- end }}
  # Static reconcile still scales in off/observe mode. Only regular class
  # Deployments are controller targets; floor Deployments remain static.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      {{- toYaml $deployments | nindent 6 }}
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames:
      {{- toYaml $deployments | nindent 6 }}
    verbs: ["get", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "embervm.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "embervm.fullname" . }}-runtime
subjects:
  - kind: ServiceAccount
    name: {{ include "embervm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.bricks.enabled (or (eq $scope "cluster") (eq .Values.bricks.autoscale.mode "full")) }}
---
# Drain-aware brick scale-down (Axis C, bricks.autoscale.mode=full): before
# shrinking a brick Deployment the BrickController picks its own idle,
# fully-exported victim and DIRECTS the ReplicaSet's choice by annotating that
# pod with a negative controller.kubernetes.io/pod-deletion-cost; `pods list`
# resolves the victim's name from the capacity fact's uid, `pods patch` writes
# the annotation. A namespaced Role (not more rules on the ClusterRole above):
# the controller only ever touches brick pods in its own release namespace, and
# pods patch is too broad a grant to hold cluster-wide. Rendered only when
# bricks are enabled by default; namespace mode additionally requires full
# autoscale, the only mode that selects and patches drain victims.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "embervm.fullname" . }}-brick-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "embervm.fullname" . }}-brick-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "embervm.fullname" . }}-brick-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "embervm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
