{{- if .Values.claudeRuntimeWorkload.enabled }}
{{- include "embervm.sessionBankedTtlGuard" (dict "ctx" $ "workload" "claudeRuntimeWorkload") -}}
# The claude-runtime workload (issue #4055): voice-drivable Claude Code agent
# sessions, and the first consumer of the guest egress lane (ADR 023).
#
# This is the object the monolith addresses. agent_sessions/transport.py POSTs to
# /v1/workloads/{name}/sessions and then /v1/sessions/{id}/invoke with
# X-Ember-Guest-Path: /shim/turn, so the name here is a cross-service contract
# with that module, not a local label.
#
# Session class, not stateful: a session VM survives an invoke (SessionAssign,
# not Assign), goes idle rather than dying, and resumes on the next invoke, so
# the CLI process and its conversation accrete across turns.
#
# persistenceEnabled gates the ADR 027 disk-backed mode, and deploy sets it
# TRUE for this workload, so read that file before reasoning about which idle
# path runs here. The flag selects the branch in do_bank (session_manager.ex):
# persistence ON parks (VM teardown, workspace stays on its volume, rejoin is a
# cold spawn), persistence OFF memory-banks to a node snapshot. The chart
# default below is false, so the chart alone renders the banking path while
# production runs the parking one. The knob is named idleBankSeconds in both
# cases, which is why the name is not evidence of which branch you are on.
#
# Egress is not a field here, but this workload's NAME is load-bearing for it.
# The lane is gated per workload (EMBERVM_NODED_EGRESS_WORKLOADS), and the
# chart derives that allowlist from the `name` below, so renaming this workload
# moves the CR and the allowlist together. Sessions banked under the old name
# do NOT move with it: their workload is durable and is replayed as the relight
# trace, so they resume outside the allowlist with no egress lane.
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: {{ .Values.claudeRuntimeWorkload.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Apply after the CRD (wave 0) establishes, like every other workload.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  class: session
  {{- if .Values.claudeRuntimeWorkload.persistenceEnabled }}
  persistence:
    memory: false
    filesystem:
      enabled: true
      retention: 1
      sizeBytes: {{ .Values.claudeRuntimeWorkload.workspaceSizeBytes }}
      mountPath: /session
  {{- end }}
  source:
    image:
      # Bazel-pinned from the runtime-claude guest image's .info provider, the
      # same digest the rootfs-builder initContainer bakes onto node scratch, so
      # the Workload and the rootfs on disk can never disagree.
      ref: "{{ .Values.runtimeClaude.guestImage.repository }}@{{ .Values.runtimeClaude.guestImage.digest }}"
      port: {{ .Values.claudeRuntimeWorkload.port }}
      readyPath: {{ .Values.claudeRuntimeWorkload.readyPath | quote }}
      invokePath: {{ .Values.claudeRuntimeWorkload.invokePath | quote }}
      # Baked guest env, and part of the workload signature (base_builder
      # signature/1 includes sorted init_env): changing any entry re-keys and
      # rebuilds this workload's base, and only this one. Deploy values use an
      # epoch entry here to force a base rebuild when node-side capture
      # behaviour changes, because noded config is deliberately excluded from
      # the base key. The shared hypervisor epoch rides along so a vendored
      # Firecracker bump re-keys this base together with every other workload
      # (#4389): a new hypervisor must never load a previous version's snapshot.
      initEnv:
        EMBER_HYPERVISOR_EPOCH: {{ .Values.hypervisorEpoch | quote }}
        {{- with .Values.claudeRuntimeWorkload.initEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  resources:
    vcpus: {{ .Values.claudeRuntimeWorkload.vcpus }}
    memMib: {{ .Values.claudeRuntimeWorkload.memMib }}
  concurrency:
    # floor is the pristine pool kept warm for fast create (0 here: see values),
    # cap is the max number of LIVE session VMs. Banked and parked sessions
    # both hold only disk and are bounded separately by session.maxSessions.
    floor: {{ .Values.claudeRuntimeWorkload.floor }}
    cap: {{ .Values.claudeRuntimeWorkload.cap }}
  session:
    idleBankSeconds: {{ .Values.claudeRuntimeWorkload.session.idleBankSeconds }}
    maxLifetimeSeconds: {{ .Values.claudeRuntimeWorkload.session.maxLifetimeSeconds }}
    bankedTtlSeconds: {{ .Values.claudeRuntimeWorkload.session.bankedTtlSeconds }}
    maxSessions: {{ .Values.claudeRuntimeWorkload.session.maxSessions }}
    invokeQueueCap: {{ .Values.claudeRuntimeWorkload.session.invokeQueueCap }}
  invocation:
    # Total duration bound for a session invoke (CP transport plus guest execution).
    # Maximum of 900s per CRD schema (workload-crd.yaml:868); increase this only
    # if CRD maximum is raised. The shim's per-event watchdog (TURN_READ_TIMEOUT)
    # is 600s, and the monolith's outer bound (agent_sessions/transport.py) is 1800s,
    # so the ordering is: shim inactivity 600s < CP total {{ .Values.claudeRuntimeWorkload.invocation.timeoutSeconds }}s < monolith outer 1800s.
    # The innermost timeout always fires first, giving the caller a specific error
    # rather than a generic transport cancel. A real agent turn (model round trip
    # plus tool calls plus any VM build on cache miss) needs substantial headroom.
    timeoutSeconds: {{ .Values.claudeRuntimeWorkload.invocation.timeoutSeconds }}
{{- end }}
