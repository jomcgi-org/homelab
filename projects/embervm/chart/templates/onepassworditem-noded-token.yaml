{{- if and .Values.noded.bearerTokenSecret.enabled .Values.noded.bearerTokenSecret.onepassword.itemPath }}
# The operator renders this item into a Secret of the SAME NAME. The item must
# contain one field labelled by noded.bearerTokenSecret.key (default "token"),
# which is the key both the control plane and noded reference directly.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "embervm.noded.bearerTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.noded.bearerTokenSecret.onepassword.itemPath | quote }}
{{- end }}
