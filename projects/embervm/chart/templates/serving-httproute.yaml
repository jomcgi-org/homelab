{{- if .Values.servingEnvoy.enabled }}
{{- /*
Operator-owned ingress routes for serving workloads (Gateway API).

embervm exposes each serving workload as a BACKEND (the serving Service + an internal
vhost authority the node Envoy matches, pushed via xDS by the control plane). This
template renders the operator's HTTPRoutes from servingEnvoy.routes: each entry binds a
gateway + hostname + path and rewrites the external Host to the workload's internal
vhost authority (rewriteHost) before the request reaches the serving Service, so the
node Envoy's xDS-published virtual host matches. Public vs private is purely which
gateway/hostname an entry binds (and whether Cloudflare Access fronts that hostname);
the serving substrate knows none of it. A path on an already-routed host needs no
DNS/cert/tunnel change, which is why the demo routes are paths, not subdomains
(mirroring the ArgoCD path-route precedent on the same gateway).

URLRewrite.hostname is the canonical Gateway-API Host rewrite (a RequestHeaderModifier
on Host is rejected by some implementations).
*/}}
{{- range .Values.servingEnvoy.routes }}
{{- if .enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "embervm.serving.fullname" $ }}-{{ .name }}
  labels:
    {{- include "embervm.servingEnvoy.labels" $ | nindent 4 }}
    ingress-tier: {{ .tier }}
spec:
  parentRefs:
    - name: {{ .gateway.name }}
      namespace: {{ .gateway.namespace }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .pathPrefix | quote }}
      filters:
        # Rewrite the external Host to the workload's INTERNAL vhost authority so the
        # node Envoy's xDS-published virtual host matches. The edge forwards Host = the
        # gateway hostname (a path on that host, not a subdomain), which the node Envoy
        # has no vhost for; without this rewrite it 404s.
        - type: URLRewrite
          urlRewrite:
            hostname: {{ .rewriteHost | quote }}
      backendRefs:
        - name: {{ include "embervm.serving.fullname" $ }}
          port: {{ $.Values.servingEnvoy.listenerPort }}
{{- if .rateLimit }}
---
# Envoy Gateway local (per-gateway-pod token bucket, no Redis) rate limit on this
# route, protecting the warm serving tier: each request can wake a microVM, so a
# flood of distinct queries could exhaust serving capacity. Mirrors monolith-public's
# limit on the cold /functions/ path.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "embervm.serving.fullname" $ }}-{{ .name }}-rate-limit
  labels:
    {{- include "embervm.servingEnvoy.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "embervm.serving.fullname" $ }}-{{ .name }}
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: {{ .rateLimit.requests | default 120 }}
            unit: {{ .rateLimit.unit | default "Minute" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
