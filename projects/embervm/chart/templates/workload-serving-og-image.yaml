{{- if .Values.servingOgImage.enabled }}
# The serving-og-image workload (R3 Part A, D-R3.11.1): og-image re-registered as a
# SERVING-class zip workload so it runs warm over its tap NIC. It is ADDITIVE and
# takes NO production traffic: the task-class FaaS og-image registration stays the
# instant rollback, and this serves only the private drill host below. The REAL
# public og-image flip is Part B (controller-driven), not this.
#
# Source is the SAME zip identity the FaaS task-class registration produces (runtime
# python312, handler app.handle, the deterministic sha256 of og_image/app.py). The
# control plane resolves `runtime: python312` to the runtime-python base, layers the
# zip at BuildBase, and bakes the handler-imported state into the base snapshot
# (ADR embervm/002), so a serving cold boot needs no runtime hydrate. On the serving
# cold boot the python shim binds TCP on spec.serving.port (EMBER_SERVING_PORT via
# the ember.serving_port= boot-arg) instead of vsock (D-R3.11.1), so /shim/healthz
# is reachable over the tap for the daemon's health probe.
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: {{ .Values.servingOgImage.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Apply after the CRD (wave 0) establishes, like the other workload CRs.
    argocd.argoproj.io/sync-wave: "1"
spec:
  class: serving
  source:
    zip:
      runtime: {{ .Values.servingOgImage.runtime | quote }}
      codeUri: {{ .Values.servingOgImage.codeUri | quote }}
      sha256: {{ .Values.servingOgImage.sha256 | quote }}
      handler: {{ .Values.servingOgImage.handler | quote }}
      invokePath: {{ .Values.servingOgImage.invokePath | quote }}
      readyPath: {{ .Values.servingOgImage.readyPath | quote }}
  resources:
    vcpus: {{ .Values.servingOgImage.vcpus }}
    memMib: {{ .Values.servingOgImage.memMib }}
  concurrency:
    # For the serving class, cap is an alias for spec.serving.maxInstances and MUST
    # equal it (the watcher rejects a mismatch); floor is unused by serving.
    cap: {{ .Values.servingOgImage.serving.maxInstances }}
  serving:
    port: {{ .Values.servingOgImage.serving.port }}
    healthPath: {{ .Values.servingOgImage.serving.healthPath | quote }}
    host: {{ .Values.servingOgImage.serving.host | quote }}
    minInstances: {{ .Values.servingOgImage.serving.minInstances }}
    maxInstances: {{ .Values.servingOgImage.serving.maxInstances }}
    idleBankSeconds: {{ .Values.servingOgImage.serving.idleBankSeconds }}
    drainSeconds: {{ .Values.servingOgImage.serving.drainSeconds }}
    maxLifetimeSeconds: {{ .Values.servingOgImage.serving.maxLifetimeSeconds }}
{{- end }}
