{{- if .Values.demoPostgres.enabled }}
# Demo-postgres: the private demos page's sleep/wake exhibit. A second stateful
# Postgres alongside scratch-postgres, tuned so the lifecycle is watchable: it
# banks ~a tick after the demo's connection closes and pays a visible relight on
# the next query. It reuses scratchPostgres' guest image pin (the SAME image ref
# string, so the noded rootfs base and the pushed image identity resolve with
# zero extra provisioning) and the same first-boot POSTGRES_PASSWORD Secret; only
# the workload identity, port, and lifecycle economics differ. The volume is its
# own (volumes are keyed by workload name), so demo rows never land in a real
# tenant's database.
#
# Gated on demoPostgres.enabled ALONE: the scratch-postgres Workload CR can be
# off (it is, since 2026-08 when its only consumer was decommissioned) while
# this exhibit stays up. The scratchPostgres VALUES block must remain populated
# either way, since the guest image pin, workloads entry, and Secret are shared.
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: demo-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    # Apply after the CRD (wave 0) establishes, like the other workloads.
    argocd.argoproj.io/sync-wave: "1"
spec:
  class: stateful
  source:
    image:
      # Must match scratchPostgres.guestImage exactly: the rootfs-builder base
      # and the noded image table are keyed on this ref via the scratchPostgres
      # workloads entry, so an identical string is what makes this workload
      # bootable without its own base bake.
      ref: "{{ .Values.scratchPostgres.guestImage.repository }}@{{ .Values.scratchPostgres.guestImage.digest }}"
      port: 1027
      readyPath: /shim/ready
      # Baked guest env; part of the base signature (base_builder signature/1
      # includes sorted init_env), so the shared hypervisor epoch re-keys this
      # base whenever the vendored Firecracker binary moves: a new hypervisor
      # must never try to load a previous version's snapshot (#4389).
      initEnv:
        EMBER_HYPERVISOR_EPOCH: {{ .Values.hypervisorEpoch | quote }}
  resources:
    vcpus: 1
    # Sized for what this guest actually holds, not the scratch-postgres warm
    # peak it used to copy. The memfile is the one thing here that is FULLY
    # allocated (the volume is a sparse cap: 2 GiB declared, ~144 MiB of real
    # blocks), so memMib is written and read in full on every bank and every
    # relight. It is therefore the demo's headline latency AND its per-bundle
    # cost on the bricks' scratch.
    #
    # 150 MiB budget: ~25 MiB kernel, 32 MiB shared_buffers (see the matching
    # -c flags in runtimes/postgres/guest-init/cmd/postgres_linux.go, which
    # MUST come down with this number or Postgres cannot start), ~25 MiB of
    # postmaster and backends, leaving ~65 MiB of page cache for a 144 MiB
    # volume holding one small table.
    #
    # memMib is part of the base signature (control/lib/embervm/base_builder.ex
    # signature/1), so moving it rebuilds this workload's base. Nothing shares
    # that base any more: scratchPostgres.enabled is false in both the chart
    # defaults and deploy/values.yaml (decommission tracked in #4198), so the
    # old "keyed to the shared base image" coupling no longer binds.
    memMib: 150
  stateful:
    # The port Postgres listens on inside the VM. Health is a TCP connect here.
    port: 5432
    listenPort: {{ .Values.demoPostgres.listenPort }}
    volumeSizeGiB: {{ .Values.demoPostgres.volumeSizeGiB }}
    volumeMountPath: /data
    # The demo knob: bank as soon as one sweeper tick sees the workload idle.
    # A live connection is still never severed (decision 7); the demo backend
    # uses short-lived connections precisely so this window is reachable.
    idleBankSeconds: {{ .Values.demoPostgres.idleBankSeconds }}
    # Version-convergence bound (1 week), as scratch-postgres.
    maxLifetimeSeconds: 604800
    # A banked bundle untouched 30 days is GC'd; the volume is never GC'd.
    bankedTtlSeconds: 2592000
    # Wake deadline (generous: cold boots include WAL recovery and, on first
    # boot, mkfs + initdb).
    wakeTimeoutSeconds: 60
    # Opt in to the two-phase interruptible bank (ADR embervm/008): a query that
    # lands mid-bank resumes the paused VM (hot) instead of cold booting, so the
    # aggressive idleBankSeconds:1 above is safe. This is exactly the exhibit the
    # mode exists for (a human clicking at the wrong moment).
    interruptibleBank: {{ .Values.demoPostgres.interruptibleBank }}
    # Auto-wake after base READY (instance-key unification PR-B0a, A2): this is the
    # public /health exhibit, so a chart bump's noded roll (which rebuilds the base)
    # must not leave it wedged until a manual forced wake. The CP wakes it the moment
    # the rebuilt base is READY.
    autoWake: {{ .Values.demoPostgres.autoWake }}
    # Reuse the scratch-postgres Secret: same superuser password on first boot.
    secretRef: {{ include "embervm.fullname" . }}-scratch-postgres
    # Node-local activator (ADR embervm/018 Phase 2). REQUIRED for a visitor to be
    # able to wake this exhibit at all: noded's statefulByListenPort gate is
    # `NodeLocalWake && StatefulListenPort == port`, so with this false the L4
    # activator logs "no eligible workload for listener" and closes the connection
    # (issue #4077). autoWake above only covers the base-READY case, which is the
    # control plane waking itself, never a connection arriving on 5401.
    nodeLocalWake: {{ .Values.demoPostgres.nodeLocalWake }}
    meteringFailOpen: {{ .Values.demoPostgres.meteringFailOpen }}
{{- end }}
