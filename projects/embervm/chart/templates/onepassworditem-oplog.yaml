{{- if and .Values.opLog.postgres.enabled .Values.opLog.postgres.onepassword.itemPath }}
# Syncs the op-log role password from 1Password into a Secret in THIS (embervm)
# namespace. deployment.yaml reads it as EMBERVM_OPLOG_PASSWORD and assembles
# EMBERVM_OPLOG_DSN around it, so only the password lives here. The 1Password
# item MUST expose a field that lands as a Secret key named exactly `password`
# (matching opLog.postgres.secretKey).
#
# The SAME 1Password item seeds the kubernetes.io/basic-auth secret CNPG needs
# to set the role's password, which is created out-of-band because the 1Password
# operator emits only Opaque secrets and cannot set a secret type or the
# cnpg.io/reload label. That is why the item is the single source of truth for
# this credential and why the two can never drift. Procedure:
# projects/monolith/deploy/embervm-oplog-secret.md.
#
# The password inside the DSN must be URL-safe; see the warning in values.yaml.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.opLog.postgres.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.opLog.postgres.onepassword.itemPath | quote }}
{{- end }}
