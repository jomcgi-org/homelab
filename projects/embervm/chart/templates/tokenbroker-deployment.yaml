{{- if .Values.tokenBroker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "embervm.tokenBroker.fullname" . }}
  labels:
    {{- include "embervm.tokenBroker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.tokenBroker.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "embervm.tokenBroker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The k8s-infra prometheus scraper auto-discovers pods by these
        # annotations; /metrics is served on the main listener, and the node
        # host entity (allowed for kubelet probes) covers the scrape path.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
      labels:
        {{- include "embervm.tokenBroker.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "embervm.tokenBroker.serviceAccountName" . }}
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      containers:
        - name: tokenbroker
          image: "{{ .Values.tokenBroker.image.repository }}:{{ .Values.tokenBroker.image.tag }}@{{ .Values.tokenBroker.image.digest }}"
          imagePullPolicy: {{ .Values.tokenBroker.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }, { name: metrics, containerPort: 9090 }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: KUBERNETES_NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - { name: TOKENBROKER_GRANTS, value: {{ toJson .Values.tokenBroker.grants | quote }} }
            - { name: BROKER_LISTEN_ADDR, value: ":8080" }
          resources:
            {{- toYaml .Values.tokenBroker.resources | nindent 12 }}
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
{{- end }}
