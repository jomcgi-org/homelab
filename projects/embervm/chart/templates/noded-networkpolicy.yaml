{{- if .Values.noded.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "embervm.noded.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  # The DaemonSet, class bricks, and floor bricks share these two labels. Their
  # component labels differ (noded vs noded-brick), so selecting on the shared
  # name and release instance covers every noded pod shape in one selector.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "embervm.noded.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    # The control plane dials noded gRPC. Its immutable selector has no component
    # label, so match the two labels from embervm.selectorLabels plus namespace.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            {{- include "embervm.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports:
            - { port: {{ .Values.noded.grpcPort | quote }}, protocol: TCP }
    # Kubelet liveness/readiness probes (and the host-network SigNoz scrape
    # agent) originate from the node host; once ingress is default-deny they
    # must be allowed explicitly or the pod never goes Ready. Mirrors
    # monolith-public's cilium policy.
    - fromEntities:
        - host
        - health
      toPorts:
        - ports:
            - { port: {{ .Values.noded.healthPort | quote }}, protocol: TCP }
    # The comment above is half right. SigNoz ships TWO collectors, and the one
    # that reads `prometheus.io/scrape` is not the host-network agent: it is the
    # otel-deployment, whose `prometheus/scraper` receiver does a cluster-wide
    # `role: pod` discovery from the POD network. `host` never matched it, so
    # the scrape annotations on this deployment were advertised and enforced
    # against: every scrape was dropped (Policy denied) and noded's
    # metrics were never collected, while the drops kept the Hubble
    # POLICY_DENIED alert firing continuously.
    #
    # Scoped to instance=signoz deliberately. A second, unmanaged
    # `k8s-infra-otel-deployment` from an older release name is still running in
    # that namespace; it is not granted reach to noded.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: signoz
            app.kubernetes.io/name: k8s-infra
            app.kubernetes.io/instance: signoz
            app.kubernetes.io/component: otel-deployment
      toPorts:
        - ports:
            - { port: {{ .Values.noded.healthPort | quote }}, protocol: TCP }
    # Serving Envoy sends scaled-to-zero HTTP wakes to the node-local activator.
    # The control plane also calls it during lifecycle orchestration.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            {{- include "embervm.servingEnvoy.selectorLabels" . | nindent 12 }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            {{- include "embervm.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports:
            - { port: {{ .Values.noded.activatorPort | quote }}, protocol: TCP }
    # Serving Envoy reaches live serving VMs through noded's prerouting DNAT
    # projection at servingPortBase + hostOffset, where hostOffset is 2..254.
    # One range entry: the Cilium CRD caps a toPorts.ports list at 40 items and
    # supports endPort (the platform chart pins Cilium 1.20.0), so enumerating the
    # 253 ports would be rejected at apply time.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            {{- include "embervm.servingEnvoy.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ add .Values.noded.servingPortBase 2 | quote }}
              endPort: {{ add .Values.noded.servingPortBase 254 }}
              protocol: TCP
    # noded binds the stateful (EMBERVM_NODED_STATEFUL_ACTIVATOR_PORT_RANGE,
    # default 5400-5409) and composite group (EMBERVM_NODED_GROUP_ACTIVATOR_PORT_RANGE,
    # default 5410-5419) activator ranges BY DEFAULT in noded/config/config.go,
    # even though this chart renders neither env. The node Envoy's stateful and
    # group tcp_proxy fallbacks dial podIP:<listenPort> on them, and the control
    # plane's TCP activator can too. Omitting these dropped serving-envoy's wake
    # to noded:5401 and took demo-postgres down on 2026-08-22 (#4693); the
    # ranges are the same values servingEnvoy declares as capacity.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            {{- include "embervm.servingEnvoy.selectorLabels" . | nindent 12 }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            {{- include "embervm.selectorLabels" . | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.servingEnvoy.statefulTcpPortRange.start | quote }}
              endPort: {{ .Values.servingEnvoy.statefulTcpPortRange.end }}
              protocol: TCP
            - port: {{ .Values.servingEnvoy.compositeTcpPortRange.start | quote }}
              endPort: {{ .Values.servingEnvoy.compositeTcpPortRange.end }}
              protocol: TCP
{{- end }}
