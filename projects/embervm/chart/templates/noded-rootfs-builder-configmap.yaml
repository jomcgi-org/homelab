{{- if .Values.workloads }}
# Build script for the noded base-rootfs initContainers (Task 14). Kept in a
# ConfigMap so it can be tuned without rebuilding the tools image. Each
# per-workload rootfs-builder initContainer (see the range in
# noded-deployment.yaml) runs this same script with its own GUEST_IMAGE and
# BASE_ROOTFS_PATH, baking the guest filesystem into a read-only ext4 image the
# workload's microVMs boot from. Ported from the fc-invoke rootfs-builder.
#
# Digest-keyed cache (artifact-decoupling Phase 0): the ext4 is baked ONCE per
# guest CONTENT DIGEST into a content-addressed cache file, and the template-time
# BASE_ROOTFS_PATH (the path the pushed image identity attaches) is an
# instant hardlink to that cache file. The guest image TAG is a per-build
# timestamp (apko stamps STABLE_IMAGE_TAG on every CI build), so a tag-keyed name
# changed on every roll even when the image bytes were identical, re-paying the
# 4-5 minute crane-export + mkfs.ext4 tax each time. Keying the bake on the digest
# makes an unchanged guest image a cache hit (hardlink only, no bake).
#
# Rootfs identity contract (#5674): every bake gets a random ext4 UUID. A base
# snapshot is valid only against the exact rootfs file it was built on or a
# byte-identical copy. Noded keys bases on that UUID and refuses a restore whose
# recorded UUID differs from the local rootfs. Cross-node hydration therefore
# requires distributing the baked rootfs file itself (#5772), not rebaking the
# same guest digest on another node.
#
# The shared rootfs cache stores that baked file by full guest image digest, so
# every node receives byte-identical bytes and the same ext4 UUID. Bases can then
# hydrate across nodes under the identity contract. The node-local hardlink cache
# stays in front of the store, so a pod restart on a surviving node still costs
# no download and no bake.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "embervm.noded.fullname" . }}-rootfs-builder
  labels:
    {{- include "embervm.noded.labels" . | nindent 4 }}
data:
  build-base-rootfs.sh: |
    #!/bin/bash
    # crane resolves the guest image to its arch-specific content digest, bakes the
    # ext4 once per digest into a content-addressed cache file on the mounted nvme
    # disk, and hardlinks the template-time BASE_ROOTFS_PATH to it, so no human on
    # node-4 with sudo is needed to place a rootfs.
    set -euo pipefail
    : "${GUEST_IMAGE:?GUEST_IMAGE required}"
    : "${BASE_ROOTFS_PATH:?BASE_ROOTFS_PATH required}"
    # Defaulted, never required. The ConfigMap lands at sync wave 0 while bricks
    # roll later and one at a time, so a pod restarting in that window still has
    # the OLD pod spec and none of these set. Requiring them would turn that
    # window into a crashloop on a node with no disk problem at all. Unset simply
    # means reclaim is unavailable. Validation lives in the reclaim function, so
    # a malformed value disables reclaim instead of failing every bake fleetwide.
    : "${EMBERVM_ROOTFS_RECLAIM_ENABLED:=}"
    : "${EMBERVM_ROOTFS_RECLAIM_SNAPSHOTS_ROOT:=}"
    : "${EMBERVM_ROOTFS_RECLAIM_TARGET_FREE_BYTES:=}"
    # Safety constant, not a tuning knob: how long an intermediate must sit
    # untouched before it counts as abandoned rather than in flight.
    : "${EMBERVM_ROOTFS_RECLAIM_MIN_AGE_SECONDS:=3600}"
    size="${ROOTFS_SIZE:-2G}"
    # Registry reads (crane) can hit a transient DNS/network blip. Observed
    # 2026-07-19: a `{:connect, :no_addresses}` blip while the control plane's
    # base builder was pulling a freshly-rolled guest image left the workload
    # unprovisioned until a manual control-plane restart. Bake-time crane calls
    # get the same treatment here: without a retry a blip fails the initContainer,
    # forcing a whole pod-restart cycle to re-bake. Bounded exponential backoff,
    # diagnostics to stderr so a retried command-substitution still captures only
    # the successful stdout.
    retry() {
      attempt=1
      delay=3
      until "$@"; do
        if [ "$attempt" -ge 5 ]; then
          echo "command still failing after $attempt attempts: $*" >&2
          return 1
        fi
        echo "attempt $attempt failed: $* ; retrying in ${delay}s" >&2
        sleep "$delay"
        attempt=$((attempt + 1))
        delay=$((delay * 2))
      done
    }
    # Plain integer, computed with shell arithmetic rather than inside awk.
    # busybox awk can format a large integral double in scientific notation, and
    # a non-numeric operand makes `[ -ge ]` ERROR rather than compare. In a
    # deletion loop that reads as "never stop" instead of "stop now", so both
    # operands are validated before any comparison happens.
    free_bytes() {
      local kb
      kb="$(df -Pk "$1" 2>/dev/null | awk 'NR == 2 { print $4 }')" || return 1
      case "$kb" in
        "" | *[!0-9]*) return 1 ;;
      esac
      printf '%s\n' "$((kb * 1024))"
    }
    # ENOSPC orphan reclaim (#4458).
    #
    # Deliberately narrow: this removes ONLY abandoned build intermediates, never
    # a published artifact. A bake writes rootfs-<digest>.ext4.tmp.<name> and
    # renames on success; SnapshotBase stages into bases/<key>.building and
    # renames on success. Both are garbage by construction once nothing is
    # writing them, so reclaiming them needs NO judgement about which base is
    # current or which session is pinned to what.
    #
    # That judgement belongs to the control plane, which owns the authoritative
    # current ref and drives eviction through noded's evictBaseLocal. An earlier
    # draft of this script tried to make it here in bash and got it wrong three
    # separate ways: a .building orphan looked "newest" so the LIVE base became
    # the candidate, a failed stat won the newest slot so a vanished path was
    # kept instead, and equal mtimes resolved by directory order. None of that
    # arises when the only candidates are files nothing can be referencing.
    #
    # Noded takes a flock on <base>.building.lock while building. This bash
    # reclaimer does not take that lock, so it must keep the age floor: staging
    # directories and rootfs temporaries younger than min_age are left alone.
    # Candidates at least min_age old may be removed; this bake's own temporary
    # is excluded by name as well.
    reclaim_orphans_after_enospc() {
      local keep_path="$1"
      local snapshots_root="$EMBERVM_ROOTFS_RECLAIM_SNAPSHOTS_ROOT"
      local target="$EMBERVM_ROOTFS_RECLAIM_TARGET_FREE_BYTES"
      local min_age="$EMBERVM_ROOTFS_RECLAIM_MIN_AGE_SECONDS"
      local noded_root bases now armed free_before free_after simulated
      local would_free path mtime age size
      local -a candidates=()
      armed=0
      if [ "$EMBERVM_ROOTFS_RECLAIM_ENABLED" = "1" ]; then
        armed=1
      fi
      # Every bail-out below returns 1, which the caller turns into the same
      # non-zero exit the bake had anyway. A misconfigured reclaim must never be
      # worse than no reclaim.
      if [ -z "$snapshots_root" ]; then
        echo "rootfs ENOSPC reclaim unavailable: snapshots root unset (pod spec predates this feature)" >&2
        return 1
      fi
      case "$target" in
        "" | *[!0-9]*)
          echo "rootfs ENOSPC reclaim unavailable: target_free_bytes must be plain digits, got '$target'" >&2
          return 1
          ;;
      esac
      case "$min_age" in
        "" | *[!0-9]*)
          echo "rootfs ENOSPC reclaim unavailable: min_age_seconds must be plain digits, got '$min_age'" >&2
          return 1
          ;;
      esac
      if ! free_before="$(free_bytes "$snapshots_root")"; then
        echo "rootfs ENOSPC reclaim unavailable: cannot read free space for $snapshots_root" >&2
        return 1
      fi
      noded_root="$(dirname "$snapshots_root")"
      bases="$snapshots_root/bases"
      now="$(date +%s)"
      # Bake temporaries, one level under each workload's scratch dir. BOTH the
      # rootfs- prefix and the .tmp. infix are required, so a completed
      # rootfs-<digest>.ext4 can never match: a banked session embeds the host
      # path of the rootfs it was born on and removing one corrupts that restore.
      # rootfs-store stages downloads as <out>.tmp.<random>, so its interrupted
      # downloads match this same glob and depth.
      while IFS= read -r -d '' path; do
        if [ "$path" != "$keep_path" ]; then
          candidates+=("$path")
        fi
      done < <(find "$noded_root" -mindepth 2 -maxdepth 2 -type f -name 'rootfs-*.ext4.tmp.*' -print0 2>/dev/null)
      # Staging dirs left behind by a SnapshotBase that died before its rename.
      if [ -d "$bases" ]; then
        while IFS= read -r -d '' path; do
          candidates+=("$path")
        done < <(find "$bases" -mindepth 1 -maxdepth 1 -type d -name '*.building' -print0 2>/dev/null)
      fi
      echo "rootfs ENOSPC orphan reclaim: armed=$armed free_before=$free_before target=$target min_age_seconds=$min_age candidates=${#candidates[@]}" >&2
      simulated="$free_before"
      would_free=0
      for path in "${candidates[@]}"; do
        if [ "$armed" = "1" ]; then
          if ! free_before="$(free_bytes "$snapshots_root")"; then
            echo "rootfs ENOSPC orphan reclaim: lost free-space reading, stopping" >&2
            break
          fi
        else
          free_before="$simulated"
        fi
        # Applies in BOTH modes so the dry-run manifest stops where an armed run
        # would. It is an ESTIMATE: a file still held open elsewhere returns its
        # blocks only once that holder exits, so an armed run can need to go
        # further than the manifest showed.
        if [ "$free_before" -ge "$target" ]; then
          break
        fi
        mtime="$(stat -c %Y -- "$path" 2>/dev/null || echo "")"
        case "$mtime" in
          "" | *[!0-9]*)
            echo "rootfs ENOSPC orphan reclaim: skipping unreadable $path" >&2
            continue
            ;;
        esac
        age=$((now - mtime))
        if [ "$age" -lt "$min_age" ]; then
          echo "rootfs ENOSPC orphan reclaim: sparing $path, age ${age}s under min ${min_age}s (a co-located bake may own it)" >&2
          continue
        fi
        size="$(du -sk -- "$path" 2>/dev/null | awk '{print $1}')"
        case "$size" in
          "" | *[!0-9]*) size=0 ;;
        esac
        size=$((size * 1024))
        if [ "$armed" = "1" ]; then
          echo "rootfs ENOSPC orphan reclaim DELETE path=$path size_bytes=$size age_seconds=$age free_before=$free_before" >&2
          rm -rf -- "$path"
          free_after="$(free_bytes "$snapshots_root" || echo "$free_before")"
          echo "rootfs ENOSPC orphan reclaim DELETED path=$path size_bytes=$size free_after=$free_after" >&2
        else
          free_after=$((free_before + size))
          echo "rootfs ENOSPC orphan reclaim DISARMED: WOULD DELETE path=$path size_bytes=$size age_seconds=$age free_before=$free_before free_after=$free_after" >&2
          simulated="$free_after"
          would_free=$((would_free + size))
        fi
      done
      if [ "$armed" != "1" ]; then
        echo "rootfs ENOSPC orphan reclaim DISARMED: would_free_bytes=$would_free, failing as before" >&2
        return 1
      fi
      free_after="$(free_bytes "$snapshots_root" || echo 0)"
      echo "rootfs ENOSPC orphan reclaim complete: free_after=$free_after target=$target" >&2
      return 0
    }
    base_dir="$(dirname "$BASE_ROOTFS_PATH")"
    mkdir -p "$base_dir"
    # The template-time path for THIS build is already materialized (a pod restart
    # on the same chart version, or a co-scheduled builder for a workload sharing
    # this guest image): the hardlink is already placed, nothing to do. CRUCIAL:
    # never overwrite or delete any other rootfs-*.ext4 here -- a banked session
    # snapshot embeds the host path of the rootfs it was born on, so clobbering it
    # corrupts that session's restore (the EXT4 checksum bug). This builder only
    # ever ADDS names (a digest cache file and hardlinks to it); old files are
    # reaped out-of-band once no base or session references them.
    if [ -f "$BASE_ROOTFS_PATH" ]; then
      echo "base rootfs already present for this build: $BASE_ROOTFS_PATH"
      exit 0
    fi
    # Pull the guest filesystem for THIS node's architecture (the builder image
    # is multi-arch, so uname reflects the node); guest images are multi-arch.
    case "$(uname -m)" in
      x86_64) platform=linux/amd64 ;;
      aarch64 | arm64) platform=linux/arm64 ;;
      *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
    esac
    # Content-address the rootfs by the arch-specific manifest digest so an
    # unchanged guest image resolves to the SAME cache file across builds
    # regardless of the per-build timestamp tag. This is the key the bake
    # short-circuits on.
    digest="$(retry crane digest --platform "$platform" "$GUEST_IMAGE")"
    digest="${digest#sha256:}"
    if [ "${#digest}" -ne 64 ]; then
      echo "invalid sha256 guest digest length: $digest" >&2
      exit 1
    fi
    case "$digest" in
      *[!0-9a-fA-F]*)
        echo "invalid sha256 guest digest: $digest" >&2
        exit 1
        ;;
    esac
    short="${digest:0:12}"
    cache="$base_dir/rootfs-$short.ext4"
    if [ -f "$cache" ]; then
      echo "rootfs cache hit $short for $GUEST_IMAGE"
    else
      cache_tmp="$(mktemp "$cache.tmp.XXXXXX")"
      store_hit=0
      store_fallback=0
      store_fallback_reason=""
      baked=0
      if command -v rootfs-store >/dev/null 2>&1; then
        set +e
        store_get_output="$(rootfs-store get --digest "$digest" --out "$cache_tmp" 2>&1)"
        store_get_status=$?
        set -e
        case "$store_get_status" in
        0)
          store_hit=1
          echo "rootfs store hit digest=sha256:$digest path=$cache"
          ;;
        3)
          store_fallback=1
          store_fallback_reason="disabled or miss"
          ;;
        *)
          store_fallback=1
          store_fallback_reason="get failed"
          echo "rootfs store get failed digest=sha256:$digest status=$store_get_status error=$store_get_output; falling back to bake" >&2
          ;;
        esac
      else
        echo "rootfs store cache unavailable: rootfs-store not on PATH; baking" >&2
      fi
      if [ "$store_hit" -ne 1 ]; then
        baked=1
        echo "rootfs cache miss $short; building from $GUEST_IMAGE -> $cache"
      # A failed crane export leaves /work/root partially extracted, so the
      # retried attempt must start from a clean tree; reset it inside the unit.
      export_rootfs() {
        rm -rf /work/root
        mkdir -p /work/root
        crane export --platform "$platform" "$GUEST_IMAGE" - | tar -x -C /work/root
      }
      retry export_rootfs
      mkfs_output="$(mktemp)"
      set +e
      mkfs.ext4 -q -F -L embervmbase -d /work/root "$cache_tmp" "$size" >"$mkfs_output" 2>&1
      mkfs_status=$?
      set -e
      if [ "$mkfs_status" -ne 0 ]; then
        cat "$mkfs_output" >&2
        # TWO signals, because the message text alone is not dependable.
        # e2fsprogs reports host-filesystem exhaustion variously as "No space
        # left on device", as a short write, or as a failure to allocate a
        # block, and the exact wording has never been confirmed against a real
        # wedged node. A free-space floor does not depend on wording at all, so
        # a missed message cannot leave the node deadlocked the way it did on
        # 2026-08-07. grep -E rather than BRE alternation: this is busybox grep.
        enospc=0
        if grep -qiE 'ENOSPC|No space left on device|short write|Could not allocate block' "$mkfs_output"; then
          enospc=1
        elif free_now="$(free_bytes "$EMBERVM_ROOTFS_RECLAIM_SNAPSHOTS_ROOT")" &&
          [ "$free_now" -lt "$EMBERVM_ROOTFS_RECLAIM_TARGET_FREE_BYTES" ] 2>/dev/null; then
          echo "rootfs bake failed with free space $free_now under target; treating as ENOSPC" >&2
          enospc=1
        fi
        if [ "$enospc" -eq 1 ]; then
          echo "rootfs bake hit ENOSPC" >&2
          if [ "$EMBERVM_ROOTFS_RECLAIM_ENABLED" != "1" ]; then
            echo "rootfs ENOSPC orphan reclaim is DISARMED; dry-run manifest follows" >&2
          fi
          # Status captured explicitly for legibility. Note this does NOT restore
          # errexit inside the function: `set +e` around the call suppresses it
          # for the whole body exactly as `if ! reclaim ...` would. Nothing in
          # reclaim_orphans_after_enospc relies on errexit; every bail-out is an
          # explicit `return 1`, and the values it computes are validated before
          # they are compared, which is what makes that safe.
          set +e
          reclaim_orphans_after_enospc "$cache_tmp"
          reclaim_status=$?
          set -e
          rm -f "$mkfs_output"
          if [ "$reclaim_status" -ne 0 ]; then
            rm -f "$cache_tmp"
            exit 1
          fi
          rm -f "$cache_tmp"
          echo "rootfs ENOSPC orphan reclaim retry: mkfs.ext4 once" >&2
          mkfs.ext4 -q -F -L embervmbase -d /work/root "$cache_tmp" "$size"
        else
          echo "mkfs.ext4 failed and free space looks fine; reclaim not attempted" >&2
          rm -f "$mkfs_output"
          rm -f "$cache_tmp"
          exit "$mkfs_status"
        fi
      fi
      rm -f "$mkfs_output"
      fi
      # A sibling brick on this node may publish the same digest to the shared
      # scratch while this builder downloads or bakes it. The existing file is
      # the node's canonical copy, so never rename over its inode.
      if [ -f "$cache" ]; then
        echo "rootfs $short published by a sibling while this builder ran"
        rm -f "$cache_tmp"
      else
        mv_error="$(mktemp)"
        if mv -f "$cache_tmp" "$cache" 2>"$mv_error"; then
          if [ "$baked" -eq 1 ]; then
            echo "rootfs baked at $cache ($size)"
          fi
          rm -f "$mv_error"
        else
          # Say what actually happened. This used to surface as one bare
          # "mv: cannot stat" line with the mkfs output swallowed, which is why
          # #5630 read as a mystery twice.
          cat "$mv_error" >&2
          echo "rootfs builder produced no file at $cache_tmp and $cache does not exist" >&2
          rm -f "$mv_error" "$cache_tmp"
          exit 1
        fi
      fi
      if [ "$baked" -eq 1 ]; then
        if [ "$store_fallback" -eq 1 ]; then
          echo "rootfs store $store_fallback_reason and baked digest=sha256:$digest path=$cache"
        fi
        if command -v rootfs-store >/dev/null 2>&1; then
          set +e
          store_put_output="$(rootfs-store put --digest "$digest" --file "$cache" --image-ref "$GUEST_IMAGE" 2>&1)"
          store_put_status=$?
          set -e
          if [ "$store_put_status" -eq 0 ] && [ "$store_put_output" = "uploaded" ]; then
            echo "rootfs store uploaded digest=sha256:$digest path=$cache"
          elif [ "$store_put_status" -eq 0 ] && [[ "$store_put_output" == "already present"* ]]; then
            echo "rootfs store upload skipped ($store_put_output) digest=sha256:$digest path=$cache"
          elif [ "$store_put_status" -eq 3 ]; then
            echo "rootfs store disabled or miss; upload skipped digest=sha256:$digest path=$cache"
          else
            echo "rootfs store upload failed digest=sha256:$digest status=$store_put_status error=$store_put_output" >&2
          fi
        else
          echo "rootfs store cache unavailable: rootfs-store not on PATH; upload skipped" >&2
        fi
      fi
    fi
    # Materialize the template-time path noded attaches as a hardlink to the cache
    # file: instant, no data copy, and both names are immutable inodes, so a
    # snapshot that embedded either path restores against byte-identical content.
    ln -f "$cache" "$BASE_ROOTFS_PATH"
    echo "linked $BASE_ROOTFS_PATH -> $cache"
    # Read s_uuid directly from the primary ext4 superblock. The optional
    # e2fsprogs-extra listing utility is deliberately absent from the image.
    # The pipeline and its output validation are guarded because identity
    # observability must never turn a successful bake into an init failure.
    actual_uuid=""
    if raw_uuid="$(dd if="$cache" bs=1 skip=1128 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')"; then
      case "$raw_uuid" in
        "" | *[!0-9a-fA-F]*)
          echo "rootfs identity warning: invalid ext4 UUID bytes read from $cache" >&2
          ;;
        *)
          if [ "${#raw_uuid}" -eq 32 ]; then
            actual_uuid="${raw_uuid:0:8}-${raw_uuid:8:4}-${raw_uuid:12:4}-${raw_uuid:16:4}-${raw_uuid:20:12}"
          else
            echo "rootfs identity warning: short ext4 UUID read from $cache (${#raw_uuid} hex characters)" >&2
          fi
          ;;
      esac
    else
      echo "rootfs identity warning: failed to read ext4 UUID from $cache" >&2
    fi
    echo "rootfs identity digest=sha256:$digest uuid=${actual_uuid:-unavailable} path=$cache"
{{- end }}
