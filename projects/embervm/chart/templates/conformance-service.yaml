{{- if .Values.conformance.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "embervm.fullname" . }}-conformance
  labels: {{- include "embervm.conformance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "embervm.conformance.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
