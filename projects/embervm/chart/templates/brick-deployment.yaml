{{- if .Values.bricks.enabled }}
# Size-class BRICK Deployments (ADR embervm/013 section 7 as amended,
# bricks-everywhere). One Deployment per T-shirt size-class, each rendering the
# SHARED noded pod (embervm.noded.podSpec, _noded-pod.tpl) with that class's
# EMBERVM_NODED_SIZE_CLASS label and its own resource block. Bricks are the single
# capacity unit: the control plane places whole VMs onto them and the
# BrickController scales each Deployment's replica COUNT (never resizing a live
# pod). Unlike the interim noded DaemonSet (one pod per node) a brick Deployment's
# replicas are scheduled by kube-scheduler, so several bricks bin-pack onto one FC
# node - that is the point, and it is why brick pods deliberately carry NO
# anti-affinity.
#
# Gated on bricks.enabled (false in brick-capacity PR-1: this whole file renders
# nothing and the fleet stays on the DaemonSet). PR-3 flips it true for a canary
# beside the DS, after the PR-3 per-instance scratch dirs land so co-located
# bricks do not clobber each other's warmth in the shared nvme dir.
#
# Each brick Deployment's selector carries component=noded-brick plus the
# size-class label, so it is DISJOINT from the DaemonSet's (component=noded) and
# from every other class: no two controllers ever fight over a pod. The control
# plane learns each brick by dial-home registration (POST /v1/nodes/register),
# not Service/EndpointSlice discovery, so brick pods need not sit behind the noded
# Service.
#
# ROLLOUT SEQUENCING (argocd.argoproj.io/sync-wave, below). Every brick
# Deployment used to render at the default wave 0, so a chart bump applied all
# of them in the same instant and ArgoCD rolled the whole fleet at once. Each
# replacement pod runs the rootfs-builder init container and pulls its images,
# so the fleet-wide roll is a CPU + disk + uplink stampede on every node
# simultaneously. Observed 2026-07-30 06:06, one minute after a merge: ghcr.io
# pulls failing with ImagePullBackOff, the whole wired LAN at 100% packet loss
# while the gateway still answered in 3ms, and the cloudflared replica on an
# unshaped node losing all four tunnel connections. With ~12 embervm merges in
# a day that is a recurring self-inflicted outage.
#
# Each brick Deployment now gets its own ascending wave, so ArgoCD applies one,
# waits for it to report Healthy (its rollout complete), and only then applies
# the next. maxSurge:0/maxUnavailable:1 already serialised the pods WITHIN a
# Deployment; waves serialise ACROSS them, which is the part that was missing.
#
# Waves are assigned by list position: classes take syncWaveBase + index, then
# floors continue from syncWaveBase + len(classes) + index, so the two ranges
# never collide and adding a class or a floor shifts only the entries after it.
# Base defaults to 2, which leaves wave 0 for the control plane and shared infra
# (bricks dial home to the CP, so it must be up first) and wave 1 for the
# Workload CRs, both of which keep their current waves untouched.
#
# This is a stopgap, NOT ADR embervm/011. That decision is OnDelete pod
# semantics with the control plane as the rollout controller, checking
# interlocks, draining, confirming banked, deleting the pod and verifying the
# replacement, so rolls land in idle windows and pause on an unhealthy store.
# None of that is implemented; sync waves only remove the simultaneity. The
# trade-off is real: a brick that never goes Healthy now stalls the sync at its
# wave instead of letting later waves through, which is why the Application
# keeps its retry limit.
{{- $ctx := . }}
{{- range $i, $class := .Values.bricks.classes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "embervm.noded.fullname" $ctx }}-brick-{{ $class.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ add $ctx.Values.bricks.syncWaveBase $i | quote }}
  labels:
    {{- include "embervm.brick.labels" (dict "ctx" $ctx "class" $class.name) | nindent 4 }}
spec:
  # Explicit, because the inherited 600s default is shorter than a healthy brick
  # rebuild and would red a good promotion (#4868). See bricks.progressDeadlineSeconds.
  progressDeadlineSeconds: {{ $ctx.Values.bricks.progressDeadlineSeconds }}
  # A brick's memory is a HARD reservation (request==limit), so two same-class
  # bricks never fit where one does on a capacity-tight node. The default
  # RollingUpdate surges (new pod before old), which needs 2x the class's memory
  # and DEADLOCKS on a single-node fleet: the surge pod sits Pending "Insufficient
  # memory" forever while the old pod it would replace stays up (observed
  # 2026-07-20, the 16Gi brick roll). maxSurge:0 rolls each brick in place (kill
  # old, then schedule new into the freed reservation); maxUnavailable:1 still
  # rolls a multi-replica class one pod at a time. A zero-downtime surge-roll needs
  # a second node with a class-sized memory hole to land on (ADR embervm/011); on
  # the current single big-memory node the large class cannot surge.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # replicas is only the value at FIRST create: the BrickController (PR-3) owns it
  # thereafter, and ArgoCD ignores Deployment /spec/replicas fleet-wide (the HPA
  # ignoreDifferences rule) so the controller's scaling never shows as drift. Both
  # this create-value and the controller's target read the same bricks.desiredReplicas
  # map (default 0 for an unlisted class).
  replicas: {{ index $ctx.Values.bricks.desiredReplicas $class.name | default 0 }}
  selector:
    # embervm.brick.selectorLabels renders app.kubernetes.io/component: noded-brick
    # plus the size-class label inside the include (the rule's regex cannot see
    # through it); each class's selector is disjoint from the DaemonSet's and from
    # every other class.
    # nosemgrep: require-component-label-in-selector
    matchLabels:
      {{- include "embervm.brick.selectorLabels" (dict "ctx" $ctx "class" $class.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "embervm.brick.labels" (dict "ctx" $ctx "class" $class.name) | nindent 8 }}
    spec:
      {{- include "embervm.noded.podSpec" (dict "ctx" $ctx "sizeClass" $class.name "resources" $class.resources) | nindent 6 }}
{{- end }}

# Per-node brick FLOOR Deployments (brick-capacity PR-3, ADR embervm/013 sibling
# decision): one pinned, fixed-replicas-1 Deployment per `bricks.nodeFloors`
# entry, guaranteeing that specific node joins active duty instead of every
# class bin-packing onto whichever node the scheduler happens to fill first
# (observed: everything landing on node-4 and spilling under load). Each floor
# renders the SAME shared pod (identical labels, resources, strategy) as its
# class's demand-driven Deployment, but under a DISTINCT name
# (`-brick-<class>-<node>` vs `-brick-<class>`) and with nodeSelector pinned to
# kubernetes.io/hostname instead of the fleet-wide FC-node label.
#
# The distinct name is what keeps the BrickController out: it PATCHes /scale by
# exact Deployment name (deployment_prefix <> class name), never enumerating by
# label, so a floor Deployment is simply never addressed by the controller and
# replicas stays a static 1 forever (verified against brick_controller.ex). A
# floor brick still dial-home registers as a normal instance of its class
# (registration is name-agnostic), so it counts toward that class's registered
# total for fleet-full/autoscale accounting - which only ever makes fleet-full
# LESS likely and idle scale-down MORE likely (the accounting is registered <
# desired shaped, not equality-shaped), both acceptable per the plan's analysis.
#
# Selector: embervm.brickFloor.selectorLabels adds a brick-floor=<node> label on
# top of the shared class selector, so this Deployment's selector is DISJOINT
# from its class Deployment's. Reusing the class selector here would be a real
# bug (two ReplicaSet controllers fighting over the same pods), not just style.
#
# Floors roll AFTER every class (wave syncWaveBase + len(classes) + index).
# They are the fixed per-node capacity guarantee, so rolling them last keeps a
# pinned brick alive on each node for as long as possible while the elastic
# class Deployments cycle. Rolling them last also spreads them across distinct
# waves, which matters more than it looks: the floors are pinned to different
# nodes, so rolling them together would put a rootfs build on every node at once
# even though no single node is over-subscribed.
{{- range $j, $floor := .Values.bricks.nodeFloors }}
{{- $class := $floor.class }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "embervm.noded.fullname" $ctx }}-brick-{{ $class }}-{{ $floor.node }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ add $ctx.Values.bricks.syncWaveBase (len $ctx.Values.bricks.classes) $j | quote }}
  labels:
    {{- include "embervm.brickFloor.labels" (dict "ctx" $ctx "class" $class "node" $floor.node) | nindent 4 }}
spec:
  # Same reasoning as the class Deployment above: the 600s default is shorter
  # than a healthy rootfs rebuild (#4868).
  progressDeadlineSeconds: {{ $ctx.Values.bricks.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # Fixed at 1: a floor is a static per-node guarantee, not a scaled quantity.
  # ArgoCD's fleet-wide replicas ignoreDifferences rule applies here too, but
  # nothing ever writes a different value, so it is inert for floor Deployments.
  replicas: 1
  selector:
    # nosemgrep: require-component-label-in-selector
    matchLabels:
      {{- include "embervm.brickFloor.selectorLabels" (dict "ctx" $ctx "class" $class "node" $floor.node) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "embervm.brickFloor.labels" (dict "ctx" $ctx "class" $class "node" $floor.node) | nindent 8 }}
    spec:
      {{- $classSpec := "" }}
      {{- range $c := $ctx.Values.bricks.classes }}
      {{- if eq $c.name $class }}
      {{- $classSpec = $c }}
      {{- end }}
      {{- end }}
      {{- if not $classSpec }}
      {{- fail (printf "bricks.nodeFloors entry for node %s references unknown class %q (not in bricks.classes)" $floor.node $class) }}
      {{- end }}
      {{- include "embervm.noded.podSpec" (dict "ctx" $ctx "sizeClass" $class "resources" $classSpec.resources "nodeSelector" (dict "kubernetes.io/hostname" $floor.node)) | nindent 6 }}
{{- end }}
{{- end }}
