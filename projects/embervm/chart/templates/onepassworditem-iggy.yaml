{{- if and .Values.iggy.enabled .Values.iggy.onepassword.itemPath }}
# Syncs the Iggy root user's password from 1Password into a K8s Secret in THIS
# (embervm) namespace. The Secret name matches the Workload CR's
# stateful.secretRef, so the control plane reads it into the guest's first-boot
# mmds_env (D-R4.PR-7.1). The 1Password item MUST expose a field that lands as a
# Secret key named exactly IGGY_ROOT_PASSWORD (name the item's field
# `IGGY_ROOT_PASSWORD`), which is the env var iggy-server reads when it creates
# the root user on first boot.
#
# This item is not optional the way an unset password is elsewhere: without it
# ember-iggy-init refuses the first boot. That is deliberate. Iggy does not fail
# on a missing root password and does not fall back to a fixed default; it
# generates a random one and prints it to stdout exactly once. On a stateful
# volume that boot happens once ever, so the only copy of the credential would
# be that log line, on a datastore that outlives it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "embervm.fullname" . }}-iggy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.iggy.onepassword.itemPath | quote }}
{{- end }}
