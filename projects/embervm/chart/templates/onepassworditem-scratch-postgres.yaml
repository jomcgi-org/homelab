{{- if and (or .Values.scratchPostgres.enabled .Values.demoPostgres.enabled) .Values.scratchPostgres.onepassword.itemPath }}
# Syncs the scratch-postgres superuser password from 1Password into a K8s Secret
# in THIS (embervm) namespace. Rendered whenever EITHER postgres workload is on:
# demo-postgres reuses this same Secret as its stateful.secretRef, so the item
# must survive scratch-postgres being disabled. The Secret name matches the
# Workload CR's stateful.secretRef, so the control plane reads it into the
# guest's first-boot
# mmds_env (D-R4.PR-7.1). The 1Password item MUST expose a field that lands as a
# Secret key named exactly POSTGRES_PASSWORD (name the item's field
# `POSTGRES_PASSWORD`), which is the env var the guest-init decodes and the
# Postgres bootstrap reads on first boot for initdb.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "embervm.fullname" . }}-scratch-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.scratchPostgres.onepassword.itemPath | quote }}
{{- end }}
