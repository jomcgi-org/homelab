{{- if .Values.scratchPostgres.enabled }}
# The R4 named stateful consumer (ADR embervm/001, D-R4.PR-11.1): a scale-to-zero
# scratch Postgres. One long-lived microVM owns one writable volume (data on the
# volume, warmth in the snapshot); it banks when idle and wakes on the next
# inbound TCP connection. The guest image ref is the SAME Bazel-pinned value the
# noded rootfs-builder bakes and EMBERVM_NODED_IMAGES keys on (scratchPostgres.
# guestImage), so BaseBuilder's BuildBase(ref) resolves on the node. First boot
# runs initdb from the POSTGRES_PASSWORD delivered via the secretRef -> mmds-lite
# boot-args seam; later cold boots skip initdb (WAL recovery only).
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: scratch-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    # Apply after the CRD (wave 0) establishes, like the other workloads.
    argocd.argoproj.io/sync-wave: "1"
spec:
  class: stateful
  source:
    image:
      # Must match the top-level scratchPostgres.guestImage exactly (the derived
      # EMBERVM_NODED_IMAGES + rootfs-builder GUEST_IMAGE use the same value).
      ref: "{{ .Values.scratchPostgres.guestImage.repository }}@{{ .Values.scratchPostgres.guestImage.digest }}"
      # The vsock health/ready contract used at BASE BUILD time (the warm-base
      # cold boot health-gates over vsock at readyPath; the guest-init answers
      # /shim/ready there). The RUNTIME health is a TCP connect to stateful.port
      # (5432) over the tap, a separate probe.
      port: 1027
      readyPath: /shim/ready
  resources:
    # 512Mi sizes the warm peak: shared_buffers=128MB plus Postgres backends and
    # the guest OS. The fc-base sizing coupling sizes memMib to the warm peak
    # (D-R3.11.1 / the fc-base-build-sizing-coupling note). vcpus 1 is ample for a
    # scratch datastore.
    vcpus: 1
    memMib: 512
  # No concurrency block: the stateful class is a singleton (exactly one live
  # VM), so spec.concurrency is forbidden by the watcher.
  stateful:
    # The port Postgres listens on inside the VM. Health is a TCP connect here.
    port: 5432
    # The node Envoy TCP listener port this workload is exposed on cluster-
    # internally (a client connects to embervm-serving:<listenPort>). Must fall
    # in the chart's stateful range (5400-5409) and be unique across stateful
    # workloads. From values so a range change is one knob.
    listenPort: {{ .Values.scratchPostgres.listenPort }}
    # Sparse cap of the raw volume file, in GiB. Immutable in v1.
    volumeSizeGiB: 10
    # Guest path the volume is mounted at (guest-init mkfs+mounts a blank device;
    # PGDATA lives at <mount>/pgdata).
    volumeMountPath: /data
    # Bank after 2 minutes idle; a live connection is never severed. Short so the
    # bank COMPLETES inside a consumer's quiet window before its next background
    # write reconnects (a longer idle let the bank race-and-abort against Loom's
    # periodic control-plane commits); scratch-tier data makes a prompt bank cheap.
    idleBankSeconds: 120
    # Version-convergence bound (1 week): the instance rides its birth image
    # until this expires; convergence is destroy-and-cold-boot against the volume.
    maxLifetimeSeconds: 604800
    # A banked bundle untouched 30 days is GC'd off node disk; the VOLUME is never
    # GC'd (data outlives the bundle).
    bankedTtlSeconds: 2592000
    # Wake deadline (generous: cold boots include WAL recovery and, on first boot,
    # mkfs + initdb).
    wakeTimeoutSeconds: 60
    # Opt in to the two-phase interruptible bank (ADR embervm/008). Off by default
    # for scratch-postgres until the mode is vetted under real tenant traffic (the
    # atomic bank is unchanged when false); plumbed from values so enabling it is
    # a one-line flip once proven on demo-postgres.
    interruptibleBank: {{ .Values.scratchPostgres.interruptibleBank }}
    # The K8s Secret in THIS namespace whose keys become the guest's first-boot
    # env (POSTGRES_PASSWORD). Created by the OnePasswordItem alongside this CR.
    # The control plane reads it into StartStateful.mmds_env on a FRESH/COLD wake
    # only, never on RELIGHT.
    secretRef: {{ include "embervm.fullname" . }}-scratch-postgres
    # Node-local activator (ADR embervm/018 Phase 2): the brick relights this
    # scaled-to-zero demo on the first connection so it survives a control-plane
    # Recreate. meteringFailOpen names the wake-unmetered-during-gap policy for this
    # blessed demo.
    nodeLocalWake: {{ .Values.scratchPostgres.nodeLocalWake }}
    meteringFailOpen: {{ .Values.scratchPostgres.meteringFailOpen }}
{{- end }}
