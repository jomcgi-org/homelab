{{- if .Values.tokenBroker.enabled }}
{{- range .Values.tokenBroker.grants }}
---
apiVersion: v1
kind: Secret
metadata:
  name: embervm-oauth-grant-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Never prune or cascade-delete a grant Secret: it holds the only copy of
    # a rotating OAuth refresh token, and losing it forces an interactive
    # re-login. Removing a grant from values must be a deliberate manual
    # cleanup. The matching ignoreDifferences entry in deploy/application.yaml
    # keeps ArgoCD from reverting /data to the empty chart declaration.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
data: {}
{{- end }}
{{- end }}
