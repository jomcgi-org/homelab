{{- if .Values.tokenBroker.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "embervm.tokenBroker.fullname" . }}
  namespace: {{ .Release.Namespace }}
rules:
  # OAuth credentials and quota observations deliberately use separate objects.
  - apiGroups: [""]
    resources: [secrets]
    # Explicit grant names keep this Role narrowly scoped. Add a name here when
    # adding a tokenBroker.grants entry.
    resourceNames:
      {{- range .Values.tokenBroker.grants }}
      - embervm-oauth-grant-{{ .name }}
      {{- end }}
    verbs: [get, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames:
      - {{ include "embervm.tokenBroker.fullname" . }}-quota
    verbs: [get, update]
{{- end }}
