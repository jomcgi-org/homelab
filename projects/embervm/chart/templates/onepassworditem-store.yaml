{{- if and .Values.noded.store.credentials.enabled .Values.noded.store.credentials.onepassword.itemPath }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "embervm.store.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.noded.store.credentials.onepassword.itemPath | quote }}
{{- end }}
