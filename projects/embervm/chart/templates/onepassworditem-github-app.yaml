{{- if and .Values.tokenBroker.enabled .Values.tokenBroker.githubApp.enabled }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "embervm.tokenBroker.fullname" . }}-github-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "embervm.tokenBroker.labels" . | nindent 4 }}
spec:
  itemPath: {{ required "tokenBroker.githubApp.onepassword.itemPath is required" .Values.tokenBroker.githubApp.onepassword.itemPath | quote }}
{{- end }}
