{{- if .Values.tokenBroker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: codex-token-broker
  labels: {{- include "embervm.tokenBroker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "embervm.tokenBroker.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
