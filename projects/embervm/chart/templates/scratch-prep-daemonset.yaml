{{- if .Values.scratchPrep.enabled }}
# Node-provisioning contract actuator (ADR embervm/012 storage-tiers amendment;
# warmth cache-cap retention decisions 2026-07-22 "Uniform storage cap"): noded's
# hostPath expects a uniform logical path (noded.firecracker.nvmeRoot,
# /var/lib/embervm/scratch, type Directory) to already exist and hold each node's
# scratch. On EKS Karpenter userData mounts instance-store NVMe there at
# bootstrap; on this fixed fleet of pet nodes there is no bootstrap script, so
# this privileged DaemonSet is the actuator instead.
#
# UNIFORM SIZE-CAPPED LOOP SCRATCH (no per-node snowflake map). On every FC node
# the contract is: /var/lib/embervm/scratch is a bounded ext4 mount, so a warmth
# leak is PHYSICALLY unable to starve etcd/root. The DaemonSet provisions a
# size-capped ext4 loop file (scratchSizeGi) and mounts it there, EXCEPT where
# scratch is ALREADY a mountpoint. That one guard is load-bearing:
#
#   node-4 already has its dedicated NVMe bind-mounted onto the path (fstab), so
#   `mountpoint -q` is true there and this DaemonSet SKIPS it entirely: it never
#   unmounts, reformats, fallocates, or otherwise touches node-4's live scratch.
#   The masters (node-1/2/3) have nothing mounted there, so they get the loop
#   cap from day one (near-empty scratch, hard-capped so a leak cannot spill onto
#   the root/etcd disk).
#
# Tool boundary: the container does only file-level work (fallocate the backing
# file, mkfs.ext4 the FILE directly) with THIS IMAGE's own util-linux + e2fsprogs
# against a hostPath bind of /var/lib/embervm (so the .img lands on the host
# disk). It ships NO losetup: loop-device setup belongs on the host, which owns
# the loop module. The `mount -o loop` (and `mountpoint`/`mkdir`/`grep`/`echo`
# for fstab) run via nsenter into host PID1, so the HOST attaches the loop device
# with its own losetup and mounts it where the kubelet's hostPath resolution sees
# it, surviving the pod. The host needs only `mount` (guaranteed present); it does
# NOT need e2fsprogs, since formatting already happened in the container.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "embervm.scratchPrep.fullname" . }}
  labels:
    {{- include "embervm.scratchPrep.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "embervm.scratchPrep.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "embervm.scratchPrep.labels" . | nindent 8 }}
    spec:
      hostPID: true
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      # Same FC-node selector as noded (homelab.io/firecracker=true): scratch-prep
      # only needs to run where noded needs the logical path satisfied.
      nodeSelector:
        {{- toYaml .Values.noded.nodeSelector | nindent 8 }}
      {{- with .Values.noded.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scratch-prep
          image: "{{ .Values.scratchPrep.image.repository }}@{{ .Values.scratchPrep.image.digest }}"
          imagePullPolicy: {{ .Values.scratchPrep.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SCRATCH_SIZE_GI
              value: {{ .Values.scratchSizeGi | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              SCRATCH=/var/lib/embervm/scratch
              # Backing file for the loop-mounted cap. Lives on the host disk via
              # the /host hostPath bind (see volumes), NOT inside scratch itself.
              IMG=/host/scratch.img
              SIZE_GI="${SCRATCH_SIZE_GI:?scratchSizeGi unset}"

              # THE GUARD. A bind mount (node-4's dedicated-NVMe fstab bind) and a
              # loop mount both register as mountpoints, so this is true whenever
              # scratch is already backed by a real mount. If so, do NOTHING: this
              # is what protects node-4's live scratch from ever being touched.
              if nsenter -t 1 -m -- mountpoint -q "$SCRATCH"; then
                echo "scratch-prep: $SCRATCH already mounted on $NODE_NAME, skipping cap (node with a real/bind mount, e.g. node-4, is left untouched)"
                exec sleep infinity
              fi

              # Not a mountpoint: provision the uniform size-capped loop scratch.
              # Every step is guarded so a re-run (or a restarted pod) is a no-op.
              nsenter -t 1 -m -- mkdir -p "$SCRATCH"

              # 1) Backing file. Create it ONLY if absent, so a re-run never
              #    fallocates over (and thus never truncates) an existing image.
              if [ ! -f "$IMG" ]; then
                echo "scratch-prep: creating + formatting ${SIZE_GI}Gi backing file at $IMG on $NODE_NAME"
                fallocate -l "${SIZE_GI}G" "$IMG"
                # mkfs.ext4 formats the REGULAR FILE directly (no loop device
                # needed in-container), so this image ships no losetup. Only on
                # first creation, so a re-run never reformats a data-bearing image.
                mkfs.ext4 -q -F "$IMG"
              fi

              # 2) Mount in the HOST mount namespace so the kubelet's hostPath
              #    resolution sees it. `-o loop` makes the HOST attach the loop
              #    device using its own losetup + loop module: this image ships no
              #    losetup, and a privileged container cannot reliably modprobe loop,
              #    so loop setup belongs on the host. Guarded by the mountpoint
              #    check; the earlier guard already proved it is unmounted, this only
              #    guards a mid-script re-entry.
              if ! nsenter -t 1 -m -- mountpoint -q "$SCRATCH"; then
                nsenter -t 1 -m -- mount -o loop "$IMG" "$SCRATCH"
              fi

              # 3) Persist across reboots. The fstab entry is keyed on the backing
              #    FILE with the loop option, so the host re-derives the loop device
              #    on boot. Idempotent: appended only if absent.
              FSTAB_LINE="$IMG $SCRATCH ext4 loop,defaults 0 0"
              if ! nsenter -t 1 -m -- grep -qF "$FSTAB_LINE" /etc/fstab 2>/dev/null; then
                nsenter -t 1 -m -- sh -c "echo '$FSTAB_LINE' >> /etc/fstab"
              fi

              echo "scratch-prep: ${SIZE_GI}Gi capped loop scratch mounted at $SCRATCH on $NODE_NAME"
              exec sleep infinity
          # Readiness IS the contract's liveness signal: only Ready once scratch is
          # a mountpoint in the host namespace (whether this DaemonSet's loop cap or
          # node-4's pre-existing bind), so `kubectl get daemonset` on this chart
          # tells an operator whether every FC node's scratch contract is satisfied
          # without reading logs.
          readinessProbe:
            exec:
              command:
                - nsenter
                - -t
                - "1"
                - -m
                - --
                - mountpoint
                - -q
                - /var/lib/embervm/scratch
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            # Host bind of the embervm state dir so the container's own fallocate/
            # mkfs write the backing .img onto the HOST disk (not the pod's
            # ephemeral rootfs). scratch.img lands beside the scratch mountpoint.
            - name: host-embervm
              mountPath: /host
      volumes:
        - name: host-embervm
          hostPath:
            path: /var/lib/embervm
            type: DirectoryOrCreate
{{- end }}
