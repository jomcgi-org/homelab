{{- if and .Values.servingEnvoy.enabled .Values.servingEnvoy.edge.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "embervm.servingEdge.fullname" . }}-bootstrap
  labels:
    {{- include "embervm.servingEdge.labels" . | nindent 4 }}
data:
  # Cluster edge bootstrap. Routes and the global serve|<workload> EDS
  # assignments arrive from the second xDS snapshot. Node Envoys receive their
  # own node-local EDS assignments under separate xDS node ids.
  envoy-bootstrap.yaml: |
    node:
      id: {{ .Values.servingEnvoy.edge.nodeId | quote }}
      cluster: {{ include "embervm.servingEdge.fullname" . }}
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{ .Values.servingEnvoy.edge.adminPort }}
    dynamic_resources:
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
          - envoy_grpc:
              cluster_name: xds_cluster
      cds_config:
        resource_api_version: V3
        ads: {}
    static_resources:
      clusters:
        # Admin remains loopback-only. The static probe listener below exposes
        # only /ready and a direct /live response to the kubelet.
        - name: admin_loopback
          type: STATIC
          connect_timeout: 0.25s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: admin_loopback
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: {{ .Values.servingEnvoy.edge.adminPort }}
        - name: xds_cluster
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options:
                  connection_keepalive:
                    interval: 30s
                    timeout: 5s
          load_assignment:
            cluster_name: xds_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "embervm.fullname" . }}.{{ .Release.Namespace }}.svc
                          port_value: {{ .Values.xds.grpcPort }}
      listeners:
        # This listener is independent of ADS. /live establishes process health;
        # /ready proxies Envoy's initialization state without exposing the rest
        # of the loopback admin API.
        - name: serving_edge_probe_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.servingEnvoy.edge.healthPort }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: serving_edge_probe
                    codec_type: AUTO
                    route_config:
                      name: serving_edge_probe
                      virtual_hosts:
                        - name: probe
                          domains: ["*"]
                          routes:
                            - match:
                                path: /live
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "live\n"
                            - match:
                                path: /ready
                              route:
                                cluster: admin_loopback
                            - match:
                                prefix: /
                              direct_response:
                                status: 403
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: serving_edge_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.servingEnvoy.listenerPort }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: serving_edge_ingress
                    codec_type: AUTO
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    rds:
                      config_source:
                        resource_api_version: V3
                        ads: {}
                        # A cold edge must not finish Envoy initialization until
                        # it has a usable route table. Zero disables the timeout,
                        # so /ready stays false until the first RDS response.
                        # Once ACKed, Envoy retains that route table across ADS
                        # loss and remains ready.
                        initial_fetch_timeout: 0s
                      route_config_name: embervm-serving
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
{{- end }}
