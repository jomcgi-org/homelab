{{- if and .Values.servingEnvoy.enabled .Values.servingEnvoy.edge.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "embervm.servingEdge.fullname" . }}-bootstrap
  labels:
    {{- include "embervm.servingEdge.labels" . | nindent 4 }}
data:
  # Cluster edge bootstrap. Routes and serve|<workload> clusters arrive from
  # the second xDS snapshot. Those clusters resolve the stable node-tier Service,
  # so VM endpoint churn remains exclusively in the node Envoys' snapshots.
  envoy-bootstrap.yaml: |
    node:
      id: {{ .Values.servingEnvoy.edge.nodeId | quote }}
      cluster: {{ include "embervm.servingEdge.fullname" . }}
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{ .Values.servingEnvoy.edge.adminPort }}
    dynamic_resources:
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
          - envoy_grpc:
              cluster_name: xds_cluster
      cds_config:
        resource_api_version: V3
        ads: {}
    static_resources:
      clusters:
        - name: xds_cluster
          type: STRICT_DNS
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options:
                  connection_keepalive:
                    interval: 30s
                    timeout: 5s
          load_assignment:
            cluster_name: xds_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "embervm.fullname" . }}.{{ .Release.Namespace }}.svc
                          port_value: {{ .Values.xds.grpcPort }}
      listeners:
        - name: serving_edge_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.servingEnvoy.listenerPort }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: serving_edge_ingress
                    codec_type: AUTO
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    rds:
                      config_source:
                        resource_api_version: V3
                        ads: {}
                        # Bind during a control-plane outage with an empty route
                        # table on a fresh pod. Existing pods retain last-ACKed RDS.
                        initial_fetch_timeout: 5s
                      route_config_name: embervm-serving
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
{{- end }}
