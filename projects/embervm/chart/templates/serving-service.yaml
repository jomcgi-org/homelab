{{- if .Values.servingEnvoy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "embervm.serving.fullname" . }}
  labels:
    {{- include "embervm.servingEnvoy.labels" . | nindent 4 }}
spec:
  # The stable per-node serving address the edge Envoy Gateway routes to. v1 runs
  # one serving node, so a ClusterIP fanning to the single DaemonSet pod suffices.
  # Multi-node serving (a ClusterIP would fan to a random node's Envoy, which only
  # knows its own node's VM taps) needs node-affinity routing at the edge; deferred
  # with the multi-node serving work, same seam.
  type: ClusterIP
  selector:
    {{- include "embervm.servingEnvoy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.servingEnvoy.listenerPort }}
      targetPort: http
    # The stats port (R3, Task 9): the control-plane idle-signal sweep GETs
    # /stats?format=json here to read per-cluster upstream_rq_total. Only /stats
    # and /ready are served (the stats_listener route-restricts to the loopback
    # admin); every other path 403s, so this is a read-only counters window.
    - name: stats
      port: {{ .Values.servingEnvoy.statsPort }}
      targetPort: stats
    # The R4 stateful TCP port range: one Service port per port in the values-
    # declared range, each forwarding to the matching state-<port> container port
    # on the node Envoy. A cluster pod connects to <serving-service>:<listenPort>
    # and the node Envoy's dynamic tcp_proxy listener routes to the workload's VM
    # (or the TCP activator on a miss). ClusterIP only, no edge exposure.
    {{- $r := .Values.servingEnvoy.statefulTcpPortRange }}
    {{- range $p := untilStep (int $r.start) (int (add (int $r.end) 1)) 1 }}
    - name: state-{{ $p }}
      port: {{ $p }}
      targetPort: state-{{ $p }}
    {{- end }}
    # The R5 composite-group entry TCP port range: one Service port per port in the
    # values-declared range, each forwarding to the matching group-<port> container
    # port on the node Envoy. A cluster pod connects to <serving-service>:<listenPort>
    # and the node Envoy's dynamic tcp_proxy listener routes to the group's entry VM
    # (or the composite activator on a miss). ClusterIP only, no edge exposure.
    {{- $gr := .Values.servingEnvoy.compositeTcpPortRange }}
    {{- range $p := untilStep (int $gr.start) (int (add (int $gr.end) 1)) 1 }}
    - name: group-{{ $p }}
      port: {{ $p }}
      targetPort: group-{{ $p }}
    {{- end }}
{{- end }}
