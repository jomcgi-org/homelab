{{- /*
  The SQLite op-log PVC. Suppressed when the Postgres tier is on: the durable
  store is then network-reachable, so a node-pinned RWO volume would be dead
  weight. Rolling back is a values flip, but note it comes up with an EMPTY
  op-log, because the SQLite file is not migrated in either direction.
*/ -}}
{{- if and .Values.opLog.persistentVolume (not .Values.opLog.postgres.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "embervm.fullname" . }}-oplog
  labels:
    {{- include "embervm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.opLog.storageClass }}
  resources:
    requests:
      storage: {{ .Values.opLog.size }}
{{- end }}
