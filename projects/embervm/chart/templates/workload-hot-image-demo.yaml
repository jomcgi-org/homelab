{{- if .Values.hotImageDemo.enabled }}
# The hot-image-demo workload (EmberVM R3, D-R3.11.5): the shared image renderer run
# WARM as a SERVING-class zip workload over its tap NIC, publicly at
# jomcgi.dev/functions/hot-image-demo. Its cold sibling is the task-class FaaS demo
# `cold-image-demo` (jomcgi.dev/functions/cold-image-demo), which stays the instant
# rollback. Same renderer, cold-start vs warm serving.
#
# Source is the SAME zip identity the cold-image-demo FaaS registration produces
# (runtime python312, handler app.handle, the deterministic sha256 of og_image/app.py).
# The
# control plane resolves `runtime: python312` to the runtime-python base, layers the
# zip at BuildBase, and bakes the handler-imported state into the base snapshot
# (ADR embervm/002), so a serving cold boot needs no runtime hydrate. On the serving
# cold boot the python shim binds TCP on spec.serving.port (EMBER_SERVING_PORT via
# the ember.serving_port= boot-arg) instead of vsock (D-R3.11.1), so /shim/healthz
# is reachable over the tap for the daemon's health probe.
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: {{ .Values.hotImageDemo.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Apply after the CRD (wave 0) establishes, like the other workload CRs.
    argocd.argoproj.io/sync-wave: "1"
spec:
  class: serving
  source:
    zip:
      runtime: {{ .Values.hotImageDemo.runtime | quote }}
      codeUri: {{ .Values.hotImageDemo.codeUri | quote }}
      sha256: {{ .Values.hotImageDemo.sha256 | quote }}
      handler: {{ .Values.hotImageDemo.handler | quote }}
      invokePath: {{ .Values.hotImageDemo.invokePath | quote }}
      readyPath: {{ .Values.hotImageDemo.readyPath | quote }}
  resources:
    vcpus: {{ .Values.hotImageDemo.vcpus }}
    memMib: {{ .Values.hotImageDemo.memMib }}
  concurrency:
    # For the serving class, cap is an alias for spec.serving.maxInstances and MUST
    # equal it (the watcher rejects a mismatch); floor is unused by serving.
    cap: {{ .Values.hotImageDemo.serving.maxInstances }}
  serving:
    port: {{ .Values.hotImageDemo.serving.port }}
    healthPath: {{ .Values.hotImageDemo.serving.healthPath | quote }}
    host: {{ .Values.hotImageDemo.serving.host | quote }}
    minInstances: {{ .Values.hotImageDemo.serving.minInstances }}
    maxInstances: {{ .Values.hotImageDemo.serving.maxInstances }}
    idleBankSeconds: {{ .Values.hotImageDemo.serving.idleBankSeconds }}
    drainSeconds: {{ .Values.hotImageDemo.serving.drainSeconds }}
    maxLifetimeSeconds: {{ .Values.hotImageDemo.serving.maxLifetimeSeconds }}
    # Node-local activator (ADR embervm/018 Fork A): the brick cold-boots this
    # scaled-to-zero demo's first request so it survives a control-plane Recreate;
    # meteringFailOpen names the wake-unmetered-during-gap policy for this blessed demo.
    nodeLocalWake: {{ .Values.hotImageDemo.serving.nodeLocalWake }}
    meteringFailOpen: {{ .Values.hotImageDemo.serving.meteringFailOpen }}
{{- end }}
