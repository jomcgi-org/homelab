{{- if .Values.conformance.enabled }}
{{- if eq .Release.Namespace "embervm" }}
{{- fail "conformance runner is dev-only and must not be enabled in the embervm production namespace" }}
{{- end }}
{{- $s6 := .Values.conformance.s6 | default dict }}
{{- $tlc := $s6.tlc | default dict }}
{{- $codex := .Values.conformance.codex | default dict }}
{{- if and (hasKey $codex "enabled") (not (kindIs "bool" $codex.enabled)) }}
{{- fail "conformance.codex.enabled must be a boolean" }}
{{- end }}
{{- if $codex.enabled }}
{{- $claude := .Values.claudeRuntimeWorkload }}
{{- if not .Values.rootfsBuilder.stampImageDigest }}
{{- fail "conformance.codex requires rootfsBuilder.stampImageDigest=true" }}
{{- end }}
{{- if not (and .Values.tokenBroker.enabled .Values.tokenBroker.spiffe.enabled .Values.tokenBroker.loginAuth.required .Values.tokenBroker.plaintext.retireProtectedRoutes) }}
{{- fail "conformance.codex requires an enabled SPIFFE token broker, strict loginAuth and plaintext retirement" }}
{{- end }}
{{- if not (and .Values.egress.enabled .Values.egress.ca.enabled .Values.egress.tokenBroker.spiffe.enabled (has $codex.workload .Values.egress.workloads)) }}
{{- fail "conformance.codex requires its workload in the authenticated SPIFFE egress lane" }}
{{- end }}
{{- if not (and $claude.enabled $claude.persistenceEnabled (eq $codex.workload $claude.name)) }}
{{- fail "conformance.codex requires the matching native persistent Claude workload" }}
{{- end }}
{{- if or (ne (int $claude.memMib) 4096) (ne (int $claude.cap) 1) (ne (int $claude.session.maxSessions) 1) (ne (int $claude.session.invokeQueueCap) 1) }}
{{- fail "conformance.codex requires a 4096 MiB workload with cap, maxSessions and invokeQueueCap all equal to 1" }}
{{- end }}
{{- if or (le (int $claude.session.idleBankSeconds) 0) (gt (int $claude.session.idleBankSeconds) 30) (le (int $claude.session.maxLifetimeSeconds) 0) (gt (int $claude.session.maxLifetimeSeconds) 600) (le (int $claude.session.bankedTtlSeconds) 0) (gt (int $claude.session.bankedTtlSeconds) 120) (le (int $claude.invocation.timeoutSeconds) 0) (gt (int $claude.invocation.timeoutSeconds) 180) }}
{{- fail "conformance.codex requires bounded session idle (1..30s), lifetime (1..600s), parked TTL (1..120s) and invocation (1..180s)" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" (.Values.runtimeClaude.guestImage.digest | default "")) }}
{{- fail "conformance.codex requires the chart-published Claude guest sha256 digest" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "embervm.conformance.fullname" . }}
  labels:
    {{- include "embervm.conformance.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "embervm.conformance.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Note: Prometheus scraping is aspirational today; no scraper targets this pod yet.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
      labels:
        {{- include "embervm.conformance.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "embervm.conformance.fullname" . }}
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      containers:
        - name: conformance
          image: "{{ .Values.conformance.image.repository }}:{{ .Values.conformance.image.tag }}@{{ .Values.conformance.image.digest }}"
          imagePullPolicy: {{ .Values.conformance.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: EMBERVM_URL, value: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "embervm.fullname" .) .Release.Namespace .Values.service.port | quote }} }
            - { name: EMBERVM_TOKEN_FILE, value: /var/run/secrets/kubernetes.io/serviceaccount/token }
            - { name: CHART_VERSION, value: {{ .Chart.Version | quote }} }
            - { name: LISTEN_ADDR, value: ":8080" }
            - { name: RUN_INTERVAL, value: {{ .Values.conformance.runInterval | quote }} }
            - { name: READY_WAIT, value: {{ .Values.conformance.readyWait | quote }} }
            - { name: S1_CLONE_HOLD, value: {{ .Values.conformance.cloneHold | quote }} }
            - { name: S1_CLONE_STARTUP_HEADROOM, value: {{ .Values.conformance.cloneStartupHeadroom | quote }} }
            - { name: TASK_WORKLOAD, value: {{ .Values.conformance.taskWorkload | quote }} }
            - { name: SESSION_WORKLOAD, value: {{ .Values.conformance.sessionWorkload | quote }} }
            - { name: ELIXIR_WORKLOAD, value: {{ .Values.conformance.elixirWorkload | quote }} }
            - { name: IDLE_BANK_SECONDS, value: {{ .Values.conformance.idleBankSeconds | quote }} }
            - { name: SWEEP_GRACE_SECONDS, value: {{ .Values.conformance.sweepGraceSeconds | quote }} }
            - { name: MIN_PASSING_INVARIANTS, value: {{ .Values.conformance.minPassingInvariants | quote }} }
            - { name: S1_BUDGET, value: {{ .Values.conformance.budgets.s1 | quote }} }
            - { name: S2_BUDGET, value: {{ .Values.conformance.budgets.s2 | quote }} }
            - { name: S3_BUDGET, value: {{ .Values.conformance.budgets.s3 | quote }} }
            - { name: S4_BUDGET, value: {{ .Values.conformance.budgets.s4 | quote }} }
            - { name: S5_BUDGET, value: {{ .Values.conformance.budgets.s5 | quote }} }
            - { name: S6_ENABLED, value: {{ .Values.conformance.s6.enabled | quote }} }
            - { name: S6_BUDGET, value: {{ .Values.conformance.budgets.s6 | quote }} }
            - { name: S6_MIN_TRACE_EVENTS, value: {{ .Values.conformance.s6.minTraceEvents | quote }} }
            # S7 jailer and admission facts and S8 jailed egress probe (#5255).
            # Both read "true" only; anything else leaves the scenario out.
            - { name: S7_REQUIRE_JAILER, value: {{ .Values.conformance.requireJailer | quote }} }
            - { name: S7_BUDGET, value: {{ .Values.conformance.budgets.s7 | quote }} }
            - { name: S8_EGRESS_PROBE, value: {{ .Values.conformance.egressProbe | quote }} }
            - { name: S8_BUDGET, value: {{ .Values.conformance.budgets.s8 | quote }} }
            {{- if $codex.enabled }}
            # S9 retains success or two failures per runner process/chart. A
            # restart resets that in-memory attempt limit. No provider token
            # reaches the runner: create uses its SA, invoke uses its session.
            - { name: S9_CODEX_PROBE, value: "true" }
            - { name: S9_CODEX_WORKLOAD, value: {{ $codex.workload | quote }} }
            - { name: S9_CODEX_MODEL, value: {{ required "conformance.codex.model is required" $codex.model | quote }} }
            - { name: S9_CODEX_PROVIDER_MODEL, value: {{ required "conformance.codex.providerModel is required" $codex.providerModel | quote }} }
            # This is the candidate image identity from helm_chart(images=).
            # The probe reads the actual guest stamp and CLI version itself.
            - { name: S9_CODEX_GUEST_DIGEST, value: {{ .Values.runtimeClaude.guestImage.digest | quote }} }
            - { name: S9_CODEX_CLI_VERSION, value: {{ required "conformance.codex.cliVersion is required" $codex.cliVersion | quote }} }
            - { name: S9_BUDGET, value: {{ .Values.conformance.budgets.s9 | quote }} }
            {{- end }}
            {{- if $s6.enabled }}
            # The TLC toolchain the image ships under /opt/tla (conformance BUILD
            # :tla_tar_amd64). Only rendered with S6 on, so the S1..S5 pod is
            # unchanged while S6 is staged off.
            - { name: S6_TLC_JAVA, value: {{ $tlc.java | default "/opt/tla/jre/bin/java" | quote }} }
            - { name: S6_TLC_JAR, value: {{ $tlc.jar | default "/opt/tla/tla2tools.jar" | quote }} }
            - { name: S6_TLC_SPEC_DIR, value: {{ $tlc.specDir | default "/opt/tla/specs" | quote }} }
            {{- with $tlc.javaToolOptions }}
            - { name: JAVA_TOOL_OPTIONS, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
          resources:
            {{- if $s6.enabled }}
            {{- toYaml (required "conformance.s6.resources is required when conformance.s6.enabled is true" $s6.resources) | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.conformance.resources | nindent 12 }}
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 30 }
          {{- if $s6.enabled }}
          # The root filesystem stays read-only. The runner stages each TLC run
          # under os.MkdirTemp (TLC's states/ dir lands there too) and TLC
          # extracts its standard modules into java.io.tmpdir, both /tmp.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          {{- end }}
      {{- if $s6.enabled }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: {{ $s6.tmpSizeLimit | default "64Mi" | quote }} }
      {{- end }}
{{- end }}
