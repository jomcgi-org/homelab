{{- if .Values.servingEnvoy.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "embervm.servingEnvoy.fullname" . }}
  labels:
    {{- include "embervm.servingEnvoy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "embervm.servingEnvoy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "embervm.servingEnvoy.labels" . | nindent 8 }}
      annotations:
        # Roll the DaemonSet pods when the bootstrap changes: the bootstrap is
        # static (listener + ADS wiring), so a change must restart Envoy to take
        # effect (dynamic config arrives over ADS, but the bootstrap does not).
        checksum/bootstrap: {{ include (print $.Template.BasePath "/serving-envoy-configmap.yaml") . | sha256sum }}
        # Expose the node Envoy's per-cluster stats for Prometheus discovery.
        # The path is the
        # admin's native Prometheus exposition (/stats/prometheus), reached through
        # the path-restricted stats listener (its `prefix: /stats` route covers it),
        # so upstream_rq_time histograms + upstream_rq_total are scrapable off-box
        # WITHOUT exposing /quitquitquit or /config_dump. The hit-path latency story
        # is these Envoy histograms, not an ember span (standing decision 1).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.servingEnvoy.statsPort | quote }}
        prometheus.io/path: "/stats/prometheus"
    spec:
      # POD networking (DNAT-through-noded, D-R3.11.4): serving-VM tap IPs live on the
      # node-local serving bridge (embervm-serv0, 172.31.0.0/24) inside noded's OWN pod
      # netns, so neither a pod-network nor a hostNetwork Envoy can route to the taps
      # directly (the bridge is in neither the pod nor the host netns). Instead noded
      # exposes each live serving VM as noded_pod_ip:vmPort via a per-VM prerouting DNAT
      # rule to the tap, and the control plane publishes THAT endpoint over xDS. Pod IPs
      # are cluster-routable, so this Envoy dials noded's pod IP over the normal pod
      # network and the kernel forwards to the VM. Two debugging edges: (1) after a noded
      # pod recreate the pod IP changes and there is a brief stale-endpoint window until
      # the control-plane reconcile sweep drops the old endpoints and the activator
      # fallback covers wakes; (2) an in-pod `curl noded_pod_ip:vmPort` from INSIDE noded
      # is NOT DNAT'd (the rule is prerouting-only, no output hook), so verify from a
      # DIFFERENT pod (e.g. the Envoy pod), not from noded itself. If a default-deny
      # NetworkPolicy/Cilium policy ever lands on noded, the serving DNAT port range
      # (EMBERVM_NODED_SERVING_PORT_BASE + 2..254) must be allowed.
      {{- with .Values.servingEnvoy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.servingEnvoy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.servingEnvoy.priorityClassName }}
      priorityClassName: {{ .Values.servingEnvoy.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: envoy
          image: "{{ .Values.servingEnvoy.image.repository }}:{{ .Values.servingEnvoy.image.tag }}"
          imagePullPolicy: {{ .Values.servingEnvoy.image.pullPolicy }}
          # node id = the k8s node name (downward API). --service-node overrides the
          # bootstrap node.id so the xds sidecar keys this node's snapshot by name.
          command:
            - /usr/local/bin/envoy
          args:
            - --config-path
            - /etc/envoy/envoy-bootstrap.yaml
            - --service-node
            - $(NODE_NAME)
            - --service-cluster
            - {{ include "embervm.servingEnvoy.fullname" . }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: {{ .Values.servingEnvoy.listenerPort }}
            # Stats port for the Prometheus scrape. Envoy exposes Prometheus stats
            # through the path-restricted stats listener (its `prefix: /stats` route
            # covers /stats/prometheus), and the pod annotations point the scraper at
            # this port, so admin stays loopback-only. Named for discovery; no
            # containerPort duplication with admin
            # (admin is loopback-only and not a pod port).
            - name: stats
              containerPort: {{ .Values.servingEnvoy.statsPort }}
            # The R4 stateful TCP port range: one container port per port in the
            # values-declared range, so a dynamic LDS tcp_proxy listener the control
            # plane publishes on any of them is reachable through the pod. Named
            # state-<port> for discovery; the serving Service exposes the same range.
            {{- $r := .Values.servingEnvoy.statefulTcpPortRange }}
            {{- range $p := untilStep (int $r.start) (int (add (int $r.end) 1)) 1 }}
            - name: state-{{ $p }}
              containerPort: {{ $p }}
            {{- end }}
            # The R5 composite-group entry TCP port range: one container port per port
            # in the values-declared range, so a dynamic LDS tcp_proxy listener the
            # control plane publishes for a composite group on any of them is reachable
            # through the pod. Named group-<port> for discovery; the serving Service
            # exposes the same range. Mirrors the stateful range above.
            {{- $gr := .Values.servingEnvoy.compositeTcpPortRange }}
            {{- range $p := untilStep (int $gr.start) (int (add (int $gr.end) 1)) 1 }}
            - name: group-{{ $p }}
              containerPort: {{ $p }}
            {{- end }}
          readinessProbe:
            # Probe the data listener, not the admin /ready. Admin binds loopback
            # (127.0.0.1) for security, but a kubelet httpGet probe dials from the
            # kubelet's namespace, so host 127.0.0.1 hits the node's loopback, not
            # the pod's, and never reaches Envoy's admin. A tcpSocket probe on the
            # main listener (0.0.0.0) is reachable at the pod IP and confirms Envoy
            # is up and accepting connections, with no admin exposure or curl dep.
            tcpSocket:
              port: {{ .Values.servingEnvoy.listenerPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.servingEnvoy.listenerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.servingEnvoy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/envoy
              readOnly: true
            # Envoy writes runtime scratch (e.g. the default runtime layer) under a
            # writable dir; the rootfs is read-only, so /tmp is an emptyDir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: {{ include "embervm.servingEnvoy.fullname" . }}-bootstrap
        - name: tmp
          emptyDir: {}
{{- end }}
