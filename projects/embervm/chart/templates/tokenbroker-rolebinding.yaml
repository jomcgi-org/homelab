{{- if .Values.tokenBroker.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "embervm.tokenBroker.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "embervm.tokenBroker.fullname" . }} }
subjects:
  - kind: ServiceAccount
    name: {{ include "embervm.tokenBroker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
