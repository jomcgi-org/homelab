contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    # k3s is a single static binary that embeds containerd, runc, and the CNI
    # plugins, so the rootfs is deliberately thin. The extra tools below are the
    # ones k3s shells out to that it does NOT embed:
    # - iptables (nft mode): flannel host-gw + kube-proxy program the dataplane
    #   through iptables/nft; k3s prefers the nft backend, present in this pkg.
    - iptables
    # - conntrack-tools: kube-proxy reconciles conntrack entries on service
    #   changes; without it kube-proxy logs errors and stale flows persist.
    - conntrack-tools
    # - coreutils: k3s/containerd invoke a few GNU utilities (mount helpers,
    #   `nsenter` for CNI) beyond busybox's applets.
    - coreutils
    # - util-linux: mount/nsenter helpers containerd's snapshotter and the
    #   kubelet expect on the host.
    - util-linux
    # - e2fsprogs: mkfs.ext4 for the stateful lane's writable volume (guest-init
    #   formats a blank volume ext4 and mounts it at k3s's data dir, mirroring
    #   scratch-postgres). k3s boots on the STATEFUL lane (the exact precedent for
    #   a full non-shim image with a tap-NIC TCP health-gate + mmds_env seam).
    - e2fsprogs
    # - blkid: the mkfs-if-blank probe (guest-init detects an existing filesystem
    #   signature before formatting, so a populated volume is never reformatted).
    #   e2fsprogs does NOT ship blkid; it lives in this dedicated Wolfi package.
    - blkid

archs:
  - x86_64

# k3s (containerd, CNI, iptables, cgroup mounts, kubelet) requires ROOT inside
# the guest. This deviates from the repo's uid 65532 non-root convention, and it
# is DELIBERATE and documented (see README.md): the microVM boundary is the
# isolation statement (task-class posture), not an in-guest uid. A raw Firecracker
# boot ignores this run-as anyway (it boots init=<harnessInit>); it is here for
# any non-FC (docker/crane) path and to state the posture explicitly.
accounts:
  run-as: 0

environment:
  HOME: /root
  KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  PATH: /usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

paths:
  # k3s's data dir AND the stateful lane's volume mount point. The rootfs is
  # read-only and snapshot-shared, so this directory MUST exist in the image
  # (the volume mounts over it via the unix.Mount syscall, and mkdir on a
  # read-only rootfs fails). The guest-init mkfs-if-blank + mounts the writable
  # volume here (scratch-postgres precedent), then stages the baked airgap
  # tarball from /opt/k3s-airgap into agent/images so k3s imports it at startup.
  # The airgap is baked OUTSIDE this tree (at /opt/k3s-airgap, via the
  # k3s_archive layer) precisely so the volume mount does not hide it.
  - path: /var/lib/rancher/k3s
    type: directory
    uid: 0
    gid: 0
    permissions: 0o700
  - path: /etc/rancher/k3s
    type: directory
    uid: 0
    gid: 0
    permissions: 0o700
  # Warmth-only composite members have NO volume and a read-only rootfs, so k3s +
  # its embedded kubelet/CNI need these as tmpfs mounts too (guest-init
  # mountCompositeDataDir). A tmpfs mount needs its mountpoint to pre-exist on the
  # read-only rootfs, so bake them empty here (the stateful/base-build lanes never
  # mount over them, so they stay harmless empty dirs there). The k3s read-only-root
  # contract's writable set is data-dir + /etc/rancher + these two + /run + /var/log.
  - path: /var/lib/kubelet
    type: directory
    uid: 0
    gid: 0
    permissions: 0o700
  - path: /var/lib/cni
    type: directory
    uid: 0
    gid: 0
    permissions: 0o700
  - path: /run
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/log
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755

entrypoint:
  # OCI entrypoint for any NON-Firecracker path (docker/crane). On a raw
  # Firecracker boot the kernel ignores this and boots init=<harnessInit>; there
  # PID 1 is /usr/local/bin/ember-k3s-init (layered by ../../BUILD), which mounts
  # k3s's filesystems, decodes the EMBER_GROUP_* facts, starts the vsock clock
  # agent, and supervises `k3s server`. Both paths converge on the same init.
  command: /usr/local/bin/ember-k3s-init
