# THROWAWAY drill CR for the R5 Task 3 single-VM k3s spike. NOT a production
# deploy: it is applied by hand for the drill and removed after (it lives here,
# under the runtime, NOT in the deployed chart under projects/embervm/deploy/).
#
# It boots ONE k3s-server guest on the STATEFUL lane. The stateful lane is the
# exact precedent (scratch-postgres) for booting a FULL non-shim image: it
# cold-boots the runtime rootfs with NO drive-2 handler artifact, attaches a
# writable volume, and health-gates a TCP connect to the guest port over the tap
# NIC. This is why the drill uses `class: stateful` and NOT `class: serving`: the
# serving lane expects a base-built handler-ARTIFACT shape (drive 2, zip lane),
# which a full k3s image is not, and it has no env-injection seam. (See the
# runbook for the full lane rationale.)
#
# The spike is FACTLESS: a bare k3s server that boots with NO injected env. The
# guest-init defaults to the server role when EMBER_GROUP_ROLE is unset, and k3s
# auto-generates its own cluster token when EMBER_GROUP_SECRET is unset, which is
# correct for a single-server cluster with no peers to join it. Multi-node fact
# injection (roles, the peer map, a shared secret) is a MULTI-NODE concern
# exercised later via Task 5's StartGroupMember FRESH env seam, and is
# deliberately OUT OF SPIKE SCOPE. There is therefore NO secretRef here.
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: k3s-spike
  namespace: embervm
spec:
  class: stateful
  source:
    image:
      # The k3s-server image built by this PR. noded base-builds it (the guest
      # answers the frozen vsock /shim/ready contract on GuestHTTPPort so the base
      # snapshot completes and the image becomes cold-bootable), then cold-boots
      # it on the stateful lane. Pin the CI-built digest for a reproducible drill.
      ref: ghcr.io/jomcgi/homelab/projects/embervm/runtimes/k3s/k3s-server:latest
      # The frozen guest-contract readiness surface the BASE BUILD gates on (the
      # guest-init answers GET /shim/ready 200 on this vsock port for the base
      # snapshot). Distinct from the RUNTIME health, which is a TCP connect to the
      # k3s API over the tap NIC (stateful.port below).
      port: 1027
      readyPath: /shim/ready
      invokePath: /invoke
  resources:
    # Provisional; the spike RECORDS the real floor (the airgap import at first
    # boot sets the high-water mark, fc-base sizing coupling). Start generous so
    # the drill is not the thing that OOMs; trim from the measured floor.
    vcpus: 2
    memMib: 2048
  stateful:
    # The k3s API port the guest serves over the tap NIC. Runtime health is a TCP
    # connect here (opaque L4, no health path). Server API = 6443.
    port: 6443
    # The node Envoy TCP listener port for cluster-internal reach. Must fall
    # inside the chart's stateful range (default 5400-5409) and be unique. Pick a
    # free port in that range for the throwaway drill (5409 here); if it collides
    # with a live stateful workload, choose another free port in the range.
    listenPort: 5409
    # Sparse cap of the raw volume file, in GiB. k3s state (sqlite datastore,
    # kubelet, containerd) lives on this volume, mounted at the data dir below.
    volumeSizeGiB: 10
    # The volume mounts at k3s's data dir. guest-init mkfs-if-blank + mounts it,
    # then stages the baked airgap tarball (from /opt/k3s-airgap) into
    # <mount>/agent/images so k3s imports it (the airgap is baked OUTSIDE this
    # tree so the mount does not hide it).
    volumeMountPath: /var/lib/rancher/k3s
    # Bank after 10 minutes idle. The spike does not exercise bank/relight (that
    # is Task 5+); a generous idle keeps the instance up for the drill.
    idleBankSeconds: 600
    maxLifetimeSeconds: 604800
    bankedTtlSeconds: 2592000
    # Wake deadline: generous, because a cold boot includes k3s bring-up AND the
    # first-boot airgap image import (the memory + time high-water mark).
    wakeTimeoutSeconds: 180
  # NO secretRef: the factless single-server spike needs no injected facts (k3s
  # auto-tokens). A multi-node group (Task 5+) injects EMBER_GROUP_ROLE /
  # EMBER_GROUP_SECRET / EMBER_PEER_* via the group lane's FRESH env seam, not
  # here.
