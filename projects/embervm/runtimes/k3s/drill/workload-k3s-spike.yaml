# THROWAWAY drill CR for the R5 Task 3 single-VM k3s spike. NOT a production
# deploy: it is applied by hand for the drill and removed after (it lives here,
# under the runtime, NOT in the deployed chart under projects/embervm/deploy/).
#
# It boots ONE k3s-server guest as a serving-class workload so noded cold-boots
# it through the existing R3 serving lane (tap NIC + TCP health-gate), with NO
# composite/group machinery (which does not exist yet, plan Task 3 scope). This
# proves k3s reaches Ready inside a Firecracker guest on the kata kernel before
# any group code is written (the rung's riskiest unknown).
#
# The EMBER_GROUP_* facts a real composite member would receive from the platform
# are injected here BY HAND through the serving lane's mmds_env seam (spec.env),
# since there is no GroupManager to compose them. For a single-node server spike
# the peer map is empty (no agents) and the secret is a throwaway literal.
apiVersion: embervm.dev/v1alpha1
kind: Workload
metadata:
  name: k3s-spike
  namespace: embervm
spec:
  class: serving
  source:
    image:
      # The k3s-server image built by this PR. Pin to a digest for a real drill
      # (the CI-built tag), or :latest for a throwaway hand-drill; noded resolves
      # it via EMBERVM_NODED_IMAGES.
      ref: ghcr.io/jomcgi/homelab/projects/embervm/runtimes/k3s/k3s-server:latest
      # The serving lane's health/readiness surface. k3s serves the API on 6443
      # over the tap NIC; noded TCP-health-gates ip:6443. There is no vsock
      # /shim/ready contract in the k3s guest (it is opaque L4, like postgres),
      # so readyPath/invokePath are unused for this class of guest.
      port: 6443
      readyPath: /
      invokePath: /
  resources:
    # Provisional; the spike RECORDS the real floor (the airgap import at first
    # boot sets the high-water mark, fc-base sizing coupling). Start generous so
    # the drill is not the thing that OOMs; trim from the measured floor.
    vcpus: 2
    memMib: 2048
  concurrency:
    cap: 1
  serving:
    # The API port, reached over the tap NIC. noded health-gates this.
    port: 6443
    # Liveness probe path. k3s answers TLS on 6443; a plain TCP connect is the
    # health signal the serving lane uses (it connects, it does not HTTP-GET the
    # k3s API), so the path is nominal.
    healthPath: /
    host: k3s-spike.serve.jomcgi.dev
    # Keep one instance live for the drill (no scale-to-zero cold-start race).
    minInstances: 1
    maxInstances: 1
    idleBankSeconds: 600
    drainSeconds: 5
    maxLifetimeSeconds: 86400
  # The MMDS-lite facts, injected by hand for the spike (a real composite member
  # gets these from the GroupManager). Single-node server: no peers, throwaway
  # secret. These land in the guest env as EMBER_GROUP_ROLE etc. via the serving
  # lane's mmds_env boot-args.
  env:
    EMBER_GROUP_ROLE: server
    EMBER_GROUP_SECRET: spike-throwaway-token-do-not-reuse
    # EMBER_GROUP_IP is the member's own IP on the tap subnet; for the serving
    # lane the tap IP is assigned by noded, so leave it unset here and let k3s
    # bind 0.0.0.0 (the spike is a single node; --node-ip pinning matters under
    # the group lane, Task 4). If the drill needs it pinned, set it to the tap IP
    # noded reports for the instance.
