contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Wolfi's chromium package supplies the browser and its complete shared
    # library dependency closure. No extra loader packages are listed: this
    # browser is inside apko's graph, so its APK dependencies resolve every
    # DT_NEEDED library without a manual mirror of Chromium's Debian package
    # list.
    #
    # Deliberately NOT version-pinned. apko.lock.json is what pins a version,
    # and update-apko-locks.sh is what deliberately moves it; 121 of the 124
    # package entries across this repo's apko configs are unpinned for that
    # reason. Pinning here instead would freeze the one component that renders
    # pages, which is exactly the thing that should keep getting security
    # updates. An earlier draft pinned chromium and then had to pin libsndfile
    # to an older release to resolve a libFLAC.so.14 versus .12 conflict; both
    # pins disappeared once chromium was allowed to float, because the solver
    # picks a consistent set on its own.
    - chromium
    # Fonts are explicit even though fontconfig may arrive transitively. These
    # packages make text rasterization deterministic across rebuilt snapshots.
    - libfontconfig1
    - freetype
    - ttf-dejavu
    # Chromium carries SwiftShader, ANGLE, and Vulkan itself. Do not add a
    # system mesa, libGL, or libEGL stack unless a named loader error proves one
    # is required.

# The cluster and the guest-init binary are amd64 only. Keeping the apko config
# x86_64-only is also required for the lock to omit aarch64 APK fetches.
archs:
  - x86_64

accounts:
  groups:
    - groupname: shotter
      gid: 65532
  users:
    - username: shotter
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /home/shotter
  PATH: /usr/local/bin:/usr/bin:/bin

paths:
  - path: /home/shotter
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  # A raw Firecracker boot ignores the OCI entrypoint and starts this binary as
  # PID 1 through init=<harnessInit>. PID 1 mounts guest filesystems, then starts
  # Chromium itself as uid 65532 before it exposes readiness.
  command: /usr/local/bin/ember-shotter-init
