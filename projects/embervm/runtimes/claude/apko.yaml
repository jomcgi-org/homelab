# EmberVM claude runtime base image (issue #4055): a session-class guest that
# runs the Claude Code CLI under a shim speaking the frozen HTTP-over-vsock
# guest contract on port 1027.
#
# AMD64-ONLY, deliberately. The Claude Code CLI ships as a single 262 MB
# arch-specific ELF (glibc, /lib64/ld-linux-x86-64.so.2, GLIBC_2.2.5 baseline),
# fetched per arch from the npm registry. Every cluster node is amd64 (node-1/2/3
# Intel Alder Lake-S, node-4 AMD Zen4) and so is the RBE build executor, so a
# dual-arch manifest would fetch a second 262 MB payload that no node can run.
# This mirrors the control-plane image's reasoning in ../../image/apko.yaml. If an
# arm64 node ever joins, add arm64_url/arm64_sha256 to the claude_code_cli entry
# in MODULE.bazel and the aarch64 arch here together.
#
# The CLI is dynamically linked, so glibc is pinned explicitly rather than left to
# arrive transitively: a base that happens to pull it today would break the guest
# silently if that transitive edge ever changed.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - glibc
    # The Bash tool shells out to bash specifically, not /bin/sh. busybox alone
    # gives an ash-flavoured sh and the tool's commands assume bash.
    - bash
    # Per-turn commits onto the session branch are how agent-diff produces an
    # exact diffstat (git show <sha> --stat) with no model involvement.
    - git
    # Persistent workspaces are probed and formatted by guest-init on first boot.
    - e2fsprogs
    - blkid
    # The shim is stdlib python, matching the runtimes/python pattern.
    - python-3.12

archs:
  - x86_64

accounts:
  groups:
    - groupname: runtime
      gid: 65532
  users:
    - username: runtime
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  # Claude Code writes its config and session transcripts under $HOME
  # (~/.claude.json, ~/.claude/projects/<dir>/<session-id>.jsonl), so HOME must
  # be a real writable path owned by uid 65532. The rootfs is read-only on every
  # boot, so this path is a BIND MOUNT that guest-init lays over the image's
  # directory, sourced from /session (see the paths block below).
  HOME: /home/runtime
  PYTHONUNBUFFERED: "1"
  # Guests are driven headlessly over vsock. No TTY is attached, so anything that
  # would try to render a terminal UI must not be reached.
  TERM: dumb
  # The workspace the shim hydrates into and runs the agent against. The trust
  # record baked at /home/runtime/.claude.json must name this exact path.
  EMBER_CLAUDE_WORKSPACE: /workspace
  # Egress auth (ADR 023 6b). The CLI talks to the API in CLEARTEXT, on purpose:
  # its only route out is the shim's forwarder over a host-local vsock, which has
  # no network segment on it, so guest-side TLS would encrypt against an attacker
  # who cannot be positioned there. The egress-proxy sidecar reads the plaintext
  # request, swaps the placeholder below for the real token, and originates the
  # real TLS to api.anthropic.com:443 itself.
  #
  # This redirects the CLI's API client only. It still reaches api.anthropic.com
  # over https:// for telemetry and profile calls; those blind-tunnel past the
  # swap carrying the inert placeholder and are refused at the destination, which
  # does not affect a turn.
  ANTHROPIC_BASE_URL: http://api.anthropic.com
  # An INERT stand-in for the subscription OAuth token, and deliberately nothing
  # like a real credential in shape: the CLI does no local format validation, so
  # there is no reason to commit a string that reads as an sk-ant- secret to every
  # scanner that sees this repo. The sidecar substring-matches this exact value in
  # request headers, so it must stay in lockstep with egress.secrets[].placeholder
  # in the embervm chart values. Long and distinctive so it cannot collide with
  # anything else in a request.
  CLAUDE_CODE_OAUTH_TOKEN: ember-egress-anthropic-oauth-placeholder-0f3a9c1d7b5e2846-not-a-credential

paths:
  - path: /home/runtime
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/runtime/.claude
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /workspace
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Mount point for the guest's ONE writable filesystem: a per-session disk once
  # noded attaches one (#4091), a tmpfs until then. guest-init mounts it here and
  # bind-mounts its `workspace` and `home` subdirectories onto /workspace and
  # /home/runtime. It MUST exist in the image: the rootfs is read-only on every
  # boot, so an init that tried to mkdir its own mount point would fail with the
  # same EROFS that this whole arrangement exists to avoid.
  - path: /session
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755

entrypoint:
  # OCI entrypoint for any NON-Firecracker execution path (docker/crane). On a raw
  # Firecracker boot the kernel ignores this and boots init=<HarnessInit>; both
  # paths end at the same shim.
  command: /usr/bin/python3 /usr/local/bin/ember-claude-shim
