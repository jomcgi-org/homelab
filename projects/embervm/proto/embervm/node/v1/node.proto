// Package embervm.node.v1 is the narrow gRPC contract between the EmberVM
// control plane and a node daemon (embervm-noded). It is the clean seam the
// noded fork is shaped by: the daemon owns Firecracker lifecycle behind these
// RPCs, and NOTHING Firecracker-specific leaks across it (no jailer paths, no
// snapshot file paths, no reverse-proxy or session-path semantics inherited
// from the fc-invoke HTTP surface). Refs are opaque strings the control plane
// stores and echoes back; only the daemon interprets them.
//
// The lifecycle this contract expresses, mapped from the forked fc-invoke node
// layer (substrate/node/invoker):
//
//   BuildBase   pull OCI image -> bake rootfs -> cold boot -> health-gate on the
//               guest ready path -> snapshot. Idempotent per (image digest,
//               workload revision). The heavy, once-per-image operation.
//   Prime       restore a pristine VM from a base snapshot, wait ready, park it
//               idle on vsock. The pool-refill primitive; the control plane owns
//               the pool, so this replaces fc-invoke's daemon-side warm base.
//   Assign      deliver exactly one HTTP-semantics task to a primed VM over
//               vsock, return the guest response plus usage stats, then DESTROY
//               the VM regardless of outcome (task-class VMs are single-use, one
//               assignment, no reuse across principals, vsock only / no NIC).
//   Destroy     reap a primed or wedged VM out of band.
//   WatchNode   server-streamed capacity heartbeat; the daemon is the health
//               authority and this is the control plane's only source of node
//               truth.
//   GetNodeStatus  unary snapshot of the same facts, for polling fallback and
//               startup reconciliation.
//
// Concurrency is owned by the control plane, NOT the daemon: the per-workload
// semaphore of fc-invoke is deliberately dropped on the fork. The daemon
// enforces only a node-level max-live-VM cap as a backstop and reports capacity
// facts; the control plane decides what to Prime and Assign.
//
// Auth v1: mTLS is out of scope. The daemon listens on the pod network, gated
// by Linkerd/Cilium policy plus a static bearer token from a Kubernetes Secret,
// carried in gRPC call metadata (key "authorization: Bearer <token>"). The
// upgrade path to mTLS or SPIFFE identities is additive: a new credential field
// on the metadata, not a wire-breaking change to these messages.

syntax = "proto3";

package embervm.node.v1;

option go_package = "github.com/jomcgi/homelab/projects/embervm/proto/embervm/node/v1;nodev1";

// NodeService is the entire control-to-node surface. One control plane fans out
// to N node daemons (v1: exactly one, from values); the service is identical
// per node so multi-node needs no contract change.
service NodeService {
  // BuildBase turns an OCI image into a pristine base snapshot: pull, bake
  // rootfs, cold boot, health-gate on the guest ready path, snapshot. Heavy
  // (boot + health-gate + snapshot write); the control plane serializes these
  // per node. Idempotent per (image_digest, workload_revision): a repeat call
  // for an already-built base returns the existing snapshot_ref without
  // rebuilding. FAILED_PRECONDITION if the image cannot be pulled or the guest
  // never health-gates; the base is not published on failure.
  rpc BuildBase(BuildBaseRequest) returns (BuildBaseResponse);

  // Prime restores one pristine VM from snapshot_ref, waits for the guest ready
  // path, and parks it idle on vsock. This is the pool-refill primitive the
  // control plane calls to keep `floor` VMs warm per workload. Returns a vm_id
  // naming the parked VM. RESOURCE_EXHAUSTED if the node-level live-VM backstop
  // cap is hit; FAILED_PRECONDITION if snapshot_ref is unknown or unrestorable
  // (a lost snapshot degrades to slower boots at the control plane, never to
  // incorrect behavior).
  rpc Prime(PrimeRequest) returns (PrimeResponse);

  // Assign delivers exactly one HTTP-semantics task (method, path, headers,
  // body; body capped at 8 MiB) to a primed vm_id over vsock and returns the
  // guest's HTTP response plus usage stats. The daemon DESTROYS the VM after
  // response delivery regardless of outcome: task-class VMs are single-use.
  // Assign on an already-assigned or destroyed vm_id MUST fail with
  // FAILED_PRECONDITION and no side effects (the VM is not touched, no second
  // task runs). DEADLINE_EXCEEDED maps a guest that did not respond within the
  // task timeout; the VM is still destroyed.
  rpc Assign(AssignRequest) returns (AssignResponse);

  // Destroy reaps a primed or wedged VM out of band (pool shrink, base
  // turnover, drain). Idempotent: destroying an unknown or already-destroyed
  // vm_id returns OK (the desired end-state already holds).
  rpc Destroy(DestroyRequest) returns (DestroyResponse);

  // WatchNode is a server-streamed heartbeat of capacity facts. The daemon is
  // the health authority; the control plane consumes this as its only source of
  // node truth and ages the facts out (unknown after 5s, down after 15s) if the
  // stream drops. The daemon sends an initial NodeStatus immediately on
  // subscribe, then on every material change and at a liveness interval.
  rpc WatchNode(WatchNodeRequest) returns (stream NodeStatus);

  // GetNodeStatus is a unary snapshot of the same facts WatchNode streams, for
  // polling fallback (if streaming over the mesh proves flaky) and for control-
  // plane startup reconciliation (existing base snapshots + parked VMs are
  // reported so the control plane reconciles rather than rebuilding).
  rpc GetNodeStatus(GetNodeStatusRequest) returns (NodeStatus);

  // -- Session verbs (R2) ----------------------------------------------------
  //
  // These four verbs are the stateful-session lifecycle vocabulary, ADDITIVE to
  // the task-class contract above (Assign, Prime, Destroy are byte-for-byte
  // unchanged). A session is a long-lived logical sandbox whose in-VM state
  // survives across invocations: SessionAssign delivers a request WITHOUT
  // destroying the VM (the opposite of Assign's destroy tail); Bank pauses and
  // snapshots the VM to node disk and destroys it; Relight restores a VM from a
  // session snapshot; EvictSnapshot reclaims the snapshot's disk. Refs stay
  // opaque strings exactly as elsewhere: no snapshot file path, no Firecracker
  // concept crosses this seam. Session VMs count against max_live_vms like any
  // other live VM. Concurrency (one in-flight invoke per session; caps across
  // sessions) is owned by the control plane, not the daemon; the daemon's
  // per-vm guard is only a backstop.

  // SessionAssign delivers exactly one HTTP-semantics request (same GuestRequest
  // message, same 8 MiB body cap) to a LIVE session vm_id over vsock and returns
  // the guest response plus usage stats. Unlike Assign, the VM SURVIVES: this is
  // the deliver-without-destroy verb sessions are built on. FAILED_PRECONDITION
  // on an unknown vm_id, a task-class vm_id (single-use, not a session), or a
  // vm_id in the middle of a Bank. DEADLINE_EXCEEDED on a guest timeout leaves
  // the VM alive but flagged suspect in the response (suspect=true); the control
  // plane decides whether to destroy it, because a session guest in an unknown
  // mid-request state must not silently accrete more state.
  rpc SessionAssign(SessionAssignRequest) returns (SessionAssignResponse);

  // Bank pauses a live session VM, writes a full snapshot (memory image + rootfs
  // delta, the same self-contained bundle format bases use), destroys the VM,
  // and returns the opaque snapshot_ref plus its size. It is how an idle session
  // releases live capacity while retaining state on disk. FAILED_PRECONDITION if
  // a SessionAssign is in flight on that vm_id (the control plane serializes
  // anyway; this is the daemon backstop), or if the vm_id is unknown or
  // task-class. The snapshot_ref is a fact the control plane records and later
  // passes to Relight or EvictSnapshot.
  rpc Bank(BankRequest) returns (BankResponse);

  // Relight restores a VM from a session snapshot_ref (the deliver-without-
  // destroy counterpart of Prime for sessions), waits for guest readiness (the
  // same vsockhttp WaitReady mechanics as Prime), and returns a fresh vm_id.
  // FAILED_PRECONDITION if the ref is unknown or unrestorable. On a failed
  // restore the snapshot is NEVER deleted (a lost session must surface loudly,
  // not silently relight as a blank VM): the control plane decides whether to
  // retry or fail the session.
  rpc Relight(RelightRequest) returns (RelightResponse);

  // EvictSnapshot deletes a session snapshot bundle from node disk to reclaim
  // capacity. Idempotent: an unknown ref returns OK (the desired end-state, gone,
  // already holds). Refuses (FAILED_PRECONDITION) while a live VM was relit from
  // that ref and still runs. This is the ADR embervm/003 eviction verb landed
  // early, shaped so base eviction later reuses it unchanged.
  rpc EvictSnapshot(EvictSnapshotRequest) returns (EvictSnapshotResponse);

  // -- Serving verbs (R3) -----------------------------------------------------
  //
  // These two verbs are the serving-class lifecycle vocabulary, ADDITIVE to the
  // task and session contracts above (every existing RPC and message is
  // byte-for-byte unchanged). A serving VM is a long-lived microVM that answers
  // many HTTP requests directly over a tap NIC, unlike task and session VMs which
  // are vsock-only and carry no NIC (ADR embervm/001: the daemon creates the tap,
  // reports the endpoint, and is thenceforth uninvolved). Serving snapshots reuse
  // EvictSnapshot (R2) unchanged: a serving snapshot ref is evicted exactly like
  // a session snapshot ref, just stored under the serving/ prefix. Refs stay
  // opaque strings exactly as elsewhere: no file path, no netlink or tap-naming
  // detail, no IP-allocation mechanism crosses this seam. Serving VMs count
  // against max_live_vms like any other live VM, and are EXCLUDED from
  // WorkloadCapacity.primed_vm_ids (a serving VM is never in the task pool,
  // mirroring the session-VM exclusion above).
  //
  // Health probing: the daemon probes `GET {health_path}` on each live serving
  // VM's tap IP every probe_interval (a daemon flag, default 5s), flips healthy
  // false after unhealthy_threshold consecutive probe failures (default 3) and
  // back to true after exactly one success. This is a FACT the daemon reports in
  // NodeStatus.serving_vms; the control plane consumes it and decides what to do
  // (unpublish, rebank, alert). The daemon itself never acts on the health
  // verdict: it does not destroy, restart, or otherwise touch a VM because it
  // became unhealthy. Nothing Envoy-specific (no xDS, no cluster, no endpoint
  // concept) is known to the daemon; it reports only the raw {ip, port, healthy}
  // fact and the control plane owns everything downstream of that.

  // StartServing brings up a serving VM, either fresh from a pristine base ref
  // or relit from a serving snapshot ref (exactly one of StartServingRequest's
  // source fields is set), attaches a tap NIC with an IP drawn from the node's
  // serving subnet, and waits for guest HTTP readiness on {port, health_path}
  // probed OVER THE TAP (not vsock, unlike Prime/Relight's vsock wait-ready).
  // Returns {vm_id, ip, port} once ready. FAILED_PRECONDITION on an unknown or
  // unrestorable ref. A readiness timeout DESTROYS the VM and returns the error:
  // there is no half-alive endpoint state a caller could observe or publish.
  // The tap IP MAY differ across relights of the same workload (IP assignment is
  // daemon-internal, never guest-visible or guest-persisted), so a caller must
  // treat every StartServing response as the current, authoritative endpoint.
  rpc StartServing(StartServingRequest) returns (StartServingResponse);

  // StopServing tears down a live serving VM. mode = BANK pauses the VM, writes
  // a full snapshot to the sessions-style bundle dir under a serving/ prefix,
  // destroys the VM, and returns {snapshot_ref, size_bytes}, exactly like Bank's
  // mechanics for session VMs. mode = DESTROY tears the VM down with no snapshot
  // (the DESTROY-mode counterpart of the task-class Destroy verb). BANK refuses
  // with FAILED_PRECONDITION if a bank of the same vm_id is already in flight
  // (the daemon backstop; the control plane is expected to serialize this on its
  // own too, exactly as with session Bank). StopServing does not itself drain
  // any edge or proxy: the daemon does not know such a thing exists, and
  // ordering a drain before the bank call is entirely the control plane's job.
  rpc StopServing(StopServingRequest) returns (StopServingResponse);

  // -- Stateful verbs (R4) ----------------------------------------------------
  //
  // These three verbs are the stateful-class lifecycle vocabulary, ADDITIVE to
  // the task, session, and serving contracts above (every existing RPC and
  // message is byte-for-byte unchanged). A stateful VM is a long-lived, SINGLETON
  // microVM that owns exactly one WRITABLE block device (the workload's volume, a
  // raw file on node NVMe) and answers OPAQUE L4 TCP on a tap NIC, unlike serving
  // VMs which answer HTTP. It is the ADR embervm/001 state split made real: the
  // volume owns the durable data, the memory snapshot only pre-pays cache warmth.
  //
  // The generation pairing is the load-bearing invariant. The daemon owns a
  // per-workload on-disk generation ledger; EVERY writable attach (fresh, cold,
  // relight) bumps it BEFORE the VM boots. A bank stamps the then-current
  // generation into the bundle. StartStateful(RELIGHT) resumes the bundle ONLY
  // when its stamped generation equals the volume's current generation; on any
  // mismatch or an unreadable ledger the bundle is EVICTED and the daemon falls
  // back to a cold boot from the volume (slower, never incorrect), reporting the
  // reason. Warmth fails open (cold boot); data fails closed (a missing volume is
  // FAILED_PRECONDITION, never silently recreated). The generation is metadata
  // only: nothing here ever rewrites volume bytes outside the guest.
  //
  // Singleton by construction: the daemon refuses a second WRITABLE attach of the
  // same volume with FAILED_PRECONDITION. There is no maxInstances knob; exactly
  // one live VM per stateful workload, enforced where the data physically lives.
  //
  // The host NEVER mounts the volume. noded creates, sizes, attaches, and deletes
  // the raw file; guest-init detects a blank device, runs mkfs, and mounts it at
  // the declared path. A compromised daemon can destroy the bytes but gains no
  // parsing surface over guest data (the ADR embervm/001 stateful isolation row).
  //
  // Health probing: the daemon probes TCP CONNECT (not HTTP GET, unlike serving)
  // to each live stateful VM's {ip, port} on the existing probe cadence and
  // thresholds, and reports healthy in NodeStatus.stateful_vms. As with serving,
  // the daemon never acts on the verdict; the control plane owns everything
  // downstream. Stateful VMs count against max_live_vms and are EXCLUDED from
  // every WorkloadCapacity.primed_vm_ids (never in the task pool), exactly like
  // session and serving VMs. Nothing Envoy-specific crosses this seam.

  // StartStateful brings up the stateful VM with the workload's volume attached
  // writable, attaching a tap NIC exactly as StartServing does, and health-gates
  // by TCP CONNECT to {ip, port}. mode selects the boot path:
  //   FRESH   cold-boot the image rootfs; create the volume sparse at
  //           volume_size_bytes if absent (FAILED_PRECONDITION if absent and
  //           create_if_missing is false).
  //   RELIGHT resume the banked bundle (relight_snapshot_ref) iff its stamped
  //           generation equals the volume's current generation; on mismatch or
  //           an unreadable ledger, EVICT the bundle and fall back to a cold boot
  //           from the volume, setting cold_boot_reason.
  //   COLD    explicit cold boot from the existing volume (no bundle resume).
  // Every mode bumps the generation BEFORE boot, so any attach the snapshot did
  // not witness breaks the pair. A readiness timeout DESTROYS the VM and returns
  // the error (no half-alive endpoint). Refuses FAILED_PRECONDITION on a second
  // writable attach of a volume already attached (singleton enforcement).
  rpc StartStateful(StartStatefulRequest) returns (StartStatefulResponse);

  // StopStateful tears down a live stateful VM. mode = BANK PAUSES the VM (VCPUs
  // stopped, the volume crash-consistent at the pause point), writes a full
  // snapshot to the bundle dir under a stateful/ prefix STAMPED with the volume's
  // current generation, destroys the VM, EVICTS any prior bundle for the workload
  // (one banked bundle per workload), and returns {snapshot_ref, generation,
  // size_bytes}. mode = DESTROY kills the VM with no snapshot; the next cold boot
  // runs the database's own WAL recovery (the volume-owns-durability contract),
  // so v1 attempts no guest-cooperative shutdown. BANK refuses FAILED_PRECONDITION
  // if a stop of the same vm_id is already in flight. The volume file is never
  // copied, hashed, or touched at bank time: the generation ledger is the entire
  // pairing mechanism.
  rpc StopStateful(StopStatefulRequest) returns (StopStatefulResponse);

  // DeleteVolume removes a workload's volume file and its generation ledger. It
  // is the ONLY destructive data verb, and it exists so deletion is an explicit,
  // audited act (a CR deletion never reaches it; data outlives definitions).
  // FAILED_PRECONDITION while the volume is attached to a live VM. Idempotent on
  // an already-absent volume (the desired end-state, gone, already holds).
  // Stateful bundles reuse EvictSnapshot (R2) unchanged; bundle refs are opaque.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);

  // -- Group verbs (R5) -------------------------------------------------------
  //
  // These verbs are the composite-workload vocabulary, ADDITIVE to the task,
  // session, serving, and stateful contracts above (every existing RPC and
  // message is byte-for-byte unchanged). A group is a set of member VMs pinned
  // to deterministic addresses on a private per-group bridge, the physical
  // substrate a composite workload (many cooperating members addressing each
  // other by stable name/IP) needs. The physical primitives are all on the node:
  // a bridge, N pinned-address members attached to it, and a bundle SET (the
  // per-member banked snapshots that resume the group as a unit). The daemon owns
  // these primitives behind the verbs; NOTHING about what the members ARE crosses
  // this seam. The contract is GENERIC group networking: the daemon knows a
  // bridge, a CIDR, member names, indices, and addresses, and nothing about the
  // application shape wired on top of it. Refs stay opaque strings exactly as
  // elsewhere: no bridge device name detail, no snapshot file path, no netlink or
  // nftables rule text crosses this seam beyond the reported facts.
  //
  // Membership is the control plane's, not the daemon's: the daemon never decides
  // which members belong to a set. set_id (StopGroupMember) is caller-supplied and
  // OPAQUE; the daemon groups the per-member snapshot refs it produces by the set
  // directory it is told to write under, and reports them grouped, but the
  // completeness judgment (is this set whole enough to relight) stays entirely in
  // the control plane. Group member VMs count against max_live_vms like any other
  // live VM, and are EXCLUDED from every WorkloadCapacity.primed_vm_ids (a member
  // VM is never in the task pool), exactly like session, serving, and stateful VMs.
  //
  // Group bundles reuse EvictSnapshot (R2) unchanged: each per-member snapshot ref
  // is evicted exactly like a session snapshot ref (the control plane evicts a set
  // by evicting each of its member refs). The daemon offers no set-level eviction
  // verb; set membership is the control plane's fact.
  //
  // Guest control agent contract (Task 3 implements it; stated here as the spec):
  // a member guest runs a control agent listening on a dedicated vsock port
  // (GROUP_GUEST_AGENT_VSOCK_PORT below) that speaks the D-R2.6.1 length-prefixed
  // JSON frame convention (a 4-byte big-endian length prefix, then that many bytes
  // of JSON). It answers exactly one request:
  //   request  {"cmd":"sync_clock","epoch_ns":<int>}   host wall-clock at resume
  //   response {"clock_realtime_ns":<int>}             guest CLOCK_REALTIME after
  //                                                     it has set its clock
  // On a RELIGHT resume, noded sends sync_clock with the current host epoch, the
  // guest sets its clock and reads CLOCK_REALTIME back, and noded VERIFIES the
  // read-back: it fails the StartGroupMember call (FAILED_PRECONDITION, a clock
  // delta detail) if abs(clock_realtime_ns - epoch_ns) > 1s (standing decision 7).
  // A resumed member with a clock more than one second off host time is a failed
  // resume, never a live member.

  // CreateGroupNetwork creates the private per-group bridge for
  // {group_instance_id, cidr} plus the inter-group nftables deny that isolates
  // this group's bridge from every other group's, and returns {bridge_name,
  // gateway_ip} (the bridge's own address on the CIDR, the members' default
  // gateway). Idempotent per group_instance_id: a repeat call for an
  // already-created network returns the existing {bridge_name, gateway_ip}
  // without recreating it. FAILED_PRECONDITION if the CIDR overlaps an existing
  // group bridge's CIDR (address space is the daemon's to keep disjoint; the
  // control plane must pick a non-overlapping range). The bridge and its deny
  // rules are daemon-internal; only the two reported facts cross the seam.
  rpc CreateGroupNetwork(CreateGroupNetworkRequest) returns (CreateGroupNetworkResponse);

  // DeleteGroupNetwork tears the group bridge and its nftables rules down,
  // reclaiming the CIDR. FAILED_PRECONDITION while any member VM is still
  // attached to the bridge (the control plane stops every member first; this is
  // the daemon backstop against tearing a live group's network out from under
  // it). Idempotent on an already-absent network (the desired end-state, gone,
  // already holds).
  rpc DeleteGroupNetwork(DeleteGroupNetworkRequest) returns (DeleteGroupNetworkResponse);

  // StartGroupMember boots or resumes exactly one member on its group bridge,
  // attaching a tap NIC pinned to the member's DETERMINISTIC name/MAC/IP (all
  // derived by the control plane from {group_instance_id, member_name,
  // member_index} and passed in; the daemon pins the tap to the given ip, it does
  // not allocate). mode selects the boot path:
  //   FRESH   cold-boot the member's image rootfs (source) with the pinned tap,
  //           deliver the env map via the MMDS-lite seam (FRESH-only, see below),
  //           and TCP-health-gate {ip, health_port} before returning ready.
  //   RELIGHT recreate the IDENTICAL tap world (same name/MAC/IP) and resume the
  //           member's banked bundle (snapshot_ref), then perform the guest
  //           control agent clock-resync handshake and FAIL the call if the
  //           verified read-back delta exceeds one second (standing decision 7).
  // Returns {vm_id, ip, was_relight}. FAILED_PRECONDITION on an unknown or
  // unrestorable snapshot_ref (RELIGHT), a missing source (FRESH), or a
  // clock-resync verification failure; on a failed RELIGHT the bundle is NEVER
  // deleted (a lost member must surface loudly, not silently relight blank).
  rpc StartGroupMember(StartGroupMemberRequest) returns (StartGroupMemberResponse);

  // StopGroupMember tears down one live member VM. mode = BANK PAUSES the VM,
  // writes a full snapshot under the caller-supplied set directory
  // (group/<set_id>/<member>/), destroys the VM, and returns {snapshot_ref,
  // size_bytes}. mode = DESTROY kills the VM with no snapshot. set_id is OPAQUE to
  // the daemon: it is only the directory the member's snapshot is written under so
  // the daemon can report member refs grouped by set; the daemon never decides
  // set membership. BANK refuses FAILED_PRECONDITION if a stop of the same vm_id
  // is already in flight (the daemon backstop; the control plane serializes too).
  rpc StopGroupMember(StopGroupMemberRequest) returns (StopGroupMemberResponse);
}

// Trace carries the cross-cutting identifiers every RPC threads for tracing and
// correlation. workload is the CR name the operation is for; task_id/
// correlation_id are opaque strings the control plane assigns (empty for pool
// operations with no task, e.g. Prime/BuildBase).
message Trace {
  string workload = 1;
  string task_id = 2;
  string correlation_id = 3;
}

// ResourceSpec is the VM resource shape, mirroring the Workload CR `resources`
// block (vcpus 1-8, memMib 128-16384). It sizes the base VM at BuildBase;
// mem_mib in particular sets the snapshot and restore footprint (see
// BuildBaseRequest.resources).
message ResourceSpec {
  uint32 vcpus = 1;
  uint32 mem_mib = 2;
}

// ---- BuildBase -------------------------------------------------------------

// ZipSource is the R1 "zip lane" base source: a runtime base image plus a zip
// archive (containing a `handler`) fetched and attached read-only to the build
// VM, where the runtime shim unpacks and imports it before the snapshot is
// taken. The unpacked, handler-imported state is baked into the base snapshot,
// so the archive is only needed at build time, never at restore. noded treats
// the archive as OPAQUE, sha256-verified bytes: it NEVER unpacks or inspects it
// (zip-slip/bomb surfaces stay inside the disposable guest the shim owns).
message ZipSource {
  // runtime_image_ref names the runtime base image (e.g. the python runtime) the
  // daemon resolves to a node-side rootfs, exactly like BuildBaseRequest.image_ref
  // for the image lane. The zip is layered on top of this runtime at build time.
  string runtime_image_ref = 1;
  // archive_url is where noded fetches the zip from over the pod network (the
  // in-cluster SeaweedFS S3/filer read path). The daemon HTTP GETs the bytes; the
  // control plane owns upload and URL minting.
  string archive_url = 2;
  // archive_sha256 is the hex-encoded SHA-256 of the archive bytes. noded verifies
  // the fetched bytes against it and FAILS the build (FAILED_PRECONDITION) on a
  // mismatch, so a corrupted or swapped archive can never be baked into a base.
  string archive_sha256 = 3;
}

message BuildBaseRequest {
  Trace trace = 1;
  // source selects how the base is built. The IMAGE lane (image_ref) bakes an OCI
  // image directly; the ZIP lane (zip) layers an adopter's zip archive onto a
  // runtime base image. Exactly one is set. The legacy top-level image_ref (field
  // 2) is the image lane's original, unwrapped form and is still honoured when the
  // oneof is unset, so this addition is wire-compatible.
  oneof source {
    ZipSource zip = 8;
  }
  // image_ref is the OCI reference to bake (digest-pinned or tag). The daemon
  // resolves a tag to a digest at build time; the digest comes back in the
  // response so the control plane records the resolved identity (deploys are
  // explicit, never tag drift). Set for the IMAGE lane (or left set as the
  // pre-oneof default); the ZIP lane leaves it empty and sets source.zip instead.
  string image_ref = 2;
  // workload_revision is the control plane's opaque revision token for this
  // workload's spec; together with the resolved image digest it forms the
  // idempotency key for the base build. For the ZIP lane the idempotency key is
  // (runtime image digest, archive sha256) instead (see server.baseKeyForZip).
  string workload_revision = 3;
  // Guest contract knobs (frozen contract): the port the guest HTTP server
  // listens on over vsock, and the path that answers 200 when ready.
  uint32 guest_port = 4;
  string ready_path = 5;
  // Resource shape of the base VM (vcpus, mem). memMib in particular sizes the
  // snapshot and the restore footprint.
  ResourceSpec resources = 6;
  // init_env are environment values baked into the guest at base-build time
  // (workload initEnv). Node-side image identity (rootfs path, harness init) is
  // daemon configuration, NOT carried here.
  map<string, string> init_env = 7;
  // serving marks a base whose workload is registered serving-class, so the
  // daemon additionally produces a cold-boot-readable HANDLER ARTIFACT for the
  // R3 serving lane (D-R3.11.2). A serving VM must COLD-BOOT with a NIC (FC
  // cannot hot-attach a NIC to a resumed snapshot, D-R3.4.2), so it cannot
  // consume the vsock-only base memory snapshot the zip lane bakes the handler
  // into (the handler lives in the tmpfs->memfile RAM, never on a block device).
  // When set on the ZIP lane, the daemon writes the verified archive bytes it
  // already holds to a per-base handler artifact and reports it as
  // WorkloadCapacity.serving_image_ref, which startServingFresh cold-boots from
  // as a second read-only drive. The base memory snapshot is STILL produced
  // (the task lane needs it if the workload is also task-class); skipping it for
  // serving-exclusive bases is a deferred disk optimization, not done here.
  // Ignored by the image lane. Task/session-only workloads leave it false and
  // their build path is byte-unchanged.
  bool serving = 9;
}

message BuildBaseResponse {
  // snapshot_ref is the OPAQUE handle the control plane stores in
  // Workload.status and passes back to Prime. It is NOT a file path.
  string snapshot_ref = 1;
  // Resolved base metadata, recorded in status for auditability.
  string image_digest = 2;
  uint64 base_size_bytes = 3;
  string arch = 4;
  // already_built is true when this call was a no-op hit on an existing base
  // for the same (image_digest, workload_revision) (idempotency observed).
  bool already_built = 5;
  // serving_image_ref is the cold-boot handler-artifact ref, set ONLY when the
  // request was serving (D-R3.11.2). It is DISTINCT from snapshot_ref: the
  // snapshot_ref is the vsock-only base memory snapshot (the task-lane restore
  // source), while serving_image_ref names the cold-boot-readable handler
  // artifact StartServing(fresh) consumes. The two are deliberately NOT the same
  // field; overloading snapshot_ref for both was the root of the serving
  // "not provisioned" bug. Empty for a non-serving build.
  string serving_image_ref = 6;
}

// ---- Prime -----------------------------------------------------------------

message PrimeRequest {
  Trace trace = 1;
  string snapshot_ref = 2;
}

message PrimeResponse {
  // vm_id names the parked, pristine VM. Opaque; the control plane holds it in
  // its primed-pool inventory and passes it to Assign or Destroy.
  string vm_id = 1;
}

// ---- Assign ----------------------------------------------------------------

// A task IS one HTTP request to the guest. For the task class method is always
// POST; path defaults to the workload invokePath and is overridable per task.
// Only headers the control plane forwards reach the guest (the submit API
// strips everything except the allow-listed X-Ember-Guest-* set before this).
message GuestRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  // body is the guest request body, forwarded verbatim. Capped at 8 MiB (the
  // submit API enforces the same cap); larger requests are rejected upstream.
  bytes body = 4;
}

message AssignRequest {
  Trace trace = 1;
  string vm_id = 2;
  GuestRequest request = 3;
  // timeout_ms bounds the guest round-trip. On expiry the daemon returns
  // DEADLINE_EXCEEDED and still destroys the VM.
  uint32 timeout_ms = 4;
}

// GuestResponse is the guest's HTTP response, captured whole (the daemon reads
// the body fully because the VM is destroyed immediately after; there is no
// lazy streaming across this boundary the way fc-invoke streams to its HTTP
// caller).
message GuestResponse {
  uint32 status_code = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

// UsageStats are the per-task resource facts sampled from the guest's host-side
// /proc counters before the VM is destroyed. These feed the control plane's
// metering (vCPU-seconds, GB-seconds) and the R0 latency budgets.
message UsageStats {
  int64 cpu_ms = 1;
  int64 peak_rss_mib = 2;
  int64 wall_ms = 3;
}

message AssignResponse {
  GuestResponse response = 1;
  UsageStats usage = 2;
}

// ---- Destroy ---------------------------------------------------------------

message DestroyRequest {
  Trace trace = 1;
  string vm_id = 2;
}

message DestroyResponse {}

// ---- Session verbs (R2) ----------------------------------------------------

// SessionAssignRequest is Assign's deliver-without-destroy sibling: same
// GuestRequest envelope and timeout semantics, but the vm_id names a LIVE
// session VM the daemon must leave running after the response. session_id is
// opaque to the daemon (it stores and echoes it in status so control-plane
// adoption can rebind a live VM to its session after a restart); the daemon
// derives no behavior from it.
message SessionAssignRequest {
  Trace trace = 1;
  string vm_id = 2;
  GuestRequest request = 3;
  // timeout_ms bounds the guest round-trip. On expiry the daemon returns
  // DEADLINE_EXCEEDED and leaves the VM ALIVE (unlike Assign), flagging it
  // suspect in the response so the control plane can decide to destroy it.
  uint32 timeout_ms = 4;
  // session_id is the control plane's opaque session identity, echoed in
  // NodeStatus.session_vms so a restarted control plane adopts rather than
  // orphans. The daemon never interprets it.
  string session_id = 5;
}

message SessionAssignResponse {
  GuestResponse response = 1;
  UsageStats usage = 2;
  // suspect is set true when the guest round-trip hit DEADLINE_EXCEEDED (or the
  // vsock transport otherwise faulted) but the VM was left alive; the control
  // plane reads it to decide whether to destroy the session VM. False on a
  // clean response.
  bool suspect = 3;
}

// BankRequest pauses, snapshots, and destroys a live session VM. session_id is
// carried (opaque to the daemon) so the produced snapshot's inventory entry can
// be tied back to its session for adoption.
message BankRequest {
  Trace trace = 1;
  string vm_id = 2;
  string session_id = 3;
}

message BankResponse {
  // snapshot_ref is the OPAQUE handle to the banked session snapshot bundle on
  // node disk. The control plane records it and later passes it to Relight or
  // EvictSnapshot. NOT a file path.
  string snapshot_ref = 1;
  uint64 size_bytes = 2;
}

// RelightRequest restores a VM from a session snapshot. session_id is opaque to
// the daemon, echoed in NodeStatus.session_vms for adoption once the VM is live.
message RelightRequest {
  Trace trace = 1;
  string snapshot_ref = 2;
  string session_id = 3;
}

message RelightResponse {
  // vm_id names the freshly restored, ready session VM. Opaque; the control
  // plane holds it and passes it to SessionAssign, Bank, or Destroy.
  string vm_id = 1;
}

// EvictSnapshotRequest deletes one session snapshot bundle from node disk.
message EvictSnapshotRequest {
  Trace trace = 1;
  string snapshot_ref = 2;
}

message EvictSnapshotResponse {}

// ---- Serving verbs (R3) -----------------------------------------------------

// FreshSource starts a serving VM COLD from the workload's cold-boot handler
// artifact (D-R3.11.2), the serving counterpart of Prime's restore. The oneof
// sibling of RelightSource in StartServingRequest.source.
message FreshSource {
  // serving_image_ref names the cold-boot handler artifact the daemon resolves
  // to a per-workload handler drive (attached read-only alongside the runtime
  // rootfs on the NIC cold boot). It is DELIBERATELY NOT called snapshot_ref: a
  // fresh serving start cold-boots a handler artifact, it does NOT resume the
  // base memory snapshot (a NIC cold boot cannot, D-R3.4.2). Overloading
  // snapshot_ref here (the field's original name) was the root of the serving
  // "not provisioned" bug, where the control plane passed the base-snapshot key
  // into a lookup against the runtime-rootfs image table. The daemon resolves
  // this against its serving-images inventory, not the static image table.
  string serving_image_ref = 1;
}

// RelightSource restarts a serving VM from a previously banked serving
// snapshot ref, the serving counterpart of Relight's restore. The tap IP is
// re-allocated on every relight and may differ from any prior allocation for
// the same workload; the response is always the current fact.
message RelightSource {
  string snapshot_ref = 1;
}

message StartServingRequest {
  Trace trace = 1;
  // source selects fresh-from-base or relight-from-serving-snapshot. Exactly
  // one is set.
  oneof source {
    FreshSource fresh = 2;
    RelightSource relight = 3;
  }
  // Guest contract knobs (frozen contract, same shape as BuildBaseRequest):
  // the port the guest HTTP server listens on over the tap, and the path that
  // answers 200 when ready and, subsequently, healthy.
  uint32 port = 4;
  string health_path = 5;
  // Resource shape of the serving VM (vcpus, mem), carried exactly as Prime's
  // implicit base-derived shape is for task VMs.
  ResourceSpec resources = 6;
}

message StartServingResponse {
  // vm_id names the live serving VM. Opaque; the control plane holds it and
  // passes it to StopServing.
  string vm_id = 1;
  // ip is the ROUTABLE endpoint address for this serving VM: noded's own pod IP
  // (D-R3.11.4), not the tap IP. The tap IP stays node-internal; noded exposes
  // each live serving VM as pod_ip:port via a per-VM prerouting DNAT rule, so a
  // pod-network Envoy on any node can dial it. Opaque to the control plane beyond
  // routing to it. Falls back to the node-internal tap IP when noded has no pod IP
  // configured (local/test).
  string ip = 2;
  // port is the per-VM DNAT port on ip (pod_ip:port -> tap_ip:guest_port in the
  // kernel), NOT the guest's own listen port. Derived deterministically from the
  // tap IP; opaque to the control plane, which only routes to ip:port.
  uint32 port = 3;
}

enum StopServingMode {
  STOP_SERVING_MODE_UNSPECIFIED = 0;
  STOP_SERVING_MODE_BANK = 1;
  STOP_SERVING_MODE_DESTROY = 2;
}

message StopServingRequest {
  Trace trace = 1;
  string vm_id = 2;
  StopServingMode mode = 3;
}

message StopServingResponse {
  // snapshot_ref and size_bytes are set only when mode was BANK; both are the
  // zero value for DESTROY.
  string snapshot_ref = 1;
  uint64 size_bytes = 2;
}

// ---- Stateful verbs (R4) ---------------------------------------------------

enum StartStatefulMode {
  START_STATEFUL_MODE_UNSPECIFIED = 0;
  START_STATEFUL_MODE_FRESH = 1;    // cold-boot the image rootfs, create volume if absent
  START_STATEFUL_MODE_RELIGHT = 2;  // resume the bundle iff the generation pair matches
  START_STATEFUL_MODE_COLD = 3;     // explicit cold boot from the existing volume
}

message StartStatefulRequest {
  Trace trace = 1;
  StartStatefulMode mode = 2;
  // boot_image_ref is the cold-boot source the daemon resolves to a bootable
  // rootfs, used for FRESH, COLD, and the RELIGHT fallback. Same role as serving
  // FreshSource.serving_image_ref: a NIC cold boot CANNOT resume the vsock-only
  // base memory snapshot (D-R3.4.2), so this is DELIBERATELY NOT snapshot_ref.
  // The daemon resolves it against its serving/stateful images inventory.
  string boot_image_ref = 3;
  // relight_snapshot_ref is the banked stateful bundle to resume, set for
  // RELIGHT (empty otherwise). On a generation mismatch or unreadable ledger the
  // daemon evicts it and cold-boots from boot_image_ref instead.
  string relight_snapshot_ref = 4;
  // Guest listen port; health is TCP CONNECT to {ip, port} (no ready_path: the
  // stateful contract is opaque L4, decision 4).
  uint32 port = 5;
  // Volume contract. volume_size_bytes is the sparse cap the daemon creates the
  // raw file at on FRESH (immutable per workload after creation). volume_mount is
  // the guest mount path (from the CR's volumeMountPath) the daemon threads into
  // the guest-init boot-args; the DEVICE path is daemon-internal and never
  // crosses this seam. create_if_missing gates FRESH's volume creation.
  uint64 volume_size_bytes = 6;
  string volume_mount = 7;
  bool create_if_missing = 8;
  // Resource shape of the stateful VM (vcpus, mem), carried exactly as serving.
  ResourceSpec resources = 9;
  // mmds_env are first-boot environment values delivered to the guest via the
  // MMDS seam (the secrets seam for first-boot DB credentials), exactly as
  // existing verbs deliver init env. The daemon never persists or interprets them.
  map<string, string> mmds_env = 10;
}

message StartStatefulResponse {
  // vm_id names the live stateful VM. Opaque; the control plane holds it and
  // passes it to StopStateful.
  string vm_id = 1;
  // ip/port are the ROUTABLE endpoint (noded pod IP + per-VM DNAT port, the
  // D-R3.11.4 lane), matching serving; the tap IP stays node-internal.
  string ip = 2;
  uint32 port = 3;
  // generation is the volume's current generation AFTER this attach's bump. The
  // control plane records it as the live instance's generation and compares it
  // to a bundle's stamped generation to decide pair validity.
  uint64 generation = 4;
  // was_relight is true when the call resumed a banked bundle (RELIGHT with a
  // matched pair); false for every cold boot including a RELIGHT that fell back.
  bool was_relight = 5;
  // cold_boot_reason is set ONLY when a RELIGHT fell back to a cold boot, naming
  // why the warmth was discarded: "generation_mismatch", "no_bundle",
  // "ledger_unreadable". Empty for a successful relight or an explicit FRESH/COLD
  // boot (an explicit cold boot is not a discarded relight, so it carries no
  // reason). The control plane records it verbatim into the op-log.
  string cold_boot_reason = 6;
}

enum StopStatefulMode {
  STOP_STATEFUL_MODE_UNSPECIFIED = 0;
  STOP_STATEFUL_MODE_BANK = 1;
  STOP_STATEFUL_MODE_DESTROY = 2;
}

message StopStatefulRequest {
  Trace trace = 1;
  string vm_id = 2;
  StopStatefulMode mode = 3;
}

message StopStatefulResponse {
  // snapshot_ref, generation, and size_bytes are set only when mode was BANK;
  // all are the zero value for DESTROY. generation is the volume generation
  // stamped into the bundle, the pair key a later RELIGHT checks.
  string snapshot_ref = 1;
  uint64 generation = 2;
  uint64 size_bytes = 3;
}

// DeleteVolumeRequest removes one workload's volume file and generation ledger.
// The volume is per-workload (one raw file), so workload identifies it; no ref
// or path crosses the seam.
message DeleteVolumeRequest {
  Trace trace = 1;
  string workload = 2;
}

message DeleteVolumeResponse {}

// ---- Group verbs (R5) ------------------------------------------------------

// GROUP_GUEST_AGENT_VSOCK_PORT is the dedicated vsock port a member guest's
// control agent listens on for the sync_clock handshake (see the StartGroupMember
// / group-verbs comment for the frame contract). It is a documented constant of
// the frozen guest contract, distinct from the guest HTTP port; the daemon dials
// it only on a RELIGHT resume.
enum GroupGuestAgent {
  GROUP_GUEST_AGENT_UNSPECIFIED = 0;
  GROUP_GUEST_AGENT_VSOCK_PORT = 1024;
}

// CreateGroupNetworkRequest asks the daemon to stand up the per-group bridge for
// group_instance_id on cidr. group_instance_id is the control plane's opaque
// per-group-instance identity, the idempotency key for the bridge; cidr is the
// address range the members' pinned IPs are drawn from (by the control plane, not
// the daemon).
message CreateGroupNetworkRequest {
  Trace trace = 1;
  string group_instance_id = 2;
  string cidr = 3;
}

message CreateGroupNetworkResponse {
  // bridge_name is the daemon-assigned name of the group bridge, reported as an
  // opaque fact (the control plane never manipulates it, only records it). Stable
  // across idempotent recreate calls for the same group_instance_id.
  string bridge_name = 1;
  // gateway_ip is the bridge's own address on the CIDR, the default gateway the
  // members route through. Deterministic for the CIDR; reported so the control
  // plane can compose member routes without knowing the daemon's allocation rule.
  string gateway_ip = 2;
}

// DeleteGroupNetworkRequest tears down the bridge for group_instance_id.
message DeleteGroupNetworkRequest {
  Trace trace = 1;
  string group_instance_id = 2;
}

message DeleteGroupNetworkResponse {}

enum StartGroupMemberMode {
  START_GROUP_MEMBER_MODE_UNSPECIFIED = 0;
  START_GROUP_MEMBER_MODE_FRESH = 1;    // cold-boot the image rootfs on the pinned tap
  START_GROUP_MEMBER_MODE_RELIGHT = 2;  // resume the bundle, then clock-resync verify
}

message StartGroupMemberRequest {
  Trace trace = 1;
  StartGroupMemberMode mode = 2;
  // group_instance_id names the group whose bridge this member attaches to (its
  // network must already exist via CreateGroupNetwork). member_name and
  // member_index are the control-plane-assigned member identity the daemon uses
  // to pin the tap deterministically (the tap name and MAC are derived from them);
  // ip is the control-plane-assigned pinned address on the group CIDR the tap is
  // configured with (the daemon pins to the given ip, it does not allocate).
  string group_instance_id = 3;
  string member_name = 4;
  uint32 member_index = 5;
  string ip = 6;
  // source is the FRESH cold-boot source the daemon resolves to a bootable rootfs
  // (same role as stateful boot_image_ref: a NIC cold boot cannot resume a
  // vsock-only base memory snapshot, D-R3.4.2). Set for FRESH; empty for RELIGHT.
  string source = 7;
  // snapshot_ref is the banked member bundle to resume, set for RELIGHT (empty
  // otherwise). Opaque; on a failed restore it is NEVER deleted (a lost member
  // must surface loudly).
  string snapshot_ref = 8;
  // health_port is the guest TCP port the daemon health-gates by CONNECT to
  // {ip, health_port} on FRESH before returning ready (opaque L4, matching the
  // stateful contract; there is no ready_path).
  uint32 health_port = 9;
  // Resource shape of the member VM (vcpus, mem), carried exactly as serving and
  // stateful.
  ResourceSpec resources = 10;
  // env are first-boot environment values delivered to the guest via the
  // MMDS-lite seam, exactly as StartStateful.mmds_env: the same secrets/first-boot
  // seam. It is FRESH-ONLY: a RELIGHT resume IGNORES this map and the resumed guest
  // keeps its BIRTH env (the env was baked into the memory image at first boot).
  // The platform-injected EMBER_GROUP_* keys are composed by the control plane,
  // not the daemon; the daemon delivers whatever map it is handed and interprets
  // none of it.
  map<string, string> env = 11;
}

message StartGroupMemberResponse {
  // vm_id names the live member VM. Opaque; the control plane holds it and passes
  // it to StopGroupMember.
  string vm_id = 1;
  // ip is the member's pinned address on the group bridge (the same ip the request
  // carried, echoed as the authoritative live fact).
  string ip = 2;
  // was_relight is true when the call resumed a banked bundle (a verified RELIGHT,
  // clock-resync within one second); false for a FRESH cold boot.
  bool was_relight = 3;
}

enum StopGroupMemberMode {
  STOP_GROUP_MEMBER_MODE_UNSPECIFIED = 0;
  STOP_GROUP_MEMBER_MODE_BANK = 1;
  STOP_GROUP_MEMBER_MODE_DESTROY = 2;
}

message StopGroupMemberRequest {
  Trace trace = 1;
  string vm_id = 2;
  StopGroupMemberMode mode = 3;
  // set_id is the caller-supplied OPAQUE set directory the member's BANK snapshot
  // is written under (group/<set_id>/<member>/). The daemon groups reported member
  // refs by it but never decides membership. member_name names the member subdir.
  string set_id = 4;
  string member_name = 5;
}

message StopGroupMemberResponse {
  // snapshot_ref and size_bytes are set only when mode was BANK; both are the zero
  // value for DESTROY. snapshot_ref is the opaque per-member bundle handle the
  // control plane records and later passes to EvictSnapshot (R2, reused unchanged).
  string snapshot_ref = 1;
  uint64 size_bytes = 2;
}

// ---- Node status -----------------------------------------------------------

message WatchNodeRequest {
  // node_id echoes the identity the control plane configured for this daemon
  // (from values). Purely for the control plane's own correlation; the daemon
  // does not authenticate on it.
  string node_id = 1;
}

message GetNodeStatusRequest {
  string node_id = 1;
}

// WorkloadCapacity is the daemon's per-workload capacity view: how many primed
// VMs are parked and ready, and what base build state the workload's snapshot
// is in. The control plane reads free_primed_slots from ETS-cached copies of
// this on the dispatch path (never from the durable store).
message WorkloadCapacity {
  string workload = 1;
  // free_primed_slots is the count of parked, pristine, unassigned VMs for this
  // workload on this node.
  uint32 free_primed_slots = 2;
  // snapshot_ref is the base this node currently has for the workload, empty if
  // none is built here (the control plane then knows to BuildBase). This is the
  // vsock-only base MEMORY SNAPSHOT (the task/session-lane restore source), NOT
  // the serving cold-boot source; see serving_image_ref below.
  string snapshot_ref = 3;
  BaseBuildState base_state = 4;
  // serving_image_ref is the cold-boot handler-artifact ref for the serving lane
  // (D-R3.11.2), reported when this node has built a serving base for the
  // workload. DISTINCT from snapshot_ref: StartServing(fresh) cold-boots this
  // (a NIC cold boot cannot resume the memory snapshot), so serving placement
  // reads THIS field, never snapshot_ref. Empty for a workload with no serving
  // base built here (task/session-only workloads leave it empty).
  string serving_image_ref = 6;
  // primed_vm_ids lists the vm_id of every PRIMED (parked, unassigned) VM for
  // this workload on this node. free_primed_slots is len(primed_vm_ids); the
  // ids let a freshly (re)started control plane ADOPT the node's existing warm
  // pool into its dispatch inventory instead of orphaning it. Without this, a
  // control-plane restart loses its in-memory inventory while the node keeps the
  // VMs alive (counting them against max_live_vms), so the new control plane can
  // neither assign to them nor prime past them: dispatch deadlocks. The node is
  // the source of truth for the pool; the control plane reconciles from this.
  repeated string primed_vm_ids = 5;
}

enum BaseBuildState {
  BASE_BUILD_STATE_UNSPECIFIED = 0;
  BASE_BUILD_STATE_NONE = 1;      // no base on this node for the workload
  BASE_BUILD_STATE_BUILDING = 2;  // BuildBase in progress
  BASE_BUILD_STATE_READY = 3;     // base built and restorable
  BASE_BUILD_STATE_FAILED = 4;    // last BuildBase failed (see build_error)
}

// SessionVm is one LIVE session VM the node currently holds: the daemon reports
// it (with the opaque session_id it was given at SessionAssign/Relight) so a
// restarted control plane ADOPTS the running session instead of orphaning it,
// exactly the primed-pool adoption fix (PR #3517) applied to session state.
// Session VMs are reported here and NOT in WorkloadCapacity.primed_vm_ids (a
// session VM must never be adopted into the single-use task pool).
message SessionVm {
  string vm_id = 1;
  string session_id = 2;
  string workload = 3;
}

// SessionSnapshot is one BANKED session snapshot bundle on node disk. The daemon
// rescans its sessions snapshot dir on start and reports what it finds so the
// control plane reconciles banked-session inventory from node truth (a banked
// session survives a daemon restart; a live one does not). size_bytes and
// created_at_unix_ms feed disk-watermark eviction and TTL GC at the control
// plane.
message SessionSnapshot {
  string snapshot_ref = 1;
  string session_id = 2;
  string workload = 3;
  uint64 size_bytes = 4;
  int64 created_at_unix_ms = 5;
}

// ServingVm is one LIVE serving VM the node currently holds, reported so a
// restarted control plane adopts rather than orphans it and so the control
// plane can consume the daemon's health-probe fact. healthy and
// last_probe_unix_ms are set by the daemon's local probe loop (see the
// StartServing/StopServing RPC comments for the probe contract); the daemon
// itself never acts on healthy, it only reports it. Excluded from every
// WorkloadCapacity.primed_vm_ids list, exactly like SessionVm.
message ServingVm {
  string vm_id = 1;
  string workload = 2;
  // ip/port are the ROUTABLE endpoint (noded pod IP + per-VM DNAT port,
  // D-R3.11.4), matching StartServingResponse; the tap IP stays node-internal.
  // Falls back to the tap IP when noded has no pod IP configured (local/test).
  string ip = 3;
  uint32 port = 4;
  bool healthy = 5;
  int64 last_probe_unix_ms = 6;
}

// ServingSnapshot is one BANKED serving snapshot bundle on node disk, stored
// under the serving/ prefix of the sessions-style bundle dir. The daemon
// rescans this dir on start and reports what it finds, exactly like
// SessionSnapshot, so the control plane reconciles banked-serving inventory
// from node truth.
message ServingSnapshot {
  string snapshot_ref = 1;
  string workload = 2;
  uint64 size_bytes = 3;
  int64 created_at_unix_ms = 4;
}

// StatefulVm is one LIVE stateful VM the node currently holds, reported so a
// restarted control plane adopts rather than orphans it and so the control plane
// consumes the daemon's TCP-connect health verdict. generation is the volume
// generation this VM was booted with (the pair key). Excluded from every
// WorkloadCapacity.primed_vm_ids and from session_vms/serving_vms.
message StatefulVm {
  string vm_id = 1;
  string workload = 2;
  // ip/port are the ROUTABLE endpoint (noded pod IP + per-VM DNAT port), matching
  // serving; the tap IP stays node-internal.
  string ip = 3;
  uint32 port = 4;
  bool healthy = 5;
  // generation is the volume generation the live VM holds (bumped at its attach).
  uint64 generation = 6;
  int64 last_probe_unix_ms = 7;
}

// StatefulBundle is the ONE banked stateful bundle for a workload on node disk,
// stored under the stateful/ prefix of the bundle dir and STAMPED with the
// volume generation it was paused at. The daemon rescans on start and reports it
// so the control plane reconciles banked warmth and recomputes pair validity
// (bundle generation vs the volume's current generation) from node truth.
message StatefulBundle {
  string snapshot_ref = 1;
  string workload = 2;
  uint64 generation = 3;
  uint64 size_bytes = 4;
  int64 created_at_unix_ms = 5;
}

// Volume is one workload's raw volume file on node NVMe, the durable data that
// outlives every instance. generation is the ledger's current value (bumped on
// every writable attach); allocated_bytes is the file's actual block usage (the
// watermark source), size_bytes the declared sparse cap. attached is true while a
// live VM holds the writable device. The host never reads the file's contents;
// these are metadata facts only.
message Volume {
  string workload = 1;
  uint64 generation = 2;
  uint64 size_bytes = 3;
  uint64 allocated_bytes = 4;
  bool attached = 5;
}

// GroupNetwork is one per-group bridge the node currently holds, reported so a
// restarted control plane reconciles group networks from node truth (a bridge
// survives a daemon restart) and can see the CIDR each group occupies without
// tracking allocation itself. member_count is the number of member VMs currently
// attached to the bridge (the DeleteGroupNetwork backstop reads it).
message GroupNetwork {
  string group_instance_id = 1;
  string cidr = 2;
  string bridge = 3;
  uint32 member_count = 4;
}

// GroupMemberVm is one LIVE group member VM the node currently holds, reported so
// a restarted control plane adopts rather than orphans it and consumes the
// daemon's TCP-connect health verdict. Excluded from every
// WorkloadCapacity.primed_vm_ids, session_vms, serving_vms, and stateful_vms (a
// member VM is never in the task pool).
message GroupMemberVm {
  string vm_id = 1;
  string group_instance_id = 2;
  string member_name = 3;
  string ip = 4;
  bool healthy = 5;
  int64 last_probe_unix_ms = 6;
}

// GroupBundleMember is one member's banked snapshot within a group bundle set: the
// opaque per-member ref and its size. Grouped under a GroupBundleSet by the set
// directory the daemon was told to write it under.
message GroupBundleMember {
  string member_name = 1;
  string snapshot_ref = 2;
  uint64 size_bytes = 3;
}

// GroupBundleSet is the per-member banked snapshots the daemon found grouped under
// one set directory (group/<set_id>/), reported so the control plane reconciles
// banked-group inventory from node truth. The daemon reports refs GROUPED BY the
// set dir it wrote them under; it makes NO completeness judgment (whether the set
// has every member it needs to relight is the control plane's to decide).
message GroupBundleSet {
  string set_id = 1;
  string group_instance_id = 2;
  repeated GroupBundleMember members = 3;
  int64 created_at_unix_ms = 4;
}

// NodeStatus is the whole capacity fact set: per-workload primed slots and base
// states, node-level memory/cpu headroom, and the draining flag. A draining
// daemon reports draining=true and the control plane stops new assignments
// immediately (fail-closed: no capacity facts means no dispatch).
message NodeStatus {
  string node_id = 1;
  repeated WorkloadCapacity workloads = 2;
  // Node-level headroom the control plane uses as a backstop against the
  // node-level live-VM cap. mem_headroom_mib is free schedulable guest memory;
  // live_vms is the current count against the node-level cap.
  uint64 mem_headroom_mib = 3;
  uint32 cpu_headroom_millicores = 4;
  uint32 live_vms = 5;
  uint32 max_live_vms = 6;
  // draining true means the daemon is shutting down or cordoned; stop assigning.
  bool draining = 7;
  // build_error carries the last BuildBase failure string for any workload in
  // BASE_BUILD_STATE_FAILED, surfaced into the Workload CR condition message.
  string build_error = 8;

  // -- Session facts (R2, additive) ------------------------------------------
  // These four fields let a restarted control plane adopt session state (live
  // VMs and banked snapshots) from node truth rather than orphaning it, and let
  // the eviction/watermark policy see snapshot-disk pressure. All are optional/
  // repeated and wire-compatible with a daemon that never sets them.

  // session_vms lists every LIVE session VM this node holds. Disjoint from every
  // WorkloadCapacity.primed_vm_ids (a session VM is never in the task pool).
  repeated SessionVm session_vms = 9;
  // session_snapshots is the banked-snapshot inventory scanned from the sessions
  // snapshot dir on disk. The source of truth for what banked sessions survive.
  repeated SessionSnapshot session_snapshots = 10;
  // snapshot_disk_free_bytes / snapshot_disk_used_bytes report the sessions
  // snapshot dir's filesystem usage so the control plane's LRU eviction can fire
  // on a low-watermark crossing and the watermark alert can trip.
  uint64 snapshot_disk_free_bytes = 11;
  uint64 snapshot_disk_used_bytes = 12;

  // -- Serving facts (R3, additive) -------------------------------------------
  // These three fields mirror the session facts above for serving-class VMs:
  // adoption of live state, banked-snapshot inventory, and the daemon's serving
  // subnet fact. All are optional/repeated and wire-compatible with a daemon
  // that never sets them.

  // serving_vms lists every LIVE serving VM this node holds, including each
  // one's current health-probe verdict. Disjoint from every
  // WorkloadCapacity.primed_vm_ids and from session_vms.
  repeated ServingVm serving_vms = 13;
  // serving_snapshots is the banked-serving-snapshot inventory scanned from the
  // serving/ prefix of the sessions snapshot dir.
  repeated ServingSnapshot serving_snapshots = 14;
  // serving_subnet_cidr is the CIDR the daemon allocates serving VM tap IPs
  // from, reported so the control plane can reason about address space without
  // ever performing allocation itself (allocation stays daemon-internal).
  string serving_subnet_cidr = 15;

  // -- Stateful facts (R4, additive) ------------------------------------------
  // These three fields report the stateful-class substrate: live singleton VMs
  // (with their volume generation and TCP-connect health verdict), the one banked
  // bundle per workload (stamped with its paired generation), and the durable
  // volumes (with generations and block usage). All are optional/repeated and
  // wire-compatible with a daemon that never sets them. The control plane derives
  // pair validity (bundle generation vs volume generation) purely from these.

  // stateful_vms lists every LIVE stateful VM this node holds. Disjoint from every
  // WorkloadCapacity.primed_vm_ids, session_vms, and serving_vms.
  repeated StatefulVm stateful_vms = 16;
  // stateful_bundles is the banked-stateful-bundle inventory scanned from the
  // stateful/ prefix of the bundle dir (at most one per workload).
  repeated StatefulBundle stateful_bundles = 17;
  // volumes is the raw-volume-file inventory (one per stateful workload) scanned
  // from the volumes dir, the durable data the control plane never reads but must
  // account for (generation for pairing, allocated_bytes for the watermark).
  repeated Volume volumes = 18;

  // -- Group facts (R5, additive) ---------------------------------------------
  // These three fields report the composite-workload substrate: the per-group
  // bridges (with their CIDR and attached member count), the live member VMs (with
  // their group identity and TCP-connect health verdict), and the banked bundle
  // SETS (per-member refs grouped by set directory). All are optional/repeated and
  // wire-compatible with a daemon that never sets them. The daemon reports refs
  // grouped by set; the completeness judgment (is a set whole enough to relight)
  // stays in the control plane.

  // group_networks lists every per-group bridge this node currently holds.
  repeated GroupNetwork group_networks = 19;
  // group_member_vms lists every LIVE group member VM this node holds. Disjoint
  // from every WorkloadCapacity.primed_vm_ids, session_vms, serving_vms, and
  // stateful_vms.
  repeated GroupMemberVm group_member_vms = 20;
  // group_bundle_sets is the banked-group-bundle inventory scanned from the
  // group/ prefix of the bundle dir, refs grouped by set directory.
  repeated GroupBundleSet group_bundle_sets = 21;
}
