# EmberVM dev environment overrides. Production defaults from chart/values.yaml
# are inherited; only dev-specific settings appear here.

# Op-log: SQLite on PVC (disjoint from production's monolith-pg Postgres).
# The chart falls back to EMBERVM_OPLOG_PATH=/var/lib/embervm/oplog.db when
# postgres.enabled is false. PVC-backed SQLite survives control-plane restarts.
opLog:
  postgres:
    enabled: false
  persistentVolume: true
  size: 1Gi

# SpecTrace validation (issue #4770). Dev-only spec-driven state machine tracing
# to validate TLA+ specs against live behaviour. Off in production by default.
specTrace:
  enabled: true
  path: /var/lib/embervm/spec-trace.db
  ttlSeconds: 86400
  sweepIntervalSeconds: 3600

# Size-class brick cutover. Dev runs ONE tiny 1gi brick, pinned to node-4.
# NEVER the masters: #4290 fills their 35 GiB scratch on any chart bump.
# All other classes are explicitly zero. No autoscale in dev.
bricks:
  enabled: true
  # The first grouped dev roll's measured result is recorded on #4897.
  syncWaveGroupSize: 3
  # ALL ZERO. desiredReplicas renders an UNPINNED brick per class, and nodeFloors
  # renders an ADDITIONAL pinned one: the floor does not pin the desired-replicas
  # brick, it adds a second Deployment beside it.
  #
  # Setting 1gi: 1 here produced two live bricks, one of them free to schedule
  # anywhere, including onto a master. #4290 is that failure: an unpinned brick
  # fills a master's 35GiB scratch on any chart bump, and a second control plane
  # priming bases makes it worse. Dev gets exactly one brick and it is pinned.
  desiredReplicas:
    1gi: 0
    2gi: 0
    4gi: 0
    8gi: 0
    16gi: 0
  autoscale:
    mode: observe
  # The ONLY live brick in dev: one 1gi class, pinned to node-4. Never a master.
  nodeFloors:
    - node: node-4
      class: 1gi

# S3 bucket split. Dev uses embervm-dev; production uses embervm.
# Warmth GC and base retention operate on S3; separate buckets prevent
# production GC from deleting dev artifacts. The store endpoint and bucket are
# rendered into noded's config for S3 warmth export/restore.
# Platform KEK root (ADR embervm/036, #4976): dev derives per-principal KEKs
# from the embervm-kek-root item. The secretKeyRef is optional, so until the
# item exists the custodian is inert and nothing below encrypts.
# Platform KEK root (ADR embervm/036, #4976): the embervm-kek-root item was
# created 2026-08-22 (48 random bytes, base64). The secret ref is optional,
# so a missing item leaves the custodian inert rather than blocking the CP.
kekRoot:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/embervm-kek-root"

noded:
  # The wildcard DaemonSet, off. See the scratchPrep note below for why this
  # matters: it selects homelab.io/firecracker=true, which all four nodes carry
  # including the three etcd masters.
  enabled: false

  networkPolicy:
    enabled: true

  store:
    bucket: embervm-dev
    # SigV4 credentials (#4708): same identity as production, the policy grants
    # it both buckets.
    credentials:
      enabled: true
      onepassword:
        itemPath: "vaults/k8s-homelab/items/embervm-store"

# nvmeRoot lives UNDER node-4's NVMe mount so it inherits that capacity bound,
# production's shared node-4 NVMe scratch. Scratch is shared metal; the split
# prevents prod GC and dev artifacts from colliding.
  firecracker:
    # UNDER node-4's NVMe mount, not a sibling of it.
    #
    # scratch-dev was /var/lib/embervm/scratch-dev, a sibling of the NVMe mount
    # point and therefore a plain directory on the node's ROOT filesystem. That
    # made it the ONLY scratch path in this system with no capacity bound: node-4's
    # NVMe is mounted at /var/lib/embervm/scratch and the masters carry a 35 GiB
    # loop cap on the same path. Six base builders writing multi-GB images to an
    # uncapped root filesystem, on the node that also runs production's
    # brick-16gi-node-4 and brick-2gi, is a DiskPressure eviction of production
    # waiting to happen. ADR 012's uniform cap exists for exactly this.
    #
    # A subdirectory gives up "separate metal", which was never the load-bearing
    # property: the split existed so production GC and dev artifacts do not
    # collide, and a distinct subdirectory achieves that. It buys the capacity
    # bound, which is. See #4832.
    nvmeRoot: /var/lib/embervm/scratch/dev
    # The leaf needs creating; the MOUNT is still guarded by its parent existing.
    # Production keeps the default Directory, which fails loudly if the NVMe is
    # absent instead of filling root.
    nvmeRootHostPathType: DirectoryOrCreate

  # Node capacity. Dev runs one tiny brick, so use the smaller default.
  maxLiveVMs: 8

  # ARMED: brick silence timeout, ~6h (ADR embervm/037, #5073). Rollback: "".
  silenceTimeoutSeconds: "21600"

  # Disable warmth restore in dev. The machines are small and sessions are ephemeral.
  warmRestoreWithVolumeClasses: []

# Dev keeps ONE workload, the smallest real one, and keeps its production name.
#
# No rename is needed and none should be added. Workloads are namespaced
# resources and `embervm-dev/sandbox` is a different object from
# `embervm/sandbox`; that is what namespaces are for. The control plane was the
# only thing opting out, reading the cluster-wide collection and keying its
# catalog on name alone, and this PR scopes its informer to its own namespace
# (see `k8s.ex` `workloads_path/0`). With that fixed, a shared name is not a
# collision, and renaming to `dev-sandbox` would have been a workaround dressed
# as isolation while still running production's spec.
#
# Everything below is disabled for SIZE, not for safety. Dev exercises lifecycle
# with one small task-class workload rather than the production fleet.
sandboxSessionWorkload:
  enabled: false

semgrepWorkload:
  enabled: false

bazelQueryWorkload:
  enabled: false

# The website snapshotter (ADR embervm/035), off in dev. It also has no egress
# lane here: dev inherits egress.enabled false, so even enabled it could not
# reach a frontend.
shotterWorkload:
  enabled: false

claudeRuntimeWorkload:
  enabled: false

# The ONE session workload dev runs, and the exception to the paragraph above.
#
# It earns its place by being the thing dev is for: this workload is the first
# in the fleet sized at 256 MiB, and the only question that cannot be answered
# by reading is whether a guest actually boots and reports /shim/ready in that
# much RAM. Dev's 1gi brick has 768 MiB guest-schedulable, so one fits with
# headroom, and its base is the ~100 MB pi image rather than the 300 MB claude
# one that cost the first dev brick three of its four minutes.
#
# WHAT DEV CAN AND CANNOT PROVE HERE. Dev does not enable the egress lane
# (egress.enabled defaults false and dev is silent on it), and a pi turn reaches
# the in-cluster vLLM endpoint through that lane, so dev proves base build, cold
# boot, readiness and session create/destroy at 256 MiB. It does NOT prove a
# turn. That is production's to prove, which is why the CR ships enabled there
# with nothing routed to it yet.
#
# Watch for `pressure:mem` on create: admission compares raw cgroup headroom
# against need (256) plus the reject floor (512), and a brick that has baked a
# base carries page cache in memory.current. If dev flaps on admission, that is
# a real finding about small guests on small bricks, not a dev-only artifact.
piRuntimeWorkload:
  enabled: true

# scratchPostgres carries BOTH of its dev settings here, deliberately. It also
# needs an empty guest image (the base-builder block below empties one repository
# per unused workload), but a second `scratchPostgres:` key at that level is a
# duplicate YAML mapping key: the later block wins and this `enabled: false` is
# dropped silently, exactly the hazard the `noded.enabled` note below describes.
# That is what happened until now, and it was masked only because the chart
# default for `enabled` is also false.
scratchPostgres:
  enabled: false
  guestImage:
    repository: ""

demoPostgres:
  enabled: false

# The wildcard noded DaemonSet and scratch-prep, BOTH of which default true in
# the chart and which production explicitly disables.
#
# Dev loads only this values file, so a chart default wins wherever dev is
# silent, and dev was silent on both. They select `homelab.io/firecracker=true`,
# which ALL FOUR nodes carry including the three etcd masters, so dev was
# rendering one noded per master: #4290 at fleet scale rather than one pinned
# brick. scratch-prep is worse in kind, being privileged with hostPID and
# `nsenter -t 1`, and its script hardcodes production's /var/lib/embervm/scratch
# rather than nvmeRoot, plus an /etc/fstab append.
#
# It was gated only by accident: the nvme hostPath is type Directory on a path
# that does not exist, so the pods sat in ContainerCreating. Creating that
# directory would have armed it.
#
# `noded.enabled` is set in the noded block above, NOT here: a second `noded:`
# key at this level would be a duplicate YAML mapping key and one of the two
# blocks would be silently dropped.
scratchPrep:
  enabled: false

# Control-plane resources. Same as production (SigNoz 7-day-peak); scale later.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Base retention: ARMED, matching production, so dev exercises the paths
# production actually runs. The previous reasoning (the 1gi class is small and
# the rebuild cost is negligible) argued that dev did not NEED retention, which
# is true and beside the point: production arms all three of these gates, so
# leaving them empty here meant every change to eviction logic reached
# production having never run anywhere. #4907 changed which bases the sweep
# collects and dev could not have caught a regression in it.
#
# All three are set because they are not redundant. sweepEnabled alone leaves
# the sweep logging "DRY RUN, deletion disabled", since candidates come from the
# disk-driven plan gated by diskDrivenEnabled; remoteSweepEnabled is the store
# side. Dev writes to its own embervm-dev bucket and its own scratch root, and a
# base is a reconstructible artifact, so a wrong delete here costs a rebuild.
# Rollback for any of them is setting it back to "".
baseRetention:
  sweepEnabled: "1"
  diskDrivenEnabled: "1"
  remoteSweepEnabled: "1"

warmthRetention:
  sweepEnabled: "1"

# #4952: S3-direct warmth GC is armed against dev's own embervm-dev bucket.
# expectedNodes names dev's entire one-node fleet so the freshness contract can
# pass. The per-sweep caps are a quarter of production for a quarter of the
# fleet. Rollback is setting enabled back to "".
warmthS3Gc:
  enabled: "1"
  expectedNodes:
    - node-4
  maxPrefixes: "50"
  maxBytes: "26843545600" # 25 GiB

# Tracing: reuse production endpoint (if available).
tracing:
  endpoint: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4317"
  serviceName: embervm-dev-control

# Auth: own ServiceAccount, isolated from production.
auth:
  allowedServiceAccounts:
    - system:serviceaccount:embervm-dev:embervm-dev-embervm

usageAdmins:
  - system:serviceaccount:embervm-dev:embervm-dev-embervm

# ARMED in dev, and this is the point of the environment.
#
# #4758: EMBERVM_NODE_CONFIRMED_DESTROY has been read by the control plane since
# ADR embervm/014 landed and rendered by no template, so the node-confirmed
# ordering has never executed anywhere. adoption.tla's NoDestroyBeforeConfirm
# and DestroyIntentPrecedesRecord model behaviour production has never run.
#
# Dev is where that ordering runs for the first time, under the conformance
# harness, with EMBERVM_SPEC_TRACE on so the destroy invariants have data. Prod
# stays false until this has soaked.
nodeConfirmedDestroy: true

# rootfsPath is a SEPARATE key from noded.firecracker.nvmeRoot, and overriding
# only the latter is not enough.
#
# `_noded-pod.tpl` renders BASE_ROOTFS_PATH from these values and mounts only
# nvmeRoot, so with nvmeRoot moved to scratch-dev and these still pointing at
# /var/lib/embervm/scratch, the path is UNBACKED inside the container: mkfs
# writes multi-GB base images to the container's writable layer on node-4's ROOT
# filesystem. The idempotency marker lands on that same ephemeral layer, so every
# base rebuilds on every restart.
#
# node-4 also runs production's brick-16gi-node-4 and brick-2gi. Filling its root
# filesystem trips kubelet DiskPressure and evicts them. Every workload's path
# moves, including the ones whose CRs are disabled, because the base BUILDERS are
# gated separately from the Workload CRs.
workloads:
  # The six per-language sandbox guests (ADR agents/057). Every one needs its
  # own dev path for the reason in the block comment above: the base BUILDERS
  # are gated separately from the Workload CRs, so an inherited production path
  # is unbacked in the container and mkfs lands a multi-GB image on node-4's
  # ROOT filesystem, where production's bricks live.
  sandboxPython:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/sandbox-python/rootfs.ext4
  sandboxGo:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/sandbox-go/rootfs.ext4
  sandboxRust:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/sandbox-rust/rootfs.ext4
  sandboxElixir:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/sandbox-elixir/rootfs.ext4
  sandboxOcaml:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/sandbox-ocaml/rootfs.ext4
  sandboxJavascript:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/sandbox-javascript/rootfs.ext4
  semgrep:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/semgrep/rootfs.ext4
  runtimePython:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/runtime-python/rootfs.ext4
  runtimeClaude:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/runtime-claude/rootfs.ext4
  # MANDATORY even though dev may not run the workload: every workload's path
  # has to move, including the ones whose CRs are disabled, because the base
  # BUILDERS are gated separately from the Workload CRs. Left at the inherited
  # production path this is UNBACKED inside the container (only nvmeRoot is
  # mounted), so mkfs writes a multi-GB base image to node-4's ROOT filesystem,
  # which is where production's bricks live. See the block comment above.
  runtimePi:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/runtime-pi/rootfs.ext4
  scratchPostgres:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/scratch-postgres/rootfs.ext4
  bazelQuery:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/bazel-query/rootfs.ext4
  # MANDATORY even though dev does not run the shotter workload: the Workload CR
  # and the base BUILDER are gated separately, so a path left at the inherited
  # production value is UNBACKED inside the container (only nvmeRoot is mounted)
  # and mkfs would write a multi-GB base image onto node-4's ROOT filesystem,
  # which is where production's bricks live.
  shotter:
    rootfsPath: /var/lib/embervm/scratch/dev/embervm-noded/shotter/rootfs.ext4

# The serving lane, off. Dev exercises task-class lifecycle for the conformance
# harness, not serving or stateful workloads.
#
# It was CrashLoopBackOff on the first sync, and the cause is structural rather
# than a misconfiguration: envoy's bootstrap subscribes to CDS over ADS and
# blocks initialisation until its first response. With no live brick and no
# serving workload the control plane's xds snapshot is empty, so the initial
# fetch times out ("initial fetch timed out for ...v3.Cluster"), the pod never
# reports ready, and the probe restarts it. Production does not hit this because
# it always has serving config to send.
#
# Turn this back on if dev ever needs the serving lane, and expect it to stay
# unready until something is actually being served.
servingEnvoy:
  enabled: false

# Skip the base builders for workloads dev does not run.
#
# The Workload CR and its base BUILDER are two separate switches, and turning
# off the one you can see leaves the expensive one running.
# `claudeRuntimeWorkload.enabled: false` removes the CR; the builder loop in
# _noded-pod.tpl gates on `.Values.runtimeClaude.guestImage.repository`, a
# different key entirely.
#
# So dev was building all six bases on every brick start, including
# runtime-claude, the 4 GiB image #4762 explicitly excluded ("tiny echo guest,
# not claude-runtime"), for a workload no session can ever use. Measured: the
# first dev brick spent roughly three of its four minutes on that one builder.
#
# `sandbox` and `runtimePi` keep their builders, because they are the Workload
# CRs dev enables. Emptying the repository is what the loop's `if` tests, so the
# init container is not rendered at all. There is deliberately NO `runtimePi:`
# entry below: emptying it would leave the CR enabled with no base to restore,
# which reports as a workload that never goes Ready.
semgrep:
  guestImage:
    repository: ""

runtimePython:
  guestImage:
    repository: ""

runtimeClaude:
  guestImage:
    repository: ""

# scratchPostgres belongs in this list too, but its entry lives with its
# `enabled: false` in the workload block above: one key, both settings. Do not
# re-add a `scratchPostgres:` block here.

bazelQuery:
  guestImage:
    repository: ""

# Empty repository skips the shotter base builder entirely. Disabling the
# Workload CR above turns off the cheap switch; this is the expensive one, and
# leaving it set would have dev build a warm-Chromium base it never serves.
shotter:
  guestImage:
    repository: ""
