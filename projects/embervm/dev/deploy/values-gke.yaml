# GKE hub overrides for embervm-dev, applied after dev/deploy/values.yaml.
#
# WHY THIS EXISTS. embervm-dev ran on the home cluster as the Kargo dev stage,
# where the conformance runner (projects/embervm/conformance) gated every
# embervm chart on a functional verdict before production saw it (#5224). The
# 2026-08-31 GKE cutover brought only production across, so a chart has reached
# production since then having proved only that its pods came up. This file
# puts dev back on the hub, and with it the gate and the SpecTrace lane that
# #6415 (TLC trace validation of adoption.tla) reads.
#
# NOT layered with deploy/values-gke.yaml. That is production's hub overlay and
# carries production identities (its GCS base bucket, its authentik broker
# grant, guest callbacks into the production monolith). Layering it would make
# dev claim identities production owns, which chart_env_identity_test exists to
# forbid. Every hub fact dev needs is restated here instead.
#
# SIZE. Fixed unpinned 2gi and 8gi bricks plus at most one demand-opened 4gi
# canary on the shared ember-bricks Spot pool. Four workloads cover the suite:
# sandbox-python for S1, pi-runtime for S2/S3, sandbox-elixir for S5 and the
# bounded 4096 MiB claude-runtime session for S9. SQLite op-log, no object
# store. The recovery (values-recovery-gke.yaml) and store-validation
# (values-store-validation-gke.yaml) presets target the same embervm-dev
# release; activating either one means replacing this Application's value
# files, not stacking a second release.

# Namespace-scoped RBAC, as the recovery preset chose for this release. At the
# chart default (cluster scope) the dev control plane, which by design runs
# chart versions before they are verified, would hold cluster-wide Secret reads
# and Deployment scale rights on the hub that holds every production secret.
# Dev's workloads carry no stateful secretRef, so no Secret names are needed.
rbac:
  scope: namespace
  secretNames: []

# The hub has no longhorn. standard-rwo is GKE's default balanced PD class and
# what the recovery preset already chose for the same PVC.
opLog:
  storageClass: standard-rwo

bricks:
  # Fixed unpinned 2gi and 8gi bricks. The home values pin via nodeFloors to node-4 and
  # keep desiredReplicas at zero because an unpinned brick there could land on
  # an etcd master (#4290). The hub has no masters to protect: bricks select
  # homelab.io/firecracker and tolerate embervm.jomcgi.dev/node, which only the
  # ember-bricks pool carries. node-4 does not exist here, so the floor would
  # render a brick that can never schedule.
  desiredReplicas:
    1gi: 0
    2gi: 1
    4gi: 0
    8gi: 1
    16gi: 0
  nodeFloors: []
  # The BrickController's static target is max(desiredReplicas, minReplicas)
  # per class, and it enforces that even in autoscale mode observe. The chart
  # default minReplicas carries a 16gi warm floor of 1 (a home policy), so
  # leaving this unset ran a 16gi brick in dev on the hub, which the render
  # alone never shows: the Deployment renders 0 and the controller scales it.
  # Production's hub overlay zeroes the same floor. The hub dev canary grants
  # 4gi ceilingBound 1 with bootstrap max 0 in full mode, so it can open on
  # sustained attributed denials, drain safely, then retire its ceiling after
  # one quiet hour at zero replicas. min=max=1 for 2gi and 8gi preserves the
  # conformance bricks in full mode; 8gi admits the 4096 MiB Claude workload.
  # Only needs above 2gi's usable memory minus its reject
  # floor, and fitting 4gi, attribute denials to 4gi; small-workload saturation
  # on 2gi does not open it. Revert by deleting the 4gi bound (or setting it to
  # 0), or return mode to observe. Production overlays stay ceiling-disabled.
  autoscale:
    mode: full
    ceilingBound:
      4gi: 1
    minReplicas:
      1gi: 0
      2gi: 1
      4gi: 0
      8gi: 1
      16gi: 0
    maxReplicas:
      1gi: 0
      2gi: 1
      4gi: 0
      8gi: 1
      16gi: 0

noded:
  # Node-local state only. The empty endpoint is the chart's store-disabled
  # mode: banks stay node-resident and relight on the same brick, which is what
  # S2 and S3 exercise with one brick. The home SeaweedFS bucket does not exist
  # here, and a dev GCS bucket is #6193's to provision, not this change's. The
  # S3 export and restore path is therefore NOT exercised by dev on the hub.
  store:
    endpoint: ""
    bucket: ""
    credentials:
      enabled: false
  # Scratch nests under production's capped loop at /var/lib/embervm/scratch
  # (35 GiB, provisioned by production's scratch-prep on every ember-bricks
  # node). Dev keeps its own subtree so its base retention sweep never sees
  # production's bases.
  #
  # sharedScratch, NOT the home shape (a DirectoryOrCreate leaf). Nothing orders
  # this brick after production's scratch-prep, and kubelet creates a
  # DirectoryOrCreate hostPath at volume setup, before any init container. On a
  # fresh Spot node (the scale-up this brick's own Pending state can trigger)
  # the leaf would land on the boot disk under production's bricks and the
  # later loop mount would hide it without moving this pod's bind. Shared
  # scratch mounts the prepared ROOT (type Directory), waits for production's
  # generation marker, and reaches scratch/dev by subPath, which kubelet only
  # resolves after that wait.
  firecracker:
    nvmeRoot: /var/lib/embervm/scratch/dev
    # Ignored under sharedScratch. It matters only for a chart that predates
    # sharedScratch (the gke-apps floor), which falls back to a plain hostPath
    # at nvmeRoot: Directory makes that brick fail its mount, since nothing
    # creates scratch/dev on the host, instead of creating it on the boot disk.
    # The first dev Promotion then moves it to a chart that has the mode.
    nvmeRootHostPathType: Directory
    sharedScratch:
      enabled: true
      hostRoot: /var/lib/embervm/scratch
      subPath: dev
  drain:
    # GCE preemption notices exist on the hub only.
    preemptionNoticeEnabled: true
  # At the chart default homelab-disposable a Pending brick never triggers the
  # cluster autoscaler (see deploy/values-gke.yaml), and a dev brick that never
  # schedules would hold every promotion for the full verdict timeout.
  priorityClassName: homelab-preemptible

# Only the conformance suite's workloads. The other four sandbox languages are
# off with their base builders, since each builder bakes into production's
# shared 35 GiB scratch loop.
sandboxWorkloads:
  sandboxGo:
    enabled: false
  sandboxRust:
    enabled: false
  sandboxOcaml:
    enabled: false
  sandboxJavascript:
    enabled: false

sandboxGo:
  guestImage:
    repository: ""
sandboxRust:
  guestImage:
    repository: ""
sandboxOcaml:
  guestImage:
    repository: ""
sandboxJavascript:
  guestImage:
    repository: ""

# The serving prover needs the serving lane, which dev keeps off.
pingWorkload:
  enabled: false
  guestImage:
    repository: ""

# No object store, so nothing remote to sweep. Local base and warmth retention
# stay armed on dev's own scratch subtree, matching values.yaml.
baseRetention:
  remoteSweepEnabled: ""
warmthS3Gc:
  enabled: ""

# New charts opt into the stamped b3 cache; older charts ignore the flag and
# continue baking b2. The builder ConfigMap has a distinct name for b3.
rootfsBuilder:
  bakeFormatVersion: b2
  stampImageDigest: true

# Keep the published guest digest/tag from the chart. The home dev base disables
# this repository, so hub dev must restore it together with the Workload CR.
runtimeClaude:
  guestImage:
    repository: ghcr.io/jomcgi/homelab/projects/embervm/runtimes/claude

claudeRuntimeWorkload:
  enabled: true
  persistenceEnabled: true
  memMib: 4096
  cap: 1
  session:
    idleBankSeconds: 20
    maxLifetimeSeconds: 600
    bankedTtlSeconds: 120
    maxSessions: 1
    invokeQueueCap: 1
  invocation:
    timeoutSeconds: 180

# Bootstrap against the currently published guest. A later runtime promotion
# moves these expectations to Terra and CLI 0.167.0 after this gate is healthy.
conformance:
  codex:
    enabled: true
    model: sol
    providerModel: gpt-6.1-sol
    cliVersion: "0.146.0"

# This broker owns a dev-only grant. No production grant is copied. The older
# chart already understands plaintext retirement, so applying this HEAD overlay
# before the strict-login chart (or rolling it back) keeps login off port 8080.
tokenBroker:
  enabled: true
  plaintext:
    retireProtectedRoutes: true
  loginAuth:
    required: true
    clientSpiffeIds:
      - spiffe://embervm.jomcgi.dev/ns/monolith/sa/monolith
  spiffe:
    enabled: true
    clientSpiffeIds:
      - spiffe://embervm.jomcgi.dev/ns/embervm-dev/sa/embervm-dev-embervm-noded
  grants:
    - name: codex-cluster
      provider: codex-chatgpt
      fqdn: auth.openai.com

egress:
  enabled: true
  workloads: [claude-runtime]
  tokenBroker:
    spiffe:
      enabled: true
  internal:
    default: deny
    allowlist: []
  ca:
    enabled: true
  secrets:
    - header: Authorization
      valuePrefix: "Bearer "
      egressTo: [chatgpt.com]
      brokerGrant: codex-cluster
      claimHeader: chatgpt-account-id
      claimPath: https://api.openai.com/auth.chatgpt_account_id
      # The current CLI's connector request omits Authorization. Only this
      # exact path opts into injection when the header is absent.
      injectAlwaysPaths:
        - /backend-api/ps/mcp
      quotaProvider: codex
