apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embervm-dev
  namespace: argocd
  annotations:
    # Kargo will not touch an Application that has not opted in. Without this
    # the promotion fails with:
    #
    #   Argo CD Application "embervm-dev" in namespace "argocd" is not authorized
    #
    # which is exactly how #4863 shipped: the Warehouse discovered Freight
    # within seconds, the dev Promotion ran, and it Errored on step-1. Nothing
    # else reported a problem, because an unauthorized Promotion is Kargo
    # declining rather than anything being broken.
    #
    # That is a deliberate guard, not an obstacle: installing Kargo cannot
    # silently give it write access to every Application in the cluster, and an
    # Application is protected by simply never carrying this.
    #
    # Format is <kargo project>:<stage>. The project is kargo-embervm rather
    # than embervm because a Kargo Project OWNS a namespace of its own name and
    # both embervm and embervm-dev already exist holding live workloads.
    kargo.akuity.io/authorized-stage: kargo-embervm:dev
spec:
  project: default
  sources:
    # Chart from OCI (pushed by CI via Bazel helm_push); image tag pinned at build.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: embervm
      targetRevision: 0.12.2
      helm:
        valueFiles:
          - $values/projects/embervm/dev/deploy/values.yaml
    # Git repo for environment-specific values.
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Dev namespace, isolated from production.
    namespace: embervm-dev
  ignoreDifferences:
    # The BrickController owns each brick Deployment's replica count: the chart
    # value is only the count at FIRST create, and the controller PATCHes /scale
    # thereafter from demand-driven autoscale. With selfHeal on, ArgoCD would
    # revert every scale decision back to the chart value, so /spec/replicas has
    # to stay out of the diff for this app.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The token broker owns the OAuth grant Secrets' DATA: the chart declares
    # each embervm-oauth-grant-* Secret empty (so RBAC resourceNames can scope
    # to it) and the broker writes the rotating bundle at login and on every
    # refresh. With selfHeal on, diffing /data would revert the bundle to the
    # empty chart declaration, silently revoking the grant. One entry PER GRANT.
    - kind: Secret
      name: embervm-oauth-grant-codex-cluster
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
