apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embervm-dev
  namespace: argocd
spec:
  project: default
  sources:
    # Chart from OCI (pushed by CI via Bazel helm_push); image tag pinned at build.
    #
    # chart-version-bot: manage-target-revision
    #
    # Opts this pin into the post-merge write-back, so dev advances with the
    # chart instead of freezing at whatever it was bootstrapped to (#4832).
    # The marker is required rather than implied by the path: monolith-dev's
    # equivalent is Kargo-owned (#4744) and its committed value is a frozen
    # revert lever, so the bot must never assume a dev Application is its to
    # write. EmberVM has no promotion pipeline yet (#4762 deferred it), which
    # is exactly why this one wants the bot.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: embervm
      targetRevision: 0.12.2
      helm:
        valueFiles:
          - $values/projects/embervm/dev/deploy/values.yaml
    # Git repo for environment-specific values.
    - repoURL: https://github.com/jomcgi/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Dev namespace, isolated from production.
    namespace: embervm-dev
  ignoreDifferences:
    # The BrickController owns each brick Deployment's replica count: the chart
    # value is only the count at FIRST create, and the controller PATCHes /scale
    # thereafter from demand-driven autoscale. With selfHeal on, ArgoCD would
    # revert every scale decision back to the chart value, so /spec/replicas has
    # to stay out of the diff for this app.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The token broker owns the OAuth grant Secrets' DATA: the chart declares
    # each embervm-oauth-grant-* Secret empty (so RBAC resourceNames can scope
    # to it) and the broker writes the rotating bundle at login and on every
    # refresh. With selfHeal on, diffing /data would revert the bundle to the
    # empty chart declaration, silently revoking the grant. One entry PER GRANT.
    - kind: Secret
      name: embervm-oauth-grant-codex-cluster
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
