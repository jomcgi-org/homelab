{{- /* The Garage bucket claim and its kept key Secret. */ -}}
{{ include "factory-library.buckets" . }}
{{- $secret := printf "%s-ships-s3" .Release.Name }}
{{- $env := list }}
{{- range list "AWS_ENDPOINT_URL" "AWS_REGION" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "BUCKET" }}
{{- $env = append $env (dict "name" . "valueFrom" (dict "secretKeyRef" (dict "name" $secret "key" .))) }}
{{- end }}
{{- /* The read-only ships_publisher login (templates/database.yaml), never
the owner's ships-db-app. Its password is URL-safe, so the URL needs no escaping. */ -}}
{{- $env = append $env (dict "name" "DATABASE_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" "ships-publisher-login" "key" "password"))) }}
{{- $env = append $env (dict "name" "DATABASE_URL" "value" (printf "postgresql://ships_publisher:$(DATABASE_PASSWORD)@ships-db-rw.%s.svc:5432/ships?sslmode=require" .Release.Namespace)) }}
{{- $workload := dict "schedule" .Values.publisher.schedule "backoffLimit" 0 "args" (list "publish") "env" $env "resources" .Values.publisher.resources }}
{{- $render := include "factory-library.cronjob" (dict "root" $ "name" "ships-publish" "workload" $workload) }}
{{- range splitList "\n---" $render }}
{{- $resource := fromYaml . }}
{{- if $resource.kind }}
{{- if eq $resource.kind "CronJob" }}
{{- $_ := set $resource.spec "suspend" $.Values.publisher.suspend }}
{{- end }}
---
{{ toYaml $resource }}
{{- end }}
{{- end }}
---
# The library policy allows Garage. This one adds the ships database.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ships-publish-db
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ships-publish
  egress:
    - toEndpoints:
        - matchLabels: { cnpg.io/cluster: ships-db }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
