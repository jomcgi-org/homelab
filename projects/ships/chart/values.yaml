enabled: false
retentionEnabled: false
image:
  repository: ghcr.io/jomcgi/homelab/projects/ships
  digest: ""
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
# Populate from the measured seven-day footprint, WAL and rollover headroom.
database:
  storage: ""
  resources: {}
  # Generates the password of the publisher's read-only login once
  # (templates/database.yaml). python:3.13-alpine3.22.
  loginGenerator:
    image:
      repository: docker.io/library/python
      digest: sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
# The publisher writes the snapshot, heat and track products here. The
# factory-public release mirrors this bucket to R2 under ships/ (HOME-492,
# HOME-410). This chart holds no R2 credential.
buckets:
  - name: ships
    access: readwrite
# The publisher CronJob (templates/publisher.yaml). HOME-516 sets suspend to
# false when it turns the ingester on, with the factory-public ships source.
publisher:
  suspend: true
  schedule: "*/2 * * * *"
  # Trial allocations. HOME-516 measures a run and sets the budget.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
