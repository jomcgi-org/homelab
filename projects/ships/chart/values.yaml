# HOME-516 set generous starting budgets. HOME-537 runs one replica after
# the hub-stop check passed. HOME-526 right-sizes the budgets from factory
# metrics. To roll back, set enabled=false before the hub ingest starts again.
enabled: true
retentionEnabled: false
image:
  repository: ghcr.io/jomcgi/homelab/projects/ships
  digest: ""
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Each of the three instances. local-path volumes do not expand, so the
# first size errs high. Retention is off, so every day stays on disk.
database:
  storage: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Generates the password of the publisher's read-only login once
  # (templates/database.yaml). python:3.13-alpine3.22.
  loginGenerator:
    image:
      repository: docker.io/library/python
      digest: sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
# The publisher writes the snapshot, heat and track products here. The
# factory-public release mirrors this bucket to R2 under ships/ (HOME-492,
# HOME-410). This chart holds no R2 credential.
buckets:
  - name: ships
    access: readwrite
# The publisher CronJob (templates/publisher.yaml). HOME-410 sets suspend to
# false after HOME-537 turns the ingester on, with the factory-public ships
# source.
publisher:
  suspend: true
  schedule: "*/2 * * * *"
  # Trial allocations. HOME-410 measures a run and sets the budget.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
