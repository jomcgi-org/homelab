# HOME-516 sets generous starting budgets and keeps zero replicas.
# HOME-537 sets enabled=true after a public check shows the hub stopped.
# HOME-526 right-sizes the budgets from factory metrics.
enabled: false
retentionEnabled: false
image:
  repository: ghcr.io/jomcgi/homelab/projects/ships
  digest: ""
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Each of the three instances. local-path volumes do not expand, so the
# first size errs high. Retention is off, so every day stays on disk.
database:
  storage: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
