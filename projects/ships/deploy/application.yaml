apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ships
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/jomcgi/homelab/charts
    chart: ships
    targetRevision: 0.25.28
    helm:
      releaseName: ships
  destination:
    server: https://kubernetes.default.svc
    namespace: ships
  # garage-init owns credential bytes in the kept claim Secret, and
  # ships-publisher-login-generate owns the publisher's password.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: ships-ships-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: ships-publisher-login
      jsonPointers: [/data]
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
