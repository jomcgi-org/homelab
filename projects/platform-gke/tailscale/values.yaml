# The tailscale-gke 1Password item fields must be named exactly "client_id"
# and "client_secret" because the operator mounts them at /oauth/client_id
# and /oauth/client_secret.
tailscale-operator:
  operatorConfig:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi

  # kubectl over the tailnet, so cluster access does not die with a gcloud
  # token (it did on 2026-09-04 06:33, mid autonomous run). "true" means the
  # proxy AUTHENTICATES: it impersonates the tailnet identity and Kubernetes
  # RBAC then decides. Reaching the proxy grants nothing on its own, per
  # Tailscale's own contract: "Access to the proxy over the tailnet does not
  # grant users any default permissions to the Kubernetes API."
  #
  # NOT "noauth", which forwards requests with no identity attached and leaves
  # the operator's own permissions as the only thing standing between a tailnet
  # peer and the API server.
  #
  # This is a SECOND authentication path to the API server; Google's is the
  # other. The RBAC binding that makes it usable is deliberately absent until
  # the first request tells us which subject the proxy impersonates.
  apiServerProxyConfig:
    mode: "true"

# Tailnet identities the API server proxy may impersonate into cluster-admin.
# The proxy authenticates each as a Kubernetes USER of this exact name, so a
# typo here fails closed: the request authenticates and then matches no
# binding. Empty list renders no binding at all, leaving the proxy reachable
# and authorized for nothing.
apiServerProxyAdmins:
  - joe@jomcgi.dev

egressNamespace: tailscale

egressServices: []
