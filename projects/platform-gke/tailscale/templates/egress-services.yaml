{{- range .Values.egressServices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.egressNamespace | default "tailscale" }}
  annotations:
    tailscale.com/tailnet-fqdn: {{ .tailnetFqdn | quote }}
spec:
  type: ExternalName
  externalName: placeholder.invalid
  ports:
    - name: tcp
      protocol: TCP
      port: {{ .port }}
{{- end }}
