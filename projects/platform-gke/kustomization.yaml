apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./argocd # In-cluster ArgoCD adopts and manages its existing installation
  - ./atlas-operator # Atlas CRDs required by the monolith chart
  - ./cert-manager # Certificate controller and cluster certificate APIs
  - ./cloudnative-pg # CloudNativePG operator for PostgreSQL clusters
  - ./authentik # Dormant identity provider cutover destination
  - ./argo-workflows # Dormant workflow engine cutover destination
  - ./otel-collector # GKE telemetry export to Honeycomb
  - ./cloudflare-gateway # Envoy Gateway active, Cloudflare Tunnel armed but off
  - ./tailscale # Tailscale operator and tailnet egress services
  - ./kyverno # Secret cloning into monolith-workflows (job pods were secretless on the hub)
  - ./priority-classes # Cluster-scoped tiers (embervm's disposable tier depends on homelab-disposable)
