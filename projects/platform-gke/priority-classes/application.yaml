apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: priority-classes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    path: projects/platform/priority-classes
    helm:
      releaseName: priority-classes
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    # PriorityClasses are cluster-scoped; the namespace is required but ignored.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
