apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polylane
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # ArgoCD 3.1 forces structured-merge diff for any app with
    # ServerSideApply=true, and that path evaluates ignoreDifferences before it
    # normalises the predicted state. The server-side path normalises after its
    # dry run, so the state Secret exclusion below actually applies
    # (docs/runbooks/argocd-outofsync.md, "Phantom OutOfSync from
    # ServerSideApply").
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    path: projects/platform/polylane
    helm:
      releaseName: polylane-k8s
      valueFiles:
        - values.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: polylane
  # The agent owns the contents of its state Secret: the chart renders it with
  # no data on purpose (the agent's RBAC is get/update/patch, never create), and
  # the agent writes its registration and the cloudflared tunnel token into it
  # after startup.
  #
  # ServerSideApply is what protects those writes, not this block. The applied
  # manifest carries no data key, so argocd-controller never enters the field
  # ownership set for it and server-side apply prunes only fields its own
  # manager owns. What the exclusion buys is silence: without it the
  # structured-merge diff reports the Secret OutOfSync forever. Freezing
  # everything under the pointer costs nothing here because the chart declares
  # no keys under data at all. Do not drop ServerSideApply believing this block
  # is the load-bearing half.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: polylane-k8s-state
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
