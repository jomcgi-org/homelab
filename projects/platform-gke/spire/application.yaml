apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Classic three-way diff for this app. Server-side diff (the controller
    # default here) dry-runs the StatefulSet and the API server hands back
    # volumeClaimTemplates[].metadata.creationTimestamp: null in the predicted
    # state only, so ignoreDifferences, which normalizes live and target
    # before the dry run, can never remove it and spire-server reads
    # OutOfSync forever (argoproj/argo-cd#24791, open at v3.1.8). The
    # jqPathExpressions below stay: they are needed either way.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    path: projects/platform/spire
    helm:
      releaseName: spire
      valueFiles:
        - values.yaml
        - values-gke.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: spire
  # Two ServerSideApply phantom diffs on the upstream StatefulSet
  # (docs/runbooks/argocd-outofsync.md, "Phantom OutOfSync from
  # ServerSideApply"): the chart renders readOnly: false on four volume mounts
  # and the API server drops the default, and the chart leaves protocol unset on
  # two container ports while the API server defaults protocol: TCP into the
  # list key, so ArgoCD's apply manager owns a key the manifest never declares.
  # Ignore exactly those two fields.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: spire-server
      jqPathExpressions:
        - .spec.template.spec.containers[].volumeMounts[].readOnly
        - .spec.template.spec.containers[].ports[].protocol
        # The API server stamps apiVersion, kind, and creationTimestamp into
        # volumeClaimTemplates on the live object. The server-side diff's
        # predicted state drops them, so the StatefulSet read OutOfSync
        # forever and selfHeal re-applied it every reconcile.
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
        - .spec.volumeClaimTemplates[].metadata.creationTimestamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
