apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Server-side diff for this app. ArgoCD 3.1 forces structured-merge diff
    # for any app with ServerSideApply=true, and that path re-serializes
    # volumeClaimTemplates[].metadata.creationTimestamp: null into the
    # predicted state AFTER ignoreDifferences ran, so spire-server read
    # OutOfSync forever (argoproj/argo-cd#24791, open at v3.1.8). The
    # server-side path normalizes the predicted state after its dry run,
    # so the jqPathExpressions below actually apply to it.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    path: projects/platform/spire
    helm:
      releaseName: spire
      valueFiles:
        - values.yaml
        - values-gke.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: spire
  # ServerSideApply phantom defaults on the upstream StatefulSet
  # (docs/runbooks/argocd-outofsync.md, "Phantom OutOfSync from
  # ServerSideApply"): the chart renders readOnly: false on four volume mounts
  # and the API server drops the default. Keep container port protocol in the
  # comparison: it is part of the associative list key. Removing it makes
  # server-side diff reject the normalized StatefulSet. The API server supplies
  # TCP during the dry run when the upstream chart omits it.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: spire-server
      jqPathExpressions:
        - .spec.template.spec.containers[].volumeMounts[].readOnly
        # The API server stamps apiVersion, kind, and creationTimestamp into
        # volumeClaimTemplates on the live object. The server-side diff's
        # predicted state drops them, so the StatefulSet read OutOfSync
        # forever and selfHeal re-applied it every reconcile.
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
        - .spec.volumeClaimTemplates[].metadata.creationTimestamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
