apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shared-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    path: projects/platform/spire
    helm:
      releaseName: spire
      valueFiles:
        - values.yaml
        - values-gke.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: spire
  # The upstream chart renders readOnly: false on four spire-server volume
  # mounts. The API server drops that default, so under ServerSideApply the
  # StatefulSet reads OutOfSync forever (docs/runbooks/argocd-outofsync.md,
  # "Phantom OutOfSync from ServerSideApply"). Ignore exactly that field.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: spire-server
      jqPathExpressions:
        - .spec.template.spec.containers[].volumeMounts[].readOnly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
