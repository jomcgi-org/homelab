apiVersion: onepassword.com/v1
kind: OnePasswordItem
type: kubernetes.io/dockerconfigjson
metadata:
  name: ghcr-imagepull-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: vaults/k8s-homelab/items/ghcr-read-permissions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-forecast
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-forecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-forecast
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest is required" .Values.image.digest) | quote }}
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus.prometheus.svc:9090
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: capacity-forecast
spec:
  selector:
    app.kubernetes.io/name: capacity-forecast
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capacity-forecast
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: capacity-forecast
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
