# The API server's sign-in from Authentik ID tokens, in addition to client
# certificates and ServiceAccount tokens.
#
# Installed to /etc/rancher/k3s/authentication-config.yaml by install-node.sh
# and named by kube-apiserver-arg in k3s-config.yaml. The API server reloads
# this file while it runs; adding or removing the flag needs a k3s restart.
#
# The token comes from the factory-kubectl client
# (projects/platform/authentik/factory-blueprints/factory-kubectl.yaml) through
# factory-kube.jomcgi.dev, where Envoy has checked it already
# (projects/platform-factory/edge/chart/templates/kube-api-route.yaml). RBAC
# binds the prefixed groups (projects/platform-factory/kube-access/). The
# prefix keeps an Authentik name from ever matching a Kubernetes user or group
# such as system:masters.
#
# The client certificate in ~/.kube/factory.yaml keeps working when Authentik
# is down. It is the break-glass path, on the LAN only.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
  - issuer:
      url: https://factory-auth.jomcgi.dev/application/o/factory-kubectl/
      audiences:
        - factory-kubectl
    claimMappings:
      username:
        claim: preferred_username
        prefix: "authentik:"
      groups:
        claim: groups
        prefix: "authentik:"
      uid:
        claim: sub
  - issuer:
      url: https://factory-auth.jomcgi.dev/application/o/factory-explore/
      audiences:
        - factory-explore
    claimMappings:
      username:
        claim: preferred_username
        prefix: "explore:"
      groups:
        expression: "['explore:explorers']"
      uid:
        claim: sub
    claimValidationRules:
      - expression: double(claims.exp) - double(claims.iat) <= 600.0
