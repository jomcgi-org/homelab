# Kernel same-page merging (KSM) off on a factory home node, installed to
# /etc/tmpfiles.d/ by ksm-off.sh (and so by install-node.sh). systemd-tmpfiles
# writes it at every boot. gVisor fork children share clean seed pages, so the
# nodes must not merge guest pages by content: a later MADV_MERGEABLE or
# PR_SET_MEMORY_MERGE on a sandbox process would otherwise start merging them.
# 0 stops the merge scan. The kernel default is 0, which nodes 2 and 3 have.
w /sys/kernel/mm/ksm/run - - - - 0
