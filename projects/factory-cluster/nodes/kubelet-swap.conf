# Kubelet drop-in, installed to /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/
# by install-node.sh. A Burstable container may swap to zram up to its memory
# request divided by node memory, times the swap size: about its request.
# Guaranteed and BestEffort pods get no swap. The kubelet sets the limit when
# it creates a container.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
memorySwap:
  swapBehavior: LimitedSwap
