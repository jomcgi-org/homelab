# systemd drop-in for k3s.service, installed by install-node.sh. k3s runs the
# API server, etcd and the kubelet in one Go process. On 2026-11-16 it held
# 0.3-0.5 GiB of live heap and let the heap reach twice that before each
# collection. GOGC=50 collects at 1.5 times, which spends spare CPU to keep
# about 150-250 MiB per node for pods.
[Service]
Environment=GOGC=50
