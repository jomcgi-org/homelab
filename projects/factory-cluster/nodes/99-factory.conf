# Factory home node kernel settings, installed to /etc/sysctl.d/ by
# install-node.sh.

# Agent Substrate: gVisor sandboxes reach pod-to-pod addresses through proxy
# ARP/NDP on the node (substrate hack/create-kind-cluster.sh step 2.5).
net.ipv4.conf.all.proxy_arp = 1
net.ipv6.conf.all.proxy_ndp = 1

# Agent Substrate: every sandbox holds a link-local neighbour entry. The kernel
# default ceiling (1024) overflows at about a thousand sandboxes per host.
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 16384
net.ipv4.neigh.default.gc_thresh3 = 32768

# Many controllers and agent workspaces each hold inotify watches.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
