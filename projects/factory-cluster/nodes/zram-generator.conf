# Swap for a factory home node, installed to /etc/systemd/zram-generator.conf
# by install-node.sh. The nodes have 12 cores and 16 GiB, so memory runs out
# first. Measured on 2026-11-16 (HOME-142), pod memory compressed 3.1-4.5:1
# and host memory 6.4:1. zram-size caps the uncompressed data, so a full
# device takes about 4-5 GiB of RAM. There is no disk swap: its I/O would
# share the one NVMe disk with etcd and the databases. A size change applies
# at the next boot.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
