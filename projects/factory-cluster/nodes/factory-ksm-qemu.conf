# systemd drop-in for qemu-kvm.service, installed by ksm-off.sh on a node that
# has the qemu-system-common package (node-1 does). That unit runs
# /usr/share/qemu/init/qemu-kvm-init at every boot, which turns KSM ON when
# KSM_ENABLED is AUTO (the package default) and the host is not a VM. The unit
# can run after systemd-tmpfiles, so factory-ksm.conf alone is not enough.
# ExecStartPost runs after the init script in the same unit, so KSM ends off. The
# leading "-" keeps a kernel without KSM from failing the unit.
[Service]
ExecStartPost=-/bin/sh -c 'echo 0 > /sys/kernel/mm/ksm/run'
