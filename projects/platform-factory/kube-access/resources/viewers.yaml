# Read-only kubectl for friends and colleagues in the Authentik group
# factory-kube-viewers (Joe's decision, HOME-310). They see workloads and their
# logs in the namespaces below and run nothing: no Secrets, no ConfigMaps, no
# exec, port-forward or proxy, no writes.
#
# The role is an explicit list, not the built-in view role, so a CRD that
# aggregates into view cannot widen it. A namespace is listed only when its
# objects and logs carry no private data. The factory, agent, memory and
# Authentik namespaces stay out: their pods and logs hold ticket text, chat
# history and sign-in details. kube_access_test.py pins the read-only verbs,
# the forbidden resources and this namespace list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-viewer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
      - persistentvolumeclaims
      - serviceaccounts
      - resourcequotas
      - limitranges
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [kargo.akuity.io]
    resources: [warehouses, stages, freights, promotions]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups, scheduledbackups]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
# Enough cluster-scoped reads to find the namespaces and see the nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-viewer-cluster
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-factory-kube-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-viewer-cluster
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authentik:factory-kube-viewers"
---
