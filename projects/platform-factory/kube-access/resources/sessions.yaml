apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-sessions
# New API groups need an explicit entry. A wildcard group would include core Secrets.
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups:
      - acme.cert-manager.io
      - admissionregistration.k8s.io
      - api.kagent.dev
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - argoproj.io
      - ate.dev
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - cert-manager.io
      - certificates.k8s.io
      - cfgate.io
      - cilium.io
      - coordination.k8s.io
      - deuxfleurs.fr
      - discovery.k8s.io
      - embervm.dev
      - events.k8s.io
      - external-secrets.io
      - flowcontrol.apiserver.k8s.io
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - generators.external-secrets.io
      - helm.cattle.io
      - k3s.cattle.io
      - kargo.akuity.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - networking.k8s.io
      - node.k8s.io
      - oci-model-cache.jomcgi.dev
      - onepassword.com
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-sessions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-sessions
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authentik:factory-kube-sessions"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-sessions
  namespace: factory
rules:
  - apiGroups: [""]
    resources: [pods/portforward]
    resourceNames: [factory-itsaplan-session-forward-0]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [factory-itsaplan-joe-sessions]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-sessions
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-sessions
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authentik:factory-kube-sessions"
