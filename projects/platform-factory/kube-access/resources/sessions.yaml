apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-node1-sessions
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-sessions
# New API groups need an explicit entry. A wildcard group would include core Secrets.
# Core rules list every readable subresource except the stream and proxy ones:
# a GET on pods/exec, pods/attach, pods/portforward, pods/proxy, nodes/proxy
# or services/proxy opens a channel that runs commands in a pod or sends
# requests to the kubelet or a workload. Those are writes, and sessions get
# no writes except the named port-forward below.
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - pods
      - pods/ephemeralcontainers
      - pods/log
      - pods/resize
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs: [get, list, watch]
  - apiGroups:
      - acme.cert-manager.io
      - admissionregistration.k8s.io
      - api.kagent.dev
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - argoproj.io
      - ate.dev
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - cert-manager.io
      - certificates.k8s.io
      - cfgate.io
      - cilium.io
      - coordination.k8s.io
      - deuxfleurs.fr
      - discovery.k8s.io
      - embervm.dev
      - events.k8s.io
      - external-secrets.io
      - flowcontrol.apiserver.k8s.io
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
      - generators.external-secrets.io
      - helm.cattle.io
      - internal.apiserver.k8s.io
      - k3s.cattle.io
      - kargo.akuity.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - networking.k8s.io
      - node.k8s.io
      - oci-model-cache.jomcgi.dev
      - onepassword.com
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
      - storagemigration.k8s.io
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-sessions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-sessions
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authentik:factory-kube-sessions"
  - kind: ServiceAccount
    name: factory-node1-sessions
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-sessions
  namespace: factory
rules:
  - apiGroups: [""]
    resources: [pods/portforward]
    resourceNames: [factory-itsaplan-session-forward-0]
    # kubectl port-forward over WebSocket authorizes as get; SPDY as create.
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [factory-itsaplan-joe-sessions]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-sessions
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-sessions
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authentik:factory-kube-sessions"
  - kind: ServiceAccount
    name: factory-node1-sessions
    namespace: kube-system
