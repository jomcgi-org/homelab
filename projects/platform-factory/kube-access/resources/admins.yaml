# Authentik Admins hold cluster-admin through kubectl at factory-kube.jomcgi.dev
# (projects/factory-cluster/README.md, "kubectl through Authentik"). The API
# server prefixes every Authentik group with "authentik:"
# (projects/factory-cluster/nodes/authentication-config.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authentik:authentik Admins"
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authentik:factory-operators"
