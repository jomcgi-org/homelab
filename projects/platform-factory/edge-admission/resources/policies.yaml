# invariant: PLAT-3
# The factory cluster's only internet path is Cloudflare Tunnel, then the cfgate
# Gateway, then the Envoy Gateway in `edge`, which signs every request in through
# Authentik. These policies keep every piece of that path inside `edge` (and
# `cfgate-system` for the tunnel Gateway), so nothing elsewhere can publish a
# hostname, run a proxy under the edge's identity or replace the gateway-wide
# SecurityPolicy.
#
# They are ValidatingAdmissionPolicies, evaluated by the API server for every
# namespace including kube-system, kube-public and kube-node-lease.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-edge-namespace-label
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  validations:
    - expression: >-
        object.metadata.name == 'edge' ||
        !has(object.metadata.labels) ||
        !('factory.jomcgi.dev/edge' in object.metadata.labels)
      message: Only the edge namespace may carry the factory.jomcgi.dev/edge label.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-edge-namespace-label
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  policyName: factory-edge-namespace-label
  validationActions: [Deny]
---
# Only the two GatewayClasses that exist. Another class naming Envoy Gateway's
# controller would let a namespace run its own proxy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-edge-gatewayclasses
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [gatewayclasses]
  validations:
    - expression: >-
        (object.metadata.name == 'edge' &&
         object.spec.controllerName == 'gateway.envoyproxy.io/gatewayclass-controller' &&
         has(object.spec.parametersRef) &&
         object.spec.parametersRef.kind == 'EnvoyProxy' &&
         object.spec.parametersRef.name == 'edge' &&
         has(object.spec.parametersRef.namespace) &&
         object.spec.parametersRef.namespace == 'edge')
        ||
        (object.metadata.name == 'cfgate' &&
         object.spec.controllerName == 'cfgate.io/cloudflare-tunnel-controller' &&
         !has(object.spec.parametersRef))
      message: The only GatewayClasses are `edge` (Envoy Gateway, EnvoyProxy edge/edge) and `cfgate`.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-edge-gatewayclasses
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  policyName: factory-edge-gatewayclasses
  validationActions: [Deny]
---
# One Gateway per class, in its own namespace, with no per-Gateway EnvoyProxy
# override and no ListenerSets.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-edge-gateways
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [gateways]
  validations:
    - expression: >-
        object.spec.gatewayClassName != 'edge' ||
        (request.namespace == 'edge' && object.metadata.name == 'edge')
      message: Gateways of class edge belong in the edge namespace (edge/edge only).
    - expression: >-
        object.spec.gatewayClassName != 'cfgate' ||
        (request.namespace == 'cfgate-system' && object.metadata.name == 'cloudflare-tunnel')
      message: Gateways of class cfgate belong in cfgate-system (cloudflare-tunnel only).
    - expression: >-
        !has(object.spec.infrastructure) || !has(object.spec.infrastructure.parametersRef)
      message: A Gateway may not override its class's EnvoyProxy.
    - expression: "!has(object.spec.allowedListeners)"
      message: ListenerSets may not attach to Gateways on this cluster.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-edge-gateways
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  policyName: factory-edge-gateways
  validationActions: [Deny]
---
# EnvoyProxy shapes the proxy Deployment (labels, volumes, patches). A route
# SecurityPolicy replaces the gateway-wide one; the other kinds can rewrite the
# listener or filter chain, or add arbitrary backends.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-edge-envoy-resources
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.envoyproxy.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources:
          - envoyproxies
          - securitypolicies
          - envoypatchpolicies
          - envoyextensionpolicies
          - clienttrafficpolicies
          - backends
  validations:
    - expression: request.namespace == 'edge'
      message: >-
        EnvoyProxy, SecurityPolicy, EnvoyPatchPolicy, EnvoyExtensionPolicy,
        ClientTrafficPolicy and Backend objects belong in the edge namespace.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-edge-envoy-resources
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  policyName: factory-edge-envoy-resources
  validationActions: [Deny]
---
# A route on the tunnel publishes a hostname. Any parentRef into cfgate-system
# counts, whatever the Gateway's name. Only an HTTPRoute in edge may attach,
# its only backend is the edge-proxy Service, and it carries no filters (a
# RequestMirror would copy traffic elsewhere).
#
# factory-auth.jomcgi.dev is routed only from edge, where its route blocks
# Authentik's admin interface and API.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-edge-routes
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [httproutes, grpcroutes, tcproutes, tlsroutes, udproutes]
  variables:
    - name: onTunnel
      expression: >-
        has(object.spec.parentRefs) && object.spec.parentRefs.exists(p,
          (has(p.namespace) ? p.namespace : request.namespace) == 'cfgate-system')
  validations:
    - expression: >-
        !variables.onTunnel ||
        (request.kind.kind == 'HTTPRoute' &&
         request.namespace == 'edge' &&
         (!has(object.spec.rules) || object.spec.rules.all(r,
           !has(r.filters) &&
           (!has(r.backendRefs) || r.backendRefs.all(b,
             b.name == 'edge-proxy' &&
             (!has(b.kind) || b.kind == 'Service') &&
             (!has(b.group) || b.group == '') &&
             (!has(b.namespace) || b.namespace == 'edge') &&
             !has(b.filters))))))
      message: >-
        Only an HTTPRoute in edge may attach to the tunnel Gateway, with the
        edge-proxy Service as its only backend and no filters.
    - expression: >-
        request.namespace == 'edge' ||
        !has(object.spec.hostnames) ||
        !object.spec.hostnames.exists(h, h == 'factory-auth.jomcgi.dev')
      message: Only the edge namespace may route factory-auth.jomcgi.dev.
    - expression: >-
        request.namespace == 'edge' ||
        !has(object.spec.hostnames) ||
        !object.spec.hostnames.exists(h, h == 'factory-agents.jomcgi.dev')
      message: Only the edge namespace may route factory-agents.jomcgi.dev.
    - expression: >-
        !has(object.spec.hostnames) ||
        !object.spec.hostnames.exists(h, h == 't3.jomcgi.dev') ||
        (request.kind.kind == 'HTTPRoute' && request.namespace == 'edge' &&
         ((object.metadata.name == 't3' && object.spec.hostnames == ['t3.jomcgi.dev'] &&
           has(object.spec.parentRefs) && size(object.spec.parentRefs) == 1 &&
           object.spec.parentRefs.all(p,
             p.name == 'edge' && p.sectionName == 'http' &&
             (!has(p.namespace) || p.namespace == 'edge') &&
             (!has(p.group) || p.group == 'gateway.networking.k8s.io') &&
             (!has(p.kind) || p.kind == 'Gateway'))) ||
          (object.metadata.name == 'tunnel' && variables.onTunnel)))
      message: Only edge/t3 and the edge tunnel may route t3.jomcgi.dev.
    - expression: request.namespace != 't3'
      message: The T3 relay namespace may not create routes.
    - expression: >-
        request.kind.kind != 'HTTPRoute' || !has(object.spec.rules) ||
        object.spec.rules.all(r,
          (!has(r.backendRefs) || r.backendRefs.all(b,
            !has(b.namespace) || b.namespace != 't3' ||
            (request.namespace == 'edge' && object.metadata.name == 't3' &&
             object.spec.hostnames == ['t3.jomcgi.dev'] &&
             b.name == 't3-relay' && (!has(b.group) || b.group == '') &&
             (!has(b.kind) || b.kind == 'Service') && b.port == 8080 &&
             !has(b.filters) && !has(r.filters)))) &&
          (!has(r.backendRefs) || r.backendRefs.all(b,
            !has(b.filters) || b.filters.all(f, !has(f.requestMirror) ||
              !has(f.requestMirror.backendRef.namespace) ||
              f.requestMirror.backendRef.namespace != 't3'))) &&
          (!has(r.filters) || r.filters.all(f, !has(f.requestMirror) ||
            !has(f.requestMirror.backendRef.namespace) ||
            f.requestMirror.backendRef.namespace != 't3')))
      message: Only the T3 HTTPS route may use the relay as a backend.
    # Its route replaces the gateway sign-in with a bearer check and reaches
    # the Kubernetes API.
    - expression: >-
        request.namespace == 'edge' ||
        !has(object.spec.hostnames) ||
        !object.spec.hostnames.exists(h, h == 'factory-kube.jomcgi.dev')
      message: Only the edge namespace may route factory-kube.jomcgi.dev.
    - expression: >-
        request.namespace == 'edge' ||
        !has(object.spec.hostnames) ||
        !object.spec.hostnames.exists(h, h == 'scotland-mcp.jomcgi.dev')
      message: Only the edge namespace may route scotland-mcp.jomcgi.dev.
    - expression: >-
        request.namespace in ['edge', 'factory-landing'] ||
        !has(object.spec.hostnames) ||
        !object.spec.hostnames.exists(h, h == 'factory.jomcgi.dev')
      message: Only edge and factory-landing may route factory.jomcgi.dev.
    - expression: >-
        request.namespace == 'edge' ||
        !has(object.spec.hostnames) ||
        !object.spec.hostnames.exists(h, h == 'factory-explore-api.jomcgi.dev')
      message: Only the edge namespace may route factory-explore-api.jomcgi.dev.
    # itsaplan's namespace routes its own hostname and nothing else, so a
    # route there cannot take over another application's host.
    - expression: >-
        request.namespace != 'factory' ||
        (has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
         object.spec.hostnames.all(h, h == 'factory-plan.jomcgi.dev'))
      message: >-
        Routes in the factory namespace must name only factory-plan.jomcgi.dev.
    # Likewise Grafana's.
    - expression: >-
        request.namespace != 'grafana' ||
        (has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
         object.spec.hostnames.all(h, h in ['factory-grafana.jomcgi.dev', 'factory-runbooks.jomcgi.dev']))
      message: >-
        Routes in the grafana namespace must name only factory-grafana.jomcgi.dev or factory-runbooks.jomcgi.dev.
    - expression: >-
        request.namespace != 'factory-landing' ||
        (has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
         object.spec.hostnames.all(h, h == 'factory.jomcgi.dev'))
      message: Routes in factory-landing must name only factory.jomcgi.dev.
    - expression: >-
        request.namespace != 'argocd' ||
        (has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
         object.spec.hostnames.all(h, h == 'factory-argocd.jomcgi.dev'))
      message: Routes in argocd must name only factory-argocd.jomcgi.dev.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-edge-routes
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  policyName: factory-edge-routes
  validationActions: [Deny]
---
# cfgate turns these into Cloudflare tunnels and DNS records; outside
# cfgate-system they could publish hostnames around the edge.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-edge-cfgate-resources
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cfgate.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [cloudflarednses, cloudflaretunnels]
  validations:
    - expression: request.namespace == 'cfgate-system'
      message: CloudflareDNS and CloudflareTunnel objects belong in cfgate-system.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-edge-cfgate-resources
  annotations:
    # Deleting this Application must not drop the guards while the edge runs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  policyName: factory-edge-cfgate-resources
  validationActions: [Deny]
---
# Reserve the socket and its parent directories, including Ubuntu's /var/run
# alias. Only the ReplicaSet controller can admit the dedicated relay Pod.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-t3-socket
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: reserved
      expression: >-
        has(object.spec.volumes) ?
        object.spec.volumes.filter(v, has(v.hostPath) &&
          (v.hostPath.path.matches('^/+$') ||
           v.hostPath.path.matches('^/+var/*$') ||
           v.hostPath.path.matches('^/+(var/+)?run/*$') ||
           v.hostPath.path.matches('^/+(var/+)?run/+t3-cluster(/.*)?$') ||
           v.hostPath.path.matches('(^|/)\\.\\.?(/|$)'))) : []
  validations:
    - expression: >-
        size(variables.reserved) == 0 ||
        (request.subResource == '' &&
         request.userInfo.username == 'system:serviceaccount:kube-system:replicaset-controller' &&
         request.namespace == 't3' &&
         object.spec.serviceAccountName == 't3-relay' &&
         has(object.metadata.ownerReferences) &&
         object.metadata.ownerReferences.exists(ref,
           ref.apiVersion == 'apps/v1' && ref.kind == 'ReplicaSet' &&
           has(ref.controller) && ref.controller && ref.name.startsWith('t3-relay-')) &&
         variables.reserved.all(v, v.hostPath.path == '/run/t3-cluster' &&
           has(v.hostPath.type) && v.hostPath.type == 'Directory'))
      message: Only the t3 relay may mount the node's T3 socket directory.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-t3-socket
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: factory-t3-socket
  validationActions: [Deny]
---
# Guard the owner chain. A caller who can write other namespaces cannot name a
# Deployment or ReplicaSet that gets the controller's Pod admission identity.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-t3-relay-owners
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, replicasets]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [configmaps, services, serviceaccounts]
  matchConditions:
    - name: t3
      expression: request.namespace == 't3'
  validations:
    - expression: >-
        (!object.metadata.name.startsWith('t3-relay') &&
         request.resource.resource in ['configmaps', 'services', 'serviceaccounts'])
        ||
        (request.resource.resource in ['deployments', 'configmaps', 'services', 'serviceaccounts'] &&
         request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller')
        ||
        (request.resource.resource == 'replicasets' &&
         request.userInfo.username == 'system:serviceaccount:kube-system:deployment-controller')
      message: Argo CD and the Deployment controller own the T3 relay workloads.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-t3-relay-owners
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: factory-t3-relay-owners
  validationActions: [Deny]
