apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cfgate
spec:
  controllerName: cfgate.io/cloudflare-tunnel-controller
---
# Routes attach to the tunnel only from the `edge` namespace, which runs the
# authenticated Envoy Gateway (projects/platform-factory/edge/). The selector
# needs both the edge label and the apiserver-set name label, so labelling
# another namespace is not enough; Kyverno also refuses the label anywhere else
# and refuses any tunnel route whose backend is not the Envoy proxy. An
# application therefore cannot publish itself by writing an HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloudflare-tunnel
  namespace: cfgate-system
  annotations:
    cfgate.io/tunnel-ref: cfgate-system/factory
spec:
  gatewayClassName: cfgate
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        # group is the schema default, stated so ArgoCD's diff owns it.
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              factory.jomcgi.dev/edge: "true"
              kubernetes.io/metadata.name: edge
