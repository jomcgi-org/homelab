apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The factory cluster's only path from the internet: one Cloudflare Tunnel, a
# Gateway that accepts routes only from namespaces labelled
# factory.jomcgi.dev/edge=true, and DNS only for routes annotated
# factory.jomcgi.dev/publish=true. No namespace carries the label yet, so
# nothing is published and the tunnel answers 404.
resources:
  - tunnel.yaml
  - gateway.yaml
  - dns.yaml
