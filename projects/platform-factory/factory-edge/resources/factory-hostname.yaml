# factory.jomcgi.dev, the private operator entry point (#7817).
#
# The TunnelBinding adds the hostname to the tunnel's ingress and creates the
# proxied DNS record for it. The Access application gates the hostname at
# Cloudflare's edge before anything reaches the cluster.
#
# Until itsaplan is deployed the hostname serves the ArgoCD UI.
apiVersion: networking.cloudflare-operator.io/v1alpha1
kind: TunnelBinding
metadata:
  name: factory
  namespace: argocd
subjects:
  - kind: Service
    name: argocd-server
    spec:
      fqdn: factory.jomcgi.dev
      protocol: http
tunnelRef:
  kind: ClusterTunnel
  name: factory
---
# Membership of the factory-operators Access group is kept in the Cloudflare
# account, not here: the repository is public and the group lists personal
# email addresses. The operator resolves the group by name.
apiVersion: networking.cloudflare-operator.io/v1alpha2
kind: AccessApplication
metadata:
  name: factory
  namespace: cloudflare-operator-system
spec:
  name: factory
  domain: factory.jomcgi.dev
  type: self_hosted
  sessionDuration: 24h
  appLauncherVisible: true
  policies:
    - cloudflareGroupName: factory-operators
      decision: allow
      precedence: 1
      policyName: factory-operators
  cloudflare:
    accountId: "7c56b458cd657d96b095c63d181c051f"
    domain: jomcgi.dev
    secret: cloudflare-api-credentials
