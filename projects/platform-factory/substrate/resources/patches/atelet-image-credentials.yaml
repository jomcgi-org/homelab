# Private ghcr.io pulls for the atelet (HOME-539). The chart mounts the
# credential plugin directory from the host; this replaces it with an emptyDir
# that the init container fills from the private credential-provider image.
# The GHCR read login is mounted into the atelet container only, which runs
# the plugin; actors never see it. resources_test.py keeps the image digest
# equal to //projects/platform-factory/substrate/credential-provider:image.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet
  namespace: ate-system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      initContainers:
        - name: install-credential-provider
          image: ghcr.io/jomcgi/homelab/projects/platform-factory/substrate/credential-provider@sha256:0a9b61289d65d3b741c81c6fe041482c2d663fb2116f4082e27870bef7e5d036 # ratchet-allow: image-digest (kustomize has no build pin; resources_test keeps it equal to the Bazel image digest)
          args:
            - install
            - /plugins/ghcr-credential-provider
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: image-credential-provider-bin
              mountPath: /plugins
      containers:
        - name: atelet
          volumeMounts:
            - name: ghcr-pull
              mountPath: /run/ghcr-pull
              readOnly: true
      volumes:
        # kubelet creates an emptyDir with mode 0777, so the non-root installer
        # can write the plugin (kubernetes pkg/volume/emptydir/empty_dir.go).
        - name: image-credential-provider-bin
          hostPath: null
          emptyDir: {}
        - name: ghcr-pull
          secret:
            secretName: ghcr-imagepull-secret
            defaultMode: 0400
