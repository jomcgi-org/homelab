# The bundled PostgreSQL. ate-setup creates the database's Substrate roles and
# schema by piping pkg/postgressetup's script into psql in this pod after each
# rollout; here the postStart hook runs the same script on every start. It is
# idempotent and holds no password: the two login roles authenticate with
# pod certificates (pg_hba.conf in upstream/postgres.yaml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  template:
    spec:
      containers:
        - name: postgres
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    until psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
                      sleep 1
                    done
                    if ! psql -U "${POSTGRES_USER}" -d postgres -Atc \
                      "SELECT 1 FROM pg_database WHERE datname = 'atepg'" | grep -qx 1; then
                      createdb -U "${POSTGRES_USER}" atepg
                    fi
                    psql --no-psqlrc --set=ON_ERROR_STOP=1 --single-transaction \
                      -U "${POSTGRES_USER}" -d atepg \
                      --set=substrate_schema=substrate \
                      --set=substrate_owner_role=substrate_owner \
                      --set=substrate_owner_user=substrate_owner_user \
                      --set=substrate_owner_password= \
                      --set=substrate_readwrite_role=substrate_readwrite \
                      --set=substrate_readwrite_user=substrate_readwrite_user \
                      --set=substrate_readwrite_password= \
                      -f /etc/postgresql-setup/setup.sql >/dev/null
          # Upstream sizes this for a dedicated node (2 CPU request, 16 limit);
          # the kind overlay's request, with room to burst on a 12-core node.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
          volumeMounts:
            - name: setup
              mountPath: /etc/postgresql-setup
              readOnly: true
      volumes:
        - name: setup
          configMap:
            name: postgres-setup
