# The objectstore-plugin sidecar of ate-api-server and atelet: S3 against the
# rustfs in snapshot-store.yaml instead of GCS. Upstream's kind/ate-api-server
# and kind/atelet overlays set the same variables, with a fixed key. The test
# ops make an upstream change to this container fail the build.
- op: test
  path: /spec/template/spec/initContainers/0/name
  value: objectstore-plugin
- op: test
  path: /spec/template/spec/initContainers/0/env/0
  value:
    name: ATE_STORAGE_BACKEND
    value: gcs
- op: replace
  path: /spec/template/spec/initContainers/0/env/0/value
  value: s3
- op: add
  path: /spec/template/spec/initContainers/0/env/-
  value:
    name: AWS_REGION
    value: us-east-1
- op: add
  path: /spec/template/spec/initContainers/0/env/-
  value:
    name: AWS_ENDPOINT_URL
    value: http://rustfs.ate-system.svc:9000
- op: add
  path: /spec/template/spec/initContainers/0/env/-
  value:
    name: AWS_S3_USE_PATH_STYLE
    value: "true"
- op: test
  path: /spec/template/spec/initContainers/0/envFrom
  value:
    - configMapRef:
        name: ate-otel-config
- op: add
  path: /spec/template/spec/initContainers/0/envFrom/-
  value:
    secretRef:
      name: snapshot-store-credentials
