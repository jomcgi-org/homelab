# atelet without the GKE image credential provider: the two
# --image-credential-provider-* flags and the host mounts that served them
# are removed, as upstream's kind/atelet overlay does. atelet then pulls actor
# images anonymously. Each removal tests what it removes, so an upstream
# reorder fails the build instead of dropping something else.
- op: test
  path: /spec/template/spec/containers/0/name
  value: atelet
- op: test
  path: /spec/template/spec/containers/0/args/1
  value: --image-credential-provider-bin-dir=/run/image-credential-provider/bin
- op: remove
  path: /spec/template/spec/containers/0/args/1
- op: test
  path: /spec/template/spec/containers/0/args/0
  value: --image-credential-provider-config=/run/image-credential-provider/config.yaml
- op: remove
  path: /spec/template/spec/containers/0/args/0
- op: test
  path: /spec/template/spec/containers/0/volumeMounts/8/mountPath
  value: /run/image-credential-provider/config.yaml
- op: remove
  path: /spec/template/spec/containers/0/volumeMounts/8
- op: test
  path: /spec/template/spec/containers/0/volumeMounts/7/mountPath
  value: /run/image-credential-provider/bin
- op: remove
  path: /spec/template/spec/containers/0/volumeMounts/7
- op: test
  path: /spec/template/spec/volumes/7/name
  value: image-credential-provider-config
- op: remove
  path: /spec/template/spec/volumes/7
- op: test
  path: /spec/template/spec/volumes/6/name
  value: image-credential-provider-bin
- op: remove
  path: /spec/template/spec/volumes/6
