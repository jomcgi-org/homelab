# Only the egress gateway may reach the provider's gRPC port; every other
# connection to the provider pods is dropped. The provider also pins the
# client certificate to the gateway's identity (see the Deployment), so this
# keeps other pods from reaching it at all. Takes effect only on a cluster
# whose network plugin enforces NetworkPolicy, such as GKE Dataplane V2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 50051
---
# The credential provider: a gRPC service that resolves ate-secret:// URIs
# of the k8s.io class to Kubernetes Secret values. It is the ONLY
# component in the egress credential-injection path with Kubernetes access; the
# egress gateway and the injector never read Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-credential-provider
  namespace: ate-system
