    policies: [{"allowedNamespaces":["kagent"],"atespace":"kagent","secretSelector":{"matchLabels":{"substrate.ate.dev/injectable":"true"}}},{"allowedNamespaces":["factory-r-homelab"],"atespace":"factory-r-homelab","secretSelector":{"matchLabels":{"substrate.ate.dev/injectable":"true"}}}]
