---
# Per-sandbox-class asset requirements for SandboxConfig. The CRD schema is
# generic (any arch -> any asset name -> {url, sha256}); this policy enforces the
# requirements a given sandbox class actually needs on every version under
# spec.versions, fail-closed at apply time.
# (url/sha256 being required and well-formed is enforced by the CRD schema.)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandboxconfig-assets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["ate.dev"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["sandboxconfigs"]
  validations:
  # gVisor needs a "gvisor" release-tarball asset (gvisor.tar.zstd: runsc plus
  # its gvisor-bin/ helpers) for every architecture it advertises.
  - expression: >-
      object.spec.sandboxClass != 'gvisor' ||
      object.spec.versions.all(v,
        has(v.assets) && size(v.assets) > 0 &&
        v.assets.all(arch, 'gvisor' in v.assets[arch]))
    message: "a gvisor SandboxConfig must define a 'gvisor' (release tarball) asset for every architecture of every version under spec.versions[].assets"
  # The micro-VM (cloud-hypervisor) runtime needs its asset set for every
  # architecture it advertises.
  - expression: >-
      object.spec.sandboxClass != 'microvm' ||
      object.spec.versions.all(v,
        has(v.assets) && size(v.assets) > 0 &&
        v.assets.all(arch,
          ['cloud-hypervisor', 'virtiofsd', 'kata-kernel', 'kata-image']
            .all(name, name in v.assets[arch])))
    message: "a microvm SandboxConfig must define cloud-hypervisor, virtiofsd, kata-kernel, and kata-image assets for every architecture of every version under spec.versions[].assets"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandboxconfig-assets
spec:
  policyName: sandboxconfig-assets
  validationActions: ["Deny"]
