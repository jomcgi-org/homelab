# ate-idp-server serves the OpenID discovery document and key set relying
# parties use to verify actor JWTs. It needs no Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-idp-server
  namespace: ate-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: idp
  namespace: ate-system
spec:
  selector:
    app: ate-idp-server
  ports:
  - name: https
    port: 443
    targetPort: https
    appProtocol: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-idp-server
  namespace: ate-system
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ate-idp-server
  template:
    metadata:
      labels:
        app: ate-idp-server
    spec:
      serviceAccountName: ate-idp-server
      containers:
      - name: ate-idp-server
        image: ghcr.io/kagent-dev/substrate/ate-idp-server:v1.0.1@sha256:f27e38b0616c22caf067612105f569bd8ec54860bb6a6bb36862fd1d6130060a
        resources:
          {}
        args:
        - "--issuer=https://idp.ate-system.svc"
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        ports:
        - name: https
          containerPort: 8443
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # The serving certificate, with a DNS SAN for each Service that
        # selects the pod.
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
        - name: actor-id-jwt-pool
          mountPath: /run/actor-id-jwt-pool
      volumes:
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # The pool ate-api-server signs with.
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              name: actor-id-jwt-pool
              items:
              - key: pool
                path: pool.json
