apiVersion: v1
kind: ConfigMap
metadata:
  name: atenet-router-agentgateway-config
  namespace: ate-system
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      statsAddr: 0.0.0.0:15020
      # Actor sandboxes behind a worker IP are replaced between requests. Do
      # not retain an idle connection that may belong to the previous actor.
      backend:
        poolMaxSize: 0
        # Actor CONNECT authorities resolve through the worker atunnel.
        allowDynamicLoopback: true
    frontendPolicies:
      networkAuthorization:
        rules:
        - allow: >-
            source.spiffeId in ["spiffe://cluster.local/ns/ate-system/sa/atenet-client","spiffe://cluster.local/ns/kagent/sa/kagent-controller"]

    backends:
    - name: dynamic
      dynamic: {}
      policies:
        http:
          version: HTTP/1.1
        backendTunnel:
          proxy:
            backend: /dynamic
          mode: connect
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
              insecureHost: true

    gateways:
      https:
        port: 8443
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/podidentity.podcert.ate.dev/trust-bundle.pem

    routes:
    - name: substrate-actors
      gateways:
      - https
      matches:
      - path:
          pathPrefix: /
      policies: &substrate-ingress
        # Reject duplicates in both CONNECT and inner request headers, even
        # when actor selection uses only one of those header maps.
        directResponse:
          conditional:
          - condition: >-
              ('ate-target-actor' in source.connectHeaders &&
               size(source.connectHeaders.raw()['ate-target-actor']) != 1) ||
              ('ate-target-actor' in request.headers &&
               size(request.headers.raw()['ate-target-actor']) != 1)
            status: 404
            body: Invalid ate-target-actor header
        substrateIngress:
          host: api.ate-system.svc:443
          requestParking:
            budget: "60s"
          # AgentGateway only uses atunnel's CONNECT listener.
          connectTargetPort: 8443
          policies:
            http:
              requestTimeout: "60s"
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/servicedns-ca/trust-bundle.pem
      backends:
      - backend: /dynamic
    - name: substrate-actors-grpc
      gateways:
      - https
      matches: &grpc-matches
      - method: POST
        headers:
        - name: content-type
          value:
            regex: '(?i)^application/grpc([+;].*)?$'
      policies: *substrate-ingress
      backends: &grpc-backends
      - backend: /dynamic
        policies:
          http:
            version: HTTP/2.0

    # Terminate client CONNECT before internal HTTP routing.
    binds:
    - port: 8444
      tunnelProtocol: connect
      listeners:
      - protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
        routes: []
    - mode: internal
      listeners:
      - protocol: HTTP
        routes:
        - name: substrate-actors-tunneled
          matches:
          - path:
              pathPrefix: /
          policies: *substrate-ingress
          backends:
          - backend: /dynamic
        - name: substrate-actors-tunneled-grpc
          matches: *grpc-matches
          policies: *substrate-ingress
          backends: *grpc-backends
