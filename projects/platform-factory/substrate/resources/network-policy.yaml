# Agent Substrate's allowlist under the cluster-wide default-deny
# (projects/platform-factory/network-policy/resources/baseline.yaml).
#
# Ingress inside ate-system follows upstream's NetworkPolicies
# (upstream/ate-system-networkpolicies.yaml), which Cilium enforces alongside
# these, and ate-controller gives each WorkerPool a NetworkPolicy admitting
# only atenet-router. This file adds the egress each component needs, and
# ingress for the pieces upstream's policies do not cover.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: ate-api-server
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Worker control on each node's atelet.
    - toEndpoints:
        - matchLabels:
            app: atelet
      toPorts:
        - ports:
            - port: "21998"
              protocol: TCP
    # The objectstore-plugin sidecar: snapshots, and the actor JWT issuer's
    # OIDC discovery for its credential exchange.
    - toEndpoints:
        - matchLabels:
            app: rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: ate-idp-server
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ate-controller
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: ate-controller
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app: ate-api-server
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atelet
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: atelet
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app: ate-api-server
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            # The snapshot credential exchange.
            - port: "8445"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # atelet itself fetches the gVisor release its SandboxConfig names
    # (gs://gvisor, read anonymously) and pulls actor images, anonymously,
    # from GHCR and Docker Hub. An actor image from another registry adds it
    # here.
    - toFQDNs:
        - matchName: storage.googleapis.com
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        # atelet names Docker Hub index.docker.io, as go-containerregistry does.
        - matchName: index.docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: production.cloudfront.docker.com
        # Docker's documented anonymous-pull blob host.
        - matchName: docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: atenet-router
  egress:
    - toEndpoints:
        - matchLabels:
            app: ate-api-server
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Actors, through the atunnel listener of worker pods in any namespace
    # (connectTargetPort in the router's config).
    - toEndpoints:
        - matchExpressions:
            - key: ate.dev/worker-pool
              operator: Exists
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
# The egress gateway (agentgateway) checks each actor with ate-api-server and
# fetches injected credentials from the credential provider. Actor traffic
# beyond the destinations below is not allowed: opening more is a reviewed
# change here, with the actors' own egress policy (EgressPolicy) as the finer
# control.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atenet-egress
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: atenet-egress
  egress:
    - toEndpoints:
        - matchLabels:
            app: ate-api-server
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: k8s-credential-provider
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
    # Agent runtimes reach the kagent controller's task store through the
    # gateway (the factory chart's kagent-controller policy admits it).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
    # The factory credential broker's Codex relay, with the actor JWT the
    # gateway injects (projects/factory/chart, broker-network-policy.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory
            app.kubernetes.io/name: factory-broker
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # git over HTTPS for factory repository bindings, with the broker-minted
    # token the gateway injects (EgressPolicy github-git).
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The k8s.io credential provider reads the Secrets each actor's atespace is
# granted (credentialProvider.namespacePolicies in ../values/substrate.yaml).
# Upstream's NetworkPolicy admits only the egress gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: k8s-credential-provider
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ate-idp-server
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: ate-idp-server
  egress:
    - toEntities: [kube-apiserver]
---
# The snapshot store: reached by the objectstore-plugin sidecars and the
# bucket Job; it reaches nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rustfs
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: rustfs
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values: [ate-api-server, atelet, rustfs-bucket-init]
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rustfs-bucket-init
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: rustfs-bucket-init
  egress:
    - toEndpoints:
        - matchLabels:
            app: rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: podcertificate-controller
  namespace: podcertificate-controller-system
spec:
  endpointSelector:
    matchLabels:
      app: podcertificate-controller
  egress:
    - toEntities: [kube-apiserver]
---
# Worker pods, in whichever namespace their WorkerPool lives: actor traffic
# leaves only through the egress gateway. atelet reaches its workers over a
# unix socket on the node, not the network. The selector is any pod with the
# ate.dev/worker-pool label in any namespace, which is acceptable while only
# admins can create pods; revisit before actors get internet egress or agents
# get cluster credentials. Workers probe a cloud metadata server
# (169.254.169.254:80) at start; Hubble shows that drop, and it stays denied.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: substrate-workers
spec:
  description: Agent Substrate worker pods reach only the egress gateway.
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: Exists
  egress:
    # The atenet-egress Service's port 443, which agentgateway serves on 8443.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
