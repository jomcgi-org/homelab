apiVersion: v1
kind: Service
metadata:
  name: egress-scan
  namespace: ate-system
spec:
  selector:
    app: egress-scan
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: egress-scan
  namespace: ate-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: egress-scan
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-scan
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app: egress-scan
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atenet-egress-to-scanner
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app: atenet-egress
  egress:
    - toEndpoints:
        - matchLabels:
            app: egress-scan
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
