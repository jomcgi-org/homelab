# Route policy read by render_egress_gateway.py.
# requestTimeout is coupled to the second scan tier of the egress-scan chart.
# With the tier off it is 80ms: Gitleaks alone scans. With the tier on in
# enforce mode it must be at least semgrep.deadline + 10ms (310ms for a 300ms
# deadline). In observe mode the engine is off the request path, so it stays at
# 80ms or more. The tier is off since 2026-11-24 (Joe deferred it).
# resources_test.py enforces all three. See egress-scan/README.md.
conditional:
  - condition: destination.hostname == "hindsight-api.hindsight.svc.cluster.local" && destination.port == 8888
    host: egress-scan.ate-system.svc:8080
    protocol:
      grpc: {}
    failureMode: deny
    includeRequestBody:
      maxRequestBytes: 524288
      allowPartialMessage: false
      packAsBytes: true
    policies:
      http:
        requestTimeout: 80ms
