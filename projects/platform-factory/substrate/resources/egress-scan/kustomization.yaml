apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - scanner.yaml
patches:
  - path: gateway-patch.yaml
  # Wait for scanner readiness, then apply the gateway and its required config together.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: atenet-egress
        namespace: ate-system
        annotations:
          argocd.argoproj.io/sync-wave: '1'
