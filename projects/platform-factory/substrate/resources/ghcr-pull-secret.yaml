# The read-only GHCR login the atelet's credential plugin reads (HOME-539),
# also the init container's own pull secret. Same 1Password item as the
# factory namespace's ghcr-imagepull-secret.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
type: kubernetes.io/dockerconfigjson
metadata:
  name: ghcr-imagepull-secret
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: vaults/k8s-homelab/items/ghcr-read-permissions
