# Dev conformance test for fork slice 1: a template with fork_config, forked
# end to end through the ate API with the public Semgrep OSS engine
# (conformance/conformance.py lists the checks C1 to C8 and what it cannot
# check). Run it only after the enable steps. The log is the result:
# grep '^CONFORMANCE '.
#
# Runs once: the directory is wired since step 5, the Job was created
# suspended, and step 8 of the enable steps sets suspend to false.
# ../resources/resources_test.py is the wiring guard. While the Job was
# suspended, Argo showed health Suspended. It runs one pod (backoffLimit 0) and
# stays Complete or Failed until it is removed. A Complete Job is Healthy, and a
# Failed one leaves the Application Degraded. The enable steps are in
# projects/factory-cluster/README.md, "gVisor sandbox fork".
#
# A Job's pod template is immutable: to run again, change the run suffix in the
# name. Editing anything under conformance/ changes the generated ConfigMap's
# hash, and so the Job's config volume and its pod template: bump the run suffix
# in the same change (resources_test.py pins the hash).
#
# The suffix is 6. -2 named the first fork build. -3 failed at its first API
# call, because its template did not disable golden snapshots. -4 was never
# applied. -5 passed C1 and C2 and failed C3: the fork worker could not start a
# seed (forkd's binaries sat in a 0700 directory). -6 runs on the fork build
# 8cf248b96e08, which stages them in a worker-owned directory.
#
# To suspend a running Job, set suspend back to true, which Kubernetes allows
# before the pod is done. To remove the test, delete this file and its
# kustomization entries after reading the log. ArgoCD then prunes the Job.
#
# It runs as ate-system/ate-client, which the ate API already authorizes
# (ateApi.authorization.bootstrapOwners in ../values/substrate.yaml), so it
# grants nobody anything. It reaches the ate API (443) and the Kubernetes API
# (kubectl-ate lists the ClusterTrustBundles that verify the API's
# certificate). It needs no rustfs: kubectl-ate comes from the fork build as an
# image volume. The image is built by .github/workflows/substrate-fork-images.yml
# (PR #8584).
apiVersion: batch/v1
kind: Job
metadata:
  name: gvisor-fork-conformance-7
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  suspend: false
  backoffLimit: 0
  # The worker wait (900 s), the seed (600 s), the forks (120 s), their
  # lifetime (300 s) and the checks around them.
  activeDeadlineSeconds: 2400
  template:
    metadata:
      labels:
        app: gvisor-fork-conformance
    spec:
      serviceAccountName: ate-client
      restartPolicy: Never
      # SIGTERM (the deadline, a delete) runs the script's cleanup: the forks,
      # the templates, the seed wait (up to 120 s) and the atespaces.
      terminationGracePeriodSeconds: 300
      # The in-cluster Kubernetes config kubectl-ate needs for the
      # ClusterTrustBundles. The ate API takes the audience token below.
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: conformance
          image: python:3.14.10-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          command: [python3, -I, /config/conformance.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
            - name: FORKS
              value: "4"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true
            - name: cli
              mountPath: /cli
              readOnly: true
            - name: ate-token
              mountPath: /var/run/ate
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: gvisor-fork-conformance
        # The fork build of kubectl-ate: /cli/ko-app/kubectl-ate, published by
        # substrate-fork-images.yml at fork commit c7f37a993862.
        - name: cli
          image:
            reference: ghcr.io/jomcgi-org/homelab/substrate-fork/kubectl-ate:fork-c7f37a993862@sha256:7e9c7b9d285a5c3bfd897da797acf88521c526ed478af618d5d8958c3241e7a6
            pullPolicy: IfNotPresent
        # The ate API's JWT provider accepts this audience (api-server-config.yaml).
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: token
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gvisor-fork-conformance
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: gvisor-fork-conformance
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: ate-api-server
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Upstream's NetworkPolicy admits ate-api-server callers only from its own
# components and from namespaces labelled ate.dev/api-access, which ate-system
# is not. Cilium adds this rule to it: the Job, and nothing else in ate-system.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ate-api-server-gvisor-fork-conformance
  namespace: ate-system
spec:
  endpointSelector:
    matchLabels:
      app: ate-api-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: gvisor-fork-conformance
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
