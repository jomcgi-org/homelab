# invariant: PLAT-6
# The dedicated worker pool for fork slice 1: gVisor on the KVM platform, with
# one worker (replicas 1). The pool is wired (see kustomization.yaml) since
# step 5, and step 6 of the enable steps raised replicas from 0 to 1 and sized
# the pod for the egress-scan engine pool
# (projects/factory-cluster/README.md, "gVisor sandbox fork";
# projects/platform-factory/substrate/egress-scan/ARCHITECTURE.md, "Capacity").
#
# platform: kvm exists only in the fork's WorkerPool CRD (jomcgi-org/substrate
# fork/seed-slice1), which came with the fork control plane and atelet images
# (step 4). ForkSeed (preview gate) is on in ../values/common.yaml since
# step 7, after a worker had started. The gates X1 to X9 run at step 9 with the
# gate on cluster-wide. Only this
# pool's workers can hold seeds. ForkSeed is a process-wide flag that ateapi,
# atecontroller, atelet and every worker read, and only this pool's workers
# have --fork-platform=kvm. Factory use of fork templates waits for step 10.
#
# What the fork's controller gives a worker of this pool (atecontroller
# workerpool_apply.go, not set here):
#   - the ate.dev/kvm extended resource as a limit, so /dev/kvm and node
#     placement come from the device plugin (all three nodes advertise it);
#   - the gVisor worker capabilities NET_ADMIN, SYS_ADMIN, SETUID, SETGID,
#     DAC_OVERRIDE, FOWNER, CHOWN, NET_RAW, SETFCAP, plus SYS_CHROOT and SETPCAP
#     for forkd's chroot and bounding-set drop;
#   - seccomp and AppArmor Unconfined on the worker container (runsc pivots
#     root and the worker remounts /sys/fs/cgroup; the sentry installs its own
#     seccomp filter). The container runs as root, not privileged.
# forkd refuses to start unless these hold, so a missing grant fails closed.
#
# The pod holds the seed and every forked child, so its limits are the pool's
# capacity. The scheduler books a seed (1000m CPU, 512 MiB cap) and each child
# (1000m CPU, 128 MiB limit plus 16 MiB overhead) against them. The limits are
# 9 CPU (the seed and 8 children) and 2Gi (512 + 8 x 144 = 1664 MiB booked).
# Expected use is 586 MB: seed 358 MB, 4 scanning children at 37 MB, 4 waiting
# at 4 MB, and 64 MB for forkd and the worker. The request, 1Gi and 4 CPU, is a
# scheduling reservation only. On 2026-11-23 node-1 had 5237Mi of memory and
# 8235m of CPU left to request, node-3 2857Mi and node-2 1981Mi; a burst above
# the request uses free node memory. One replica runs, so a drain is an outage.
#
# The pod prefers node-1: it has the most request room, and a latency run wants
# one node. The preference is soft, so a drained or tainted node-1 does not leave
# the pool pending.
#
# A worker pins the atespace of its first seed for the life of the process. The
# rollout moves from one atespace to the next by restarting the pod.
apiVersion: v1
kind: Namespace
metadata:
  name: substrate-gvisor-fork
  labels:
    factory.jomcgi.dev/substrate-workers: "true"
---
# Worker pods run as this account, with no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fork-worker
  namespace: substrate-gvisor-fork
automountServiceAccountToken: false
---
# The same allowlist every binding namespace has: actor traffic arrives only
# from the router and leaves only through the egress gateway. A forked actor
# has no egress (egress NONE), so the gateway rule serves only the worker.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: substrate-workers
  namespace: substrate-gvisor-fork
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: gvisor-fork
  namespace: substrate-gvisor-fork
  labels:
    workload: gvisor-fork
spec:
  # One worker, started at step 6 of the enable steps. Setting it back to 0 is part of the rollback,
  # after the fork templates are deleted. The pool needs no autoscaler: replicas
  # stays fixed, and it must never scale to zero while the engine tier is on.
  replicas: 1
  # The fork build of ateworker-gvisor, published by
  # .github/workflows/substrate-fork-images.yml at fork commit 1e7a877d0ca3.
  workerImage: ghcr.io/jomcgi-org/homelab/substrate-fork/ateworker-gvisor:fork-1e7a877d0ca3@sha256:f208bf5ae975a2360bfb42a8d38b2eb3fdaba537a2078332af5dcd545a17a7d1
  sandboxClasses:
    - name: gvisor
      platform: kvm
      configRef:
        name: gvisor-fork
  template:
    serviceAccountName: fork-worker
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [node-1]
    resources:
      limits:
        cpu: "9"
        memory: 2Gi
      requests:
        cpu: "4"
        memory: 1Gi
