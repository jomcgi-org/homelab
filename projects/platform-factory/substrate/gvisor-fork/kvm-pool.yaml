# invariant: PLAT-6
# The dedicated worker pool for fork slice 1: gVisor on the KVM platform, with
# no workers (replicas 0). It stays unwired (see kustomization.yaml), and when
# it is wired it still starts no pod until step 6 of the enable steps raises
# replicas (projects/factory-cluster/README.md, "gVisor sandbox fork").
#
# platform: kvm exists only in the fork's WorkerPool CRD (jomcgi-org/substrate
# fork/seed-slice1), so this file cannot be applied before the CRD, the control
# plane and atelet images come from the fork (step 4). ForkSeed (preview gate)
# stays off in ../values/common.yaml until step 7, after a worker has started.
# The gates X1 to X9 run at step 9 with the gate on cluster-wide. Only this
# pool's workers can hold seeds. ForkSeed is a process-wide flag that ateapi,
# atecontroller, atelet and every worker read, and only this pool's workers
# have --fork-platform=kvm. Factory use of fork templates waits for step 10.
#
# What the fork's controller gives a worker of this pool (atecontroller
# workerpool_apply.go, not set here):
#   - the ate.dev/kvm extended resource as a limit, so /dev/kvm and node
#     placement come from the device plugin (all three nodes advertise it);
#   - the gVisor worker capabilities NET_ADMIN, SYS_ADMIN, SETUID, SETGID,
#     DAC_OVERRIDE, FOWNER, CHOWN, NET_RAW, SETFCAP, plus SYS_CHROOT and SETPCAP
#     for forkd's chroot and bounding-set drop;
#   - seccomp and AppArmor Unconfined on the worker container (runsc pivots
#     root and the worker remounts /sys/fs/cgroup; the sentry installs its own
#     seccomp filter). The container runs as root, not privileged.
# forkd refuses to start unless these hold, so a missing grant fails closed.
#
# The pod holds the seed and every forked child, so its memory limit is the
# pool's capacity. Measured on node-1 (public engine, production mode): seed
# 171 MB resident (192 MB peak), template about 150 MB, a waiting child 3.5 MB
# and a scanning child 37 MB private, 6.5 MB of marginal overhead per child.
# 192 + 16 scanning children x (37 + 6.5) = 888 MB, plus forkd and the worker
# (about 64 MB): 1280Mi covers 16 concurrent scans. The request is a scheduling
# reservation only. On 2026-11-22 the nodes had 509Mi, 257Mi and 13Mi left to
# request (node-2 is the tightest), so it stays at the microVM spike's 256Mi.
# A burst above it uses free node memory.
apiVersion: v1
kind: Namespace
metadata:
  name: substrate-gvisor-fork
  labels:
    factory.jomcgi.dev/substrate-workers: "true"
---
# Worker pods run as this account, with no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fork-worker
  namespace: substrate-gvisor-fork
automountServiceAccountToken: false
---
# The same allowlist every binding namespace has: actor traffic arrives only
# from the router and leaves only through the egress gateway. A forked actor
# has no egress (egress NONE), so the gateway rule serves only the worker.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: substrate-workers
  namespace: substrate-gvisor-fork
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: gvisor-fork
  namespace: substrate-gvisor-fork
  labels:
    workload: gvisor-fork
spec:
  # Off. Step 6 of the enable steps raises this to 1, with the fork control
  # plane running and ForkSeed still off. Setting it back to 0 is part of the
  # rollback, after the fork templates are deleted.
  replicas: 0
  # The fork build of ateworker-gvisor, published by
  # .github/workflows/substrate-fork-images.yml at fork commit b6b0ec3e217c.
  workerImage: ghcr.io/jomcgi-org/homelab/substrate-fork/ateworker-gvisor:fork-b6b0ec3e217c@sha256:65f14b6900ee64c6dae2e03a7063d9fb0384e1f62becca5a275421b891870e94
  sandboxClasses:
    - name: gvisor
      platform: kvm
      configRef:
        name: gvisor-fork
  template:
    serviceAccountName: fork-worker
    resources:
      limits:
        cpu: "2"
        memory: 1280Mi
      requests:
        cpu: 100m
        memory: 256Mi
