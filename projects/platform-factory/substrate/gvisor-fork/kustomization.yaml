apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The gVisor sandbox-fork slice 1, wired and OFF. ArgoCD applies it through
# ../resources/kustomization.yaml (egress-scan/deploy/application.yaml, path
# projects/platform-factory/substrate/resources), which lists this directory
# since step 5. It runs no actor: the WorkerPool's one worker holds no seed, the
# conformance Job runs once (step 8) and no template sets fork_config, so ForkSeed (on
# since step 7) starts no fork. The asset Job is a
# Sync hook and runs at once. ../resources/resources_test.py is the wiring guard:
# it lists the objects rendered here, the off switches and that gvisor-default
# stays the class default. The enable steps, the isolation gates and the
# rollback are in projects/factory-cluster/README.md, "gVisor sandbox fork".
resources:
  - sandboxconfig-gvisor-fork.yaml
  - gvisor-assets-job.yaml
  - kvm-pool.yaml
  - conformance-job.yaml

configMapGenerator:
  # The fork build pins and the script that stages them (gvisor-assets-job.yaml).
  - name: gvisor-fork-assets
    namespace: ate-system
    files:
      - assets.json=assets/assets.json
      - stage.py=assets/stage.py
  # The conformance Job's script and template (conformance-job.yaml).
  - name: gvisor-fork-conformance
    namespace: ate-system
    files:
      - conformance.py=conformance/conformance.py
      - template.yaml=conformance/template.yaml
