# invariant: PLAT-6
# The isolation-gate pool: STAGED, TO BE REMOVED. A separate gVisor fork pool for
# the isolation gates of projects/factory-cluster/README.md (step 9), so the
# gates can run a guest process without touching the production pool, its
# atespace or engine-gate. One worker, the same fork images as production
# (kvm-pool.yaml), tiny requests. Remove it, with ../kustomization.yaml's
# "- gates" line and this directory, after the gates ran and README step 9 holds
# the results.
#
# Own namespace, atespace (gvisor-fork-gates) and label (workload:
# gvisor-fork-gates). The production template selects workload: gvisor-fork,
# so it never lands here, and the gate template (template.yaml) selects only
# this pool. engine-gate has no grant on this atespace and the scanner sends it
# nothing.
#
# Sizing. The pod holds a 192 MiB seed and forks of 80 MiB (64 MiB limit and the
# 16 MiB overhead) at most 4 at a time, so 768Mi covers about 600 MiB. The
# request is a scheduling reservation only (the nodes were 70 to 84% requested
# on 2026-11-24): 256Mi and 100m. CPU limit 2 books the seed and 7 forks at 250m.
apiVersion: v1
kind: Namespace
metadata:
  name: substrate-gvisor-fork-gates
  labels:
    factory.jomcgi.dev/substrate-workers: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fork-worker
  namespace: substrate-gvisor-fork-gates
automountServiceAccountToken: false
---
# The allowlist every worker namespace has: traffic from the router in, the egress
# gateway out. Forks have no egress of their own (egress NONE).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: substrate-workers
  namespace: substrate-gvisor-fork-gates
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: gvisor-fork-gates
  namespace: substrate-gvisor-fork-gates
  labels:
    workload: gvisor-fork-gates
spec:
  replicas: 1
  # The production worker image (kvm-pool.yaml): the fork patches the gates check.
  workerImage: ghcr.io/jomcgi-org/homelab/substrate-fork/ateworker-gvisor:fork-8cf248b96e08@sha256:779fb7dd9e036adfd22cb4642d91d3a1283cb03c37ce57cc0d39957497ad80f8
  sandboxClasses:
    - name: gvisor
      platform: kvm
      configRef:
        name: gvisor-fork
  template:
    serviceAccountName: fork-worker
    # Node-1 is where the node-side checks (a ptrace of a fork, the cgroup and
    # namespace leak counts) run. Soft: it is a preference only.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [node-1]
    resources:
      limits:
        cpu: "2"
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 256Mi
