apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The isolation-gate pool and Job, staged and to be removed (see pool.yaml).
# Listed by ../kustomization.yaml ("- gates"). Remove that line and this
# directory together.
resources:
  - pool.yaml
  - job.yaml

configMapGenerator:
  # The gate Job's script, template and guest (job.yaml). Editing any of them
  # changes the ConfigMap's name, so bump the Job's run suffix with it.
  - name: gvisor-fork-gates
    namespace: ate-system
    files:
      - gates.py=gates.py
      - template.yaml=template.yaml
      - guest.sh=guest.sh
