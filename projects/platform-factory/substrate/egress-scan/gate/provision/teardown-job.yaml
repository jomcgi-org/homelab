# The teardown of the engine atespace, NOT listed in kustomization.yaml: it is
# suspended, and a suspended Job makes the Application report Suspended. To use
# it, stop engine-gate first (replicas 0: it deletes its children on SIGTERM),
# list this file in kustomization.yaml, set suspend to false and merge. The Job
# deletes the actors, the templates, the access policy and the atespace, and
# fails if a delete fails (provision.py, MODE=teardown). Read the run with
# kubectl -n ate-system logs job/egress-engine-teardown-1 | grep '^PROVISION '.
# It shares the pod shape, the ConfigMap and the network policies of job.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: egress-engine-teardown-1
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  suspend: true
  backoffLimit: 0
  # The deletes and the wait for the seeds to go (120 s).
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: egress-engine-provision
    spec:
      serviceAccountName: ate-client
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      # The in-cluster Kubernetes config kubectl-ate needs for the
      # ClusterTrustBundles. The ate API takes the audience token below.
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: python:3.14.10-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          command: [python3, -I, /config/provision.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
            - name: MODE
              value: teardown
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true
            - name: cli
              mountPath: /cli
              readOnly: true
            - name: ate-token
              mountPath: /var/run/ate
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: egress-engine-provision
        # The fork build of kubectl-ate, as in gvisor-fork/conformance-job.yaml.
        - name: cli
          image:
            reference: ghcr.io/jomcgi-org/homelab/substrate-fork/kubectl-ate:fork-8cf248b96e08@sha256:bfb9cf01712dd691232298cc19767a7536c00f2cfe0c76b41ac6945f2d2885f7
            pullPolicy: IfNotPresent
        # The ate API's JWT provider accepts this audience (api-server-config.yaml).
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: token
