apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Not wired since 2026-11-24 (Joe deferred the Semgrep tier). The teardown ran as
# egress-engine-teardown-1 and -2 and left one orphaned seed (../README.md,
# "Teardown"). job.yaml is the apply Job that ran as egress-engine-provision-2.
# If a file here is wired again, editing it changes the generated ConfigMap's
# hash and the Job's pod template, which is immutable: bump the run suffix in
# the Job's name in the same change. provision_test.py checks the manifests.
resources:
  - network-policy.yaml
  - teardown-job.yaml

configMapGenerator:
  # The script and the template of both Jobs.
  - name: egress-engine-provision
    namespace: ate-system
    files:
      - provision.py=provision.py
      - template.yaml=template.yaml
      - template.json=template.json
