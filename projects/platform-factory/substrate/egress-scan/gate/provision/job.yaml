  backoffLimit: 0
  # The deletes and the wait for the seeds to go (120 s).
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: egress-engine-provision
    spec:
      serviceAccountName: ate-client
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      # The in-cluster Kubernetes config kubectl-ate needs for the
