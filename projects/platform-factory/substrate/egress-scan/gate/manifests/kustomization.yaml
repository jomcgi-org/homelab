apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# engine-gate. Not deployed since 2026-11-24 (../../../resources does not list
# this directory). manifests_test.py checks what this directory renders, and
# ../../../resources/resources_test.py checks the image pin and that the wired
# render holds none of it, nor of ../guard. The rollout, the checks and the
# rollback are in ../README.md, "Enable steps".
resources:
  - statefulset.yaml
  - networkpolicy.yaml
  # The admission guard is its own directory: it stays deployed without the gate.
  - ../guard

images:
  - name: engine-gate
    newName: ghcr.io/jomcgi/homelab/projects/platform-factory/substrate/egress-scan/gate
    # The digest of the image that main's CI published (apko, //projects/platform-factory/substrate/egress-scan/gate/image).
    # resources_test.py fails when it differs from the Bazel image digest: the
    # change that edits the gate's code or its image config updates this line in
    # the same change, the same way as the credential plugin pin in
    # resources/patches/atelet-image-credentials.yaml.
    digest: sha256:d95d9854dffefcea6eda792f4a463988145f2db360f44d59605ee7313e7ab885 # ratchet-allow: image-digest (kustomize has no build pin; resources_test keeps it equal to the Bazel image digest)
