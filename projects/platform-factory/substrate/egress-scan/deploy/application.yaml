apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate
  namespace: argocd
  annotations:
    # Removing or renaming this Application must not cascade into Substrate's
    # CRDs, namespaces, keys and volumes (resources/kustomization.yaml marks
    # those Delete=false too).
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # ArgoCD v3.3's built-in schema predates the Kubernetes 1.37
    # podCertificate projected volume Substrate's pods use, so the client-side
    # structured diff fails; the apiserver computes the diff instead.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Render both sources before syncing either one. The gateway shares
  # the scanner's sync operation and waits for its readiness.
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: egress-scan
      targetRevision: 0.10.4
      helm:
        releaseName: egress-scan
        # The second scan tier, in enforce mode. Joe decided on 2026-11-24 to
        # skip the 7-day observe window and enforce at once (ARCHITECTURE.md
        # "Decided" 8). A finding of the engine denies the request, and so does
        # a call with no verdict (failureMode deny: an engine outage denies, as
        # Joe decided on 2026-11-23). The gateway requestTimeout is the deadline +
        # 10ms (resources/egress-scan/gateway-policy.yaml; resources_test.py
        # couples them). The endpoint is the engine-gate Service
        # (gate/manifests/statefulset.yaml) and its one path. concurrency is per
        # pod: 2 pods x 2 = the gate's 4 scans. maxBodyBytes is the v1 limit: a
        # body over it is `oversize` and denied like an outage (README "Body
        # limit"). To go back, set mode observe and requestTimeout 80ms in one PR.
        # Set these here (helm.valuesObject), not with parameters: resources_test.py
        # reads them from this block.
        valuesObject:
          semgrep:
            enabled: true
            mode: enforce
            failureMode: deny
            endpoint: http://engine-gate.ate-system.svc:8080/scan
            deadline: 300ms
            maxBodyBytes: 65536
            concurrency: 2
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      path: projects/platform-factory/substrate/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The SandboxConfig is applied with the CRD that defines it.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
