apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-scan
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: egress-scan
  template:
    metadata:
      labels:
        app: egress-scan
    spec:
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest is required" .Values.image.digest) | quote }}
{{- with .Values.semgrep }}
{{- if .enabled }}
{{- if not (has .failureMode (list "deny" "allow")) }}
{{- fail "semgrep.failureMode must be deny or allow" }}
{{- end }}
{{- if not (has .mode (list "enforce" "observe")) }}
{{- fail "semgrep.mode must be enforce or observe" }}
{{- end }}
          args:
            - --semgrep-enabled
            - {{ printf "--semgrep-endpoint=%s" (required "semgrep.endpoint is required when semgrep.enabled" .endpoint) | quote }}
            - {{ printf "--semgrep-deadline=%s" .deadline | quote }}
            - {{ printf "--semgrep-failure-mode=%s" .failureMode | quote }}
            - {{ printf "--semgrep-mode=%s" .mode | quote }}
            - {{ printf "--semgrep-max-body=%d" (int .maxBodyBytes) | quote }}
            - {{ printf "--semgrep-concurrency=%d" (int .concurrency) | quote }}
            - {{ printf "--semgrep-max-response=%d" (int .maxResponseBytes) | quote }}
            - {{ printf "--semgrep-breaker-failures=%d" (int .breaker.failures) | quote }}
            - {{ printf "--semgrep-breaker-cooldown=%s" .breaker.cooldown | quote }}
{{- end }}
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: grpc
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          startupProbe:
            grpc:
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              memory: 256Mi
