apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-scan
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: egress-scan
  template:
    metadata:
      labels:
        app: egress-scan
    spec:
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest is required" .Values.image.digest) | quote }}
{{- with .Values.detector }}
{{- if not (has .mode (list "enforce" "observe")) }}
{{- fail "detector.mode must be enforce or observe" }}
{{- end }}
{{- if not (has .failureMode (list "deny" "allow")) }}
{{- fail "detector.failureMode must be deny or allow" }}
{{- end }}
          args:
            - {{ printf "--detector=%s" (required "detector.name is required" .name) | quote }}
            - {{ printf "--detector-mode=%s" .mode | quote }}
            - {{ printf "--detector-failure-mode=%s" .failureMode | quote }}
            - {{ printf "--detector-deadline=%s" .deadline | quote }}
            - {{ printf "--detector-max-input-bytes=%d" (int .maxInputBytes) | quote }}
{{- if .dataPath }}
            - {{ printf "--detector-data-path=%s" .dataPath | quote }}
{{- end }}
{{- end }}
{{- with .Values.metrics }}
{{- if .routes }}
            - {{ printf "--metrics-routes=%s" (join "," .routes) | quote }}
{{- end }}
            - {{ printf "--metrics-max-label-values=%d" (int .maxLabelValues) | quote }}
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: grpc
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          startupProbe:
            grpc:
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              memory: 256Mi
