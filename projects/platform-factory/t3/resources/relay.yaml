apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3-relay
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: t3-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3-relay
    spec:
      serviceAccountName: t3-relay
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: node-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: docker.io/library/nginx:1.30-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
          command: [nginx, -g, "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command: [test, -S, /run/t3-cluster/t3.sock]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: socket-directory
              mountPath: /run/t3-cluster
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: t3-relay
        - name: socket-directory
          hostPath:
            path: /run/t3-cluster
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: t3-relay
spec:
  selector:
    app.kubernetes.io/name: t3-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: t3-relay
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingressDeny:
    - fromEntities: [host, remote-node]
  egressDeny:
    - toEntities: [all]
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: edge
            gateway.envoyproxy.io/owning-gateway-namespace: edge
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
