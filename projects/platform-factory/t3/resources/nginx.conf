worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_origin $allowed_origin {
        default 0;
        '' 1;
        'https://t3.jomcgi.dev' 1;
    }

    server {
        listen 8080;
        server_name t3.jomcgi.dev;

        location / {
            if ($http_host != t3.jomcgi.dev) { return 421; }
            if ($allowed_origin = 0) { return 403; }
            proxy_pass http://unix:/run/t3-cluster/t3.sock:;
            proxy_http_version 1.1;
            proxy_set_header Host t3.jomcgi.dev;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Keep authenticated responses out of shared caches.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
