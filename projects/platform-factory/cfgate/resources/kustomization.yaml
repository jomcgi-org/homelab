apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cfgate: Cloudflare Tunnel and DNS lifecycle from Gateway API resources. The
# release manifest carries the controller and its CRDs. It is vendored
# byte-for-byte so a re-uploaded release asset cannot change what syncs:
#   https://github.com/cfgate/cfgate/releases/download/v0.2.0-alpha.11/install.yaml
#   sha256 009404f7cddf5836c2e8bd9742adf6763f9e59cf2e28aa2a6b493872604b1a9c
# To upgrade, replace the file, update both lines above and the image digest
# below. Gateway API itself comes from k3s (v1.6.3 standard channel).
resources:
  - upstream/cfgate-v0.2.0-alpha.11-install.yaml
  - api-token.yaml
  # Its allowlist under the cluster-wide default-deny (network-policy/).
  - network-policy.yaml

images:
  - name: ghcr.io/cfgate/cfgate
    newTag: 0.2.0-alpha.11
    digest: sha256:6cd934b258ee245eadf4fc46704897410be008f0b88296ff77e74f06fc8b4c1a

patches:
  # The tunnel Gateway and Cloudflare credentials both live in cfgate-system.
  # Its existing RoleBinding binds this Role to the controller.
  - target:
      kind: Role
      name: cfgate-manager-role
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: [secrets]
          verbs: [create, delete, get, list, patch, update, watch]
  # alpha.11 watches Secrets with the default cluster-wide manager cache.
  # Drop this rule once the Secret informer targets the Gateway namespaces.
  - target:
      kind: ClusterRole
      name: cfgate-manager-role
    patch: |-
      - op: test
        path: /rules/1/resources
        value: [secrets]
      - op: replace
        path: /rules/1/verbs
        value: [list, watch]
  # The controller peaked at 46Mi over 14-16 Nov against the release's 128Mi
  # request; its 256Mi limit stays.
  - target:
      kind: Deployment
      name: cfgate-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cfgate-controller-manager
        namespace: cfgate-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  requests:
                    memory: 48Mi
