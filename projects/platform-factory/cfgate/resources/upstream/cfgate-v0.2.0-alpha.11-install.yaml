                properties:
                  accountId:
                    description: AccountID is the Cloudflare account ID.
                    maxLength: 32
                    type: string
                  accountName:
                    description: AccountName is the Cloudflare account name (looked
                      up via API).
                    maxLength: 255
                    type: string
                  name:
                    description: Name of the secret containing credentials.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the secret (defaults to policy namespace).
                    type: string
                  secretKeys:
                    description: SecretKeys selects credential data keys; omitted
                      keys use their defaults.
                    properties:
                      apiToken:
                        default: CLOUDFLARE_API_TOKEN
                        description: APIToken is the key name for the Cloudflare API
                          token.
                        maxLength: 253
                        type: string
                    type: object
                required:
                - name
                type: object
