apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    # Removing this Application from the factory kustomization must not delete
    # the CNI, which would cut every pod's networking.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # The CNI comes first; every other pod depends on it.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      # Keep in step with CILIUM_VERSION in projects/factory-cluster/bootstrap-gitops.sh.
      targetRevision: 1.20.4
      helm:
        releaseName: cilium
        valueFiles:
          - $values/projects/platform-factory/cilium/values.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # Never prune the CNI on a render that has not caught up.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
