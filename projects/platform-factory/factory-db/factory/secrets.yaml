# The factory namespace's share of factory-db: one connection-string Secret
# per database (key DATABASE_URL), and the Role that lets
# factory-db/factory-db-setup fill only those names. A separate Application
# (destination factory, CreateNamespace) so that factory-db never depends on
# the factory namespace existing: ArgoCD's root does not wait for one
# Application's health before the next wave.
apiVersion: v1
kind: Secret
metadata:
  name: factory-itsaplan-db
  namespace: factory
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
# The connector's (delivery plan step 9); filled now, read once it deploys.
apiVersion: v1
kind: Secret
metadata:
  name: factory-connector-db
  namespace: factory
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-db-setup
  namespace: factory
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [factory-itsaplan-db, factory-connector-db]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-db-setup
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-db-setup
subjects:
  - kind: ServiceAccount
    name: factory-db-setup
    namespace: factory-db
