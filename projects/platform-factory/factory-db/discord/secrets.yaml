# The factory-discord namespace's share of factory-db (HOME-909): the
# connection strings of Bosun's message archive (key DATABASE_URL), and the
# Role that lets factory-db/factory-db-setup fill only those names. The
# bridge writes with discord-archive-db; bosun-history reads with
# discord-archive-reader-db, a login that may only SELECT, and runs
# history_sql with discord-sql-<guild>-db: one login per server, which row
# security limits to that server's rows. bosun-requests files Joe's factory
# requests with bosun-requests-db (HOME-941).
apiVersion: v1
kind: Secret
metadata:
  name: discord-archive-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-archive-reader-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: bosun-requests-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-sql-185442367703220224-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-sql-1290668195249917964-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-sql-1501965852042330302-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-sql-1512814732392927463-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-db-setup
  namespace: factory-discord
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - discord-archive-db
      - discord-archive-reader-db
      - bosun-requests-db
      - discord-sql-185442367703220224-db
      - discord-sql-1290668195249917964-db
      - discord-sql-1501965852042330302-db
      - discord-sql-1512814732392927463-db
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-db-setup
  namespace: factory-discord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-db-setup
subjects:
  - kind: ServiceAccount
    name: factory-db-setup
    namespace: factory-db
