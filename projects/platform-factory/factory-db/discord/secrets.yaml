# The factory-discord namespace's share of factory-db (HOME-909): the
# connection strings of Bosun's message archive (key DATABASE_URL), and the
# Role that lets factory-db/factory-db-setup fill only those names. The
# bridge writes with discord-archive-db; bosun-history reads with
# discord-archive-reader-db, a login that may only SELECT.
apiVersion: v1
kind: Secret
metadata:
  name: discord-archive-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-archive-reader-db
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-db-setup
  namespace: factory-discord
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - discord-archive-db
      - discord-archive-reader-db
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-db-setup
  namespace: factory-discord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-db-setup
subjects:
  - kind: ServiceAccount
    name: factory-db-setup
    namespace: factory-db
