# Invariants: rules that must always hold in this directory.
# docs/templates/INVARIANTS.yaml describes the fields. IDs are permanent:
# never reuse or renumber one. docs/THREAT-MODEL.md cites them.
invariants:
- id: PLAT-1
  statement: A pod sends and receives nothing unless a network policy names the peer.
  mechanism:
  - projects/platform-factory/network-policy/resources/baseline.yaml
  state: unproven
- id: PLAT-2
  statement: Every route on the edge Gateway signs in through Authentik, except the Authentik route that
    serves the sign-in flow.
  mechanism:
  - projects/platform-factory/edge/chart
  test: //projects/platform-factory/edge/chart:edge_test
  state: live
- id: PLAT-3
  statement: Only named namespaces attach routes, each to its exact hostnames.
  mechanism:
  - projects/platform-factory/edge-admission/resources/policies.yaml
  state: unproven
- id: PLAT-4
  statement: No Service exposes a pod on a node address.
  mechanism: []
  state: designed
- id: PLAT-5
  statement: Only ArgoCD creates a pod that runs as kagent-controller.
  mechanism:
  - projects/platform-factory/substrate/resources/kagent-identity-guard.yaml
  state: unproven
- id: PLAT-6
  statement: An agent worker reaches only the Substrate egress gateway and DNS.
  mechanism:
  - projects/platform-factory/substrate/resources/network-policy.yaml
  state: unproven
- id: PLAT-7
  statement: 1Password Connect, ArgoCD redis and the repo-server accept requests only from their own controllers.
  mechanism:
  - projects/platform-factory/network-policy/resources/onepassword.yaml
  - projects/platform-factory/network-policy/resources/argocd.yaml
  state: unproven
# PLAT-8: only ArgoCD writes a claim. The garbage collector may also remove
# the foregroundDeletion finalizer from a claim that is being deleted, so a
# pruned claim goes away. That update keeps the other finalizers in their
# order, and keeps name, data, binaryData, immutable, labels, annotations and
# ownerReferences.
- id: PLAT-8
  statement: A bucket claim is granted only to an authorized namespace.
  mechanism:
  - projects/platform-factory/garage/resources/claim-admission.yaml
  state: unproven
- id: PLAT-9
  statement: A consumer gets only short-lived derived credentials.
  mechanism: []
  state: designed
- id: PLAT-10
  statement: Application namespaces enforce PodSecurity restricted.
  mechanism: []
  state: designed
- id: PLAT-11
  statement: Every pod image names a digest.
  mechanism: []
  state: designed
- id: PLAT-12
  statement: Each application namespace has a ResourceQuota and a LimitRange.
  mechanism: []
  state: designed
- id: PLAT-13
  statement: An application chart on the factory cluster renders only digest-pinned images, only its own
    namespace, no host access and no Service on a node address.
  mechanism:
  - bazel/helm/content_rules/content_rules.py
  - bazel/helm/content_rules/BUILD
  - bazel/helm/helm-template-test.sh
  test: //bazel/helm/content_rules:content_rules_test
  state: live
- id: PLAT-14
  statement: While factory Kargo has no Stage, it installs no workloads, admission webhooks or cluster-wide RBAC.
  mechanism:
  - projects/platform/kargo/values-factory.yaml
  test: //projects/platform/kargo:promotion_gate_test
  state: live
