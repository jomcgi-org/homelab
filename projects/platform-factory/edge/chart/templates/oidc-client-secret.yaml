{{- /*
The gateway's OIDC client secret. authentik-secret-init
(projects/platform-factory/authentik/resources/) replaces the value with the
generated one; the edge Application ignores the data from then on.

It starts with a placeholder value, never empty, and lands before the
SecurityPolicy. With the Secret missing or empty the policy is invalid and
Envoy answers 500, but on the trial cluster the switch from invalid back to
valid served one request without OIDC while Envoy took the new route before
the new listener. A placeholder keeps the policy valid from the start; until
the real value arrives, sign-in fails at the token exchange.

The edge Application ignores this Secret's data and syncs only what is out of
sync, so it is not applied again once filled. Changing its metadata here
would make it out of sync and reset the value; rerun authentik-secret-init
(delete the Job by name) after such a change.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authentik.oidc.clientSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  # "placeholder-replaced-by-authentik-secret-init"
  client-secret: cGxhY2Vob2xkZXItcmVwbGFjZWQtYnktYXV0aGVudGlrLXNlY3JldC1pbml0
