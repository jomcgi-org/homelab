{{- /* invariant: PLAT-2 */ -}}
{{- /*
Envoy Gateway requires Authentik sign-in by default. Route policies can use
verified bearer tokens or pass an approved anonymous request for sign-in or
the public Scotland endpoints. Only the edge namespace may create these
policies (projects/platform-factory/edge-admission/). The kagent route adds
access-token forwarding to the OIDC settings.

If the client secret is missing or empty, Envoy Gateway marks this policy
invalid and answers every route with 500. The Secret starts with a placeholder
value (oidc-client-secret.yaml) so the policy is never invalid in normal
operation.

The endpoints are listed rather than discovered so the controller makes no
outbound calls. Envoy reaches the token endpoint through Cloudflare, like a
browser, because the issuer must be the public URL.

A new hostname needs its callback URL added to the factory-edge provider's
redirect_uris (projects/platform/authentik/factory-blueprints/).
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: edge-authentik-oidc
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
  {{- include "edge.operatorAuthorization" (dict "Values" .Values "denyT3" true) | nindent 2 }}
  oidc:
    {{- include "edge.oidc" . | nindent 4 }}
