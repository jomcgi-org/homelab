{{- /*
kagent trusts the bearer token forwarded by the edge (factory/ARCHITECTURE.md,
finding 5). Its route-level policy replaces the gateway policy, so it must
retain every OIDC setting. Only this route forwards the access token.

SecurityPolicies and their targets must share a namespace, and admission
allows policies only in edge. The ReferenceGrant below permits access to the
kagent-ui Service in kagent; Cilium allows only the edge proxy to reach it.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
  hostnames:
    - factory-agents.jomcgi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Agent responses stream; use the kagent chart's HTTPRoute timeouts.
      timeouts:
        request: "0s"
        backendRequest: "0s"
      backendRefs:
        - group: ""
          kind: Service
          name: kagent-ui
          namespace: kagent
          port: 8080
          weight: 1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kagent-authentik-oidc
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kagent
  oidc:
    {{- include "edge.oidc" . | nindent 4 }}
    forwardAccessToken: true
---
# Keep the grant with the route, so both reconcile in the edge Application.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-kagent-ui
  namespace: kagent
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Release.Namespace }}
  to:
    - group: ""
      kind: Service
      name: kagent-ui
