# Hindsight's credentials. ArgoCD owns each placeholder and ignores its data:
#   hindsight-anthropic  1Password item factory-hindsight, field
#                        ANTHROPIC_API_KEY (Joe, HOME-130 comment 913)
#   hindsight-openrouter 1Password item factory-discord-llm, field api-key,
#                        for embeddings (Joe, HOME-130 comment 1439)
#   hindsight-keys       tenant-api-key and mcp-token, from hindsight-keys-init
#   hindsight-db         DATABASE_URL, from factory-db/factory-db-setup
# The 1Password operator writes each item's fields into its Secret; the
# OnePasswordItem's status shows a failed fetch, and the Deployment waits in
# CreateContainerConfigError until both keys exist.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: hindsight-anthropic
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: "vaults/k8s-homelab/items/factory-hindsight"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: hindsight-openrouter
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: "vaults/k8s-homelab/items/factory-discord-llm"
---
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-keys
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-db
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
# factory-db/factory-db-setup writes the connection string (factory-db's
# secret_init.py, LOGINS).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-db-setup
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-db]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-db-setup
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-db-setup
subjects:
  - kind: ServiceAccount
    name: factory-db-setup
    namespace: factory-db
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-keys
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-keys
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-keys]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-keys
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-keys
subjects:
  - kind: ServiceAccount
    name: hindsight-keys
    namespace: hindsight
---
# Fills hindsight-keys before the Deployment (wave 0) reads it.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-keys-init
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-keys
    spec:
      serviceAccountName: hindsight-keys
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python3, -I, -u, /scripts/keys.py, init]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: hindsight-keys-script
---
# After every sync: copies the MCP token to the coding binding, waiting up to
# 15 minutes for the hindsight-agents Application's placeholder and Role.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-agents
  namespace: hindsight
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-keys
    spec:
      serviceAccountName: hindsight-keys
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agents
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python3, -I, -u, /scripts/keys.py, agents]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: hindsight-keys-script
