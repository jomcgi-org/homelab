# Hindsight under the cluster-wide default-deny
# (projects/platform-factory/network-policy/).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
  ingress:
    # Agents' MCP calls, through the Substrate egress gateway, which injects
    # the MCP token (projects/platform-factory/substrate).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    # The hindsight-bank-template Job applies the schema through REST.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight
            app.kubernetes.io/name: hindsight-bank-template
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory-db
            cnpg.io/cluster: factory-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Haiku for the LLM work, and OpenRouter for embeddings.
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: openrouter.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The key Jobs read and write Secrets and nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-keys
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight-keys
  egress:
    - toEntities: [kube-apiserver]
---
# The bank-template Job reaches only the API pod, by the Service's address
# from its service links, so it needs no DNS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-bank-template
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight-bank-template
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hindsight
            app.kubernetes.io/component: api
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
