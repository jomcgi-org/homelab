# Hindsight 1.2.1's API and in-process worker, one replica. Its state is the
# factory_hindsight database; the pod keeps nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight
  namespace: hindsight
  annotations:
    # Before the hindsight-preflight Sync hook (wave -1) uses it.
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight-api
  namespace: hindsight
  labels:
    app.kubernetes.io/name: hindsight
spec:
  # Only the API pod. The preflight and recovery Jobs share the name label,
  # which factory-db's policy admits, but serve nothing.
  selector:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8888
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
spec:
  replicas: 1
  # One schema migrator at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: hindsight
      automountServiceAccountToken: false
      # Service links would set HINDSIGHT_API_PORT to tcp://..., which
      # Hindsight reads as its own port setting.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The image's hindsight user; it defines no other UID.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/vectorize-io/hindsight-api:1.2.1@sha256:662109ece429871a81e036427fb93fbb09ba9dc4b01d320d356f114c0e1aedd8
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: HINDSIGHT_API_PORT
              value: "8888"
            - name: HINDSIGHT_API_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hindsight-db
                  key: DATABASE_URL
            # Fact extraction, consolidation and reflect (HOME-130 comment
            # 913).
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: anthropic
            - name: HINDSIGHT_API_LLM_MODEL
              value: claude-haiku-5-5
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-anthropic
                  key: ANTHROPIC_API_KEY
            # The REST API takes only the tenant key, which nothing outside
            # this pod holds.
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: bindings:BindingTenant
            - name: HINDSIGHT_API_OPERATION_VALIDATOR_EXTENSION
              value: bindings:BindingValidator
            - name: PYTHONPATH
              value: /etc/hindsight/extensions
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-keys
                  key: tenant-api-key
            # MCP takes the agents' token instead, and registers only these
            # tools, so the token can neither reach REST nor delete memories.
            - name: HINDSIGHT_API_MCP_EXTENSION
              value: bindings:MemoryTools
            # invariant: FACT-13
            - name: MCP_BINDINGS
              value: '{"HOMELAB_MCP_TOKEN":{"bank":"homelab","tools":["recall"]}}'
            - name: HOMELAB_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hindsight-keys
                  key: mcp-token
            - name: HINDSIGHT_API_MCP_ENABLED_TOOLS
              value: recall
            # Schema v1 for every new bank (HOME-183): the retain mission and
            # the app and kind labels, which extraction turns into tags.
            # Hindsight applies it only when it creates a bank; change an
            # existing bank with PATCH .../config or POST .../import.
            - name: HINDSIGHT_API_DEFAULT_BANK_TEMPLATE
              valueFrom:
                configMapKeyRef:
                  name: hindsight-bank-template
                  key: bank-template.json
            # Embeddings: Voyage 4 Large through OpenRouter, on the key Joe
            # shares with Discord memory (HOME-176, HOME-130 comment 1439).
            # Its 1,024 dimensions fit pgvector's 2,000-dimension index.
            # OpenRouter routes only to providers that keep no data.
            - name: HINDSIGHT_API_EMBEDDINGS_PROVIDER
              value: openrouter
            - name: HINDSIGHT_API_EMBEDDINGS_OPENROUTER_MODEL
              value: mongodb/voyage-4-large
            - name: HINDSIGHT_API_EMBEDDINGS_OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: api-key
            - name: HINDSIGHT_API_EMBEDDINGS_OPENAI_EXTRA_BODY
              value: '{"provider": {"data_collection": "deny"}}'
            # Decision model: TypeSafe Jev 1.14 through OpenRouter's System
            # One endpoint (<base>/v1/systemone), on the same key. It ranks
            # recall and settles consolidation, reflect and page judgments
            # (HOME-182). No local fallback: a recall fails while it is
            # unavailable (Joe on #8147, comment 6949878652).
            - name: HINDSIGHT_API_DECISION_MODEL_PROVIDER
              value: typesafe
            - name: HINDSIGHT_API_DECISION_MODEL_BASE_URL
              value: https://openrouter.ai/api
            - name: HINDSIGHT_API_DECISION_MODEL_MODEL
              value: typesafe/jev-1.14
            - name: HINDSIGHT_API_DECISION_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: api-key
            # The decision model ranks recall; rrf keeps the order and loads no
            # model.
            - name: HINDSIGHT_API_RERANKER_PROVIDER
              value: rrf
            # No local model runs, and nothing fetches one.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            # The model libraries write caches under the home directory.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          # Model load and migrations on a cold start.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: bindings
              mountPath: /etc/hindsight/extensions
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bindings
          configMap:
            name: hindsight-bindings
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# Before a sync replaces the API pod (resources/preflight.py): the OpenRouter
# key works, the decision model answers, and the embedding model's dimension
# matches any stored vectors.
# A failure stops the sync in this wave, so the running pod keeps serving.
# Wave -1 runs after the 1Password items (-2) and before the Deployment (0).
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-preflight
  namespace: hindsight
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  # Also bounds a wait for a Secret the operator has not written.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/component: preflight
    spec:
      serviceAccountName: hindsight
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: ghcr.io/vectorize-io/hindsight-api:1.2.1@sha256:662109ece429871a81e036427fb93fbb09ba9dc4b01d320d356f114c0e1aedd8
          command: [/app/api/.venv/bin/python, -I, -B, /scripts/preflight.py]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hindsight-db
                  key: DATABASE_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: api-key
            # Equal to the Deployment's (keys_test).
            - name: EMBEDDINGS_DIMENSIONS
              value: "1024"
            - name: EMBEDDINGS_MODEL
              value: mongodb/voyage-4-large
            - name: EMBEDDINGS_EXTRA_BODY
              value: '{"provider": {"data_collection": "deny"}}'
            - name: DECISION_MODEL
              value: typesafe/jev-1.14
            - name: DECISION_MODEL_BASE_URL
              value: https://openrouter.ai/api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: hindsight-preflight-script
---
# After every sync (resources/apply_template.py): create bank homelab when it
# is missing, import bank-template.json into it, and read the config back.
# Hindsight applies HINDSIGHT_API_DEFAULT_BANK_TEMPLATE only when it creates a
# bank, so this keeps homelab on the template in git, also after a change. An
# import changes the bank's config, never its memories (HOME-183).
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-bank-template
  namespace: hindsight
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-bank-template
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python3, -I, -u, /template/apply_template.py]
          env:
            - name: BANK
              value: homelab
            # The REST API takes only the tenant key; this Job needs it to
            # create the bank and import the template.
            - name: TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-keys
                  key: tenant-api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: template
              mountPath: /template
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: hindsight-bank-template
