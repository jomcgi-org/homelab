apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hindsight (projects/factory/ARCHITECTURE.md "Memory").
resources:
  - network-policy.yaml
  - secrets.yaml
  - hindsight.yaml

configMapGenerator:
