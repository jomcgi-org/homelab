# The coding binding's Hindsight MCP token (key `token`), copied from
# hindsight/hindsight-keys by the hindsight-agents Job. The factory chart's
# RemoteMCPServer `memory` sends it as the Authorization header; the
# Substrate egress gateway injects it, so the actor holds only a placeholder.
# The label lets the credential provider read it.
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-mcp
  namespace: factory-r-homelab
  labels:
    substrate.ate.dev/injectable: "true"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-keys
  namespace: factory-r-homelab
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-mcp, hindsight-recall]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-keys
  namespace: factory-r-homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-keys
subjects:
  - kind: ServiceAccount
    name: hindsight-keys
    namespace: hindsight
---
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-connector
  namespace: factory
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-keys
  namespace: factory
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-connector]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-keys
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-keys
subjects:
  - kind: ServiceAccount
    name: hindsight-keys
    namespace: hindsight
---
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-recall
  namespace: factory-r-homelab
  labels:
    substrate.ate.dev/injectable: "true"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
