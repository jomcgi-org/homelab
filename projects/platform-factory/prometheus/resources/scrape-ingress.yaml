# Prometheus's way in at each target outside its namespace, on the metrics
# port only. They are cluster-wide policies so that they sync with Prometheus
# whether or not the target's namespace exists yet, and leave with it.
# Cilium allows the union of every policy selecting a pod, so each adds only
# this one flow to the target namespace's own allowlist.
#
# Host-network targets (kubelets, Cilium) are outside pod policy and need
# nothing here.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-scrape-kagent-controller
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kagent
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-scrape-factory-broker
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: factory
      app.kubernetes.io/name: factory-broker
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-scrape-factory-connector
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: factory
      app.kubernetes.io/name: factory-connector
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Every CloudNativePG instance: kagent-pg, factory-db and authentik-pg.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-scrape-cnpg
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/podRole: instance
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values: [kagent-pg, factory-db, authentik]
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: prometheus-scrape-garage
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: garage
      app.kubernetes.io/name: garage
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
