# promtool unit tests for rules.yml (BUILD: rules_test). One sample a minute.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # A root filesystem over 75% for 15 min fires once per node. One under it,
  # /boot, a loop device and the device of another mount do not.
  - interval: 1m
    input_series:
      - series: 'container_fs_usage_bytes{job="kubelet-cadvisor", id="/", node="node-1", device="overlay_0-72"}'
        values: "80x30"
      - series: 'container_fs_limit_bytes{job="kubelet-cadvisor", id="/", node="node-1", device="overlay_0-72"}'
        values: "100x30"
      - series: 'container_fs_usage_bytes{job="kubelet-cadvisor", id="/", node="node-1", device="overlay_0-79"}'
        values: "80x30"
      - series: 'container_fs_limit_bytes{job="kubelet-cadvisor", id="/", node="node-1", device="overlay_0-79"}'
        values: "100x30"
      - series: 'container_fs_usage_bytes{job="kubelet-cadvisor", id="/", node="node-2", device="overlay_0-59"}'
        values: "70x30"
      - series: 'container_fs_limit_bytes{job="kubelet-cadvisor", id="/", node="node-2", device="overlay_0-59"}'
        values: "100x30"
      - series: 'container_fs_usage_bytes{job="kubelet-cadvisor", id="/", node="node-2", device="/dev/nvme0n1p2"}'
        values: "90x30"
      - series: 'container_fs_limit_bytes{job="kubelet-cadvisor", id="/", node="node-2", device="/dev/nvme0n1p2"}'
        values: "100x30"
      - series: 'container_fs_usage_bytes{job="kubelet-cadvisor", id="/", node="node-1", device="/dev/loop0"}'
        values: "100x30"
      - series: 'container_fs_limit_bytes{job="kubelet-cadvisor", id="/", node="node-1", device="/dev/loop0"}'
        values: "100x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: NodeDiskFilling
        exp_alerts: []
      - eval_time: 20m
        alertname: NodeDiskFilling
        exp_alerts:
          - exp_labels:
              severity: warning
              node: node-1
            exp_annotations:
              action: "Inspect the largest directories on the root filesystem."
              graph: "max(container_fs_usage_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node=\"node-1\"} / container_fs_limit_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node=\"node-1\"})"
              threshold: "0.75"
              runbook: "https://factory-runbooks.jomcgi.dev/NodeDiskFilling"
              summary: "node-1's root filesystem is 80% full (threshold 75%)"
              description: 'Image garbage collection starts at 85% and the kubelet evicts pods at 90%. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # A new pod's first timeout: its counter appears at 1. It fires for an
  # hour, then stops. Successful suspends never fire.
  - interval: 1m
    input_series:
      - series: 'up{job="kagent-controller", pod="kagent-controller-a"}'
        values: "1x300"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-a"}'
        values: "-86400x300"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "_x120 1x180"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="OK", server_address="10.42.0.1"}'
        values: "1+1x300"
    alert_rule_test:
      - eval_time: 119m
        alertname: KagentSuspendTimedOut
        exp_alerts: []
      - eval_time: 125m
        alertname: KagentSuspendTimedOut
        exp_alerts: &timeout_1
          - exp_labels:
              severity: critical
              pod: kagent-controller-a
              timeouts: "1"
              started: "-86400"
            exp_annotations:
              action: "Recover the locked session using the suspend-timeout runbook."
              graph: "kagent:suspend_timeouts:sum{pod=\"kagent-controller-a\"}"
              threshold: "0"
              runbook: "https://factory-runbooks.jomcgi.dev/KagentSuspendTimedOut"
              summary: A kagent session suspend passed the 120-second deadline (1 since the controller started)
              description: &suspend_description 'The session can stay locked while the reaper waits five minutes. If the lock persists, use the suspend-timeout runbook.'
      - eval_time: 170m
        alertname: KagentSuspendTimedOut
        exp_alerts: *timeout_1
      - eval_time: 185m
        alertname: KagentSuspendTimedOut
        exp_alerts: []

  # A second timeout while the first one fires is a new alert, so
  # Alertmanager sends it.
  - interval: 1m
    input_series:
      - series: 'up{job="kagent-controller", pod="kagent-controller-a"}'
        values: "1x200"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-a"}'
        values: "-86400x200"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "_x30 1x30 2x140"
    alert_rule_test:
      - eval_time: 40m
        alertname: KagentSuspendTimedOut
        exp_alerts: *timeout_1
      - eval_time: 70m
        alertname: KagentSuspendTimedOut
        exp_alerts: &timeout_2
          - exp_labels:
              severity: critical
              pod: kagent-controller-a
              timeouts: "2"
              started: "-86400"
            exp_annotations:
              action: "Recover the locked session using the suspend-timeout runbook."
              graph: "kagent:suspend_timeouts:sum{pod=\"kagent-controller-a\"}"
              threshold: "0"
              runbook: "https://factory-runbooks.jomcgi.dev/KagentSuspendTimedOut"
              summary: A kagent session suspend passed the 120-second deadline (2 since the controller started)
              description: *suspend_description

  # A later timeout on an existing series fires for an hour after it.
  - interval: 1m
    input_series:
      - series: 'up{job="kagent-controller", pod="kagent-controller-a"}'
        values: "1x600"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-a"}'
        values: "-86400x600"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "1x400 2x200"
    alert_rule_test:
      - eval_time: 300m
        alertname: KagentSuspendTimedOut
        exp_alerts: []
      - eval_time: 420m
        alertname: KagentSuspendTimedOut
        exp_alerts: *timeout_2
      - eval_time: 470m
        alertname: KagentSuspendTimedOut
        exp_alerts: []

  # A container restart drops the counter; the first timeout after it
  # brings back the same series at 1, the value it had before. It fires.
  # A counter that existed when the rule started does not.
  - interval: 1m
    input_series:
      - series: 'up{job="kagent-controller", pod="kagent-controller-a"}'
        values: "1x300"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-a"}'
        values: "-86400x100 6060x200"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "1x100 stale _x18 1x180"
    alert_rule_test:
      - eval_time: 30m
        alertname: KagentSuspendTimedOut
        exp_alerts: []
      - eval_time: 110m
        alertname: KagentSuspendTimedOut
        exp_alerts: []
      - eval_time: 125m
        alertname: KagentSuspendTimedOut
        exp_alerts:
          - exp_labels:
              severity: critical
              pod: kagent-controller-a
              timeouts: "1"
              started: "6060"
            exp_annotations:
              action: "Recover the locked session using the suspend-timeout runbook."
              graph: "kagent:suspend_timeouts:sum{pod=\"kagent-controller-a\"}"
              threshold: "0"
              runbook: "https://factory-runbooks.jomcgi.dev/KagentSuspendTimedOut"
              summary: A kagent session suspend passed the 120-second deadline (1 since the controller started)
              description: *suspend_description

  # A timeout fires, then the controller restarts and its first scrape
  # already shows a timeout, with the same count. It is a new alert, with
  # the new start time, and the old one ends. It fires for the new
  # process's first hour.
  - interval: 1m
    input_series:
      - series: 'up{job="kagent-controller", pod="kagent-controller-a"}'
        values: "1x300"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-a"}'
        values: "-86400x100 6050x200"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "_x80 1x220"
    alert_rule_test:
      - eval_time: 90m
        alertname: KagentSuspendTimedOut
        exp_alerts: *timeout_1
      - eval_time: 105m
        alertname: KagentSuspendTimedOut
        exp_alerts:
          - exp_labels:
              severity: critical
              pod: kagent-controller-a
              timeouts: "1"
              started: "6050"
            exp_annotations:
              action: "Recover the locked session using the suspend-timeout runbook."
              graph: "kagent:suspend_timeouts:sum{pod=\"kagent-controller-a\"}"
              threshold: "0"
              runbook: "https://factory-runbooks.jomcgi.dev/KagentSuspendTimedOut"
              summary: A kagent session suspend passed the 120-second deadline (1 since the controller started)
              description: *suspend_description
      - eval_time: 165m
        alertname: KagentSuspendTimedOut
        exp_alerts: []

  # A failed scrape (up 0) for 20 min and a 40-minute gap with no samples
  # at all do not look like a timeout.
  - interval: 1m
    input_series:
      - series: 'up{job="kagent-controller", pod="kagent-controller-a"}'
        values: "1x100 0x20 1x180"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-a"}'
        values: "-86400x100 _x20 -86400x180"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "1x100 stale _x19 1x180"
      - series: 'up{job="kagent-controller", pod="kagent-controller-b"}'
        values: "1x100 _x40 1x160"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-b"}'
        values: "-86400x100 _x40 -86400x160"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-b", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "1x100 _x40 1x160"
    alert_rule_test:
      - eval_time: 125m
        alertname: KagentSuspendTimedOut
        exp_alerts: []
      - eval_time: 150m
        alertname: KagentSuspendTimedOut
        exp_alerts: []
      - eval_time: 200m
        alertname: KagentSuspendTimedOut
        exp_alerts: []

  # A second Substrate API server address gives a second series, which
  # starts at 1 while the first one exists. It fires.
  - interval: 1m
    input_series:
      - series: 'up{job="kagent-controller", pod="kagent-controller-a"}'
        values: "1x400"
      - series: 'process_start_time_seconds{job="kagent-controller", pod="kagent-controller-a"}'
        values: "-86400x400"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.1"}'
        values: "1x400"
      - series: 'rpc_client_call_duration_seconds_count{job="kagent-controller", pod="kagent-controller-a", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED", server_address="10.42.0.2"}'
        values: "_x300 1x100"
    alert_rule_test:
      - eval_time: 290m
        alertname: KagentSuspendTimedOut
        exp_alerts: []
      - eval_time: 310m
        alertname: KagentSuspendTimedOut
        exp_alerts: *timeout_2

  # A grant at 85% then 95%: the low-quota warning fires after 5 min at 95%.
  - interval: 1m
    input_series:
      - series: 'factory_broker_grant_quota_used_percent{grant="codex-primary", provider="codex", window="primary"}'
        values: "85x10 95x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: FactoryCodexQuotaLow
        exp_alerts: []
      - eval_time: 20m
        alertname: FactoryCodexQuotaLow
        exp_alerts:
          - exp_labels:
              severity: warning
              grant: codex-primary
              window: primary
            exp_annotations:
              action: "Schedule a quota reset for this grant."
              graph: "factory_broker_grant_quota_used_percent{grant=\"codex-primary\",window=\"primary\"}"
              threshold: "90"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaLow"
              summary: "Codex grant codex-primary has used 95% of its primary window (threshold 90%)"
              description: 'Coder and review turns stop at 100%. Plan a reset or another account. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # An exhausted grant pages after 5 min with the reset time of the window it
  # used up, not a later reset of another window; before that it is quiet.
  - interval: 1m
    input_series:
      - series: 'factory_broker_grant_quota_exhausted{grant="codex-primary"}'
        values: "0x10 1x20"
      - series: 'factory_broker_quota_resets_at_seconds{provider="codex", window="primary"}'
        values: "1795565640x30"
      - series: 'factory_broker_quota_resets_at_seconds{provider="codex", window="secondary"}'
        values: "1796000000x30"
      - series: 'factory_broker_grant_quota_used_percent{grant="codex-primary", provider="codex", window="primary"}'
        values: "100x30"
      - series: 'factory_broker_grant_quota_used_percent{grant="codex-primary", provider="codex", window="secondary"}'
        values: "40x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: FactoryCodexQuotaExhausted
        exp_alerts: []
      - eval_time: 20m
        alertname: FactoryCodexQuotaExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              grant: codex-primary
            exp_annotations:
              action: "Reset the exhausted grant."
              graph: "factory_broker_grant_quota_exhausted{grant=\"codex-primary\"}"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaExhausted"
              summary: "Codex grant codex-primary is out of quota (exhausted flag 1 of 1)"
              description: 'Coder turns fail until then. The primary window resets at 2026-11-25 00:14:00 +0000 UTC. Runbook: projects/factory-cluster/README.md, "Alerts". Codex login: https://factory.jomcgi.dev/admin/codex/'

  # A grant that needs a login pages after 10 min; ready is quiet.
  - interval: 1m
    input_series:
      - series: 'factory_broker_codex_grant_state{grant="codex-primary", state="ready"}'
        values: "1x10 0x20"
      - series: 'factory_broker_codex_grant_state{grant="codex-primary", state="login_required"}'
        values: "0x10 1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: FactoryCodexGrantNotReady
        exp_alerts: []
      - eval_time: 25m
        alertname: FactoryCodexGrantNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              grant: codex-primary
            exp_annotations:
              action: "Repeat device login for this grant."
              graph: "factory_broker_codex_grant_state{grant=\"codex-primary\",state!=\"ready\"}"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexGrantNotReady"
              summary: "Codex grant codex-primary is login_required (non-ready flag 1 of 1)"
              description: 'The broker cannot relay Codex turns with this grant. Runbook: projects/factory-cluster/README.md, "Alerts". Codex login: https://factory.jomcgi.dev/admin/codex/'

  # A grant that moves from login_required to error at 17 min stays not
  # ready: the alert fires 10 min after the first state, naming the current.
  - interval: 1m
    input_series:
      - series: 'factory_broker_codex_grant_state{grant="codex-primary", state="ready"}'
        values: "1x10 0x21"
      - series: 'factory_broker_codex_grant_state{grant="codex-primary", state="login_required"}'
        values: "0x10 1x5 0x15"
      - series: 'factory_broker_codex_grant_state{grant="codex-primary", state="error"}'
        values: "0x16 1x15"
    alert_rule_test:
      - eval_time: 20m
        alertname: FactoryCodexGrantNotReady
        exp_alerts: []
      - eval_time: 25m
        alertname: FactoryCodexGrantNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              grant: codex-primary
            exp_annotations:
              action: "Repeat device login for this grant."
              graph: "factory_broker_codex_grant_state{grant=\"codex-primary\",state!=\"ready\"}"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexGrantNotReady"
              summary: "Codex grant codex-primary is error (non-ready flag 1 of 1)"
              description: 'The broker cannot relay Codex turns with this grant. Runbook: projects/factory-cluster/README.md, "Alerts". Codex login: https://factory.jomcgi.dev/admin/codex/'

  # A grant refused with no window at 100% names every window's reset.
  - interval: 1m
    input_series:
      - series: 'factory_broker_grant_quota_exhausted{grant="codex-primary"}'
        values: "1x10"
      - series: 'factory_broker_quota_resets_at_seconds{provider="codex", window="primary"}'
        values: "1795565640x10"
      - series: 'factory_broker_grant_quota_used_percent{grant="codex-primary", provider="codex", window="primary"}'
        values: "97x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: FactoryCodexQuotaExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              grant: codex-primary
            exp_annotations:
              action: "Reset the exhausted grant."
              graph: "factory_broker_grant_quota_exhausted{grant=\"codex-primary\"}"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaExhausted"
              summary: "Codex grant codex-primary is out of quota (exhausted flag 1 of 1)"
              description: 'Coder turns fail until then. The primary window resets at 2026-11-25 00:14:00 +0000 UTC. Runbook: projects/factory-cluster/README.md, "Alerts". Codex login: https://factory.jomcgi.dev/admin/codex/'

  # A full window without a reset time says so; it never borrows the reset
  # of another window.
  - interval: 1m
    input_series:
      - series: 'factory_broker_grant_quota_exhausted{grant="codex-primary"}'
        values: "1x10"
      - series: 'factory_broker_grant_quota_used_percent{grant="codex-primary", provider="codex", window="primary"}'
        values: "100x10"
      - series: 'factory_broker_grant_quota_used_percent{grant="codex-primary", provider="codex", window="secondary"}'
        values: "40x10"
      - series: 'factory_broker_quota_resets_at_seconds{provider="codex", window="secondary"}'
        values: "1796000000x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: FactoryCodexQuotaExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              grant: codex-primary
            exp_annotations:
              action: "Reset the exhausted grant."
              graph: "factory_broker_grant_quota_exhausted{grant=\"codex-primary\"}"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaExhausted"
              summary: "Codex grant codex-primary is out of quota (exhausted flag 1 of 1)"
              description: 'Coder turns fail until then. The primary window has no reset time. Runbook: projects/factory-cluster/README.md, "Alerts". Codex login: https://factory.jomcgi.dev/admin/codex/'

  # A reading that goes stale and then disappears keeps one alert: it fires
  # 15 min after the reading turned stale, not 15 min after it disappeared.
  - interval: 1m
    input_series:
      - series: 'factory_broker_quota_observed_at_seconds{provider="codex"}'
        values: "0x130"
      - series: 'up{job="factory-broker"}'
        values: "1x200"
    alert_rule_test:
      - eval_time: 145m
        alertname: FactoryCodexQuotaReadingStale
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: codex
            exp_annotations:
              action: "Check the broker quota refresh logs."
              graph: "time() - max(factory_broker_quota_observed_at_seconds{provider=\"codex\"}) or vector(0)"
              threshold: "7200"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaReadingStale"
              summary: "The broker has no Codex quota reading (maximum age 2h)"
              description: 'The quota alerts cannot fire on an old reading. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # No quota reading at all (a fresh broker whose usage reads fail) fires
  # after 15 min.
  - interval: 1m
    input_series:
      - series: 'up{job="factory-broker"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: FactoryCodexQuotaReadingStale
        exp_alerts: []
      - eval_time: 20m
        alertname: FactoryCodexQuotaReadingStale
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: codex
            exp_annotations:
              action: "Check the broker quota refresh logs."
              graph: "time() - max(factory_broker_quota_observed_at_seconds{provider=\"codex\"}) or vector(0)"
              threshold: "7200"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaReadingStale"
              summary: "The broker has no Codex quota reading (maximum age 2h)"
              description: 'The quota alerts cannot fire on an old reading. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # A reading that stops at time 0 is stale after 2 h, and the alert fires
  # 15 min later.
  - interval: 1m
    input_series:
      - series: 'factory_broker_quota_observed_at_seconds{provider="codex"}'
        values: "0x200"
    alert_rule_test:
      - eval_time: 130m
        alertname: FactoryCodexQuotaReadingStale
        exp_alerts: []
      - eval_time: 140m
        alertname: FactoryCodexQuotaReadingStale
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: codex
            exp_annotations:
              action: "Check the broker quota refresh logs."
              graph: "time() - max(factory_broker_quota_observed_at_seconds{provider=\"codex\"}) or vector(0)"
              threshold: "7200"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaReadingStale"
              summary: "The broker has not read the Codex quota for 2h 20m 0s (maximum age 2h)"
              description: 'The quota alerts cannot fire on an old reading. Runbook: projects/factory-cluster/README.md, "Alerts".'


  # health.json turns unhealthy at 5 min with the test component alert-test
  # down. One alert fires 5 min later and names it; the next healthy file at
  # 25 min clears it.
  - interval: 1m
    input_series:
      - series: 'up{job="factory-health",instance="health-exporter:8080"}'
        values: "1x35"
      - series: 'factory_health_healthy'
        values: "1x4 0x19 1x10"
      - series: 'factory_health_component_up{component="factory-cluster"}'
        values: "1x35"
      - series: 'factory_health_component_up{component="alert-test"}'
        values: "_x5 0x19 stale"
    alert_rule_test:
      - eval_time: 9m
        alertname: FactoryHealthUnhealthy
        exp_alerts: []
      - eval_time: 10m
        alertname: FactoryHealthUnhealthy
        exp_alerts: &health_unhealthy
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Check each down component in health.json."
              graph: "factory_health_component_up"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
              summary: "Factory health is unhealthy, down: alert-test (healthy flag 0, minimum 1)"
              description: 'https://factory-data.jomcgi.dev/health.json reports status unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 24m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_unhealthy
      - eval_time: 25m
        alertname: FactoryHealthUnhealthy
        exp_alerts: []

  # The owner turns the alert check off while relay stays down. To 11 min
  # the file lists alert-test and relay down; reads fail at 12 and 13 min,
  # and the exporter keeps the series of the 11 min read; the next file, at
  # 14 min, lists relay only. The alert stays and names only the components
  # of the newest read.
  - interval: 1m
    input_series:
      - series: 'up{job="factory-health",instance="health-exporter:8080"}'
        values: "1x35"
      - series: 'factory_health_read_success'
        values: "1x11 0 0 1x21"
      - series: 'factory_health_healthy'
        values: "1x4 0x30"
      - series: 'factory_health_component_up{component="factory-cluster"}'
        values: "1x35"
      - series: 'factory_health_component_up{component="relay"}'
        values: "1x4 0x30"
      - series: 'factory_health_component_up{component="alert-test"}'
        values: "_x5 0x8 stale"
    alert_rule_test:
      - eval_time: 10m
        alertname: FactoryHealthUnhealthy
        exp_alerts: &health_two_down
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Check each down component in health.json."
              graph: "factory_health_component_up"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
              summary: "Factory health is unhealthy, down: alert-test, relay (healthy flag 0, minimum 1)"
              description: 'https://factory-data.jomcgi.dev/health.json reports status unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 13m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_two_down
      - eval_time: 14m
        alertname: FactoryHealthUnhealthy
        exp_alerts: &health_relay_down
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Check each down component in health.json."
              graph: "factory_health_component_up"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
              summary: "Factory health is unhealthy, down: relay (healthy flag 0, minimum 1)"
              description: 'https://factory-data.jomcgi.dev/health.json reports status unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 30m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_relay_down

  # Reads fail from 10 to 19 min while the file is unhealthy: the exporter
  # keeps the series of the last valid read. The alert stays, and lists both
  # components.
  - interval: 1m
    input_series:
      - series: 'factory_health_read_success'
        values: "1x9 0x9 1x10"
      - series: 'factory_health_healthy'
        values: "0x29"
      - series: 'factory_health_component_up{component="factory-cluster"}'
        values: "0x29"
      - series: 'factory_health_component_up{component="jomcgi-site-worker"}'
        values: "0x29"
    alert_rule_test:
      - eval_time: 15m
        alertname: FactoryHealthUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Check each down component in health.json."
              graph: "factory_health_component_up"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
              summary: "Factory health is unhealthy, down: factory-cluster, jomcgi-site-worker (healthy flag 0, minimum 1)"
              description: 'https://factory-data.jomcgi.dev/health.json reports status unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # Prometheus cannot scrape the exporter at 3 min, and at 10 and 11 min
  # (up 0). Each failed scrape marks every series stale. The pending alert
  # keeps its timer and fires at 5 min; the firing alert stays through the
  # gap and says that the component list is unknown. The successful scrape
  # at 12 min reads unhealthy and lists relay again.
  - interval: 1m
    input_series:
      - series: 'up{job="factory-health",instance="health-exporter:8080"}'
        values: "1x2 0 1x5 0 0 1x10"
      - series: 'factory_health_healthy'
        values: "0x2 stale 0x5 stale _ 0x10"
      - series: 'factory_health_component_up{component="factory-cluster"}'
        values: "1x2 stale 1x5 stale _ 1x10"
      - series: 'factory_health_component_up{component="relay"}'
        values: "0x2 stale 0x5 stale _ 0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: FactoryHealthUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: FactoryHealthUnhealthy
        exp_alerts: &health_relay_only
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Check each down component in health.json."
              graph: "factory_health_component_up"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
              summary: "Factory health is unhealthy, down: relay (healthy flag 0, minimum 1)"
              description: 'https://factory-data.jomcgi.dev/health.json reports status unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 10m
        alertname: FactoryHealthUnhealthy
        exp_alerts: &health_scrape_failing
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Check each down component in health.json."
              graph: "factory_health_component_up"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
              summary: "Factory health is unhealthy, components unknown: the health exporter scrape is failing (healthy flag 0, minimum 1)"
              description: 'https://factory-data.jomcgi.dev/health.json reports status unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 11m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_scrape_failing
      - eval_time: 12m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_relay_only
      - eval_time: 22m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_relay_only

  # The same scrape gap at 10 and 11 min, but the successful scrape at
  # 12 min reads healthy. The alert clears at 12 min.
  - interval: 1m
    input_series:
      - series: 'up{job="factory-health",instance="health-exporter:8080"}'
        values: "1x9 0 0 1x10"
      - series: 'factory_health_healthy'
        values: "0x9 stale _ 1x10"
      - series: 'factory_health_component_up{component="factory-cluster"}'
        values: "1x9 stale _ 1x10"
      - series: 'factory_health_component_up{component="relay"}'
        values: "0x9 stale _ 1x10"
    alert_rule_test:
      - eval_time: 11m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_scrape_failing
      - eval_time: 12m
        alertname: FactoryHealthUnhealthy
        exp_alerts: []

  # The owner turns the alert check off while relay stays down. The
  # successful scrape at 8 min drops alert-test. The scrapes at 9 and 10 min
  # fail (up 0) while the old alert-test sample is still in the 15 min
  # window. The summary does not name alert-test again: in the gap it says
  # that the component list is unknown, and the scrape at 11 min lists relay.
  - interval: 1m
    input_series:
      - series: 'up{job="factory-health",instance="health-exporter:8080"}'
        values: "1x8 0 0 1x10"
      - series: 'factory_health_healthy'
        values: "0x8 stale _ 0x10"
      - series: 'factory_health_component_up{component="factory-cluster"}'
        values: "1x8 stale _ 1x10"
      - series: 'factory_health_component_up{component="relay"}'
        values: "0x8 stale _ 0x10"
      - series: 'factory_health_component_up{component="alert-test"}'
        values: "0x7 stale"
    alert_rule_test:
      - eval_time: 7m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_two_down
      - eval_time: 8m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_relay_only
      - eval_time: 9m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_scrape_failing
      - eval_time: 10m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_scrape_failing
      - eval_time: 11m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_relay_only
      - eval_time: 20m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_relay_only

  # Prometheus cannot scrape the exporter from 11 min on. The 10 min read
  # was unhealthy, with a new file (generatedAt 600). FactoryHealthStale
  # fires at 23 min, when that file is more than 10 min old for 2 min, and
  # stays. FactoryHealthUnhealthy keeps the healthy flag of the 10 min read,
  # with the component list unknown, until the read leaves its 15 min window
  # at 25 min. At least one of them always fires.
  - interval: 1m
    input_series:
      - series: 'up{job="factory-health",instance="health-exporter:8080"}'
        values: "1x10 0x30"
      - series: 'factory_health_generated_at_seconds'
        values: "0+60x10 stale"
      - series: 'factory_health_healthy'
        values: "0x10 stale"
      - series: 'factory_health_component_up{component="relay"}'
        values: "0x10 stale"
    alert_rule_test:
      - eval_time: 22m
        alertname: FactoryHealthStale
        exp_alerts: []
      - eval_time: 22m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_scrape_failing
      - eval_time: 23m
        alertname: FactoryHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              action: "Check the factory-public health and mirror CronJobs."
              graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
              threshold: "600"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
              summary: "The newest health.json is 13m 0s old (maximum age 10m)"
              description: 'Public readers see an old status. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 24m
        alertname: FactoryHealthUnhealthy
        exp_alerts: *health_scrape_failing
      - eval_time: 25m
        alertname: FactoryHealthUnhealthy
        exp_alerts: []
      - eval_time: 40m
        alertname: FactoryHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              action: "Check the factory-public health and mirror CronJobs."
              graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
              threshold: "600"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
              summary: "Prometheus read no health.json in 15m (maximum age 10m)"
              description: 'Public readers see an old status. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # The writer stops at 10 min: generatedAt stays 600 while reads succeed.
  # The file is more than 10 min old from 21 min and the alert fires 2 min
  # later. A new file at 32 min clears it.
  - interval: 1m
    input_series:
      - series: 'factory_health_generated_at_seconds'
        values: "0+60x10 600x20 1920+60x5"
    alert_rule_test:
      - eval_time: 22m
        alertname: FactoryHealthStale
        exp_alerts: []
      - eval_time: 23m
        alertname: FactoryHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              action: "Check the factory-public health and mirror CronJobs."
              graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
              threshold: "600"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
              summary: "The newest health.json is 13m 0s old (maximum age 10m)"
              description: 'Public readers see an old status. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 32m
        alertname: FactoryHealthStale
        exp_alerts: []

  # A fresh file with a 5 min read gap is quiet: the exporter keeps the
  # generatedAt of its last valid read. A stale file whose exporter then
  # stops answering keeps the one alert after the last scrape leaves the
  # 15 min window.
  - interval: 1m
    input_series:
      - series: 'factory_health_generated_at_seconds'
        values: "0+60x10 600x4 900+60x5 1200x4 stale"
    alert_rule_test:
      - eval_time: 15m
        alertname: FactoryHealthStale
        exp_alerts: []
      - eval_time: 36m
        alertname: FactoryHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              action: "Check the factory-public health and mirror CronJobs."
              graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
              threshold: "600"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
              summary: "The newest health.json is 16m 0s old (maximum age 10m)"
              description: 'Public readers see an old status. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 46m
        alertname: FactoryHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              action: "Check the factory-public health and mirror CronJobs."
              graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
              threshold: "600"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
              summary: "Prometheus read no health.json in 15m (maximum age 10m)"
              description: 'Public readers see an old status. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # No valid read at all: every read fails from the start, so the exporter
  # has no series to keep. It fires after 2 min.
  - interval: 1m
    input_series:
      - series: 'factory_health_read_success'
        values: "0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryHealthStale
        exp_alerts: []
      - eval_time: 2m
        alertname: FactoryHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              action: "Check the factory-public health and mirror CronJobs."
              graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
              threshold: "600"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
              summary: "Prometheus read no health.json in 15m (maximum age 10m)"
              description: 'Public readers see an old status. Runbook: projects/factory-cluster/README.md, "Alerts".'


  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="prometheus",deployment="alert-relay"}'
        values: "1 0x6"
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertRelayDown
        exp_alerts: []
      - eval_time: 6m
        alertname: AlertRelayDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Restore one ready alert-relay replica."
              graph: "min(kube_deployment_status_replicas_available{namespace=\"prometheus\",deployment=\"alert-relay\"}) or vector(0)"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/AlertRelayDown"
              summary: "Alert relay has 0 available replicas (minimum 1)"

  - interval: 1m
    input_series:
      - series: 'kube_job_failed{namespace="factory",job_name="factory-semgrep-sync-10",condition="true"}'
        values: "1x3"
      - series: 'kube_job_status_start_time{namespace="factory",job_name="factory-semgrep-sync-10"}'
        values: "10x3"
      - series: 'kube_job_status_start_time{namespace="factory",job_name="factory-semgrep-sync-20"}'
        values: "_ _ 20x1"
    alert_rule_test:
      - eval_time: 1m
        alertname: SemgrepSyncFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: factory
              job_name: factory-semgrep-sync-10
              condition: "true"
            exp_annotations:
              action: "Inspect the failed sync Job's logs."
              graph: 'kube_job_failed{namespace="factory",job_name="factory-semgrep-sync-10",condition="true"}'
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/SemgrepSyncFailed"
              summary: "Latest Semgrep to INTSEC sync factory/factory-semgrep-sync-10 failed (failure flag 1, threshold 1)"
      - eval_time: 3m
        alertname: SemgrepSyncFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'factory_connector_itsaplan_unavailable{job="factory-connector",phase="admissions"}'
        values: "1x10 stale"
    alert_rule_test:
      - eval_time: 9m
        alertname: FactoryItsaplanOutage
        exp_alerts: []
      - eval_time: 10m
        alertname: FactoryItsaplanOutage
        exp_alerts:
          - exp_labels:
              severity: critical
              phase: admissions
            exp_annotations:
              action: "Inspect connector logs for the affected dispatch phase and check the coordinator key counter."
              graph: 'max(factory_connector_itsaplan_unavailable{job="factory-connector",phase="admissions"})'
              threshold: "1"
              runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/factory/deploy/notify.md#home-385-rollout-verification"
              summary: "Factory admissions has been failing on itsaplan for ten minutes"
      - eval_time: 11m
        alertname: FactoryItsaplanOutage
        exp_alerts: []

  # The egress IP changes at 31 min: the old series goes stale and a new one
  # starts. The alert fires at the first scrape of the new address, names
  # both addresses even after the exporter stops, and clears when the old
  # one leaves the one-hour window.
  - interval: 1m
    input_series:
      - series: 'factory_egress_ip_observed_timestamp_seconds{job="cloudflare",instance="cloudflare-exporter:8080",ip="192.0.2.10"}'
        values: "0+60x30 stale"
      - series: 'factory_egress_ip_observed_timestamp_seconds{job="cloudflare",instance="cloudflare-exporter:8080",ip="198.51.100.20"}'
        values: "_x31 1860+60x15 stale"
    alert_rule_test:
      - eval_time: 30m
        alertname: FactoryEgressIPChanged
        exp_alerts: []
      - eval_time: 31m
        alertname: FactoryEgressIPChanged
        exp_alerts: &egress_changed
          - exp_labels:
              severity: warning
            exp_annotations:
              action: "Allow the new egress IP in the IP filter of each factory Cloudflare credential."
              graph: "count(max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[1h])))"
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/FactoryEgressIPChanged"
              summary: "The factory egress IP changed to 198.51.100.20 from 192.0.2.10 (2 addresses in 1h, maximum 1)"
              description: 'Each factory Cloudflare API token and R2 key fails until its IP filter allows the new address. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 89m
        alertname: FactoryEgressIPChanged
        exp_alerts: *egress_changed
      - eval_time: 90m
        alertname: FactoryEgressIPChanged
        exp_alerts: []

  # An exporter restart, or a new instance label, with the same address is
  # no change.
  - interval: 1m
    input_series:
      - series: 'factory_egress_ip_observed_timestamp_seconds{job="cloudflare",instance="a",ip="192.0.2.10"}'
        values: "0+60x30 stale"
      - series: 'factory_egress_ip_observed_timestamp_seconds{job="cloudflare",instance="b",ip="192.0.2.10"}'
        values: "_x35 2100+60x30"
    alert_rule_test:
      - eval_time: 40m
        alertname: FactoryEgressIPChanged
        exp_alerts: []

  # Cloudflare refuses the health token from 11 min to 30 min, and the site
  # token for 4 min only. The alert fires for the health token after 5 min,
  # names it and the current egress IP, and clears at the next accepted
  # check.
  - interval: 1m
    input_series:
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x10 0x19 1x10"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x41"
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.cfgate-system.svc:8080",credential="factory-cloudflare-api-token"}'
        values: "1x40"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.cfgate-system.svc:8080",credential="factory-cloudflare-api-token"}'
        values: "1x40"
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.jomcgi-site-prod.svc:8080",credential="jomcgi-site-cloudflare"}'
        values: "1x5 0x3 1x31"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.jomcgi-site-prod.svc:8080",credential="jomcgi-site-cloudflare"}'
        values: "1x41"
      - series: 'factory_egress_ip_info{job="cloudflare",instance="cloudflare-exporter:8080",ip="198.51.100.20"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: CloudflareCredentialRefused
        exp_alerts: []
      - eval_time: 15m
        alertname: CloudflareCredentialRefused
        exp_alerts: []
      - eval_time: 16m
        alertname: CloudflareCredentialRefused
        exp_alerts: &health_refused
          - exp_labels:
              severity: critical
              credential: factory-health-cloudflare
            exp_annotations:
              action: "Allow the egress IP in this token's Cloudflare IP filter, or replace the token."
              graph: 'factory_cloudflare_credential_auth_success{credential="factory-health-cloudflare"}'
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/CloudflareCredentialRefused"
              summary: "Cloudflare refuses API token factory-health-cloudflare from egress IP 198.51.100.20 (auth success 0, minimum 1)"
              description: &refused_description 'Its read-only check gets HTTP 401 or 403. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 30m
        alertname: CloudflareCredentialRefused
        exp_alerts: *health_refused
      - eval_time: 31m
        alertname: CloudflareCredentialRefused
        exp_alerts: []

  # A firing refusal stays on through unanswered checks and clears only
  # when a check accepts the token.
  - interval: 1m
    input_series:
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "0x12 1x8"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x7 0x4 1x8"
      - series: 'factory_egress_ip_info{job="cloudflare",instance="cloudflare-exporter:8080",ip="192.0.2.10"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 7m
        alertname: CloudflareCredentialRefused
        exp_alerts: &held_refused
          - exp_labels:
              severity: critical
              credential: factory-health-cloudflare
            exp_annotations:
              action: "Allow the egress IP in this token's Cloudflare IP filter, or replace the token."
              graph: 'factory_cloudflare_credential_auth_success{credential="factory-health-cloudflare"}'
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/CloudflareCredentialRefused"
              summary: "Cloudflare refuses API token factory-health-cloudflare from egress IP 192.0.2.10 (auth success 0, minimum 1)"
              description: 'Its read-only check gets HTTP 401 or 403. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 10m
        alertname: CloudflareCredentialRefused
        exp_alerts: *held_refused
      - eval_time: 14m
        alertname: CloudflareCredentialRefused
        exp_alerts: []

  # A credential exporter restart during a firing refusal drops
  # auth_success while its first probe goes unanswered. The alert stays on
  # and clears only at an accepted check.
  - interval: 1m
    input_series:
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "0x7 stale _x5 1x6"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x7 0x6 1x6"
      - series: 'factory_egress_ip_info{job="cloudflare",instance="cloudflare-exporter:8080",ip="192.0.2.10"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 7m
        alertname: CloudflareCredentialRefused
        exp_alerts: &restart_refused
          - exp_labels:
              severity: critical
              credential: factory-health-cloudflare
            exp_annotations:
              action: "Allow the egress IP in this token's Cloudflare IP filter, or replace the token."
              graph: 'factory_cloudflare_credential_auth_success{credential="factory-health-cloudflare"}'
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/CloudflareCredentialRefused"
              summary: "Cloudflare refuses API token factory-health-cloudflare from egress IP 192.0.2.10 (auth success 0, minimum 1)"
              description: 'Its read-only check gets HTTP 401 or 403. Runbook: projects/factory-cluster/README.md, "Alerts".'
      - eval_time: 12m
        alertname: CloudflareCredentialRefused
        exp_alerts: *restart_refused
      - eval_time: 15m
        alertname: CloudflareCredentialRefused
        exp_alerts: []

  # After an exporter restart whose first trace read fails, the exporter has
  # no address. The newest address had one sample between five-minute steps.
  - interval: 1m
    input_series:
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x10 0x15"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x25"
      - series: 'factory_egress_ip_info{job="cloudflare",instance="cloudflare-exporter:8080",ip="192.0.2.10"}'
        values: "1x10 stale"
      - series: 'factory_egress_ip_info{job="cloudflare",instance="cloudflare-exporter:8080",ip="198.51.100.20"}'
        values: "_x10 1 stale"
      - series: 'factory_egress_ip_observed_timestamp_seconds{ip="192.0.2.10"}'
        values: "0+60x10 stale"
      - series: 'factory_egress_ip_observed_timestamp_seconds{ip="198.51.100.20"}'
        values: "_x10 660 stale"
      - series: 'factory_egress_ip_read_success{job="cloudflare",instance="cloudflare-exporter:8080"}'
        values: "1x10 0x15"
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudflareCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              credential: factory-health-cloudflare
            exp_annotations:
              action: "Allow the egress IP in this token's Cloudflare IP filter, or replace the token."
              graph: 'factory_cloudflare_credential_auth_success{credential="factory-health-cloudflare"}'
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/CloudflareCredentialRefused"
              summary: "Cloudflare refuses API token factory-health-cloudflare from last known egress IP 198.51.100.20 (the egress IP read is failing, so the address may be stale) (auth success 0, minimum 1)"
              description: 'Its read-only check gets HTTP 401 or 403. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # One refusal followed only by unanswered checks does not fire: the
  # exporter keeps the refusal but sets check_success to 0.
  - interval: 1m
    input_series:
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x2 0x20"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x3 0x19"
      - series: 'factory_egress_ip_info{job="cloudflare",instance="cloudflare-exporter:8080",ip="192.0.2.10"}'
        values: "1x22"
    alert_rule_test:
      - eval_time: 10m
        alertname: CloudflareCredentialRefused
        exp_alerts: []
      - eval_time: 20m
        alertname: CloudflareCredentialRefused
        exp_alerts: []

  # A refused credential while the egress IP read fails names the last
  # address as last known and says that the read is failing.
  - interval: 1m
    input_series:
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "0x10"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.factory-public.svc:8080",credential="factory-health-cloudflare"}'
        values: "1x10"
      - series: 'factory_egress_ip_info{job="cloudflare",instance="cloudflare-exporter:8080",ip="192.0.2.10"}'
        values: "1x10"
      - series: 'factory_egress_ip_observed_timestamp_seconds{ip="192.0.2.10"}'
        values: "0x10"
      - series: 'factory_egress_ip_read_success{job="cloudflare",instance="cloudflare-exporter:8080"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: CloudflareCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              credential: factory-health-cloudflare
            exp_annotations:
              action: "Allow the egress IP in this token's Cloudflare IP filter, or replace the token."
              graph: 'factory_cloudflare_credential_auth_success{credential="factory-health-cloudflare"}'
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/CloudflareCredentialRefused"
              summary: "Cloudflare refuses API token factory-health-cloudflare from last known egress IP 192.0.2.10 (the egress IP read is failing, so the address may be stale) (auth success 0, minimum 1)"
              description: 'Its read-only check gets HTTP 401 or 403. Runbook: projects/factory-cluster/README.md, "Alerts".'

  # A refused credential with no egress IP read says that the address is
  # unknown.
  - interval: 1m
    input_series:
      - series: 'factory_cloudflare_credential_auth_success{job="cloudflare",instance="cloudflare-exporter.cfgate-system.svc:8080",credential="factory-cloudflare-api-token"}'
        values: "0x10"
      - series: 'factory_cloudflare_credential_check_success{job="cloudflare",instance="cloudflare-exporter.cfgate-system.svc:8080",credential="factory-cloudflare-api-token"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: CloudflareCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              credential: factory-cloudflare-api-token
            exp_annotations:
              action: "Allow the egress IP in this token's Cloudflare IP filter, or replace the token."
              graph: 'factory_cloudflare_credential_auth_success{credential="factory-cloudflare-api-token"}'
              threshold: "1"
              runbook: "https://factory-runbooks.jomcgi.dev/CloudflareCredentialRefused"
              summary: "Cloudflare refuses API token factory-cloudflare-api-token from egress IP unknown (auth success 0, minimum 1)"
              description: *refused_description

  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="kubelet-resource",namespace="factory-r-homelab-review",pod="homelab-reviewer-a",container="worker"}'
        values: '100x389 200 stale _x10'
      - series: 'container_memory_working_set_bytes{job="kubelet-resource",namespace="factory-r-homelab-review",pod="homelab-reviewer-a",container="sidecar"}'
        values: '20x390 stale _x10'
      - series: 'container_memory_working_set_bytes{job="kubelet-resource",namespace="factory-r-homelab-review",pod="homelab-reviewer-b",container="worker"}'
        values: '110x390 stale _x10'
    promql_expr_test:
      - expr: capacity:workload_pod_memory_budget_exceeded
        eval_time: 6h
        exp_samples:
          - labels: 'capacity:workload_pod_memory_budget_exceeded{namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="baseline"}'
            value: 0
          - labels: 'capacity:workload_pod_memory_budget_exceeded{namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="forecast"}'
            value: 0
      - expr: capacity:workload_pod_memory_budget_exceeded
        eval_time: 6h30m
        exp_samples:
          - labels: 'capacity:workload_pod_memory_budget_exceeded{namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="baseline"}'
            value: 1
          - labels: 'capacity:workload_pod_memory_budget_exceeded{namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="forecast"}'
            value: 1
      - expr: capacity:workload_pod_memory_budget_exceeded
        eval_time: 6h35m
        exp_samples: []

  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="kubelet-resource",namespace="factory-r-homelab-review",pod="homelab-reviewer-a",container="worker"}'
        values: '100x65'
      - series: 'capacity_forecast_memory_budget_bytes{job="capacity-forecast",namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="timestral",horizon_seconds="1800"}'
        values: '_x31 90x10'
      - series: 'capacity_forecast_target_timestamp_seconds{job="capacity-forecast",namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="timestral",horizon_seconds="1800"}'
        values: '_x31 3600x10'
    promql_expr_test:
      - expr: 'capacity:workload_pod_memory_budget_exceeded{policy="timestral"}'
        eval_time: 1h
        exp_samples:
          - labels: 'capacity:workload_pod_memory_budget_exceeded{namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="timestral"}'
            value: 1
      - expr: 'capacity:workload_pod_memory_budget_exceeded{policy="timestral"}'
        eval_time: 1h5m
        exp_samples: []

  # Evaluate four minutes after each wall-clock boundary. The later lookup
  # sees the next batch, so the scored budget must come from the earlier one.
  - start_timestamp: 1970-01-01T00:04:00Z
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="kubelet-resource",namespace="factory-r-homelab-review",pod="homelab-reviewer-a",container="worker"}'
        values: '100x65'
      - series: 'capacity_forecast_memory_budget_bytes{job="capacity-forecast",namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="timestral",horizon_seconds="1800"}'
        values: '_x26 90x4 110x4'
      - series: 'capacity_forecast_target_timestamp_seconds{job="capacity-forecast",namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="timestral",horizon_seconds="1800"}'
        values: '_x26 3600x4 3900x4'
    promql_expr_test:
      - expr: 'capacity:workload_pod_memory_budget_exceeded{policy="timestral"}'
        eval_time: 1h
        exp_samples:
          - labels: 'capacity:workload_pod_memory_budget_exceeded{namespace="factory-r-homelab-review",workload="homelab-reviewer",policy="timestral"}'
            value: 1

  - interval: 1m
    input_series:
      - series: 'factory_connector_runnable_runs{job="factory-connector"}'
        values: "1x32"
      - series: 'factory_connector_sends_total{job="factory-connector",kind="initial",outcome="accepted"}'
        values: "0x30 1x1"
    alert_rule_test:
      - eval_time: 29m
        alertname: FactoryConnectorStalled
        exp_alerts: []
      - eval_time: 30m
        alertname: FactoryConnectorStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              action: "Check connector logs for dispatch errors and compare occupied scheduler slots by agent with its concurrency limit."
              graph: 'max(factory_connector_runnable_runs{job="factory-connector"})'
              threshold: "0"
              runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/factory/deploy/notify.md#factoryconnectorstalled"
              summary: "Runnable factory runs have waited 30 minutes without a successful send."
      - eval_time: 31m
        alertname: FactoryConnectorStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'factory_connector_runnable_runs{job="factory-connector"}'
        values: "0x40"
      - series: 'factory_connector_held_runs{job="factory-connector"}'
        values: "2x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: FactoryConnectorStalled
        exp_alerts: []

  # A send at minute 29 prevents notification even if other work keeps waiting.
  - interval: 1m
    input_series:
      - series: 'factory_connector_runnable_runs{job="factory-connector"}'
        values: "1x31"
      - series: 'factory_connector_sends_total{job="factory-connector",kind="initial",outcome="accepted"}'
        values: "0x28 1x2"
    alert_rule_test:
      - eval_time: 28m
        alertname: FactoryConnectorStalled
        exp_alerts: []
      - eval_time: 29m
        alertname: FactoryConnectorStalled
        exp_alerts: []
      - eval_time: 30m
        alertname: FactoryConnectorStalled
        exp_alerts: []
