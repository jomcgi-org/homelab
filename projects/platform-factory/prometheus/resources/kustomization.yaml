apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prometheus and kube-state-metrics for the operators' metrics view
# (projects/factory-cluster/README.md, "Metrics view"), Alertmanager for its
# alerts ("Alerts"), the namespace's allowlist and the scrape ingress rules at
# each target. health-exporter reads the public factory health file.
# cloudflare-exporter reads the egress IP and checks the factory's Cloudflare
# credentials, each in the namespace of its Secret (HOME-634).
resources:
  - network-policy.yaml
  - scrape-ingress.yaml
  - kube-state-metrics.yaml
  - health-exporter.yaml
  - cloudflare-exporter.yaml
  - prometheus.yaml
  - alertmanager.yaml

configMapGenerator:
  - name: prometheus-config
    namespace: prometheus
    files:
      - prometheus.yml
      - rules.yml
  - name: alertmanager-config
    namespace: prometheus
    files:
      - alertmanager.yml
  - name: health-exporter
    namespace: prometheus
    files:
      - health_exporter.py
  # One copy of the script in each namespace that runs it.
  - name: cloudflare-exporter
    namespace: prometheus
    files:
      - cloudflare_exporter.py
  - name: cloudflare-exporter
    namespace: cfgate-system
    files:
      - cloudflare_exporter.py
  - name: cloudflare-exporter
    namespace: jomcgi-site-prod
    files:
      - cloudflare_exporter.py
