# Prometheus's alert rules (prometheus.yml loads them). Alertmanager
# (../stack/alertmanager.yml) sends each one to the homelab Discord channel. The
# runbook for each alert is in projects/factory-cluster/README.md, "Alerts".
groups:
  - name: nodes
    rules:
      # cAdvisor reports each container's writable layer (device overlay_*)
      # with the usage of the filesystem under it: the one that holds
      # containerd's images and layers. k3s keeps containerd, the kubelet
      # directory and the local-path volumes on the root filesystem, because
      # projects/factory-cluster/nodes/k3s-config.yaml sets no other data
      # directory. cAdvisor divides used bytes by all blocks. `df` divides
      # them by the blocks that ext4 does not reserve for root (5%), so `df`
      # reads about 4 points higher. Dividing by 0.95 gives the `df` value
      # that a person sees on the node.
      # On 2026-11-23 the kubelet tainted node-1 for disk pressure at 86% and
      # again at 80% by `df`, and the factory had no alert for it.
      # The warning fires 8 points before the second taint and the critical
      # alert 2 points before it.
      - alert: NodeDiskFilling
        expr: |
          max by (node) (
            container_fs_usage_bytes{job="kubelet-cadvisor", id="/", device=~"overlay_.+"}
              / container_fs_limit_bytes{job="kubelet-cadvisor", id="/", device=~"overlay_.+"}
          ) / 0.95 > 0.72
        for: 10m
        labels:
          severity: warning
        annotations:
          action: "Remove build and test leftovers from the node; the runbook lists them."
          graph: "max(container_fs_usage_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node={{ printf \"%q\" $labels.node }}} / container_fs_limit_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node={{ printf \"%q\" $labels.node }}}) / 0.95"
          threshold: "0.72"
          runbook: "https://factory-runbooks.jomcgi.dev/NodeDiskFilling"
          summary: "{{ $labels.node }}'s root filesystem is {{ $value | humanizePercentage }} full by df (threshold 72%)"
          description: >-
            The disk-pressure taint was observed at about 80% by df, and
            then no new pod starts on the node. Image garbage collection
            starts at 85% and the kubelet evicts pods at 90% (the same file).
            Runbook: projects/factory-cluster/README.md, "Alerts".
      - alert: NodeDiskCritical
        expr: |
          max by (node) (
            container_fs_usage_bytes{job="kubelet-cadvisor", id="/", device=~"overlay_.+"}
              / container_fs_limit_bytes{job="kubelet-cadvisor", id="/", device=~"overlay_.+"}
          ) / 0.95 > 0.78
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Free space on the node now, before the kubelet taints it."
          graph: "max(container_fs_usage_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node={{ printf \"%q\" $labels.node }}} / container_fs_limit_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node={{ printf \"%q\" $labels.node }}}) / 0.95"
          threshold: "0.78"
          runbook: "https://factory-runbooks.jomcgi.dev/NodeDiskCritical"
          summary: "{{ $labels.node }}'s root filesystem is {{ $value | humanizePercentage }} full by df (threshold 78%)"
          description: >-
            The disk-pressure taint was observed at about 80% by df. Runbook:
            projects/factory-cluster/README.md, "Alerts".
      # kube-state-metrics reports the kubelet's DiskPressure condition and
      # the taint that the node lifecycle controller adds with it. Either one
      # means that the scheduler places no new pod on the node.
      - alert: NodeDiskPressure
        expr: |
          max by (node) (kube_node_status_condition{job="kube-state-metrics", condition="DiskPressure", status="true"} == 1)
          or
          max by (node) (kube_node_spec_taint{job="kube-state-metrics", key="node.kubernetes.io/disk-pressure"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          action: "Free space on the node; the taint clears a few minutes later."
          graph: "max(kube_node_status_condition{job=\"kube-state-metrics\",condition=\"DiskPressure\",status=\"true\",node={{ printf \"%q\" $labels.node }}})"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/NodeDiskPressure"
          summary: "{{ $labels.node }} has the disk-pressure condition or taint (flag {{ $value }}, threshold 1)"
          description: >-
            No new pod starts on the node. Pods that need a volume or a
            worker slot there stay Pending. Runbook:
            projects/factory-cluster/README.md, "Alerts".
      # kube-state-metrics sets this flag when the PodScheduled condition is
      # False with reason Unschedulable. That is the state that the scheduler's
      # FailedScheduling event reports. Kubernetes events are not metrics.
      - alert: PodsUnschedulable
        expr: count(kube_pod_status_unschedulable{job="kube-state-metrics"} == 1) > 0
        for: 20m
        labels:
          severity: warning
        annotations:
          action: "Find the pods and the event that says why they do not fit."
          graph: "count by (namespace) (kube_pod_status_unschedulable{job=\"kube-state-metrics\"} == 1)"
          threshold: "0"
          runbook: "https://factory-runbooks.jomcgi.dev/PodsUnschedulable"
          summary: "{{ $value }} pods have been unschedulable for 20 min (threshold 0)"
          description: >-
            The usual causes are a node with disk pressure or too few CPU,
            memory or volume resources. Runbook:
            projects/factory-cluster/README.md, "Alerts".

  - name: kagent
    rules:
      # The suspend timeouts that the kagent controller process has counted,
      # or 0 while its target is up and it has counted none. The counter
      # itself first appears at 1, in a new pod or after a container
      # restart; the 0 before it makes that first timeout a step. While the
      # target is down this is absent, so a scrape gap is no step.
      - record: kagent:suspend_timeouts:sum
        expr: |
          sum by (pod) (rpc_client_call_duration_seconds_count{job="kagent-controller", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED"})
          or
          0 * group by (pod) (up{job="kagent-controller"} == 1)
      # The deployed controller allows 120 seconds for SuspendActor. A suspend
      # past it can leave the Actor SUSPENDING and hold its worker slot.
      # The alert fires for an hour after the count rises, or while a
      # controller process younger than an hour has counted a timeout: its
      # first scrape can already show one. Its labels are the count and the
      # process start time, so each scrape (30 s) that shows more timeouts,
      # and each restarted process, is a new alert, and Alertmanager sends it.
      - alert: KagentSuspendTimedOut
        expr: |
          (
            count_values by (pod) ("timeouts", kagent:suspend_timeouts:sum > 0)
              * on (pod) group_left (started)
            count_values by (pod) ("started", process_start_time_seconds{job="kagent-controller"})
          )
            and on (pod)
          (
            increase(kagent:suspend_timeouts:sum[1h]) > 0
            or
            time() - process_start_time_seconds{job="kagent-controller"} < 3600
          )
        labels:
          severity: critical
        annotations:
          action: "Recover the locked session using the suspend-timeout runbook."
          graph: "kagent:suspend_timeouts:sum{pod={{ printf \"%q\" $labels.pod }}}"
          threshold: "0"
          runbook: "https://factory-runbooks.jomcgi.dev/KagentSuspendTimedOut"
          summary: "A kagent session suspend passed the 120-second deadline ({{ $labels.timeouts }} since the controller started)"
          description: >-
            The session can stay locked while the reaper waits five minutes.
            If the lock persists, use the suspend-timeout runbook.

  - name: codex
    rules:
      # The broker reads each Codex grant's plan usage every 30 min
      # (projects/factory/broker, HOME-112). Coder and review turns fail while
      # a window is used up, and only a person can reset the plan or change
      # the account (Joe, 2026-11-17: "we NEED ... alerts for quota running
      # out").
      - alert: FactoryCodexQuotaLow
        expr: max by (grant, window) (factory_broker_grant_quota_used_percent) >= 90
        for: 5m
        labels:
          severity: warning
        annotations:
          action: "Schedule a quota reset for this grant."
          graph: "factory_broker_grant_quota_used_percent{grant={{ printf \"%q\" $labels.grant }},window={{ printf \"%q\" $labels.window }}}"
          threshold: "90"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaLow"
          summary: "Codex grant {{ $labels.grant }} has used {{ $value }}% of its {{ $labels.window }} window (threshold 90%)"
          description: >-
            Coder and review turns stop at 100%. Plan a reset or another
            account. Runbook: projects/factory-cluster/README.md, "Alerts".
      - alert: FactoryCodexQuotaExhausted
        expr: max by (grant) (factory_broker_grant_quota_exhausted) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Reset the exhausted grant."
          graph: "factory_broker_grant_quota_exhausted{grant={{ printf \"%q\" $labels.grant }}}"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaExhausted"
          summary: "Codex grant {{ $labels.grant }} is out of quota (exhausted flag {{ $value }} of 1)"
          # For each window the grant has used up: its reset, or that it has
          # none (never another window's). A grant refused with no window at
          # 100% lists every window's reset instead.
          description: >-
            Coder turns fail until then.
            {{ $full := query (printf `max by (window) (factory_broker_grant_quota_used_percent{grant=%q}) >= 100` $labels.grant) }}{{ if $full }}{{ range $full }}{{ $w := .Labels.window }}{{ with query (printf `max(factory_broker_quota_resets_at_seconds{provider="codex",window=%q})` $w) }}The {{ $w }} window resets at {{ . | first | value | humanizeTimestamp }}. {{ else }}The {{ $w }} window has no reset time. {{ end }}{{ end }}{{ else }}{{ range query `max by (window) (factory_broker_quota_resets_at_seconds{provider="codex"})` }}The {{ .Labels.window }} window resets at {{ .Value | humanizeTimestamp }}. {{ end }}{{ end }}Runbook: projects/factory-cluster/README.md, "Alerts". Codex login: https://factory.jomcgi.dev/admin/codex/
      # Grouped by grant only, so a move between not-ready states keeps the
      # 10 min timer; the summary names the current state.
      - alert: FactoryCodexGrantNotReady
        expr: max by (grant) (factory_broker_codex_grant_state{state!="ready"}) == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          action: "Repeat device login for this grant."
          graph: "factory_broker_codex_grant_state{grant={{ printf \"%q\" $labels.grant }},state!=\"ready\"}"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexGrantNotReady"
          summary: "Codex grant {{ $labels.grant }} is {{ range query (printf `max by (state) (factory_broker_codex_grant_state{grant=%q,state!=\"ready\"}) == 1` $labels.grant) }}{{ .Labels.state }}{{ end }} (non-ready flag {{ $value }} of 1)"
          description: >-
            The broker cannot relay Codex turns with this grant. Runbook:
            projects/factory-cluster/README.md, "Alerts". Codex login:
            https://factory.jomcgi.dev/admin/codex/
      # The alerts above use this reading; a stale or missing one would hide
      # them. The broker exports one reading time per provider; the newest
      # across broker pods counts, so a terminating pod does not fire this.
      # No series at all (no committed reading, or no broker scraped) is 0.
      # Both branches carry provider="codex", so a stale reading that then
      # disappears keeps one alert and one 15 min timer.
      - alert: FactoryCodexQuotaReadingStale
        expr: >-
          (time() - max by (provider) (factory_broker_quota_observed_at_seconds{provider="codex"}) > 7200)
          or (absent(factory_broker_quota_observed_at_seconds{provider="codex"}) * 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          action: "Check the broker quota refresh logs."
          graph: "time() - max(factory_broker_quota_observed_at_seconds{provider=\"codex\"}) or vector(0)"
          threshold: "7200"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaReadingStale"
          summary: "{{ if eq $value 0.0 }}The broker has no Codex quota reading{{ else }}The broker has not read the Codex quota for {{ $value | humanizeDuration }}{{ end }} (maximum age 2h)"
          description: >-
            The quota alerts cannot fire on an old reading. Runbook:
            projects/factory-cluster/README.md, "Alerts".


  - name: factory-semgrep-sync
    rules:
      - alert: SemgrepSyncFailed
        expr: |
          kube_job_failed{job_name=~"factory-semgrep-sync-[0-9]+",condition="true"} == 1
          and on (namespace, job_name)
          (kube_job_status_start_time == on (namespace) group_left
            max by (namespace) (kube_job_status_start_time{job_name=~"factory-semgrep-sync-[0-9]+"}))
        labels:
          severity: warning
        annotations:
          action: "Inspect the failed sync Job's logs."
          graph: 'kube_job_failed{namespace={{ printf "%q" $labels.namespace }},job_name={{ printf "%q" $labels.job_name }},condition="true"}'
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/SemgrepSyncFailed"
          summary: "Latest Semgrep to INTSEC sync {{ $labels.namespace }}/{{ $labels.job_name }} failed (failure flag {{ $value }}, threshold 1)"

  - name: factory-health
    rules:
      # The public factory health file (projects/factory-public README,
      # "Factory health"), read at its public URL by health-exporter. The
      # health CronJob writes it every 2 min; the mirror and a 60 s cache add
      # up to 2 min. After a failed read the exporter keeps the series of its
      # last valid read, so a short read gap neither clears nor fires the
      # rules. Together they replace the hub's Honeycomb trigger on
      # jomcgi.dev/health (HOME-415).
      # The condition and the summary read the newest scrape, so the summary
      # names the down components of the same read. A component that a valid
      # read removes goes stale at that scrape and leaves the list.
      # A failed scrape of the exporter (up 0) marks every series stale. While
      # up is 0, the second branch uses the last healthy flag of the 15 min
      # before, so a scrape gap neither clears the alert nor restarts its
      # timer. The summary then says that the component list is unknown: an
      # old list can name a component that a valid read removed. The next
      # successful scrape replaces the flag and lists the down components
      # again. After 15 min without a scrape the alert clears.
      # FactoryHealthStale fires by 12 min after the last scrape: the newest
      # generatedAt is then more than 10 min old for 2 min.
      - alert: FactoryHealthUnhealthy
        expr: >-
          max(factory_health_healthy) == 0
          or (max(last_over_time(factory_health_healthy[15m])) == 0
          and on() max(up{job="factory-health"}) == 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Check each down component in health.json."
          graph: "factory_health_component_up"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
          summary: >-
            Factory health is unhealthy, {{ if query `max(up{job="factory-health"}) == 0` }}components
            unknown: the health exporter scrape is failing{{ else }}down: {{ range $i, $c := query
            `factory_health_component_up == 0` | sortByLabel `component` }}{{ if $i }}, {{ end }}{{
            $c.Labels.component }}{{ else }}none listed{{ end }}{{ end }} (healthy flag {{ $value }}, minimum 1)
          description: >-
            https://factory-data.jomcgi.dev/health.json reports status
            unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".
      # No series at all (no valid read since the exporter started, or no
      # scrape in 15 min) is 0.
      # Both branches have no labels, so a stale file whose exporter then
      # stops answering keeps one alert and one timer.
      - alert: FactoryHealthStale
        expr: >-
          (time() - max(max_over_time(factory_health_generated_at_seconds[15m])) > 600)
          or (absent_over_time(factory_health_generated_at_seconds[15m]) * 0)
        for: 2m
        labels:
          severity: warning
        annotations:
          action: "Check the factory-public health and mirror CronJobs."
          graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
          threshold: "600"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
          summary: "{{ if eq $value 0.0 }}Prometheus read no health.json in 15m{{ else }}The newest health.json is {{ $value | humanizeDuration }} old{{ end }} (maximum age 10m)"
          description: >-
            Public readers see an old status. Runbook:
            projects/factory-cluster/README.md, "Alerts".

  - name: cloudflare
    rules:
      # Every factory Cloudflare API token and R2 key accepts calls only from
      # the home IPv4 address. At about 01:27Z on 2026-11-20 that address
      # changed: every credential failed and the public data stayed 6 h old
      # (HOME-634). cloudflare-exporter reads the address that Cloudflare
      # sees (factory_egress_ip_info, label ip) and checks each API token
      # every minute. It does not test the R2 keys: only the mirror CronJobs
      # hold the R2 mirror key. An R2 refusal shows through this alert and
      # FactoryHealthStale.
      # The address is private and the repository is public, so no expected
      # address is stored. The rule counts the addresses of the last hour: it
      # fires at the first scrape of a new address and clears an hour later.
      # CloudflareCredentialRefused stays on while an API token fails.
      # invariant: PLAT-18
      - alert: FactoryEgressIPChanged
        expr: count(max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[1h])) > time() - 3600) > 1
        labels:
          severity: warning
        annotations:
          action: "Allow the new egress IP in the IP filter of each factory Cloudflare credential."
          graph: "count(max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[1h])) > time() - 3600)"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryEgressIPChanged"
          summary: >-
            The factory egress IP changed to {{ range query `topk(1, max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[1h])) > time() - 3600)`
            }}{{ .Labels.ip }}{{ else }}an unknown address{{ end }} from {{ range $i, $p := query
            `max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[1h])) > time() - 3600 unless on (ip) topk(1, max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[1h])) > time() - 3600)`
            | sortByLabel `ip` }}{{ if $i }}, {{ end }}{{ $p.Labels.ip }}{{ end }} ({{ $value }} addresses in 1h, maximum 1)
          description: >-
            Each factory Cloudflare API token and R2 key fails until its IP
            filter allows the new address. Runbook:
            projects/factory-cluster/README.md, "Alerts".
      # An API token that Cloudflare refuses with 401 or 403 at its read-only
      # check, for 5 min of answered checks. After a check with no answer the
      # exporter keeps the last answer and sets check_success to 0. So a
      # pending alert needs check_success 1: one refusal followed by
      # unanswered checks does not fire, and a gap restarts the 5 min. A
      # firing alert stays on (its own ALERTS series, value 0) until a check
      # accepts the token: unanswered checks and an exporter restart that
      # drops auth_success do not clear it.
      # With an address change, the IP filter is the likely cause; without
      # one, a revoked or replaced token.
      - alert: CloudflareCredentialRefused
        expr: >-
          (
            max by (credential) (factory_cloudflare_credential_auth_success) == 0
            and on (credential)
            max by (credential) (factory_cloudflare_credential_check_success) == 1
          )
          or on (credential)
          (
            0 * max by (credential) (ALERTS{alertname="CloudflareCredentialRefused",alertstate="firing"})
            unless on (credential)
            max by (credential) (factory_cloudflare_credential_auth_success) == 1
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Allow the egress IP in this token's Cloudflare IP filter, or replace the token."
          graph: "factory_cloudflare_credential_auth_success{credential={{ printf \"%q\" $labels.credential }}}"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/CloudflareCredentialRefused"
          # While the trace read fails, the text names the newest address
          # Prometheus saw in the last 7 days, calls it "last known" and says
          # why. That history also covers an exporter restart whose first
          # read fails, when the exporter itself has no address.
          summary: >-
            Cloudflare refuses API token {{ $labels.credential }} from {{ with query
            `max(factory_egress_ip_read_success) == 0` }}last known egress IP {{ range query
            `topk(1, max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[7d])))`
            }}{{ .Labels.ip }}{{ else }}unknown{{ end }} (the egress IP read is failing, so the address may be stale){{ else }}egress IP {{ range query
            `max by (ip) (factory_egress_ip_info)` }}{{ .Labels.ip }}{{ else }}{{ range query
            `topk(1, max by (ip) (max_over_time(factory_egress_ip_observed_timestamp_seconds[7d])))`
            }}{{ .Labels.ip }} (last known){{ else }}unknown{{ end }}{{ end }}{{ end }} (auth success {{ $value }}, minimum 1)
          description: >-
            Its read-only check gets HTTP 401 or 403. Runbook:
            projects/factory-cluster/README.md, "Alerts".

  - name: relay
    rules:
      - alert: AlertRelayDown
        expr: (min(kube_deployment_status_replicas_available{namespace="prometheus",deployment="alert-relay"}) or vector(0)) < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Restore one ready alert-relay replica."
          graph: "min(kube_deployment_status_replicas_available{namespace=\"prometheus\",deployment=\"alert-relay\"}) or vector(0)"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/AlertRelayDown"
          summary: "Alert relay has {{ $value }} available replicas (minimum 1)"

  - name: factory-connector
    rules:
      - alert: FactoryItsaplanOutage
        expr: max by (phase) (factory_connector_itsaplan_unavailable{job="factory-connector"}) == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          action: "Inspect connector logs for the affected dispatch phase and check the coordinator key counter."
          graph: 'max(factory_connector_itsaplan_unavailable{job="factory-connector",phase={{ printf "%q" $labels.phase }}})'
          threshold: "1"
          runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/factory/deploy/notify.md#home-385-rollout-verification"
          summary: "Factory {{ $labels.phase }} has been failing on itsaplan for ten minutes"
  - name: factory-dispatch
    interval: 10s
    rules:
      - record: factory_connector:runnable_runs:max
        # An unavailable queue breaks the observed stall window.
        expr: max(factory_connector_runnable_runs{job="factory-connector"}) or vector(0)
      # invariant: FACT-13
      - alert: FactoryConnectorStalled
        expr: |
          factory_connector:runnable_runs:max > 0
          and min_over_time(factory_connector:runnable_runs:max[30m]) > 0
          and factory_connector:runnable_runs:max offset 30m > 0
          unless sum(increase(factory_connector_sends_total{job="factory-connector",outcome="accepted"}[30m])) > 0
        labels:
          severity: critical
        annotations:
          action: "Check connector logs for dispatch errors and compare occupied scheduler slots by agent with its concurrency limit."
          graph: 'max(factory_connector_runnable_runs{job="factory-connector"})'
          threshold: "0"
          runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/factory/deploy/notify.md#factoryconnectorstalled"
          summary: "Runnable factory runs have waited 30 minutes without a successful send."

      # The send wait (intervals.workerWait) holds a send until its pool has a
      # free worker. "timeout" sent after the bound with no worker, and
      # "unknown" sent with no fresh capacity row: either way the send can fail
      # with "no worker has room". A pool that scales to zero needs the wait to
      # hold (projects/factory/ARCHITECTURE.md, "Worker pool autoscaling").
      - alert: FactoryWorkerWaitNotHolding
        expr: sum by (outcome) (increase(factory_connector_worker_waits_total{job="factory-connector",outcome=~"timeout|unknown"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          action: "Check the capacity row (ready, busy, age) and the reaper, then the HPA of the pool (describe hpa, ScaledToZero, events)."
          graph: 'sum(increase(factory_connector_worker_waits_total{job="factory-connector",outcome={{ printf "%q" $labels.outcome }}}[15m]))'
          threshold: "0"
          runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/factory/ARCHITECTURE.md#worker-pool-autoscaling"
          summary: "The connector's worker wait ended as {{ $labels.outcome }} {{ $value | humanize }} time(s) in the last 15 min"

  # The egress scanner (substrate/egress-scan README, "Alerts"). The failure
  # counter starts when the first failure happens, so the first failure of a
  # series is not seen by increase(); the next one is. Both rules use short
  # windows, so they clear within 5 min of the last event.
  - name: egress-scan
    rules:
      - alert: EgressScanDetectorFailing
        expr: sum by (reason, mode) (increase(factory_egress_scan_detector_failures_total{job="egress-scan"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          action: "Read the scanner logs for the failing reason, then the dashboard panel Detector failures by reason."
          graph: 'sum(increase(factory_egress_scan_detector_failures_total{job="egress-scan",reason={{ printf "%q" $labels.reason }}}[5m]))'
          threshold: "0"
          runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/platform-factory/substrate/egress-scan/README.md#alerts"
          summary: "The egress scan detector had {{ $value | humanize }} call(s) with no verdict ({{ $labels.reason }}, {{ $labels.mode }} mode) in the last 5 min"

      - alert: EgressScanBlockSpike
        expr: sum by (route) (increase(factory_egress_scan_detector_findings_total{job="egress-scan",class="block"}[5m])) >= 5
        labels:
          severity: warning
        annotations:
          action: "Check the dashboard panels Block findings by route and Block findings by source, then the scanner logs. A real credential may be leaving."
          graph: 'sum(increase(factory_egress_scan_detector_findings_total{job="egress-scan",class="block",route={{ printf "%q" $labels.route }}}[5m]))'
          threshold: "5"
          runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/platform-factory/substrate/egress-scan/README.md#alerts"
          summary: "The egress scanner found {{ $value | humanize }} credential block finding(s) for route {{ $labels.route }} in the last 5 min (threshold 5)"

      - alert: EgressScanScrapeDown
        expr: (count(up{job="egress-scan"} == 1) or vector(0)) < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          action: "Check that both egress-scan pods in ate-system are ready and that Prometheus can reach port 9090."
          graph: 'count(up{job="egress-scan"} == 1) or vector(0)'
          threshold: "2"
          runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/platform-factory/substrate/egress-scan/README.md#alerts"
          summary: "Prometheus scrapes {{ $value }} egress scanner pod(s) (minimum 2, the chart replica count)"

  - name: capacity-shadow
    interval: 5m
    rules:
      # Track the largest worker pod, including its sidecars. Replica names
      # change on rollout, so all policy series use namespace and workload.
      - record: capacity:workload_pod_memory_working_set_bytes:max
        expr: |
          max by (namespace) (
            sum by (namespace, pod) (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{
                  job="kubelet-resource", namespace="factory-r-homelab-review",
                  pod=~"homelab-reviewer-.*", container!=""
                }
              )
            )
          )
        labels:
          workload: homelab-reviewer
      - record: capacity:workload_pod_memory_budget_bytes
        expr: |
          quantile_over_time(0.9, capacity:workload_pod_memory_working_set_bytes:max[24h])
          and on (namespace, workload)
          (count_over_time(capacity:workload_pod_memory_working_set_bytes:max[24h]) >= 72)
          and on (namespace, workload)
          capacity:workload_pod_memory_working_set_bytes:max
        labels:
          policy: baseline
      - record: capacity:workload_pod_memory_budget_bytes
        expr: |
          clamp_min(predict_linear(capacity:workload_pod_memory_working_set_bytes:max[2h], 1800), 0)
          and on (namespace, workload)
          (count_over_time(capacity:workload_pod_memory_working_set_bytes:max[2h]) >= 18)
          and on (namespace, workload)
          capacity:workload_pod_memory_working_set_bytes:max
        labels:
          policy: forecast
      # Align the budget with the observation it was issued for. Require an
      # exact timestamp so Prometheus lookback cannot fill a missed run.
      - record: capacity:workload_pod_memory_due_budget_bytes
        expr: |
          capacity:workload_pod_memory_budget_bytes offset 30m
          and on (namespace, workload, policy)
          (timestamp(capacity:workload_pod_memory_budget_bytes offset 30m) == time() - 1800)
      # The worker publishes shortly after its five-minute input boundary.
      # Check two scrape times three minutes apart. If the later one has
      # advanced to the next batch, the earlier one still covers this slot.
      # Keep a budget only when its paired target matches the observed slot.
      - record: capacity:workload_pod_memory_due_budget_bytes
        expr: |
          max by (namespace, workload, policy) (
            capacity_forecast_memory_budget_bytes{job="capacity-forecast",pod="",policy="timestral",horizon_seconds="1800"} offset 28m
            and
            (capacity_forecast_target_timestamp_seconds{job="capacity-forecast",pod="",policy="timestral",horizon_seconds="1800"} offset 28m
              == time() - (time() % 300))
            or
            capacity_forecast_memory_budget_bytes{job="capacity-forecast",pod="",policy="timestral",horizon_seconds="1800"} offset 31m
            and
            (capacity_forecast_target_timestamp_seconds{job="capacity-forecast",pod="",policy="timestral",horizon_seconds="1800"} offset 31m
              == time() - (time() % 300))
          )
        labels:
          policy: timestral
      - record: capacity:workload_pod_memory_budget_exceeded
        expr: |
          (
            capacity:workload_pod_memory_due_budget_bytes
            - on (namespace, workload) group_left
            capacity:workload_pod_memory_working_set_bytes:max
          ) < bool 0

  # invariant: PLAT-19
  - name: cnpg-backups
    rules:
      - alert: CNPGBackupRetentionExceeded
        expr: |
          ((time() - min by (namespace, cluster) (cnpg_collector_first_recoverability_point{job="cnpg",cluster="kagent-pg"} > 0)) / 86400 > 3)
          or
          ((time() - min by (namespace, cluster) (cnpg_collector_first_recoverability_point{job="cnpg",cluster=~"factory-db|authentik-pg"} > 0)) / 86400 > 16)
        for: 1h
        labels:
          severity: warning
        annotations:
          action: "Check the latest scheduled backup and its retention cleanup logs."
          graph: '(time() - min(cnpg_collector_first_recoverability_point{job="cnpg",namespace={{ printf "%q" $labels.namespace }},cluster={{ printf "%q" $labels.cluster }}} > 0)) / 86400'
          threshold: '{{ if eq $labels.cluster "kagent-pg" }}3{{ else }}16{{ end }}'
          runbook: "https://github.com/jomcgi-org/homelab/blob/main/projects/factory-cluster/README.md#cnpgbackupretentionexceeded"
          summary: '{{ $labels.cluster }} first recoverability point is {{ printf "%.2f" $value }} days old (threshold {{ if eq $labels.cluster "kagent-pg" }}3{{ else }}16{{ end }} days)'
