# Prometheus's alert rules (prometheus.yml loads them). Alertmanager
# (../stack/alertmanager.yml) sends each one to the homelab Discord channel. The
# runbook for each alert is in projects/factory-cluster/README.md, "Alerts".
groups:
  - name: nodes
    rules:
      # cAdvisor reports each container's writable layer (device overlay_*)
      # with the usage of the filesystem under it: the one that holds
      # containerd's images and layers. k3s keeps containerd, the kubelet
      # directory and the local-path volumes on the root filesystem, because
      # projects/factory-cluster/nodes/k3s-config.yaml sets no other data
      # directory. Image garbage collection starts at 85% and the kubelet
      # evicts pods at 90% (the same file).
      - alert: NodeDiskFilling
        expr: |
          max by (node) (
            container_fs_usage_bytes{job="kubelet-cadvisor", id="/", device=~"overlay_.+"}
              / container_fs_limit_bytes{job="kubelet-cadvisor", id="/", device=~"overlay_.+"}
          ) > 0.75
        for: 15m
        labels:
          severity: warning
        annotations:
          action: "Inspect the largest directories on the root filesystem."
          graph: "max(container_fs_usage_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node={{ printf \"%q\" $labels.node }}} / container_fs_limit_bytes{job=\"kubelet-cadvisor\",id=\"/\",device=~\"overlay_.+\",node={{ printf \"%q\" $labels.node }}})"
          threshold: "0.75"
          runbook: "https://factory-runbooks.jomcgi.dev/NodeDiskFilling"
          summary: "{{ $labels.node }}'s root filesystem is {{ $value | humanizePercentage }} full (threshold 75%)"
          description: >-
            Image garbage collection starts at 85% and the kubelet evicts pods
            at 90%. Runbook: projects/factory-cluster/README.md, "Alerts".

  - name: kagent
    rules:
      # The suspend timeouts that the kagent controller process has counted,
      # or 0 while its target is up and it has counted none. The counter
      # itself first appears at 1, in a new pod or after a container
      # restart; the 0 before it makes that first timeout a step. While the
      # target is down this is absent, so a scrape gap is no step.
      - record: kagent:suspend_timeouts:sum
        expr: |
          sum by (pod) (rpc_client_call_duration_seconds_count{job="kagent-controller", rpc_method="substrate.ateapi.v1.Control/SuspendActor", rpc_response_status_code="DEADLINE_EXCEEDED"})
          or
          0 * group by (pod) (up{job="kagent-controller"} == 1)
      # kagent v1.0.1 bounds SuspendActor by a fixed 30 s deadline. A suspend
      # past it leaves the Actor SUSPENDING and the session locked, and its
      # worker slot held, until a person deletes the worker pod.
      # The alert fires for an hour after the count rises, or while a
      # controller process younger than an hour has counted a timeout: its
      # first scrape can already show one. Its labels are the count and the
      # process start time, so each scrape (30 s) that shows more timeouts,
      # and each restarted process, is a new alert, and Alertmanager sends it.
      - alert: KagentSuspendTimedOut
        expr: |
          (
            count_values by (pod) ("timeouts", kagent:suspend_timeouts:sum > 0)
              * on (pod) group_left (started)
            count_values by (pod) ("started", process_start_time_seconds{job="kagent-controller"})
          )
            and on (pod)
          (
            increase(kagent:suspend_timeouts:sum[1h]) > 0
            or
            time() - process_start_time_seconds{job="kagent-controller"} < 3600
          )
        labels:
          severity: critical
        annotations:
          action: "Recover the locked session using the suspend-timeout runbook."
          graph: "kagent:suspend_timeouts:sum{pod={{ printf \"%q\" $labels.pod }}}"
          threshold: "0"
          runbook: "https://factory-runbooks.jomcgi.dev/KagentSuspendTimedOut"
          summary: "A kagent session suspend passed the 30 s limit ({{ $labels.timeouts }} since the controller started)"
          description: >-
            kagent keeps the session locked and its worker slot held until a
            person deletes the worker pod and reverts the session. Runbook:
            projects/factory-cluster/README.md, "Alerts".

  - name: codex
    rules:
      # The broker reads each Codex grant's plan usage every 30 min
      # (projects/factory/broker, HOME-112). Coder and review turns fail while
      # a window is used up, and only a person can reset the plan or change
      # the account (Joe, 2026-11-17: "we NEED ... alerts for quota running
      # out").
      - alert: FactoryCodexQuotaLow
        expr: max by (grant, window) (factory_broker_grant_quota_used_percent) >= 90
        for: 5m
        labels:
          severity: warning
        annotations:
          action: "Schedule a quota reset for this grant."
          graph: "factory_broker_grant_quota_used_percent{grant={{ printf \"%q\" $labels.grant }},window={{ printf \"%q\" $labels.window }}}"
          threshold: "90"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaLow"
          summary: "Codex grant {{ $labels.grant }} has used {{ $value }}% of its {{ $labels.window }} window (threshold 90%)"
          description: >-
            Coder and review turns stop at 100%. Plan a reset or another
            account. Runbook: projects/factory-cluster/README.md, "Alerts".
      - alert: FactoryCodexQuotaExhausted
        expr: max by (grant) (factory_broker_grant_quota_exhausted) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Reset the exhausted grant."
          graph: "factory_broker_grant_quota_exhausted{grant={{ printf \"%q\" $labels.grant }}}"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaExhausted"
          summary: "Codex grant {{ $labels.grant }} is out of quota (exhausted flag {{ $value }} of 1)"
          # For each window the grant has used up: its reset, or that it has
          # none (never another window's). A grant refused with no window at
          # 100% lists every window's reset instead.
          description: >-
            Coder turns fail until then.
            {{ $full := query (printf `max by (window) (factory_broker_grant_quota_used_percent{grant=%q}) >= 100` $labels.grant) }}{{ if $full }}{{ range $full }}{{ $w := .Labels.window }}{{ with query (printf `max(factory_broker_quota_resets_at_seconds{provider="codex",window=%q})` $w) }}The {{ $w }} window resets at {{ . | first | value | humanizeTimestamp }}. {{ else }}The {{ $w }} window has no reset time. {{ end }}{{ end }}{{ else }}{{ range query `max by (window) (factory_broker_quota_resets_at_seconds{provider="codex"})` }}The {{ .Labels.window }} window resets at {{ .Value | humanizeTimestamp }}. {{ end }}{{ end }}Runbook: projects/factory-cluster/README.md, "Alerts". Codex login: https://factory.jomcgi.dev/admin/codex/
      # Grouped by grant only, so a move between not-ready states keeps the
      # 10 min timer; the summary names the current state.
      - alert: FactoryCodexGrantNotReady
        expr: max by (grant) (factory_broker_codex_grant_state{state!="ready"}) == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          action: "Repeat device login for this grant."
          graph: "factory_broker_codex_grant_state{grant={{ printf \"%q\" $labels.grant }},state!=\"ready\"}"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexGrantNotReady"
          summary: "Codex grant {{ $labels.grant }} is {{ range query (printf `max by (state) (factory_broker_codex_grant_state{grant=%q,state!=\"ready\"}) == 1` $labels.grant) }}{{ .Labels.state }}{{ end }} (non-ready flag {{ $value }} of 1)"
          description: >-
            The broker cannot relay Codex turns with this grant. Runbook:
            projects/factory-cluster/README.md, "Alerts". Codex login:
            https://factory.jomcgi.dev/admin/codex/
      # The alerts above use this reading; a stale or missing one would hide
      # them. The broker exports one reading time per provider; the newest
      # across broker pods counts, so a terminating pod does not fire this.
      # No series at all (no committed reading, or no broker scraped) is 0.
      # Both branches carry provider="codex", so a stale reading that then
      # disappears keeps one alert and one 15 min timer.
      - alert: FactoryCodexQuotaReadingStale
        expr: >-
          (time() - max by (provider) (factory_broker_quota_observed_at_seconds{provider="codex"}) > 7200)
          or (absent(factory_broker_quota_observed_at_seconds{provider="codex"}) * 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          action: "Check the broker quota refresh logs."
          graph: "time() - max(factory_broker_quota_observed_at_seconds{provider=\"codex\"}) or vector(0)"
          threshold: "7200"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryCodexQuotaReadingStale"
          summary: "{{ if eq $value 0.0 }}The broker has no Codex quota reading{{ else }}The broker has not read the Codex quota for {{ $value | humanizeDuration }}{{ end }} (maximum age 2h)"
          description: >-
            The quota alerts cannot fire on an old reading. Runbook:
            projects/factory-cluster/README.md, "Alerts".


  - name: intsec-sync
    rules:
      - alert: SemgrepSyncFailed
        expr: |
          kube_job_failed{job_name=~"intsec-sync-[0-9]+",condition="true"} == 1
          and on (namespace, job_name)
          (kube_job_status_start_time == on (namespace) group_left
            max by (namespace) (kube_job_status_start_time{job_name=~"intsec-sync-[0-9]+"}))
        labels:
          severity: warning
        annotations:
          action: "Inspect the failed sync Job's logs."
          graph: 'kube_job_failed{namespace={{ printf "%q" $labels.namespace }},job_name={{ printf "%q" $labels.job_name }},condition="true"}'
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/SemgrepSyncFailed"
          summary: "Latest Semgrep to INTSEC sync {{ $labels.namespace }}/{{ $labels.job_name }} failed (failure flag {{ $value }}, threshold 1)"

  - name: factory-health
    rules:
      # The public factory health file (projects/factory-public README,
      # "Factory health"), read at its public URL by health-exporter. The
      # health CronJob writes it every 2 min; the mirror and a 60 s cache add
      # up to 2 min. A failed read exports no status or age, so both rules
      # take the newest sample in 15 min: a short read gap neither clears
      # nor fires them. Together they replace the hub's Honeycomb trigger on
      # jomcgi.dev/health (HOME-415).
      # The summary lists only the components of the newest read: a
      # component sample counts only when its time is that read's time, the
      # newest factory_health_healthy sample. A component that a later file
      # removes leaves the list at once.
      - alert: FactoryHealthUnhealthy
        expr: max(last_over_time(factory_health_healthy[15m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Check each down component in health.json."
          graph: "factory_health_component_up"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthUnhealthy"
          summary: >-
            Factory health is unhealthy, down: {{ range $i, $c := query `last_over_time(factory_health_component_up[15m]) == 0
            and max_over_time(timestamp(factory_health_component_up)[15m:])
            == on() group_left() max(max_over_time(timestamp(factory_health_healthy)[15m:]))`
            | sortByLabel `component` }}{{ if $i }}, {{ end }}{{ $c.Labels.component }}{{ else }}none listed{{ end }} (healthy flag {{ $value }}, minimum 1)
          description: >-
            https://factory-data.jomcgi.dev/health.json reports status
            unhealthy. Runbook: projects/factory-cluster/README.md, "Alerts".
      # No series at all (no read in 15 min, or the exporter never ran) is 0.
      # Both branches have no labels, so a stale file that then becomes
      # unreadable keeps one alert and one timer.
      - alert: FactoryHealthStale
        expr: >-
          (time() - max(max_over_time(factory_health_generated_at_seconds[15m])) > 600)
          or (absent_over_time(factory_health_generated_at_seconds[15m]) * 0)
        for: 2m
        labels:
          severity: warning
        annotations:
          action: "Check the factory-public health and mirror CronJobs."
          graph: "time() - max(max_over_time(factory_health_generated_at_seconds[15m])) or vector(0)"
          threshold: "600"
          runbook: "https://factory-runbooks.jomcgi.dev/FactoryHealthStale"
          summary: "{{ if eq $value 0.0 }}Prometheus read no health.json in 15m{{ else }}The newest health.json is {{ $value | humanizeDuration }} old{{ end }} (maximum age 10m)"
          description: >-
            Public readers see an old status. Runbook:
            projects/factory-cluster/README.md, "Alerts".

  - name: relay
    rules:
      - alert: AlertRelayDown
        expr: (min(kube_deployment_status_replicas_available{namespace="prometheus",deployment="alert-relay"}) or vector(0)) < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          action: "Restore one ready alert-relay replica."
          graph: "min(kube_deployment_status_replicas_available{namespace=\"prometheus\",deployment=\"alert-relay\"}) or vector(0)"
          threshold: "1"
          runbook: "https://factory-runbooks.jomcgi.dev/AlertRelayDown"
          summary: "Alert relay has {{ $value }} available replicas (minimum 1)"
