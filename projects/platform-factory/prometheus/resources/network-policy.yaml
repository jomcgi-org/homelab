# The prometheus namespace's allowlist under the cluster-wide default-deny
# (projects/platform-factory/network-policy/). Prometheus reaches each target
# on its metrics port only; scrape-ingress.yaml admits it at the other end.
# Grafana is its only client; operators use a port-forward.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grafana
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    # Node and pod discovery.
    - toEntities: [kube-apiserver]
    # Host-network targets on every node: the kubelets, the Cilium agents,
    # Hubble and the Cilium operators.
    - toEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9965"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kube-state-metrics
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory
            app.kubernetes.io/name: factory-broker
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory
            app.kubernetes.io/name: factory-connector
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent-pg
            cnpg.io/podRole: instance
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory-db
            cnpg.io/podRole: instance
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities: [kube-apiserver]
