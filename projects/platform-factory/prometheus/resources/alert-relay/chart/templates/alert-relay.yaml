apiVersion: onepassword.com/v1
kind: OnePasswordItem
type: kubernetes.io/dockerconfigjson
metadata:
  name: ghcr-imagepull-secret
  namespace: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: vaults/k8s-homelab/items/ghcr-read-permissions
---
apiVersion: v1
kind: Service
metadata:
  name: alert-relay
  namespace: prometheus
  labels:
    app.kubernetes.io/name: alert-relay
spec:
  selector:
    app.kubernetes.io/name: alert-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-relay
  namespace: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-relay
    spec:
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      # node-1 is the operator's workstation.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [node-1]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-relay
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest is required" .Values.image.digest) | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: discord
              mountPath: /etc/alertmanager/discord
              readOnly: true
      volumes:
        - name: discord
          secret:
            secretName: alertmanager-discord
            items:
              - key: webhook-url
                path: webhook-url
