# The operators' metrics store (projects/factory-cluster/README.md,
# "Metrics view"): one Prometheus, kube-state-metrics, their allowlists and an
# ingress rule at every target it scrapes. Grafana reads it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    # After the targets' own Applications (wave 3); nothing waits on it.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Both sources must render before Argo CD applies either one. The stack
  # switches Alertmanager's receiver in the wave after the relay is healthy.
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: alert-relay
      targetRevision: 0.8.8
      helm:
        releaseName: alert-relay
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      path: projects/platform-factory/prometheus/stack
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
