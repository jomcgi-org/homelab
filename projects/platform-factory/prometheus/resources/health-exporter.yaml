# health-exporter: reads the public factory health file
# (https://factory-data.jomcgi.dev/health.json, projects/factory-public
# README "Factory health") on each scrape and exports its status, age and
# component states for the FactoryHealth alerts in rules.yml (HOME-415). It
# reads the public URL only: no cluster or Cloudflare API call.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-exporter
  namespace: prometheus
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: health-exporter
  namespace: prometheus
  labels:
    app.kubernetes.io/name: health-exporter
spec:
  selector:
    app.kubernetes.io/name: health-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-exporter
  namespace: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-exporter
    spec:
      serviceAccountName: health-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: health-exporter
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python, -B, /app/health_exporter.py]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: health-exporter
