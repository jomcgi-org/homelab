# cloudflare-exporter (HOME-634): cloudflare_exporter.py from a ConfigMap on
# the pinned Python image, for the FactoryEgressIPChanged and
# CloudflareCredentialRefused alerts in rules.yml. Every factory Cloudflare
# credential accepts calls only from the home IPv4 address.
#
# - prometheus: reads the egress IP from https://api.cloudflare.com/cdn-cgi/trace.
#   It holds no credential.
# - cfgate-system, jomcgi-site-prod: each checks the API token in its own
#   namespace. A secretKeyRef reads only a Secret in the pod's namespace, so the
#   pod runs there and takes only the token key. No copy of a token, and no
#   Kubernetes API access.
# - factory-public: the factory-public chart runs it for
#   factory-health-cloudflare.
#
# No exporter tests an R2 key: only the mirror CronJobs hold the R2 mirror
# key. An R2 refusal shows through FactoryEgressIPChanged and
# FactoryHealthStale.
#
# The account ID in each URL is not a secret
# (platform-factory/factory-edge/resources/tunnel.yaml). Each pod reaches only
# api.cloudflare.com on 443; its policy is in network-policy.yaml (prometheus)
# or in this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-exporter
  namespace: prometheus
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-exporter
  namespace: prometheus
  labels:
    app.kubernetes.io/name: cloudflare-exporter
spec:
  selector:
    app.kubernetes.io/name: cloudflare-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-exporter
  namespace: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-exporter
    spec:
      serviceAccountName: cloudflare-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-exporter
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python, -B, /app/cloudflare_exporter.py]
          env:
            - name: TRACE_URL
              value: https://api.cloudflare.com/cdn-cgi/trace
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: cloudflare-exporter
---
# cfgate's token (api-token.yaml there): Tunnel and DNS edit, so the check
# uses a read: one page of the account's tunnels.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-exporter
  namespace: cfgate-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-exporter
  namespace: cfgate-system
  labels:
    app.kubernetes.io/name: cloudflare-exporter
spec:
  selector:
    app.kubernetes.io/name: cloudflare-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-exporter
  namespace: cfgate-system
  annotations:
    # The 1Password operator restarts the pod when the token Secret changes.
    operator.1password.io/auto-restart: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-exporter
    spec:
      serviceAccountName: cloudflare-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-exporter
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python, -B, /app/cloudflare_exporter.py]
          env:
            - name: API_CREDENTIAL
              value: factory-cloudflare-api-token
            - name: API_URL
              value: https://api.cloudflare.com/client/v4/accounts/7c56b458cd657d96b095c63d181c051f/cfd_tunnel?per_page=1
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef: {name: cloudflare-api-credentials, key: CLOUDFLARE_API_TOKEN}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: cloudflare-exporter
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflare-exporter
  namespace: cfgate-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
