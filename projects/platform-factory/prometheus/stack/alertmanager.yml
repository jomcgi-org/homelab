# Alertmanager's configuration (alertmanager.yaml mounts it). Every alert
# goes to the homelab Discord channel through one webhook; the URL comes from
# 1Password item factory-alerts-discord (Secret alertmanager-discord).
route:
  receiver: relay
  group_by: [alertname, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: ['alertname=~"Semgrep(NewSecret|AuthenticationFailed)"']
      receiver: relay-no-resolved
      group_by: ["..."]
    - matchers: ['alertname="AlertRelayDown"']
      receiver: discord
    # Each suspend timeout is its own alert (label timeouts) and its own
    # message. The alert ends an hour later whether or not someone freed
    # the session, so its end sends nothing.
    - matchers: ['alertname="KagentSuspendTimedOut"']
      receiver: relay-no-resolved
      group_by: ["..."]

inhibit_rules:
  - source_matchers: ['alertname="FactoryCodexQuotaExhausted"']
    target_matchers: ['alertname="FactoryCodexQuotaLow"']
    equal: [grant]
  - source_matchers: ['alertname="FactoryCodexGrantNotReady"']
    target_matchers: ['alertname=~"FactoryCodexQuota(Low|Exhausted)"']
    equal: [grant]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord/webhook-url
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}. {{ .Annotations.action }} {{ .Annotations.runbook }}{{ end }}'
  - name: relay
    webhook_configs:
      - url: http://alert-relay:8080/
        send_resolved: true
  - name: relay-no-resolved
    webhook_configs:
      - url: http://alert-relay:8080/
        send_resolved: false
