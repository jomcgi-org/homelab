apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The pre-migration Application tracks ../resources at HEAD. That path
# continues serving the direct receiver until the parent adopts both sources.
resources:
  - ../resources

configMapGenerator:
  - name: alertmanager-config
    namespace: prometheus
    behavior: replace
    files:
      - alertmanager.yml

patches:
  - target:
      kind: Deployment
      name: alertmanager
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
