apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cilium policies for the factory cluster. baseline.yaml denies everything to
# every pod-network pod except DNS; each other file allows exactly what one
# namespace needs. Namespaces that bootstrap does not create carry their
# policy in their own Application (cfgate/resources/network-policy.yaml), so it
# lands with the namespace. A component with no policy cannot talk to anything.
resources:
  - baseline.yaml
  - kube-system.yaml
  - onepassword.yaml
  - argocd.yaml
