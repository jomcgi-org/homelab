apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller
  namespace: cloudflare-operator-system
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
  egress:
    - toEntities: [kube-apiserver]
    - toFQDNs:
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# cloudflared: outbound to Cloudflare's tunnel edge, and to the origins its
# TunnelBindings name. Each published origin adds an egress rule here, which
# makes every public path a reviewed change to this file.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflare-operator-system
spec:
  endpointSelector:
    matchLabels:
      cloudflare-operator.io/app: cloudflared
  egress:
    - toFQDNs:
        - matchPattern: "*.v2.argotunnel.com"
        - matchPattern: "*.argotunnel.com"
      toPorts:
        - ports:
            - port: "7844"
              protocol: ANY
    - toFQDNs:
        - matchName: api.cloudflare.com
        - matchName: update.argotunnel.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
