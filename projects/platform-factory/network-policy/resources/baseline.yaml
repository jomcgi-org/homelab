# Cluster-wide default-deny. Selecting every pod puts every pod into
# default-deny for both directions; what remains open is only DNS to CoreDNS,
# through Cilium's DNS proxy so that toFQDNs rules elsewhere can match names.
#
# Every other flow needs an explicit allow in its namespace's policy file. A
# new namespace starts with nothing but DNS.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  description: Default-deny for every pod; DNS to CoreDNS only.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
