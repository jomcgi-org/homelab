apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: connect
  namespace: onepassword
spec:
  endpointSelector:
    matchLabels:
      app: onepassword-connect
  ingress:
    # Only the operator reads items through Connect.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: operator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchPattern: "*.1password.com"
        - matchName: 1password.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operator
  namespace: onepassword
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: operator
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app: onepassword-connect
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
