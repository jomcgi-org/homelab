# cert-manager on the factory cluster: the hub's chart and values, plus this
# cluster's network policy. It issues from self-signed Issuers only; today
# that is Kargo's admission webhook certificate (projects/platform-factory/kargo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Before Kargo (wave 2), whose webhook certificate it issues.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      path: projects/platform/cert-manager
      helm:
        releaseName: cert-manager
        valueFiles:
          - values.yaml
          - values-factory.yaml
        ignoreMissingValueFiles: false
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      path: projects/platform-factory/cert-manager/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager's CRDs exceed client-side apply's annotation limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
