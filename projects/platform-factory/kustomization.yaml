apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One Application per shared component on the factory home cluster
# (projects/factory-cluster/README.md).
resources:
  - ./cilium # CNI, kube-proxy replacement and policy engine; bootstrap-gitops.sh installs it first
  - ./network-policy # Cluster-wide default-deny baseline and per-namespace allowlists
  - ./argocd # In-cluster ArgoCD adopts the installation bootstrap-gitops.sh made
  - ./onepassword # 1Password Connect and operator; bootstrap secrets are created out of band
  - ./runtimeclasses # gvisor RuntimeClass for the runsc handler install-node.sh installs
  - ./cfgate # Cloudflare tunnel and DNS lifecycle from Gateway API resources
  - ./factory-edge # The factory cluster's Cloudflare Tunnel, its Gateway and DNS
  - ./substrate # Agent Substrate control plane; bootstrap-substrate.sh creates its key material
  - ./otel-collector # Node, Cilium, API server metrics, warning logs and events to Honeycomb
  - ./edge-admission # Admission policies guarding the edge, in every namespace
  - ./cloudnative-pg # Postgres operator; Authentik's database
  - ./edge # Envoy Gateway: every published route signs in through Authentik
  - ./authentik # Identity provider at factory-auth.jomcgi.dev
  - ./garage # S3 object store, three-way replicated; workload buckets and WAL archives
  - ./kagent-postgres # kagent's CNPG Cluster and the Secrets the factory chart reads
  - ./factory-buckets # The factory namespace's Garage bucket keys
  - ./factory-db # The factory's CNPG Cluster (itsaplan, later the connector) and its Secrets in factory
  - ../factory/deploy # The software factory: kagent (projects/factory/)
  - ./prometheus # Prometheus and kube-state-metrics: the operators' metrics store
  - ./grafana # Grafana at factory-grafana.jomcgi.dev: dashboards over Prometheus
  - ../factory-landing/deploy # Static operator tools at factory.jomcgi.dev
  - ./edge-tunnel # Publishes the edge hostnames; deployed last, removed first
