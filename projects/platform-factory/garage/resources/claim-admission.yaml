# invariant: PLAT-8
# A consumer's ConfigMap permissions must not authorize Garage bucket grants.
# Only the trusted GitOps controller may write declarations in garage. Match
# the reserved name as well as old/new labels, including removal and deletion.
#
# One exception: the Kubernetes garbage collector may remove the
# foregroundDeletion finalizer from a claim that is already being deleted.
# The update must remove only that finalizer and keep the other finalizers
# in their order. It must not change name, data, binaryData, immutable,
# labels, annotations or ownerReferences. When ArgoCD prunes a claim with
# foreground propagation, the claim keeps the foregroundDeletion finalizer
# until the garbage collector removes it. Without the exception, the claim
# never goes away and the ArgoCD sync waits on it forever (HOME-492).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: garage-claim-authorizations
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
  matchConditions:
    - name: garage-namespace
      expression: request.namespace == "garage"
    - name: authorization
      expression: >-
        (object != null && (object.metadata.name.startsWith("garage-claim-") ||
          (has(object.metadata.labels) && "factory.jomcgi.dev/garage-claim" in object.metadata.labels))) ||
        (oldObject != null && (oldObject.metadata.name.startsWith("garage-claim-") ||
          (has(oldObject.metadata.labels) && "factory.jomcgi.dev/garage-claim" in oldObject.metadata.labels)))
  variables:
    - name: argocd
      expression: request.userInfo.username == "system:serviceaccount:argocd:argocd-application-controller"
    # k3s runs controllers with --use-service-account-credentials=true.
    - name: finalizerRemoval
      expression: >-
        request.operation == "UPDATE" &&
        request.userInfo.username == "system:serviceaccount:kube-system:generic-garbage-collector" &&
        has(oldObject.metadata.deletionTimestamp) &&
        has(oldObject.metadata.finalizers) &&
        "foregroundDeletion" in oldObject.metadata.finalizers &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) ==
          oldObject.metadata.finalizers.filter(f, f != "foregroundDeletion") &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) ==
          (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        object.metadata.name == oldObject.metadata.name &&
        (has(object.immutable) ? object.immutable : false) == (has(oldObject.immutable) ? oldObject.immutable : false) &&
        (has(object.data) ? object.data : {}) == (has(oldObject.data) ? oldObject.data : {}) &&
        (has(object.binaryData) ? object.binaryData : {}) == (has(oldObject.binaryData) ? oldObject.binaryData : {}) &&
        (has(object.metadata.labels) ? object.metadata.labels : {}) ==
          (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) ==
          (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
  validations:
    - expression: variables.argocd || variables.finalizerRemoval
      message: Only ArgoCD may change Garage claim authorizations.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: garage-claim-authorizations
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: garage-claim-authorizations
  validationActions: [Deny]
