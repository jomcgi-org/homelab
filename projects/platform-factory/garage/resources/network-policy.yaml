# The garage namespace's allowlist under the cluster-wide default-deny
# (projects/platform-factory/network-policy/). Each consumer is listed in the
# S3 ingress rule below and needs an egress rule to
# app.kubernetes.io/name=garage on 3900 in its own namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    # Before the secret Job (wave -1), which needs the API server.
    argocd.argoproj.io/sync-wave: "-3"
  name: garage
  namespace: garage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  ingress:
    # RPC between the Garage nodes.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3901"
              protocol: TCP
    # The admin API: garage-init only.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage-init
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
    # The S3 API, only from the workloads holding a bucket key; a request
    # still needs that bucket's key. itsaplan (factory-itsaplan) and
    # Substrate (ate-snapshots) are added with their grants.
    - fromEndpoints:
        # kagent-pg's WAL archives and base backups.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent-pg
            cnpg.io/cluster: kagent-pg
        # The connector's evidence (factory chart).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory
            app.kubernetes.io/name: factory-connector
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
  egress:
    # Kubernetes discovery: each node publishes and lists GarageNodes.
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3901"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: garage-init
  namespace: garage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage-init
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
