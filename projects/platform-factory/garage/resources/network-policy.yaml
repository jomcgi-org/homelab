# The garage namespace's allowlist under the cluster-wide default-deny
# (projects/platform-factory/network-policy/). Each consumer is listed in the
# S3 ingress rule below and needs an egress rule to
# app.kubernetes.io/name=garage on 3900 in its own namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    # Before the secret Job (wave -1), which needs the API server.
    argocd.argoproj.io/sync-wave: "-3"
  name: garage
  namespace: garage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  ingress:
    # RPC between the Garage nodes.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3901"
              protocol: TCP
    # The admin API: garage-init only.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage-init
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
    # The S3 API, only from the workloads holding a bucket key; a request
    # still needs that bucket's key. Substrate (ate-snapshots) is added with
    # its grant.
    - fromEndpoints:
        # The library labels only declared Garage consumers. Each request
        # still needs a bucket key. An explicit namespace wildcard permits
        # consumers in their own namespaces, not just the garage namespace.
        - matchLabels:
            factory.jomcgi.dev/garage-client: "true"
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
        # Database WAL archives and base backups.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent-pg
            cnpg.io/cluster: kagent-pg
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory-db
            cnpg.io/cluster: factory-db
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            cnpg.io/cluster: authentik-pg
        # itsaplan's attachments: its api and worker (factory chart).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory
            app.kubernetes.io/name: factory-itsaplan
            app.kubernetes.io/component: api
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory
            app.kubernetes.io/name: factory-itsaplan
            app.kubernetes.io/component: worker
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-api
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-worker
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-restore
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            cnpg.io/cluster: grimoire
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            cnpg.io/cluster: grimoire-recovered
        # The connector's evidence (factory chart).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory
            app.kubernetes.io/name: factory-connector
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
  egress:
    # Kubernetes discovery: each node publishes and lists GarageNodes.
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3901"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: garage-init
  namespace: garage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage-init
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
