apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-social-wait-for-keys
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-social-wait-for-keys
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command:
            - python3
            - -I
            - -c
            - |
              import os
              for provider in ("GITHUB", "GOOGLE", "DISCORD"):
                  for field in ("CLIENT_ID", "CLIENT_SECRET"):
                      if not os.environ.get(f"FACTORY_{provider}_{field}"):
                          raise SystemExit(f"Missing {provider} {field}")
          env:
            - name: FACTORY_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: factory-authentik-github
                  key: client-id
            - name: FACTORY_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: factory-authentik-github
                  key: client-secret
            - name: FACTORY_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: factory-authentik-google
                  key: client-id
            - name: FACTORY_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: factory-authentik-google
                  key: client-secret
            - name: FACTORY_DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: factory-authentik-discord
                  key: client-id
            - name: FACTORY_DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: factory-authentik-discord
                  key: client-secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
