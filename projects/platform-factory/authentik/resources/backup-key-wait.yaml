# Like factory-db-init, hold the Cluster at wave 0 until garage-init fills
# its backup credentials. Required Secret key references keep this Job pending
# while the Secret is absent or empty. No API rights or network access needed.
# garage-bootstrap reconciles every 10 minutes; retry the sync if this Job's
# 30-minute deadline expires. The existing database keeps running meanwhile.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-pg-wait-for-key
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-pg-wait-for-key
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command:
            - python3
            - -I
            - -c
            - |
              import os
              assert all(os.environ[key] for key in (
                  "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_REGION"
              )), "Garage backup credentials are empty"
              print("Garage backup credentials ready")
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: authentik-pg-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-pg-s3
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: authentik-pg-s3
                  key: AWS_REGION
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
