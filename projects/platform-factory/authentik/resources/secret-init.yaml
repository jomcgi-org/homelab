# Generates authentik's secret key and the OIDC client secrets in the cluster,
# once (secret_init.py). It runs before the chart's pods in each sync; with the
# values already present it changes nothing.
#
# ArgoCD owns the three Secrets as placeholders (each Application ignores
# their data): authentik-secrets and argocd-authentik-oidc here, and
# edge-oidc-client in the edge chart. The Job needs only get and update on
# those names and cannot create any other Secret.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Holds AUTHENTIK_SECRET_KEY; pruning or deleting the Application keeps it.
    argocd.argoproj.io/sync-options: Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-authentik-oidc
  namespace: argocd
  labels:
    # argocd-cm may only reference Secrets carrying this label.
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-secret-init
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-secret-init
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [authentik-secrets]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-secret-init
  namespace: edge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [edge-oidc-client]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-secret-init
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [argocd-authentik-oidc]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-secret-init
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-secret-init
subjects:
  - kind: ServiceAccount
    name: authentik-secret-init
    namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-secret-init
  namespace: edge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-secret-init
subjects:
  - kind: ServiceAccount
    name: authentik-secret-init
    namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-secret-init
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-secret-init
subjects:
  - kind: ServiceAccount
    name: authentik-secret-init
    namespace: authentik
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-secret-init
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # A Job's pod template is immutable; a changed script replaces the Job.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-secret-init
    spec:
      serviceAccountName: authentik-secret-init
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-init
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python3, -I, -u, /scripts/secret_init.py]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: authentik-secret-init
