# The authentik namespace's allowlist under the cluster-wide default-deny
# (projects/platform-factory/network-policy/). Authentik makes no outbound
# calls (values-factory.yaml turns them off), so its pods reach only Postgres.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    # Before the secret Job (wave -1), which needs the API server.
    argocd.argoproj.io/sync-wave: "-3"
  name: server
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  ingress:
    # Only through the edge Gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: edge
            gateway.envoyproxy.io/owning-gateway-namespace: edge
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    # Before the secret Job (wave -1), which needs the API server.
    argocd.argoproj.io/sync-wave: "-3"
  name: worker
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# The CloudNativePG instance and its bootstrap Jobs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    # Before the secret Job (wave -1), which needs the API server.
    argocd.argoproj.io/sync-wave: "-3"
  name: postgres
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: authentik
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The operator's calls to the instance manager.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    # Before the secret Job (wave -1), which needs the API server.
    argocd.argoproj.io/sync-wave: "-3"
  name: secret-init
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-secret-init
  egress:
    - toEntities: [kube-apiserver]
