# The grimoire namespace's allowlist under the cluster-wide default-deny
# (projects/platform-factory/network-policy/). Each Job and runtime identity
# states its own DNS rule, the same CoreDNS allowance as the baseline, so its
# policy lists every peer it can reach. No identity has inference egress yet:
# the runtime chart that configures an endpoint adds that exact peer. Only the
# restore and the migration check reach outside the cluster, to R2.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    # Before the Cluster (wave 0), whose instances need the API server.
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire
  namespace: grimoire
spec:
  # The instances and the operator's initdb and join Jobs.
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: grimoire
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-api
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-worker
        # The owner identity: the restore and grants Jobs.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-restore
        # Replication and pg_basebackup between instances.
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The instance manager: the operator, and peers during failover.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # WAL archives and base backups in grimoire-backups.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
# The API reads the database and grimoire-private (read-only key).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire-api
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: grimoire-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
# Workers read and write the database and grimoire-private.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire-worker
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: grimoire-worker
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
# The owner identity (restore and grants Jobs): DNS, the two database
# clusters and the R2 endpoint. grimoire-recovered exists only during a backup
# restore check. The restore's fetch container reads the hub migration runs
# from R2. Its only R2 credential is a read-only key for bucket grimoire.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire-restore
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: grimoire-restore
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: grimoire
        - matchLabels:
            cnpg.io/cluster: grimoire-recovered
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toFQDNs:
        - matchName: 7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The migration check reads the hub migration runs from R2. It has no
# database login and no database peer.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire-migration-check
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: grimoire-migration-check
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: 7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# grimoire-db-init reads and writes its Secrets and nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire-db-setup
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grimoire-db-setup
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# The backup restore check (projects/grimoire/deploy/recovery.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire-recovered
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: grimoire-recovered
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-restore
        - matchLabels:
            cnpg.io/cluster: grimoire-recovered
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels:
            cnpg.io/cluster: grimoire-recovered
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: grimoire-recovered
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # Reads the base backup and WAL from grimoire-backups.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
