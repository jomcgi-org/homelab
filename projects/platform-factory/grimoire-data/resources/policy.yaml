apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: grimoire
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: grimoire
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-api
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-worker
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grimoire
            io.cilium.k8s.policy.serviceaccount: grimoire-restore
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grimoire-api
  namespace: grimoire
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: grimoire-api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: inference
            app.kubernetes.io/name: inference
            app.kubernetes.io/component: inference
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: inference
            app.kubernetes.io/name: inference
            app.kubernetes.io/component: embeddings
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: grimoire
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
