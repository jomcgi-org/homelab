# Private Garage keys. garage-init fills each Secret from its claim below and
# can update only these Secrets. Neither bucket has a public mirror: book
# text, scans, embeddings and backups stay in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: grimoire-backup-s3
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: grimoire-recovery-s3
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: grimoire-api-s3
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: grimoire-worker-s3
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-init
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [grimoire-backup-s3, grimoire-recovery-s3, grimoire-api-s3, grimoire-worker-s3]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-init
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: garage
---
# Claim names are garage-claim- and the SHA-256 of NAMESPACE/SECRET.
# The Cluster writes WAL archives and base backups.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-claim-59ad1b7bf0a6d69df42668a03590b88bac7f9374856c108970a324eda88c520b
  namespace: garage
  labels:
    factory.jomcgi.dev/garage-claim: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  namespace: grimoire
  secretName: grimoire-backup-s3
  bucket: grimoire-backups
  access: readwrite
---
# The backup restore check reads backups only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-claim-7a31a80eae09b665c3685460fe7c89a479f5f0f63fd1b67e162f89a9ad48c7c9
  namespace: garage
  labels:
    factory.jomcgi.dev/garage-claim: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  namespace: grimoire
  secretName: grimoire-recovery-s3
  bucket: grimoire-backups
  access: read
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-claim-75a948f4b287b32abc87a8ba6ce4d6c6b004f88a0e11d816314a9327b745de43
  namespace: garage
  labels:
    factory.jomcgi.dev/garage-claim: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  namespace: grimoire
  secretName: grimoire-api-s3
  bucket: grimoire-private
  access: read
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-claim-7764b248ac32e845e13df6305f4d8c64b692d986ac2628d2eaf72224c6a2fbe2
  namespace: garage
  labels:
    factory.jomcgi.dev/garage-claim: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  namespace: grimoire
  secretName: grimoire-worker-s3
  bucket: grimoire-private
  access: readwrite
---
# The read-only R2 key for the hub migration runs under migration/ of the
# private R2 bucket grimoire (HOME-484). Joe creates the R2 API token with
# Object Read only on that one bucket, and stores its S3 keys in this item as
# access-key-id and secret-access-key. The operator writes them into Secret
# grimoire-migration-r2. Only the restore's fetch container and the migration
# check read it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: grimoire-migration-r2
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: "vaults/k8s-homelab/items/grimoire-migration-r2"
