# Grimoire's private database: three instances, one per node, with WAL
# archiving and daily base backups to the private grimoire-backups bucket.
# grimoire_restore owns the database and every restored object. The two
# runtime logins own nothing; grants.sql gives them their row access.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grimoire
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  primaryUpdateStrategy: unsupervised
  smartShutdownTimeout: 15
  enableSuperuserAccess: false
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 32Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 1Gi
  postgresql:
    extensions:
      - name: vector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.2-202604021427-18-trixie
  bootstrap:
    initdb:
      database: grimoire
      # The operator writes this login's password to grimoire-app.
      owner: grimoire_restore
      # Creating vector needs a superuser, so the owner cannot restore it.
      postInitApplicationSQL:
        - CREATE EXTENSION vector
        - REVOKE CREATE ON SCHEMA public FROM PUBLIC
  managed:
    # Each login's password is its Secret's (setup.yaml). The attributes are
    # stated so a list item matches the defaulted live one in ArgoCD's diff.
    roles:
      - name: grimoire_api
        ensure: present
        login: true
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        connectionLimit: 16
        passwordSecret:
          name: grimoire-api-login
      - name: grimoire_worker
        ensure: present
        login: true
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        connectionLimit: 16
        passwordSecret:
          name: grimoire-worker-login
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://grimoire-backups/
      # One prefix per incarnation. recovery.yaml in projects/grimoire/deploy
      # restores from it.
      serverName: grimoire-v1
      endpointURL: http://garage.garage.svc:3900
      s3Credentials:
        accessKeyId:
          name: grimoire-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: grimoire-backup-s3
          key: AWS_SECRET_ACCESS_KEY
        region:
          name: grimoire-backup-s3
          key: AWS_REGION
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grimoire-daily
  namespace: grimoire
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # After factory-db's and kagent-pg's. One base backup at creation, then daily.
  schedule: "0 15 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: grimoire
