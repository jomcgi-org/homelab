# kagent's PostgreSQL: three instances, one per node, with WAL archiving and
# daily base backups to Garage (projects/factory-cluster/README.md,
# "Postgres"). Garage runs on the same three nodes, so this survives losing a
# node or a volume, not losing the cluster.
#
# It runs in its own namespace, kagent-pg: the kagent controller can read
# every Secret in kagent, and the database owner and backup credentials stay out
# of its reach. Only the two connection strings are written into kagent.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kagent-pg
  namespace: kagent-pg
  annotations:
    # After kagent-pg-wait-for-key (wave -1, setup.yaml).
    argocd.argoproj.io/sync-wave: "0"
    # Neither a prune nor deleting the Application removes the database; the
    # operator deletes its PVCs with the Cluster.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  monitoring:
    customQueriesConfigMap:
      - name: session-claims
        key: queries
  priorityClassName: factory-platform
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  primaryUpdateStrategy: unsupervised
  # invariant: KAGENT-PG-1
  enableSuperuserAccess: false
  managed:
    roles:
      - name: kagent_owner
        login: false
      - name: kagent_readwrite
        login: false
      - name: kagent_owner_user
        login: true
        inherit: false
        inRoles: [kagent_owner]
        passwordSecret:
          name: kagent-pg-owner-login
      - name: kagent_readwrite_user
        login: true
        inherit: false
        inRoles: [kagent_readwrite]
        passwordSecret:
          name: kagent-pg-readwrite-login
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 5Gi
    storageClass: local-path
  # 2-day peak 561Mi (2026-11-16); requested at about peak plus 15%.
  resources:
    requests:
      cpu: 50m
      memory: 640Mi
    limits:
      memory: 1Gi
  # kagent rewrites session_task_event and session_task rows all day: about
  # 16 GB of WAL a day for a 1.8 GB database (2026-11-19). Compressed
  # full-page images and sparser checkpoints cut what reaches Garage. A
  # 15-minute checkpoint writes about 170 MB, so the default 1 GB
  # max_wal_size still fits beside the database on the 5Gi volume.
  postgresql:
    parameters:
      wal_compression: zstd
      checkpoint_timeout: 15min
  bootstrap:
    initdb:
      database: kagent
      owner: kagent_admin
      postInitApplicationSQL:
        - REVOKE CREATE ON SCHEMA public FROM PUBLIC
  backup:
    # Garage keeps a full copy on every node; 14 days of this WAL would not
    # fit on one. Off-site copies give the longer history (Joe,
    # https://factory-plan.jomcgi.dev/factory/issue/HOME-450#comment-4597).
    retentionPolicy: "1d"
    # The in-tree barman-cloud integration, deprecated for several releases;
    # CloudNativePG 1.31 removes it, so the operator upgrade moves this to the
    # barman-cloud plugin (which also needs cert-manager) first.
    barmanObjectStore:
      destinationPath: s3://kagent-pg-backups/
      # One prefix per incarnation. A Cluster created fresh refuses to
      # archive into a non-empty prefix, so recreating it (rather than
      # recovering from these backups) takes the next name (README).
      serverName: kagent-pg-v1
      endpointURL: http://garage.garage.svc:3900
      s3Credentials:
        accessKeyId:
          name: kagent-pg-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: kagent-pg-s3
          key: AWS_SECRET_ACCESS_KEY
        region:
          name: kagent-pg-s3
          key: AWS_REGION
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kagent-pg-kagent
  namespace: kagent-pg
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: kagent-pg
  name: kagent
  owner: kagent_admin
  databaseReclaimPolicy: retain
  schemas:
    - name: kagent
      owner: kagent_owner
      ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kagent-pg-daily
  namespace: kagent-pg
spec:
  schedule: "0 30 2 * * *"
  # One base backup as soon as this is created, then daily.
  immediate: true
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: kagent-pg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: session-claims
  namespace: kagent-pg
  labels:
    cnpg.io/reload: "true"
data:
  queries: |
    quiescence:
      primary: true
      target_databases: [kagent]
      query: |
        SELECT session_id AS session, executor_id AS executor, 1 AS pending FROM kagent.pending_claims()
        UNION ALL SELECT '', '', 0
      metrics:
        - session: {usage: LABEL, description: Session ID}
        - executor: {usage: LABEL, description: Executor ID}
        - pending: {usage: GAUGE, description: Pending quiescence claim}
