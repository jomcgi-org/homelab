# The kagent namespace's share of kagent-pg: the two connection-string
# Secrets the factory chart reads, and the Role that lets
# kagent-pg/kagent-pg-setup fill only those two names. A separate Application
# (destination kagent, CreateNamespace) so that kagent-postgres never depends
# on the kagent namespace existing: ArgoCD's root does not wait for one
# Application's health before the next wave.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-postgres-owner
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: kagent-postgres-readwrite
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kagent-pg-setup
  namespace: kagent
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kagent-postgres-owner, kagent-postgres-readwrite]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kagent-pg-setup
  namespace: kagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kagent-pg-setup
subjects:
  - kind: ServiceAccount
    name: kagent-pg-setup
    namespace: kagent-pg
