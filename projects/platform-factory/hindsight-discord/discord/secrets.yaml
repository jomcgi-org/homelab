# Only the future Discord bridge receives this tenant-api-key.
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-discord-key
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-keys
  namespace: factory-discord
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-discord-key]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-keys
  namespace: factory-discord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-keys
subjects:
  - kind: ServiceAccount
    name: hindsight-keys
    namespace: hindsight-discord
---
# The homelab Hermes agent's recall token (HOME-909), copied from
# hindsight-discord/hindsight-keys by the hindsight-discord-key Job. The
# factory chart's RemoteMCPServer discord-memory sends it as the
# Authorization header; the Substrate egress gateway injects it, so the actor
# holds only a placeholder. The label lets the credential provider read it.
# The namespace is the agent's (factory chart, discord-server-agents.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-discord-recall
  namespace: discord-1501965852042330302
  labels:
    substrate.ate.dev/injectable: "true"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-keys
  namespace: discord-1501965852042330302
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-discord-recall]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-keys
  namespace: discord-1501965852042330302
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-keys
subjects:
  - kind: ServiceAccount
    name: hindsight-keys
    namespace: hindsight-discord
