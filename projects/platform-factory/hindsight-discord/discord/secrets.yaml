# Only the future Discord bridge receives this tenant-api-key.
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-discord-key
  namespace: factory-discord
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-keys
  namespace: factory-discord
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-discord-key]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-keys
  namespace: factory-discord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-keys
subjects:
  - kind: ServiceAccount
    name: hindsight-keys
    namespace: hindsight-discord
