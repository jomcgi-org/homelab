# Only the bridge (projects/factory/chart, discord.bridge) gets memory egress
# under the cluster default-deny. An acceptance pod needs the same label.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-discord
  namespace: factory-discord
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: factory-discord-bridge
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-discord
            app.kubernetes.io/name: hindsight
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
