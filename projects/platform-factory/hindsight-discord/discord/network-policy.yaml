# Only the bridge gets memory egress under the cluster default-deny.
# Acceptance pods must use the same explicit workload label (README.md).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-discord
  namespace: factory-discord
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: factory-discord-bridge
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-discord
            app.kubernetes.io/name: hindsight
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
