apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Discord memory (HOME-163).
resources:
  - network-policy.yaml
  - secrets.yaml
  - storage.yaml
  - hindsight.yaml

# Keep the script ConfigMap distinct from the tenant Secret. Kustomize also
# rewrites matching Role resourceNames, including rules for Secrets.
configMapGenerator:
  - name: hindsight-keys-script
    namespace: hindsight-discord
    files:
      - keys.py
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  # resources/preflight.py, a copy of the factory Hindsight's (keys_test),
  # for the hindsight-preflight Sync hook. ArgoCD's kustomize loads files
  # only from this directory.
  - name: hindsight-preflight-script
    namespace: hindsight-discord
    files:
      - preflight.py
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
