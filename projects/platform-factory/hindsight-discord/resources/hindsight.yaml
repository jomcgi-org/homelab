# Hindsight 1.2.1's API and in-process worker, one replica. Its state is the
# factory_discord_hindsight database; the pod keeps nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight
  namespace: hindsight-discord
  annotations:
    # The preflight hook (wave -1) runs as this account.
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight-api
  namespace: hindsight-discord
  labels:
    app.kubernetes.io/name: hindsight
spec:
  # Only the API pod. The preflight Job shares the name label, which the
  # network policy selects.
  selector:
    app.kubernetes.io/name: hindsight
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8888
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight-discord
spec:
  replicas: 1
  # One schema migrator at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
  template:
    metadata:
      labels:
        factory.jomcgi.dev/garage-client: "true"
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: hindsight
      automountServiceAccountToken: false
      # Service links would set HINDSIGHT_API_PORT to tcp://..., which
      # Hindsight reads as its own port setting.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The image's hindsight user; it defines no other UID.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/vectorize-io/hindsight-api:1.2.1@sha256:662109ece429871a81e036427fb93fbb09ba9dc4b01d320d356f114c0e1aedd8
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: HINDSIGHT_API_LLM_VISION
              value: "true"
            - name: HINDSIGHT_API_FILE_STORAGE_TYPE
              value: "s3"
            - name: HINDSIGHT_API_FILE_STORAGE_S3_BUCKET
              value: "discord-media"
            - name: HINDSIGHT_API_FILE_STORAGE_S3_REGION
              value: "garage"
            - name: HINDSIGHT_API_FILE_STORAGE_S3_ENDPOINT
              value: "http://garage.garage.svc:3900"
            - name: HINDSIGHT_API_FILE_STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: discord-media-s3
                  key: AWS_ACCESS_KEY_ID
            - name: HINDSIGHT_API_FILE_STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: discord-media-s3
                  key: AWS_SECRET_ACCESS_KEY
            - name: HINDSIGHT_API_PORT
              value: "8888"
            - name: HINDSIGHT_API_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hindsight-db
                  key: DATABASE_URL
            # All LLM work uses the dedicated Discord OpenRouter credential.
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_MODEL
              value: openai/gpt-4.1-mini
            - name: HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS
              value: "32768"
            - name: HINDSIGHT_API_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: base-url
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: api-key
            # Only the future Discord bridge receives the REST tenant key.
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-keys
                  key: tenant-api-key
            - name: HINDSIGHT_API_MCP_ENABLED
              value: "false"
            # Embeddings and the decision model are the factory Hindsight's
            # (HOME-176, HOME-182), on the same dedicated Discord key: Voyage 4
            # Large, 1,024 dimensions, from providers that keep no data.
            - name: HINDSIGHT_API_EMBEDDINGS_PROVIDER
              value: openrouter
            - name: HINDSIGHT_API_EMBEDDINGS_OPENROUTER_MODEL
              value: mongodb/voyage-4-large
            - name: HINDSIGHT_API_EMBEDDINGS_OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: api-key
            - name: HINDSIGHT_API_EMBEDDINGS_OPENAI_EXTRA_BODY
              value: '{"provider": {"data_collection": "deny"}}'
            # TypeSafe Jev 1.14 through OpenRouter's System One endpoint ranks
            # recall. No local fallback: a recall fails while it is unavailable.
            - name: HINDSIGHT_API_DECISION_MODEL_PROVIDER
              value: typesafe
            - name: HINDSIGHT_API_DECISION_MODEL_BASE_URL
              value: https://openrouter.ai/api
            - name: HINDSIGHT_API_DECISION_MODEL_MODEL
              value: typesafe/jev-1.14
            - name: HINDSIGHT_API_DECISION_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: api-key
            # The decision model ranks recall; rrf keeps the order and loads
            # no model.
            - name: HINDSIGHT_API_RERANKER_PROVIDER
              value: rrf
            # No local model runs, and nothing fetches one.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            # The model libraries write caches under the home directory.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          # Model load and migrations on a cold start.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # No model loads in the pod: the factory Hindsight, with the same
          # models, used 438 MiB on 2026-11-17.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# Before a sync replaces the API pod (resources/preflight.py, the factory
# Hindsight's script): the key works, the decision model answers from one
# endpoint, and the embedding model's dimension matches any stored vectors.
# The Deployment recreates its pod, so a failure here keeps the running pod.
# Wave -1 runs after the 1Password item and placeholders (-2), before the
# Deployment (0).
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-preflight
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  # Also bounds a wait for a Secret the operator has not written.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
        app.kubernetes.io/component: preflight
    spec:
      serviceAccountName: hindsight
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: ghcr.io/vectorize-io/hindsight-api:1.2.1@sha256:662109ece429871a81e036427fb93fbb09ba9dc4b01d320d356f114c0e1aedd8
          command: [/app/api/.venv/bin/python, -I, -B, /scripts/preflight.py]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hindsight-db
                  key: DATABASE_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-openrouter
                  key: api-key
            # Equal to the Deployment's (keys_test).
            - name: EMBEDDINGS_DIMENSIONS
              value: "1024"
            - name: EMBEDDINGS_MODEL
              value: mongodb/voyage-4-large
            - name: EMBEDDINGS_EXTRA_BODY
              value: '{"provider": {"data_collection": "deny"}}'
            - name: DECISION_MODEL
              value: typesafe/jev-1.14
            - name: DECISION_MODEL_BASE_URL
              value: https://openrouter.ai/api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: hindsight-preflight-script
