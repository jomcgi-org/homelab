# The operator syncs api-key and base-url from the dedicated Discord item.
# Key and database placeholders retain their data across ArgoCD syncs.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: hindsight-openrouter
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: "vaults/k8s-homelab/items/factory-discord-llm"
---
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-keys
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-db
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
# factory-db/factory-db-setup writes the connection string (factory-db's
# secret_init.py, LOGINS).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-db-setup
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-db]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-db-setup
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-db-setup
subjects:
  - kind: ServiceAccount
    name: factory-db-setup
    namespace: factory-db
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-keys
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hindsight-keys
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-keys]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hindsight-keys
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hindsight-keys
subjects:
  - kind: ServiceAccount
    name: hindsight-keys
    namespace: hindsight-discord
---
# Fills hindsight-keys before the Deployment (wave 0) reads it.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-keys-init
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-keys
    spec:
      serviceAccountName: hindsight-keys
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python3, -I, -u, /scripts/keys.py, init]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: hindsight-keys-script
---
# After every sync: copy the tenant key to the Discord bridge placeholder.
# Wait up to 15 minutes for the hindsight-discord-key Application.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-discord-key
  namespace: hindsight-discord
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight-keys
    spec:
      serviceAccountName: hindsight-keys
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discord
          image: docker.io/library/python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          command: [python3, -I, -u, /scripts/keys.py, discord]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: hindsight-keys-script
