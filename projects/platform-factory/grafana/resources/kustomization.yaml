apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Grafana for the operators' metrics view (projects/factory-cluster/
# README.md, "Metrics view"). Every ConfigMap name carries its content's hash,
# so a change to the configuration or a dashboard rolls the pod.
resources:
  - network-policy.yaml
  - oidc.yaml
  - grafana.yaml
  - mcp-grafana.yaml
  - route.yaml
  - runbooks.yaml
  - runbooks-route.yaml

configMapGenerator:
  - name: grafana-viewer-script
    namespace: grafana
    files:
      - provision_viewer.py
  - name: grafana-config
    namespace: grafana
    files:
      - grafana.ini
  - name: grafana-provisioning
    namespace: grafana
    files:
      - datasources.yaml
      - dashboards.yaml
  - name: grafana-dashboards
    namespace: grafana
    files:
      - dashboards/cluster.json
      - dashboards/capacity-advisor.json
      - dashboards/cilium-drops.json
      - dashboards/cnpg.json
      - dashboards/factory-delivery.json
      - dashboards/mandoline.json
      - dashboards/egress-scanning.json
      - dashboards/hindsight.json
  - name: runbooks
    namespace: grafana
    files:
      - runbooks/server.py
      - runbooks/NodeDiskFilling.json
      - runbooks/KagentSuspendTimedOut.json
      - runbooks/FactoryCodexQuotaLow.json
      - runbooks/FactoryCodexQuotaExhausted.json
      - runbooks/FactoryCodexGrantNotReady.json
      - runbooks/FactoryCodexQuotaReadingStale.json
      - runbooks/SemgrepSyncFailed.json
      - runbooks/AlertRelayDown.json
      - runbooks/FactoryHealthUnhealthy.json
      - runbooks/FactoryHealthStale.json
      - runbooks/FactoryEgressIPChanged.json
      - runbooks/CloudflareCredentialRefused.json
