apiVersion: v1
kind: Secret
metadata:
  name: mcp-grafana-caller
  namespace: grafana
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-grafana-viewer
  namespace: grafana
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-viewer-provisioner
  namespace: grafana
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mcp-grafana-viewer]
    verbs: [patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mcp-grafana-caller]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-viewer-provisioner
  namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-viewer-provisioner
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-grafana
  namespace: grafana
spec:
  selector:
    app.kubernetes.io/name: mcp-grafana
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-grafana
          image: docker.io/grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
          command: [/app/mcp-grafana]
          args:
            - --transport=streamable-http
            - --address=0.0.0.0:8000
            - --allowed-hosts=mcp-grafana.grafana.svc.cluster.local:8000
            - --enabled-tools=search,dashboard,prometheus,datasource,alerting
            - --disable-write
          env:
            - name: GRAFANA_URL
              value: http://grafana.grafana.svc.cluster.local:3000
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
              value: /run/viewer/token
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-grafana-caller
                  key: caller
          readinessProbe:
            tcpSocket:
              port: 8000
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: viewer
              mountPath: /run/viewer
              readOnly: true
      volumes:
        - name: viewer
          secret:
            secretName: mcp-grafana-viewer
            items:
              - key: token
                path: token
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-grafana
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
