; Grafana's configuration (grafana.yaml mounts it). People sign in at
; factory-grafana.jomcgi.dev twice: the edge Gateway's Authentik OIDC, then
; this one's (client factory-grafana); both admit only authentik Admins.
;
; State is an emptyDir: dashboards and the datasource come from Git, users
; are created at sign-in, and a restart forgets sessions and preferences.

[server]
http_port = 3000
root_url = https://factory-grafana.jomcgi.dev/
enforce_domain = false

[paths]
data = /var/lib/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[database]
type = sqlite3

[security]
; Generated per start into the emptyDir (grafana.yaml); break-glass in
; projects/factory-cluster/README.md.
admin_user = admin
admin_password = $__file{/run/grafana/admin-password}
secret_key = $__file{/run/grafana/secret-key}
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
disable_initial_admin_creation = false

[users]
allow_sign_up = false
allow_org_create = false
default_theme = system

[auth]
signout_redirect_url = https://factory-auth.jomcgi.dev/application/o/factory-grafana/end-session/

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[auth.generic_oauth]
enabled = true
name = Authentik
client_id = factory-grafana
client_secret = $__file{/etc/grafana/oidc/client-secret}
scopes = openid email profile
auth_url = https://factory-auth.jomcgi.dev/application/o/authorize/
token_url = https://factory-auth.jomcgi.dev/application/o/token/
api_url = https://factory-auth.jomcgi.dev/application/o/userinfo/
use_pkce = true
; The sign-in page goes straight to Authentik; /login?disableAutoLogin=true
; shows the form for the break-glass admin.
auto_login = true
allow_sign_up = true
login_attribute_path = preferred_username
name_attribute_path = name
email_attribute_path = email
; Authentik's binding admits only authentik Admins; anyone else is refused
; here too rather than given a default role.
role_attribute_path = contains(groups[*], 'authentik Admins') && 'Admin'
role_attribute_strict = true
allow_assign_grafana_admin = false

; No calls to grafana.com or elsewhere: the namespace's egress allows only
; Prometheus and Authentik.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true

[log]
mode = console
level = info
