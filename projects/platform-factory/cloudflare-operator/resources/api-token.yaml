# Cloudflare API token the operator acts with. The 1Password item carries one
# field, CLOUDFLARE_API_TOKEN, scoped to the jomcgi.dev zone and the account:
#   Account: Cloudflare Tunnel:Edit
#   Zone (jomcgi.dev): DNS:Edit, Zone:Read
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-credentials
  namespace: cloudflare-operator-system
spec:
  itemPath: "vaults/k8s-homelab/items/factory-cloudflare-api-token"
