# On a real cluster, only use with kubectl apply --dry-run=server.
# The admission test also loads these into its disposable API server.
apiVersion: v1
kind: Pod
metadata:
  name: home-70-denied-pod
  namespace: factory-credentials
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: home-70-denied-no-repositories
  namespace: factory-credentials
spec:
  appID: "1"
  installID: "1"
  permissions:
    contents: read
  auth:
    privateKey:
      secretRef:
        name: home-70-nonexistent-key
        key: private-key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: home-70-denied-no-permissions
  namespace: factory-credentials
spec:
  appID: "1"
  installID: "1"
  repositories: [homelab]
  auth:
    privateKey:
      secretRef:
        name: home-70-nonexistent-key
        key: private-key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: home-70-denied-outside-namespace
  namespace: default
spec:
  appID: "1"
  installID: "1"
  repositories: [homelab]
  permissions:
    contents: read
  auth:
    privateKey:
      secretRef:
        name: home-70-nonexistent-key
        key: private-key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: home-70-denied-webhook
  namespace: default
spec:
  url: https://example.invalid/credentials
  result:
    jsonPath: $.token
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: home-70-denied-cluster-generator
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 32
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-70-denied-list
  namespace: factory-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [home-70-minted-token]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-70-denied-unnamed-read
  namespace: factory-credentials
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get]
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: home-70-denied-cluster-store
spec:
  provider:
    fake:
      data:
        - key: home-70-fixture
          value: synthetic
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: home-70-denied-cluster-external
spec:
  externalSecretSpec:
    secretStoreRef:
      name: home-70-nonexistent-store
      kind: SecretStore
    target:
      name: home-70-fixture
    data:
      - secretKey: token
        remoteRef:
          key: home-70-fixture
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: home-70-denied-push
  namespace: factory-credentials
spec:
  secretStoreRefs:
    - name: home-70-nonexistent-store
      kind: SecretStore
  selector:
    secret:
      name: home-70-fixture
---
apiVersion: external-secrets.io/v1alpha1
kind: ClusterPushSecret
metadata:
  name: home-70-denied-cluster-push
spec:
  pushSecretSpec:
    secretStoreRefs:
      - name: home-70-nonexistent-store
        kind: SecretStore
    selector:
      secret:
        name: home-70-fixture
