apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    path: projects/platform-factory/home-assistant/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  # garage-init writes the backup key.
  ignoreDifferences:
    - kind: Secret
      namespace: home-assistant
      name: home-assistant-backups-s3
      jsonPointers: [/data]
  syncPolicy:
    # Zigbee2MQTT opens the Zigbee dongle on node-2 through a hostPath
    # character device. Only a privileged container passes the device
    # cgroup, so the namespace opts out of baseline (CLUS-7).
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
