apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hikes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/jomcgi/homelab/charts
    chart: hikes
    targetRevision: 0.6.5
    helm:
      releaseName: hikes
  destination:
    server: https://kubernetes.default.svc
    namespace: hikes
  ignoreDifferences:
    - {group: "", kind: Secret, name: hikes-hikes-s3, jsonPointers: [/data]}
    - {group: "", kind: Secret, name: hikes-hikes-mirror-s3, jsonPointers: [/data]}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
