image:
  repository: ghcr.io/jomcgi/homelab/projects/hikes
  digest: ""
buckets:
  - name: hikes
    access: readwrite
    public:
      # One public R2 bucket, one prefix for each writer (HOME-492).
      r2Bucket: factory-public
      r2Prefix: hikes
      manifestName: latest.json
      itemPath: vaults/k8s-homelab/items/factory-r2-public-mirror
      suspend: true
suspendWriters: true
jobs:
  catalogue: "0 0 1 1 *"
  refresh: "20 */2 * * *"
  prune: "40 * * * *"
