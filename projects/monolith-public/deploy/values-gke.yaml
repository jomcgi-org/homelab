# GKE cutover destination. HPAs were disabled here so zero replicas stayed
# authoritative during the cutover; web has since been re-enabled (see below).
# WINDOW: the web env list is a literal in chart values (Helm values cannot
# self-reference), so pointing public chat at Meta Spark while retaining the
# in-cluster embedding service means overriding the WHOLE list here. Fold this
# back into a template-driven env in the chart post-window (#5457).
otelEndpoint: "http://otel-collector.otel-collector.svc:4318/v1/traces"

web:
  env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        key: uri
        name: monolith-public-db
  - name: PUBLIC_WRITER_DATABASE_URL
    valueFrom:
      secretKeyRef:
        key: uri
        name: monolith-public-writer-db
  - name: EMBERVM_URL
    value: http://embervm-embervm.embervm.svc.cluster.local:8080
  - name: K8S_AUTH_TOKEN_FILE
    value: /var/run/secrets/embervm-public-faas/token
  - name: DEMO_PG_PASSWORD
    valueFrom:
      secretKeyRef:
        key: POSTGRES_PASSWORD
        name: monolith-public-demo-postgres
  - name: DEMO_POSTGRES_DSN
    value: postgresql://postgres:$(DEMO_PG_PASSWORD)@embervm-embervm-serving.embervm.svc:5401/scratch
  - name: EMBER_DEMO_MAX_CONCURRENT
    value: '4'
  - name: CHAT_PUBLIC_CHAR_CAP
    value: '8000'
  - name: CHAT_PUBLIC_MAX_TURNS
    value: '20'
  - name: CHAT_PUBLIC_MAX_OUTPUT_TOKENS
    value: '4000'
  - name: CHAT_PUBLIC_MAX_SESSION_TOKENS
    value: '32000'
  - name: CHAT_PUBLIC_SESSION_TTL_SECONDS
    value: '1800'
  - name: CHAT_PUBLIC_GLOBAL_MAX_CONCURRENT
    value: '1'
  - name: CHAT_PUBLIC_INFERENCE_URL
    value: https://api.meta.ai
  - name: META_SPARK_API_KEY
    valueFrom:
      secretKeyRef:
        key: META_SPARK_API_KEY
        name: monolith-public-meta-spark
  - name: EMBEDDING_URL
    value: http://inference-embeddings.inference.svc.cluster.local:8080
  - name: CHAT_PUBLIC_RETRIEVAL_K
    value: '6'
  - name: CHAT_PUBLIC_MODEL_WINDOW_TOKENS
    value: '32768'
  - name: CHAT_PUBLIC_COMPACTION_TRIGGER
    value: '0.70'
  - name: CHAT_PUBLIC_COMPACTION_KEEP_MESSAGES
    value: '6'
  - name: CHAT_PUBLIC_SUMMARY_MAX_TOKENS
    value: '512'
  - name: TURNSTILE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        key: SECRET_KEY
        name: monolith-public-turnstile
  - name: TURNSTILE_TIMEOUT_SECONDS
    value: '5'
  - name: CHAT_PUBLIC_IP_HASH_SALT
    valueFrom:
      secretKeyRef:
        key: IP_HASH_SALT
        name: monolith-public-turnstile
  - name: SEAWEEDFS_S3_ENDPOINT
    value: https://7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com
  - name: AWS_REGION
    value: auto
  - name: S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        key: access-key-id
        name: monolith-public-r2-s3
  - name: S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: secret-access-key
        name: monolith-public-r2-s3
  - name: STARS_GRID_S3_BUCKET
    value: stars
  - name: STARS_SITES_S3_KEY
    value: sites.json
  - name: STARS_MAP_S3_KEY
    value: map.json
  - name: STARS_HISTORY_MAP_S3_KEY
    value: history-map.json
  - name: ARTIFACTS_S3_BUCKET
    value: artifacts
  # The shared chart helper treats numeric zero as empty and defaults it to one.
  # A string still renders as the numeric YAML scalar `replicas: 0`.
  # Kept as the floor the HPA starts from, and as the count if autoscaling is
  # turned off again: the deployment template stops rendering replicas while an
  # HPA owns the component, so this value is inert until then.
  replicas: "1"
  # Re-enabled 2026-09-15. The cutover comment at the top of this file disabled
  # HPAs so zero replicas stayed authoritative while the app was dormant; the
  # tier has served live traffic since and the single replica makes any restart
  # a full public outage, which is how an OOMKill at 12:03 on 2026-09-15 took
  # the public site down with nothing alerting on it.
  autoscaling:
    enabled: true
    # Floor of 2, above the chart default of 1. The HPA scales on CPU and an
    # OOMKill is not CPU pressure, so at a floor of 1 a kill is a full public
    # outage until the pod reschedules, which is what happened at 12:03 on
    # 2026-09-15. Two replicas make that a degraded tier instead, and the PDB
    # (maxUnavailable 1) then keeps a drain to one pod at a time. Costs one
    # permanently running 384Mi pod.
    minReplicas: 2

frontend:
  replicas: "1"
  autoscaling:
    enabled: false

imgproxy:
  replicas: "2"
