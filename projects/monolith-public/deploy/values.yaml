# Cluster-specific overrides for the read-only public service.
# The image tag is pinned by the Bazel helm_images_values pipeline at build
# time; do not set a repository/tag/digest here.

# Sync the public_reader DB credential from 1Password into the
# monolith-public-db Secret (key "uri" = full postgresql:// connection string
# to monolith-pg-ro as public_reader).
onepassword:
  itemPath: "vaults/k8s-homelab/items/public-reader-db"

databaseSecretName: monolith-public-db

# Public chat (ADR 005, Phase 1): sync the public_writer DB credential from
# 1Password into the monolith-public-writer-db Secret (key "uri" = full
# postgresql:// connection string to monolith-pg-rw as the public_writer role).
# The matching CNPG basic-auth secret monolith-pg-public-writer must be created
# out-of-band in the monolith namespace (see public-writer-secret.md).
publicWriter:
  onepassword:
    itemPath: "vaults/k8s-homelab/items/public-writer-db"

# Public chat Turnstile admission (ADR 005, Phase 2): sync the Cloudflare
# Turnstile item into the monolith-public-turnstile Secret (keys SITE_KEY /
# SECRET_KEY / IP_HASH_SALT). The backend uses SECRET_KEY + IP_HASH_SALT via
# secretKeyRef; the public SITE_KEY is a values literal handed to the frontend.
turnstile:
  onepassword:
    itemPath: "vaults/k8s-homelab/items/cloudflare-turnstile"

# Trip image URL signing: sync the imgproxy KEY/SALT from 1Password into the
# monolith-public-imgproxy-signing Secret (keys IMGPROXY_KEY / IMGPROXY_SALT).
# Both the imgproxy and frontend components reference it via secretKeyRef.
imgproxySigning:
  onepassword:
    itemPath: "vaults/k8s-homelab/items/trips-imgproxy-signing"

# Serve /img on the private hostname too: the grimoire reader on
# private.jomcgi.dev loads signed illustration URLs same-origin (CF Access
# still fronts the hostname at the edge; same gateway, same imgproxy).
imgproxy:
  extraHostnames:
    - private.jomcgi.dev

# EmberVM URL for the public FaaS invocation router (Task 13). The public tier
# runs no semgrep, but the chart derives the EMBERVM_URL env from
# `semgrep.embervmUrl` (the single knob), so the /functions/<name> public router
# reaches the EmberVM control plane at the same in-cluster address the private
# tier uses. In-cluster egress is allowed by the Cilium policy below, and the
# public tier submits as its own SA (allow-listed in embervm/deploy/values.yaml).
semgrep:
  embervmUrl: "http://embervm-embervm.embervm.svc.cluster.local:8080"

# Phase 5e cutover: serve the public hostname from this isolated service.
cfIngress:
  public:
    enabled: true
    hostname: jomcgi.dev

# Cilium network policy (ADR platform/012). Both gates are on:
#   ingress: gateway -> frontend, frontend -> web (flipped during the window).
#   egress:  off-cluster default-deny with the single sanctioned Turnstile allow
#            (challenges.cloudflare.com siteverify, IP-pinned to Cloudflare's
#            published ranges via toCIDRSet), all in-cluster allowed, DNS at L4.
#            Flipped in a tested follow-up: hubble showed the only off-cluster
#            egress is web -> Turnstile; frontend/imgproxy reach nothing
#            off-cluster (imgproxy sources from in-cluster SeaweedFS).
# See the chart's templates/cilium-policy.yaml rationale.
ciliumPolicy:
  ingress:
    enabled: true
  egress:
    enabled: true
