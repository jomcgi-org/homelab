apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith-public
  namespace: argocd
spec:
  project: default
  sources:
    # Chart from OCI registry (pushed by CI via Bazel helm_push)
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith-public
      targetRevision: 0.358.9
      helm:
        releaseName: monolith-public
        valueFiles:
          - $values/projects/monolith-public/deploy/values.yaml
    # Git repo for environment-specific values
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-public
  # The HPA owns replica counts; without this, selfHeal would revert the
  # Deployments to the chart's replicas and fight the autoscaler.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ignoreDifferences above suppresses DIFFING, not APPLYING.
      # Without this option a sync still writes the chart's version of
      # those fields, stripping the env Kyverno injects; Kyverno
      # re-injects, and the Deployment never settles. `canada` already
      # carries this option one level up so Kargo's targetRevision patch
      # on Application resources survives; the child apps declared
      # ignoreDifferences without it.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
