# Publication metadata retained for chart-version write-back. The hub deploys
# projects/gke-apps/monolith-public/application.yaml with both production value files.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith-public
  namespace: argocd
spec:
  project: default
  sources:
    # Chart from OCI registry (pushed by CI via Bazel helm_push)
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith-public
      targetRevision: 0.726.6
      helm:
        releaseName: monolith-public
        valueFiles:
          - $values/projects/monolith-public/deploy/values.yaml
    # Git repo for environment-specific values
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-public
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
