{{- if .Values.metaSpark.onepassword.itemPath }}
# Meta Spark contributor-tier API credential for the public chat backend.
# The item field label must be META_SPARK_API_KEY.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.metaSpark.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.metaSpark.onepassword.itemPath | quote }}
{{- end }}
