{{- if .Values.cfIngress.public.enabled }}
# Public ingress for the read-only public service (ADR 004 Phase 5e). The
# Cloudflare/Envoy gateway routes the public hostname here: pages + client
# assets to the SvelteKit frontend, /api to the public backend. Network-level
# restriction to the gateway identity remains successor work (#5276).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-public
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    # SvelteKit client assets pass through to the frontend SSR.
    - matches:
        - path:
            type: PathPrefix
            value: /_app/
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
    # NO /api rule: the public backend is never internet-reachable. Every
    # backend read is server-side (SSR +page.server.js or a frontend +server.js
    # proxy, e.g. /notes/body/<id>, ships/stars heat/track), so the browser only
    # ever talks to the frontend. The gateway routes solely to the frontend; the
    # backend is reached only by the frontend in-cluster over mTLS.
    #
    # Everything to the frontend SSR (the reroute hook maps the apex host to
    # /public internally).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
---
# /img/ -> imgproxy on its OWN HTTPRoute, deliberately SEPARATE from the route
# above so the rate-limit BackendTrafficPolicy (which targets -public) does NOT
# apply to image serving. A single trip day legitimately loads hundreds of
# photos (the scrubber also preloads the whole day), which would trip the
# page-level 100 req/min limit (local_rate_limited). Images are safe to leave
# unlimited: imgproxy is read-only, signed (IMGPROXY_KEY), bucket-locked
# (ALLOWED_SOURCES=monolith-trips) and preset-capped (ONLY_PRESETS), and almost
# all requests are served from the Cloudflare 1-year immutable cache, never
# reaching origin. No URLRewrite: imgproxy serves under /img via
# IMGPROXY_PATH_PREFIX, so the /img prefix is forwarded as-is.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-img
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
    {{- range .Values.imgproxy.extraHostnames }}
    # Extra hostname (private tier): the grimoire reader loads signed /img
    # URLs same-origin on private.jomcgi.dev; CF Access still fronts the edge.
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /img/
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-imgproxy
          port: {{ .Values.imgproxy.service.port | int }}
      timeouts:
        request: 60s
---
# /functions/ -> the public FaaS invocation backend (Task 13, ADR agents/045).
# A backend-served API surface (like /img -> imgproxy), NOT a SvelteKit page:
# clients fetch jomcgi.dev/functions/<name> directly, so it routes straight to the
# -web backend on its OWN HTTPRoute rather than through the frontend SSR. The backend mounts ONLY
# the public invocation router here (no
# /api/functions ingestion), and it resolves only visibility=public functions
# (get_public_function), so a private function 404s. Its own route (separate from
# the page route) carries a dedicated rate-limit below.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-functions
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /functions/
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-web
          port: {{ .Values.web.service.port | int }}
      timeouts:
        request: 60s
---
# /ember/postgres/api/status + /savings -> the frontend, on their OWN HTTPRoute
# so the demo's sub-second lifecycle polling does NOT share the page's coarse
# rate-limit budget. The status poll alone runs ~85 req/min per viewer, which
# would otherwise sit inside the same per-client page budget as the page's own
# page loads and trip it. Both endpoints are cheap, wake-safe control-plane
# reads served from a short server-side cache (status 500ms single-flight,
# savings 30s), so a high poll rate costs the backend almost nothing and a
# generous dedicated limit is safe. The write paths (/query, /session)
# deliberately stay on the page budget, backstopped by the backend's
# per-session insert bucket, the query semaphore, and Turnstile.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-ember-reads
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    # Exact matches (higher precedence than the catch-all "/" page rule) so ONLY
    # these two poll endpoints move to the dedicated budget, not /query|/session.
    - matches:
        - path:
            type: Exact
            value: /ember/postgres/api/status
        - path:
            type: Exact
            value: /ember/postgres/api/savings
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
---
# Per-client rate limits for the two public routes whose traffic is keyed on the
# client address. Neither uses the shared cf-ingress.rate-limit helper below,
# whose Local bucket is gateway-wide and shared across every client. The gateway
# chart's NetworkPolicy admits the listener only from its cloudflared pods, and
# Cloudflare overwrites CF-Connecting-IP on non-Worker edge requests. The
# SecurityPolicy rejects same-zone Worker subrequests (where a Worker can
# influence CF-Connecting-IP) and Cloudflare's fixed cross-zone Worker address.
# Each policy's first rate-limit rule is a fail-safe bucket for a missing or
# malformed header; a valid address matches the Distinct descriptor in the
# second rule instead, and Envoy Gateway 1.8.3 sets
# always_consume_default_token_bucket=false for descriptor rules, so valid
# clients neither consume nor inherit that shared fallback budget. The gateway
# chart also patches each route-specific LocalRateLimit to retain up to 10,000
# dynamic descriptors; without that route-level capacity Envoy's default of 20
# would let ordinary client cardinality evict exhausted buckets.
#
# Keep the regular-expression matcher alongside Distinct. Distinct alone would
# give every arbitrary malformed value a fresh bucket if the tunnel contract
# ever regressed. The expression accepts canonical IPv4 and IPv6 addresses; a
# non-canonical value safely falls back to the first rule.
#
# The apex page route (the catch-all "/" and /_app/ rules) is keyed per client
# too. It used to share one gateway-wide bucket, so a single scanner sweep (the
# Laravel and Ignition probes such as /js/.env that fall to this catch-all) or
# one lingering client could drain the budget and 429 local_rate_limited every
# other visitor. That is the residue the ember-reads carve-out only worked
# around; keying on the client address removes it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-public-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "monolith-public.fullname" . }}-public
  rateLimit:
    type: Local
    local:
      rules:
        # Requests without a valid Cloudflare identity land only in this
        # fail-safe bucket. Descriptor matches do not consume it.
        - limit:
            requests: {{ .Values.cfIngress.public.rateLimit.requests }}
            unit: {{ .Values.cfIngress.public.rateLimit.unit }}
        - clientSelectors:
            - headers:
                - name: {{ .Values.cfIngress.public.clientIdentity.clientHeader.name | quote }}
                  type: Distinct
                - name: {{ .Values.cfIngress.public.clientIdentity.clientHeader.name | quote }}
                  type: RegularExpression
                  value: {{ .Values.cfIngress.public.clientIdentity.clientHeader.valuePattern | quote }}
          limit:
            requests: {{ .Values.cfIngress.public.rateLimit.requests }}
            unit: {{ .Values.cfIngress.public.rateLimit.unit }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-public-origin
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "monolith-public.fullname" . }}-public
  authorization:
    defaultAction: Allow
    rules:
      # Cloudflare documents that same-zone Workers can alter x-real-ip, which
      # becomes CF-Connecting-IP. CF-Worker is added to every fetch subrequest.
      - name: deny-same-zone-workers
        action: Deny
        principal:
          headers:
            - name: CF-Worker
              values:
                - {{ .Values.cfIngress.public.clientIdentity.cloudflareZone | quote }}
      # Cross-zone Worker traffic receives this fixed address rather than the
      # visitor address. Reject it instead of treating all Workers as one client.
      - name: deny-cross-zone-workers
        action: Deny
        principal:
          headers:
            - name: {{ .Values.cfIngress.public.clientIdentity.clientHeader.name | quote }}
              values:
                - {{ .Values.cfIngress.public.clientIdentity.crossZoneWorkerAddress | quote }}
---
# /functions/ carries the same per-client shape described above, with its own
# budget.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-functions-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "monolith-public.fullname" . }}-functions
  rateLimit:
    type: Local
    local:
      rules:
        # Requests without a valid Cloudflare identity land only in this
        # fail-safe bucket. Descriptor matches do not consume it.
        - limit:
            requests: {{ .Values.cfIngress.public.functionsRateLimit.requests }}
            unit: {{ .Values.cfIngress.public.functionsRateLimit.unit }}
        - clientSelectors:
            - headers:
                - name: {{ .Values.cfIngress.public.clientIdentity.clientHeader.name | quote }}
                  type: Distinct
                - name: {{ .Values.cfIngress.public.clientIdentity.clientHeader.name | quote }}
                  type: RegularExpression
                  value: {{ .Values.cfIngress.public.clientIdentity.clientHeader.valuePattern | quote }}
          limit:
            requests: {{ .Values.cfIngress.public.functionsRateLimit.requests }}
            unit: {{ .Values.cfIngress.public.functionsRateLimit.unit }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-functions-origin
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "monolith-public.fullname" . }}-functions
  authorization:
    defaultAction: Allow
    rules:
      # Cloudflare documents that same-zone Workers can alter x-real-ip, which
      # becomes CF-Connecting-IP. CF-Worker is added to every fetch subrequest.
      - name: deny-same-zone-workers
        action: Deny
        principal:
          headers:
            - name: CF-Worker
              values:
                - {{ .Values.cfIngress.public.clientIdentity.cloudflareZone | quote }}
      # Cross-zone Worker traffic receives this fixed address rather than the
      # visitor address. Reject it instead of treating all Workers as one client.
      - name: deny-cross-zone-workers
        action: Deny
        principal:
          headers:
            - name: {{ .Values.cfIngress.public.clientIdentity.clientHeader.name | quote }}
              values:
                - {{ .Values.cfIngress.public.clientIdentity.crossZoneWorkerAddress | quote }}
---
{{- $emberRlParams := dict
  "name" (printf "%s-ember-reads" (include "monolith-public.fullname" .))
  "rateLimit" .Values.cfIngress.public.emberReadsRateLimit
}}
{{- include "cf-ingress.rate-limit" $emberRlParams }}
{{- end }}
