{{- if .Values.cfIngress.public.enabled }}
# Public ingress for the read-only public service (ADR 004 Phase 5e). The
# Cloudflare/Envoy gateway routes the public hostname here: pages + client
# assets to the SvelteKit frontend, /api to the public backend. The gateway's
# mesh identity is authorized by templates/linkerd-policy.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-public
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    # SvelteKit client assets pass through to the frontend SSR.
    - matches:
        - path:
            type: PathPrefix
            value: /_app/
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
    # Public knowledge API, narrowly scoped to /api/knowledge/public/* (the only
    # /api path the browser calls directly; the rest is SSR-fetched in-pod). This
    # mirrors the ingress-layer belt-and-braces of the private monolith chart and
    # keeps the public surface minimal at the routing layer, even though the
    # backend (main_public) mounts only public routes and public_reader + the
    # public_api views are the confidentiality boundary regardless.
    - matches:
        - path:
            type: PathPrefix
            value: /api/knowledge/public
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-web
          port: {{ .Values.web.service.port | int }}
      timeouts:
        request: 30s
    # Everything else to the frontend SSR (the reroute hook maps the apex host
    # to /public internally).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
---
{{- $rlParams := dict
  "name" (printf "%s-public" (include "monolith-public.fullname" .))
  "rateLimit" .Values.cfIngress.public.rateLimit
}}
{{- include "cf-ingress.rate-limit" $rlParams }}
{{- end }}
