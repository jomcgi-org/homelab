{{- if .Values.cfIngress.public.enabled }}
# Public ingress for the read-only public service (ADR 004 Phase 5e). The
# Cloudflare/Envoy gateway routes the public hostname here: pages + client
# assets to the SvelteKit frontend, /api to the public backend. The gateway's
# mesh identity is authorized by templates/cilium-policy.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-public
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    # SvelteKit client assets pass through to the frontend SSR.
    - matches:
        - path:
            type: PathPrefix
            value: /_app/
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
    # NO /api rule: the public backend is never internet-reachable. Every
    # backend read is server-side (SSR +page.server.js or a frontend +server.js
    # proxy, e.g. /notes/body/<id>, ships/stars heat/track), so the browser only
    # ever talks to the frontend. The gateway routes solely to the frontend; the
    # backend is reached only by the frontend in-cluster over mTLS.
    #
    # Everything to the frontend SSR (the reroute hook maps the apex host to
    # /public internally).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
---
# /img/ -> imgproxy on its OWN HTTPRoute, deliberately SEPARATE from the route
# above so the rate-limit BackendTrafficPolicy (which targets -public) does NOT
# apply to image serving. A single trip day legitimately loads hundreds of
# photos (the scrubber also preloads the whole day), which would trip the
# page-level 100 req/min limit (local_rate_limited). Images are safe to leave
# unlimited: imgproxy is read-only, signed (IMGPROXY_KEY), bucket-locked
# (ALLOWED_SOURCES=monolith-trips) and preset-capped (ONLY_PRESETS), and almost
# all requests are served from the Cloudflare 1-year immutable cache, never
# reaching origin. No URLRewrite: imgproxy serves under /img via
# IMGPROXY_PATH_PREFIX, so the /img prefix is forwarded as-is.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-img
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
    {{- range .Values.imgproxy.extraHostnames }}
    # Extra hostname (private tier): the grimoire reader loads signed /img
    # URLs same-origin on private.jomcgi.dev; CF Access still fronts the edge.
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /img/
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-imgproxy
          port: {{ .Values.imgproxy.service.port | int }}
      timeouts:
        request: 60s
---
# /functions/ -> the public FaaS invocation backend (Task 13, ADR agents/045).
# A backend-served API surface (like /img -> imgproxy), NOT a SvelteKit page:
# clients fetch jomcgi.dev/functions/<name> directly, so it routes straight to the
# -web backend on its OWN HTTPRoute rather than through the frontend SSR. The backend mounts ONLY
# the public invocation router here (no
# /api/functions ingestion), and it resolves only visibility=public functions
# (get_public_function), so a private function 404s. Its own route (separate from
# the page route) carries a dedicated rate-limit below.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-functions
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /functions/
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-web
          port: {{ .Values.web.service.port | int }}
      timeouts:
        request: 60s
---
# /ember/postgres/api/status + /savings -> the frontend, on their OWN HTTPRoute
# so the demo's sub-second lifecycle polling does NOT share the page's coarse
# rate-limit budget. That page limit is a single gateway-wide bucket shared
# across ALL clients (Local rate limit, no clientSelectors), and the status poll
# alone runs ~85 req/min per viewer, so one lingering visitor could starve the
# whole apex site (429 local_rate_limited for everyone). Both endpoints are
# cheap, wake-safe control-plane reads served from a short server-side cache
# (status 500ms single-flight, savings 30s), so a high poll rate costs the
# backend almost nothing and a generous dedicated limit is safe. The write paths
# (/query, /session) deliberately stay on the page budget, backstopped by the
# backend's per-session insert bucket, the query semaphore, and Turnstile.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-ember-reads
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    # Exact matches (higher precedence than the catch-all "/" page rule) so ONLY
    # these two poll endpoints move to the dedicated budget, not /query|/session.
    - matches:
        - path:
            type: Exact
            value: /ember/postgres/api/status
        - path:
            type: Exact
            value: /ember/postgres/api/savings
      backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port | int }}
      timeouts:
        request: 60s
---
{{- $rlParams := dict
  "name" (printf "%s-public" (include "monolith-public.fullname" .))
  "rateLimit" .Values.cfIngress.public.rateLimit
}}
{{- include "cf-ingress.rate-limit" $rlParams }}
---
{{- $fnRlParams := dict
  "name" (printf "%s-functions" (include "monolith-public.fullname" .))
  "rateLimit" .Values.cfIngress.public.functionsRateLimit
}}
{{- include "cf-ingress.rate-limit" $fnRlParams }}
---
{{- $emberRlParams := dict
  "name" (printf "%s-ember-reads" (include "monolith-public.fullname" .))
  "rateLimit" .Values.cfIngress.public.emberReadsRateLimit
}}
{{- include "cf-ingress.rate-limit" $emberRlParams }}
{{- end }}
