# CiliumNetworkPolicy translation of the Linkerd policy chain that used to live
# in this chart's now-removed linkerd-policy.yaml (Server / AuthorizationPolicy
# / MeshTLSAuthentication / EgressNetwork / TLSRoute). ADR platform/012 replaces
# the Linkerd sidecar mesh with Cilium as the CNI.
#
# Cilium runs in policyEnforcementMode=default (allow-until-selected), so these
# rules are ADDITIVE: an endpoint is only restricted once a policy selects it in
# a given direction. That is why tearing out the Linkerd policies at cutover
# opens no deny-gap.
#
# TWO independent gates so the cutover can stage the two halves separately
# (both default false in chart/values.yaml, so this whole file is inert on
# merge and only renders when a deploy override flips a gate):
#
#   ciliumPolicy.ingress.enabled - the who-can-reach-us restrictions
#     (gateway -> frontend, frontend -> backend). Low risk, well understood;
#     intended to flip ON during the maintenance window.
#
#   ciliumPolicy.egress.enabled  - the default-deny-OFF-cluster lockdown plus
#     the single sanctioned Turnstile allow (Cloudflare siteverify), IP-pinned
#     via toCIDRSet to Cloudflare's published ranges. Recommended to flip ON in a
#     tested follow-up AFTER the window (watch flows with `hubble observe`), so
#     an unproven egress deny is not stacked onto the irreversible CNI swap.
#
#   ciliumPolicy.egress.scoped   - #5142 destination scoping, with an
#     off/audit/enforce ladder documented in
#     templates/cilium-policy-scoped-egress.yaml. While it is "enforce", the
#     three broad egress policies below DO NOT RENDER AT ALL: the scoped file
#     owns the whole direction (per-dependency toEndpoints allows, the
#     Turnstile toCIDRSet, and the default-deny itself).
#
# imgproxy note: its INGRESS is deliberately left unrestricted (it has no
# Linkerd Server today and also answers on private.jomcgi.dev). Its EGRESS is
# locked down, because the Linkerd EgressNetwork deny is namespace-wide and
# currently blocks imgproxy's off-cluster traffic too.

{{- if .Values.ciliumPolicy.ingress.enabled }}
{{- if .Values.frontend.enabled }}
---
# Only the Cloudflare/Envoy gateway may reach the frontend SSR pod. Replaces the
# allow-gateway-frontend AuthorizationPolicy + the gateway MeshTLSAuthentication.
# Selecting by namespace matches the old wildcard over the gateway namespace's
# ServiceAccounts, which survived the envoy data-plane SA's hash-suffixed name.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-frontend-ingress
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "monolith-public.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: {{ .Values.frontend.containerPort | quote }}
              protocol: TCP
    # The EmberVM shotter workload renders this page to a screenshot so agents
    # can see what is deployed (ADR embervm/035). Its egress sidecar dials from
    # a brick pod in the embervm namespace, and without this rule the connect is
    # dropped: once any ingress rule selects this endpoint Cilium default-denies
    # everything else, and a caller omitted here fails as a SILENT DIAL TIMEOUT
    # rather than a readable deny (PR #4294). Read-only HTTP on the SSR port
    # only; the backend "web" service is a separate endpoint and stays closed to
    # embervm.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: embervm
      toPorts:
        - ports:
            - port: {{ .Values.frontend.containerPort | quote }}
              protocol: TCP
    # kubelet liveness/readiness probes originate from the node host. Linkerd
    # auto-authorized these; once an ingress rule makes the endpoint
    # default-deny, Cilium needs them allowed explicitly or the pod never goes
    # Ready. `health` covers the cilium-health checker.
    - fromEntities:
        - host
        - health
{{- end }}
{{- if .Values.web.enabled }}
---
# The backend ("web") is reachable by the frontend SSR pod (in-cluster, via
# API_BASE / CHAT_API_BASE) AND, for the public FaaS invocation surface only, by
# the Cloudflare/Envoy gateway (R1 Task 13). The gateway only ROUTES /functions/*
# to the backend (its own dedicated HTTPRoute; every other path goes to the
# frontend), and the backend mounts only public read-only routes
# (main_public_routes_test enforces it), so this L4 allow exposes nothing beyond
# the pre-vetted public functions. Replaces the allow-web-clients
# AuthorizationPolicy + the web-clients MeshTLSAuthentication (the frontend's
# own mesh identity).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-web-ingress
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "monolith-public.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  ingress:
    - fromEndpoints:
        - matchLabels:
            {{- include "monolith-public.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: frontend
      toPorts:
        - ports:
            - port: {{ .Values.web.containerPort | quote }}
              protocol: TCP
    # The Envoy gateway reaches the backend directly for /functions/<name> only
    # (Task 13): its HTTPRoute routes just that path prefix here, so no /api
    # traffic arrives from the gateway. Mirrors the frontend-ingress gateway rule.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: {{ .Values.web.containerPort | quote }}
              protocol: TCP
    - fromEntities:
        - host
        - health
{{- end }}
{{- end }}

{{- if .Values.ciliumPolicy.egress.enabled }}
{{- $scopedMode := .Values.ciliumPolicy.egress.scoped | default "off" }}
{{- if ne $scopedMode "enforce" }}
{{- if .Values.web.enabled }}
---
# Backend egress: default-deny OFF-cluster (replaces the namespace EgressNetwork
# deny) while allowing all in-cluster calls, plus the ONE sanctioned external
# host. The backend fans out in-cluster to Postgres RO (public_reader) and RW
# (public_writer), vLLM inference, embeddings, and SeaweedFS S3.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-web-egress
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "monolith-public.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  egress:
    # All in-cluster egress (Postgres RO/RW, vLLM inference, embeddings,
    # SeaweedFS S3) PLUS DNS, resolved at plain L4 through this same rule.
    # `cluster` covers pod endpoints; `host` + `remote-node` cover host-networked
    # in-cluster dependencies the `cluster` entity does not (the Linkerd
    # EgressNetwork only denied OFF-cluster, so node-local traffic must stay
    # allowed). Note: there is deliberately NO toFQDNs rule anywhere in this
    # policy, so Cilium does NOT redirect the backend's DNS through the L7 proxy.
    # That keeps kube-dns resolution off the cilium-agent DNS-proxy path (one
    # fewer dependency for every in-cluster lookup the pod makes) and matches the
    # frontend/imgproxy egress shape. The Turnstile allow below is IP-pinned
    # (toCIDRSet), which needs no DNS-proxy learning, so no L7 DNS rule is needed.
    - toEntities:
        - cluster
        - host
        - remote-node
    # THE ONE SANCTIONED OFF-CLUSTER EGRESS (ADR 005, Public Chat V3): Cloudflare
    # Turnstile siteverify (challenges.cloudflare.com) on 443. This is the only
    # external destination the public tier may reach; do not broaden the ports or
    # add other CIDRs. Pinned to Cloudflare's published IP ranges (toCIDRSet)
    # rather than a toFQDNs hostname match: Turnstile's DNS TTL is ~42s over a
    # large rotating anycast pool, and a toFQDNs allow only opens the exact IPs
    # the DNS proxy last observed for that TTL, so live siteverify connections
    # were intermittently policy-DROPPED and failed CLOSED -> 5xx. The CIDR set is
    # Cloudflare-only and stable; source of truth + provenance is the
    # ciliumPolicy.egress.turnstileCidrs list in chart/values.yaml.
    - toCIDRSet:
        {{- range .Values.ciliumPolicy.egress.turnstileCidrs }}
        - cidr: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- if .Values.frontend.enabled }}
---
# Frontend egress: default-deny OFF-cluster, allow all in-cluster for the backend
# call over API_BASE plus DNS. No off-cluster host is needed, so there is no
# toFQDNs and thus no DNS-proxy requirement: DNS resolves at L4 through the
# in-cluster allow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-frontend-egress
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "monolith-public.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  egress:
    - toEntities:
        - cluster
{{- end }}
{{- if .Values.imgproxy.enabled }}
---
# imgproxy egress: default-deny OFF-cluster (it only fetches sources from the
# in-cluster SeaweedFS S3 gateway), allow all in-cluster + DNS. Ingress is left
# unrestricted on purpose (no policy selects imgproxy for ingress), matching the
# current open posture where any meshed caller (including the private-tier
# grimoire reader on private.jomcgi.dev) may reach it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-imgproxy-egress
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "monolith-public.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: imgproxy
  egress:
    - toEntities:
        - cluster
        - host
        - remote-node
{{- end }}
{{- end }}
{{- end }}
