{{- if .Values.onepassword.itemPath }}
# Syncs the 1Password item (k8s-homelab/public-reader-db) into an Opaque
# Secret. The synced Secret name equals this metadata.name, which must match
# .Values.databaseSecretName so the Deployment's secretKeyRef resolves. The
# item carries a "uri" field with the full postgresql:// connection string,
# surfaced as the Secret's "uri" key.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.databaseSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.onepassword.itemPath | quote }}
{{- end }}
{{- if .Values.publicWriter.onepassword.itemPath }}
---
# Syncs the public_writer DB credential (ADR 005). The 1Password item
# (public-writer-db) carries a "uri" field with the full postgresql:// connection
# string to the PRIMARY monolith-pg-rw as the public_writer role (today: DML on
# the chat_public schema only). This is the app-facing URI secret consumed by
# PUBLIC_WRITER_DATABASE_URL; it is distinct from the CNPG basic-auth password
# secret monolith-pg-public-writer (created out-of-band in the monolith
# namespace, which CNPG uses to set the role password). Both derive from the same
# public_writer password, mirroring the public_reader pattern in
# projects/monolith/deploy/public-writer-secret.md.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.publicWriter.databaseSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.publicWriter.onepassword.itemPath | quote }}
{{- end }}
