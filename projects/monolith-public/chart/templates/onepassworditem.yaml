{{- if .Values.onepassword.itemPath }}
# Syncs the 1Password item (k8s-homelab/public-reader-db) into an Opaque
# Secret. The synced Secret name equals this metadata.name, which must match
# .Values.databaseSecretName so the Deployment's secretKeyRef resolves. The
# item carries a "uri" field with the full postgresql:// connection string,
# surfaced as the Secret's "uri" key.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.databaseSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.onepassword.itemPath | quote }}
{{- end }}
{{- if .Values.publicWriter.onepassword.itemPath }}
---
# Syncs the public_writer DB credential (ADR 005). The 1Password item
# (public-writer-db) carries a "uri" field with the full postgresql:// connection
# string to the PRIMARY monolith-pg-rw as the public_writer role (today: DML on
# the chat_public schema only). This is the app-facing URI secret consumed by
# PUBLIC_WRITER_DATABASE_URL; it is distinct from the CNPG basic-auth password
# secret monolith-pg-public-writer (created out-of-band in the monolith
# namespace, which CNPG uses to set the role password). Both derive from the same
# public_writer password, mirroring the public_reader pattern in
# projects/monolith/deploy/public-writer-secret.md.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.publicWriter.databaseSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.publicWriter.onepassword.itemPath | quote }}
{{- end }}
{{- if .Values.turnstile.onepassword.itemPath }}
---
# Syncs the Cloudflare Turnstile item (ADR 005 layer 1) into an Opaque Secret.
# The 1Password operator maps each field label to a Secret data key verbatim, so
# the fields SITE_KEY / SECRET_KEY / IP_HASH_SALT surface as Secret keys of the
# same names. The backend "web" component references SECRET_KEY (siteverify) and
# IP_HASH_SALT (ip_hash salt) via secretKeyRef; SITE_KEY is public and handed to
# the frontend as a plain literal instead, so the frontend never touches this
# Secret. The synced Secret name equals metadata.name (.Values.turnstile.secretName).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.turnstile.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.turnstile.onepassword.itemPath | quote }}
{{- end }}
{{- if .Values.demoPostgres.onepassword.itemPath }}
---
# Syncs the demo-postgres superuser password (EmberVM R4 ember postgres
# exhibit) into an Opaque Secret. SAME 1Password item the private monolith
# chart syncs (scratchPostgres.onepassword.itemPath), so both tiers connect to
# the ONE demo workload with the same password; a K8s Secret cannot be read
# cross-namespace/cross-release, so this chart syncs its own copy. The item's
# field must land as a Secret key named exactly POSTGRES_PASSWORD (mirroring
# the private chart's mapping). The synced Secret name equals metadata.name
# (.Values.demoPostgres.secretName).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.demoPostgres.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.demoPostgres.onepassword.itemPath | quote }}
{{- end }}
