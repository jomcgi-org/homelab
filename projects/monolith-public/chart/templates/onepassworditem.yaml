{{- if .Values.onepassword.itemPath }}
# Syncs the 1Password item (k8s-homelab/public-reader-db) into an Opaque
# Secret. The synced Secret name equals this metadata.name, which must match
# .Values.databaseSecretName so the Deployment's secretKeyRef resolves. The
# item carries a "uri" field with the full postgresql:// connection string,
# surfaced as the Secret's "uri" key.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.databaseSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.onepassword.itemPath | quote }}
{{- end }}
{{- if .Values.chatPublic.onepassword.itemPath }}
---
# Syncs the chat_public DB credential (ADR 005). The 1Password item carries a
# "uri" field with the full postgresql:// connection string to the PRIMARY
# monolith-pg-rw as the chat_public role (DML on the chat_public schema only).
# This is the app-facing URI secret consumed by CHAT_PUBLIC_DATABASE_URL; it is
# distinct from the CNPG basic-auth password secret monolith-pg-chat-public
# (created out-of-band in the monolith namespace, which CNPG uses to set the
# role password). Both derive from the same chat_public password, mirroring the
# public_reader pattern in projects/monolith/deploy/public-reader-secret.md.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.chatPublic.databaseSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.chatPublic.onepassword.itemPath | quote }}
{{- end }}
