# Linkerd-native network policy for the public service (ADR 004 Phase 5).
#
# The pods are meshed, so isolation is expressed with Linkerd's own policy CRDs
# rather than a Kubernetes NetworkPolicy (which would need the proxy's 4143
# inbound + control-plane egress allowances and is the footgun the cluster has
# repeatedly hit). This regains mTLS and topology observability for the public
# tier while still constraining who can reach it and where it can go.
#
# Phase 5d adds the public-only SvelteKit frontend ("frontend" component) as a
# second meshed pod. The gateway reaches two ports: the frontend (rendered
# pages) and the backend (direct /api/knowledge/public reads). The frontend SSR
# also calls the backend in-cluster over mTLS, so the backend authorizes both
# the gateway identity and the frontend's mesh identity.
#
# Namespace-wide controls (EgressNetwork, the shared gateway identity) are
# unconditional: their scope is the namespace, not any single component, so they
# must not be gated on a component's enabled flag.

# Default-deny all off-cluster egress for the namespace. The public tier only
# needs in-cluster Postgres (monolith-pg-ro), DNS, the in-cluster SigNoz
# collector, and frontend->backend, which are all cluster-network traffic and
# are not governed by EgressNetwork, so a compromised pod cannot reach the
# internet.
apiVersion: policy.linkerd.io/v1alpha1
kind: EgressNetwork
metadata:
  name: {{ include "monolith-public.fullname" . }}-deny-egress
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  trafficPolicy: Deny
---
# THE ONE SANCTIONED EGRESS WIDENING (ADR 005, Public Chat V3 Phase 2). REVIEW
# THIS CAREFULLY.
#
# Public chat verifies Cloudflare Turnstile tokens by calling siteverify
# (https://challenges.cloudflare.com/turnstile/v0/siteverify) from the backend.
# That is the FIRST and ONLY off-cluster egress from this otherwise default-deny
# namespace (the EgressNetwork above denies all external traffic). Without an
# explicit allow the siteverify call is BLOCKED and no session can ever be
# minted.
#
# The allow is a Gateway API TLSRoute (not HTTPRoute): the outbound call is TLS
# to an external host, so Linkerd matches it by the SNI hostname in the
# ClientHello. parentRefs binds it to the deny-all EgressNetwork; the single
# hostname + port 443 scope means this opens challenges.cloudflare.com and
# nothing else. An RCE in the public path still cannot reach any other internet
# host. The CRD is served at gateway.networking.k8s.io/v1alpha2 and is present in
# the cluster (tlsroutes.gateway.networking.k8s.io); Linkerd's policy controller
# has RBAC over tlsroutes (see the linkerd-control-plane destination-rbac).
#
# If this single host ever needs to change, this is the only rule to touch; do
# not broaden it to a wildcard.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "monolith-public.fullname" . }}-allow-turnstile-egress
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "monolith-public.fullname" . }}-deny-egress
      kind: EgressNetwork
      group: policy.linkerd.io
      namespace: {{ .Release.Namespace }}
      port: 443
  hostnames:
    - challenges.cloudflare.com
  rules:
    - backendRefs:
        - name: {{ include "monolith-public.fullname" . }}-deny-egress
          kind: EgressNetwork
          group: policy.linkerd.io
---
# The Cloudflare/Envoy gateway identity. We authorize by mesh identity using a
# wildcard over the gateway namespace's ServiceAccounts so the rule survives the
# envoy data-plane SA's hash-suffixed name. The gateway is meshed, so its proxy
# presents this identity over mTLS. Referenced by both component authorizations.
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: {{ include "monolith-public.fullname" . }}-gateway
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  identities:
    - "*.envoy-gateway-system.serviceaccount.identity.linkerd.cluster.local"
{{- if .Values.web.enabled }}
---
# A Server makes the backend app port deny-by-default: only traffic permitted by
# an AuthorizationPolicy below may reach it. Linkerd auto-authorizes the kubelet
# liveness/readiness probes declared on the pod, so /healthz keeps working.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: {{ include "monolith-public.fullname" . }}-web
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "monolith-public.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  port: {{ .Values.web.portName | default "http" }}
---
# The ONLY client allowed to reach the backend is the frontend SSR pod (which
# fetches data via API_BASE, both for +page.server.js renders and the
# /notes/body proxy). The gateway never reaches the backend directly: there is
# no /api ingress rule, so the public backend is not internet-reachable at all.
# The frontend shares this release's ServiceAccount, so its mesh identity is
# <serviceAccountName>.<namespace>.serviceaccount.identity.linkerd.cluster.local.
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: {{ include "monolith-public.fullname" . }}-web-clients
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  identities:
    - "{{ include "monolith-public.serviceAccountName" . }}.{{ .Release.Namespace }}.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-allow-web-clients
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: {{ include "monolith-public.fullname" . }}-web
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: {{ include "monolith-public.fullname" . }}-web-clients
{{- end }}
{{- if .Values.frontend.enabled }}
---
# A Server makes the frontend app port deny-by-default. Only the gateway reaches
# the frontend; the backend never calls it. Kubelet tcpSocket probes are
# auto-authorized by Linkerd.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: {{ include "monolith-public.fullname" . }}-frontend
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "monolith-public.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  port: {{ .Values.frontend.portName | default "http" }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-allow-gateway-frontend
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: {{ include "monolith-public.fullname" . }}-frontend
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: {{ include "monolith-public.fullname" . }}-gateway
{{- end }}
