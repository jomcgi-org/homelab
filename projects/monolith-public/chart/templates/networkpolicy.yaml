# Default-deny baseline plus the minimal allow rules the public tier needs:
# DNS, read-only Postgres egress to monolith-pg, and gateway ingress on 8000
# (for the Phase 5e HTTPRoute cutover). Kubelet health probes are node-local
# and bypass NetworkPolicy, so the liveness/readiness probes still work.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-allow-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Read-only Postgres: the CNPG cluster pods in the monolith namespace.
    # cnpg.io/cluster is the standard CNPG pod label; scoping to it (rather
    # than the whole namespace) keeps egress least-privilege.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monolith
          podSelector:
            matchLabels:
              cnpg.io/cluster: monolith-pg
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "monolith-public.fullname" . }}-allow-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith-public.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Envoy Gateway (Phase 5e HTTPRoute) reaches the public service on 8000.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8000
