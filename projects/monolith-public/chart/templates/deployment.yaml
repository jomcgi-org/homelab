{{- if .Values.otelEndpoint }}
{{- $_ := set .Values.web "env" (append .Values.web.env (dict "name" "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" "value" .Values.otelEndpoint)) }}
{{- end }}
{{- $web := include "homelab.deployment" (dict "context" . "component" "web") | fromYaml }}
{{- $webAnnotations := default (dict) $web.metadata.annotations }}
{{- $_ := set $webAnnotations "argocd.argoproj.io/sync-wave" "0" }}
{{- $_ := set $web.metadata "annotations" $webAnnotations }}
{{- toYaml $web }}
---
{{- range $env := .Values.frontend.env }}
{{- if eq $env.name "PUBLIC_MAINTENANCE_BANNER" }}
{{- $_ := set $env "value" $.Values.maintenanceBanner }}
{{- end }}
{{- end }}
{{- $frontend := include "homelab.deployment" (dict "context" . "component" "frontend") | fromYaml }}
{{- /* Wait for the read-only backend reader to be healthy before a frontend
can depend on it. Publication itself is the earlier PreSync Job. */ -}}
{{- $frontendAnnotations := default (dict) $frontend.metadata.annotations }}
{{- $_ := set $frontendAnnotations "argocd.argoproj.io/sync-wave" "1" }}
{{- $_ := set $frontend.metadata "annotations" $frontendAnnotations }}
{{- toYaml $frontend }}
