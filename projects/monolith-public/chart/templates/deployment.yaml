{{- if .Values.otelEndpoint }}
{{- $_ := set .Values.web "env" (append .Values.web.env (dict "name" "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" "value" .Values.otelEndpoint)) }}
{{- end }}
{{- include "homelab.deployment" (dict "context" . "component" "web") }}
---
{{- range $env := .Values.frontend.env }}
{{- if eq $env.name "PUBLIC_MAINTENANCE_BANNER" }}
{{- $_ := set $env "value" $.Values.maintenanceBanner }}
{{- end }}
{{- end }}
{{- include "homelab.deployment" (dict "context" . "component" "frontend") }}
