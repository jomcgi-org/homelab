# imgproxy: on-the-fly image resizing/optimization for trip photos, serving
# image BYTES (not a JSON API) from the monolith-trips SeaweedFS bucket. It is
# served same-origin under /img on the public hostname: the public HTTPRoute
# (httproute-public.yaml) forwards /img/ to this Service, and imgproxy runs with
# IMGPROXY_PATH_PREFIX=/img. The old img.jomcgi.dev Cloudflare-tunnel route is
# retired. The Deployment and Service are rendered from the homelab-library
# helpers (same as the web/frontend components), so it lives in the
# monolith-public namespace.
#
# Network isolation on the GKE hub remains successor work (#5276). The
# configured storage endpoint is not itself an enforced egress restriction.
#
# Security boundary: URLs are HMAC-signed (IMGPROXY_KEY/SALT synced from
# 1Password), so imgproxy only serves paths the frontend SSR signer produced;
# IMGPROXY_ALLOWED_SOURCES additionally locks every request to s3://monolith-trips/
# as defense in depth. Per the resource-sizing convention this sets a CPU request but NO
# CPU limit (image decode is bursty CPU-bound work; a limit only throttles it)
# and pins memory request == limit.
{{- include "homelab.deployment" (dict "context" . "component" "imgproxy") }}
