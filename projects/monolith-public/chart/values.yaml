# Read-only public service (ADR 004 Phase 5). Isolation via
# templates/cilium-policy.yaml (ADR platform/012). The SA token is mounted for
# the FaaS invocation router to authenticate to EmberVM (identity-only; the SA
# has no K8s RBAC, see serviceAccount below), and it connects to
# monolith-pg-ro as public_reader. The image tag is pinned by the Bazel
# helm_images_values pipeline at build time; do not set a digest here.
#
# The Deployment, Service, and ServiceAccount are rendered from the
# homelab-library templates (homelab.deployment / homelab.service /
# homelab.serviceaccount), which read config from the "web" component key.

nameOverride: ""
fullnameOverride: ""

imagePullSecret:
  enabled: false
imagePullSecrets: []

# Pod-level security: non-root 65532 with an fsGroup so the auto-mounted /tmp
# emptyDir is writable under readOnlyRootFilesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security: read-only root fs, no privilege escalation, drop all
# capabilities.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  # Mount the SA token: the public FaaS invocation router (Task 13) authenticates
  # to the in-cluster EmberVM control plane with this pod's SA token (EmberVM does
  # a TokenReview against its allow-list). This is an IDENTITY-ONLY token: the
  # monolith-public SA has ZERO Kubernetes RBAC (no Role/ClusterRoleBindings), so
  # the token grants no K8s API power, it only proves "I am monolith-public" to
  # EmberVM (which the /functions surface already trusts, quota-capped). A
  # per-component audience-scoped projected token is a hardening follow-up.
  automount: true
  annotations: {}
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Name of the Secret that the OnePasswordItem below syncs the public_reader DB
# credential into. The synced Secret name equals the OnePasswordItem
# metadata.name, which must match the secretKeyRef in web.env below.
databaseSecretName: monolith-public-db

# 1Password sync. itemPath is set in deploy/values.yaml; left empty here so a
# bare `helm template` does not emit a OnePasswordItem with a null path.
onepassword:
  itemPath: ""

# public_writer DB credential (ADR 005, Public Chat V3 Phase 1). The generic
# public-tier WRITE identity on the Postgres PRIMARY (monolith-pg-rw), distinct
# from the read-only public_reader the rest of the public tier uses. Today it is
# the write path for the chat_public module; the naming is generic so future
# public-tier write paths can reuse it. databaseSecretName is the app-facing URI
# secret (key "uri"), synced from 1Password by the second OnePasswordItem (see
# onepassworditem.yaml); itemPath is set in deploy/values.yaml and left empty
# here so a bare `helm template` does not emit a OnePasswordItem with a null
# path. This URI secret is distinct from the CNPG basic-auth password secret
# monolith-pg-public-writer (created out-of-band in the monolith namespace; see
# projects/monolith/deploy/public-writer-secret.md).
publicWriter:
  databaseSecretName: monolith-public-writer-db
  onepassword:
    itemPath: ""

# Public chat (ADR 005 / V3 plan Phase 1). The chat_public module is composed
# into the public backend ("web"). It writes sessions + transcripts to the
# Postgres PRIMARY (monolith-pg-rw) via the public_writer role (see the
# publicWriter block above), distinct from the read-only public_reader the rest
# of the public tier uses. These are the Phase 0 starting budget values from the
# plan; they are also surfaced as CHAT_PUBLIC_* env on web.env below (Helm values
# cannot self-reference, so the two must stay in sync, this block is the
# documented source of truth). Grep the test tree before changing any of these
# (per CLAUDE.md).
chatPublic:
  # Per-message character cap on the user's single submitted message.
  charCap: 8000
  # Max conversational turns per session.
  maxTurns: 20
  # Max output tokens the model may emit in a single turn.
  maxOutputTokens: 4000
  # Max total tokens (in + out, accumulated) a single session may spend.
  maxSessionTokens: 32000
  # Session / cookie TTL in seconds (the SSR cookie maxAge mirrors this).
  sessionTtlSeconds: 1800
  # CLUSTER-WIDE ceiling: max in-flight public inference calls at once across ALL
  # replicas (ADR 005 layer 2+3). Enforced via Postgres advisory locks, not a
  # per-pod counter, so it holds as the backend scales out. vLLM max_num_seqs=8,
  # public is capped here at 2, leaving the rest for trusted callers (grimoire
  # extraction, Discord, private chat, agents). Mirrored as
  # CHAT_PUBLIC_GLOBAL_MAX_CONCURRENT on web.env below.
  globalMaxConcurrent: 2
  # Turnstile siteverify HTTP timeout (seconds): keep short so a slow/unreachable
  # Cloudflare fails closed quickly. Mirrored as TURNSTILE_TIMEOUT_SECONDS below.
  turnstileTimeoutSeconds: 5
  # Shared vLLM endpoint for public-chat inference (ADR 005 layer 6 / V3 Phase 3).
  # In-cluster OpenAI-compatible service DNS on the vLLM HTTP port; the backend
  # streams text-only turns from here (NO tools). This is a plain values literal
  # (an in-cluster service URL, not a secret), mirrored as CHAT_PUBLIC_INFERENCE_URL
  # on web.env below. The inference pods are unmeshed and in-cluster, so the public
  # EgressNetwork off-cluster deny does not block this.
  inferenceUrl: "http://inference.inference.svc.cluster.local:8080"
  # Public-graph retrieval (ADR 005 layer 5 / V3 Phase 4a). The turn is grounded
  # on public notes only by embedding the live query and cosine-searching the
  # public_api.knowledge_chunks view as public_reader. Confinement is the view, not
  # a prompt rule. Mirrored as the env on web.env below (Helm cannot self-reference).
  # In-cluster embeddings endpoint (voyage-4-nano via llama.cpp). Plain values
  # literal (in-cluster service URL, not a secret); unmeshed + in-cluster, so the
  # public off-cluster EgressNetwork deny does not block it. Mirrored as EMBEDDING_URL.
  embeddingUrl: "http://inference-embeddings.inference.svc.cluster.local:8080"
  # How many distinct public notes a turn grounds on (the overlay's touched set).
  # Mirrored as CHAT_PUBLIC_RETRIEVAL_K below.
  retrievalK: 6
  # Compaction knobs (ADR 005 layer 4 / V3 Phase 3): when the live context
  # (system prompt + rolling summary + recent turns) approaches a fraction of the
  # model window, older turns are folded into the session rolling summary so each
  # request stays bounded. Mirrored as the CHAT_PUBLIC_* env on web.env below.
  # Usable context window of the shared model, in tokens (compaction is sized as a
  # fraction of this; keep at or below the real vLLM context length).
  modelWindowTokens: 32768
  # Fraction of the model window at which compaction triggers.
  compactionTrigger: 0.70
  # How many most-recent transcript messages are kept verbatim after a compaction
  # (everything older is folded into the rolling summary). ~3 turns.
  compactionKeepMessages: 6
  # Max tokens the rolling-summary generation may emit (a summary is short and
  # spends GPU under the same in-flight slot as a turn, so cap it tightly).
  summaryMaxTokens: 512

# Cloudflare Turnstile admission (ADR 005 layer 1). The SECRET is backend-only:
# siteverify runs in the "web" FastAPI binary, so TURNSTILE_SECRET_KEY (and the
# IP-hash salt) are sourced via secretKeyRef from the OnePasswordItem synced
# below; the frontend MUST NEVER reference this secret. The site KEY is public by
# design (it only identifies the widget), so it is a plain values literal handed
# to the frontend as TURNSTILE_SITE_KEY, not a secretKeyRef. onepassword.itemPath
# is set in deploy/values.yaml and left empty here so a bare `helm template` does
# not emit a OnePasswordItem with a null path.
turnstile:
  # Public Turnstile site key. SSOT for frontend.env TURNSTILE_SITE_KEY below
  # (Helm values cannot self-reference, so the literal is repeated there).
  siteKey: "0x4AAAAAADm59tvOGWo09IYc"
  # Name of the Opaque Secret the OnePasswordItem syncs the Turnstile fields into
  # (keys SITE_KEY / SECRET_KEY / IP_HASH_SALT, mapped from the 1Password field
  # labels). Backend secretKeyRefs in web.env reference this name.
  secretName: monolith-public-turnstile
  onepassword:
    itemPath: ""

# Demo-postgres DSN password (the ember postgres exhibit's scale-to-zero VM,
# EmberVM R4). SAME 1Password item the private monolith chart syncs
# (scratchPostgres.onepassword.itemPath there), so both tiers connect to the
# ONE demo workload with the same superuser password; a K8s Secret cannot be
# read cross-namespace/cross-release, so this chart syncs its own copy into the
# monolith-public namespace. The password surfaces as Secret key
# POSTGRES_PASSWORD (mirroring the private chart's field mapping); web.env
# below builds DEMO_POSTGRES_DSN from it via $(DEMO_PG_PASSWORD) kubelet
# substitution. onepassword.itemPath is set in deploy/values.yaml and left
# empty here so a bare `helm template` does not emit a OnePasswordItem with a
# null path.
demoPostgres:
  secretName: monolith-public-demo-postgres
  onepassword:
    itemPath: ""

# imgproxy URL signing (trip images). imgproxy validates an HMAC-SHA256 signature
# on every /img request; only URLs the SSR signer (frontend
# lib/server/trips-img.js) produces are accepted, so the unsigned /unsafe/ path is
# retired. The KEY and SALT are hex-encoded random bytes synced from the
# trips-imgproxy-signing 1Password item into an Opaque Secret (keys IMGPROXY_KEY /
# IMGPROXY_SALT, mapped from the field labels). BOTH the imgproxy component (to
# verify) and the frontend SSR component (to sign) reference this Secret via
# secretKeyRef; the secret MUST NEVER be handed to the browser. onepassword.itemPath
# is set in deploy/values.yaml and left empty here so a bare `helm template` does
# not emit a OnePasswordItem with a null path.
imgproxySigning:
  # Name of the Opaque Secret the OnePasswordItem syncs the signing fields into.
  # Backend (imgproxy) and frontend secretKeyRefs reference this name.
  secretName: monolith-public-imgproxy-signing
  onepassword:
    itemPath: ""

# "web" component consumed by the homelab-library deployment/service helpers.
web:
  enabled: true
  replicas: 1
  # Disruption budget: maxUnavailable (not minAvailable) so a node drain can
  # evict-and-reschedule at the 1-replica floor; caps disruption to 1 at a time
  # once the HPA has scaled out.
  pdb:
    enabled: true
    maxUnavailable: 1
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/public-backend
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8000
  portName: http
  # Inbound and egress isolation is expressed via templates/cilium-policy.yaml
  # (ADR platform/012).
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
  # DATABASE_URL is the read-only public_reader credential on monolith-pg-ro,
  # synced from 1Password. PUBLIC_WRITER_DATABASE_URL is the public_writer WRITE
  # credential on the primary monolith-pg-rw, a separate secret (ADR 005): the
  # chat module owns DML on the chat_public schema only. The secretKeyRef names
  # must match databaseSecretName / publicWriter.databaseSecretName above.
  # The CHAT_PUBLIC_* budget values mirror the chatPublic block above (Helm
  # values cannot self-reference, so they are repeated here as literals).
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: monolith-public-db
          key: uri
    # name must equal publicWriter.databaseSecretName above (values.yaml is not
    # re-templated, so this is a literal, like DATABASE_URL).
    - name: PUBLIC_WRITER_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: monolith-public-writer-db
          key: uri
    # EmberVM control-plane URL for the public FaaS invocation router
    # (jomcgi.dev/functions/<name>, R1 Task 13). In-cluster service URL literal
    # (NOT a secret, NOT a code default); the public tier submits to EmberVM as
    # its own allow-listed SA. In-cluster egress is permitted by the Cilium
    # policy. embervm_client raises (-> 502) if this is unset, so it must be here
    # explicitly: this chart uses the homelab-library deployment helper, which
    # does NOT derive EMBERVM_URL from semgrep.embervmUrl the way the monolith
    # chart does.
    - name: EMBERVM_URL
      value: "http://embervm-embervm.embervm.svc.cluster.local:8080"
    # fc-invoke URL for the public semgrep demo (ember_public router,
    # /api/ember/semgrep). In-cluster service URL literal (NOT a secret, NOT a
    # code default); semgrep_scan.client raises if unset. The public tier calls
    # fc-invoke as its own allow-listed SA (system:serviceaccount:monolith-public
    # :monolith-public), admitted by the fc-invoke daemon's TokenReview gate and
    # its CiliumNetworkPolicy fromNamespaces list. In-cluster egress is permitted
    # by this chart's Cilium policy (cluster entity). This chart uses the
    # homelab-library deployment helper, which does NOT derive FC_INVOKE_URL from
    # semgrep.fcInvokeUrl the way the monolith chart does, so it is set here as a
    # literal.
    - name: FC_INVOKE_URL
      value: "http://fc-invoke.monolith.svc.cluster.local:8080"
    # Demo-postgres DSN (ember_public router, /api/ember/postgres): the SAME
    # serving Service, port, and password the private monolith chart uses for
    # scratchPostgres.demoListenPort (5401), so both tiers wake the ONE demo
    # VM. Host/port are an in-cluster literal (this chart's values.yaml is not
    # Helm-templated); the password comes from the demoPostgres-synced Secret
    # via DEMO_PG_PASSWORD, substituted by the kubelet at container start so
    # the secret never appears inline.
    - name: DEMO_PG_PASSWORD
      valueFrom:
        secretKeyRef:
          name: monolith-public-demo-postgres
          key: POSTGRES_PASSWORD
    - name: DEMO_POSTGRES_DSN
      value: "postgresql://postgres:$(DEMO_PG_PASSWORD)@embervm-embervm-serving.embervm.svc:5401/scratch"
    # Global semaphore around the demo-postgres query roundtrip
    # (ember_public/core.py try_acquire_query_slot), same value as intended
    # for the private tier's env (unset there, falls back to this default).
    - name: EMBER_DEMO_MAX_CONCURRENT
      value: "4"
    - name: CHAT_PUBLIC_CHAR_CAP
      value: "8000"
    - name: CHAT_PUBLIC_MAX_TURNS
      value: "20"
    - name: CHAT_PUBLIC_MAX_OUTPUT_TOKENS
      value: "4000"
    - name: CHAT_PUBLIC_MAX_SESSION_TOKENS
      value: "32000"
    - name: CHAT_PUBLIC_SESSION_TTL_SECONDS
      value: "1800"
    # CLUSTER-WIDE cap on concurrent public inference calls (not per-pod): the
    # limiter is enforced via Postgres advisory locks, so this is the aggregate
    # ceiling across ALL replicas. vLLM max_num_seqs=8; public is capped at 2,
    # leaving the rest for trusted callers (grimoire, Discord, private, agents).
    - name: CHAT_PUBLIC_GLOBAL_MAX_CONCURRENT
      value: "2"
    # Shared vLLM endpoint for public-chat inference (ADR 005 layer 6 / Phase 3).
    # In-cluster service URL literal (NOT a secret); mirrors chatPublic.inferenceUrl
    # above (Helm values cannot self-reference). The backend refuses to call
    # inference if this is unset (no hardcoded service URL in code).
    - name: CHAT_PUBLIC_INFERENCE_URL
      value: "http://inference.inference.svc.cluster.local:8080"
    # Public-graph retrieval (ADR 005 layer 5 / Phase 4a). EMBEDDING_URL is the
    # in-cluster embeddings endpoint the retrieval path embeds the live query
    # against; CHAT_PUBLIC_RETRIEVAL_K is the number of distinct public notes a
    # turn grounds on. Both mirror the chatPublic block above (Helm values cannot
    # self-reference). EMBEDDING_URL is an in-cluster service URL literal, NOT a
    # code default and NOT a secret; the endpoint is unmeshed + in-cluster so the
    # public EgressNetwork off-cluster deny does not block it.
    - name: EMBEDDING_URL
      value: "http://inference-embeddings.inference.svc.cluster.local:8080"
    - name: CHAT_PUBLIC_RETRIEVAL_K
      value: "6"
    # Compaction knobs (ADR 005 layer 4 / Phase 3). Mirror the chatPublic block
    # above (Helm values cannot self-reference, so they are repeated as literals).
    - name: CHAT_PUBLIC_MODEL_WINDOW_TOKENS
      value: "32768"
    - name: CHAT_PUBLIC_COMPACTION_TRIGGER
      value: "0.70"
    - name: CHAT_PUBLIC_COMPACTION_KEEP_MESSAGES
      value: "6"
    - name: CHAT_PUBLIC_SUMMARY_MAX_TOKENS
      value: "512"
    # Turnstile siteverify (ADR 005 layer 1): the SECRET is backend-only. Sourced
    # via secretKeyRef from the monolith-public-turnstile Secret (key SECRET_KEY),
    # synced from the cloudflare-turnstile 1Password item. Never in the frontend.
    - name: TURNSTILE_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: monolith-public-turnstile
          key: SECRET_KEY
    - name: TURNSTILE_TIMEOUT_SECONDS
      value: "5"
    # Salt mixed into the stored ip_hash so it is not a bare sha256 of a guessable
    # IP. Backend-only, from the same Turnstile 1Password item (key IP_HASH_SALT).
    - name: CHAT_PUBLIC_IP_HASH_SALT
      valueFrom:
        secretKeyRef:
          name: monolith-public-turnstile
          key: IP_HASH_SALT
    # goosecracker artifact read path (ADR 024). The public backend reads the
    # agent-built HTML from the shared SeaweedFS S3 gateway (in-cluster, so the
    # public off-cluster EgressNetwork deny does not block it) and the SSR
    # frontend proxies /artifact/<id>/raw + /version to it. Read-only: the write
    # router is not mounted on the public binary. Creds are the cluster's dummy
    # S3 identity (auth disabled); literals, not secrets. ARTIFACTS_S3_BUCKET must
    # match the full monolith's artifact.bucket (where the write lands).
    - name: SEAWEEDFS_S3_ENDPOINT
      value: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
    - name: S3_ACCESS_KEY_ID
      value: "duckdb"
    - name: S3_SECRET_ACCESS_KEY
      value: "duckdb"
    # The stars read API serves the compact snapshot written by the Argo
    # stars-refresh workflow, rather than hydrating stars.site_hours here.
    - name: STARS_GRID_S3_BUCKET
      value: "stars"
    - name: STARS_SITES_S3_KEY
      value: "sites.json"
    - name: STARS_MAP_S3_KEY
      value: "map.json"
    - name: ARTIFACTS_S3_BUCKET
      value: "artifacts"
  # CPU request is sized so the HPA's per-container CPU utilization is a
  # meaningful signal (idle is ~1m). No CPU limit: let it burst (the HPA scales
  # out on sustained CPU rather than throttling).
  # Memory request == limit (was 160/384) per the sizing convention: req<limit
  # risks an overcommit OOM-kill below the limit under node memory pressure. 384
  # is ~1.6x the 7-day working-set peak of 238Mi (SigNoz k8s.pod.memory.working_set).
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 384Mi
  service:
    type: ClusterIP
    port: 8000
  # HPA (CPU-based, since memory is sticky for Python and would never scale
  # down). The GPU reservation is now enforced by a CLUSTER-WIDE limiter
  # (CHAT_PUBLIC_GLOBAL_MAX_CONCURRENT above, via Postgres advisory locks), NOT
  # by pinning replicas, so the backend can scale out for the cheap cached read
  # path while public inference stays capped in aggregate. The reservation
  # sizing rule is
  #   GLOBAL_MAX_CONCURRENT (cluster-wide) + reserved_trusted <= vLLM max_num_seqs
  # i.e. 2 + 1 <= 3, reserving 1 of the 3 decode slots for the Discord bot,
  # private /explore chat, and the agent platform so a public flood can never
  # starve a trusted caller regardless of how many replicas are running. Phase
  # 6's load test tunes GLOBAL_MAX_CONCURRENT / maxReplicas / reserved against
  # real traffic.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

# "frontend" component (ADR 004 Phase 5d): the public-only SvelteKit SSR
# renderer, built from the private-route-free source tree. It is a separate
# meshed pod that server-renders the public pages and calls the backend "web"
# component over in-cluster mTLS via API_BASE. Its only secret is the imgproxy
# URL signing key (IMGPROXY_KEY/SALT below): the SSR signer pre-signs /img URLs
# server-side so the secret never reaches the browser.
frontend:
  enabled: true
  replicas: 1
  # Disruption budget (see web.pdb): maxUnavailable so drains work at 1 replica.
  pdb:
    enabled: true
    maxUnavailable: 1
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/public-frontend
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3000
  portName: http
  # Inbound restriction to the gateway identity is expressed via
  # templates/cilium-policy.yaml.
  # The SSR Node server has no HTTP health endpoint, so probe the TCP port.
  probes:
    liveness:
      tcpSocket: true
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      tcpSocket: true
      initialDelaySeconds: 3
      periodSeconds: 5
  # API_BASE points at the backend "web" Service (in-cluster).
  # OTEL_COLLECTOR_HTTP_URL lets the same-origin /otel proxy forward browser
  # traces to the in-cluster SigNoz collector (cross-namespace, in-cluster, so
  # the EgressNetwork off-cluster deny does not apply). IMGPROXY_KEY/SALT are the
  # only secrets: the SSR signer (lib/server/trips-img.js) reads them via
  # $env/dynamic/private to sign /img URLs server-side and they never reach the
  # browser ($lib/server is never client-bundled).
  env:
    - name: API_BASE
      value: "http://monolith-public-web:8000"
    # CHAT_API_BASE is the same backend Service; the public chat SSR proxy
    # (/public/chat/session + /public/chat/message) calls the internal chat API
    # at this address over in-cluster mTLS (ADR 005, Phase 1).
    - name: CHAT_API_BASE
      value: "http://monolith-public-web:8000"
    # Public Turnstile site key for the SSR-rendered widget (ADR 005 layer 1).
    # PUBLIC by design (it only identifies the widget), so it is a plain literal,
    # NOT a secretKeyRef: the frontend must never reference the Turnstile secret.
    # Mirrors turnstile.siteKey above (Helm values cannot self-reference).
    - name: TURNSTILE_SITE_KEY
      value: "0x4AAAAAADm59tvOGWo09IYc"
    - name: OTEL_COLLECTOR_HTTP_URL
      value: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318"
    # imgproxy URL signing secret (hex-encoded KEY/SALT), synced from 1Password
    # via the imgproxy-signing OnePasswordItem. The SSR signer computes the same
    # HMAC the imgproxy component validates. secretKeyRef name must equal
    # imgproxySigning.secretName above (values.yaml is not re-templated, so this
    # is a literal, like DATABASE_URL / the Turnstile refs).
    - name: IMGPROXY_KEY
      valueFrom:
        secretKeyRef:
          name: monolith-public-imgproxy-signing
          key: IMGPROXY_KEY
    - name: IMGPROXY_SALT
      valueFrom:
        secretKeyRef:
          name: monolith-public-imgproxy-signing
          key: IMGPROXY_SALT
  # SSR Node: CPU request sized for a meaningful HPA signal (Node SSR is
  # CPU-bound under concurrent renders); no CPU limit.
  # Memory request == limit (was 128/512) per the sizing convention. 384 is ~1.6x
  # the 7-day working-set peak of 234Mi (SigNoz); the old 512 limit was overspec.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 384Mi
  service:
    type: ClusterIP
    port: 3000
  # HPA: steady moderate load sits ~30% on one pod; burst to 3 (CPU-based).
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

# "imgproxy" component consumed by the homelab-library deployment/service
# helpers. On-the-fly image resizing/optimization for trip photos, fetching
# sources from the monolith-trips SeaweedFS bucket and serving optimized image
# bytes same-origin under /img on the public hostname (the public HTTPRoute
# forwards /img/ here; IMGPROXY_PATH_PREFIX=/img strips the prefix internally).
# The old img.jomcgi.dev Cloudflare-tunnel route is retired. URLs are HMAC-signed
# (IMGPROXY_KEY/SALT): only paths the frontend SSR signer produces are served.
# Uses an UPSTREAM public image (darthsim/imgproxy), so the tag is a plain
# literal here and is NOT pinned by the Bazel helm_images_values pipeline (which
# only rewrites the Bazel-built web/frontend images). The pod inherits the
# chart's global non-root podSecurityContext/securityContext and the library's
# writable /tmp emptyDir, so no per-component security overrides are needed.
imgproxy:
  enabled: true
  # Additional hostnames the /img HTTPRoute answers on, beyond the public
  # hostname (same gateway). The private tier lists private.jomcgi.dev here so
  # the grimoire reader can load signed image URLs same-origin; Cloudflare
  # Access still fronts the private hostname at the edge.
  extraHostnames: []
  replicas: 2
  # Disruption budget (see web.pdb). imgproxy runs 2 replicas, so maxUnavailable:1
  # keeps one serving through a drain.
  pdb:
    enabled: true
    maxUnavailable: 1
  image:
    repository: darthsim/imgproxy
    tag: v3.25.0
    pullPolicy: IfNotPresent
  containerPort: 8080
  portName: http
  # IMGPROXY_PATH_PREFIX=/img moves EVERY route (including the health endpoint)
  # under /img, so the probes must hit /img/health, not the library default
  # /health (which now 404s and would crash-loop the pod on liveness failure).
  probes:
    liveness:
      path: /img/health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      path: /img/health
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 3
  env:
    - name: IMGPROXY_BIND
      value: ":8080"
    # Serve under /img so the public HTTPRoute can forward /img/ here without a
    # rewrite. imgproxy strips this prefix before parsing the processing path.
    # MUST match the IMG_BASE in
    # projects/monolith/frontend/src/lib/server/trips-img.js and the /img/
    # HTTPRoute rule in templates/httproute-public.yaml.
    - name: IMGPROXY_PATH_PREFIX
      value: "/img"
    - name: IMGPROXY_USE_S3
      value: "true"
    - name: IMGPROXY_S3_ENDPOINT
      value: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
    - name: IMGPROXY_S3_REGION
      value: "us-east-1"
    - name: AWS_ACCESS_KEY_ID
      value: "anonymous"
    - name: AWS_SECRET_ACCESS_KEY
      value: "anonymous"
    # Lock imgproxy to the trips bucket: it will only fetch sources under
    # s3://monolith-trips/, never other buckets or arbitrary URLs. Defense in
    # depth alongside URL signing (IMGPROXY_KEY/SALT below) and the preset
    # allow-list.
    - name: IMGPROXY_ALLOWED_SOURCES
      # monolith-trips: trip photos. docs-assets: first-party images referenced
      # by repo READMEs on the public docs site (uploaded out-of-band, keyed by
      # repo path; the docs renderer signs /full URLs for them, and SVG in ->
      # SVG out is a passthrough so the raster quality option is inert).
      # grimoire/books: sourcebook illustrations for the grimoire reader
      # (prefix-scoped to books/ so chunk manifests etc. stay unreachable).
      value: "s3://monolith-trips/,s3://docs-assets/,s3://grimoire/books/"
    # Signed-URL mode. With IMGPROXY_KEY/SALT set, imgproxy REQUIRES a valid
    # HMAC-SHA256 signature on every request (the unsigned /unsafe/ path is
    # rejected), so only URLs the SSR signer (frontend lib/server/trips-img.js)
    # produces are served. The KEY and SALT are hex-encoded secrets synced from
    # the trips-imgproxy-signing 1Password item; sourced via secretKeyRef, never
    # as a plaintext values literal, and the same secret the frontend signs with.
    - name: IMGPROXY_KEY
      valueFrom:
        secretKeyRef:
          name: monolith-public-imgproxy-signing
          key: IMGPROXY_KEY
    - name: IMGPROXY_SALT
      valueFrom:
        secretKeyRef:
          name: monolith-public-imgproxy-signing
          key: IMGPROXY_SALT
    # Named presets are the ONLY processing options allowed (ONLY_PRESETS below).
    # This caps imgproxy to the exact sizes the trips frontend requests instead
    # of serving arbitrary resizes of the bucket. The names here MUST match the
    # PRESETS set in projects/monolith/frontend/src/lib/trips/images.js.
    #
    # The quality:NN here is the OPERATIVE output quality: it overrides
    # IMGPROXY_FORMAT_QUALITY / IMGPROXY_QUALITY for the delivered format (verified
    # empirically: changing FORMAT_QUALITY left WebP bytes byte-for-byte unchanged,
    # while the preset quality drives them). So quality is tuned HERE, per size.
    # Lowered from 85/88/90/92/95: at these levels WebP is visually near
    # indistinguishable for photos while shipping meaningfully fewer bytes; the
    # large display/full presets stay a little higher since they are viewed big.
    #
    # format:webp is pinned on every preset so the delivered format does NOT
    # depend on the request's Accept header. This is deliberate: with runtime
    # WebP auto-negotiation, imgproxy sets Vary: Accept, and Cloudflare (non-
    # Enterprise) ignores Vary: Accept and caches a SINGLE variant per URL. A
    # non-WebP fetch (a link-preview bot, a crawler) could win the 1-year-
    # immutable cache slot and then serve the larger JPEG to every WebP-capable
    # browser for a year. Pinning WebP output makes each URL a single canonical
    # variant so the edge caches it unambiguously. WebP is universally supported
    # (Safari 14+), so dropping negotiation costs nothing here. See the retired
    # IMGPROXY_ENABLE_WEBP_DETECTION note below.
    - name: IMGPROXY_PRESETS
      value: "thumb=resize:fit:300:300/quality:78/format:webp,gallery=resize:fit:600:600/quality:80/format:webp,preview=resize:fit:1200:1200/quality:82/format:webp,display=resize:fit:1920:1080/quality:82/format:webp,full=quality:90/format:webp"
    # Reject any URL whose processing options are not one of the named presets
    # above. Combined with ALLOWED_SOURCES this is the resize allow-list.
    - name: IMGPROXY_ONLY_PRESETS
      value: "true"
    # Images are content-addressed (img_<sha256>.jpg), so a URL is immutable: a
    # changed photo gets a new key. Cache for a year (this is imgproxy's current
    # default; pin it so it survives any future default change).
    - name: IMGPROXY_TTL
      value: "31536000"
    # Fallback quality only: applies when a processing op carries no explicit
    # quality. Every preset above sets quality:NN, so in practice this is unused;
    # kept as a sane default. (IMGPROXY_FORMAT_QUALITY was removed: it is overridden
    # by the preset quality:NN, so it did nothing but mislead.)
    - name: IMGPROXY_QUALITY
      value: "82"
    # WebP auto-negotiation is intentionally NOT enabled. It makes the output
    # depend on Accept: image/webp, which forces a Vary: Accept response header;
    # Cloudflare (non-Enterprise) ignores Vary: Accept and pins one variant per
    # URL for the 1-year TTL, so a stray non-WebP fetch could cache-pin the
    # larger JPEG for every browser. Instead we pin format:webp in every preset
    # (see IMGPROXY_PRESETS above): output no longer depends on Accept, imgproxy
    # emits no Vary, and the edge caches one canonical WebP per URL.
    #
    # AVIF stays off for a second reason: at these quality levels imgproxy's AVIF
    # encode came out LARGER than WebP (gallery 37KB vs 28KB, display 186KB vs
    # 128KB) because AVIF's quality scale is far more aggressive (a "90" is near-
    # lossless). A net-win AVIF needs per-format quality (AVIF ~55-63 vs WebP ~80)
    # plus a visual-QA pass; tracked as a follow-up.
    - name: IMGPROXY_STRIP_METADATA
      value: "true"
    - name: IMGPROXY_MAX_SRC_RESOLUTION
      value: "50"
  # CPU request only (no limit): image decode is bursty CPU-bound work and a
  # limit would only throttle it. Memory request == limit per the sizing
  # convention (was 128/512, which violated it). 512 is ~1.4x the 7-day
  # working-set peak of 360Mi (SigNoz); transcodes are spiky (p99 only 132Mi),
  # so keep the higher ceiling here rather than trim to the peak.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080

# Public ingress (ADR 004 Phase 5e). Defaults off; enabled in deploy/values.yaml
# for the cutover of the public hostname to this service. The frontend serves
# pages (/_app/ + /), the backend serves /api.
cfIngress:
  public:
    enabled: false
    tier: public
    hostname: ""
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    rateLimit:
      requests: 100
      unit: Minute
    # Rate limit for the public FaaS invocation route (/functions/*, Task 13).
    # Envoy Local (per-gateway, shared across clients) coarse burst cap, layered
    # ON TOP of the EmberVM per-principal daily quota (the real abuse backstop).
    # og-image is low-volume (one fetch per social share),
    # so 120/min is generous; lower it if abuse appears.
    functionsRateLimit:
      requests: 120
      unit: Minute
    # Dedicated budget for the ember demo's cheap, wake-safe, server-cached
    # lifecycle reads (/ember/postgres/api/status + /savings), carved onto their
    # own HTTPRoute so their sub-second polling never shares (and exhausts) the
    # page's 100/min gateway-wide bucket. status is 500ms single-flight cached
    # and savings 30s cached, so a high poll rate is nearly free upstream; 600/min
    # gives comfortable headroom for concurrent viewers. Writes (/query, /session)
    # stay on the page limit above, backstopped by the backend gates + Turnstile.
    emberReadsRateLimit:
      requests: 600
      unit: Minute

# CiliumNetworkPolicy gates (ADR platform/012). templates/cilium-policy.yaml is
# the Cilium translation of the Linkerd policy chain; both gates default off so
# the template renders NOTHING until a deploy override flips one during the
# Cilium cutover. Split into two so ingress (who-can-reach-us) and egress
# (off-cluster deny + Turnstile allow) can be staged independently: ingress is
# meant to flip during the maintenance window, egress in a tested follow-up
# after Cilium is proven live. See projects/monolith-public/chart/templates/
# cilium-policy.yaml for the full rationale.
ciliumPolicy:
  ingress:
    enabled: false
  egress:
    enabled: false
    # Cloudflare's published IP ranges, the toCIDRSet allow for the ONE
    # sanctioned off-cluster egress from the backend "web" pod: Turnstile
    # siteverify (challenges.cloudflare.com) on port 443. Pinned as CIDRs rather
    # than a toFQDNs hostname match because Turnstile's ~42s DNS TTL over a
    # rotating anycast pool made the toFQDNs allow race and intermittently DROP
    # live connections, failing siteverify closed -> 5xx. Cloudflare-only, so the
    # off-cluster posture stays tight. Source of truth: https://www.cloudflare.com/ips-v4
    # and https://www.cloudflare.com/ips-v6 (last synced 2026-07-14; refresh here
    # if Cloudflare updates the ranges).
    turnstileCidrs:
      - "173.245.48.0/20"
      - "103.21.244.0/22"
      - "103.22.200.0/22"
      - "103.31.4.0/22"
      - "141.101.64.0/18"
      - "108.162.192.0/18"
      - "190.93.240.0/20"
      - "188.114.96.0/20"
      - "197.234.240.0/22"
      - "198.41.128.0/17"
      - "162.158.0.0/15"
      - "104.16.0.0/13"
      - "104.24.0.0/14"
      - "172.64.0.0/13"
      - "131.0.72.0/22"
      - "2400:cb00::/32"
      - "2606:4700::/32"
      - "2803:f800::/32"
      - "2405:b500::/32"
      - "2405:8100::/32"
      - "2a06:98c0::/29"
      - "2c0f:f248::/32"
