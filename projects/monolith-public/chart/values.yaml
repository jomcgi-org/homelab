# Read-only public service (ADR 004 Phase 5). Linkerd-meshed (isolation via
# Server/AuthorizationPolicy/EgressNetwork, see templates/linkerd-policy.yaml),
# no K8s API access (automountServiceAccountToken false), connects to
# monolith-pg-ro as public_reader. The image tag is pinned by the Bazel
# helm_images_values pipeline at build time; do not set a digest here.
#
# The Deployment, Service, and ServiceAccount are rendered from the
# homelab-library templates (homelab.deployment / homelab.service /
# homelab.serviceaccount), which read config from the "web" component key.

nameOverride: ""
fullnameOverride: ""

imagePullSecret:
  enabled: false
imagePullSecrets: []

# Pod-level security: non-root 65532 with an fsGroup so the auto-mounted /tmp
# emptyDir is writable under readOnlyRootFilesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security: read-only root fs, no privilege escalation, drop all
# capabilities.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  # The public pod needs no Kubernetes API access, so do not mount a token.
  automount: false
  annotations: {}
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Name of the Secret that the OnePasswordItem below syncs the public_reader DB
# credential into. The synced Secret name equals the OnePasswordItem
# metadata.name, which must match the secretKeyRef in web.env below.
databaseSecretName: monolith-public-db

# 1Password sync. itemPath is set in deploy/values.yaml; left empty here so a
# bare `helm template` does not emit a OnePasswordItem with a null path.
onepassword:
  itemPath: ""

# public_writer DB credential (ADR 005, Public Chat V3 Phase 1). The generic
# public-tier WRITE identity on the Postgres PRIMARY (monolith-pg-rw), distinct
# from the read-only public_reader the rest of the public tier uses. Today it is
# the write path for the chat_public module; the naming is generic so future
# public-tier write paths can reuse it. databaseSecretName is the app-facing URI
# secret (key "uri"), synced from 1Password by the second OnePasswordItem (see
# onepassworditem.yaml); itemPath is set in deploy/values.yaml and left empty
# here so a bare `helm template` does not emit a OnePasswordItem with a null
# path. This URI secret is distinct from the CNPG basic-auth password secret
# monolith-pg-public-writer (created out-of-band in the monolith namespace; see
# projects/monolith/deploy/public-writer-secret.md).
publicWriter:
  databaseSecretName: monolith-public-writer-db
  onepassword:
    itemPath: ""

# Public chat (ADR 005 / V3 plan Phase 1). The chat_public module is composed
# into the public backend ("web"). It writes sessions + transcripts to the
# Postgres PRIMARY (monolith-pg-rw) via the public_writer role (see the
# publicWriter block above), distinct from the read-only public_reader the rest
# of the public tier uses. These are the Phase 0 starting budget values from the
# plan; they are also surfaced as CHAT_PUBLIC_* env on web.env below (Helm values
# cannot self-reference, so the two must stay in sync, this block is the
# documented source of truth). Grep the test tree before changing any of these
# (per CLAUDE.md).
chatPublic:
  # Per-message character cap on the user's single submitted message.
  charCap: 8000
  # Max conversational turns per session.
  maxTurns: 20
  # Max output tokens the model may emit in a single turn.
  maxOutputTokens: 4000
  # Max total tokens (in + out, accumulated) a single session may spend.
  maxSessionTokens: 32000
  # Session / cookie TTL in seconds (the SSR cookie maxAge mirrors this).
  sessionTtlSeconds: 1800
  # CLUSTER-WIDE ceiling: max in-flight public inference calls at once across ALL
  # replicas (ADR 005 layer 2+3). Enforced via Postgres advisory locks, not a
  # per-pod counter, so it holds as the backend scales out. vLLM max_num_seqs=3,
  # reserve 1 slot for trusted callers, so public = 2. Mirrored as
  # CHAT_PUBLIC_GLOBAL_MAX_CONCURRENT on web.env below.
  globalMaxConcurrent: 2
  # Turnstile siteverify HTTP timeout (seconds): keep short so a slow/unreachable
  # Cloudflare fails closed quickly. Mirrored as TURNSTILE_TIMEOUT_SECONDS below.
  turnstileTimeoutSeconds: 5
  # Shared vLLM endpoint for public-chat inference (ADR 005 layer 6 / V3 Phase 3).
  # In-cluster OpenAI-compatible service DNS on the vLLM HTTP port; the backend
  # streams text-only turns from here (NO tools). This is a plain values literal
  # (an in-cluster service URL, not a secret), mirrored as CHAT_PUBLIC_INFERENCE_URL
  # on web.env below. The inference pods are unmeshed and in-cluster, so the public
  # EgressNetwork off-cluster deny does not block this.
  inferenceUrl: "http://inference.inference.svc.cluster.local:8080"
  # Public-graph retrieval (ADR 005 layer 5 / V3 Phase 4a). The turn is grounded
  # on public notes only by embedding the live query and cosine-searching the
  # public_api.knowledge_chunks view as public_reader. Confinement is the view, not
  # a prompt rule. Mirrored as the env on web.env below (Helm cannot self-reference).
  # In-cluster embeddings endpoint (voyage-4-nano via llama.cpp). Plain values
  # literal (in-cluster service URL, not a secret); unmeshed + in-cluster, so the
  # public off-cluster EgressNetwork deny does not block it. Mirrored as EMBEDDING_URL.
  embeddingUrl: "http://inference-embeddings.inference.svc.cluster.local:8080"
  # How many distinct public notes a turn grounds on (the overlay's touched set).
  # Mirrored as CHAT_PUBLIC_RETRIEVAL_K below.
  retrievalK: 6
  # Compaction knobs (ADR 005 layer 4 / V3 Phase 3): when the live context
  # (system prompt + rolling summary + recent turns) approaches a fraction of the
  # model window, older turns are folded into the session rolling summary so each
  # request stays bounded. Mirrored as the CHAT_PUBLIC_* env on web.env below.
  # Usable context window of the shared model, in tokens (compaction is sized as a
  # fraction of this; keep at or below the real vLLM context length).
  modelWindowTokens: 32768
  # Fraction of the model window at which compaction triggers.
  compactionTrigger: 0.70
  # How many most-recent transcript messages are kept verbatim after a compaction
  # (everything older is folded into the rolling summary). ~3 turns.
  compactionKeepMessages: 6
  # Max tokens the rolling-summary generation may emit (a summary is short and
  # spends GPU under the same in-flight slot as a turn, so cap it tightly).
  summaryMaxTokens: 512

# Cloudflare Turnstile admission (ADR 005 layer 1). The SECRET is backend-only:
# siteverify runs in the "web" FastAPI binary, so TURNSTILE_SECRET_KEY (and the
# IP-hash salt) are sourced via secretKeyRef from the OnePasswordItem synced
# below; the frontend MUST NEVER reference this secret. The site KEY is public by
# design (it only identifies the widget), so it is a plain values literal handed
# to the frontend as TURNSTILE_SITE_KEY, not a secretKeyRef. onepassword.itemPath
# is set in deploy/values.yaml and left empty here so a bare `helm template` does
# not emit a OnePasswordItem with a null path.
turnstile:
  # Public Turnstile site key. SSOT for frontend.env TURNSTILE_SITE_KEY below
  # (Helm values cannot self-reference, so the literal is repeated there).
  siteKey: "0x4AAAAAADm59tvOGWo09IYc"
  # Name of the Opaque Secret the OnePasswordItem syncs the Turnstile fields into
  # (keys SITE_KEY / SECRET_KEY / IP_HASH_SALT, mapped from the 1Password field
  # labels). Backend secretKeyRefs in web.env reference this name.
  secretName: monolith-public-turnstile
  onepassword:
    itemPath: ""

# "web" component consumed by the homelab-library deployment/service helpers.
web:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/public-backend
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8000
  portName: http
  # Meshed (ADR 004 Phase 5): the pod joins the Linkerd mesh so inbound is
  # restricted by a native AuthorizationPolicy (only the gateway identity may
  # call it) and off-cluster egress is denied by an EgressNetwork. See
  # templates/linkerd-policy.yaml.
  podAnnotations:
    linkerd.io/inject: enabled
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
  # DATABASE_URL is the read-only public_reader credential on monolith-pg-ro,
  # synced from 1Password. PUBLIC_WRITER_DATABASE_URL is the public_writer WRITE
  # credential on the primary monolith-pg-rw, a separate secret (ADR 005): the
  # chat module owns DML on the chat_public schema only. The secretKeyRef names
  # must match databaseSecretName / publicWriter.databaseSecretName above.
  # The CHAT_PUBLIC_* budget values mirror the chatPublic block above (Helm
  # values cannot self-reference, so they are repeated here as literals).
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: monolith-public-db
          key: uri
    # name must equal publicWriter.databaseSecretName above (values.yaml is not
    # re-templated, so this is a literal, like DATABASE_URL).
    - name: PUBLIC_WRITER_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: monolith-public-writer-db
          key: uri
    - name: CHAT_PUBLIC_CHAR_CAP
      value: "8000"
    - name: CHAT_PUBLIC_MAX_TURNS
      value: "20"
    - name: CHAT_PUBLIC_MAX_OUTPUT_TOKENS
      value: "4000"
    - name: CHAT_PUBLIC_MAX_SESSION_TOKENS
      value: "32000"
    - name: CHAT_PUBLIC_SESSION_TTL_SECONDS
      value: "1800"
    # CLUSTER-WIDE cap on concurrent public inference calls (not per-pod): the
    # limiter is enforced via Postgres advisory locks, so this is the aggregate
    # ceiling across ALL replicas. vLLM max_num_seqs=3, reserve 1 slot for
    # trusted callers (Discord / private chat / agents), so public = 2.
    - name: CHAT_PUBLIC_GLOBAL_MAX_CONCURRENT
      value: "2"
    # Shared vLLM endpoint for public-chat inference (ADR 005 layer 6 / Phase 3).
    # In-cluster service URL literal (NOT a secret); mirrors chatPublic.inferenceUrl
    # above (Helm values cannot self-reference). The backend refuses to call
    # inference if this is unset (no hardcoded service URL in code).
    - name: CHAT_PUBLIC_INFERENCE_URL
      value: "http://inference.inference.svc.cluster.local:8080"
    # Public-graph retrieval (ADR 005 layer 5 / Phase 4a). EMBEDDING_URL is the
    # in-cluster embeddings endpoint the retrieval path embeds the live query
    # against; CHAT_PUBLIC_RETRIEVAL_K is the number of distinct public notes a
    # turn grounds on. Both mirror the chatPublic block above (Helm values cannot
    # self-reference). EMBEDDING_URL is an in-cluster service URL literal, NOT a
    # code default and NOT a secret; the endpoint is unmeshed + in-cluster so the
    # public EgressNetwork off-cluster deny does not block it.
    - name: EMBEDDING_URL
      value: "http://inference-embeddings.inference.svc.cluster.local:8080"
    - name: CHAT_PUBLIC_RETRIEVAL_K
      value: "6"
    # Compaction knobs (ADR 005 layer 4 / Phase 3). Mirror the chatPublic block
    # above (Helm values cannot self-reference, so they are repeated as literals).
    - name: CHAT_PUBLIC_MODEL_WINDOW_TOKENS
      value: "32768"
    - name: CHAT_PUBLIC_COMPACTION_TRIGGER
      value: "0.70"
    - name: CHAT_PUBLIC_COMPACTION_KEEP_MESSAGES
      value: "6"
    - name: CHAT_PUBLIC_SUMMARY_MAX_TOKENS
      value: "512"
    # Turnstile siteverify (ADR 005 layer 1): the SECRET is backend-only. Sourced
    # via secretKeyRef from the monolith-public-turnstile Secret (key SECRET_KEY),
    # synced from the cloudflare-turnstile 1Password item. Never in the frontend.
    - name: TURNSTILE_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: monolith-public-turnstile
          key: SECRET_KEY
    - name: TURNSTILE_TIMEOUT_SECONDS
      value: "5"
    # Salt mixed into the stored ip_hash so it is not a bare sha256 of a guessable
    # IP. Backend-only, from the same Turnstile 1Password item (key IP_HASH_SALT).
    - name: CHAT_PUBLIC_IP_HASH_SALT
      valueFrom:
        secretKeyRef:
          name: monolith-public-turnstile
          key: IP_HASH_SALT
  # CPU request is sized so the HPA's per-container CPU utilization is a
  # meaningful signal (idle is ~1m). Memory request covers the FastAPI baseline
  # (~110Mi idle: SQLModel + psycopg + pgvector + the knowledge internals); the
  # old 64Mi request was below actual. No CPU limit: let it burst (the HPA scales
  # out on sustained CPU rather than throttling).
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      memory: 384Mi
  service:
    type: ClusterIP
    port: 8000
  # HPA (CPU-based, since memory is sticky for Python and would never scale
  # down). The GPU reservation is now enforced by a CLUSTER-WIDE limiter
  # (CHAT_PUBLIC_GLOBAL_MAX_CONCURRENT above, via Postgres advisory locks), NOT
  # by pinning replicas, so the backend can scale out for the cheap cached read
  # path while public inference stays capped in aggregate. The reservation
  # sizing rule is
  #   GLOBAL_MAX_CONCURRENT (cluster-wide) + reserved_trusted <= vLLM max_num_seqs
  # i.e. 2 + 1 <= 3, reserving 1 of the 3 decode slots for the Discord bot,
  # private /explore chat, and the agent platform so a public flood can never
  # starve a trusted caller regardless of how many replicas are running. Phase
  # 6's load test tunes GLOBAL_MAX_CONCURRENT / maxReplicas / reserved against
  # real traffic.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

# "frontend" component (ADR 004 Phase 5d): the public-only SvelteKit SSR
# renderer, built from the private-route-free source tree. It is a separate
# meshed pod that server-renders the public pages and calls the backend "web"
# component over in-cluster mTLS via API_BASE. It carries no secrets.
frontend:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/public-frontend
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3000
  portName: http
  # Meshed: inherits the namespace's Linkerd injection. A native Server +
  # AuthorizationPolicy (templates/linkerd-policy.yaml) restricts inbound to the
  # gateway identity only.
  podAnnotations:
    linkerd.io/inject: enabled
  # The SSR Node server has no HTTP health endpoint, so probe the TCP port.
  # Linkerd auto-authorizes kubelet probes even with the deny-by-default Server.
  probes:
    liveness:
      tcpSocket: true
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      tcpSocket: true
      initialDelaySeconds: 3
      periodSeconds: 5
  # No secrets. API_BASE points at the backend "web" Service (in-cluster).
  # OTEL_COLLECTOR_HTTP_URL lets the same-origin /otel proxy forward browser
  # traces to the in-cluster SigNoz collector (cross-namespace, in-cluster, so
  # the EgressNetwork off-cluster deny does not apply).
  env:
    - name: API_BASE
      value: "http://monolith-public-web:8000"
    # CHAT_API_BASE is the same backend Service; the public chat SSR proxy
    # (/public/chat/session + /public/chat/message) calls the internal chat API
    # at this address over in-cluster mTLS (ADR 005, Phase 1).
    - name: CHAT_API_BASE
      value: "http://monolith-public-web:8000"
    # Public Turnstile site key for the SSR-rendered widget (ADR 005 layer 1).
    # PUBLIC by design (it only identifies the widget), so it is a plain literal,
    # NOT a secretKeyRef: the frontend must never reference the Turnstile secret.
    # Mirrors turnstile.siteKey above (Helm values cannot self-reference).
    - name: TURNSTILE_SITE_KEY
      value: "0x4AAAAAADm59tvOGWo09IYc"
    - name: OTEL_COLLECTOR_HTTP_URL
      value: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318"
  # SSR Node needs more headroom than the read-only backend. CPU request sized
  # for a meaningful HPA signal (Node SSR is CPU-bound under concurrent renders).
  # Memory request keeps headroom above the ~37Mi idle baseline for load spikes.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
    port: 3000
  # HPA: steady moderate load sits ~30% on one pod; burst to 3 (CPU-based).
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

# Public ingress (ADR 004 Phase 5e). Defaults off; enabled in deploy/values.yaml
# for the cutover of the public hostname to this service. The frontend serves
# pages (/_app/ + /), the backend serves /api.
cfIngress:
  public:
    enabled: false
    tier: public
    hostname: ""
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    rateLimit:
      requests: 100
      unit: Minute
