# Deploy image for the jomcgi.dev site: the built pages, wrangler.jsonc, and the
# pinned wrangler CLI from //projects/jomcgi-site/wrangler:layers. rules_js runs
# wrangler through a bash launcher with its own Node toolchain, so the image
# carries bash, busybox (the launcher's coreutils) and Node's C++ runtime.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - busybox
    - ca-certificates-bundle
    - libgcc
    - libstdc++
    # Chromium (site-check) initialises NSS for its first HTTPS page, and
    # NSS needs libsqlite3.so.0.
    - sqlite-libs

archs:
  - x86_64

entrypoint:
  command: /app/projects/jomcgi-site/wrangler/wrangler

work-dir: /app/site

environment:
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_SEND_ERROR_REPORTS: "false"

accounts:
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  groups:
    - groupname: nonroot
      gid: 65532
  run-as: 65532

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
