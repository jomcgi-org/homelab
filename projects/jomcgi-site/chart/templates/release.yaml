{{- /*
The deploy Job is an Argo CD Sync hook, and Argo CD does not diff hooks. This
ConfigMap carries the chart version, image digest, stage and edge settings.
A chart change, including a Job-only change, or a changed edge setting makes
the Application OutOfSync, so the next sync runs the enabled Jobs again.
*/}}
{{- if not (has .Values.stage (list "dev" "prod")) }}
{{- fail "stage must be dev or prod" }}
{{- end }}
{{- $args := (index .Values.workloads "jomcgi-site-deploy").args }}
{{- if ne (last $args) .Values.stage }}
{{- fail "the deploy Job's --env argument must match .Values.stage" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jomcgi-site-release
  annotations:
    # Publish intent before creating the recovery controller or either hook.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: jomcgi-site
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  chart: {{ .Chart.Version | quote }}
  stage: {{ .Values.stage | quote }}
  edgeApply: {{ .Values.edge.apply | quote }}
  edgeMode: {{ .Values.edge.mode | quote }}
  image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
