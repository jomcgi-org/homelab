{{- /*
The deploy and edge Jobs are Argo CD hooks, and Argo CD does not diff hooks.
This ConfigMap carries every value the hooks act on: the chart version, the
image digest, the stage, and the edge switches. A change to any of them, such
as edge.serveRoutes alone, makes the Application OutOfSync, so the next sync
runs the Jobs again.
*/}}
{{- if not (has .Values.stage (list "dev" "prod")) }}
{{- fail "stage must be dev or prod" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jomcgi-site-release
  labels:
    app.kubernetes.io/name: jomcgi-site
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  chart: {{ .Chart.Version | quote }}
  stage: {{ .Values.stage | quote }}
  edge: {{ .Values.edge.enabled | toString | quote }}
  serveRoutes: {{ .Values.edge.serveRoutes | toString | quote }}
  image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
