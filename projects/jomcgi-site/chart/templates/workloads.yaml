{{- /*
The deploy Job's STAGE (run.sh passes it to `wrangler deploy --env`) comes from
.Values.stage, so one value picks the stage, and CHART_VERSION labels each
deploy. The refresh CronJob runs the same command on a schedule with
MODE=refresh, so run.sh's release fence keeps it from replacing a newer
release (the Job runs MODE=sync). The edge Job joins the workloads only in prod (values.yaml `edge`),
with EDGE_SERVE_ROUTES from edge.serveRoutes.
*/}}
{{- if not (has .Values.stage (list "dev" "prod")) }}
{{- fail "stage must be dev or prod" }}
{{- end }}
{{- if not (kindIs "bool" .Values.edge.serveRoutes) }}
{{- fail "edge.serveRoutes must be true or false" }}
{{- end }}
{{- $deploy := index .Values.workloads "jomcgi-site-deploy" }}
{{- range $deploy.env }}
{{- if has .name (list "STAGE" "MODE" "CHART_VERSION") }}
{{- fail (printf "the deploy Job's %s comes from the chart; do not set it in env" .name) }}
{{- end }}
{{- end }}
{{- $base := deepCopy $deploy.env }}
{{- $release := list (dict "name" "STAGE" "value" .Values.stage) (dict "name" "CHART_VERSION" "value" .Chart.Version) }}
{{- $_ := set $deploy "env" (concat $base $release (list (dict "name" "MODE" "value" "sync"))) }}
{{- if .Values.refresh.enabled }}
{{- $refresh := deepCopy $deploy }}
{{- $_ := unset $refresh "hook" }}
{{- $_ := unset $refresh "backoffLimit" }}
{{- $_ := set $refresh "kind" "CronJob" }}
{{- $_ := set $refresh "schedule" .Values.refresh.schedule }}
{{- $_ := set $refresh "concurrencyPolicy" "Forbid" }}
{{- $_ := set $refresh "env" (concat $base $release (list (dict "name" "MODE" "value" "refresh"))) }}
{{- $_ := set .Values.workloads "jomcgi-site-refresh" $refresh }}
{{- end }}
{{- if .Values.edge.enabled }}
{{- if ne .Values.stage "prod" }}
{{- fail "edge.enabled is for the prod stage only: zone config is not per stage" }}
{{- end }}
{{- $edge := deepCopy .Values.edge.workload }}
{{- $env := append $edge.env (dict "name" "EDGE_SERVE_ROUTES" "value" (toString .Values.edge.serveRoutes)) }}
{{- $_ := set $edge "env" $env }}
{{- $_ := set .Values.workloads "jomcgi-site-edge" $edge }}
{{- end }}
{{ include "factory-library.all" . }}
