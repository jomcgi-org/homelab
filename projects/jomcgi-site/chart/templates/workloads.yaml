{{- if not (kindIs "bool" .Values.edge.apply) -}}
{{- fail "edge.apply must be a boolean" -}}
{{- end -}}
{{- if not (has .Values.edge.mode (list "apply" "restore")) -}}
{{- fail "edge.mode must be apply or restore" -}}
{{- end -}}
{{- if and (eq .Values.edge.mode "restore") (not .Values.edge.apply) -}}
{{- fail "edge.mode=restore requires edge.apply=true" -}}
{{- end -}}
{{- $ctx := deepCopy . -}}
{{- /* The edge template adds a fixed retained PVC and recovery controller to
the library's hardened pod. The ordinary workload loop handles deployment. */ -}}
{{- $_ := unset $ctx.Values.workloads "jomcgi-site-edge" -}}
{{ include "factory-library.all" $ctx }}
