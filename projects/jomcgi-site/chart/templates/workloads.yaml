{{- /*
The deploy Job's STAGE (run.sh passes it to `wrangler deploy --env`) comes from
.Values.stage, so one value picks the stage, and RELEASE (chart version and
image digest) labels each deploy. The refresh CronJob runs the same command on a schedule with
MODE=refresh, so run.sh's release fence keeps it from replacing a newer
release (the Job runs MODE=sync). The edge Job joins the workloads only in prod (values.yaml `edge`),
with EDGE_SERVE_ROUTES from edge.serveRoutes.
*/}}
{{- if not (has .Values.stage (list "dev" "prod")) }}
{{- fail "stage must be dev or prod" }}
{{- end }}
{{- /* Only the edge Job deletes the Worker's routes. Without it, routes from an
earlier sync could stay live while site-check is off (routes off below). */}}
{{- if and (eq .Values.stage "prod") (not .Values.edge.enabled) }}
{{- fail "the prod stage needs edge.enabled: only the edge Job removes the Worker's routes" }}
{{- end }}
{{- if not (kindIs "bool" .Values.edge.serveRoutes) }}
{{- fail "edge.serveRoutes must be true or false" }}
{{- end }}
{{- $deploy := index .Values.workloads "jomcgi-site-deploy" }}
{{- range $deploy.env }}
{{- if has .name (list "STAGE" "MODE" "RELEASE") }}
{{- fail (printf "the deploy Job's %s comes from the chart; do not set it in env" .name) }}
{{- end }}
{{- end }}
{{- $base := deepCopy $deploy.env }}
{{- $label := printf "chart %s image %s" .Chart.Version (trunc 12 (trimPrefix "sha256:" .Values.image.digest)) }}
{{- $release := list (dict "name" "STAGE" "value" .Values.stage) (dict "name" "RELEASE" "value" $label) }}
{{- $_ := set $deploy "env" (concat $base $release (list (dict "name" "MODE" "value" "sync"))) }}
{{- if .Values.refresh.enabled }}
{{- $refresh := deepCopy $deploy }}
{{- $_ := unset $refresh "hook" }}
{{- $_ := unset $refresh "backoffLimit" }}
{{- $_ := set $refresh "kind" "CronJob" }}
{{- $_ := set $refresh "schedule" .Values.refresh.schedule }}
{{- $_ := set $refresh "concurrencyPolicy" "Forbid" }}
{{- $_ := set $refresh "env" (concat $base $release (list (dict "name" "MODE" "value" "refresh"))) }}
{{- $_ := set .Values.workloads "jomcgi-site-refresh" $refresh }}
{{- end }}
{{- $check := index .Values.workloads "site-check" }}
{{- if $check.args }}
{{- fail "the site-check stage argument comes from .Values.stage; do not set args" }}
{{- end }}
{{- if $check.network.egress }}
{{- fail "site-check egress comes from .Values.stage; do not set egress" }}
{{- end }}
{{- $_ := set $check "args" (list .Values.stage) }}
{{- $host := ternary "next.jomcgi.dev" "jomcgi.dev" (eq .Values.stage "dev") }}
{{- $_ := set $check.network "egress" (list (dict "peer" "stage-site" "fqdn" $host "port" 443) (dict "peer" "map-tiles" "fqdn" "tiles.openfreemap.org" "port" 443) (dict "peer" "trip-photos" "fqdn" "factory-data.jomcgi.dev" "port" 443)) }}
{{- if .Values.edge.enabled }}
{{- if ne .Values.stage "prod" }}
{{- fail "edge.enabled is for the prod stage only: zone config is not per stage" }}
{{- end }}
{{- $edge := deepCopy .Values.edge.workload }}
{{- $env := append $edge.env (dict "name" "EDGE_SERVE_ROUTES" "value" (toString .Values.edge.serveRoutes)) }}
{{- $_ := set $edge "env" $env }}
{{- $_ := set .Values.workloads "jomcgi-site-edge" $edge }}
{{- end }}
{{- /* With routes off, the edge Job deletes every route and reads the zone back,
so the hub serves prod; it cannot match this release. */}}
{{- if and (eq .Values.stage "prod") (not .Values.edge.serveRoutes) }}
{{- $_ := unset .Values.workloads "site-check" }}
{{- end }}
{{ include "factory-library.all" . }}
