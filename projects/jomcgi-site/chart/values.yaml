# One release per stage. The deploy Job runs `wrangler deploy --env <stage>`
# against the Worker that wrangler.jsonc names for that stage (HOME-174).
image:
  repository: ghcr.io/jomcgi/homelab/projects/jomcgi-site
  digest: "" # CI supplies the content digest when packaging the chart.

# `dev` deploys Worker jomcgi-site-dev on next.jomcgi.dev; `prod` deploys
# Worker jomcgi-site, whose jomcgi.dev routes are edge/routes.json.
stage: dev

workloads:
  jomcgi-site-deploy:
    kind: Job
    # Runs on every sync; the release ConfigMap makes each new chart, image or
    # edge switch a sync.
    hook: Sync
    containerName: wrangler
    # A failed deploy is a failed sync; retrying once covers a transient API error.
    backoffLimit: 1
    # run.sh copies the site to /tmp, adds each section's data from R2, and
    # deploys the copy. templates/workloads.yaml adds STAGE from .Values.stage.
    command:
      - /bin/bash
      - /app/site/run.sh
    env:
      # wrangler keeps its cache and logs under HOME.
      - name: HOME
        value: /tmp
      - name: CLOUDFLARE_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: jomcgi-site-cloudflare
            key: api-token
      - name: CLOUDFLARE_ACCOUNT_ID
        valueFrom:
          secretKeyRef:
            name: jomcgi-site-cloudflare
            key: account-id
      # Read-only R2 token for the data snapshot (data/sources.json).
      - name: R2_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: jomcgi-site-r2-read
            key: access-key-id
      - name: R2_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: jomcgi-site-r2-read
            key: secret-access-key
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    writablePaths:
      # Trip snapshots are capped at 1 GiB of WebP. Reserve disk space for
      # the site copy, wrangler upload staging and HOME.
      - name: tmp
        mountPath: /tmp
        sizeLimit: 4Gi
    network:
      # The Cloudflare API and the R2 S3 endpoint are the only egress.
      # wrangler's npm update check times out against this policy and does
      # not fail the deploy.
      egress:
        - peer: cloudflare-api
          fqdn: api.cloudflare.com
          port: 443
        - peer: r2-read
          fqdn: 7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com
          port: 443

# The refresh CronJob runs the deploy Job's command on a schedule, so section
# data reaches the site within this interval of changing in R2 (HOME-209).
refresh:
  enabled: true
  schedule: "*/30 * * * *"

# The edge apply Job (HOME-192) makes zone jomcgi.dev's Workers routes and
# cache rules match edge/routes.json and edge/cache-rules.json, after the
# deploy Job. Zone config is not per stage, so only prod turns it on, and the
# chart refuses it in any other stage.
edge:
  enabled: false
  # false: the edge Job deletes every route of Worker jomcgi-site, so all
  # jomcgi.dev paths go back to the hub; cache rules still apply. The prod
  # Application turns it on in its own PR, so reverting that PR is the
  # rollback. The routes themselves are edge/routes.json, in the image.
  serveRoutes: false
  workload:
    kind: Job
    # PostSync runs after the deploy Job, so each route's Worker exists.
    hook: PostSync
    containerName: edge
    backoffLimit: 1
    command:
      - /app/projects/jomcgi-site/edge/apply
    env:
      - name: CLOUDFLARE_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: jomcgi-site-cloudflare
            key: api-token
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    writablePaths:
      - name: tmp
        mountPath: /tmp
        sizeLimit: 16Mi
    network:
      egress:
        - peer: cloudflare-api
          fqdn: api.cloudflare.com
          port: 443

secrets:
  ghcr-imagepull-secret:
    workload: jomcgi-site-deploy
    onePassword:
      itemPath: vaults/k8s-homelab/items/ghcr-read-permissions
      type: kubernetes.io/dockerconfigjson
  # Joe creates this item (HOME-174 "Inputs"): fields api-token and account-id.
  jomcgi-site-cloudflare:
    workload: jomcgi-site-deploy
    onePassword:
      itemPath: vaults/k8s-homelab/items/jomcgi-site-cloudflare
  # The read-only R2 token the hub and the Scotland connector already use for
  # the stars bucket; it reads the data snapshot's sources.
  jomcgi-site-r2-read:
    workload: jomcgi-site-deploy
    onePassword:
      itemPath: vaults/k8s-homelab/items/r2-s3-public-read

exceptions: []
