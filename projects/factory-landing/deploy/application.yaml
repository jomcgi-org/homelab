apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-landing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: ghcr.io/jomcgi/homelab/charts
    chart: factory-landing
    targetRevision: 0.49.12
    helm:
      releaseName: factory-landing
      valuesObject:
        # Joe's factory-edge OIDC subject: the akadmin user's Authentik uid
        # (HOME-440). It is an opaque ID and grants nothing by itself.
        joeAuthentikSubject: 4e21eb1303b14a44819c3cba8f4939d5ff1cf671a9ad456f31f24fe89335e2d8
  destination:
    server: https://kubernetes.default.svc
    namespace: factory-landing
  syncPolicy:
    automated:
      # HOME-363: retain the live Service and policy until software-factory adopts them.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
