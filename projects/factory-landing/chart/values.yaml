image:
  repository: ghcr.io/jomcgi/homelab/projects/factory-landing
  digest: "" # CI supplies the content digest when packaging the chart.
hostname: factory.jomcgi.dev
# templates/connector-status.yaml: the status Service and its ingress grant.
connector:
  namespace: factory
  matchLabels:
    app.kubernetes.io/name: factory-connector
    app.kubernetes.io/instance: factory
  statusPort: 8082

workloads:
  factory-landing:
    containerName: web
    replicas: 2
    env:
      - name: CONNECTOR_STATUS_URL
        value: http://factory-connector-status.factory.svc:8082/status
    ports:
      - name: http
        containerPort: 8080
    resources:
      requests:
        cpu: 10m
        # Each replica holds 63Mi (14-16 Nov).
        memory: 80Mi
      limits:
        memory: 128Mi
    readinessProbe:
      httpGet:
        path: /
        port: http
    livenessProbe:
      httpGet:
        path: /
        port: http
    service:
      ports:
        - name: http
          port: 8080
          targetPort: http
    network:
      ingress:
        - peer: edge
          port: 8080
      # Application egress reaches only the connector's status port.
      egress:
        - peer: connector
          port: 8082

secrets:
  ghcr-imagepull-secret:
    workload: factory-landing
    onePassword:
      itemPath: vaults/k8s-homelab/items/ghcr-read-permissions
      type: kubernetes.io/dockerconfigjson

exceptions:
  - workload: factory-landing
    default: network.defaultDeny
    reason: >-
      Preserve the existing policy during the HOME-69 migration. The factory
      cluster's kept default-deny CiliumClusterwideNetworkPolicy already enables
      deny in both directions and permits DNS; this service's only application
      egress is the connector status port. Remove this exception if deploying
      outside that baseline.
