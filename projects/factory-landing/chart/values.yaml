image:
  repository: ghcr.io/jomcgi/homelab/projects/factory-landing
  digest: "" # CI supplies the content digest when packaging the chart.
hostname: factory.jomcgi.dev

workloads:
  factory-landing:
    containerName: web
    replicas: 2
    ports:
      - name: http
        containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    readinessProbe:
      httpGet:
        path: /
        port: http
    livenessProbe:
      httpGet:
        path: /
        port: http
    service:
      ports:
        - name: http
          port: 8080
          targetPort: http
    network:
      ingress:
        - peer: edge
          port: 8080

secrets:
  ghcr-imagepull-secret:
    workload: factory-landing
    onePassword:
      itemPath: vaults/k8s-homelab/items/ghcr-read-permissions
      type: kubernetes.io/dockerconfigjson

exceptions:
  - workload: factory-landing
    default: network.defaultDeny
    reason: >-
      Preserve the existing policy during the HOME-69 migration. The factory
      cluster's kept default-deny CiliumClusterwideNetworkPolicy already enables
      deny in both directions and permits DNS; this service has no application
      egress. Remove this exception if deploying outside that baseline.
