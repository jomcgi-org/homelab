apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factory-landing
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: edge
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: factory-landing
          port: 8080
          weight: 1
