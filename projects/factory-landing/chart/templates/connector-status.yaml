# The landing app owns its private read path, including the Service and ingress
# grant in the connector namespace. Removing the landing release removes both.
apiVersion: v1
kind: Service
metadata:
  name: factory-connector-status
  namespace: {{ .Values.connector.namespace }}
spec:
  selector:
    {{- toYaml .Values.connector.matchLabels | nindent 4 }}
  ports:
    - name: status
      port: {{ .Values.connector.statusPort }}
      targetPort: {{ .Values.connector.statusPort }}
      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-landing-status
  namespace: {{ .Values.connector.namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- toYaml .Values.connector.matchLabels | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: factory-landing
      toPorts:
        - ports:
            - port: {{ .Values.connector.statusPort | quote }}
              protocol: TCP
