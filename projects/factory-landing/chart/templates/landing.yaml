apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-landing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-landing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: factory-landing
spec:
  selector:
    app.kubernetes.io/name: factory-landing
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factory-landing
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: edge
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: factory-landing
          port: 8080
          weight: 1
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-landing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: factory-landing
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: edge
            gateway.envoyproxy.io/owning-gateway-namespace: edge
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # No application egress; the cluster baseline permits DNS only.
