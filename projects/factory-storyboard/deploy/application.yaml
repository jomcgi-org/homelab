apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-storyboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/jomcgi/homelab/charts
    chart: factory-storyboard
    targetRevision: 0.12.5
    helm:
      releaseName: factory-storyboard
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: factory-storyboard-factory-public-s3
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
