image:
  repository: ghcr.io/jomcgi/homelab/projects/factory-storyboard
  digest: ""
buckets:
  - name: factory-public
    access: write
workloads:
  factory-storyboard:
    kind: CronJob
    schedule: "*/5 * * * *"
    concurrencyPolicy: Forbid
    backoffLimit: 0
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
    network:
      egress:
        - {peer: factory-db, port: 5432}
        - {peer: itsaplan-api, port: 3000}
    env:
      - {name: PUBLIC_PROJECT, value: HOME}
      - {name: ITSAPLAN_URL, value: "http://factory-itsaplan-api.factory.svc:3000"}
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_ACCESS_KEY_ID}
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_SECRET_ACCESS_KEY}
      - name: AWS_ENDPOINT_URL
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_ENDPOINT_URL}
      - name: AWS_REGION
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_REGION}
      - name: BUCKET
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: BUCKET}
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef: {name: factory-storyboard-db, key: DATABASE_URL}
      - name: ITSAPLAN_KEY
        valueFrom:
          secretKeyRef: {name: factory-storyboard-readers, key: ITSAPLAN_KEY}
      - name: READER_TOKEN
        valueFrom:
          secretKeyRef: {name: factory-storyboard-readers, key: READER_TOKEN}
      - name: APPROVED_HISTORY
        valueFrom:
          secretKeyRef: {name: factory-storyboard-readers, key: APPROVED_HISTORY}
  storyboard-task-reader:
    kind: Deployment
    replicas: 1
    args: [serve-tasks]
    ports: [{name: http, containerPort: 8080}]
    service:
      ports: [{name: http, port: 8080, targetPort: http}]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}
    network:
      egress:
        - {peer: kagent-controller, port: 8083}
    env:
      - name: READER_TOKEN
        valueFrom:
          secretKeyRef: {name: factory-storyboard-readers, key: READER_TOKEN}
      - name: OWNER_GRANTS
        valueFrom:
          secretKeyRef: {name: storyboard-owner-shares, key: OWNER_GRANTS}
      - name: UPSTREAM_BEARER
        valueFrom:
          secretKeyRef: {name: storyboard-owner-shares, key: UPSTREAM_BEARER}
secrets:
  storyboard-owner-shares:
    workload: storyboard-task-reader
    onePassword:
      itemPath: vaults/k8s-homelab/items/storyboard-owner-shares
  factory-storyboard-readers:
    workload: factory-storyboard
    onePassword:
      itemPath: vaults/k8s-homelab/items/factory-storyboard-readers
