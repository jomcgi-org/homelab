image:
  repository: ghcr.io/jomcgi/homelab/projects/factory-storyboard
  digest: ""
buckets:
  - name: factory-public
    access: write
workloads:
  factory-storyboard:
    kind: CronJob
    schedule: "*/5 * * * *"
    concurrencyPolicy: Forbid
    backoffLimit: 0
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
    # The root filesystem is read-only. Each cycle's gitleaks run reads one
    # file per text from a temporary directory here.
    writablePaths:
      - {name: tmp, mountPath: /tmp, sizeLimit: 256Mi}
    network:
      egress:
        - {peer: factory-db, port: 5432}
        - {peer: itsaplan-api, port: 3000}
    env:
      - {name: PUBLIC_PROJECT, value: HOME}
      - {name: ITSAPLAN_URL, value: "http://factory-itsaplan-api.factory.svc:3000"}
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_ACCESS_KEY_ID}
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_SECRET_ACCESS_KEY}
      - name: AWS_ENDPOINT_URL
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_ENDPOINT_URL}
      - name: AWS_REGION
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: AWS_REGION}
      - name: BUCKET
        valueFrom:
          secretKeyRef: {name: factory-storyboard-factory-public-s3, key: BUCKET}
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef: {name: factory-storyboard-db, key: DATABASE_URL}
      # The read-only HOME key of itsaplan agent factory-storyboard. The
      # factory chart's PostSync itsaplan bootstrap writes this Secret; this
      # chart only reads it. A cycle can run before the bootstrap, so the key
      # is optional: the pod starts without it and the publisher skips the
      # cycle.
      - name: ITSAPLAN_KEY
        valueFrom:
          secretKeyRef:
            name: factory-itsaplan-agent-factory-storyboard
            key: apiKey
            optional: true
