# ghcr pull credential for the private weave-hand images. Same 1Password item
# as the other namespaces' ghcr-imagepull-secret (the PAT reads weave-hand
# packages too).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
type: kubernetes.io/dockerconfigjson
metadata:
  name: ghcr-imagepull-secret
  namespace: loom
spec:
  itemPath: vaults/k8s-homelab/items/ghcr-read-permissions
