# The upstream loom chart has no imagePullSecrets support (weave-hand/loom#354),
# so the chart's ServiceAccount creation is disabled (serviceAccount.create=false
# in values.yaml) and this SA carries the pull secret instead. All loom pods,
# including the migrations hook Job, run as this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom
  namespace: loom
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-imagepull-secret
