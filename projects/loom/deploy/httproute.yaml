# Strip the private UI prefix; ui.apiBase keeps API calls under /app/loom.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loom-private
  namespace: loom
  labels:
    ingress-tier: trusted
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cloudflare-ingress
      namespace: envoy-gateway-system
  hostnames:
    - private.jomcgi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app/loom
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      # group/kind/weight are Gateway API defaults, spelled out so this
      # ServerSideApply Application never diffs against the defaulted live
      # object (the same trap context-forge-gateway pins with
      # ignoreDifferences).
      backendRefs:
        - group: ""
          kind: Service
          name: loom-query-api
          port: 8080
          weight: 1
---
# The slash makes the SPA's relative config.js and app.js resolve under loom.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loom-private-slash-redirect
  namespace: loom
  labels:
    ingress-tier: trusted
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cloudflare-ingress
      namespace: envoy-gateway-system
  hostnames:
    - private.jomcgi.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /app/loom
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /app/loom/
            statusCode: 301
---
# Match cf-ingress.security-policy without changing the upstream Loom chart.
# Only loom-private serves a backend; the slash route above only redirects.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: loom-private-cf-access
  namespace: loom
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: loom-private
  jwt:
    providers:
      - name: cloudflare-access
        issuer: https://jomcgi.cloudflareaccess.com
        remoteJWKS:
          # Spell out the Envoy default for ServerSideApply field ownership.
          cacheDuration: 300s
          uri: https://jomcgi.cloudflareaccess.com/cdn-cgi/access/certs
        extractFrom:
          headers:
            - name: Cf-Access-Jwt-Assertion
        claimToHeaders:
          - claim: email
            header: X-Auth-Email
