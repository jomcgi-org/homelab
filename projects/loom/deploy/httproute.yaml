# Strip the private UI prefix; ui.apiBase keeps API calls under /app/loom.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loom-private
  namespace: loom
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cloudflare-ingress
      namespace: envoy-gateway-system
  hostnames:
    - private.jomcgi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app/loom
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      # group/kind/weight are Gateway API defaults, spelled out so this
      # ServerSideApply Application never diffs against the defaulted live
      # object (the same trap context-forge-gateway pins with
      # ignoreDifferences).
      backendRefs:
        - group: ""
          kind: Service
          name: loom-query-api
          port: 8080
          weight: 1
---
# The slash makes the SPA's relative config.js and app.js resolve under loom.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loom-private-slash-redirect
  namespace: loom
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cloudflare-ingress
      namespace: envoy-gateway-system
  hostnames:
    - private.jomcgi.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /app/loom
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /app/loom/
            statusCode: 301
