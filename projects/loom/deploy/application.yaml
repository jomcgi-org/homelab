apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loom
  namespace: argocd
spec:
  project: default
  sources:
    # Upstream loom chart from the private weave-hand OCI registry (credential:
    # argocd-repo-cred.yaml). 0.0.0-edge is upstream's moving bleeding-edge
    # channel; the deployed app version is pinned by the immutable image tags in
    # values.yaml, so a chart re-publish only changes templates, not the binaries.
    - repoURL: ghcr.io/weave-hand/charts
      chart: loom
      targetRevision: 0.0.0-edge
      helm:
        releaseName: loom
        valueFiles:
          - $values/projects/loom/deploy/values.yaml
    # Git repo for environment-specific values
    - repoURL: https://github.com/jomcgi/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: loom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
