apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Bootstrap resources are applied by the home-cluster root app (not the loom
# Application) so the ArgoCD repo credential exists before the Application
# tries to pull the private OCI chart.
resources:
  - namespace.yaml
  - argocd-repo-cred.yaml
  - image-pull-secret.yaml
  - serviceaccount.yaml
  - httproute.yaml
  - application.yaml
