# loom deploy values (upstream chart: oci://ghcr.io/weave-hand/charts/loom).
#
# The upstream chart digest-pins images, but the pinned digests do not exist in
# the registry (weave-hand/loom#353), so digest is cleared and the immutable
# per-commit sha tags are pinned instead. Bump all three tags together to the
# same main-commit sha.

ingest:
  image:
    tag: sha-6797f45
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi

queryApi:
  image:
    tag: sha-6797f45
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi

# DataFusion serving engine (sidecar in the query-api pod).
engine:
  image:
    tag: sha-6797f45
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 1Gi

# The chart's SA has no imagePullSecrets support (weave-hand/loom#354); use the
# SA from serviceaccount.yaml, which carries ghcr-imagepull-secret.
serviceAccount:
  create: false
  name: loom

# onBoot instead of the default hook Job: ArgoCD maps helm post-install to a
# PostSync hook, which only runs once the app is Healthy, and the service pods
# need the schema to become healthy. Each pod migrates at startup; sqlx's
# advisory lock serialises concurrent migrators.
migrations:
  mode: onBoot

postgres:
  # Scale-to-zero external Postgres: the EmberVM R4 scratch-postgres datastore in
  # the embervm namespace (wakes on an inbound connection, banks when idle). Set
  # enabled=false to drop the bundled CNPG cluster (loom-pg); loom connects via
  # the loom-scratch-postgres Secret (OnePasswordItem sync, keys host/port/
  # username/password/dbname matching external.keys defaults). Loom's data is
  # disposable demo data, recreated by migrations.mode=onBoot on first connect
  # (which is itself what wakes the datastore).
  enabled: false
  external:
    existingSecret: loom-scratch-postgres

# Iceberg warehouse on the cluster SeaweedFS (s3://loom). The in-cluster S3
# gateway runs without identities (anonymous), so the referenced secret
# (s3-credentials.yaml) carries dummy keys purely to satisfy the chart's
# required secretKeyRef. Enabling S3 drops the local PVC and the ingest/
# query-api co-scheduling affinity; the previous loom-data PVC is retained by
# the chart and can be deleted once the switch is verified.
objectStore:
  s3:
    enabled: true
    bucket: loom
    endpoint: http://seaweedfs-s3.seaweedfs:8333
    region: us-east-1
    port: 8333
    credentialsSecret: loom-s3-credentials

# The UI rides private.jomcgi.dev/app/loom (httproute.yaml strips the prefix
# before query-api); the SPA needs the prefix on its API calls, mounted as a
# config.js override by the chart.
ui:
  apiBase: /app/loom

# Homelab convention: never combine K8s NetworkPolicies with the cluster's
# CNI-level policy enforcement (Cilium); the chart's default-deny
# NetworkPolicy would otherwise block control-plane egress the CNI already
# manages.
networkPolicy:
  enabled: false

# Transform workers are a not-yet-built Loom component (README: "transform service
# not built"); the upstream chart declares a worker Deployment but publishes no
# loom-worker image (ghcr.io/weave-hand/loom-worker is absent). Scale it to zero
# so it does not ImagePullBackOff. Re-enable when upstream ships the worker.
worker:
  replicas: 0
