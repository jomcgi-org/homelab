# ArgoCD repository credential for the private weave-hand OCI chart registry.
# The 1Password operator copies the CR's labels onto the generated Secret, so
# the argocd.argoproj.io/secret-type label lands on the Secret and ArgoCD picks
# it up as a Helm OCI repository (keys: name/url/type/enableOCI/username/
# password, all fields of the 1Password item).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: repo-weave-hand-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
spec:
  itemPath: vaults/k8s-homelab/items/argocd-repo-weave-hand-charts
