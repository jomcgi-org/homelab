{{- if .Values.toolRefresh.enabled }}
# Periodic Context Forge tool-catalog refresh.
#
# CF caches each gateway's tool catalog in its own Postgres and does NOT
# re-discover on its own: its auto-refresh runs inside the health-check loop and
# only fires after a healthy tick, but that loop speaks streamablehttp while the
# monolith gateway was registered as SSE, so last_seen never advanced and the
# auto-refresh never fired. The monolith now serves streamable HTTP at /mcp/;
# the registration (in CF's Postgres, updated by hand) must be STREAMABLEHTTP
# with http://<monolith svc>/mcp/. Keep this CronJob until the health tick is
# observed advancing last_seen against that registration; retiring it is #5035.
#
# This CronJob mints a short-lived admin JWT (JWT_SECRET_KEY + PLATFORM_ADMIN_EMAIL
# come from the context-forge secret, the same envFrom the gateway uses), looks
# up the target gateway id by name, and POSTs /gateways/{id}/tools/refresh. It
# reuses the gateway image, which already bundles mcpgateway + httpx.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-tool-refresh
  labels:
    {{- include "context-forge.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.toolRefresh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.toolRefresh.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            {{- include "context-forge.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: tool-refresh
              image: "{{ .Values.toolRefresh.image.repository }}:{{ .Values.toolRefresh.image.tag }}"
              imagePullPolicy: {{ .Values.toolRefresh.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: {{ .Values.secret.name }}
              env:
                - name: CF_GATEWAY_URL
                  value: "http://{{ .Release.Name }}-mcp-stack-mcpgateway:80"
                - name: CF_GATEWAY_NAME
                  value: {{ .Values.toolRefresh.gatewayName | quote }}
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TOKEN=$(python3 -m mcpgateway.utils.create_jwt_token -u "$PLATFORM_ADMIN_EMAIL" --admin -e 600 | tail -1)
                  export TOKEN
                  python3 - <<'PY'
                  import os, httpx
                  base = os.environ["CF_GATEWAY_URL"]
                  name = os.environ["CF_GATEWAY_NAME"]
                  headers = {"Authorization": "Bearer " + os.environ["TOKEN"]}
                  resp = httpx.get(f"{base}/gateways", headers=headers, timeout=30)
                  resp.raise_for_status()
                  body = resp.json()
                  # The API may return a bare list or wrap it; handle both.
                  items = body if isinstance(body, list) else body.get("data", body.get("gateways", []))
                  gid = next((g["id"] for g in items if g.get("name") == name), None)
                  if not gid:
                      raise SystemExit(f"gateway {name!r} not found among {len(items)} gateways")
                  # CF forwards this request's Authorization to the upstream MCP server,
                  # and the monolith 401s any bearer it cannot verify, so discovery fails
                  # with the CF-minted admin JWT. X-Upstream-Authorization overrides what
                  # the upstream sees and is honoured independently of the passthrough
                  # allowlist. The scheme is deliberately NOT Bearer: the monolith ignores
                  # a non-bearer scheme and treats discovery as anonymous, which is what it
                  # already permits. Swap in a real workload token once authentik service
                  # accounts land (#4943).
                  refresh_headers = dict(headers, **{"X-Upstream-Authorization": "Discovery anonymous"})
                  r = httpx.post(f"{base}/gateways/{gid}/tools/refresh", headers=refresh_headers, timeout=90)
                  print(name, r.status_code, r.text[:2000])
                  r.raise_for_status()
                  # A failed refresh answers 200 with success=false in the BODY, so checking
                  # the status alone reports green while the catalogue silently goes stale.
                  result = r.json()
                  if not result.get("success"):
                      raise SystemExit(f"refresh failed: {result.get('error')}")
                  # A tool whose description trips CF's XSS validator is dropped from the
                  # catalogue while the refresh still reports success overall.
                  invalid = result.get("validationErrors") or []
                  if invalid:
                      raise SystemExit(f"refresh dropped {len(invalid)} tool(s): {invalid}")
                  PY
              resources:
                {{- toYaml .Values.toolRefresh.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
