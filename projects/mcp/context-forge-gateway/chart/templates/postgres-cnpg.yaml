{{- /*
CloudNativePG cluster backing Context Forge, replacing the mcp-stack chart's
bundled postgres:17 Deployment.

CNPG generates the credentials into a <name>-app Secret whose keys (host,
port, dbname, user, password) are exactly the defaults mcp-stack's
postgres.external.*Key values expect, so the two compose with no key mapping.
The password is never committed.

The database holds gateway registrations, team membership, the tool catalogue
cache, and sso_providers. It does not hold issued API tokens or per-user
configuration. Registrations and sso_providers have previously been restored
by hand after rebuilds, so backups preserve that work and make this small
cluster the rehearsal candidate for the GKE recovery path.
*/}}
{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
  labels:
    {{- include "context-forge.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}
  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- with .Values.cnpg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    {{- with .Values.cnpg.bootstrap.recovery }}
    recovery:
      {{- toYaml . | nindent 6 }}
    {{- else }}
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
    {{- end }}
  {{- with .Values.cnpg.externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
  monitoring:
    enablePodMonitor: {{ .Values.cnpg.monitoring.enablePodMonitor }}
  {{- if .Values.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.cnpg.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ .Values.cnpg.backup.destinationPath | quote }}
      {{- with .Values.cnpg.backup.serverName }}
      serverName: {{ . | quote }}
      {{- end }}
      googleCredentials:
        applicationCredentials:
          name: {{ .Values.cnpg.backup.credentialsSecret }}
          key: service-account-key.json
      wal:
        compression: gzip
      data:
        compression: gzip
  {{- end }}
{{- if .Values.cnpg.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.cnpg.name }}-daily
  labels:
    {{- include "context-forge.labels" . | nindent 4 }}
spec:
  # CNPG cron format has a leading seconds field (6 fields).
  schedule: {{ .Values.cnpg.backup.scheduledBackup.cron | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ .Values.cnpg.name }}
{{- end }}
{{- end }}
