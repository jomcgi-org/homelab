{{- if and .Values.cnpg.enabled .Values.cnpg.backup.enabled }}
# The 1Password item must expose the service-account JSON under the exact field
# name service-account-key.json so the generated Opaque Secret matches CNPG's
# applicationCredentials key selector.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.cnpg.backup.credentialsSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "context-forge.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.cnpg.backup.onepassword.itemPath | quote }}
{{- end }}
