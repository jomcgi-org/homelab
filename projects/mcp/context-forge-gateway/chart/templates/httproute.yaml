{{- if .Values.httpRoute.enabled }}
{{- if .Values.httpRoute.rootMcp.enabled }}
{{- /*
RFC 9728 discovery for the ROOT /mcp endpoint, served by Envoy.

Context Forge implements protected-resource metadata ONLY per virtual server:
  /.well-known/oauth-protected-resource/mcp  -> 404 "Expected: .../servers/{id}/mcp"
  /.well-known/oauth-protected-resource      -> 404 "deprecated"
and the root /mcp 401 carries a bare `WWW-Authenticate: Bearer` with no
`resource_metadata` parameter. An MCP client therefore has no way to discover
the authorization server, and dead-ends on the 401 no matter how it is routed.

So Envoy supplies the two missing pieces: this document, and the pointer to it
(the ResponseHeaderModifier on the /mcp rule below). Context Forge still does
the actual token validation, via an sso_providers row with
trusted_for_api_auth=true, and still filters the tool list per caller from
tools.visibility / tools.team_id. Nothing here grants access; it only tells the
client where to go and get a token.

`resource` MUST equal the URL clients actually connect to, because RFC 9728
clients compare it against the endpoint they are talking to. That is why this
is a static document rather than a rewrite onto a virtual-server path: under a
rewrite Context Forge would publish /servers/<uuid>/mcp while the client
connected to /mcp, and the two would disagree.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ include "context-forge.fullname" . }}-root-resource-metadata
  labels:
    {{- include "context-forge.labels" . | nindent 4 }}
spec:
  directResponse:
    contentType: application/json
    statusCode: 200
    body:
      type: Inline
      inline: |
        {{- $meta := dict
              "resource" (printf "https://%s/mcp" .Values.httpRoute.hostname)
              "authorization_servers" (list .Values.httpRoute.rootMcp.authorizationServer)
              "bearer_methods_supported" (list "header")
              "scopes_supported" .Values.httpRoute.rootMcp.scopes }}
        {{ toJson $meta }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "context-forge.fullname" . }}
  labels:
    {{- include "context-forge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayRef.name }}
      namespace: {{ .Values.httpRoute.gatewayRef.namespace }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    {{- if .Values.httpRoute.rootMcp.enabled }}
    # Discovery document for the root MCP endpoint. Exact match, so it wins over
    # both the /mcp prefix and the catch-all regardless of rule ordering.
    # Cloudflare Access must bypass this path or the client never reaches it.
    - matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ include "context-forge.fullname" . }}-root-resource-metadata

    # The root MCP endpoint, rewritten onto a virtual server.
    #
    # Context Forge's ROOT /mcp cannot authenticate an external IdP token at
    # all: auth_middleware -> get_current_user -> verify_jwt_token_cached, which
    # only accepts internally-minted JWTs. The dispatcher that consults trusted
    # SSO providers, verify_credentials_cached -> _maybe_verify_external, is
    # never reached from this path, so SSO_API_TOKEN_AUTH_ENABLED and
    # trusted_for_api_auth are both honoured by code nothing here calls. Same in
    # upstream main as of v1.0.7.
    #
    # The per-virtual-server path is a different code path entirely:
    # streamablehttp_transport calls verify_oauth_access_token itself against
    # server.oauth_config, bypassing get_current_user. That one works, proven
    # end to end. So rewrite onto it.
    #
    # The rewrite is only safe because Envoy owns both halves of discovery. A
    # naive rewrite breaks RFC 9728: Context Forge would advertise
    # /servers/<id>/mcp while the client connected to /mcp, and clients compare
    # those. Here the directResponse above declares `resource` as the /mcp URL,
    # and the ResponseHeaderModifier below overrides Context Forge's pointer, so
    # the client only ever sees /mcp and the two agree.
    #
    # Audience still resolves: authentik mints aud = client_id, and the
    # transport falls back to oauth_config.client_id when `resource` is unset.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /servers/{{ required "httpRoute.rootMcp.serverId is required when rootMcp is enabled" .Values.httpRoute.rootMcp.serverId }}/mcp
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: WWW-Authenticate
                value: >-
                  Bearer resource_metadata="https://{{ .Values.httpRoute.hostname }}/.well-known/oauth-protected-resource/mcp"
      backendRefs:
        # Gateway API schema defaults, declared explicitly because this app
        # syncs with ServerSideApply=true and SSA diffs on field ownership;
        # an undeclared default is permanent phantom drift. See
        # cf-ingress-library/templates/_httproute.tpl for the full rationale.
        - group: ""
          kind: Service
          name: context-forge-gateway-mcp-stack-mcpgateway
          port: 80
          weight: 1
    {{- end }}

    # Everything else: admin UI, REST API, static assets. Stays behind the
    # hostname-wide Cloudflare Access application.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        # Gateway API schema defaults, declared explicitly because this app
        # syncs with ServerSideApply=true and SSA diffs on field ownership;
        # an undeclared default is permanent phantom drift. See
        # cf-ingress-library/templates/_httproute.tpl for the full rationale.
        - group: ""
          kind: Service
          name: context-forge-gateway-mcp-stack-mcpgateway
          port: 80
          weight: 1
{{- end }}
