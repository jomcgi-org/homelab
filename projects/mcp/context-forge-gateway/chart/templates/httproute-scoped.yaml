{{- /*
Scoped HTTPRoutes: one hostname per trust tier, reaching only the virtual
server surface, never the gateway root.

The gateway's own /mcp endpoint serves the FULL tool catalogue, so a tier
hostname must never route PathPrefix "/". Each route is an allowlist: two
rules, and every other path on the hostname finds no route and 404s.

These rules are deliberately path-TRANSPARENT rather than rewriting /mcp onto
/servers/<id>/mcp. RFC 9728 derives the protected-resource metadata URL from
the resource path, and Context Forge builds that URL from the request path it
receives. Under a rewrite the client asks for
/.well-known/oauth-protected-resource/mcp while the server publishes
/.well-known/oauth-protected-resource/servers/<id>/mcp, so OAuth discovery
fails before the client ever contacts the authorization server. Transparency
is a protocol requirement here, not a preference.

Isolation therefore comes from authorization, not routing: MCP_REQUIRE_AUTH
plus per-server oauth_enabled, with Context Forge teams scoping which
principal sees which server. That is also what lets a new virtual server be an
API object rather than a deploy.
*/}}
{{- range .Values.scopedRoutes }}
{{- if .enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "context-forge.fullname" $ }}-{{ .name }}
  labels:
    {{- include "context-forge.labels" $ | nindent 4 }}
    ingress-tier: {{ .tier | default "public" }}
spec:
  parentRefs:
    - name: {{ $.Values.httpRoute.gatewayRef.name }}
      namespace: {{ $.Values.httpRoute.gatewayRef.namespace }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    # OAuth discovery. Must resolve on THIS hostname, unrewritten, or the
    # client cannot find the authorization server. Public by design.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: {{ $.Release.Name }}-mcp-stack-mcpgateway
          port: 80

    # Virtual servers, addressed by their real path so client and server agree
    # on the resource identity.
    - matches:
        - path:
            type: PathPrefix
            value: /servers/
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: {{ $.Release.Name }}-mcp-stack-mcpgateway
          port: 80
{{- end }}
{{- end }}
