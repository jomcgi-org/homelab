# Context Forge MCP Gateway
# Wraps upstream IBM mcp-stack chart with environment-specific config.

mcp-stack:
  mcpContextForge:
    image:
      repository: ghcr.io/ibm/mcp-context-forge
      tag: "v1.0.0-RC1"
      pullPolicy: IfNotPresent
    replicaCount: 1
    hpa:
      enabled: false
    ingress:
      enabled: false
    config:
      GUNICORN_WORKERS: "2"
      MCPGATEWAY_UI_ENABLED: "false"
      MCPGATEWAY_A2A_ENABLED: "false"
      LLMCHAT_ENABLED: "false"
      MCPGATEWAY_CATALOG_ENABLED: "false"
      MCPGATEWAY_DIRECT_PROXY_ENABLED: "false"
      MCPGATEWAY_BULK_IMPORT_ENABLED: "false"
    secret:
      AUTH_REQUIRED: "true"
      # JWT auth required for in-cluster registration jobs (charts/mcp-servers registration-job.yaml)
      MCP_CLIENT_AUTH_ENABLED: "true"
      MCP_REQUIRE_AUTH: "false"
      # Cloudflare Access Managed OAuth handles auth at the edge — see ADR 011
      TRUST_PROXY_AUTH: "true"
      PROXY_USER_HEADER: "Cf-Access-Authenticated-User-Email"
    extraEnvFrom:
      - secretRef:
          name: context-forge
    metrics:
      serviceMonitor:
        enabled: false # Requires prometheus-operator CRDs
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  postgres:
    persistence:
      storageClassName: ""
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Pin migration image to match the gateway — upstream defaults to :latest
  # which can apply migrations the pinned gateway version doesn't understand.
  migration:
    image:
      repository: ghcr.io/ibm/mcp-context-forge
      tag: "v1.0.0-RC1"
      pullPolicy: IfNotPresent

  redis: # nosemgrep: no-inline-subchart — bundled by mcp-stack upstream chart
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Disable components we don't need
  pgadmin:
    enabled: false
  redisCommander:
    enabled: false
  minio:
    enabled: false
  mcpFastTimeServer:
    enabled: false

# 1Password secret — provides JWT_SECRET_KEY, AUTH_ENCRYPTION_SECRET, PLATFORM_ADMIN_EMAIL
secret:
  name: context-forge
  itemPath: ""

# NetworkPolicies disabled. Context Forge enforces auth at the application
# layer instead.
networkPolicy:
  enabled: false

# HTTPRoute for external access via Cloudflare Tunnel.
# Auth handled at edge by Cloudflare Access Managed OAuth (ADR 011).
httpRoute:
  enabled: false
  hostname: ""
  gatewayRef:
    name: cloudflare-ingress
    namespace: envoy-gateway-system

# Per-tier hostnames, each scoped to exactly one virtual server. See
# templates/httproute-scoped.yaml for why these must never route "/".
# serverId is a Context Forge runtime object id, so a recreated virtual
# server needs this value updated. That coupling is one of the reasons this
# pattern does not scale past the experiment it was added for.
scopedRoutes: []
#  - name: friends
#    enabled: true
#    hostname: friends.jomcgi.dev
#    tier: public
#    serverId: "<virtual server uuid>"

# Periodic tool-catalog refresh. CF does not auto-discover new monolith MCP
# tools (its health-gated auto-refresh never fires for the SSE monolith gateway,
# whose last_seen never advances under the streamablehttp health tick), so a
# CronJob POSTs the gateways/<id>/tools/refresh admin endpoint on a schedule.
# Reuses the gateway image (bundles mcpgateway + httpx) and the context-forge
# secret (JWT_SECRET_KEY + PLATFORM_ADMIN_EMAIL) to mint a short-lived admin JWT.
toolRefresh:
  enabled: true
  # Every 10 minutes: tool changes follow a monolith rollout, not a tight loop.
  schedule: "*/10 * * * *"
  # Cap each run's lifetime so a hung refresh pod cannot linger.
  activeDeadlineSeconds: 120
  # Gateway whose catalog to refresh, matched by name via the gateways API.
  gatewayName: monolith
  image:
    repository: ghcr.io/ibm/mcp-context-forge
    tag: "v1.0.0-RC1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi
