# Context Forge MCP Gateway
# Wraps upstream IBM mcp-stack chart with environment-specific config.

mcp-stack:
  mcpContextForge:
    image:
      repository: ghcr.io/ibm/mcp-context-forge
      tag: "v1.0.7"
      pullPolicy: IfNotPresent
    replicaCount: 1
    hpa:
      enabled: false
    ingress:
      enabled: false
    config:
      GUNICORN_WORKERS: "2"
      MCPGATEWAY_UI_ENABLED: "false"
      MCPGATEWAY_A2A_ENABLED: "false"
      LLMCHAT_ENABLED: "false"
      MCPGATEWAY_CATALOG_ENABLED: "false"
      MCPGATEWAY_DIRECT_PROXY_ENABLED: "false"
      MCPGATEWAY_BULK_IMPORT_ENABLED: "false"
    secret:
      AUTH_REQUIRED: "true"
      # JWT auth required for in-cluster registration jobs (charts/mcp-servers registration-job.yaml)
      MCP_CLIENT_AUTH_ENABLED: "true"
      MCP_REQUIRE_AUTH: "false"
      # Cloudflare Access Managed OAuth handles auth at the edge — see ADR 011
      TRUST_PROXY_AUTH: "true"
      PROXY_USER_HEADER: "Cf-Access-Authenticated-User-Email"
    extraEnvFrom:
      - secretRef:
          name: context-forge
    metrics:
      serviceMonitor:
        enabled: false # Requires prometheus-operator CRDs
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  postgres:
    persistence:
      storageClassName: ""
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Pin migration image to match the gateway — upstream defaults to :latest
  # which can apply migrations the pinned gateway version doesn't understand.
  migration:
    image:
      repository: ghcr.io/ibm/mcp-context-forge
      tag: "v1.0.7"
      pullPolicy: IfNotPresent

  redis: # nosemgrep: no-inline-subchart — bundled by mcp-stack upstream chart
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Disable components we don't need
  pgadmin:
    enabled: false
  redisCommander:
    enabled: false
  minio:
    enabled: false
  mcpFastTimeServer:
    enabled: false

# 1Password secret — provides JWT_SECRET_KEY, AUTH_ENCRYPTION_SECRET, PLATFORM_ADMIN_EMAIL
secret:
  name: context-forge
  itemPath: ""

# Reconcile the authentik group -> Context Forge team mapping from Git
# (templates/team-mapping-cronjob.yaml, #5033). Off by default so the chart
# ships inert; production enables it in deploy/values.yaml with its team list.
# Membership stays authentik's: CF applies the mapping per request from the
# token's groups claim. This only keeps the WIRING (team rows and
# sso_providers.team_mapping) declared here instead of in a hand-run script.
teamMapping:
  enabled: false
  # Every 15 minutes: a new group in values is not urgent, and this never
  # touches the tool catalogue so it cannot preempt CF's own refresh loop.
  schedule: "*/15 * * * *"
  # Cap each run so a hung pod cannot linger.
  activeDeadlineSeconds: 120
  # The sso_providers row to write team_mapping onto. Created by
  # scripts/provision-mcp-auth.sh (needs the authentik client id); the job
  # fails loudly if it is missing rather than inventing one.
  providerId: authentik
  # authentikGroup is matched by NAME against the token's groups claim
  # (case-insensitively, by CF). team is the CF team, created if absent.
  teams: []
  #  - authentikGroup: homelab-admin
  #    team: homelab-admin
  #    description: Full monolith catalogue.
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

# NetworkPolicies disabled. Context Forge enforces auth at the application
# layer instead.
networkPolicy:
  enabled: false

# CloudNativePG cluster backing the gateway, replacing mcp-stack's bundled
# postgres:17 Deployment. See templates/postgres-cnpg.yaml for why there is
# no backup policy.
cnpg:
  enabled: false
  name: context-forge-pg
  database: mcpgateway
  owner: mcpgateway
  instances: 1
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  monitoring:
    enablePodMonitor: true

# HTTPRoute for external access via Cloudflare Tunnel.
# Auth handled at edge by Cloudflare Access Managed OAuth (ADR 011).
httpRoute:
  enabled: false
  hostname: ""
  gatewayRef:
    name: cloudflare-ingress
    namespace: envoy-gateway-system
  # RFC 9728 discovery for the ROOT /mcp endpoint, so one central endpoint can
  # serve every caller and Context Forge filters the tool list per identity
  # (tools.visibility + tools.team_id) instead of per URL. Context Forge only
  # publishes protected-resource metadata for virtual servers, so Envoy serves
  # the document and injects the pointer. See templates/httproute.yaml.
  #
  # Requires, and is useless without, all three of:
  #   1. a Cloudflare Access application over `<hostname>/mcp` and
  #      `<hostname>/.well-known/oauth-protected-resource` with a Bypass policy,
  #      or the client is challenged at the edge and never reaches Envoy;
  #   2. an sso_providers row in Context Forge with trusted_for_api_auth=true,
  #      issuer matching authorizationServer, and api_audience set to the
  #      authentik client_id (authentik mints `aud` = client_id, ignoring
  #      RFC 8707 `resource`);
  #   3. tools carrying visibility=team and a team_id, otherwise every
  #      authenticated caller sees the whole catalogue.
  rootMcp:
    enabled: false
    # OIDC issuer URL, with trailing slash, exactly as the token's `iss` claim.
    authorizationServer: ""
    # Context Forge virtual server that /mcp is rewritten onto. Required, because
    # the ROOT endpoint cannot authenticate an external IdP token (see
    # templates/httproute.yaml for the call graph); only the per-virtual-server
    # path can. Clients never see this id.
    #
    # It is a runtime object id, so a rebuilt gateway database regenerates it and
    # this value goes stale. scripts/provision-mcp-auth.sh owns creating that
    # server and prints the id, so the two are updated together.
    serverId: ""
    scopes:
      - openid
      - profile
      - email

# Per-tier hostnames, each scoped to exactly one virtual server. See
# templates/httproute-scoped.yaml for why these must never route "/".
# serverId is a Context Forge runtime object id, so a recreated virtual
# server needs this value updated. That coupling is one of the reasons this
# pattern does not scale past the experiment it was added for.
scopedRoutes: []
#  - name: friends
#    enabled: true
#    hostname: friends.jomcgi.dev
#    tier: public
#    serverId: "<virtual server uuid>"

# Browser-authenticated preview lane on friends.jomcgi.dev. See
# templates/httproute-preview.yaml for why this is a route of its own rather
# than a rule on the scoped route, and blueprints/preview-auth.yaml in the
# authentik chart for the provider it authenticates against.
#
# DISABLED here AND in deploy/values.yaml. Enabling it is deliberately the last
# step: this hostname has no Cloudflare Access application in front of it, so
# the SecurityPolicy is the only thing between /preview/ and the internet, and
# the deny path is worth confirming before anything is served. deploy values
# carries the ordered checklist.
#
# One client secret lives in 1Password and reaches both ends from there: the
# authentik provider reads it from its pod environment, and the SecurityPolicy
# reads it from a Secret in this namespace. Neither end holds it in Git.
previewAuth:
  enabled: false
  hostname: friends.jomcgi.dev
  # authentik derives the OIDC issuer from the APPLICATION slug, not the
  # provider name. Both of these track blueprints/preview-auth.yaml entry 2;
  # renaming the application there breaks token validation here.
  issuer: https://auth.jomcgi.dev/application/o/preview/
  jwksUri: https://auth.jomcgi.dev/application/o/preview/jwks/
  # Pinned in the blueprint rather than generated, because it is not a secret
  # and this file has to name it.
  clientID: preview-friends
  # k8s Secret synced from 1Password, holding key `client-secret`.
  clientSecretName: preview-oidc-client
  # Groups permitted to use a token here, matched against the `groups` claim
  # rather than the projected header, because a claim inside a verified
  # signature cannot be forged by a caller. Empty would render an invalid
  # policy (values requires at least one entry), which fails closed at
  # admission rather than opening the route.
  #
  # These are authentik group NAMES. Renaming a group there stops matching
  # here, and the symptom is a 403 after a fully successful login.
  allowedGroups:
    - homelab-admin
  # This host only. The apex would attach the session cookies to every other
  # tier including the public site. Widen only when a second preview host
  # exists, and note widening is the safe direction while narrowing is not.
  cookieDomain: friends.jomcgi.dev
  onepassword:
    itemPath: ""
