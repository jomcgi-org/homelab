# ── Context Forge Gateway ──────────────────────────────────────────────────
mcp-stack:
  mcpContextForge:
    # Everything we set deliberately goes in extraEnv, NOT config or secret.
    #
    # config/secret render into a ConfigMap and a Secret consumed via envFrom.
    # The mcp-stack pod template carries only labels, no annotations block, so
    # there is no checksum to change and editing either object does not roll the
    # deployment. The process keeps the old value indefinitely while Git, the
    # ConfigMap and `kubectl rollout status` all look correct. SSO_ENABLED was
    # set to "true", stayed false in the process for the whole session, and the
    # rollout reported success throughout, because the deployment genuinely was
    # at its desired state.
    #
    # extraEnv renders inside the pod template, so changing a value changes the
    # pod spec and ArgoCD rolls it. Kubernetes `env` also takes precedence over
    # `envFrom`, which closes the second trap: the chart emits some keys into
    # BOTH the ConfigMap and the Secret, and the envFrom order
    # [secret, configMap, secret] silently shadowed SSRF_ALLOWED_NETWORKS back
    # to its default. Values here cannot be shadowed by either.
    #
    # Rule of thumb: if we bothered to set it, it must take effect, so it
    # belongs here.
    extraEnv:
      - name: MCPGATEWAY_UI_ENABLED
        value: "true"
      - name: MCPGATEWAY_CATALOG_ENABLED
        value: "true"
      - name: MCPGATEWAY_TOOL_CANCELLATION_ENABLED
        value: "true"
      # 1.0.x enables SSRF protection with ssrf_allow_private_networks false,
      # so RFC 1918 destinations are refused and registering any in-cluster MCP
      # server fails with a masked 422 (the real cause appears only in the log
      # as `loc=('body','url') type=value_error`). Allowlist just the k3s pod
      # and service CIDRs so RFC 1918 stays blocked everywhere else.
      #
      # Previously this had to live in config rather than secret, because the
      # chart emits the key into BOTH objects and the envFrom order
      # [secret, configMap, secret] shadowed it back to the ConfigMap default
      # of "[]". As extraEnv it outranks every envFrom source, so the ordering
      # no longer matters.
      - name: SSRF_ALLOWED_NETWORKS
        value: '["10.42.0.0/16", "10.43.0.0/16"]'
      # Mounts the /auth/sso router, which is the only way to manage the
      # sso_providers row that makes authentik a trusted issuer for the root
      # /mcp endpoint. Defaults to false, and while false the admin API 404s.
      #
      # This does NOT gate the auth path itself: verify_credentials.py resolves
      # the trusted provider straight from the table, so tokens would validate
      # either way. It gates router mounting (main.py) and the browser SSO flow
      # only. Those endpoints live outside the Cloudflare Access bypass, so they
      # stay behind Access on mcp.jomcgi.dev.
      - name: SSO_ENABLED
        value: "true"
      # The other half of external-IdP bearer auth, and the one that actually
      # gates it. SSO_ENABLED only mounts the /auth/sso router; this is what
      # lets a token minted by a trusted provider authenticate an MCP request:
      #
      #   if not getattr(settings, "sso_api_token_auth_enabled", False):
      #       return None
      #
      # runs before the token is even decoded, so with it false the whole
      # external path is dead and every authentik token 401s as "Invalid token"
      # with no verify_credentials log line to explain why. Its own description
      # says each provider must ALSO set trusted_for_api_auth, which the
      # provisioning script does: both halves are required, neither is
      # sufficient.
      - name: SSO_API_TOKEN_AUTH_ENABLED
        value: "true"
      # Forward the caller's authentik token to upstream gateways, so the
      # monolith can learn WHO is calling and scope its own results.
      #
      # Context Forge's ACL is tool-granular: it decides whether you may call
      # search_knowledge, never what search_knowledge returns. Without this the
      # monolith sees every invocation as "the gateway" and cannot distinguish
      # an admin from a friend, so per-caller data scoping is impossible and
      # tiers would have to be built from separate tools per audience.
      #
      # Deliberately a TOKEN and not a header. Context Forge also supports
      # PROXY_USER_HEADER-style identity injection, but that asks the monolith
      # to believe a header, so anything able to reach the monolith in-cluster
      # could claim to be anyone. A forwarded RS256 token is verifiable: the
      # monolith checks it against authentik's JWKS and trusts authentik, not
      # us. A compromised gateway cannot forge a signature.
      #
      # The forwarding happens because the monolith gateway has no gateway-level
      # auth (gateways.auth_type is empty), which selects this branch in
      # passthrough_headers.py:
      #
      #   # When gateway has no auth, pass through client's Authorization
      #   client_auth = request_headers_lower.get("authorization")
      #
      # DEFAULT_PASSTHROUGH_HEADERS stays empty, so Authorization is the only
      # thing forwarded, via that branch rather than an allowlist.
      #
      # INERT until the monolith validates the token. Enabling it alone changes
      # no behaviour; it is the prerequisite for the monolith-side work.
      #
      # Two properties to keep in mind:
      #  - the token's `aud` is the MCP client id, not the monolith, so the
      #    monolith must validate `iss` strictly and knowingly accept that
      #    audience. RFC 8693 token exchange is the correct fix and Context
      #    Forge implements it (services/token_exchange_cache.py, keyed by
      #    gateway+user+audience), but authentik does not advertise the
      #    token-exchange grant, so it is unavailable here.
      #  - this setting is global, not per gateway. Every gateway registered
      #    later also receives the caller's token, and a token you hand a
      #    backend is a token that backend can replay.
      - name: ENABLE_HEADER_PASSTHROUGH
        value: "true"
      # Enforce OAuth on the MCP endpoint itself. Until now the JSON-RPC
      # endpoint authenticated nobody: an unauthenticated tools/list returned
      # all 57 tools, including monolith-agent-session-destroy, and tools/call
      # reached dispatch. Only Cloudflare Access stood in front of it, so the
      # protection was a property of one ingress path rather than of the
      # gateway. The REST endpoints (/admin, /tools) already returned 401.
      #
      # This is also what makes a virtual server's oauth_enabled meaningful:
      # that flag only PUBLISHES protected-resource metadata. Without
      # enforcement the endpoint answers 200 with no WWW-Authenticate, so no
      # client ever begins an OAuth flow.
      #
      # Note this is gateway-wide, not per server. mcp.jomcgi.dev tokens are
      # issued by jomcgi.cloudflareaccess.com and DCR_ALLOWED_ISSUERS is empty,
      # so that path may need its issuer trusted once validation is enforced.
      #
      # This is not a secret, and as the switch that decides whether the MCP
      # endpoint authenticates anyone at all, it is the last value that should
      # be able to sit unapplied in a ConfigMap while the process runs without
      # it.
      - name: MCP_REQUIRE_AUTH
        value: "true"
      # Let the health-check loop sync each gateway's tools/resources/prompts
      # into Context Forge's Postgres. Upstream defaults this to false, so a
      # healthy tick on its own refreshes nothing: gateway_service.py only
      # enters the sync branch when settings.auto_refresh_servers is true. The
      # monolith gateway is registered as STREAMABLEHTTP (the by-hand step in
      # #5035) and its last_seen now advances every HEALTH_CHECK_INTERVAL, so
      # this is what lets the built-in refresh replace the tool-refresh
      # CronJob. The CronJob stays until a CF-driven sync has been observed in
      # the gateway log; retiring it is the rest of #5035.
      - name: AUTO_REFRESH_SERVERS
        value: "true"
      # Seconds between syncs per gateway. Matches the CronJob's cadence the
      # catalogue has been living with; the upstream floor is 60.
      - name: GATEWAY_AUTO_REFRESH_INTERVAL
        value: "600"
    probes:
      startup:
        type: exec
        command: ["sh", "-c", "sleep 10"]
        timeoutSeconds: 15
        periodSeconds: 10
        failureThreshold: 18
      liveness:
        type: http
        path: /health
        port: 4444
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 5
    # 7-day SigNoz peak RSS 490Mi / working_set 533Mi. Trimmed 1Gi -> 768Mi
    # (req==limit, Guaranteed) to reclaim reservation on node-2 (a 12.3Gi
    # control-plane node) while keeping ~1.4x headroom over the real peak.
    resources:
      requests:
        cpu: 50m
        memory: 768Mi
      limits:
        cpu: 200m
        memory: 768Mi
  migration:
    enabled: false
  # Bundled postgres:17 Deployment replaced by a CloudNativePG cluster
  # (see chart/templates/postgres-cnpg.yaml). CNPG's -app secret keys match
  # mcp-stack's external.*Key defaults, so no key mapping is needed.
  postgres:
    enabled: false
    external:
      enabled: true
      existingSecret: context-forge-pg-app

cnpg:
  enabled: true

secret:
  itemPath: "vaults/k8s-homelab/items/context-forge"

# ── External access via Cloudflare Managed OAuth (ADR 011) ───────────────
httpRoute:
  enabled: true
  hostname: mcp.jomcgi.dev
  # One central MCP endpoint at mcp.jomcgi.dev/mcp, authenticated by authentik
  # and filtered per identity by Context Forge, rather than a virtual server
  # (and therefore a UUID) per trust tier. A Cloudflare Access application with
  # a Bypass policy covers /mcp and /.well-known/oauth-protected-resource; the
  # hostname-wide application still guards /admin, /tools and /gateways, so the
  # control plane keeps its edge layer while the data plane uses OAuth.
  rootMcp:
    enabled: true
    authorizationServer: https://auth.jomcgi.dev/application/o/mcp-friends/
    # The "homelab-admin" virtual server, carrying the full monolith catalogue.
    # One server is enough: list_server_tools filters per caller from
    # tools.visibility and team membership, so entitlements are expressed as
    # tags on tools rather than as a server (and a URL) per tier.
    serverId: a9e472d2d61949169a5894ed37f067e1

# friends.jomcgi.dev reaches exactly one virtual server, "friends-empty",
# which is deliberately empty: tools/list returns [] so the hostname exposes
# nothing even though MCP_REQUIRE_AUTH is off and no Cloudflare Access
# application covers it. It exists to test whether a Claude connector can
# complete an OAuth flow against authentik, via the virtual server's own
# oauth_enabled / oauth_config, without spending Zero Trust seats.
#
# Do not add tools to that virtual server while it is unauthenticated.
scopedRoutes:
  - name: friends
    enabled: true
    hostname: friends.jomcgi.dev
    tier: public

# Preview lane: OFF, and deliberately not armed here. Enabling it is the LAST
# step, not the first, because this hostname has no Cloudflare Access
# application in front of it and the tunnel's catchAll routes every resolving
# hostname straight to the gateway. The SecurityPolicy is the only thing
# between /preview/ and the internet.
#
# The client secret is already in 1Password at both ends, so there is no manual
# copy step. This app deploys from git at targetRevision HEAD, so there is no
# chart version to bump either: merging IS the deploy.
#
# To turn it on, in order:
#   1. Merge. The authentik blueprint creates the `preview` provider and
#      application, reading its client secret from the environment. Nothing on
#      this side renders while enabled is false.
#   2. Confirm the provider is actually usable. The discovery document is NOT
#      sufficient: it answers 200 even when the provider has no signing key and
#      no grants, so check the JWKS has keys in it, which is what Envoy
#      validates against:
#        curl -s https://auth.jomcgi.dev/application/o/preview/jwks/ | jq '.keys | length'
#      Expect >= 1. Zero means the provider has no signing key and every request
#      would 401 with a perfectly healthy-looking discovery document.
#   3. Confirm the zone forces HTTPS. Envoy overwrites X-Forwarded-Proto with
#      the connection scheme (the tunnel reaches the listener over plain HTTP on
#      port 80, and there is no ClientTrafficPolicy setting numTrustedHops), so
#      the oauth2 filter builds its post-login redirect from scheme http. If the
#      zone does not 301 that to https, the browser withholds the secure cookies
#      and the login bounces forever. Adding the X-Forwarded-Proto header filter
#      that other routes here carry does NOT fix it: route-level mutation runs
#      after the oauth2 filter.
#   4. Set enabled: true here.
#   5. Verify the DENY path FIRST, before checking that login works:
#        curl -sS -o /dev/null -w '%{http_code}\n' https://friends.jomcgi.dev/preview/
#      A 200 here means the policy is not attached and the route is public.
#      Expect a redirect to auth.jomcgi.dev or a 401, never a 200.
#      Worth re-running after any later change: the route and the policy are
#      separate objects, and nothing binds them into one unit, so a partial sync
#      or a prune could leave the route serving without the policy.
#   6. Then log in through a browser and confirm the placeholder body renders.
#      A login loop has two likely causes, in this order: the scheme problem in
#      step 3, or the cookie names in the oidc and jwt blocks having drifted. A
#      token that was issued and then rejected loops rather than 401ing, which
#      is why neither shows up as an error.
#
# Rotation is one field edit on vaults/k8s-homelab/items/authentik
# (PREVIEW_OIDC_CLIENT_SECRET) plus the same value on items/preview-oidc
# (client-secret). Both ends must move together or the handshake breaks.
# ARMED 2026-08-10. Steps 1 to 3 above were verified against the running
# system before this flip: both blueprints report status=successful (so the
# !Env resolved), the provider carries authorization_code + refresh_token and
# the self-signed signing key, its JWKS answers with 1 key, and the zone 301s
# http to https so the post-login redirect keeps its secure cookies.
#
# Expect a window of 500s immediately after this lands. The OnePasswordItem is
# only created by this flip, and the operator syncs on a fixed 600s boundary,
# so the Secret does not exist yet. Envoy Gateway answers 500 on every route a
# SecurityPolicy targets when it cannot build the OIDC config, which is the
# fail-closed behaviour: a missing secret cannot open the route.
previewAuth:
  enabled: true
  onepassword:
    itemPath: vaults/k8s-homelab/items/preview-oidc
