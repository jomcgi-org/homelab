# GKE cutover destination. The gateway stays dormant; CNPG stays up for data
# staging and bootstraps by recovery from the off-cluster GCS Barman object
# store. Consumed by the gke-apps Applications.
mcp-stack:
  mcpContextForge:
    # Upstream's schema requires at least one replica even though Kubernetes
    # accepts zero. The GKE Application skips that schema check for this dormant
    # deployment and still renders the Deployment with replicas: 0.
    replicaCount: 0

cnpg:
  storage:
    storageClass: standard-rwo
  bootstrap:
    recovery:
      # CNPG 1.30 behavior: The recovery-minted app Secret password overwrites
      # the restored owner role after recovery completes. No manual ALTER ROLE
      # step is required.
      source: context-forge-pg
      database: mcpgateway
      owner: mcpgateway
  # backup stays ENABLED: the distinct serverName gives the GKE cluster its
  # own archive prefix, so it never trips CNPG's empty-archive check against
  # the prefix the home cluster is live-archiving into.
  backup:
    serverName: context-forge-pg-gke
  externalClusters:
    - name: context-forge-pg
      barmanObjectStore:
        destinationPath: "gs://h0melab-cnpg-backups/context-forge-pg/"
        googleCredentials:
          applicationCredentials:
            name: context-forge-pg-backup-gcs
            key: service-account-key.json
        wal:
          compression: gzip
