# Cluster overrides for fc-invoke. The daemon runs on the FC-labeled node
# (homelab.io/firecracker=true) and dispatches HTTP invocations to a pool of
# warm-base Firecracker microVMs across named workloads, serving
# POST /invoke/{workload} + GET /healthz in-cluster. Node + arch are inferred
# (downward API / runtime.GOARCH), not set here.
#
# firecracker.enabled is TRUE: the daemon drives real microVMs. It runs
# privileged (runAsUser 0) with /dev/kvm + the nvme dir host-mounted (the
# firecracker binary + guest kernel are baked into the image at /opt/fc, ADR
# agents/037). Per workload it builds one warm snapshot at startup, then
# restores a fresh microVM from it per invoke (~tens of ms) and discards it; the
# shared base rootfs is booted read-only so no per-invoke rootfs copy is needed.
# Privileged is required for the per-instance vsock mount namespaces
# (CAP_SYS_ADMIN). Cold boot is the fallback if the base fails.
firecracker:
  enabled: true

# Caller authentication for /invoke (STPA: unauthenticated /invoke). The only
# clients are the monolith orchestrator (goosecracker runner) and the semgrep
# MCP tool, both running under the `monolith` ServiceAccount, so the daemon
# TokenReview-validates each caller's SA token and admits only that identity.
# This is the portable, substrate-independent control.
auth:
  enabled: true
  allowedCallers:
    - system:serviceaccount:monolith:monolith
    # Public tier semgrep demo (ember_public /api/ember/semgrep): the
    # monolith-public web pod calls fc-invoke as its own SA.
    - system:serviceaccount:monolith-public:monolith-public

# Cilium authorization for the /invoke route (ADR platform/012), on top of the
# daemon's own TokenReview control (defence in depth).
ciliumPolicy:
  enabled: true
  fromNamespaces:
    - monolith
    # Public tier: the monolith-public web pod reaches /invoke/semgrep for the
    # public semgrep demo. Namespace authorization only; the daemon TokenReview
    # gate still enforces the exact SA (see auth.allowedCallers above).
    - monolith-public

# The daemon image (private) and the proprietary semgrep-guest image (crane-pulled
# by the rootfs-builder) need GHCR creds in-cluster; charts stay private too via
# the ArgoCD repo-cred added in projects/platform/argocd.
imagePullSecret:
  enabled: true

# In-cluster SigNoz OTLP endpoint for fc-invoke's own lifecycle spans (auth,
# acquire, snapshot_restore, wait_ready, guest_exec). Chart default is "" (no-op
# exporter); setting it here turns tracing on for this deployment. gRPC (4317),
# not HTTP (4318) like the monolith/goose exporters: the daemon's exporter is
# otlptracegrpc (see invoke/internal/telemetry).
tracing:
  endpoint: signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4317
  serviceName: fc-invoke

# Egress-proxy sidecar (ADR 023 phase 6a). ON: the agent (goosecracker) workload
# runs with egress enabled and reaches the network only through this sidecar.
# Policy is allowlist (fail closed): the sidecar denies any destination whose
# host is not listed here. Hosts are matched EXACTLY (no suffix/wildcard) against
# the SNI (TLS) or Host header (plain HTTP), and the port from the guest funnel
# preamble; a bare host allows any port, host:port pins the port.
#
# Destinations the agent guest reaches (all in-cluster, plain HTTP over the
# funnel; the hosts the agent's default tier uses):
#   - inference.inference.svc.cluster.local:8080  in-cluster model (Qwen; OPENAI_HOST)
#   - monolith.monolith.svc.cluster.local:8000    monolith progress / artifact sink
#   - context-forge-...mcpgateway.mcp.svc.cluster.local:80  MCP tools (baked guest ext)
#   - signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318  goose OTLP traces
# There is no in-cluster git mirror, so none is listed. The external host
# api.github.com carries a credential, so it rides the ADR 023 phase 6b swap
# path (secrets below); external:allow already reaches it, and the per-secret
# egressTo scopes where the real value materialises.
egress:
  enabled: true
  # Split-horizon guardrail (ADR 023): the public internet is open so the agent can
  # read arbitrary docs/APIs; the cluster is deny-by-default and confined to the
  # internal allowlist below, which closes the cluster-pivot vector.
  external: allow
  internal:
    default: deny
    # Internal (cluster) destinations the agent legitimately needs. A bare host
    # allows any port; host:port pins the port. The external secret-swap host
    # api.github.com is NOT here: external:allow reaches it and the per-secret
    # egressTo scopes where the real value materialises.
    allowlist:
      - inference.inference.svc.cluster.local:8080 # in-cluster model (Qwen; OPENAI_HOST)
      - monolith.monolith.svc.cluster.local:8000 # monolith progress / artifact sink
      - context-forge-gateway-mcp-stack-mcpgateway.mcp.svc.cluster.local:80 # MCP tools
      - signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318 # goose OTLP traces
      - git-mirror.monolith.svc.cluster.local:9418 # hot git mirror (ADR 041 hydrate + record)
      - monolith-searxng.monolith.svc.cluster.local:8080 # SearXNG JSON API (research sub-recipe web search)
  # ADR 023 phase 6b secret catalog. Each guest holds only the high-entropy
  # placeholder as env; the sidecar TLS-terminates the egressTo host with a leaf
  # minted from the cert-manager egress CA and swaps the placeholder for the real
  # value (from the referenced in-namespace Secret) only on that host. Everywhere
  # else the inert placeholder passes through, so a prompt-injected agent cannot
  # exfiltrate a real credential. A non-empty catalog enables the CA + swap path.
  secrets:
    # The agent's gh/API calls carry this placeholder (default tier GITHUB_TOKEN);
    # the sidecar swaps it for the real token (already in-namespace, synced by the
    # monolith from 1Password) only on api.github.com. Literal swap: gh API works;
    # raw git-over-HTTPS Basic (a base64'd token) is ADR-deferred. placeholder MUST
    # match goosecracker.tiers.default.GITHUB_TOKEN in the monolith deploy values.
    #
    # INVARIANT: the placeholder set here must equal the set of kloak: placeholders
    # the monolith goose tiers hand to guests. kloak_placeholder_drift_test.py
    # (in projects/monolith) fails CI if they drift.
    #
    # header/valuePrefix are what the sidecar actually reads now. The placeholder
    # below is no longer substituted; it survives only as the value the guest
    # holds so its client sends SOME Authorization header, which is the condition
    # injection fires on, and so the drift test above keeps its anchor.
    - env: GITHUB_TOKEN
      header: Authorization
      valuePrefix: "Bearer "
      placeholder: "kloak:gh:01JZX8K3N7Q2M5R9W4T6Y0F1B8"
      egressTo: [api.github.com]
      secretRef: { name: monolith-chat-secrets, key: GITHUB_TOKEN }
    # The household tier's OpenRouter key (ADR 039, amended): the WhatsApp guest
    # runs on DeepSeek V4 Flash, so it holds this placeholder as OPENAI_API_KEY
    # (goosecracker.tiers.household). The sidecar swaps it for the real key only on
    # openrouter.ai; external:allow already reaches that host. The real value is the
    # OPENROUTER_API_KEY field of the "goosecracker" Secret (synced from 1Password,
    # referenced by that exact name). placeholder MUST match
    # tiers.household.OPENAI_API_KEY in the monolith deploy values.
    - env: OPENROUTER_KEY
      header: Authorization
      valuePrefix: "Bearer "
      placeholder: "kloak:or:B5BKP27T2KSDN6QW70N34H8DP6"
      egressTo: [openrouter.ai]
      secretRef: { name: goosecracker, key: OPENROUTER_API_KEY }
