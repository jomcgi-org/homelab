# Cluster overrides for fc-invoke. The daemon runs on node-4 and dispatches HTTP
# invocations to a pool of warm-base Firecracker microVMs across named workloads,
# serving POST /invoke/{workload} + GET /healthz in-cluster.
#
# firecracker.enabled is TRUE: the daemon drives real microVMs. It runs
# privileged (runAsUser 0) with /dev/kvm + the kata binary/kernel + the nvme dir
# host-mounted. Per workload it builds one warm snapshot at startup, then
# restores a fresh microVM from it per invoke (~tens of ms) and discards it; the
# shared base rootfs is booted read-only so no per-invoke rootfs copy is needed.
# Privileged is required for the per-instance vsock mount namespaces
# (CAP_SYS_ADMIN). Cold boot is the fallback if the base fails.
node: node-4
arch: amd64

firecracker:
  enabled: true

# The daemon image (private) and the proprietary semgrep-guest image (crane-pulled
# by the rootfs-builder) need GHCR creds in-cluster; charts stay private too via
# the ArgoCD repo-cred added in projects/platform/argocd.
imagePullSecret:
  enabled: true

# Egress-proxy sidecar (ADR 023 phase 6a). ON: the agent (goosecracker) workload
# runs with egress enabled and reaches the network only through this sidecar.
# Policy is allowlist (fail closed): the sidecar denies any destination whose
# host is not listed here. Hosts are matched EXACTLY (no suffix/wildcard) against
# the SNI (TLS) or Host header (plain HTTP), and the port from the guest funnel
# preamble; a bare host allows any port, host:port pins the port.
#
# Destinations the agent guest reaches (all in-cluster, plain HTTP over the
# funnel; the hosts the agent's default tier uses):
#   - inference.inference.svc.cluster.local:8080  in-cluster model (Qwen; OPENAI_HOST)
#   - monolith.monolith.svc.cluster.local:8000    monolith progress / artifact sink
#   - context-forge-...mcpgateway.mcp.svc.cluster.local:80  MCP tools (baked guest ext)
#   - signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318  goose OTLP traces
# There is no in-cluster git mirror, so none is listed. The two external hosts
# (api.github.com, openrouter.ai) carry a credential, so they ride the ADR 023
# phase 6b swap path (secrets below) and must ALSO be listed here on :443, since
# the sidecar's permits() consults only this allowlist, not the catalog.
egress:
  enabled: true
  # Split-horizon guardrail (ADR 023): the public internet is open so the agent can
  # read arbitrary docs/APIs; the cluster is deny-by-default and confined to the
  # internal allowlist below, which closes the cluster-pivot vector.
  external: allow
  internal:
    default: deny
    # Internal (cluster) destinations the agent legitimately needs. A bare host
    # allows any port; host:port pins the port. The external secret-swap hosts
    # (api.github.com, openrouter.ai) are NOT here: external:allow reaches them and
    # the per-secret egressTo scopes where the real value materialises.
    allowlist:
      - inference.inference.svc.cluster.local:8080 # in-cluster model (Qwen; OPENAI_HOST)
      - monolith.monolith.svc.cluster.local:8000 # monolith progress / artifact sink
      - context-forge-gateway-mcp-stack-mcpgateway.mcp.svc.cluster.local:80 # MCP tools
      - signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318 # goose OTLP traces
      - git-mirror.monolith.svc.cluster.local:9418 # hot git mirror (ADR 026 hydrate + record)
      - monolith-searxng.monolith.svc.cluster.local:8080 # SearXNG JSON API (research sub-recipe web search)
  # ADR 023 phase 6b secret catalog. Each guest holds only the high-entropy
  # placeholder as env; the sidecar TLS-terminates the egressTo host with a leaf
  # minted from the cert-manager egress CA and swaps the placeholder for the real
  # value (from the referenced in-namespace Secret) only on that host. Everywhere
  # else the inert placeholder passes through, so a prompt-injected agent cannot
  # exfiltrate a real credential. A non-empty catalog enables the CA + swap path.
  secrets:
    # The agent's gh/API calls carry this placeholder (default tier GITHUB_TOKEN);
    # the sidecar swaps it for the real token (already in-namespace, synced by the
    # monolith from 1Password) only on api.github.com. Literal swap: gh API works;
    # raw git-over-HTTPS Basic (a base64'd token) is ADR-deferred. placeholder MUST
    # match goosecracker.tiers.default.GITHUB_TOKEN in the monolith deploy values.
    - env: GITHUB_TOKEN
      placeholder: "kloak:gh:01JZX8K3N7Q2M5R9W4T6Y0F1B8"
      egressTo: [api.github.com]
      secretRef: { name: monolith-chat-secrets, key: GITHUB_TOKEN }
    # The artifact tier's OpenRouter key (ADR 024): the guest holds this
    # placeholder as OPENROUTER_API_KEY (goosecracker.tiers.artifact); the sidecar
    # swaps it for the real key only on openrouter.ai. The real value is synced
    # from 1Password into the `goosecracker` Secret by the monolith chart's
    # OnePasswordItem. placeholder MUST match tiers.artifact.OPENROUTER_API_KEY.
    - env: OPENROUTER_KEY
      placeholder: "kloak:or:B5BKP27T2KSDN6QW70N34H8DP6"
      egressTo: [openrouter.ai]
      secretRef: { name: goosecracker, key: OPENROUTER_API_KEY }
