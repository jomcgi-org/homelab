apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fc-invoke
  namespace: argocd
spec:
  project: default
  sources:
    # Chart from OCI (pushed by CI via Bazel helm_push); image tags pinned at build.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: fc-invoke
      targetRevision: 0.4.96
      helm:
        valueFiles:
          - $values/projects/firecracker/substrate/deploy/values.yaml
    # Git repo for environment-specific values.
    - repoURL: https://github.com/jomcgi/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Deploy into the monolith namespace (where the retired semgrep-scand and
    # fc-agentd daemons lived) so callers reach the daemon at
    # fc-invoke.monolith.svc.cluster.local in-namespace.
    namespace: monolith
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
