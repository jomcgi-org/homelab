nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/jomcgi/homelab/projects/firecracker/substrate/invoke
  tag: latest
  pullPolicy: Always

# Per-workload guest images the base rootfs is built from. Bazel pins
# repository + tag from each guest image's .info provider at chart-build (see
# chart/BUILD `images`), so the rootfs the builder bakes always matches the
# deployed guest and the workload auto-rolls when its guest rebuilds. Each
# workload has a sibling block here (keyed by workload name), a rootfs-builder
# initContainer, and an images-map pin. These blocks are top-level (NOT under
# `workloads`) so the pinned repository/tag never leak into FC_INVOKE_WORKLOADS,
# whose fields must match the daemon's config.Workload JSON tags exactly.
semgrep:
  guestImage:
    repository: ghcr.io/jomcgi/homelab/projects/firecracker/semgrep/guest
    tag: latest

# The agent (goosecracker) guest image the agent workload's base rootfs is built
# from. Repository + tag are Bazel-pinned from the guest image's .info provider
# at chart-build (see chart/BUILD `images` -> "agent.guestImage").
agent:
  guestImage:
    repository: ghcr.io/jomcgi/homelab/projects/firecracker/goosecracker/guest
    tag: latest

# The sandbox guest image the sandbox workload's base rootfs is built from
# (ADR agents/044): a zero-egress python executor. Bazel-pinned from the guest
# image's .info provider at chart-build (see chart/BUILD -> "sandbox.guestImage").
sandbox:
  guestImage:
    repository: ghcr.io/jomcgi/homelab/projects/firecracker/sandbox/guest
    tag: latest

# Tools image (crane + e2fsprogs) the base-rootfs initContainer runs to build
# the ext4 base rootfs in-cluster, removing any manual node-4 sudo step. A generic
# crane + mkfs.ext4 image (projects/firecracker/substrate/rootfs-builder). Bazel-pinned.
rootfsBuilder:
  image:
    repository: ghcr.io/jomcgi/homelab/projects/firecracker/substrate/rootfs-builder
    tag: latest
  # Size of the ext4 base rootfs image built from a guest filesystem (the
  # semgrep guest carries semgrep, the Pro engine and merged rules). 4G covers
  # a ~3G guest with headroom.
  rootfsSize: 4G

# Private GHCR pull credentials. The fc-invoke daemon image and (via the
# rootfs-builder's crane export) the proprietary guest images are private GHCR
# packages, so both the kubelet and crane authenticate with a dockerconfigjson
# synced from the cluster's ghcr-read-permissions 1Password item.
imagePullSecret:
  enabled: false
  create: true
  name: ghcr-imagepull-secret
  onepassword:
    itemPath: "vaults/k8s-homelab/items/ghcr-read-permissions"

replicas: 1

podAnnotations: {}

# Caller authentication for POST /invoke (STPA: unauthenticated /invoke). The
# daemon verifies each caller's Kubernetes ServiceAccount bearer token via the
# TokenReview API and admits only allowedCallers. This is the PORTABLE control:
# it lives in the daemon, not the mesh, so it holds on any cluster. `enabled`
# also gates the system:auth-delegator ClusterRoleBinding the TokenReview call
# needs (see templates/rbac.yaml). When enabled, allowedCallers MUST be non-empty
# (a consuming deploy sets it) or the daemon runs open and warns at startup.
auth:
  enabled: false
  # Full Kubernetes usernames permitted to invoke, e.g.
  # "system:serviceaccount:<namespace>:<serviceaccount>". Joined into
  # FC_INVOKE_ALLOWED_CALLERS. Empty here; the real list lives in deploy/values.yaml.
  allowedCallers: []

# Linkerd-native authorization for /invoke (homelab defence-in-depth on top of
# the daemon's TokenReview control). Off by default because it depends on the
# pod being meshed; a consuming deploy in a Linkerd namespace flips it on and
# lists the caller mesh identities.
linkerdPolicy:
  enabled: false
  # Mesh identities allowed to reach /invoke, e.g.
  # "monolith.monolith.serviceaccount.identity.linkerd.cluster.local".
  allowedIdentities: []

# Safe-rollout drain budget. On SIGTERM the daemon stops accepting new invokes
# and waits up to drain.timeoutSeconds for in-flight guests to finish before
# exiting, so a rollout (or any pod delete) never drops a running task. This
# MUST cover the longest workload requestTimeout (agent: 600s below) or a
# mid-flight goose run is cut short. terminationGracePeriodSeconds is set to
# drain.timeoutSeconds + 30s of margin so Kubernetes does not SIGKILL the pod
# mid-drain (the guest response still needs to flush and the microVM be
# discarded after the request context ends). Raise this in lockstep if any
# workload's requestTimeout grows past it.
drain:
  timeoutSeconds: 600

# FC guests are node/arch-affine. Node self-identifies via the downward API
# (spec.nodeName) and arch defaults to the daemon's runtime.GOARCH (the image is
# per-arch), so neither is hardcoded here. Add `arch: <goarch>` only to override.

# FC nodes are selected by label, not hostname (ADR agents/037), so enrolling or
# replacing the node is `kubectl label node <n> homelab.io/firecracker=true`
# rather than a chart edit. INVARIANT: exactly one node carries this label until
# ADR-031 cross-node placement lands. This is a replicas:1 Deployment whose daemon
# owns node-local scratch + warm-base snapshots, so a second labeled node would
# let the single pod flap between nodes and lose that state. Labeling a second
# node is the trigger to do the DaemonSet + placement work, not a supported state.
nodeSelector:
  homelab.io/firecracker: "true"

# Disposable scanner tier (ADR platform/010): microVM workloads must die before
# inference or the database under memory pressure, so the pod takes the lowest
# priority.
priorityClassName: homelab-disposable

tolerations: []
affinity: {}

# HTTP listener callers reach (POST /invoke/{workload}, GET /healthz). The
# Service exposes this port in-cluster; the daemon binds :{{ port }} via
# FC_INVOKE_LISTEN_ADDR.
service:
  port: 8080

# The named workload table fc-invoke reads. Rendered verbatim to
# FC_INVOKE_WORKLOADS as JSON via toJson, so field names MUST match the JSON
# tags in invoke/internal/config Workload (image, rootfsPath, vcpus, memMib,
# concurrency, egressEnabled, egressSecrets, warmBase, readyPath, sessioned,
# requestTimeout). rootfsPath is where the per-workload rootfs-builder writes
# the base ext4 image and MUST equal the builder's target path.
#
# The daemon caps live microVMs per workload at `concurrency`; extra invokes
# queue. Firecracker hard-caps each guest's RAM, so concurrency * memMib is a
# true upper bound on microVM memory in this container's cgroup. `resources`
# below must hold that peak plus the daemon.
workloads:
  semgrep:
    image: semgrep-guest
    rootfsPath: /disks/nvme-02/fc-invoke/semgrep/rootfs.ext4
    harnessInit: /usr/local/bin/semgrep-guest-init
    # Right-sized from measured per-invocation stats (fc.guest.* span attrs):
    # single-file scans (the diff-hook usage) run single-core, so 1 vcpu matches
    # the observed 1 core. Memory is NOT sized to the steady scan (~394Mi): the
    # high-water is the rule-compile during base build, where semgrep-core peaked
    # at ~697Mi anon-rss (768Mi OOM-killed it in-guest on 0.4.49). 1536Mi clears
    # that peak plus guest-OS overhead with headroom, still a 25% cut from 2048.
    vcpus: 1
    memMib: 1536
    # node-4 is 8 physical cores + hyperthreading = 16 logical. Measured at
    # concurrency 12 (post auth-throttle fix): semgrep 15.8/s (+76% over 6),
    # exec p50 ~flat, node peaking at 16.1 cores, so HT siblings DO contribute
    # (the earlier "collapse at 15" datum was the client-go 5 QPS TokenReview
    # throttle, not HT contention). 16 = all logical cores: node-4's co-tenants
    # idle at ~0.4 cores and a load test is a 60s burst, so briefly out-weighing
    # them is an accepted trade for absolute throughput. Past 16 there is no
    # silicon left, only queue depth. See the cpu request below, which
    # weight-protects the scan cores under contention.
    concurrency: 16
    egressEnabled: false
    warmBase: true
    readyPath: /shim/ready
    sessioned: false
    requestTimeout: 90s
  # The semgrep-full workload (ADR tooling/011): a whole-repo INTERFILE scan. Same
  # semgrep-guest image as `semgrep`, but its lean init (harnessInit below) skips
  # the warm mcp scan-server and instead runs `semgrep scan --pro` as a subprocess
  # over the materialized tree, so cross-file dataflow fires (mcp --pro is
  # single-file only). warmBase:false because there is no resident child to
  # snapshot; each scheduled run cold-boots. Footprint is generous pending a
  # measured run (ADR 011 open question): interfile holds cross-file state for
  # ~750 files, well above the 697Mi rule-compile peak the 1.5G single-file
  # workload was sized to. concurrency:1 (one scheduled full scan at a time, never
  # a hot path). node-4 has 64.9GiB; worst-case guest RAM with this added
  # (semgrep 16*1536 + agent 2*4096 + sandbox 1*512 + this 1*8192 = ~41GiB) fits.
  semgrep-full:
    image: semgrep-guest
    rootfsPath: /disks/nvme-02/fc-invoke/semgrep/rootfs.ext4
    harnessInit: /usr/local/bin/semgrep-full-guest-init
    vcpus: 4
    memMib: 8192
    concurrency: 1
    egressEnabled: false
    warmBase: false
    readyPath: /shim/ready
    sessioned: false
    requestTimeout: 600s
  # The agent (goosecracker) workload: a goose coding agent served over the
  # guest shim HTTP handler. warmBase:false = cold boot per invoke (the agent's
  # slow part is model inference, not boot, so a warm snapshot buys little and
  # costs a resident base VM). sessioned:true so the orchestrator can carry a
  # session across turns (delivered to the guest via /invoke/{workload}/{session}).
  # egressEnabled:true so the guest reaches the in-cluster model + monolith via
  # the egress-proxy sidecar (egress.enabled must be true; see deploy/values.yaml).
  agent:
    image: agent-guest
    rootfsPath: /disks/nvme-02/fc-invoke/agent/rootfs.ext4
    harnessInit: /usr/local/bin/fc-agent-init
    vcpus: 4
    memMib: 4096
    concurrency: 2
    egressEnabled: true
    warmBase: false
    readyPath: /shim/ready
    sessioned: true
    requestTimeout: 600s
  # The sandbox workload (ADR agents/044): one-shot python execution for chat
  # and agent surfaces that need a deterministic answer without a full goose
  # run. warmBase:true so the pre-imported scientific-library page cache is
  # resident at restore (the guest primes then flips /shim/ready, and the warm
  # snapshot is taken after). sessioned:false because every request is
  # independent by design. egressEnabled:false: the guest holds nothing and
  # reaches nothing; the microVM is the only thing standing between untrusted
  # code and the host, which is the entire point.
  sandbox:
    image: sandbox-guest
    rootfsPath: /disks/nvme-02/fc-invoke/sandbox/rootfs.ext4
    harnessInit: /usr/local/bin/sandbox-guest-init
    # Right-sized from measured per-invocation stats (fc.guest.* span attrs): a
    # 600k-row pandas workload peaked at ~227Mi and stayed ~1 core, so 1 vcpu /
    # 512Mi keeps ~2x headroom over the heaviest observed run.
    vcpus: 1
    memMib: 512
    # Same core reasoning as semgrep (see its comment). Measured at 12:
    # 52.4/s (+31% over 6), run p50 198ms. Short runs have non-CPU phases
    # (restore, vsock I/O), so 16 also fills scheduler gaps.
    concurrency: 16
    egressEnabled: false
    warmBase: true
    readyPath: /shim/ready
    sessioned: false
    requestTimeout: 30s

# Memory limit holds the capped peak of every workload's guests plus the daemon.
# A load test drives ONE workload to concurrency 16: semgrep 16 * 1536Mi = ~24Gi
# or sandbox 16 * 512Mi = ~8Gi (a monolith one-run guard serializes load tests,
# so they never stack). Even with a concurrent agent run (2 * 4096Mi = 8Gi) plus
# ~1Gi daemon overhead the peak is ~33Gi, so 36Gi keeps margin (node-4 has
# 64Gi and idles ~29Gi used).
# Firecracker guests are child processes in this cgroup, so they count against
# this limit; oom_score_adj makes a guest die first if it is ever breached, never
# the daemon or a node-critical tenant (ADR platform/010).
#
# The CPU REQUEST is load-bearing, not a floor. The guest VMs are 1 vcpu each and
# CPU-bound. cpu.weight is proportional to the request, so a tiny request (the
# old 50m) let co-tenants (clickhouse/signoz) out-compete the VMs for cores
# under contention. 6000m holds ~6 cores of weight under contention and stays
# schedulable on node-4 (~91% requested already); it is deliberately BELOW the
# concurrency 16: there is no CPU limit, so load tests burst to all idle
# cores regardless, and the request only decides who wins when co-tenants are
# busy. Raising it further would overcommit node-4's requests past 100%.
resources:
  requests:
    cpu: 6000m
    memory: 2Gi
  limits:
    memory: 36Gi

# Firecracker substrate paths on node-4. Driving real microVMs (privileged +
# these host mounts) is gated behind `firecracker.enabled`; until then the
# daemon serves /healthz and rejects /invoke (no substrate).
firecracker:
  enabled: false
  # firecracker binary + guest kernel are baked into the image at /opt/fc (see
  # @kata_firecracker in MODULE.bazel), so no node-level /opt/kata install is
  # needed and the daemon's built-in /opt/fc defaults govern. A node only has to
  # provide /dev/kvm and the nvme scratch dir. Set binPath/kernelImagePath here
  # only to override the baked paths.
  # The shared base rootfs is booted READ-ONLY (root=/dev/vda ro): every mutable
  # guest path is a tmpfs, so one read-only rootfs file safely backs every microVM.
  kernelBootArgs: "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda ro"
  # Fallback in-guest init the kernel boots into (a raw FC boot ignores the OCI
  # entrypoint, so the driver appends init=<path>). Each workload sets its own
  # `workloads.<name>.harnessInit` (semgrep-guest-init, fc-agent-init, ...), and
  # the daemon prefers that; this global is used only for a workload that omits
  # it. It matches the daemon's own built-in default, so leave it unless a node
  # needs a different fallback path.
  harnessInit: /usr/local/bin/fc-shim-init
  # The single scratch-disk knob: the whole nvme dir is host-mounted so
  # per-workload rootfs images (workloads.*.rootfsPath) plus the derived FC
  # snapshot dir (<nvmeRoot>/fc-invoke/snapshots) and vsock dir
  # (<nvmeRoot>/fc-invoke-vsock) are all reachable. The snapshot + vsock dirs
  # derive from this in the Deployment, so this is the only path to set per node.
  nvmeRoot: /disks/nvme-02
  # Bias the kernel to kill a guest child, never the daemon, under memory
  # pressure (the disposable-victim intent of ADR platform/010 applied to
  # processes, since guests are not pods). 1000 strictly prefers guests.
  guestOomScoreAdj: 1000
  # Bounds how long an invoke waits for a freshly booted or restored guest to
  # announce readiness over its shim.
  bootReadyTimeout: 60s

# Egress-proxy sidecar (ADR 023). When enabled a pod-local egress-proxy sidecar
# is added; the daemon forwards each egress-enabled workload's guest vsock egress
# to it over localhost (the sidecar is the only process that reaches the network
# on a guest's behalf). Phase 6a is plain allowlist-forward; phase 6b adds the
# TLS-terminate + placeholder-swap path, enabled by a non-empty `secrets` catalog
# (see deploy/values.yaml). Default off. The image repository + tag are
# Bazel-pinned from the egress-proxy image's .info provider at chart-build (see
# chart/BUILD `images`).
egress:
  enabled: false
  # Split-horizon egress posture (ADR 023). external: "allow" (default) routes to
  # any public destination so the agent can read the open internet; "deny" closes
  # it. internal: the cluster is deny-by-default and confined to internal.allowlist;
  # classification is on the resolved IP in the sidecar, so a public name resolving
  # to an internal address is still denied.
  external: allow
  internal:
    # "deny" (default) confines internal egress to `allowlist`; "allow" opens the
    # whole cluster (not recommended).
    default: deny
    # Internal (cluster/private) destinations permitted under deny-by-default, as a
    # YAML list of host[:port] (joined into EGRESS_INTERNAL_ALLOWLIST). Empty until
    # a consuming deploy populates it. Secret egressTo hosts are external and do
    # NOT belong here (external:allow reaches them; the swap is per-host).
    allowlist: []
    # Extra CIDRs classified as internal beyond the baked private/loopback/
    # link-local ranges. This cluster's pod/service/node nets are already RFC1918,
    # so this is usually empty.
    cidrs: []
  # Bazel-pinned at chart-build from the egress-proxy image .info provider.
  image: {}
  # 6b CA (ADR 023): cert-manager generates + rotates a self-signed CA the sidecar
  # uses to mint leaf certs when it TLS-terminates a secret-bearing destination.
  # The CA private key lives only in the sidecar; the public cert is injected into
  # each guest's trust store (by the orchestrator, via the tier env) so the guest
  # trusts the minted leaves without an image rebuild. Only created when `secrets`
  # below is non-empty.
  ca:
    duration: 87600h # 10y; rotation churns guest trust, keep it rare
    renewBefore: 2160h # 90d
  # 6b secret catalog (ADR 023, shaped like the future SecretProxy CRD
  # spec.secrets). Each entry: a high-entropy `placeholder` the guest holds as env
  # `env`; the sidecar swaps it for the real value (`secretRef` {name,key}, or a
  # literal `value` for tests) only on a connection whose host is in `egressTo`.
  # egressTo is the exfiltration control: everywhere else the inert placeholder
  # leaves. Literal swap only (a base64'd git-Basic token is ADR-deferred). Empty
  # here; the real catalog lives in deploy/values.yaml. A non-empty list enables
  # the CA + TLS-terminate path.
  secrets: []
  # Repo convention: memory requests == limits (no memory bursting); CPU is a
  # request only (no CPU limit, to avoid throttling).
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

tracing:
  endpoint: ""
  serviceName: fc-invoke
  serviceVersion: ""

serviceAccount:
  create: true
  name: ""

# Non-privileged by default (uid 65532). When firecracker.enabled is true the
# pod runs privileged with /dev/kvm + the kata/nvme host mounts so it can exec
# firecracker and read/write per-workload rootfs images + snapshots.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
