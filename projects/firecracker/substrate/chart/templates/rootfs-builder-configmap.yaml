{{- if .Values.firecracker.enabled }}
# Build script for the base-rootfs initContainer. Kept in a ConfigMap so it can
# be tuned without rebuilding the tools image. Builds the read-only base ext4
# image a workload's microVMs boot from.
#
# PR2 has ONE workload (semgrep), so this builds exactly the semgrep guest's
# base rootfs. A future enhancement is a per-workload loop (one build per entry
# in .Values.workloads, each from its own guestImage to its own rootfsPath);
# until a second guest image lands, a single hardcoded build is simplest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fc-invoke.fullname" . }}-rootfs-builder
  labels:
    {{- include "fc-invoke.labels" . | nindent 4 }}
data:
  build-base-rootfs.sh: |
    #!/bin/bash
    # Build a workload's base rootfs in-cluster from the pinned guest image, so
    # no human on node-4 with sudo is needed. crane exports the guest filesystem
    # and mkfs.ext4 bakes it into an ext4 image on the mounted nvme disk.
    set -euo pipefail
    : "${GUEST_IMAGE:?GUEST_IMAGE required}"
    : "${BASE_ROOTFS_PATH:?BASE_ROOTFS_PATH required}"
    size="${ROOTFS_SIZE:-4G}"
    base_dir="$(dirname "$BASE_ROOTFS_PATH")"
    marker="$base_dir/.guest-ref"
    mkdir -p "$base_dir"
    # Idempotent: skip the multi-GB rebuild when the base already matches the
    # deployed guest image (pod restarts with an unchanged image are common).
    if [ -f "$BASE_ROOTFS_PATH" ] && [ -f "$marker" ] && [ "$(cat "$marker")" = "$GUEST_IMAGE" ]; then
      echo "base rootfs already current for $GUEST_IMAGE"
      exit 0
    fi
    echo "building base rootfs from $GUEST_IMAGE"
    rm -rf /work/root "$BASE_ROOTFS_PATH.tmp"
    mkdir -p /work/root
    crane export --platform linux/amd64 "$GUEST_IMAGE" - | tar -x -C /work/root
    mkfs.ext4 -q -F -L fcinvokebase -d /work/root "$BASE_ROOTFS_PATH.tmp" "$size"
    mv -f "$BASE_ROOTFS_PATH.tmp" "$BASE_ROOTFS_PATH"
    echo "$GUEST_IMAGE" > "$marker"
    echo "base rootfs built at $BASE_ROOTFS_PATH ($size)"
{{- end }}
