{{- if .Values.ciliumPolicy.enabled }}
# CiliumNetworkPolicy translation of the Linkerd /invoke authorization that used
# to live in templates/linkerd-policy.yaml. ADR platform/012 replaces the
# Linkerd sidecar mesh with Cilium as the CNI.
#
# Cilium runs in policyEnforcementMode=default (allow-until-selected), so this
# rule only restricts the daemon once the gate below is flipped. The daemon's
# own TokenReview control is the PRIMARY gate; this network policy is
# defence-in-depth (STPA: unauthenticated /invoke), exactly as the Linkerd
# Server/AuthorizationPolicy chain was.
#
# Gated off by default (chart/values.yaml); flipped on during the Cilium cutover
# window. Ingress-only: substrate never had an EgressNetwork, so there is no
# egress half to translate.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "fc-invoke.fullname" . }}-invoke
  labels:
    {{- include "fc-invoke.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "fc-invoke.selectorLabels" . | nindent 6 }}
  ingress:
    {{- if .Values.ciliumPolicy.fromNamespaces }}
    # Callers allowed to reach /invoke, by namespace: the Cilium proxy for the
    # Linkerd allowedIdentities mesh-identity list. Today that is the monolith
    # orchestrator (its goosecracker runner and the semgrep MCP tool, both under
    # the monolith ServiceAccount in the monolith namespace). Cilium has no
    # direct ServiceAccount selector, so this authorizes the namespace and the
    # daemon's TokenReview gate still enforces the exact caller identity.
    - fromEndpoints:
        {{- range .Values.ciliumPolicy.fromNamespaces }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ .Values.service.port | quote }}
              protocol: TCP
          # L7 HTTP allow-list (ADR networking/003 #2). Narrows monolith-namespace
          # callers from "any request on this port" to exactly the real invoke
          # surface: POST /invoke/<workload>[/<session>]. Cilium matches `path` as an
          # RE2 regex over the full request path, so `/invoke/.*` covers both the
          # one-segment (/invoke/sandbox, /invoke/semgrep) and two-segment
          # (/invoke/agent/{session}) forms plus any query string. `.` matches `/` in
          # RE2, which is why a single `.*` spans the optional session segment.
          #
          # Applying rules.http redirects these flows through the per-node Envoy,
          # which is also what makes Hubble emit the httpv2 metrics the companion
          # SigNoz alert (signoz-addons/alerts/.../hubble-invoke-http.yaml) reads.
          #
          # Allow-list semantics: anything not listed is DENIED. Every in-cluster
          # caller was verified to use POST /invoke/... only (sandbox, goosecracker
          # runner, semgrep_scan, demos/loadtest); none GETs /healthz over the
          # Service. The kubelet /healthz probe arrives via the separate
          # `fromEntities: host, health` rule below (no toPorts, so all ports/paths
          # allowed for those identities) and is unaffected by this L7 narrowing.
          #
          # Shadowing (ADR "L4 shadows L7" gotcha): no L4-only allow covers this port
          # for the monolith source identity, this is the only toPorts on this rule,
          # and the host/health rule is a different source identity, so the L7 filter
          # is not shadowed and genuinely enforces.
          rules:
            http:
              - method: "POST"
                path: "/invoke/.*"
    {{- end }}
    # kubelet liveness/readiness probes originate from the node host. Linkerd
    # auto-authorized these; once an ingress rule makes the endpoint
    # default-deny, Cilium needs them allowed explicitly or the pod never goes
    # Ready. `health` covers the cilium-health checker.
    - fromEntities:
        - host
        - health
{{- end }}
