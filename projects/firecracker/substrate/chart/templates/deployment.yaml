apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fc-invoke.fullname" . }}
  labels:
    {{- include "fc-invoke.labels" . | nindent 4 }}
spec:
  # Single replica: the daemon is node-affine (FC guests are node-bound) and owns
  # its node's scratch disk. Recreate, never run two against the same node.
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    # Single-Deployment chart: the shared-selector collision this rule guards
    # against cannot occur, and adding a component label would break ArgoCD sync
    # on the immutable selector rather than fix anything.
    matchLabels:
      # nosemgrep: bazel.semgrep.rules.kubernetes.require-component-label-in-selector
      {{- include "fc-invoke.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fc-invoke.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Safe-rollout drain: give the daemon time to finish in-flight invokes on
      # SIGTERM before Kubernetes SIGKILLs it. Set above drain.timeoutSeconds (the
      # daemon's own drain budget, FC_INVOKE_DRAIN_TIMEOUT below) so the grace
      # window always outlasts the drain. See values.yaml `drain`.
      terminationGracePeriodSeconds: {{ add .Values.drain.timeoutSeconds 30 }}
      serviceAccountName: {{ include "fc-invoke.serviceAccountName" . }}
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClassName }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.firecracker.enabled }}
      # Driving Firecracker needs the host KVM device and the nvme scratch dir
      # (the firecracker binary + guest kernel are baked into the image at
      # /opt/fc). Privileged (CAP_SYS_ADMIN) is also required for the
      # per-instance vsock mount namespaces.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      {{- else }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if and .Values.firecracker.enabled .Values.workloads }}
      # Build each workload's base rootfs in-cluster from its pinned guest image,
      # so the node never needs a manual sudo rootfs placement. One builder per
      # workload that declares a top-level `<name>.guestImage` block (Bazel pins
      # its repository:tag from the guest image's .info provider); the builder
      # bakes that guest's filesystem into the workload's rootfsPath. Idempotent:
      # each rebuilds only when its guest image ref changes. Init containers run
      # sequentially and share /work, which each build clears before use.
      initContainers:
        {{- range $name, $wl := .Values.workloads }}
        {{- $top := index $.Values $name }}
        {{- if and $top $top.guestImage $top.guestImage.repository }}
        - name: build-{{ $name }}-rootfs
          image: "{{ $.Values.rootfsBuilder.image.repository }}@{{ $.Values.rootfsBuilder.image.digest }}"
          command: ["/bin/bash", "/scripts/build-base-rootfs.sh"]
          env:
            - name: GUEST_IMAGE
              value: "{{ $top.guestImage.repository }}:{{ $top.guestImage.tag }}"
            - name: BASE_ROOTFS_PATH
              value: {{ $wl.rootfsPath | quote }}
            - name: ROOTFS_SIZE
              value: {{ $.Values.rootfsBuilder.rootfsSize | quote }}
            {{- if $.Values.imagePullSecret.enabled }}
            # crane reads $DOCKER_CONFIG/config.json to pull the private guest
            # images (proprietary engines / rules).
            - name: DOCKER_CONFIG
              value: /ghcr
            {{- end }}
          volumeMounts:
            - name: nvme
              mountPath: {{ $.Values.firecracker.nvmeRoot }}
            - name: rootfs-builder-script
              mountPath: /scripts
              readOnly: true
            - name: rootfs-builder-work
              mountPath: /work
            {{- if $.Values.imagePullSecret.enabled }}
            - name: ghcr-creds
              mountPath: /ghcr
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 512Mi
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: fc-invoke
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.firecracker.enabled }}
          securityContext:
            privileged: true
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: FC_INVOKE_LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            # Node self-identifies from the downward API so snapshot node-pinning
            # is correct wherever the daemon lands (relabel to another node needs
            # no values edit). Arch is left to the daemon's runtime.GOARCH (the
            # image is per-arch, so the compiled arch matches the node); set
            # .Values.arch only to override.
            - name: FC_INVOKE_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Graceful-drain budget (safe rollout): how long the daemon waits for
            # in-flight invokes before exiting on SIGTERM. Pinned from
            # drain.timeoutSeconds; terminationGracePeriodSeconds is set above it.
            - name: FC_INVOKE_DRAIN_TIMEOUT
              value: "{{ .Values.drain.timeoutSeconds }}s"
            {{- with .Values.arch }}
            - name: FC_INVOKE_ARCH
              value: {{ . | quote }}
            {{- end }}
            # The named workload table, rendered as JSON. The daemon builds one
            # Invoker (its own FC driver: base rootfs + sizing) per entry. Field
            # names must match invoke/internal/config Workload JSON tags.
            - name: FC_INVOKE_WORKLOADS
              value: {{ .Values.workloads | toJson | quote }}
            {{- if .Values.auth.enabled }}
            # Caller allow-list for /invoke: the daemon TokenReview-validates each
            # caller's SA bearer token and admits only these identities. Set only
            # when auth is enabled; unset means the daemon runs open and warns.
            - name: FC_INVOKE_ALLOWED_CALLERS
              value: {{ join "," .Values.auth.allowedCallers | quote }}
            {{- end }}
            {{- if .Values.firecracker.enabled }}
            # firecracker binary + kernel are baked into the image at /opt/fc, so
            # the daemon's built-in defaults govern; set binPath/kernelImagePath
            # only to override the baked paths.
            {{- with .Values.firecracker.binPath }}
            - name: FC_INVOKE_FIRECRACKER_BIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.firecracker.kernelImagePath }}
            - name: FC_INVOKE_KERNEL_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.firecracker.kernelBootArgs }}
            - name: FC_INVOKE_KERNEL_BOOT_ARGS
              value: {{ . | quote }}
            {{- end }}
            - name: FC_INVOKE_HARNESS_INIT
              value: {{ .Values.firecracker.harnessInit | quote }}
            # Per-invoke FC bundle snapshots and the fixed vsock dir the snapshot
            # embeds (the launcher bind-mounts each microVM's bundle over it per
            # instance so concurrent restores each get their own host socket).
            # Both derive from nvmeRoot so the scratch disk is the single knob.
            - name: FC_INVOKE_SNAPSHOT_ROOT
              value: {{ printf "%s/fc-invoke/snapshots" .Values.firecracker.nvmeRoot | quote }}
            - name: FC_INVOKE_CANONICAL_VSOCK_DIR
              value: {{ printf "%s/fc-invoke-vsock" .Values.firecracker.nvmeRoot | quote }}
            - name: FC_INVOKE_GUEST_OOM_SCORE_ADJ
              value: {{ .Values.firecracker.guestOomScoreAdj | quote }}
            - name: FC_INVOKE_BOOT_READY_TIMEOUT
              value: {{ .Values.firecracker.bootReadyTimeout | quote }}
            {{- end }}
            {{- with .Values.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | quote }}
            {{- with .Values.tracing.serviceVersion }}
            - name: OTEL_SERVICE_VERSION
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.firecracker.enabled }}
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            - name: nvme
              mountPath: {{ .Values.firecracker.nvmeRoot }}
          {{- end }}
        {{- if .Values.egress.enabled }}
        # Egress-proxy sidecar (ADR 023 phase 6a, plain allowlist-forward): the
        # only process that reaches the network on a guest's behalf. The daemon
        # forwards each selected guest's vsock egress here over localhost;
        # the sidecar never sees the guest's control frames. Pod-level: one sidecar
        # serves the workloads selected by noded on the node. Runs non-root (uid
        # 65532). Plain mode: NO secret catalog / CA / secret-swap (a later PR).
        - name: egress-proxy
          image: "{{ .Values.egress.image.repository }}@{{ .Values.egress.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # The daemon tunnels to 127.0.0.1:8888 by default
            # (FC_INVOKE_EGRESS_SIDECAR_ADDR); the sidecar listens on the same
            # loopback address. This bind is load-bearing because the sidecar has
            # no client authentication and holds the real credential.
            - name: EGRESS_LISTEN
              value: "127.0.0.1:8888"
            # Split-horizon egress guardrail (ADR 023). external: public egress
            # posture ("allow" default lets the agent read the open internet).
            # internal: the cluster is deny-by-default, confined to
            # internal.allowlist; classification is on the resolved IP in the
            # sidecar. Secret egressTo hosts are external, so they are reached via
            # external:allow and are NOT listed in the internal allowlist.
            - name: EGRESS_EXTERNAL
              value: {{ .Values.egress.external | default "allow" | quote }}
            - name: EGRESS_INTERNAL_DEFAULT
              value: {{ .Values.egress.internal.default | default "deny" | quote }}
            {{- with .Values.egress.internal.allowlist }}
            # Internal destinations permitted under deny-by-default. YAML list for
            # readability; joined into the comma-separated form the sidecar parses.
            - name: EGRESS_INTERNAL_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.egress.internal.cidrs }}
            # Extra CIDRs classified as internal, on top of the baked
            # private/loopback/link-local ranges. This cluster's pod/service/node
            # nets already fall inside RFC1918, so these are usually redundant.
            - name: EGRESS_INTERNAL_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.egress.secrets }}
            # Credential injection (ADR 023 6b). EGRESS_SECRETS is the non-secret
            # catalog (header -> env -> egressTo); the real value of each is
            # supplied below from its Secret (or a literal for tests). The CA
            # (cert + key) is mounted so the sidecar can mint leaves; the key
            # never leaves here.
            #
            # This emits header/valuePrefix, NOT placeholder. The sidecar dropped
            # substring substitution for header injection, and its loadSecrets
            # calls os.Exit on an entry with no header, so a catalog built the old
            # way does not degrade: the container refuses to start, the pod never
            # goes Ready, and the Service loses its only endpoint. Emitting the
            # shape the binary actually parses is what keeps this chart and that
            # binary shippable in the same release.
            {{- $catalog := list }}
            {{- range $s := .Values.egress.secrets }}
            {{- $catalog = append $catalog (dict "header" $s.header "valuePrefix" ($s.valuePrefix | default "") "env" $s.env "egressTo" $s.egressTo) }}
            {{- end }}
            - name: EGRESS_SECRETS
              value: {{ $catalog | toJson | quote }}
            - name: EGRESS_CA_CERT_FILE
              value: /etc/egress-ca/tls.crt
            - name: EGRESS_CA_KEY_FILE
              value: /etc/egress-ca/tls.key
            {{- range $s := .Values.egress.secrets }}
            - name: {{ $s.env }}
              {{- if $s.secretRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.secretRef.name }}
                  key: {{ $s.secretRef.key }}
              {{- else }}
              value: {{ $s.value | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
          {{- if .Values.egress.secrets }}
          volumeMounts:
            - name: egress-ca
              mountPath: /etc/egress-ca
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
        {{- end }}
      {{- if or .Values.firecracker.enabled (and .Values.egress.enabled .Values.egress.secrets) }}
      volumes:
        {{- if and .Values.egress.enabled .Values.egress.secrets }}
        # cert-manager-issued egress CA (cert + key), mounted into the sidecar only.
        # Independent of firecracker.enabled so the sidecar's volumeMount never
        # dangles: the secret-swap feature does not require the FC driver.
        - name: egress-ca
          secret:
            secretName: {{ include "fc-invoke.fullname" . }}-egress-ca
        {{- end }}
        {{- if .Values.firecracker.enabled }}
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: nvme
          hostPath:
            path: {{ .Values.firecracker.nvmeRoot }}
            type: Directory
        {{- if .Values.workloads }}
        - name: rootfs-builder-script
          configMap:
            name: {{ include "fc-invoke.fullname" . }}-rootfs-builder
        - name: rootfs-builder-work
          emptyDir: {}
        {{- if .Values.imagePullSecret.enabled }}
        - name: ghcr-creds
          secret:
            secretName: {{ .Values.imagePullSecret.name }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
