nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/jomcgi/homelab/projects/firecracker/git-mirror
  tag: latest
  pullPolicy: Always

# List of repos to mirror. Each entry: name (used as the bare clone dir
# <name>.git under the mirrors volume) and url (upstream fetch URL). The
# supervisor clones each repo on first start if absent, configures
# +refs/heads/*:refs/heads/* and +refs/tags/*:refs/tags/* as the only fetch
# refspecs (never refs/agents/**), and installs a pre-receive hook that
# restricts pushes to refs/agents/** only. Structured so a DB-backed registry
# can replace this static list later (ADR 041 open question 2).
#
# Names follow the GitHub owner/repo convention (ADR 029): the name is the ACL
# scope, the /agent dropdown label, the on-disk mirror dir, and the git-daemon
# path all at once, so mirroring the GitHub path keeps every collaborator repo
# self-documenting. A slash just nests the bare clone (/mirrors/owner/repo.git);
# git clone --bare mkdir-ps the parent and git-daemon's enter_repo() resolves the
# nested path + .git suffix exactly as it does for a flat name.
repos:
  - name: jomcgi/homelab
    url: https://github.com/jomcgi/homelab.git
  # loom is a PRIVATE repo under the weave-hand org (50:50 with Rowan). The mirror
  # clones it via the mirror-side githubToken + insteadOf auth below; the token
  # must have weave-hand read access or the clone non-fatally skips.
  - name: weave-hand/loom
    url: https://github.com/weave-hand/loom.git
  # Collaborator forks, public, opted in per-server via the ACL (ADR 029). Public
  # so no mirror-side creds are needed.
  - name: colincee/homelab
    url: https://github.com/ColinCee/homelab.git
  - name: scotscottmca/parkedlikea
    url: https://github.com/scotscottmca/parkedlikea.git

# Seconds between git fetch --prune passes. Keep short enough that guests
# hydrate from a near-head branch, long enough not to hammer GitHub rate limits.
refreshIntervalSeconds: 60

# Port git-daemon listens on (git:// protocol). Matches the internalAllowlist
# entry in the fc-invoke egress config.
gitDaemonPort: 9418

# Stale scratch-ref GC. Set to a positive integer to delete refs/agents/** refs
# older than this many days and run git gc --auto after each refresh pass.
# 0 (default) disables GC entirely; enable once scratch refs accumulate.
gcRetentionDays: 0

# Persistent volume for bare clone storage. All repos + their scratch refs live
# here across pod restarts. The registered repos total well under 200Mi of
# history (jomcgi/homelab dominates at ~125Mi; the collaborator forks are a few
# Mi each), so 10Gi is ample headroom for their history plus agent scratch refs.
mirrors:
  storageClass: longhorn
  size: 10Gi

# Pin to node-4: Firecracker guests are node-bound and reach the mirror via
# the egress-proxy sidecar's node-local hop. This deployment must be co-located.
nodeSelector:
  kubernetes.io/hostname: node-4

tolerations: []
affinity: {}

# Linkerd injection disabled: the mirror is an in-cluster TCP service reached
# via the egress-proxy; Linkerd sidecars are not needed here and would add
# unnecessary latency and resource overhead to a node-local hop.
podAnnotations:
  linkerd.io/inject: disabled

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Resource sizing: git-daemon is lightweight, but the refresh loop's `git fetch`
# / index-pack (and the periodic `git gc --auto`) hold delta bases in memory
# proportional to the repo. homelab.git alone is ~215Mi on disk (167Mi pack), so
# a 256Mi limit OOM-killed every fetch (exit 137) and froze the mirror 10 days
# behind main, silently serving a stale tree to agent workspaces. 1Gi gives
# index-pack/gc ~5x the pack size in headroom. CPU request only (no limit per
# repo convention); memory request = limit.
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 1Gi

serviceAccount:
  create: false
  name: ""

# Reference the shared GHCR pull secret so the kubelet can pull the private
# git-mirror image. The secret (a dockerconfigjson OnePasswordItem) is created by
# the fc-invoke chart in this namespace; git-mirror only references it, it does
# not create it.
imagePullSecret:
  enabled: true
  name: ghcr-imagepull-secret

# Mirror-side GitHub read token so the mirror can clone PRIVATE repos (e.g. loom).
# The token lives ONLY in this trusted pod (written to the ephemeral HOME as a
# credential store by the supervisor); it is never on the PVC and never in a
# guest (guests clone from the mirror over git:// with no credential). Reuses the
# in-namespace token synced from 1Password. A dedicated fine-grained read-only PAT
# scoped to just these repos would be tighter; a follow-up.
githubToken:
  enabled: true
  secretRef:
    name: monolith-chat-secrets
    key: GITHUB_TOKEN
