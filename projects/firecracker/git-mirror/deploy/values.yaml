# Cluster overrides for git-mirror. The supervisor runs on node-4 and keeps
# bare clones of registered repos warm via git daemon :9418, so Firecracker
# agent guests can clone their workspace from a fast in-cluster mirror instead
# of fetching from GitHub on every turn.
#
# The service is reachable at:
#   git-mirror.monolith.svc.cluster.local:9418
#
# Add this to the fc-invoke egress internalAllowlist before agents use it:
#   - git-mirror.monolith.svc.cluster.local:9418
# Names follow the GitHub owner/repo convention (ADR 029): the name is the ACL
# scope, the /agent dropdown label, and the git-daemon path. Keep in sync with
# chart/values.yaml.
repos:
  - name: jomcgi/homelab
    url: https://github.com/jomcgi/homelab.git
  # loom is PRIVATE, under the weave-hand org (not jomcgi). The mirror clones it
  # via the mirror-side githubToken + insteadOf rewrite; the token has weave-hand
  # read access. A jomcgi/loom URL 404s and the clone non-fatally skips, so
  # weave-hand/loom is "not exported" to guests.
  - name: weave-hand/loom
    url: https://github.com/weave-hand/loom.git
  # Public collaborator forks, opted in per-server via the ACL (ADR 029).
  - name: colincee/homelab
    url: https://github.com/ColinCee/homelab.git
  - name: scotscottmca/parkedlikea
    url: https://github.com/scotscottmca/parkedlikea.git

refreshIntervalSeconds: 60

# GC disabled by default. Enable once scratch refs accumulate to bound PVC growth.
gcRetentionDays: 0

mirrors:
  storageClass: longhorn
  size: 10Gi
