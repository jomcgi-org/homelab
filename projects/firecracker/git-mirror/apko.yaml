contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - ca-certificates-bundle
    - coreutils
    - git
    # git-daemon: the `git daemon` subcommand is a separate wolfi package, not
    # part of `git`; without it the supervisor fails with "'daemon' is not a git
    # command" and the mirror serves nothing.
    - git-daemon
    - tzdata

archs:
  - x86_64
  - aarch64

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /tmp

paths:
  - path: /mirrors
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
