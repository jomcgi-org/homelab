# Goose configuration baked into the goose-agent container image.
# Provider and model are set via environment variables (GOOSE_PROVIDER, GOOSE_MODEL)
# injected by the SandboxTemplate, not hardcoded here.
#
# Extensions configured here apply only to BARE (non-recipe) goose sessions.
# Every goosecracker session runs through a recipe (agent.yaml or a
# sub-recipe), and a recipe's own `extensions:` list REPLACES this config's
# extension set rather than adding to it (goose only utilizes the
# explicitly listed extensions), so recipe sessions never see context-forge:
# they all list only `developer`. Guest MCP access for recipe sessions is
# pending the per-tier MCP ACL ADR.
#
# Extensions configured:
#   - developer (builtin): filesystem, shell, editor scoped to /workspace
#   - context-forge (remote): SigNoz observability, ArgoCD, Kubernetes via MCP
#     gateway, used only by bare sessions (e.g. debugging). In-cluster access
#     via ClusterIP, no auth required (see ADR 006).
#   - github: gh CLI is available in PATH (with GITHUB_TOKEN) for PR/issue operations
extensions:
  developer:
    bundled: true
    enabled: true
    name: developer
    timeout: 300
    type: builtin
  context-forge:
    enabled: true
    name: context-forge
    timeout: 300
    type: streamable_http
    uri: http://context-forge-gateway-mcp-stack-mcpgateway.mcp.svc.cluster.local:80/mcp/
