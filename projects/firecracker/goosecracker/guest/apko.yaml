contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - busybox
    - ca-certificates-bundle
    - coreutils
    - curl
    - git
    - gh
    - go
    - jq
    # Runtime libs the goose binary dynamically links (libgomp.so.1,
    # libstdc++.so.6, libgcc_s.so.1); without them goose exits 127 at load.
    - libgcc
    - libgomp
    - libstdc++
    - nodejs
    - openssh-client
    - pnpm
    # sqlite3 CLI: fc-agent-init checkpoints goose's WAL into sessions.db before
    # shipping it for session resume (ADR 026 Phase 2); goose does not checkpoint
    # on exit, so without this the shipped db is empty.
    - sqlite
    - tzdata

archs:
  - x86_64
  - aarch64

accounts:
  groups:
    - groupname: goose-agent
      gid: 65532
  users:
    - username: goose-agent
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  TZ: Europe/Dublin
  HOME: /home/goose-agent
  GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no

paths:
  - path: /home/goose-agent
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/goose-agent/.ssh
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /home/goose-agent/.config/goose
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/goose-agent/.claude
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /workspace
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/local/bin/fc-agent-init
