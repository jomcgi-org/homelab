contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    # coreutils provides /usr/bin/uname: the Pro engine's bundled OpenTelemetry
    # client probes the OS via `uname -s` to build its X509 authenticator at
    # startup and crashes fatally if uname is absent (busybox does not expose it
    # where the engine's execvp looks). bash covers shell-outs. Both mirror the
    # sibling goose harness image's userland.
    - bash
    - coreutils
    - ca-certificates-bundle
    - git
    # Runtime libs the Pro engine (osemgrep-pro / semgrep-core, native binaries
    # baked by engine_tar) dynamically links (libstdc++.so.6, libgcc_s.so.1,
    # libgomp.so.1); without them the engine exits 127 at load.
    - libgcc
    - libgomp
    - libstdc++
    # pysemgrep CLI. No longer used at runtime: the offline-Pro scan-server
    # (osemgrep-pro) is self-contained and replaced the old resident `semgrep lsp`.
    # Retained for now to avoid an apko.lock regeneration; slated for removal in a
    # follow-up to shrink the image (drops python3 too).
    - semgrep

archs:
  - x86_64

# Run as root: this image is the PID 1 of a raw Firecracker microVM. Boot leaves
# loopback DOWN and semgrep-guest-init brings `lo` UP via a SIOCSIFFLAGS ioctl
# (CAP_NET_ADMIN) before anything binds 127.0.0.1. No accounts/run-as block, so
# the default uid 0 applies.

entrypoint:
  command: /usr/local/bin/semgrep-guest-init

environment:
  # The offline-Pro scan-server binary, baked by engine_tar. It is the
  # proprietary engine placed as osemgrep-pro (argv[0] dispatch) with semgrep-core
  # co-located in the same dir. guest-init also defaults this path.
  OSEMGREP_PRO_BIN: /opt/semgrep/osemgrep-pro
  # Rule dir the scan-server loads (SEMGREP_SCAN_RULES), baked by rules_tar;
  # matches the guest-init default.
  SEMGREP_SCAN_RULES: /etc/semgrep/rules
