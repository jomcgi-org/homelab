<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 212" width="100%" role="img" aria-label="Why snapshot: warm restore about 0.72 seconds every scan, cold-boot fallback about 6.7 seconds, base build about 14.3 seconds once at startup. A red dotted line marks the roughly 6 second boot saving per scan."><style>text{font-family:"JetBrains Mono","SF Mono",ui-monospace,"Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;}</style><rect x="0" y="0" width="1100" height="212" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#111111"/></marker><marker id="arrowR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc3b2b"/></marker><pattern id="clh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#f2906f" stroke-width="2.4"/></pattern></defs><line x1="46.0" y1="28.0" x2="46.0" y2="188.0" stroke="#e6e0d2" stroke-width="1"/><line x1="232.8" y1="28.0" x2="232.8" y2="188.0" stroke="#e6e0d2" stroke-width="1"/><line x1="419.6" y1="28.0" x2="419.6" y2="188.0" stroke="#e6e0d2" stroke-width="1"/><line x1="606.4" y1="28.0" x2="606.4" y2="188.0" stroke="#e6e0d2" stroke-width="1"/><line x1="793.2" y1="28.0" x2="793.2" y2="188.0" stroke="#e6e0d2" stroke-width="1"/><line x1="980.0" y1="28.0" x2="980.0" y2="188.0" stroke="#e6e0d2" stroke-width="1"/><text x="46.0" y="30.0" fill="#111111" font-size="10.5" text-anchor="start" font-weight="800" letter-spacing=".01em">warm restore</text><text x="136.8" y="30.0" fill="#6b6357" font-size="9" text-anchor="start" font-weight="500" letter-spacing="0">·  every scan</text><rect x="46.0" y="36.0" width="45.1" height="24.0" fill="#8fce6f" stroke="#111111" stroke-width="1.8"/><text x="46.0" y="82.0" fill="#111111" font-size="10.5" text-anchor="start" font-weight="800" letter-spacing=".01em">cold-boot fallback</text><text x="175.2" y="82.0" fill="#6b6357" font-size="9" text-anchor="start" font-weight="500" letter-spacing="0">·  only if the base is missing / failed</text><rect x="46.0" y="88.0" width="418.7" height="24.0" fill="#f2906f" stroke="#111111" stroke-width="1.8"/><text x="474.7" y="104.0" fill="#111111" font-size="11.5" text-anchor="start" font-weight="800" letter-spacing="0">~6.7 s</text><text x="46.0" y="134.0" fill="#111111" font-size="10.5" text-anchor="start" font-weight="800" letter-spacing=".01em">base build</text><text x="124.0" y="134.0" fill="#6b6357" font-size="9" text-anchor="start" font-weight="500" letter-spacing="0">·  once at daemon startup — async, off the hot path</text><rect x="46.0" y="140.0" width="890.4" height="24.0" fill="#6c9bf5" stroke="#111111" stroke-width="1.8"/><text x="946.4" y="156.0" fill="#111111" font-size="11.5" text-anchor="start" font-weight="800" letter-spacing="0">~14.3 s</text><text x="307.9" y="41.0" fill="#111111" font-size="8.5" text-anchor="middle" font-weight="700" letter-spacing=".01em">snapshot restore removes ~6 s of boot from every scan</text><line x1="91.1" y1="48.0" x2="464.7" y2="48.0" stroke="#dc3b2b" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#arrowR)"/><line x1="46.0" y1="188.0" x2="980.0" y2="188.0" stroke="#111111" stroke-width="1.8"/><text x="33.0" y="206.0" fill="#6b6357" font-size="9.5" text-anchor="end" font-weight="600" letter-spacing=".06em">S</text><line x1="46.0" y1="188.0" x2="46.0" y2="180.0" stroke="#111111" stroke-width="1.8"/><text x="46.0" y="206.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">0</text><line x1="232.8" y1="188.0" x2="232.8" y2="180.0" stroke="#111111" stroke-width="1.8"/><text x="232.8" y="206.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">3</text><line x1="419.6" y1="188.0" x2="419.6" y2="180.0" stroke="#111111" stroke-width="1.8"/><text x="419.6" y="206.0" fi