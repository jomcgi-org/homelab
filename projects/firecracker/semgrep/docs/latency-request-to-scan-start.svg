<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 152" width="100%" role="img" aria-label="Request to scan start, about 25 ms: network routing from Claude through Cloudflare and the MCP server is 2 to 5 ms, then a 22 ms warm restore, then prime, then the scan starts."><style>text{font-family:"JetBrains Mono","SF Mono",ui-monospace,"Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;}</style><rect x="0" y="0" width="1100" height="152" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#111111"/></marker><marker id="arrowR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc3b2b"/></marker><pattern id="clh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#f2906f" stroke-width="2.4"/></pattern></defs><line x1="46.0" y1="50.0" x2="46.0" y2="124.0" stroke="#e6e0d2" stroke-width="1"/><line x1="175.0" y1="50.0" x2="175.0" y2="124.0" stroke="#e6e0d2" stroke-width="1"/><line x1="304.0" y1="50.0" x2="304.0" y2="124.0" stroke="#e6e0d2" stroke-width="1"/><line x1="433.0" y1="50.0" x2="433.0" y2="124.0" stroke="#e6e0d2" stroke-width="1"/><line x1="562.0" y1="50.0" x2="562.0" y2="124.0" stroke="#e6e0d2" stroke-width="1"/><line x1="691.0" y1="50.0" x2="691.0" y2="124.0" stroke="#e6e0d2" stroke-width="1"/><line x1="820.0" y1="50.0" x2="820.0" y2="124.0" stroke="#e6e0d2" stroke-width="1"/><line x1="46.0" y1="17.0" x2="742.6" y2="17.0" stroke="#111111" stroke-width="1.3"/><line x1="46.0" y1="17.0" x2="46.0" y2="22.0" stroke="#111111" stroke-width="1.3"/><line x1="742.6" y1="17.0" x2="742.6" y2="22.0" stroke="#111111" stroke-width="1.3"/><text x="394.3" y="13.0" fill="#111111" font-size="9.5" text-anchor="middle" font-weight="700" letter-spacing=".02em">request received → scan starts  ≈ 25 ms</text><text x="46.0" y="34.0" fill="#111111" font-size="9" text-anchor="start" font-weight="700" letter-spacing="0">Claude → Cloudflare → MCP server → submit</text><text x="46.0" y="45.0" fill="#6b6357" font-size="8.5" text-anchor="start" font-weight="500" letter-spacing="0">~2–5 ms over the network</text><line x1="729.7" y1="50.0" x2="729.7" y2="42.0" stroke="#928b7c" stroke-width="1" stroke-dasharray="1.5 2.5"/><text x="732.7" y="39.0" fill="#6b6357" font-size="8.5" text-anchor="start" font-weight="600" letter-spacing="0">prime ~1 ms</text><rect x="46.0" y="50.0" width="103.2" height="42.0" fill="#6c9bf5" stroke="#111111" stroke-width="1.8"/><rect x="149.2" y="50.0" width="567.6" height="42.0" fill="#6fd9c0" stroke="#111111" stroke-width="1.8"/><rect x="716.8" y="50.0" width="25.8" height="42.0" fill="#f2c14e" stroke="#111111" stroke-width="1.8"/><text x="433.0" y="69.0" fill="#111111" font-size="10.5" text-anchor="middle" font-weight="800" letter-spacing="0">warm restore  ·  22 ms</text><text x="433.0" y="84.0" fill="#111111" font-size="8.5" text-anchor="middle" font-weight="400" letter-spacing="0">FC LoadSnapshot + resume of the warm guest</text><line x1="742.6" y1="46.0" x2="742.6" y2="124.0" stroke="#dc3b2b" stroke-width="2" stroke-dasharray="3 3"/><line x1="742.6" y1="71.0" x2="780.6" y2="71.0" stroke="#dc3b2b" stroke-width="2" marker-end="url(#arrowR)"/><text x="788.6" y="69.0" fill="#dc3b2b" font-size="9.5" text-anchor="start" font-weight="800" letter-spacing="0">scan starts</text><text x="788.6" y="84.0" fill="#6b6357" font-size="8.5" text-anchor="start" font-weight="500" letter-spacing="0">→ then the ~700 ms scan  ·  ~0.72 s total</text><line x1="46.0" y1="124.0" x2="820.0" y2="124.0" stroke="#111111" stroke-width="1.8"/><text x="33.0" y="142.0" fill="#6b6357" font-size="9.5" text-anchor="end" font-weight="600" letter-spacing=".06em">MS</text><line x1="46.0" y1="124.0" x2="46.0" y2="116.0" stroke="#111111" stroke-width="1.8"/><text x="46.0" y="142.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">0</text><line x1="175.0" y1="124.0" x2="175.0" y2="116.0" stroke="#111111" stroke-width="1.8"/><text x="175.0" y="142.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">5</text><line x1="304.0" y1="124.0" x2="304.0" y2="116.0" stroke="#111111" stroke-width="1.8"/><text x="304.0" y="142.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">10</text><line x1="433.0" y1="124.0" x2="433.0" y2="116.0" stroke="#111111" stroke-width="1.8"/><text x="433.0" y="142.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">15</text><line x1="562.0" y1="124.0" x2="562.0" y2="116.0" stroke="#111111" stroke-width="1.8"/><text x="562.0" y="142.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">20</text><line x1="691.0" y1="124.0" x2="691.0" y2="116.0" stroke="#111111" stroke-width="1.8"/><text x="691.0" y="142.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">25</text><line x1="820.0" y1="124.0" x2="820.0" y2="116.0" stroke="#111111" stroke-width="1.8"/><text x="820.0" y="142.0" fill="#6b6357" font-size="10" text-anchor="middle" font-weight="400" letter-spacing="0">30</text></svg>
