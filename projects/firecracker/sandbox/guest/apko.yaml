contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    # Python compute runtime (ADR agents/044).
    # numpy is intentionally omitted: Wolfi only ships it as version-suffixed
    # package names (py3.12-numpy-2.5, etc.), not as a stable unversioned
    # name, so it is not pinned directly here. scipy and pandas still pull in
    # a compatible numpy transitively.
    - python-3.12
    - py3.12-pandas
    - py3.12-matplotlib
    - py3.12-scipy
    - py3.12-pillow
    - py3.12-pyyaml
    - py3.12-python-dateutil

archs:
  - x86_64

accounts:
  groups:
    - groupname: sandbox
      gid: 65532
  users:
    - username: sandbox
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /home/sandbox
  # Headless matplotlib. A raw Firecracker boot never consumes this block (the
  # kernel ignores OCI image config entirely), so sandbox-guest-init also sets
  # this explicitly at runtime on the exec'd python subprocess; kept here for
  # self-documentation only.
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

paths:
  - path: /home/sandbox
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/local/bin/sandbox-guest-init
