contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    # Rust compute runtime (issue #4981). rustc compiles the snippet on every
    # invoke; libstd ships prebuilt as rlibs so no cargo and no crates.io are
    # involved, which is what makes rust workable in a zero-egress guest at all.
    - rust-1.97
    # rustc does NOT link its own binaries: it shells out to `cc` for the final
    # link step, so without a C toolchain every compile fails at link time with
    # "linker `cc` not found". build-base carries gcc and binutils.
    - build-base

archs:
  - x86_64

accounts:
  groups:
    - groupname: sandbox
      gid: 65532
  users:
    - username: sandbox
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /home/sandbox
  # Never consumed by a raw Firecracker boot (the kernel ignores OCI image
  # config); sandbox-guest-init sets the runtime env explicitly. Documentation
  # only.
  RUST_BACKTRACE: "1"

paths:
  - path: /home/sandbox
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/local/bin/sandbox-guest-init
