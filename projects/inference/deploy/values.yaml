fullnameOverride: "inference"

# The LLM engine is NInfer, via the sm_89 fork at
# https://github.com/jomcgi/ninfer-4090 (tracks sergiuszm/ninfer-4090). It
# serves exactly one artifact, Qwen3.8-27B, on node-4's single RTX 4090.
#
# This chart used to carry vLLM and llama.cpp behind an llm.engine switch.
# Both were removed in favour of one engine (issue #5155): NInfer decodes
# 20-55% faster than llama.cpp on this card with MTP, fits the model's full
# 262K native context through its E8 4-bit KV, and exposes llama.cpp-shaped
# /metrics, /slots and per-response timings.ttft_ms. If either old engine is
# ever needed again, git history before #5155 has the templates and values.
#
# Image tags are <VERSION>-<12-char sha> of the fork's rtx4090-port branch,
# pushed by its GitHub Actions workflow. The package is public on ghcr, so no
# pull secret is needed for it; imagePullSecret below covers the model images.
image:
  repository: ghcr.io/jomcgi/ninfer-4090
  tag: "0.6.1-rtx3090-a0d782150c27"
  pullPolicy: IfNotPresent

imagePullSecret:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/ghcr-read-permissions"

server:
  host: "0.0.0.0"
  port: 8080

ninfer:
  modelVolume:
    enabled: true
    # neroued/Qwen3.8-27B-NInfer qwen3_8_27b.ninfer (18.2 GB, groupwise-int,
    # the official artifact the fork benchmarks against), pushed by hand with
    # `crane append` as a single-layer OCI image because hf2oci only
    # classifies .safetensors and .gguf. The file sits at
    # <mountPath>/qwen3.8-27b-ninfer/qwen3_8_27b.ninfer and the container
    # auto-discovers it. As with every model image here the ref is the
    # resolved ghcr one, so the oci-model-cache webhook does not gate the pod:
    # the image must exist (or be imported into node-4's containerd) before
    # ArgoCD syncs, or the pod ImagePullBackOffs.
    reference: "ghcr.io/jomcgi/models/qwen/qwen3.8-27b:neroued-ninfer-groupwise"
    mountPath: "/model-image"
  # Public model id. Kept at the alias 10+ callsites and the model-bench
  # leaderboard hardcode, even though the artifact is Qwen3.8.
  modelId: "qwen3.6-27b"
  # Longest single prompt the server admits, in tokens. 262144 is the model's
  # native window and what the fork serves with E8 KV on this card.
  maxContext: 262144
  # KV page pool, pinned to the full native context. Automatic sizing reserves
  # an additional 1 GiB of headroom and rejects this 24 GB card before startup.
  # The explicit 262K reservation fits with about 405 MiB of planned slack.
  # Keep this at least maxContext, as required by ninfer-serve.
  kvCapacity: 262144
  # E8 lattice 4-bit keys and values. int8 is the higher-precision option at
  # ~168K max context on 24 GB; the fork measured identical MTP acceptance and
  # a 5.7% decode tax for rk4v4-e8, with exact retrieval through 260K.
  kvDtype: "rk4v4-e8"
  # Generation lanes. 2 is measured on the 4090: the second lane costs ~390 MiB,
  # the KV pool stays shared so a lone session still gets the full window, and
  # two sessions decode batched at ~1.5x aggregate. Prefill serializes across
  # lanes, so a deep cold prefill delays the other lane's first token. This
  # replaces llama.cpp's 3 slots; monolith ASYNC_SLOT_BUDGET stays at 1.
  maxConcurrency: 2
  # Admission queue beyond the lanes, and how long a queued request waits. The
  # fork's default 30s deadline is too short for agent clients behind a deep
  # prefill; 10 minutes matches pi's turn budget. On a streaming request the
  # timeout arrives as an in-band SSE error after HTTP 200.
  maxPendingRequests: 16
  pendingTimeoutMs: 600000
  prefillChunk: 1024
  # Multi-token prediction with the artifact's own draft head. 3 draft tokens
  # is the fork's measured sweet spot (81% acceptance on code, ~49% on prose).
  spec: "mtp"
  draftTokens: 3
  lmHeadDraft: true
  # Vision tower. chat/vision.py is a live callsite that sends image_url and
  # hard-fails without this. Costs ~1 GiB of the KV headroom.
  vision: true
  # Keep closed-turn reasoning out of reconstructed prompts (the Qwen template
  # default and what llama.cpp did), so multi-turn pi sessions do not pay
  # context for old thinking. Per-request preserve_thinking still overrides.
  preserveThinking: false
  extraArgs: []

runtimeClassName: nvidia

# Benchmark mode. ONE BOOLEAN, flipped on to start a session and off to end it.
#
# Enabling it does exactly one thing in templates/_helpers.tpl, plus the
# NodePort in templates/service.yaml:
#
#   Renames the LLM Service to `inference-bench`, so the hardcoded DNS name
#   every in-cluster caller uses (`inference.inference.svc.cluster.local`)
#   stops resolving. The external route follows the rename automatically,
#   because httproute-private.yaml takes its backendRef from the same
#   helper. So https://private.jomcgi.dev/llm/v1 keeps working and nothing
#   else can reach the model.
#
# NInfer needs no slot or KV override: its lanes share one page pool sized by
# kvCapacity, so a lone bench session already gets the full window.
#
# ENABLING THIS IS A DELIBERATE OUTAGE for every in-cluster qwen consumer:
# the monolith's Discord, summarize, chat, vision and classifier callsites,
# monolith-dev, and EmberVM pi-runtime qwen sessions. They fail at DNS, so
# expect fast errors and dead letters rather than hangs. The Service rename
# also takes public /health unhealthy: the inference component in
# chat_public/health.py and the ember_qwen synthetic both depend on that lane.
# Embeddings are untouched, so retrieval keeps working.
#
# The Service rename does not roll the pod (the Deployment name is unchanged),
# so flipping this is a DNS cut, not a model reload.
benchMode:
  # Off after the NInfer cutover bench (#5155). The production Service keeps the
  # stable in-cluster DNS name used by monolith and EmberVM. Turn this on only
  # for an isolated benchmark session, when an outage for those consumers is
  # intentional and the unauthenticated LAN NodePort is acceptable.
  #
  # The harness runs on the Mac and reaches the server through a port-forward
  # (bench/cli.py --base-url), so forward to the DEPLOYMENT, whose name does not
  # move with this flag, rather than to the Service, whose name does:
  #
  #   kubectl port-forward -n inference deploy/inference 18080:8080
  #
  # And it puts the Service on a NodePort so a machine on the LAN can reach the
  # model with no credentials, no Cloudflare and no timeout:
  #
  #   base_url = http://192.168.1.195:30800/v1     (node-4, the GPU node)
  #   model    = qwen3.6-27b
  #
  # That port is UNAUTHENTICATED and open to anything on the LAN while this is
  # true. It is welded to this one flag on purpose, so turning bench mode off
  # closes it and there is no second switch to forget.
  enabled: false
  # Pinned so the benchmarking machine's base URL survives a re-sync. Only read
  # when enabled is true.
  nodePort: 30800

# Ingress at https://private.jomcgi.dev/llm/ (llama.cpp web UI) and
# https://private.jomcgi.dev/llm/v1 (OpenAI client base URL). See
# templates/httproute-private.yaml for why this hostname rather than
# friends.jomcgi.dev, and why the UI needs the trailing slash.
#
# SAFE TO ENABLE BEFORE ANY CLOUDFLARE WORK. The Access application covering
# private.jomcgi.dev has no path scope, so it already guards this path the
# moment the route exists: a browser needs a team login and a headless client
# gets nothing. Adding a path-scoped Access application for /llm with a Service
# Auth policy is what later admits a service token, and that is a dashboard
# action (Access is not managed in this repo).
#
# Note a path-scoped application REPLACES the hostname-wide one for /llm rather
# than layering on it, because Access matches the most specific path. An app
# holding only a Service Auth policy therefore locks the browser out of /llm.
# Add a second policy for the operator's email if both are wanted.
cfIngress:
  enabled: true
  tier: trusted
  hostname: private.jomcgi.dev
  # The route matches <pathPrefix>/v1 and rewrites it to /v1. Deliberately not
  # under /app/, which by convention is browser UIs on this hostname.
  pathPrefix: /llm
  team: jomcgi
  gateway:
    name: cloudflare-ingress
    namespace: envoy-gateway-system

nodeSelector:
  kubernetes.io/hostname: node-4

strategy:
  type: Recreate

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

# The NInfer image runs as the homelab non-root uid; nothing in it needs root.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 180

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# Critical-tier priority (ADR platform/010): inference must survive node-4
# memory pressure now that its memory request is set to steady-state, not peak.
priorityClassName: homelab-critical

# Burstable memory (ADR platform/010): request = steady-state, limit holds the
# real anonymous peak. The model and its KV cache live in GPU VRAM, which is a
# separate resource from the host RAM this limit governs. Historical data shows host
# RSS (the non-reclaimable part that can actually OOM) never exceeds ~5Gi.
# working_set spikes to ~20Gi only during model load, when the ~18-20GB of int4
# weight files transit host page cache on the way to VRAM; that cache is clean and
# reclaimable, so the cgroup evicts it before any OOM. A 16Gi limit sits ~3x above
# the real RSS and only forces page-cache reclaim during the rare load, which is
# harmless (the weights are already in VRAM by then). Trimmed 32 -> 16 to keep the
# node-4 paper overcommit honest for the agent-microVM tier.
# CPU request trimmed 4 -> 2: decode is GPU-bound, historical 7-day peak CPU is
# ~1715m (avg ~7m), so 2 cores covers peak with headroom. Re-check both after
# the NInfer cutover; these were measured under vLLM and llama.cpp.
resources:
  requests:
    cpu: 2
    memory: "8Gi"
    nvidia.com/gpu: 1
  limits:
    memory: "16Gi"
    nvidia.com/gpu: 1

# Embeddings are served by llama.cpp on CPU (no GPU layers).
embeddings:
  enabled: true
  # The llama.cpp embeddings image still runs as root, as it did when the LLM
  # shared this block. Moving it to 65532 is a separate change to verify.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: "server-cuda-b8643@sha256:ee54620034076d53fee9cd6acf8483902becd3d66acf77acc6ecfe5eefddaecb"
    pullPolicy: IfNotPresent
  modelVolume:
    enabled: true
    reference: "ghcr.io/jomcgi/models/voyageai/voyage-4-nano:jsonmartin-gguf-q8-0"
    mountPath: "/model-image"
  llamaCpp:
    nGpuLayers: 0
    ctxSize: 8192
    flashAttn: "off"
    cacheTypeK: "f16"
    cacheTypeV: "f16"
    threads: 4
    jinja: false
    # Raise ubatch/batch from llama.cpp's 512-token default: in --embedding
    # mode the whole input must fit in one physical batch, and the monolith
    # chunker's `words * 1.3` estimator undercounts dense markdown (tables,
    # code) — a "512-est" chunk can decode to ~700 real tokens and 500 out.
    extraArgs:
      - "--embedding"
      - "--alias"
      - "voyage-4-nano"
      - "--metrics"
      - "--ubatch-size"
      - "8192"
      - "--batch-size"
      - "8192"
  runtimeClassName: null
  nodeSelector:
    kubernetes.io/hostname: node-4
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
  # Historical 7-day RSS is ~5.5Gi (llama.cpp holds the GGUF weights in host RAM,
  # n-gpu-layers 0), and the grimoire bulk sourcebook load (2026-07-04, ~40k
  # chunks at 60k-char batches against 8192-token ubatch) OOMKilled the pod at
  # the old 8Gi limit and crash-looped it: each restart got slammed by retry
  # backlog while still allocating model + slot memory. 12Gi covers steady
  # state plus max-batch spikes; requests == limits per the sizing convention
  # so the reservation is honest. Node-4 sits at ~38% memory requested.
  resources:
    requests:
      cpu: 2
      memory: "12Gi"
    limits:
      memory: "12Gi"
