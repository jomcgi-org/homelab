fullnameOverride: "inference"

# Which engine serves the LLM. Exactly one runs: node-4 has a single RTX 4090
# and both deployments request it, so the unselected one is not rendered at all
# (not scaled to zero) to keep the GPU request honest.
#
# "llamacpp" is a deliberate, temporary state. Qwen3.8-27B is a dense 27B whose
# only Ada-executable quantization today is GGUF: the FP8 build is 28.75 GiB and
# the NVFP4 build quantizes activations to 4 bits, which needs Blackwell tensor
# cores that sm_89 does not have. Revert to "vllm" (a one-line change, both
# blocks below are kept intact) once a weight-only int4 with 16-bit activations
# ships, in the mould of the Intel AutoRound quant this cluster ran before.
llm:
  engine: llamacpp

image:
  vllm:
    repository: vllm/vllm-openai
    tag: "v0.19.1"
    pullPolicy: IfNotPresent
  # Same repository the embeddings deployment runs, pinned independently: that
  # one is serving live retrieval traffic on a build known good for it, and
  # Qwen3.8 support only exists in much newer builds.
  llamacpp:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: "server-cuda-b10423@sha256:a475c08c7c472425e3ebf7f6be9c6cb3a17e82ec28070ddeb22fffe3ca754a94"
    pullPolicy: IfNotPresent

imagePullSecret:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/ghcr-read-permissions"

modelVolume:
  enabled: true
  # Qwen3.6-35B-A3B MoE (~3B active) replacing the 27B hybrid (~27B active): at our
  # batch=1 workload (Discord/summarize) decode is bandwidth-bound on active params,
  # so this is a large per-call latency win. int4-mixed AutoRound keeps the router/
  # gate + embeddings at higher precision (better MoE quality) with experts at INT4.
  # Pushed to ghcr out-of-band via `hf2oci copy Intel/Qwen3.6-35B-A3B-int4-mixed-AutoRound
  # -r ghcr.io/jomcgi/models`, so this references the resolved ghcr ref directly
  # (matching the prior 27B convention).
  reference: "ghcr.io/jomcgi/models/qwen/qwen3.6-35b-a3b:intel-qwen3.6-35b-a3b-int4-mixed-autoround"
  mountPath: "/model-image"

server:
  host: "0.0.0.0"
  port: 8080
  # Official Qwen3.6 chat template (qwen3_coder <function=...> tool-call format),
  # shared across the Qwen3.6 family — verified identical for Qwen3.6-35B-A3B.
  # Required because the AutoRound INT4 quant strips the template from the repo.
  chatTemplate: |
    {%- set image_count = namespace(value=0) %}
    {%- set video_count = namespace(value=0) %}
    {%- macro render_content(content, do_vision_count, is_system_content=false) %}
        {%- if content is string %}
            {{- content }}
        {%- elif content is iterable and content is not mapping %}
            {%- for item in content %}
                {%- if 'image' in item or 'image_url' in item or item.type == 'image' %}
                    {%- if is_system_content %}
                        {{- raise_exception('System message cannot contain images.') }}
                    {%- endif %}
                    {%- if do_vision_count %}
                        {%- set image_count.value = image_count.value + 1 %}
                    {%- endif %}
                    {%- if add_vision_id %}
                        {{- 'Picture ' ~ image_count.value ~ ': ' }}
                    {%- endif %}
                    {{- '<|vision_start|><|image_pad|><|vision_end|>' }}
                {%- elif 'video' in item or item.type == 'video' %}
                    {%- if is_system_content %}
                        {{- raise_exception('System message cannot contain videos.') }}
                    {%- endif %}
                    {%- if do_vision_count %}
                        {%- set video_count.value = video_count.value + 1 %}
                    {%- endif %}
                    {%- if add_vision_id %}
                        {{- 'Video ' ~ video_count.value ~ ': ' }}
                    {%- endif %}
                    {{- '<|vision_start|><|video_pad|><|vision_end|>' }}
                {%- elif 'text' in item %}
                    {{- item.text }}
                {%- else %}
                    {{- raise_exception('Unexpected item type in content.') }}
                {%- endif %}
            {%- endfor %}
        {%- elif content is none or content is undefined %}
            {{- '' }}
        {%- else %}
            {{- raise_exception('Unexpected content type.') }}
        {%- endif %}
    {%- endmacro %}
    {%- if not messages %}
        {{- raise_exception('No messages provided.') }}
    {%- endif %}
    {%- if tools and tools is iterable and tools is not mapping %}
        {{- '<|im_start|>system\n' }}
        {{- "# Tools\n\nYou have access to the following functions:\n\n<tools>" }}
        {%- for tool in tools %}
            {{- "\n" }}
            {{- tool | tojson }}
        {%- endfor %}
        {{- "\n</tools>" }}
        {{- '\n\nIf you choose to call a function ONLY reply in the following format with NO suffix:\n\n<tool_call>\n<function=example_function_name>\n<parameter=example_parameter_1>\nvalue_1\n</parameter>\n<parameter=example_parameter_2>\nThis is the value for the second parameter\nthat can span\nmultiple lines\n</parameter>\n</function>\n</tool_call>\n\n<IMPORTANT>\nReminder:\n- Function calls MUST follow the specified format: an inner <function=...></function> block must be nested within <tool_call></tool_call> XML tags\n- Required parameters MUST be specified\n- You may provide optional reasoning for your function call in natural language BEFORE the function call, but NOT after\n- If there is no function call available, answer the question like normal with your current knowledge and do not tell the user about function calls\n</IMPORTANT>' }}
        {%- if messages[0].role == 'system' %}
            {%- set content = render_content(messages[0].content, false, true)|trim %}
            {%- if content %}
                {{- '\n\n' + content }}
            {%- endif %}
        {%- endif %}
        {{- '<|im_end|>\n' }}
    {%- else %}
        {%- if messages[0].role == 'system' %}
            {%- set content = render_content(messages[0].content, false, true)|trim %}
            {{- '<|im_start|>system\n' + content + '<|im_end|>\n' }}
        {%- endif %}
    {%- endif %}
    {%- set ns = namespace(multi_step_tool=true, last_query_index=messages|length - 1) %}
    {%- for message in messages[::-1] %}
        {%- set index = (messages|length - 1) - loop.index0 %}
        {%- if ns.multi_step_tool and message.role == "user" %}
            {%- set content = render_content(message.content, false)|trim %}
            {%- if not(content.startswith('<tool_response>') and content.endswith('</tool_response>')) %}
                {%- set ns.multi_step_tool = false %}
                {%- set ns.last_query_index = index %}
            {%- endif %}
        {%- endif %}
    {%- endfor %}
    {%- if ns.multi_step_tool %}
        {{- raise_exception('No user query found in messages.') }}
    {%- endif %}
    {%- for message in messages %}
        {%- set content = render_content(message.content, true)|trim %}
        {%- if message.role == "system" %}
            {%- if not loop.first %}
                {{- '<|im_start|>system\n' + content + '<|im_end|>\n' }}
            {%- endif %}
        {%- elif message.role == "user" %}
            {{- '<|im_start|>' + message.role + '\n' + content + '<|im_end|>' + '\n' }}
        {%- elif message.role == "assistant" %}
            {%- set reasoning_content = '' %}
            {%- if message.reasoning_content is string %}
                {%- set reasoning_content = message.reasoning_content %}
            {%- else %}
                {%- if '</think>' in content %}
                    {%- set reasoning_content = content.split('</think>')[0].rstrip('\n').split('<think>')[-1].lstrip('\n') %}
                    {%- set content = content.split('</think>')[-1].lstrip('\n') %}
                {%- endif %}
            {%- endif %}
            {%- set reasoning_content = reasoning_content|trim %}
            {%- if (preserve_thinking is defined and preserve_thinking is true) or (loop.index0 > ns.last_query_index) %}
                {{- '<|im_start|>' + message.role + '\n<think>\n' + reasoning_content + '\n</think>\n\n' + content }}
            {%- else %}
                {{- '<|im_start|>' + message.role + '\n' + content }}
            {%- endif %}
            {%- if message.tool_calls and message.tool_calls is iterable and message.tool_calls is not mapping %}
                {%- for tool_call in message.tool_calls %}
                    {%- if tool_call.function is defined %}
                        {%- set tool_call = tool_call.function %}
                    {%- endif %}
                    {%- if loop.first %}
                        {%- if content|trim %}
                            {{- '\n\n<tool_call>\n<function=' + tool_call.name + '>\n' }}
                        {%- else %}
                            {{- '<tool_call>\n<function=' + tool_call.name + '>\n' }}
                        {%- endif %}
                    {%- else %}
                        {{- '\n<tool_call>\n<function=' + tool_call.name + '>\n' }}
                    {%- endif %}
                    {%- if tool_call.arguments is defined %}
                        {%- for args_name, args_value in tool_call.arguments|items %}
                            {{- '<parameter=' + args_name + '>\n' }}
                            {%- set args_value = args_value | string if args_value is string else args_value | tojson | safe %}
                            {{- args_value }}
                            {{- '\n</parameter>\n' }}
                        {%- endfor %}
                    {%- endif %}
                    {{- '</function>\n</tool_call>' }}
                {%- endfor %}
            {%- endif %}
            {{- '<|im_end|>\n' }}
        {%- elif message.role == "tool" %}
            {%- if loop.previtem and loop.previtem.role != "tool" %}
                {{- '<|im_start|>user' }}
            {%- endif %}
            {{- '\n<tool_response>\n' }}
            {{- content }}
            {{- '\n</tool_response>' }}
            {%- if not loop.last and loop.nextitem.role != "tool" %}
                {{- '<|im_end|>\n' }}
            {%- elif loop.last %}
                {{- '<|im_end|>\n' }}
            {%- endif %}
        {%- else %}
            {{- raise_exception('Unexpected message role.') }}
        {%- endif %}
    {%- endfor %}
    {%- if add_generation_prompt %}
        {{- '<|im_start|>assistant\n' }}
        {%- if enable_thinking is defined and enable_thinking is false %}
            {{- '<think>\n\n</think>\n\n' }}
        {%- else %}
            {{- '<think>\n' }}
        {%- endif %}
    {%- endif %}

vllm:
  # 32768 (was 49152): 35B-A3B int4-mixed weights are ~21-22GB resident (MoE keeps
  # all experts loaded; mixed precision adds ~2GB over plain INT4), leaving thin KV
  # headroom on a 24GB card. If load OOMs, add --enforce-eager (frees ~1-2GB of
  # CUDA-graph capture) before lowering ctx further; raise back toward 49152 only
  # after confirming KV headroom in the vLLM startup logs.
  maxModelLen: 32768
  gpuMemoryUtilization: 0.95
  dtype: "auto"
  quantization: ""
  tokenizer: ""
  extraArgs:
    - "--served-model-name"
    - "qwen3.6-27b"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_coder"
    - "--reasoning-parser"
    - "qwen3"
    - "--reasoning-config"
    - '{"reasoning_start_str": "<think>", "reasoning_end_str": "</think>"}'
    # Total concurrent decode sequences. Widened 3 -> 8 so the shared vLLM can
    # batch bulk callers alongside interactive traffic instead of forcing batch
    # size 1. KV memory is a fixed pool (gpu-memory-utilization below); more
    # seqs just share it, with graceful preemption on a rare full-context req.
    # Only read when llm.engine is "vllm". Note the consumer budget has since
    # been resized for the llama.cpp path (3 slots, grimoire at 3), so on a
    # revert to vLLM these 8 slots would be undersubscribed rather than
    # oversubscribed, which is the safe direction.
    - "--max-num-seqs"
    - "8"
    - "--kv-cache-dtype"
    - "fp8"

# llama.cpp LLM settings. Only read when llm.engine is "llamacpp".
llamacpp:
  modelVolume:
    enabled: true
    # Qwen3.8-27B, unsloth GGUF Q4_K_M plus both mmproj variants, pushed with
    # `hf2oci copy unsloth/Qwen3.8-27B-GGUF -r ghcr.io/jomcgi/models
    #  --file Qwen3.8-27B-Q4_K_M --include-mmproj`. As with the vLLM model this
    # is the resolved ghcr ref, not the hf.co form, so the oci-model-cache
    # webhook does not gate the pod: the image must exist in ghcr before ArgoCD
    # syncs or the pod ImagePullBackOffs. Pushed and verified 2026-08-14 at
    # sha256:5756850ee602b50c2e697d5dcf44c075b4be08caee3ba526cbf73a11dcd45b3b.
    reference: "ghcr.io/jomcgi/models/qwen/qwen3.8-27b:unsloth-gguf-q4-k-m-mmproj"
    mountPath: "/model-image"
  # 99 = offload every layer. Unlike the embeddings deployment (which is
  # deliberately n-gpu-layers 0 and holds its weights in host RAM), the whole
  # model is meant to be resident in VRAM here.
  nGpuLayers: 99
  # ctxSize is the TOTAL KV pool, divided across `parallel` slots -- it is NOT
  # per-sequence like vLLM's --max-model-len. 131072 / 4 = 32768 per slot, which
  # preserves the 32k window every monolith callsite is written against.
  #
  # VRAM budget on the 24564 MiB card: 15.92 GiB weights + 0.86 GiB mmproj +
  # ~1 GiB compute buffers leaves ~6.2 GiB for KV. Qwen3.8-27B carries KV on
  # only 16 of its 64 layers (the rest are Gated DeltaNet linear attention), but
  # head_dim is 256, so a 32k sequence still costs a full 1.00 GiB at q8_0.
  #
  # Measured at 4 slots: 22562 of 24564 MiB resident, ie under 2 GiB spare, one
  # slot from the ceiling. 3 slots (98304 / 3 = 32768 each) gives back a full
  # GiB. Do not raise this without re-reading steady-state VRAM: this is a
  # Recreate deployment on a single GPU, so an over-committed KV pool is a crash
  # loop with the previous engine already torn down, not a degraded pod.
  ctxSize: 98304
  parallel: 3
  # Quantized V cache requires flash attention; leaving this off silently forces
  # the cache back to f16 and doubles the table above.
  flashAttn: "on"
  cacheTypeK: "q8_0"
  cacheTypeV: "q8_0"
  threads: 4
  # Vision projector. chat/vision.py is a live callsite that sends image_url and
  # hard-fails without this. Auto-discovered from the model image (both BF16 and
  # F16 ship in it); F16 is preferred, hence the ordering in the template.
  mmproj: true
  extraArgs:
    # Keeps the served model name stable so the 10+ callsites that hardcode the
    # alias, and the model-bench leaderboard, do not have to change.
    - "--alias"
    - "qwen3.6-27b"
    # --jinja uses the chat template embedded in the GGUF (Qwen3.8's own) and is
    # what makes tool calls parse into OpenAI-shaped tool_calls. Note the
    # server.chatTemplate configmap is NOT mounted here on purpose: it holds the
    # Qwen3.6 template, hand-injected because AutoRound stripped it, and feeding
    # it to Qwen3.8 would silently produce the wrong prompt format.
    - "--jinja"
    # Emits reasoning into the `reasoning_content` field, which is what
    # summarizer.py and the chat agents already read from vLLM's qwen3
    # reasoning-parser output.
    - "--reasoning-format"
    - "deepseek"
    - "--metrics"

runtimeClassName: nvidia

# Benchmark mode. ONE BOOLEAN, flipped on to start a session and off to end it.
#
# Enabling it does exactly two things, both in templates/_helpers.tpl:
#
#   1. Renames the LLM Service to `inference-bench`, so the hardcoded DNS name
#      every in-cluster caller uses (`inference.inference.svc.cluster.local`)
#      stops resolving. The external route follows the rename automatically,
#      because httproute-private.yaml takes its backendRef from the same
#      helper. So https://private.jomcgi.dev/llm/v1 keeps working and nothing
#      else can reach the model.
#   2. Drops llama.cpp to a single slot, which hands that one slot the whole
#      98304-token KV pool instead of 32768, at unchanged VRAM.
#
# ENABLING THIS IS A DELIBERATE OUTAGE for every in-cluster qwen consumer:
# the monolith's Discord, summarize, chat, vision and classifier callsites,
# monolith-dev, and EmberVM pi-runtime qwen sessions. They fail at DNS, so
# expect fast errors and dead letters rather than hangs. Nothing pages: the
# qwen synthetic CronWorkflow is suspended and has never run, and the composite
# /health carries no qwen, llama or inference dependency (both verified live,
# 2026-08-18). Embeddings are untouched, so retrieval keeps working.
#
# The pod rolls on each flip. strategy is Recreate on a single GPU, so qwen is
# fully down for the model load, and the startupProbe allows up to 30 minutes.
#
# ctxSize is deliberately NOT raised. The largest task in projects/model-bench
# is ~6k tokens of prompt against max_tokens 16384, so ~22k worst case, and a
# single slot already gets 98304. Raising it to 131072 would still fit (that is
# the VRAM footprint previously measured at 4x32k, ~1.9 GiB free) but buys
# nothing until a long-context task exists. Measured live 2026-08-18: 21590 of
# 24564 MiB in use, base ~18.5 GiB, KV ~1.00 GiB per 32k at q8_0.
benchMode:
  # ON for a benchmarking session started 2026-08-18. FLIP BACK TO false WHEN
  # THE RUN ENDS: while this is true the monolith's qwen callsites, monolith-dev
  # and EmberVM pi-runtime sessions are all failing at DNS, by design.
  #
  # The harness runs on the Mac and reaches llama.cpp through a port-forward
  # (bench/cli.py --base-url), so forward to the DEPLOYMENT, whose name does not
  # move with this flag, rather than to the Service, whose name does:
  #
  #   kubectl port-forward -n inference deploy/inference 18080:8080
  #
  # And it puts the Service on a NodePort so a machine on the LAN can reach the
  # model with no credentials, no Cloudflare and no timeout:
  #
  #   base_url = http://192.168.1.195:30800/v1     (node-4, the GPU node)
  #   model    = qwen3.6-27b
  #
  # That port is UNAUTHENTICATED and open to anything on the LAN while this is
  # true. It is welded to this one flag on purpose, so turning bench mode off
  # closes it and there is no second switch to forget.
  enabled: true
  # Pinned so the benchmarking machine's base URL survives a re-sync. Only read
  # when enabled is true.
  nodePort: 30800

# OpenAI-compatible ingress at https://private.jomcgi.dev/llm/v1, so a client
# outside the cluster (an OpenAI SDK, curl, an IDE assistant) can call the
# llama.cpp server. See templates/httproute-private.yaml for why this hostname
# rather than friends.jomcgi.dev, and why the prefix stops at /v1.
#
# SAFE TO ENABLE BEFORE ANY CLOUDFLARE WORK. The Access application covering
# private.jomcgi.dev has no path scope, so it already guards this path the
# moment the route exists: a browser needs a team login and a headless client
# gets nothing. Adding a path-scoped Access application for /llm with a Service
# Auth policy is what later admits a service token, and that is a dashboard
# action (Access is not managed in this repo).
#
# Note a path-scoped application REPLACES the hostname-wide one for /llm rather
# than layering on it, because Access matches the most specific path. An app
# holding only a Service Auth policy therefore locks the browser out of /llm.
# Add a second policy for the operator's email if both are wanted.
cfIngress:
  enabled: true
  tier: trusted
  hostname: private.jomcgi.dev
  # The route matches <pathPrefix>/v1 and rewrites it to /v1. Deliberately not
  # under /app/, which by convention is browser UIs on this hostname.
  pathPrefix: /llm
  team: jomcgi
  gateway:
    name: cloudflare-ingress
    namespace: envoy-gateway-system

nodeSelector:
  kubernetes.io/hostname: node-4

strategy:
  type: Recreate

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

# vLLM runs as root and needs writable fs for compiled kernels
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 180

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# Critical-tier priority (ADR platform/010): inference must survive node-4
# memory pressure now that its memory request is set to steady-state, not peak.
priorityClassName: homelab-critical

# Burstable memory (ADR platform/010): request = steady-state, limit holds the
# real anonymous peak. The model and its KV cache live in GPU VRAM, which is a
# separate resource from the host RAM this limit governs. 7-day SigNoz shows host
# RSS (the non-reclaimable part that can actually OOM) never exceeds ~5Gi.
# working_set spikes to ~20Gi only during model load, when the ~18-20GB of int4
# weight files transit host page cache on the way to VRAM; that cache is clean and
# reclaimable, so the cgroup evicts it before any OOM. A 16Gi limit sits ~3x above
# the real RSS and only forces page-cache reclaim during the rare load, which is
# harmless (the weights are already in VRAM by then). Trimmed 32 -> 16 to keep the
# node-4 paper overcommit honest for the agent-microVM tier.
# CPU request trimmed 4 -> 2: vLLM decode is GPU-bound, 7-day SigNoz peak CPU is
# ~1715m (avg ~7m), so 2 cores covers peak with headroom.
resources:
  requests:
    cpu: 2
    memory: "8Gi"
    nvidia.com/gpu: 1
  limits:
    memory: "16Gi"
    nvidia.com/gpu: 1

# Embeddings are served by llama.cpp on CPU (no GPU layers).
embeddings:
  enabled: true
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: "server-cuda-b8643@sha256:ee54620034076d53fee9cd6acf8483902becd3d66acf77acc6ecfe5eefddaecb"
    pullPolicy: IfNotPresent
  modelVolume:
    enabled: true
    reference: "ghcr.io/jomcgi/models/voyageai/voyage-4-nano:jsonmartin-gguf-q8-0"
    mountPath: "/model-image"
  llamaCpp:
    nGpuLayers: 0
    ctxSize: 8192
    flashAttn: "off"
    cacheTypeK: "f16"
    cacheTypeV: "f16"
    threads: 4
    jinja: false
    # Raise ubatch/batch from llama.cpp's 512-token default: in --embedding
    # mode the whole input must fit in one physical batch, and the monolith
    # chunker's `words * 1.3` estimator undercounts dense markdown (tables,
    # code) — a "512-est" chunk can decode to ~700 real tokens and 500 out.
    extraArgs:
      - "--embedding"
      - "--alias"
      - "voyage-4-nano"
      - "--metrics"
      - "--ubatch-size"
      - "8192"
      - "--batch-size"
      - "8192"
  runtimeClassName: null
  nodeSelector:
    kubernetes.io/hostname: node-4
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
  # 7-day SigNoz RSS is ~5.5Gi (llama.cpp holds the GGUF weights in host RAM,
  # n-gpu-layers 0), and the grimoire bulk sourcebook load (2026-07-04, ~40k
  # chunks at 60k-char batches against 8192-token ubatch) OOMKilled the pod at
  # the old 8Gi limit and crash-looped it: each restart got slammed by retry
  # backlog while still allocating model + slot memory. 12Gi covers steady
  # state plus max-batch spikes; requests == limits per the sizing convention
  # so the reservation is honest. Node-4 sits at ~38% memory requested.
  resources:
    requests:
      cpu: 2
      memory: "12Gi"
    limits:
      memory: "12Gi"
