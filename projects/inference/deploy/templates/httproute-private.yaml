{{- /*
OpenAI-compatible access to the llama.cpp server from outside the cluster:

  https://private.jomcgi.dev/llm/v1

Base URL for an OpenAI client is that string; the model id is whatever
llamacpp.extraArgs --alias sets, currently "qwen3.6-27b".

WHY private.jomcgi.dev AND NOT friends.jomcgi.dev. friends carries the authentik
lanes, and every one of them runs an Envoy `oidc` block, which answers an
unauthenticated request with a BROWSER REDIRECT. An OpenAI SDK holding a bearer
token cannot follow that, so it sees the authentik login page rather than a
completion. Reaching this from a headless client on that hostname would mean an
authentik client_credentials provider minting short-lived JWTs pasted in as the
"api key". Here, Cloudflare Access already supports non-browser callers
natively: a Service Auth policy on the Access application admits a request
carrying CF-Access-Client-Id / CF-Access-Client-Secret, and injects the
Cf-Access-Jwt-Assertion header the SecurityPolicy below validates.

WHY THE PREFIX IS /llm/v1 AND NOT /llm. Rewriting the bare prefix to / would
publish EVERYTHING llama-server routes, including /props and the /metrics
endpoint that llamacpp.extraArgs --metrics turns on. Matching /llm/v1 exposes
only the OpenAI surface (/v1/chat/completions, /v1/completions, /v1/models,
/v1/embeddings). /slots is not in play either way, since --slots is not passed.
*/}}
{{- if .Values.cfIngress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inference.fullname" . }}-private
  labels:
    {{- include "inference.labels" . | nindent 4 }}
    ingress-tier: {{ .Values.cfIngress.tier }}
spec:
  # group/kind and the backendRef group/kind/weight below are Gateway API schema
  # defaults, spelled out to match cf-ingress.httproute rather than because this
  # Application needs it: that library declares them because its ServerSideApply
  # consumers report OutOfSync forever on any field the chart leaves implicit
  # and the apiserver then defaults. This app is client-side apply today, so the
  # cost of stating them is zero and the trap is pre-closed if that changes.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.cfIngress.gateway.name }}
      namespace: {{ .Values.cfIngress.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.cfIngress.pathPrefix }}/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      # Explicit, because this is NOT rendered through cf-ingress.httproute and
      # that library emits no timeouts at all: Envoy's own route default is 15s,
      # which truncates any generation longer than a sentence. 600s matches the
      # monolith's private route, whose callsites hit this same backend.
      #
      # Cloudflare is the other clock and it is not configurable here: the edge
      # returns 524 if the origin sends NO byte for 100s. Streaming responses
      # emit the first token well inside that, so a long non-streamed completion
      # is the shape that breaks. Prefer stream: true from the client.
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "inference.serviceName" . }}
          port: {{ .Values.server.port | int }}
          weight: 1
---
{{/*
Left-trim deliberately omitted on this comment and on the include below: `{{-`
would chomp back through the newline after the `---` above and weld the
separator onto the first line of the policy, which helm lint reports as
"invalid Yaml document separator". The same shape exists unlinted elsewhere in
the repo, because every other chart consuming this library sets lint = False.

Validates the Cloudflare Access JWT when one is present.

WRITTEN OUT RATHER THAN TAKEN FROM cf-ingress.security-policy, for the one
field that library cannot express: `optional: true`.

WHY IT IS NEEDED. Cloudflare Access injects Cf-Access-Jwt-Assertion for
IDENTITY-based sessions. A SERVICE TOKEN request is authenticated by Access and
forwarded WITHOUT that header, which was measured, not assumed: with the token
the edge stopped returning its own 403 and Envoy answered

    HTTP/2 401
    www-authenticate: Bearer realm="http://private.jomcgi.dev/llm/v1/models"
    Jwt is missing

That string is Envoy's JWT filter, so the request had cleared the edge and died
here. Every other private-tier route is a browser lane, so this is the first
one to carry a machine caller and the first to hit it.

WHAT optional CHANGES, precisely. A request with NO JWT is allowed through. A
request WITH a JWT is still fully validated and rejected if the signature,
issuer or expiry is wrong, and its email claim is still projected. So this is
not "auth off", it is "auth applies to callers that have credentials of this
kind", and the service token is a credential of a different kind that
Cloudflare has already checked.

WHAT NOW GUARDS THE ROUTE. Cloudflare Access alone, which was already true in
substance: this policy carries no `authorization` block and no `audiences`, so
it never decided WHO could call, only that a caller arrived through the edge.
That last check is what is given up for tokenless callers. The residual exposure
is something inside the cluster addressing the Envoy gateway directly with a
private.jomcgi.dev Host header, since nothing reaches this listener from outside
except the cloudflared tunnel.

IF THIS EVER NEEDS TO HOLD ON ITS OWN, the fix is not to flip optional back: it
is to make the caller present something verifiable. Pinning `audiences` to the
/llm application's AUD tag
(b61144b93ded545d30eaafecec095931d30056a596222fc2a585f1a74397a456) only helps
once a JWT actually arrives.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "inference.fullname" . }}-private-cf-access
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "inference.fullname" . }}-private
  jwt:
    optional: true
    providers:
      - name: cloudflare-access
        issuer: https://{{ .Values.cfIngress.team }}.cloudflareaccess.com
        remoteJWKS:
          # Envoy Gateway's own default, declared explicitly for the same
          # ServerSideApply field-ownership reason the library documents.
          cacheDuration: 300s
          uri: https://{{ .Values.cfIngress.team }}.cloudflareaccess.com/cdn-cgi/access/certs
        extractFrom:
          headers:
            - name: Cf-Access-Jwt-Assertion
        claimToHeaders:
          - claim: email
            header: X-Auth-Email
{{- end }}
