{{/*
The generative LLM served by NInfer (ninfer-serve). The Service, its selector,
and every caller URL key off the `inference` component label and the chart
fullname, which this Deployment keeps from the engines it replaced.
*/}}
{{- if .Values.ninfer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference.fullname" . }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inference.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: inference
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "inference.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: inference
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: ghcr-imagepull-secret
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ninfer-serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              MODEL=$(find {{ .Values.ninfer.modelVolume.mountPath }} -maxdepth 2 -name '*.ninfer' ! -name '._*' -type f | sort | head -1)
              if [ -z "$MODEL" ]; then
                echo "ERROR: no .ninfer artifact found under {{ .Values.ninfer.modelVolume.mountPath }}" >&2
                exit 1
              fi
              echo "Auto-discovered model: $MODEL"
              exec ninfer-serve "$MODEL" \
                {{ include "inference.ninferArgs" . | indent 16 | trim }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.ninfer.modelVolume.enabled }}
            - name: model
              mountPath: {{ .Values.ninfer.modelVolume.mountPath }}
              readOnly: true
            {{- end }}
            - name: dshm
              mountPath: /dev/shm
      volumes:
        {{- if .Values.ninfer.modelVolume.enabled }}
        - name: model
          image:
            reference: {{ .Values.ninfer.modelVolume.reference }}
            pullPolicy: IfNotPresent
        {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
