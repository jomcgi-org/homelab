# The GKE cluster's root Application.
#
# SYNCED BY `hub-root` (projects/gke-cluster/hub-root-application.yaml), which
# points at this directory and nothing else. Merge a change here and it is live
# within one ArgoCD poll; no kubectl.
#
# Why a parent instead of listing this file in ../kustomization.yaml: a root
# that syncs itself can be broken by one bad commit to itself, and then nothing
# is left to sync the fix. `hub-root` never syncs its own definition, so a bad
# commit here is repaired by the next commit here. Only a bad edit to
# hub-root-application.yaml needs hands on the cluster, and that file should
# essentially never change.
#
# Until 2026-09-28 this file was hand-applied after merge. That left the live
# root missing the embervm-dev entry below for days while git said otherwise:
# every Kargo promotion of embervm-dev was stamped straight back by selfHeal.
#
# To force a sync now rather than wait for the poll, use the monolith MCP tool
# k8s_sync_argocd_app with name "hub-root" (then "hub").
#
# WHEN YOU ADD A KARGO PIPELINE
#
# Add an `ignoreDifferences` entry for that Application's
# `/spec/sources/0/targetRevision` AND ensure `RespectIgnoreDifferences=true` is
# in syncOptions, and merge it (and let hub-root sync it) BEFORE the change
# that arms the pipeline: an entry naming an Application that does not exist
# yet is inert, while a Stage that arms first has every promotion reverted.
# `ignoreDifferences` alone suppresses DIFFING, not APPLYING, so without the
# sync option the field survives idle reconciliation and is stamped back by the
# next real sync.
#
# The entry is not free, and the cost is easy to miss:
# `RespectIgnoreDifferences` with a jsonPointer into `spec.sources` stops ArgoCD
# patching ANY field in that array, permanently, not just the one named. On
# 2026-08-26 that left all four Kargo-owned Applications on the pre-org-move
# `github.com/jomcgi/homelab` repoURL while git said `jomcgi-org`, for weeks,
# with the root reporting "successfully synced (all tasks run)" on every pass.
# The 27 Applications without `ignoreDifferences` healed; the 4 with it did not.
# That is why bazel/tools/ci/check-application-drift.sh exists: it renders this
# cluster's Applications from git and diffs them against the live objects, so a
# field ArgoCD has silently stopped healing is something you can see on demand
# rather than discover during an outage. It needs a live cluster context, so it
# is an operator command rather than a CI gate; run it after any change to an
# Application's sources, and whenever a promotion behaves oddly.
#
# Add an entry per Kargo-managed Application, only once its pipeline is armed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jomcgi-org/homelab.git
    targetRevision: HEAD
    # platform-gke (shared infrastructure) plus gke-apps (workloads). Both are
    # kustomize directories, so adding a workload to the cluster is a change to
    # projects/gke-apps/kustomization.yaml, not to this file.
    path: projects/gke-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # One entry per Application whose targetRevision Kargo owns, added in the
  # change that armed its pipeline. Kargo patches the live Application via
  # argocd-update; without these, selfHeal reverts every promotion to the value
  # committed in projects/gke-apps, which is the bootstrap floor and not a
  # record of anything.
  #
  # jsonPointers into spec.sources, with the cost described at the top of this
  # file: combined with RespectIgnoreDifferences this stops ArgoCD patching ANY
  # field in that array for these Applications, not only targetRevision.
  # So a change to a valueFiles path, a chart name or a repoURL on any of them
  # will NOT apply, and ArgoCD will keep reporting success. That is the trade
  # for having promotions survive, and it is why
  # bazel/tools/ci/check-application-drift.sh exists: run it after changing any
  # source field on monolith, monolith-agents, monolith-public, embervm or
  # embervm-dev.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: monolith
      jsonPointers:
        - /spec/sources/0/targetRevision
    - group: argoproj.io
      kind: Application
      name: monolith-public
      jsonPointers:
        - /spec/sources/0/targetRevision
    - group: argoproj.io
      kind: Application
      name: monolith-agents
      jsonPointers:
        - /spec/sources/0/targetRevision
    - group: argoproj.io
      kind: Application
      name: embervm
      jsonPointers:
        - /spec/sources/0/targetRevision
    # Kargo's embervm dev stage, armed in the same change that added
    # projects/gke-apps/embervm-dev. Same trade as the entries above.
    - group: argoproj.io
      kind: Application
      name: embervm-dev
      jsonPointers:
        - /spec/sources/0/targetRevision
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # REQUIRED alongside ignoreDifferences above. Without it ArgoCD still
      # APPLIES the git value on the next real sync even though it stopped
      # DIFFING on it, so promotions survive idle reconciliation and then
      # vanish the moment anything triggers a full sync.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
