# Hand-maintained during the GKE migration; not generated. Lists what the GKE
# cluster's root Application syncs. The root itself lives in
# root-application.yaml and is hand-applied; it is deliberately NOT listed here,
# because a root that syncs itself would reconcile away a manual repair of the
# root. check-application-drift.sh loads that file directly so the root is still
# compared against the cluster.
# 1Password Connect and the 1Password operator must be installed out of band
# before this root syncs. otel-collector, cloudflare-gateway, and tailscale each
# render OnePasswordItem resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../projects/platform-gke
  - ../../projects/gke-apps
