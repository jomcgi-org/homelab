# Hand-maintained during the GKE migration; not generated. Lists what the GKE
# cluster's root Application syncs. The root itself lives in
# root/root-application.yaml and is synced by its parent `hub-root`
# (hub-root-application.yaml); neither is listed here, because a root that syncs
# itself can be broken by a commit to itself with nothing left to sync the fix.
# check-application-drift.sh loads both files directly so they are still
# compared against the cluster.
# 1Password Connect and the 1Password operator are still bootstrapped out of band
# before this root syncs, but the platform-gke/onepassword overlay (wave 0) then
# adopts them into GitOps. otel-collector, cloudflare-gateway, and tailscale each
# render OnePasswordItem resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../projects/platform-gke
  - ../../projects/gke-apps
