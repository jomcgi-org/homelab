{{/* Read-only access for the health publisher (HOME-260): list nodes, and
read the two Argo CD Applications it reports. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-public-health-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-public-health-nodes
subjects:
  - kind: ServiceAccount
    name: health
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-public-health-nodes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: argocd
  name: factory-public-health-apps
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["argocd", "jomcgi-site-prod"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: argocd
  name: factory-public-health-apps
subjects:
  - kind: ServiceAccount
    name: health
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-public-health-apps
