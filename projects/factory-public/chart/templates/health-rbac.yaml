{{/* Read-only access for the health publisher (HOME-260): get the argocd
Application only. deploy/BUILD exempts these two objects from the
release-namespace rule. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: argocd
  name: factory-public-health-apps
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["argocd"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: argocd
  name: factory-public-health-apps
subjects:
  - kind: ServiceAccount
    name: health
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-public-health-apps
