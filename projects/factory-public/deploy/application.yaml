apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-public
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/jomcgi/homelab/charts
    chart: factory-public
    targetRevision: 0.22.24
    helm:
      releaseName: factory-public
  destination:
    server: https://kubernetes.default.svc
    namespace: factory-public
  # garage-init owns credential bytes in the kept claim Secrets.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: factory-public-factory-public-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: factory-public-factory-public-mirror-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: factory-public-factory-health-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: factory-public-factory-public-mirror-factory-health-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: factory-public-stars-forecast-mirror-s3
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: factory-public-hikes-mirror-s3
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
