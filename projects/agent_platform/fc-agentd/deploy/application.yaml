apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fc-agentd
  namespace: argocd
  # Decommission step 1 (2-step ArgoCD finalizer pattern): superseded by the
  # goosecracker agent fc-invoke workload (ADR 030). This finalizer makes the
  # app-of-apps prune CASCADE to fc-agentd's live workloads when the app manifest
  # is deleted in the follow-up PR; without it the deleted manifest would orphan
  # the running pod (kubectl delete is forbidden under GitOps).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Chart from OCI (pushed by CI via Bazel helm_push); image tag pinned at build.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: fc-agentd
      targetRevision: 0.21.0
      helm:
        valueFiles:
          - $values/projects/agent_platform/fc-agentd/deploy/values.yaml
    # Git repo for environment-specific values.
    - repoURL: https://github.com/jomcgi/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Deploy into the monolith namespace so the CNPG-generated monolith-pg-app
    # DSN secret is available without cross-namespace cloning.
    namespace: monolith
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
