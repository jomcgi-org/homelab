nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/jomcgi/homelab/projects/agent_platform/fc-agentd
  tag: latest
  pullPolicy: Always

# The harness image (projects/agent_platform/harness) the base rootfs is built
# from. The base-rootfs initContainer exports this image and bakes it into
# firecracker.baseRootfsPath, so the base always matches the deployed harness
# (the vsock-dialing fc-agent-init). Bazel pins repository + tag at build time.
harnessImage:
  repository: ghcr.io/jomcgi/homelab/projects/agent_platform/harness
  tag: latest

# Tools image (crane + e2fsprogs) the base-rootfs initContainer runs to build the
# ext4 base rootfs in-cluster, removing the manual node-4 sudo step. Bazel-pinned.
rootfsBuilder:
  image:
    repository: ghcr.io/jomcgi/homelab/projects/agent_platform/fc-agentd/rootfs-builder
    tag: latest
  # Size of the ext4 base rootfs image built from the harness filesystem.
  rootfsSize: 3G

# Guest egress (ADR 023). The guest is vsock-only, so fc-agent-init turns it into
# a dumb transparent funnel: a wildcard resolver maps every name to loopback, an
# iptables REDIRECT sends all outbound TCP to a local funnel, and the funnel
# tunnels each connection over vsock to the egress-proxy sidecar, the single
# mediator. The sidecar learns each connection's real destination from the TLS
# SNI or HTTP Host header, applies policy, resolves the real name (cluster or
# public DNS), and forwards. 6b adds TLS termination + secret swap for
# destinations that carry a credential. No per-destination routing config: the
# harness is configured with real URLs.
egress:
  enabled: true
  image:
    repository: ghcr.io/jomcgi/homelab/projects/agent_platform/egress-proxy
    tag: latest
  # Where fc-agentd forwards guest egress (the sidecar's listen address, pod-local).
  sidecarAddr: 127.0.0.1:8888
  # Loopback ports the guest's transparent egress funnel listens on (injected as
  # EGRESS_PORTS). Must list every upstream port a guest dials, since wildcard DNS
  # points all names at loopback and only these ports have a funnel listener:
  # 443 (OpenRouter + open web), 8080 (in-cluster model), 8000 (monolith artifact
  # publish, ADR 024). 80 kept for plain-HTTP destinations.
  funnelPorts: "80,443,8080,8000"
  # Egress posture. "allow" (default) routes anywhere in or out of cluster, so the
  # agent can read random docs; secrets still only materialise at their egressTo
  # (6b), so the open path cannot leak a credential. Flip to "allowlist" to
  # confine egress to `allowlist` + secrets[*].egressTo (fail closed), no rebuild.
  policy: allow
  # Destinations permitted under policy=allowlist (host[:port], comma-separated).
  # Ignored under policy=allow. secrets[*].egressTo are always permitted.
  allowlist: ""
  # Per-tier env injected into the guest harness (ADR 024), carried on the Assign
  # message. The thread's `tier` column selects one map; fc-agentd merges it over
  # the common injected env (the CA cert) and injects the result into the guest.
  # A tier is exactly the model endpoint plus the secret PLACEHOLDERS the guest is
  # allowed to hold, so the tier is the credential trust boundary: the artifact
  # tier holds the OpenRouter placeholder and NO gh token, so the sidecar's gh
  # swap can never fire for an artifact-tier guest.
  #
  # Real URLs: the guest's wildcard DNS + transparent funnel route them and the
  # sidecar resolves the real name. OPENAI_HOST is scheme+host with no path (goose
  # appends OPENAI_BASE_PATH). OPENAI_API_KEY must be set though vLLM is keyless;
  # for the artifact tier it is the high-entropy placeholder the sidecar swaps for
  # the real OpenRouter key on openrouter.ai (must match secrets[].placeholder).
  # An empty/legacy tier falls back to "default" (in-cluster Qwen).
  tiers:
    default:
      OPENAI_HOST: http://inference.inference.svc.cluster.local:8080
      OPENAI_API_KEY: sk-noauth
      GOOSE_PROVIDER: openai
      GOOSE_MODEL: qwen3.6-27b
      # The proven 6b gh flow: a default-tier guest holds the gh placeholder, which
      # the sidecar swaps for the real token only on api.github.com.
      GITHUB_TOKEN: "kloak:gh:01JZX8K3N7Q2M5R9W4T6Y0F1B8"
    artifact:
      # goose's NATIVE openrouter provider, not the generic openai-compatible one:
      # reasoning support is provider-specific in goose, and Gemini 3.5 Flash is a
      # thinking model, so under the generic openai provider goose returns turns it
      # cannot act on for generative tasks (it never emits the tool call / writes
      # the file). The native openrouter provider handles Gemini's thinking + tool
      # calls. The guest holds the placeholder as OPENROUTER_API_KEY (the var this
      # provider reads); the sidecar swaps it for the real key on openrouter.ai.
      # Host defaults to openrouter.ai, reached via the transparent egress funnel.
      GOOSE_PROVIDER: openrouter
      OPENROUTER_API_KEY: "kloak:or:B5BKP27T2KSDN6QW70N34H8DP6"
      GOOSE_MODEL: google/gemini-3.5-flash
      # TEMPORARY DIAGNOSTIC (revert): goose debug logging to capture the outgoing
      # OpenRouter request (does it carry `reasoning` + `tools`?) and the model's
      # response, host-side via fc-agentd, to confirm whether the reasoning budget
      # is actually applied. HTTP-stack crates quieted to keep the log readable.
      RUST_LOG: "goose=debug,goose_llm=debug,goose_cli=debug,info,h2=warn,hyper=warn,hyper_util=warn,rustls=warn,reqwest=warn,tower=warn,tower_http=warn"
      # Gemini 3.5 Flash is a thinking model: without an explicit reasoning
      # budget goose's openrouter provider lets the model spend the turn on
      # reasoning and return content:null, so for a generative task it never
      # emits the tool call that writes /tmp/artifact.html (ADR 024 Task 3
      # blocker). GOOSE_PREDEFINED_MODELS re-declares the model with an
      # OpenRouter `reasoning` budget so thinking produces an actionable turn
      # (the owner's steer: keep thinking on, do not disable it). The name must
      # match GOOSE_MODEL so goose applies these request_params to the selected
      # model. Renders to FC_AGENTD_TIER_artifact__GOOSE_PREDEFINED_MODELS.
      GOOSE_PREDEFINED_MODELS: '[{"name":"google/gemini-3.5-flash","provider":"openrouter","request_params":{"reasoning":{"effort":"high"}}}]'
      # Where the artifact recipe publishes (ADR 024 Task 3). In-cluster monolith
      # backend; the guest reaches it through the transparent egress funnel (the
      # sidecar routes by Host, no secret swap for this host). Injected only into
      # artifact-tier guests, so only they can publish.
      ARTIFACT_PUBLISH_URL: http://monolith.monolith.svc.cluster.local:8000/internal/artifact
  # 6b CA: cert-manager generates + rotates the self-signed CA the sidecar uses to
  # mint leaf certs when it TLS-terminates a secret-bearing destination. Only
  # created when `secrets` below is non-empty.
  ca:
    duration: 87600h # 10y; rotation churns guest trust, keep it rare
    renewBefore: 2160h # 90d
  # 6b: the ADR-023 secret catalog (shaped like the future SecretProxy CRD
  # spec.secrets). Each entry: a high-entropy `placeholder` the guest holds as
  # `env`; the sidecar swaps it for the real value (literal `value` for tests, or
  # `secretRef` {name,key} for production) only on a connection whose host is in
  # `egressTo`. egressTo is the exfiltration control: everywhere else the inert
  # placeholder leaves. Literal swap only (a base64'd git-Basic token is ADR-
  # deferred). A non-empty list enables the CA + TLS-terminate path.
  secrets:
    # The agent's gh/API calls carry this placeholder; the sidecar swaps it for the
    # real token (already in-namespace, synced by the monolith from 1Password) only
    # on api.github.com. Literal swap: gh API works; raw git-over-HTTPS Basic (a
    # base64'd token) is ADR-deferred.
    - env: GITHUB_TOKEN
      placeholder: "kloak:gh:01JZX8K3N7Q2M5R9W4T6Y0F1B8"
      egressTo: [api.github.com]
      secretRef: { name: monolith-chat-secrets, key: GITHUB_TOKEN }
    # The artifact tier's OpenRouter key (ADR 024): the guest holds this
    # placeholder as OPENAI_API_KEY (egress.tiers.artifact); the sidecar swaps it
    # for the real key only on openrouter.ai. The real value is synced from
    # 1Password into the `goosecracker` Secret by the monolith chart's
    # OnePasswordItem. placeholder MUST match egress.tiers.artifact.OPENAI_API_KEY.
    - env: OPENROUTER_KEY
      placeholder: "kloak:or:B5BKP27T2KSDN6QW70N34H8DP6"
      egressTo: [openrouter.ai]
      secretRef: { name: goosecracker, key: OPENROUTER_API_KEY }
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 64Mi

replicas: 1

# Pod annotations. The egress-proxy sidecar tunnels guest egress to upstreams;
# its connection to the Linkerd-meshed monolith backend (port 8000, the artifact
# publish target, ADR 024) stalls in the pod's Linkerd outbound when blind-
# tunnelled, while unmeshed upstreams (the in-cluster model on 8080) work. Skip
# Linkerd outbound for port 8000 so the egress-proxy reaches the monolith as a
# plain in-cluster client (the monolith's permissive Linkerd inbound accepts it,
# the same path unmeshed callers use). Scoped to 8000, so only the artifact
# publish is affected; everything else stays meshed.
podAnnotations:
  config.linkerd.io/skip-outbound-ports: "8000"

# node + arch the controller manages. Firecracker snapshots are node/arch-bound,
# so the daemon is pinned to its node and only reconciles that node's threads.
node: node-4
arch: amd64

nodeSelector:
  kubernetes.io/hostname: node-4

# Stable infrastructure controller, not a disposable victim (ADR platform/010).
priorityClassName: homelab-critical

tolerations: []
affinity: {}

# Concurrency + OOM safety for the microVM tier. fc-agentd runs each Firecracker
# guest as a child process, so guest RAM counts against THIS container's cgroup.
# Two mechanisms keep that from taking the controller down:
#   1. maxConcurrent caps live microVMs; the reconcile loop queues the rest as
#      PENDING. Since Firecracker hard-caps each guest's RAM, maxConcurrent *
#      guestMemMib is a true upper bound on microVM memory in the cgroup.
#   2. guestOomScoreAdj biases the kernel to kill a guest, never the daemon, if
#      memory pressure does hit (the disposable-victim intent of ADR platform/010,
#      applied to processes because the guests are not pods).
agent:
  maxConcurrent: 8
  guestMemMib: 1024
  guestOomScoreAdj: 1000

# The limit must hold maxConcurrent guests plus the daemon: 8 * 1Gi + ~1Gi
# overhead = 9Gi. Burstable: request a small warm floor (~2 guests), let the
# limit cover the capped peak. The admission cap guarantees the cgroup never
# exceeds it, and oom_score_adj guarantees a guest dies first if it ever nears.
resources:
  requests:
    cpu: 50m
    memory: 2Gi
  limits:
    memory: 9Gi

# The monolith Postgres DSN (claude_agent.agent_threads registry). Defaults to
# the CNPG-generated app credential. When deployed outside the monolith
# namespace the secret must be cloned in (Kyverno) first.
database:
  secretName: monolith-pg-app
  secretKey: uri

# Firecracker substrate paths on node-4. Driving real microVMs (privileged +
# these host mounts) is gated behind `firecracker.enabled`; until then the
# daemon runs the reconcile loop against the registry and idles (an empty
# registry means it never claims a microVM).
firecracker:
  enabled: false
  binPath: /opt/kata/bin/firecracker
  kernelImagePath: /opt/kata/share/kata-containers/vmlinux.container
  # The whole nvme dir is mounted so both the per-thread bundles (snapshotRoot)
  # and the shared base rootfs (baseRootfsPath) are reachable.
  nvmeRoot: /disks/nvme-02
  snapshotRoot: /disks/nvme-02/agent-threads
  # baseRootfsPath is the read-only base rootfs image (built from the harness
  # image). When set, each thread gets its own writable copy.
  baseRootfsPath: ""
  rootfsPath: ""

reconcileInterval: 5s

tracing:
  endpoint: ""
  serviceName: fc-agentd
  serviceVersion: ""

serviceAccount:
  create: true
  name: ""

# Non-privileged by default (uid 65532). When firecracker.enabled is true the
# pod runs privileged with /dev/kvm + the kata/devmapper/nvme host mounts so it
# can exec firecracker and read/write snapshots.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
