apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fc-agentd.fullname" . }}
  labels:
    {{- include "fc-agentd.labels" . | nindent 4 }}
spec:
  # Single replica: the controller is node-affine (snapshots are node-bound) and
  # owns its node's microVMs. Recreate, never run two against the same node.
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    # Single-Deployment chart: the shared-selector collision this rule guards
    # against cannot occur, and the Deployment is already live with this
    # name+instance selector (immutable) - adding a component label would break
    # ArgoCD sync rather than fix anything.
    matchLabels:
      # nosemgrep: bazel.semgrep.rules.kubernetes.require-component-label-in-selector
      {{- include "fc-agentd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fc-agentd.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fc-agentd.serviceAccountName" . }}
      priorityClassName: {{ .Values.priorityClassName }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.firecracker.enabled }}
      # Driving Firecracker needs the host KVM device, the kata binary + kernel,
      # the devmapper pool, and the snapshot dir.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      {{- else }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if and .Values.firecracker.enabled .Values.firecracker.baseRootfsPath }}
      # Build the base rootfs in-cluster from the pinned harness image, so the
      # node never needs a manual sudo rootfs placement. Idempotent: rebuilds
      # only when the harness image ref changes.
      initContainers:
        - name: build-base-rootfs
          image: "{{ .Values.rootfsBuilder.image.repository }}:{{ .Values.rootfsBuilder.image.tag }}"
          command: ["/bin/bash", "/scripts/build-base-rootfs.sh"]
          env:
            - name: HARNESS_IMAGE
              value: "{{ .Values.harnessImage.repository }}:{{ .Values.harnessImage.tag }}"
            - name: BASE_ROOTFS_PATH
              value: {{ .Values.firecracker.baseRootfsPath | quote }}
            - name: ROOTFS_SIZE
              value: {{ .Values.rootfsBuilder.rootfsSize | quote }}
          volumeMounts:
            - name: nvme
              mountPath: {{ .Values.firecracker.nvmeRoot }}
            - name: rootfs-builder-script
              mountPath: /scripts
              readOnly: true
            - name: rootfs-builder-work
              mountPath: /work
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 512Mi
      {{- end }}
      containers:
        - name: fc-agentd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.firecracker.enabled }}
          securityContext:
            privileged: true
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: FC_AGENTD_NODE
              value: {{ .Values.node | quote }}
            - name: FC_AGENTD_ARCH
              value: {{ .Values.arch | quote }}
            - name: FC_AGENTD_RECONCILE_INTERVAL
              value: {{ .Values.reconcileInterval | quote }}
            - name: FC_AGENTD_SNAPSHOT_ROOT
              value: {{ .Values.firecracker.snapshotRoot | quote }}
            {{- if .Values.firecracker.enabled }}
            - name: FC_AGENTD_FIRECRACKER_BIN
              value: {{ .Values.firecracker.binPath | quote }}
            - name: FC_AGENTD_KERNEL_IMAGE
              value: {{ .Values.firecracker.kernelImagePath | quote }}
            # Concurrency cap + per-guest RAM + OOM bias (see values.yaml `agent`).
            # maxConcurrent * guestMemMib must fit under resources.limits.memory.
            - name: FC_AGENTD_MAX_CONCURRENT
              value: {{ .Values.agent.maxConcurrent | quote }}
            - name: FC_AGENTD_GUEST_MEM_MIB
              value: {{ .Values.agent.guestMemMib | quote }}
            - name: FC_AGENTD_GUEST_OOM_SCORE_ADJ
              value: {{ .Values.agent.guestOomScoreAdj | quote }}
            {{- with .Values.firecracker.rootfsPath }}
            - name: FC_AGENTD_ROOTFS_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.firecracker.baseRootfsPath }}
            - name: FC_AGENTD_BASE_ROOTFS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.firecracker.enabled .Values.egress.enabled }}
            # Egress (ADR 023 + 024): forward guest vsock egress to the sidecar,
            # and project the PER-TIER harness env into the guest via the Assign
            # message. Each tiers.<TIER>.<KEY> becomes FC_AGENTD_TIER_<TIER>__<KEY>;
            # the controller selects the thread's tier, merges it over the common
            # injected env, and injects <KEY> into the guest. "__" separates the
            # tier name from the env name (which may itself contain underscores,
            # e.g. OPENAI_API_KEY). Routing needs no config: the guest funnels all
            # egress to the sidecar, which routes by SNI/Host.
            - name: FC_AGENTD_EGRESS_SIDECAR
              value: {{ .Values.egress.sidecarAddr | quote }}
            {{- range $tier, $env := .Values.egress.tiers }}
            {{- range $k, $v := $env }}
            - name: FC_AGENTD_TIER_{{ $tier }}__{{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.egress.secrets }}
            # Secret swap (ADR 023 6b): the guest holds PLACEHOLDERS as its secret
            # env vars, but scoped PER TIER (egress.tiers above, ADR 024) rather
            # than injected globally, so the tier bounds which credentials a guest
            # can cause the sidecar to swap. The CA cert (public, never the key) is
            # common to every tier so any guest trusts the leaves the sidecar mints.
            - name: FC_AGENTD_INJECT_EGRESS_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ include "fc-agentd.fullname" . }}-egress-ca
                  key: tls.crt
            {{- end }}
            {{- end }}
            {{- with .Values.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | quote }}
            {{- with .Values.tracing.serviceVersion }}
            - name: OTEL_SERVICE_VERSION
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.firecracker.enabled }}
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            - name: kata
              mountPath: /opt/kata
              readOnly: true
            - name: dev-mapper
              mountPath: /dev/mapper
            - name: nvme
              mountPath: {{ .Values.firecracker.nvmeRoot }}
          {{- end }}
        {{- if and .Values.firecracker.enabled .Values.egress.enabled }}
        # Egress-proxy sidecar (ADR 023): the only process that reaches the
        # network on the guest's behalf, allowlisted. fc-agentd forwards guest
        # vsock egress here over localhost; the sidecar never sees the guest's
        # control frames. 6a is plain allowlist-forward; 6b adds TLS termination
        # + placeholder secret-swap. Runs non-root (overriding the pod's root).
        - name: egress-proxy
          image: "{{ .Values.egress.image.repository }}:{{ .Values.egress.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: EGRESS_LISTEN
              value: {{ .Values.egress.sidecarAddr | quote }}
            - name: EGRESS_POLICY
              value: {{ .Values.egress.policy | default "allow" | quote }}
            {{- if eq (.Values.egress.policy | default "allow") "allowlist" }}
            # Under policy=allowlist the sidecar denies any destination not in this
            # list (plus secrets[*].egressTo, always permitted). Fail closed.
            - name: EGRESS_ALLOWLIST
              value: {{ .Values.egress.allowlist | quote }}
            {{- end }}
            {{- if .Values.egress.secrets }}
            # Secret swap (ADR 023 6b). EGRESS_SECRETS is the non-secret catalog
            # (placeholder -> env -> egressTo); the real value of each is supplied
            # below from its Secret (or a literal for tests). The CA (cert + key)
            # is mounted so the sidecar can mint leaves; the key never leaves here.
            {{- $catalog := list }}
            {{- range $s := .Values.egress.secrets }}
            {{- $catalog = append $catalog (dict "placeholder" $s.placeholder "env" $s.env "egressTo" $s.egressTo) }}
            {{- end }}
            - name: EGRESS_SECRETS
              value: {{ $catalog | toJson | quote }}
            - name: EGRESS_CA_CERT_FILE
              value: /etc/egress-ca/tls.crt
            - name: EGRESS_CA_KEY_FILE
              value: /etc/egress-ca/tls.key
            {{- range $s := .Values.egress.secrets }}
            - name: {{ $s.env }}
              {{- if $s.secretRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.secretRef.name }}
                  key: {{ $s.secretRef.key }}
              {{- else }}
              value: {{ $s.value | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
          {{- if .Values.egress.secrets }}
          volumeMounts:
            - name: egress-ca
              mountPath: /etc/egress-ca
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.firecracker.enabled }}
      volumes:
        {{- if and .Values.egress.enabled .Values.egress.secrets }}
        # cert-manager-issued egress CA (cert + key), mounted into the sidecar only.
        - name: egress-ca
          secret:
            secretName: {{ include "fc-agentd.fullname" . }}-egress-ca
        {{- end }}
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: kata
          hostPath:
            path: /opt/kata
            type: Directory
        - name: dev-mapper
          hostPath:
            path: /dev/mapper
            type: Directory
        - name: nvme
          hostPath:
            path: {{ .Values.firecracker.nvmeRoot }}
            type: Directory
        {{- if .Values.firecracker.baseRootfsPath }}
        - name: rootfs-builder-script
          configMap:
            name: {{ include "fc-agentd.fullname" . }}-rootfs-builder
        - name: rootfs-builder-work
          emptyDir: {}
        {{- end }}
      {{- end }}
