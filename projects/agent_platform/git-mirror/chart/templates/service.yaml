apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-mirror.fullname" . }}
  labels:
    {{- include "git-mirror.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # Force the request to the node-local pod: Firecracker guests are on node-4
  # and should always hit the co-located mirror, not a remote pod endpoint.
  internalTrafficPolicy: Local
  selector:
    {{- include "git-mirror.selectorLabels" . | nindent 4 }}
  ports:
    - name: git
      port: {{ .Values.gitDaemonPort }}
      targetPort: git
      protocol: TCP
