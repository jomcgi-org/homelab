apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: semgrep-scand
  namespace: argocd
  # Decommission step 1 (semgrep now runs on fc-invoke): add the resources
  # finalizer so that when this Application is removed from git (step 2), the
  # root app-of-apps prune cascades to its workloads instead of orphaning them.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Chart from OCI (pushed by CI via Bazel helm_push); image tags pinned at build.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: semgrep-scand
      targetRevision: 0.4.7
      helm:
        valueFiles:
          - $values/projects/agent_platform/semgrep-scand/deploy/values.yaml
    # Git repo for environment-specific values.
    - repoURL: https://github.com/jomcgi/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Deploy into the monolith namespace, alongside fc-agentd, so the monolith
    # reaches the scanner at semgrep-scand.monolith.svc.cluster.local in-namespace.
    namespace: monolith
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
