apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semgrep-scand.fullname" . }}
  labels:
    {{- include "semgrep-scand.labels" . | nindent 4 }}
spec:
  # Single replica: the daemon is node-affine (FC guests are node-bound) and owns
  # its node's scratch disk. Recreate, never run two against the same node.
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    # Single-Deployment chart: the shared-selector collision this rule guards
    # against cannot occur, and adding a component label would break ArgoCD sync
    # on the immutable selector rather than fix anything.
    matchLabels:
      # nosemgrep: bazel.semgrep.rules.kubernetes.require-component-label-in-selector
      {{- include "semgrep-scand.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "semgrep-scand.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "semgrep-scand.serviceAccountName" . }}
      priorityClassName: {{ .Values.priorityClassName }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.firecracker.enabled }}
      # Driving Firecracker needs the host KVM device, the kata binary + kernel,
      # the devmapper pool, and the scratch dir.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      {{- else }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if and .Values.firecracker.enabled .Values.firecracker.baseRootfsPath }}
      # Build the base rootfs in-cluster from the pinned semgrep-guest image, so
      # the node never needs a manual sudo rootfs placement. Idempotent: rebuilds
      # only when the guest image ref changes.
      initContainers:
        - name: build-base-rootfs
          image: "{{ .Values.rootfsBuilder.image.repository }}:{{ .Values.rootfsBuilder.image.tag }}"
          command: ["/bin/bash", "/scripts/build-base-rootfs.sh"]
          env:
            - name: GUEST_IMAGE
              value: "{{ .Values.guestImage.repository }}:{{ .Values.guestImage.tag }}"
            - name: BASE_ROOTFS_PATH
              value: {{ .Values.firecracker.baseRootfsPath | quote }}
            - name: ROOTFS_SIZE
              value: {{ .Values.rootfsBuilder.rootfsSize | quote }}
          volumeMounts:
            - name: nvme
              mountPath: {{ .Values.firecracker.nvmeRoot }}
            - name: rootfs-builder-script
              mountPath: /scripts
              readOnly: true
            - name: rootfs-builder-work
              mountPath: /work
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 512Mi
      {{- end }}
      containers:
        - name: semgrep-scand
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.firecracker.enabled }}
          securityContext:
            privileged: true
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SEMGREP_SCAND_LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: SEMGREP_SCAND_NODE
              value: {{ .Values.node | quote }}
            - name: SEMGREP_SCAND_ARCH
              value: {{ .Values.arch | quote }}
            # Concurrency cap + per-guest sizing + OOM bias (see values.yaml
            # `agent`). maxConcurrent * guestMemMib must fit under
            # resources.limits.memory.
            - name: SEMGREP_SCAND_MAX_CONCURRENT
              value: {{ .Values.agent.maxConcurrent | quote }}
            - name: SEMGREP_SCAND_GUEST_MEM_MIB
              value: {{ .Values.agent.guestMemMib | quote }}
            - name: SEMGREP_SCAND_GUEST_VCPUS
              value: {{ .Values.agent.guestVcpus | quote }}
            - name: SEMGREP_SCAND_GUEST_OOM_SCORE_ADJ
              value: {{ .Values.agent.guestOomScoreAdj | quote }}
            {{- if .Values.firecracker.enabled }}
            - name: SEMGREP_SCAND_FIRECRACKER_BIN
              value: {{ .Values.firecracker.binPath | quote }}
            - name: SEMGREP_SCAND_KERNEL_IMAGE
              value: {{ .Values.firecracker.kernelImagePath | quote }}
            {{- with .Values.firecracker.kernelBootArgs }}
            - name: SEMGREP_SCAND_KERNEL_BOOT_ARGS
              value: {{ . | quote }}
            {{- end }}
            - name: SEMGREP_SCAND_HARNESS_INIT
              value: {{ .Values.firecracker.harnessInit | quote }}
            - name: SEMGREP_SCAND_NVME_ROOT
              value: {{ .Values.firecracker.scanRoot | quote }}
            {{- with .Values.firecracker.baseRootfsPath }}
            - name: SEMGREP_SCAND_BASE_ROOTFS
              value: {{ . | quote }}
            {{- end }}
            # Per-scan rootfs strategy: "copy" (full file copy) or "devmapper"
            # (copy-on-write thin-snapshot of the base in the node's shared
            # thin-pool). thinPool names the pool to snapshot into.
            - name: SEMGREP_SCAND_PROVISIONER
              value: {{ .Values.firecracker.rootfsProvisioner | quote }}
            - name: SEMGREP_SCAND_THIN_POOL
              value: {{ .Values.firecracker.thinPool | quote }}
            {{- end }}
            {{- with .Values.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | quote }}
            {{- with .Values.tracing.serviceVersion }}
            - name: OTEL_SERVICE_VERSION
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.firecracker.enabled }}
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            - name: kata
              mountPath: /opt/kata
              readOnly: true
            - name: dev-mapper
              mountPath: /dev/mapper
            - name: nvme
              mountPath: {{ .Values.firecracker.nvmeRoot }}
          {{- end }}
      {{- if .Values.firecracker.enabled }}
      volumes:
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: kata
          hostPath:
            path: /opt/kata
            type: Directory
        - name: dev-mapper
          hostPath:
            path: /dev/mapper
            type: Directory
        - name: nvme
          hostPath:
            path: {{ .Values.firecracker.nvmeRoot }}
            type: Directory
        {{- if .Values.firecracker.baseRootfsPath }}
        - name: rootfs-builder-script
          configMap:
            name: {{ include "semgrep-scand.fullname" . }}-rootfs-builder
        - name: rootfs-builder-work
          emptyDir: {}
        {{- end }}
      {{- end }}
