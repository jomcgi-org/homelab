apiVersion: v1
kind: Service
metadata:
  name: {{ include "semgrep-scand.fullname" . }}
  labels:
    {{- include "semgrep-scand.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    # Single-Deployment chart: the component-label selector rule guards against a
    # shared-selector collision that cannot occur here.
    # nosemgrep: bazel.semgrep.rules.kubernetes.require-component-label-in-selector
    {{- include "semgrep-scand.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
