{{- if .Values.r2Credentials.onepassword.itemPath }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.r2Credentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scotland-connector.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.r2Credentials.onepassword.itemPath | quote }}
{{- end }}
{{- if .Values.cacheAnalytics.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.cacheAnalytics.credentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scotland-connector.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.cacheAnalytics.credentials.onepassword.itemPath | quote }}
{{- end }}
