{{- if not .Values.config.r2Endpoint }}
{{- fail "config.r2Endpoint is required" }}
{{- end }}
{{- if and .Values.meterExport.enabled (empty .Values.meterExport.endpoint) }}
{{- fail "meterExport.endpoint is required when enabled" }}
{{- end }}
{{- if .Values.cacheAnalytics.enabled }}
{{- if or .Values.autoscaling.enabled (ne (int .Values.replicas) 1) (ne .Values.strategy.type "Recreate") }}
{{- fail "cacheAnalytics requires replicas=1, autoscaling disabled and strategy.type=Recreate" }}
{{- end }}
{{- if or (empty .Values.cacheAnalytics.zone) (empty .Values.cacheAnalytics.hostname) (empty .Values.cacheAnalytics.planPath) (empty .Values.cacheAnalytics.credentials.secretName) (empty .Values.cacheAnalytics.credentials.onepassword.itemPath) }}
{{- fail "cacheAnalytics requires zone, hostname, planPath and independent 1Password credentials" }}
{{- end }}
{{- if eq .Values.cacheAnalytics.credentials.secretName .Values.r2Credentials.secretName }}
{{- fail "cacheAnalytics must not reuse R2 credentials" }}
{{- end }}
{{- if eq .Values.cacheAnalytics.credentials.onepassword.itemPath .Values.r2Credentials.onepassword.itemPath }}
{{- fail "cacheAnalytics must not reuse R2 itemPath" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scotland-connector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scotland-connector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    {{- if eq .Values.strategy.type "Recreate" }}
    type: Recreate
    {{- else }}
    {{- toYaml .Values.strategy | nindent 4 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "scotland-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scotland-connector.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "scotland-connector.fullname" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Spread replicas so a node drain or a zone event takes at most part of
      # the serving set.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "scotland-connector.selectorLabels" . | nindent 14 }}
      containers:
        - name: connector
          image: {{ include "scotland-connector.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.adminPort }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: ADMIN_ADDR
              value: ":{{ .Values.adminPort }}"
            - name: R2_ENDPOINT
              value: {{ .Values.config.r2Endpoint | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.region | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.r2Credentials.secretName }}
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.r2Credentials.secretName }}
                  key: secret-access-key
            - name: STARS_BUCKET
              value: {{ .Values.config.bucket | quote }}
            - name: STARS_SITES_KEY
              value: {{ .Values.config.sitesKey | quote }}
            - name: STARS_HISTORY_KEY
              value: {{ .Values.config.historyKey | quote }}
            - name: STARS_WALKS_KEY
              value: {{ .Values.config.walksKey | quote }}
            - name: REFRESH_INTERVAL
              value: {{ .Values.config.refreshInterval | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.config.publicBaseURL | quote }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ join "," .Values.config.mcpAllowedOrigins | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.Version | quote }}
            - name: TOOL_UNIT_PRICES
              value: {{ toJson .Values.toolUnitPrices | quote }}
            - name: METER_EXPORT_ENABLED
              value: {{ .Values.meterExport.enabled | quote }}
            {{- if .Values.meterExport.enabled }}
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: {{ .Values.meterExport.endpoint | quote }}
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- end }}
            - name: CACHE_ANALYTICS_ENABLED
              value: {{ .Values.cacheAnalytics.enabled | quote }}
            {{- if .Values.cacheAnalytics.enabled }}
            - name: CACHE_ANALYTICS_ZONE
              value: {{ .Values.cacheAnalytics.zone | quote }}
            - name: CACHE_ANALYTICS_HOSTNAME
              value: {{ .Values.cacheAnalytics.hostname | quote }}
            - name: CACHE_ANALYTICS_PLAN_PATH
              value: {{ .Values.cacheAnalytics.planPath | quote }}
            - name: CACHE_ANALYTICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cacheAnalytics.credentials.secretName | quote }}
                  key: {{ required "cacheAnalytics tokenKey is required" .Values.cacheAnalytics.credentials.tokenKey | quote }}
            {{- end }}
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            - name: SHUTDOWN_GRACE
              value: "{{ sub (sub .Values.terminationGracePeriodSeconds .Values.preStopSleepSeconds) 5 }}s"
          startupProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 2
            # A minute for the first R2 load, longer than the client timeout.
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
