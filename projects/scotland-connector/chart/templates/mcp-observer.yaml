{{- if and .Values.mcpObserver.routeThrough (not .Values.mcpObserver.enabled) }}
{{- fail "mcpObserver.routeThrough requires mcpObserver.enabled" }}
{{- end }}
{{- if .Values.mcpObserver.enabled }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "mcpObserver requires networkPolicy.enabled" }}
{{- end }}
{{- $name := printf "%s-mcp-observer" (include "scotland-connector.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
data:
  envoy.yaml: |
    {{- include "scotland-connector.observerConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: scotland-mcp-observer, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: scotland-mcp-observer, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ include "scotland-connector.observerConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: envoy
          image: {{ .Values.mcpObserver.image | quote }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "1", "--log-level", "warn", "--disable-hot-restart"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.mcpObserver.resources | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: scotland-mcp-observer, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
---
# Namespace ingress default-deny already admits the shared gateway on 8080.
# Only this proxy can additionally reach the connector public port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-upstream
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "scotland-connector.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: scotland-mcp-observer, app.kubernetes.io/instance: {{ .Release.Name }}}
      ports:
        - {protocol: TCP, port: {{ .Values.service.targetPort }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: scotland-mcp-observer, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "scotland-connector.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.targetPort }}}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
        {{- range .Values.networkPolicy.egress.dnsServiceCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
