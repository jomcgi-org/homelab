apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scotland-connector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: scotland-connector
      targetRevision: 0.65.3
      helm:
        releaseName: scotland-connector
        valueFiles:
          - $values/projects/scotland-connector/deploy/values.yaml
          - $values/projects/scotland-connector/factory/values.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
      path: projects/scotland-connector/factory/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: scotland-connector
  syncPolicy:
    automated:
      # Off: the first syncs use a chart pin that still renders the Namespace,
      # and a later chart without it must not prune the namespace and its
      # resources. Turn it back on once the pin includes createNamespace.
      prune: false
      selfHeal: true
    # The chart's Namespace is off here (factory/values.yaml), so Argo CD
    # creates the namespace with the same restricted Pod Security labels.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: scotland-connector
      namespace: scotland-connector
      jsonPointers:
        - /spec/replicas
