# Values of the hub copy of the Scotland connector. The factory copy
# (application.yaml here) layers factory/values.yaml on top of this file.

# HOME-540 scales the hub copy to zero pods with no autoscaler. The hub
# Application cannot take a new values file, because Argo CD keeps its sources
# as Kargo set them (projects/gke-cluster/root/root-application.yaml). So the
# hub-only keys go here, and factory/values.yaml restores the chart defaults
# for the factory copy. The namespace, the R2 Secret and the Kargo stage stay.
replicas: 0
autoscaling:
  enabled: false

config:
  # Cloudflare R2 account endpoint, the one the monolith's stars-refresh job
  # writes stars/sites.json and stars/history-map.json to.
  r2Endpoint: https://7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com
  # Where the route below serves the API; method_url and the OpenAPI servers
  # entry are built from it.
  publicBaseURL: https://jomcgi.dev/scotland
  # Snapshot-only aurora tool (#7256). Rollback is this flag.
  auroraEnabled: true

r2Credentials:
  onepassword:
    # The existing read-only R2 token monolith-public already uses for the
    # same stars objects. A token scoped to the stars bucket alone would be
    # tighter; it needs a new R2 token and 1Password item.
    itemPath: vaults/k8s-homelab/items/r2-s3-public-read

route:
  # Off since HOME-540. The jomcgi-site Worker owns jomcgi.dev/scotland/mcp*
  # and /scotland/v1* (projects/jomcgi-site/edge/routes.json) and answers
  # them with a 308 to the same path on scotland-mcp.jomcgi.dev.
  #
  # Before HOME-540 this served the public apex under /scotland (#7243).
  # The hostname and prefix stay for a rollback and the chart tests.
  #
  # These values deploy from git HEAD while Kargo sets the chart version, so
  # a chart below 0.3.1 (which ignores pathPrefix) would serve this route on
  # bare /v1 and /mcp. Keep that in mind before lowering the Kargo pin.
  enabled: false
  hostname: jomcgi.dev
  pathPrefix: /scotland
