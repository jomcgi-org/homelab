apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: scotland-connector-rate-limit
  namespace: edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: scotland-connector
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - reset-before-request
        - refused-stream
    perRetry:
      backOff:
        baseInterval: 25ms
        maxInterval: 100ms
  timeout:
    tcp:
      connectTimeout: 1s
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 120
            unit: Minute
        - clientSelectors:
            - headers:
                - name: CF-Connecting-IP
                  type: RegularExpression
                  value: ^(?:160\.79\.10[45]\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|(?i:2607:6bc0:(?:0{1,4})?:[0-9a-f:]*))$
          limit:
            requests: 12000
            unit: Minute
        - clientSelectors:
            - headers:
                - name: CF-Connecting-IP
                  type: Distinct
                - name: CF-Connecting-IP
                  type: RegularExpression
                  value: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,7}:|(?:[0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,5}(?::[0-9A-Fa-f]{1,4}){1,2}|(?:[0-9A-Fa-f]{1,4}:){1,4}(?::[0-9A-Fa-f]{1,4}){1,3}|(?:[0-9A-Fa-f]{1,4}:){1,3}(?::[0-9A-Fa-f]{1,4}){1,4}|(?:[0-9A-Fa-f]{1,4}:){1,2}(?::[0-9A-Fa-f]{1,4}){1,5}|[0-9A-Fa-f]{1,4}:(?:(?::[0-9A-Fa-f]{1,4}){1,6})|:(?:(?::[0-9A-Fa-f]{1,4}){1,7}|:))$
                - name: CF-Connecting-IP
                  type: RegularExpression
                  value: ^(?:160\.79\.10[45]\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|(?i:2607:6bc0:(?:0{1,4})?:[0-9a-f:]*))$
                  invert: true
          limit:
            requests: 120
            unit: Minute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scotland-connector
  namespace: edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: edge
  hostnames:
    - scotland-mcp.jomcgi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - group: ''
          kind: Service
          name: scotland-connector
          port: 80
          weight: 1
          namespace: scotland-connector
      timeouts:
        request: 10s
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - group: ''
          kind: Service
          name: scotland-connector
          port: 80
          weight: 1
          namespace: scotland-connector
      timeouts:
        request: 10s
---
# A public route (Joe's decisions:
# https://factory-plan.jomcgi.dev/factory/issue/HOME-259#comment-3908 and
# https://factory-plan.jomcgi.dev/factory/issue/HOME-259#comment-3953).
# This route-level policy replaces the gateway-wide OIDC policy. It matches
# the hub's origin policy: Cloudflare Workers can set CF-Connecting-IP, so
# their subrequests are refused rather than trusted as a client identity.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: scotland-connector-public
  namespace: edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: scotland-connector
  authorization:
    defaultAction: Allow
    rules:
      - name: deny-same-zone-workers
        action: Deny
        principal:
          headers:
            - name: CF-Worker
              values:
                - "jomcgi.dev"
      - name: deny-cross-zone-workers
        action: Deny
        principal:
          headers:
            - name: "CF-Connecting-IP"
              values:
                - "2a06:98c0:3600::103"
