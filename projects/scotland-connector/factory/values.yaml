# Layered on deploy/values.yaml, which retires the hub copy (HOME-475). The
# factory copy keeps the chart's autoscaler and its fallback count.
replicas: 2
autoscaling:
  enabled: true
createNamespace: false
config:
  publicBaseURL: https://scotland-mcp.jomcgi.dev
route:
  enabled: false
networkPolicy:
  gateway:
    namespace: edge
    podLabels:
      gateway.envoyproxy.io/owning-gateway-name: edge
      gateway.envoyproxy.io/owning-gateway-namespace: edge
