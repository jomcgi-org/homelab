[project]
name = "oominf-reference"
version = "0.0.0"
description = "CPU reference fixtures for oom-inference, from the HF transformers model implementations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    # 5.16.1 is the first version we verified ships models/qwen4_exp.
    "transformers==5.16.1",
    "safetensors>=0.6,<1",
    "numpy>=2.0,<3",
    "jinja2>=3.1,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
