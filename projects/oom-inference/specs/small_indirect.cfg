\* Fast CI config, slot-table indirection mode with a lookahead staging
\* buffer: safety and table stability (liveness is in live_indirect.cfg;
\* checking it at this size takes minutes).
CONSTANTS
    Experts = {e1, e2, e3}
    Slots = {s1, s2, s3}
    HostBufs = {h1, h2}
    StageBufs = {h2}
    TopK = 2
    MaxInflight = 1
    GraphMax = 1
    None = None
    Garbage = Garbage
    Mode = "indirect"
    Bug = "none"
SPECIFICATION Spec
INVARIANTS TypeOK KernelReadsValid CopySourceValid TableConsistent GraphValid NoDuplicates TableReadValid
PROPERTY TableStable
