\* Fast config for CI: safety and liveness (no symmetry: unsound for
\* liveness). Slots >= TopK + GraphMax, so the demand path can always find
\* room once in-flight work drains.
CONSTANTS
    Experts = {e1, e2, e3}
    Slots = {s1, s2, s3}
    HostBufs = {h1}
    TopK = 2
    MaxInflight = 1
    GraphMax = 1
    None = None
    Garbage = Garbage
    Bug = "none"
SPECIFICATION Spec
INVARIANTS TypeOK KernelReadsValid CopySourceValid TableConsistent GraphValid NoDuplicates
PROPERTY RoutedLayerLaunches
