\* Fast CI config, slot-table indirection mode: safety, table stability and
\* liveness (no symmetry: unsound for liveness), with a cache buffer and a
\* lookahead staging buffer. Slots >= TopK leaves the demand path room.
CONSTANTS
    Experts = {e1, e2}
    Slots = {s1, s2}
    MinSlots = 2
    HostBufs = {h1, h2}
    StageBufs = {h2}
    TopK = 2
    MaxInflight = 1
    GraphMax = 1
    None = None
    Garbage = Garbage
    Mode = "indirect"
    Bug = "none"
SPECIFICATION Spec
INVARIANTS TypeOK KernelReadsValid CopySourceValid TableConsistent GraphValid NoDuplicates TableReadValid
PROPERTIES TableStable RoutedLayerLaunches StepCompletes
