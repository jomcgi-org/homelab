\* Larger safety-only config, slot-table indirection mode with two kernels
\* in flight and a lookahead staging buffer (symmetry reduced).
CONSTANTS
    Experts = {e1, e2, e3, e4}
    Slots = {s1, s2, s3, s4}
    HostBufs = {h1, h2, h3}
    StageBufs = {h3}
    TopK = 2
    MaxInflight = 2
    GraphMax = 1
    None = None
    Garbage = Garbage
    Mode = "indirect"
    Bug = "none"
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS TypeOK KernelReadsValid CopySourceValid TableConsistent GraphValid NoDuplicates TableReadValid
PROPERTY TableStable
