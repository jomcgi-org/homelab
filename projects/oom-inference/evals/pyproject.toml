[project]
name = "oominf-evals"
version = "0.0.0"
description = "Benchmark harness for oom-inference over its OpenAI-compatible API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub>=0.30,<2",
    "pyarrow>=18",
    "tokenizers>=0.21,<1",
]

[tool.uv]
package = false
# GHSA-6q48-6c7w-9gw2: exclude the compromised emSign trust anchor.
constraint-dependencies = ["certifi>=2026.10.19"]
