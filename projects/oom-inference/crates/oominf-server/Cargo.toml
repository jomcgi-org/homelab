[package]
name = "oominf-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
minijinja = { version = "2.24.0", features = ["loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
oominf-cuda = { path = "../oominf-cuda" }
oominf-format = { path = "../oominf-format" }
oominf-models-qwen = { path = "../oominf-models-qwen" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tokio-stream = "0.1.19"

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
