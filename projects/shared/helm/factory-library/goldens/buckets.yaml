CronJob/consumer-factory-public-mirror:
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    name: consumer-factory-public-mirror
  spec:
    schedule: '* * * * *'
    concurrencyPolicy: Forbid
    suspend: false
    jobTemplate:
      spec:
        activeDeadlineSeconds: 900
        backoffLimit: 1
        template:
          metadata:
            labels:
              app.kubernetes.io/name: consumer-factory-public-mirror
              factory.jomcgi.dev/garage-client: 'true'
          spec:
            automountServiceAccountToken: false
            serviceAccountName: consumer-factory-public-mirror
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            restartPolicy: Never
            containers:
            - name: mirror
              image: docker.io/rclone/rclone@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              command:
              - /bin/sh
              - -c
              - <mirror-script>
              env:
              - name: GARAGE_BUCKET
                value: factory-public
              - name: R2_BUCKET
                value: factory-public
              - name: R2_HOST
                value: 7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com
              - name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE
                value: 'true'
              - name: RCLONE_CONFIG_GARAGE_PROVIDER
                value: Other
              - name: RCLONE_CONFIG_GARAGE_TYPE
                value: s3
              - name: RCLONE_CONFIG_R2_FORCE_PATH_STYLE
                value: 'true'
              - name: RCLONE_CONFIG_R2_PROVIDER
                value: Cloudflare
              - name: RCLONE_CONFIG_R2_REGION
                value: auto
              - name: RCLONE_CONFIG_R2_TYPE
                value: s3
              - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    key: AWS_ACCESS_KEY_ID
                    name: consumer-factory-public-mirror-s3
              - name: RCLONE_CONFIG_GARAGE_ENDPOINT
                valueFrom:
                  secretKeyRef:
                    key: AWS_ENDPOINT_URL
                    name: consumer-factory-public-mirror-s3
              - name: RCLONE_CONFIG_GARAGE_REGION
                valueFrom:
                  secretKeyRef:
                    key: AWS_REGION
                    name: consumer-factory-public-mirror-s3
              - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    key: AWS_SECRET_ACCESS_KEY
                    name: consumer-factory-public-mirror-s3
              - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    key: access-key-id
                    name: consumer-factory-public-mirror-r2
              - name: RCLONE_CONFIG_R2_ENDPOINT
                valueFrom:
                  secretKeyRef:
                    key: s3-api-endpoint
                    name: consumer-factory-public-mirror-r2
              - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    key: secret-access-key
                    name: consumer-factory-public-mirror-r2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                  - ALL
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              volumeMounts:
              - name: tmp
                mountPath: /tmp
            volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
