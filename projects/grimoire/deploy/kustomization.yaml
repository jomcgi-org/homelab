# The on-demand restore and the migration check. The grimoire-data resources
# include this directory, so the grimoire Application deploys the suspended
# CronJobs and the scripts they mount. To restore a backup, add recovery.yaml
# to resources in a one-shot change (README.md, "Restore a backup").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - restore-cronjob.yaml
  - migration-check-cronjob.yaml
  - migration-check-once.yaml

configMapGenerator:
  - name: grimoire-restore-script
    namespace: grimoire
    files:
      - restore.sh
      - migration.sh
      - inventory.sql

# HOME-746 runs the existing checksum pod once. Keep the completed Job until
# its result is recorded, then remove this resource and replacement.
replacements:
  - source:
      kind: CronJob
      name: grimoire-migration-check
      fieldPath: spec.jobTemplate.spec.template
    targets:
      - select:
          kind: Job
          name: grimoire-migration-check-home-746
        fieldPaths:
          - spec.template
        options:
          create: true
