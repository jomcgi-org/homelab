# One-shot restore of a staged dump into the factory grimoire database. It
# runs as the owner identity: the grimoire-restore policy allows DNS and the
# database on 5432, and nothing else (README.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: grimoire-restore
  namespace: grimoire
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grimoire-restore
    spec:
      serviceAccountName: grimoire-restore
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pg-restore
          # The instances' image, for a matching pg_restore.
          image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
          command: [bash, /scripts/restore.sh]
          env:
            - name: PGHOST
              value: grimoire-rw.grimoire.svc
            - name: PGDATABASE
              value: grimoire
            - name: PGUSER
              value: grimoire_restore
            - name: PGSSLMODE
              value: require
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: grimoire-app
                  key: password
            - name: PRIVATE_DUMP
              value: /snapshot/grimoire.dump
            - name: VECTOR_METADATA
              value: /snapshot/vector.metadata
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: snapshot
              mountPath: /snapshot
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: snapshot
          persistentVolumeClaim:
            claimName: grimoire-restore-snapshot
            readOnly: true
        - name: scripts
          configMap:
            name: grimoire-restore-script
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
