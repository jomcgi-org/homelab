# On-demand restore of the newest hub dump into the factory grimoire database.
# The CronJob stays suspended and its schedule never occurs, so a sync starts
# nothing. An operator starts one run with `kubectl create job --from`
# (README.md). The fetch container copies the newest complete run from the
# private R2 bucket into the run's own volume. The pod runs as the owner
# identity: the grimoire-restore policy allows DNS, the database on 5432 and
# the R2 endpoint on 443, and nothing else.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grimoire-restore
  namespace: grimoire
spec:
  suspend: true
  # 31 February: never, even if the CronJob is resumed.
  schedule: "0 0 31 2 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      # Bounds a slow fetch or restore.
      activeDeadlineSeconds: 21600
      # Deletes the pod and its volume, with the dump, a day after the run.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grimoire-restore
        spec:
          serviceAccountName: grimoire-restore
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch
              # Copies grimoire.dump, vector.metadata and source.inventory of
              # the newest complete run, and checks them against its SHA256SUMS.
              # Only this container holds the read-only R2 key.
              image: docker.io/rclone/rclone@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              command: [/bin/sh, /scripts/migration.sh, fetch, /snapshot]
              env:
                - name: R2_BUCKET
                  value: grimoire
                - name: MIGRATION_PREFIX
                  value: migration/
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_REGION
                  value: auto
                - name: RCLONE_CONFIG_R2_FORCE_PATH_STYLE
                  value: "true"
                # The grimoire-restore policy allows this host only.
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  value: https://7c56b458cd657d96b095c63d181c051f.r2.cloudflarestorage.com
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: grimoire-migration-r2
                      key: access-key-id
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: grimoire-migration-r2
                      key: secret-access-key
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: pg-restore
              # The instances' image, for a matching pg_restore.
              image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
              command: [bash, /scripts/restore.sh]
              env:
                - name: PGHOST
                  value: grimoire-rw.grimoire.svc
                - name: PGDATABASE
                  value: grimoire
                - name: PGUSER
                  value: grimoire_restore
                - name: PGSSLMODE
                  value: require
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grimoire-app
                      key: password
                - name: PRIVATE_DUMP
                  value: /snapshot/grimoire.dump
                - name: VECTOR_METADATA
                  value: /snapshot/vector.metadata
                # restore.sh then compares the target with the hub's inventory.
                - name: SOURCE_INVENTORY
                  value: /snapshot/source.inventory
                - name: INVENTORY_SQL
                  value: /scripts/inventory.sql
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            # A claim for each run, deleted with its pod. Argo CD never holds an
            # unbound claim, which would keep the Application Progressing.
            - name: snapshot
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    storageClassName: local-path
                    resources:
                      requests:
                        storage: 32Gi
            - name: scripts
              configMap:
                name: grimoire-restore-script
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
