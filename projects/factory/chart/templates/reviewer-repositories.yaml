{{- if .Values.reviewer.enabled }}
{{- range $r := .Values.repositories }}
{{- $binding := deepCopy $r }}
{{- $_ := unset $binding "toolchain" }}
{{- $_ := unset $binding "codexCodeMode" }}
{{- /* Memory is for the coding binding only (HOME-130). */}}
{{- $_ := unset $binding "memory" }}
{{- $_ := set $binding "namespace" (include "factory.reviewerNamespace" (dict "root" $ "binding" $r)) }}
{{- $_ := set $binding "agent" "reviewer" }}
{{- /* Only the review Harness takes a workload image (HOME-530). */}}
{{- $_ := set $binding "workloadImage" $.Values.reviewer.harnessImage }}
{{- include "factory.bindingResources" (dict "root" $ "binding" $binding "description" "Reviews pull requests in") }}
{{- end }}
{{- end }}
