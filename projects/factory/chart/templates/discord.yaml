{{- /* invariant: HOME-296-1 */ -}}
{{- /*
The Discord bot (HOME-162). The Agent lives in its own namespace and
atespace, apart from every factory binding; the bridge lives in
factory-discord, the only namespace hindsight-discord admits. Discord text
reaches the Agent only through the bridge, as data.
*/}}
{{- $d := .Values.discord }}
{{- if $d.agent.enabled }}
{{- $a := $d.agent }}
{{- $ns := $a.namespace }}
{{- $worker := printf "%s-worker" $a.name }}
---
# Kept: deleting it would take the WorkerPool and the key with it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
    # Substrate's worker egress policy selects worker pods only in namespaces
    # with this label (projects/platform-factory/substrate).
    factory.jomcgi.dev/substrate-workers: "true"
    # gVisor workers need SYS_ADMIN and no seccomp profile, which the cluster
    # default (projects/factory-cluster/nodes/pod-security.yaml) forbids.
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- include "factory.keep" . | nindent 4 }}
---
# Worker pods run as this account, with no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $worker }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
# The dedicated OpenRouter key. The label lets Substrate's credential
# provider inject api-key at the egress gateway for this atespace only; the
# operator copies it to the Secret.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: discord-llm
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
    substrate.ate.dev/injectable: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: {{ $a.llmItemPath | quote }}
{{- if .Values.substrate.credentialProvider.secretReaderBinding }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-credential-provider
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.substrate.credentialProvider.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.substrate.credentialProvider.serviceAccount }}
    namespace: {{ .Values.substrate.namespace }}
{{- end }}
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: {{ $a.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
    kagent.dev/worker-pool-name: {{ $a.name }}
    kagent.dev/worker-pool-namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ $a.concurrency }}
  workerImage: {{ .Values.workers.image | quote }}
  sandboxClasses:
    - name: gvisor
      configRef:
        name: {{ .Values.workers.sandboxConfig }}
  template:
    serviceAccountName: {{ $worker }}
    resources:
      {{- toYaml $a.worker.resources | nindent 6 }}
---
# The dedicated key only (HOME-162 rule 2). kagent swaps the Secret for a
# placeholder in the actor and binds it to the base URL at the egress gateway.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: {{ $a.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider: OpenAI
  model: {{ $a.model | quote }}
  apiKeySecret: discord-llm
  apiKeySecretKey: api-key
  openAI:
    baseUrl: {{ $a.baseUrl | quote }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ $a.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  kagent: {}
  substrate:
    workerPoolRef:
      name: {{ $a.name }}
    snapshotPolicy:
      location: {{ printf "%s%s/" .Values.workers.snapshotLocationPrefix $ns | quote }}
---
# No tools and no web search, and the bridge is the only Hindsight client
# (HOME-162 rule 3).
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ $a.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    inline:
      description: "Bosun, the Discord bot (HOME-162)"
      modelConfig:
        name: {{ $a.name }}
      systemPrompt: {{ $a.systemPrompt | quote }}
  harnessRef:
    name: {{ $a.name }}
{{- if .Values.networkPolicy.cilium }}
---
# Worker pods: actor traffic arrives only from Substrate's router and leaves
# only through its egress gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: substrate-workers
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchExpressions:
      - key: ate.dev/worker-pool
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.substrate.namespace }}
            app: atenet-router
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.substrate.namespace }}
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
{{- end }}
{{- end }}
{{- if $d.bridge.enabled }}
{{- $b := $d.bridge }}
{{- $ns := $b.namespace }}
{{- $name := "discord-bridge" }}
{{- $o := $d.operator }}
{{- /* The operator session's place joins the policy only while it is on. */}}
{{- $policy := $b.policy }}
{{- if $o.enabled }}
{{- $policy = merge (dict "operator" (dict "guild" $o.guild "channels" $o.channels)) (deepCopy $b.policy) }}
{{- end }}
{{- /* Each routed server agent answers its server's turns (HOME-909); one
with servers: all answers every server's. The bridge keeps one session per
channel. */}}
{{- $routed := dict }}
{{- $agents := dict }}
{{- $all := "" }}
{{- range $key := keys $d.serverAgents | sortAlpha }}
{{- $a := index $d.serverAgents $key }}
{{- if and $a.enabled $a.route }}
{{- if not (hasKey ($b.policy.guilds | default dict) $a.guild) }}
{{- fail (printf "discord.serverAgents.%s.route needs server %s in discord.bridge.policy.guilds" $key $a.guild) }}
{{- end }}
{{- $ref := printf "discord-%s/%s" $a.guild $a.name }}
{{- $_ := set $agents $ref true }}
{{- $servers := $a.servers | default "own" }}
{{- if eq $servers "all" }}
{{- if $all }}
{{- fail (printf "discord.serverAgents.%s.servers: %s already answers all servers" $key $all) }}
{{- end }}
{{- $all = $key }}
{{- range $guild := keys $b.policy.guilds | sortAlpha }}
{{- $_ := set $routed $guild $ref }}
{{- end }}
{{- else if eq $servers "own" }}
{{- $_ := set $routed $a.guild $ref }}
{{- else }}
{{- fail (printf "discord.serverAgents.%s.servers must be own or all" $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $routed }}
{{- $policy = merge (dict "serverAgents" $routed) (deepCopy $policy) }}
{{- end }}
{{- /* Research on public GitHub repositories (HOME-909), while the explorer is on. */}}
{{- $e := $d.explorer }}
{{- if $e.enabled }}
{{- $policy = merge (dict "explore" (dict
  "agent" (printf "%s/%s" $e.namespace $e.name)
  "limit" $e.limit
  "concurrency" (int $e.concurrency)
  "timeout" $e.timeout
  "maxSessions" (int $e.maxSessions)
  "ttl" $e.ttl
  "maxRepoMB" (int $e.maxRepoMB))) (deepCopy $policy) }}
{{- end }}
{{- /* Joe's user ID is read for the operator session and for users: operator. */}}
{{- $operatorUser := or $o.enabled (eq ($b.policy.users | default "all") "operator") }}
---
# The bridge runs as this account; its only token is the projected
# kagent-invocation token below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: discord-bot
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  itemPath: {{ $b.tokenItemPath | quote }}
{{- if .Values.imagePullSecret.enabled }}
---
# GHCR read credentials for the bridge's image (the connector's).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.imagePullSecret.itemPath | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-policy
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
data:
  policy.json: {{ toJson $policy | quote }}
{{- if .Values.connector.notify.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: factory-notify-caller
  namespace: {{ $ns }}
spec:
  itemPath: {{ .Values.connector.notify.itemPath | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: discord-bridge
  namespace: {{ $ns }}
spec:
  selector:
    app.kubernetes.io/name: factory-discord-bridge
    app.kubernetes.io/component: gateway
  ports:
    - port: 8080
      targetPort: health
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
    app.kubernetes.io/name: factory-discord-bridge
spec:
  replicas: 1
  # One gateway connection at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-discord-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        # hindsight-discord admits only this label (its network policies).
        app.kubernetes.io/name: factory-discord-bridge
      annotations:
        checksum/policy: {{ toJson $policy | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: {{ include "factory.connectorImage" . | quote }}
          imagePullPolicy: {{ .Values.connector.image.pullPolicy }}
          command: [/usr/local/bin/discord-bridge]
          env:
            - name: DISCORD_POLICY_FILE
              value: /etc/discord-bridge/policy.json
            - name: DISCORD_TOKEN_FILE
              value: /var/run/secrets/discord/token
            - name: HINDSIGHT_URL
              value: {{ $b.hindsightURL | quote }}
            - name: HINDSIGHT_KEY_FILE
              value: /var/run/secrets/hindsight/tenant-api-key
            - name: KAGENT_URL
              value: {{ printf "http://%s" (include "factory.kagentControllerAddress" .) | quote }}
            - name: KAGENT_GRPC
              value: {{ include "factory.kagentControllerAddress" . | quote }}
            - name: KAGENT_TOKEN_FILE
              value: /var/run/secrets/kagent/token
            - name: KAGENT_AGENT
              value: {{ printf "%s/%s" $d.agent.namespace $d.agent.name | quote }}
            - name: HEALTH_ADDR
              value: ":8080"
            {{- if .Values.networkPolicy.cilium }}
            # factory-discord-render draws an answer's diagram, chart and SVG
            # blocks as images; it runs where its deny policy does.
            - name: DISCORD_RENDER_URL
              value: {{ printf "http://factory-discord-render.%s.svc.cluster.local:8080" $ns | quote }}
            {{- end }}
            {{- if $d.backfill.enabled }}
            # The history backfill (HOME-836): one pass after the gateway is
            # ready, then one each interval, for each server with `history`.
            - name: BACKFILL_ENABLED
              value: "true"
            - name: BACKFILL_INTERVAL
              value: {{ $d.backfill.interval | quote }}
            - name: BACKFILL_RATE
              value: {{ $d.backfill.rate | quote }}
            - name: BACKFILL_INCLUDE_BOTS
              value: {{ $d.backfill.includeBots | quote }}
            {{- end }}
            {{- if $d.archive.enabled }}
            # The verbatim message archive (HOME-909): the bridge waits for
            # factory-db-setup to fill the mounted Secret file.
            - name: ARCHIVE_DATABASE_URL_FILE
              value: /var/run/secrets/discord-archive/database-url
            - name: ARCHIVE_READER_ROLE
              value: factory_discord_archive_reader
            {{- with $d.archive.purge }}
            - name: ARCHIVE_PURGE
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- if $o.enabled }}
            - name: DISCORD_OPERATOR_AGENT
              value: {{ printf "%s/%s" $o.namespace $o.name | quote }}
            {{- end }}
            {{- if $operatorUser }}
            - name: DISCORD_OPERATOR_USER_FILE
              value: /var/run/secrets/discord-operator/user-id
            {{- end }}
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            {{- if .Values.connector.notify.enabled }}
            - name: notify
              mountPath: /var/run/secrets/factory-notify
              readOnly: true
            {{- end }}
            - name: discord
              mountPath: /var/run/secrets/discord
              readOnly: true
            - name: hindsight
              mountPath: /var/run/secrets/hindsight
              readOnly: true
            - name: kagent
              mountPath: /var/run/secrets/kagent
              readOnly: true
            - name: policy
              mountPath: /etc/discord-bridge
              readOnly: true
            {{- if $d.archive.enabled }}
            - name: archive
              mountPath: /var/run/secrets/discord-archive
              readOnly: true
            {{- end }}
            {{- if $operatorUser }}
            - name: operator
              mountPath: /var/run/secrets/discord-operator
              readOnly: true
            {{- end }}
      volumes:
        {{- if $operatorUser }}
        # Joe's Discord user ID. Optional: without the field the bridge
        # starts, keeps the operator channels closed and, under
        # users: operator, answers nobody.
        - name: operator
          secret:
            secretName: discord-bot
            optional: true
            items:
              - key: {{ $o.userIdKey }}
                path: user-id
        {{- end }}
        {{- if .Values.connector.notify.enabled }}
        - name: notify
          secret:
            secretName: factory-notify-caller
            items:
              - key: app-password
                path: app-password
        {{- end }}
        - name: discord
          secret:
            secretName: discord-bot
            items:
              - key: token
                path: token
        - name: hindsight
          secret:
            secretName: {{ $b.hindsightKeySecret }}
            items:
              - key: tenant-api-key
                path: tenant-api-key
        - name: kagent
          projected:
            sources:
              - serviceAccountToken:
                  audience: kagent-invocation
                  expirationSeconds: 3600
                  path: token
        - name: policy
          configMap:
            name: {{ $name }}-policy
        {{- if $d.archive.enabled }}
        # Optional: the bridge starts before factory-db-setup fills it, and
        # the kubelet updates the file when it does.
        - name: archive
          secret:
            secretName: discord-archive-db
            optional: true
            items:
              - key: DATABASE_URL
                path: database-url
        {{- end }}
{{- if .Values.networkPolicy.cilium }}
---
# Egress to the renderer, Discord, hindsight-discord, factory-db (the message
# archive) and kagent's controller.
# Nothing connects in, except the connector to /notify when connector.notify
# is on. DNS is the cluster baseline's.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: factory-discord-bridge
  {{- if .Values.connector.notify.enabled }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.broker.namespace }}
            io.cilium.k8s.policy.serviceaccount: {{ include "factory.connectorName" . }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns }}
            app.kubernetes.io/name: factory-discord-render
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toFQDNs:
        - matchName: discord.com
        # gateway.discord.gg and its resume hosts.
        - matchPattern: "*.discord.gg"
        {{- if $e.enabled }}
        # The explorer's public-repository check, without credentials.
        - matchName: api.github.com
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-discord
            app.kubernetes.io/name: hindsight
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    {{- if $d.archive.enabled }}
    # The message archive in factory-db (HOME-909).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory-db
            cnpg.io/cluster: factory-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    {{- end }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.broker.namespace }}
            {{- include "factory.connectorSelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
    # A2A and SessionService share the controller's listener.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ include "factory.kagentNamespace" . }}
            {{- include "factory.kagentSelector" (dict "root" . "component" "controller") | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.kagent.controller.service.ports.targetPort | default 8083 | quote }}
              protocol: TCP
          {{- if $b.enforceAgentPath }}
          rules:
            http:
              - method: POST
                path: {{ printf "^/agents/%s/%s$" (regexQuoteMeta $d.agent.namespace) (regexQuoteMeta $d.agent.name) | quote }}
              # The per-turn session delete (gRPC, HOME-162 "Short sessions").
              - method: POST
                path: "^/kagent\\.api\\.v1\\.SessionService/DeleteSession$"
              {{- if $o.enabled }}
              # The operator session's Agent.
              - method: POST
                path: {{ printf "^/agents/%s/%s$" (regexQuoteMeta $o.namespace) (regexQuoteMeta $o.name) | quote }}
              {{- end }}
              {{- range $ref := keys $agents | sortAlpha }}
              # A server agent (HOME-909).
              - method: POST
                path: {{ printf "^/agents/%s$" (regexQuoteMeta $ref) | quote }}
              {{- end }}
              {{- if or $o.enabled $routed $e.enabled }}
              # The persistent sessions of the operator, server agents and
              # explorer.
              - method: POST
                path: "^/kagent\\.api\\.v1\\.SessionService/(CreateSession|RevertSession)$"
              {{- end }}
              {{- if $e.enabled }}
              # The research explorer (HOME-909): its turns, and naming,
              # listing and deleting its sessions for the TTL and cap.
              - method: POST
                path: {{ printf "^/agents/%s/%s$" (regexQuoteMeta $e.namespace) (regexQuoteMeta $e.name) | quote }}
              - method: POST
                path: "^/kagent\\.api\\.v1\\.SessionService/(ListSessions|UpdateSessionName)$"
              {{- end }}
          {{- end }}
{{- end }}
{{- end }}
