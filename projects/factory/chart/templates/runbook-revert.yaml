{{- if .Values.runbookRevert.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runbook-kagent-revert
  namespace: grafana
{{- range $ns := list "factory-r-homelab" "factory-r-homelab-review" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runbook-kagent-revert
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runbook-kagent-revert
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: runbook-kagent-revert
    namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runbook-kagent-revert
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runbook-kagent-revert
  namespace: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runbook-kagent-revert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runbook-kagent-revert
    spec:
      serviceAccountName: runbook-kagent-revert
      {{- include "factory.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reaper
          image: {{ include "factory.connectorImage" . | quote }}
          args: ["runbook-kagent-revert"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: KAGENT_AUTHORITY
              value: {{ .Values.kagent.config.server.auth.serviceAccount.authority | quote }}
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: runbook-discord
                  key: webhook-url
          volumeMounts:
            - name: ate
              mountPath: /var/run/ate
              readOnly: true
      volumes:
        - name: ate
          projected:
            defaultMode: 0440
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.pem
              - podCertificate:
                  signerName: postgres.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: client.pem
                  userAnnotations:
                    postgres.podcert.ate.dev/username: factory_reaper
{{- if .Values.networkPolicy.cilium }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runbook-kagent-revert
  namespace: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: runbook-kagent-revert
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: edge
            gateway.envoyproxy.io/owning-gateway-namespace: edge
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
  egress:
    - toFQDNs: [{matchName: discord.com}]
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: runbook-kagent-revert, namespace: grafana}
spec:
  selector: {app.kubernetes.io/name: runbook-kagent-revert}
  ports: [{port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: runbook-kagent-revert, namespace: grafana}
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: edge, namespace: edge}]
  hostnames: [factory-runbooks.jomcgi.dev]
  rules:
    - matches:
        - path: {type: Exact, value: /actions/kagent-revert}
      backendRefs:
        - {group: "", kind: Service, name: runbook-kagent-revert, port: 8080, weight: 1}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata: {name: runbook-discord, namespace: grafana}
spec: {itemPath: vaults/k8s-homelab/items/factory-alerts-discord}
{{- range $owner := list "factory-connector" "factory-reviewer" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runbook-revert-observer
  namespace: {{ if eq $owner "factory-connector" }}factory-r-homelab{{ else }}factory-r-homelab-review{{ end }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runbook-revert-observer
  namespace: {{ if eq $owner "factory-connector" }}factory-r-homelab{{ else }}factory-r-homelab-review{{ end }}
subjects: [{kind: ServiceAccount, namespace: factory, name: {{ $owner }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runbook-revert-observer}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runbook-revert-{{ $owner }}
  namespace: grafana
  annotations: {argocd.argoproj.io/sync-options: "Prune=false,Delete=false", argocd.argoproj.io/sync-wave: "-2"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: runbook-revert-{{ $owner }}, namespace: grafana}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["runbook-revert-{{ $owner }}"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: runbook-revert-{{ $owner }}, namespace: grafana}
subjects:
  - {kind: ServiceAccount, name: runbook-kagent-revert, namespace: grafana}
  - {kind: ServiceAccount, name: {{ $owner }}, namespace: factory}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: runbook-revert-{{ $owner }}}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runbook-revert-credentials
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["pods"]
  matchConditions:
    - name: action-identity
      expression: request.userInfo.username == 'system:serviceaccount:grafana:runbook-kagent-revert'
  validations:
    - expression: >-
        request.operation != 'DELETE' ||
        ((request.namespace == 'factory-r-homelab' && request.name.matches('^homelab-codex-[0-9a-f]{8,10}-[a-z0-9]{5}$') ||
          request.namespace == 'factory-r-homelab-review' && request.name.matches('^homelab-reviewer-[0-9a-f]{8,10}-[a-z0-9]{5}$')) &&
          has(params.data) && params.data.phase == 'deleting' && params.data['namespace'] == request.namespace &&
          params.data.pod == request.name && params.data.uid == oldObject.metadata.uid)
      message: Only UID-fenced worker deletes are permitted.
{{- range $owner := list "factory-connector" "factory-reviewer" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runbook-delete-{{ $owner }}
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  policyName: runbook-revert-credentials
  paramRef: {name: runbook-revert-{{ $owner }}, namespace: grafana, parameterNotFoundAction: Deny}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ if eq $owner "factory-connector" }}factory-r-homelab{{ else }}factory-r-homelab-review{{ end }}
  validationActions: [Deny]
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runbook-recovery-journal
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["configmaps"]
  matchConditions:
    - name: journal
      expression: request.namespace == 'grafana' && request.name in ['runbook-revert-factory-connector','runbook-revert-factory-reviewer']
    - name: recovery-writer
      expression: request.userInfo.username in ['system:serviceaccount:grafana:runbook-kagent-revert','system:serviceaccount:factory:factory-connector','system:serviceaccount:factory:factory-reviewer']
  variables:
    - name: front
      expression: request.userInfo.username == 'system:serviceaccount:grafana:runbook-kagent-revert'
    - name: prev
      expression: "has(oldObject.data) && 'phase' in oldObject.data ? oldObject.data.phase : ''"
    - name: next
      expression: object.data.phase
  validations:
    - expression: >-
        variables.next == 'confirmed' && variables.prev in ['', 'delivered'] ||
        (object.data.id == oldObject.data.id && object.data.user == oldObject.data.user &&
         ['session','executor','namespace','pod','uid','creator','deadline'].all(k,object.data[k] == oldObject.data[k]))
      message: The confirmed identity and targets are immutable for the lifetime of an operation.
    - expression: >-
        variables.front ?
        (variables.next == 'confirmed' && variables.prev in ['', 'delivered'] ||
         variables.next == 'deleting' && variables.prev in ['authorized','deleting'] ||
         variables.next == 'gone' && variables.prev == 'deleting' ||
         variables.next == 'audit' && variables.prev in ['confirmed','authorized','deleting','gone','reverting'] ||
         variables.next == 'delivered' && variables.prev == 'audit') :
        (request.name == 'runbook-revert-' + request.userInfo.username.split(':')[3] &&
         (variables.next == 'authorized' && variables.prev == 'confirmed' ||
          variables.next == 'reverting' && variables.prev in ['gone','reverting'] ||
          variables.next == 'audit' && variables.prev in ['confirmed','gone','reverting']))
      message: Only the creator may authorize a session and claim its revert.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runbook-recovery-journal
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  policyName: runbook-recovery-journal
  validationActions: [Deny]
{{- if .Values.imagePullSecret.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
type: kubernetes.io/dockerconfigjson
metadata: {name: {{ .Values.imagePullSecret.name }}, namespace: grafana}
spec: {itemPath: {{ .Values.imagePullSecret.itemPath | quote }}}
{{- end }}
{{- end }}
