{{- if and .Values.imagePullSecret.enabled (include "factory.factoryWorkloads" .) }}
# GHCR read credentials for the factory namespace's private first-party
# images; the 1Password operator writes the dockerconfigjson Secret.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ .Values.broker.namespace }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: {{ .Values.imagePullSecret.itemPath | quote }}
{{- end }}
