{{- if .Values.connector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: factory-connector-status
  namespace: {{ .Values.broker.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  selector:
    {{- include "factory.connectorSelector" . | nindent 4 }}
  ports:
    - name: status
      port: 8082
      targetPort: 8082
      protocol: TCP
    {{- if .Values.broker.enabled }}
    - name: analysis-pin
      port: 8086
      targetPort: 8086
      protocol: TCP
    {{- end }}
    {{- if .Values.itsaplan.enabled }}
    - name: run-phases
      port: 8085
      targetPort: 8085
      protocol: TCP
    {{- end }}
{{- if .Values.networkPolicy.cilium }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-landing-status
  namespace: {{ .Values.broker.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  endpointSelector:
    matchLabels:
      {{- include "factory.connectorSelector" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory-landing
            app.kubernetes.io/name: factory-landing
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory-discord
            io.cilium.k8s.policy.serviceaccount: discord-bridge
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
    {{- if .Values.broker.enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.broker.namespace }}
            {{- include "factory.brokerSelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
    {{- end }}
    {{- if .Values.itsaplan.enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.itsaplan.namespace }}
            {{- include "factory.itsaplanSelector" (dict "root" . "component" "api") | nindent 12 }}
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
