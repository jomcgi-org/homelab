{{- if .Values.connector.enabled }}
{{- /*
The connector (ARCHITECTURE.md, "Connector"): one replica, Recreate, with a
Postgres advisory lock as its writer fence. It claims itsaplan runs with the
coding agents' keys, sends them to the repository binding's kagent Agent as
its own ServiceAccount, and delivers the pushed branch as a pull request with
GitHub tokens the broker mints for that ServiceAccount.
*/}}
{{- $c := .Values.connector }}
{{- $ns := .Values.broker.namespace }}
{{- $name := include "factory.connectorName" . }}
{{- $delivers := include "factory.connectorDelivers" . }}
{{- if $c.notify.enabled }}
{{- range $host := list $c.notify.hostname $c.notify.tokenHostname }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $host) }}
{{- fail "connector.notify requires DNS hostnames without ports or paths" }}
{{- end }}
{{- end }}
{{- if not .Values.networkPolicy.cilium }}
{{- fail "connector.notify requires networkPolicy.cilium" }}
{{- end }}
{{- end }}
{{- if not .Values.itsaplan.enabled }}
{{- fail "connector.enabled needs itsaplan.enabled: the connector claims itsaplan runs with the keys its bootstrap writes" }}
{{- end }}
{{- if not .Values.broker.enabled }}
{{- fail "connector.enabled needs broker.enabled: the connector shares its namespace and gets GitHub tokens from it" }}
{{- end }}
{{- $kagentAuth := ((.Values.kagent.config | default dict).server | default dict).auth | default dict }}
{{- if not ($kagentAuth.serviceAccount | default dict).authority }}
{{- fail "connector.enabled needs kagent.config.server.auth.serviceAccount.authority: use the installed or existing controller's exact authority for caller continuity" }}
{{- end }}
{{- /* The peers' policies admit the connector by networkPolicy.connector. */}}
{{- $peer := .Values.networkPolicy.connector }}
{{- $podLabels := include "factory.connectorSelector" . | fromYaml }}
{{- $_ := set $podLabels "app.kubernetes.io/part-of" "factory" }}
{{- if ne $peer.namespace $ns }}
{{- fail (printf "networkPolicy.connector.namespace must be broker.namespace (%s), where the connector runs" $ns) }}
{{- end }}
{{- range $k, $v := $peer.matchLabels }}
{{- if ne (toString (index $podLabels $k | default "")) (toString $v) }}
{{- fail (printf "networkPolicy.connector.matchLabels %s=%s does not match the connector's pod labels" $k $v) }}
{{- end }}
{{- end }}
{{- $itsaplanAgents := list }}
{{- range .Values.itsaplan.bootstrap.agents }}
{{- if not .readOnly }}
{{- $itsaplanAgents = append $itsaplanAgents .username }}
{{- end }}
{{- end }}
{{- $keys := list $c.coordinator }}
{{- $agents := list }}
{{- range $c.agents }}
{{- if has .username $keys }}
{{- fail (printf "connector.agents: %s is listed twice or is the coordinator" .username) }}
{{- end }}
{{- $keys = append $keys .username }}
{{- $agents = append $agents (dict "key" .username "apiKeyFile" (include "factory.connectorKeyPath" .username) "concurrency" (.concurrency | default 1 | int)) }}
{{- end }}
{{- range $keys }}
{{- if not (has . $itsaplanAgents) }}
{{- fail (printf "connector: itsaplan agent %s is not a writable agent in itsaplan.bootstrap.agents, which writes its key" .) }}
{{- end }}
{{- end }}
{{- $repoNames := list }}
{{- $bindings := list }}
{{- range $r := .Values.repositories }}
{{- $repoNames = append $repoNames $r.name }}
{{- $b := index ($c.bindings | default dict) $r.name }}
{{- if not $b }}
{{- fail (printf "connector.bindings.%s is required: every repository binding needs its itsaplan project and agents" $r.name) }}
{{- end }}
{{- range $b.agents }}
{{- if or (not (has . $keys)) (eq . $c.coordinator) }}
{{- fail (printf "connector.bindings.%s: agent %s is not in connector.agents" $r.name .) }}
{{- end }}
{{- end }}
{{- $binding := dict
  "name" $r.name
  "owner" $r.owner
  "repo" $r.repo
  "baseBranch" $r.baseBranch
  "kagentNamespace" $r.namespace
  "kagentAgent" (include "factory.bindingAgentName" $r)
}}
{{- $binding = mustMergeOverwrite $binding (deepCopy $b) }}
{{- $_ := set $binding "runtime" (include "factory.runRuntime" (dict "root" $ "binding" $r) | fromJson) }}
{{- if $b.arms }}
{{- $seen := dict }}
{{- $total := 0 }}
{{- range $arm := $b.arms }}
{{- if hasKey $seen $arm.name }}{{- fail "coder arm names must be unique" }}{{- end }}
{{- $_ := set $seen $arm.name true }}
{{- $total = add $total $arm.weight }}
{{- if eq $arm.name "control" }}
{{- $_ := set $binding.runtime "model" $arm.model }}
{{- $_ := set $binding.runtime "reasoningEffort" $arm.reasoningEffort }}
{{- end }}
{{- end }}
{{- if or (not (hasKey $seen "control")) (eq $total 0) }}{{- fail "coder arms require control and a positive total weight" }}{{- end }}
{{- end }}
{{- $bindings = append $bindings $binding }}
{{- end }}
{{- range $k, $_ := $c.bindings | default dict }}
{{- if not (has $k $repoNames) }}
{{- fail (printf "connector.bindings.%s names no repository in repositories" $k) }}
{{- end }}
{{- end }}
{{- $links := deepCopy $c.links }}
{{- if not $links.issue }}
{{- /* itsaplan's /issue/:issueId deep link redirects to the issue's page. */}}
{{- $_ := set $links "issue" (printf "%s/issue/{issueId}" (include "factory.itsaplanAppURL" .)) }}
{{- end }}
{{- $config := dict
  "intervals" $c.intervals
  "coordinator" (dict "key" $c.coordinator "apiKeyFile" (include "factory.connectorKeyPath" $c.coordinator))
  "agents" $agents
  "bindings" $bindings
  "links" $links
}}
{{- $bb := $c.buildbuddy | default dict }}
{{- if $bb.enabled }}
{{- if or (not $bb.host) (not $bb.itemPath) }}
{{- fail "connector.buildbuddy.enabled needs host and itemPath: the BuildBuddy host and the 1Password item holding its read-only API key" }}
{{- end }}
{{- $_ := set $config "buildbuddy" (dict
  "apiURL" (printf "https://%s" $bb.host)
  "invocationPrefix" (printf "https://%s/invocation/" $bb.host)
  "apiKeyFile" "/var/run/secrets/factory-buildbuddy/api-key"
) }}
{{- end }}
{{- if include "factory.goalReasons" . }}
{{- $_ := set $config "reviewerGoalURL" (printf "http://%s.%s.svc:%d" (include "factory.reviewerName" .) .Values.broker.namespace (int .Values.reviewer.goalReasons.port)) }}
{{- end }}
{{- $configYAML := toYaml $config }}
{{- if $bb.enabled }}
# BuildBuddy's read-only API key; only the connector mounts it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $name }}-buildbuddy
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: {{ $bb.itemPath | quote }}
---
{{- end }}
# The connector's identity to kagent and the broker. Kept: a kagent principal
# includes the ServiceAccount's UID, so a recreated account loses its sessions
# (ARCHITECTURE.md finding 6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- include "factory.keep" . | nindent 4 }}
# It calls no Kubernetes API; kagent and the broker get audience-bound tokens.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.yaml: |
    {{- $configYAML | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # One writer: the advisory lock fences a second process, and Recreate keeps
  # a rollout from waiting on it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "factory.connectorSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "factory.connectorSelector" . | nindent 8 }}
        app.kubernetes.io/part-of: factory
      annotations:
        checksum/config: {{ $configYAML | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- include "factory.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- if .Values.runbookRevert.enabled }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- if .Values.runbookRevert.enabled }}
        {{- include "runbook.ownerContainer" (dict "root" . "owner" "factory-connector") | nindent 8 }}
        {{- end }}
        - name: connector
          image: {{ include "factory.connectorImage" . | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          env:
            {{- with $c.traceEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            - name: OTEL_SERVICE_NAME
              value: factory-connector
            {{- end }}
            - name: ITSAPLAN_APP_URL
              value: {{ include "factory.itsaplanAppURL" . | quote }}
            - name: FACTORY_CONNECTOR_CONFIG
              value: /etc/factory-connector/config.yaml
            - name: FACTORY_CONNECTOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $c.database.secretName }}
                  key: DATABASE_URL
            - name: FACTORY_CONNECTOR_ITSAPLAN_URL
              value: {{ include "factory.itsaplanInternalURL" . | quote }}
            - name: FACTORY_CONNECTOR_KAGENT_URL
              value: {{ printf "http://%s" (include "factory.kagentControllerAddress" .) | quote }}
            - name: FACTORY_CONNECTOR_KAGENT_GRPC
              value: {{ include "factory.kagentControllerAddress" . | quote }}
            - name: FACTORY_CONNECTOR_KAGENT_TOKEN_FILE
              value: /var/run/secrets/kagent/token
            - name: FACTORY_CONNECTOR_KAGENT_AUTHORITY
              value: {{ $kagentAuth.serviceAccount.authority | quote }}
            {{- if $delivers }}
            - name: FACTORY_CONNECTOR_BROKER_URL
              value: {{ printf "http://%s.%s.svc:%d" (include "factory.brokerName" .) $ns (int .Values.broker.adminPort) | quote }}
            - name: FACTORY_CONNECTOR_BROKER_TOKEN_FILE
              value: /var/run/secrets/factory-broker/token
            {{- end }}
            - name: FACTORY_CONNECTOR_METRICS_ADDR
              value: {{ printf ":%d" (int $c.metricsPort) | quote }}
            {{- if $c.notify.enabled }}
            - name: FACTORY_CONNECTOR_NOTIFY_URL
              value: {{ printf "https://%s/mcp/" $c.notify.hostname | quote }}
            - name: FACTORY_CONNECTOR_NOTIFY_TOKEN_URL
              value: {{ printf "https://%s/application/o/token/" $c.notify.tokenHostname | quote }}
            - name: FACTORY_CONNECTOR_NOTIFY_PASSWORD_FILE
              value: /var/run/secrets/factory-notify/app-password
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: {{ $c.metricsPort }}
          # Health is served before the key wait and the migrations; the
          # startup probe still allows five minutes before liveness counts.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: decision-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: joe-sessions
              mountPath: /var/run/secrets/joe-sessions
              readOnly: true
            - name: config
              mountPath: /etc/factory-connector
              readOnly: true
            - name: itsaplan-keys
              mountPath: /var/run/secrets/factory-itsaplan
              readOnly: true
            - name: kagent-token
              mountPath: /var/run/secrets/kagent
              readOnly: true
            {{- if $c.notify.enabled }}
            - name: notify-password
              mountPath: /var/run/secrets/factory-notify
              readOnly: true
            {{- end }}
            {{- if $delivers }}
            - name: broker-token
              mountPath: /var/run/secrets/factory-broker
              readOnly: true
            {{- end }}
            {{- if $bb.enabled }}
            - name: buildbuddy
              mountPath: /var/run/secrets/factory-buildbuddy
              readOnly: true
            {{- end }}
      volumes:
        - name: decision-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: joe-sessions
          secret:
            secretName: {{ include "factory.itsaplanName" . }}-joe-sessions
            optional: true
            items:
              - key: password
                path: password
        {{- if .Values.runbookRevert.enabled }}
        {{- include "runbook.ownerVolumes" (dict "root" . "owner" "factory-connector") | nindent 8 }}
        {{- end }}
        {{- if $c.notify.enabled }}
        - name: notify-password
          secret:
            secretName: {{ required "connector.notify.secretName is required" $c.notify.secretName }}
            items:
              - key: app-password
                path: app-password
        {{- end }}
        - name: config
          configMap:
            name: {{ $name }}
        # Each itsaplan agent's key, from the Secret the itsaplan bootstrap
        # writes. The bootstrap is a PostSync hook that runs only once this
        # Deployment is healthy, so on a fresh install or a restore the keys
        # are optional here: the connector starts, reports ready and waits
        # for the files, and reads each key per call, so a rotation needs no
        # restart.
        - name: itsaplan-keys
          projected:
            sources:
              {{- range $keys }}
              - secret:
                  name: {{ include "factory.itsaplanAgentSecret" . }}
                  optional: true
                  items:
                    - key: apiKey
                      path: {{ . }}
              {{- end }}
        # kagent reviews this token for its fixed invocation audience; the
        # principal is the ServiceAccount's UID.
        - name: kagent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: kagent-invocation
                  expirationSeconds: 3600
                  path: token
        {{- if $bb.enabled }}
        # Optional so the connector starts before the operator syncs the
        # item; until then a CI log read fails with class "key".
        - name: buildbuddy
          secret:
            secretName: {{ $name }}-buildbuddy
            optional: true
            items:
              - key: {{ $bb.key }}
                path: api-key
        {{- end }}
        {{- if $delivers }}
        # The broker reviews this token (tokenReview.audience) and checks its
        # subject against connectorSubjects.
        - name: broker-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: factory-broker
                  expirationSeconds: 3600
                  path: token
        {{- end }}
{{- if $c.notify.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $c.notify.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  itemPath: {{ required "connector.notify.itemPath is required" $c.notify.itemPath | quote }}
{{- end }}
{{- end }}
