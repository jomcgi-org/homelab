{{- if and .Values.reviewer.enabled .Values.networkPolicy.cilium }}
{{- /* With reviewer.goalReasons, the connector alone reaches that port (HOME-251). */}}
# The broker alone reaches the analysis pin listener. Metrics use a port-forward,
# and kubelet probes are host traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "factory.reviewerName" . }}
  namespace: {{ .Values.broker.namespace }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      {{- include "factory.reviewerSelector" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.broker.namespace }}
            {{- include "factory.brokerSelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
    {{- if include "factory.goalReasons" . }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.connector.namespace }}
            {{- toYaml .Values.networkPolicy.connector.matchLabels | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.reviewer.goalReasons.port | quote }}
              protocol: TCP
    {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.substrate.namespace }}
            app: ate-idp-server
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    {{- if .Values.runbookRevert.enabled }}
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: postgres
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    {{- end }}
    {{- if .Values.reviewer.traceEndpoint }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            app.kubernetes.io/name: otel-collector
            app.kubernetes.io/instance: otel-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    {{- end }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.broker.namespace }}
            {{- include "factory.brokerSelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.broker.adminPort | quote }}
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ include "factory.kagentNamespace" . }}
            {{- include "factory.kagentSelector" (dict "root" . "component" "controller") | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.kagent.controller.service.ports.targetPort | default 8083 | quote }}
              protocol: TCP
    {{- if .Values.itsaplan.enabled }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.itsaplan.namespace }}
            {{- include "factory.itsaplanSelector" (dict "root" . "component" "api") | nindent 12 }}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    {{- end }}
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
