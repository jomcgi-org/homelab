{{- if .Values.reviewer.enabled }}
{{- $c := .Values.reviewer }}
{{- $ns := .Values.broker.namespace }}
{{- $name := include "factory.reviewerName" . }}
{{- $configYAML := include "factory.reviewerConfig" . }}
# A kagent principal includes this ServiceAccount's UID. Keep it across
# upgrades and disable/re-enable cycles, just like the connector's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- include "factory.keep" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.yaml: |
    {{- $configYAML | nindent 4 }}
---
# Private goal replies, retained for 14 days by the reviewer service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-goal-audit
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    # Create with its consumer for WaitForFirstConsumer storage classes.
    argocd.argoproj.io/sync-wave: "1"
    {{- include "factory.keep" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # There is no writer lease: two instances would review every head twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "factory.reviewerSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "factory.reviewerSelector" . | nindent 8 }}
        app.kubernetes.io/part-of: factory
      annotations:
        checksum/config: {{ $configYAML | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- include "factory.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- if .Values.runbookRevert.enabled }}
        {{- include "runbook.ownerContainer" (dict "root" . "owner" "factory-reviewer") | nindent 8 }}
        {{- end }}
        - name: reviewer
          image: {{ include "factory.reviewerImage" . | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          env:
            - name: FACTORY_REVIEWER_CONFIG
              value: /etc/factory-reviewer/config.yaml
          ports:
            - name: metrics
              containerPort: {{ $c.metricsPort }}
            {{- if include "factory.goalReasons" . }}
            - name: goal-reasons
              containerPort: {{ $c.goalReasons.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: goal-audit
              mountPath: /var/lib/factory-reviewer
            - name: config
              mountPath: /etc/factory-reviewer
              readOnly: true
            - name: kagent-token
              mountPath: /var/run/secrets/kagent
              readOnly: true
            - name: broker-token
              mountPath: /var/run/secrets/factory-broker
              readOnly: true
            {{- if .Values.itsaplan.enabled }}
            - name: itsaplan-key
              mountPath: /var/run/secrets/itsaplan
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.runbookRevert.enabled }}
        {{- include "runbook.ownerVolumes" (dict "root" . "owner" "factory-reviewer") | nindent 8 }}
        {{- end }}
        - name: goal-audit
          persistentVolumeClaim:
            claimName: {{ $name }}-goal-audit
        {{- if .Values.itsaplan.enabled }}
        - name: itsaplan-key
          secret:
            secretName: {{ include "factory.itsaplanAgentSecret" "factory-reviewer" }}
            # Bootstrap is PostSync: let the Pod start before the key exists.
            # Reads fail closed until kubelet projects the bootstrap's key.
            optional: true
            defaultMode: 0440
            items:
              - key: apiKey
                path: apiKey
        {{- end }}
        - name: config
          configMap:
            name: {{ $name }}
        - name: kagent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: kagent-invocation
                  expirationSeconds: 3600
                  path: token
        - name: broker-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: factory-broker
                  expirationSeconds: 3600
                  path: token
{{- if include "factory.goalReasons" . }}
---
# The goal reasons listener; reviewer-network-policy.yaml admits only the
# connector, and /metrics stays unexposed.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "factory.reviewerSelector" . | nindent 4 }}
  ports:
    - name: goal-reasons
      port: {{ $c.goalReasons.port }}
      targetPort: goal-reasons
{{- end }}
{{- end }}
