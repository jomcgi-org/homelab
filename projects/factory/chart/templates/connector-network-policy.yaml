{{- if and .Values.connector.enabled .Values.networkPolicy.cilium }}
{{- /*
The connector's allowlist under the cluster-wide default-deny. It accepts no
connections (nothing scrapes its metrics yet; kubelet probes are host
traffic) and calls only itsaplan's api, the kagent controller, the broker's
admin port, its database, GitHub's API and, with connector.buildbuddy, that
BuildBuddy host. Each peer admits it by networkPolicy.connector's labels in
its own policy.
*/}}
{{- $c := .Values.connector }}
{{- $kagentNs := include "factory.kagentNamespace" . }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "factory.connectorName" . }}
  namespace: {{ .Values.broker.namespace }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      {{- include "factory.connectorSelector" . | nindent 6 }}
  egress:
    {{- if .Values.runbookRevert.enabled }}
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: postgres
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prometheus
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    {{- end }}
    {{- if $c.traceEndpoint }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            app.kubernetes.io/name: otel-collector
            app.kubernetes.io/instance: otel-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    {{- end }}
    {{- if $c.notify.enabled }}
    # Cloudflare-fronted MCP and Authentik, for this connector's pods only.
    - toFQDNs:
        - matchName: {{ $c.notify.hostname | quote }}
        - matchName: {{ $c.notify.tokenHostname | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- range .Values.repositories }}
    {{- if and .memory (eq .name "homelab") }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight
            app.kubernetes.io/name: hindsight
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    {{- end }}
    {{- end }}
    # itsaplan's runner and coordinator routes.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.itsaplan.namespace }}
            {{- include "factory.itsaplanSelector" (dict "root" . "component" "api") | nindent 12 }}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # kagent's A2A gateway and SessionService share the controller's listener.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $kagentNs }}
            {{- include "factory.kagentSelector" (dict "root" . "component" "controller") | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.kagent.controller.service.ports.targetPort | default 8083 | quote }}
              protocol: TCP
    {{- if include "factory.connectorDelivers" . }}
    # Connector GitHub tokens on the broker's admin port.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.broker.namespace }}
            {{- include "factory.brokerSelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.broker.adminPort | quote }}
              protocol: TCP
    # Pull requests, reviews, checks and the merge queue.
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- if include "factory.goalReasons" . }}
    # The reviewer's goal reasons, for revision rounds (HOME-251).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.broker.namespace }}
            {{- include "factory.reviewerSelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.reviewer.goalReasons.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if ($c.buildbuddy | default dict).enabled }}
    # Failed invocations' logs, for revision prompts.
    - toFQDNs:
        - matchName: {{ $c.buildbuddy.host }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- with $c.database.endpoints }}
    # factory-db's instances behind its rw Service.
    - toEndpoints:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ $c.database.port | quote }}
              protocol: TCP
    {{- end }}
{{- end }}
