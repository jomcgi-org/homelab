{{- /*
Repository bindings (ARCHITECTURE.md, "Configuration"): one namespace per
repository, which is also its Substrate atespace, holding one kagent Agent with
its ModelConfig, Harness, EgressPolicies and WorkerPool. Credentials never
enter the workspace: the model relay authenticates with an actor JWT the
egress gateway injects, and git sends a placeholder Authorization header the
gateway replaces from the broker-minted Secret github-git.
*/}}
{{- range $r := .Values.repositories }}
{{- $binding := deepCopy $r }}
{{- with $r.harnessImage }}
{{- if hasKey $r "codexCodeMode" }}
{{- fail "set harnessImage or codexCodeMode on a repository, not both" }}
{{- end }}
{{- /* The shared Codex+mandoline image (HOME-652). */}}
{{- $_ := set $binding "workloadImage" . }}
{{- end }}
{{- include "factory.bindingResources" (dict "root" $ "binding" $binding "coder" true "description" "Delivers changes to") }}
{{- end }}
