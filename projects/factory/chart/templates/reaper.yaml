{{- if .Values.connector.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-reaper
  namespace: {{ .Values.broker.namespace }}
{{- range $ns := list "factory-r-homelab" "factory-r-homelab-review" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-reaper
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-reaper
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: factory-reaper
    namespace: {{ $.Values.broker.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-reaper
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-reaper
  namespace: {{ .Values.broker.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-reaper
    spec:
      serviceAccountName: factory-reaper
      {{- include "factory.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reaper
          image: {{ include "factory.connectorImage" . | quote }}
          args: ["reaper"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: FACTORY_CONNECTOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.connector.database.reaperSecretName }}
                  key: DATABASE_URL
          volumeMounts:
            - name: ate
              mountPath: /var/run/ate
              readOnly: true
      volumes:
        - name: ate
          projected:
            defaultMode: 0440
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.pem
              - podCertificate:
                  signerName: postgres.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: client.pem
                  userAnnotations:
                    postgres.podcert.ate.dev/username: factory_reaper
{{- if .Values.networkPolicy.cilium }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-reaper
  namespace: {{ .Values.broker.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: factory-reaper
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: postgres
        {{- toYaml .Values.connector.database.endpoints | nindent 8 }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}
{{- end }}
