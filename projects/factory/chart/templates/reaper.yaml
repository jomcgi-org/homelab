{{- if .Values.connector.enabled }}
{{- range $p := include "factory.autoscaledPools" . | fromJsonArray }}
{{- if not (has $p.namespace (list "factory-r-homelab" "factory-r-homelab-review")) }}
{{- fail (printf "autoscaling: the reaper has no pod access in %s" $p.namespace) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-reaper
  namespace: {{ .Values.broker.namespace }}
{{- /* patch (only where a pool autoscales): the deletion cost that makes a scale-down remove idle workers first. */}}
{{- $autoscaled := include "factory.autoscaledPools" . | fromJsonArray }}
{{- range $ns := list "factory-r-homelab" "factory-r-homelab-review" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-reaper
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"{{ range $autoscaled }}{{ if eq .namespace $ns }}, "patch"{{ break }}{{ end }}{{ end }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-reaper
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: factory-reaper
    namespace: {{ $.Values.broker.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-reaper
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-reaper
  namespace: {{ .Values.broker.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-reaper
    spec:
      serviceAccountName: factory-reaper
      {{- include "factory.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reaper
          image: {{ include "factory.connectorImage" . | quote }}
          args: ["reaper"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- $pools := include "factory.autoscaledPools" . | fromJsonArray }}
            {{- if $pools }}
            {{- $entries := list }}
            {{- range $p := $pools }}
            {{- $entries = append $entries (printf "%s/%s=%d" $p.namespace $p.name (int $p.spare)) }}
            {{- end }}
            # The pools whose demand and capacity the reaper publishes, with
            # their spare workers (agents.<name>.autoscaling).
            - name: FACTORY_REAPER_POOLS
              value: {{ join "," $entries | quote }}
            {{- $unbound := list }}
            {{- range $p := $pools }}
            {{- if $p.unbound }}
            {{- $unbound = append $unbound (printf "%s/%s" $p.namespace $p.name) }}
            {{- end }}
            {{- end }}
            {{- if $unbound }}
            # Pools no connector binding sends to (the reviewer's): the reaper
            # publishes their pending demand at 0, so the autoscaler's metric
            # has a value.
            - name: FACTORY_REAPER_UNBOUND_POOLS
              value: {{ join "," $unbound | quote }}
            {{- end }}
            {{- end }}
            - name: FACTORY_CONNECTOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.connector.database.reaperSecretName }}
                  key: DATABASE_URL
          volumeMounts:
            - name: ate
              mountPath: /var/run/ate
              readOnly: true
      volumes:
        - name: ate
          projected:
            defaultMode: 0440
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.pem
              - podCertificate:
                  signerName: postgres.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: client.pem
                  userAnnotations:
                    postgres.podcert.ate.dev/username: factory_reaper
{{- if .Values.networkPolicy.cilium }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-reaper
  namespace: {{ .Values.broker.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: factory-reaper
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: postgres
        {{- toYaml .Values.connector.database.endpoints | nindent 8 }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}
{{- end }}
