{{- if .Values.connector.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-connector-decide
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-connector-decide
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-connector-decide
subjects:
  - kind: ServiceAccount
    namespace: {{ .Values.broker.namespace }}
    name: {{ include "factory.connectorName" . }}
{{- end }}
