{{- if .Values.reviewer.enabled }}
{{- $c := .Values.reviewer }}
{{- $name := printf "%s-goal-audit" (include "factory.reviewerName" .) }}
# Keep retention running when a rollback removes audit support from the
# reviewer Deployment. The packaged chart pins this image by digest.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Values.broker.namespace }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    {{- include "factory.keep" . | nindent 4 }}
spec:
  schedule: "17 * * * *"
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          {{- include "factory.imagePullSecrets" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          # Prefer the consumer's node for RWO disks. After rollback, the
          # volume's own topology still places the job without that consumer.
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        {{- include "factory.reviewerSelector" . | nindent 24 }}
          containers:
            - name: prune
              image: {{ include "factory.reviewerImage" . | quote }}
              imagePullPolicy: {{ $c.image.pullPolicy }}
              args: ["--prune-goal-audit"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: goal-audit
                  mountPath: /var/lib/factory-reviewer
          volumes:
            - name: goal-audit
              persistentVolumeClaim:
                claimName: {{ $name }}
---
# This job has no network clients or credentials. Keep its isolation with it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Values.broker.namespace }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- include "factory.keep" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
