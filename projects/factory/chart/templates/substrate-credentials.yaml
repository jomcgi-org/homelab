{{- if and (include "factory.kagentInstall" .) .Values.substrate.credentialProvider.secretReaderBinding }}
# Lets Substrate's Kubernetes-Secret credential provider read Secrets in the
# kagent namespace for egress injection. The ClusterRole admits only Secrets
# labelled substrate.ate.dev/injectable=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-credential-provider
  namespace: {{ include "factory.kagentNamespace" . }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.substrate.credentialProvider.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.substrate.credentialProvider.serviceAccount }}
    namespace: {{ .Values.substrate.namespace }}
{{- end }}
