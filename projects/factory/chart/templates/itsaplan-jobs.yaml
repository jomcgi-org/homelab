{{- if .Values.itsaplan.enabled }}
{{- /*
itsaplan's two Jobs, both idempotent standard-library Python from files/itsaplan/:

- secret-init (wave -1, before the workloads) generates BETTER_AUTH_SECRET,
  APP_ENCRYPTION_KEY and the break-glass admin's password, each only when
  absent. It refuses to replace lost keys for a database that has data
  unless the operator accepts the loss, and then first deletes the stored
  secrets encrypted with them.
- bootstrap (PostSync) signs in as that admin through the api, creating it
  on a fresh database, where the first account is the instance admin; sets
  invite-only registration and the OIDC provider; and creates the team,
  project and external agents in values. It writes each agent's API key,
  which the api returns only once, to that agent's Secret, and rotates the
  key of an agent whose Secret lost it rather than creating a second agent.

Each gets/updates only the Secrets named in its Role.
*/}}
{{- $i := .Values.itsaplan }}
{{- $ns := $i.namespace }}
{{- $name := include "factory.itsaplanName" . }}
{{- $agentSecrets := list }}
{{- range $i.bootstrap.agents }}
{{- $agentSecrets = append $agentSecrets (include "factory.itsaplanAgentSecret" .username) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-scripts
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  secret_init.py: |
    {{- .Files.Get "files/itsaplan/secret_init.py" | nindent 4 }}
  db_state.sql: |
    {{- .Files.Get "files/itsaplan/db_state.sql" | nindent 4 }}
  purge.sql: |
    {{- .Files.Get "files/itsaplan/purge.sql" | nindent 4 }}
  bootstrap.py: |
    {{- .Files.Get "files/itsaplan/bootstrap.py" | nindent 4 }}
  config.json: |
    {{- dict
      "admin" (dict "name" $i.admin.name)
      "oidc" (dict "label" $i.oidc.label "discoveryUrl" $i.oidc.discoveryUrl "clientId" $i.oidc.clientId)
      "team" $i.bootstrap.team
      "project" $i.bootstrap.project
      "agents" $i.bootstrap.agents
      | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-secret-init
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-secret-init
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $name }}, {{ $name }}-admin]
    verbs: [get, update]
  # Restarts the api and worker after it writes new keys (secret_init.py).
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ $name }}-api, {{ $name }}-worker]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-secret-init
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-secret-init
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-secret-init
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-secret-init
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # A Job's pod template is immutable; a changed script replaces the Job.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 6
  # Bounds a database or API server that never answers. On a rebuild the
  # database's URL appears only after garage-init (every 10 minutes), the
  # Cluster's bootstrap and factory-db's PostSync, so this is generous.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-secret-init
    spec:
      serviceAccountName: {{ $name }}-secret-init
      restartPolicy: OnFailure
      securityContext:
        {{- include "factory.itsaplanPodSecurity" . | nindent 8 }}
      # db-state, plan, purge and apply (files/itsaplan/secret_init.py): count
      # the database's rows with the api image's psql, decide, delete the
      # stored secrets only when lost keys are being replaced, then write.
      initContainers:
        - name: db-state
          image: {{ $i.images.api }}
          command:
            - sh
            - -c
            - psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -f /scripts/db_state.sql > /state/rows
          {{- include "factory.itsaplanSecretInitDB" . | nindent 10 }}
        - name: plan
          image: {{ $i.images.jobs }}
          command: [python3, -I, -u, /scripts/secret_init.py, plan]
          {{- include "factory.itsaplanSecretInitEnv" . | nindent 10 }}
        - name: purge
          image: {{ $i.images.api }}
          command:
            - sh
            - -c
            - >-
              if [ "$(cat /state/plan)" = purge ]; then
              psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -1 -f /scripts/purge.sql;
              else echo "nothing to purge"; fi
          {{- include "factory.itsaplanSecretInitDB" . | nindent 10 }}
      containers:
        - name: apply
          image: {{ $i.images.jobs }}
          command: [python3, -I, -u, /scripts/secret_init.py, apply]
          {{- include "factory.itsaplanSecretInitEnv" . | nindent 10 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}-scripts
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $name }}-admin, {{ $i.oidc.clientSecretName }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ toJson (prepend $agentSecrets (printf "%s-bootstrap" $name)) }}
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-bootstrap
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  # The api, the admin Secret and the OIDC client secret are each waited for
  # (bootstrap.py); this bounds the whole run.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-bootstrap
    spec:
      serviceAccountName: {{ $name }}-bootstrap
      restartPolicy: OnFailure
      securityContext:
        {{- include "factory.itsaplanPodSecurity" . | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ $i.images.jobs }}
          command: [python3, -I, -u, /scripts/bootstrap.py]
          env:
            - name: NAMESPACE
              value: {{ $ns }}
            - name: API_INTERNAL_URL
              value: {{ include "factory.itsaplanInternalURL" . }}
            - name: APP_URL
              value: {{ include "factory.itsaplanAppURL" . }}
            - name: ADMIN_SECRET
              value: {{ $name }}-admin
            - name: OIDC_SECRET
              value: {{ $i.oidc.clientSecretName }}
            - name: STATE_SECRET
              value: {{ $name }}-bootstrap
            - name: AGENT_SECRET_PREFIX
              value: {{ include "factory.itsaplanAgentSecret" "" }}
            - name: CONFIG
              value: /scripts/config.json
          securityContext:
            {{- include "factory.itsaplanContainerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $i.resources.jobs | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}-scripts
{{- end }}
