{{- if .Values.pushGuard.enabled }}
{{- $cfg := .Values.pushGuard }}
{{- $namespace := "factory-r-homelab" }}
{{- $binding := false }}
{{- range .Values.repositories }}
  {{- if and (eq .namespace $namespace) (eq .owner "jomcgi-org") (eq .repo "homelab") }}
    {{- $binding = true }}
  {{- end }}
{{- end }}
{{- if or (not $binding) (not .Values.networkPolicy.cilium) (ne .Values.substrate.namespace "ate-system") }}
  {{- fail "the push receiver requires the homelab binding and the Factory Substrate network policy" }}
{{- end }}
{{- $image := printf "%s@%s" $cfg.image.repository (required "pushGuard.image.digest must pin the published image" $cfg.image.digest) }}
{{- $index := required "pushGuard.indexSHA256 must pin the private index" $cfg.indexSHA256 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-push-guard
  namespace: {{ $namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factory-push-guard
  namespace: {{ $namespace }}
  annotations:
    {{- include "factory.keep" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $cfg.storageClass | quote }}
  resources:
    requests:
      storage: {{ $cfg.storageSize | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: factory-push-guard
  namespace: {{ $namespace }}
spec:
  selector:
    app.kubernetes.io/name: factory-push-guard
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-push-guard
  namespace: {{ $namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-push-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-push-guard
    spec:
      serviceAccountName: factory-push-guard
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed
          image: {{ $image | quote }}
          command: [/usr/local/libexec/factory-push-guard/seed-repository]
          env:
            - name: PUSH_GUARD_INDEX_SHA256
              value: {{ $index | quote }}
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/factory-push-guard
            - name: tmp
              mountPath: /tmp
      containers:
        - name: receiver
          image: {{ $image | quote }}
          args: ["--index-sha256", {{ $index | quote }}]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/factory-push-guard
            - name: tmp
              mountPath: /tmp
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: factory-push-guard
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: servicedns
          projected:
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: podidentity
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-push-guard
  namespace: {{ $namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: factory-push-guard
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
            app: atenet-egress
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
