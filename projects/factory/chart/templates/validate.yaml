{{- /*
Render-time checks for values the schema cannot express, and for later steps
of the delivery plan that are not implemented yet: setting them fails here
instead of silently rendering nothing.
*/}}
{{- if ne (eq .Values.kagent.mode "install") (.Values.kagent.enabled | default false) }}
{{- fail "kagent.enabled must be true for kagent.mode install and false for existing" }}
{{- end }}
{{- if ne .Values.postgres.mode "existing" }}
{{- fail "postgres.mode install arrives with the CNPG operator (delivery plan step 3); use existing" }}
{{- end }}
{{- if .Values.providers }}
{{- fail "providers are not implemented in this chart version; agents use the broker's relay" }}
{{- end }}
{{- if and .Values.broker.claude.enabled (not .Values.broker.enabled) }}
{{- fail "broker.claude.enabled requires broker.enabled" }}
{{- end }}
{{- if hasKey .Values.broker.config "claude" }}
{{- fail "configure the Claude relay through broker.claude, not broker.config.claude" }}
{{- end }}
{{- with .Values.broker.operatorServiceAccount }}
{{- if or (has . (list "default" (include "factory.brokerName" $) (include "factory.connectorName" $) (include "factory.reviewerName" $))) (hasPrefix "factory-itsaplan" .) }}
{{- fail (printf "broker.operatorServiceAccount %s is a ServiceAccount the chart's Pods use; name a separate one" .) }}
{{- end }}
{{- end }}
{{- $runtime := .Values.kagent.config.runtimeDefaults }}
{{- $watched := .Values.kagent.rbac.namespaces }}
{{- with .Values.discord.explorer }}
{{- if .enabled }}
{{- if not (and $.Values.discord.bridge.enabled $.Values.broker.enabled $.Values.broker.claude.enabled) }}
{{- fail "discord.explorer needs discord.bridge, broker and broker.claude: the bridge runs its turns on the broker's Claude relay" }}
{{- end }}
{{- if not (has .namespace $watched) }}
{{- fail (printf "discord.explorer: add namespace %s to kagent.rbac.namespaces so the controller watches it" .namespace) }}
{{- end }}
{{- if has .namespace (list (include "factory.kagentNamespace" $) $.Values.broker.namespace $.Values.discord.bridge.namespace $.Values.discord.agent.namespace $.Values.discord.operator.namespace) }}
{{- fail (printf "discord.explorer: namespace %s must be the explorer Agent's alone" .namespace) }}
{{- end }}
{{- range $server, $a := $.Values.discord.serverAgents }}
{{- if eq (printf "discord-%s" $a.guild) $.Values.discord.explorer.namespace }}
{{- fail (printf "discord.explorer: namespace %s must be the explorer Agent's alone" $.Values.discord.explorer.namespace) }}
{{- end }}
{{- end }}
{{- if (or (ne (toString .resources.cpu) (toString $runtime.cpu)) (ne (toString .resources.memory) (toString $runtime.memory))) }}
{{- fail (printf "discord.explorer: resources must equal kagent.config.runtimeDefaults (cpu %v, memory %v), which kagent applies to every runtime" $runtime.cpu $runtime.memory) }}
{{- end }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" (.harnessImage | default "")) }}
{{- fail "discord.explorer.harnessImage: set a digest-pinned Claude harness image" }}
{{- end }}
{{- if not (hasKey ($.Values.broker.claude.modelAllowlist | default dict) (printf "actor/%s/session-*" .namespace)) }}
{{- fail (printf "discord.explorer: add actor/%s/session-* with %s to broker.claude.modelAllowlist" .namespace .model) }}
{{- end }}
{{- end }}
{{- end }}
{{- $seen := dict }}
{{- range $r := .Values.repositories }}
{{- $a := index $.Values.agents $r.agent }}
{{- if not $a }}
{{- fail (printf "repositories %s: agent %q is not in agents" $r.name $r.agent) }}
{{- end }}
{{- if eq $a.harness "claude" }}
{{- fail (printf "repositories %s: agents.%s harness claude is supported only for agents.planner" $r.name $r.agent) }}
{{- end }}
{{- if and (eq ($r.toolchain | default "") "homelab") (not (has "github-git" $a.egress)) }}
{{- fail (printf "repositories %s: homelab toolchain needs agents.%s.egress github-git for release downloads" $r.name $r.agent) }}
{{- end }}
{{- if hasKey $seen $r.namespace }}
{{- fail (printf "repositories %s: namespace %s is already bound; one namespace per repository" $r.name $r.namespace) }}
{{- end }}
{{- $_ := set $seen $r.namespace true }}
{{- if or (eq $r.namespace (include "factory.kagentNamespace" $)) (eq $r.namespace $.Values.broker.namespace) }}
{{- fail (printf "repositories %s: namespace %s is not a binding namespace" $r.name $r.namespace) }}
{{- end }}
{{- if not (has $r.namespace $watched) }}
{{- fail (printf "repositories %s: add namespace %s to kagent.rbac.namespaces so the controller watches it" $r.name $r.namespace) }}
{{- end }}
{{- if not $.Values.broker.enabled }}
{{- fail (printf "repositories %s: agent provider broker needs broker.enabled" $r.name) }}
{{- end }}
{{- /* kagent 1.0.1 applies one CPU and memory limit to every runtime. */}}
{{- if or (ne (toString $a.resources.cpu) (toString $runtime.cpu)) (ne (toString $a.resources.memory) (toString $runtime.memory)) }}
{{- fail (printf "agents %s: resources must equal kagent.config.runtimeDefaults (cpu %v, memory %v), which kagent applies to every runtime" $r.agent $runtime.cpu $runtime.memory) }}
{{- end }}
{{- end }}
{{- with .Values.discord.agent }}
{{- if .enabled }}
{{- if not (has .namespace $watched) }}
{{- fail (printf "discord.agent: add namespace %s to kagent.rbac.namespaces so the controller watches it" .namespace) }}
{{- end }}
{{- if or (hasKey $seen .namespace) (eq .namespace (include "factory.kagentNamespace" $)) (eq .namespace $.Values.broker.namespace) (eq .namespace $.Values.discord.bridge.namespace) }}
{{- fail (printf "discord.agent: namespace %s must be the Discord Agent's alone" .namespace) }}
{{- end }}
{{- if or (ne (toString .resources.cpu) (toString $runtime.cpu)) (ne (toString .resources.memory) (toString $runtime.memory)) }}
{{- fail (printf "discord.agent: resources must equal kagent.config.runtimeDefaults (cpu %v, memory %v), which kagent applies to every runtime" $runtime.cpu $runtime.memory) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $id, $g := .Values.discord.bridge.policy.guilds }}
{{- range ($g.channels | default list) }}
{{- if not (kindIs "string" .) }}
{{- fail (printf "discord.bridge.policy.guilds.%s.channels: quote each channel ID; Helm reads a bare number as a float and loses digits" $id) }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.discord.operator }}
{{- if .enabled }}
{{- if not (and $.Values.discord.bridge.enabled $.Values.broker.enabled) }}
{{- fail "discord.operator needs discord.bridge and broker: the bridge runs its turns on the broker's Codex relay" }}
{{- end }}
{{- if not (has .namespace $watched) }}
{{- fail (printf "discord.operator: add namespace %s to kagent.rbac.namespaces so the controller watches it" .namespace) }}
{{- end }}
{{- if or (hasKey $seen .namespace) (eq .namespace (include "factory.kagentNamespace" $)) (eq .namespace $.Values.broker.namespace) (eq .namespace $.Values.discord.bridge.namespace) (eq .namespace $.Values.discord.agent.namespace) }}
{{- fail (printf "discord.operator: namespace %s must be the operator Agent's alone" .namespace) }}
{{- end }}
{{- if or (ne (toString .resources.cpu) (toString $runtime.cpu)) (ne (toString .resources.memory) (toString $runtime.memory)) }}
{{- fail (printf "discord.operator: resources must equal kagent.config.runtimeDefaults (cpu %v, memory %v), which kagent applies to every runtime" $runtime.cpu $runtime.memory) }}
{{- end }}
{{- if or (not (kindIs "string" .guild)) (not .guild) (not (hasKey $.Values.discord.bridge.policy.guilds .guild)) }}
{{- fail "discord.operator.guild: quote a server ID from discord.bridge.policy.guilds" }}
{{- end }}
{{- if not .channels }}
{{- fail "discord.operator.channels: name at least one parent channel" }}
{{- end }}
{{- range .channels }}
{{- if or (not (kindIs "string" .)) (not .) }}
{{- fail "discord.operator.channels: quote each channel ID; Helm reads a bare number as a float and loses digits" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $server, $a := .Values.discord.serverAgents }}
{{- if $a.enabled }}
{{- if or (not (kindIs "string" $a.guild)) (not (regexMatch "^[0-9]+$" $a.guild)) }}
{{- fail (printf "discord.serverAgents.%s.guild: quote the server ID; Helm reads a bare number as a float and loses digits" $server) }}
{{- end }}
{{- $ns := printf "discord-%s" $a.guild }}
{{- if not (has $ns $watched) }}
{{- fail (printf "discord.serverAgents.%s: add namespace %s to kagent.rbac.namespaces so the controller watches it" $server $ns) }}
{{- end }}
{{- if or (hasKey $seen $ns) (has $ns (list $.Values.discord.agent.namespace $.Values.discord.operator.namespace $.Values.discord.bridge.namespace)) }}
{{- fail (printf "discord.serverAgents.%s: namespace %s must be the server Agent's alone" $server $ns) }}
{{- end }}
{{- $_ := set $seen $ns true }}
{{- if or (ne (toString $a.resources.cpu) (toString $runtime.cpu)) (ne (toString $a.resources.memory) (toString $runtime.memory)) }}
{{- fail (printf "discord.serverAgents.%s: resources must equal kagent.config.runtimeDefaults (cpu %v, memory %v), which kagent applies to every runtime" $server $runtime.cpu $runtime.memory) }}
{{- end }}
{{- if not $a.llmItemPath }}
{{- fail (printf "discord.serverAgents.%s.llmItemPath: name the model key's 1Password item" $server) }}
{{- end }}
{{- $provider := $a.provider | default "openAI" }}
{{- if not (has $provider (list "openAI" "anthropic")) }}
{{- fail (printf "discord.serverAgents.%s.provider must be openAI or anthropic" $server) }}
{{- end }}
{{- if and $a.cacheTTL (or (ne $provider "anthropic") (not (has $a.cacheTTL (list "5m" "1h")))) }}
{{- fail (printf "discord.serverAgents.%s.cacheTTL: 5m or 1h, for provider anthropic only" $server) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.discord.backfill.enabled (not .Values.discord.bridge.enabled) }}
{{- fail "discord.backfill needs discord.bridge: the bridge runs the backfill" }}
{{- end }}
{{- if and .Values.discord.bridge.enabled (not .Values.discord.agent.enabled) }}
{{- fail "discord.bridge needs discord.agent: the bridge sends every turn to that Agent" }}
{{- end }}
{{- if .Values.itsaplan.enabled }}
{{- if eq .Values.itsaplan.namespace (include "factory.kagentNamespace" .) }}
{{- fail "itsaplan.namespace must not be kagent's: the kagent controller reads every Secret there" }}
{{- end }}
{{- if ne .Values.itsaplan.namespace .Values.broker.namespace }}
{{- fail "itsaplan.namespace must be broker.namespace: they share the factory namespace the broker's template declares" }}
{{- end }}
{{- end }}
