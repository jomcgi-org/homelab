# The factory home cluster's values for the factory chart
# (projects/factory/chart). The cluster has one install, so there is no
# overlay.

# kagent's database is the CNPG Cluster kagent-pg in its own namespace,
# kagent-pg (projects/platform-factory/kagent-postgres), prepared with
# kagent's setup script. Its setup Job writes the connection-string Secrets
# kagent-postgres-owner and kagent-postgres-readwrite (the chart's defaults)
# into kagent; the superuser and backup credentials stay in kagent-pg, out of
# the controller's reach.
postgres:
  mode: existing
  existing:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kagent-pg
          cnpg.io/cluster: kagent-pg
    port: 5432

# The credential broker (projects/factory/broker): relays the Codex harness's
# model calls with its own grant, and mints tokens from the jomcgi-factory
# GitHub App (installed on jomcgi-org/homelab only). Its 1Password item is an
# SSH Key item whose `private key` field the operator writes as private-key,
# with text fields app-id and installation-id.
broker:
  enabled: true
  # Operators log in to Codex and force refreshes as factory/factory-operator
  # (projects/factory-cluster/README.md, "Codex login").
  operatorServiceAccount: factory-operator
  githubApp:
    enabled: true
    itemPath: vaults/k8s-homelab/items/factory-gh-app
  # kagent's Codex harness sends no reasoning effort, so the relay sets it on
  # every model call (projects/factory/broker, codex.reasoningEffort).
  config:
    codex:
      reasoningEffort: xhigh

kagent:
  # Agents and the controller's watch: kagent's own namespace plus each
  # repository binding's.
  rbac:
    namespaces: [kagent, factory-r-homelab, factory-r-homelab-review, factory-discord-agent]
  # The controller's metrics for Prometheus
  # (projects/platform-factory/prometheus): HTTPS on 8443, admitting a token
  # whose subject may GET /metrics.
  controller:
    metrics:
      enabled: true
    # kagent v1.0.1 built from jomcgi-org/kagent commit 2c2fc329a8d8
    # (branch jomcgi/codex-6.2, build run
    # https://github.com/jomcgi-org/kagent/actions/runs/44189845362). That
    # commit sets PinnedCodexVersion and the harness Dockerfile to Codex
    # 0.169.1, the first stable Codex whose bundled catalogue has
    # gpt-6.2-astra and gpt-6.2-sol (agents.*.model below). Upstream kagent
    # v1.0.1 pins 0.161.0, which has neither. The controller writes that pin
    # into each actor's config (strict), so it moves with the harness image
    # below. Upstream PR to follow; return to the packaged images when a
    # kagent release ships the bump. Revert the images and the models
    # together: the packaged images' Codex 0.161.0 gives a 6.2 coder no
    # apply_patch.
    image:
      registry: ghcr.io
      repository: jomcgi-org/kagent/controller
      tag: 1.0.1-jomcgi.2c2fc329a8d8@sha256:6fa3481159e7e660916e400359b8f48878e6ce58ce430ec619653441e5b1cc4e
  # The UI peaked at 4Mi over two days (2026-11-16) against the chart's
  # 256Mi request.
  ui:
    resources:
      requests:
        memory: 64Mi
  # Every agent runtime's limits, the codex agent's size (kagent 1.0.1 sets
  # one for all Agents).
  config:
    # The Codex harness from the same fork build as the controller: Codex
    # 0.169.1 in place of 0.161.0. The controller starts only when `release`
    # equals its own version, so it names the fork build, not 1.0.1.
    harnessImages:
      release: 1.0.1-jomcgi.2c2fc329a8d8
      codex: ghcr.io/jomcgi-org/kagent/codex-harness@sha256:f1b2f7a4834394ae9170b13e4d135201e754f791312ca1990a530221ec57d9d1
    runtimeDefaults:
      cpu: "4"
      memory: 8Gi
    # kagent reviews the connector's ServiceAccount token under this
    # authority, which is part of its principal ID: changing it loses the
    # connector's sessions.
    server:
      auth:
        serviceAccount:
          authority: factory-home

# The Codex agent's model: gpt-6.2-astra, the frontier model, at the broker's
# xhigh reasoning effort (Joe, 2026-11-14; 6.2 on 2026-11-17:
# https://github.com/jomcgi-org/homelab/pull/8193#issuecomment-6963828989). Codex (0.169.1, from the
# kagent fork above) gives a model its apply_patch edit tool only when it is
# in its bundled catalogue (codex-rs/models-manager/models.json); with a
# model outside it the first run (HOME-1) had no way to edit files.
agents:
  codex:
    model: gpt-6.2-astra
    # Substrate workers (requests 1 CPU, 1536Mi), one actor each. The nodes
    # idle at ~4% CPU, so the queue and merge contention bound throughput, not
    # compute. Two more than connector.agents below allows runs: an idle
    # session's actor keeps its worker after its turn, and a resume with no
    # free worker fails ("no worker has room"), which the connector records
    # as an ambiguous send (HOME-131, 2026-11-16).
    concurrency: 6
    # The request sizes the pool, not one turn: the six workers peaked at
    # 8.8Gi together (14-16 Nov), about 1.5Gi each, while one turn reached
    # 7.4Gi. A turn above its request uses free node memory, then zram swap:
    # the nodes' kubelets give each container swap in proportion to its
    # request (LimitedSwap), about 1.6Gi here.
    worker:
      resources:
        requests:
          memory: 1536Mi
  # The reviewer reads and never edits, so it needs no apply_patch. It runs
  # gpt-6.2-sol (Joe, 2026-11-17:
  # https://github.com/jomcgi-org/homelab/pull/8193#issuecomment-6963828989),
  # which Codex 0.169.1 has in its
  # catalogue; before that it ran gpt-6.1-terra to spend less of the Codex
  # quota (https://github.com/jomcgi-org/homelab/issues/7817#issuecomment-6881930021).
  # The broker's reasoningEffort (xhigh) applies to it as to the coder.
  reviewer:
    model: gpt-6.2-sol
    # One worker per concurrent review (reviewer.concurrency).
    concurrency: 3
    # The review binding has no toolchain and runs no PR code, so its
    # workers stay small: 1.2Gi at most for one worker and 2.7Gi for all
    # three together (14-16 Nov), sized per worker like the coder pool. The
    # limit stays at the actor booking plus gVisor.
    worker:
      resources:
        requests:
          memory: 1Gi

# jomcgi-org/homelab. Its namespace is also granted in Substrate's
# credentialProvider.namespacePolicies
# (projects/platform-factory/substrate/values/substrate.yaml).
repositories:
  - name: homelab
    owner: jomcgi-org
    repo: homelab
    baseBranch: main
    namespace: factory-r-homelab
    agent: codex
    # Bootstrap instructions and public download origins for local checks
    # (#7916, ARCHITECTURE.md "Sandbox checks"). The review binding has none.
    toolchain: homelab
    # Long-term memory in bank `homelab` (projects/platform-factory/hindsight,
    # HOME-130). The hindsight-agents Job copies the MCP token into
    # hindsight-mcp, and the egress gateway injects it.
    memory:
      url: http://hindsight-api.hindsight.svc.cluster.local:8888/mcp/homelab/
      secret: hindsight-mcp
      tools: [recall, retain]

# itsaplan at factory-plan.jomcgi.dev, behind the edge's Authentik sign-in.
# Its database is factory-db (projects/platform-factory/factory-db), whose
# setup Job writes factory/factory-itsaplan-db; its S3 key is
# factory/factory-itsaplan-s3 and its OIDC client secret
# factory/factory-itsaplan-oidc, both from factory-buckets.
itsaplan:
  enabled: true
  # Requests at the 99th-percentile working set plus 10% (14-16 Nov): api
  # 265Mi, web 146Mi, worker 86Mi.
  resources:
    api:
      requests:
        memory: 320Mi
    web:
      requests:
        memory: 176Mi
    worker:
      requests:
        memory: 96Mi
  database:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: factory-db
          cnpg.io/cluster: factory-db
  s3:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: garage
          app.kubernetes.io/name: garage

# The connector (projects/factory/connector) as factory/factory-connector,
# for the homelab binding.
connector:
  enabled: true
  # homelab-codex claims up to 4 runs at once, two fewer than the
  # agents.codex.concurrency workers that hold them (see there).
  agents:
    - username: homelab-codex
      concurrency: 4
  bindings:
    homelab:
      itsaplanProject: HOME
      agents: [homelab-codex]
      # The factory-reviewer's check is the review: the connector enqueues a
      # head only once `factory review` from the reviewer App passes on it,
      # and its findings start a revision round (a human-gate-only hold waits
      # for Joe instead). jomcgi stays trusted, so Joe's "request changes"
      # still blocks and starts a round (#7817 decision 6882698416).
      trustedReviewers: [jomcgi]
      # Six revision and six rebase rounds, up from the default three: on
      # 2026-11-15, 17 of the factory's PRs sat at the third review round with
      # blocking findings, each waiting for a person, and a busy main spends
      # rebase rounds quickly.
      maxReviewRounds: 6
      maxRebaseRounds: 6
      reviewerCheck:
        name: factory review
        appId: 5758326
      # The ruleset's required check, a commit status BuildBuddy posts: the
      # connector enqueues only once it passes, and a failure on the head
      # starts a revision round with its link, so CI failures reach the agent
      # without waiting for a review. Status creators come from the
      # statuses list endpoint (#7900).
      requiredChecks:
        - name: pr-checks
          statusCreator: buildbuddy-io[bot]
  database:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: factory-db
          cnpg.io/cluster: factory-db

# The factory-reviewer (projects/factory/reviewer; ARCHITECTURE.md "Merge
# authority"): posts the `factory review` check on every PR into main, which
# the connector waits for and the ruleset is to require. It enqueues nothing: GitHub refuses enqueues from its
# read-only token, and write access would let it push or approve. The
# connector enqueues the factory's PRs; other authors use auto-merge
# (#7817 decision 6882698416). Its agent runs in factory-r-homelab-review
# with a read-only git token from the reviewer App
# (k8s-homelab/factory-review-gh-app).
reviewer:
  enabled: true
  # Reviews at once; agents.reviewer.concurrency gives each a worker.
  concurrency: 3
  # The reviewer keeps one comment on each PR it reviews (verdict and
  # findings), written with the broker's Issues-write comment token.
  commentAuthor: jomcgi-factory-review[bot]
  bindings:
    homelab:
      enqueueAuthors: []
      # Used only by enqueues, which are off; kept for when they return.
      requiredChecks:
        - name: pr-checks
          statusCreator: buildbuddy-io[bot]
# The Discord bot (HOME-162). The Agent is on, so it can be checked over A2A
# before the bridge sends it Discord turns; the bridge stays off until the
# hub monolith's bot is off (HOME-221).
discord:
  agent:
    enabled: true
