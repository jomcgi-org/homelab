# The factory home cluster's values for the factory chart
# (projects/factory/chart). The cluster has one install, so there is no
# overlay.

# kagent's database is the CNPG Cluster kagent-pg in its own namespace,
# kagent-pg (projects/platform-factory/kagent-postgres), prepared with
# kagent's setup script. Its setup Job writes the connection-string Secrets
# kagent-postgres-owner and kagent-postgres-readwrite (the chart's defaults)
# into kagent; the superuser and backup credentials stay in kagent-pg, out of
# the controller's reach.
postgres:
  mode: existing
  existing:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kagent-pg
          cnpg.io/cluster: kagent-pg
    port: 5432

# The credential broker (projects/factory/broker): relays the Codex harness's
# model calls with its own grant, and mints tokens from the jomcgi-factory
# GitHub App (installed on jomcgi-org/homelab only). Its 1Password item is an
# SSH Key item whose `private key` field the operator writes as private-key,
# with text fields app-id and installation-id.
broker:
  enabled: true
  # Operators log in to Codex and force refreshes as factory/factory-operator
  # (projects/factory-cluster/README.md, "Codex login").
  operatorServiceAccount: factory-operator
  githubApp:
    enabled: true
    itemPath: vaults/k8s-homelab/items/factory-gh-app
  # kagent's Codex harness sends no reasoning effort, so the relay sets it on
  # every model call (projects/factory/broker, codex.reasoningEffort).
  config:
    codex:
      reasoningEffort: xhigh
  # Claude Code relay (HOME-232) for the scheduled planner only (HOME-40,
  # Joe 2026-11-25: Opus 5.5 first, Fable 5.2 later if needed). Each planner
  # run is a fresh session, so the allowlist names the planner atespace's
  # session actors by wildcard (#8690). Fable stays listed so the model change
  # is a values-only edit to agents.planner.model.
  claude:
    enabled: true
    modelAllowlist:
      actor/factory-r-homelab-planner/session-*:
        - claude-opus-5-5
        - claude-fable-5-2

kagent:
  # The pinned chart reads these Git values before the replacement chart ships.
  # Keep the alert outbox in Argo CD's desired state while the schedule is off.
  extraObjects:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: factory-semgrep-sync
        namespace: factory
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Mi
  # Agents and the controller's watch: kagent's own namespace plus each
  # repository binding's.
  rbac:
    namespaces: [kagent, factory-r-homelab, factory-r-homelab-review, factory-r-homelab-planner, factory-discord-agent, factory-discord-operator]
  # The controller's metrics for Prometheus
  # (projects/platform-factory/prometheus): HTTPS on 8443, admitting a token
  # whose subject may GET /metrics.
  controller:
    metrics:
      enabled: true
    # kagent v1.0.1 built from jomcgi-org/kagent commit e3d14ee3dd62
    # (branch jomcgi/codex-6.2, build run
    # https://github.com/jomcgi-org/kagent/actions/runs/44250376557). Commit
    # 2c2fc329a8d8 sets PinnedCodexVersion and the harness Dockerfile to Codex
    # 0.169.1, the first stable Codex whose bundled catalogue has
    # gpt-6.2-astra and gpt-6.2-sol (agents.*.model below). Upstream kagent
    # v1.0.1 pins 0.161.0, which has neither. The controller writes that pin
    # into each actor's config (strict), so it moves with the harness image
    # below. Upstream PR to follow; return to the packaged images when a
    # kagent release ships the bump. Revert the images and the models
    # together: the packaged images' Codex 0.161.0 gives a 6.2 coder no
    # apply_patch.
    # Commit 9fd64db555fa adds kagent-dev/kagent#3653, and the build run
    # tests it: SuspendActor gets its own 2 min deadline
    # (substrate.snapshotTimeout) in place of the 30 s call deadline, whose
    # timeout wedges the session (kagent#3311/#3312).
    image:
      registry: ghcr.io
      repository: jomcgi-org/kagent/controller
      tag: 1.0.1-jomcgi.e3d14ee3dd62@sha256:f7fb26c1a1158df556e1b0f861903c9b5d7b383e61278b32abb04534adcc931c
  # The UI peaked at 4Mi over two days (2026-11-16) against the chart's
  # 256Mi request.
  ui:
    resources:
      requests:
        memory: 64Mi
  # Every agent runtime's limits, the codex agent's size (kagent 1.0.1 sets
  # one for all Agents).
  config:
    # The Codex harness from the same fork build as the controller: Codex
    # 0.169.1 in place of 0.161.0. The controller starts only when `release`
    # equals its own version, so it names the fork build, not 1.0.1.
    harnessImages:
      release: 1.0.1-jomcgi.e3d14ee3dd62
      codex: ghcr.io/jomcgi-org/kagent/codex-harness@sha256:51d92a9c9b5e819325e89491a80678539fc60dc7713a6e4e4b150ff9adc0a3cb
    runtimeDefaults:
      cpu: "4"
      memory: 8Gi
    # kagent reviews the connector's ServiceAccount token under this
    # authority, which is part of its principal ID: changing it loses the
    # connector's sessions.
    server:
      auth:
        serviceAccount:
          authority: factory-home

# The control coder's model: gpt-6.2-astra, the frontier model, at the broker's
# xhigh reasoning effort (Joe, 2026-11-14; 6.2 on 2026-11-17:
# https://github.com/jomcgi-org/homelab/pull/8193#issuecomment-6963828989). Codex (0.169.1, from the
# kagent fork above) gives a model its apply_patch edit tool only when it is
# in its bundled catalogue (codex-rs/models-manager/models.json); with a
# model outside it the first run (HOME-1) had no way to edit files.
agents:
  codex:
    model: gpt-6.2-astra
    # Substrate workers (requests 1 CPU, 768Mi), one actor each. The nodes
    # idle at ~4% CPU, so the queue and merge contention bound throughput, not
    # compute. Two more than connector.agents below allows runs: an idle
    # session's actor keeps its worker after its turn, and a resume with no
    # free worker fails ("no worker has room"), which the connector records
    # as an ambiguous send (HOME-131, 2026-11-16).
    concurrency: 12
    # The request covers what reclaim cannot take from a busy worker, not its
    # peak. Most of a worker's memory is file cache, which the kernel drops
    # under pressure: on 18 Nov, busy workers held 0.2-1.2Gi of anonymous and
    # shared memory and 2.8-3.7Gi of file cache. Twelve workers at 768Mi
    # request what nine at 1Gi did (HOME-570). A turn above its request uses
    # free node memory, then zram swap: the kubelets give each container swap in proportion to
    # its request (LimitedSwap), about 768Mi here (HOME-142).
    worker:
      resources:
        requests:
          memory: 768Mi
    # The pool follows demand between 0 and 12 workers instead of holding 12
    # (ARCHITECTURE.md, "Worker pool autoscaling"). At zero, the connector
    # holds a run's send until a worker is ready (`intervals.workerWait`,
    # below). The spare of 2 matches the two workers this pool keeps above
    # connector.agents. Argo CD ignores the pool's /spec/replicas
    # (application.yaml), because the HPA owns it.
    autoscaling:
      enabled: true
      minReplicas: 0
      spare: 2
      maxReplicas: 12
  # The scheduled planner (HOME-40) runs Claude Code through the broker's
  # Claude relay on Opus 5.5 (Joe, 2026-11-25); Fable 5.2 can replace it by
  # editing `model` (broker.claude.modelAllowlist lists both).
  planner:
    harness: claude
    model: claude-opus-5-5
  # The reviewer reads and never edits, so it needs no apply_patch. It runs
  # gpt-6.2-sol (Joe, 2026-11-17:
  # https://github.com/jomcgi-org/homelab/pull/8193#issuecomment-6963828989),
  # which Codex 0.169.1 has in its
  # catalogue; before that it ran gpt-6.1-terra to spend less of the Codex
  # quota (https://github.com/jomcgi-org/homelab/issues/7817#issuecomment-6881930021).
  # Reviews use the broker default effort (xhigh).
  reviewer:
    model: gpt-6.2-sol
    # Two more workers than reviewer.concurrency: goal check sessions and
    # idle review sessions hold workers too.
    concurrency: 5
    # The review binding has no toolchain and runs no PR code, so its
    # workers stay small: 1.2Gi at most for one worker and 2.7Gi for all
    # three together (14-16 Nov), sized per worker like the coder pool. Five
    # workers at 640Mi request about what three at 1Gi did (HOME-570). The
    # limit stays at the actor booking plus gVisor.
    worker:
      resources:
        requests:
          memory: 640Mi
    # The pool follows the reviews between 3 and 5 workers instead of holding
    # 5 (ARCHITECTURE.md, "Worker pool autoscaling"). The reviewer sends to
    # kagent itself, so no signal precedes a burst: minReplicas is
    # reviewer.concurrency, and the spare of 2 keeps the goal check sessions
    # that follow a review turn from finding no worker (2026-11-22). The reaper
    # publishes the pool's pending demand at 0. Argo CD ignores the pool's
    # /spec/replicas (application.yaml), because the HPA owns it.
    autoscaling:
      enabled: true
      minReplicas: 3
      spare: 2
      maxReplicas: 5

# jomcgi-org/homelab. Its namespace is also granted in Substrate's
# credentialProvider.namespacePolicies
# (projects/platform-factory/substrate/values/substrate.yaml).
repositories:
  - name: homelab
    owner: jomcgi-org
    repo: homelab
    baseBranch: main
    namespace: factory-r-homelab
    agent: codex
    # Bootstrap instructions and public download origins for local checks
    # (#7916, ARCHITECTURE.md "Sandbox checks"). The review binding has none.
    toolchain: homelab
    # Long-term memory in bank `homelab` (projects/platform-factory/hindsight,
    # HOME-130). The hindsight-agents Job copies the MCP token into
    # hindsight-mcp, and the egress gateway injects it.
    memory:
      url: http://hindsight-api.hindsight.svc.cluster.local:8888/mcp/homelab/
      secret: hindsight-mcp
      tools: [recall, retain]

# itsaplan at factory-plan.jomcgi.dev, behind the edge's Authentik sign-in.
# Its database is factory-db (projects/platform-factory/factory-db), whose
# setup Job writes factory/factory-itsaplan-db; its S3 key is
# factory/factory-itsaplan-s3 and its OIDC client secret
# factory/factory-itsaplan-oidc, both from factory-buckets.
itsaplan:
  enabled: true
  # Requests at the 99th-percentile working set plus 10% (14-16 Nov): api
  # 265Mi, web 146Mi, worker 86Mi.
  resources:
    api:
      requests:
        memory: 320Mi
    web:
      requests:
        memory: 176Mi
    worker:
      requests:
        memory: 96Mi
  database:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: factory-db
          cnpg.io/cluster: factory-db
  s3:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: garage
          app.kubernetes.io/name: garage

# The connector (projects/factory/connector) as factory/factory-connector,
# for the homelab binding.
connector:
  traceEndpoint: http://otel-collector.otel-collector.svc.cluster.local:4317
  enabled: true
  # task-agent claims up to 10 runs at once, two fewer than the
  # agents.codex.concurrency workers that hold them (see there). It is the
  # only delegate; homelab-codex is retired (HOME-898).
  agents:
    - username: task-agent
      concurrency: 10
  # 120 s between polls of one open PR, up from 60 s. On 2026-11-22 about 45
  # open PRs at 60 s used about 5,400 GraphQL points an hour against the
  # installation's 5,000, so delivery stopped for part of every hour
  # (HOME-751).
  intervals:
    reviewPoll: 120s
    # A send waits at most 5 min for a ready worker. A cold start from zero
    # takes about 2 min: Prometheus scrapes each 30 s, the HPA syncs each
    # 15 s, a worker pod is Ready about 10 s after it starts, and the reaper
    # writes its capacity row each 15 s. One pod took 161 s to be scheduled on
    # 2026-11-20, so the bound covers a slow schedule too. A held send is not
    # issued, so no lease runs on it.
    workerWait: 5m
  # PR bodies link the itsaplan run page. The page stays behind Authentik;
  # only the URL is public (HOME-119).
  links:
    run: https://factory-plan.jomcgi.dev/factory/HOME/agents/queue/{run}
  # The planner's smoke run (HOME-40 "Done when"). `cron` fires once a year,
  # 14:00 UTC on 26 November 2026; remove the entry after the smoke passes.
  # Its ceiling is backlog, so a proposal becomes a Backlog issue and no
  # coding agent starts on it. The three reviewed pilots (chart default) have
  # no cron yet and return here with one at the longer cadence.
  plannerSchedules:
    - name: smoke
      namespace: homelab:smoke
      ceiling: backlog
      minInterval: 24h
      cooldown: 168h
      perRun: 1
      cron: "0 14 26 11 *"
      prompt: smoke
      issueTitle: Planner smoke finding
      instructions: >-
        Verify the cited finding on the current code before any change.
  bindings:
    homelab:
      itsaplanProject: HOME
      agents: [task-agent]
      # The factory-reviewer's check is the review: the connector enqueues a
      # head only once `factory review` from the reviewer App passes on it,
      # and its findings start a revision round (a human-gate-only hold waits
      # for Joe instead). jomcgi stays trusted, so Joe's "request changes"
      # still blocks and starts a round (#7817 decision 6882698416).
      trustedReviewers: [jomcgi]
      # Six revision and six rebase rounds, up from the default three: on
      # 2026-11-15, 17 of the factory's PRs sat at the third review round with
      # blocking findings, each waiting for a person, and a busy main spends
      # rebase rounds quickly.
      maxReviewRounds: 6
      maxRebaseRounds: 6
      reviewerCheck:
        name: factory review
        appId: 5758326
      # The ruleset's required check, a commit status BuildBuddy posts: the
      # connector enqueues only once it passes, and a failure on the head
      # starts a revision round with its link, so CI failures reach the agent
      # without waiting for a review. Status creators come from the
      # statuses list endpoint (#7900).
      requiredChecks:
        - name: pr-checks
          statusCreator: buildbuddy-io[bot]
  database:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: factory-db
          cnpg.io/cluster: factory-db

# The factory-reviewer (projects/factory/reviewer; ARCHITECTURE.md "Merge
# authority"): posts the `factory review` check on every PR into main, which
# the connector waits for and the ruleset is to require. It enqueues nothing: GitHub refuses enqueues from its
# read-only token, and write access would let it push or approve. The
# connector enqueues the factory's PRs; other authors use auto-merge
# (#7817 decision 6882698416). Its agent runs in factory-r-homelab-review
# with a read-only git token from the reviewer App
# (k8s-homelab/factory-review-gh-app).
reviewer:
  traceEndpoint: http://otel-collector.otel-collector.svc.cluster.local:4317
  enabled: true
  # Reviews at once. Each review also starts a goal check session on the
  # same agent, and an idle session's actor keeps its worker after its turn,
  # so agents.reviewer.concurrency keeps two workers spare: with five reviews
  # on five workers, goal sends waited for a worker and timed out (23 of 70
  # goal checks gave no answer in 2 h on 2026-11-22).
  concurrency: 3
  # The coder gets the goal check's private reasons in its next revision
  # round, posted on the issue by the connector (HOME-251).
  goalReasons:
    enabled: true
  # The reviewer keeps one comment on each PR it reviews (verdict and
  # findings), written with the broker's Issues-write comment token.
  commentAuthor: jomcgi-factory-review[bot]
  # A head with the tree of the PR's last reviewed head, and unchanged review
  # inputs, keeps that review and sends no code review task. Over 26 hours on
  # 21-22 Nov the reviewer made 71% of the Codex calls (4,424 against 1,755
  # for coders) and 63% of model time, because every new head got a full xhigh
  # review (projects/factory/reviewer/review/reuse.go).
  reuseUnchangedTree: true
  bindings:
    homelab:
      # Joe 2026-11-24: his own PRs pass without a model review (his sessions
      # review them first). Only the authorship waiver's evidence qualifies.
      authorApproved: true
      # Joe 2026-11-24: only these actors get a review; another author's PR
      # gets no check, like a skip label. `factory review` is a required
      # check, so such a PR cannot merge until Joe acts.
      reviewAuthors:
        - jomcgi
        - jomcgi-factory[bot]
      # A new model review waits for pr-checks to pass, so a head that fails
      # CI costs no review tokens; the connector sends the failure to the
      # coder first. Remove both lines to revert.
      reviewAfterChecks: true
      enqueueAuthors: []
      # Used only by enqueues, which are off; kept for when they return.
      requiredChecks:
        - name: pr-checks
          statusCreator: buildbuddy-io[bot]
# The Discord bot (HOME-162). The bridge is on (HOME-221).
discord:
  agent:
    enabled: true
  bridge:
    enabled: true
    # On the controller port, POST only to Bosun's A2A path and
    # SessionService/DeleteSession. Every node redacts Authorization in
    # Hubble (HOME-296).
    enforceAgentPath: true
    policy:
      # Every server Bosun is in (Joe, HOME-162 comment 1942). history marks
      # each for the history import (HOME-164). ingest stores every human
      # message in each (Joe, 2026-11-25, HOME-833); it needs the Message
      # Content intent enabled for the application (HOME-834).
      guilds:
        "185442367703220224": {history: true, ingest: true} # NOT DEM BOYZ
        "1290668195249917964": {history: true, ingest: true} # The gang...
        "1501965852042330302": {history: true, ingest: true} # homelab
        "1512814732392927463": {history: true, ingest: true} # Loom
      userLimit: {count: 10, window: 1h}
      guildLimit: {count: 60, window: 1h}
      globalLimit: {count: 300, window: 24h}
      queueDepth: 3
  # The history import (HOME-164): one Job per runId reads every server's
  # history into its bank, up to maxDocuments channel-days per run (Joe,
  # 2026-11-25). A new runId continues where the last one stopped.
  import:
    enabled: true
    runId: "1"
  # Joe's operator session (HOME-314 step 1): a persistent session per thread
  # under #factory in the homelab server, for Joe's messages only. His user ID
  # is the `operator-user-id` field of the bot's 1Password item.
  operator:
    enabled: true
    guild: "1501965852042330302"
    channels: ["1575140752776757368"]

semgrepSync:
  enabled: false

# The scheduled planner (HOME-40): one read-only Agent in
# factory-r-homelab-planner, started by itsaplan cron runs. Its Claude harness
# image is the private build from projects/factory/harness/claude (published
# 2026-11-25T10:29Z, tag 2026.11.25.10.26.36-72e28dd3c).
planner:
  enabled: true
  harnessImage: ghcr.io/jomcgi/homelab/projects/factory/harness/claude@sha256:ff770f2257b0ec50539e758043833b795d9caed5402d2e1bf4a3a35d15535009 # ratchet-allow: image-digest (the chart's images map pins no harness image, and the render fails without a digest; bump it by PR)
