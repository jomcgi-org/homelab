# The software factory on the factory home cluster (projects/factory/), from the
# published factory chart. CI writes the chart version back to targetRevision.
# Not named `factory`: that is the cluster's root Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: software-factory
  namespace: argocd
  annotations:
    # After Substrate (wave 2), which kagent calls.
    argocd.argoproj.io/sync-wave: "3"
    # ArgoCD v3.3's built-in schema predates the Kubernetes 1.37
    # podCertificate projected volume the kagent controller uses, so the
    # apiserver computes the diff (as for substrate).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    # The root Application prunes; removing this file must not cascade into
    # kagent's namespace, identity and sessions.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: factory
      targetRevision: 0.21.0
      helm:
        releaseName: factory
        # The chart's PreSync hook is the CRDs' only applier, so ArgoCD never
        # tracks (or prunes) them (chart templates/crd-hook.yaml).
        skipCrds: true
        valueFiles:
          - $values/projects/factory/deploy/values.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # The CRD hook runs here before the chart's own Namespace is applied.
    namespace: kagent
  # The credential broker owns its grant Secret's and quota ConfigMap's data:
  # the chart declares them empty so its RBAC can name them, and the broker
  # writes the rotating grant at login and every refresh. Diffing /data would
  # let self-heal revert the grant to empty, revoking it.
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: factory
      name: factory-broker-grant-codex-primary
      jsonPointers: [/data]
    - group: ""
      kind: ConfigMap
      namespace: factory
      name: factory-broker-quota
      jsonPointers: [/data]
    # itsaplan's generated secrets, bootstrap state and agent keys, written by
    # its Jobs into Secrets the chart declares empty (itsaplan_test.py checks
    # this list covers them).
    - group: ""
      kind: Secret
      namespace: factory
      name: factory-itsaplan
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      namespace: factory
      name: factory-itsaplan-admin
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      namespace: factory
      name: factory-itsaplan-bootstrap
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      namespace: factory
      name: factory-itsaplan-agent-homelab-codex
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      namespace: factory
      name: factory-itsaplan-agent-factory-coordinator
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # kagent CRs are applied in the sync that first creates their CRDs.
      - SkipDryRunOnMissingResource=true
      # Without this a sync still applies the ignored /data above.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
