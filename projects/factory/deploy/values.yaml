# The factory home cluster's values for the factory chart
# (projects/factory/chart). The cluster has one install, so there is no
# overlay.

# kagent's database is the CNPG Cluster kagent-pg in its own namespace,
# kagent-pg (projects/platform-factory/kagent-postgres), prepared with
# kagent's setup script. Its setup Job writes the connection-string Secrets
# kagent-postgres-owner and kagent-postgres-readwrite (the chart's defaults)
# into kagent; the superuser and backup credentials stay in kagent-pg, out of
# the controller's reach.
postgres:
  mode: existing
  existing:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kagent-pg
          cnpg.io/cluster: kagent-pg
    port: 5432

# The credential broker (projects/factory/broker): relays the Codex harness's
# model calls with its own grant; GitHub minting stays off until the App's
# 1Password item exists (broker.githubApp.enabled).
broker:
  enabled: true

kagent:
  # Agents and the controller's watch: kagent's own namespace plus each
  # repository binding's.
  rbac:
    namespaces: [kagent, factory-r-homelab]
  # Every agent runtime's limits, the codex agent's size (kagent 1.0.1 sets
  # one for all Agents).
  config:
    runtimeDefaults:
      cpu: "4"
      memory: 8Gi
    # kagent reviews the connector's ServiceAccount token under this
    # authority, which is part of its principal ID: changing it loses the
    # connector's sessions.
    server:
      auth:
        serviceAccount:
          authority: factory-home

# jomcgi-org/homelab. Its namespace is also granted in Substrate's
# credentialProvider.namespacePolicies
# (projects/platform-factory/substrate/values/substrate.yaml).
repositories:
  - name: homelab
    owner: jomcgi-org
    repo: homelab
    baseBranch: main
    namespace: factory-r-homelab
    agent: codex

# itsaplan at factory-plan.jomcgi.dev, behind the edge's Authentik sign-in.
# Its database is factory-db (projects/platform-factory/factory-db), whose
# setup Job writes factory/factory-itsaplan-db; its S3 key is
# factory/factory-itsaplan-s3 and its OIDC client secret
# factory/factory-itsaplan-oidc, both from factory-buckets.
itsaplan:
  enabled: true
  database:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: factory-db
          cnpg.io/cluster: factory-db
  s3:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: garage
          app.kubernetes.io/name: garage

# The connector (projects/factory/connector) as factory/factory-connector,
# for the homelab binding. Delivery starts once broker.githubApp.enabled.
connector:
  enabled: true
  bindings:
    homelab:
      itsaplanProject: HOME
      agents: [homelab-codex]
  database:
    endpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: factory-db
          cnpg.io/cluster: factory-db
