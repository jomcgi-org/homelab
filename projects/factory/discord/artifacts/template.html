<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Title</title>
    <style>
      /* House tokens: the same palette as the Discord renderer. Keep every asset
   inline; the page cannot load fonts, scripts, styles or images. */
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2a78d6;
        --good: #1baf7a;
        --warn: #eda100;
        --bad: #e34948;
        --s1: #2a78d6;
        --s2: #eb6834;
        --s3: #1baf7a;
        --s4: #eda100;
        --radius: 12px;
        --font:
          Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --surface: #111827;
          --border: #1f2937;
          --text: #e5e7eb;
          --muted: #9ca3af;
          --accent: #3987e5;
          --s1: #3987e5;
          --s2: #d95926;
          --s3: #199e70;
          --s4: #c98500;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 var(--font);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 18px;
        margin: 32px 0 8px;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 20px;
        margin: 12px 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .stat b {
        display: block;
        font-size: 26px;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        color: var(--muted);
        font-size: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      code,
      pre {
        font-family: var(--mono);
        font-size: 14px;
      }
      pre {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
      }
      a {
        color: var(--accent);
      }
      svg .bar {
        fill: var(--s1);
      }
      svg text {
        fill: var(--muted);
        font: 12px var(--font);
      }
      footer {
        color: var(--muted);
        font-size: 13px;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Title</h1>
      <p class="lede">One sentence that says what this page shows.</p>

      <div class="stats">
        <div class="card stat"><b>42</b><span>Label</span></div>
        <div class="card stat"><b>7</b><span>Label</span></div>
      </div>

      <h2>Section</h2>
      <div class="card">
        <p>Body text.</p>
        <!-- A chart is inline SVG that uses the tokens: -->
        <svg
          viewBox="0 0 320 120"
          width="100%"
          role="img"
          aria-label="Bar chart"
        >
          <rect x="10" y="60" width="60" height="50" rx="4" class="bar" />
          <rect x="90" y="20" width="60" height="90" rx="4" class="bar" />
          <text x="40" y="54" text-anchor="middle">A</text>
          <text x="120" y="14" text-anchor="middle">B</text>
        </svg>
      </div>

      <h2>Table</h2>
      <div class="card">
        <table>
          <tr>
            <th>Item</th>
            <th>Value</th>
          </tr>
          <tr>
            <td>Row</td>
            <td class="num">1</td>
          </tr>
        </table>
      </div>

      <footer>Made by Bosun.</footer>
    </main>
  </body>
</html>
