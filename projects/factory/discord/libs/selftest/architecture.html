        <h1>Query platform architecture</h1>
        <p class="lede">
          The house design system with its pinned libraries: the icons, the
          diagram and the chart render in the browser.
        </p>
      </header>

      <section class="section">
        <figure class="figure">
          <pre class="mermaid">
flowchart LR
  UI[Client / UI] -- HTTP --> API[Query API<br>governance chokepoint]
  API --> DF[DataFusion engine]
  DF --> ICE[(Iceberg tables<br>S3 / MinIO)]
  ING[Ingest] -- Arrow → Parquet --> ICE
  subgraph CP[Control plane]
    Q[Queue + worker]
    CAT[Catalog]
    ONT[Ontology]
    ACL[ACL]
    LIN[Lineage]
  end
  CP --> PG[(Postgres)]
  API --> CAT
  API --> ONT
  API --> ACL
  API --> LIN
  DF --> CAT
  ING --> Q
  ING --> CAT
          </pre>
          <figcaption>Mermaid 12 with the ELK layout.</figcaption>
        </figure>
      </section>
