contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
  keyring:
    - https://raw.githubusercontent.com/alpinelinux/aports/7cf2a75b759dbec5160111e7fba8d74ebda22b78/main/alpine-keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
    - https://raw.githubusercontent.com/alpinelinux/aports/7cf2a75b759dbec5160111e7fba8d74ebda22b78/main/alpine-keys/alpine-devel@lists.alpinelinux.org-5261cecb.rsa.pub
  packages:
    - alpine-base
    - bash
    - ca-certificates
    - git
    - libgcc
    - libstdc++
archs:
  - x86_64
accounts:
  groups:
    - groupname: kagent
      gid: 65532
  users:
    - username: kagent
      uid: 65532
      gid: 65532
      homedir: /data
  run-as: 65532
entrypoint:
  command: /usr/local/bin/kagent-codex
work-dir: /data
environment:
  HOME: /data
  PATH: /usr/local/bin:/usr/bin:/bin
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
