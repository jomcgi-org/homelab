# This manifest is applied manually after deployment through the suspended
# seed-entities CronWorkflow, followed by backfill-entities. Submit the jobs
# with `argo submit --from cronworkflow/<name> -n monolith-workflows`; do not
# exec into a running API or jobs pod.
entities:
  - kind: project
    slug: embervm
    title: EmberVM
    aliases:
      - {name: embervm, title: true}
      - {name: noded, title: true}
      - brick
      - bricks
      - jailer
  - kind: project
    slug: firecracker-site
    title: Firecracker
    aliases:
      - {name: firecracker, title: true}
    path: projects/firecracker
  - kind: project
    slug: design-system
    title: Design System
    aliases: [design-system, impeccable, tokens]
    path: projects/design-system
  - kind: project
    slug: gke-apps
    title: GKE Apps
    aliases: []
  - kind: project
    slug: gke-cluster
    title: GKE Cluster
    aliases: [gke, spot, preemption]
  - kind: project
    slug: home-cluster
    title: Home Cluster
    aliases: []
  - kind: project
    slug: inference
    title: Inference
    aliases:
      - inference
      - qwen
      - {name: vllm, title: true}
      - {name: freetoken, title: true}
  - kind: project
    slug: mcp
    title: MCP
    aliases:
      - mcp
      - {name: context-forge, title: true}
      - muse
  - kind: project
    slug: model-bench
    title: Model Bench
    aliases: [model-bench, leaderboard]
  - kind: project
    slug: monolith
    title: Monolith
    aliases: [monolith, swarm, drainer, agent-sessions, kg]
  - kind: project
    slug: monolith-agents
    title: Monolith Agents
    aliases: [monolith-agents, agents-tier]
  - kind: project
    slug: monolith-public
    title: Monolith Public
    aliases: []
  - kind: project
    slug: operators
    title: Operators
    aliases: [operators, oci-model-cache]
  - kind: project
    slug: platform
    title: Platform
    aliases:
      - {name: argocd, title: true}
      - {name: kargo, title: true}
      - helm
      - cilium
      - otel-collector
      - observability
      - honeycomb
  - kind: project
    slug: platform-gke
    title: Platform GKE
    aliases: []
  - kind: project
    slug: sextant
    title: Sextant
    aliases:
      - {name: sextant, title: true}

  # Pseudo-project for repository-wide build and CI work. It has no projects/ directory.
  - kind: project
    slug: tooling
    title: Build and CI
    aliases:
      - ci
      - bazel
      - {name: buildbuddy, title: true}
      - {name: semgrep, title: true}
      - apko
      - gazelle

  - kind: service
    slug: context-forge-gateway
    title: Context Forge Gateway
    aliases: []
  - kind: service
    slug: embervm
    title: EmberVM
    aliases: []
  - kind: service
    slug: inference
    title: Inference
    aliases: []
  - kind: service
    slug: monolith
    title: Monolith
    aliases: []
  - kind: service
    slug: monolith-agents
    title: Monolith Agents
    aliases: []
  - kind: service
    slug: monolith-public
    title: Monolith Public
    aliases: []

  - kind: environment
    slug: homelab
    title: Homelab
    aliases: []
    scope: environment:homelab
