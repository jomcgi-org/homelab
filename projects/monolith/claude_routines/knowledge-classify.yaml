# yaml-language-server: $schema=./schema.json
name: Knowledge Classify (daily)
schedule:
  cron: "0 6 * * *"
enabled: true
model: claude-sonnet-4-6
environment: Default
sources:
  - https://github.com/jomcgi/homelab
allowed_tools: []
mcp_connectors:
  - homelab
prompt: |
  Classify Joe's unclassified knowledge gaps: route each discovered gap to
  external, internal, hybrid, or parked using his privacy rubric.

  Read and follow docs/runbooks/knowledge/classify.md from the cloned
  homelab repo.

  In short:
  1. Acquire the `knowledge.classify` lock via
     mcp__homelab__monolith-monolith-agent-acquire-lock (ttl ~600s). If held, exit.
  2. mcp__homelab__monolith-list-gaps with state "discovered" and limit 30.
     There is no server-side null-class filter, so keep ONLY the gaps whose
     returned `gap_class` field is null (already-classified gaps come back with a
     non-null class, skip them). If none are unclassified, release the lock and
     exit silently.
  3. For each unclassified gap, read its `term` and `context`, apply the rubric
     in the skill, and call mcp__homelab__monolith-set-gap-class with the chosen
     class (external, internal, hybrid, or parked). When unsure between internal
     and hybrid pick the more private; when unsure whether a term is worth
     keeping prefer parked over external.
  4. Release the lock.

  State effects to keep in mind: external leaves the gap at state discovered (the
  research routine drains it), internal and hybrid move it to in_review for Joe,
  parked is terminal. Do not research anything here, classification only. On a
  hard failure, notify once via mcp__homelab__monolith-monolith-agent-notify.
