# yaml-language-server: $schema=./schema.json
name: Knowledge Research (every 4h)
schedule:
  cron: "0 */4 * * *"
enabled: true
model: claude-sonnet-4-6
environment: Default
sources:
  - https://github.com/jomcgi/homelab
allowed_tools: []
mcp_connectors:
  - homelab
prompt: |
  Expand Joe's knowledge graph: web-research external gaps and write fileless
  atoms for the terms.

  Use the `knowledge-research` skill (read and follow
  .claude/skills/knowledge-research/SKILL.md from the cloned homelab repo).

  In short:
  1. Acquire the `knowledge.research` lock via
     mcp__homelab__monolith-monolith-agent-acquire-lock (ttl ~900s). If held, exit.
  2. mcp__homelab__monolith-list-gaps with gap_class "external",
     state "discovered,in_review", limit 15. This is a WORKLIST of terms only.
     If empty, release the lock and exit silently.
  3. Pick at most 5 (prefer `discovered`, then highest referenced_by_count).
     For each: search-knowledge to dedupe (skip if a defining atom already
     exists), disambiguate from the gap's `context`, web-research the term, then
     create ONE schema-valid atom via monolith-create-atom. Always include the
     exact gap `term` as an alias so the referencing wikilink resolves. Do NOT
     pass derived_from_raw.
  4. Release the lock.

  Critical: use ONLY create-atom. Do NOT call approve-research-gap or answer-gap
  (both are filesystem-stranded after the Obsidian decommission). Creating the
  atom does not flip the gap row to committed; that is expected. Never research
  internal/hybrid gaps. Follow the skill's schema, visibility, aliases, and
  wikilink guardrails exactly; create-atom enforces the schema server-side and
  returns an error you must correct. On a hard failure, notify via
  monolith-monolith-agent-notify.
