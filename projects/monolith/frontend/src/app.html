<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- The browser chrome paints the sheet colour of the scheme in use.
         SchemeToggle rewrites both when the reader picks a scheme by hand. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#181a20"
    />
    <!-- use-credentials: the private host sits behind Cloudflare Access,
         and a manifest fetched without the session cookie gets the login
         page instead. Same origin everywhere, so nothing leaves the host. -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        if (typeof window !== "undefined") {
          const rail = localStorage.getItem("agents-sidebar-collapsed");
          if (rail === "folded" || rail === "open") {
            document.documentElement.setAttribute("data-agents-rail", rail);
          }
        }
      } catch (e) {
        // localStorage blocked or quota exceeded; continue with automatic state
      }
    </script>
    <script>
      // A deploy replaces the hashed JS chunks. HTML cached at Cloudflare, or
      // served by an old pod mid-rollout, can still name chunks that are gone.
      // Reload once with a unique query: Cloudflare misses its cache and the
      // origin returns HTML for the current build. src/hooks.client.js calls
      // this for chunks that fail during hydration; the listener below covers
      // the entry chunks, which fail before SvelteKit starts.
      (() => {
        const chunkError =
          /dynamically imported module|Importing a module script failed/i;
        const here = new URL(location.href);
        let recovering = false;
        if (here.searchParams.has("_fresh")) {
          here.searchParams.delete("_fresh");
          history.replaceState(history.state, "", here);
        }
        window.__freshReload = (error, target = location.href, recover) => {
          if (!chunkError.test(String(error?.message ?? error))) return false;
          if (recovering) return true;
          try {
            const last = Number(sessionStorage.getItem("fresh-reload"));
            if (Date.now() - last < 30000) return false;
            sessionStorage.setItem("fresh-reload", String(Date.now()));
          } catch {
            return false; // No loop guard without storage, so no reload.
          }
          const url = new URL(target, location.href);
          const reload = () => {
            url.searchParams.set("_fresh", Date.now().toString(36));
            location.replace(url);
          };
          const session = window.__grimoireRecovery;
          if (session) {
            const from = location.href;
            // A failed save prevents a location replacement.
            if (!session.save()) return false;
            recovering = true;
            Promise.resolve()
              .then(() => recover?.(url, session) ?? false)
              .catch(() => false)
              .then(async (recovered) => {
                // Kit may unmount the failed route for its error page while
                // this runs. Its saved snapshot still applies. A different
                // user navigation, however, must not be replaced.
                if (location.href !== from && location.href !== url.href)
                  return;
                if (recovered === "cancelled") return;
                if (
                  recovered &&
                  window.__grimoireRecovery === session &&
                  (await session.restore?.()) === false
                ) {
                  // A reused component changed viewer/session/permissions.
                  // Fresh initialization must clear the old private controls.
                  reload();
                  return;
                }
                if (!recovered) {
                  if (window.__grimoireRecovery !== session || session.save())
                    reload();
                }
              })
              .finally(() => {
                recovering = false;
              });
          } else reload();
          return true;
        };
        addEventListener("unhandledrejection", (event) => {
          if (window.__freshReload(event.reason)) event.preventDefault();
        });
      })();
    </script>
    <!-- Declared in the static shell (not just the layout) so it is present at
         initial parse: the /app/* pages are ssr=false, so a layout-injected
         icon arrives after hydration and the browser has already 404'd on the
         default /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body>
    %sveltekit.body%
  </body>
</html>
