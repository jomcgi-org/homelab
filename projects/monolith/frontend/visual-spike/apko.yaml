# Chromium exec image for the hermetic visual-regression capture (ADR
# tooling/010). This is a CI-execution-only image: it is NOT a shipped runtime
# image. It is referenced by digest as the RBE exec environment
# (exec_properties.container-image) for the playwright capture action, supplying
# chromium's shared-library runtime + fonts that the default BuildBuddy RBE image
# (rbe-ubuntu22-04) lacks. Node and the chromium binary itself come from the
# hermetic Bazel toolchain / rules_playwright, not from this image.
#
# The package set is the Wolfi mapping of the exact Debian deps the spike's
# launch failure enumerated:
#   libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 libx11-6
#   libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libxcb1
#   libxkbcommon0 libasound2  (+ cups/drm/dbus/xshmfence chromium also dlopens,
#   + fontconfig and a font so text rasterizes deterministically).
#
# Wolfi is glibc-based, which matches Playwright's glibc chromium build.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - glibc
    - bash
    - coreutils
    - libstdc++
    - ca-certificates-bundle
    # chromium runtime shared libraries
    - nss
    - nspr
    - atk
    - at-spi2-atk
    - at-spi2-core
    - libx11
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxrandr
    - libxcb
    - libxkbcommon
    - alsa-lib
    - mesa-gbm
    - libdrm
    - libxshmfence
    - cups-libs
    - dbus-libs
    # fonts: deterministic text rasterization
    - fontconfig
    - font-dejavu

archs:
  - x86_64
  - aarch64

# Runs as the repo's non-root convention; chromium launches with --no-sandbox
# (set in the spike's playwright launchOptions) so it needs no elevated privs.
accounts:
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  groups:
    - groupname: nonroot
      gid: 65532
  run-as: 65532

environment:
  # Playwright/chromium write transient profile data here; keep it off a
  # read-only or tiny path.
  HOME: /tmp
