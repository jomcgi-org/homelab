apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recovery-postgres
  namespace: test-monolith
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: test-monolith-pg
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: test-monolith
      podSelector:
        matchLabels:
          app.kubernetes.io/name: monolith
          app.kubernetes.io/instance: test-monolith
          app.kubernetes.io/component: app
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: test-ember
      podSelector:
        matchLabels:
          app.kubernetes.io/name: embervm
          app.kubernetes.io/instance: test-ember
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: test-monolith
      podSelector:
        matchLabels:
          cnpg.io/cluster: test-monolith-pg
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
          app.kubernetes.io/instance: cnpg
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  - from:
