# Runtime base for the infrequent stars geospatial computation job. The Python
# interpreter and GIS wheels arrive only through the dedicated Bazel binary
# layer. This base supplies the launcher shell and CA roots, and runs as the
# repository-standard non-root uid on both supported Linux architectures.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - busybox
    - ca-certificates-bundle

archs:
  - x86_64
  - aarch64

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /tmp
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"

entrypoint:
  command: /bin/false
