apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith
  namespace: argocd
  annotations:
    # Kargo cannot modify an Application that has not opted in, so this is what
    # authorizes promotion into production. Authority flows from the resource
    # being changed rather than from the controller doing the changing, which
    # is why every other Application in the cluster is protected by the mere
    # absence of this line.
    kargo.akuity.io/authorized-stage: kargo-monolith:prod
spec:
  project: default
  sources:
    # Chart from OCI registry (pushed by CI via Bazel helm_push)
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith
      # OWNED BY KARGO AT RUNTIME, not by this line. The `canada` root app
      # needs BOTH an ignoreDifferences entry for
      # /spec/sources/0/targetRevision AND the RespectIgnoreDifferences=true
      # sync option, or Kargo's promotion is overwritten. See the chart README:
      # ignoreDifferences alone suppresses DIFFING, not APPLYING, so the field
      # survives idle reconciliation and is stamped back by the next real sync.
      #
      # bazel/helm/write-back-versions.sh still maintains this value,
      # deliberately. That is the revert lever: drop canada's entry and
      # production is handed straight back to a correct, bot-maintained value
      # with nothing to reconstruct. Retiring the write-back is the LAST step
      # of the cutover, not part of it. It is also why this line keeps moving
      # and conflicting on rebase, which is expected rather than a bug.
      targetRevision: 0.403.1
      helm:
        releaseName: monolith
        valueFiles:
          - $values/projects/monolith/deploy/values.yaml
    # Git repo for environment-specific values
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith
  # The Kyverno inject-otel-env-vars ClusterPolicy that these entries existed
  # for is GONE (kubectl get clusterpolicy inject-otel-env-vars returns
  # NotFound; only clone-monolith-workflows-secrets and
  # require-resource-requests remain). Nothing re-injects
  # OTEL_EXPORTER_OTLP_ENDPOINT or OTEL_EXPORTER_OTLP_PROTOCOL any more, so
  # ignoring them no longer hides an unavoidable mutation, it pins a dead value:
  # the live Deployment still carries
  # OTEL_EXPORTER_OTLP_ENDPOINT=signoz-otel-collector.signoz.svc.cluster.local:4317,
  # and the signoz namespace no longer exists either.
  #
  # 6d7e4ffa2 removed the matching global block from argocd-cm so the stale
  # values would be pruned, but this app-level copy survived, and being read
  # fresh every reconcile it kept winning. Dropping it lets ArgoCD prune what
  # the policy left behind, which is the point of the traces fix in this PR:
  # a stale endpoint sitting next to the real one is exactly how a
  # misconfiguration hides.
  #
  # The restartedAt annotation entry goes with them: it existed for an April
  # manual restart, and a rolled Deployment no longer carries it.
  # WINDOW: the Deployment /spec/replicas ignoreDifferences entry is removed
  # so the writer-stop (and later the GKE scale-up) actually applies; with
  # RespectIgnoreDifferences it suppressed APPLYING too. Restore the entry
  # alongside the HPA when home comes back or the GKE autoscaler arrives.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ignoreDifferences above suppresses DIFFING, not APPLYING.
      # Without this option a sync still writes the chart's version of
      # those fields, stripping the env Kyverno injects; Kyverno
      # re-injects, and the Deployment never settles. `canada` already
      # carries this option one level up so Kargo's targetRevision patch
      # on Application resources survives; the child apps declared
      # ignoreDifferences without it.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
