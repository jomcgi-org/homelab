apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith
  namespace: argocd
  annotations:
    # Kargo cannot modify an Application that has not opted in, so this is what
    # authorizes promotion into production. Authority flows from the resource
    # being changed rather than from the controller doing the changing, which
    # is why every other Application in the cluster is protected by the mere
    # absence of this line.
    kargo.akuity.io/authorized-stage: kargo-monolith:prod
spec:
  project: default
  sources:
    # Chart from OCI registry (pushed by CI via Bazel helm_push)
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith
      # OWNED BY KARGO AT RUNTIME, not by this line. The `canada` root app
      # needs BOTH an ignoreDifferences entry for
      # /spec/sources/0/targetRevision AND the RespectIgnoreDifferences=true
      # sync option, or Kargo's promotion is overwritten. See the chart README:
      # ignoreDifferences alone suppresses DIFFING, not APPLYING, so the field
      # survives idle reconciliation and is stamped back by the next real sync.
      #
      # bazel/helm/write-back-versions.sh still maintains this value,
      # deliberately. That is the revert lever: drop canada's entry and
      # production is handed straight back to a correct, bot-maintained value
      # with nothing to reconstruct. Retiring the write-back is the LAST step
      # of the cutover, not part of it. It is also why this line keeps moving
      # and conflicting on rebase, which is expected rather than a bug.
      targetRevision: 0.378.0
      helm:
        releaseName: monolith
        valueFiles:
          - $values/projects/monolith/deploy/values.yaml
    # Git repo for environment-specific values
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith
  # Kyverno's inject-otel-env-vars ClusterPolicy mutates this Deployment at
  # admission to add the otel.injected-by annotation and two env vars
  # (OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL); a stale
  # kubectl.kubernetes.io/restartedAt also lingers from an April manual restart.
  # A global resource.customizations.ignoreDifferences in argocd-cm covers these,
  # but resource.customizations are loaded at application-controller startup and
  # are not hot-reloaded, so monolith sat permanently OutOfSync (Healthy) and hid
  # genuine drift. This app-level ignoreDifferences is read fresh every reconcile,
  # so it holds regardless of when the controller last restarted. Match the global
  # block exactly: ignore only the two injected env names (charts define their own
  # OTEL_* vars, so a startswith match would manufacture a fresh diff) plus the two
  # injected/restart annotations.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[].env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
        - '.spec.template.spec.initContainers[]?.env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
      jsonPointers:
        - /spec/template/metadata/annotations/otel.injected-by
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        # The backend HPA owns the replica count (chart/templates/hpa.yaml). The
        # deployment omits spec.replicas when autoscaling is enabled, but with
        # selfHeal on ArgoCD would still revert any HPA scale-up to the default;
        # ignore /spec/replicas so the HPA holds. Mirrors the monolith-public app.
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ignoreDifferences above suppresses DIFFING, not APPLYING.
      # Without this option a sync still writes the chart's version of
      # those fields, stripping the env Kyverno injects; Kyverno
      # re-injects, and the Deployment never settles. `canada` already
      # carries this option one level up so Kargo's targetRevision patch
      # on Application resources survives; the child apps declared
      # ignoreDifferences without it.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
