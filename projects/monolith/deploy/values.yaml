backend:
  replicas: 1
  vaultApiUrl: "http://obsidian-vault.obsidian.svc.cluster.local:8000"
  clickhouseUrl: "http://chi-signoz-clickhouse-cluster-0-0.signoz.svc.cluster.local:8123"
  otelEndpoint: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318/v1/traces"
  resources:
    requests:
      memory: "3Gi"
      cpu: "10m"
    limits:
      memory: "3Gi"

frontend:
  otelCollectorUrl: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318"

postgres:
  # Two instances: a primary (-rw) plus a hot standby (-ro) for the Phase 5
  # public read-only service (ADR 004 security/004) and for availability. CNPG
  # auto-creates the -ro / -r services and streams replication.
  instances: 2
  storage:
    size: 50Gi

onepassword:
  enabled: true
  itemPath: "vaults/k8s-homelab/items/private-homepage"

clickhouse:
  onepassword:
    itemPath: "vaults/k8s-homelab/items/signoz-clickhouse"

cfIngress:
  public:
    enabled: true
    tier: public
    hostname: jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    rateLimit:
      requests: 100
      unit: Minute
  private:
    enabled: true
    tier: trusted
    hostname: private.jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    team: jomcgi
  todo:
    public:
      enabled: false
      tier: public
      hostname: todo.jomcgi.dev
      servicePort: 8000
      gateway:
        name: cloudflare-ingress
        namespace: envoy-gateway-system
      rateLimit:
        requests: 100
        unit: Minute
    admin:
      enabled: false
      tier: trusted
      hostname: todo-admin.jomcgi.dev
      servicePort: 8000
      gateway:
        name: cloudflare-ingress
        namespace: envoy-gateway-system
      team: jomcgi

knowledge:
  enabled: true
  # Obsidian + vault git-sync torn out 2026-06-15 (ADR 006). Note bodies are
  # authoritative in Postgres (knowledge.notes.content, backfilled) and raws
  # are exported to s3://knowledge-raws, so the slow per-rollout vault download
  # is gone. gitRemote cleared -> clone_vault and vault-backup no-op;
  # headlessSync.enabled is false in the chart so the obsidian sidecar is not
  # rendered. Reversible: restore gitRemote + set headlessSync.enabled: true.
  gitRemote: ""
  gaps:
    rewriteDiscardable: true

dashboards:
  cnpg-overview:
    enabled: true
    name: "CloudNativePG Overview"
    tags: "postgres,cnpg"
  monolith-red:
    enabled: true
    name: "Monolith RED Dashboard"
    tags: "monolith,red,performance,traces"

chat:
  enabled: true
  llamaCppUrl: "http://inference.inference.svc.cluster.local:8080"
  embeddingUrl: "http://inference-embeddings.inference.svc.cluster.local:8080"
  searxngUrl: "http://monolith-searxng:8080"
  changelogs:
    - name: "homelab"
      channelId: "1491186550472708117"
      githubRepo: "jomcgi/homelab"
      prompt: "professional"
      embedTitle: "Joe - Homelab"
      embedColor: "0x2ECC71"
      intervalHours: 1
      commitFilter: "^(feat)(\\(.+?\\))?!?:\\s"
      roastChance: 0.1
    - name: "colin-homelab"
      channelId: "1491186550472708117"
      githubRepo: "ColinCee/homelab"
      prompt: "professional"
      embedTitle: "Colin - Homelab"
      embedColor: "0x2ECC71"
      intervalHours: 1
      roastChance: 0.1
    - name: "loom"
      channelId: "1512815661531795618"
      githubRepo: "weave-hand/loom"
      prompt: "professional"
      embedTitle: "Loom"
      embedColor: "0x2ECC71"
      intervalHours: 1
      # No commitFilter: small 2-person repo, so report every commit (all types)
      roastChance: 0.1
  onepassword:
    itemPath: "vaults/k8s-homelab/items/discord-bot"

# Taken offline 2026-06-14 for the ADR 006 Phase 4 transition: with the
# gardener paused, the raw export / file moves can be done as a controlled
# one-off, and the gardener stays down until the CLI-based version (Phase 4a-ii)
# is ready. Dropping the token makes garden_handler() skip cleanly (it logs a
# warning and returns when CLAUDE_CODE_OAUTH_TOKEN is absent). Re-enable by
# flipping this back to true.
gardener:
  enabled: false
  onepassword:
    itemPath: "vaults/k8s-homelab/items/litellm-claude-auth"

agent:
  discord:
    defaultServerId: "1501965852042330302"
    defaultChannelId: "1501965852969402517"
    allowedChannelIds:
      - "1501965852969402517"
      - "1516663194699960382" # dr-jobs new-vacancy digest
  signoz:
    url: "http://signoz.signoz.svc.cluster.local:8080/app/signoz"
