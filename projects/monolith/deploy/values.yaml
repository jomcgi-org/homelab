backend:
  replicas: 1
  clickhouseUrl: "http://chi-signoz-clickhouse-cluster-0-0.signoz.svc.cluster.local:8123"
  otelEndpoint: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318/v1/traces"
  resources:
    requests:
      # 4Gi -> 1Gi: the old 4Gi was headroom for the in-process FA2 graph-layout
      # job that OOMKilled the API pod when heavy jobs piled up. All batch jobs
      # now run off-pod as Argo CronWorkflows (knowledge.layout carries its own
      # 4Gi request), so the API pod only serves HTTP/MCP: live baseline RSS is
      # ~250Mi, and 1Gi is ~4x headroom for request-path spikes. requests==limits
      # per the repo memory convention.
      memory: "1Gi"
      # cpu 10m -> 250m: 10m was too low for fair scheduling and made a CPU-based
      # HPA meaningless (any load reads as a huge % of 10m). No CPU limit per the
      # repo convention (avoid throttling).
      cpu: "250m"
    limits:
      memory: "1Gi"

# State the production verifier identity explicitly. The application slug owns
# the Authentik issuer path, and the trailing slash is significant.
# jwksUrl is fetched in-cluster while issuer stays the public string authentik
# mints into `iss`; see the chart values for why those two must differ.
auth:
  authentik:
    jwksUrl: "http://authentik-server.authentik.svc.cluster.local/application/o/mcp-friends/jwks/"
    issuer: "https://auth.jomcgi.dev/application/o/mcp-friends/"
    audience: "https://private.jomcgi.dev"
  jwksCacheTtlSeconds: 300

frontend:
  otelCollectorUrl: "http://signoz-k8s-infra-otel-agent.signoz.svc.cluster.local:4318"

postgres:
  # Nightly logical refresh of monolith-dev-pg, dumped from the production
  # PRIMARY (monolith-pg-rw), not the -ro replica: standby recovery conflicts
  # killed every run (see the env comment in
  # chart/templates/cnpg-dev-refresh-cronworkflow.yaml).
  # Enabled here rather than in the chart default so the chart stays inert for
  # anyone rendering it, matching how every other environment choice is made in
  # this repo. The hand-made half of its credentials (monolith-pg-dump-reader)
  # exists; the dev half is CNPG-generated.
  devRefresh:
    enabled: true
  # Two instances: a primary (-rw) plus a hot standby (-ro) for the Phase 5
  # public read-only service (ADR 004 security/004) and for availability. CNPG
  # auto-creates the -ro / -r services and streams replication.
  instances: 2
  # Host the EmberVM control-plane op-log here (ADR embervm/007), replacing its
  # node-pinned SQLite PVC. Ordering matters on first apply: the Database CR and
  # the role must exist before EmberVM's opLog.postgres.enabled flips, or the CP
  # crash-loops on {:connect_failed, ...}. Both charts are in this PR, and
  # ArgoCD syncs monolith and embervm as separate Applications, so if the CP
  # comes up first it simply restarts until the role lands.
  embervmOpLog:
    enabled: true
  storage:
    size: 50Gi
  # Barman base backups plus continuous WAL archiving to the SeaweedFS object
  # store. Written into the chart months ago and left inert, so production has
  # never had a working backup (#4714). Enabled here rather than in the chart so
  # a bare `helm template` still writes to nobody's S3.
  #
  # The monolith-pg-backups bucket was pre-created out of band and must stay
  # that way: letting the SeaweedFS chart's bucket hook create it flips the
  # whole cluster's S3 to auth-enforced.
  #
  # The path in the bucket looks doubled and is not a typo. barman appends
  # serverName, which defaults to the cluster name, so objects land under
  # s3://monolith-pg-backups/monolith-pg/monolith-pg/wals/. destinationPath is
  # a root that several clusters could share, not a path to one catalogue.
  #
  # Scope, so nobody mistakes this for DR: SeaweedFS is backed by the same
  # Longhorn layer as the Postgres PVCs, so this covers logical loss (a bad
  # migration, a dropped table, corruption of the Pg volumes) and NOT the loss
  # of the cluster. Off-cluster DR is a separate follow-up.
  backup:
    enabled: true

onepassword:
  enabled: true
  itemPath: "vaults/k8s-homelab/items/private-homepage"

clickhouse:
  onepassword:
    itemPath: "vaults/k8s-homelab/items/signoz-clickhouse"

# Sign /img imgproxy URLs for grimoire reader illustrations; same 1Password
# item as monolith-public so signatures validate against the shared imgproxy.
imgproxySigning:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/trips-imgproxy-signing"

cfIngress:
  public:
    # Phase 5e cutover (ADR 004): jomcgi.dev is now served by the isolated
    # monolith-public service. Disabled here so the old monolith pod stops
    # claiming the public hostname. Re-enable to roll back the cutover.
    enabled: false
    tier: public
    hostname: jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    rateLimit:
      requests: 100
      unit: Minute
  private:
    enabled: true
    tier: trusted
    hostname: private.jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    team: jomcgi
  # The moving planner on friends.jomcgi.dev/moving, gated to the authentik
  # `family` group (ADR security/006). Production only: the chart default is
  # disabled so dev does not claim this hostname.
  #
  # This hostname has NO Cloudflare Access application in front of it, so the
  # SecurityPolicy in templates/httproute-friends.yaml is the only thing
  # between /moving and the internet. A SecurityPolicy is a separate object
  # from the route it targets, so confirm the DENY path against the live URL
  # after this deploys rather than inferring it from the manifest:
  #
  #   1. logged out            -> redirect to authentik, never a 200
  #   2. authenticated, not in `family` -> 403
  #   3. in `family`           -> the page renders
  #   4. https://friends.jomcgi.dev/preview/ still works, and every other
  #      path on this hostname still 404s
  friends:
    enabled: true
    authentik:
      onepassword:
        itemPath: vaults/k8s-homelab/items/moving-oidc

knowledge:
  enabled: true
  # Obsidian fully decommissioned (ADR 006). Note bodies are authoritative in
  # Postgres (knowledge.notes.content); raws live in SeaweedFS. The note
  # read/write paths are DB-only and the /vault disk dependency is gone, so
  # there is no sidecar, no vault volume, and no git-sync backup left to wire.
  gaps:
    rewriteDiscardable: true

dashboards:
