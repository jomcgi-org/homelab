# flipping this back to true.
gardener:
  enabled: false
  onepassword:
    itemPath: "vaults/k8s-homelab/items/litellm-claude-auth"

# Grimoire D&D ingest pipeline (private tier only; spec
# docs/plans/2026-07-02-grimoire-pg-first-spec.md). Enabled here so the two
# daily jobs register. The v2 production re-extraction runs on DeepSeek V4 Flash
# via OpenRouter (spec #5): cheap, fast, honors json_schema, reasoning disabled
# per call. OPENROUTER_API_KEY comes from the "goosecracker" Secret, cloned into
# monolith-workflows by the Kyverno clone-openrouter policy. To iterate cheaply
# on a fresh book instead, set extractModel/extractBaseUrl to the in-cluster Qwen
# vLLM (free, keyless): "qwen3.6-27b" +
# "http://inference.inference.svc.cluster.local:8080/v1/chat/completions".
grimoire:
  enabled: true
  s3Bucket: "grimoire"
  # Production default: direct DeepSeek (first-party, native precision, no fp4
  # quantization, prompt cache preserved). Model id is the bare DeepSeek id (not
  # the "deepseek/" OpenRouter-namespaced form). Key comes from the goosecracker
  # DEEPSEEK_API_KEY field via GRIMOIRE_EXTRACT_API_KEY (cronworkflows template).
  extractModel: "deepseek-v4-flash"
  extractBaseUrl: "https://api.deepseek.com/chat/completions"
  # No extractProvider: provider routing is an OpenRouter-only concept and does
  # not apply to the direct DeepSeek API. (The code feature stays for a future
  # OpenRouter run: set extractProvider + repoint base_url/model.)
  # DeepSeek allows very high concurrency (thousands); 64 is a safe default the
  # client backs off from on 429. A run can override higher. (Code default 6 was
  # tuned for the local GPU's 8 decode slots, irrelevant for a hosted provider.)
  extractConcurrency: "64"

# ADR 036 orchestrator brief compiler (Phase 3 live enable). The primary planner
# is NVIDIA Nemotron 3 Ultra (free, 256K context, orchestrator-tuned tool calling;
# ORCHESTRATOR_API_KEY sourced from the NVIDIA_API_KEY field of the existing
# "goosecracker" Secret). NVIDIA's free tier is ~40 RPM per key, so on a rate
# limit or error the ordered chain degrades to DeepSeek on OpenRouter (the proven
# forced-tool-call path), then to always-available in-cluster Qwen, before failing
# open to direct submit. All keys reuse the same "goosecracker" Secret. The
# orchestrator only runs on channels with the ADR 029 "orchestrator" consent
# grant; ungranted channels fail open to direct submit with no external traffic.
orchestrator:
  enabled: true
  model: "nvidia/nemotron-3-ultra-550b-a55b"
  baseUrl: "https://integrate.api.nvidia.com/v1"
  apiKeySecretKey: "NVIDIA_API_KEY"
  # snake_case keys: this list is serialized verbatim to the ORCHESTRATOR_FALLBACKS
  # JSON that the Python client parses (model, base_url, api_key_env).
  fallbacks:
    - model: "deepseek/deepseek-v4-flash"
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
    - model: "qwen3.6-27b"
      base_url: "http://inference.inference.svc.cluster.local:8080/v1"
      api_key_env: ""

# WhatsApp channel gateway (ADR 039). Left disabled: Joe flips enabled to true in
# a follow-up commit after pairing the throwaway bot number via the notify flow
# (Phase 1 gate). botNumber, groupJids, and alertChannelId are filled in at that
# point. The whatsmeow session reuses the monolith CNPG cluster under a dedicated
# `whatsapp` schema.
whatsapp:
  enabled: false
  onepassword:
    itemPath: "vaults/k8s-homelab/items/whatsapp"
  botNumber: ""
  groupJids: ""
  alertChannelId: ""
  # Monolith backend inbound endpoint (release "monolith", service "monolith").
  # The WHATSAPP_INBOUND_TOKEN field of the 1Password "whatsapp" item authorizes
  # the forward; populate it before enabling the gateway.
  monolithInboundUrl: "http://monolith.monolith.svc.cluster.local:8000/internal/whatsapp/inbound"

agent:
