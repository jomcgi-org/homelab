# FaaS zip-lane function registry (ADR 045 / embervm R1). The read base matches
# the CRD samples' codeUri host (projects/embervm/crd/samples/workload-echo-fn.yaml)
# so storage.code_uri() and noded resolve archives at the same URL. S3 write
# endpoint/creds are the shared SeaweedFS ones (stars block).
faas:
  s3ReadBase: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
  s3Bucket: "faas"

semgrep:
  # EmberVM serves the per-PR Semgrep diff scan and Python sandbox.
  embervmUrl: "http://embervm-embervm.embervm.svc.cluster.local:8080"
  # Route B shadow project (Route B vs SMS comparison): self-hosted scans report
  # here instead of jomcgi/homelab, so they land in a separate Semgrep project.
  # UNSET this single value at cutover to report to the real project.
  # CUT OVER 2026-07-11: Route B now reports to the REAL jomcgi/homelab project
  # (empty -> report.py _reported_repository returns the real repo). The shadow
  # project recorded scan findingsCounts but the App's "See findings" view is
  # gated on a GitHub SCM integration a synthetic shadow repo cannot have, so
  # findings never showed. The connected real project indexes them (Route B vs SMS
  # distinguishable by scan environment "homelab-fc-invoke"). Re-set to
  # "jomcgi/homelab-selfhosted" to revert to the shadow.
  shadowProject: ""
  # Semgrep AppSec Platform token for the Route B CI-reporting relay. The vault
  # item exposes the field SEMGREP_API_TOKEN, mirrored into the
  # monolith-semgrep-app Secret and injected as the SEMGREP_APP_TOKEN env var
  # (the name pysemgrep reads).
  onepassword:
    itemPath: "vaults/k8s-homelab/items/semgrep-mcp"

# Shared LLM provider keys, in the OnePasswordItem-backed `goosecracker` Secret.
# The NAME is historical: this Secret long outlived the retired goosecracker
# agent and now carries OPENROUTER_API_KEY, CEREBRAS_API_KEY, NVIDIA_API_KEY and
# DEEPSEEK_API_KEY for the ADR 036 orchestrator, Grimoire extraction, and the
# provider fallbacks. Do NOT delete it with the rest of goosecracker.
#
# The backing 1Password item was renamed goosecracker -> embervm-agent-secrets.
# itemPath resolves by TITLE, so the old path breaks on the operator's next
# reconcile; the existing Ready=True only reflects the last successful sync. The
# Kubernetes Secret keeps its name so no consumer has to change.
goosecracker:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/embervm-agent-secrets"

# Graph layer (ADR agents/038): the first working example of composing agent
# sessions into a durable DBOS workflow (implement, then review, across two
# sessions). Enabled here because the chart default is false and a chart default
# never arms anything in prod.
#
# Deliberately stops short of merging. ADR 027's implementer/reviewer gate is
# still Draft and `agent-review/gate` does not exist in code, so nothing
# autonomous may land on main yet; the merge queue is declared at concurrency 1
# and left unused until it does.
swarm:
  enabled: true

# Taken offline 2026-06-14 for the ADR 006 Phase 4 transition: with the
# gardener paused, the raw export / file moves can be done as a controlled
# one-off, and the gardener stays down until the CLI-based version (Phase 4a-ii)
# is ready. Dropping the token makes garden_handler() skip cleanly (it logs a
# warning and returns when CLAUDE_CODE_OAUTH_TOKEN is absent). Re-enable by
# flipping this back to true.
gardener:
  enabled: false
  onepassword:
    itemPath: "vaults/k8s-homelab/items/litellm-claude-auth"

# Grimoire D&D ingest pipeline (private tier only; spec
# the grimoire pg-first design). Enabled here so the two
# daily jobs register. The v2 production re-extraction runs on DeepSeek V4 Flash
# via OpenRouter (spec #5): cheap, fast, honors json_schema, reasoning disabled
# per call. OPENROUTER_API_KEY comes from the "goosecracker" Secret, cloned into
# monolith-workflows by the Kyverno clone-openrouter policy. To iterate cheaply
# on a fresh book instead, set extractModel/extractBaseUrl to the in-cluster Qwen
# vLLM (free, keyless): "qwen3.6-27b" +
# "http://inference.inference.svc.cluster.local:8080/v1/chat/completions".
grimoire:
  enabled: true
  s3Bucket: "grimoire"
  # Production default: direct DeepSeek (first-party, native precision, no fp4
  # quantization, prompt cache preserved). Model id is the bare DeepSeek id (not
  # the "deepseek/" OpenRouter-namespaced form). Key comes from the goosecracker
  # DEEPSEEK_API_KEY field via GRIMOIRE_EXTRACT_API_KEY (cronworkflows template).
  extractModel: "deepseek-v4-flash"
  extractBaseUrl: "https://api.deepseek.com/chat/completions"
  # No extractProvider: provider routing is an OpenRouter-only concept and does
  # not apply to the direct DeepSeek API. (The code feature stays for a future
  # OpenRouter run: set extractProvider + repoint base_url/model.)
  # DeepSeek allows very high concurrency (thousands); 64 is a safe default the
  # client backs off from on 429. A run can override higher. (Code default 6 was
  # tuned for the local GPU's 8 decode slots, irrelevant for a hosted provider.)
  extractConcurrency: "64"

# ADR 036 orchestrator brief compiler (Phase 3 live enable). The primary planner
# is NVIDIA Nemotron 3 Ultra (free, 256K context, orchestrator-tuned tool calling;
# ORCHESTRATOR_API_KEY sourced from the NVIDIA_API_KEY field of the existing
# "goosecracker" Secret). NVIDIA's free tier is ~40 RPM per key, so on a rate
# limit or error the ordered chain degrades to DeepSeek on OpenRouter (the proven
# forced-tool-call path), then to always-available in-cluster Qwen, before failing
# open to direct submit. All keys reuse the same "goosecracker" Secret. The
# orchestrator only runs on channels with the ADR 029 "orchestrator" consent
# grant; ungranted channels fail open to direct submit with no external traffic.
orchestrator:
  enabled: true
  model: "nvidia/nemotron-3-ultra-550b-a55b"
  baseUrl: "https://integrate.api.nvidia.com/v1"
  apiKeySecretKey: "NVIDIA_API_KEY"
  # snake_case keys: this list is serialized verbatim to the ORCHESTRATOR_FALLBACKS
  # JSON that the Python client parses (model, base_url, api_key_env).
  fallbacks:
    - model: "deepseek/deepseek-v4-flash"
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
    - model: "qwen3.6-27b"
      base_url: "http://inference.inference.svc.cluster.local:8080/v1"
      api_key_env: ""

# WhatsApp channel gateway (ADR 039). Left disabled: Joe flips enabled to true in
# a follow-up commit after pairing the throwaway bot number via the notify flow
# (Phase 1 gate). botNumber, groupJids, and alertChannelId are filled in at that
# point. The whatsmeow session reuses the monolith CNPG cluster under a dedicated
# `whatsapp` schema.
whatsapp:
  enabled: true
  # Heavy-agent path ON: charts/artifacts/full tasks dispatch the household goose
  # agent (recipe=agent, tier=household, DeepSeek). Charts come back as an artifact
  # URL (deliverable as text), sidestepping the text-only outbox media limit.
  agentEnabled: true
  # Household content model (in-monolith concierge reply + WhatsApp chat agent).
  # DeepSeek V4 Flash on OpenRouter; the goose guest model is in
  # goosecracker.tiers.household.
  model: "deepseek/deepseek-v4-flash"
  onepassword:
    itemPath: "vaults/k8s-homelab/items/whatsapp"
  # PII stays out of git:
  #   - botNumber lives in the "whatsapp" 1Password item (WHATSAPP_BOT_NUMBER field),
  #     mirrored into the monolith-whatsapp Secret and read by secretKeyRef.
  #   - group JIDs (which embed a phone number) live in chat.whatsapp_group; the
  #     gateway loads its allow-list from there and refreshes on a ticker. Insert a
  #     row per household group (tier=household, ambient=true). The gateway logs the
  #     JID of any message from a not-yet-registered group so it can be discovered.
  # alertChannelId is a Discord channel id (not personal data): where the pairing
  # code and logout/ban alerts are posted.
  alertChannelId: "1501965852969402517"
  # Monolith backend inbound endpoint (release "monolith", service "monolith").
  # The WHATSAPP_INBOUND_TOKEN field of the 1Password "whatsapp" item authorizes
  # the forward; populate it before enabling the gateway.
  monolithInboundUrl: "http://monolith.monolith.svc.cluster.local:8000/internal/whatsapp/inbound"

agent:
  discord:
    defaultServerId: "1501965852042330302"
    defaultChannelId: "1501965852969402517"
    # Agent-session turn notifications land here instead of the default channel.
    # Sessions notify on every terminal turn (they are voice-driven), so probing
    # the lane would otherwise ring the same bell as real alerts.
    agentSessionsChannelId: "1533337680463663254"
    # Owner allowlist for /goosecracker (ADR 024 Task 4) is OWNER_DISCORD_USER_ID,
    # synced from the discord-bot 1Password item into monolith-chat-secrets and
    # sourced via secretKeyRef in the deployment (not a plain value here).
  signoz:
    url: "http://signoz.signoz.svc.cluster.local:8080/app/signoz"

# EmberVM R4 scale-to-zero scratch-postgres (ADR embervm/001, D-R4.PR-11.1).
# DISABLED 2026-08 alongside the embervm Workload CR (its only real consumer,
# the loom deployment, is decommissioned): SCRATCH_POSTGRES_DSN is unrendered,
# so run_code python runs get no scratch DB env and the sandbox client leaves
# the feature off. demoListenPort keeps DEMO_POSTGRES_DSN and the password
# Secret alive for the demos page exhibit. Flip enabled back on (with the
# embervm side) to restore the tenant datastore.
scratchPostgres:
  enabled: false
  # Renders DEMO_POSTGRES_DSN for the firecracker demos page's sleep/wake
  # exhibit (matches the embervm chart's demoPostgres.listenPort).
  # COUPLING (#4198): the demo workload itself is gated on demoPostgres.enabled
  # in projects/embervm/deploy/values.yaml and nothing cross-checks the two. If
  # the embervm side disables the demo, clear this to "" in the same change, or
  # the DSN points at a nonexistent workload and the synthetic probe latches
  # red (503 /api/health).
  demoListenPort: 5401
  onepassword:
    itemPath: "vaults/k8s-homelab/items/scratch-postgres"

# Arm the API ingress allowlist (issue #4628, policy added inert in PR #4640).
#
# This is the opt-in the gated template was waiting for, so unlike the PR that
# added it, this one DOES take effect: the CiliumNetworkPolicy renders and the
# app pod becomes default-deny for every source the allowlist does not name.
# The allowlist lives in chart/templates/cilium-ingress-policy.yaml, which
# carries the provenance of each entry.
#
# Evidence the allowlist is complete, gathered before flipping this:
#   - a repo-wide config audit of everything that dials the monolith service
#   - an independent second audit that found no missing entry
#   - a 65-minute `hubble observe` window, 151264 flows, whose complete set of
#     pod sources into the app pod was exactly envoy-gateway-system (3000,
#     8000), mcp (8000) and monolith-workflows (8000), plus the host entity for
#     kubelet probes. No world, remote-node or kube-apiserver source appeared,
#     which is why no extra fromEntities are needed.
#
# Two entries are allowlisted from config but were NOT observed in that window,
# deliberately: embervm -> 8091 (no agent session ran) and the whatsapp gateway
# -> 8000 (no inbound message). Absence of traffic is not evidence they are
# wrong, and dropping them would break those paths the next time they run.
#
# If something was still missed it fails as a SILENT dial timeout, not a
# readable deny (PR #4294). First check on any post-merge weirdness:
#   kubectl -n kube-system exec <cilium-pod> -c cilium-agent -- \
#     cilium-dbg monitor --type drop
ciliumPolicy:
  ingress:
    enabled: true

# cd health chart-lag coverage (#4890): every Kargo-managed production app, so
# embervm's lag is visible next to monolith's instead of invisible (#4884).
# Entries mirror projects/platform/kargo/values.yaml promotion.pipelines: app
# is the pipeline's prod Stage application, kargo_namespace its project,
# chart_repo_suffix picks its chart out of Freight repoURLs. The clock stays
# "oldest unpromoted Freight" per app and the component stays advisory: it
# pages nobody. Adding a Kargo pipeline means adding an entry here.
cdHealth:
  apps:
    - app: monolith
      kargo_namespace: kargo-monolith
      chart_repo_suffix: /charts/monolith
    - app: embervm
      kargo_namespace: kargo-embervm
      chart_repo_suffix: /charts/embervm
