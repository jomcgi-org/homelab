# GKE cutover destination. Keep application workloads dormant until cutover;
# CNPG stays up for data staging and bootstraps by recovery from the
# off-cluster GCS Barman object store. Consumed by the gke-apps Applications.
backend:
  # WINDOW: GKE serving. Autoscaling stays off until an HPA (and its
  # ignoreDifferences companion) is deliberately reintroduced.
  replicas: 2
  autoscaling:
    enabled: false

tokenBroker:
  spiffe:
    enabled: false

swarm:
  # Make the bounded reconciler available on the existing GKE stack. Durable
  # operator policy separately controls issue admission and starts disabled.
  factoryEnabled: true
  # Exact operator requests and original deadlines retain the existing task
  # bounds. Capacity is released only after durable guest cessation proof.
  factoryReservationReviewEnabled: true
  factoryConductorFundingEnabled: true
  factoryAutonomousContinuationEnabled: true
  factoryStopSupervisionEnabled: true
  # Repository-staged for #6266. Live brick-roll, restart, and uncertain DELETE
  # checks must pass before this hub behavior is enabled.
  factoryTransientStopRetryEnabled: false
  # Settle attempts lost between "invoke sent" and "guest bound" (#6025):
  # the template landed one PR earlier; this is the behaviour flip.
  factoryLostBeforeGuestSettlementEnabled: true
  # Recover aged reservations only after the locked no-session proof. The
  # missing-workflow path also fences delayed creators (#6382); ordinary
  # retry and funding policy decide what can run after settlement.
  factoryLostBeforeSessionSweepEnabled: true
  # Release a lane slot held past its deadline by a start no cessation proof
  # can settle (#6025): the template landed in #6156, this is the behaviour
  # flip. Measured, not assumed. On 2026-09-14 four delivery slots were held
  # for thirty hours in this exact shape and only a manual release at 19:03
  # on 09-15 cleared them. The absence proof that shipped in the same PR does
  # not cover it: a torn-down guest answers 200 "destroyed" until op-log
  # compaction seven days later, so the 404 that proof keys on is nearly
  # unreachable inside the backstop window, and both incidents instead failed
  # observation with a transport error, which it deliberately excludes.
  # Confirmed again after #6156 rolled out at 02:47 on 09-16: receipts 424,
  # 429 and 430 sat uncertain with nothing running and the proof did not
  # release any of them in the following forty minutes.
  #
  # This is the only path that frees such a slot. It settles the stranded
  # starts and their capacity permits and escalates the task, never
  # interrupting a start that is still reserved.
  factoryDeadlineBackstopEnabled: true
  # Retire escalation cards their own issue has already answered (#6164): the
  # template landed one PR earlier, this is the behaviour flip. A sweep on
  # 2026-09-15 found 47 of 103 open cards stale, most of them because a card
  # snapshots its issue at admission and never re-reads it, so an operator
  # decision written into the issue body was invisible to the card still
  # asking the question. Revalidation paces itself at 15 minutes and makes no
  # GitHub call while this is false.
  factoryEscalationRevalidationEnabled: true
  # Stop an attempt at its cost ceiling rather than judging it afterwards
  # (#6169): the template landed one PR earlier, this is the behaviour flip.
  # max_cost_usd was a post-mortem verdict, so a node ran to completion, the
  # money was spent, and the result was then discarded as failed: three nodes
  # on one task spent $14.44 and delivered nothing, one of them 34 percent
  # over its $4 ceiling. An overrunning node is failed either way, so stopping
  # at the ceiling discards nothing that is currently kept. Only
  # provider-measured spend can trigger it; a list price is an estimate.
  factoryEnforceCostCeilingEnabled: true
  # Per-class floors on remaining quota percent (#5974). A floor only bites
  # for a role whose stored factory policy carries a model_pools entry with
  # somewhere to spill to; a single-member pool never consults quota. The
  # intended pools are conductor [opus, sol], worker and implement
  # [spark, sol, astra] (Muse first, escalating one step per failed attempt
  # or changes-requested review), and reviewer [opus, astra]. The policy
  # itself is applied by the operator through the factory control surface,
  # not by this chart. Floors are keyed by role (model_pool.floor_for), so
  # each covers exactly one role. codex.worker covers the worker role:
  # planned non-implement work nodes the planner left to policy, and
  # escalation of investigate_ nodes. codex.implement covers the implement
  # role: planned implement nodes, correction rounds, and escalation of
  # implement_, integrate_ and correct_ nodes. Both spill from sol below 10
  # percent Codex remaining. claude.conductor covers the planner, which
  # spills from opus to sol below 25 percent Claude remaining, so planning
  # never starves Claude review, which pauses at 85 percent used. The
  # reviewer and refine roles carry no floor.
  quotaFloors:
    codex:
      worker: 10
      implement: 10
    claude:
      conductor: 25

agents:
  sessions:
    # Release failed probe holds after exact guest eviction is confirmed.
    probeSupervisionEnabled: true
    # Settle uncertain permits from control-plane cessation evidence for the
    # kg, project and interactive tiers too, and let the factory accept an
    # already-evicted guest as proof (#5979). Flipped 2026-09-10 after the
    # template deployed on 0.477.3.
    uncertainPermitSupervisionEnabled: true
    # Preserve native results before their synchronous response is delivered.
    resultReceiptsEnabled: true
    responseLostRecoveryEnabled: true
    resultReceiptAdoptionEnabled: true

postgres:
  storage:
    storageClass: standard-rwo
  # SPIRE server datastore role and database on monolith-pg (ADR embervm/041,
  # #5706 phase 1). Hub only: the on-prem cluster gets SPIRE later. Requires the
  # out-of-band monolith-pg-spire basic-auth Secret, see deploy/spire-db-secret.md.
  spire:
    enabled: true
  # The hub has no monolith-dev-pg (no dev lane on GKE), so the nightly
  # refresh dumped into nothing, hung on its 1h activeDeadlineSeconds and
  # failed every day (cnpg-dev-refresh-1788580800, 2026-09-05). Off until a
  # dev lane exists here.
  devRefresh:
    enabled: false
  bootstrap:
    recovery:
      # CNPG 1.30 behavior: The recovery-minted app Secret password overwrites
      # the restored owner role after recovery completes. No manual ALTER ROLE
      # step is required.
      source: monolith-pg
      database: monolith
      owner: app
  # backup stays ENABLED (inherited from deploy/values.yaml): the distinct
  # serverName gives the GKE cluster its own archive prefix, so it never
  # trips CNPG's empty-archive check against the prefix the home cluster is
  # live-archiving into.
  # backup stays ENABLED with the distinct serverName now the pin carries the
  # serverName template: the GKE cluster archives to its own prefix.
  backup:
    serverName: monolith-pg-gke
  externalClusters:
    - name: monolith-pg
      barmanObjectStore:
        destinationPath: "gs://h0melab-cnpg-backups/monolith-pg/"
        googleCredentials:
          applicationCredentials:
            name: monolith-pg-backup-gcs
            key: service-account-key.json
        wal:
          compression: gzip

chat:
  llamaCppUrl: "https://api.meta.ai"
  movingChatInferenceUrl: "https://api.meta.ai"
  embeddingUrl: "http://inference-embeddings.inference.svc.cluster.local:8080"

# Kubernetes NetworkPolicy has no additive audit mode. Keep the native app
# egress policy off until GKE network-policy logs cover a representative live
# window, including periodic leader jobs and the secret-backed ICAL feed.
# Populate the API and DNS addresses from the live hub in the enabling change;
# the addresses in the inactive recovery profile are revalidation hints only.
networkPolicy:
  egress:
    enabled: false
    apiServerCidrs: []
    dnsServiceCidrs: []

# Cilium CRDs are not installed on GKE. Keep those resources disabled; the
# native NetworkPolicy arm above is staged but does not enforce on the hub.
ciliumPolicy:
  tokenReplayDeny:
    enabled: false
  ingress:
    enabled: false
  egress:
    enabled: false

whatsapp:
  # This singleton holds an external WhatsApp session and must not connect from
  # the cutover destination while the home deployment is active.
  enabled: false

# Expose the API port on the tailnet through the Tailscale operator (#5527,
# ADR agents/063 amendment). GKE only: the operator runs here, not on k3s.
tailnet:
  enabled: true
