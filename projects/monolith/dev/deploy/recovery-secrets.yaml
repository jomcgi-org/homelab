# Inactive, fixed recovery namespaces. See recovery-network.md before applying.
# The item must contain username=embervm and a nonempty password. Values stay
# in 1Password; the Operator copies the type and labels onto the new Secret.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: monolith-dev-pg-embervm-oplog
  namespace: monolith-dev
  labels:
    cnpg.io/reload: ""
type: kubernetes.io/basic-auth
spec:
  itemPath: vaults/k8s-homelab/items/embervm-recovery-oplog-db
---
# The Ember chart already owns the other namespace's op-log Secret and the
# noded, registry and broker-grant resources. Only its app-password is missing.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: embervm-authentik-recovery-agent
  namespace: embervm-dev
type: Opaque
spec:
  itemPath: vaults/k8s-homelab/items/embervm-authentik-recovery-agent
