# Dev overlay for the monolith chart.
#
# This file is applied AFTER projects/monolith/deploy/values.yaml, so it is a
# diff against production rather than a second configuration. Keep it that way.
#
# WHAT BELONGS HERE: identity (which cluster, which hostname), sizing, and
# disables for behaviour that is actively harmful to run twice.
#
# WHAT DOES NOT: turning features off to make dev "smaller". Disabling chat,
# whatsapp, marine or semgrep would make dev render DIFFERENT templates from
# production, at which point dev stops rehearsing what you are about to promote
# and becomes its own configuration with its own bugs. The leaderSingletons
# switch below already stops every side effect those features would produce,
# while leaving their routes and migrations identical to prod.
#
# MODELS ARE THE ONE DELIBERATE EXCEPTION, and this paragraph used to promise
# the opposite. Dev points every model at the in-cluster Qwen so that
# exercising it costs nothing: the point of dev is running synthetics and
# poking at behaviour without spending on a metered or subscription provider.
# This is a values choice, not a guard. Nothing rejects a paid model here, so
# a NEW model-consuming feature has to be pointed at the free lane in this
# file too, or dev will quietly inherit production's provider. See issue #4859
# for the console's offered list, which is still a bundle literal and so is
# NOT covered by anything in this file.

backend:
  # THE side-effect mute. One switch covers all five leader singletons (Discord
  # bot, chat outbox drain, DBOS swarm runtime, AIS ingest, cd probe writer).
  # This is the single most important line in this file: the nightly refresh
  # imports production's queue tables, so without it dev would repost prod's
  # Discord backlog and resume prod's in-flight agent runs.
  #
  # It is not the only barrier. The refresh also drops the dbos schema and
  # truncates the outboxes, so the data holds nothing actionable either.
  leaderSingletons: false

# INGRESS: ONE hostname, both surfaces, authentik in front.
#
# dev.jomcgi.dev is dev's OWN hostname, so this claims nothing production owns.
# That is the only reason enabling it is safe: the guard in
# chart/chart_env_identity_test.py checks the environments claim DISJOINT
# hostnames, not that dev claims none, precisely so turning this on cannot
# quietly disarm the check that caught dev claiming private.jomcgi.dev.
#
# One route serves BOTH surfaces. The private route has a `/` catch-all and the
# chart applies no path rewrites anywhere, so /public/* and /private/* both
# reach the app unmodified and the SvelteKit bundle carries both route groups.
# Production splits them across two hostnames and two Applications only because
# jomcgi.dev is a public origin; dev has no public audience to separate from.
#
# auth: authentik, NOT cloudflare, and this is the load-bearing line. Cloudflare
# Access consumes the Authorization header at the edge, so an agent's bearer
# token cannot survive it. Access would gate this fine for a browser and lock
# every agent out, which is the opposite of what this environment is for.
#
# `tier: trusted` is inherited from production and left alone: it is the
# cloudflared/gateway routing tier, not the auth mechanism.
cfIngress:
  private:
    enabled: true
    hostname: dev.jomcgi.dev
    auth: authentik
    # No unauthenticated path on this host. GitHub delivers to production, and
    # this route deliberately has no SecurityPolicy, so on dev it would be an
    # open endpoint behind an otherwise authentik-gated hostname.
    githubWebhook:
      enabled: false
  # Production's legacy ships.jomcgi.dev redirect. Nothing to do with dev, and
  # claiming it would be a collision.
  shipsRedirect:
    enabled: false

postgres:
  # One instance. Dev has no availability requirement, and the cluster is not
  # roomy: node-1 sits at 91% of requestable memory.
  instances: 1
  # Production owns the refresh. Inherited as true from prod's values, and it
  # MUST be overridden here: the CronWorkflow renders into jobs.workflowNamespace
  # rather than the release namespace, so leaving it on would put a second,
  # identically-named CronWorkflow into monolith-workflows and the two
  # Applications would fight over it on every sync.
  devRefresh:
    enabled: false
  # Dev takes no backups. Inherited as true from production's values otherwise,
  # and nothing would error.
  #
  # Not a correctness problem, despite an earlier version of this comment
  # claiming dev's retention would prune production's backups. barman
  # namespaces each cluster under destinationPath by serverName, which defaults
  # to the cluster name, so dev would write to .../monolith-dev-pg/ rather than
  # into production's catalogue.
  #
  # It is a waste and an exposure problem. Dev is reseeded from production
  # nightly, so this would store a second copy of production's rows: roughly
  # 1.5 GB of base backup a day, held 14 days, in a bucket with no S3
  # identities configured and no NetworkPolicy in front of it (#4708).
  # chart_env_identity_test asserts dev renders no object store.
  backup:
    enabled: false

# The WhatsApp bridge holds a REAL external identity: it starts with
# bot_number +12369923104, the production account, and a second bridge would
# contend for that one WhatsApp session.
#
# This is off for the same reason leaderSingletons is, and it is here because
# that switch does NOT cover it. The five leader-elected singletons are one
# mechanism; this is a separate Deployment that inherited straight through. The
# rule is not "disable the leader singletons", it is "disable anything holding
# an external identity", and that set spans more than one mechanism.
#
# Not an exception to keeping dev identical to prod: an external account is
# identity, and dev must not claim production's.
whatsapp:
  enabled: false

# EmberVM: dev talks to the DEV control plane, not production's.
#
# These inherited production's URLs, so monolith-dev was calling
# embervm-embervm.embervm on every agent page load and getting:
#
#   403 Forbidden /v1/workloads/claude-runtime/sessions
#   {"error":"service account not permitted","retryable":false}
#
# which surfaced in the console as "unable to load session". The 403 is the
# ingress allowlist working exactly as intended (#4628: a NEW caller is a
# silent deny), so the defect was the URL, not the guard. Dev was asking
# production's fleet for production's sessions and being told no.
#
# Same rule as whatsapp above and for the same reason: dev must not claim
# production's identity or reach into production's state. An agent session is
# both, since it is a real VM holding a real workload slot against
# session.maxSessions.
#
# embervm-dev has been its own deployment since #4856 with the same service
# shape, so this is a hostname swap and nothing more.
semgrep:
  embervmUrl: "http://embervm-dev-embervm.embervm-dev.svc.cluster.local:8080"

tokenBroker:
  url: "http://embervm-dev-embervm-tokenbroker.embervm-dev.svc.cluster.local:8080"

# NO Argo CronWorkflows in dev, and this is the third identity collision this
# overlay has had to close.
#
# cronworkflows.yaml names each job `{{ .name }}` with NO release prefix, and
# renders them into jobs.workflowNamespace (monolith-workflows) rather than the
# release namespace. So dev and production render IDENTICALLY NAMED objects into
# ONE namespace, and dev's Application took ownership of production's scheduled
# jobs: campsites-refresh in monolith-workflows came back labelled
# app.kubernetes.io/instance: monolith-dev.
#
# Their DATABASE_URL is jobs.dbSecretName, the Kyverno-cloned PRODUCTION
# credential, so these run against production's database with whatever image
# dev's chart version pins.
#
# Blanking jobs.image rather than emptying jobs.cronWorkflows, deliberately.
# The list also drives ARGO_JOBS on the backend, which is what makes the app
# SKIP registering these jobs in-process ("so they never run in both places").
# Emptying the list would render no CronWorkflows and simultaneously re-enable
# the in-process copies. Blanking the image disables the CronWorkflows at their
# own gate while leaving ARGO_JOBS populated, so dev runs them nowhere.
jobs:
  image: ""

# EVERY MODEL IN DEV POINTS AT THE IN-CLUSTER QWEN.
#
# Three separate settings reach a provider from this deployment, and each one
# is metered or subscription-funded in production. Dev exists to be poked at
# cheaply, so all three go to inference.inference.svc.cluster.local, which is
# the homelab's own GPU and costs nothing per token.
#
# The list is not self-maintaining. A new model-consuming feature lands with
# production's provider as its chart default and inherits it here unless
# someone adds a line. That is the tradeoff of configuring rather than
# enforcing (issue #4860 closed on exactly that reasoning): there is no
# rejection, only these values.

# Brief compiler (ADR 036). Production runs Nemotron primary with a DeepSeek
# hop and only falls back to in-cluster Qwen as its LAST resort. Dev collapses
# that to the last resort alone: no primary worth failing over FROM, so the
# fallback list is empty rather than carrying a paid hop that would be reached
# on the first timeout.
#
# apiKeySecretKey stays pointed at a real field on purpose. Blanking it is the
# inverted-guard trap: a blank key is a fail-closed DENY in the egress catalog
# while REMOVING an entry is an uncredentialed pass-through, and neither is
# what "talk to the cluster's own GPU" means. The in-cluster endpoint ignores
# the key it is handed.
orchestrator:
  model: "qwen3.6-27b"
  baseUrl: "http://inference.inference.svc.cluster.local:8080/v1"
  fallbacks: []

# Grimoire extraction. Production calls DeepSeek directly (first-party, native
# precision, prompt cache preserved), which is metered per token.
#
# Inert in dev today because jobs.image is blank above, so the extract
# CronWorkflow never runs. Set anyway: "inert" is a property of a DIFFERENT
# line in this file, and if that line ever changes this one should already be
# right rather than discovered wrong by a bill.
grimoire:
  extractModel: "qwen3.6-27b"
  extractBaseUrl: "http://inference.inference.svc.cluster.local:8080/v1/chat/completions"

# Swarm run lane. luna is Codex-billed and opus is subscription-billed.
#
# Also inert today, for a different reason again: leaderSingletons above keeps
# DBOS from launching, so every run endpoint 503s in dev and no implementer is
# ever dispatched. Enabling dev's run lane is a separate design fork about the
# nightly refresh importing production's queue tables, tracked separately.
#
# reviewerModel moves here too, which production must NEVER do: ADR 038
# decision 5 floors review at Opus because a review is assessable only by
# reading. Dev is not gating a real merge, so the floor buys nothing and a
# subscription-billed reviewer on a throwaway run buys less.
swarm:
  implementerModel: "qwen"
  reviewerModel: "qwen"
