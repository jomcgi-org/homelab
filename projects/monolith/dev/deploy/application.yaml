apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith-dev
  namespace: argocd
spec:
  project: default
  sources:
    # The SAME OCI chart production runs. Dev is not a variant build: it is the
    # identical artifact with a thin values overlay, so what gets promoted is
    # what was exercised.
    #
    # targetRevision here is owned by Kargo, which subscribes to this chart repo
    # by semver. Production's copy of this line is still written by the CI
    # write-back (bazel/helm/write-back-versions.sh), which resolves exactly one
    # deploy/application.yaml per chart and therefore cannot see this file. That
    # split is deliberate: dev tracks automatically, and the script that moves
    # PRODUCTION's pin is left alone.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith
      targetRevision: 0.288.3
      helm:
        # releaseName MUST differ from production's. It briefly did not, and
        # ArgoCD refused the sync with:
        #
        #   ClusterRole/monolith is part of applications argocd/monolith-dev
        #   and monolith
        #
        # The reasoning for matching it was that identical names make dev a pure
        # values diff against prod. That holds only for NAMESPACED objects. This
        # chart also renders ClusterRole and ClusterRoleBinding, which are
        # cluster-scoped, so an identical release name is not a neutral choice
        # there, it is the same object claimed by two Applications with selfHeal
        # on. ArgoCD's shared-resource protection caught it and left production
        # owning them, which is the only reason this was a degraded dev app
        # rather than an outage.
        #
        # The cost this was avoiding is real but small: a distinct release name
        # rewrites every in-cluster DNS name (monolith-dev-pg-rw, not
        # monolith-pg-rw). Nothing in deploy/values.yaml hardcodes a service URL
        # (grep returns 0), and the one consumer that cares, the refresh
        # CronWorkflow, addresses dev explicitly.
        releaseName: monolith-dev
        # ORDER IS LOAD-BEARING. Production's values first, dev's overrides
        # second, because Helm lets later files win. This is what makes dev the
        # same configuration as prod minus a deliberate, reviewable diff, rather
        # than a second configuration that drifts.
        valueFiles:
          - $values/projects/monolith/deploy/values.yaml
          - $values/projects/monolith/dev/deploy/values.yaml
    - repoURL: https://github.com/jomcgi/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-dev
  # Same rationale as the production app: Kyverno mutates the Deployment at
  # admission, and the HPA owns the replica count.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[].env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
        - '.spec.template.spec.initContainers[]?.env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
      jsonPointers:
        - /spec/template/metadata/annotations/otel.injected-by
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
