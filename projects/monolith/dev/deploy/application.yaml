apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monolith-dev
  namespace: argocd
  annotations:
    # Kargo will not touch an Application that has not opted in. Without this
    # the promotion fails with:
    #
    #   Argo CD Application "monolith-dev" in namespace "argocd" is not authorized
    #
    # That is a deliberate guard, not an obstacle: it means installing Kargo
    # cannot silently give it write access to every Application in the cluster,
    # and production's Application is protected by simply never carrying this.
    #
    # Format is <kargo project>:<stage>. The project is kargo-monolith rather
    # than monolith because a Kargo Project OWNS a namespace of its own name and
    # both monolith and monolith-dev already exist.
    kargo.akuity.io/authorized-stage: kargo-monolith:dev
spec:
  project: default
  sources:
    # The SAME OCI chart production runs. Dev is not a variant build: it is the
    # identical artifact with a thin values overlay, so what gets promoted is
    # what was exercised.
    #
    # A STALE PIN HERE SILENTLY DISABLES DEV'S SAFETY GATES, and it did.
    #
    # Pinned at 0.288.3 while production ran 0.291.0, dev rendered
    # ships.jomcgi.dev in monolith-dev alongside production's route on the same
    # Gateway. The overlay sets cfIngress.shipsRedirect.enabled=false, but that
    # gate was introduced in the SAME commit that introduced dev, so the chart
    # version dev was pinned to had no `if` to read it. The value was set,
    # spelled right, and consumed by nothing.
    #
    # Any dev-only guard added to this chart has that property: it lands in a
    # chart version NEWER than whatever dev is pinned to, so dev is the one
    # deployment it does not protect until this line moves. That is the argument
    # for Kargo below, not merely convenience.
    #
    # THE NUMBER BELOW IS NOT WHAT DEV IS RUNNING, and it never will be again.
    #
    # Kargo owns targetRevision at runtime for BOTH environments now (#4744),
    # patching the live Application via argocd-update rather than committing
    # here. `canada` carries an ignoreDifferences entry plus
    # RespectIgnoreDifferences=true so the patch survives, which means ArgoCD
    # reads this line only when the Application is first created. It is a
    # bootstrap floor, not a record of anything.
    #
    # Read the live value instead:
    #   kubectl get application monolith-dev -n argocd \
    #     -o jsonpath='{.spec.sources[0].targetRevision}'
    #
    # Nothing updates this line: bazel/helm/write-back-versions.sh resolves
    # exactly one deploy/application.yaml per chart and that is production's, so
    # it cannot see this file. Production's copy IS still written by that
    # script, deliberately and despite being inert, because it is the revert
    # lever: drop canada's entry for `monolith` and production is handed back a
    # current value with nothing to reconstruct.
    - repoURL: ghcr.io/jomcgi/homelab/charts
      chart: monolith
      targetRevision: 0.293.0
      helm:
        # releaseName MUST differ from production's. It briefly did not, and
        # ArgoCD refused the sync with:
        #
        #   ClusterRole/monolith is part of applications argocd/monolith-dev
        #   and monolith
        #
        # The reasoning for matching it was that identical names make dev a pure
        # values diff against prod. That holds only for NAMESPACED objects. This
        # chart also renders ClusterRole and ClusterRoleBinding, which are
        # cluster-scoped, so an identical release name is not a neutral choice
        # there, it is the same object claimed by two Applications with selfHeal
        # on. ArgoCD's shared-resource protection caught it and left production
        # owning them, which is the only reason this was a degraded dev app
        # rather than an outage.
        #
        # The cost this was avoiding is real but small: a distinct release name
        # rewrites every in-cluster DNS name (monolith-dev-pg-rw, not
        # monolith-pg-rw). Nothing in deploy/values.yaml hardcodes a service URL
        # (grep returns 0), and the one consumer that cares, the refresh
        # CronWorkflow, addresses dev explicitly.
        releaseName: monolith-dev
        # ORDER IS LOAD-BEARING. Production's values first, dev's overrides
        # second, because Helm lets later files win. This is what makes dev the
        # same configuration as prod minus a deliberate, reviewable diff, rather
        # than a second configuration that drifts.
        valueFiles:
          - $values/projects/monolith/deploy/values.yaml
          - $values/projects/monolith/dev/deploy/values.yaml
    - repoURL: https://github.com/jomcgi-org/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monolith-dev
  # Same rationale as the production app: Kyverno mutates the Deployment at
  # admission, and the HPA owns the replica count.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[].env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
        - '.spec.template.spec.initContainers[]?.env[]? | select(.name == "OTEL_EXPORTER_OTLP_ENDPOINT" or .name == "OTEL_EXPORTER_OTLP_PROTOCOL")'
      jsonPointers:
        - /spec/template/metadata/annotations/otel.injected-by
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ignoreDifferences above suppresses DIFFING, not APPLYING.
      # Without this option a sync still writes the chart's version of
      # those fields, stripping the env Kyverno injects; Kyverno
      # re-injects, and the Deployment never settles. `canada` already
      # carries this option one level up so Kargo's targetRevision patch
      # on Application resources survives; the child apps declared
      # ignoreDifferences without it.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
