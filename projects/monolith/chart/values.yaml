backend:
  replicas: 1
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/backend
    tag: main
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "200m"
    limits:
      memory: "256Mi"
  # Autoscaling: steady state stays at minReplicas (1); scale out under CPU load.
  # Safe to run >1 replica because the in-process singletons are leader-gated
  # (app/leadership.py) so only the lease holder runs them, while every replica
  # serves HTTP/MCP. When enabled the deployment omits spec.replicas and the
  # ArgoCD Application ignores /spec/replicas (deploy/application.yaml), so the
  # HPA owns the count instead of ArgoCD reverting it.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  # Disruption budget: maxUnavailable (not minAvailable) so a node drain can
  # still evict-and-reschedule the single pod at the 1-replica floor.
  pdb:
    enabled: true
    maxUnavailable: 1

# Off-pod batch-job execution via Argo CronWorkflows.
#
# Each cronWorkflows entry renders (chart/templates/cronworkflows.yaml) as a
# CronWorkflow CR in workflowNamespace; Argo's controller owns the schedule,
# concurrency, timeout, and history. The monolith does NOT manage these at
# runtime - ArgoCD syncs the CRs like any other manifest.
#
# Cutover is per-job via `suspend`: with suspend=true the CronWorkflow is inert
# and the in-process scheduler job (named by `replaces`) runs as before; flip to
# suspend=false and the CronWorkflow takes over AND the deployment's ARGO_JOBS
# env gains `replaces`, so on_startup_jobs skips the in-process job - both sides
# in one git change.
#
# jobs.image is injected (digest-pinned) at build time by helm_images_values
# (see chart/BUILD images "jobs.image"); do not set it here.
jobs:
  workflowNamespace: monolith-workflows
  # Secret in workflowNamespace (Kyverno-cloned from monolith-pg-app) supplying
  # DATABASE_URL to job pods via secretKeyRef.
  dbSecretName: monolith-pg-app
  dbSecretKey: uri
  cronWorkflows:
    - name: worldcup-sim
      replaces: worldcup.refresh
      args: ["worldcup-sim"]
      schedule: "*/30 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false # worldcup.refresh cut over to Argo 2026-06-22
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
    # ADR 026 Phase 2 Task 2.5: evict goose session DBs (s3://artifacts/<id>/
    # sessions.db) past their TTL so abandoned threads do not accumulate storage.
    # Artifacts are left intact. S3-only, light; daily is ample.
    - name: evict-artifact-sessions
      args: ["evict-artifact-sessions"]
      schedule: "0 4 * * *" # daily 04:00 UTC
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 300
      suspend: false
      # artifact.s3 needs SEAWEEDFS_S3_ENDPOINT (creds default to the
      # auth-open duckdb keys); without it the job raises at startup.
      s3: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    # knowledge.layout: FA2 graph layout, ~2.7GiB peak / 1 core / ~3 min,
    # measured live. It recomputes the WHOLE graph every run with no
    # change-detection, but the graph (notes + links) is static for days at a
    # time (e.g. 0 note changes in 24h, 36 in 7d), so a 5-min cadence meant
    # ~860 identical recomputes over 3 days. Run it WEEKLY instead: a
    # change-gate would still have to reserve the memory and spin a pod every
    # tick, so cutting the cadence is the cleaner win. Trigger a one-off
    # Workflow by hand after a bulk note import if an immediate relayout is
    # needed. Forbid so a slow layout never overlaps; 4Gi request==limit covers
    # the 2.7GiB peak with growth headroom; cpu:1 (single-threaded FA2).
    - name: knowledge-layout
      replaces: knowledge.layout
      args: ["knowledge-layout"]
      schedule: "0 4 * * 0" # weekly, Sunday 04:00 UTC
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          memory: 4Gi
    # observability.topology_rollup: queries ClickHouse for the service-topology
    # graph and snapshots it to Postgres (observability.topology_snapshot, single
    # upsert row). Light footprint (heavy=True is for serialization, not memory).
    # First job needing ClickHouse: CLICKHOUSE_URL is a plain in-cluster svc URL
    # (literal env), USER/PASSWORD come from the monolith-clickhouse Secret cloned
    # into monolith-workflows by Kyverno. */15 matches the 900s in-process cadence.
    - name: observability-topology-rollup
      replaces: observability.topology_rollup
      args: ["observability-topology-rollup"]
      schedule: "*/15 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 300
      suspend: false
      env:
        CLICKHOUSE_URL: "http://chi-signoz-clickhouse-cluster-0-0.signoz.svc.cluster.local:8123"
      secretEnv:
        CLICKHOUSE_USER:
          secretName: monolith-clickhouse
          key: USER
        CLICKHOUSE_PASSWORD:
          secretName: monolith-clickhouse
          key: PASSWORD
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # stats_rollup counts cluster resources via the in-cluster K8s API, so it
    # runs under the dedicated least-privilege monolith-stats SA (defined in the
    # argo-workflows platform chart) instead of the shared executor SA. Also
    # needs ClickHouse for GPU metrics. 2-min cadence (was 120s); per-run pod
    # overhead ~10s is fine.
    - name: observability-stats-rollup
      replaces: observability.stats_rollup
      args: ["observability-stats-rollup"]
      schedule: "*/2 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 120
      suspend: false
      serviceAccountName: monolith-stats
      env:
        CLICKHOUSE_URL: "http://chi-signoz-clickhouse-cluster-0-0.signoz.svc.cluster.local:8123"
      secretEnv:
        CLICKHOUSE_USER:
          secretName: monolith-clickhouse
          key: USER
        CLICKHOUSE_PASSWORD:
          secretName: monolith-clickhouse
          key: PASSWORD
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # MANUAL-ONLY jobs: replaces disables the in-process job, suspend:true keeps
    # the CronWorkflow from ever auto-firing, but it stays submittable by hand
    # (argo submit --from cronworkflow/<name>, or kubectl create from its
    # workflowSpec). The yearly schedule is inert belt-and-suspenders: even an
    # accidental un-suspend can only fire it once a year, not constantly.
    #
    # hikes.scrape_walks: full WalkHighlands corpus scrape, ~hours. The corpus
    # barely changes; trigger by hand when a refresh is wanted.
    - name: hikes-scrape-walks
      replaces: hikes.scrape_walks
      args: ["hikes-scrape-walks"]
      schedule: "0 0 1 1 *" # inert; suspended, manual-only
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 14400 # 4h headroom for the full scrape
      suspend: true
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          memory: 1Gi
    # stars.load_climatology: wholesale-replaces stars.site_month_climatology
    # from a STATIC annual CERRA/ERA5 S3 backfill, so daily runs just re-loaded
    # identical data. Trigger by hand after regenerating the backfill.
    - name: stars-load-climatology
      replaces: stars.load_climatology
      args: ["stars-load-climatology"]
      schedule: "0 0 1 1 *" # inert; suspended, manual-only
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 1800
      suspend: true
      s3: true # _fetch_climatology reads the S3 backfill; needs the endpoint set
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          memory: 1Gi
    # Scheduled batch cutovers (Postgres / external-HTTP / S3). Cadences match
    # the in-process intervals; all light enough for a 512Mi-1Gi ephemeral pod.
    - name: ships-heat-rollup
      replaces: ships.heat_rollup
      args: ["ships-heat-rollup"]
      schedule: "0 * * * *" # hourly (was 3600s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 1800
      suspend: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    - name: ships-partition-maintenance
      replaces: ships.partition_maintenance
      args: ["ships-partition-maintenance"]
      schedule: "30 3 * * *" # daily 03:30 UTC (was 86400s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 1800
      suspend: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
    - name: dr-jobs-scrape-nhs
      replaces: dr_jobs.scrape_nhs
      args: ["dr-jobs-scrape-nhs"]
      schedule: "15 * * * *" # hourly (was 3600s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    - name: stars-load-grid
      replaces: stars.load_grid
      args: ["stars-load-grid"]
      schedule: "0 */6 * * *" # every 6h (was 21600s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 900
      suspend: false
      s3: true # load_grid reads grid.json from S3
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          memory: 1Gi
    - name: stars-refresh
      replaces: stars.refresh
      args: ["stars-refresh"]
      schedule: "0 */3 * * *" # every 3h (was 10800s)
      concurrencyPolicy: Forbid
      # ~14k met.no fetches at the ~15 req/s courtesy rate is ~15-18 min; the
      # highest external fanout in the registry. 45 min gives headroom for a slow
      # met.no day without ever overlapping the next run (Forbid + 3h schedule).
      activeDeadlineSeconds: 2700
      suspend: false
      # 512Mi is comfortable now that the refresh fetches + persists in batches
      # (stars/jobs.py REFRESH_BATCH_SIZE) instead of holding the whole ~14k-site
      # grid in memory at once, which OOMed this pod.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    - name: knowledge-repo-docs-reconcile
      replaces: knowledge.repo_docs_reconcile
      args: ["knowledge-repo-docs-reconcile"]
      schedule: "0 */6 * * *" # every 6h (was 21600s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 900
      suspend: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # Phase A: remaining Postgres / HTTP jobs. All small; cadences match the
    # in-process intervals. Per-run pod overhead is ~10s (measured), trivial
    # even at the 5-min cadences.
    - name: hikes-refresh-forecasts
      replaces: hikes.refresh_forecasts
      args: ["hikes-refresh-forecasts"]
      schedule: "20 */2 * * *" # every 2h (was 7200s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 1800
      suspend: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    - name: hikes-prune-windows
      replaces: hikes.prune_windows
      args: ["hikes-prune-windows"]
      schedule: "40 * * * *" # hourly (was 3600s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 300
      suspend: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
    - name: stars-prune-hours
      replaces: stars.prune_hours
      args: ["stars-prune-hours"]
      schedule: "50 * * * *" # hourly (was 3600s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 300
      suspend: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
    - name: knowledge-ingest
      replaces: knowledge.ingest
      args: ["knowledge-ingest"]
      schedule: "*/5 * * * *" # every 5 min (was 300s)
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    - name: knowledge-discover-gaps
      replaces: knowledge.discover-gaps
      args: ["knowledge-discover-gaps"]
      schedule: "2-59/5 * * * *" # every 5 min, offset from ingest
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # calendar_poll fetches the iCal feed and snapshots today's events to
    # home.calendar_snapshot (so all API replicas read one shared row instead of
    # each warming an in-memory cache). Needs ICAL_FEED_URL from the cloned
    # monolith-secrets secret. 15min cadence (was 900s).
    - name: home-calendar-poll
      replaces: home.calendar_poll
      args: ["home-calendar-poll"]
      schedule: "*/15 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 120
      suspend: false
      secretEnv:
        ICAL_FEED_URL:
          secretName: monolith-secrets
          key: ICAL_FEED_URL
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
    # chat.summary_generation: per-user + per-channel LLM summaries. LLM-only
    # (Qwen via LLAMA_CPP_URL), no Discord bot needed, so it is a clean cutover.
    # Daily (was 86400s); generous deadline since it loops users/channels with
    # an LLM call each.
    - name: chat-summary-generation
      replaces: chat.summary_generation
      args: ["chat-summary-generation"]
      schedule: "30 5 * * *" # daily 05:30 UTC
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 1800
      suspend: false
      env:
        LLAMA_CPP_URL: "http://inference.inference.svc.cluster.local:8080"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # chat.changelog.* (one per config): fetch new commits, summarize via Qwen,
    # ENQUEUE the embed to the Discord outbox (the leader's bot drains + posts).
    # No bot in the job. `changelog: true` injects CHANGELOG_CONFIGS + GITHUB_TOKEN.
    # Hourly (was intervalHours=1), offset so the three do not fire together.
    - name: chat-changelog-homelab
      replaces: chat.changelog.homelab
      args: ["chat-changelog", "homelab"]
      schedule: "5 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      changelog: true
      env:
        LLAMA_CPP_URL: "http://inference.inference.svc.cluster.local:8080"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    - name: chat-changelog-colin-homelab
      replaces: chat.changelog.colin-homelab
      args: ["chat-changelog", "colin-homelab"]
      schedule: "10 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      changelog: true
      env:
        LLAMA_CPP_URL: "http://inference.inference.svc.cluster.local:8080"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    - name: chat-changelog-loom
      replaces: chat.changelog.loom
      args: ["chat-changelog", "loom"]
      schedule: "15 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      changelog: true
      env:
        LLAMA_CPP_URL: "http://inference.inference.svc.cluster.local:8080"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # chat.jobs.drain_reminders_handler: net-new (never ran in-process, so no
    # `replaces`/ARGO_JOBS entry needed). Delivers due chat reminders into the
    # Discord outbox; DB-only, no bot in the job. 2-minute cadence is the
    # fastest plain-cron interval already in use elsewhere in this file
    # (observability-stats-rollup); the reminder spec's delivery tolerance is
    # minutes, not seconds, so this stays inside that envelope instead of
    # introducing the first sub-minute `@every` schedule.
    - name: chat-drain-reminders
      args: ["chat-drain-reminders"]
      schedule: "*/2 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 120
      suspend: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
    # chat.observe_directives: weekly (Fri 18:00 UTC). Scans ambient-granted
    # channels for recurring style friction and enqueues at most one
    # directive-proposal outbox row per channel; the leader drain posts it and
    # wires the 👍/👎 confirm flow. Sensitivity is env config: OBSERVER_MIN_EVIDENCE
    # (min distinct evidence messages the classifier must cite) and
    # OBSERVER_COOLDOWN_DAYS (suppress a channel that saw a recent proposal). The
    # LLM classify hits Qwen via LLAMA_CPP_URL (injected into the workflows pod).
    - name: chat-observe-directives
      args: ["chat-observe-directives"]
      schedule: "0 18 * * 5"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      env:
        LLAMA_CPP_URL: "http://inference.inference.svc.cluster.local:8080"
        OBSERVER_MIN_EVIDENCE: "3"
        OBSERVER_COOLDOWN_DAYS: "14"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
    # chat.directive_autopilot: daily (04:30 UTC). The silent counterpart to
    # chat-observe-directives: it auto-applies high-confidence low-risk channel
    # AND per-user directive refinements from ambient reaction/follow-up signals,
    # baselines each apply, and self-validates one window later, reverting on
    # regression. It NEVER posts to Discord; provenance is read out-of-band via
    # the monolith-chat-* MCP tools. A human manual tune (source=manual) wins.
    # Shipping LIVE + AGGRESSIVE per PR 3: AUTOPILOT_MODE=live (flip to shadow to
    # kill-switch: it logs what it WOULD do and mutates nothing). Classifies via
    # Qwen (LLAMA_CPP_URL). All thresholds are AUTOPILOT_* env knobs.
    - name: chat-directive-autopilot
      args: ["chat-directive-autopilot"]
      schedule: "30 4 * * *"
      # Allow, not Forbid: a manual one-off trigger (verifying a tune, or
      # forcing an adjustment now) must not cause the next scheduled run to be
      # skipped on window overlap and lose that window's signal. The autopilot
      # has no run-lock; safety comes from per-apply cooldown + self-validation
      # + revert-on-regression, so an overlapping second run is bounded.
      concurrencyPolicy: Allow
      activeDeadlineSeconds: 600
      suspend: false
      env:
        LLAMA_CPP_URL: "http://inference.inference.svc.cluster.local:8080"
        AUTOPILOT_MODE: "live"
        AUTOPILOT_MIN_CONFIDENCE: "0.65"
        AUTOPILOT_MIN_EVIDENCE: "2"
        AUTOPILOT_COOLDOWN_DAYS: "2"
        AUTOPILOT_VALIDATE_DAYS: "1"
        AUTOPILOT_MANUAL_COOLDOWN_DAYS: "30"
        AUTOPILOT_REGRESS_MARGIN: "0.1"
        AUTOPILOT_LOOKBACK_DAYS: "7"
        AUTOPILOT_MAX_LEN_DELTA: "300"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 256Mi
    # campsites.refresh: hourly at :00 UTC (not aligned to the 07:00 PT
    # reservation-opening surge). Reads the static catalog.json, fetches BC Parks
    # availability (~145 paced curl_cffi calls) + Open-Meteo forecast (~145
    # calls), and upserts campsites.{campgrounds,availability,weather}.
    - name: campsites-refresh
      replaces: campsites.refresh
      args: ["campsites-refresh"]
      schedule: "0 * * * *"
      concurrencyPolicy: Forbid
      # 25m. A normal scrape of ~145 parks finishes in ~2-3 min, but an
      # occasional WAF-throttled run pushes scattered parks onto the 2s-retry
      # path and can exceed 15m (the old 900s), timing out and writing nothing
      # (jobs.py commits only after the full fetch). 1500s gives a degraded run
      # room to finish; a fully-blocked run still bails early via
      # MAX_CONSECUTIVE_FAILURES. Safe under the hourly schedule + Forbid.
      activeDeadlineSeconds: 1500
      suspend: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # grimoire.load_chunks: list S3 chunk manifests (s3://grimoire/chunks/), upsert
    # knowledge_chunk rows, and embed new/changed content. Idempotent (upsert by
    # book_id+chunk_ref; only new content is re-embedded), so a daily run over an
    # unchanged corpus is cheap. `grimoire: true` injects the SeaweedFS S3 env,
    # GRIMOIRE_S3_BUCKET, and EMBEDDING_URL the loader reads. The cronworkflows
    # template skips both grimoire entries unless grimoire.enabled (private tier).
    - name: grimoire-load-chunks
      args: ["grimoire-load-chunks"]
      schedule: "0 2 * * *" # daily 02:00 UTC
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: false
      grimoire: true
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 512Mi
    # grimoire.extract_entities: frontier-model extraction of entities/mentions/
    # relationships from loaded chunks. Costs OpenRouter money per chunk, so it
    # ships SUSPENDED (manual-only): submit by hand (argo submit --from
    # cronworkflow/grimoire-extract-entities) when a fresh corpus needs
    # extracting. The inert yearly schedule is belt-and-suspenders. 25m deadline
    # covers a bounded run (GRIMOIRE_EXTRACT_LIMIT chunks, default 25).
    - name: grimoire-extract-entities
      args: ["grimoire-extract-entities"]
      schedule: "0 0 1 1 *" # inert; suspended, manual-only
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 1500
      suspend: true
      grimoire: true
      resources:
        requests:
          cpu: 250m
          # 1Gi (up from 512Mi): the hosted-provider default runs 64 concurrent
          # extract calls, so more in-flight response bodies + entity batches sit
          # in memory at once; the headroom keeps a wide run from OOMing.
          memory: 1Gi
        limits:
          memory: 1Gi
    # grimoire.backfill_hierarchy: one-off metadata backfill (NOT a re-load). Some
    # books were loaded before marker.py emitted section_hierarchy, so their rows
    # have it NULL. This re-runs marker's chunking over each book's archived raw
    # output.json and writes ONLY the section_hierarchy column of matching
    # (book_id, chunk_ref) rows: it never inserts a chunk and never re-embeds, so
    # it is cheap and safe to re-run. Reuses the same `grimoire: true` env as the
    # loader (S3 env + GRIMOIRE_S3_BUCKET + DATABASE_URL). Ships SUSPENDED
    # (manual-only): submit by hand with
    #   argo submit --from cronworkflow/grimoire-backfill-hierarchy -n monolith-workflows
    # To scope to ONE book for a safe verify run first, set GRIMOIRE_BACKFILL_BOOK
    # below to the book id (e.g. "monster-manual"), deploy, submit, then revert to
    # "" (empty = every book with loaded chunks). The inert yearly schedule is
    # belt-and-suspenders.
    - name: grimoire-backfill-hierarchy
      args: ["grimoire-backfill-hierarchy"]
      schedule: "0 0 1 1 *" # inert; suspended, manual-only
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 1800
      suspend: true
      grimoire: true
      env:
        # Empty = backfill every book with loaded chunks. Set to a single book id
        # for a scoped verify run, then revert to "".
        GRIMOIRE_BACKFILL_BOOK: ""
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        # marker re-parses each book's whole raw output.json in memory; the
        # largest (Monster Manual, 45MB raw) OOMs a 512Mi limit. Memory
        # requests=limits per the sizing convention would cost 4Gi of quota on
        # an inert cronworkflow, so this manual-only job keeps a low request
        # with a 4Gi ceiling.
        limits:
          memory: 4Gi

frontend:
  otelCollectorUrl: ""
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgres:
  instances: 1
  storage:
    size: 10Gi
    storageClass: ""
  pgvector:
    image: ghcr.io/cloudnative-pg/pgvector:0.8.2-202604021427-18-trixie

service:
  port: 3000
  apiPort: 8000

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

onepassword:
  enabled: false
  itemPath: ""

clickhouse:
  onepassword:
    itemPath: ""

knowledge:
  enabled: false
  gaps:
    # When true, the gardener rewrites [[X]] -> bare text in source notes
    # whose stub is marked `triaged: discardable`, then tombstones the gap
    # row + stub once no references remain. Off by default — opt-in per
    # cluster.
    rewriteDiscardable: false
  layout:
    scalingRatio: 2.0
    gravity: 0.1
    maxIter: 100
    linlog: false
    coreFraction: 0.99
    seed: 42
    nodeSizeScale: 0.005

chat:
  enabled: false
  llamaCppUrl: ""
  embeddingUrl: ""
  searxngUrl: ""
  onepassword:
    itemPath: ""

# semgrep_scan MCP tool: URL of the in-cluster fc-invoke HTTP daemon the
# tool POSTs changed files to. Empty disables the env injection (the tool then
# returns a structured "not configured" error). The real address is set in
# deploy/values.yaml; never hardcode it in a template.
semgrep:
  fcInvokeUrl: ""

# goosecracker artifact agent (ADR 024): syncs the OpenRouter API key from
# 1Password into the `goosecracker` Secret, consumed by the fc-invoke egress
# proxy to swap the artifact tier's kloak:or: placeholder on openrouter.ai.
# Disabled by default for portability.
#
# The monolith orchestrates goose runs by calling the fc-invoke daemon
# (goose cutover PR C). `tiers` is the per-tier guest env map (rendered to the
# GOOSECRACKER_TIERS JSON env and merged into the AgentRequest the runner POSTs);
# `progressUrl` is the monolith's own in-cluster progress endpoint base the guest
# streams goose stdout to (reached through the fc-invoke egress funnel). Both are
# empty by default; the real values live in deploy/values.yaml so the in-cluster
# URLs are never baked into a template.
goosecracker:
  enabled: false
  onepassword:
    itemPath: ""
  tiers: {}
  progressUrl: ""
  # The monolith's own in-cluster steering endpoint base the guest polls at
  # stage boundaries (ADR 035 phase 2); empty disables steering.
  steeringUrl: ""

# Knowledge gardener: LLM-driven decomposition of raw vault notes into
# typed knowledge artifacts via the claude Code CLI. Uses CLAUDE_CODE_OAUTH_TOKEN
# from the litellm-claude-auth 1Password item (same token as goose agents).
# Disabled by default for portability.
gardener:
  enabled: false
  onepassword:
    itemPath: ""

# Grimoire: D&D campaign manager ingest pipeline (private tier only; spec
# docs/plans/2026-07-02-grimoire-pg-first-spec.md). Two daily scheduled jobs
# load S3 chunk manifests and extract entities via OpenRouter. Disabled by
# default (the private deploy values enable it). OPENROUTER_API_KEY for the
# extract job is sourced from the existing "goosecracker" Secret (field
# "OPENROUTER_API_KEY"), Kyverno-cloned into monolith-workflows; the extract job
# skips cleanly if the key is absent. S3 endpoint/creds reuse the shared
# SeaweedFS block emitted alongside stars.
grimoire:
  enabled: false
  s3Bucket: "grimoire"
  # Default extraction model (spec #5): DeepSeek V4 Flash via OpenRouter, with
  # reasoning disabled per call in code. deploy/values.yaml can repoint this at
  # the in-cluster Qwen vLLM (via extractBaseUrl) for cheap iteration.
  extractModel: "deepseek/deepseek-v4-flash"
  # extractBaseUrl: OpenAI-compatible chat/completions endpoint for extraction.
  # Empty here so the code falls back to OpenRouter; deploy/values.yaml points
  # it at the in-cluster Qwen vLLM (free, keyless) to avoid OpenRouter spend.
  extractBaseUrl: ""
  # extractProvider: OpenRouter provider preference (GRIMOIRE_EXTRACT_PROVIDER).
  # OpenRouter's cheapest V4-Flash route is fp4-quantized (DeepInfra), which
  # degrades precision and breaks the prompt cache; pin a native-precision
  # first-party provider (comma list allowed). Empty here (no constraint);
  # deploy/values.yaml sets it. Only applied when the endpoint is OpenRouter.
  extractProvider: ""
  # extractLimit: optional per-run cap on chunks the extraction job processes.
  # Unset here so the code default (25) applies; set to tune without a code
  # change.
  extractLimit: ""
  # extractConcurrency: cap on concurrent extract calls. The code default (6)
  # suits the local GPU's 8 decode slots; a hosted provider (OpenRouter) has no
  # such limit, so deploy/values.yaml raises it (the client backs off on 429).
  # Empty here so the code default applies.
  extractConcurrency: ""

# ADR 036 orchestrator brief compiler: a host-side OpenRouter call that routes
# chat vs goose and compiles a grounded task brief for escalations. Disabled
# by default; the private deploy values flip it on. OPENROUTER_API_KEY is NOT
# synced by a dedicated OnePasswordItem here: it is sourced from the existing
# "goosecracker" Secret (synced from the goosecracker 1Password item for the
# artifact egress sidecar), so the same key is never double-synced. model is
# pinned (never ":auto") so briefs stay attributable; timeoutSeconds bounds
# the fail-open budget before the flow falls back to direct submit.
orchestrator:
  enabled: false
  model: "deepseek/deepseek-v4-flash"
  baseUrl: "https://openrouter.ai/api/v1"
  # Field in the "goosecracker" Secret that drives the PRIMARY provider's key
  # (ORCHESTRATOR_API_KEY). Cluster values point this at the primary of the day
  # (e.g. NVIDIA_API_KEY for Nemotron); the client falls back to OPENROUTER_API_KEY
  # if the named field is absent.
  apiKeySecretKey: "OPENROUTER_API_KEY"
  # Ordered fallback chain, tried in turn when the primary raises
  # OrchestratorUnavailable (timeout, 5xx/429, or an unusable/absent tool call),
  # before the flow fails open to direct submit. Each entry (snake_case, passed
  # verbatim to the client as JSON): model, base_url, and api_key_env (the env var
  # holding that provider's key; empty = no auth, e.g. in-cluster Qwen). Empty
  # list = no fallback (single-attempt contract).
  fallbacks: []
  # Initial-compile budget: covers BOTH the route-decision call and the
  # submit_plan tool call (plan construction is real work, not a quick classify).
  timeoutSeconds: 60
  # Replan budget (the capped goose escape hatch): a replan runs after goose has
  # opened the task and reported what it learned, so it gets a more generous
  # budget than the initial compile.
  replanTimeoutSeconds: 120

# Marine / AIS ship tracking: streams vessel positions from AISStream.io.
# Reuses the existing 1Password "marine" vault item (shared with the legacy
# standalone ships app) so the secret keeps materializing after that app is
# decommissioned.
marine:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/marine"
  boundingBox: "[[[46.876152, -129.552155], [51.413769, -121.213531]]]"

# Stars / dark-sky planner: the stars.load_grid job ingests grid.json (the
# light-pollution site grid, uploaded out-of-band) from the SeaweedFS S3
# gateway. SeaweedFS auth is disabled cluster-wide, so the dummy creds below
# only satisfy boto3's "some value required" check.
stars:
  seaweedfsS3Endpoint: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
  gridBucket: "stars"
  gridKey: "grid.json"
  climatologyKey: "climatology.json"
  s3AccessKeyId: "duckdb"
  s3SecretAccessKey: "duckdb"

# Chat: Discord attachment bytes are stored in SeaweedFS (content-addressed at
# blobs/<sha256>) rather than inline in Postgres. Reuses the shared SeaweedFS S3
# endpoint/creds emitted alongside the stars block.
chat:
  blobBucket: "chat"

# goosecracker artifact store (ADR 024). The full monolith writes agent-built
# HTML to s3://<bucket>/<id>/index.html (reusing the shared SeaweedFS S3
# endpoint/creds from the stars block) and returns the artifact URL on
# publicBase. The bucket auto-creates on first write.
artifact:
  bucket: "artifacts"
  publicBase: "https://jomcgi.dev"

# imgproxy URL signing for the private frontend (grimoire reader images).
# Reuses the trips-imgproxy-signing 1Password item so signatures validate
# against the shared imgproxy behind /img (served on both hostnames by the
# monolith-public chart). Off by default; the deploy values enable it.
imgproxySigning:
  enabled: false
  onepassword:
    itemPath: ""

cfIngress:
  private:
    enabled: true
    tier: trusted
    hostname: private.jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    team: jomcgi
  public:
    enabled: false
    tier: public
    hostname: jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    rateLimit:
      requests: 100
      unit: Minute
