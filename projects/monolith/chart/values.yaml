backend:
  replicas: 1
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/backend
    tag: main
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "200m"
    limits:
      memory: "256Mi"

# Off-pod batch-job execution via Argo CronWorkflows.
#
# Each cronWorkflows entry renders (chart/templates/cronworkflows.yaml) as a
# CronWorkflow CR in workflowNamespace; Argo's controller owns the schedule,
# concurrency, timeout, and history. The monolith does NOT manage these at
# runtime - ArgoCD syncs the CRs like any other manifest.
#
# Cutover is per-job via `suspend`: with suspend=true the CronWorkflow is inert
# and the in-process scheduler job (named by `replaces`) runs as before; flip to
# suspend=false and the CronWorkflow takes over AND the deployment's ARGO_JOBS
# env gains `replaces`, so on_startup_jobs skips the in-process job - both sides
# in one git change.
#
# jobs.image is injected (digest-pinned) at build time by helm_images_values
# (see chart/BUILD images "jobs.image"); do not set it here.
jobs:
  workflowNamespace: monolith-workflows
  # Secret in workflowNamespace (Kyverno-cloned from monolith-pg-app) supplying
  # DATABASE_URL to job pods via secretKeyRef.
  dbSecretName: monolith-pg-app
  dbSecretKey: uri
  cronWorkflows:
    - name: worldcup-sim
      replaces: worldcup.refresh
      args: ["worldcup-sim"]
      schedule: "*/30 * * * *"
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 600
      suspend: true # flip to false to cut worldcup.refresh over to Argo
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi

frontend:
  otelCollectorUrl: ""
  image:
    repository: ghcr.io/jomcgi/homelab/projects/monolith/frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgres:
  instances: 1
  storage:
    size: 10Gi
    storageClass: ""
  pgvector:
    image: ghcr.io/cloudnative-pg/pgvector:0.8.2-202604021427-18-trixie

service:
  port: 3000
  apiPort: 8000

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

onepassword:
  enabled: false
  itemPath: ""

clickhouse:
  onepassword:
    itemPath: ""

knowledge:
  enabled: false
  gaps:
    # When true, the gardener rewrites [[X]] -> bare text in source notes
    # whose stub is marked `triaged: discardable`, then tombstones the gap
    # row + stub once no references remain. Off by default — opt-in per
    # cluster.
    rewriteDiscardable: false
  layout:
    scalingRatio: 2.0
    gravity: 0.1
    maxIter: 100
    linlog: false
    coreFraction: 0.99
    seed: 42
    nodeSizeScale: 0.005

chat:
  enabled: false
  llamaCppUrl: ""
  embeddingUrl: ""
  searxngUrl: ""
  onepassword:
    itemPath: ""

# Knowledge gardener: LLM-driven decomposition of raw vault notes into
# typed knowledge artifacts via the claude Code CLI. Uses CLAUDE_CODE_OAUTH_TOKEN
# from the litellm-claude-auth 1Password item (same token as goose agents).
# Disabled by default for portability.
gardener:
  enabled: false
  onepassword:
    itemPath: ""

# Marine / AIS ship tracking: streams vessel positions from AISStream.io.
# Reuses the existing 1Password "marine" vault item (shared with the legacy
# standalone ships app) so the secret keeps materializing after that app is
# decommissioned.
marine:
  enabled: true
  onepassword:
    itemPath: "vaults/k8s-homelab/items/marine"
  boundingBox: "[[[46.876152, -129.552155], [51.413769, -121.213531]]]"

# Stars / dark-sky planner: the stars.load_grid job ingests grid.json (the
# light-pollution site grid, uploaded out-of-band) from the SeaweedFS S3
# gateway. SeaweedFS auth is disabled cluster-wide, so the dummy creds below
# only satisfy boto3's "some value required" check.
stars:
  seaweedfsS3Endpoint: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
  gridBucket: "stars"
  gridKey: "grid.json"
  climatologyKey: "climatology.json"
  s3AccessKeyId: "duckdb"
  s3SecretAccessKey: "duckdb"

# Chat: Discord attachment bytes are stored in SeaweedFS (content-addressed at
# blobs/<sha256>) rather than inline in Postgres. Reuses the shared SeaweedFS S3
# endpoint/creds emitted alongside the stars block.
chat:
  blobBucket: "chat"

cfIngress:
  private:
    enabled: true
    tier: trusted
    hostname: private.jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    team: jomcgi
  public:
    enabled: false
    tier: public
    hostname: jomcgi.dev
    servicePort: 3000
    gateway:
      name: cloudflare-ingress
      namespace: envoy-gateway-system
    rateLimit:
      requests: 100
      unit: Minute
