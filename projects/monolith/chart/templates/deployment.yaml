apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monolith.fullname" . }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.backend.autoscaling .Values.backend.autoscaling.enabled) }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "monolith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "monolith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations: {}
    spec:
      serviceAccountName: {{ include "monolith.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}@{{ .Values.backend.image.digest }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-pg-app
                  key: uri
            # Jobs an Argo CronWorkflow now owns; on_startup_jobs skips
            # registering these in-process so they never run in both places.
            # Membership is driven by `replaces` alone, NOT suspend: `replaces`
            # means "Argo owns this job", while `suspend` only controls whether
            # the CronWorkflow auto-runs on its schedule. That lets an entry be
            # manual-only (replaces + suspend:true): in-process off, no auto-run,
            # still submittable by hand.
            - name: ARGO_JOBS
              value: "{{- range .Values.jobs.cronWorkflows }}{{- if .replaces }}{{ .replaces }},{{- end }}{{- end }}"
            {{- if .Values.onepassword.enabled }}
            - name: ICAL_FEED_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-secrets
                  key: ICAL_FEED_URL
            {{- end }}
            {{- if .Values.backend.clickhouseUrl }}
            - name: CLICKHOUSE_URL
              value: {{ .Values.backend.clickhouseUrl | quote }}
            {{- end }}
            {{- if .Values.clickhouse.onepassword.itemPath }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-clickhouse
                  key: USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-clickhouse
                  key: PASSWORD
            {{- end }}
            {{- if .Values.marine.enabled }}
            - name: AISSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-marine
                  key: ais-stream-api-key
            - name: BOUNDING_BOX
              value: {{ .Values.marine.boundingBox | quote }}
            {{- end }}
            - name: FRONTEND_HEALTH_URL
              value: "http://localhost:3000/"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.backend.otelEndpoint | quote }}
            {{- if .Values.semgrep.fcInvokeUrl }}
            - name: FC_INVOKE_URL
              value: {{ .Values.semgrep.fcInvokeUrl | quote }}
            {{- end }}
            {{- if .Values.semgrep.embervmUrl }}
            # EmberVM control-plane URL + dispatch mode (R0 Task 15). The per-PR
            # semgrep diff scan can be served from EmberVM's semgrep Workload, or
            # shadow-mirrored to it, selected by SEMGREP_DISPATCH. Default
            # `fc-invoke` keeps the served path unchanged until cutover.
            - name: EMBERVM_URL
              value: {{ .Values.semgrep.embervmUrl | quote }}
            {{- end }}
            {{- if .Values.emberSynthetic.baseUrl }}
            - name: EMBER_SYNTHETIC_BASE_URL
              value: {{ .Values.emberSynthetic.baseUrl | quote }}
            {{- end }}
            {{- if .Values.faas }}
            # FaaS zip-lane function registry (ADR 045 / embervm R1). The read
            # base is the in-cluster SeaweedFS S3 host noded GETs archives from;
            # storage.code_uri raises if FAAS_S3_READ_BASE is unset, so it is
            # required whenever the faas domain is composed. The S3 write
            # endpoint/creds (SEAWEEDFS_S3_ENDPOINT, S3_ACCESS_KEY_ID,
            # S3_SECRET_ACCESS_KEY) are the shared SeaweedFS ones emitted under
            # the stars block below.
            - name: FAAS_S3_READ_BASE
              value: {{ .Values.faas.s3ReadBase | quote }}
            {{- if .Values.faas.s3Bucket }}
            - name: FAAS_S3_BUCKET
              value: {{ .Values.faas.s3Bucket | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.semgrep.dispatch }}
            - name: SEMGREP_DISPATCH
              value: {{ .Values.semgrep.dispatch | quote }}
            {{- end }}
            {{- if .Values.sandbox.dispatch }}
            # Where the python sandbox demo/tool is served (R0 cutover): fc-invoke
            # (default) or embervm (EmberVM's sandbox Workload). Reuses EMBERVM_URL.
            - name: SANDBOX_DISPATCH
              value: {{ .Values.sandbox.dispatch | quote }}
            {{- end }}
            {{- if .Values.sandbox.sessionWorkload }}
            # The EmberVM session-class workload backing sessioned run_python
            # (R2, ADR embervm/001). Sessions are created under this workload;
            # the one-shot task class stays on `sandbox`. Reuses EMBERVM_URL.
            - name: SANDBOX_SESSION_WORKLOAD
              value: {{ .Values.sandbox.sessionWorkload | quote }}
            {{- end }}
            {{- if and .Values.scratchPostgres.enabled .Values.scratchPostgres.onepassword.itemPath }}
            # EmberVM R4 scratch-postgres DSN (D-R4.PR-11.1). Agent run_python
            # sessions psycopg-connect to the scale-to-zero scratch Postgres via
            # this DSN. The password comes from the monolith-namespace Secret the
            # OnePasswordItem syncs (the SAME 1Password item embervm uses); the
            # host is the embervm serving Service, which routes the listenPort to
            # the workload's VM (waking it on the first connection). SCRATCH_PG_
            # PASSWORD is a separate env var so the secret never appears inline;
            # $(SCRATCH_PG_PASSWORD) is expanded by the kubelet at container start.
            - name: SCRATCH_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-scratch-postgres
                  key: POSTGRES_PASSWORD
            - name: SCRATCH_POSTGRES_DSN
              value: "postgresql://postgres:$(SCRATCH_PG_PASSWORD)@{{ .Values.scratchPostgres.servingService }}.{{ .Values.scratchPostgres.embervmNamespace }}.svc:{{ .Values.scratchPostgres.listenPort }}/scratch"
            {{- if .Values.scratchPostgres.demoListenPort }}
            # Demo-postgres DSN (the demos page's sleep/wake exhibit): the SAME
            # serving Service and password (the demo workload reuses the scratch-
            # postgres Secret on the embervm side), a different stateful listen
            # port. The demos API connects here so a page visit wakes the demo
            # VM, never the real scratch-postgres tenant.
            - name: DEMO_POSTGRES_DSN
              value: "postgresql://postgres:$(SCRATCH_PG_PASSWORD)@{{ .Values.scratchPostgres.servingService }}.{{ .Values.scratchPostgres.embervmNamespace }}.svc:{{ .Values.scratchPostgres.demoListenPort }}/scratch"
            {{- end }}
            {{- end }}
            {{- if .Values.semgrep.shadowProject }}
            # Route B shadow project: the relay reports App scans under this name
            # instead of the real repo, keeping self-hosted scans in a separate
            # Semgrep project from SMS for comparison. Unset at cutover.
            - name: SEMGREP_SHADOW_PROJECT
              value: {{ .Values.semgrep.shadowProject | quote }}
            {{- end }}
            {{- if .Values.goosecracker.tiers }}
            - name: GOOSECRACKER_TIERS
              value: {{ .Values.goosecracker.tiers | toJson | quote }}
            {{- end }}
            {{- if .Values.goosecracker.progressUrl }}
            - name: GOOSECRACKER_PROGRESS_URL
              value: {{ .Values.goosecracker.progressUrl | quote }}
            {{- end }}
            {{- if .Values.goosecracker.steeringUrl }}
            - name: GOOSECRACKER_STEERING_URL
              value: {{ .Values.goosecracker.steeringUrl | quote }}
            {{- end }}
            {{- if .Values.goosecracker.gitMirror }}
            - name: GOOSECRACKER_GIT_MIRROR
              value: {{ .Values.goosecracker.gitMirror | quote }}
            {{- end }}
            {{- if .Values.goosecracker.tiers }}
            # Egress secret-swap CA public cert (ADR 023 6b). The fc-invoke egress
            # proxy TLS-terminates swapped hosts with a leaf minted from this CA;
            # the guest must trust it. Only the fc-invoke daemon can inject env at
            # boot, but the guest env is orchestrator-owned (carried in the
            # AgentRequest), so the monolith reads the public cert here and the
            # goosecracker runner injects it into every tier's guest env. Same
            # namespace as the substrate release; optional so the monolith still
            # starts before the CA Secret exists (the swap is inert until then).
            - name: EGRESS_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: fc-invoke-egress-ca
                  key: tls.crt
                  optional: true
            {{- end }}
            {{- if .Values.chat.enabled }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-chat-secrets
                  key: DISCORD_BOT_TOKEN
            - name: LLAMA_CPP_URL
              value: {{ .Values.chat.llamaCppUrl | quote }}
            # Pinned OpenRouter model for household (WhatsApp) content generation.
            # The in-monolith concierge reply and the WhatsApp chat agent read this;
            # the goose guest model is carried in the GOOSECRACKER_TIERS env instead.
            - name: HOUSEHOLD_LLM_MODEL
              value: {{ .Values.whatsapp.model | quote }}
            # Gate the WhatsApp heavy-agent path (goose household dispatch for
            # charts/artifacts/full tasks). Off -> a heavy request gets the "not
            # wired up yet" reply; on -> it dispatches the household goose agent.
            - name: WHATSAPP_AGENT_ENABLED
              value: {{ .Values.whatsapp.agentEnabled | quote }}
            - name: EMBEDDING_URL
              value: {{ .Values.chat.embeddingUrl | quote }}
            - name: SEARXNG_URL
              value: {{ .Values.chat.searxngUrl | quote }}
            {{- if .Values.chat.changelogs }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-chat-secrets
                  key: GITHUB_TOKEN
            - name: CHANGELOG_CONFIGS
              value: {{ .Values.chat.changelogs | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.gardener.enabled }}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-gardener
                  key: CLAUDE_AUTH_TOKEN
            {{- end }}
            {{- if .Values.semgrep.onepassword.itemPath }}
            # Semgrep AppSec Platform token for the Route B CI-reporting relay
            # (semgrep_scan/report.py). The 1Password item's SEMGREP_API_TOKEN
            # field is exposed under the env name pysemgrep reads,
            # SEMGREP_APP_TOKEN.
            - name: SEMGREP_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-semgrep-app
                  key: SEMGREP_API_TOKEN
            # HMAC secret for the GitHub PR webhook (semgrep_scan/router.py, Phase
            # 2). GitHub signs the request body with it; the handler fails closed
            # if it is unset. Lives in the SAME semgrep vault item as the App token
            # (field GITHUB_SEMGREP_WEBHOOK_SECRET), mirrored into this Secret; Joe
            # sets the identical value in the GitHub hook config. Optional so an
            # older vault item without the field does not block the pod (the
            # webhook then 401s every request, which is the fail-closed default).
            - name: GITHUB_SEMGREP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-semgrep-app
                  key: GITHUB_SEMGREP_WEBHOOK_SECRET
                  optional: true
            # HMAC secret for the Semgrep AppSec Platform scan webhook
            # (semgrep_scan/perf_webhook.py). Semgrep signs the body with it
            # (X-Semgrep-Signature-256) so we capture every managed scan's
            # runtime findings-independently. Same semgrep vault item, field
            # SEMGREP_WEBHOOK_SECRET; Joe sets the identical value in the Semgrep
            # webhook config. Optional so an older vault item without the field
            # does not block the pod (the webhook then 401s, the fail-closed
            # default).
            - name: SEMGREP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-semgrep-app
                  key: SEMGREP_WEBHOOK_SECRET
                  optional: true
            {{- if .Values.chat.enabled }}
            # Real GitHub API token for the webhook's changed-file fetch. The
            # monolith's own GITHUB_TOKEN env is a kloak: placeholder (guest
            # egress swap), useless for a direct API call, so we wire the REAL
            # token (monolith-chat-secrets key GITHUB_TOKEN, the same one
            # git-mirror uses) under a distinct env name the webhook reads.
            - name: GITHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-chat-secrets
                  key: GITHUB_TOKEN
            {{- end }}
            {{- end }}
            {{- if .Values.whatsapp.enabled }}
            # WhatsApp inbound bearer token (ADR 039 spec section 2). The monolith
            # validates the gateway's forwarded requests against it; the same
            # 1Password-managed Secret injects it into the gateway (the caller).
            - name: WHATSAPP_INBOUND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-whatsapp
                  key: WHATSAPP_INBOUND_TOKEN
            # Household calendar scheduling (ADR 039 spec 5b). The OAuth credential
            # for live create-event lives in the same whatsapp 1Password Secret;
            # marked optional so the pod is not blocked when the fields are absent
            # (the capability then drafts events into the morning digest instead).
            - name: GOOGLE_CALENDAR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-whatsapp
                  key: GOOGLE_CALENDAR_CLIENT_ID
                  optional: true
            - name: GOOGLE_CALENDAR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-whatsapp
                  key: GOOGLE_CALENDAR_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_CALENDAR_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-whatsapp
                  key: GOOGLE_CALENDAR_REFRESH_TOKEN
                  optional: true
            - name: GOOGLE_CALENDAR_ID
              value: {{ .Values.whatsapp.calendar.calendarId | quote }}
            - name: WHATSAPP_TZ
              value: {{ .Values.whatsapp.calendar.tz | quote }}
            {{- end }}
            {{- if .Values.knowledge.enabled }}
            {{- if .Values.knowledge.gaps.rewriteDiscardable }}
            - name: KNOWLEDGE_GAPS_REWRITE_DISCARDABLE
              value: "1"
            {{- end }}
            - name: KNOWLEDGE_LAYOUT_SCALING_RATIO
              value: {{ .Values.knowledge.layout.scalingRatio | quote }}
            - name: KNOWLEDGE_LAYOUT_GRAVITY
              value: {{ .Values.knowledge.layout.gravity | quote }}
            - name: KNOWLEDGE_LAYOUT_MAX_ITER
              value: {{ .Values.knowledge.layout.maxIter | quote }}
            - name: KNOWLEDGE_LAYOUT_LINLOG
              value: {{ .Values.knowledge.layout.linlog | quote }}
            - name: KNOWLEDGE_LAYOUT_CORE_FRACTION
              value: {{ .Values.knowledge.layout.coreFraction | quote }}
            - name: KNOWLEDGE_LAYOUT_NODE_SIZE_SCALE
              value: {{ .Values.knowledge.layout.nodeSizeScale | quote }}
            - name: KNOWLEDGE_LAYOUT_SEED
              value: {{ .Values.knowledge.layout.seed | quote }}
            {{- end }}
            {{- if and .Values.agent .Values.agent.discord }}
            - name: MONOLITH_AGENT_DISCORD_DEFAULT_SERVER_ID
              value: {{ .Values.agent.discord.defaultServerId | quote }}
            - name: MONOLITH_AGENT_DISCORD_DEFAULT_CHANNEL_ID
              value: {{ .Values.agent.discord.defaultChannelId | quote }}
            # Owner allowlist for /goosecracker (ADR 024 Task 4). Synced from the
            # discord-bot 1Password item into monolith-chat-secrets (alongside the
            # bot token); the gate fails closed if absent. Sourced from the secret
            # rather than a plain value so it is managed in one place with the bot
            # credentials.
            - name: OWNER_DISCORD_USER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-chat-secrets
                  key: OWNER_DISCORD_USER_ID
            - name: SIGNOZ_URL
              value: {{ .Values.agent.signoz.url | quote }}
            # SIGNOZ_API_KEY authenticates the dashboard's firing-alerts fetch.
            # The signoz-api-key Secret is cloned from the signoz namespace by
            # Kyverno; optional so a not-yet-cloned key degrades to an
            # unauthenticated 401 (the prior behaviour) rather than wedging pod
            # startup on a missing secret.
            - name: SIGNOZ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: signoz-api-key
                  key: api-key
                  optional: true
            {{- end }}
            {{- if .Values.stars }}
            - name: SEAWEEDFS_S3_ENDPOINT
              value: {{ .Values.stars.seaweedfsS3Endpoint | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ .Values.stars.s3AccessKeyId | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ .Values.stars.s3SecretAccessKey | quote }}
            - name: STARS_GRID_S3_BUCKET
              value: {{ .Values.stars.gridBucket | quote }}
            - name: STARS_GRID_S3_KEY
              value: {{ .Values.stars.gridKey | quote }}
            - name: STARS_CLIMATOLOGY_S3_KEY
              value: {{ .Values.stars.climatologyKey | quote }}
            {{- if .Values.chat }}
            # Chat attachment blob store reuses the shared SeaweedFS S3 endpoint/
            # creds above (emitted under the stars block, which is always set).
            - name: CHAT_BLOB_S3_BUCKET
              value: {{ .Values.chat.blobBucket | quote }}
            {{- end }}
            {{- if .Values.artifact }}
            # goosecracker artifact store (ADR 024) reuses the shared SeaweedFS S3
            # endpoint/creds above. The full monolith mediates artifact writes
            # (the agent guest holds no S3 credential); ARTIFACT_PUBLIC_BASE is the
            # origin the publish response returns the artifact URL on.
            - name: ARTIFACTS_S3_BUCKET
              value: {{ .Values.artifact.bucket | quote }}
            - name: ARTIFACT_PUBLIC_BASE
              value: {{ .Values.artifact.publicBase | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.grimoire.enabled }}
            # Grimoire D&D ingest pipeline (private tier only; spec
            # the grimoire pg-first design, section 4.3). The S3
            # endpoint/creds the loader reads (SEAWEEDFS_S3_ENDPOINT,
            # S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY) are the shared SeaweedFS
            # ones emitted under the stars block above (always set). Only the
            # OpenRouter key and grimoire-specific config are added here.
            # OPENROUTER_API_KEY is synced from the "openrouter" 1Password item
            # into the {{ include "monolith.fullname" . }}-openrouter Secret; the
            # extract job skips cleanly if it is absent.
            {{- if not .Values.orchestrator.enabled }}
            # Only declared when the orchestrator block below is not already
            # declaring OPENROUTER_API_KEY (from the goosecracker Secret).
            # Declaring the same env name twice makes the API server collapse
            # the duplicate on apply, so ArgoCD renders two entries but reads
            # back one: the Deployment is then permanently OutOfSync.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-openrouter
                  key: OPENROUTER_API_KEY
                  # Optional: the Secret only exists once the "openrouter"
                  # 1Password item is created; the pod must not be blocked on it
                  # (the extract job already skips cleanly when the key is unset).
                  optional: true
            {{- end }}
            - name: GRIMOIRE_S3_BUCKET
              value: {{ .Values.grimoire.s3Bucket | quote }}
            - name: GRIMOIRE_EXTRACT_MODEL
              value: {{ .Values.grimoire.extractModel | quote }}
            {{- if .Values.grimoire.extractBaseUrl }}
            - name: GRIMOIRE_EXTRACT_BASE_URL
              value: {{ .Values.grimoire.extractBaseUrl | quote }}
            {{- end }}
            {{- if .Values.grimoire.extractLimit }}
            - name: GRIMOIRE_EXTRACT_LIMIT
              value: {{ .Values.grimoire.extractLimit | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.orchestrator.enabled }}
            # ADR 036 orchestrator brief compiler (host-side only; the guest
            # egress boundary in ADR 023 never carries these keys). Both keys are
            # sourced from the same "goosecracker" 1Password item that already
            # syncs into the "goosecracker" Secret for the artifact egress
            # sidecar (see onepassworditem-goosecracker.yaml). We reuse that
            # Secret rather than sync the item twice; the field names match the
            # conventions the goosecracker item exposes. Note the Secret is named
            # "goosecracker" (not fullname-prefixed).
            # ORCHESTRATOR_API_KEY drives the PRIMARY provider; the Secret field it
            # reads is set by orchestrator.apiKeySecretKey (e.g. NVIDIA_API_KEY for
            # Nemotron). The client falls back to OPENROUTER_API_KEY if absent.
            - name: ORCHESTRATOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: goosecracker
                  key: {{ .Values.orchestrator.apiKeySecretKey | quote }}
                  # Optional: the client walks the fallback chain (and ultimately
                  # fails open) when the key is absent.
                  optional: true
            # OPENROUTER_API_KEY drives the DeepSeek fallback tier (referenced by
            # apiKeyEnv in the ORCHESTRATOR_FALLBACKS chain).
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: goosecracker
                  key: OPENROUTER_API_KEY
                  # Optional: the Secret only exists once the goosecracker
                  # 1Password item is created; the client fails open
                  # (OrchestratorUnavailable) when the key is absent.
                  optional: true
            - name: ORCHESTRATOR_MODEL
              value: {{ .Values.orchestrator.model | quote }}
            - name: ORCHESTRATOR_BASE_URL
              value: {{ .Values.orchestrator.baseUrl | quote }}
            {{- if .Values.orchestrator.fallbacks }}
            # Ordered fallback chain (JSON): each entry is {model, base_url,
            # api_key_env}. The client tries the primary, then these in order.
            - name: ORCHESTRATOR_FALLBACKS
              value: {{ .Values.orchestrator.fallbacks | toJson | quote }}
            {{- end }}
            - name: ORCHESTRATOR_TIMEOUT_S
              value: {{ .Values.orchestrator.timeoutSeconds | quote }}
            - name: ORCHESTRATOR_REPLAN_TIMEOUT_S
              value: {{ .Values.orchestrator.replanTimeoutSeconds | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            # K8s default `timeoutSeconds: 1` is unreasonable for a
            # Python web server: any GC pause or kernel-scheduler hiccup
            # trips it. 5s is conservative for /healthz, which is a
            # synchronous handler returning a static dict (no DB, no
            # work). 6 failures in a row (60s) before restart absorbs
            # transient event-loop blips without losing the ability to
            # recover a genuinely wedged process.
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}@{{ .Values.frontend.image.digest }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: API_BASE
              value: "http://localhost:8000"
            - name: OTEL_COLLECTOR_HTTP_URL
              value: {{ .Values.frontend.otelCollectorUrl | quote }}
            {{- if .Values.imgproxySigning.enabled }}
            # HMAC secret for signing /img imgproxy URLs (grimoire reader
            # illustrations). Optional: a missing Secret degrades to unsigned
            # dev-only URLs in $lib/server/grimoire-img.js, never a crash.
            - name: IMGPROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-imgproxy-signing
                  key: IMGPROXY_KEY
                  optional: true
            - name: IMGPROXY_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-imgproxy-signing
                  key: IMGPROXY_SALT
                  optional: true
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
