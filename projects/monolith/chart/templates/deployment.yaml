apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monolith.fullname" . }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "monolith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "monolith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations: {}
    spec:
      serviceAccountName: {{ include "monolith.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-pg-app
                  key: uri
            {{- if .Values.onepassword.enabled }}
            - name: ICAL_FEED_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-secrets
                  key: ICAL_FEED_URL
            {{- end }}
            {{- if .Values.backend.vaultApiUrl }}
            - name: VAULT_API_URL
              value: {{ .Values.backend.vaultApiUrl | quote }}
            {{- end }}
            {{- if .Values.backend.clickhouseUrl }}
            - name: CLICKHOUSE_URL
              value: {{ .Values.backend.clickhouseUrl | quote }}
            {{- end }}
            {{- if .Values.clickhouse.onepassword.itemPath }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-clickhouse
                  key: USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-clickhouse
                  key: PASSWORD
            {{- end }}
            - name: FRONTEND_HEALTH_URL
              value: "http://localhost:3000/"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.backend.otelEndpoint | quote }}
            {{- if .Values.chat.enabled }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-chat-secrets
                  key: DISCORD_BOT_TOKEN
            - name: LLAMA_CPP_URL
              value: {{ .Values.chat.llamaCppUrl | quote }}
            - name: EMBEDDING_URL
              value: {{ .Values.chat.embeddingUrl | quote }}
            - name: SEARXNG_URL
              value: {{ .Values.chat.searxngUrl | quote }}
            {{- if .Values.chat.changelogs }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-chat-secrets
                  key: GITHUB_TOKEN
            - name: CHANGELOG_CONFIGS
              value: {{ .Values.chat.changelogs | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.gardener.enabled }}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-gardener
                  key: CLAUDE_AUTH_TOKEN
            {{- end }}
            {{- if .Values.knowledge.enabled }}
            - name: VAULT_ROOT
              value: {{ .Values.knowledge.vault.mountPath }}
            {{- if .Values.knowledge.gaps.rewriteDiscardable }}
            - name: KNOWLEDGE_GAPS_REWRITE_DISCARDABLE
              value: "1"
            {{- end }}
            - name: KNOWLEDGE_LAYOUT_SCALING_RATIO
              value: {{ .Values.knowledge.layout.scalingRatio | quote }}
            - name: KNOWLEDGE_LAYOUT_GRAVITY
              value: {{ .Values.knowledge.layout.gravity | quote }}
            - name: KNOWLEDGE_LAYOUT_MAX_ITER
              value: {{ .Values.knowledge.layout.maxIter | quote }}
            - name: KNOWLEDGE_LAYOUT_LINLOG
              value: {{ .Values.knowledge.layout.linlog | quote }}
            - name: KNOWLEDGE_LAYOUT_CORE_FRACTION
              value: {{ .Values.knowledge.layout.coreFraction | quote }}
            - name: KNOWLEDGE_LAYOUT_NODE_SIZE_SCALE
              value: {{ .Values.knowledge.layout.nodeSizeScale | quote }}
            - name: KNOWLEDGE_LAYOUT_SEED
              value: {{ .Values.knowledge.layout.seed | quote }}
            {{- if .Values.knowledge.gitRemote }}
            - name: VAULT_GIT_REMOTE
              value: {{ .Values.knowledge.gitRemote | quote }}
            - name: USER
              value: "vault-backup"
            - name: GIT_AUTHOR_NAME
              value: "vault-backup"
            - name: GIT_AUTHOR_EMAIL
              value: "vault-backup@monolith.local"
            - name: GIT_COMMITTER_NAME
              value: "vault-backup"
            - name: GIT_COMMITTER_EMAIL
              value: "vault-backup@monolith.local"
            {{- end }}
            {{- end }}
            {{- if and .Values.agent .Values.agent.discord }}
            - name: MONOLITH_AGENT_DISCORD_DEFAULT_SERVER_ID
              value: {{ .Values.agent.discord.defaultServerId | quote }}
            - name: MONOLITH_AGENT_DISCORD_DEFAULT_CHANNEL_ID
              value: {{ .Values.agent.discord.defaultChannelId | quote }}
            - name: MONOLITH_AGENT_DISCORD_ALLOWED_CHANNEL_IDS
              value: {{ join "," .Values.agent.discord.allowedChannelIds | quote }}
            - name: SIGNOZ_URL
              value: {{ .Values.agent.signoz.url | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            # K8s default `timeoutSeconds: 1` is unreasonable for a
            # Python web server: any GC pause or kernel-scheduler hiccup
            # trips it. 5s is conservative for /healthz, which is a
            # synchronous handler returning a static dict (no DB, no
            # work). 6 failures in a row (60s) before restart absorbs
            # transient event-loop blips without losing the ability to
            # recover a genuinely wedged process.
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          {{- if .Values.knowledge.enabled }}
          volumeMounts:
            # Writable: the backend reconciler injects generated
            # `id:` frontmatter into notes that lack one so future
            # reconcile cycles have stable graph identity. The
            # obsidian headless-sync sidecar observes those writes
            # and propagates them through Obsidian's cloud sync,
            # so the backend + sidecar are coordinated writers
            # rather than racing writers.
            - name: vault
              mountPath: {{ .Values.knowledge.vault.mountPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- if .Values.knowledge.enabled }}
        - name: obsidian
          image: "{{ .Values.knowledge.headlessSync.image.repository }}:{{ .Values.knowledge.headlessSync.image.tag }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: VAULT_PATH
              value: {{ .Values.knowledge.vault.mountPath }}
            - name: VAULT_NAME
              value: {{ .Values.knowledge.headlessSync.vaultName | quote }}
            - name: OBSIDIAN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-knowledge
                  key: email
            - name: OBSIDIAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "monolith.fullname" . }}-knowledge
                  key: password
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.knowledge.vault.mountPath }}
          resources:
            {{- toYaml .Values.knowledge.resources.headlessSync | nindent 12 }}
        {{- end }}
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: API_BASE
              value: "http://localhost:8000"
            - name: OTEL_COLLECTOR_HTTP_URL
              value: {{ .Values.frontend.otelCollectorUrl | quote }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- if .Values.knowledge.enabled }}
      volumes:
        - name: vault
          emptyDir:
            sizeLimit: {{ .Values.knowledge.vault.sizeLimit }}
      {{- end }}
