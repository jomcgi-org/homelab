{{- if .Values.postgres.devRefresh.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: cnpg-dev-refresh
  namespace: {{ .Values.jobs.workflowNamespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
    app.kubernetes.io/component: cron-job
spec:
  schedules:
    - {{ .Values.postgres.devRefresh.cron | quote }}
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowSpec:
    entrypoint: refresh
    serviceAccountName: argo-workflow
    # concurrencyPolicy: Forbid above means a hung run blocks every later one,
    # so the run needs its own ceiling or one stuck dump silently ends the
    # nightly refresh and dev quietly goes stale. An hour is far above the
    # observed shape of the work (the database is under 2 GB).
    activeDeadlineSeconds: 3600
    # Without these this workflow reaped NOTHING, ever. Unlike the CronWorkflows
    # in cronworkflows.yaml it declared neither, so every failed run left its
    # Workflow and its pod behind permanently: a run from 2026-08-12 was still
    # sitting in the namespace on 2026-08-15, alongside one per night since.
    # failedJobsHistoryLimit above does not cover this; it caps the CronWorkflow's
    # own child history, not the pods, and it is not what was leaking.
    #
    # Same values as cronworkflows.yaml so the two agree: a failure stays
    # readable for a day, which is what made the recovery-conflict cause above
    # recoverable at all, and a success is cleaned up promptly.
    ttlStrategy:
      secondsAfterCompletion: 3600
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    podGC:
      strategy: OnWorkflowSuccess
    volumes:
      - name: dev-refresh-script
        configMap:
          name: cnpg-dev-refresh-script
          # sh reads the script as an argument, so read permission is all that
          # is strictly required; the execute bit just keeps it runnable if the
          # invocation ever changes. Written 0555 so YAML reads it as octal.
          defaultMode: 0555
    templates:
      - name: refresh
        container:
          image: {{ .Values.postgres.devRefresh.refreshImage | quote }}
          # No args, and no -c. The script is a mounted file, so kubelet has
          # nothing to expand: $(VAR) substitution and the $$ escape apply only
          # to command, args and env values, never to file contents.
          command: ["/bin/sh", "-eu", "/scripts/dev-refresh.sh"]
          volumeMounts:
            - name: dev-refresh-script
              mountPath: /scripts
              readOnly: true
          # Declared rather than omitted, because a container with no requests
          # is BestEffort and is the first thing evicted under pressure. This
          # cluster is not roomy: node-1 sits at 91% of requestable memory, so
          # a BestEffort nightly job would be evicted exactly when the cluster
          # is busiest and the refresh would fail on the nights it is least
          # convenient to notice.
          #
          # Memory request equals limit per the repo's sizing convention, CPU
          # request only. ephemeral-storage is declared because the dump lands
          # on the pod filesystem at /tmp: the database is ~1.5 GB and pg_dump
          # custom format compresses, so 4Gi is generous, but an undeclared
          # ephemeral write is how a node fills its disk without any workload
          # appearing to ask for it.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 4Gi
            limits:
              memory: 512Mi
              ephemeral-storage: 4Gi
          env:
            # The PRIMARY, not monolith-pg-ro, and the -ro replica is what this
            # used to read. A standby cancels a query whose snapshot blocks WAL
            # replay, and pg_dump's COPY of knowledge.chunks is long enough to
            # hit that every single night:
            #
            #   pg_dump: error: Dumping the contents of table "chunks" failed
            #   ERROR: canceling statement due to conflict with recovery
            #   DETAIL: User query might have needed to see row versions that
            #           must be removed.
            #
            # It failed on the same table every run from at least 2026-08-12,
            # so it is deterministic rather than flaky, and it is silent: a
            # failed CronWorkflow pages nobody, so dev just served stale data.
            #
            # Dumping from the primary removes the failure mode outright rather
            # than tuning around it, because recovery conflicts only exist on a
            # standby. hot_standby_feedback and max_standby_streaming_delay
            # would each keep the read on the replica at the cost of bloat or
            # lag on the primary, and the delay knob is a guess that the
            # growing chunks table would eventually outrun again. The dump is
            # one short nightly read of a sub-2 GB database, so the read load
            # the replica was there to deflect does not justify either.
            - name: PROD_PGHOST
              value: monolith-pg-rw.monolith.svc.cluster.local
            # monolith-dev-pg-rw: the dev Application runs this chart under
            # releaseName `monolith-dev`, which it must, because the chart also
            # renders cluster-scoped RBAC that two Applications cannot both own.
            # So dev's resources carry a distinct prefix AND live in a distinct
            # namespace, and the guard above checks the host for `monolith-dev`.
            - name: DEV_PGHOST
              value: monolith-dev-pg-rw.monolith-dev.svc.cluster.local
            - name: DUMP_ROLE
              value: {{ .Values.postgres.devRefresh.role | quote }}
            - name: DUMP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.devRefresh.dumpReaderSecret }}
                  key: password
            - name: DEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.devRefresh.devAppSecret }}
                  key: password
{{- end }}
