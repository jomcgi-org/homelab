{{- if .Values.cfIngress.grimoire.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith.fullname" . }}-grimoire
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
    ingress-tier: {{ .Values.cfIngress.friends.tier }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.friends.gateway.name }}
      namespace: {{ .Values.cfIngress.friends.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.friends.hostname | quote }}
  rules:
    # Keep compiled assets on this SAME route and SecurityPolicy. The OIDC
    # filter decrypts the app's cookies before JWT checks, including when both
    # friends apps have sessions. Rewrite only the asset prefix for sirv.
    - matches:
        - path:
            type: PathPrefix
            value: /grimoire/_app
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /_app
        # Browser caching is fine; an edge/shared cache must not bypass auth.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cloudflare-CDN-Cache-Control
                value: no-store
              - name: Cache-Control
                value: private, no-cache
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.friends.servicePort | int }}
    {{- if .Values.cfIngress.grimoire.browserUi.enabled }}
    # The client-only UI (projects/monolith/web/grimoire). It is static files
    # served by the API port, and its browser code calls the API directly.
    #
    # These rules sit on THIS route so the SecurityPolicy below gates every
    # byte: the OIDC filter decrypts the session cookie and the JWT check
    # verifies it before anything is forwarded.
    #
    # The API is routed by an explicit list, never as /api/grimoire wholesale.
    # Library reads such as /api/grimoire/books carry no identity check of
    # their own, so they must stay unreachable here. The list is pinned to
    # grimoire/browser_lane.py by chart/grimoire_browser_lane_test.py, and
    # grimoire/browser_lane_test.py proves every listed route enforces the
    # Grimoire identity.
    {{- range .Values.cfIngress.grimoire.browserUi.apiPrefixes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . | quote }}
      filters:
        # Campaign data is per viewer. No cache, shared or private, may keep it.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cloudflare-CDN-Cache-Control
                value: no-store
              - name: Cache-Control
                value: private, no-store
      backendRefs:
        - name: {{ include "monolith.fullname" $ }}
          port: {{ $.Values.service.apiPort | int }}
    {{- end }}
    # The app shell and its hashed assets. The API port sets their cache and
    # security headers itself (grimoire/web.py). A longer prefix outranks the
    # /grimoire rule below, so the Svelte UI keeps every other path.
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.cfIngress.grimoire.browserUi.path | quote }}
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
    {{- end }}
    # The Svelte BFF serves every other page on this lane.
    - matches:
        - path:
            type: PathPrefix
            value: /grimoire
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.friends.servicePort | int }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "monolith.fullname" . }}-grimoire
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "monolith.fullname" . }}-grimoire
  oidc:
    provider:
      issuer: {{ .Values.cfIngress.grimoire.issuer | quote }}
    clientID: {{ .Values.cfIngress.grimoire.clientID | quote }}
    clientSecret:
      name: {{ .Values.cfIngress.grimoire.clientSecretName | quote }}
    redirectURL: {{ printf "https://%s/grimoire/oauth2/callback" .Values.cfIngress.friends.hostname | quote }}
    logoutPath: /grimoire/oauth2/logout
    cookieDomain: {{ .Values.cfIngress.friends.hostname | quote }}
    cookieNames:
      accessToken: grimoire-access-token
      idToken: grimoire-id-token
    # offline_access is the only scope authentik issues a refresh token for.
    # Envoy then renews expired tokens in place, so a session outlives the
    # one-hour access token without a login redirect.
    scopes: [email, profile, offline_access]
    refreshToken: true
    # A fetch that cannot be renewed gets a 401 instead of a cross-origin
    # redirect to authentik, which the browser can only report as a network
    # error. Page navigations send "navigate" and still go to the login page.
    denyRedirect:
      headers:
        # type is the CRD default, spelled out so the live object never drifts.
        - name: sec-fetch-mode
          type: Exact
          value: cors
  jwt:
    providers:
      - name: grimoire
        issuer: {{ .Values.cfIngress.grimoire.issuer | quote }}
        audiences: [{{ .Values.cfIngress.grimoire.clientID | quote }}]
        remoteJWKS:
          uri: {{ .Values.cfIngress.grimoire.jwksUri | quote }}
        extractFrom:
          cookies: [grimoire-id-token]
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.cfIngress.grimoire.clientSecretName | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  itemPath: {{ .Values.cfIngress.grimoire.onepasswordItemPath | quote }}
---
# Only this self-contained capability landing is anonymous. The token is in a
# URL fragment, then an HttpOnly cookie; the API and /join/accept remain gated.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith.fullname" . }}-grimoire-invitation
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.friends.gateway.name }}
      namespace: {{ .Values.cfIngress.friends.gateway.namespace }}
  hostnames: [{{ .Values.cfIngress.friends.hostname | quote }}]
  rules:
    - matches:
        - path:
            type: Exact
            value: /grimoire/join
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.friends.servicePort | int }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "monolith.fullname" . }}-grimoire-invitation
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "monolith.fullname" . }}-grimoire-invitation
  rateLimit:
    local:
      rules:
        - limit:
            requests: 30
            unit: Minute
{{- if .Values.platformAuth.enrollmentEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith.fullname" . }}-platform-registration
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.friends.gateway.name }}
      namespace: {{ .Values.cfIngress.friends.gateway.namespace }}
  hostnames: [{{ .Values.cfIngress.friends.hostname | quote }}]
  rules:
    - matches:
        - path:
            type: Exact
            value: /register
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.friends.servicePort | int }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "monolith.fullname" . }}-platform-registration
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "monolith.fullname" . }}-platform-registration
  rateLimit:
    local:
      rules:
        - limit:
            requests: 30
            unit: Minute
{{- end }}
{{- end }}
