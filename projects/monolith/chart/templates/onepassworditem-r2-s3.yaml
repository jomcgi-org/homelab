{{- /* sharedS3 gate validation: sharedS3 must be a map holding a boolean
       enabled flag. Omitted overrides inherit the chart default (true);
       explicit null or non-boolean values fail here so a typo cannot
       silently flip storage configuration. */ -}}
{{- if not (kindIs "map" .Values.sharedS3) }}
{{- fail "sharedS3 must be a map with boolean field enabled" }}
{{- end }}
{{- if not (kindIs "bool" .Values.sharedS3.enabled) }}
{{- fail "sharedS3.enabled must be a boolean" }}
{{- end }}
{{- /* The outer sharedS3 guard runs first, so explicit false skips the nested
       producer condition without evaluating it. */ -}}
{{- if and .Values.sharedS3.enabled (or .Values.stars.s3SecretRefName .Values.stars.onepassword.itemPath) }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-r2-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.stars.onepassword.itemPath | quote }}
{{- end }}
