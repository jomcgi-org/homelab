{{- if .Values.cfIngress.public.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith.fullname" . }}-public
  labels:
    ingress-tier: {{ .Values.cfIngress.public.tier }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.public.gateway.name }}
      namespace: {{ .Values.cfIngress.public.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.public.hostname | quote }}
  rules:
    # SvelteKit client assets — pass through without rewriting
    - matches:
        - path:
            type: PathPrefix
            value: /_app/
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.public.servicePort | int }}
    # Public knowledge API — narrowly scoped to /api/knowledge/public/* so we
    # never expose the unfiltered /api/knowledge/{notes,gaps,dead-letter,…}
    # surface on the public hostname. The backend itself enforces the same
    # filter via knowledge.visibility.public_notes_filter; this is the
    # ingress-layer belt-and-braces.
    - matches:
        - path:
            type: PathPrefix
            value: /api/knowledge/public
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
    # Everything else — SvelteKit reroute hook maps to /public/ internally
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.public.servicePort | int }}
---
{{- $rlParams := dict
  "name" (printf "%s-public" (include "monolith.fullname" .))
  "rateLimit" .Values.cfIngress.public.rateLimit
}}
{{- include "cf-ingress.rate-limit" $rlParams }}
{{- end }}
