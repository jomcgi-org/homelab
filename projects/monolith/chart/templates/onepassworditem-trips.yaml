{{- if .Values.trips.onepassword.itemPath }}
# Static shared secret guarding POST /api/trips/ingest. The referenced
# 1Password item must expose a field labelled `TRIPS_INGEST_KEY` (the synced
# K8s Secret carries that key); the backend reads it as the env var of the same
# name. Without it the ingest endpoint fails closed (401 on every request).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-trips
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.trips.onepassword.itemPath | quote }}
{{- end }}
