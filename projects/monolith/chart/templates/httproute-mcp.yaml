{{- if .Values.cfIngress.mcp.enabled }}
{{- /*
Direct MCP routing and RFC 9728 discovery, staged default-off until #3832 flips
the hub value. No rewrite: the monolith serves /mcp natively. PrincipalMiddleware
verifies the bearer itself, so this route has no ingress-tier or SecurityPolicy.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ include "monolith.fullname" . }}-mcp-resource-metadata
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  directResponse:
    contentType: application/json
    statusCode: 200
    body:
      type: Inline
      inline: |
        {{- $meta := dict
              "resource" (printf "https://%s/mcp" .Values.cfIngress.mcp.hostname)
              "authorization_servers" (list .Values.cfIngress.mcp.authorizationServer)
              "bearer_methods_supported" (list "header")
              "scopes_supported" .Values.cfIngress.mcp.scopes }}
        {{ toJson $meta }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith.fullname" . }}-mcp
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.private.gateway.name }}
      namespace: {{ .Values.cfIngress.private.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.mcp.hostname | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ include "monolith.fullname" . }}-mcp-resource-metadata
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: WWW-Authenticate
                value: >-
                  Bearer resource_metadata="https://{{ .Values.cfIngress.mcp.hostname }}/.well-known/oauth-protected-resource/mcp"
      backendRefs:
        # Gateway API schema defaults, declared explicitly because this app
        # syncs with ServerSideApply=true and SSA diffs on field ownership;
        # an undeclared default is permanent phantom drift. See
        # cf-ingress-library/templates/_httproute.tpl for the full rationale.
        - group: ""
          kind: Service
          name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
          weight: 1
{{- end }}
