{{- if include "monolith.sttEnabled" . }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-grimoire-stt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ required "enabled transcription requires the approved OnePasswordItem path" .Values.grimoire.transcript.google.onepassword.itemPath | quote }}
{{- end }}
