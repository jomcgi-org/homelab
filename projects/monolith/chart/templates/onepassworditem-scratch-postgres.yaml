{{- if and .Values.scratchPostgres.enabled .Values.scratchPostgres.onepassword.itemPath }}
# Syncs the EmberVM scratch-postgres superuser password into a K8s Secret in the
# MONOLITH namespace (EmberVM R4, D-R4.PR-11.1). The scratch-postgres datastore
# runs in the embervm namespace, but the monolith needs the same password to
# build SCRATCH_POSTGRES_DSN; a K8s Secret cannot be read across namespaces, so
# the monolith syncs the SAME 1Password item into its own namespace. The item's
# field must land as a Secret key named exactly POSTGRES_PASSWORD.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-scratch-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.scratchPostgres.onepassword.itemPath | quote }}
{{- end }}
