{{- if and .Values.scratchPostgres.onepassword.itemPath (or .Values.scratchPostgres.enabled .Values.scratchPostgres.demoListenPort) }}
# Syncs the EmberVM scratch-postgres superuser password into a K8s Secret in the
# MONOLITH namespace (EmberVM R4, D-R4.PR-11.1). The stateful postgres workloads
# run in the embervm namespace, but the monolith needs the same password to
# build SCRATCH_POSTGRES_DSN / DEMO_POSTGRES_DSN; a K8s Secret cannot be read
# across namespaces, so the monolith syncs the SAME 1Password item into its own
# namespace. Rendered whenever either DSN is (demo-postgres reuses the scratch-
# postgres password), so the demo exhibit survives the scratch workload being
# disabled. The item's field must land as a Secret key named exactly
# POSTGRES_PASSWORD.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-scratch-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.scratchPostgres.onepassword.itemPath | quote }}
{{- end }}
