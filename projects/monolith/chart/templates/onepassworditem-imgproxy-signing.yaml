{{- if and .Values.imgproxySigning.enabled .Values.imgproxySigning.onepassword.itemPath }}
# imgproxy URL-signing secret for the private frontend (grimoire book reader
# images). Synced from the SAME 1Password item as monolith-public's imgproxy
# (trips-imgproxy-signing), so URLs signed here validate against the shared
# imgproxy deployment behind /img on both hostnames. The item's fields surface
# as Secret keys IMGPROXY_KEY / IMGPROXY_SALT; the frontend container reads
# them via secretKeyRef and signs server-side only ($lib/server/grimoire-img.js).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-imgproxy-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.imgproxySigning.onepassword.itemPath | quote }}
{{- end }}
