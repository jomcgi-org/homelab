apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monolith.fullname" . }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
rules:
  # Core read surface for the k8s-* debug MCP tools. No secrets, no pods/exec.
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "configmaps", "events", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # nodes/proxy lets the stats endpoint reach each kubelet's Summary API
  # (/stats/summary) for honest rssBytes memory usage, not just working set.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  # get/list for reads; patch triggers an ArgoCD sync via .operation.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
  # cd health reads Freight to learn which chart versions have been published.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["freights"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "monolith.fullname" . }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "monolith.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "monolith.fullname" . }}
    namespace: {{ .Release.Namespace }}
