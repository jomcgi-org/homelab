{{- /*
Allowlist ingress to the monolith app pod, so an in-cluster workload cannot
reach the API and forge the X-Auth-Email identity header.

Why ingress: here and not egressDeny. The sibling cilium-policy.yaml
deliberately uses egressDeny because it denies only what it names and so
cannot cause an outage by omission. This file makes the opposite trade on
purpose: ingress: makes the selected endpoint default-deny for ALL other
ingress, which is the only shape that actually closes header forgery from an
arbitrary pod. That is precisely why it is gated default-false and why the
allowlist below is exhaustive rather than illustrative. A caller omitted here
fails as a silent dial timeout, not a readable deny (see PR #4294).

The selector picks one pod carrying three containers. The monolith pod runs
backend (containerPort 8000, named api), progress-ingest (8091, named
progress) and frontend (3000, named http). One pod is one Cilium endpoint, so
an ingress rule default-denies all three ports at once. That is why a policy
about the API must also allowlist 3000 and 8091.

Service ports and container ports coincide here (3000, 8000, 8091), but the
rule is written against the pod ports on purpose. Cilium enforces policy after
service DNAT, so a rule naming a service port that differed from its
targetPort would silently fail to match.

fromEntities: [host, health] is mandatory, not optional. kubelet probes
originate from the node. Once any ingress rule selects the endpoint it becomes
default-deny and the pod never goes Ready without this. The backend has a
readiness probe on api every 5s and liveness every 10s; progress-ingest has
liveness on progress every 20s.

Provenance of each allowlist entry:
  - envoy-gateway-system to 3000 AND 8000, NARROWED to the envoy proxy pods
    (#4660): the monolith-private HTTPRoute has backendRefs to both
    monolith:3000 and monolith:8000, and monolith-github-webhook routes to
    monolith:8000. The 8000 entry is easy to miss because the private console
    reaches the backend over API_BASE=http://localhost:8000 (same pod, so it
    never crosses a Cilium boundary) and short Hubble windows therefore show no
    gateway traffic to 8000 at all.

    The namespace itself is NOT the selector. It also holds four cloudflared
    pods and the gateway control plane, neither of which has a legitimate path
    to this pod: cloudflared's only origin is the envoy service on :80
    (cloudflare-gateway values-prod catchAll), and the control plane only
    watches the API server. A direct cloudflared-to-monolith grant would buy
    nothing and cost something specific: X-Auth-Email stripping runs at the
    envoy LISTENER (the gateway-wide ClientTrafficPolicy), so a direct
    pod-to-port path bypasses HTTPRoute routing AND that strip.
  - mcp to 8000, NARROWED to Context Forge's gateway Deployment (#4660):
    federation runs gateway -> monolith API (observed live; the monolith
    registration lives in CF's Postgres, projects/mcp/ARCHITECTURE.md). The
    rest of the namespace (CF's redis, its postgres, the cron jobs) has no
    reason to dial this pod and now gets nothing.
  - jobs.workflowNamespace to 8000, RESTRICTED to this chart's own job pods:
    Argo Workflows POST to MONOLITH_INTERNAL_URL
    (http://monolith.monolith.svc.cluster.local:8000), set in chart/values.yaml.
    These are periodic and short-lived, so they do not appear in a short Hubble
    window; they come from config, not observation.

    The namespace is NOT enough on its own. renovate deploys into the same
    namespace (projects/platform/renovate/application.yaml), and it is a large
    third-party executor that processes untrusted registry and dependency
    metadata while holding a GitHub token, which makes it a more plausible
    forger than anything this policy was originally aimed at. Of the 35
    CronWorkflows in that namespace, 33 belong to this release and the only two
    that do not are renovate's.

    So the rule also matches app.kubernetes.io/part-of: <release>-jobs, which
    cronworkflows.yaml stamps onto the job pods via workflowSpec.podMetadata.
    Label and selector are rendered by the same chart and cannot drift apart.
    The namespace itself comes from .Values.jobs.workflowNamespace rather than a
    literal, for the same reason: a literal would leave the grant behind if that
    value ever moved, and every cron POST would die as a silent dial timeout.
  - monolith component: whatsapp to 8000: the whatsapp gateway posts to
    whatsapp.monolithInboundUrl, which is .../8000/internal/whatsapp/inbound.
    Selected by pod label rather than by opening the whole namespace.
  - embervm to 8091: the guest egress-proxy sidecar in the noded brick pods
    forwards guest progress to /ingest/progress.

What this does NOT close, and what was already closed. EmberVM session guests
were the originally suspected forger and they are not one: a task/session claim
boots with no NIC at all (projects/embervm/noded/fcvm/driver/driver.go:971,
vsock only), and their single channel is the egress proxy, which runs
internal.default: deny with a two-entry allowlist that deliberately excludes
port 8000. This policy is about any OTHER in-cluster workload. Also note that
as of today no handler authorizes on X-Auth-Email: the only consumer is
agent_sessions/router.py, which records it as the triggered_by attribution
column. So this is insurance taken out before the preview authorization work
starts keying on that header, not a fix for a live privilege escalation.

Before flipping the gate, confirm the allowlist against live traffic with
`hubble observe --to-namespace monolith --last 500`, remembering that periodic
callers (Argo workflows, the hourly jobs) will not show up in a short window.
*/}}
{{- if .Values.ciliumPolicy.ingress.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-ingress
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  description: >-
    Allowlist ingress to the monolith app pod. Defence in depth for the
    X-Auth-Email identity header: it removes most of the cluster from the set
    that can reach the API, but the named sources can still send the header, so
    nothing may authorize on it without verifying the JWT in the handler.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: monolith
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  ingress:
    # Pod-scoped on purpose (#4660), and the one grant here that can break by
    # surprise. The labels below are stamped on the managed proxy pods by Envoy
    # Gateway itself (upstream v1.8.3,
    # internal/infrastructure/kubernetes/proxy/resource.go, EnvoyAppLabel():
    # name=envoy, component=proxy, managed-by=envoy-gateway), not by a chart
    # this repo renders, so unlike the workflows rule below, selector and
    # labels CAN drift apart across an envoy-gateway upgrade. If that happens,
    # every route through the gateway dies as a silent dial timeout.
    #
    # The #4659 alert that caught this on policy-denied ingress drops was a
    # SigNoz alert, removed with SigNoz (#5362), so the failure is silent again
    # until the replacement monitoring lands. Rollback: revert the two
    # app.kubernetes.io label keys, which restores the namespace-wide grant
    # until the relabel is understood.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # Context Forge's gateway pod only (issue #4660). The app label is stamped
    # by the bundled mcp-stack subchart as `app: <fullname>-mcpgateway`, with
    # fullname `<releaseName>-mcp-stack`; it is carried in values rather than
    # inlined here because it names a pod THIS chart does not render, and a
    # release rename must be a values change, not a template edit.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mcp
            app: {{ .Values.ciliumPolicy.ingress.mcpGatewayPodLabel }}
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.jobs.workflowNamespace }}
            app.kubernetes.io/part-of: {{ .Release.Name }}-jobs
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: monolith
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: whatsapp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: embervm
      toPorts:
        - ports:
            - port: "8091"
              protocol: TCP
    # The EmberVM shotter workload renders the private tier to a screenshot so
    # agents can see what is deployed (ADR embervm/035). Separate rule from the
    # 8091 progress-ingest grant above because a Cilium toPorts entry is per
    # port, so that rule does NOT admit 3000, and a caller omitted here fails as
    # a SILENT DIAL TIMEOUT rather than a readable deny (PR #4294). The SSR port
    # only; the main API on 8000 stays closed to embervm.
    #
    # This grants the embervm namespace read access to private-tier pages. What
    # bounds it is not this rule but the allowlist baked into the shotter guest
    # image, which is the primary control (ADR embervm/035 section 4); no other
    # embervm guest has a reason to dial 3000, and none has a proxy that would
    # let a rendered page do so.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: embervm
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - host
        - health
{{- end }}
