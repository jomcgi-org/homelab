{{- if and .Values.grimoire.enabled .Values.grimoire.onepassword.itemPath }}
# OpenRouter API key for the grimoire entity-extraction job (spec #4.3). Synced
# from the 1Password item named by grimoire.onepassword.itemPath (item
# "openrouter" in vault k8s-homelab) into the {{ include "monolith.fullname" . }}-openrouter
# Secret. The deployment reads it as OPENROUTER_API_KEY via secretKeyRef, and
# grimoire_extract_entities skips its run cleanly if the key is absent. The
# 1Password item must expose a field labelled "OPENROUTER_API_KEY" (matching the
# goosecracker item's field convention: see projects/firecracker/substrate).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-openrouter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.grimoire.onepassword.itemPath | quote }}
{{- end }}
