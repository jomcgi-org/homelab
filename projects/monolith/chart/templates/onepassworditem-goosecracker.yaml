{{- if .Values.goosecracker.enabled }}
# Shared model-provider credentials for the orchestrator and extraction jobs.
# The Secret retains its historical name to avoid a coordinated consumer rename.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: goosecracker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.goosecracker.onepassword.itemPath | quote }}
{{- end }}
