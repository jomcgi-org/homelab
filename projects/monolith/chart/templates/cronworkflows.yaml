{{- /*
Off-pod batch jobs as Argo CronWorkflows, one per jobs.cronWorkflows entry,
rendered into jobs.workflowNamespace. Argo's controller owns scheduling,
concurrency, timeout, and history; ArgoCD syncs these CRs declaratively.

The container runs the digest-pinned jobs image (helm_images_values pins
jobs.image) with the entry's args, getting DATABASE_URL via secretKeyRef from
the Kyverno-cloned pg secret. `suspend` is the per-job cutover flag.

Guarded on jobs.image being set: it is only populated by the build-time image
pin, so a plain `helm template` (no pin) renders nothing - matching the JOBS
image guard elsewhere.
*/ -}}
{{- if .Values.jobs.image }}
{{- range .Values.jobs.cronWorkflows }}
{{- if and .grimoire (not $.Values.grimoire.enabled) }}
{{- /* grimoire jobs are private-tier only: skip them entirely unless the
       grimoire module is enabled, so an unrelated (public) deploy never
       renders a CronWorkflow referencing the openrouter secret. */ -}}
{{- else if and .whatsapp (not $.Values.whatsapp.enabled) }}
{{- /* the whatsapp morning-digest job only exists when the gateway is enabled;
       a deploy with whatsapp off renders no digest CronWorkflow. */ -}}
{{- else }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.jobs.workflowNamespace }}
  labels:
    {{- include "monolith.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cron-job
spec:
  # Argo Workflows v4 replaced the singular `schedule` string with a `schedules`
  # list; the v4 controller rejects a bare `schedule` as "must have at least one
  # schedule" and never fires. Render the single cron expression as a one-item list.
  schedules:
    - {{ .schedule | quote }}
  concurrencyPolicy: {{ .concurrencyPolicy | default "Forbid" }}
  suspend: {{ .suspend | default false }}
  startingDeadlineSeconds: {{ .startingDeadlineSeconds | default 30 }}
  successfulJobsHistoryLimit: {{ .successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .failedJobsHistoryLimit | default 5 }}
  workflowSpec:
    entrypoint: run
    # Stamp the JOB PODS, not just the CronWorkflow object. The labels above land
    # on the CR and do not propagate, so without this the pods carry no chart
    # labels at all and the only way to select them is by namespace.
    #
    # cilium-ingress-policy.yaml keys its monolith-workflows -> :8000 allow on
    # this exact label, so that the grant covers THIS chart's jobs rather than
    # everything sharing the namespace (renovate also deploys there and is a far
    # larger third-party executor). Label and selector are rendered by the same
    # chart, so they cannot drift apart.
    podMetadata:
      labels:
        app.kubernetes.io/part-of: {{ $.Release.Name }}-jobs
    # Most jobs use the shared executor SA; a job needing extra cluster access
    # (e.g. stats_rollup reading node/pod counts) sets its own least-privilege SA.
    serviceAccountName: {{ .serviceAccountName | default "argo-workflow" }}
    {{- if .activeDeadlineSeconds }}
    activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
    {{- end }}
    ttlStrategy:
      secondsAfterCompletion: 3600
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    # Delete pods as soon as the workflow succeeds instead of letting them sit
    # for the full ttlStrategy window (1h). The Workflow object still lingers
    # per ttlStrategy for status visibility; only the finished pods are reaped
    # promptly, so completed CronWorkflow pods do not accumulate in the
    # namespace. Failed workflows keep their pods (OnWorkflowSuccess only) so a
    # failure remains debuggable until secondsAfterFailure (24h) expires.
    podGC:
      strategy: OnWorkflowSuccess
    templates:
      - name: run
        container:
          image: "{{ $.Values.jobs.image.repository }}@{{ $.Values.jobs.image.digest }}"
          args:
            {{- toYaml .args | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.jobs.dbSecretName }}
                  key: {{ $.Values.jobs.dbSecretKey }}
            {{- range $k, $v := .env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $name, $ref := .secretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
            {{- end }}
            {{- if .s3 }}
            # Full SeaweedFS + stars S3 env, mirroring the monolith deployment
            # exactly. Endpoint/creds AND the bucket/key names must all be set:
            # the handlers' in-code defaults (e.g. STARS_GRID_S3_KEY defaulting
            # to "stars/grid.json") do NOT match the configured keys, so omitting
            # them makes the job fetch a wrong path and silently load 0 rows.
            - name: SEAWEEDFS_S3_ENDPOINT
              value: {{ $.Values.stars.seaweedfsS3Endpoint | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ $.Values.stars.s3AccessKeyId | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ $.Values.stars.s3SecretAccessKey | quote }}
            - name: STARS_GRID_S3_BUCKET
              value: {{ $.Values.stars.gridBucket | quote }}
            - name: STARS_GRID_S3_KEY
              value: {{ $.Values.stars.gridKey | quote }}
            - name: STARS_CLIMATOLOGY_S3_KEY
              value: {{ $.Values.stars.climatologyKey | quote }}
            - name: STARS_SITES_S3_KEY
              value: {{ $.Values.stars.sitesKey | quote }}
            - name: STARS_MAP_S3_KEY
              value: {{ $.Values.stars.mapKey | quote }}
            - name: STARS_HISTORY_MAP_S3_KEY
              value: {{ $.Values.stars.historyMapKey | quote }}
            {{- end }}
            {{- if .changelog }}
            # chat.changelog needs the full config list (to look up the named
            # config) + a GitHub token. CHANGELOG_CONFIGS mirrors the deployment;
            # GITHUB_TOKEN comes from the monolith-chat-secrets Secret cloned into
            # monolith-workflows. No bot token is referenced - the job only
            # enqueues; the leader's drain posts.
            - name: CHANGELOG_CONFIGS
              value: {{ $.Values.chat.changelogs | toJson | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: monolith-chat-secrets
                  key: GITHUB_TOKEN
            {{- end }}
            {{- if .whatsapp }}
            # The morning-digest job reads WHATSAPP_TZ for the household-local send
            # time and quiet hours. Derive it from the same single source the
            # backend uses (whatsapp.calendar.tz) so quiet-hours/send-time cannot
            # silently diverge from the capabilities tz.
            - name: WHATSAPP_TZ
              value: {{ $.Values.whatsapp.calendar.tz | quote }}
            {{- end }}
            {{- if .grimoire }}
            # Grimoire ingest jobs (spec #4.2/#4.3): the loader reads the shared
            # SeaweedFS S3 env + EMBEDDING_URL + GRIMOIRE_S3_BUCKET; extraction
            # reads GRIMOIRE_EXTRACT_API_KEY + GRIMOIRE_EXTRACT_MODEL/BASE_URL/LIMIT
            # + EMBEDDING_URL. Both get the union (the loader ignores the extract
            # key, the extractor ignores the S3 env) so the grimoire concern is one
            # env block. The production default is direct DeepSeek, so
            # GRIMOIRE_EXTRACT_API_KEY comes from the "goosecracker" Secret (field
            # DEEPSEEK_API_KEY), Kyverno-cloned into monolith-workflows (see the
            # clone-openrouter policy); the extract handler skips cleanly if absent.
            - name: SEAWEEDFS_S3_ENDPOINT
              value: {{ $.Values.stars.seaweedfsS3Endpoint | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ $.Values.stars.s3AccessKeyId | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ $.Values.stars.s3SecretAccessKey | quote }}
            - name: EMBEDDING_URL
              value: {{ $.Values.chat.embeddingUrl | quote }}
            # Bulk sourcebook loads embed thousands of chunks; the embedding
            # server is token-throughput-bound, so a batch of large stat-block
            # chunks can take well over the interactive 60s default. Give the
            # loader generous per-request and total retry headroom (batches are
            # still size-bounded in code, so this is margin, not unbounded waits).
            - name: EMBED_BATCH_READ_TIMEOUT
              value: "300"
            - name: EMBED_RETRY_TIMEOUT
              value: "900"
            - name: GRIMOIRE_EXTRACT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: goosecracker
                  # Direct-DeepSeek key (production default). The client reads
                  # GRIMOIRE_EXTRACT_API_KEY first, falling back to
                  # OPENROUTER_API_KEY; to run against OpenRouter instead, point
                  # this key at the goosecracker OPENROUTER_API_KEY field and set
                  # GRIMOIRE_EXTRACT_BASE_URL/MODEL accordingly.
                  key: DEEPSEEK_API_KEY
                  # Optional: the cloned "goosecracker" Secret only exists once
                  # goosecracker is enabled and Kyverno has replicated it into
                  # monolith-workflows; the pod must not be blocked on it (the
                  # extract job already skips cleanly when the key is unset).
                  optional: true
            - name: GRIMOIRE_S3_BUCKET
              value: {{ $.Values.grimoire.s3Bucket | quote }}
            - name: GRIMOIRE_EXTRACT_MODEL
              value: {{ $.Values.grimoire.extractModel | quote }}
            {{- if $.Values.grimoire.extractBaseUrl }}
            # Points extraction at an OpenAI-compatible chat/completions
            # endpoint. Set to the in-cluster Qwen vLLM (free, no API key) so
            # extraction does not spend OpenRouter money; left empty in the
            # chart default so the code falls back to OpenRouter.
            - name: GRIMOIRE_EXTRACT_BASE_URL
              value: {{ $.Values.grimoire.extractBaseUrl | quote }}
            {{- end }}
            {{- if $.Values.grimoire.extractProvider }}
            # OpenRouter provider preference (comma list -> ordered array in
            # code, allow_fallbacks=false). Pins a native-precision first-party
            # provider so extraction never lands on the cheapest fp4-quantized
            # route. Only honored when the endpoint is OpenRouter.
            - name: GRIMOIRE_EXTRACT_PROVIDER
              value: {{ $.Values.grimoire.extractProvider | quote }}
            {{- end }}
            {{- if $.Values.grimoire.extractLimit }}
            - name: GRIMOIRE_EXTRACT_LIMIT
              value: {{ $.Values.grimoire.extractLimit | quote }}
            {{- end }}
            {{- if $.Values.grimoire.extractConcurrency }}
            # Concurrent extract calls. Bounded by vLLM --max-num-seqs for a
            # local endpoint, but a hosted provider (OpenRouter) has no such
            # limit, so production runs wide (the client backs off on 429).
            # Empty falls back to the code default (1, the async slot budget).
            - name: GRIMOIRE_EXTRACT_CONCURRENCY
              value: {{ $.Values.grimoire.extractConcurrency | quote }}
            {{- end }}
            {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
