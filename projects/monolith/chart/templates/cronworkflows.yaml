{{- /*
Off-pod batch jobs as Argo CronWorkflows, one per jobs.cronWorkflows entry,
rendered into jobs.workflowNamespace. Argo's controller owns scheduling,
concurrency, timeout, and history; ArgoCD syncs these CRs declaratively.

The container runs the digest-pinned jobs image (helm_images_values pins
jobs.image) with the entry's args, getting DATABASE_URL via secretKeyRef from
the Kyverno-cloned pg secret. `suspend` is the per-job cutover flag.

Guarded on jobs.image being set: it is only populated by the build-time image
pin, so a plain `helm template` (no pin) renders nothing - matching the JOBS
image guard elsewhere.
*/ -}}
{{- if .Values.jobs.image }}
{{- range .Values.jobs.cronWorkflows }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.jobs.workflowNamespace }}
  labels:
    {{- include "monolith.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cron-job
spec:
  # Argo Workflows v4 replaced the singular `schedule` string with a `schedules`
  # list; the v4 controller rejects a bare `schedule` as "must have at least one
  # schedule" and never fires. Render the single cron expression as a one-item list.
  schedules:
    - {{ .schedule | quote }}
  concurrencyPolicy: {{ .concurrencyPolicy | default "Forbid" }}
  suspend: {{ .suspend | default false }}
  startingDeadlineSeconds: {{ .startingDeadlineSeconds | default 30 }}
  successfulJobsHistoryLimit: {{ .successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .failedJobsHistoryLimit | default 5 }}
  workflowSpec:
    entrypoint: run
    serviceAccountName: argo-workflow
    {{- if .activeDeadlineSeconds }}
    activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
    {{- end }}
    ttlStrategy:
      secondsAfterCompletion: 3600
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    templates:
      - name: run
        container:
          image: "{{ $.Values.jobs.image.repository }}:{{ $.Values.jobs.image.tag }}"
          args:
            {{- toYaml .args | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.jobs.dbSecretName }}
                  key: {{ $.Values.jobs.dbSecretKey }}
            {{- range $k, $v := .env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $name, $ref := .secretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
            {{- end }}
            {{- if .s3 }}
            # Full SeaweedFS + stars S3 env, mirroring the monolith deployment
            # exactly. Endpoint/creds AND the bucket/key names must all be set:
            # the handlers' in-code defaults (e.g. STARS_GRID_S3_KEY defaulting
            # to "stars/grid.json") do NOT match the configured keys, so omitting
            # them makes the job fetch a wrong path and silently load 0 rows.
            - name: SEAWEEDFS_S3_ENDPOINT
              value: {{ $.Values.stars.seaweedfsS3Endpoint | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ $.Values.stars.s3AccessKeyId | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ $.Values.stars.s3SecretAccessKey | quote }}
            - name: STARS_GRID_S3_BUCKET
              value: {{ $.Values.stars.gridBucket | quote }}
            - name: STARS_GRID_S3_KEY
              value: {{ $.Values.stars.gridKey | quote }}
            - name: STARS_CLIMATOLOGY_S3_KEY
              value: {{ $.Values.stars.climatologyKey | quote }}
            {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
