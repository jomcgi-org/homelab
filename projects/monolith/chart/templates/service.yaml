apiVersion: v1
kind: Service
metadata:
  name: {{ include "monolith.fullname" . }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
      protocol: TCP
    - name: progress
      port: 8091
      targetPort: progress
      protocol: TCP
  selector:
    {{- include "monolith.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
