{{- if .Values.whatsapp.enabled }}
# WhatsApp gateway secret (ADR 039). Provisioned alongside the gateway; it holds
# the bot-config credentials the later phases consume (the inbound bearer token
# for POST /internal/whatsapp/inbound). Phase 1 is transport-only and reads its
# non-secret config from plain values, so no keys are wired into the Deployment
# yet; the item is created now so enabling the gateway and populating the vault
# are a single step.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-whatsapp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.whatsapp.onepassword.itemPath | quote }}
{{- end }}
