{{- if .Values.whatsapp.enabled }}
# WhatsApp gateway secret (ADR 039). Provisioned alongside the gateway. The
# OnePasswordItem mirrors the whole vault item into a Secret named
# "<fullname>-whatsapp"; each vault field becomes a Secret key. Phase 3 consumes
# one field:
#   WHATSAPP_INBOUND_TOKEN - the bearer the gateway sends to, and the monolith
#     validates on, POST /internal/whatsapp/inbound (spec section 2). Add this
#     field to the vault item before enabling the gateway; both the gateway and
#     the monolith backend Deployments read it from this Secret.
# Phase 5 (ADR 039 spec 5b) optionally consumes three more fields for live
# calendar scheduling (absent by default; the capability falls back to drafting
# events into the morning digest when they are missing):
#   GOOGLE_CALENDAR_CLIENT_ID, GOOGLE_CALENDAR_CLIENT_SECRET,
#   GOOGLE_CALENDAR_REFRESH_TOKEN - an OAuth user credential scoped to the
#     household calendar. The monolith backend reads them as optional secret env.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-whatsapp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.whatsapp.onepassword.itemPath | quote }}
{{- end }}
