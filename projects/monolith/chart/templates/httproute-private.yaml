{{- if .Values.cfIngress.private.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith.fullname" . }}-private
  labels:
    ingress-tier: {{ .Values.cfIngress.private.tier }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.private.gateway.name }}
      namespace: {{ .Values.cfIngress.private.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.private.hostname | quote }}
  rules:
    # SvelteKit client assets — pass through without rewriting
    - matches:
        - path:
            type: PathPrefix
            value: /_app/
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.private.servicePort | int }}
    # Knowledge API — pass through to backend without rewriting
    - matches:
        - path:
            type: PathPrefix
            value: /api/knowledge
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
    # Demos API: pass through to backend without rewriting
    - matches:
        - path:
            type: PathPrefix
            value: /api/demos
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
    # Scheduler API — pass through to backend without rewriting
    - matches:
        - path:
            type: PathPrefix
            value: /api/scheduler
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
    # Grimoire API — pass through to backend without rewriting. Without this
    # rule /api/grimoire/* falls through to the catch-all below and lands on
    # the SvelteKit port, which 404s it (the private-tier equivalent of the
    # public ALLOWED_PREFIXES gap).
    - matches:
        - path:
            type: PathPrefix
            value: /api/grimoire
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
    # Chat interface — SvelteKit SSR calls LLM backend, needs long timeout
    - matches:
        - path:
            type: PathPrefix
            value: /private/chat
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.private.servicePort | int }}
    # Long-lived Server-Sent Events stream; requires extended timeouts to prevent intermediate reaping.
    - matches:
        - path:
            type: PathPrefix
            value: /private/agents/vms/stream
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.private.servicePort | int }}
    # Everything else — SvelteKit reroute hook maps to /private/ internally
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.cfIngress.private.servicePort | int }}
---
{{- $spParams := dict
  "name" (printf "%s-private" (include "monolith.fullname" .))
  "team" .Values.cfIngress.private.team
}}
{{- include "cf-ingress.security-policy" $spParams }}
---
# GitHub Semgrep webhook route — a SEPARATE HTTPRoute on the same private gateway
# and hostname, carrying ONLY the webhook path and routed to the FastAPI backend
# port. It is deliberately its own route so the cf-access SecurityPolicy above
# (which targets the -private route as a whole) does NOT apply to it: GitHub
# bypasses Cloudflare Access at the edge via an IP-allowlist Bypass policy and
# sends no Access JWT, so any SecurityPolicy on this path would reject every real
# delivery. The request is instead gated by the handler's HMAC verification. No
# SecurityPolicy targets this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monolith.fullname" . }}-github-webhook
  labels:
    ingress-tier: {{ .Values.cfIngress.private.tier }}
spec:
  parentRefs:
    - name: {{ .Values.cfIngress.private.gateway.name }}
      namespace: {{ .Values.cfIngress.private.gateway.namespace }}
  hostnames:
    - {{ .Values.cfIngress.private.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks/github/semgrep
        # Semgrep AppSec Platform scan webhook (semgrep_scan/perf_webhook.py).
        # Same no-SecurityPolicy treatment: Semgrep sends no Access JWT, so it
        # reaches this route via a Cloudflare Access IP-Bypass for Semgrep's
        # egress IPs and is gated only by the handler's HMAC verification.
        - path:
            type: PathPrefix
            value: /webhooks/semgrep
      backendRefs:
        - name: {{ include "monolith.fullname" . }}
          port: {{ .Values.service.apiPort | int }}
{{- end }}
