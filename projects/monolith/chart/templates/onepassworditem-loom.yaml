{{- if and .Values.grimoire.enabled .Values.grimoire.loom.enabled }}
# Dataset-scoped runtime credential only. Never mounted into the ontology job.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-loom-grimoire-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: "vaults/k8s-homelab/items/loom-grimoire-token"
{{- end }}
