{{- /*
On-demand copy of the Grimoire data for the factory migration (HOME-484).

One pod. The pg-dump init container runs the factory restore's Postgres image
and writes the dump files and the referenced object locations to an emptyDir,
all from one snapshot (files/grimoire-migration-dump.sh). Then the jobs
container runs grimoire-migration-dump (grimoire/migration.py): it uploads the
files, copies the bucket, compares each copy with its source and writes
SHA256SUMS last, under grimoire.migrationDump.prefix of the private grimoire
bucket. It reads no database row.

The CronWorkflow is always suspended and its schedule never occurs. An
operator submits each run:
  argo submit --from cronworkflow/grimoire-migration-dump -n monolith-workflows

Each run holds copyrighted book content, so it stays in the private bucket.
Like cronworkflows.yaml, it renders only with the build-time jobs.image pin.
*/ -}}
{{- $job := .Values.grimoire.migrationDump }}
{{- if and .Values.jobs.image .Values.grimoire.enabled .Values.sharedS3.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grimoire-migration-dump
  namespace: {{ .Values.jobs.workflowNamespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
    app.kubernetes.io/component: grimoire-migration-dump
data:
  dump.sh: |
    {{- .Files.Get "files/grimoire-migration-dump.sh" | nindent 4 }}
  # A copy of projects/grimoire/deploy/inventory.sql. A chart test pins it.
  inventory.sql: |
    {{- .Files.Get "files/grimoire-inventory.sql" | nindent 4 }}
  references.sql: |
    {{- .Files.Get "files/grimoire-references.sql" | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: grimoire-migration-dump
  namespace: {{ .Values.jobs.workflowNamespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
    app.kubernetes.io/component: grimoire-migration-dump
spec:
  # 31 February: never, even if the CronWorkflow is resumed.
  schedules:
    - "0 0 31 2 *"
  concurrencyPolicy: Forbid
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowSpec:
    entrypoint: dump
    serviceAccountName: argo-workflow
    podPriorityClassName: homelab-disposable
    activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
    podMetadata:
      labels:
        app.kubernetes.io/part-of: {{ .Release.Name }}-jobs
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    tolerations:
      - key: embervm.jomcgi.dev/node
        operator: Equal
        value: "true"
        effect: NoSchedule
    ttlStrategy:
      secondsAfterCompletion: 3600
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    # A finished pod and its emptyDir, with the dump, go at once on success.
    podGC:
      strategy: OnWorkflowSuccess
    volumes:
      - name: work
        emptyDir:
          sizeLimit: {{ $job.workSizeLimit }}
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: scripts
        configMap:
          name: grimoire-migration-dump
    templates:
      - name: dump
        initContainers:
          - name: pg-dump
            image: {{ $job.postgresImage | quote }}
            command: [bash, /scripts/dump.sh]
            env:
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.jobs.dbSecretName }}
                    key: {{ .Values.jobs.dbSecretKey }}
              - name: GRIMOIRE_SCHEMAS
                value: {{ $job.schemas | quote }}
              - name: WORK
                value: /work
              - name: INVENTORY_SQL
                value: /scripts/inventory.sql
              - name: REFERENCES_SQL
                value: /scripts/references.sql
              - name: HOME
                value: /tmp
            # The image's postgres user, so libpq finds a passwd entry.
            securityContext:
              runAsUser: 26
              runAsGroup: 26
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              {{- toYaml $job.resources | nindent 14 }}
            volumeMounts:
              - name: work
                mountPath: /work
              - name: tmp
                mountPath: /tmp
              - name: scripts
                mountPath: /scripts
                readOnly: true
        container:
          image: "{{ .Values.jobs.image.repository }}@{{ .Values.jobs.image.digest }}"
          args: ["grimoire-migration-dump"]
          env:
            # jobs_main opens a session for each job. This job reads no row.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobs.dbSecretName }}
                  key: {{ .Values.jobs.dbSecretKey }}
            {{- if .Values.backend.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.backend.otelEndpoint | quote }}
            {{- end }}
            - name: SEAWEEDFS_S3_ENDPOINT
              value: {{ .Values.stars.s3Endpoint | quote }}
            - name: AWS_REGION
              value: {{ .Values.stars.s3Region | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: monolith-r2-s3  # Coupled to platform Kyverno clone-monolith-workflows-secrets rule
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: monolith-r2-s3  # Coupled to platform Kyverno clone-monolith-workflows-secrets rule
                  key: secret-access-key
            - name: GRIMOIRE_S3_BUCKET
              value: {{ .Values.grimoire.s3Bucket | quote }}
            - name: GRIMOIRE_MIGRATION_PREFIX
              value: {{ $job.prefix | quote }}
            - name: GRIMOIRE_MIGRATION_WORK
              value: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $job.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
{{- end }}
