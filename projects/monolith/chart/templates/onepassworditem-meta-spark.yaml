{{- if .Values.metaSpark.onepassword.itemPath }}
# Meta Spark contributor-tier API credential. The 1Password field label must
# be META_SPARK_API_KEY so the synced Secret key matches the Deployment and
# workflow secretKeyRefs.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.metaSpark.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.metaSpark.onepassword.itemPath | quote }}
{{- end }}
