apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "monolith.fullname" . }}-pg
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  inheritedMetadata:
    annotations:
      config.linkerd.io/skip-inbound-ports: "9187"
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- if .Values.postgres.storage.storageClass }}
    storageClassName: {{ .Values.postgres.storage.storageClass }}
    {{- end }}
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
    extensions:
      - name: vector
        image:
          reference: {{ .Values.postgres.pgvector.image }}
  # Hosts five databases (monolith, temporal, temporal_visibility,
  # lakehouse, postgres); Temporal is connection-heavy. The prior 256Mi
  # limit OOMKilled the instance 359 times. 1Gi limit with shared_buffers
  # at 256MB (25% of limit) gives headroom for the working set plus
  # per-connection work_mem.
  resources:
    requests:
      memory: "512Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
  bootstrap:
    initdb:
      database: monolith
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
