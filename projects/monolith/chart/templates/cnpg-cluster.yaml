apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "monolith.fullname" . }}-pg
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- if .Values.postgres.storage.storageClass }}
    storageClassName: {{ .Values.postgres.storage.storageClass }}
    {{- end }}
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
    extensions:
      - name: vector
        image:
          reference: {{ .Values.postgres.pgvector.image }}
  # Declarative roles. CNPG runs as a superuser, so it (not the app-role Atlas
  # migrations) is what can CREATE the public_reader role. Its table/schema GRANTs
  # live in chart/migrations/20260617000000_public_reader_role.sql; CNPG does not
  # manage privileges. public_reader is the read-only identity for the Phase 5
  # anonymous public service (ADR 004 security/004).
  #
  # Phase 5b: the role is now LOGIN, with its password set by CNPG from the
  # basic-auth secret below. CNPG's passwordSecret requires a
  # kubernetes.io/basic-auth secret (keys: username, password) labelled
  # cnpg.io/reload, which the 1Password operator (Opaque only) cannot emit, so
  # the secret is created out-of-band from the 1Password item
  # k8s-homelab/public-reader-db. See deploy/public-reader-secret.md
  # to (re)create it. The public service reads the SAME 1Password item via its
  # own OnePasswordItem (Opaque is fine there); both stay consistent because the
  # 1Password item is the single source of truth. This credential is low-value:
  # read-only, public data only, scoped by the public_api views.
  managed:
    roles:
      - name: public_reader
        ensure: present
        login: true
        passwordSecret:
          name: monolith-pg-public-reader
        comment: "Read-only public surface (ADR 004); GRANTs in Atlas migration"
      # public_writer: the first public-tier WRITE identity (ADR 005). Generic so
      # future public-tier write paths can reuse it; today it owns DML on the
      # chat_public schema only (sessions + transcripts on the primary), distinct
      # from the read-only public_reader. Its GRANTs live in
      # chart/migrations/20260617030000_chat_public.sql; CNPG only creates the
      # role and sets its password. The basic-auth secret is created out-of-band
      # from the 1Password item (same pattern as public_reader, see
      # deploy/public-writer-secret.md). This credential is low-value: DML on one
      # schema of anonymous chat data, no access to any other schema.
      - name: public_writer
        ensure: present
        login: true
        passwordSecret:
          name: monolith-pg-public-writer
        comment: "Public-tier write role (ADR 005); GRANTs in Atlas migration"
  # Hosts the monolith database (plus the default postgres maintenance db);
  # the temporal/temporal_visibility/lakehouse databases were decommissioned
  # 2026-06-14. The prior 256Mi limit OOMKilled the instance 359 times. 1Gi
  # limit with shared_buffers at 256MB (25% of limit) gives headroom for the
  # working set plus per-connection work_mem. Applies per instance, so the
  # standby (instances: 2) gets the same budget.
  resources:
    requests:
      memory: "512Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
  bootstrap:
    initdb:
      database: monolith
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
