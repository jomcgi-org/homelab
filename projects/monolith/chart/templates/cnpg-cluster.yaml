{{- if not (kindIs "map" .Values.postgres.clientRoles) }}
{{- fail "postgres.clientRoles must be a map" }}
{{- end }}
{{- range $name := list "publicReader" "agentsWriter" "publicWriter" }}
{{- $role := index $.Values.postgres.clientRoles $name }}
{{- if not (kindIs "map" $role) }}
{{- fail (printf "postgres.clientRoles.%s must be a map" $name) }}
{{- end }}
{{- if not (kindIs "bool" $role.login) }}
{{- fail (printf "postgres.clientRoles.%s.login must be a boolean" $name) }}
{{- end }}
{{- if $role.login }}
{{- if not (kindIs "string" $role.passwordSecret) }}
{{- fail (printf "postgres.clientRoles.%s.passwordSecret must be a valid Secret name when login is true" $name) }}
{{- end }}
{{- if or (gt (len $role.passwordSecret) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $role.passwordSecret)) }}
{{- fail (printf "postgres.clientRoles.%s.passwordSecret must be a valid Secret name when login is true" $name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "monolith.fullname" . }}-pg
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- if .Values.postgres.storage.storageClass }}
    storageClass: {{ .Values.postgres.storage.storageClass }}
    {{- end }}
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
    extensions:
      - name: vector
        image:
          reference: {{ .Values.postgres.pgvector.image }}
  # Declarative roles. CNPG runs as a superuser, so it (not the app-role Atlas
  # migrations) is what can CREATE the public_reader role. Its table/schema GRANTs
  # live in chart/migrations/20260617000000_public_reader_role.sql; CNPG does not
  # manage privileges. public_reader is the read-only identity for the Phase 5
  # anonymous public service (ADR 004 security/004).
  #
  # Phase 5b: the role is now LOGIN, with its password set by CNPG from the
  # basic-auth secret below. CNPG's passwordSecret requires a
  # kubernetes.io/basic-auth secret (keys: username, password) labelled
  # cnpg.io/reload, which the 1Password operator (Opaque only) cannot emit, so
  # the secret is created out-of-band from the 1Password item
  # k8s-homelab/public-reader-db. See deploy/public-reader-secret.md
  # to (re)create it. The public service reads the SAME 1Password item via its
  # own OnePasswordItem (Opaque is fine there); both stay consistent because the
  # 1Password item is the single source of truth. This credential is low-value:
  # read-only, public data only, scoped by the public_api views.
  managed:
    roles:
      - name: public_reader
        ensure: present
        login: {{ .Values.postgres.clientRoles.publicReader.login }}
        {{- if .Values.postgres.clientRoles.publicReader.login }}
        passwordSecret:
          name: {{ .Values.postgres.clientRoles.publicReader.passwordSecret | quote }}
        {{- end }}
        comment: "Read-only public surface (ADR 004); GRANTs in Atlas migration"
      # The monolith-agents tier's identity (#5656). Same mechanism and the same
      # reason as public_reader above: CNPG is the only superuser, so it creates
      # the role, while the GRANTs live in
      # chart/migrations/20260904180000_agents_writer_role.sql because CNPG does
      # not manage privileges.
      #
      # Higher value than public_reader (it can write raws, disputes and outbox
      # rows), so the scoping in that migration is what bounds it: read across
      # knowledge, insert on three tables, and nothing outside those schemas.
      - name: agents_writer
        ensure: present
        login: {{ .Values.postgres.clientRoles.agentsWriter.login }}
        {{- if .Values.postgres.clientRoles.agentsWriter.login }}
        passwordSecret:
          name: {{ .Values.postgres.clientRoles.agentsWriter.passwordSecret | quote }}
        {{- end }}
        comment: "monolith-agents tier (#5656); GRANTs in Atlas migration"
      {{- if .Values.postgres.embervmOpLog.enabled }}
      # The EmberVM control-plane op-log owner (ADR embervm/007). Owns its own
      # database (templates/cnpg-database-embervm.yaml) and nothing in the
      # monolith's schema, so it needs no GRANTs here: Embervm.OpLog.Postgres
      # creates its own tables as the database owner on first boot.
      #
      # Same out-of-band password mechanism as public_reader above, for the same
      # reason (CNPG wants kubernetes.io/basic-auth + cnpg.io/reload, which the
      # 1Password operator cannot emit). Procedure and the URL-safe-password
      # requirement: deploy/embervm-oplog-secret.md.
      - name: {{ .Values.postgres.embervmOpLog.role }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Values.postgres.embervmOpLog.passwordSecret }}
        comment: "EmberVM op-log owner (ADR embervm/007); owns only its own database"
      {{- end }}
      {{- if .Values.postgres.spire.enabled }}
      - name: {{ .Values.postgres.spire.role }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Values.postgres.spire.passwordSecret }}
        comment: "SPIRE server datastore owner (ADR embervm/041); owns only its own database"
      {{- end }}
      {{- if .Values.postgres.devRefresh.enabled }}
      # This role exists solely so the dev refresh can dump production without
      # using a superuser. pg_read_all_data is a PostgreSQL predefined role, so
      # its privileges need no Atlas migration to carry the GRANTs.
      - name: {{ .Values.postgres.devRefresh.role }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Values.postgres.devRefresh.dumpReaderSecret }}
        inRoles:
          - pg_read_all_data
        comment: "Dev refresh dump reader"
      {{- end }}
      # public_writer: the first public-tier WRITE identity (ADR 005). Generic so
      # future public-tier write paths can reuse it; today it owns DML on the
      # chat_public schema only (sessions + transcripts on the primary), distinct
      # from the read-only public_reader. Its GRANTs live in
      # chart/migrations/20260617030000_chat_public.sql; CNPG only creates the
      # role and sets its password. The basic-auth secret is created out-of-band
      # from the 1Password item (same pattern as public_reader, see
      # deploy/public-writer-secret.md). This credential is low-value: DML on one
      # schema of anonymous chat data, no access to any other schema.
      - name: public_writer
        ensure: present
        login: {{ .Values.postgres.clientRoles.publicWriter.login }}
        {{- if .Values.postgres.clientRoles.publicWriter.login }}
        passwordSecret:
          name: {{ .Values.postgres.clientRoles.publicWriter.passwordSecret | quote }}
        {{- end }}
        comment: "Public-tier write role (ADR 005); GRANTs in Atlas migration"
  # Hosts the monolith database (plus the default postgres maintenance db);
  # the temporal/temporal_visibility/lakehouse databases were decommissioned
  # 2026-06-14. The prior 256Mi limit OOMKilled the instance 359 times. 1Gi
  # limit with shared_buffers at 256MB (25% of limit) gives headroom for the
  # working set plus per-connection work_mem. Applies per instance, so the
  # standby (instances: 2) gets the same budget.
  resources:
    requests:
      memory: "512Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
  bootstrap:
    {{- with .Values.postgres.bootstrap.recovery }}
    recovery:
      {{- toYaml . | nindent 6 }}
    {{- else }}
    initdb:
      database: monolith
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
    {{- end }}
  {{- with .Values.postgres.externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.postgres.backup.enabled }}
  # Off-cluster base backups and continuous WAL archiving use native GCS through
  # the in-spec barmanObjectStore mechanism supported by CNPG 1.30.0. The GCS
  # service-account JSON is synced from 1Password into an Opaque Secret.
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ .Values.postgres.backup.destinationPath | quote }}
      {{- with .Values.postgres.backup.serverName }}
      serverName: {{ . | quote }}
      {{- end }}
      googleCredentials:
        applicationCredentials:
          name: {{ .Values.postgres.backup.credentialsSecret }}
          key: service-account-key.json
      wal:
        compression: gzip
      data:
        compression: gzip
  {{- end }}
