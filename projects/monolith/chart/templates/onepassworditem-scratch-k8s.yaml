{{- if and .Values.scratchK8s.enabled .Values.scratchK8s.onepassword.itemPath }}
# Syncs the EmberVM scratch-k8s group secret into a K8s Secret in the MONOLITH
# namespace (EmberVM R5, plan Task 10). The scratch-k8s cluster runs in the embervm
# namespace, but the monolith needs the SAME EMBER_GROUP_SECRET to build a matching
# kubeconfig bearer token (the k3s server derives its static token-auth entry from
# that secret); a K8s Secret cannot be read across namespaces, so the monolith
# syncs the SAME 1Password item into its own namespace. Because the item is stable,
# the token stays identical across the group's rolls/TTL/fresh-boot. The item's
# field must land as a Secret key named exactly EMBER_GROUP_SECRET.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "monolith.fullname" . }}-scratch-k8s
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monolith.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.scratchK8s.onepassword.itemPath | quote }}
{{- end }}
