<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 284" role="img" aria-label="Selected experts: three paths to computation">
  <text x="18" y="20" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="13" fill="currentColor" text-anchor="start" font-weight="bold">WHERE THE WEIGHTS LIVE</text>
  <text x="682" y="20" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="end">illustrative 2.6 MB expert</text>
  <rect x="18" y="43" width="5" height="48" fill="var(--replay-hot)"/>
  <text x="34" y="60" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start" font-weight="bold">HOT</text>
  <text x="34" y="78" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">GPU VRAM</text>
  <text x="375" y="55" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">~3 us read</text>
  <line x1="192" y1="67" x2="557" y2="67" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="67" x2="552.9549150281252" y2="69.93892626146237" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="67" x2="552.9549150281252" y2="64.06107373853763" stroke="currentColor" stroke-width="1"/>
  <text x="375" y="86" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">1 TB/s</text>
  <rect x="567" y="43" width="115" height="48" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="624" y="71" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">GPU compute</text>
  <rect x="18" y="111" width="5" height="48" fill="var(--replay-warm)"/>
  <text x="34" y="128" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start" font-weight="bold">WARM</text>
  <text x="34" y="146" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">Pinned RAM</text>
  <text x="375" y="123" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">~100 us over PCIe</text>
  <line x1="192" y1="135" x2="557" y2="135" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="135" x2="552.9549150281252" y2="137.93892626146237" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="135" x2="552.9549150281252" y2="132.06107373853763" stroke="currentColor" stroke-width="1"/>
  <text x="375" y="154" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">25 GB/s</text>
  <rect x="567" y="111" width="115" height="48" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="624" y="139" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">GPU compute</text>
  <rect x="18" y="179" width="5" height="48" fill="var(--replay-cold)"/>
  <text x="34" y="196" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start" font-weight="bold">COLD</text>
  <text x="34" y="214" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">Page cache / NVMe</text>
  <text x="375" y="191" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">~40 us hit / ~370 us bulk read</text>
  <line x1="192" y1="203" x2="557" y2="203" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="203" x2="552.9549150281252" y2="205.93892626146237" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="203" x2="552.9549150281252" y2="200.06107373853763" stroke="currentColor" stroke-width="1"/>
  <text x="375" y="222" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">RAM / 7 GB/s NVMe</text>
  <rect x="567" y="179" width="115" height="48" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="624" y="207" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">CPU compute</text>
  <line x1="18" y1="241" x2="682" y2="241" stroke="currentColor" stroke-width="1"/>
  <text x="18" y="259" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">Weight access estimates, not compute time. Paths are not to scale.</text>
  <text x="18" y="276" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">Cold 4 KB page faults can cost ~10 ms per expert instead of a bulk read.</text>
</svg>
