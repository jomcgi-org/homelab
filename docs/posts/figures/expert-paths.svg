<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 286" role="img" aria-label="Expert transfer vs bandwidth">
  <text x="18" y="24" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">WEIGHTS</text>
  <text x="270" y="24" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">ACCESS / 2.6 MB</text>
  <text x="420" y="24" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">BANDWIDTH</text>
  <text x="616" y="24" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">COMPUTE</text>
  <line x1="18" y1="36" x2="682" y2="36" stroke="currentColor" stroke-width="1"/>
  <rect x="18" y="48" width="5" height="40" fill="var(--replay-hot)"/>
  <text x="34" y="61" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start" font-weight="bold">HOT</text>
  <text x="34" y="80" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">GPU VRAM</text>
  <text x="270" y="75" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="18" fill="currentColor" text-anchor="middle">~3 us</text>
  <text x="420" y="74" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="14" fill="currentColor" text-anchor="middle">1 TB/s</text>
  <line x1="496" y1="68" x2="525" y2="68" stroke="currentColor" stroke-width="1"/>
  <rect x="18" y="106" width="5" height="40" fill="var(--replay-warm)"/>
  <text x="34" y="119" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start" font-weight="bold">WARM</text>
  <text x="34" y="138" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">Pinned RAM / PCIe</text>
  <text x="270" y="133" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="18" fill="currentColor" text-anchor="middle">~100 us</text>
  <text x="420" y="132" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="14" fill="currentColor" text-anchor="middle">25 GB/s</text>
  <line x1="496" y1="126" x2="525" y2="126" stroke="currentColor" stroke-width="1"/>
  <rect x="18" y="164" width="5" height="40" fill="var(--replay-cold)"/>
  <text x="34" y="177" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start" font-weight="bold">COLD</text>
  <text x="34" y="196" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">Page cache hit</text>
  <text x="270" y="191" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="18" fill="currentColor" text-anchor="middle">~40 us</text>
  <text x="420" y="190" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="14" fill="currentColor" text-anchor="middle">RAM speed</text>
  <line x1="496" y1="184" x2="525" y2="184" stroke="currentColor" stroke-width="1"/>
  <rect x="18" y="222" width="5" height="40" fill="var(--replay-cold)"/>
  <text x="34" y="235" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start" font-weight="bold">COLD</text>
  <text x="34" y="254" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="start">NVMe bulk read</text>
  <text x="270" y="249" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="18" fill="currentColor" text-anchor="middle">~370 us</text>
  <text x="420" y="248" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="14" fill="currentColor" text-anchor="middle">7 GB/s</text>
  <line x1="496" y1="242" x2="525" y2="242" stroke="currentColor" stroke-width="1"/>
  <line x1="525" y1="68" x2="525" y2="126" stroke="currentColor" stroke-width="1"/>
  <line x1="525" y1="97" x2="557" y2="97" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="97" x2="552.9549150281252" y2="99.93892626146237" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="97" x2="552.9549150281252" y2="94.06107373853763" stroke="currentColor" stroke-width="1"/>
  <rect x="567" y="71" width="98" height="52" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="616" y="103" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="18" fill="currentColor" text-anchor="middle" font-weight="bold">GPU</text>
  <line x1="525" y1="184" x2="525" y2="242" stroke="currentColor" stroke-width="1"/>
  <line x1="525" y1="213" x2="557" y2="213" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="213" x2="552.9549150281252" y2="215.93892626146237" stroke="currentColor" stroke-width="1"/>
  <line x1="557" y1="213" x2="552.9549150281252" y2="210.06107373853763" stroke="currentColor" stroke-width="1"/>
  <rect x="567" y="187" width="98" height="52" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="616" y="219" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="18" fill="currentColor" text-anchor="middle" font-weight="bold">CPU</text>
</svg>
