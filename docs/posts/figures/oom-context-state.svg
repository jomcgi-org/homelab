<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Context state grows with attention layers and shrinks the expert cache">
  <text x="44" y="34" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start" font-weight="bold">FOUR OF THE 48 DECODER LAYERS, REPEATED 12 TIMES</text>
  <rect x="44" y="50" width="100" height="34" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="94" y="72" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">GDN</text>
  <text x="94" y="106" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">fixed state</text>
  <rect x="159" y="50" width="100" height="34" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="209" y="72" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">GDN</text>
  <text x="209" y="106" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">fixed state</text>
  <rect x="274" y="50" width="100" height="34" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <text x="324" y="72" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">GDN</text>
  <text x="324" y="106" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">fixed state</text>
  <rect x="389" y="50" width="100" height="34" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="439" y="72" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle" font-weight="bold">QSA</text>
  <text x="439" y="106" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">history grows</text>
  <text x="520" y="62" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">GDN: recurrent state,</text>
  <text x="520" y="78" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">fixed size per layer</text>
  <text x="520" y="98" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">QSA: reads selected rows</text>
  <text x="520" y="114" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">but stores all of them</text>
  <circle cx="94" cy="140" r="9" fill="none" stroke="currentColor" stroke-width="1" data-key="1"/>
  <text x="94" y="144" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">1</text>
  <line x1="94.0" y1="131.0" x2="94" y2="114" stroke="currentColor" stroke-width="1"/>
  <circle cx="94" cy="114" r="2" fill="currentColor"/>
  <circle cx="439" cy="140" r="9" fill="none" stroke="currentColor" stroke-width="1" data-key="2"/>
  <text x="439" y="144" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">2</text>
  <line x1="439.0" y1="131.0" x2="439" y2="114" stroke="currentColor" stroke-width="1"/>
  <circle cx="439" cy="114" r="2" fill="currentColor"/>
  <text x="44" y="182" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start" font-weight="bold">SHORTER CONTEXT (schematic)</text>
  <rect x="44" y="190" width="480" height="40" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <line x1="164.0" y1="190" x2="164.0" y2="230" stroke="currentColor" stroke-width="1.25"/>
  <line x1="192.8" y1="190" x2="192.8" y2="230" stroke="currentColor" stroke-width="1.25"/>
  <text x="104.0" y="214" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">dense</text>
  <text x="358.4" y="214" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">expert slots</text>
  <text x="538" y="214" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">more experts stay</text>
  <text x="44" y="254" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start" font-weight="bold">LONGER CONTEXT (schematic)</text>
  <rect x="44" y="262" width="480" height="40" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <line x1="164.0" y1="262" x2="164.0" y2="302" stroke="currentColor" stroke-width="1.25"/>
  <line x1="317.6" y1="262" x2="317.6" y2="302" stroke="currentColor" stroke-width="1.25"/>
  <text x="104.0" y="286" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">dense</text>
  <text x="240.8" y="286" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">state</text>
  <text x="420.8" y="286" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="middle">expert slots</text>
  <text x="538" y="286" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">fewer slots left</text>
  <circle cx="20" cy="188" r="9" fill="none" stroke="currentColor" stroke-width="1" data-key="3"/>
  <text x="20" y="192" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">3</text>
  <line x1="28.049844718999243" y1="192.0249223594996" x2="44" y2="200" stroke="currentColor" stroke-width="1"/>
  <circle cx="44" cy="200" r="2" fill="currentColor"/>
  <circle cx="20" cy="252" r="9" fill="none" stroke="currentColor" stroke-width="1" data-key="4"/>
  <text x="20" y="256" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="11" fill="currentColor" text-anchor="middle">4</text>
  <line x1="26.913991516376385" y1="257.76165959698034" x2="44" y2="272" stroke="currentColor" stroke-width="1"/>
  <circle cx="44" cy="272" r="2" fill="currentColor"/>
  <line x1="284" y1="236" x2="284" y2="254" stroke="currentColor" stroke-width="1"/>
  <line x1="284" y1="254" x2="281.06107373853763" y2="249.95491502812527" stroke="currentColor" stroke-width="1"/>
  <line x1="284" y1="254" x2="286.93892626146237" y2="249.95491502812527" stroke="currentColor" stroke-width="1"/>
  <text x="296" y="250" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">grows on demand</text>
  <text x="44" y="336" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">Shrinking a prompt does not refill the cache by itself:</text>
  <text x="44" y="352" font-family="ui-monospace, SF Mono, Cascadia Mono, Menlo, monospace" font-size="12" fill="currentColor" text-anchor="start">a rewind keeps its buffers, and freed slots still need warming.</text>
</svg>
