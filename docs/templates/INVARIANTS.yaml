# Invariants: system guarantees that must always hold in this scope.
# Copy this file to the directory that owns the rules. A file covers its
# directory and every sub-directory. IDs are permanent: never reuse or
# renumber one. docs/THREAT-MODEL.md cites them.
#
# Fields:
#   id         Permanent ID. A new one is the issue key and a number,
#              for example HOME-123-1, so parallel PRs do not collide.
#              Older IDs keep their directory prefix (FACT-1).
#   statement  A guarantee and its scope, in one sentence.
#              Name a condition or exception when it changes the guarantee.
#              Keep this sentence true if the enforcement mechanism changes.
#   mechanism  Paths to the current enforcement, including implementation details.
#              Empty while it is designed.
#   test       Bazel label of the test that proves it. Required for live.
#   state      live      the mechanism exists and the test runs in required CI
#              unproven  the mechanism exists and no test proves it
#              designed  the mechanism is not built
#
# Do not put an open security finding here: this file is public. Use the
# private record that docs/THREAT-MODEL.md names.
invariants:
  - id: EXAMPLE-1
    statement: A workload exchanges traffic only with peers it is authorized to reach.
    mechanism:
      - projects/example/resources/network-policy.yaml
    test: //projects/example:network_policy_test
    state: live
