<title>Grimoire Atlas</title>
<style>
  :root {
    /* cool paper, not warm cream */
    --paper: #f3f5f7;
    --paper-2: #ffffff;
    --panel: rgba(255, 255, 255, 0.94);
    --line: #d4dae1;
    --line-soft: #e4e8ed;
    --grid: #e6eaf0;
    --text: #1a1f28;
    --text-dim: #55606f;
    --text-faint: #8a94a2;
    --accent: #33507a; /* deep indigo-ink chrome */
    --accent-soft: rgba(51, 80, 122, 0.12);

    --t-location: #2f8f6b;
    --t-creature: #c0492b;
    --t-npc: #b07d1e;
    --t-faction: #7a52b0;
    --t-deity: #b8912a;
    --t-item: #b83f7a;
    --t-spell: #2f7fbf;

    --serif:
      "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia,
      serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:
      "SF Mono", "Berkeley Mono", ui-monospace, "Cascadia Code", Menlo,
      monospace;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--paper);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas.dragging {
    cursor: grabbing;
  }

  /* ---- header ---- */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    background: linear-gradient(
      180deg,
      rgba(243, 245, 247, 0.96),
      rgba(243, 245, 247, 0)
    );
    z-index: 20;
    pointer-events: none;
  }
  header > * {
    pointer-events: auto;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .mark {
    font-family: var(--serif);
    font-size: 21px;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .brand .mark b {
    color: var(--accent);
    font-weight: 600;
  }
  .brand .sub {
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .omni {
    margin-left: auto;
    position: relative;
    width: min(340px, 40vw);
  }
  .omni input {
    width: 100%;
    height: 36px;
    padding: 0 12px 0 34px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    box-shadow: 0 1px 2px rgba(20, 30, 50, 0.04);
  }
  .omni input::placeholder {
    color: var(--text-faint);
  }
  .omni input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .omni .icon {
    position: absolute;
    left: 11px;
    top: 10px;
    color: var(--text-faint);
    font-size: 15px;
  }
  .omni .results {
    position: absolute;
    top: 42px;
    left: 0;
    right: 0;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 14px 34px rgba(20, 30, 50, 0.14);
  }
  .omni .results.open {
    display: block;
  }
  .omni .results button {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line-soft);
    color: var(--text);
    font-family: var(--serif);
    font-size: 15px;
    cursor: pointer;
  }
  .omni .results button:hover {
    background: var(--accent-soft);
  }
  .omni .results button .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }
  .omni .results button .rtype {
    margin-left: auto;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  /* ---- left rail ---- */
  .rail {
    position: fixed;
    top: 58px;
    left: 0;
    bottom: 36px;
    width: 226px;
    padding: 18px 18px 18px 20px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
    background: linear-gradient(
      90deg,
      rgba(243, 245, 247, 0.86),
      rgba(243, 245, 247, 0)
    );
  }
  .rail h3 {
    margin: 0 0 10px;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 700;
  }
  .legend button,
  .sources button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 6px 7px;
    margin: 1px 0;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition:
      color 0.15s,
      opacity 0.15s,
      background 0.15s;
  }
  .legend button:hover,
  .sources button:hover {
    color: var(--text);
    background: rgba(20, 30, 50, 0.045);
  }
  .legend button.off,
  .sources button.off {
    opacity: 0.36;
  }
  .legend .star {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: none;
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 0 1px rgba(20, 30, 50, 0.12);
  }
  .legend .count,
  .sources .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .sources .swatch {
    width: 4px;
    height: 14px;
    border-radius: 1px;
    flex: none;
    background: var(--accent);
    opacity: 0.75;
  }

  /* ---- codex panel ---- */
  .codex {
    position: fixed;
    top: 58px;
    right: 0;
    bottom: 36px;
    width: min(400px, 92vw);
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-left: 1px solid var(--line);
    box-shadow: -12px 0 30px rgba(20, 30, 50, 0.06);
    z-index: 18;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
    display: flex;
    flex-direction: column;
  }
  .codex.open {
    transform: translateX(0);
  }
  .codex .scroll {
    overflow-y: auto;
    padding: 24px 26px 44px;
  }
  .codex .close {
    position: absolute;
    top: 15px;
    right: 16px;
    width: 28px;
    height: 28px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    z-index: 2;
  }
  .codex .close:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .codex .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
  }
  .codex .eyebrow .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 1px rgba(20, 30, 50, 0.15);
  }
  .codex .eyebrow .lbl {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 600;
  }
  .codex h1 {
    margin: 0 0 4px;
    font-family: var(--serif);
    font-size: 29px;
    line-height: 1.12;
    font-weight: 600;
    text-wrap: balance;
  }
  .codex .summary {
    margin: 13px 0 0;
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.6;
    color: #33393f;
  }

  .codex section {
    margin-top: 28px;
  }
  .codex section > .head {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    padding-bottom: 8px;
    margin-bottom: 13px;
    border-bottom: 1px solid var(--line-soft);
  }
  .stat-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 18px;
  }
  .stat-grid dt {
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-faint);
    align-self: center;
    font-weight: 600;
  }
  .stat-grid dd {
    margin: 0;
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .rel-family {
    margin-bottom: 16px;
  }
  .rel-family .fam-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .rel-row {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 8px;
    background: none;
    border: none;
    border-radius: 4px;
    text-align: left;
    color: var(--text);
    cursor: pointer;
  }
  .rel-row:hover {
    background: rgba(20, 30, 50, 0.05);
  }
  .rel-row .verb {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    min-width: 104px;
  }
  .rel-row .pdot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    border: 1px solid #fff;
    box-shadow: 0 0 0 1px rgba(20, 30, 50, 0.14);
  }
  .rel-row .peer {
    font-family: var(--serif);
    font-size: 15.5px;
  }

  .mention {
    display: block;
    width: 100%;
    text-align: left;
    cursor: pointer;
    padding: 13px 15px;
    margin-bottom: 9px;
    border-radius: 4px;
    background: #fbfaf6;
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--accent);
  }
  .mention:hover {
    background: #f6f4ec;
    border-color: var(--line);
    border-left-color: var(--accent);
  }
  .mention .cite {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
    display: flex;
    gap: 6px;
  }
  .mention .cite b {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .mention .snip {
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.55;
    color: #3a4048;
  }
  .mention .snip mark {
    background: rgba(184, 145, 42, 0.2);
    color: var(--text);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* ---- status bar ---- */
  .status {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 36px;
    z-index: 16;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
    background: linear-gradient(
      0deg,
      rgba(243, 245, 247, 0.95),
      rgba(243, 245, 247, 0)
    );
    font-variant-numeric: tabular-nums;
  }
  .status .k {
    color: var(--text-dim);
  }
  .status .sep {
    color: var(--line);
  }
  .status .hint {
    margin-left: auto;
    letter-spacing: 0.03em;
  }

  /* ---- reader overlay (the book view) ---- */
  .reader-scrim {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(30, 40, 55, 0.34);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .reader-scrim.open {
    display: flex;
  }
  .reader {
    width: min(680px, 100%);
    max-height: 82vh;
    overflow-y: auto;
    background: #fbfaf5;
    border: 1px solid #e6ddc8;
    border-radius: 5px;
    box-shadow: 0 30px 80px rgba(30, 40, 55, 0.25);
    padding: 36px 44px 44px;
  }
  .reader .cite {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .reader .path {
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 24px;
    font-family: var(--mono);
  }
  .reader .body {
    font-family: var(--serif);
    font-size: 17.5px;
    line-height: 1.74;
    color: #2c3138;
  }
  .reader .body p {
    margin: 0 0 16px;
  }
  .reader .body mark {
    background: rgba(184, 145, 42, 0.26);
    color: #4a390d;
    padding: 0 3px;
    border-radius: 2px;
  }
  .reader .rclose {
    position: sticky;
    top: 0;
    float: right;
    margin: -16px -20px 0 0;
    width: 30px;
    height: 30px;
    background: none;
    border: 1px solid #e0d7c2;
    border-radius: 4px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
  }
  .reader .rclose:hover {
    color: var(--text);
  }

  @media (max-width: 720px) {
    .rail {
      display: none;
    }
    .omni {
      width: 46vw;
    }
  }
</style>

<div id="stage"><canvas id="c"></canvas></div>

<header>
  <div class="brand">
    <span class="mark">Grimoire <b>Atlas</b></span>
    <span class="sub">A map of the worlds</span>
  </div>
  <div class="omni">
    <span class="icon" aria-hidden="true">⌕</span>
    <input
      id="search"
      type="text"
      placeholder="Find any entity…"
      autocomplete="off"
      aria-label="Search entities"
    />
    <div class="results" id="results"></div>
  </div>
</header>

<nav class="rail" aria-label="Filters">
  <div class="legend">
    <h3>Kinds of thing</h3>
    <div id="legend"></div>
  </div>
  <div class="sources">
    <h3>Source books</h3>
    <div id="sources"></div>
  </div>
</nav>

<aside class="codex" id="codex" aria-label="Entity detail">
  <button class="close" id="codexClose" aria-label="Close">✕</button>
  <div class="scroll" id="codexBody"></div>
</aside>

<div class="status">
  <span><span class="k" id="stNodes">0</span> entities</span>
  <span class="sep">·</span>
  <span><span class="k" id="stEdges">0</span> relationships</span>
  <span class="sep">·</span>
  <span id="stFocus">Nothing selected</span>
  <span class="hint"
    >drag to pan · scroll to zoom · click a node to open its codex</span
  >
</div>

<div class="reader-scrim" id="readerScrim">
  <div class="reader" id="reader">
    <button class="rclose" id="readerClose" aria-label="Close reader">✕</button>
    <div class="cite" id="readerCite"></div>
    <div class="path" id="readerPath"></div>
    <div class="body" id="readerBody"></div>
  </div>
</div>

<script>
  // ------------------------------------------------------------------ data
  const TYPES = {
    location: { label: "Location", color: "#2f8f6b" },
    creature: { label: "Creature", color: "#c0492b" },
    npc: { label: "NPC", color: "#b07d1e" },
    faction: { label: "Faction", color: "#7a52b0" },
    deity: { label: "Deity", color: "#b8912a" },
    item: { label: "Item", color: "#b83f7a" },
    spell: { label: "Spell", color: "#2f7fbf" },
  };

  const FAM = {
    spatial: { color: "#2b6f7e", label: "Spatial" },
    social: { color: "#6a58a0", label: "Social" },
    kinship: { color: "#a04f72", label: "Kinship" },
    religion: { color: "#9a7d24", label: "Religion" },
    creation: { color: "#54823f", label: "Creation" },
    magic: { color: "#2f6aa8", label: "Magic" },
    possession: { color: "#96602f", label: "Possession" },
    taxonomy: { color: "#4d6f80", label: "Taxonomy" },
    related: { color: "#8a94a2", label: "Related" },
  };
  const REL_FAM = {
    LOCATED_IN: "spatial",
    CONTAINS: "spatial",
    NEAR: "spatial",
    CONNECTS_TO: "spatial",
    PART_OF: "spatial",
    MEMBER_OF: "social",
    LEADER_OF: "social",
    SERVES: "social",
    ALLY_OF: "social",
    ENEMY_OF: "social",
    FOUNDED: "social",
    PARENT_OF: "kinship",
    CHILD_OF: "kinship",
    SIBLING_OF: "kinship",
    ANCESTOR_OF: "kinship",
    DESCENDANT_OF: "kinship",
    SPOUSE_OF: "kinship",
    WORSHIPS: "religion",
    PATRON_OF: "religion",
    CREATED_BY: "creation",
    CREATES: "creation",
    CASTS: "magic",
    GRANTS: "magic",
    SUMMONS: "magic",
    TRANSFORMS_INTO: "magic",
    COUNTERED_BY: "magic",
    OWNS: "possession",
    WIELDS: "possession",
    VARIANT_OF: "taxonomy",
    ORIGINATES_FROM: "taxonomy",
    RELATED_TO: "related",
  };
  const SYMMETRIC = new Set([
    "NEAR",
    "CONNECTS_TO",
    "ALLY_OF",
    "ENEMY_OF",
    "SIBLING_OF",
    "SPOUSE_OF",
    "VARIANT_OF",
    "RELATED_TO",
  ]);

  const BOOKS = {
    phb: "Player's Handbook",
    lmop: "Lost Mine of Phandelver",
    cos: "Curse of Strahd",
    pofm: "Princes of the Apocalypse",
  };

  const N = (id, type, name, summary, detail, mentions) => ({
    id,
    type,
    name,
    summary,
    detail: detail || null,
    mentions: mentions || [],
  });
  const NODES = [
    N(
      "gundren",
      "npc",
      "Gundren Rockseeker",
      "A Rockseeker dwarf who rediscovered the lost Wave Echo Cave and hired adventurers to escort supplies to Phandalin.",
      { Race: "Dwarf", Occupation: "Prospector", Disposition: "Friendly" },
      [
        {
          book: "lmop",
          path: "Part 1 · Goblin Arrows",
          text: "Three days ago, %Gundren Rockseeker% hired you to escort a wagonload of provisions to the rough-and-tumble settlement of Phandalin. Gundren rode ahead of you on his own horse.",
        },
      ],
    ),
    N(
      "nundro",
      "npc",
      "Nundro Rockseeker",
      "One of Gundren's brothers, held prisoner while the Black Spider searches for the Forge of Spells.",
      { Race: "Dwarf", Occupation: "Miner" },
    ),
    N(
      "sildar",
      "npc",
      "Sildar Hallwinter",
      "A veteran agent of the Lords' Alliance searching for his missing friend Iarno Albrek.",
      { Race: "Human", Occupation: "Knight", Disposition: "Lawful good" },
      [
        {
          book: "lmop",
          path: "Part 1 · Cragmaw Hideout",
          text: "The prisoner is %Sildar Hallwinter%, a human warrior. He is a member of the Lords' Alliance, a group that promotes cooperation between the various cities of the North.",
        },
      ],
    ),
    N(
      "klarg",
      "creature",
      "Klarg",
      "A bugbear chief of the Cragmaw goblins commanding the ambush along the Triboar Trail.",
      {
        Type: "Humanoid (goblinoid)",
        Size: "Medium",
        CR: "1",
        AC: "13",
        HP: "27",
      },
      [
        {
          book: "lmop",
          path: "Part 1 · Cragmaw Hideout",
          text: "%Klarg% is a bugbear, larger and meaner than the goblins he commands. He keeps a pet wolf named Ripper and dreams of the day he will rule the Cragmaw tribe.",
        },
      ],
    ),
    N(
      "cragmawcastle",
      "location",
      "Cragmaw Castle",
      "A ruined castle deep in Neverwinter Wood, seat of the hobgoblin King Grol.",
      { Kind: "Ruined castle", Region: "Neverwinter Wood" },
    ),
    N(
      "cragmaw",
      "faction",

    N(

    N(
      "waveecho",
      "location",
      "Wave Echo Cave",
      "A lost mine housing the fabled Forge of Spells, contested for centuries.",
      { Kind: "Cavern", Region: "Sword Mountains" },
      [
        {
          book: "lmop",
          path: "Part 4 · Wave Echo Cave",
          text: "%Wave Echo Cave% was the site of the Phandelver's Pact, an agreement forged between the humans, dwarves, and gnomes who first mined here. The magic of the cave lingers still.",
        },
      ],
    ),
    N(
      "forge",
      "location",
      "Forge of Spells",
      "A magical forge within Wave Echo Cave able to imbue arms and armor with power.",
      { Kind: "Magical site" },
    ),
    N(
      "phandalin",
      "location",
      "Phandalin",
      "A frontier town rebuilt on the ruins of an older settlement, cowed by the Redbrands.",
      { Kind: "Frontier town", Region: "Sword Coast" },
      [
        {

  const E = (a, b, rel, note) => ({ a, b, rel, note: note || null });
  const EDGES = [
    E("gundren", "nundro", "SIBLING_OF"),
    E("gundren", "phandalin", "LOCATED_IN"),
    E("gundren", "sildar", "ALLY_OF"),

  // ------------------------------------------------------------------ model
  const byId = {};
  NODES.forEach((n) => {
    byId[n.id] = n;
    n.deg = 0;
  });
  EDGES.forEach((e) => {
    byId[e.a].deg++;
    byId[e.b].deg++;
  });
  const adj = {};
  NODES.forEach((n) => (adj[n.id] = []));
  EDGES.forEach((e) => {
    adj[e.a].push(e);
    adj[e.b].push(e);
  });

  const activeTypes = new Set(Object.keys(TYPES));
  const activeBooks = new Set(Object.keys(BOOKS));
  function bookOf(n) {
    return n.mentions.length ? n.mentions[0].book : null;
  }
  function nodeVisible(n) {
    if (!activeTypes.has(n.type)) return false;
    const b = bookOf(n);
    if (b && !activeBooks.has(b)) return false;
    return true;
  }

  // ------------------------------------------------------------------ layout
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0,
    Hh = 0,
    DPR = 1;
  let view = { x: 0, y: 0, k: 1 };
  let focusId = null,
    hoverId = null;

  NODES.forEach((n, i) => {
    const a = (i / NODES.length) * Math.PI * 2;
    const r = 120 + (i % 5) * 34;
    n.x = Math.cos(a) * r;
    n.y = Math.sin(a) * r;
    n.vx = 0;
    n.vy = 0;
  });

  let energy = 1,
    frame = 0;
  function tick() {
    const nodes = NODES.filter(nodeVisible);
    const idset = new Set(nodes.map((n) => n.id));
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x,
          dy = a.y - b.y;
        let d2 = dx * dx + dy * dy || 0.01;
        const f = 5600 / d2,
          d = Math.sqrt(d2);
        const fx = (dx / d) * f,
          fy = (dy / d) * f;
        a.vx += fx;
        a.vy += fy;
        b.vx -= fx;
        b.vy -= fy;
      }
    }
    EDGES.forEach((e) => {
      if (!idset.has(e.a) || !idset.has(e.b)) return;
      const a = byId[e.a],
        b = byId[e.b];
      let dx = b.x - a.x,
        dy = b.y - a.y;
      let d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - 100) * 0.028;
      const fx = (dx / d) * f,
        fy = (dy / d) * f;
      a.vx += fx;
      a.vy += fy;
      b.vx -= fx;
      b.vy -= fy;
    });
    nodes.forEach((n) => {
      n.vx += -n.x * 0.0016;
      n.vy += -n.y * 0.0016;
      n.vx *= 0.86;
      n.vy *= 0.86;
      n.x += n.vx * energy;
      n.y += n.vy * energy;
    });
    energy *= 0.994;
    if (energy < 0) energy = 0;
  }

  // ------------------------------------------------------------------ render
  function toScreen(n) {
    return { x: n.x * view.k + view.x, y: n.y * view.k + view.y };
  }
  function radius(n) {
    return (6 + Math.min(n.deg, 8) * 1.5) * Math.sqrt(view.k);
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, Hh);
    ctx.fillStyle = "#f3f5f7";
    ctx.fillRect(0, 0, W, Hh);

    // map graticule (world-space grid, pans + zooms with content)
    const step = 84 * view.k;
    if (step > 12) {
      ctx.strokeStyle = "#e6eaf0";
      ctx.lineWidth = 1;
      const ox = view.x % step,
        oy = view.y % step;
      ctx.beginPath();
      for (let x = ox; x < W; x += step) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, Hh);
      }
      for (let y = oy; y < Hh; y += step) {
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }
      ctx.stroke();
    }

    const nodes = NODES.filter(nodeVisible);
    const idset = new Set(nodes.map((n) => n.id));
    const focusAdj = focusId
      ? new Set(adj[focusId].map((e) => (e.a === focusId ? e.b : e.a)))
      : null;

    // edges
    EDGES.forEach((e) => {
      if (!idset.has(e.a) || !idset.has(e.b)) return;
      const a = toScreen(byId[e.a]),
        b = toScreen(byId[e.b]);
      const fam = FAM[REL_FAM[e.rel] || "related"];
      const incident = focusId && (e.a === focusId || e.b === focusId);
      ctx.strokeStyle = fam.color;
      ctx.globalAlpha = focusId ? (incident ? 0.92 : 0.12) : 0.42;
      ctx.lineWidth = incident ? 2 : 1.1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      if (!SYMMETRIC.has(e.rel) && (incident || !focusId)) {
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        const rr = radius(byId[e.b]) + 3;
        const tx = b.x - Math.cos(ang) * rr,
          ty = b.y - Math.sin(ang) * rr;
        const s = incident ? 8 : 6;
        ctx.globalAlpha = focusId ? (incident ? 0.92 : 0.12) : 0.5;
        ctx.fillStyle = fam.color;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - Math.cos(ang - 0.4) * s, ty - Math.sin(ang - 0.4) * s);
        ctx.lineTo(tx - Math.cos(ang + 0.4) * s, ty - Math.sin(ang + 0.4) * s);
        ctx.closePath();
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;

    // nodes (solid "map pin" discs with a white keyline)
    nodes.forEach((n) => {
      const p = toScreen(n),
        r = radius(n),
        col = TYPES[n.type].color;
      const dim = focusId && n.id !== focusId && !focusAdj.has(n.id);
      ctx.globalAlpha = dim ? 0.4 : 1;
      ctx.shadowColor = "rgba(30,40,55,0.28)";
      ctx.shadowBlur = dim ? 0 : 6;
      ctx.shadowOffsetY = dim ? 0 : 1;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 7);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = "rgba(255,255,255,0.92)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 7);
      ctx.stroke();
      if (n.id === focusId) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#33507a";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 5, 0, 7);
        ctx.stroke();
      } else if (n.id === hoverId) {
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = "#1a1f28";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 4, 0, 7);
        ctx.stroke();
      }
    });

    // labels last, so they sit above everything, with a white halo for legibility
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    nodes.forEach((n) => {
      const p = toScreen(n),
        r = radius(n);
      const isFocus = n.id === focusId,
        isNbr = focusAdj && focusAdj.has(n.id),
        isHover = n.id === hoverId;
      const dim = focusId && !isFocus && !isNbr && !isHover;
      if (dim && view.k < 0.8) return; // hide distant labels only when zoomed far out
      ctx.font =
        (isFocus ? "600 15px " : isNbr || isHover ? "14px " : "13px ") +
        '"Iowan Old Style", Palatino, Georgia, serif';
      const ty = p.y + r + 6;
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = "rgba(243,245,247,0.92)";
      ctx.strokeText(n.name, p.x, ty);
      ctx.fillStyle = isFocus ? "#12161c" : dim ? "#8a94a2" : "#2c333d";
      ctx.fillText(n.name, p.x, ty);
    });
  }

  function loop() {
    frame++;
    if (energy > 0.001) tick();
    draw();
    requestAnimationFrame(loop);
  }

  // ------------------------------------------------------------------ interaction
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    Hh = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = Hh * DPR;
  }
  window.addEventListener("resize", resize);

  function hitTest(mx, my) {
    const nodes = NODES.filter(nodeVisible);
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i],
        p = toScreen(n),
        r = radius(n) + 6;
      if ((mx - p.x) ** 2 + (my - p.y) ** 2 <= r * r) return n.id;
    }
    return null;
  }

  let down = null,
    moved = false;
  canvas.addEventListener("mousedown", (e) => {
    down = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    moved = false;
    canvas.classList.add("dragging");
  });
  window.addEventListener("mouseup", (e) => {
    canvas.classList.remove("dragging");
    if (down && !moved) {
      const rect = canvas.getBoundingClientRect();
      const id = hitTest(e.clientX - rect.left, e.clientY - rect.top);
      if (id) selectNode(id);
      else deselect();
    }
    down = null;
  });
  window.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    if (down) {
      const dx = e.clientX - down.x,
        dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      view.x = down.vx + dx;
      view.y = down.vy + dy;
    } else {
      const h = hitTest(e.clientX - rect.left, e.clientY - rect.top);
      if (h !== hoverId) {
        hoverId = h;
        canvas.style.cursor = h ? "pointer" : "grab";
      }
    }
  });
  canvas.addEventListener(
    "wheel",
    (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left,
        my = e.clientY - rect.top;
      const wx = (mx - view.x) / view.k,
        wy = (my - view.y) / view.k;
      const k2 = Math.max(
        0.35,
        Math.min(3.4, view.k * (e.deltaY < 0 ? 1.12 : 0.89)),
      );
      view.k = k2;
      view.x = mx - wx * k2;
      view.y = my - wy * k2;
    },
    { passive: false },
  );

  function centerOn(n, animate) {
    const tx = W / 2 - n.x * view.k,
      ty = Hh / 2 - n.y * view.k;
    if (!animate || reduce) {
      view.x = tx;
      view.y = ty;
      return;
    }
    const sx = view.x,
      sy = view.y,
      t0 = frame;
    (function anim() {
      const t = Math.min(1, (frame - t0) / 22),
        e = 1 - Math.pow(1 - t, 3);
      view.x = sx + (tx - sx) * e;
      view.y = sy + (ty - sy) * e;
      if (t < 1) requestAnimationFrame(anim);
    })();
  }

  // ------------------------------------------------------------------ codex
  const codex = document.getElementById("codex");
  const codexBody = document.getElementById("codexBody");
  function relLabel(rel) {
    return rel.replace(/_/g, " ").toLowerCase();
  }

  function selectNode(id) {
    const n = byId[id];
    focusId = id;
    document.getElementById("stFocus").textContent =
      n.name + " — " + TYPES[n.type].label;
    centerOn(n, true);
    renderCodex(n);
    codex.classList.add("open");
  }
  function deselect() {
    focusId = null;
    codex.classList.remove("open");
    document.getElementById("stFocus").textContent = "Nothing selected";
  }
  document.getElementById("codexClose").addEventListener("click", deselect);

  function renderCodex(n) {
    const col = TYPES[n.type].color;
    let h = "";
    h += `<div class="eyebrow"><span class="dot" style="background:${col}"></span><span class="lbl">${TYPES[n.type].label}</span></div>`;
    h += `<h1>${n.name}</h1>`;
    h += `<p class="summary">${n.summary}</p>`;
    if (n.detail) {
      h += `<section><div class="head">Statblock</div><dl class="stat-grid">`;
      for (const [k, v] of Object.entries(n.detail))
        h += `<dt>${k}</dt><dd>${v}</dd>`;
      h += `</dl></section>`;
    }
    const rels = adj[n.id].map((e) => {
      const outgoing = e.a === n.id,
        peer = byId[outgoing ? e.b : e.a];
      const dir = SYMMETRIC.has(e.rel) ? "sym" : outgoing ? "out" : "in";
      return { rel: e.rel, fam: REL_FAM[e.rel] || "related", peer, dir };
    });
    if (rels.length) {
      const groups = {};
      rels.forEach((r) => (groups[r.fam] = groups[r.fam] || []).push(r));
      h += `<section><div class="head">Relationships · ${rels.length}</div>`;
      Object.keys(FAM).forEach((fam) => {
        if (!groups[fam]) return;
        h += `<div class="rel-family"><div class="fam-label" style="color:${FAM[fam].color}">${FAM[fam].label}</div>`;
        groups[fam].forEach((r) => {
          const arrow = r.dir === "sym" ? "↔" : r.dir === "out" ? "→" : "←";
          h += `<button class="rel-row" data-goto="${r.peer.id}">
          <span class="verb">${arrow} ${relLabel(r.rel)}</span>
          <span class="pdot" style="background:${TYPES[r.peer.type].color}"></span>
          <span class="peer">${r.peer.name}</span>
        </button>`;
        });
        h += `</div>`;
      });
      h += `</section>`;
    }
    if (n.mentions.length) {
      h += `<section><div class="head">Appears in the books</div>`;
      n.mentions.forEach((m, i) => {
        const snip = m.text.replace(/%([^%]+)%/g, "<mark>$1</mark>");
        h += `<button class="mention" data-read="${n.id}:${i}">
        <div class="cite"><b>${BOOKS[m.book]}</b><span>·</span><span>${m.path}</span></div>
        <div class="snip">${snip}</div>
      </button>`;
      });
      h += `</section>`;
    } else {
      h += `<section><div class="head">Appears in the books</div><p style="color:var(--text-faint);font-size:13.5px;margin:0">No source passages linked in this sample.</p></section>`;
    }
    codexBody.innerHTML = h;
    codexBody.scrollTop = 0;
    codexBody
      .querySelectorAll("[data-goto]")
      .forEach((b) =>
        b.addEventListener("click", () => selectNode(b.dataset.goto)),
      );
    codexBody
      .querySelectorAll("[data-read]")
      .forEach((b) =>
        b.addEventListener("click", () => openReader(b.dataset.read)),
      );
  }

  // ------------------------------------------------------------------ reader
  const scrim = document.getElementById("readerScrim");
  function openReader(ref) {
    const [id, idx] = ref.split(":"),
      n = byId[id],
      m = n.mentions[+idx];
    document.getElementById("readerCite").textContent = BOOKS[m.book];
    document.getElementById("readerPath").textContent = m.path;
    const body = m.text.replace(/%([^%]+)%/g, "<mark>$1</mark>");
    document.getElementById("readerBody").innerHTML =
      `<p>${body}</p><p style="color:var(--text-faint);font-style:italic">…the passage continues in the reader. In the live Atlas, this opens the full chapter with every entity on the page turned into a clickable node.</p>`;
    scrim.classList.add("open");
  }
  function closeReader() {
    scrim.classList.remove("open");
  }
  document.getElementById("readerClose").addEventListener("click", closeReader);
  scrim.addEventListener("click", (e) => {
    if (e.target === scrim) closeReader();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeReader();
  });

  // ------------------------------------------------------------------ legend + sources
  function countByType() {
    const c = {};
    Object.keys(TYPES).forEach((t) => (c[t] = 0));
    NODES.forEach((n) => c[n.type]++);
    return c;
  }
  function buildLegend() {
    const el = document.getElementById("legend"),
      counts = countByType();
    el.innerHTML = "";
    Object.entries(TYPES).forEach(([t, m]) => {
      const b = document.createElement("button");
      if (!activeTypes.has(t)) b.classList.add("off");
      b.innerHTML = `<span class="star" style="background:${m.color}"></span><span>${m.label}</span><span class="count">${counts[t]}</span>`;
      b.addEventListener("click", () => {
        if (activeTypes.has(t)) activeTypes.delete(t);
        else activeTypes.add(t);
        b.classList.toggle("off");
        energy = Math.max(energy, 0.5);
        updateStatus();
      });
      el.appendChild(b);
    });
  }
  function buildSources() {
    const el = document.getElementById("sources");
    el.innerHTML = "";
    const counts = {};
    Object.keys(BOOKS).forEach((b) => (counts[b] = 0));
    NODES.forEach((n) => {
      const b = bookOf(n);
      if (b) counts[b]++;
    });
    Object.entries(BOOKS).forEach(([id, name]) => {
      const b = document.createElement("button");
      if (!activeBooks.has(id)) b.classList.add("off");
      b.innerHTML = `<span class="swatch"></span><span>${name}</span><span class="count">${counts[id]}</span>`;
      b.addEventListener("click", () => {
        if (activeBooks.has(id)) activeBooks.delete(id);
        else activeBooks.add(id);
        b.classList.toggle("off");
        energy = Math.max(energy, 0.5);
        updateStatus();
      });
      el.appendChild(b);
    });
  }

  // ------------------------------------------------------------------ search
  const search = document.getElementById("search"),
    results = document.getElementById("results");
  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    if (!q) {
      results.classList.remove("open");
      return;
    }
    const hits = NODES.filter((n) => n.name.toLowerCase().includes(q)).slice(
      0,
      8,
    );
    results.innerHTML = hits
      .map(
        (n) =>
          `<button data-id="${n.id}"><span class="dot" style="background:${TYPES[n.type].color}"></span>${n.name}<span class="rtype">${TYPES[n.type].label}</span></button>`,
      )
      .join("");
    results.classList.toggle("open", hits.length > 0);
    results.querySelectorAll("[data-id]").forEach((b) =>
      b.addEventListener("click", () => {
        const n = byId[b.dataset.id];
        activeTypes.add(n.type);
        const bk = bookOf(n);
        if (bk) activeBooks.add(bk);
        buildLegend();
        buildSources();
        selectNode(b.dataset.id);
        search.value = "";
        results.classList.remove("open");
        updateStatus();
      }),
    );
  });
  search.addEventListener("blur", () =>
    setTimeout(() => results.classList.remove("open"), 150),
  );

  // ------------------------------------------------------------------ status
  function updateStatus() {
    const nodes = NODES.filter(nodeVisible),
      idset = new Set(nodes.map((n) => n.id));
    const edges = EDGES.filter((e) => idset.has(e.a) && idset.has(e.b));
    document.getElementById("stNodes").textContent = nodes.length;
    document.getElementById("stEdges").textContent = edges.length;
  }

  // ------------------------------------------------------------------ boot
  resize();
  buildLegend();
  buildSources();
  updateStatus();
  loop();
  setTimeout(() => selectNode("strahd"), 400);
</script>
