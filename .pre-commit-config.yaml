default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: protect-main-branch
        name: Protect main branch
        entry: bazel/tools/git/protect-main.sh
        language: script
        always_run: true
        pass_filenames: false

      # Fast path only: format files changed vs origin/main (no full generators,
      # no remote test). Full gate is `ci` before push / in agent sessions.
      - id: ci-lint
        name: ci lint (changed files)
        entry: bazel/tools/ci/ci lint
        language: script
        always_run: true
        pass_filenames: false

      - id: update-python-requirements
        name: Update Python requirements
        entry: bazel/tools/format/update-python-requirements-if-needed.sh
        language: script
        files: 'pyproject\.toml$'
        pass_filenames: false

      # pass_filenames is true so a commit only re-locks the configs it actually
      # touches. Repo-wide is still available by running the script with no
      # arguments; it is the renovate-apko-lock-maintenance CronWorkflow's job,
      # not something a single commit should drag along (each rewritten lock
      # re-bakes that guest's rootfs on every brick).
      - id: update-apko-locks
        name: Update apko locks
        entry: bazel/tools/format/update-apko-locks.sh
        language: script
        files: 'apko\.yaml$'
        pass_filenames: true

      - id: update-atlas-sum
        name: Update Atlas migration checksums
        entry: bazel/tools/format/update-atlas-sum.sh
        language: script
        files: 'migrations/.*\.sql$'
        pass_filenames: false

      - id: check-migration-ordering
        name: Check migration version ordering
        entry: bazel/tools/format/check-migration-ordering.sh
        language: script
        files: 'migrations/.*\.sql$'
        pass_filenames: false

      - id: post-rewrite-format
        name: Format after rebase
        entry: bazel/tools/git/post-rewrite-format.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [post-rewrite]

      # Full remote Test (1:1 Workflows), OPT-IN: RUN_CI_TEST=1 git push.
      # Install with:
      #   pre-commit install --hook-type pre-push
      - id: ci-test
        name: ci test (bb remote, 1:1 Workflows Test)
        entry: bazel/tools/git/pre-push-ci-test.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: ascii-commit-msg
        name: Reject non-ASCII characters in commit title
        entry: bazel/tools/git/check-commit-msg-ascii.sh
        language: script
        stages: [commit-msg]
        always_run: true
        pass_filenames: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
