# Invariants: rules that must always hold in this directory.
# docs/templates/INVARIANTS.yaml describes the fields. IDs are permanent:
# never reuse or renumber one. docs/THREAT-MODEL.md cites them.
invariants:
- id: ROOT-1
  statement: Only CI changes a published chart's version or raises its deployment pin. A PR may lower
    a pin to revert.
  mechanism:
  - bazel/tools/ci/chart_version_guard.py
  test: //bazel/tools/ci:chart_version_guard_test
  state: live
- id: ROOT-2
  statement: No secret value is in git.
  mechanism: []
  state: designed
- id: ROOT-3
  statement: Every third-party GitHub Action is pinned by commit SHA.
  mechanism: []
  state: designed
- id: ROOT-4
  statement: PR content warnings scan added lines and PR commit messages and report rule labels without matched values.
  mechanism:
  - bazel/tools/ci/pr_content_scan.py
  test: //bazel/tools/ci:pr_content_scan_test
  state: live
