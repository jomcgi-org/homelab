[project]
name = "homelab"
classifiers = ["Private :: Do Not Upload"]
version = "0"

# Dependencies should NOT use "Version Matching clauses" (matching operator `==`)
# https://packaging.python.org/en/latest/specifications/version-specifiers/#version-matching
# This project uses 'uv pip compile' from https://github.com/astral-sh/uv
# which will ensure the resolved versions of both direct and indirect dependencies are pinned.
# Therefore we only need to constrain versions when some ranges
# of dependency versions are not compatible.
dependencies = [
    "fastapi>=0.138.0",
    "fastmcp>=3.0.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic~=2.5",
    # projects/monolith/auth verifies authentik RS256 tokens with this. It was
    # previously present only because mcp and semgrep happened to pull it in, so
    # an upstream dropping it would have broken token verification through a
    # dependency this repo never named. The [crypto] extra is required: without
    # it PyJWT has no RSA backend and RS256 verification raises at runtime.
    "pyjwt[crypto]>=2.13.0",
    "httpx~=0.28.1",
    # curl_cffi impersonates a browser TLS/JA3 fingerprint. The BC Parks
    # (camping.bcparks.ca) reservation API sits behind an Azure WAF that 403s
    # httpx/urllib on fingerprint; curl_cffi is how the campsites job reads it.
    "curl-cffi~=0.15.0",
    "beautifulsoup4~=4.12",
    "pyyaml~=6.0",
    "timelength~=1.0",
    "typer~=0.9",
    # DBOS Transact: durable, Postgres-checkpointed workflows used to compose
    # agent sessions into deterministic graphs (ADR agents/038). In-process
    # library, not a service; its system tables live in the `dbos` schema of the
    # existing monolith database.
    "dbos",
    "python-multipart>=0.0.31",
    "pytest~=7.4",
    "pytest-asyncio~=0.21",
    "boto3>=1.34",
    "opentelemetry-api~=1.22",
    "opentelemetry-sdk~=1.22",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "opentelemetry-exporter-otlp~=1.22",
    # AIS ingest dependencies
    "websockets>=15.0",
    "certifi",  # CA certificates for SSL in minimal containers
    # Stargazer geospatial dependencies
    "rasterio~=1.3",
    "geopandas>=0.14",
    "shapely~=2.0",
    "pillow>=12.1.1",
    "astral~=3.2",
    "networkx~=3.0",
    # cdk8s for Kubernetes manifest generation
    "cdk8s~=2.68",
    "constructs~=10.0",
    # XML parsing with XXE protection
    "defusedxml~=0.7",
    "starlette>=1.3.1",
    # Monolith dependencies
    "sqlmodel~=0.0.22",
    # Chat module dependencies
    "discord.py>=2.4",
    # Timeout-bounded matching for persisted user-configured message triggers.
    "regex>=2026.4.4",
    # >=1.102.0 closes CVE-2026-48782; <2 stays on the API-stable 1.x line
    # (v2.0 removes the deprecated prepare_tools= callable and result accessors
    # this repo still uses). Revisit the v2 migration separately.
    "pydantic-ai-slim[openai]>=1.102.0,<2",
    # Direct dependency of shared/pricing.py for model list prices.
    "genai-prices>=0.1.6,<0.2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "icalendar~=6.0",
    "tzdata",
    # Kubernetes API client (async) — stats endpoint, future observability MCP
    "kubernetes-asyncio>=31.0",
]

# See https://docs.astral.sh/ruff/configuration/
[tool.ruff]
extend-exclude = [".claude/worktrees"]
