name: Factory mobile preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - projects/monolith/frontend/**
      - projects/design-system/tokens/**
      - projects/design-system/**
      - projects/monolith/chart/templates/httproute-friends*.yaml
      - projects/monolith/chart/templates/httproute-grimoire.yaml
      - .github/workflows/factory-mobile-preview.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - bazel/patches/**

# Untrusted PR code gets a fresh hosted runner, no secrets, deployment
# credentials, remote cache, or repository write token.
permissions:
  contents: read

concurrency:
  group: factory-mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FACTORY_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.3"
      - name: Install frozen workspace dependencies
        run: |
          npm install --global pnpm@10.34.5
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate same-commit loader fixtures and build real factory views
        working-directory: projects/monolith/frontend
        run: |
          pnpm exec vitest run --config factory-preview/vitest.config.js
          pnpm exec vite build --config factory-preview/vite.config.js
      - name: Install Chromium test runner
        run: |
          python3 -m venv /tmp/factory-browser
          /tmp/factory-browser/bin/pip install playwright==1.63.0 PyYAML==6.0.3
          /tmp/factory-browser/bin/playwright install --with-deps chromium
      - name: Check synthetic phone, text-resize, and desktop breakpoints
        run: |
          /tmp/factory-browser/bin/python projects/monolith/frontend/factory-preview/browser_check.py \
            --artifact projects/monolith/frontend/factory-fixture-preview \
            --output factory-preview-evidence \
            --expected-sha "$FACTORY_PREVIEW_SHA"
      - name: Build production frontend and check friends asset redirects
        run: |
          python3 projects/monolith/knowledge/tools/gen_docs_manifest.py
          pnpm --dir projects/monolith/frontend exec vite build
          # Same pinned Helm archive and checksum as bazel/tools/tools.lock.json.
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz -o /tmp/friends-helm.tar.gz
          echo 'fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  /tmp/friends-helm.tar.gz' | sha256sum --check
          mkdir -p /tmp/friends-helm
          tar -xzf /tmp/friends-helm.tar.gz -C /tmp/friends-helm
          export HELM_BIN=/tmp/friends-helm/linux-amd64/helm
          export PYTHON=/tmp/factory-browser/bin/python
          # Reuse the exact Playwright driver and Chromium installed above.
          export PLAYWRIGHT_MODULE="$($PYTHON -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver/package/index.mjs")')"
          node projects/monolith/frontend/scripts/check-friends-assets.mjs
      - name: Upload friends asset network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: friends-assets-evidence-${{ github.event.pull_request.head.sha }}
          path: friends-assets-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exact-commit screenshots, traces, and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-preview-evidence-${{ github.event.pull_request.head.sha }}
          path: factory-preview-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested synthetic artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-preview-${{ github.event.pull_request.head.sha }}
          path: projects/monolith/frontend/factory-fixture-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Check SSR and hydration, and build synthetic theme views
        working-directory: projects/monolith/frontend
        run: |
          pnpm exec vitest run --config theme-preview/vitest.config.js
          pnpm exec vite build --config theme-preview/vite.config.js
      - name: Check theme contrast, keyboard focus, and real text resize
        run: |
          /tmp/factory-browser/bin/python projects/monolith/frontend/theme-preview/browser_check.py \
            --artifact projects/monolith/frontend/theme-fixture-preview \
            --output theme-preview-evidence \
            --expected-sha "$FACTORY_PREVIEW_SHA"
      - name: Upload exact-commit theme contrast and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theme-preview-evidence-${{ github.event.pull_request.head.sha }}
          path: theme-preview-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested synthetic theme artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theme-preview-${{ github.event.pull_request.head.sha }}
          path: projects/monolith/frontend/theme-fixture-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Check controls SSR and hydration, and build synthetic controls
        working-directory: projects/monolith/frontend
        run: |
          pnpm exec vitest run --config controls-preview/vitest.config.js
          pnpm exec vite build --config controls-preview/vite.config.js
      - name: Check controls semantics, keyboard, contrast, and real text resize
        run: |
          /tmp/factory-browser/bin/python projects/monolith/frontend/controls-preview/browser_check.py \
            --artifact projects/monolith/frontend/controls-fixture-preview \
            --output controls-preview-evidence \
            --expected-sha "$FACTORY_PREVIEW_SHA"
      - name: Upload exact-commit controls checks and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controls-preview-evidence-${{ github.event.pull_request.head.sha }}
          path: controls-preview-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload tested synthetic controls artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controls-preview-${{ github.event.pull_request.head.sha }}
          path: projects/monolith/frontend/controls-fixture-preview/
          if-no-files-found: error
          retention-days: 14
