actions:
  # One required runner for PRs, queue and main. History: bazel/ARCHITECTURE.md#ci-runner-history
  - name: "pr-checks"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      # Keep static values in parity with bazel/tools/ci/runner-resources.env.
      cpu: "8"
      memory: "10GB"
      disk: "120GB"
    # Full history for chart-version and commit guards; see CI runner history.
    git_fetch_depth: 0
    # Shared two-hour ceiling; historical timeout evidence is in CI runner history.
    timeout: "2h"
    triggers:
      pull_request:
        branches:
          - "*"
        merge_with_base: false
      # Queue candidates arrive as pushes; keep the wildcard trigger.
      push:
        branches:
          - "gh-readonly-queue/*"
          - "main"
    steps:
      - run: |
          # Any failed stage must stop this single workflow shell.
          set -eu

          # Between-stage samples understate peaks; see CI runner history.

          # ---- snapshot hygiene ------------------------------------------
          trap 'rm -rf /home/buildbuddy/workspace/output-base/sandbox/sandbox_stash 2>/dev/null || true' EXIT

          workspace_breakdown() {
            echo "WORKSPACE $1:"
            du -hx -d 3 /home/buildbuddy/workspace 2>/dev/null |
              sort -h | tail -25 || true
            du -shx /var/lib/docker /usr /opt 2>/dev/null || true
          }

          echo "DISK pr-checks start:"; df -h /
          workspace_breakdown "pr-checks start"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u jomcgi --password-stdin

          # Authenticate manifest fetches when the existing optional secret exists.
          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "${DOCKERHUB_USERNAME:-}" --password-stdin
          fi

          # ---- 0. classify the run -----------------------------------------
          ON_MAIN=false
          SKIP_MAIN_PUBLISH=false
          if [ -n "${GIT_BRANCH:-}" ] &&
             [ "${GIT_BRANCH:-}" = "${GIT_REPO_DEFAULT_BRANCH:-}" ] &&
             [ "${GIT_PR_NUMBER:-0}" = "0" ]; then
            ON_MAIN=true
            COMMIT_SUBJECT="$(git log -1 --format=%s)"
            case "$COMMIT_SUBJECT" in
              "chore(charts): publish"*)
                SKIP_MAIN_PUBLISH=true
                echo "On ${GIT_BRANCH}: tests will refresh the snapshot; the chart-version write-back is already complete."
                ;;
              *)
                echo "On ${GIT_BRANCH}: full gate plus publish."
                ;;
            esac
          fi

          # ---- 1. central BUILD ratchet -----------------------------------
          base_ref="origin/${GIT_REPO_DEFAULT_BRANCH:-main}"
          git fetch origin "${GIT_REPO_DEFAULT_BRANCH:-main}" --quiet
          base_ref="$(git merge-base "$base_ref" HEAD)"

          # Shared ordered guards stop at the first failure.
          ./bazel/tools/ci/ratchets.sh "$base_ref" HEAD

          commit_format_drift() {
            format_commit_subject="$1"
            shift
            if git diff --exit-code && [ "$#" -eq 0 ]; then
              echo "All files formatted correctly"
            elif [ "$ON_MAIN" = true ]; then
              # Main stays read-only after publish.
              echo "ERROR: Code not formatted or BUILD files out of sync."
              echo "Run 'ci lint' and 'ci regen' on a PR branch; its Format stage auto-commits BUILD changes."
              git --no-pager diff
              exit 1
            else
              # Push drift only on writable PR refs; require checks on the new head.
              echo "Auto-committing formatting fixes..."
              current_branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
              # Queue refs are read-only; repair drift on the PR branch.
              case "${GIT_BRANCH:-$current_branch}" in
                gh-readonly-queue/*)
                  echo "Format drift on merge-queue candidate ${GIT_BRANCH:-$current_branch}; commit it on the PR branch and re-enqueue."
                  git diff --stat
                  exit 1
                  ;;
              esac
              git config user.name "ci-format-bot"
              git config user.email "ci-format-bot@users.noreply.github.com"
              git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/jomcgi-org/homelab.git"
              git add -u
              if [ "$#" -gt 0 ]; then
                git add -- "$@"
              fi
              git commit -m "$format_commit_subject"
              git push origin HEAD:"$current_branch"
              echo "Pushed to $current_branch; the new head runs the full pipeline."
              # Fail the superseded head; only the new head can pass the gate.
              exit 1
            fi
          }

          prepare_go_build_graph() {
            # Prepare Go/proto registrations before any graph analysis.
            if [ -n "$(git ls-files --others --exclude-standard -- \
              ':(glob)**/BUILD' ':(glob)**/BUILD.bazel')" ]; then
              echo "Untracked BUILD files precede CI generation; a clean checkout is required."
              exit 1
            fi
            bazel run //:gazelle --config=ci -- -lang=go,proto
            new_build_files=()
            while IFS= read -r -d '' build_file; do
              new_build_files+=("$build_file")
            done < <(git ls-files --others --exclude-standard -z -- \
              ':(glob)**/BUILD' ':(glob)**/BUILD.bazel')
            commit_format_drift "style: generate Go build graph" "${new_build_files[@]}"
          }

          # Regenerate image indexes before any Bazel query analyzes them.
          AUTHOR="$(git log -1 --format='%an')"
          if [ "$ON_MAIN" = false ] &&
             [ "${GIT_PR_NUMBER:-0}" != "0" ] &&
             [ -n "${GIT_BRANCH:-}" ] &&
             [[ ! "${GIT_BRANCH:-}" =~ ^gh-readonly-queue/ ]] &&
             [ "$AUTHOR" != "ci-format-bot" ]; then
            ./bazel/images/generate-push-all.sh
          fi

          if [ "$ON_MAIN" = false ]; then
            prepare_go_build_graph
          fi

          # ---- 1b. tracked Python test reachability -----------------------
          python3 ./bazel/tools/ci/test_source_reachability.py

          # ---- 2. tests ---------------------------------------------------
          if [[ "${GIT_BRANCH:-}" =~ ^gh-readonly-queue/ ]] || [ "${GIT_PR_NUMBER:-0}" = "0" ]; then
            bazel test //... --config=ci --deleted_packages=bazel/tools/python
          else
            ./bazel/tools/ci/local-affected-test.sh "$base_ref"
          fi

          # ---- 3. deploy on main, prove images everywhere else ------------
          if [ "$ON_MAIN" = true ] && [ "$SKIP_MAIN_PUBLISH" = false ]; then
            # Publish changed images before chart versions are written back.
            ./bazel/images/push/push-changed.sh

            echo "DISK pr-checks after publish:"; df -h /

            # Keep the existing authenticated chart-writeback path on main only.
            git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/jomcgi-org/homelab.git"
            ./bazel/helm/write-back-versions.sh .chart-version-records --record-publication
          elif [ "$ON_MAIN" = false ]; then
            # PR and queue prove image builds without publishing.
            bazel build //bazel/images:push_all --config=ci

            # Reject newly duplicated container environment names.
            ./bazel/helm/ci-diff-manifests.sh
          else
            echo "Skipping publish for the chart-version write-back: $COMMIT_SUBJECT"
          fi

          # After whichever image stage ran, normally the fattest point.
          echo "DISK pr-checks after images:"; df -h /

          # ---- 4. format, generators, drift -------------------------------
          if [ "$ON_MAIN" = true ] && [ "$SKIP_MAIN_PUBLISH" = true ]; then
            echo "Skipping format for generated main commit."
          else
            # Format-bot heads skip formatting only; tests still gate them.
            AUTHOR="$(git log -1 --format='%an')"
            if [ "$AUTHOR" = "ci-format-bot" ] &&
               [ "$(git log -1 --format=%s)" = "style: auto-format" ]; then
              echo "HEAD is the ci-format-bot commit; formatting just ran, going straight to tests."
            else
              # Run all formatters before source generation and drift writeback.
              bazel run //bazel/tools/format:format --config=ci

              # Copy only the pinned generated Go stubs into tracked sources.
              bazel run //projects/embervm/proto/embervm/node/v1:update_go_stubs --config=ci

              # Validate grep-based generate scripts against bazel query
              ./bazel/images/validate-generate-scripts.sh

              # Enforce linear, unique Atlas migration versions.
              ./bazel/tools/format/check-migration-ordering.sh

              # Enforce ASCII commit messages for Cloudflare compatibility.
              ./bazel/tools/git/check-commit-msg-ascii.sh --all origin/main

              # Hook scripts must exist and be executable.
              ./bazel/tools/hooks/validate-hooks-executable.sh

              # Validate root README structural claims against the working tree.
              python3 ./bazel/tools/format/readme_structure/check_readme_structure.py

              # Check working-tree links, including on full-history clones.
              python3 ./bazel/tools/format/doc_links/check_doc_links.py

              # Check vendored Helm dependencies and Bazel image tag invariants.
              python3 ./bazel/tools/format/helm_deps/check_helm_deps.py

              commit_format_drift "style: auto-format"
            fi
          fi

          # Check generated sources on every head, including bot and queue heads.
          # Download stubs even on cache hits so the runfiles check sees them.
          bazel build --config=ci --remote_download_outputs=toplevel \
            //projects/embervm/proto/embervm/node/v1:node_go_src \
            //projects/embervm/proto/embervm/node/v1:nodev1
          bazel test --config=ci //bazel/helm/gazelle:gazelle_test
          bazel run //projects/embervm/proto/embervm/node/v1:check_go_stubs --config=ci

          # STPA freshness remains advisory, including checker errors.
          stpa_freshness_rc=0
          python3 ./bazel/tools/format/check_stpa_freshness.py || stpa_freshness_rc=$?
          case "$stpa_freshness_rc" in
            0) ;;
            1) echo "STPA FRESHNESS: advisory review nudge only; this check does not block merges" ;;
            *) echo "STPA FRESHNESS: informational result unavailable (exit $stpa_freshness_rc); this check does not block merges" ;;
          esac

          # ---- 6. pnpm frozen-lockfile validation -----------------------
          git fetch origin "${GIT_REPO_DEFAULT_BRANCH:-main}" --quiet
          if git diff --name-only \
            "origin/${GIT_REPO_DEFAULT_BRANCH:-main}" HEAD -- \
            .npmrc pnpm-lock.yaml pnpm-workspace.yaml package.json bazel/patches/ \
            ':(glob)**/package.json' | grep -q .; then
            bazel run @pnpm//:pnpm --config=ci -- \
              --dir "$PWD" install --frozen-lockfile --ignore-scripts
          else
            echo "No pnpm inputs changed; skipping frozen-lockfile validation"
          fi

          # Browser evidence runs after Bazel, since pnpm materializes node_modules.
          if git diff --name-only "$base_ref" HEAD -- \
            projects/monolith/grimoire/ projects/monolith/frontend/ \
            projects/monolith/dev/grimoire/ bazel/requirements/ pnpm-lock.yaml \
            buildbuddy.yaml | grep -q .; then
            projects/monolith/dev/grimoire/ci-runner.sh
          fi

          echo "DISK pr-checks end:"; df -h /
          workspace_breakdown "pr-checks end"

  # Separate publish-action history is recorded in bazel/ARCHITECTURE.md#ci-runner-history.
