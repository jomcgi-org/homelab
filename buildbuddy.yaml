actions:
  # Format check - runs formatters, gazelle, and the doc-index manifests,
  # auto-commits fixes on PR branches. Runs in parallel with Test and Push images
  - name: "Format check"
    container_image: "ubuntu-24.04"
    max_retries: 2
    resource_requests:
      memory: "8GB"
      disk: "20GB"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
        merge_with_base: false
    steps:
      - run: |
          # Skip automated commits to avoid loops
          AUTHOR="$(git log -1 --format='%an')"
          if [ "$AUTHOR" = "ci-format-bot" ]; then
            echo "Skipping automated commit from $AUTHOR"
            exit 0
          fi

          # Run all formatters, generators, and gazelle in a single Bazel invocation.
          # The :run_generators command runs every doc/config generator (incl. the
          # KG-ingest + public-docs manifests), so any drift is picked up by the
          # auto-commit below instead of hard-failing. Same list local pre-commit
          # runs via fast-format.sh (single source of truth: run-generators.sh).
          bazel run //bazel/tools/format:format --config=ci

          # Validate grep-based generate scripts against bazel query
          ./bazel/images/validate-generate-scripts.sh

          # Enforce linear, non-duplicated Atlas migration versions. A duplicate
          # version or a migration added below the current head wedges the WHOLE
          # migration pipeline at apply time; atlas migrate validate does not
          # catch either, so guard it here (origin/main is fetched in CI).
          ./bazel/tools/format/check-migration-ordering.sh

          # Reject non-ASCII characters in commit messages.
          # Wrangler Pages (Cloudflare) fails with error 8000111 when commits
          # in the deployed branch contain non-ASCII characters (smart quotes,
          # em-dashes, arrows, etc.). Check all commits since origin/main.
          ./bazel/tools/git/check-commit-msg-ascii.sh --all origin/main

          # Hook scripts referenced from .claude/settings.json must exist and be
          # executable; a 644 script exits 126 in sessions and enforces nothing.
          ./bazel/tools/hooks/validate-hooks-executable.sh

          # The root README's structural claims must stay real: no links to
          # deleted projects, no new top-level projects/* dir left unmentioned.
          # Runs on the full checkout (a sandboxed bazel test cannot list
          # projects/* on RBE); the pure logic is pinned by a bazel test.
          python3 ./bazel/tools/format/readme_structure/check_readme_structure.py

          # Check for formatting changes
          if git diff --exit-code; then
            echo "All files formatted correctly"
            exit 0
          fi

          # On main, fail — formatting must be correct before merge
          current_branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          if [ "$current_branch" = "main" ]; then
            echo "ERROR: Code not formatted or BUILD files out of sync."
            echo "Run 'format' locally to fix."
            git --no-pager diff
            exit 1
          fi

          # On PR branches, auto-commit formatting fixes
          echo "Auto-committing formatting fixes..."
          git config user.name "ci-format-bot"
          git config user.email "ci-format-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/jomcgi/homelab.git"
          git add -u
          git commit -m "style: auto-format"
          git push origin HEAD:"$current_branch"
          echo "Formatting fixes pushed to $current_branch"

  # Test — runs in parallel with Push images (no dependency between them).
  # Format check, Test, and Push images are all REQUIRED status checks in the
  # GitHub ruleset (strict: the branch must be up to date with main), so a red
  # Push images blocks merge; it carries the pre-merge missed-chart-bump guard.
  - name: "Test"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      cpu: "6"
      memory: "10GB"
      disk: "120GB"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
        merge_with_base: false
    steps:
      - run: |
          # Authenticate Docker Hub so rules_oci base-image manifest fetches
          # (ubuntu, osgeo/gdal, python_base, ...) are not subject to the
          # anonymous ~100-pull/6h quota, which 429s and aborts the build.
          # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN set in BuildBuddy Settings → Secrets.
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          # -future excludes future-feature BDD specs (executable specs for
          # not-yet-built features): those are intentionally red and must not
          # gate merges. The non-required "BDD future features" action runs them.
          bazel test //... --config=ci --deleted_packages=bazel/tools/python --test_tag_filters=-external,-future

          # OCaml multi-arch shard (ADR 006/008): the example/test ladder again,
          # targeting linux/arm64. Toolchain resolution routes ocaml actions to
          # the BuildBuddy cloud arm64 pool (the platform carries Arch: arm64);
          # the sysroot builds from source on that pool, no cross-compilation.
          # Test actions run there too (Bazel selects a test execution platform
          # matching the target platform's constraints). cc_library-dependent
          # examples are tagged no-arm64 until a C++ toolchain targeting
          # aarch64 exists.
          #
          # TEMPORARILY DISABLED 2026-06-16: BuildBuddy's cloud arm64 pool is
          # mis-routing Arch: arm64 actions onto x86_64 executors (the driver's
          # arch guard fails loudly: "sysroot was built on aarch64 but this
          # action is executing on x86_64"). Confirmed environmental, not a code
          # regression: main was green on this same shard at ~03:21 UTC, then the
          # pool degraded ~04:36 UTC, failing on rotating innocent targets (hmap,
          # fmt, atd). Re-enable once the pool routes correctly again (the
          # //bazel/ocaml/platforms:executor_arch_probe_arm64 probe is the gate).
          # bazel test //bazel/ocaml/... --config=ci \
          #   --platforms=//bazel/ocaml/platforms:linux_aarch64 \
          #   --build_tests_only \
          #   --test_tag_filters=-external,-no-arm64

  # BDD future features — runs the `future`-tagged BDD specs: executable specs
  # for features that are designed but not built yet (step 3 of the /ship
  # lifecycle, "merge failing BDD tests"). This action is INFORMATIONAL and must
  # NOT be listed as a required status check in GitHub branch protection, so a
  # red run never blocks merge. Semantics:
  #   - red   = specs failing -> feature is mid-build (the expected state).
  #   - green = every future spec passes -> the feature is done: drop
  #             `future = True` from the bdd_test target to promote the spec
  #             back into the gating "Test" action.
  # With no future-tagged specs in the tree, this no-ops green.
  - name: "BDD future features"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      cpu: "6"
      memory: "10GB"
      disk: "120GB"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
        merge_with_base: false
    steps:
      - run: |
          # Cheap pre-check: the bazel query below loads the whole graph, and
          # that load is the entire cost of this action in its normal state (no
          # future-tagged specs exist). `future = True` on a bdd_test appends
          # the `future` tag (projects/monolith/bdd_test.bzl), and a raw
          # tags = ["future"] on any test rule would too, so match either to
          # stay a superset of what the query selects.
          #
          # Deliberately no `set -e` here: this action is designed around an
          # expected non-zero exit (a red future spec is the normal signal), and
          # it is informational, never a required check. That is also why a grep
          # proxy is acceptable here when it would not be for a gating action.
          if ! git grep -qE '(^[[:space:]]*future[[:space:]]*=[[:space:]]*True|"future")' -- '*BUILD' '*BUILD.bazel'; then
            echo "No future-tagged specs; skipping BDD future features."
            exit 0
          fi

          # grep '^//' keeps only real target labels. The bb CLI interleaves its
          # own operational log lines (connection warnings, a capabilities JSON
          # blob) into stdout, which transient proxy resets make frequent; without
          # this filter that noise lands in $TARGETS and `bazel test` then chokes
          # on log text as target names ("invalid target name"), failing the step
          # for a network blip rather than a real spec result.
          TARGETS="$(bazel query 'attr(tags, "\bfuture\b", tests(//...))' 2>/dev/null | grep '^//' || true)"
          if [ -z "$TARGETS" ]; then
            echo "No future-feature BDD specs (nothing tagged 'future'). Nothing to run."
            exit 0
          fi
          echo "Future-feature BDD specs:"
          echo "$TARGETS"
          # Unquoted on purpose: $TARGETS is a newline/space-separated label list.
          # A non-zero exit here is the expected red-while-building signal and is
          # non-blocking (this is not a required check).
          bazel test $TARGETS --config=ci --deleted_packages=bazel/tools/python

  # Push images — runs in parallel with Test (no dependency).
  # Images are pushed on main only. PR branches build them (verifying the build
  # before merge) and push only the charts; see the step below for why.
  # REQUIRED status check: on PR branches each helm push runs the pre-merge
  # missed-chart-bump guard (bazel/helm/check-missed-bump.sh), so a chart whose
  # images changed without a version bump cannot merge. Do NOT rename this
  # action: it is a required check in the GitHub ruleset by this exact name.
  - name: "Push images"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      cpu: "6"
      memory: "10GB"
      disk: "120GB"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
        merge_with_base: false
    steps:
      - run: |
          # GHCR_TOKEN set in BuildBuddy Settings → Secrets
          echo "$GHCR_TOKEN" | docker login ghcr.io -u jomcgi --password-stdin

          # Authenticate Docker Hub too: rules_oci base-image fetches (ubuntu,
          # osgeo/gdal, python_base, ...) hit the anonymous ~100-pull/6h quota
          # and 429 without this. DOCKERHUB_USERNAME / DOCKERHUB_TOKEN set in
          # BuildBuddy Settings → Secrets.
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          # "Am I main?" is decided by SHA, not by `git rev-parse --abbrev-ref
          # HEAD`, which returns "HEAD" on a detached checkout (same reasoning
          # as the Buck2 rules action). If origin/main is unresolvable the
          # comparison fails to "none", which takes the PR path: that publishes
          # nothing, so an unresolvable ref can never push a half-known tree.
          git fetch origin main --quiet 2>/dev/null || true
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main 2>/dev/null || echo none)" ]; then
            bazel run //bazel/images:push_all --config=ci --stamp
          else
            # PR branches publish nothing: push.sh.tpl takes the PR path for
            # charts, and PR image tags had no consumer (charts deploy by
            # repository@digest, and the `dev-` tag's documented consumer,
            # ArgoCD Image Updater, does not exist in this cluster).
            #
            # `bazel run` stages every command's runfiles on the runner before
            # any command runs, so push_all pulled all ~24 images' layers out of
            # CAS on every PR push even at a ~99% action-cache hit rate. That was
            # 3.5 TB/week, 29% of this repo's entire BuildBuddy download volume.
            # `bazel build` proves the same graph builds while
            # --remote_download_minimal leaves the layers at rest in CAS.
            bazel build //bazel/images:push_all --config=ci

            # Charts only, which is what carries the pre-merge
            # missed-chart-bump guard (bazel/helm/check-missed-bump.sh). The
            # guard is digest-content based, so it does not need the images to
            # have been pushed, only built.
            bazel run //bazel/images:push_charts --config=ci --stamp
          fi

  # Manifest diff — renders Helm manifests from main and PR, posts diff as PR comment
  # Runs in parallel with other actions (no depends_on). Mostly informational,
  # but hard-fails on newly introduced duplicate env var names within a
  # container (the phantom-OutOfSync class: the API server collapses
  # duplicates on apply, so the ArgoCD diff never converges).
  - name: "Manifest diff"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      disk: "20GB"
    triggers:
      pull_request:
        branches:
          - "*"
        merge_with_base: false
    steps:
      - run: ./bazel/helm/ci-diff-manifests.sh

  # Visual regression - screenshots public pages against committed mock data and
  # diffs the PR render vs the `origin/main` render (no committed baselines, no
  # sentinel). Posts inline before/after/diff to the PR for the pages this PR
  # changes. The capture is a hermetic, cached bazel action (chromium runs on RBE
  # inside the ci/visual-chromium exec image); the runner only orchestrates and
  # posts the comment. Informational (no depends_on), like Manifest diff.
  - name: "Visual regression"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      cpu: "4"
      memory: "8GB"
      disk: "20GB"
    triggers:
      pull_request:
        branches:
          - "*"
        merge_with_base: false
    steps:
      # POSIX sh-safe (no `pipefail` - the runner shell may be dash, see Buck2
      # rules). apt is run with sudo only when not already root. bazel builds are
      # not piped through `tail`, so a build failure propagates under `set -e`.
      - run: |
          set -eu
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"

          # jq (report-to-pr.sh), curl, tar (gh + nodesource installers) are not
          # in the minimal runner image.
          if ! command -v jq >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
            $SUDO apt-get update && $SUDO apt-get install -y jq curl ca-certificates gnupg tar
          fi

          # gh: install the pinned release binary directly. We deliberately do
          # NOT use @multitool//tools/gh + `find ... | head -1` (the idiom in
          # ci-diff-manifests.sh) because that find picks the first of multitool's
          # several staged per-arch binaries and can hand back a wrong-arch gh
          # that dies with "cannot execute binary file: Exec format error" (the
          # exact bug that silently breaks the Manifest diff PR comment). dpkg's
          # architecture (amd64/arm64) matches gh's release asset suffix.
          if ! command -v gh >/dev/null 2>&1; then
            GH_VER="2.62.0"
            GH_ARCH="$(dpkg --print-architecture)"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_${GH_ARCH}.tar.gz" | $SUDO tar -xz -C /usr/local --strip-components=1
          fi

          # The capture is a cached bazel action: it boots :build_public + the mock
          # seam and screenshots the pages with chromium INSIDE the ci/visual-chromium
          # exec image (browser vendored via rules_playwright), so no system node /
          # npm / npx / playwright-install on the runner.
          #   --config=ci: the mixed-arch workflow pool shares ~/.cache; build:ci
          #     disables the disk cache (build:ci --disk_cache=), so a build never
          #     pulls a wrong-arch binary.
          #   --remote_download_outputs=all: the out/ tree is consumed below OUTSIDE
          #     bazel (staged + read by gh/jq), so force it onto disk even on a
          #     remote action-cache hit.
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          VDIR="$REPO_ROOT/projects/monolith/frontend/visual"
          BB="$REPO_ROOT/bazel-bin/projects/monolith/frontend/visual"

          # Capture state needed after the in-place ref-switch below: the branch name
          # (abbrev-ref returns "HEAD" once detached) and the PR head SHA.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          ORIG_SHA="$(git rev-parse HEAD)"

          # Branch-vs-main render gate. The rendered pixels are a pure function of the
          # frontend subtree + the shared CSS tokens + the workspace dep lock + the
          # bazel module pins; everything else (notably the Python backend, which is
          # mocked out via the API_BASE fixtures) cannot change a pixel. If none of
          # these differ from main, the two renders are identical by construction, so
          # skip both captures and report no changes. This list MUST stay a SUPERSET
          # of :capture's real inputs: too broad only costs a redundant (cache-hit)
          # build, too narrow silently misses a real regression.
          git fetch origin main --quiet 2>/dev/null || true
          RENDER_PATHS="projects/monolith/frontend pnpm-lock.yaml pnpm-workspace.yaml package.json MODULE.bazel MODULE.bazel.lock"

          rm -rf "$VDIR/out" && mkdir -p "$VDIR/out/baseline"
          if git diff --quiet origin/main "$ORIG_SHA" -- $RENDER_PATHS; then
            echo "No render-relevant changes vs origin/main; reporting no visual changes."
            printf '{"changed":[],"added":[],"unchanged":0}\n' > "$VDIR/out/report.json"
          else
            # PR render (after).
            bazel build //projects/monolith/frontend/visual:capture --config=ci --remote_download_outputs=all
            cp -rL "$BB/out/." "$VDIR/out/"

            # Main render (before). The in-place checkout reuses the WARM bazel
            # output_base: `git checkout` only rewrites the files that differ between
            # the PR and main, so unchanged capture inputs are not re-analyzed (unlike
            # a fresh worktree, which re-runs loading/analysis and re-fetches external
            # repos from a cold output_base). The capture action is keyed on input
            # content, so main's render is a remote-cache download whenever main's
            # frontend is unchanged.
            git checkout --quiet --detach origin/main
            bazel build //projects/monolith/frontend/visual:capture --config=ci --remote_download_outputs=all
            cp -L "$BB/out/"*.png "$VDIR/out/baseline/"
            # Restore the exact PR commit (not "$BRANCH": abbrev-ref yields "HEAD"
            # in a detached checkout, which would strand the runner on main).
            git checkout --quiet "$ORIG_SHA"

            # Pixel-diff PR (out/) vs main (out/baseline/) -> out/report.json + out/diff/.
            # Hermetic js_binary (no system node on the runner). Absolute paths in,
            # so the launcher's cwd is irrelevant.
            CAPTURE_DIR="$VDIR/out" BASELINE_DIR="$VDIR/out/baseline" OUT_DIR="$VDIR/out" \
              bazel run //projects/monolith/frontend/visual:diff_bin --config=ci
          fi

          # Resolve the PR number from the branch (BuildBuddy does not set
          # BUILDBUDDY_PULL_REQUEST_NUMBER in this action env). `// empty` so a
          # closed/absent PR yields "" (not the string "null", which would pass the
          # script's [ -z ] guard then fail gh).
          export GH_TOKEN="${GHCR_TOKEN:-}"
          BUILDBUDDY_PULL_REQUEST_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          export BUILDBUDDY_PULL_REQUEST_NUMBER

          ./projects/monolith/frontend/visual/report-to-pr.sh

  # Buck2 rules — builds & tests the Buck2 image/helm rules under buck2/**
  # (the Buck2 counterparts to bazel/helm + bazel/tools/oci; originally
  # consumed by the `loom` repo as an external cell, since decommissioned).
  # homelab is otherwise a Bazel repo, so this action self-installs the pinned
  # buck2 release and checks out the buck2 prelude submodule before building.
  # Local execution only (no buck2 RE yet).
  # Keep BUCK2_RELEASE aligned with buck2/README.md.
  - name: "Buck2 rules"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      cpu: "4"
      memory: "8GB"
      disk: "30GB"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
        merge_with_base: false
    steps:
      # POSIX sh-safe (no `pipefail` — the runner shell may be dash). apt is run
      # with sudo only when not already root, so it works regardless of how the
      # BuildBuddy runner is provisioned.
      - run: |
          set -eu
          # This action must always run on main, so a merge cannot land an
          # unverified Buck2 tree. On PR branches, the path list MUST stay a
          # SUPERSET of the real inputs: too broad only costs a redundant
          # (cache-hit) build, too narrow silently skips real work.
          #
          # "Am I main?" is decided by SHA, not by `git rev-parse --abbrev-ref
          # HEAD`. That returns "HEAD" on a detached checkout, and on main the
          # path diff against origin/main is empty by construction, so a branch
          # name test that degraded would silently skip this action on main
          # forever. A SHA comparison cannot degrade that way, and if
          # origin/main is unresolvable the diff errors non-zero and the action
          # runs, which is the safe direction.
          git fetch origin main --quiet 2>/dev/null || true
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main 2>/dev/null || echo none)" ] && \
             git diff --quiet origin/main HEAD -- buck2 prelude .buckconfig buildbuddy.yaml; then
            echo "No Buck2-relevant changes vs origin/main; skipping Buck2 rules."
            exit 0
          fi

          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"

          # zstd/curl to fetch+decompress the buck2 release (best-effort — the
          # runner already ships them). No C toolchain is needed on the runner:
          # build actions run on BuildBuddy RE (BUCK_PREFER_REMOTE below), where
          # the example Rust binary compiles/links against the RE container's
          # toolchain.
          (command -v zstd >/dev/null 2>&1 && command -v curl >/dev/null 2>&1) || \
            ($SUDO apt-get update -qq && $SUDO apt-get install -y -qq zstd curl) || true

          # Install the pinned buck2 release (x86_64 linux runner).
          BUCK2_RELEASE="2026-05-18"
          url="https://github.com/facebook/buck2/releases/download/${BUCK2_RELEASE}/buck2-x86_64-unknown-linux-gnu.zst"
          curl -fsSL "$url" -o /tmp/buck2.zst
          zstd -df /tmp/buck2.zst -o /tmp/buck2
          chmod +x /tmp/buck2

          # The buck2 prelude is a submodule excluded from the Bazel checkout.
          git submodule update --init --recursive prelude

          # Prefer RE for every action that can run remotely (so Rust links on the
          # RE container); apko genrules opt out (network) and run on the runner.
          export BUCK_PREFER_REMOTE=true
          # The BuildBuddy runner can reuse a VM snapshot carrying a stale buck2
          # daemon whose buck-out was reset between runs, which aborts the build
          # with "Failed to stat buck-out/v2: ENOENT". Kill any leftover daemon so
          # we always start fresh.
          /tmp/buck2 killall 2>/dev/null || true
          /tmp/buck2 --version
          /tmp/buck2 build //buck2/...
          /tmp/buck2 test  //buck2/...
