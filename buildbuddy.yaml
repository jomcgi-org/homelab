actions:
  # pr-checks — the ONLY gating action on a PR. Formatting, tests, image builds
  # and the pre-merge missed-chart-bump guard all run on ONE runner.
  #
  # Why one action and not four: 99% of this repo's CI_RUNNER download is cold
  # starts, a VM snapshot restored out of the cache at spin-up. Cold rate tracks
  # workspace size, not run count: "Format check", "Test" and "Push images" each
  # ran ~747 times in the 7 days to 2026-08-09 with cold rates of 20%, 56% and
  # 62%, because each kept its OWN bazel output_base warm and the big ones are
  # likelier to be evicted AND dearer to restore. One shared workspace is
  # touched every time instead of a third of the time.
  #
  # REQUIRED status check. Renaming it breaks the GitHub ruleset, which matches
  # by exact name; change both together or every PR blocks.
  - name: "pr-checks"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      cpu: "6"
      memory: "10GB"
      disk: "120GB"
    triggers:
      pull_request:
        branches:
          - "*"
        merge_with_base: false
      # Merge queue. GitHub pushes each queued candidate to a temporary
      # gh-readonly-queue/<base>/pr-<n>-<sha> branch and waits for the REQUIRED
      # checks to report on it. Those arrive as PUSH events, not pull_request
      # ones, so without this trigger the queue would wait forever on a check
      # that never runs, which blocks every merge in the repo. A BuildBuddy
      # branch pattern's `*` matches across `/`, so one entry covers every base.
      #
      # Scoped to the queue prefix deliberately: a bare "*" here would run
      # pr-checks on every push to every feature branch, on top of the
      # pull_request run, which is the opposite of why the queue is being
      # enabled.
      push:
        branches:
          - "gh-readonly-queue/*"
    steps:
      - run: |
          # errexit is LOAD-BEARING. A BuildBuddy step is one shell script and
          # the action's status is the LAST command's, so without -e a failing
          # `bazel test` followed by a passing image build reports GREEN. That
          # was structurally impossible while these were separate actions.
          # -u catches a typo'd variable rather than expanding it to empty and
          # silently skipping a guard, so optional secrets use ${VAR:-}.
          set -eu

          echo "$GHCR_TOKEN" | docker login ghcr.io -u jomcgi --password-stdin

          # Authenticate Docker Hub so rules_oci base-image manifest fetches
          # (ubuntu, osgeo/gdal, python_base, ...) are not subject to the
          # anonymous ~100-pull/6h quota, which 429s and aborts the build.
          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "${DOCKERHUB_USERNAME:-}" --password-stdin
          fi

          # ORDER IS LOAD-BEARING: everything that analyses //... runs BEFORE the
          # format stage. `:format` runs gazelle, which generates BUILD files for
          # packages that have none committed, and some of them do not analyse
          # (projects/mcp/context-forge-gateway/deploy/BUILD gets a dep on
          # //projects/mcp/context-forge-gateway/chart:chart, visible only to
          # //overlays). Those files are UNTRACKED, so `git diff` still reports a
          # clean tree and `git add -u` never commits them. While Format check and
          # Test were separate actions that damage died with the Format check
          # runner; in one runner it would poison the very next bazel test //....
          # ---- 1. tests ---------------------------------------------------
          # -future excludes future-feature BDD specs (executable specs for
          # not-yet-built features): those are intentionally red.
          bazel test //... --config=ci --deleted_packages=bazel/tools/python --test_tag_filters=-external,-future

          # ---- 2. images build, and the missed-chart-bump guard -----------
          # PR branches publish nothing. `bazel build` proves the images build
          # while --remote_download_minimal leaves the layers at rest in CAS;
          # `bazel run` would stage all ~24 images' runfiles on the runner
          # before any command executes, which was 3.5 TB/week (PR #4586).
          bazel build //bazel/images:push_all --config=ci

          # Charts only. Off main push.sh.tpl publishes nothing, so this exists
          # to run bazel/helm/check-missed-bump.sh, the pre-merge guard that
          # stops a chart whose images changed from merging un-bumped.
          bazel run //bazel/images:push_charts --config=ci --stamp

          # ---- 3. rendered-manifest diff PR comment -----------------------
          # Hard-fails on newly introduced duplicate env var names within a
          # container (the phantom-OutOfSync class: the API server collapses
          # duplicates on apply, so the ArgoCD diff never converges).
          ./bazel/helm/ci-diff-manifests.sh

          # ---- 4. format, generators, drift auto-commit -------------------
          # The ci-format-bot guard skips THIS STAGE ONLY, never the run. The
          # old standalone action could `exit 0` here because that ended only
          # the format check; doing the same now would skip the tests, and the
          # bot's commit is frequently the head that ends up merged.
          AUTHOR="$(git log -1 --format='%an')"
          if [ "$AUTHOR" = "ci-format-bot" ]; then
            echo "HEAD is the ci-format-bot commit; formatting just ran, going straight to tests."
          else
            # :run_generators runs every doc/config generator (incl. the
            # KG-ingest + public-docs manifests), so drift is auto-committed
            # below rather than hard-failing. Single source of truth for the
            # list: run-generators.sh, which local pre-commit also uses.
            bazel run //bazel/tools/format:format --config=ci

            # Validate grep-based generate scripts against bazel query
            ./bazel/images/validate-generate-scripts.sh

            # Enforce linear, non-duplicated Atlas migration versions. A
            # duplicate version or a migration added below the current head
            # wedges the WHOLE migration pipeline at apply time; atlas migrate
            # validate does not catch either.
            ./bazel/tools/format/check-migration-ordering.sh

            # Wrangler Pages (Cloudflare) fails with error 8000111 when commits
            # in the deployed branch contain non-ASCII characters.
            ./bazel/tools/git/check-commit-msg-ascii.sh --all origin/main

            # Hook scripts referenced from .claude/settings.json must exist and
            # be executable; a 644 script exits 126 in sessions, enforcing
            # nothing.
            ./bazel/tools/hooks/validate-hooks-executable.sh

            # The root README's structural claims must stay real. Runs on the
            # full checkout (a sandboxed bazel test cannot list projects/* on
            # RBE); the pure logic is pinned by a bazel test.
            python3 ./bazel/tools/format/readme_structure/check_readme_structure.py

            if git diff --exit-code; then
              echo "All files formatted correctly"
            else
              # Auto-commit the drift. The push makes a new head, which runs a
              # fresh pr-checks; this one is finished either way.
              echo "Auto-committing formatting fixes..."
              current_branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
              git config user.name "ci-format-bot"
              git config user.email "ci-format-bot@users.noreply.github.com"
              git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/jomcgi/homelab.git"
              git add -u
              git commit -m "style: auto-format"
              git push origin HEAD:"$current_branch"
              echo "Pushed to $current_branch; the new head runs the full pipeline."
            fi
          fi

  # deploy — main only. Same one-runner reasoning as pr-checks.
  #
  # Ordering is deliberate: formatting, then tests, then publish. Tests GATE the
  # push, which is a behaviour change. Previously "Test" and "Push images" ran
  # in parallel on main, so a red or flaky test did not stop a deploy. Shipping
  # code whose tests failed is the worse failure mode, so a flake here should be
  # handled by re-running the action, not by making the result advisory.
  - name: "deploy"
    container_image: "ubuntu-24.04"
    max_retries: 1
    resource_requests:
      cpu: "6"
      memory: "10GB"
      disk: "120GB"
    triggers:
      push:
        branches:
          - "main"
    steps:
      - run: |
          # See pr-checks: errexit is load-bearing, and here it is what stops a
          # failed test from publishing images anyway.
          set -eu

          echo "$GHCR_TOKEN" | docker login ghcr.io -u jomcgi --password-stdin

          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "${DOCKERHUB_USERNAME:-}" --password-stdin
          fi

          # Same ordering rule as pr-checks: bazel test //... runs BEFORE the
          # format stage, because gazelle inside :format writes untracked BUILD
          # files that do not all analyse. The format check still gates the
          # publish below, which is the only ordering constraint that matters
          # here.
          # ---- 1. tests ---------------------------------------------------
          bazel test //... --config=ci --deleted_packages=bazel/tools/python --test_tag_filters=-external,-future

          # PUBLISH BEFORE THE FORMAT CHECK, deliberately. Under `set -e` a
          # formatter hiccup aborts everything after it, and on 2026-08-09 that
          # took main's first consolidated deploy down before it pushed
          # anything: a cold runner could not materialise prettier or rustfmt
          # ("entry_point '.../prettier.cjs' not found", "cannot locate binary
          # ...rustfmt"). Formatting is the flakiest stage here, because it
          # shells out to a pile of external tools, and it is the one with no
          # bearing on whether the images are correct.
          #
          # The old layout got this right by accident: "Format check" and
          # "Push images" were separate actions, so a formatter failure never
          # blocked a deploy. Publishing first restores that property while
          # keeping the check FATAL, so unformatted main still turns the action
          # red. Tests still gate the publish, which is deliberate: bad code
          # must not ship, whereas a missing formatter binary must not stop a
          # good build from shipping.
          # ---- 2. publish -------------------------------------------------
          # push.sh.tpl decides per chart whether to publish, and skips a
          # version already in the registry, so a re-run is idempotent.
          bazel run //bazel/images:push_all --config=ci --stamp

          # ---- 3. formatting must already be correct ----------------------
          # No auto-commit on main: fail with the fix instead.
          AUTHOR="$(git log -1 --format='%an')"
          if [ "$AUTHOR" = "ci-format-bot" ]; then
            echo "HEAD is the ci-format-bot commit; formatting just ran, going straight to tests."
          else
            bazel run //bazel/tools/format:format --config=ci
            ./bazel/images/validate-generate-scripts.sh
            ./bazel/tools/format/check-migration-ordering.sh
            # Near-vacuous on main (origin/main is at or behind HEAD, and a bad
            # message would have failed the PR), but kept so this change stays
            # purely structural rather than quietly dropping a guard.
            ./bazel/tools/git/check-commit-msg-ascii.sh --all origin/main
            ./bazel/tools/hooks/validate-hooks-executable.sh
            python3 ./bazel/tools/format/readme_structure/check_readme_structure.py

            if ! git diff --exit-code; then
              echo "ERROR: Code not formatted or BUILD files out of sync."
              echo "Run 'format' locally to fix."
              git --no-pager diff
              exit 1
            fi
          fi

  # TEMPORARILY DISABLED 2026-08-09: BuildBuddy asked us to cut Workflows cache
  # traffic, and this action is pure runner cost. It normally no-ops (no
  # future-tagged specs exist, so it exits in ~1s), but it still paid a runner
  # spin-up on every PR push: 506 PR runs in the 7 days to 2026-08-09, 230.2 GB,
  # 16% of them cold at 1.9 GB each. An early-exit guard cannot help, because a
  # cold start is paid at spin-up, before the first step runs. It is not a
  # required status check, so nothing is blocked by its absence.
  #
  # Cost of the gap: a future-tagged spec that starts passing is not flagged
  # automatically, so promoting it back into the gating "Test" action (dropping
  # `future = True`) becomes a manual step. Re-enable by uncommenting.
  # # BDD future features — runs the `future`-tagged BDD specs: executable specs
  # # for features that are designed but not built yet (step 3 of the /ship
  # # lifecycle, "merge failing BDD tests"). This action is INFORMATIONAL and must
  # # NOT be listed as a required status check in GitHub branch protection, so a
  # # red run never blocks merge. Semantics:
  # #   - red   = specs failing -> feature is mid-build (the expected state).
  # #   - green = every future spec passes -> the feature is done: drop
  # #             `future = True` from the bdd_test target to promote the spec
  # #             back into the gating "Test" action.
  # # With no future-tagged specs in the tree, this no-ops green.
  # - name: "BDD future features"
  #   container_image: "ubuntu-24.04"
  #   max_retries: 1
  #   resource_requests:
  #     cpu: "6"
  #     memory: "10GB"
  #     disk: "120GB"
  #   triggers:
  #     push:
  #       branches:
  #         - "main"
  #     pull_request:
  #       branches:
  #         - "*"
  #       merge_with_base: false
  #   steps:
  #     - run: |
  #         # Cheap pre-check: the bazel query below loads the whole graph, and
  #         # that load is the entire cost of this action in its normal state (no
  #         # future-tagged specs exist). `future = True` on a bdd_test appends
  #         # the `future` tag (projects/monolith/bdd_test.bzl), and a raw
  #         # tags = ["future"] on any test rule would too, so match either to
  #         # stay a superset of what the query selects.
  #         #
  #         # Deliberately no `set -e` here: this action is designed around an
  #         # expected non-zero exit (a red future spec is the normal signal), and
  #         # it is informational, never a required check. That is also why a grep
  #         # proxy is acceptable here when it would not be for a gating action.
  #         if ! git grep -qE '(^[[:space:]]*future[[:space:]]*=[[:space:]]*True|"future")' -- '*BUILD' '*BUILD.bazel'; then
  #           echo "No future-tagged specs; skipping BDD future features."
  #           exit 0
  #         fi
  #
  #         # grep '^//' keeps only real target labels. The bb CLI interleaves its
  #         # own operational log lines (connection warnings, a capabilities JSON
  #         # blob) into stdout, which transient proxy resets make frequent; without
  #         # this filter that noise lands in $TARGETS and `bazel test` then chokes
  #         # on log text as target names ("invalid target name"), failing the step
  #         # for a network blip rather than a real spec result.
  #         TARGETS="$(bazel query 'attr(tags, "\bfuture\b", tests(//...))' 2>/dev/null | grep '^//' || true)"
  #         if [ -z "$TARGETS" ]; then
  #           echo "No future-feature BDD specs (nothing tagged 'future'). Nothing to run."
  #           exit 0
  #         fi
  #         echo "Future-feature BDD specs:"
  #         echo "$TARGETS"
  #         # Unquoted on purpose: $TARGETS is a newline/space-separated label list.
  #         # A non-zero exit here is the expected red-while-building signal and is
  #         # non-blocking (this is not a required check).
  #         bazel test $TARGETS --config=ci --deleted_packages=bazel/tools/python


  # Push images — runs in parallel with Test (no dependency).
  # Images are pushed on main only. PR branches build them (verifying the build
  # before merge) and push only the charts; see the step below for why.
  # REQUIRED status check: on PR branches each helm push runs the pre-merge
  # missed-chart-bump guard (bazel/helm/check-missed-bump.sh), so a chart whose
  # images changed without a version bump cannot merge. Do NOT rename this
  # action: it is a required check in the GitHub ruleset by this exact name.

  # TEMPORARILY DISABLED 2026-08-09: same reason as "BDD future features". This
  # action already early-exits on PRs when nothing under buck2/** changed, but
  # the runner spin-up is paid regardless: 506 PR runs in the 7 days to
  # 2026-08-09, 327.5 GB, 30% of them cold at 1.6 GB each. Not a required check.
  #
  # Cost of the gap: buck2/** is unverified while this is off. That is the
  # cheapest coverage in the repo to lose, because the Buck2 rules exist as
  # counterparts to bazel/helm + bazel/tools/oci for the `loom` repo, which is
  # decommissioned. Re-enable by uncommenting if buck2/** is worked on again.
  # # Buck2 rules — builds & tests the Buck2 image/helm rules under buck2/**
  # # (the Buck2 counterparts to bazel/helm + bazel/tools/oci; originally
  # # consumed by the `loom` repo as an external cell, since decommissioned).
  # # homelab is otherwise a Bazel repo, so this action self-installs the pinned
  # # buck2 release and checks out the buck2 prelude submodule before building.
  # # Local execution only (no buck2 RE yet).
  # # Keep BUCK2_RELEASE aligned with buck2/README.md.
  # - name: "Buck2 rules"
  #   container_image: "ubuntu-24.04"
  #   max_retries: 1
  #   resource_requests:
  #     cpu: "4"
  #     memory: "8GB"
  #     disk: "30GB"
  #   triggers:
  #     push:
  #       branches:
  #         - "main"
  #     pull_request:
  #       branches:
  #         - "*"
  #       merge_with_base: false
  #   steps:
  #     # POSIX sh-safe (no `pipefail` — the runner shell may be dash). apt is run
  #     # with sudo only when not already root, so it works regardless of how the
  #     # BuildBuddy runner is provisioned.
  #     - run: |
  #         set -eu
  #         # This action must always run on main, so a merge cannot land an
  #         # unverified Buck2 tree. On PR branches, the path list MUST stay a
  #         # SUPERSET of the real inputs: too broad only costs a redundant
  #         # (cache-hit) build, too narrow silently skips real work.
  #         #
  #         # "Am I main?" is decided by SHA, not by `git rev-parse --abbrev-ref
  #         # HEAD`. That returns "HEAD" on a detached checkout, and on main the
  #         # path diff against origin/main is empty by construction, so a branch
  #         # name test that degraded would silently skip this action on main
  #         # forever. A SHA comparison cannot degrade that way, and if
  #         # origin/main is unresolvable the diff errors non-zero and the action
  #         # runs, which is the safe direction.
  #         git fetch origin main --quiet 2>/dev/null || true
  #         if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main 2>/dev/null || echo none)" ] && \
  #            git diff --quiet origin/main HEAD -- buck2 prelude .buckconfig buildbuddy.yaml; then
  #           echo "No Buck2-relevant changes vs origin/main; skipping Buck2 rules."
  #           exit 0
  #         fi
  #
  #         SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
  #
  #         # zstd/curl to fetch+decompress the buck2 release (best-effort — the
  #         # runner already ships them). No C toolchain is needed on the runner:
  #         # build actions run on BuildBuddy RE (BUCK_PREFER_REMOTE below), where
  #         # the example Rust binary compiles/links against the RE container's
  #         # toolchain.
  #         (command -v zstd >/dev/null 2>&1 && command -v curl >/dev/null 2>&1) || \
  #           ($SUDO apt-get update -qq && $SUDO apt-get install -y -qq zstd curl) || true
  #
  #         # Install the pinned buck2 release (x86_64 linux runner).
  #         BUCK2_RELEASE="2026-05-18"
  #         url="https://github.com/facebook/buck2/releases/download/${BUCK2_RELEASE}/buck2-x86_64-unknown-linux-gnu.zst"
  #         curl -fsSL "$url" -o /tmp/buck2.zst
  #         zstd -df /tmp/buck2.zst -o /tmp/buck2
  #         chmod +x /tmp/buck2
  #
  #         # The buck2 prelude is a submodule excluded from the Bazel checkout.
  #         git submodule update --init --recursive prelude
  #
  #         # Prefer RE for every action that can run remotely (so Rust links on the
  #         # RE container); apko genrules opt out (network) and run on the runner.
  #         export BUCK_PREFER_REMOTE=true
  #         # The BuildBuddy runner can reuse a VM snapshot carrying a stale buck2
  #         # daemon whose buck-out was reset between runs, which aborts the build
  #         # with "Failed to stat buck-out/v2: ENOENT". Kill any leftover daemon so
  #         # we always start fresh.
  #         /tmp/buck2 killall 2>/dev/null || true
  #         /tmp/buck2 --version
  #         /tmp/buck2 build //buck2/...
  #         /tmp/buck2 test  //buck2/...

